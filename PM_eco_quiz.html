 ratio with that of other ETFs in its asset class category."}, "ans": "B", "en": "B is correct. A rolling return assessment, referred to in the ETF industry as the “tracking difference,” provides a more informative picture of the investment outcome for an investor in an ETF. Such an analysis allows investors to see the cumulative effect of portfolio management and expenses over an extended period. It also allows for comparison with other annual metrics such as a fund’s expense ratio. Tracking error, as a statistic, reveals only ETF tracking variability; it does not reveal to investors whether the fund is over- or underperforming its index or whether that tracking error is concentrated over a few days or is more consistently experienced. An ETF’s expense ratio does not fully reflect the investor experience. That is, the expense ratio does not reflect the cost of portfolio rebalancing or other fees, making it an inferior assessment measure relative to a rolling return assessment.", "ko": "Rolling return 분석(tracking difference): 1년·3년 등 일정 기간 누적 수익률을 ETF와 벤치마크에서 비교 → 리밸런싱 비용과 기타 보수까지 반영되고, 방향(상회/하회)도 확인 가능하며, expense ratio와 직접 비교할 수 있음.", "trap": "비용 전부 + 방향 확인 = rolling holding period.", "f": "", "why": {"A": "일별 수익률 차이는 하루하루의 흔들림일 뿐이라 누적 효과를 보여주지 못합니다.", "C": "Expense ratio는 명시적 보수일 뿐, 리밸런싱 비용 같은 숨은 비용이 반영되지 않습니다."}, "orig": "ECO Module 3 Q12"}, {"id": "ECO-M3-Q13", "src": "ECO 오답", "module": 3, "tag": "Tracking error 정의", "vig": null, "stem": "An ETF’s tracking error, as traditionally reported, indicates to investors:", "opts": {"A": "whether the ETF is underperforming or outperforming its underlying index.", "B": "the magnitude by which an ETF’s returns deviate from its benchmark over time.", "C": "the distribution of differences in daily returns between the ETF and its benchmark."}, "ans": "B", "en": "B is correct. An ETF’s tracking error is typically reported as the annualized standard deviation of the daily differential returns of the ETF and its benchmark. Therefore, an ETF’s reported tracking error indicates to investors the magnitude by which an ETF’s returns deviate from those of its benchmark over time.", "ko": "Tracking error = ETF와 벤치마크의 일별 수익률 차이의 연환산 표준편차 → 수익률이 벤치마크에서 얼마나 벗어나는지(크기)만 보여줌.", "trap": "Tracking error = 크기(magnitude)만. 방향·분포는 모름.", "f": "TE = annualized σ(R_ETF,daily − R_Index,daily)", "why": {"A": "표준편차라서 상회인지 하회인지 방향은 알 수 없습니다.", "C": "차이의 분포(꾸준한지, 며칠에 몰렸는지)도 알 수 없습니다. 크기만 나타냅니다."}, "orig": "ECO Module 3 Q13"}, {"id": "ECO-M3-Q15", "src": "ECO 오답", "module": 3, "tag": "ETF vs 뮤추얼펀드 자본이득 분배", "vig": null, "stem": "Which of the following statements relating to capital gains in ETFs and mutual funds is correct?", "opts": {"A": "ETFs tend to distribute less in capital gains than mutual funds do.", "B": "Mutual funds may elect not to distribute all realized capital gains in a given year.", "C": "The selling of ETF shares by some investors may create capital gains that affect the remaining ETF investors in terms of taxes."}, "ans": "A", "en": "A is correct. ETFs tend to distribute far less in capital gains relative to mutual funds. This is mostly due to the fact that ETFs have historically had significantly lower turnover than mutual funds have had.", "ko": "ETF는 회전율이 낮고 현물(in-kind) 환매를 하기 때문에 뮤추얼펀드보다 자본이득 분배가 훨씬 적음.", "trap": "남은 투자자에게 세금이 넘어가는 것 = 뮤추얼펀드.", "f": "", "why": {"B": "뮤추얼펀드는 실현된 자본이득을 매년 분배해야 하며, 분배하지 않기로 선택할 수 없습니다.", "C": "ETF는 투자자가 팔아도 펀드가 종목을 팔지 않으므로 남은 투자자에게 세금 영향이 없습니다. 이것은 뮤추얼펀드의 특징입니다."}, "orig": "ECO Module 3 Q15"}, {"id": "ECO-M3-Q16", "src": "ECO 오답", "module": 3, "tag": "ETF 분배: ROC vs 배당", "vig": null, "stem": "Which of the following statements regarding distributions made by ETFs is correct?", "opts": {"A": "Return-of-capital (ROC) distributions are generally not taxable.", "B": "ETFs generally reinvest any dividends received back into the ETF’s holdings.", "C": "A dividend distribution is a distribution paid to investors in excess of an ETF’s earnings."}, "ans": "A", "en": "A is correct. Return-of-capital distributions are amounts paid out in excess of an ETF’s earnings and serve to reduce an investor’s cost basis by the amount of the distribution. These distributions are generally not taxable.", "ko": "ROC(return of capital) 분배 = ETF 이익을 초과한 분배 → 분배 시점에는 보통 비과세이고, 취득원가를 그만큼 낮춤(과세 이연).", "trap": "ROC = 이익 초과분, 비과세, cost basis ↓.", "f": "", "why": {"B": "ETF는 받은 배당을 보통 투자자에게 분배합니다. 재투자는 투자자가 증권사에서 선택하는 DRIP입니다.", "C": "이익을 '초과'한 분배는 ROC입니다. 배당 분배는 이익 범위 안에서 지급됩니다."}, "orig": "ECO Module 3 Q16"}, {"id": "ECO-M3-Q19", "src": "ECO 오답", "module": 3, "tag": "고유동성 ETF spread: 창설·환매 비용 영향 작음", "vig": null, "stem": "The bid–ask spread for very liquid, high-volume ETFs will be least influenced by the:", "opts": {"A": "market maker’s desired profit spread.", "B": "creation/redemption fees and other direct costs.", "C": "likelihood of receiving an offsetting ETF order in a short time frame."}, "ans": "B", "en": "B is correct. ETF bid–ask spreads are generally less than or equal to the combination of the following:\n• ± Creation/redemption fees and other direct costs, such as brokerage and exchange fees\n• + Bid–ask spread of the underlying securities held by the ETF\n• + Compensation for the risk of hedging or carrying positions by liquidity providers (market makers) for the remainder of the trading day\n• + Market maker’s desired profit spread\n• − Discount related to the likelihood of receiving an offsetting ETF order in a short time frame\nFor very liquid and high-volume ETFs, buyers and sellers are active throughout the trading day. Therefore, because most of these ETF trades are matched extremely quickly and never involve the creation/redemption process, the first three factors listed do not contribute heavily to their bid–ask spreads. So, creation/redemption fees and other direct costs are not likely to have much influence on these ETFs’ bid–ask spreads.", "ko": "유동성이 매우 높은 ETF는 거래소에서 매수·매도가 바로 맞춰져 창설·환매가 거의 필요 없음 → 창설·환매 수수료와 기타 직접비용이 spread에 미치는 영향이 가장 작음.", "trap": "거래가 활발하면 창설·환매 과정 자체가 생략됨.", "f": "Spread ≤ ±창설·환매 비용 + 기초자산 spread + 헤지 위험 보상 + 이익 spread − 반대 주문 할인", "why": {"A": "시장조성자가 원하는 이익 spread는 고유동성 ETF에도 spread의 구성요소로 남습니다.", "C": "반대 주문이 빨리 들어올 가능성은 고유동성 ETF에서 spread를 크게 낮추는 핵심 요인입니다."}, "orig": "ECO Module 3 Q19"}, {"id": "ECO-M3-Q21", "src": "ECO 오답", "module": 3, "tag": "Expectation-related risk", "vig": null, "stem": "John Smith has invested in an inverse ETF. Smith is a novice investor who is not familiar with inverse ETFs, and therefore, he is unsure how the ETF will perform because of a lack of understanding of the ETF’s risk and return characteristics. This risk is best described as:", "opts": {"A": "counterparty risk.", "B": "holdings-based risk.", "C": "expectation-related risk."}, "ans": "C", "en": "C is correct. Expectation-related risk is the risk that some ETF investors may not fully understand how more complex ETFs will perform because of a lack of understanding of sophisticated assets classes and strategies.", "ko": "Expectation-related risk = 복잡한 ETF(레버리지·인버스 등)가 어떻게 움직일지 투자자가 제대로 이해하지 못해 생기는 위험.", "trap": "투자자의 '이해 부족' → expectation-related.", "f": "", "why": {"A": "Counterparty risk는 발행사나 거래상대방의 부도 위험입니다(ETN, 스왑 기반 ETF 등).", "B": "Holdings-based risk는 ETF가 보유한 자산 자체에서 생기는 위험입니다."}, "orig": "ECO Module 3 Q21"}, {"id": "ECO-M3-Q24", "src": "ECO 오답", "module": 3, "tag": "ETF 활용: transition management", "vig": 12, "stem": "Based on Beaumont’s objectives in managing her fund, which application of ETFs is least likely applicable?", "opts": {"A": "Portfolio liquidity management", "B": "Portfolio completion strategies", "C": "Portfolio transition management"}, "ans": "C", "en": "Correct because transition management refers to the process of hiring and firing managers — or making changes to allocations with existing managers. In this application, the manager can add the desired exposure to a market segment with ETFs while shedding exposure to the market segment she has received in kind. Beaumont is experiencing inflows and outflows in her corporate bond fund. An efficient way to maintain the desired exposure is to buy and sell ETFs as flows occur. Using ETFs for portfolio completion can help fill in temporary gaps in exposure while she finds individual bonds to trade. The liquidity of ETFs relative to individual bonds allows Beaumont to quickly invest inflows or meet redemptions.\nA: Incorrect because portfolio liquidity management is easily achieved with the use of ETFs.\nB: Incorrect because Beaumont can use ETFs to invest the outflows or meet redemptions and keep her exposure to the market.", "ko": "Beaumont의 목적은 잦은 자금 유출입에도 노출을 유지하는 것 → liquidity management(유입 자금 즉시 투자·환매 대응)와 completion(개별 채권을 찾는 동안 노출 공백 메움)에는 맞음. Transition management는 매니저 교체·배분 변경 상황에 쓰는 것이라 가장 해당되지 않음.", "trap": "Transition = 매니저 교체 상황. 자금 유출입 관리는 liquidity/completion.", "f": "", "why": {"A": "ETF는 개별 채권보다 유동성이 높아 유입 자금을 바로 투자하고 환매에 대응하는 liquidity management에 적합합니다.", "B": "개별 채권을 매매하는 동안 생기는 노출 공백을 ETF로 메우는 completion 전략에 적합합니다."}, "orig": "ECO Module 3 Q24"}, {"id": "ECO-M3-Q25", "src": "ECO 오답", "module": 3, "tag": "ETF 참여자 역할", "vig": 12, "stem": "The roles of the parties involved in the mechanics of ETFs that Beaumont describes to Dupuis in her three statements, can most likely be described in order as those of the:", "opts": {"A": "ETF sponsor, market maker, and authorized participant.", "B": "market maker, authorized participant and ETF sponsor.", "C": "authorized participant, ETF sponsor, and market maker."}, "ans": "B", "en": "Correct because several parties are involved in the primary or creation or redemption and secondary trading of ETFs. If the trade is submitted through a broker in the secondary market, a market maker will execute the transaction. If ETF shares need to be created or redeemed because of demand or supply, the only group of investors permitted in this process is a special group of institutional investors called authorized participants. The ETF issuer or the sponsor transacts with the authorized participant receiving or providing in-kind securities in the settlement process.\nA: Incorrect because activities listed are conducted first by the market maker, second by the authorized participant, and third by the ETF sponsor.\nC: Incorrect because activities listed are conducted first by the market maker, second by the authorized participant, and third by the ETF sponsor.", "ko": "Statement 1(secondary market에서 매수·매도 매칭) = market maker. Statement 2(primary market 창설·환매로 차익 갭 축소) = AP. Statement 3(창설 시 결제 때 현물 바스켓을 받는 중개자) = ETF sponsor.", "trap": "Secondary = market maker, primary = AP, 현물 바스켓 수령·발행 = sponsor.", "f": "", "why": {"A": "첫 번째는 sponsor가 아니라 market maker입니다. sponsor는 AP로부터 현물 바스켓을 받는 역할입니다.", "C": "첫 번째는 AP가 아니라 market maker입니다. AP는 primary market의 창설·환매를 담당합니다."}, "orig": "ECO Module 3 Q25"}, {"id": "ECO-M3-Q27", "src": "ECO 오답", "module": 3, "tag": "ETF 유형별 위험 연결", "vig": 12, "stem": "Which type of ETF has Dupuis least likely associated correctly with the risks described in his executive summary in Exhibit 1?", "opts": {"A": "ETNs", "B": "Synthetic ETFs", "C": "Leveraged and inverse funds"}, "ans": "A", "en": "Correct because Dupuis has correctly identified a number of risks that investors face when investing in ETFs. Certain risk are more closely associated with specific types of ETFs. He correctly notes the risks associated with leveraged and inverse funds, which are intended to deliver their expected return relative to their exposure over very short periods. These are not intended to be buy-and-hold investments for periods generally longer than a month or even days in some cases without rebalancing of the position. He also correctly associates synthetic ETFs, such as swap-based funds that use OTC derivatives to gain exposure and are subject to both counterparty and settlement risk. Dupuis has incorrectly associated ETNs with settlement risk, which is the result of counterparty risk between settlement periods. ETNs do not hold underlying securities but rather are unsecured obligations of the institutions that issue them and therefore are subject to counterparty risk.\nB: Incorrect because Dupuis has correctly described the risks associated with synthetic ETFs.\nC: Incorrect because Dupuis has correctly described the risks associated with leveraged and inverse funds.", "ko": "ETN은 기초자산을 보유하지 않는 발행 은행의 무담보 채무 → 핵심 위험은 counterparty risk. Dupuis가 ETN을 OTC 파생상품 사용 펀드의 settlement risk와 연결한 것이 틀림. 스왑 기반 synthetic ETF(counterparty·settlement risk)와 레버리지·인버스 펀드(기간이 길면 기대 성과와 괴리) 설명은 맞음.", "trap": "ETN = 무담보 채무 → counterparty risk. Settlement risk는 OTC 파생상품 ETF.", "f": "", "why": {"B": "Synthetic(스왑 기반) ETF가 counterparty·settlement risk에 노출된다는 설명은 맞습니다.", "C": "레버리지·인버스 펀드는 단기용이라 장기 보유 시 기대 성과와 달라질 수 있다는 설명이 맞습니다."}, "orig": "ECO Module 3 Q27"}, {"id": "ECO-M3-Q30", "src": "ECO 오답", "module": 3, "tag": "ETF 활용: completion", "vig": 13, "stem": "Sorrill’s explanation of benchmark exposure most likely describes portfolio:", "opts": {"A": "rebalancing.", "B": "completion strategies.", "C": "liquidity management."}, "ans": "B", "en": "Correct. Sorrill’s explanation of benchmark exposure describes portfolio completion. ETFs can be used to fill a temporary gap in exposure to an asset class. Gaps may arise whenever an active manager transitions a portfolio away from a desired market exposure (for example, the portfolio’s benchmark). An investor may use a passive ETF to maintain the exposure while retaining the manager.\nA: Incorrect. Sorrill’s explanation describes completion strategies, not portfolio rebalancing. Portfolio rebalancing describes how ETFs are used by investors to remain fully invested according to target weights whenever changes in market values cause a portfolio’s segments to deviate from target weights.\nC: Incorrect. Sorrill’s explanation describes completion strategies, not portfolio liquidity management. Portfolio liquidity management describes how ETFs are used by investors to efficiently invest excess cash balances, which reduces a portfolio’s cash drag.", "ko": "Completion 전략 = 액티브 매니저가 관점을 반영하면서 생긴 노출 공백(예: 업종 비중 변화)을 패시브 ETF로 메워, 매니저를 교체하지 않고도 벤치마크 노출을 유지.", "trap": "'매니저 유지 + 노출 공백 메움' = completion.", "f": "", "why": {"A": "Rebalancing은 시장가치 변화로 목표 비중에서 벗어났을 때 다시 맞추는 것입니다.", "C": "Liquidity management는 초과 현금을 ETF에 투자해 cash drag를 줄이는 것입니다."}, "orig": "ECO Module 3 Q30"}, {"id": "ECO-M3-Q31", "src": "ECO 오답", "module": 3, "tag": "Smart beta ETF", "vig": 13, "stem": "Is Hart’s comments about active ETF strategies most likely correct?", "opts": {"A": "Yes", "B": "No, because of the comment about smart beta equity risk factors", "C": "No, because of the comment about smart beta fixed-income ETFs"}, "ans": "A", "en": "Correct. Hart’s comments about smart beta are correct. Factor (smart beta) ETFs are benchmarked to an index created with predefined rules for screening and weighting constituent holdings whose index rules are structured around return drivers, or factors, such as dividend yield, size, value, and momentum. Academic research has supported these factors as contributors to the equity risk premium. Hart’s comment about smart beta fixed-income ETFs is correct. Interest rate swaps are used by the managers of smart beta fixed-income ETFs to minimize interest rate risk, enabling the ETFs’ return to be generated by taking credit risk.\nB: Incorrect. Hart’s comment about smart beta equity risk factors is correct.\nC: Incorrect. Hart’s comment about smart beta fixed-income ETFs is correct.", "ko": "Hart의 두 설명 모두 맞음: ① Smart beta ETF는 배당수익률·size·value·모멘텀 같은 요인 규칙으로 만든 지수를 추종 → 지수를 추종하면서도 액티브 관점 표현 가능. ② Smart beta 채권 ETF는 금리스왑으로 듀레이션 위험을 헤지하고 신용위험으로 수익을 추구.", "trap": "Smart beta = 규칙 기반 지수 추종, 매니저 재량 아님.", "f": "", "why": {"B": "주식 smart beta 요인(배당수익률·size·value·모멘텀) 설명은 맞습니다.", "C": "채권 smart beta ETF가 듀레이션을 헤지하고 신용위험을 진다는 설명은 맞습니다."}, "orig": "ECO Module 3 Q31"}, {"id": "ECO-M3-Q35", "src": "ECO 오답", "module": 3, "tag": "ETF 주식 거래 특징", "vig": null, "stem": "Which of the following statements regarding ETF shares is correct?", "opts": {"A": "ETF shares come to market via an initial public offering of fixed size", "B": "Investors can purchase ETF shares in the secondary market from a market maker", "C": "US market makers are given up to three days to settle their accounts due to the time required to create or borrow ETF shares"}, "ans": "B", "en": "Correct because an investor purchases ETF shares in the secondary market from a market maker or other counterparty.\nA: Incorrect because ETF shares are created or redeemed in kind continuously, in a shares-for-shares swap. Stocks, on the other hand, come to market via an initial public offering of fixed size.\nC: Incorrect because US market makers receive special treatment on settlement requirements. Because of the time required to create or borrow ETF shares, market makers are given up to six (not three) days to settle their accounts.", "ko": "투자자는 secondary market에서 market maker 등 거래상대방으로부터 ETF 주식을 삼.", "trap": "숫자 함정: 미국 시장조성자 결제 기한 = 6일.", "f": "", "why": {"A": "ETF 주식은 고정 규모 IPO가 아니라 현물 교환으로 계속 창설·환매됩니다. 고정 규모 IPO는 일반 주식의 방식입니다.", "C": "미국 시장조성자는 ETF 주식을 창설하거나 빌리는 데 시간이 걸려 결제 기한을 3일이 아니라 최대 6일 받습니다."}, "orig": "ECO Module 3 Q35"}, {"id": "ECO-M3-Q38", "src": "ECO 오답", "module": 3, "tag": "Tactical ETF 선택: 거래량/자산 비율", "vig": null, "stem": "A fund manager uses an ETF to make a tactical adjustment to her existing portfolio, focusing on a specific area of technology. The manager has identified three ETFs as potential investments:\n\tETF 1\tETF 2\tETF 3\nETF type\tThematic\tBroad-based\tThematic\nRatio of average dollar trading volume to average assets\t3.5\t12.1\t7.5\nAnnual management fee (basis points)\t12\t10\t20\nWhich ETF would be most suitable for the tactical adjustment to the portfolio?", "opts": {"A": "ETF 1", "B": "ETF 2", "C": "ETF 3"}, "ans": "C", "en": "Correct because ETF 3 is a thematic ETF and has the highest ratio of average dollar volume to average assets. Thematic ETFs hold stocks passively but allow investors to take an active view on a market segment they believe will deliver strong returns. These ETFs typically cover a narrow or niche area of the market not well represented by an industry. Examples include focused areas of technology, such as cybersecurity and robotics. In addition, ETFs that have the highest trading volumes in their asset class category are generally preferred for tactical trading applications. Trading costs and liquidity, rather than management fees, are the important criteria in selecting an ETF for tactical adjustments. To identify the most commonly used ETFs for tactical strategies, one can look at the ratio of average dollar volume to average assets for the ETF.\nA: Incorrect because while ETF 1 is a thematic ETF with the the lowest management fee, it has the lowest ratio of average dollar volume to average assets. This suggests that ETF 1 is less liquid than ETF 3.\nB: Incorrect because ETF 2 is a broad-based ETF, and thus not likely suited to implement market views and adjust portfolio risk on a more short-term, tactical basis.", "ko": "기술 특정 분야를 겨냥한 tactical 조정 → thematic ETF가 맞음. 단기간에 사고팔기 때문에 운용보수보다 거래비용·유동성(평균 거래대금/평균 자산 비율)이 중요 → thematic 중 비율이 높은 ETF 3.", "trap": "Tactical = 유동성(거래량) 우선, 보수는 부차적. 그리고 관점에 맞는 유형(thematic)부터.", "f": "", "why": {"A": "ETF 1은 thematic이고 보수도 낮지만 거래대금/자산 비율(3.5)이 낮아 유동성이 떨어집니다. tactical 용도에서는 보수보다 유동성이 중요합니다.", "B": "ETF 2는 유동성이 가장 높지만 broad-based라 특정 기술 분야에 대한 관점을 반영할 수 없습니다."}, "orig": "ECO Module 3 Q38"}, {"id": "ECO-M3-Q41", "src": "ECO 오답", "module": 3, "tag": "Bid–ask spread 줄이는 요인", "vig": null, "stem": "A decrease in which of the following most likely reduces an ETF's bid–ask spread?", "opts": {"A": "Brokerage fees", "B": "Daily share volume for the ETF", "C": "Competition amongst market makers for the ETF"}, "ans": "A", "en": "Correct because lower direct trading costs, such as brokerage fees, for the liquidity provider would most likely reduce an ETF's bid–ask spread. If the market maker has lower costs, the need to recoup those costs by way of higher spreads is reduced.\nB: Incorrect because an increase (not decrease) in trading frequency for the ETF, as measured by daily share volume, would most likely reduce an ETF's bid–ask spread. High trading frequency increases the likelihood of receiving an offsetting ETF order in a short time frame, reducing the chance that market makers, as liquidity providers, will take on risk by having to hold positions for a prolonged period.\nC: Incorrect because an increase (not decrease) in competition among market makers for an ETF would most likely reduce an ETF's bid–ask spread. The amount of competition among market makers for that ETF is negatively related to the bid–ask spread (more competition means lower spreads).", "ko": "중개수수료 같은 직접 거래비용 ↓ → 시장조성자가 spread로 회수할 비용 ↓ → spread ↓.", "trap": "질문은 '감소'. 거래량·경쟁 감소는 spread ↑, 비용 감소만 spread ↓.", "f": "", "why": {"B": "일일 거래량이 '감소'하면 반대 주문을 빨리 받을 가능성이 낮아져 spread가 넓어집니다.", "C": "시장조성자 간 경쟁이 '감소'하면 spread가 넓어집니다."}, "orig": "ECO Module 3 Q41"}, {"id": "ECO-M3-Q42", "src": "ECO 오답", "module": 3, "tag": "Settlement risk", "vig": null, "stem": "Settlement risk for an ETF is best described as the risk of:", "opts": {"A": "loss from security lending.", "B": "creation and redemption halts.", "C": "counterparty default before gains can be realized."}, "ans": "C", "en": "Correct because settlement risk represents mark-to-market (unrealized) gains that are subject to counterparty default. To minimize settlement risk, OTC contracts are typically settled frequently—usually on a daily or weekly basis. This frequent settlement reduces the exposure the swap partners face if a company goes bankrupt, but there is a theoretical risk of counterparty default between settlement periods.\nA: Incorrect because due to overcollaterization, risks involved with security lending are typically minimal and do not represent the counterparty risk incurred during the settlement period.\nB: Incorrect because creation and redemption halts describe a form of fund closure risk, not settlement/counterparty risk.", "ko": "Settlement risk = 아직 실현되지 않은 평가이익(mark-to-market)이 결제 전에 거래상대방 부도로 사라질 위험. OTC 계약을 매일·매주 자주 결제하면 줄어듦.", "trap": "Settlement risk = 결제 '전' 거래상대방 부도 → 자주 결제하면 감소.", "f": "", "why": {"A": "Securities lending은 초과 담보 덕분에 위험이 작고, 결제 기간 중 거래상대방 위험과는 다릅니다.", "B": "창설·환매 중단은 fund closure risk의 한 형태입니다."}, "orig": "ECO Module 3 Q42"}, {"id": "VAR-M3-01", "module": 3, "tag": "ETF 총 보유비용 계산", "orig": "변형 (ECO M3 Q10, 오답노트 R36)", "stem": "An investor plans to hold an ETF for six months. The ETF has an annual management fee of 0.40%, round-trip trading commissions of 0.10%, and a bid–offer spread of 0.20% on purchase and sale. Ignoring compounding, the expected total holding period cost is closest to:", "opts": {"A": "0.50%.", "B": "0.70%.", "C": "0.30%."}, "ans": "A", "en": "Total holding period cost = (6/12)(0.40%) + 0.10% + 0.20% = 0.20% + 0.30% = 0.50%.", "ko": "총비용 = 운용보수 × 6/12 + 왕복 수수료 + bid–offer spread = 0.20% + 0.10% + 0.20% = 0.50%.", "why": {"B": "0.70%는 연 운용보수 0.40%를 6개월로 안분하지 않은 값입니다.", "C": "0.30%는 bid–offer spread(0.20%)를 빠뜨린 값입니다."}, "trap": "운용보수만 기간 비례.", "f": "총비용 = 연보수 × (보유개월/12) + 왕복 수수료 + bid–offer spread", "src": "변형", "vig": null}, {"id": "VAR-M3-02", "module": 3, "tag": "프리미엄 시 AP 차익거래", "orig": "변형 (ECO M3 지문, 오답노트 R36)", "stem": "An ETF is trading at a premium to its intraday NAV that exceeds expected arbitrage costs. Authorized participants will most likely:", "opts": {"A": "buy ETF shares in the market and redeem them for the underlying basket.", "B": "buy the creation basket, exchange it for new ETF shares, and sell those ETF shares.", "C": "do nothing because only the ETF sponsor can create new ETF shares."}, "ans": "B", "en": "When an ETF trades at a premium, APs can purchase the creation basket, deliver it in kind to the ETF sponsor in exchange for newly created ETF shares, and sell those shares in the market. This added supply pushes the ETF price back toward NAV.", "ko": "프리미엄(ETF 가격 > NAV) → AP가 기초자산 바스켓을 사서 sponsor에게 현물로 주고 새 ETF 주식을 받아 시장에서 매도 → ETF 공급 ↑ → 가격이 NAV로 수렴.", "why": {"A": "할인(ETF 가격 < NAV)일 때의 거래입니다. 싼 ETF를 사서 환매하고 비싼 바스켓을 받습니다.", "C": "Sponsor는 AP가 바스켓을 가져와야 주식을 발행합니다. 창설은 AP가 시작합니다."}, "trap": "프리미엄 → 창설(create) 후 ETF 매도, 할인 → ETF 매수 후 환매(redeem).", "f": "", "src": "변형", "vig": null}, {"id": "VAR-M3-03", "module": 3, "tag": "현물 환매와 세금 효율", "orig": "변형 (오답노트 R36, Schweser LOS 36)", "stem": "To enhance tax efficiency for remaining shareholders, an ETF manager publishing a customized in-kind redemption basket will most likely include holdings with the:", "opts": {"A": "highest cost basis.", "B": "lowest cost basis.", "C": "highest trading volume."}, "ans": "B", "en": "ETF managers can publish customized redemption baskets that target low-basis stocks. Delivering low-basis holdings out of the fund in a non-taxable in-kind redemption raises the average cost basis of the remaining holdings, increasing tax efficiency.", "ko": "현물 환매는 과세 사건이 아님 → 취득원가가 낮은(평가이익이 큰) 종목을 환매 바스켓에 넣어 내보내면 남은 보유 종목의 평균 취득원가가 올라가 세금 효율 ↑.", "why": {"A": "취득원가가 높은 종목을 내보내면 이익이 큰 종목이 펀드에 남아 나중에 세금 부담이 커집니다.", "C": "거래량은 세금 효율과 직접 관련이 없습니다."}, "trap": "Low-basis 종목을 현물로 내보내기 = 세금 효율.", "f": "", "src": "변형", "vig": null}, {"id": "ECO-M4-Q4", "src": "ECO 오답", "module": 4, "tag": "APT 차익거래: 민감도 맞추기", "vig": 14, "stem": "The arbitrage opportunity identified by Zapata can be exploited with:", "opts": {"A": "Strategy 1: Buy $50,000 Fund A and $50,000 Fund B; sell short $100,000 Fund C.", "B": "Strategy 2: Buy $60,000 Fund A and $40,000 Fund B; sell short $100,000 Fund C.", "C": "Strategy 3: Sell short $60,000 of Fund A and $40,000 of Fund B; buy $100,000 Fund C."}, "ans": "C", "en": "C is correct. A portfolio with 60% in Fund A and 40% in Fund B has expected return (0.60)(0.02) + (0.40)(0.04) = 2.8% and factor sensitivity (0.60)(0.5) + (0.40)(1.5) = 0.9. Its factor sensitivity is identical to Fund C’s, so there is no factor risk relative to Fund C, but Fund C’s expected return (3.0%) is higher than 2.8%. Buying $100,000 of Fund C and selling short $60,000 of Fund A and $40,000 of Fund B (Strategy 3) exploits the arbitrage opportunity. A 50/50 mix has sensitivity 1.0 and expected return 3.0%, so it does not match Fund C’s factor risk.", "ko": "Fund C의 민감도(0.9)와 같은 조합을 A·B로 만듦: 0.6×0.5 + 0.4×1.5 = 0.9. 이 60/40 조합의 기대수익률 = 0.6×2% + 0.4×4% = 2.8% < C의 3.0%. → C는 상대적으로 싸고 60/40 조합은 비쌈 → C 매수 $100,000, A $60,000·B $40,000 공매도 → 요인위험 0, 무위험 이익 0.2%.", "trap": "① 민감도를 같게 만드는 비중을 찾고 ② 기대수익률이 높은 쪽 매수, 낮은 쪽 공매도.", "f": "β(A,B 조합) = w·βA + (1 − w)·βB = βC", "why": {"A": "50/50 조합은 민감도가 1.0으로 C(0.9)와 달라 요인위험이 남습니다. 게다가 기대수익률(3.0%)이 C와 같아 차익이 없습니다.", "B": "민감도는 맞지만 방향이 반대입니다. 기대수익률이 낮은(2.8%) 60/40 조합을 사고 높은(3.0%) C를 공매도하면 손실이 납니다."}, "orig": "ECO Module 4 Q4"}, {"id": "ECO-M4-Q6", "src": "ECO 오답", "module": 4, "tag": "Macro 모형 수익률 = a + b × surprise", "vig": 14, "stem": "Based on the data in Exhibit 2 and Exhibit 3, the return for Portfolio AC, given the surprises in inflation and GDP growth, is closest to:", "opts": {"A": "2.02%.", "B": "2.40%.", "C": "4.98%."}, "ans": "A", "en": "A is correct. The macroeconomic two-factor model is Ri = ai + bi1·F_INF + bi2·F_GDP + εi, where F_INF and F_GDP are surprises and ai is the expected return.\nRA = 0.02 + 0.5F_INF + 1.0F_GDP + εA; RC = 0.03 + 1.0F_INF + 1.1F_GDP + εC.\nSurprise in inflation = 2.2% − 2.0% = 0.2%; surprise in GDP growth = 1.0% − 1.5% = −0.5%.\nR_AC = (0.6)(0.02) + (0.4)(0.03) + [(0.6)(0.5) + (0.4)(1.0)](0.002) + [(0.6)(1.0) + (0.4)(1.1)](−0.005) = 2.02%.", "ko": "Surprise = 실제 − 예측: 인플레이션 2.2 − 2.0 = +0.2%, GDP 1.0 − 1.5 = −0.5%. Portfolio AC(A 60%, C 40%): a = 0.6(2%) + 0.4(3%) = 2.4%. b_INF = 0.6(0.5) + 0.4(1.0) = 0.7, b_GDP = 0.6(1.0) + 0.4(1.1) = 1.04. R = 2.4% + 0.7(0.2%) + 1.04(−0.5%) = 2.4 + 0.14 − 0.52 = 2.02%.", "trap": "F = 실제 − 예측(surprise). 실제값을 그대로 넣으면 틀림.", "f": "Ri = ai + bi1·F_INF + bi2·F_GDP + εi,  F = actual − forecast", "why": {"B": "2.40%는 기대수익률(절편)만 계산하고 surprise 효과를 빠뜨린 값입니다.", "C": "4.98%는 surprise 대신 실제값(2.2%, 1.0%)을 요인값으로 곱한 값입니다. Macro 모형에서 F는 surprise입니다."}, "orig": "ECO Module 4 Q6"}, {"id": "ECO-M4-Q8", "src": "ECO 오답", "module": 4, "tag": "Surprise 결합 효과 비교", "vig": 14, "stem": "Based on the data in Exhibit 2, which fund is most sensitive to the combined surprises in inflation and GDP growth in Exhibit 3?", "opts": {"A": "Fund A", "B": "Fund B", "C": "Fund C"}, "ans": "A", "en": "A is correct. The effect of the surprises in inflation and GDP growth on the returns of the three funds is calculated as the following.\n\nChange in Portfolio Return Because of Surprise in\nFund\nInflation\nGDP Growth\nA\n0.5 × 0.2% = 0.10%\n1.0 × −0.5% = −0.50%\nB\n1.6 × 0.2% = 0.32%\n0.0 × −0.5% = 0.00%\nC\n1.0 × 0.2% = 0.20%\n1.1 × −0.5% = −0.55%\nThe combined effects for the three funds are the following.\nFund A: 0.10% + (−0.50%) = −0.40%\nFund B: 0.32% + (0.00%) = 0.32%\nFund C: 0.20% + (−0.55%) = −0.35%\nTherefore, Fund A is the most sensitive to the surprises in inflation and GDP growth in Exhibit 3.", "ko": "각 펀드의 surprise 효과 = b_INF × 0.2% + b_GDP × (−0.5%). A: 0.10 − 0.50 = −0.40%, B: 0.32 + 0 = +0.32%, C: 0.20 − 0.55 = −0.35%. 절댓값이 가장 큰 Fund A가 가장 민감.", "trap": "개별 요인 하나가 아니라 결합 효과의 크기(절댓값)를 비교.", "f": "Σ bik × Fk", "why": {"B": "Fund B는 인플레이션 민감도(1.6)가 가장 크지만 GDP 민감도가 0이라 결합 효과는 +0.32%로 A보다 작습니다.", "C": "Fund C는 GDP 효과(−0.55%)가 가장 크지만 인플레이션 효과(+0.20%)가 일부 상쇄해 결합 효과는 −0.35%입니다."}, "orig": "ECO Module 4 Q8"}, {"id": "ECO-M4-Q9", "src": "ECO 오답", "module": 4, "tag": "Macro 모형 기대수익률 = 절편", "vig": 15, "stem": "Assuming that the information in Exhibit 1 reflects the analyst's view, the expected return for Portfolio 1 is closest to:", "opts": {"A": "2.58%.", "B": "3.42%.", "C": "6.00%."}, "ans": "A", "en": "A is correct. When using a macroeconomic factor model, the expected return is the intercept (when all model factors take on a value of zero). The intercept coefficient for Portfolio 1 in Exhibit 1 is 2.58.", "ko": "Macro factor model에서 F는 surprise이고 기대값이 0 → 기대수익률 = 절편(intercept) a. Portfolio 1의 절편 = 2.58%.", "trap": "기대수익률을 물으면 절편. 실현수익률 = 절편 + surprise 효과.", "f": "E(Ri) = ai (E[F] = 0)", "why": {"B": "3.42%는 실현수익률(6.00%)에서 절편(2.58%)을 뺀 값, 즉 surprise 효과입니다.", "C": "6.00%는 최근 1년 실현수익률이지 기대수익률이 아닙니다."}, "orig": "ECO Module 4 Q9"}, {"id": "ECO-M4-Q10", "src": "ECO 오답", "module": 4, "tag": "Active risk의 원천 = 민감도 차이", "vig": 15, "stem": "Based on Exhibit 1, the active risk for Portfolio 2 is explained by surprises in:", "opts": {"A": "GDP.", "B": "consumer spending.", "C": "all four model factors."}, "ans": "C", "en": "C is correct. Active risk, also referred to as tracking risk or tracking error, is the sample standard deviation of the time series of active returns, where the active returns consist of the differences between the portfolio return and the benchmark return. Whereas GDP is the only portfolio non-zero sensitivity for Portfolio 2, the contribution to the portfolio’s active return is the sum of the differences between the portfolio’s and the benchmark’s sensitivities multiplied by the factor return. Because all four of the factor sensitivities of Portfolio 2 are different from the factor sensitivities of the benchmark, all four factors contribute to the portfolio’s active return and, therefore, to its active risk.", "ko": "Active return 기여 = (bP − bB) × F. Portfolio 2의 민감도(1.00, 0, 0, 0)는 벤치마크(0.50, −1.00, 1.10, −0.10)와 네 요인 모두 다름 → 네 요인 모두 active return과 active risk에 기여.", "trap": "민감도가 0이어도 벤치마크가 0이 아니면 active bet.", "f": "Active return = Σ (bP,k − bB,k) × Fk + 종목선택", "why": {"A": "포트폴리오에서 0이 아닌 민감도는 GDP뿐이지만, active risk는 '벤치마크와의 차이'에서 생깁니다. 나머지 요인도 벤치마크가 0이 아니므로 차이가 생깁니다.", "B": "소비지출 요인만이 아니라 벤치마크와 민감도가 다른 네 요인 모두 기여합니다."}, "orig": "ECO Module 4 Q10"}, {"id": "ECO-M4-Q12", "src": "ECO 오답", "module": 4, "tag": "Macro vs Fundamental 모형 비교", "vig": 15, "stem": "Which of Lam’s statements regarding macroeconomic factor models and fundamental factor models is correct?", "opts": {"A": "Only Statement 1", "B": "Only Statement 2", "C": "Both Statements 1 and 2"}, "ans": "C", "en": "C is correct. In a macroeconomic factor model, the factors are surprises in macroeconomic variables that significantly explain returns. Factor sensitivities are generally specified first in fundamental factor models, whereas factor sensitivities are estimated last in macroeconomic factor models.", "ko": "둘 다 맞음. ① Fundamental 요인 = 기업·주식 속성, macro 요인 = 경제변수의 surprise. ② Fundamental 모형은 민감도(표준화 속성값)를 먼저 정하고 요인수익률을 회귀로 추정. Macro 모형은 요인(surprise)을 먼저 정하고 민감도를 회귀 기울기로 마지막에 추정.", "trap": "Fundamental: 민감도 먼저 → 요인수익률 추정. Macro: 요인(surprise) 먼저 → 민감도 추정.", "f": "", "why": {"A": "Statement 2도 맞습니다. Fundamental은 민감도를 먼저, macro는 마지막에 추정합니다.", "B": "Statement 1도 맞습니다. Fundamental은 속성, macro는 surprise가 요인입니다."}, "orig": "ECO Module 4 Q12"}, {"id": "ECO-M4-Q23", "src": "ECO 오답", "module": 4, "tag": "IR = Active return / Tracking error", "vig": 16, "stem": "Which fund gained the highest active return per unit of active risk taken from its investment decisions?", "opts": {"A": "Finch", "B": "Raven", "C": "Magpie"}, "ans": "C", "en": "C is correct. The information ratio (active return / active risk, where active risk = tracking error) measures the active return earned per unit of active risk.\nFinch: (12.0 − 9.5)/8.0 = 0.31\nRaven: (9.6 − 9.5)/2.0 = 0.05\nMagpie: (11.5 − 9.5)/4.0 = 0.50\nA: Incorrect because it uses the difference between the portfolio and benchmark standard deviations as active risk.\nB: Incorrect because it computes the ratio as (portfolio return/benchmark return) − (portfolio SD/benchmark SD).", "ko": "Active risk 단위당 active return = IR. Finch: (12.0 − 9.5)/8.0 = 0.31, Raven: (9.6 − 9.5)/2.0 = 0.05, Magpie: (11.5 − 9.5)/4.0 = 0.50 → Magpie.", "trap": "Active risk = tracking error. σP − σB가 아님.", "f": "IR = (RP − RB) / TE", "why": {"A": "Finch를 고른 것은 active risk를 표준편차 차이(18 − 12 = 6)로 잘못 쓴 계산입니다. Active risk는 tracking error(8.0%)입니다.", "B": "Raven을 고른 것은 (RP/RB) − (σP/σB) 같은 잘못된 공식을 쓴 결과입니다. IR = (RP − RB)/tracking error입니다."}, "orig": "ECO Module 4 Q23"}, {"id": "ECO-M4-Q28", "src": "ECO 오답", "module": 4, "tag": "요인 노출과 투자자 적합성", "vig": 17, "stem": "Based solely on the factor model, is Fund D an appropriate investment for Lakemont University?", "opts": {"A": "Yes", "B": "No, because of Fund D's sensitivity to inflation risk", "C": "No, because of Fund D's sensitivity to time horizon risk"}, "ans": "B", "en": "Correct because Fund D has a positive factor sensitivity to time horizon risk and a negative factor sensitivity to inflation risk. Investors may tilt their strategic asset allocation or investments within an asset class to capture the associated risk premiums for risks that do not much affect them. Lakemont University has an investment time horizon of 30 years and is not much affected by time horizon risk. Therefore, it has a comparative advantage in bearing time horizon risk. However, the activities supported by Lakemont University are sensitive to inflation risk. Therefore, Fund D's negative factor sensitivity to inflation risk does not help Lakemont University in reducing its exposure to inflation risk.\nA: Incorrect because the activities supported by Lakemont University are sensitive to inflation risk. Therefore, Fund D's negative factor sensitivity to inflation risk does not help Lakemont University in reducing its exposure to inflation risk.\nC: Incorrect because Lakemont University has an investment time horizon of 30 years and is not much affected by time horizon risk. Therefore, it has a comparative advantage in bearing time horizon risk.", "ko": "Lakemont: 투자기간 30년 → time horizon risk의 영향을 별로 받지 않아 그 위험을 질 수 있는 비교우위가 있음. 하지만 지원 활동이 인플레이션에 민감 → 인플레이션 헤지가 필요. Fund D의 인플레이션 민감도가 음수(−0.4)라 인플레이션 위험을 오히려 키우므로 부적합.", "trap": "자기에게 영향이 작은 위험은 감수(프리미엄 획득), 이미 노출된 위험은 헤지.", "f": "", "why": {"A": "Fund D의 음(−)의 인플레이션 민감도는 Lakemont의 인플레이션 노출을 줄여주지 못해 적합하지 않습니다.", "C": "장기 투자자인 Lakemont는 time horizon risk를 감당할 수 있으므로 양(+)의 time horizon 민감도는 문제가 아닙니다."}, "orig": "ECO Module 4 Q28"}, {"id": "ECO-M4-Q31", "src": "ECO 오답", "module": 4, "tag": "Fundamental 모형 기대수익률 계산", "vig": 18, "stem": "Based on Exhibit 1 and other information provided by Yusuf, the expected return on the portfolio is closest to:", "opts": {"A": "8.90%.", "B": "11.28%.", "C": "12.58%."}, "ans": "C", "en": "C is correct. Expected return = RF + Σ (portfolio sensitivity × factor return) = 1.3% + 1.05(3.5%) + 0.5(4.7%) + (−0.6)(−4.5%) + 0.5(5.1%) = 1.3% + 3.675% + 2.35% + 2.7% + 2.55% = 12.58%.\nA: Incorrect. This calculation neglects to add the Market factor (8.90%).\nB: Incorrect. This calculation neglects to add the risk-free rate of 1.3% (11.28%).", "ko": "E(R) = Rf + Σ b × 요인 프리미엄 = 1.3 + 1.05(3.5) + 0.5(4.7) + (−0.6)(−4.5) + 0.5(5.1) = 1.3 + 3.675 + 2.35 + 2.7 + 2.55 = 12.58%.", "trap": "Rf와 모든 요인(Market 포함)을 빠짐없이 더하기. Value는 음 × 음 = +.", "f": "E(RP) = Rf + Σ bP,k × λk", "why": {"A": "8.90%는 Market 요인(1.05 × 3.5% = 3.675%)을 빠뜨린 값입니다.", "B": "11.28%는 무위험이자율(1.3%)을 빠뜨린 값입니다."}, "orig": "ECO Module 4 Q31"}, {"id": "ECO-M4-Q33", "src": "ECO 오답", "module": 4, "tag": "요인별 active return 기여", "vig": 18, "stem": "Which of the following analysts most likely provides the correct answer to Yusuf’s question on the contribution to active return?", "opts": {"A": "Quek", "B": "Cerra", "C": "Singh"}, "ans": "B", "en": "B is correct. Cerra is correct. Contribution to active return = (portfolio sensitivity − benchmark sensitivity) × factor return:\nMarket: (1.05 − 1.00)(3.5%) = 0.175%\nSmall-Cap: (0.5 − 0.3)(4.7%) = 0.94%\nValue: (−0.6 − 0.2)(−4.5%) = 3.6%\nMomentum: (0.5 − 0.1)(5.1%) = 2.04%\nThe Value factor has the highest contribution to active return.", "ko": "기여 = (bP − bB) × 요인수익률. Market: 0.05 × 3.5 = 0.175%, Small-cap: 0.2 × 4.7 = 0.94%, Value: (−0.8) × (−4.5) = 3.6%, Momentum: 0.4 × 5.1 = 2.04% → Value가 가장 큼 → Cerra가 맞음.", "trap": "요인수익률 크기가 아니라 '민감도 차이 × 요인수익률'. 음 × 음 = +.", "f": "기여k = (bP,k − bB,k) × Fk", "why": {"A": "Momentum 기여는 2.04%로 Value(3.6%)보다 작습니다. Momentum 요인수익률(5.1%)이 가장 높다고 기여도 가장 큰 것은 아닙니다.", "C": "Market은 민감도 차이가 0.05에 불과해 기여가 0.175%로 가장 작습니다."}, "orig": "ECO Module 4 Q33"}, {"id": "ECO-M4-Q35", "src": "ECO 오답", "module": 4, "tag": "APT 가정", "vig": 19, "stem": "Which of Kwon’s attributes about APT is most likely correct?", "opts": {"A": "Attribute 1", "B": "Attribute 2", "C": "Attribute 3"}, "ans": "B", "en": "Correct because APT makes the assumption that investors can form well-diversified portfolios that eliminate asset-specific risk.\nA: Incorrect because APT makes less strong assumptions than the CAPM.\nC: Incorrect because APT requires that arbitrage opportunities do not exist among well-diversified portfolios.", "ko": "Attribute 2가 맞음. APT는 투자자가 잘 분산된 포트폴리오를 만들어 자산 고유위험을 없앨 수 있다고 가정.", "trap": "APT 3가정: ① 요인모형이 수익률 설명 ② 분산으로 고유위험 제거 ③ 잘 분산된 포트폴리오 간 차익거래 없음.", "f": "", "why": {"A": "APT는 CAPM보다 '약한(덜 제한적인)' 가정을 씁니다.", "C": "APT는 잘 분산된 포트폴리오 사이에 차익거래 기회가 '없다'고 가정합니다."}, "orig": "ECO Module 4 Q35"}, {"id": "ECO-M4-Q36", "src": "ECO 오답", "module": 4, "tag": "SMB·HML·WML → Fundamental 모형", "vig": 19, "stem": "The strategy incorporated in the management of the equity portfolio for Gyeongiu Electric is most likely an example of which type of factor model?", "opts": {"A": "Statistical", "B": "Fundamental", "C": "Macroeconomic"}, "ans": "B", "en": "Correct because the model described is based on company fundamental factors, such as market capitalization and valuation, as well as a company share-related factor to explain cross-sectional differences in stock prices. This is an example of a fundamental factor model. Statistical factor models do not rely on defining the factors up front. Macroeconomic models would represent broader economic factors, such as interest rates, inflation, and credit spread.\nA: Incorrect because statistical factor models make minimal assumptions and factors are observed from the returns of securities in a group. There are two primary types of statistical models: (1) factor analysis models in which the factors are the portfolios of securities that best explain historical return covariances, and (2) principal component models in which the factors are portfolios of securities that best explain historical return variances.\nC: Incorrect because macroeconomic factor models have factors that represent surprises in macroeconomic variables, such as interest rates, inflation, business cycle, and credit spreads.", "ko": "SMB(size), HML(가치), WML(모멘텀)은 기업·주식 속성에 기반한 요인 → fundamental factor model.", "trap": "SMB, HML, WML이 나오면 fundamental.", "f": "", "why": {"A": "Statistical 모형은 요인을 미리 정의하지 않고 수익률 데이터에서 통계적으로 추출합니다.", "C": "Macro 모형의 요인은 금리·인플레이션·경기·신용스프레드 같은 경제변수의 surprise입니다."}, "orig": "ECO Module 4 Q36"}, {"id": "ECO-M4-Q38", "src": "ECO 오답", "module": 4, "tag": "Active return = IR × active risk", "vig": 19, "stem": "Is Kwon most likely accurate in his comments regarding how the portfolios have performed?", "opts": {"A": "Yes", "B": "No, with regard to his comment on Daegu’s portfolio", "C": "No, with regard to his comment on Gangwon’s portfolio"}, "ans": "A", "en": "Correct because Kwon correctly interprets the performance of the various portfolios from the information compiled in Exhibit 2. Kwon is correct that Daegu’s portfolio has the highest active return. The information ratio is defined as active return divided by active risk or tracking error. Daegu has by far the largest active risk, and it has a higher information ratio than Gangwon, its information ratio is 13% higher with an active risk that is 2.1 times larger (square root of Daegu active risk squared divided by square root of Gangwon active risk squared). As a result, understanding the equation for information ratio, Daegu must have the largest active return. Kwon is also correct that Gangwon’s portfolio appears to have the highest contribution of active risk from stock selection; 75% of Gangwon’s active risk comes from active specific risk, which means security specific risk. Even when considering Daegu’s higher active total risk, only 10% of Daegu’s active risk comes from active specific versus active factor sources, indicating the most security specific (stock selection) risk from Gangwon.\nB: Incorrect because Kwon is correct that Daegu’s portfolio has the highest active return. The information ratio is defined as active return divided by active risk or tracking error. Daegu has by far the largest active risk, and although it has a lower information ratio than Ulsan, its information ratio is 82% as high with an active risk that is more than three times larger. As a result, Daegu must have the largest active return.\nC: Incorrect because Kwon is correct that Gangwon’s portfolio appears to have the highest contribution of active risk from stock selection; 75% of Gangwon’s active risk comes from active specific risk, which means security specific risk. Even when considering Daegu’s higher active total risk, only 10% of Daegu’s active risk comes from active specific versus active factor sources, indicating the most security specific (stock selection) risk from Gangwon.", "ko": "Active risk: Daegu = √0.38% ≈ 6.2%, Gangwon = √0.09% = 3.0% → Daegu가 약 2.05배. Active return = IR × active risk → Daegu 0.70 × 6.2 > Gangwon 0.62 × 3.0 → Daegu가 가장 큼(맞음). Gangwon은 active risk의 75%가 active specific(종목선택) → 종목선택 기여 비중이 가장 큼(맞음). → Kwon 둘 다 맞음.", "trap": "Active risk squared의 제곱근을 구해 IR과 곱하면 active return.", "f": "Active return = IR × σA,  σA = √(active risk squared)", "why": {"B": "Daegu는 IR도 더 높고 active risk도 약 2배라 active return이 가장 큽니다.", "C": "Gangwon은 active risk의 75%가 종목 고유위험이라 종목선택 기여 비중이 가장 높습니다."}, "orig": "ECO Module 4 Q38"}, {"id": "ECO-M4-Q41", "src": "ECO 오답", "module": 4, "tag": "요인모형 활용: portfolio construction", "vig": 20, "stem": "TIA is most likely applying its three-factor model in:", "opts": {"A": "risk attribution.", "B": "return attribution.", "C": "portfolio construction."}, "ans": "C", "en": "Correct. Portfolio construction is the most likely application of TIA’s three-factor model. TIA compares the expected return of a security with the expected return of its respective sector index. When constructing a portfolio, securities with expected returns higher than the benchmark would be included. The model is not being used to attribute the risk or return of a portfolio.\nA: Incorrect. TIA’s model is not being use to analyze risk or return attribution of a portfolio.\nB: Incorrect. TIA’s model is not being use to analyze risk or return attribution of a portfolio.", "ko": "TIA는 3요인 모형으로 개별 종목의 기대수익률을 지역 섹터지수의 기대수익률과 비교해, 더 높은 종목을 편입 → 포트폴리오 구성(portfolio construction)에 사용.", "trap": "기대수익률로 종목을 골라 담음 = construction, 사후 분해 = attribution.", "f": "", "why": {"A": "기존 포트폴리오의 위험을 요인별로 나누는 분석(risk attribution)이 아닙니다.", "B": "기존 포트폴리오의 수익을 요인별로 나누는 분석(return attribution)이 아닙니다."}, "orig": "ECO Module 4 Q41"}, {"id": "ECO-M4-Q48", "src": "ECO 오답", "module": 4, "tag": "Standardized beta = fundamental 모형", "vig": 21, "stem": "In her comparison of two types of factor models, is Wilson most likely correct regarding macroeconomic factor models?", "opts": {"A": "Yes", "B": "No, she is incorrect regarding standardized betas", "C": "No, she is incorrect regarding the expected effect of each factor"}, "ans": "B", "en": "Correct. Standardized betas are used in fundamental factor models, not macroeconomic factor models.\nA: Incorrect. Standardized betas are used in fundamental factor models, not macroeconomic factor models.\nC: Incorrect because in macroeconomic factor models the expected impact of each factor is zero.", "ko": "Wilson의 '표준화 베타는 macro 모형에서 쓴다'는 틀림 → standardized beta는 fundamental 모형에서 사용. 'macro 모형에서 각 요인의 기대 효과는 0'(요인이 surprise이므로)은 맞음.", "trap": "Standardized beta(속성값을 평균·표준편차로 표준화) → fundamental 전용.", "f": "Standardized beta = (속성값 − 평균) / 표준편차", "why": {"A": "Standardized beta 설명이 틀렸으므로 Wilson의 설명 전체가 맞지는 않습니다.", "C": "Macro 모형의 요인은 surprise라 기대값이 0이므로 이 설명은 맞습니다."}, "orig": "ECO Module 4 Q48"}, {"id": "ECO-M4-Q59", "src": "ECO 오답", "module": 4, "tag": "1요인 APT로 저평가 판단", "vig": null, "stem": "An analyst gathers the following information about three portfolios:\n\tExpected Return\tFactor Sensitivity\nPortfolio 1\t8%\t0.6\nPortfolio 2\t15%\t1.3\nPortfolio 3\t12%\t0.8\nIf Portfolio 1 and Portfolio 2 are priced correctly according to a one-factor arbitrage pricing theory model, it can be concluded that Portfolio 3 is:", "opts": {"A": "undervalued relative to its factor risk.", "B": "correctly valued relative to its factor risk.", "C": "overvalued relative to its factor risk."}, "ans": "A", "en": "A is correct. Using the one-factor APT model E(R) = RF + λβ, if Portfolios 1 and 2 are correctly priced: 8% = RF + 0.6λ and 15% = RF + 1.3λ. Solving, λ = 10% and RF = 2%. The APT-implied expected return for Portfolio 3 is 2% + 0.8(10%) = 10%. Because Portfolio 3’s expected return of 12% exceeds 10%, it is undervalued relative to its factor risk.", "ko": "8 = RF + 0.6λ, 15 = RF + 1.3λ → λ = 7/0.7 = 10%, RF = 2%. Portfolio 3의 APT 요구수익률 = 2 + 0.8 × 10 = 10% < 기대수익률 12% → 위험 대비 수익이 높음 → 저평가.", "trap": "기대수익률 > APT 요구수익률 → 저평가(undervalued).", "f": "E(R) = RF + λ·β", "why": {"B": "기대수익률(12%)이 APT 요구수익률(10%)과 다르므로 적정가치가 아닙니다.", "C": "방향 반대. 기대수익률 > 요구수익률이면 가격이 싸다(저평가)는 뜻입니다."}, "orig": "ECO Module 4 Q59"}, {"id": "ECO-M4-Q60", "src": "ECO 오답", "module": 4, "tag": "Macro 모형 기대수익률 = 가중 절편", "vig": null, "stem": "The returns of stocks X and Y are given by a macroeconomic factor model and expressed as follows:\nRX = 0.08 – 0.05F1 + 0.03F2 + εX\nRY = 0.16 + 0.02F1 + 0.04F2 + εY\nwhere F1 and F2 reflect surprises in two macroeconomic factors. If a portfolio has one quarter of its investment in Stock X and the rest in Stock Y, the portfolio's expected return is closest to:", "opts": {"A": "12%.", "B": "14%.", "C": "18%."}, "ans": "B", "en": "Correct because the expected return of an asset in a macroeconomic factor model is given by the intercept term. Hence, the expected return of the portfolio is computed as the weighted average of the intercepts in the expressions for RX and RY, i.e. (1/4)(0.08) + (3/4)(0.16) = 0.14 = 14%.\nA: Incorrect because here the simple average of both intercepts is used, i.e. (0.08 + 0.16)/2 = 0.12 = 12%, instead of the weighted average.\nC: Incorrect because here the weights have been applied to the intercepts and all independent variable coefficients as well, i.e. (1/4)(0.08 – 0.05 + 0.03) + (3/4)(0.16 + 0.02 + 0.04) = 0.18 = 18%, instead of the intercepts only.", "ko": "Macro 모형의 기대수익률 = 절편. 포트폴리오 기대수익률 = (1/4)(8%) + (3/4)(16%) = 2% + 12% = 14%.", "trap": "기대수익률 = 절편의 가중평균. 계수는 surprise가 있을 때만 영향.", "f": "E(RP) = Σ wi·ai", "why": {"A": "12%는 두 절편을 단순 평균한 값입니다. 비중(1/4, 3/4)을 적용해야 합니다.", "C": "18%는 절편에 요인 계수까지 더한 값입니다. Surprise의 기대값은 0이라 계수는 기대수익률에 들어가지 않습니다."}, "orig": "ECO Module 4 Q60"}, {"id": "ECO-M4-Q61", "src": "ECO 오답", "module": 4, "tag": "Statistical 모형의 요인 = 포트폴리오", "vig": null, "stem": "Which of the following statements about factor models is most accurate?", "opts": {"A": "In a statistical factor model, the factors are defined by portfolio weights", "B": "In a macroeconomic factor model, the factors are consensus forecasts of macroeconomic variables", "C": "In a fundamental factor model, the factors are company-specific and do not include macroeconomic factors"}, "ans": "A", "en": "Correct because, in statistical factor models, the factors are actually portfolios of the securities in the group under study and are therefore defined by portfolio weights.\nB: Incorrect because, in a macroeconomic factor model, the factors are surprises, not consensus forecasts, in macroeconomic variables that significantly explain returns.\nC: Incorrect because we can place the factors of most fundamental factor models for equities into three broad groups: company fundamental factors, company share-related factors, and macroeconomic factors.", "ko": "Statistical factor model의 요인은 분석 대상 종목들로 만든 포트폴리오 → 포트폴리오 비중으로 정의됨.", "trap": "Macro 요인 = surprise. 예측치·수준 자체가 아님.", "f": "", "why": {"B": "Macro 모형의 요인은 컨센서스 예측치가 아니라 경제변수의 surprise(실제 − 예측)입니다.", "C": "Fundamental 모형의 요인에는 기업 속성, 주식 속성뿐 아니라 macro 요인도 포함될 수 있습니다."}, "orig": "ECO Module 4 Q61"}, {"id": "ECO-M4-Q64", "src": "ECO 오답", "module": 4, "tag": "Multifactor 모형 활용", "vig": null, "stem": "Which of the following statements about multifactor models is most accurate?", "opts": {"A": "Multifactor models allow a portfolio manager to make focused bets", "B": "A pure factor portfolio would have a sensitivity of 1 for a given factor and a sensitivity of –1 for all other factors", "C": "The ability of multifactor models to model risk in greater detail is useful in active management but not in passive management"}, "ans": "A", "en": "Correct because multifactor models permit the portfolio manager to make focused bets or to control portfolio risk relative to the benchmark’s risk.\nB: Incorrect because a (pure) factor portfolio would have a sensitivity of 1 for that factor and a sensitivity (or weight) of 0, not –1, for all other factors.\nC: Incorrect because this greater level of detail in modeling risk that multifactor models", "ko": "Multifactor 모형으로 특정 요인에 집중 베팅(focused bet)하거나 벤치마크 대비 위험을 통제할 수 있음.", "trap": "Pure factor portfolio: 해당 요인 1, 나머지 0.", "f": "", "why": {"B": "Pure factor portfolio는 해당 요인 민감도 1, 나머지 요인 민감도 '0'입니다(−1 아님).", "C": "정교한 위험 모델링은 패시브 운용(벤치마크 추종)에도 유용합니다."}, "orig": "ECO Module 4 Q64"}, {"id": "VAR-M4-01", "module": 4, "tag": "Macro 모형 실현수익률", "orig": "변형 (ECO M4 Q6, 오답노트 R37)", "stem": "A stock’s returns are described by a two-factor macroeconomic model with an intercept of 6.0%, a GDP sensitivity of 1.2, and an inflation sensitivity of −0.5. GDP growth was forecast at 2.0% and came in at 3.0%; inflation was forecast at 3.0% and came in at 2.0%. Assuming a zero error term, the stock’s realized return is closest to:", "opts": {"A": "6.0%.", "B": "7.7%.", "C": "8.6%."}, "ans": "B", "en": "Surprises: GDP = 3.0% − 2.0% = +1.0%; inflation = 2.0% − 3.0% = −1.0%. R = 6.0% + 1.2(1.0%) + (−0.5)(−1.0%) = 6.0% + 1.2% + 0.5% = 7.7%.", "ko": "Surprise: GDP +1.0%, 인플레이션 −1.0%. R = 6.0 + 1.2 × 1.0 + (−0.5) × (−1.0) = 6.0 + 1.2 + 0.5 = 7.7%.", "why": {"A": "6.0%는 기대수익률(절편)입니다. 실현수익률에는 surprise 효과를 더해야 합니다.", "C": "8.6%는 surprise 대신 실제값(3.0%, 2.0%)을 곱한 값입니다."}, "trap": "F = 실제 − 예측. 음의 민감도 × 음의 surprise = +.", "f": "R = a + Σ b × (actual − forecast)", "src": "변형", "vig": null}, {"id": "VAR-M4-02", "module": 4, "tag": "Active risk² 분해", "orig": "변형 (오답노트 R37)", "stem": "A portfolio has active factor risk of 9 (%²) and active specific risk of 16 (%²). The portfolio’s active risk is closest to:", "opts": {"A": "5.0%.", "B": "7.0%.", "C": "25.0%."}, "ans": "A", "en": "Active risk squared = active factor risk + active specific risk = 9 + 16 = 25 (%²). Active risk = √25 = 5.0%.", "ko": "Active risk² = active factor risk + active specific risk = 9 + 16 = 25 → active risk = √25 = 5%.", "why": {"B": "7.0%는 각각의 제곱근(3% + 4%)을 더한 값입니다. 분산(제곱)끼리 더한 뒤 제곱근을 구해야 합니다.", "C": "25는 active risk '제곱'입니다. 제곱근을 구해야 합니다."}, "trap": "더하는 것은 제곱(분산) 단위. 표준편차끼리는 더하지 않음.", "f": "σA² = active factor risk + active specific risk", "src": "변형", "vig": null}, {"id": "VAR-M4-03", "module": 4, "tag": "요인별 active return 기여 (음수 요인)", "orig": "변형 (ECO M4 Q33, 오답노트 R37)", "stem": "A portfolio has a sensitivity of 0.8 to a size factor, while its benchmark has a sensitivity of 1.2. If the size factor return for the period is −2.0%, the contribution of the size factor to the portfolio’s active return is closest to:", "opts": {"A": "−0.8%.", "B": "+0.8%.", "C": "−1.6%."}, "ans": "B", "en": "Contribution = (bP − bB) × F = (0.8 − 1.2) × (−2.0%) = (−0.4)(−2.0%) = +0.8%.", "ko": "기여 = (bP − bB) × F = (0.8 − 1.2) × (−2.0%) = (−0.4) × (−2.0%) = +0.8%. 벤치마크보다 덜 노출된 요인이 하락해 이득.", "why": {"A": "부호를 놓쳤습니다. 민감도 차이(−0.4)와 요인수익률(−2.0%)이 모두 음수라 곱은 양수입니다.", "C": "−1.6%는 포트폴리오 민감도만 곱한 값(0.8 × −2.0%)입니다. 벤치마크와의 차이를 써야 합니다."}, "trap": "민감도 '차이' × 요인수익률. 음 × 음 = +.", "f": "기여 = (bP − bB) × F", "src": "변형", "vig": null}, {"id": "ECO-M5-Q2", "src": "ECO 오답", "module": 5, "tag": "Delta 낮추기: short call", "vig": 22, "stem": "Which of the following options strategies is Ferrell most likely to recommend for the client’s portfolio?", "opts": {"A": "Long calls", "B": "Short calls", "C": "Short puts"}, "ans": "B", "en": "B is correct. An index-tracking portfolio without options has a delta of 1. To achieve a delta of 0.9, the delta of the options position must be negative. Of the three choices, only short calls have a negative delta. Long call options have deltas ranging from 0 to 1. Short calls, therefore, have deltas ranging from 0 to −1. The short call position lowers the portfolio’s overall delta as desired.", "ko": "지수 추종 포트폴리오의 delta = 1. 0.90으로 낮추려면 음(−)의 delta 옵션 포지션이 필요 → short call(delta 0 ~ −1) 또는 long put. 선택지 중 short call만 음의 delta.", "trap": "Long call +, short call −, long put −, short put +.", "f": "Δ(포트폴리오) = 1 + Σ Δ(옵션 포지션)", "why": {"A": "Long call의 delta는 0 ~ +1이라 포트폴리오 delta를 오히려 높입니다.", "C": "Short put의 delta는 양수(0 ~ +1)라 포트폴리오 delta를 높입니다."}, "orig": "ECO Module 5 Q2"}, {"id": "ECO-M5-Q5", "src": "ECO 오답", "module": 5, "tag": "VaR 한계: 유동성 위험 미반영", "vig": 22, "stem": "Which of the following statements should not be included in Abell’s report to management regarding the use of risk measures in capital allocation decisions?", "opts": {"A": "VaR measures capture the increased liquidity risk during stress periods.", "B": "Stress tests and scenario analysis can be used to evaluate the effect of outlier events on each line of business.", "C": "VaR approaches that can accommodate a non-normal distribution are critical to understand relative risk across lines of business."}, "ans": "A", "en": "A is correct. VaR measures do not capture liquidity risk. If some assets in a portfolio are relatively illiquid, VaR could be understated, even under normal market conditions. Additionally, liquidity squeezes are frequently associated with tail events and major market downturns, thereby exacerbating the risk.", "ko": "VaR는 유동성 위험을 반영하지 못함 → 비유동 자산이 있으면 평상시에도 VaR가 과소평가되고, 위기 때는 유동성 경색이 tail event와 함께 와서 위험이 더 커짐. 그래서 A는 보고서에 넣으면 안 되는 문장.", "trap": "VaR 한계: 유동성 미반영, 정규분포 가정 시 fat tail 과소평가, 위기 시 상관관계 급등 미반영.", "f": "", "why": {"B": "스트레스 테스트와 시나리오 분석으로 극단적 사건이 각 사업부에 미치는 영향을 평가할 수 있다는 것은 맞는 내용이라 보고서에 넣어도 됩니다.", "C": "비정규 분포를 다룰 수 있는 VaR 방법(historical, Monte Carlo)은 tail risk를 비교하는 데 중요하므로 맞는 내용입니다."}, "orig": "ECO Module 5 Q5"}, {"id": "ECO-M5-Q7", "src": "ECO 오답", "module": 5, "tag": "VaR 한계: 변동성 국면 변화", "vig": 23, "stem": "The number of Flusk’s VaR breaches most likely resulted from:", "opts": {"A": "using a standard normal distribution in the VaR model.", "B": "using a 95% confidence interval instead of a 99% confidence interval.", "C": "lower market volatility during the last year compared with the lookback period."}, "ans": "C", "en": "C is correct. Flusk experienced zero daily VaR breaches over the last year yet incurred a substantial loss. A limitation of VaR is its vulnerability to different volatility regimes. A portfolio might remain under its VaR limit every day but lose an amount approaching this limit each day. If market volatility during the last year is lower than in the lookback period, the portfolio could accumulate a substantial loss without technically breaching the VaR constraint.\nA is incorrect because VaR was calculated using historical simulation, so the distribution used was based on actual historical changes in the key risk factors experienced during the lookback period. Thus, the distribution is not characterized using estimates of the mean return, the standard deviation, or the correlations among the risk factors in the portfolio. In contrast, the parametric method of estimating VaR generally assumes that the distribution of returns for the risk factors is normal.\nB is incorrect because a specification with a higher confidence level will produce a higher VaR. If a 99% confidence interval was used to calculate historical VaR, the VaR would be larger (larger expected minimum loss). During the last year, none of Flusk’s losses were substantial enough to breach the 5% VaR number (95% confidence interval); therefore, if McKee used a 1% VaR (99% confidence interval), the number of VaR breaches would not change.", "ko": "VaR breach가 0번인데 큰 손실 → lookback 기간보다 최근 1년 변동성이 낮아서, 매일 VaR 한도 근처의 손실이 쌓여도 한도를 넘지 않은 것. VaR는 변동성 국면 변화에 취약함.", "trap": "Breach 0 + 누적 손실 큼 = 저변동성 국면에서 한도 직전 손실이 반복된 것.", "f": "", "why": {"A": "Historical simulation 방법을 썼기 때문에 정규분포를 가정하지 않았습니다. 정규분포 가정은 parametric 방법입니다.", "B": "99%로 바꾸면 VaR가 더 커져서 breach는 오히려 더 줄거나 그대로입니다. 95%에서도 breach가 0이었습니다."}, "orig": "ECO Module 5 Q7"}, {"id": "ECO-M5-Q12", "src": "ECO 오답", "module": 5, "tag": "옵션 내재 채권 스트레스 테스트: full revaluation", "vig": 23, "stem": "When measuring the portfolio impact of the stress test suggested by McKee, which of the following is most likely to produce an accurate result?", "opts": {"A": "Marginal VaR", "B": "Full revaluation of securities", "C": "The use of sensitivity risk measures"}, "ans": "B", "en": "B is correct. McKee suggests running a stress test using a historical scenario specific to emerging markets that includes an extreme change in credit spreads. Stress tests, which apply extreme negative stress to a particular portfolio exposure, are closely related to scenario risk measures. A scenario risk measure estimates the portfolio return that would result from a hypothetical change in markets (hypothetical scenario) or a repeat of a historical event (historical scenario). When the historical simulation fully revalues securities under rate and price changes that occurred during the scenario period, the results should be highly accurate.\nA is incorrect because marginal VaR measures the change in portfolio VaR given a very small change in a portfolio position (e.g., change in VaR for a $1 or 1% change in the position). Therefore, marginal VaR would not allow McKee to estimate how much the value of the option-embedded bonds would change under an extreme change in credit spreads.\nC is incorrect because sensitivity risk measures use sensitivity exposure measures, such as first-order (delta, duration) and second-order (gamma, convexity) sensitivity, to assess the change in the value of a financial instrument. Although gamma and convexity can be used with delta and duration to estimate the impact of extreme market movements, they are not suited for scenario analysis related to option-embedded bonds.", "ko": "내재옵션이 있는 채권에 극단적인 신용스프레드 변화를 주는 스트레스 테스트 → 시나리오 값으로 증권 가격을 모형에서 다시 계산하는 full revaluation이 가장 정확.", "trap": "큰 변화 + 내재옵션 = full revaluation. 민감도는 작은 변화용.", "f": "", "why": {"A": "Marginal VaR는 포지션의 아주 작은 변화($1, 1%)에 따른 VaR 변화라서 극단적 스프레드 충격의 영향을 측정하지 못합니다.", "C": "Delta·duration, gamma·convexity 같은 민감도 지표는 작은 변화의 근사치라 큰 변화와 내재옵션을 정확히 반영하지 못합니다."}, "orig": "ECO Module 5 Q12"}, {"id": "ECO-M5-Q17", "src": "ECO 오답", "module": 5, "tag": "Parametric VaR 계산 (연 → 일)", "vig": 24, "stem": "Based on Exhibit 1, the daily 5% VaR estimate is closest to:", "opts": {"A": "1.61%.", "B": "2.42%.", "C": "2.69%."}, "ans": "C", "en": "C is correct. From Exhibit 1, the expected annual return is 14.1% and the standard deviation is 26.3%. With 250 trading days, the daily expected return is 0.141/250 = 0.000564 and daily volatility is 0.263/√250 = 0.016634.\n5% daily VaR = E(Rp) − 1.65σp = 0.000564 − 1.65(0.016634) = −0.026882. The portfolio is expected to lose at least 2.69% on 5% of trading days.", "ko": "일 기대수익률 = 14.1%/250 = 0.0564%, 일 표준편차 = 26.3%/√250 = 1.6634%. 5% VaR = 1.65 × 1.6634% − 0.0564% = 2.69%.", "trap": "수익률은 ÷250, 표준편차는 ÷√250. 그 후 z(5%) = 1.65를 곱함.", "f": "VaR(5%) = 1.65·σ_daily − μ_daily,  σ_daily = σ_annual/√250", "why": {"A": "1.61%는 일 표준편차에 1.65를 곱하지 않은 값입니다(1.6634 − 0.0564).", "B": "2.42%는 계산 과정이 맞지 않습니다. 연 표준편차는 √250으로, 연 수익률은 250으로 나눈 뒤 VaR = 1.65σ − μ로 계산해야 합니다."}, "orig": "ECO Module 5 Q17"}, {"id": "ECO-M5-Q24", "src": "ECO 오답", "module": 5, "tag": "시나리오 분석이 VaR를 보완하는 이유", "vig": 25, "stem": "The scenario analysis that Hamilton prepares for the committee is a valuable tool to supplement VaR because it:", "opts": {"A": "incorporates historical data to evaluate the risk in the tail of the VaR distribution.", "B": "enables Hamilton to isolate the risk stemming from a single risk factor—the ratings downgrade.", "C": "allows the committee to assess the effect of low liquidity in the event of a ratings downgrade."}, "ans": "C", "en": "C is correct. A hypothetical scenario analysis allows Hamilton to estimate the direct effect of a ratings downgrade on the portfolio’s government bond holdings and the resulting need to sell a number of the portfolio’s holdings because they no longer meet the ratings guidelines. VaR alone does not accurately reflect the risk of large position sizes, which may be difficult to trade. The hypothetical scenario analysis will also highlight the effect of increased economic turmoil on all of the portfolio’s exposures, not only the government bond exposures.", "ko": "가상 시나리오(국가신용등급 강등)로 등급 기준 미달 보유자산을 강제 매도해야 하는 상황과 낮은 유동성의 영향을 평가할 수 있음. VaR만으로는 거래가 어려운 대규모 포지션의 위험을 반영하지 못함.", "trap": "민감도 분석 = 단일 요인·작은 변화, 시나리오 분석 = 여러 요인·큰 변화(유동성 반영 가능).", "f": "", "why": {"A": "가상 시나리오는 과거 데이터에 의존하지 않으며, VaR 분포의 꼬리를 평가하는 도구는 CVaR입니다.", "B": "시나리오 분석은 여러 위험요인의 큰 동시 변화를 봅니다. 단일 요인을 분리하는 것은 민감도 분석입니다. 등급 강등은 모든 자산군에 영향을 줍니다."}, "orig": "ECO Module 5 Q24"}, {"id": "ECO-M5-Q26", "src": "ECO 오답", "module": 5, "tag": "채권 비중 큰 포트폴리오 → duration", "vig": 25, "stem": "What additional risk measures would be most appropriate to add to Hamilton’s risk assessment?", "opts": {"A": "Delta", "B": "Duration", "C": "Tracking error"}, "ans": "B", "en": "B is correct. Given the large fixed-income exposure in the LICIA portfolio, examining the portfolio duration more closely would be prudent. Duration is the primary sensitivity exposure measure for fixed-income investments.", "ko": "LICIA 포트폴리오는 채권(국채·모기지/인프라 대출·회사채) 비중이 90% → 채권의 핵심 민감도 지표인 duration을 추가하는 것이 적절.", "trap": "채권 = duration, 옵션 = delta/gamma, 벤치마크 대비 운용 = tracking error.", "f": "", "why": {"A": "Delta는 옵션의 민감도 지표입니다. 이 포트폴리오에는 옵션 노출이 거의 없습니다.", "C": "Tracking error는 벤치마크 대비 위험이라 보험사의 절대 위험 평가에 맞지 않습니다."}, "orig": "ECO Module 5 Q26"}, {"id": "ECO-M5-Q27", "src": "ECO 오답", "module": 5, "tag": "VaR 정의: 최소 손실", "vig": 26, "stem": "Which one of Flaherty’s statements on VaR is most likely correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "A", "en": "Correct. Statement 1 is accurate. VaR can be used to measure the minimum, not maximum, expected loss.\nB: Incorrect. Flaherty is incorrect regarding VaR being expressed at a fixed point in time. VaR is expressed over a period of time. VaR can be expressed in terms of either percentage loss or value loss.\nC: Incorrect. Statement 3 is incorrect. VaR measures not portfolio volatility but, rather, portfolio losses expressed in terms of either percentage loss or value loss.", "ko": "Statement 1만 맞음: VaR는 주어진 확률에서의 '최소' 예상 손실(최대 손실 아님). VaR는 특정 시점이 아니라 기간에 대해 표현하며, 변동성이 아니라 손실(%나 금액)을 측정.", "trap": "5% VaR = '5% 확률로 최소 이만큼 잃음'. 최대 손실 아님.", "f": "", "why": {"B": "VaR는 고정된 시점이 아니라 일정 기간(1일, 1개월 등)의 손실을 나타냅니다.", "C": "VaR는 변동성이 아니라 손실을 %나 금액으로 나타냅니다."}, "orig": "ECO Module 5 Q27"}, {"id": "ECO-M5-Q39", "src": "ECO 오답", "module": 5, "tag": "시나리오 분석: 과거 데이터 의존 X", "vig": 27, "stem": "Are Lee’s comments regarding scenario analysis most likely correct?", "opts": {"A": "Yes", "B": "No, with regard to historical data", "C": "No, with regard to market liquidity"}, "ans": "B", "en": "Correct. Scenario analysis does not need to rely on history, and in this way, it can be free of the volatility and correlation behavior of recent market history, which might not represent current market conditions. Scenarios can be tailored to model a portfolio’s most concentrated positions to experience even greater price movements, allowing liquidity to be taken into account.\nA: Incorrect. Scenario analysis does not need to rely on history and can be free of the volatility and correlation behavior of recent market history.\nC: Incorrect. Scenarios can be tailored to expose a portfolio’s most concentrated positions to experience even greater movements, allowing liquidity to be taken into account.", "ko": "Lee의 '시나리오 분석이 유동성을 더 잘 반영한다'는 맞음(집중 포지션에 더 큰 충격 적용 가능). '시나리오 분석이 VaR보다 과거 데이터에 더 의존한다'는 틀림 → 가상 시나리오는 과거에 의존하지 않아도 되고, 최근 변동성·상관관계에서 자유로울 수 있음.", "trap": "시나리오 분석은 과거에 '의존하지 않아도' 됨.", "f": "", "why": {"A": "과거 데이터 의존에 관한 설명이 틀렸으므로 전부 맞지는 않습니다.", "C": "시나리오를 집중 포지션에 더 큰 충격을 주도록 짜면 유동성을 반영할 수 있어 이 설명은 맞습니다."}, "orig": "ECO Module 5 Q39"}, {"id": "ECO-M5-Q41", "src": "ECO 오답", "module": 5, "tag": "위험 한도 유형 구분", "vig": 27, "stem": "Alexander’s risk management policy for the multi-asset fund is least likely an example of:", "opts": {"A": "risk budgeting.", "B": "scenario limits.", "C": "stop-loss limits."}, "ans": "B", "en": "Correct. Alexander’s policy does not incorporate a scenario limit, which establishes a limit on the estimated loss for a given scenario that, if exceeded, would require corrective action in the portfolio. An example of a scenario limit would be a policy describing an action to take if interest rates increased by 100 bps. The five-day, 1% VaR limit of $10 million is an example of risk budgeting. The initiation of hedges above a certain loss level is an alternative form of a stop-loss limit called drawdown control or portfolio insurance.\nA: Incorrect. The five-day, 1% VaR limit of $10 million is an example of risk budgeting.\nC: Incorrect. The initiation of hedges above a certain loss level is an alternative form of a stop-loss limit called drawdown control or portfolio insurance.", "ko": "Alexander의 정책: 5일 1% VaR 한도 $10M = risk budgeting, 30일 누적 손실이 $15M을 넘으면 헤지 시작·손실이 커질수록 헤지 확대 = stop-loss의 변형(drawdown control/portfolio insurance). 특정 시나리오(예: 금리 100bp 상승)의 손실 한도인 scenario limit은 없음.", "trap": "Scenario limit = '특정 시나리오'에서의 손실 한도.", "f": "", "why": {"A": "VaR 한도($10M)는 risk budgeting의 예입니다.", "C": "손실이 일정 수준을 넘으면 헤지하는 것은 stop-loss의 한 형태(drawdown control)입니다."}, "orig": "ECO Module 5 Q41"}, {"id": "ECO-M5-Q42", "src": "ECO 오답", "module": 5, "tag": "VaR ≠ 손실 상한", "vig": 27, "stem": "Patterson’s comments to Citadel’s investors are least likely accurate with regard to her:", "opts": {"A": "use of confidence levels.", "B": "discussion of limiting losses.", "C": "implied percentage declines from dollar VaR limits."}, "ans": "B", "en": "Correct. VaR is an expression of a minimum loss. It is incorrect for Patterson to state that the policy will limit fund losses to 2% ($10 million/$500 million) over a five-day period. In practice, the maximum loss possible in an unleveraged portfolio is the portfolio’s entire value.\nA: Incorrect. It is appropriate to imply a 1% VaR as a 99% level of confidence.\nC: Incorrect. VaR is often expressed in dollar terms, but it can also be expressed in percentage terms.", "ko": "Patterson이 '손실을 2%로 제한한다'고 한 것이 틀림. VaR는 최소 손실의 표현이지 상한이 아님. 레버리지 없는 포트폴리오의 최대 손실은 포트폴리오 전체 가치.", "trap": "VaR 한도 = '손실 제한'이 아님.", "f": "", "why": {"A": "1% VaR를 99% 신뢰수준으로 표현한 것은 맞습니다.", "C": "$10M/$500M = 2%처럼 금액 VaR를 비율로 바꿔 표현하는 것은 맞습니다."}, "orig": "ECO Module 5 Q42"}, {"id": "ECO-M5-Q48", "src": "ECO 오답", "module": 5, "tag": "경제적 자본 대비 수익률 vs hurdle rate", "vig": 28, "stem": "With respect to capital allocation, which lending group listed in Exhibit 1 is least likely attractive?", "opts": {"A": "Secured", "B": "Cash Flow", "C": "Real Estate"}, "ans": "B", "en": "Correct. From a capital allocation perspective, the Cash Flow lending group is least attractive because its 10% rate of return is below the 11% minimum return (hurdle rate) required for the corporate banking division. The hurdle rate is being used as a risk measure since the $3,000 million aggregate amount of economic capital currently being consumed by the three lending groups exceeds the $2,800 million regulatory amount established for corporate banking. The rate of return is calculated as Portfolio return/Economic capital. The calculation for the Cash Flow group is $120 million/$1,200 million = 10%.\nA: Incorrect. The Secured lending group is not least attractive, because its 15% rate of return ($120 million/$800 million) exceeds the 11% hurdle rate.\nC: Incorrect. The Real Estate lending group is not least attractive, because its 12% rate of return ($120 million/$1,000 million) exceeds the 11% hurdle rate.", "ko": "자본 대비 수익률 = 수익/자본 한도. Secured 120/800 = 15%, Cash Flow 120/1,200 = 10%, Real Estate 120/1,000 = 12%. 사용 자본 합계($3,000M)가 할당 자본($2,800M)을 넘어 hurdle rate 11%가 기준 → 미달인 Cash Flow가 가장 덜 매력적.", "trap": "수익 금액이 같으면 분모(사용 자본)가 가장 큰 그룹의 수익률이 가장 낮음.", "f": "Return on capital = Return / Capital limit", "why": {"A": "Secured의 수익률은 15%로 hurdle rate 11%보다 높습니다.", "C": "Real Estate의 수익률은 12%로 hurdle rate 11%보다 높습니다. 포지션 한도가 가장 작다고 매력이 떨어지는 것은 아닙니다."}, "orig": "ECO Module 5 Q48"}, {"id": "ECO-M5-Q52", "src": "ECO 오답", "module": 5, "tag": "기관 유형별 위험 지표", "vig": 29, "stem": "In Exhibit 1 provided to Axiomada, for which institutional investor type does Muckroth most likely accurately list important risk categories?", "opts": {"A": "Bank", "B": "Hedge fund", "C": "Pension plan"}, "ans": "A", "en": "Correct because the Muckroth team is accurately describing risk considerations facing a bank, which include liquidity gap, VaR, leverage, key rate duration, operational risk capital, and scenario analysis.\nB: Incorrect because hedge funds would not be focused on categories such as tracking error or active shares, which are more traditional asset manager metrics, and instead would be focused on categories such as sensitivities, scenario analysis, gross exposure, and drawdown.\nC: Incorrect because pension plans are less likely to focus on items such as operational risk capital and would include VaR (surplus at risk), interest rate and curve risk, glide path, and liability hedging exposures instead of return-generating exposures.", "ko": "은행: liquidity gap, VaR, leverage, scenario analysis, key rate duration, operational risk capital → 표의 은행 열이 정확. 헤지펀드는 tracking error·active share(전통 운용사 지표) 대신 민감도·gross exposure·drawdown을 봄. 연기금은 operational risk capital 대신 surplus at risk·금리/커브 위험·glide path·부채 헤지 노출을 봄.", "trap": "Active share·tracking error = 전통 운용사. 헤지펀드 = VaR, gross exposure, leverage, drawdown.", "f": "", "why": {"B": "헤지펀드 열에 tracking error와 active share가 표시돼 있는데, 이는 벤치마크가 있는 전통 운용사 지표입니다.", "C": "연기금 열에 operational risk capital이 표시돼 있는데, 연기금은 이것보다 surplus at risk, 부채 헤지 노출 등을 중시합니다."}, "orig": "ECO Module 5 Q52"}, {"id": "ECO-M5-Q56", "src": "ECO 오답", "module": 5, "tag": "VaR 방법별 특징", "vig": null, "stem": "Which of the following statements regarding VaR simulation methods is correct?\nStatement 1: Using the parametric method, an analyst cannot estimate a daily VaR and annualize it to arrive at an annual VaR estimate.\nStatement 2: To obtain a 1% VaR, the parametric VaR simulation method requires multiplying 1.65 by the daily standard deviation of portfolio returns.\nStatement 3: The Monte Carlo simulation VaR method uses historical return and distribution parameters.", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "A", "en": "Correct because under the parametric method, one cannot estimate a daily VaR and annualize it to arrive at an annual VaR estimate. In contrast, the expected return is annualized by multiplying the daily return by 250, and the standard deviation is annualized by multiplying the daily standard deviation by the square root of 250.\nB: Incorrect because under the assumption of a normal distribution, a 1% VaR is 2.33 standard deviations below the expected value of zero. Therefore, Step 1 of the parametric method would be to multiply the portfolio standard deviation by 2.33. Therefore, Statement 2 is incorrect.\nC: Incorrect because neither the Monte Carlo method nor the parametric method focuses on historical outcomes. Therefore, Statement 3 is not correct.", "ko": "Statement 1이 맞음: parametric 방법에서는 일 VaR를 연환산해서 연 VaR를 구할 수 없음 → 일 기대수익률 × 250, 일 표준편차 × √250으로 각각 연환산한 뒤 VaR를 다시 계산해야 함.", "trap": "z값: 5% → 1.65, 1% → 2.33.", "f": "연 μ = 일 μ × 250, 연 σ = 일 σ × √250", "why": {"B": "1% VaR의 z값은 2.33입니다. 1.65는 5% VaR의 z값입니다.", "C": "Monte Carlo는 과거 결과가 아니라 가정한 분포에서 무작위로 생성한 결과를 씁니다. 과거 결과를 쓰는 것은 historical simulation입니다."}, "orig": "ECO Module 5 Q56"}, {"id": "ECO-M5-Q63", "src": "ECO 오답", "module": 5, "tag": "한 번도 없던 극단 사건 → stress test", "vig": null, "stem": "Alessia Rossi is the chief risk officer for Bellotti Bank, which operates in a region dominated by two established industries. Historically, these industries have provided stable employment to the region. Rossi would like to undertake an assessment of how the bank’s loans would perform if the regional economy lost one of these industries. The best choice for this assessment is a(n):", "opts": {"A": "stress test.", "B": "historical scenario analysis.", "C": "analysis of loan portfolio duration."}, "ans": "A", "en": "Correct because a stress test would be appropriate. The region is dominated by two industries that provide stable employment to the region, so the loss of one of these industries would represent an extreme negative event impacting the bank’s loan portfolio. Stress tests apply extreme negative stress to a particular portfolio exposure.\nB: Incorrect because historically, the two established industries have provided stable employment to the region. This suggests that the industries have not failed in the past, therefore a historical scenario analysis will not give an insight as to the effect of one of the industries leaving the region.\nC: Incorrect because an analysis of the bank’s loan portfolio duration would measure the portfolio’s sensitivity to changes in interest rates, rather than identify the impact of an extreme negative event such as the loss of a key industry that provides employment to a region.", "ko": "지역 핵심 산업 하나가 사라지는 것은 과거에 없던 극단적 부정 사건 → 특정 노출에 극단적 충격을 주는 stress test가 적합.", "trap": "과거에 없던 일 → historical scenario 불가 → stress test(가상).", "f": "", "why": {"B": "두 산업은 과거에 계속 안정적이었으므로 참고할 과거 사례가 없어 historical scenario 분석은 쓸 수 없습니다.", "C": "Duration은 금리 민감도라서 핵심 산업 상실 같은 극단적 사건의 영향을 측정하지 못합니다."}, "orig": "ECO Module 5 Q63"}, {"id": "ECO-M5-Q66", "src": "ECO 오답", "module": 5, "tag": "가상 시나리오 분석의 단점", "vig": null, "stem": "Which of the following is a disadvantage of a hypothetical scenario analysis?", "opts": {"A": "It needs to rely on history", "B": "It cannot take liquidity into account", "C": "It may incorrectly specify how assets will co-move"}, "ans": "C", "en": "Correct because some of the limitations of hypothetical scenarios include the potential for incorrectly specifying how assets will co-move, getting the magnitude of movements wrong, and incorrectly adjusting for the effects of liquidity and concentration.\nA: Incorrect because sensitivity and scenario risk measures can be constructed to test the portfolio’s vulnerability to a truly never-before-seen market movement. In this way, they can be free of the volatility and correlation behavior of recent market history, which may simply not be representative of stress conditions. In a scenario analysis, assets that typically have a low correlation with one another can be modeled under an assumption of perfect positive correlation simply by simulating an identical price movement for these assets.\nB: Incorrect because scenarios can be tailored to expose a portfolio’s most concentrated positions to even worse movement than its other exposures, allowing liquidity to be taken into account.", "ko": "가상 시나리오의 한계: 자산들이 함께 움직이는 방식(co-movement)을 잘못 설정하거나, 변동 크기를 틀리거나, 유동성·집중도 효과를 잘못 조정할 수 있음.", "trap": "가상 시나리오 장점 = 과거 비의존·유동성 반영, 단점 = co-movement 설정 오류.", "f": "", "why": {"A": "가상 시나리오는 과거에 의존하지 않아도 됩니다. 이것은 오히려 장점입니다.", "B": "집중 포지션에 더 큰 충격을 주도록 시나리오를 짜면 유동성을 반영할 수 있습니다."}, "orig": "ECO Module 5 Q66"}, {"id": "ECO-M5-Q67", "src": "ECO 오답", "module": 5, "tag": "Position limit", "vig": null, "stem": "Position limits:", "opts": {"A": "take volatility into account.", "B": "are good controls on overconcentration.", "C": "require a reduction in the size of a portfolio when a loss of a particular size occurs in a specified period."}, "ans": "B", "en": "Correct because position limits are limits on the market value of any given investment, or the notional principal amount for a derivatives contract. They can be expressed in currency units or as a percentage of some other value, such as net assets. Position limits do not take into account duration, volatility, and correlation but they are excellent controls on overconcentration.\nA: Incorrect because position limits do not take into account duration, volatility, and correlation. In contrast, VaR does take these factors into account.\nC: Incorrect because stop-loss limits, rather than position limits, requires a reduction in the size of a portfolio, or its complete liquidation, when a loss of a particular size occurs in a specified period.", "ko": "Position limit = 개별 투자의 시장가치(또는 파생상품 명목금액) 한도 → 과도한 집중을 막는 데 탁월. 단, duration·변동성·상관관계는 반영하지 않음.", "trap": "Position limit = 집중 통제, stop-loss = 손실 기준 축소.", "f": "", "why": {"A": "Position limit은 변동성을 반영하지 않습니다. 변동성을 반영하는 것은 VaR입니다.", "C": "일정 손실이 나면 포트폴리오를 줄이는 것은 stop-loss limit입니다."}, "orig": "ECO Module 5 Q67"}, {"id": "VAR-M5-01", "module": 5, "tag": "Delta-gamma 근사", "orig": "변형 (오답노트 R38)", "stem": "A call option has a delta of 0.60 and a gamma of 0.04. If the price of the underlying increases by $5, the approximate change in the call’s value is closest to:", "opts": {"A": "$3.00.", "B": "$3.50.", "C": "$4.00."}, "ans": "B", "en": "Δc ≈ Delta × ΔS + ½ × Gam
