ma × (ΔS)² = 0.60(5) + 0.5(0.04)(25) = 3.00 + 0.50 = $3.50.", "ko": "Δc ≈ Delta × ΔS + ½ × Gamma × (ΔS)² = 0.6 × 5 + 0.5 × 0.04 × 25 = 3.00 + 0.50 = $3.50. 채권의 −D·Δy + ½·C·(Δy)²와 같은 구조.", "why": {"A": "$3.00은 delta만 쓴 1차 근사입니다. 큰 변화에서는 gamma 항을 더해야 합니다.", "C": "$4.00은 gamma 항에서 ½을 빠뜨린 값입니다."}, "trap": "Gamma 항에 ½과 (ΔS)²를 빠뜨리지 말 것.", "f": "Δc ≈ Δ·ΔS + ½·Γ·(ΔS)²", "src": "변형", "vig": null}, {"id": "VAR-M5-02", "module": 5, "tag": "옵션 매도 전략 = tail risk ↑", "orig": "변형 (ECO M5 지문, 오답노트 R38)", "stem": "Which of the following strategies most likely has the greatest tail risk?", "opts": {"A": "A long–short equity fund targeting an equity beta of 0.2", "B": "A long-only options strategy that buys calls and puts on a short-term basis", "C": "An income strategy that holds long credit positions and sells insurance and writes options to earn premium income"}, "ans": "C", "en": "Strategies that sell insurance or write options collect premium income in normal times but are exposed to large losses in extreme market events, giving them high tail risk. Buying options limits the maximum loss to the premium paid.", "ko": "보험·옵션 '매도' 전략은 평소에 프리미엄을 받지만 극단적 상황에서 큰 손실 → tail risk 최대. 옵션 '매수'는 최대 손실이 프리미엄으로 한정.", "why": {"A": "시장 베타가 0.2로 낮은 롱숏 전략은 시장 급락에 대한 노출이 제한적입니다.", "B": "옵션 매수 전략은 최대 손실이 지급한 프리미엄으로 한정됩니다."}, "trap": "프리미엄 수취(매도) = 작은 이익 + 큰 꼬리 손실.", "f": "", "src": "변형", "vig": null}, {"id": "VAR-M5-03", "module": 5, "tag": "Surplus at risk (연기금)", "orig": "변형 (ECO M5 Q7 지문, 오답노트 R38)", "stem": "A defined benefit pension plan wants to estimate, with 95% confidence over one year, how much its assets could underperform its liabilities. The most appropriate measure is:", "opts": {"A": "conditional VaR.", "B": "surplus at risk.", "C": "incremental VaR."}, "ans": "B", "en": "Surplus at risk is a VaR measure applied to the surplus (assets minus liabilities). It estimates how much assets might underperform liabilities with a given confidence over a given horizon and is used by defined benefit pension plans.", "ko": "Surplus at risk = 잉여(자산 − 부채)에 VaR를 적용 → 일정 신뢰수준·기간에서 자산이 부채보다 얼마나 덜 오를 수 있는지 측정. 확정급여형 연기금이 사용.", "why": {"A": "CVaR는 VaR를 넘는 손실의 기대값(tail loss)으로, 부채를 고려하지 않습니다.", "C": "Incremental VaR는 포지션을 추가·제거·변경할 때 VaR가 얼마나 바뀌는지를 봅니다."}, "trap": "자산 vs 부채 = surplus at risk.", "f": "Surplus = Assets − Liabilities", "src": "변형", "vig": null}, {"id": "VAR-M5-04", "module": 5, "tag": "Parametric 금액 VaR 계산", "orig": "변형 (ECO M5 지문, 오답노트 R38)", "stem": "A $500 million portfolio has a daily expected return of 0.04% and a daily standard deviation of 1.30%. Using the parametric method, the 5% one-day VaR is closest to:", "opts": {"A": "$10.5 million.", "B": "$10.7 million.", "C": "$15.1 million."}, "ans": "A", "en": "5% VaR = 1.65 × 1.30% − 0.04% = 2.145% − 0.04% = 2.105%. Dollar VaR = 2.105% × $500 million ≈ $10.5 million.", "ko": "5% VaR = 1.65 × 1.30% − 0.04% = 2.105% → 2.105% × $500M ≈ $10.5M.", "why": {"B": "$10.7M은 기대수익률(0.04%)을 빼지 않은 값입니다(1.65 × 1.30% = 2.145%).", "C": "$15.1M은 1% VaR의 z값(2.33)을 쓴 값입니다."}, "trap": "5% → 1.65, 1% → 2.33. 기대수익률을 빼는 것도 잊지 말 것.", "f": "VaR = (z·σ − μ) × 포트폴리오 가치", "src": "변형", "vig": null}, {"id": "ECO-M6-Q5", "src": "ECO 오답", "module": 6, "tag": "비정규 분포 → sensitivity analysis", "vig": 30, "stem": "Based on the statistical study performed by GWP, which of the following represents a suggested course of action if GWP were to conduct Monte Carlo simulation analyses on the factor strategies?", "opts": {"A": "Inverse transformation", "B": "Bootstrapping", "C": "Sensitivity analysis"}, "ans": "C", "en": "C is correct. Performing sensitivity analysis represents best practice given these characteristics, because the user could test different probability distributions that relax the assumptions of the normal distribution, for example.\nA is incorrect. Inverse transformation is a method of random observation generation, often used in simulation.\nB is incorrect. Bootstrapping refers to random sampling with replacement, often used in historical simulation.", "ko": "Value·momentum 요인 수익률이 비정규(음의 왜도, 초과 첨도, tail dependence) → Monte Carlo 결과는 가정한 분포에 좌우되므로, 다른 분포(예: skewed t)로 바꿔 다시 돌려보는 sensitivity analysis가 모범 사례.", "trap": "Monte Carlo + 비정규 분포 → 분포를 바꿔 재실행(sensitivity analysis).", "f": "", "why": {"A": "Inverse transformation은 시뮬레이션에서 난수 관측치를 생성하는 방법일 뿐, 비정규성 문제에 대한 대응이 아닙니다.", "B": "Bootstrapping(복원 추출)은 historical simulation에서 쓰는 방법입니다."}, "orig": "ECO Module 6 Q5"}, {"id": "ECO-M6-Q7", "src": "ECO 오답", "module": 6, "tag": "Data snooping (selection bias)", "vig": 30, "stem": "The approach used by Fastlane Wealth Managers most likely incorporates:", "opts": {"A": "risk parity.", "B": "data snooping.", "C": "cross-validation."}, "ans": "B", "en": "B is correct. The fact that the two firms’ investment performance results differ over similar time horizons using the same data and factors may be the result of selection bias. Data snooping is a type of selection bias. Fastlane Wealth Managers is most likely selecting the best-performing modeling approach and publishing its results (i.e., data snooping).\nA is incorrect because risk parity is a portfolio construction technique that accounts for the volatility of each factor and the correlations of returns among all factors to be combined in the portfolio. It is not regarded as selection bias.\nC is incorrect because cross-validation is a technique used in the machine learning field, as well as in backtesting investment strategies, to partition data for model training and testing. It is not considered selection bias.", "ko": "Fastlane은 수천 번 백테스트한 뒤 성과가 가장 좋은 전략만 골라 보여줌 → data snooping(selection bias의 일종).", "trap": "'최고 성과만 선택' = data snooping. 해결책은 cross-validation.", "f": "", "why": {"A": "Risk parity는 요인별 변동성과 상관관계를 고려해 위험을 균등하게 배분하는 포트폴리오 구성 방법이라 selection bias가 아닙니다.", "C": "Cross-validation은 데이터를 학습용과 검증용으로 나눠 data snooping을 '줄이는' 기법입니다."}, "orig": "ECO Module 6 Q7"}, {"id": "ECO-M6-Q8", "src": "ECO 오답", "module": 6, "tag": "체제별 Sharpe ratio 비교", "vig": 30, "stem": "Comparing the two strategies in Exhibit 2, the best risk-adjusted performance is demonstrated by:", "opts": {"A": "Strategy II in periods of low volatility and recession.", "B": "Strategy I in periods of high volatility and non-recession.", "C": "Strategy II in periods of high volatility and non-recession."}, "ans": "A", "en": "A is correct. Using the Sharpe ratio, the best risk-adjusted relative performance can be determined by comparing the sensitivity of the two strategies under differing macroeconomic regimes: recession versus non-recession and high volatility versus low volatility. The best risk-adjusted return will exhibit the highest Sharpe ratio. Strategy II demonstrates higher risk-adjusted returns compared with Strategy I under all four macroeconomic conditions, particularly in periods of low volatility, when the Sharpe ratio outperformance is 0.96, and recessions, when the Sharpe ratio outperformance is 1.56.", "ko": "Strategy II − Strategy I의 Sharpe ratio 차이: 고변동성 0.68, 저변동성 0.96, 침체 1.56, 비침체 0.52. Strategy II가 모든 체제에서 우월하고, 특히 저변동성·침체기에 차이가 가장 큼.", "trap": "'best risk-adjusted performance' = 상대 우위가 가장 큰 체제를 찾는 문제.", "f": "Sharpe = (R − Rf)/σ", "why": {"B": "Strategy I은 모든 체제에서 Strategy II보다 Sharpe ratio가 낮습니다.", "C": "Strategy II가 우월하긴 하지만, 고변동성(0.68)·비침체(0.52)는 우위 폭이 가장 작은 체제입니다."}, "orig": "ECO Module 6 Q8"}, {"id": "ECO-M6-Q15", "src": "ECO 오답", "module": 6, "tag": "Historical simulation: bootstrapping", "vig": 31, "stem": "To address Concern 3 when designing Approach 1, Yuen should:", "opts": {"A": "add monthly return observations to the dataset using interpolation.", "B": "randomly sample from the historical returns with replacement.", "C": "choose the multivariate normal distribution as the initial functional form."}, "ans": "B", "en": "B is correct. Random sampling with replacement, also known as bootstrapping, is often used in historical simulations because the number of simulations needed is often larger than the size of the historical dataset. Because Approach 1 is a historical simulation and Concern 3 notes that the number of simulations needed is larger than the size of the historical dataset, bootstrapping should be used.\nA is incorrect because this approach would result in creating observations that do not exist in the historical record. Doing so would violate the assumption and procedures of historical simulation.\nC is incorrect because choosing the multivariate normal distribution as the initial functional form is typically done in a Monte Carlo simulation (Approach 2), not in a historical simulation (Approach 1). Historical simulation randomly samples from the historical dataset by drawing a number from a uniform distribution so that there is equal probability of being selected. Choice of distribution would not address the concern about the size of the dataset.", "ko": "Historical simulation(Approach 1)에서 필요한 시뮬레이션 수가 과거 데이터 수보다 많으면 → 과거 수익률에서 복원 추출(bootstrapping).", "trap": "Historical = 과거 데이터 재표본(복원 추출), Monte Carlo = 분포 지정 후 생성.", "f": "", "why": {"A": "보간으로 관측치를 만들면 과거에 없던 데이터가 생겨 historical simulation의 전제에 어긋납니다.", "C": "다변량 정규분포를 초기 함수 형태로 고르는 것은 Monte Carlo(Approach 2)의 단계입니다."}, "orig": "ECO Module 6 Q15"}, {"id": "ECO-M6-Q16", "src": "ECO 오답", "module": 6, "tag": "분포 바꿔 재실행 = sensitivity analysis", "vig": 31, "stem": "The process Ruckey suggests to better understand how the performance of Portfolios A and B using Approach 2 is affected by the distribution of Factor 1 returns is best described as:", "opts": {"A": "data snooping.", "B": "sensitivity analysis.", "C": "inverse transformation."}, "ans": "B", "en": "B is correct. Sensitivity analysis can be implemented to help managers understand how the target variable (portfolio returns) and risk profiles are affected by changes in input variables. Approach 2 is a Monte Carlo simulation, and the results depend on whether the multivariate normal distribution is the correct functional form or a reasonable proxy for the true distribution. Because this information is almost never known, sensitivity analysis using a multivariate skewed Student’s t-distribution helps to account for empirical properties such as the skewness and the excess kurtosis observed in the underlying factor return data.\nA is incorrect. Data snooping is the subconscious or conscious manipulation of data in a way that produces a statistically significant result (i.e., a p-value that is sufficiently small or a t-statistic that is sufficiently large to indicate statistically significance).\nC is incorrect. The inverse transformation method is the process of converting a randomly generated number into a simulated value of a random variable.", "ko": "Monte Carlo 결과는 가정한 분포(다변량 정규)가 맞는지에 달려 있음 → skewed Student's t 분포로 다시 시뮬레이션해 결과가 어떻게 변하는지 보는 것 = sensitivity analysis(왜도·초과 첨도 반영).", "trap": "입력 가정(분포)을 바꿔 결과 변화를 봄 = sensitivity analysis.", "f": "", "why": {"A": "Data snooping은 유의한 결과가 나올 때까지 데이터를 반복 분석하는 것입니다.", "C": "Inverse transformation은 난수 생성 기법일 뿐입니다."}, "orig": "ECO Module 6 Q16"}, {"id": "ECO-M6-Q18", "src": "ECO 오답", "module": 6, "tag": "밀도 그래프가 평평 → 표준편차 ↑", "vig": null, "stem": "When performing a historical scenario analysis, an investor analyzes the probability density plot of a strategy's returns and observes that it is flatter in a non-recession environment compared to a recession environment. All else equal, this implies that during times of non-recession, the return distribution has:", "opts": {"A": "negative skewness.", "B": "fewer extreme outcomes.", "C": "a higher standard deviation."}, "ans": "C", "en": "Correct because when the distribution of returns is flatter in a non-recession environment, it implies that extreme outcomes are more likely to occur during the non-recession regime. Since the dispersion of returns can be described by standard deviation, the returns have a higher standard deviation during times of non-recession.\nA: Incorrect because the observation of a flatter distribution can imply fatter tails but, without further information, the investor would unlikely be able to make inferences regarding changes in the level of skewness during the non-recession regime.\nB: Incorrect because the flatter distribution in the non-recession regime implies fatter tails of the return distribution. Fatter tails means that extreme outcomes are more likely to occur in the non-recession regime than in the recession regime.", "ko": "확률밀도 그래프가 더 평평함 = 수익률이 넓게 퍼짐 = 극단 결과가 더 자주 나옴 → 비침체기의 표준편차가 더 큼.", "trap": "평평한 분포 = 분산 큼, 뾰족한 분포 = 분산 작음.", "f": "", "why": {"A": "평평한 분포만으로는 왜도(비대칭) 변화를 알 수 없습니다.", "B": "평평할수록 꼬리가 두꺼워 극단 결과가 '더 많이' 나옵니다."}, "orig": "ECO Module 6 Q18"}, {"id": "ECO-M6-Q21", "src": "ECO 오답", "module": 6, "tag": "백테스트 단계: 결과 분석", "vig": null, "stem": "Identification of downside risk and structural breaks most likely occurs during which of the following steps of the backtesting process?", "opts": {"A": "Strategy design", "B": "Analysis of backtesting output", "C": "Historical investment simulation"}, "ans": "B", "en": "Correct because in the analysis of backtesting output step, it is useful to examine the backtested cumulative performance of an investment strategy over an extended history. Using these cumulative performance graphs, one can readily identify downside risk, performance decay, and structural breaks.\nA: Incorrect because the identification of downside risk and structural breaks is part of the analysis of backtesting output step, not the strategy design step.\nC: Incorrect because the identification of downside risk and structural breaks is part of the analysis of backtesting output step, not the historical investment simulation step.", "ko": "하방 위험, 성과 감소, 구조적 변화(structural break)는 백테스트 결과 분석 단계에서 장기 누적 성과 그래프를 보며 확인.", "trap": "설계 → 시뮬레이션(생성) → 결과 분석(하방 위험·구조적 변화 확인).", "f": "", "why": {"A": "전략 설계 단계는 투자 가설과 목표를 정하는 단계입니다.", "C": "과거 투자 시뮬레이션 단계는 데이터를 넣어 리밸런싱하며 결과를 '생성'하는 단계이고, 결과 해석은 그다음 단계입니다."}, "orig": "ECO Module 6 Q21"}, {"id": "ECO-M6-Q23", "src": "ECO 오답", "module": 6, "tag": "Monte Carlo: 모수 추정(calibration)", "vig": null, "stem": "The Monte Carlo simulation method:", "opts": {"A": "uses regression and distribution-fitting techniques to estimate distributional parameter inputs.", "B": "employs bootstrapping so that the number of simulations is independent of the size of the historical dataset.", "C": "requires the decision whether to sample from the record of past returns with replacement or without replacement."}, "ans": "A", "en": "Correct because with Monte Carlo simulation, regression and distribution-fitting techniques are used to estimate the parameters (i.e., mean, standard deviation, skewness, kurtosis) underlying the statistical distributions of the key decision variables. This step is typically called model calibration.\nB: Incorrect because with bootstrapping, which relates to the historical simulation method, the number of simulations needed is often larger than the size of the historical dataset. By contrast, in Monte Carlo simulation, each key variable is assigned a statistical distribution, and observations are drawn at random from the assigned distribution.\nC: Incorrect because with bootstrapping, random sampling is done with replacement only.", "ko": "Monte Carlo에서는 회귀·분포 적합으로 핵심 변수 분포의 모수(평균·표준편차·왜도·첨도)를 추정함(model calibration).", "trap": "Bootstrapping = historical simulation, 항상 복원 추출.", "f": "", "why": {"B": "Bootstrapping은 historical simulation의 방법입니다. Monte Carlo는 지정한 분포에서 관측치를 생성합니다.", "C": "Bootstrapping은 항상 '복원' 추출만 씁니다. 복원/비복원을 고르는 단계는 없습니다."}, "orig": "ECO Module 6 Q23"}, {"id": "ECO-M6-Q25", "src": "ECO 오답", "module": 6, "tag": "백테스트에서 거래비용 무시 X", "vig": null, "stem": "A fund manager backtests a strategy of adding non-domestic equities to a domestic portfolio, with a goal of enhancing the portfolio's Sharpe ratio. Transaction costs for non-domestic equities are similar to domestic equities, and no foreign currency hedging is planned. If historical data is available as of 1980, which of the following decisions in the backtest design is not appropriate?", "opts": {"A": "Transaction costs of the new strategy will be ignored", "B": "Use a historical scenario analysis for a backtesting window from 1980", "C": "The Sharpe ratio will be computed by translating all investment returns into the domestic currency"}, "ans": "A", "en": "Correct because with backtesting, consideration of transaction costs is critical, because many market anomalies simply disappear once they are included.\nB: Incorrect because it would be appropriate to use historical scenario analysis for the extensive back testing window dating back to 1980. All else equal, investment managers prefer to backtest investment strategies using as long a history as possible, because a larger sample imparts greater statistical confidence in the results.\nC: Incorrect because it would be appropriate for the fund manager to translate all investment returns into the domestic currency given that the fund manager is not hedging the foreign currency exposure.", "ko": "백테스트에서는 거래비용 반영이 매우 중요 → 비용을 넣으면 사라지는 시장 이상현상이 많음. 거래비용을 무시하는 결정이 부적절.", "trap": "해외·국내 거래비용이 비슷해도 '비용 자체'는 반영해야 함.", "f": "", "why": {"B": "가능한 한 긴 기간(1980년부터)을 쓰는 것은 표본이 커져 통계적 신뢰도가 높아지므로 적절합니다.", "C": "환헤지를 하지 않으므로 모든 수익률을 자국 통화로 환산해 Sharpe ratio를 계산하는 것이 적절합니다."}, "orig": "ECO Module 6 Q25"}, {"id": "ECO-M6-Q26", "src": "ECO 오답", "module": 6, "tag": "t-분포: 왜도·초과 첨도 반영", "vig": null, "stem": "An analyst uses Monte Carlo simulation to measure Conditional Value at Risk (CVaR) on a model that is calibrated to a multivariate Student’s t-distribution. The model is complex and several factors have limited historical data. The model most likely has:", "opts": {"A": "low estimation error.", "B": "high specification error.", "C": "the ability to accommodate skewness and excess kurtosis in factor return data."}, "ans": "C", "en": "Correct because the analyst has specified a multivariate Student’s t-distribution for the model. The (multivariate) Student’s t-distribution is a natural extension of the multivariate normal distribution, because it has the ability to account for the skewness and the excess kurtosis often observed in factor and asset return data.\nA: Incorrect because the model is complex and has limited historical data, so the model is likely to have high [not low] estimation error. Given limited historical data, an analyst may be unable to estimate all the underlying parameters with sufficient precision. Such models tend to have low specification errors, but they suffer from large estimation errors.\nB: Incorrect because high specification error can arise when the model is overly simplistic (not complex). Overly simplistic models require fewer parameters (therefore, they might have low estimation errors), but they may not fit the data well (because they are mis-specified).", "ko": "다변량 Student's t 분포는 정규분포의 확장으로, 요인·자산 수익률에서 자주 보이는 왜도와 초과 첨도를 반영할 수 있음.", "trap": "복잡한 모형: specification error ↓, estimation error ↑. 단순한 모형은 반대.", "f": "", "why": {"A": "모형이 복잡하고 과거 데이터가 적어 추정할 모수가 많으므로 estimation error는 '높습니다'.", "B": "Specification error는 지나치게 단순한 모형에서 큽니다. 복잡한 모형은 specification error가 낮습니다."}, "orig": "ECO Module 6 Q26"}, {"id": "ECO-M6-Q32", "src": "ECO 오답", "module": 6, "tag": "체제별 Sharpe ratio 계산", "vig": null, "stem": "An analyst is using historical scenario analysis to assess the performance of an investment strategy in different environments. The results of the analysis for both the benchmark and the strategy portfolios are presented in the table below. The average risk-free rate is 2.0%.\n\tRecession: Benchmark\tRecession: Strategy\tExpansion: Benchmark\tExpansion: Strategy\nReturn (%)\t4.0\t4.8\t11.5\t12.5\nStandard deviation (%)\t3.5\t1.2\t7.5\t4.5\n\tLow Vol: Benchmark\tLow Vol: Strategy\tHigh Vol: Benchmark\tHigh Vol: Strategy\nReturn (%)\t6.5\t7.5\t14.2\t15.6\nStandard deviation (%)\t3.1\t5.5\t9.1\t8.9\nWith regard to the Sharpe ratio, the strategy:", "opts": {"A": "performs similarly in a recession and in an expansion.", "B": "underperforms the benchmark in an expansionary environment.", "C": "outperforms the benchmark in both low volatility and high volatility environments."}, "ans": "A", "en": "Correct because in both the recession and expansion environments, the Sharpe ratio for strategy remains constant at 2.33. In addition, the strategy outperforms the benchmark in recession and expansion environments. The Sharpe ratio = (Return – Risk free rate)/Standard deviation.\nB: Incorrect because in an expansionary environment, the strategy outperformed the benchmark with a Sharpe ratio of 2.33, compared to the benchmark's Sharpe ratio of 1.27. The Sharpe ratio = (Return – Risk free rate)/Standard deviation.\nC: Incorrect because in a low volatility environment, the strategy, with a Sharpe ratio of 1.00, does not outperform the benchmark, with a Sharpe ratio of 1.45. The Sharpe ratio = (Return – Risk free rate)/Standard deviation. The strategy does outperform, however, in a high volatility environment.", "ko": "전략 Sharpe: 침체 (4.8 − 2)/1.2 = 2.33, 확장 (12.5 − 2)/4.5 = 2.33 → 두 환경에서 같음. 벤치마크: 침체 0.57, 확장 1.27. 저변동성: 벤치마크 1.45 vs 전략 1.00, 고변동성: 벤치마크 1.34 vs 전략 1.53.", "trap": "수익률만 보면 전략이 항상 높지만, Sharpe는 저변동성에서 역전.", "f": "Sharpe = (R − Rf)/σ", "why": {"B": "확장기 전략 Sharpe(2.33)는 벤치마크(1.27)보다 높아 오히려 우월합니다.", "C": "저변동성에서는 전략(1.00)이 벤치마크(1.45)보다 낮습니다. 고변동성에서만 우월합니다."}, "orig": "ECO Module 6 Q32"}, {"id": "ECO-M6-Q33", "src": "ECO 오답", "module": 6, "tag": "Monte Carlo: 변수마다 분포 지정", "vig": null, "stem": "Monte Carlo simulation:", "opts": {"A": "randomly selects returns from various historical periods.", "B": "involves assigning each key variable a statistical distribution.", "C": "assumes that past asset returns provide guidance about future asset returns."}, "ans": "B", "en": "Correct because in Monte Carlo simulation, each key variable is assigned a statistical distribution, and observations are drawn at random from the assigned distribution. The Monte Carlo approach is popular because it is highly flexible; an array of different distributions can be used across a variety of key variables.\nA: Incorrect because in historical (and not Monte Carlo) simulation, results are constructed by selecting returns at random from many different historical periods (windows) without regard to time-ordering.\nC: Incorrect because historical (and not Monte Carlo) simulation assumes that past asset returns provide guidance about future asset returns. An important issue with historical simulation is that the data are limited to historical observations, which may not represent the future. This deficiency can be addressed with Monte Carlo simulation.", "ko": "Monte Carlo는 핵심 변수마다 통계 분포를 지정하고 그 분포에서 무작위로 관측치를 뽑음 → 유연성이 높음.", "trap": "과거 데이터 재표본 = historical, 분포 지정 = Monte Carlo.", "f": "", "why": {"A": "여러 과거 기간에서 수익률을 무작위로 고르는 것은 historical simulation입니다.", "C": "과거 수익률이 미래에 대한 지침이 된다고 가정하는 것은 historical simulation입니다."}, "orig": "ECO Module 6 Q33"}, {"id": "ECO-M6-Q36", "src": "ECO 오답", "module": 6, "tag": "Data snooping 해결: cross-validation", "vig": null, "stem": "Data snooping is best mitigated by:", "opts": {"A": "performing cross-validation.", "B": "employing point-in-time data.", "C": "using revised macroeconomic data."}, "ans": "A", "en": "Correct because cross-validation is a technique to detect and mitigate data snooping by partitioning the dataset into training data and testing data (i.e., “validation data”) and testing a model built from the training data on the validation data. Cross-validation splits data into two sets, such as different geographic regions or time periods, and then tests one set against the other to confirm the validity of an inference.\nB: Incorrect because point-in-time data are used to mitigate survivorship bias, not data snooping. Point-in-time data provide complete data for a previous time period, thus including all companies in existence at the time. But this does not prevent overworking the data until an apparently successful strategy appears, which is the definition of data snooping.\nC: Incorrect because data revisions are a problem related to look-ahead bias, not data snooping. Look-ahead bias involves using data for a backtest that was unknown at the time. But revised data does not prevent excessive backtesting in order to find a strategy that appeared to outperform.", "ko": "Cross-validation: 데이터를 학습용과 검증용(다른 지역·기간)으로 나누고, 학습 데이터로 만든 모형을 검증 데이터로 테스트 → data snooping 탐지·완화.", "trap": "Survivorship → point-in-time, look-ahead → 보고 지연·point-in-time, data snooping → cross-validation.", "f": "", "why": {"B": "Point-in-time 데이터는 survivorship bias(및 look-ahead bias)의 해결책입니다.", "C": "수정된 거시 데이터를 쓰는 것은 look-ahead bias를 일으키는 원인입니다."}, "orig": "ECO Module 6 Q36"}, {"id": "VAR-M6-01", "module": 6, "tag": "Look-ahead bias", "orig": "변형 (오답노트 R39)", "stem": "An analyst backtests a strategy using quarterly GDP figures as they were later revised, rather than the figures initially reported. The backtest most likely suffers from:", "opts": {"A": "survivorship bias.", "B": "look-ahead bias.", "C": "data snooping."}, "ans": "B", "en": "Look-ahead bias occurs when a backtest uses information that was not available at the time of the investment decision, such as later-revised macroeconomic data or financial statements not yet reported. It is mitigated with point-in-time data and reporting lag assumptions.", "ko": "투자 결정 시점에 알 수 없었던 정보(나중에 수정된 거시 데이터, 아직 발표 전인 재무제표)를 쓰는 것 = look-ahead bias. 해결: point-in-time 데이터, 보고 지연 가정.", "why": {"A": "Survivorship bias는 지금까지 살아남은 종목만 분석에 넣는 문제입니다.", "C": "Data snooping은 여러 모형을 백테스트해 가장 좋은 결과만 고르는 문제입니다."}, "trap": "'당시에 몰랐던 정보' = look-ahead.", "f": "", "src": "변형", "vig": null}, {"id": "VAR-M6-02", "module": 6, "tag": "Survivorship bias 해결", "orig": "변형 (오답노트 R39)", "stem": "A backtest of a value strategy uses only the stocks that are in the index today. The bias this introduces is best mitigated by:", "opts": {"A": "performing cross-validation.", "B": "using point-in-time data that include all securities that existed at each date.", "C": "requiring a higher critical t-statistic."}, "ans": "B", "en": "Using only current index members introduces survivorship bias. It is mitigated by using point-in-time data that include all securities that existed at each historical date, including those later delisted.", "ko": "현재 지수 구성 종목만 쓰면 survivorship bias → 각 시점에 존재했던 모든 종목(이후 상장폐지된 종목 포함)을 담은 point-in-time 데이터로 해결.", "why": {"A": "Cross-validation은 data snooping의 해결책입니다.", "C": "더 높은 t-통계량 기준도 data snooping 대응책입니다."}, "trap": "Survivorship → point-in-time, data snooping → cross-validation·높은 t 기준.", "f": "", "src": "변형", "vig": null}, {"id": "VAR-M6-03", "module": 6, "tag": "정규분포 vs t-분포", "orig": "변형 (오답노트 R39)", "stem": "Compared with a multivariate Student’s t-distribution, a key advantage of using a multivariate normal distribution in a Monte Carlo simulation is that the normal distribution:", "opts": {"A": "captures excess kurtosis in factor returns.", "B": "requires fewer parameters to estimate.", "C": "has lower specification error."}, "ans": "B", "en": "The multivariate normal distribution can be estimated with fewer parameters, which reduces estimation error. However, it cannot capture the skewness and excess kurtosis often observed in factor returns, so it may suffer from higher specification error than the Student’s t-distribution.", "ko": "정규분포는 추정할 모수가 적어 estimation error가 낮음. 하지만 왜도·초과 첨도를 반영하지 못해 specification error는 t-분포보다 큼.", "why": {"A": "초과 첨도를 반영하는 것은 t-분포의 장점입니다.", "C": "정규분포는 실제 수익률의 fat tail을 반영하지 못해 specification error가 '더 큽니다'."}, "trap": "단순 모형(정규): estimation error ↓, specification error ↑.", "f": "", "src": "변형", "vig": null}], "vignettes": ["Julie Carlisle is a financial planner at a large wealth management firm. One of her clients, Esteban Blake, just received a sizable inheritance. He invests a portion of the inheritance in an annuity that will immediately increase his income by a substantial amount. He enlists Carlisle’s help to invest the remaining amount of the inheritance.\nBlake informs Carlisle that he would like some short-term bonds in his portfolio. Carlisle proposes purchasing a one-year domestic government zero-coupon bond. It has a face value of $100 and is currently priced at $96.37. Carlisle estimates the one-year real risk-free rate at 1.15% and expects inflation over the next year to be 2.25%.\nIn an effort to provide Blake with some exposure to international markets, Carlisle proposes three countries to look for investment opportunities. Selected data on the three countries are presented in Exhibit 1.\nExhibit 1\nSelected Macroeconomic Data\n\tNominal GDP Growth\tInflation Rate\tVolatility of Real GDP Growth\tYield Curve Shape\tTrailing 12-Month Equity Index P/E\nCountry #1\t6.5%\t4.0%\tLow\tFlat\t16.5\nCountry #2\t5.0%\t2.5%\tHigh\tUpward slope\t17.3\nCountry #3\t3.5%\t2.0%\tLow\tFlat\t18.2\nIn her analysis, Carlisle observes that the spread between the three-year default-free nominal bond and the default-free real zero-coupon bond in Country #3 is 2.0%.\nBlake expresses concern that stocks may be currently overvalued in Country 3 given its 20-year historical equity index P/E of 16.0. Carlisle comments,\nI think the equilibrium P/E in Country #3 has increased because of changes in market conditions.\nCarlisle predicts that Country #3 will slip into a recession next quarter. She thinks it will be short-lived, lasting only 12 months or so, and considers the impact of such a recession on the performance of the country’s stocks and bonds.\nExhibit 2\nThree-Year Corporate Bonds from Country #3\nCorporate Bond\tMoody’s Investors Service Rating\tSpread*\nBond A\tAaa\t1.4%\nBond B\tBaa1\t3.2%\nBond C\tB3\t5.3%\n*Spread versus three-year sovereign bond", "Liam Ferguson works as an equity portfolio manager for Antrim Capital Partners, a wealth management firm located in Belfast, Northern Ireland. Antrim specializes in managing equity and commercial real estate portfolios for institutional investors throughout Europe.\nJoanne Donaghy, a representative of a large investment consulting firm, is considering recommending Antrim to institutional clients. As part of her due diligence, Donaghy is engaged in discussions with members of Antrim’s investment team, including Ferguson. She asks Ferguson to explain how Antrim’s process considers the relationship between the business cycle and earnings growth expectations. Ferguson makes the following observations:\nObservation 1:\n“Toward the end of a recession, corporate profit growth increases, resulting in a negative risk premium.”\nObservation 2:\n“The earnings of cyclical companies are considered a leading indicator for broader economic growth.”\nObservation 3:\n“During recessions, equities offer a good hedge against bad consumption outcomes.”\nFerguson describes how Antrim assesses overall market valuations using several measures, including the market P/E multiple. Ferguson describes changes in factors that could impact valuations and contribute to higher P/E multiples, including an increase in the equity risk premium, decreasing volatility of real GDP growth, and an increase in uncertainty regarding future inflation.\nDonaghy is interested in understanding Antrim’s approach to commercial real estate investing. As part of her diligence, she speaks with Colleen McKenna, head of Antrim’s real estate team. Donaghy asks McKenna for her view on the role of commercial real estate in diversified portfolios. McKenna responds that commercial real estate investments have both equity- and bond-like characteristics. She further explains, “From a bond-like perspective, rental income can be viewed as analogous to the coupon income derived from a bond, especially in countries with “upward only” restrictions that help protect property owners. Changes in property values resulting from the state of the underlying economy and any redevelopment opportunities provide an equity-like dimension to the investment.”\nMcKenna decides to walk Donaghy through a pricing example of the commercial properties in the portfolio to understand the pricing dynamics of this market. She explains that the fundamental present value formula can be applied to commercial real estate: “The numerator of the present value formula is comprised of the sum of future expected rent payments. The denominator reflects a discount rate that can vary depending on type of tenant and lease structure. For example, the discount rate for a property leased to a developed market government tenant paying rent indexed to inflation would reflect the real default-free rate, a risk premium for the uncertainty of the property value at the end of the lease, and a risk premium for the illiquidity of the property. If this property were instead leased to a commercial tenant paying fixed-rate nominal rent, the discount rate would also reflect expected future inflation, a risk-premium for future inflation uncertainty, and a risk premium for credit risk.”", "Jose Ramires and Antonio Gomes are analysts at Global Economic Research Affiliates (GERA), an economic research firm. GERA focuses on providing research and investment recommendations to the global asset management community. Ramires and Gomes are reviewing Countries A, B, and C for possible investment.\nThey discuss the role that economic news has in adjusting market valuations. Ramires provides the example of economic data that were recently released on Country B's economy. The most recent report showed that quarterly GDP declined at a 2.5% annualized rate. This was relative to market expectations of a 3.2% decline. Ramires discusses the immediate impact of the release of Country B's GDP report on the credit spreads of Country B's government bonds.\nGERA forecasts that Country A and Country C will experience the same long-term real GDP growth rate, which is significantly higher than the growth rate estimate for Country B. GERA's expectations are that Country A and Country B will have similar levels of volatility of real GDP growth, with volatility expected to be significantly higher than that of Country C.\nMaria Silva is an equity strategist at GERA. Silva believes it is important to study the relationships between economic cycles and corporate earnings, and she has made the following observations:\nObservation 1:\nCorporate profitability tends to be a lagging indicator of the business cycle and improvements are not typically evident until a recovery is well underway.\nObservation 2:\nAn understanding of the business cycle is more important for making earnings projections over the long term than the short term.\nObservation 3:\nDurable goods manufacturers have much more volatile earnings profiles than non-durable goods manufacturers because of the dramatic shifts in economic cycle-related demand.\nGERA also offers a corporate bond research service designed to identify attractive industries for fixed-income investment based on economic cycles. GERA is currently forecasting a period of above-consensus growth.", "Andrew Rutherford is a fixed-income analyst with Quantum Credit Advisers, an institutional investment management company. Quantum offers a variety of fixed-income oriented investment strategies, including a core-plus-bond strategy as well as a popular long–short credit hedge fund. Rutherford participates in Quantum’s weekly fixed-income committee meetings.\nA macro topic for this week’s fixed-income committee is the possibility that the US Federal Reserve Board (Fed) will raise the federal funds rate (FFR) 25 bps at their next meeting. Quantum’s committee believes that the Fed is likely to hold off raising the FFR for at least six months because of weak economic data, and that weakness will be seen in the upcoming payroll numbers. Quantum expects the monthly non-farm payroll report to show that the US labor market added only 90,000 jobs this month, roughly in line with consensus expectations. The committee is debating what will happen to the short end of the US yield curve (and what will happen subsequently to short-dated bond prices) if the payroll report comes in at the level they expect.\nQuantum’s committee forecasts weaker-than-expected GDP growth in the future and expects that GDP growth will be more volatile as the economy ultimately adjusts to a changing interest rate policy. Rutherford believes these factors will exert downward pressure on short-term Treasury Inflation-Protected Securities (TIPS) rates.\nAs part of Rutherford’s analysis, he forecasts the real one-year risk-free rate to be 0.25% and average inflation over the next year to be 1.5%. A zero-coupon nominal Treasury bond with 1-year to maturity and a par value of $100 is currently trading at $98.05. Rutherford notes the discrepancy in market pricing relative to his forecasts.\nDiana Coombs is a senior credit analyst at Quantum. Based on the GDP outlook from the committee, she evaluates three bonds from different sectors (shown in Exhibit 1) for a potential new short position in the company’s hedge fund. All three bonds mature in five years.\nExhibit 1 Credit Market Observations\n\tEconomic Sector\tDebt/Capital\tEnterprise Value/EBITDA\tSpread to Treasuries (bps)\tCredit Rating\nBond 1\tPharmaceutical\t52.2%\t7.2\t255\tBaa2\nBond 2\tConsumer Discretionary\t48.3%\t7.8\t220\tBaa1\nBond 3\tSoft Drinks\t32.3%\t8.5\t210\tA3\nQuantum is looking to enhance its equity offerings. It has recently hired David Wu to help construct a quantitative equity rotation strategy that will use economic input from the fixed-income committee. Wu has a background in quantitative modeling of equity markets and is tasked with developing an aggregate earnings forecasts. He is also working on incorporating a target equity risk premium into an equity rotation model. Wu makes the following observations based on his prior experiences:\n• Observation 1: The equity premium should be larger than, and positively correlated with, the corporate bond premium.\n• Observation 2: Corporate profitability is a leading economic indicator.\n• Observation 3: Equities provide superior consumption-hedging properties to high-quality bonds.\nThe equity rotation model can allocate between small- and large-cap stocks and growth and value stocks and can take targeted sector positions to enhance returns relative to the broader equity market. As the model is nearing completion, Wu evaluates how it would have performed during previous economic cycles. He runs extensive backtesting and observes the following tendencies of the model in the aftermath of recessions:\n• Rotates from consumer discretionary to consumer staple stocks\n• Rotates from large-cap growth stocks into large-cap value stocks\n• Rotates from small-cap value stocks to mid-cap value stocks", "James Frazee is chief investment officer at H&F Capital Investors. Frazee hires a third-party adviser to develop a custom benchmark for three actively managed balanced funds he oversees: Fund X, Fund Y, and Fund Z. (Balanced funds are funds invested in equities and bonds.) The benchmark needs to be composed of 60% global equities and 40% global bonds. The third-party adviser submits the proposed benchmark to Frazee, who rejects the benchmark based on the following concerns:\nConcern 1: Many securities he wants to purchase are not included in the benchmark portfolio.\nConcern 2: One position in the benchmark portfolio will be somewhat costly to replicate.\nConcern 3: The benchmark portfolio is a float-adjusted, capitalization-weighted portfolio.\nAfter the third-party adviser makes adjustments to the benchmark to alleviate Frazee’s concerns, Frazee accepts the benchmark portfolio. He then asks his research staff to develop risk and expected return forecasts for Funds X, Y, and Z as well as for the benchmark. The forecasts are presented in Exhibit 1.\nExhibit 1\nForecasted Portfolio Statistics for Funds X, Y, and Z and the Benchmark\n\tFund X\tFund Y\tFund Z\tBenchmark\nPortfolio weights:\t\t\t\t\nGlobal equities (%)\t60.0\t65.0\t68.0\t60.0\nGlobal bonds (%)\t40.0\t35.0\t32.0\t40.0\n\t\t\t\t\nExpected return (%)\t10.0\t11.6\t13.2\t9.4\nExpected volatility (%)\t17.1\t18.7\t22.2\t16.3\nActive risk (%)\t5.2\t9.2\t15.1\tN/A\nSharpe ratio (SR)\t0.45\t0.50\t0.49\t0.44\nNote: Data are based on a risk-free rate of 2.3%.\nFrazee decides to add a fourth offering to his group of funds, Fund W, which will use the same benchmark as in Exhibit 1. Frazee estimates Fund W’s information ratio to be 0.35. He is considering adding the following constraint to his portfolio construction model: Fund W would now have maximum over- and underweight constraints of 7% on single-country positions.\nFrazee conducts a search to hire a manager for the global equity portion of Fund W and identifies three candidates. He asks the candidates to prepare risk and return forecasts relative to Fund W’s benchmark based on their investment strategy, with the only constraint being no short selling. Each candidate develops independent annual forecasts with active return projections that are uncorrelated and constructs a portfolio made up of stocks that are diverse both geographically and across economic sectors. Selected data for the three candidates’ portfolios are presented in Exhibit 2.\nExhibit 2\nForecasted Portfolio Data for Equity Portion of Fund W\n\tCandidate A\tCandidate B\tCandidate C\nRebalancing\tAnnually\tAnnually\tAnnually\nNumber of securities\t100\t64\t36\nInformation ratio (IR)\t0.582\t0.746\t0.723\nTransfer coefficient (TC)\t0.832\t0.777\t0.548\nInformation coefficient*\t0.07\t0.12\t0.22\n* Information coefficient based on previously managed funds.\nFrazee asks Candidate C to re-evaluate portfolio data given the following changes:\nChange 1: Fix the number of securities to 50.\nChange 2: Rebalance on a semi-annual basis.\nChange 3: Add maximum over- or underweight constraints on sector weightings.", "John Martinez is assessing the performance of the actively managed diversified asset portfolio. The diversified asset portfolio is invested in equities, bonds, and real estate, and allocations to these asset classes and to the holdings within them are constrained.\nSelected return and financial data for the portfolio for 2019 are presented in Exhibit 1.\nExhibit 1\nDiversified Asset Portfolio 2019 Portfolio Performance\n\tSub-Portfolio Return (%)\tBenchmark Return (%)\tPortfolio Allocation (%)\tStrategic Asset Allocation (%)\nEquities sub-portfolio\t36.9\t31.6\t63\t60\nBond sub-portfolio\t−2.4\t−2.6\t28\t35\nReal estate sub-portfolio\t33.4\t28.3\t9\t5\nMartinez uses several risk-adjusted return metrics to assess the performance of the diversified asset portfolio, including the information ratio and the Sharpe ratio. Selected risk, return, and statistical data for the portfolio are presented in Exhibit 2.\nExhibit 2\nDiversified Asset Portfolio Data, 2000-2019\n\tTransfer Coefficient (TC)\tInformation Coefficient (IC)\tBreadth (BR)\nEquities sub-portfolio\t0.90\t0.091\t21\nBond sub-portfolio\t0.79\t0.087\t23\nReal estate sub-portfolio\t0.86\t0.093\t19\nMartinez has recently hired Kenneth Singh to help him evaluate portfolios. Martinez asks Singh about the possible effects on the portfolio’s information ratio if cash were added to the diversified asset portfolio or if the aggressiveness of the portfolio’s active weights were increased. Singh responds with two statements:\nStatement 1:Adding cash to the portfolio would change the portfolio’s expected information ratio.\nStatement 2:Increasing the aggressiveness of active weights (in a proportional manner) would not change the portfolio’s expected information ratio.", "S&P 500\tIndigo Fund\nExpected annual return\t9.0%\t10.5%\nReturn standard deviation\t18.0%\t25.0%\nSharpe ratio\t0.333\t0.30\nActive return\t\t1.2%\nActive risk\t\t8.0%\nInformation ratio\t\t0.15\nNote: Data are based on a risk-free rate of 2.3%.", "You are analyzing three investment managers for a new mandate. The following table provides the managers’ ex-ante active return expectations and portfolio weights. The last two columns include the risk and the ex post, realized active returns for the four stocks. Use the following data for the following two questions:\n\tManager 1 Δw\tManager 1 E(RA)\tManager 2 Δw\tManager 2 E(RA)\tManager 3 Δw\tManager 3 E(RA)\tRisk\tRealized RA\nSecurity 1\t−0.125\t0.03\t0.2\t0.04\t−0.05\t0.025\t0.17\t0.06\nSecurity 2\t0.025\t0.04\t0\t0.01\t0.05\t0.015\t0.10\t0.07\nSecurity 3\t0.075\t0.05\t−0.1\t0\t0.05\t0.005\t0.12\t0.04\nSecurity 4\t0.025\t0.06\t−0.1\t0.02\t−0.05\t0.015\t0.25\t0.02", "Matthew Spencer is a senior consultant in the institutional consulting division of Reed & Associates (Reed). Reed advises its institutional clients on asset manager selection and provides ongoing evaluation and performance analysis of all the fund managers in its database. Spencer was recently engaged by the retirement fund of a large municipality that has ten managers, each specializing in a particular asset class or style. Spencer notes that the members of the fund's investment committee vary greatly in their level of understanding of financial markets and active portfolio management. He hopes to increase their comprehension during a meeting scheduled for the following day.\nAt the start of the meeting, Spencer provides the investment committee members with a report outlining the three-year historical performance and value-added statistics for the fund's ten managers. He highlights the fund’s best- and worst-performing managers for the same period. David Moore, a new committee member, asks Spencer how to interpret value added statistics. Spencer responds with the following statements.\n• Statement 1: The measurement is derived from the various sources that make up the contribution from active management decisions, including asset allocation and security selection.\n• Statement 2: It appraises active management decisions and further compares the portfolio’s return in excess of the benchmark with the risk-free rate and relative to the standard deviation of returns.\n• Statement 3: The statistic is a useful tool for comparing relative returns, but it is most applicable in comparing active management decisions of equity portfolios.\nSpencer wants to ensure the committee understands the amount of active management risk its equity growth fund managers are taking in the portfolios. He mentions he is particularly concerned about the risk statistics for Atlanta Asset Management. The statistics have him questioning whether the manager is actually adding value by following an active management strategy. He provides the committee with data presented in Exhibit 1.\nExhibit 1 Selected Data for Atlanta Asset Management\nBenchmark return\t–9.0%\nPortfolio return\t–11.0%\nRisk-free rate\t2.00%\nStandard deviation of portfolio returns\t5.75%\nStandard deviation of benchmark returns\t4.75%\nActive risk\t3.75%\nPortfolio Sharpe ratio\t–2.26\nBenchmark Sharpe ratio\t–2.32\nSpencer has asked a colleague, Jennifer Cook, to prepare a performance attribution analysis on the portfolios of each of the fund’s investment managers and to review the report with the committee. He requested that she include in the report an analysis showing the various components of the fundamental law of active management. Cook believes it is important to convey to the committee the significance of the interaction among the various components. She comments to the members that there is a low probability of a manager adding value if its forecast of active returns does not correlate with its realized active return over time.\nSpencer is also worried about one of the fund’s small-cap managers whose portfolio has been underperforming its benchmark for the past few years, and the output from Cook’s fundamental law analysis was troubling. Spencer has recommended the fund consider replacing the manager and has provided the committee with a list of several alternative managers. Moore reviews the handout containing the expected information ratio and active risk measures and asks whether one statistic is more relevant than the other. Spencer responds, “They are both equally important.”\nTo better familiarize himself with the various managers the fund employs, Moore continues to study Cook’s report showing the various components of the fundamental law of active management. He notes the committee has yet to talk about the fixed-income advisers used by the fund. He is curious how the fundamental law of active management applies to the analysis of fixed-income managers and asks Cook for her opinion.\nThe final item Spencer wants to discuss with the committee concerns a notification he received from Rossi Asset Management, one of the fund’s active managers, regarding a change in the quantitative investment process that Rossi now uses. All of the fund’s managers are contractually required to provide written notification when implementing such changes. The correspondence addresses a change recently made regarding the rebalancing frequency. The manager previously rebalanced the portfolio on a quarterly basis but has now moved to rebalancing on a monthly basis. Rossi believe this change allows it more opportunities to outperform its benchmark.", "Francesca Barolo is an equity portfolio manager at Gruppo Nebbiolo, Spa, an investment management firm located in Turin, Italy. She is meeting with Diego Moscato, the equity research manager at Dolcetto Partners, with the objective of receiving a buy rating on her funds from this key institutional investment consulting firm.\nBarolo and Moscato meet to discuss the firm’s investment philosophy, team, and process, as well as her performance track record. Barolo tells Moscato that she firmly believes in active management and her ability to add value relative to a benchmark because markets are inefficient.\nBarolo starts the meeting by stating that the criteria for benchmark selection is as follows: “It should be market capitalization weighted and should reflect the opportunity set available. The positions can be replicated at a low cost, weights are known ex ante, and return data are timely on an ex post basis. Value added is calculated as the sum of the active asset allocation decisions and the weighted sum of the value added from security selection. The firm conducts performance attribution based on a decomposition of value added into several sources, which include asset allocation, sector selection, and security selection.”\nThe meeting then progresses to a discussion of the risk and return measures presented in Exhibit 1. Barolo notes that during this period, the risk-free rate was 1.75%, and the benchmark return was 9.00%.\nExhibit 1 Data for the Nebbiolo Funds\n\tPortfolio Return\tActive Risk\nFund A\t10.10%\t4.00%\nFund B\t10.50%\t6.25%\nFund C\t11.85%\t7.30%\nMoscato tells Barolo that he likes to measure the consistency of active returns when reviewing and comparing managers. Because Barolo manages three funds, he was going to rank them in his analysis.\nMoscato asks Barolo, “As an active manager, what is your approach to generating excess returns?”\nBarolo responds, “I am a firm believer in the fundamental law of active management” and makes the following three points to support her view:\n• Point 1: The productivity of an active portfolio manager depends on both the skill level and how many opportunities are identified and put to use in the funds. The information ratio measures how much active return has been earned for the level of active risk taken.\n• Point 2: The information coefficient is the correlation between forecasted active returns and realized active returns. The transfer coefficient measures the degree to which a fund manager’s forecast is translated into active weights.\n• Point 3: Breadth is important and represents the number of independent decisions a fund manager makes in constructing the portfolio. Mathematically, breadth can be expressed as the number of independent investment opportunities squared.\nBarolo’s and Moscato’s discussion evolves into a debate about the strengths and limitations of the fundamental law of active management. Barolo provides her perspective, “The strength of the fundamental law of active management is that it provides a framework for evaluating and comparing managers based on skill. It can even produce operational measurements of the essential elements of an active management strategy. However, it also has some limitations. First, it does not consider covariances in calculating breadth. Second, it cannot measure ex ante value added.”", "Elizabeth Robbin is the new chief investment officer at Teacher Retirement Systems (TRS), which oversees 21 funds from 11 different firms. She plans to implement new performance measurement tools for selecting and evaluating TRS’s managers.\nRobbin is meeting with her staff to gauge what they know about manager selection and evaluation. She starts by asking her staff to share with her their understanding of the term “value added.” She notes the following responses from three analysts, David Gladden, Agnes Wert, and Sandra Marano.\n• Gladden: A manager adds value when the portfolio return is greater than that of its benchmark.\n• Wert: A manager adds value when he produces a positive rate of return.\n• Marano: Value added can come from multiple sources, including asset allocation and security selection.\nRobbin reviews data compiled by Gladden for Bosphorus Investment Advisers for the meeting. After reviewing Gladden’s work, Robbin requests that the analysts include the information ratio in all future exhibits.\nExhibit 1 Bosphorus Investment Advisors: Selected Statistics\nFund average annual return (%)\t18.54\nFund standard deviation\t10.7\nBenchmark average annual return (%)\t18.14\nBenchmark standard deviation\t9.55\nSharpe ratio\t1.59\nActive risk\t1.56\nBecause the analysts are unfamiliar with the use of the information ratio, Robbin explains how it might be useful in investment manager selection and in choosing the level of active portfolio risk. She asks each analyst to make an observation about his or her understanding of the information ratio.\n• Marano: The information ratio will change as the active weights deviate from the benchmark weights.\n• Gladden: Because TRS’s investment policy prohibits short positions, TRS would be unable to take advantage of any optimized portfolios with increased active risk.\n• Wert: The information ratio appears to be the best criterion to evaluate the past performance of our active managers.\nRobbin points out that the Sharpe ratio and the information ratio are both useful tools in evaluating portfolio managers and asks Gladden to explain some of the important differences between the two.\nGladden notes, “The information ratio is a measure of relative expected or realized reward to risk, whereas the Sharpe ratio measures the absolute risk–return trade-off of a portfolio. Sharpe ratios help investors focus on the relative value added by active management. Although the information ratio is not affected by the addition of cash or leverage, the Sharpe ratio is affected by the addition of either.”\nRobbin then introduces the Fundamental Law of Active Management to her analysts, illustrating it with a graphic called the “correlation triangle.” “This graph explains how a manager’s forecasted returns, decisions about the portfolio’s active weights, and realized active returns are related to each other,” she says.\nWert observes, “That makes sense. It is difficult to add value if the manager’s forecasts do not correspond at least somewhat to the realized active returns. Also, if the portfolio manager does not overweight securities for which he has forecasted the best relative returns, he will not generate positive relative returns.”\nLastly, Robbin illustrates to her team how they might apply the Fundamental Law of Active Management in evaluating the performance of Kariba Investment Management.\nRobbin observes, “Kariba may be overstating its expected active return. Because Kariba rebalances weekly, it claims that its number of independent decisions is high. However, some of these securities (exchange-traded funds) may cluster in economic regions where the same general analysis applies to several securities. That would mean that Kariba’s breadth is in fact much lower than stated. Furthermore, Kariba asserts that each security is independently evaluated. That may not be true either. For example, a strategy that favors a particular economic region will likely persist for several months, and therefore, the investment decisions are not independent. Again, the result would be a lower breadth.”", "Howie Rutledge is a senior portfolio strategist for an endowment fund. Rutledge meets with recently hired junior analyst Larry Stosur to review the fund’s holdings.\nRutledge asks Stosur about the mechanics of exchange-traded funds (ETFs). Stosur responds by making the following statements:\nStatement 1:Unlike mutual fund shares that can be shorted, ETF shares cannot be shorted.\nStatement 2:In the ETF creation/redemption process, the authorized participants (APs) absorb the costs of transacting securities for the ETF’s portfolio.\nStatement 3:If ETF shares are trading at a discount to NAV and arbitrage costs are sufficiently low, APs will buy the securities in the creation basket and exchange them for ETF shares from the ETF sponsor.\nRutledge notes that one holding, ETF 1, is trading at a premium to its intraday NAV. He reviews the ETF’s pricing and notes that the premium to the intraday NAV is greater than the expected arbitrage costs.\nStosur is evaluating three ETFs for potential investment. He notes that the ETFs have different portfolio characteristics that are likely to affect each ETF’s tracking error. A summary of the characteristics for the ETFs is presented in Exhibit 1.\nExhibit 1\nETF Characteristics Affecting Tracking Error\n\tETF 2\tETF 3\tETF 4\nPortfolio Construction Approach\tFull Replication\tRepresentative Sampling\tFull Replication\nType of Foreign Holdings\tLocal shares\tADRs*\tADRs*\nEngagement in Securities Lending\tYes\tYes\tNo\n*ADRs are American Depositary Receipts.\nRutledge and Stosur discuss the factors that influence ETF bid–ask spreads. Stosur tells Rutledge that quoted bid–ask spreads for a particular transaction size are (1) negatively related to the amount of the ongoing order flow in the ETF, (2) positively related to the costs and risks for the ETF liquidity provider, and (3) positively related to the amount of competition among market makers for the ETF.\nAs ETF shares may trade at prices that are different from the NAV, Rutledge examines selected data in Exhibit 2 for three ETFs that might have this problem.\nExhibit 2\nSelected Data on ETFs\n\tETF 5\tETF 6\tETF 7\nPercentage of Foreign Holdings\t10%\t50%\t90%\nTrading Frequency\tHigh\tLow\tLow\nRutledge considers a new ETF investment for the fund. He plans to own the ETF for nine months. The ETF has the following trading costs and management fees:\n• Annual management fee of 0.32%\n• Round-trip trading commissions of 0.20%\n• Bid–offer spread of 0.10% on purchase and sale\nRutledge asks Stosur to compute the expected total holding period cost for investing in the ETF.", "Maelys Beaumont is a corporate bond portfolio manager at Marseilles Funds, LLC in Montpelier, VT. She manages a US$500 million fund of primarily investment grade corporate bonds. The fund can also invest in fixed-income securities within the high-yield emerging market and in the sovereign and municipal sectors. As a result of market volatility, Beaumont has been noting that inflows and outflows are larger and more frequent than in the past. Because her fund is benchmarked against the Barclays Bloomberg Corporate Bond Index, and her peer universe is competitive, Beaumont is looking at ways to ensure that the cash flows do not adversely affect fund performance. She considers the use of exchange-traded funds (ETFs) to manage her market exposures in the fund.\nMaxime Dupuis, an analyst on Beaumont’s team is not familiar with ETFs. He asks Beaumont to explain how the mechanics of ETFs work and what parties are involved in the process. Beaumont describes the roles to Dupuis of different parties involved in ETFs by making the following statements:\nStatement 1:\nETFs trade in the secondary market throughout the course of the day at the then-current market price. In that regard, they are like any other stock in which buyers and sellers are matched.\nStatement 2:\nThere is a primary market for ETFs in which there is a creation and redemption process for shares. Here, the arbitrage gap is reduced to a narrow band to ensure that the price of the ETF and the underlying securities trade around a barrow band.\nStatement 3:\nIf, for example, ETF shares are being created, an intermediary receives the basket of in-kind securities at settlement.\nBeaumont then asks Dupuis to analyze in more detail the economics surrounding ETFs. Dupuis conducts a thorough analysis of the costs of an ETF, such as bid–ask spreads and sources of premiums and discounts. He summarizes his findings to Beaumont in the following notes:\nNote 1:\nA number of factors can determine the width of bid–ask spreads. These include creation or redemption fees, trading costs, and importantly, the bid–ask spread of the underlying securities. Similar to any other stock, the market maker is compensated, including a profit spread, for the risks of holding and hedging a security which are a function of liquidity.\nNote 2:\nETFs can trade at either a premium or discount to the underlying, which affect trading costs negatively or positively. Exchanges disclose the indicated intraday net asset values (NAVs), which are estimates of fair value based on the creation basket. Premiums and discounts are driven by a number of factors, including timing differences and stale pricing, which can be meaningful for foreign securities.\nBeaumont continues to assess the use of ETFs in her portfolio. She constantly evaluates risks that different investments can introduce into her strategy. She asks Dupuis to work with the risk management group to identify these risks and report back to her. Dupuis provides Beaumont a report with his findings on ETF risks starting with an executive summary, which is provided in Exhibit 1.\nExhibit 1 Executive Summary of ETF Risks\nETFs introduce unique risks because of their structure, holdings, and underlying exposures. Counterparty risk is prevalent in certain ETF legal structures, such as synthetic ETFs in which investors could lose all the principal invested if the issuer defaults. Funds that use over-the-counter (OTC) derivatives, such as exchange traded notes (ETNs), are subject to settlement risk, which is the result of counterparty risk between settlement periods. Leveraged and inverse funds might not deliver the expected performance over the desired time horizon that was expected based on the underlying exposures.", "Provident Advisers is a registered investment advisory firm that uses exchange-traded funds (ETFs) for its clients’ investment portfolios. Ted Sorrill is CEO and chief investment officer of Provident. Steve Mives, a prospective client, is a high-net-worth individual who is considering transforming his actively managed portfolio of individual stocks and bonds into actively managed and passive ETFs. Mives is considering this strategy because of the advice of his accountant, Andrew Hart. Sorrill, Mives, and Hart are meeting to discuss ETFs and their growing use in the construction of investment portfolios.\nSorrill begins the meeting by describing how ETFs are subject to the same regulations as mutual funds and noting that ETFs trade intra-day, similar to public stocks. Hart adds that ETF authorized participants use the primary market to both create and redeem ETF shares, and the secondary market to conduct trades in ETFs to eliminate the arbitrage gap.\nMives asks Sorrill to describe how ETF performance is measured. Sorrill explains that most ETFs are designed to track the performance of a specific benchmark index, such as the S&P 500 Index. Sorrill cautions, however, that there are numerous sources of tracking error that may cause a deviation in an ETF’s return relative to its benchmark index. Sorrill provides an example, stating that one of the sources of tracking error is an ETF portfolio manager’s operations with short sellers.\nMives wants to maintain the current blended stock and bond benchmark allocations following his portfolio’s transition from individual stocks and bonds to active and passive ETFs. Sorrill states that whenever active ETF managers implement active views, gaps with respect to desired market exposures may result. For Mives’s portfolio, Sorrill plans to use passive ETFs to maintain benchmark exposure should any of the active ETF managers implement active views that cause changes in the portfolio’s industry sector weightings. Passive ETFs will enable Sorrill to maintain benchmark exposure while not necessarily replacing an active ETF manager.\nHart states that active ETF strategies have evolved such that market capitalization is no longer the only benchmark factor for equity strategies and that fixed-income strategies may be constructed with minimal sensitivity to movements in interest rates. He states that smart beta equity risk factors, such as dividend yield, size, value, and momentum, enable investors to implement an active view while continuing to track a designated benchmark. He then describes the strategy of smart beta fixed-income ETFs that focus on generating returns from taking credit risk and hedging out duration risk.", "Carlos Altuve is a manager-of-managers at an investment company that uses quantitative models extensively. Altuve seeks to construct a multi-manager portfolio using some of the funds managed by portfolio managers within the firm. Maya Zapata is assisting him.\nAltuve uses arbitrage pricing theory (APT) as a basis for evaluating strategies and managing risks. From his earlier analysis, Zapata knows that Funds A and B in Exhibit 1 are well diversified. He has not previously worked with Fund C and is puzzled by the data because it is inconsistent with APT. He asks Zapata gather additional information on Fund C’s holdings and to determine if an arbitrage opportunity exists among these three investment alternatives. Her analysis, using the data in Exhibit 1, confirms that an arbitrage opportunity does exist.\nExhibit 1\nExpected Returns and Factor Sensitivities (One-Factor Model)\nFund\tExpected Return\tFactor Sensitivity\nA\t0.02\t0.5\nB\t0.04\t1.5\nC\t0.03\t0.9\nUsing a two-factor model, Zapata now estimates the three funds’ sensitivity to inflation and GDP growth. That information is presented in Exhibit 2. Zapata assumes a zero value for the error terms when working with the selected two-factor model.\nExhibit 2\nExpected Returns and Factor Sensitivities (Two-Factor Model)\nFund\tExpected Return\tSensitivity: Inflation\tSensitivity: GDP Growth\nA\t0.02\t0.5\t1.0\nB\t0.04\t1.6\t0.0\nC\t0.03\t1.0\t1.1\nAltuve asks Zapata to calculate the return for Portfolio AC, composed of a 60% allocation to Fund A and 40% allocation to Fund C, using the surprises in inflation and GDP growth in Exhibit 3.\nExhibit 3\nSelected Data on Factors\nFactor\tResearch Staff Forecast\tActual Value\nInflation\t2.0%\t2.2%\nGDP Growth\t1.5%\t1.0%\nFinally, Altuve asks Zapata about the return sensitivities of Portfolios A, B, and C given the information provided in Exhibit 3.", "Hui Cheung, a portfolio manager, asks her assistant, Ronald Lam, to review the macroeconomic factor model currently in use and to consider a fundamental factor model as an alternative.\nThe current macroeconomic factor model has four factors:\nRi = ai + bi1FGDP + bi2FCAP + bi3FCON + bi4FUNEM + εi,\nWhere FGDP, FCAP, FCON, and FUNEM represent unanticipated changes in four factors: gross domestic product, manufacturing capacity utilization, consumer spending, and the rate of unemployment, respectively. Lam assumes the error term is equal to zero when using this model.\nLam estimates the current model using historical monthly returns for three portfolios for the most recent five years. The inputs used in and estimates derived from the macroeconomic factor model are presented in Exhibit 1. The US Treasury bond rate of 2.5% is used as a proxy for the risk-free rate of interest.\nExhibit 1\nInputs for and Estimates from the Current Macroeconomic Model\nFactor\tPortfolio 1\tPortfolio 2\tPortfolio 3\tBenchmark\tFactor Surprise (%)\nIntercept (%)\t2.58\t3.20\t4.33\t\t\nFGDP\t0.75\t1.00\t0.24\t0.50\t0.8\nFCAP\t−0.23\t0.00\t−1.45\t−1.00\t0.5\nFCON\t1.23\t0.00\t0.50\t1.10\t2.5\nFUNEM\t−0.14\t0.00\t−0.05\t−0.10\t1.0\nReturn, most recent year (%)\t6.00\t4.00\t5.00\t4.50\t\nLam uses the macroeconomic model to calculate the tracking error and the mean active return for each portfolio. He presents these statistics in Exhibit 2.\nExhibit 2\nMacroeconomic Factor Model Tracking Error and Mean Active Return\nPortfolio\tTracking Error\tMean Active Return\nPortfolio 1\t1.50%\t1.50%\nPortfolio 2\t1.30%\t−0.50%\nPortfolio 3\t1.00%\t0.50%\nLam considers a fundamental factor model with four factors:\nRi = aj + bj1FLIQ + bj2FLEV + bj3FEGR + bj4FVAR + εj,\nwhere FLIQ, FLEV, FEGR, and FVAR represent liquidity, financial leverage, earnings growth, and the variability of revenues, respectively.\nLam and Cheung discuss similarities and differences between macroeconomic factor models and fundamental factor models, and Lam offers a comparison of those models to statistical factor models. Lam makes the following statements.\nStatement 1:The factors in fundamental factor models are based on attributes of stocks or companies, whereas the factors in macroeconomic factor models are based on surprises in economic variables.\nStatement 2:The factor sensitivities are generally determined first in fundamental factor models, whereas the factor sensitivities are estimated last in macroeconomic factor models.\nLam also tells Cheung:\nAn advantage of statistical factor models is that they make minimal assumptions, and therefore, statistical factor model estimation lends itself to easier interpretation than macroeconomic and fundamental factor models.\nLam tells Cheung that multifactor models can be useful in active portfolio management, but not in passive management. Cheung disagrees; she tells Lam that multifactor models can be useful in both active and passive management.", "Janice Low is an investment consultant and is reviewing the performance of several portfolio managers in order to make allocation recommendations to her clients.\nLow speaks with the portfolio manager of the Anton Fund about his portfolio management process. He uses a multifactor model by creating factors whose values are based on differences between expected and observed values of those factors. The expected return on the portfolio is 5.0% if all factor sensitivities are 0. The risk-free rate is 2.5%. Exhibit 1 presents the factor returns and sensitivities of the Anton Fund.\nExhibit 1\n\tFactor Return (%)\tFactor Sensitivity\nFactor 1\t4.5\t0.5\nFactor 2\t2.0\t0.4\nFactor 3\t–3.0\t0.1\nLow obtains the most recent report from the Elicker Fund. She notes that the Elicker Fund reported a return of 12.5% while its benchmark had a return of 10.8%. She conducts an attribution analysis from the data provided in Exhibit 2 to determine if the outperformance is due primarily to factor exposures or security selection.\nExhibit 2\nFactor\tReturn (%)\tPortfolio Sensitivity\tBenchmark Sensitivity\nFactor 4\t0.5\t1.2\t5.9\nFactor 5\t–1.5\t–0.3\t–2.9\nFactor 6\t0.5\t0.2\t5.0\nLow then reviews the most recent performance of three funds to determine which fund added the most value from making active investment decisions. She collects the information about the funds and their benchmark presented in Exhibit 3.\nExhibit 3\nFund\tAverage Return (%)\tStandard Deviation of Returns (%)\tTracking Error (%)\tActive Risk Squared (%²)\tFactor Risk (%²)\nFinch\t12.0\t18.0\t8.0\t64\t16\nRaven\t9.6\t13.0\t2.0\t4\t2\nMagpie\t11.5\t20.0\t4.0\t16\t12\nBenchmark\t9.5\t12.0\t\t\t\nOne of Low's institutional clients asks her to assist in reducing an exposure to a risk factor in its portfolio because it has operational risk exposure to that same factor. The client can take both long and short positions. Low decides to use factor models to create a factor portfolio to that exposure and recommend the appropriate position to take in that portfolio.", "Francesca Martinez is a portfolio manager. She decides to review several fund managers who use macroeconomic multifactor models.\nFrom her earlier analysis, she knows the funds in Exhibit 1 are well diversified. She determines the arbitrage opportunity that exists among the three funds.\nExhibit 1\nFund\tExpected Return (%)\tFactor Sensitivity\nA\t4.0\t1.5\nB\t8.0\t4.5\nC\t6.0\t2.7\nMartinez next estimates Fund D's sensitivity to time horizon risk and inflation risk. She wants to further understand the drivers of Fund D's risk relative to its benchmark. For this analysis, she calculates the active risk for each factor and assumes that the correlation between the model's factors is negligible. She also assumes a zero value for the error term when working with the selected two-factor model, given in Exhibit 2. The expected return for Fund D is 6.0% and it has a tracking error of 8.0%.\nExhibit 2\nRisk Factor\tActual Value (%)\tExpected Value (%)\tFund D's Factor Sensitivity\tActive Factor Risk (% Squared)\nTime horizon risk\t2.6\t2.0\t1.6\t24\nInflation risk\t1.5\t0.8\t–0.4\t16\nMartinez considers whether Fund D would be a suitable investment for Lakemont University's endowment. The endowment has an investment horizon of 30 years. The activities it supports have historically been subject to cost increases running above the average rate of inflation.", "Halimah Yusuf is a portfolio manager at VSL Asset Management (VSLAM), based in Singapore. VSLAM provides customized portfolio management and investment consulting services to institutional clients. Yusuf is meeting with new analysts, John Cerra, Eunice Quek, and Inderjit Singh, to review the firm’s portfolio management models and techniques.\nYusuf welcomes everyone to the meeting and begins by stating, “We use multifactor models for portfolio construction as well as return and risk attribution.” She asks, “Can anyone tell me how arbitrage pricing theory (APT) is related to these multifactor models?”\nQuek responds, “APT helps us determine the appropriate number of factors to use in a multifactor model; however, it does not specify the identity of those factors.”\nYusuf continues, “Multifactor models fall into one of three categories: macroeconomic factor models, fundamental factor models, and statistical factor models. For macroeconomic factor models, the factors are the value, or level, of selected macroeconomic variables. For fundamental factor models, the factors are company share attributes, such as price-to-earnings ratio and market capitalization. Finally, when using statistical factor models, we apply statistical techniques, such as factor analysis or principal component analysis, to derive factors that are portfolios of securities that best explain historical return covariances and variances.”\nTo explain the use of multifactor models for portfolio return attribution, Yusuf presents the group with portfolio and benchmark information in Exhibit 1. She also notes the risk-free rate of return is 1.3%.\nExhibit 1 Multifactor Model Data\nFactor\tPortfolio Sensitivity\tBenchmark Sensitivity\tFactor Return\nMarket\t1.05\t1\t3.5%\nSmall-Cap\t0.5\t0.3\t4.7%\nValue\t–0.6\t0.2\t–4.5%\nMomentum\t0.5\t0.1\t5.1%\nYusuf asks the group to use Exhibit 1 to characterize the portfolio manager’s investment style. Cerra responds, “This manager has a large-cap orientation and follows a contrarian strategy with a growth bias.”\nYusuf continues, “Based on your review of the information in Exhibit 1 and given that the portfolio manager’s active return from security selection is 1.5%, I would like each of you to identify the factor that contributes the most to the manager’s active return.” The analysts respond as follows:\nCerra says, “My calculations suggest that it is the Value factor.”\nQuek responds, “I disagree. In my view, it is the Momentum factor.”\nSingh states, “No, my analysis indicates that it is the Market factor.”\nFinally, Yusuf provides the group with the information in Exhibit 2 and states, “As I previously stated, multifactor models can also be used to identify a portfolio manager’s risk exposures. Please use the information in Exhibit 2 to identify the portfolio with the highest active factor risk related to style factors, relative to active risk.”\nExhibit 2 Active Risk Squared Analysis for Selected Portfolios (Entries Are in Percentage Squared)\nPortfolio\tActive Factor: Industry\tActive Factor: Style\tActive Factor: Total\tActive Specific\tActive Risk Squared\nX\t12\t28\t40\t24\t64\nY\t7.2\t14.4\t21.6\t14.4\t36\nZ\t4\t10\t14\t2\t16", "Dea Cho is a senior portfolio manager for Hallasan Capital, an investment management firm located in Gyeongju, South Korea. Hallasan specializes in using multifactor models to build and manage global investment portfolios for institutional clients.\nChung-Hee Kwon works for Cho as a research analyst and often is tasked with working on factor models. During a conversation with Cho, Kwon mentions that he has not worked on building models using the arbitrage pricing theory (APT) framework. Cho asks Kwon what he knows about APT. Kwon explains that while both the APT and capital asset pricing model (CAPM) provide an expression of the expected return of an asset, the APT provides an alternative framework to CAPM and cites three key attributes of APT:\n• Attribute 1: The APT model makes stronger assumptions than the CAPM.\n• Attribute 2: APT makes the assumption that investors can form portfolios that eliminate asset-specific risk.\n• Attribute 3: APT makes the assumption that arbitrage opportunities exist among well-diversified portfolios.\nHallasan manages a global equity strategy for Gyeongiu Electric, an institutional client. This portfolio is managed to overweight or underweight certain factors. These factors include small minus big (SMB), high minus low book value (HML), and winners minus losers (WML). Exhibit 1 provides information regarding the portfolio sensitivities to these factors, the premiums of these factors, and the return of the value-weighted equity index in excess of the 1-month T-bill rate (RMRF). The risk-free rate is currently 1.5%.\nExhibit 1 Portfolio Sensitivities and Factor Premiums\nRisk Factor\tRMRF\tSMB\tHML\tWML\nGyeongiu Electric Portfolio Factor Sensitivity\t1.01\t0.45\t0.95\t0.09\nFactor Premium\t3.11%\t2.11%\t3.75%\t1.56%\nFollowing the conclusion of a performance reporting period, Cho asks Kwon to evaluate the risk attributes and results of two of Hallasan’s institutional portfolios relative to a global equity benchmark over the previous year. Kwon compiles the data in Exhibit 2 and provides the results to Cho for discussion and analysis.\nExhibit 2 1-Year Portfolio Performance Data\nPortfolio\tActive Specific Risk (%)\tActive Factor Risk (%)\tActive Risk Squared\tInformation Ratio\nCity of Daegu\t10\t90\t0.38%\t0.70\nGangwon Pension Plan\t75\t25\t0.09%\t0.62\nCho asks Kwon to share observations on how the portfolios have performed. Kwon responds that Daegu’s portfolio appears to have had the largest active return and Gangwon’s portfolio appears to have the highest contribution of active risk from stock selection.", "Thoms Investment Advisory (TIA) is an investment management firm focused o
