n health care equities in various global markets. TIA bases its investment process on the belief that common factors affect mean equity returns, and these common factors vary in degrees of importance by region or country.\nSenior portfolio manager Thilo Singh is discussing characteristics of the firm’s portfolios with junior analyst Douglas Park. Singh states, “We use factor models when analyzing regional health care index expected returns. In order for our analysts to understand our security selection process, they must first have a working knowledge of factor models.”\nPark adds, “Factor models are based on the arbitrage pricing theory (APT), which, similar to the CAPM, is an expression for the expected return of an asset or portfolio. The APT makes three key assumptions:\n• Assumption 1: A factor model describes asset returns.\n• Assumption 2: A well-diversified portfolio can eliminate factor risk.\n• Assumption 3: A state of financial market equilibrium exists among well-diversified portfolios.”\nPark continues: “I have examined three of the regional portfolios using our available information, and I have determined that they show sensitivity to a return-on-equity (ROE) factor as shown in Exhibit 1. That implies that an arbitrage opportunity could exist and be exploited by buying the Pacific Rim portfolio while selling short a portfolio composed of 60% of the Eurozone portfolio and 40% of the North America portfolio.”\nExhibit 1 Portfolio Sensitivities to ROE Factor\nPortfolio\tExpected Return\tFactor Sensitivity\nEurozone\t11.9%\t0.3\nNorth America\t10.7%\t0.8\nPacific Rim\t13.7%\t0.5\nSingh elaborates, “Our securities analysis is actually based on a three-factor model, which we use to compare the mean expected return of the regional health care index with an individual security’s expected return. Using a risk-free rate of 0.50%, we focus on regional sensitivity to the following three factors, the characteristics of which are shown in Exhibit 2.”\n• Factor 1: An ROE factor that measures the difference between returns of stocks of firms in the highest quartile of ROE and the returns of firms in the lowest quartile of ROE.\n• Factor 2: A sector excess return factor that compares local healthcare sector returns with the entire local equity market (MKT).\n• Factor 3: A capital investment factor that is determined by ranking firms according to their level of capital investment and comparing the returns of the firms in the highest quartile with those in the lowest quartile (INV).\nExhibit 2 Panel A: Factor Model and Portfolio Characteristics\nSector Region\tMean Local Index Return\tβROE\tβMKT\tβINV\tInformation Ratio\tTracking Error\nEurozone\t8.5%\t0.3\t0.20\t1.5\t0.971\t3.500%\nNorth America\t6.0%\t0.9\t0.90\t0.4\t1.192\t4.000%\nPacific Rim\t9.0%\t0.6\t0.93\t0.9\t0.509\t9.375%\nJapan\t5.0%\t0.9\t0.88\t0.6\t1.620\t3.000%\nPanel B: Factor Values\nRegion\tROE\tMKT\tINV\nEurozone\t0.020\t0.04\t0.070\nNorth America\t0.075\t0.03\t0.033\nPacific Rim\t0.020\t0.02\t0.070\nJapan\t0.031\t0.05\t0.066", "Woronora Partners is an investment management firm based in Sydney. The firm manages both domestic and global equity funds for a variety of institutional clients.\nAva Wilson is a portfolio manager at Woronora. She engages in security selection for some portfolios and asset allocation and manager selection for others. One of her clients is the Paroo College endowment, for which she manages domestic equities. The endowment’s investment committee is performing a 3-year review of Woronora’s services and asks Wilson to explain the processes she uses to select investments and to evaluate performance.\nWilson begins her presentation by explaining that she uses multi-factor models to guide asset selection. She briefly describes this group of models and continues with specific information about one of them, the arbitrage pricing theory (APT). She describes the three key assumptions on which the APT is based:\n• Assumption 1: A factor model can be used to explain asset returns.\n• Assumption 2: A well-diversified portfolio will not contain any arbitrage opportunities.\n• Assumption 3: When assets are added to a diversified portfolio, they add to its factor risk and to its specific risk.\nWilson explains that she evaluates a variety of domestic equity funds, seeking evidence of arbitrage opportunities among them. She provides a simple example using a one-factor model that assumes the single factor is the only driver of returns. Exhibit 1 displays the data for this example.\nExhibit 1 Portfolio Information for a One-Factor Model\nPortfolio\tExpected Return\tFactor Sensitivity\nA\t5.00%\t0.4\nB\t5.70%\t0.6\nC\t6.80%\t0.8\nD\t7.70%\t1\nE\t8.60%\t1.2\nF\t9.00%\t1.4\nExpanding on this example, Wilson explains that in practice, she uses a four-factor model with factors for the market as a whole (denoted as RMRF), market capitalization (small minus big, or SMB), book value effect (high minus low, or HML), and momentum (winners minus losers, or WML). She has estimated the risk premiums for these factors and estimated factor sensitivities for three portfolios, as shown in Exhibit 2.\nExhibit 2 Factor Risk Premiums and Portfolio Sensitivities\nFactor\tFactor Risk Premiums\tPortfolio I Sensitivities\tPortfolio II Sensitivities\tPortfolio III Sensitivities\nRMRF\t7.10%\t0.9\t1.2\t1\nSMB\t2.40%\t1.2\t0.4\t0.8\nHML\t–1.3%\t0.5\t0.8\t1.1\nWML\t0.80%\t1.4\t0.9\t0.7\nWilson observes that this model is best characterized as a fundamental factor model. She tells the investment committee, “I have also considered using macroeconomic factor models, which differ from fundamental factor models in several ways. For example, in contrast to fundamental factor models, the expected effect of each factor on an asset’s return is zero in macroeconomic factor models because the factors in macroeconomic factor models are the surprises in the economic data relative to expectations. Also, standardized betas are used in macroeconomic factor models. A standardized beta is created when an asset’s sensitivity to a factor is adjusted for the average sensitivity of all assets to the factor and the standard deviation of those sensitivities.”\nLater in her presentation, Wilson explains that the information ratio of the endowment’s domestic equity portfolio is used to measure its performance. She states, “The information ratio is simply the ratio of the active return of the portfolio divided by the tracking error of its return, with both components measured relative to the performance of the agreed-on benchmark. The active return is the sum of each factor return multiplied by the difference between the portfolio’s sensitivity to that factor and the benchmark’s sensitivity. The tracking error is the standard deviation of active returns over time and can be decomposed into the total factor risk and the active specific risk.”\nWilson tells the committee her use of the four-factor model is also helpful in choosing between portfolios that might, at first, appear to offer similar expected performance. She provides an example of three portfolios, each of which has an expected active return of 4% and an expected active risk of 8%. Exhibit 3 provides the information for the example.\nExhibit 3 Decomposition of Active Risk\n\tPortfolio X\tPortfolio Y\tPortfolio Z\nRMRF risk\t10%\t35%\t5%\nSMB risk\t20%\t15%\t5%\nHML risk\t5%\t10%\t20%\nWML risk\t25%\t15%\t10%\nTotal factor risk\t60%\t75%\t40%\nActive specific risk\t40%\t25%\t60%\nNote: All figures are a percentage of total active risk.", "Randy Gorver, chief risk officer at Eastern Regional Bank, and John Abell, assistant risk officer, are currently conducting a risk assessment of several of the bank’s independent investment functions. These reviews include the bank’s fixed-income investment portfolio and an equity fund managed by the bank’s trust department. Gorver and Abell are also assessing Eastern Regional’s overall risk exposure.\nEastern Regional Bank Fixed-Income Investment Portfolio\nThe bank’s proprietary fixed-income portfolio is structured as a barbell portfolio: About half of the portfolio is invested in zero-coupon Treasuries with maturities in the 3- to 5-year range (Portfolio P1), and the remainder is invested in zero-coupon Treasuries with maturities in the 10- to 15-year range (Portfolio P2). Georges Montes, the portfolio manager, has discretion to allocate between 40% and 60% of the assets to each maturity “bucket.” He must remain fully invested at all times. Exhibit 1 shows details of this portfolio.\nExhibit 1\nUS Treasury Barbell Portfolio\n\tP1 (3–5 Years)\tP2 (10–15 Years)\nAverage duration\t3.30\t11.07\nAverage yield to maturity\t1.45%\t2.23%\nMarket value\t$50.3 million\t$58.7 million\nTrust Department’s Equity Fund\na Use of Options: The trust department of Eastern Regional Bank manages an equity fund called the Index Plus Fund, with $325 million in assets. This fund’s objective is to track the S&P 500 Index price return while producing an income return 1.5 times that of the S&P 500. The bank’s chief investment officer (CIO) uses put and call options on S&P 500 stock index futures to adjust the risk exposure of certain client accounts that have an investment in this fund. The portfolio of a 60-year-old widow with a below-average risk tolerance has an investment in this fund, and the CIO has asked his assistant, Janet Ferrell, to propose an options strategy to bring the portfolio’s delta to 0.90.\nb Value at Risk: The Index Plus Fund has a value at risk (VaR) of $6.5 million at 5% for one day. Gorver asks Abell to write a brief summary of the portfolio VaR for the report he is preparing on the fund’s risk position.\nCombined Bank Risk Exposures\nThe bank has adopted a new risk policy, which requires forward-looking risk assessments in addition to the measures that look at historical risk characteristics. Management has also become very focused on tail risk since the subprime crisis and is evaluating the bank’s capital allocation to certain higher-risk lines of business. Gorver must determine what additional risk metrics to include in his risk reporting to address the new policy. He asks Abell to draft a section of the risk report that will address the risk measures’ adequacy for capital allocation decisions.", "Tina Ming is a senior portfolio manager at Flusk Pension Fund (Flusk). Flusk’s portfolio is composed of fixed-income instruments structured to match Flusk’s liabilities. Ming works with Shrikant McKee, Flusk’s risk analyst.\nMing and McKee discuss the latest risk report. McKee calculated value at risk (VaR) for the entire portfolio using the historical method and assuming a lookback period of five years and 250 trading days per year. McKee presents VaR measures in Exhibit 1.\nExhibit 1\nFlusk Portfolio VaR (in $ millions)\nConfidence Interval\tDaily VaR\tMonthly VaR\n95%\t1.10\t5.37\nAfter reading McKee’s report, Ming asks why the number of daily VaR breaches over the last year is zero even though the portfolio has accumulated a substantial loss.\nNext, Ming requests that McKee perform the following two risk analyses on Flusk’s portfolio:\nAnalysis 1:Use scenario analysis to evaluate the impact on risk and return of a repeat of the last financial crisis.\nAnalysis 2:Estimate over one year, with a 95% level of confidence, how much Flusk’s assets could underperform its liabilities.\nMing recommends purchasing newly issued emerging market corporate bonds that have embedded options. Prior to buying the bonds, Ming wants McKee to estimate the effect of the purchase on Flusk’s VaR. McKee suggests running a stress test using a historical period specific to emerging markets that encompassed an extreme change in credit spreads.\nAt the conclusion of their conversation, Ming asks the following question about risk management tools: “What are the advantages of VaR compared with other risk measures?”", "Carol Kynnersley is the chief risk officer at Investment Management Advisers (IMA). Kynnersley meets with IMA’s portfolio management team and investment advisers to discuss the methods used to measure and manage market risk and how risk metrics are presented in client reports.\nThe three most popular investment funds offered by IMA are the Equity Opportunities, the Diversified Fixed Income, and the Alpha Core Equity. The Equity Opportunities Fund is composed of two exchange-traded funds: a broadly diversified large-cap equity product and one devoted to energy stocks. Kynnersley makes the following statements regarding the risk management policies established for the Equity Opportunities portfolio:\nStatement 1:IMA’s preferred approach to model value at risk (VaR) is to estimate expected returns, volatilities, and correlations under the assumption of a normal distribution.\nStatement 2:In last year’s annual client performance report, IMA stated that a hypothetical $6 million Equity Opportunities Fund account had a daily 5% VaR of approximately 1.5% of portfolio value.\nKynnersley informs the investment advisers that the risk management department recently updated the model for estimating the Equity Opportunities Fund VaR based on the information presented in Exhibit 1.\nExhibit 1\nEquity Opportunities Fund—VaR Model Input Assumptions\n\tLarge-Cap ETF\tEnergy ETF\tTotal Portfolio\nPortfolio weight\t65.0%\t35.0%\t100.0%\nExpected annual return\t12.0%\t18.0%\t14.1%\nStandard deviation\t20.0%\t40.0%\t26.3%\nCorrelation between ETFs: 0.90\nNumber of trading days/year: 250\nFor clients interested in fixed-income products, IMA offers the Diversified Fixed-Income Fund. Kynnersley explains that the portfolio’s bonds are all subject to interest rate risk. To demonstrate how fixed-income exposure measures can be used to identify and manage interest rate risk, Kynnersley distributes two exhibits featuring three hypothetical Treasury coupon bonds (Exhibit 2) under three interest rate scenarios (Exhibit 3).\nExhibit 2\nFixed-Income Risk Measure\nHypothetical Bond\tDuration\nBond 1\t1.3\nBond 2\t3.7\nBond 3\t10.2\nExhibit 3\nInterest Rate Scenarios\nScenario\tInterest Rate Environment\nScenario 1\tRates increase 25 bps\nScenario 2\tRates increase 10 bps\nScenario 3\tRates decrease 20 bps\nOne of the investment advisers comments that a client recently asked about the performance of the Diversified Fixed-Income Fund relative to its benchmark, a broad fixed-income index. Kynnersley informs the adviser as follows:\nStatement 3:The Diversified Fixed-Income Fund manager monitors the historical deviation between portfolio returns and benchmark returns. The fund prospectus stipulates a target deviation from the benchmark of no more than 5 bps.\nKynnersley concludes the meeting by reviewing the constraints IMA imposes on securities included in the Alpha Core Equity Fund. The compliance department conducts daily oversight using numerous risk screens and, when indicated, notifies portfolio managers to make adjustments. Kynnersley makes the following statement:\nStatement 3:It is important that all clients investing in the fund be made aware of IMA’s compliance measures. The Alpha Core Equity Fund restricts the exposure of individual securities to 1.75% of the total portfolio.", "Hiram Life (Hiram), a large multinational insurer located in Canada, has received permission to increase its ownership in an India-based life insurance company, LICIA, from 26% to 49%. Before completing this transaction, Hiram wants to complete a risk assessment of LICIA’s investment portfolio. Judith Hamilton, Hiram’s chief financial officer, has been asked to brief the management committee on investment risk in its India-based insurance operations.\nLICIA’s portfolio, which has a market value of CAD260 million, is currently structured as shown in Exhibit 1. Despite its more than 1,000 individual holdings, the portfolio is invested predominantly in India. The Indian government bond market is highly liquid, but the country’s mortgage and infrastructure loan markets, as well as the corporate bond market, are relatively illiquid. Individual mortgage and corporate bond positions are large relative to the normal trading volumes in these securities. Given the elevated current and fiscal account deficits, Indian investments are also subject to above-average economic risk.\nHamilton begins with a summary of the India-based portfolio. Exhibit 1 presents the current portfolio composition and the risk and return assumptions used to estimate value at risk (VaR).\nExhibit 1\nSelected Assumptions for LICIA’s Investment Portfolio\n\tAllocation\tAverage Daily Return\tDaily Standard Deviation\nIndia government securities\t50%\t0.015%\t0.206%\nIndia mortgage/infrastructure loans\t25%\t0.045%\t0.710%\nIndia corporate bonds\t15%\t0.025%\t0.324%\nIndia equity\t10%\t0.035%\t0.996%\nInfrastructure is a rapidly growing asset class with limited return history; the first infrastructure loans were issued just 10 years ago.\nHamilton’s report to the management committee must outline her assumptions and provide support for the methods she used in her risk assessment. If needed, she will also make recommendations for rebalancing the portfolio to ensure its risk profile is aligned with that of Hiram.\nHamilton develops the assumptions shown in Exhibit 2, which will be used for estimating the portfolio VaR.\nExhibit 2\nVaR Input Assumptions for Proposed CAD260 Million Portfolio\nMethod\tAverage Return Assumption\tStandard Deviation Assumption\nMonte Carlo simulation\t0.026%\t0.501%\nParametric approach\t0.026%\t0.501%\nHistorical simulation\t0.023%\t0.490%\nHamilton elects to apply a one-day, 5% VaR limit of CAD2 million in her risk assessment of LICIA’s portfolio. This limit is consistent with the risk tolerance the committee has specified for the Hiram portfolio.\nThe markets’ volatility during the last 12 months has been significantly higher than the historical norm, with increased frequency of large daily losses, and Hamilton expects the next 12 months to be equally volatile.\nShe estimates the one-day 5% portfolio VaR for LICIA’s portfolio using three different approaches:\nExhibit 3\nVaR Results over a One-Day Period for Proposed Portfolio\nMethod\t5% VaR\nMonte Carlo simulation\tCAD2,095,565\nParametric approach\tCAD2,083,610\nHistorical simulation\tCAD1,938,874\nThe committee is likely to have questions in a number of key areas—the limitations of the VaR report, potential losses in an extreme adverse event, and the reliability of the VaR numbers if the market continues to exhibit higher-than-normal volatility. Hamilton wants to be certain that she has thoroughly evaluated the risks inherent in the LICIA portfolio and compares them with the risks in Hiram’s present portfolio.\nHamilton believes the possibility of a ratings downgrade on Indian sovereign debt is high and not yet fully reflected in securities prices. If the rating is lowered, many of the portfolio’s holdings will no longer meet Hiram’s minimum ratings requirement. A downgrade’s effect is unlikely to be limited to the government bond portfolio. All asset classes can be expected to be affected to some degree. Hamilton plans to include a scenario analysis that reflects this possibility to ensure that management has the broadest possible view of the risk exposures in the India portfolio.", "Pari Patel is a senior portfolio manager at Applegate Capital Management, an institutional hedge fund manager in San Francisco that offers a variety of strategies. Patel oversees the management of the Applegate Hedged Alpha Fund, a mutual fund with the objective of providing capital appreciation while minimizing downside risk. Justin Flaherty is a junior analyst on Patel’s team.\nPatel works closely with Applegate’s risk and compliance teams to ensure he understands the inherent risks in the portfolio. Each morning, Patel receives a risk report with a number of metrics to help him assess portfolio exposures and risks.\nPatel is reviewing the daily risk report with Flaherty to discuss why value at risk (VaR) is an important measure of risk. Flaherty makes the following three statements regarding VaR:\nStatement 1:\nVaR measures the minimum expected loss, rather than the maximum expected loss, in a portfolio.\nStatement 2:\nVaR is used to estimate portfolio losses that are likely to occur at a fixed point in time, rather than over a period of time.\nStatement 3:\nVaR measures portfolio volatility in percentage terms.\nPatel replies to Flaherty’s statements by focusing on specific aspects of VaR: “Applegate’s process begins with a risk decomposition of the portfolio holdings, typically assumes normal distribution of risk factors, and then uses the expected return and standard deviation for each risk factor to estimate the VaR. The VaR threshold is converted to a z-distribution. We then calculate the expected return and volatility of the portfolio and adjust to the desired time interval. Finally, we can obtain VaR and convert it into a dollar amount by multiplying by the portfolio value.”\nIn reviewing the VaR report, Patel would like more insight on the average loss that would occur if the VaR cutoff is extended and asks Flaherty to contact the risk team to improve the reporting metrics. After discussing with his colleague on the risk team, Flaherty responds that going forward they will add conditional VaR, incremental VaR, and marginal VaR to the report.\nIn addition to VaR, the risk report includes other measures that assist Patel in better understanding portfolio sensitivities. Patel uses option strategies within the fund to manage exposures. Patel asks Flaherty to review sensitivity risk measures to better understand the option exposure within the fund. Flaherty uses gamma to understand how sensitive option prices are to an increase in volatility of the underlying stock and delta to determine how large moves in the value of the fund positions will affect associated option values.\nMarcus Thompson oversees risk management at Applegate on a firm-wide basis. Because of the use of leverage, Thompson pays particular attention to risk measures to understand the sources and uses of cash and the risk of hitting leverage limits and facing margin calls. He uses a number of metrics in his risk dashboard and communicates to managers and firm leadership when actions need to be taken to mitigate risk.\nThompson frequently reviews Applegate’s strategies to identify those with greater-than-expected tail risk. Doing so helps him understand potential capital allocation requirements for meeting tail risk losses. He is asked to review the following three newly proposed fund strategies and to assess potential tail risk and capital requirements:\nStrategy 1:\nLong–short equity fund targeting an equity market beta of 0.2 based on fundamental long and short equity research\nStrategy 2:\nLong-only option strategy that uses technical analysis and momentum to trade call and put options on a short-term basis\nStrategy 3:\nAlternative income strategy focused on long credit positions combined with selling insurance and writing options to generate premium income", "Citadel Investment Partners is a global asset management firm offering a wide variety of mutual funds to both institutional and individual investors. Simon Alexander, Citadel’s chief risk officer, is responsible for risk oversight across the firm’s many strategies, as well as communication of any risk issues to the portfolio management, compliance, and executive teams. Alexander oversees a team of six analysts who are responsible for the ongoing calculation and assessment of portfolio risk. Citadel uses a variety of methods when estimating risk, including value at risk (VaR), sensitivity risk measures, and scenario risk measures.\nJennifer Woolridge just joined Citadel as a risk analyst, and Alexander is familiarizing her with how the firm measures portfolio risk. In a conversation with Woolridge, Alexander asks her what she has learned regarding the advantages of using VaR as a risk management tool. Woolridge responds, “The advantages of VaR are that it (1) can be used for performance evaluation, (2) provides an estimate of downside exposure during a worst-case scenario, and (3) avoids subjectivity.”\nLater that day, Woolridge receives an email from Alexander asking her to estimate the dollar VaR at the 5% level for the firm’s developing market equity fund. Woolridge estimates VaR using the parametric method (assuming normal distribution) with the inputs in Exhibit 1.\nExhibit 1 Data for Developing Market Equity Fund\nPortfolio value\t$500 million\nDaily expected return\t0.04%\nDaily expected volatility\t1.30%\nAlexander then asks Jun Lee, a senior risk analyst in the group, to explain to Woolridge how Citadel uses scenario risk measures. Lee explains, “Scenario analysis complements VaR because it can better account for market liquidity. A limitation of scenario analysis, however, is that it has a greater reliance on historical market data than does VaR.”\nLee then explains how the risk exposures of option positions may increase or decrease overall portfolio risk. Lee and Woolridge discuss delta, gamma, and vega as option sensitivity measures. Woolridge summarizes what she has learned to make sure she has understood correctly: “Delta measures the sensitivity of an option to the price of the underlying security and ranges from –0.5 to +0.5. Gamma is a second-order effect that measures the sensitivity of delta to price changes in the underlying. Vega is a first-order effect that measures the change in an option’s volatility relative to the change in price of the underlying.”\nAlexander receives a call from Sandra Patterson, Citadel’s CEO. Patterson expresses her concern that the firm’s $500 million multi-asset fund has failed to protect investors during a recent market decline. Alexander drafts an updated risk management policy to present to the investment committee. The goal of this policy is to ensure that the fund limits the likelihood of severe downside losses for investors. The new policy reads as follows:\n“The multi-asset fund has a 5-day, 1% VaR limit of $10 million, and the fund will undertake hedging activities, including the purchase of protective put options, if its cumulative 30-day loss ever exceeds $15 million. In addition, the magnitude of the hedge shall be designed to increase as losses increase.”\nFollowing the investment committee’s approval, Patterson references the updated risk management policy in her quarterly letter to investors. She states, “At Citadel, we take risk management very seriously. In response to recent investor concerns about volatility in our multi-asset fund, we have implemented a new policy. We limit fund losses to 2% of assets with a 99% level of confidence, with additional measures to limit total losses to 3% over a rolling 30-day period.”", "Hoskins Bank Corporation (HB) is a US bank holding company with lines of business in corporate banking, retail banking, capital markets, and private wealth management.\nHB’s annual risk assessment meeting with its external regulator will be in 90 days. In preparation for this meeting, Richard Hextall, CEO, and Alice Klink, chief risk officer, are meeting with independent risk consultant David Donovan, a principal of Donovan and MacNab Risk Advisory LLC.\nHextall asks Klink to review HB’s primary risk exposures. Klink begins by suggesting that the liquidity gap is a primary risk exposure for retail banking, stating that “with a 99% level of confidence, we expect our ratio of interest-earning assets to interest-paying liabilities will range between 90% and 110%.” For corporate banking, Klink believes that credit deterioration is a primary risk exposure and states that “over any 1-month period, there is a 1% probability of incurring a single-name loan loss for an amount that is not greater than 0.55% of the loan portfolio.” Klink believes that market risk is a primary risk exposure for capital markets, stating that “there is a 1% chance of HB losing at least 1.30% of its Tier 1 capital over a 1-day period.”\nDuring last year’s review, the regulator expressed concern that HB did not have an effective risk management process in place for its short-term, investment-grade bond portfolio. Donovan asks about the bank’s progress in addressing this concern. Hextall explains that HB has implemented a value at risk (VaR) approach and notes that there are three distinct methods to estimate VaR. The parametric method assumes that the distribution of returns on the risk factors is normal, and it is considered to be a straightforward approach. The historical simulation method also relies on the normal distribution assumption. The Monte Carlo simulation method relies on neither a normal distribution nor past returns and, as a result, is able to accommodate bonds that may contain embedded options.\nDonovan cautions Hextall that VaR may not capture information related to large losses, portfolio composition, and performance. He states that these limitations may be addressed by variations, or extensions, to VaR. For example, CVaR captures the potential loss if VaR is exceeded. IVaR measures ex ante tracking error. Relative VaR is used to determine the effect on VaR from any changes in portfolio composition.\nRecalling the financial crisis, Hextall asks Klink about HB’s potential exposure to any future adverse, extreme events. Klink replies that HB’s investment portfolio currently holds short-duration, high-investment-grade bonds but does not hold any equity securities or derivative instruments. Klink adds that the illiquidity conditions that were prevalent during the financial crisis continue to exist, according to a reverse stress test she conducted on ten plausible independent risk factors.\nDonovan transitions the discussion to the private wealth division by asking Hextall to discuss the differences in risk measurement for banks in comparison to traditional asset managers, such as HB’s private wealth division. Hextall states that risk measures for banks typically consider liquidity, solvency, and capital sufficiency, whereas risk measures for traditional asset managers typically are focused on investment performance. Hextall provides an example, stating that “HB, for its private wealth clients, calculates active share for each client and uses ex ante tracking error to measure the degree to which clients’ current portfolios might underperform their benchmarks in the future. For equity-only portfolios, forward-looking beta is used to measure sensitivity to the broad equity market.”\nHextall asks Klink to review the constraints used in the context of measuring the risk of the corporate banking division. Klink responds by stating that the corporate banking division’s capital allocation is $2,800 million. This amount considers market risk, credit risk, and operational risk for which the minimum required return is 11%. Capital limits, position limits, and stop-loss limits are assigned to manage both overall exposure and exposure to single-name event risk. The market risk management constraints for each of the corporate banking division’s lending groups are summarized in Exhibit 1.\nExhibit 1 Market Risk Management Constraints for Corporate Banking Lending Groups ($ Millions)\nLending Group\tReturn\tCapital Limit\tPosition Limit\tStop-Loss Limit\nSecured\t120\t800\t32\t80\nCash Flow\t120\t1,200\t24\t60\nReal Estate\t120\t1,000\t10\t70", "Dierdre O’Callahan is a senior risk manager at Muckroth Investment Management, a global investment firm headquartered in Dublin, Ireland. O’Callahan’s team is responsible for tracking and estimating portfolio risk for the firm’s various investment strategies and for communicating risk exposures to Muckroth’s portfolio managers, investment committee, and chief risk officer. O’Callahan’s team also offers risk consulting services to the firm’s institutional investor clients.\nWhen assessing portfolio risk, O’Callahan makes frequent use of value at risk (VaR) in addition to other measures, such as volatility, sensitivity risk, and scenario risk. O’Callahan believes that VaR is an appropriate risk measure in this application for the following reasons:\nReason 1:\nThe reliability of VaR can be easily verified through a process known as backtesting.\nReason 2:\nVaR takes portfolio liquidity into account when some of the assets are relatively illiquid.\nReason 3:\nVaR effectively accounts for an increase in asset correlations during times of market stress.\nMichelle Ryan is a senior portfolio manager on the Muckroth Alpha Fund. Ryan and O’Callahan are reviewing the VaR report O’Callahan prepared for this fund to ensure that the fund is within the risk parameters established by the firm and communicated to investors. The Alpha Fund has assets under management of €315 million and has an expected annualized return of 10.4% with a volatility of 17.52%. The report describes VaR in both percentage and euro terms. It uses the parametric method of VaR at the 5% level (1.65 standard deviations), assuming 250 trading days per year.\nAfter reviewing the current VaR report, Ryan asks O’Callahan to calculate how much the VaR estimate would change if she were to reduce the portfolio weight of Bordeaux Industries stock in the Alpha Fund from 6% to 2% of the portfolio and then use the proceeds to establish a new 4% position in Riga Bank & Trust. O’Callahan tells Ryan that there are several extensions of VaR analysis that she can run.\nAxiomada, a prospective institutional client, is impressed by Muckroth’s investment track record and would like to learn more about the consulting services Muckroth offers to monitor risk. Representatives from Axiomada set up a meeting with O’Callahan to discuss how Muckroth considers important risk categories facing institutional investors. O’Callahan provides Axiomada with a risk management document Muckroth has prepared for institutional clients that includes Exhibit 1. Exhibit 1 illustrates how Muckroth considers a variety of different risk categories depending on the type of institutional investor.\nExhibit 1 Important Risk Categories by Type of Institutional Investor\nRisk Category\tBank\tHedge Fund\tPension Plan\nLiquidity Gap\t√\t---\t√\nVaR\t√\t√\t---\nTracking Error\t---\t√\t√\nLeverage\t√\t√\t---\nScenario Analysis\t√\t---\t√\nKey Rate Duration\t√\t---\t√\nActive Share\t---\t√\t---\nOperational Risk Capital\t√\t---\t√", "Kata Rom is an equity analyst working for Gimingham Wealth Partners (GWP), a large investment advisory company. Rom meets with Goran Galic, a Canadian private wealth client, to explain investment strategies used by GWP to generate portfolio alpha for its clients.\nRom states that GWP is recognized in the Canadian investment industry as a leading factor-based value portfolio manager and describes how GWP creates relevant investment strategies and explains GWP’s backtesting process. Rom notes the following:\nStatement 1:Using historical data, backtesting approximates a real-life investment process to illustrate the risk–return tradeoff of a particular proposed investment strategy.\nStatement 2:Backtesting is used almost exclusively by quantitative investment managers and rarely by fundamental investment managers, who are more concerned with information such as forward estimates of company earnings, macroeconomic factors, and intrinsic values.\nGalic, who is 62 years old, decides to allocate C$2 million (representing 10% of his net worth) to an account with GWP and stipulates that portfolio assets be restricted exclusively to domestic securities. Although GWP has not backtested its strategies with such a restriction, it has backtested its strategies using a global index that includes domestic securities. Rom shows the following risk measures to Galic for three factor portfolios.\nExhibit 1\nDownside Risk Measures for Model Factors\nRisk Measure\tFactor 1\tFactor 2\tFactor 3\nValue at risk (VaR) (95%)\t(6.49%)\t(0.77%)\t(2.40%)\nConditional VaR (CVaR) (95%)\t(15.73%)\t(4.21%)\t(3.24%)\nMaximum drawdown\t35.10%\t38.83%\t45.98%\nGalic asks Rom, “What happens if the future is different from the past?” Rom gives the following replies:\nStatement 3:Although backtesting can offer some comfort, you are correct that it does have a weakness: Backtesting generally does not capture the dynamic nature of financial markets and in particular may not capture extreme downside risk.\nStatement 4:As a result, we have captured extreme downside risk and the dynamic nature of financial markets by using the Value-at-Risk and Conditional Value-at-Risk measures.\nIn an effort to make Galic fully aware of the risks inherent in GWP’s strategies, Rom describes a recent study that investigated the return distributions of value and momentum factors that GWP uses to construct portfolios. The study found that these distributions were non-normal based on their negative skewness, excess kurtosis, and tail dependence. Rom indicated that investment strategies based on this type of data are prone to significantly higher downside risk. Rom informs Galic that GWP also uses a technique commonly referred to as scenario analysis to examine how strategies perform in different structural regimes. Exhibit 2 compares the performance of two of GWP’s factor allocation strategies in different regimes:\nExhibit 2\nScenario Analysis Using the Sharpe Ratio\nStrategy/Regime\tHigh Volatility\tLow Volatility\tRecession\tNon-recession\nStrategy I\t0.88\t0.64\t0.20\t1.00\nStrategy II\t1.56\t1.60\t1.76\t1.52\nGalic is surprised to see that some of the backtest results are unfavorable. He asks, “Why has GWP not considered strategies that perform better in backtesting?” Galic recently met with Fastlane Wealth Managers, who showed much better performance results. The portfolio manager at Fastlane told Galic that the company selects the top-performing strategies after performing thousands of backtests.", "Emily Yuen is a senior analyst for a consulting firm that specializes in assessing equity strategies using backtesting and simulation techniques. She is working with an assistant, Cameron Ruckey, to develop multifactor portfolio strategies based on nine factors common to the growth style of investing. To do so, Yuen and Ruckey plan to construct nine separate factor portfolios and then use them to create factor-weighted allocation portfolios.\nYuen tasks Ruckey with specifying the investment universe and determining the availability of appropriate reporting data in vendor databases. Ruckey selects a vendor database that does not provide point-in-time data, so he adjusts the database to include point-in-time constituent stocks and a reporting lag of four months.\nNext, Yuen and Ruckey run initial backtests on the nine factor portfolios, calculating performance statistics and key metrics for each. For backtesting purposes, the portfolios are rebalanced monthly over a 30-year time horizon using a rolling-window procedure.\nYuen and Ruckey consider a variety of metrics to assess the results of the factor portfolio backtests. Yuen asks Ruckey what can be concluded from the data for three of the factor strategies in Exhibit 1:\nExhibit 1\nBacktest Metrics for Factor Strategies\n\tFactor 1\tFactor 2\tFactor 3\nVaR (95%)\t(3.9%)\t(1.3%)\t(8.4%)\nStandard deviation of returns\t2.1%\t1.2%\t4.6%\nMaximum drawdown\t27.2%\t8.3%\t59.7%\nRuckey tells Yuen the following:\nStatement 1:We do not need to consider maximum drawdown, because standard deviation sufficiently characterizes risk.\nStatement 2:Factor 2 has the highest downside risk.\nFrom her professional experience Yuen knows that benchmark and risk parity factor portfolios, in which factors are equally weighted and equally risk weighted, respectively, are popular with institutional and high-net-worth clients. To gain a more complete picture of these investment strategies’ performance, Yuen and Ruckey design a Benchmark Portfolio (A) and a Risk Parity Portfolio (B), and then run two simulation methods to generate investment performance data based on the underlying factor portfolios, assuming 1,000 simulation trials for each approach:\nApproach 1:Historical simulation\nApproach 2:Monte Carlo simulation\nYuen and Ruckey discuss the differences between the two approaches and then design the simulations, making key decisions at various steps. During the process, Yuen expresses a number of concerns:\nConcern 1: Returns from six of the nine factors are correlated.\nConcern 2: The distribution of Factor 1 returns exhibits excess kurtosis and negative skewness.\nConcern 3: The number of simulations needed for Approach 1 is larger than the size of the historical dataset.\nFor each approach, Yuen and Ruckey run 1,000 trials to obtain 1,000 returns for Portfolios A and B. To help understand the effect of the skewness and excess kurtosis observed in the Factor 1 returns on the performance of Portfolios A and B, Ruckey suggests simulating an additional 1,000 factor returns using a multivariate skewed Student’s t-distribution, then repeating the Approach 2 simulation."], "modules": {"1": "Economics and Investment Markets", "2": "Analysis of Active Portfolio Management", "3": "Exchange-Traded Funds: Mechanics and Applications", "4": "Using Multifactor Models", "5": "Measuring and Managing Market Risk", "6": "Backtesting and Simulation"}}</script>
<script>

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function flush(){ if(!tbl.length) return; html+='<div class="tbl"><table>'+tbl.map(function(r){return "<tr>"+r.split("\t").map(function(c){return "<td>"+esc(c.trim())+"</td>";}).join("")+"</tr>";}).join("")+"</table></div>"; tbl=[]; }

function setup(){
  S && (S.view="setup", save());
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 모듈 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">Portfolio Management 전체 Reading 오답 퀴즈 (R34–R39)</h2>'+
   '<p class="muted">ECO에서 틀린 111문제 전부 + 오답노트 기반 변형 19문제 (총 130문제). 정답은 ECO 원본 기준, 해설과 변형 문제는 Schweser 기준으로 작성했습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<label>출처 <select id="selSrc"><option value="all">전체</option><option value="wrong">ECO 오답만 (111)</option><option value="nowrong">오답 외 문제만</option></select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start">'+resume+'<button class="btn '+(resume?'':'primary')+'" id="bStart">새로 시작</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  $("bStart").onclick=function(){
    var m=$("selMod").value, s=$("selSrc").value;
    var order=Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (s==="all"||(s==="wrong"?q.src==="ECO 오답":q.src!=="ECO 오답")); }).map(function(q){return q.id;});
    if(!order.length) return;
    S=fresh(order,"all"); save(); render();
  };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    '<button class="btn primary" id="bNext" '+(r?'':'disabled')+'>'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button></div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=next;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
})();
</script>
</body>
</html>
