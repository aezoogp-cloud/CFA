<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Portfolio Management Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header class="bar"><div class="wrap">
  <div class="brand">
    <h1>Portfolio Management 오답 퀴즈<span>CFA Level II, Schweser 기준</span></h1>
    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>
  </div>
  <div class="progress"><i id="pbar"></i></div>
  <div class="ptext"><span id="ptxt">0 / 0</span><span id="pmode"></span></div>
</div></header>
<main class="wrap">

    <button class="btn" id="bResult">결과 보기</button>
    <button class="btn" id="bExport">결과 내보내기</button>
  </div>
  <div id="view"></div>
</main>
<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q1", "src": "ECO 오답", "module": 1, "tag": "가격 결정요인: real risk-free rate", "vig": null, "stem": "All else equal, which of the following would most likely explain the fall in price of a particular company’s shares?", "opts": {"A": "The expected inflation rate falls.", "B": "The company’s future cash flows are expected to increase.", "C": "The yield to maturity on real default-free investments rises."}, "ans": "C", "en": "C is correct. According to the fundamental pricing equation, the market value of an asset is affected by economic factors that influence the asset’s expected future cash flows, default-free interest rates, expected inflation rates, or the asset’s risk premium. From Equation 1, expected cash flows are in the numerator, while expected inflation and the real risk-free rate are in the denominator. Consequently, a rise in the real risk-free rate (the yield to maturity on a default-free instrument) will lead to a fall in the price of a risky asset, such as stock, by increasing the rate at which its cash flows are discounted.", "ko": "자산가격 = 기대현금흐름(분자) ÷ (1 + 실질무위험이자율 + 기대인플레이션 + 위험프리미엄)(분모). 실질 무위험 투자 수익률(real default-free YTM) ↑ → 할인율 ↑ → 주가 ↓.", "trap": "'yield to maturity on real default-free investments' = 실질 무위험이자율(R). 분모 요소가 오르면 가격 하락.", "f": "P0 = Σ E(CFt) / (1 + R + π + RP)^t", "why": {"A": "기대인플레이션 ↓는 분모(할인율)를 낮춰 주가를 올리는 방향입니다.", "B": "미래 현금흐름 ↑는 분자를 키워 주가를 올립니다."}, "orig": "ECO Module 1 Q1"}, {"id": "ECO-M1-Q2", "src": "ECO 오답", "module": 1, "tag": "소득·부 증가 → 위험프리미엄 ↓", "vig": 0, "stem": "Holding all else constant, the change in Blake’s income will most likely result in:", "opts": {"A": "an increase in his marginal utility of consumption.", "B": "an increase in his inter-temporal rate of substitution.", "C": "a decrease in his required risk premium for investing in risky assets."}, "ans": "C", "en": "C is correct. The additional annuity payment substantially increases Blake’s income and wealth, which decreases his marginal utility of consumption. As a result, the average loss of marginal utility from any risk taking decreases as his wealth increases. Thus, he requires a lower risk premium and is willing to buy more risky assets.", "ko": "소득·부 ↑ → 소비의 한계효용 ↓ → 위험을 져서 잃는 효용이 줄어듦 → 위험회피도 ↓ → 요구 위험프리미엄 ↓ → 위험자산을 더 많이 삼.", "trap": "부 ↑ → 한계효용 '감소'. 한계효용이 늘어난다고 착각하지 말 것.", "f": "", "why": {"A": "방향 반대. 부가 늘면 소비의 한계효용은 감소합니다(한계효용 체감).", "B": "기간 간 대체율(m = 미래 한계효용/현재 한계효용)이 올라간다는 근거는 없습니다. 이 문제의 핵심은 부 증가 → 위험회피 ↓ → 요구 위험프리미엄 ↓입니다."}, "orig": "ECO Module 1 Q2"}, {"id": "ECO-M1-Q3", "src": "ECO 오답", "module": 1, "tag": "인플레이션 불확실성 프리미엄 계산", "vig": 0, "stem": "The implied premium for inflation uncertainty for the one-year government zero-coupon bond proposed by Carlisle is closest to:", "opts": {"A": "0.23%.", "B": "0.37%.", "C": "1.10%."}, "ans": "B", "en": "B is correct. For a one-year default-free nominal zero-coupon bond, P0 = CF1/(1 + r + π + θ). Thus 1 + r + π + θ = 100/96.37 = 1.0377. The implied premium for inflation uncertainty is θ = 1.0377 − (1 + 0.0115 + 0.0225) = 1.0377 − 1.0340 = 0.0037, or 0.37%.", "ko": "1년 무이표 명목 국채: P = 100/(1 + r + π + θ). 100/96.37 = 1.0377 → r + π + θ = 3.77%. r = 1.15%, π = 2.25% → θ = 3.77% − 3.40% = 0.37%.", "trap": "가격 → 총수익률 → 실질금리·기대인플레이션 차감 = 인플레이션 불확실성 프리미엄(θ).", "f": "P0 = CF1 / (1 + r + π + θ)  ⇒  θ = CF1/P0 − 1 − r − π", "why": {"A": "0.23%는 계산 근거가 없는 값입니다. 1.0377 − 1.0340 = 0.0037입니다.", "C": "1.10%는 기대인플레이션(2.25%)에서 실질금리(1.15%)를 뺀 값으로, 의미 없는 차이입니다. 총수익률(3.77%)에서 실질금리와 기대인플레이션을 모두 빼야 합니다."}, "orig": "ECO Module 1 Q3"}, {"id": "ECO-M1-Q7", "src": "ECO 오답", "module": 1, "tag": "경기침체 → 수익률곡선 steepen", "vig": 0, "stem": "If Carlisle’s prediction about the economy of Country #3 is realized, the yield curve in Country #3 will most likely:", "opts": {"A": "remain flat.", "B": "become upward sloping.", "C": "become downward sloping."}, "ans": "B", "en": "B is correct. The yield curve in Country 3 is currently flat (Exhibit 1), and Carlisle predicts a recession. During a recession, short-term rates tend to be lower because central banks tend to lower their policy rate in these times. However, the impact of monetary policy on longer-term rates will not be as strong because the central bank will usually be expected to bring short-term rates back to normal as the recession recedes. Thus, the slope of the yield curve will likely become upward sloping during the recession.", "ko": "경기침체 시 중앙은행이 정책금리를 낮춰 단기금리가 크게 하락. 장기금리는 '침체가 끝나면 금리가 정상화될 것'이라는 기대 때문에 덜 하락. → 현재 평평한 곡선이 우상향(가팔라짐)으로 변함.", "trap": "역전은 침체의 '선행' 신호, 침체 '중'에는 steepen.", "f": "", "why": {"A": "침체가 오면 단기금리가 장기금리보다 더 많이 떨어지므로 평평한 상태로 남지 않습니다.", "C": "역전(inverted) 곡선은 보통 침체 '이전'(긴축 후반, 정책금리 인하 기대)에 나타납니다. 침체 중에는 단기금리 인하로 곡선이 가팔라집니다."}, "orig": "ECO Module 1 Q7"}, {"id": "ECO-M1-Q11", "src": "ECO 오답", "module": 1, "tag": "고성장 → 실질금리 ↑ (차입 증가)", "vig": null, "stem": "Default-free real interest rates tend to be relatively high in countries with high expected economic growth because investors:", "opts": {"A": "increase current borrowing.", "B": "have high inter-temporal rates of substitution.", "C": "have high uncertainty about levels of future consumption."}, "ans": "A", "en": "A is correct. The average level of default-free real interest rates is positively related to the expected rate of growth of the underlying economy and also to the volatility of economic growth in the economy. During periods of high expected economic growth, investors are less worried about the future and their consumption abilities in the future; that is, their inter-temporal rate of substitution is low, so they borrow more today and save less. Other things being equal, this means that the average level of default-free real interest rates (the reciprocal of the rate of substitution, see Equation 4) should be higher in an economy with high growth and lower in an economy with lower, more stable growth.", "ko": "고성장이 예상되면 투자자는 미래 소비를 덜 걱정 → 기간 간 대체율(m)이 낮음 → 지금 더 빌리고 덜 저축 → 실질 무위험이자율(≈ 1/m − 1) ↑.", "trap": "금리 ∝ 1/m. 고성장 → m ↓ → 금리 ↑.", "f": "1 + R = 1 / E(m),  m = u′(미래 소비)/u′(현재 소비)", "why": {"B": "방향 반대. 고성장 기대 시 기간 간 대체율은 '낮습니다'. 금리는 대체율의 역수이므로 대체율이 낮을 때 금리가 높습니다.", "C": "고성장 자체는 미래 소비 수준의 불확실성을 뜻하지 않습니다. 고성장 국가에서 금리가 높은 이유는 현재 차입 증가(저축 감소)입니다."}, "orig": "ECO Module 1 Q11"}, {"id": "ECO-M1-Q15", "src": "ECO 오답", "module": 1, "tag": "경기침체 → 수익률곡선 steepen", "vig": null, "stem": "During a recession, the slope of the yield curve for default-free government bonds is most likely to:", "opts": {"A": "flatten.", "B": "steepen.", "C": "become inverted."}, "ans": "B", "en": "B is correct. During a recession, short rates are often lower because central banks tend to lower their policy rate in these times because the output gap is likely to be negative. However, the impact of such monetary policy on longer-term rates will not be as strong, so long rates may not fall by as much as short rates. The central bank will usually be expected to bring short-term rates back to normal as the recession recedes, and the risk-free rates will increase as economic growth recovers. Thus, the slope of the yield curve will typically steepen during a recession.", "ko": "침체 시 output gap이 음수 → 중앙은행 정책금리 인하 → 단기금리 크게 하락. 장기금리는 경기 회복 후 금리 정상화 기대로 덜 하락 → 곡선 기울기 steepen.", "trap": "침체 '중' = 단기금리 ↓↓ → steepen.", "f": "", "why": {"A": "flatten은 경기 확장 후반(정책금리 인상)에 나타나는 모습입니다.", "C": "역전은 보통 침체 직전에 나타나는 신호입니다. 침체 중에는 단기금리 하락으로 가팔라집니다."}, "orig": "ECO Module 1 Q15"}, {"id": "ECO-M1-Q16", "src": "ECO 오답", "module": 1, "tag": "우상향 곡선 = 단기채가 좋은 헤지", "vig": null, "stem": "One interpretation of an upward sloping yield curve is that the returns to short-dated bonds are:", "opts": {"A": "uncorrelated with bad times.", "B": "more positively correlated with bad times than are returns to long-dated bonds.", "C": "more negatively correlated with bad times than are returns to long-dated bonds."}, "ans": "C", "en": "C is correct. One interpretation of an upward-sloping yield curve is that returns to short-dated bonds are more negatively correlated with bad times than are returns to long-dated bonds. This interpretation is based on the notion that investors are willing to pay a premium and accept a lower return for short-dated bonds if they believe that long-dated bonds are not a good hedge against economic “bad times.”", "ko": "우상향 곡선의 해석: 단기채 수익은 bad times와 '더 음(−)의 상관' → 좋은 헤지(보험 가치) → 낮은 기대수익도 수용. 장기채는 나쁜 헤지 → 위험프리미엄 요구 → 장기 수익률이 더 높음.", "trap": "좋은 헤지 = bad times와 음의 상관 = 낮은 기대수익. 단기채(좋은 헤지) vs 장기채(나쁜 헤지) → 우상향.", "f": "", "why": {"A": "단기채가 bad times와 무상관이면 헤지 가치가 없어 단기 수익률이 낮을 이유가 사라집니다.", "B": "방향 반대. 단기채가 bad times와 더 양(+)의 상관이면 단기채가 더 나쁜 헤지가 되어 곡선이 역전 방향이 됩니다."}, "orig": "ECO Module 1 Q16"}, {"id": "ECO-M1-Q17", "src": "ECO 오답", "module": 1, "tag": "곡선 기울기 = 금리 기대 + 위험프리미엄", "vig": null, "stem": "An analyst, who measures yield as a combination of interest rates and premiums, observes an upward-sloping, default-free government bond nominal yield curve. Which of the following statements is correct?", "opts": {"A": "Interest rates must be expected to rise in the future.", "B": "Bond risk premiums must be expected to rise in the future.", "C": "Expectations relating to the future direction of interest rates are indeterminate."}, "ans": "C", "en": "C is correct. An upward-sloping yield curve may be caused by a combination of expected rate increases and positive bond risk premiums. It may also be a combination of expectations that interest rates will be unchanged in the future coupled with positive bond risk premiums. Lastly, an upward-sloping yield curve may actually be a reflection of expected rate cuts that are more than offset by the existence of positive bond risk premiums. So, expectations relating to the future direction of interest rates are indeterminate.", "ko": "우상향 곡선 = (기대 금리 변화) + (채권 위험프리미엄)의 합이 양수라는 뜻일 뿐. 금리 인상 기대 + 프리미엄, 금리 불변 + 프리미엄, 금리 인하 기대 < 프리미엄 모두 가능 → 금리 방향은 판단 불가(indeterminate).", "trap": "두 항의 합만 알 수 있고 각각의 값은 알 수 없음.", "f": "기울기 ≈ 기대 금리 변화 + bond risk premium", "why": {"A": "금리가 그대로이거나 내려가도 양(+)의 위험프리미엄이 더 크면 곡선은 우상향일 수 있습니다.", "B": "현재 곡선의 기울기는 프리미엄의 '수준'을 반영할 뿐, 프리미엄이 앞으로 오른다는 뜻이 아닙니다."}, "orig": "ECO Module 1 Q17"}, {"id": "ECO-M1-Q28", "src": "ECO 오답", "module": 1, "tag": "상업용 부동산 할인율 = 주식 + 유동성 프리미엄", "vig": null, "stem": "Which of the following statements relating to commercial real estate is correct?", "opts": {"A": "Rental income from commercial real estate is generally unstable across business cycles.", "B": "Commercial real estate investments generally offer a good hedge against bad consumption outcomes.", "C": "The key difference in the discount rates applied to the cash flows of equity investments and commercial real estate investments relates to liquidity."}, "ans": "C", "en": "C is correct. To arrive at an appropriate discount rate to be used to discount the cash flows from a commercial real estate investment, a liquidity premium is added to the discount rate applicable to equity investments. The added liquidity premium provides additional compensation for the risk that the real estate investment may be very illiquid in bad economic times.", "ko": "상업용 부동산 할인율 = 주식 할인율 + 유동성 프리미엄. 부동산은 bad times에 특히 비유동적이므로 그에 대한 추가 보상이 필요.", "trap": "부동산 = 채권(임대료) + 주식(가치 변동) 성격 + 비유동성. 헤지 성격은 '나쁨'.", "f": "Discount rate(CRE) = R + π + θ + 주식형 프리미엄 + 유동성 프리미엄", "why": {"A": "임대수입은 장기 임대계약 덕분에 경기와 무관하게 비교적 안정적입니다(채권 같은 성격).", "B": "부동산 가치는 경기 침체 때 함께 하락하므로 bad consumption outcome에 대한 헤지가 좋지 않습니다."}, "orig": "ECO Module 1 Q28"}, {"id": "ECO-M1-Q29", "src": "ECO 오답", "module": 1, "tag": "경기기업 이익 = 경기 선행지표", "vig": 1, "stem": "Which of Ferguson’s observations about equities and business cycles is most likely correct?", "opts": {"A": "Observation 1", "B": "Observation 2", "C": "Observation 3"}, "ans": "B", "en": "Correct. Observation 2 is correct. Profits of cyclical companies typically pick up before signs of a broader economic recovery is evident, and as a result, they are often used as a leading economic indicator.\nA: Incorrect. Observation 1 is incorrect. While toward the end of a recession (and sometimes while the recession is still in place) sharp increases in corporate profit growth tend to occur as expenses have been cut and profits quickly respond to any increase in revenue, this would not result in a negative risk premium.\nC: Incorrect. Observation 3 is incorrect. Equities are generally not a hedge for bad consumption outcomes (which occur in a recession).", "ko": "Observation 2가 맞음. 경기순환형 기업의 이익은 경기 회복 신호보다 먼저 반등 → 경기 선행지표로 쓰임.", "trap": "주식 = 경기와 같이 움직임 → 헤지 '나쁨', 위험프리미엄 '양수'.", "f": "", "why": {"A": "침체 막바지에 이익 증가율이 급등하는 것은 맞지만, 그렇다고 위험프리미엄이 음수가 되지는 않습니다.", "C": "주식은 bad times(침체)에 함께 하락하므로 bad consumption outcome에 대한 헤지가 나쁩니다."}, "orig": "ECO Module 1 Q29"}, {"id": "ECO-M1-Q32", "src": "ECO 오답", "module": 1, "tag": "부동산 PV 분자 = 순임대수입", "vig": 1, "stem": "In her discussion about the present value formula for commercial real estate, McKenna is least likely correct regarding her description of the:", "opts": {"A": "numerator.", "B": "discount rate for a commercial lease.", "C": "discount rate for a government lease."}, "ans": "A", "en": "Correct. Her description of the numerator is incorrect. The numerator in this formula consists of the sum of future rent payments, but instead it should be net rental income, which also incorporates expenses incurred.\nB: Incorrect. Her description of the discount rate for a commercial lease is correct. A commercial tenant paying a fixed-rate nominal rent would have a discount rate that incorporates the real default-free rate, expected future inflation, a risk-premium for future inflation uncertainty, a risk premium for the uncertainty of the property value at the end of the lease, a risk premium for credit risk, and a risk premium for the illiquidity of the property.\nC: Incorrect. Her description of the discount rate for a government lease is correct. The discount rate for a property leased to a developed market government tenant that pays rent indexed to inflation would consist of the real default-free rate, a risk premium for the uncertainty of the property value at the end of the lease, and a risk premium for the illiquidity of the property.", "ko": "부동산 현재가치 공식의 분자는 미래 '순(net)' 임대수입(임대료 − 비용)이어야 함. McKenna는 분자를 '임대료 총합'이라고 했으므로 틀림. 두 할인율 설명은 맞음.", "trap": "'least likely correct' 문제. 분자는 gross rent가 아니라 net rental income.", "f": "", "why": {"B": "상업 임차인 고정 명목 임대료의 할인율 = 실질 무위험 + 기대인플레이션 + 인플레이션 불확실성 + 잔존가치 불확실성 + 신용 + 비유동성 프리미엄. McKenna 설명이 맞습니다.", "C": "물가연동 정부 임차인의 할인율 = 실질 무위험 + 잔존가치 불확실성 + 비유동성 프리미엄. 인플레이션·신용 프리미엄이 없는 것이 맞으므로 설명이 옳습니다."}, "orig": "ECO Module 1 Q32"}, {"id": "ECO-M1-Q39", "src": "ECO 오답", "module": 1, "tag": "내구재 기업 이익 변동성 ↑", "vig": 2, "stem": "Which of Silva's observations regarding economic cycles and corporate earnings is most accurate?", "opts": {"A": "Observation 1", "B": "Observation 2", "C": "Observation 3"}, "ans": "C", "en": "Correct because durable goods manufacturers do have more volatile earnings profiles than non-durable goods manufacturers because of the dramatic shifts in economic cycle-related demand.\nA: Incorrect because corporate profitability is considered a leading, not lagging, indicator of the business cycle. Improvements in profitability are often evident before a recovery is underway.\nB: Incorrect because an understanding of the business cycle is crucial for making earnings projections, particularly in the short term.", "ko": "Observation 3이 맞음. 내구재(자동차·가전 등, 구매를 미룰 수 있음) 제조사는 경기 수요 변화가 커서 비내구재 제조사보다 이익 변동성이 훨씬 큼.", "trap": "이익 = 선행지표, 경기 이해는 단기 예측에 더 중요.", "f": "", "why": {"A": "기업 이익은 경기의 후행지표가 아니라 '선행'지표입니다. 회복 전에 수익성 개선이 먼저 나타납니다.", "B": "경기순환 이해는 이익 전망, 특히 '단기' 이익 전망에 매우 중요합니다."}, "orig": "ECO Module 1 Q39"}, {"id": "ECO-M1-Q40", "src": "ECO 오답", "module": 1, "tag": "스프레드 축소 → 경기민감·저등급 유리", "vig": 2, "stem": "Based on GERA's global economic forecast, which of the following industries is most appropriate for GERA's corporate bond research service to recommend?", "opts": {"A": "Airline industry", "B": "Beverage industry", "C": "Household products industry"}, "ans": "A", "en": "Correct because in times of narrowing spreads, lower-rated more economically sensitive corporate bonds will tend to outperform higher-rated bonds in more stable industries. Airline bonds are generally more economically sensitive than consumer staples industries such as beverages and household products and would be likely to outperform in this environment.\nB: Incorrect because in times of narrowing spreads, lower-rated more economically sensitive corporate bonds will tend to outperform higher-rated bonds in more stable industries. Airline bonds are generally more economically sensitive than consumer staples industries such as beverages and household products and would be likely to outperform in this environment.\nC: Incorrect because in times of narrowing spreads, lower-rated more economically sensitive corporate bonds will tend to outperform higher-rated bonds in more stable industries. Airline bonds are generally more economically sensitive than consumer staples industries such as beverages and household products and would be likely to outperform in this environment.", "ko": "스프레드가 좁혀지는 환경에서는 경기에 민감한 저등급 회사채가 안정적인 고등급 회사채보다 성과가 좋음. 항공업은 경기민감 업종이고, 음료·생활용품은 필수소비재(경기 방어적)라서 항공업 채권을 추천.", "trap": "스프레드 축소 = 가장 넓고 경기민감한 채권이 가장 많이 개선.", "f": "", "why": {"B": "음료는 필수소비재로 경기에 둔감해 스프레드가 축소될 때 개선 폭이 작습니다.", "C": "생활용품은 필수소비재로 경기에 둔감해 스프레드가 축소될 때 개선 폭이 작습니다."}, "orig": "ECO Module 1 Q40"}, {"id": "ECO-M1-Q45", "src": "ECO 오답", "module": 1, "tag": "예상된 정보 = 가격 변화 없음", "vig": 3, "stem": "Which of the following is the most likely impact on short-term bond prices if Quantum’s expectations regarding the payroll report are correct?", "opts": {"A": "Fall", "B": "No change", "C": "Rise"}, "ans": "B", "en": "Correct. Although Quantum is forecasting a fairly low non-farm payroll number, their expectation is in line with market consensus forecasts. Although this data may be considered weak, it provides information that is anticipated and thus already reflected in asset prices. Prices would be more likely to rise or fall if the news is a surprise relative to fully anticipated information.\nA: Incorrect. Bond prices are unlikely to rise or fall based on this information because it is already anticipated by the market.\nC: Incorrect. Bond prices are unlikely to rise or fall based on this information because it is already anticipated by the market.", "ko": "Quantum의 고용지표 전망이 낮긴 하지만 시장 컨센서스와 같음 → 이미 가격에 반영 → 단기채 가격 변화 없음. 가격은 기대와 다른 '서프라이즈'에만 반응.", "trap": "수준(약함)이 아니라 기대 대비 서프라이즈로 판단.", "f": "", "why": {"A": "약한 지표라도 이미 예상된 정보면 가격에 반영돼 있어 하락하지 않습니다.", "C": "약한 고용지표가 금리 하락(채권가격 상승)으로 이어지려면 컨센서스보다 나빠야 합니다. 예상과 같으면 변화가 없습니다."}, "orig": "ECO Module 1 Q45"}, {"id": "ECO-M1-Q48", "src": "ECO 오답", "module": 1, "tag": "하방 서프라이즈 → 공매도 대상 고르기", "vig": 3, "stem": "Based on Quantum’s economic forecast and the data in Exhibit 1, which bond is Coombs most likely to recommend as the short position for the hedge fund?", "opts": {"A": "Bond 1", "B": "Bond 2", "C": "Bond 3"}, "ans": "B", "en": "Correct. Bond 1 is in a non-cyclical industry, unlike Bond 2, that is in a cyclical industry. Bond 1 has a slightly higher debt-to-capital ratio than Bond 2 but not material. Bond 2 has a relatively tight spread compared with Bond 1. These factors suggest that Bond 2 is a better candidate for a short position. During an environment in which GDP is forecast to surprise to the downside, higher-rated issues are likely to outperform such as Bond 3. Given Quantum’s expectation for declining GDP and its relatively tight spread, Bond 2 is the best candidate for a short position.\nA: Incorrect. Bond 1 is in a non-cyclical industry, unlike Bond 2, which is in a cyclical industry. Bond 1 has a slightly higher debt-to-capital ratio than Bond 2 but not material. Bond 2 has a relatively tight spread compared with Bond 1. These factors suggest that Bond 2 is a better candidate for a short position.\nC: Incorrect. During an environment where GDP is forecast to surprise to the downside, higher rated issues such as Bond 3 are likely to outperform.", "ko": "GDP 하방 서프라이즈 예상 → 스프레드 확대. 공매도 대상은 경기민감(cyclical) 업종이면서 현재 스프레드가 좁은(비싸게 거래되는) 채권 → Bond 2. 고등급인 Bond 3은 이런 환경에서 상대적으로 강함.", "trap": "공매도 = 경기민감 + 현재 스프레드가 좁음(넓어질 여지 큼).", "f": "", "why": {"A": "Bond 1은 비경기 업종이고 스프레드도 Bond 2보다 넓어 확대 여지가 작습니다. 부채비율이 조금 높은 것은 결정적이지 않습니다.", "C": "Bond 3은 고등급으로 경기 하방 서프라이즈 때 상대적으로 성과가 좋아 공매도 대상이 아닙니다."}, "orig": "ECO Module 1 Q48"}, {"id": "ECO-M1-Q54", "src": "ECO 오답", "module": 1, "tag": "경기 확장 → 회수율 ↑", "vig": null, "stem": "Recovery rates on corporate bonds tend to be higher when the economy is expanding because:", "opts": {"A": "credit spreads are higher.", "B": "default probabilities are lower.", "C": "any secured assets are likely to be sold at a higher price."}, "ans": "C", "en": "Correct because assets that can be sold in order to recover value for bond holders are likely to fetch a higher price in a buoyant economic environment than in a stagnant one.\nA: Incorrect because higher recovery rates will result in lower, not higher, credit spreads.\nB: Incorrect because, in the event of a default, the amount that the bond investor receives will depend on the recovery rate. Recovery rates are not directly related to default probabilities as they represent the amount received by the investor once default happens.", "ko": "경기 확장기에는 담보자산을 더 높은 가격에 팔 수 있어 부도 시 회수율이 높아짐.", "trap": "회수율(부도 후 회수)과 부도확률(부도 여부)은 별개 개념.", "f": "Expected loss = PD × (1 − Recovery rate)", "why": {"A": "회수율이 높으면 신용스프레드는 오히려 '낮아집니다'.", "B": "회수율은 '부도가 난 뒤' 받는 비율이라 부도확률과 직접 연결되지 않습니다."}, "orig": "ECO Module 1 Q54"}, {"id": "ECO-M1-Q55", "src": "ECO 오답", "module": 1, "tag": "침체기 최악 채권: 저등급 + 경기민감", "vig": null, "stem": "An analyst gathers the following information about three corporate bonds:\n\tIndustrial Sector\tCredit Rating\nBond X\tConsumer cyclical\tAAA\nBond Y\tConsumer cyclical\tBBB\nBond Z\tConsumer non-cyclical\tBBB\nAll else being equal, which bond is most likely to have the worst performance as the economy enters a recession?", "opts": {"A": "Bond X", "B": "Bond Y", "C": "Bond Z"}, "ans": "B", "en": "Correct because lower-rated (BBB) bonds will underperform higher-rated (AAA) bonds and bonds of issuers in the consumer cyclical sector will underperform bonds of issuers in the consumer non-cyclical sector. Hence, Bond Y is likely to underperform Bond X and Bond Z in a recession. When spreads are narrowing relative to government bonds, the spreads between higher- and lower-rated bond categories also narrow. In these times, although corporate bonds will generally outperform government bonds, lower-rated corporate bonds will tend to outperform higher-rated bonds. The converse is true as spreads widen. Additionally, in past recessions, the spread on the consumer cyclical sector rose more dramatically than it did for corporate bonds in the consumer non-cyclical sector.\nA: Incorrect because Bond X is from the same sector as Bond Y and has a higher credit rating (AAA) than Bond Y (BBB). Hence, Bond Y will likely underperform Bond X in a recession.\nC: Incorrect because Bond Z has the same credit rating as Bond Y and belongs to the consumer non-cyclical sector, while Bond Y belongs to the consumer cyclical sector. Hence, Bond Y will likely underperform Bond Z in a recession.", "ko": "침체기에는 스프레드 확대 → 저등급(BBB)이 고등급(AAA)보다, 경기소비재가 필수소비재보다 성과가 나쁨. 두 조건을 모두 가진 Bond Y가 최악.", "trap": "스프레드 확대기: 낮은 등급 + 경기민감 업종 = 최악.", "f": "", "why": {"A": "Bond X는 Y와 같은 업종이지만 AAA라 침체기에 Y보다 성과가 좋습니다.", "C": "Bond Z는 Y와 같은 BBB지만 경기방어 업종이라 침체기에 Y보다 성과가 좋습니다."}, "orig": "ECO Module 1 Q55"}, {"id": "ECO-M1-Q57", "src": "ECO 오답", "module": 1, "tag": "주식의 소비 헤지 성격 = 나쁨", "vig": null, "stem": "The consumption hedging properties of equities are considered:", "opts": {"A": "poor as the potential for loss is high.", "B": "poor as equities tend not to pay off in bad times.", "C": "good as equities have outperformed bonds historically."}, "ans": "B", "en": "Correct because, when the economy turns down, so (normally) do corporate profits and it is in these bad times that investors need their investments to offset these worsening earnings. Because of the pro-cyclicality of economies and corporate profits (in aggregate), equities are not a good hedge against bad consumption outcomes. Hence, the consumption hedging properties of equities are considered poor.\nA: Incorrect because, while the potential for loss is indeed high for equities, this is not a direct consideration for their consumption hedging properties.\nC: Incorrect because the consumption hedging properties of equities are considered poor, not good. Also, while equities have indeed outperformed bonds historically, this is not a direct consideration for their consumption hedging properties.", "ko": "경기가 나쁠 때 기업이익도 함께 나빠져 주식은 bad times에 수익을 주지 않음 → 소비 헤지 성격이 나쁨 → 위험프리미엄 요구.", "trap": "헤지 판단 기준 = bad times와의 공분산.", "f": "", "why": {"A": "손실 가능성이 큰 것은 맞지만, 헤지 성격의 직접적인 근거는 아닙니다. 헤지 여부는 'bad times에 수익을 주는가'로 판단합니다.", "C": "주식의 헤지 성격은 '나쁩니다'. 과거에 채권보다 수익이 높았던 것도 헤지 성격과는 관계가 없습니다."}, "orig": "ECO Module 1 Q57"}, {"id": "ECO-M1-Q58", "src": "ECO 오답", "module": 1, "tag": "trailing P/E vs forward P/E", "vig": null, "stem": "If investors expect a company's earnings to grow, the company's historical P/E ratio will most likely be:", "opts": {"A": "less than its forward P/E ratio.", "B": "equal to its forward P/E ratio.", "C": "greater than its forward P/E ratio."}, "ans": "C", "en": "Correct because, when the EPS used to estimate the ratio refers to last year's earnings, the P/E is referred to as being a historical or a trailing P/E. However, when the EPS is based on an estimate of future earnings, it is referred to as the leading or forward P/E. If a company's EPS is expected to grow, then its historical P/E will be greater than its forward P/E.\nA: Incorrect because, if a company's EPS is expected to grow, then its historical P/E will be greater, not less, than its forward P/E.\nB: Incorrect because, if a company's EPS is expected to grow, then its historical P/E will be greater than, not equal to, its forward P/E.", "ko": "이익 성장 예상 → 미래 EPS > 과거 EPS → 같은 주가로 나누면 trailing(과거) P/E > forward(미래) P/E.", "trap": "분모(EPS)가 커지면 P/E는 작아짐.", "f": "Trailing P/E = P / EPS(과거), Forward P/E = P / E(EPS 미래)", "why": {"A": "방향 반대. EPS가 늘면 forward P/E의 분모가 더 커서 forward P/E가 더 작습니다.", "B": "EPS가 변하지 않을 때만 같습니다."}, "orig": "ECO Module 1 Q58"}, {"id": "ECO-M1-Q60", "src": "ECO 오답", "module": 1, "tag": "실질금리 ∝ GDP 성장률 & 변동성", "vig": null, "stem": "The real default-free interest rate in an economy is most likely positively related to:", "opts": {"A": "the expected growth rate of GDP only.", "B": "the expected volatility of GDP growth only.", "C": "both the expected growth rate of GDP and the expected volatility of GDP growth."}, "ans": "C", "en": "Correct because GDP growth from one period to the next cannot be perfectly anticipated. Under these uncertain circumstances, interest rates will still be positively related to the expected growth rate of GDP, but additionally they will be positively related to the expected volatility of GDP growth.\nA: Incorrect because interest rates are also positively related to the expected volatility of GDP growth.\nB: Incorrect because interest rates are also positively related to the expected growth rate of GDP.", "ko": "실질 무위험이자율은 기대 GDP 성장률과 기대 GDP 성장 변동성 '둘 다'와 양(+)의 관계.", "trap": "'only'가 붙은 선택지 주의. 성장률·변동성 둘 다.", "f": "", "why": {"A": "성장률뿐 아니라 성장 변동성과도 양의 관계입니다.", "B": "변동성뿐 아니라 성장률 자체와도 양의 관계입니다."}, "orig": "ECO Module 1 Q60"}, {"id": "ECO-M1-Q61", "src": "ECO 오답", "module": 1, "tag": "BEI = 명목채 − 실질채 수익률", "vig": null, "stem": "The break-even inflation rate is the difference between the yield on a zero-coupon default-free nominal bond and:", "opts": {"A": "nominal expected inflation for the same period.", "B": "the yield on a zero-coupon default-free real bond of the same maturity.", "C": "the premium required by investors to compensate them for uncertainty about future inflation."}, "ans": "B", "en": "Correct because the difference between the yield on, for example, a zero-coupon default-free nominal bond and on a zero-coupon default-free real bond of the same maturity is known as the break-even inflation (BEI) rate.\nA: Incorrect because, while the break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation, these are not subtracted from the yield on a zero-coupon default-free nominal bond to get to the break-even inflation rate.\nC: Incorrect because, while the break-even inflation rate will incorporate the inflation expectations of investors over the investment horizon plus a risk premium that will be required by investors to compensate them predominantly for uncertainty about future inflation, these are not subtracted from the yield on a zero-coupon default-free nominal bond to get to the break-even inflation rate.", "ko": "Break-even inflation(BEI) = 만기가 같은 무위험 명목 무이표채 수익률 − 무위험 실질(물가연동) 무이표채 수익률. BEI에는 기대인플레이션 + 인플레이션 불확실성 프리미엄이 들어 있음.", "trap": "BEI = 명목 − 실질(같은 만기) = π + θ.", "f": "BEI = y(nominal) − y(real) = π + θ", "why": {"A": "기대인플레이션은 BEI의 '구성요소'이지, 명목 수익률에서 빼는 대상이 아닙니다.", "C": "인플레이션 불확실성 프리미엄도 BEI의 구성요소입니다. 명목 수익률에서 빼는 것은 실질채 수익률입니다."}, "orig": "ECO Module 1 Q61"}, {"id": "ECO-M1-Q66", "src": "ECO 오답", "module": 1, "tag": "효율적 시장: 예상된 정보는 이미 반영", "vig": null, "stem": "In efficient markets, asset values should:", "opts": {"A": "fully reflect information that has been anticipated.", "B": "respond to news that confirm expectations of future cash flows.", "C": "be driven by past cash flows and current expectations of future cash flows."}, "ans": "A", "en": "Correct because, since asset values are dependent on expectations of future cash flows, information that changes expectations affects asset values and realized returns. Information that has been anticipated is already reflected in asset prices, but information that is different from what was expected constitutes real news that requires expectations to adjust.\nB: Incorrect because information that has been anticipated is already reflected in asset prices, but information that is different from what was expected constitutes real news that requires expectations to adjust. Investors judge economic data releases relative to their expectations for the data. Prices may fall (rise) despite 'good' ('bad') news if the expectation was for better (worse) news.\nC: Incorrect because asset values depend not on past cash flows but on the expectation of future cash flows.", "ko": "효율적 시장에서 자산가치는 이미 예상된 정보를 모두 반영. 기대와 다른 정보(서프라이즈)만 가격을 움직임.", "trap": "'confirm expectations' = 새 정보 아님 → 가격 반응 없음.", "f": "", "why": {"B": "기대를 확인해 주는 뉴스는 이미 가격에 반영돼 있어 가격이 반응하지 않습니다.", "C": "가치는 과거 현금흐름이 아니라 미래 현금흐름에 대한 기대로 결정됩니다."}, "orig": "ECO Module 1 Q66"}, {"id": "ECO-M1-Q67", "src": "ECO 오답", "module": 1, "tag": "서프라이즈 방향으로 판단", "vig": null, "stem": "A portfolio manager reviews the following year-over-year changes in economic indicators, released just before the stock market opens:\n\tExpected Change\tReported Change\nDurable goods orders\t4.6%\t3.7%\nConsumer price index (CPI)\t3.0%\t3.0%\nRetail sales\t–1.0%\t1.0%\nAll else being equal, asset values will most likely be positively impacted by the reported data for:", "opts": {"A": "retail sales.", "B": "durable goods.", "C": "consumer prices."}, "ans": "A", "en": "Correct because the retail sales data would be considered new information since the actual result differed materially from expectations. The actual change in retail sales was better than the expected change, with the likely impact on asset values being positive.\nB: Incorrect because information that changes expectations affects asset values and realized returns. Information that has been anticipated is already reflected in asset prices, but information that is different from what was expected constitutes real news that requires expectations to adjust. Although the actual data for durable goods was new information, it was below expectations. Therefore, it is likely to have a negative effect on asset prices when compared to retail sales.\nC: Incorrect because information that changes expectations affects asset values and realized returns. Information that has been anticipated is already reflected in asset prices, but information that is different from what was expected constitutes real news that requires expectations to adjust. Since the consumer price data was in line with expectations, it is less likely to affect asset prices when compared to retail sales or durable goods orders.  Practice Topics", "ko": "가격은 기대 대비 차이에만 반응. 소매판매: 예상 −1.0% → 실제 +1.0%로 긍정적 서프라이즈 → 자산가치 상승.", "trap": "절대 수준(+3.7%)이 아니라 기대 대비 차이(−0.9%p)를 봐야 함.", "f": "", "why": {"B": "내구재 주문은 실제(3.7%)가 예상(4.6%)보다 낮아 부정적 서프라이즈입니다. 증가율이 양수여도 기대보다 나쁩니다.", "C": "CPI는 예상과 실제가 같아(3.0%) 새 정보가 아니므로 가격 영향이 없습니다."}, "orig": "ECO Module 1 Q67"}, {"id": "VAR-M1-01", "module": 1, "tag": "BEI = π + θ", "orig": "변형 (오답노트 R34, Schweser LOS 34.e)", "stem": "All else equal, an increase in investors’ uncertainty about future inflation will most likely cause the break-even inflation rate to:", "opts": {"A": "decrease.", "B": "remain unchanged.", "C": "increase."}, "ans": "C", "en": "BEI = yield on non-inflation-indexed bond − yield on inflation-indexed bond of the same maturity = expected inflation (π) + risk premium for inflation uncertainty (θ). Greater inflation uncertainty raises θ and therefore the BEI.", "ko": "BEI = 명목채 수익률 − 같은 만기 물가연동채 수익률 = 기대인플레이션(π) + 인플레이션 불확실성 프리미엄(θ). 불확실성 ↑ → θ ↑ → BEI ↑.", "why": {"A": "방향 반대. 불확실성이 커지면 명목채 투자자가 더 많은 보상을 요구해 BEI가 커집니다.", "B": "BEI에는 기대인플레이션뿐 아니라 불확실성 프리미엄(θ)도 들어 있어 θ가 오르면 BEI도 오릅니다."}, "trap": "BEI ≠ 순수한 기대인플레이션. 불확실성 프리미엄 포함.", "f": "BEI = π + θ", "src": "변형", "vig": null}, {"id": "VAR-M1-02", "module": 1, "tag": "스프레드 축소 → 저등급 개선 폭 최대", "orig": "변형 (오답노트 R34)", "stem": "As an economy emerges from recession and credit spreads generally narrow, which of the following corporate bonds is most likely to experience the greatest rate of improvement in its spread?", "opts": {"A": "An Aaa-rated bond", "B": "An A-rated bond", "C": "A B-rated bond"}, "ans": "C", "en": "When credit spreads are narrowing, the rate of improvement tends to be greatest for bonds issued by entities with the weakest ability to pay, i.e., the lowest-rated bonds with the widest spreads.", "ko": "스프레드가 좁혀질 때는 지급능력이 가장 약하고 스프레드가 가장 넓은 저등급(B) 채권이 가장 많이 개선됨.", "why": {"A": "Aaa 채권은 스프레드가 이미 좁아서 줄어들 여지가 가장 작습니다.", "B": "A등급 채권도 개선되지만, 스프레드가 더 넓은 B등급만큼 크게 줄지는 않습니다."}, "trap": "확장기: 저등급 outperform, 침체기: 고등급 outperform.", "f": "", "src": "변형", "vig": null}, {"id": "VAR-M1-03", "module": 1, "tag": "Expected loss 계산", "orig": "변형 (ECO M1 Q36 해설, 오답노트 R34)", "stem": "A corporate bond has an estimated probability of default of 2% and an expected recovery rate of 35%. The expected loss on the bond is closest to:", "opts": {"A": "0.7%.", "B": "1.3%.", "C": "2.0%."}, "ans": "B", "en": "Expected loss = Probability of default × (1 − Recovery rate) = 2% × (1 − 0.35) = 1.3%.", "ko": "기대손실 = 부도확률 × (1 − 회수율) = 2% × 0.65 = 1.3%.", "why": {"A": "0.7%는 부도확률에 회수율을 곱한 값(2% × 0.35)입니다. (1 − 회수율)을 곱해야 합니다.", "C": "2.0%는 회수율을 무시한 값입니다. 부도가 나도 35%는 회수됩니다."}, "trap": "회수율이 아니라 손실률(1 − 회수율)을 곱함.", "f": "EL = PD × (1 − RR)", "src": "변형", "vig": null}, {"id": "ECO-M2-Q1", "src": "ECO 오답", "module": 2, "tag": "Active return ≠ alpha", "vig": null, "stem": "Wei Liu makes two statements about active portfolio management:\nStatement 1: The “active return” of an actively managed portfolio is the difference between the portfolio’s return and the return on the benchmark portfolio, and it is equal to the managed portfolio’s alpha.\nStatement 2: The active weights are the differences in the managed portfolio’s weights and the benchmark’s weights.\nAre Liu’s statements correct?", "opts": {"A": "Only Statement 1 is correct.", "B": "Only Statement 2 is correct.", "C": "Both statements are correct."}, "ans": "B", "en": "B is correct. Although the first part of Statement 1 is correct (active return, or value added, equals the difference between the managed portfolio return and the benchmark return), active return is not the same as alpha. In other words, RA = RP − RB, while αP = RP − βP × RB. Statement 2 correctly defines active weights.", "ko": "Active return(RA) = RP − RB이지만 alpha(αP = RP − βP·RB)와 같지 않음(β = 1일 때만 같음). → Statement 1은 뒷부분이 틀림. Statement 2(Active weight = 포트폴리오 비중 − 벤치마크 비중)는 맞음.", "trap": "앞부분이 맞아도 뒤에 붙은 '= alpha' 같은 한 구절 때문에 전체가 틀림.", "f": "RA = RP − RB,  αP = RP − βP·RB,  Δwi = wP,i − wB,i", "why": {"A": "Statement 1의 '= alpha' 부분이 틀렸고, Statement 2는 맞습니다.", "C": "Active return은 β를 고려하지 않으므로 alpha와 같지 않습니다. Statement 1은 틀립니다."}, "orig": "ECO Module 2 Q1"}, {"id": "ECO-M2-Q3", "src": "ECO 오답", "module": 2, "tag": "Value added 계산", "vig": null, "stem": "Consider the following asset class returns for calendar year 20X2:\nAsset Class\tPortfolio Weight (%)\tBenchmark Weight (%)\tPortfolio Return (%)\tBenchmark Return (%)\nDomestic equities\t55\t40\t10\t8\nInternational equities\t20\t30\t10\t9\nBonds\t25\t30\t5\t6\nWhat is the value added (or active return) for the managed portfolio?", "opts": {"A": "0.25%", "B": "0.35%", "C": "1.05%"}, "ans": "C", "en": "C is correct. The active return equals the portfolio return minus the benchmark return.\nRP = 0.55(10%) + 0.20(10%) + 0.25(5%) = 8.75%.\nRB = 0.40(8%) + 0.30(9%) + 0.30(6%) = 7.70%.\nRA = RP − RB = 8.75% − 7.70% = 1.05%.", "ko": "RP = 0.55(10) + 0.20(10) + 0.25(5) = 8.75%. RB = 0.40(8) + 0.30(9) + 0.30(6) = 7.70%. RA = 8.75 − 7.70 = 1.05%.", "trap": "포트폴리오 비중 × 포트폴리오 수익률, 벤치마크 비중 × 벤치마크 수익률. 섞어 쓰지 말 것.", "f": "RA = Σ wP,i·RP,i − Σ wB,i·RB,i = Σ Δwi·RB,i + Σ wP,i·RA,i", "why": {"A": "0.25%는 비중·수익률을 일부만 반영한 값입니다. 포트폴리오 수익률(8.75%)과 벤치마크 수익률(7.70%) 전체를 계산한 뒤 차이를 구해야 합니다.", "B": "0.35%도 일부 항목만 반영한 값입니다. RA = 8.75% − 7.70% = 1.05%입니다."}, "orig": "ECO Module 2 Q3"}, {"id": "ECO-M2-Q4", "src": "ECO 오답", "module": 2, "tag": "벤치마크 요건: 투자 기회 반영", "vig": 4, "stem": "Which of Frazee’s concerns best justifies his decision to reject the proposed benchmark?", "opts": {"A": "Concern 1", "B": "Concern 2", "C": "Concern 3"}, "ans": "A", "en": "A is correct. Because the benchmark does not contain many assets that Frazee wants to invest in, the benchmark may not be representative of his investment approach. Concern 2, as stated, is less important because it does not imply that the cost of replicating the benchmark is a serious concern. Finally, Concern 3 actually states a generally positive feature of the benchmark.", "ko": "가장 큰 문제는 Concern 1: Frazee가 사고 싶은 종목이 벤치마크에 없음 → 벤치마크가 그의 투자 기회(opportunity set)를 대표하지 못함. Concern 2(복제 비용이 '다소' 높음)는 심각하지 않고, Concern 3(유동주식수 조정 시가총액 가중)은 오히려 좋은 특징.", "trap": "좋은 벤치마크의 1순위 = 매니저의 투자 기회를 대표할 것.", "f": "", "why": {"B": "한 포지션의 복제 비용이 '다소' 높다는 것은 큰 문제가 아닙니다. 벤치마크가 투자 기회를 대표하지 못하는 것이 훨씬 심각합니다.", "C": "Float-adjusted 시가총액 가중은 좋은 벤치마크의 일반적인 특징이라 거부할 근거가 아닙니다."}, "orig": "ECO Module 2 Q4"}, {"id": "ECO-M2-Q6", "src": "ECO 오답", "module": 2, "tag": "Active return 일관성 = IR", "vig": 4, "stem": "Based on Exhibit 1, which fund is expected to produce the greatest consistency of active return?", "opts": {"A": "Fund X", "B": "Fund Y", "C": "Fund Z"}, "ans": "C", "en": "C is correct. The IR measures the consistency of active return: IR = (RP − RB)/σ(RP − RB) = RA/σA.\nIR for Fund X = (10.0 − 9.4)/5.2 = 0.12.\nIR for Fund Y = (11.6 − 9.4)/9.2 = 0.24.\nIR for Fund Z = (13.2 − 9.4)/15.1 = 0.25.\nFund Z has the largest IR and thus is expected to produce the greatest consistency of active return.", "ko": "Active return의 일관성은 IR로 측정. IR = (RP − RB)/active risk. X: 0.6/5.2 = 0.12, Y: 2.2/9.2 = 0.24, Z: 3.8/15.1 = 0.25 → Fund Z가 가장 높음.", "trap": "'consistency of active return' = IR. Sharpe ratio로 고르면 함정.", "f": "IR = (RP − RB) / σ(RP − RB) = RA / σA", "why": {"A": "Fund X는 active risk가 가장 낮지만 IR(0.12)도 가장 낮습니다. 일관성은 active risk가 아니라 IR로 판단합니다.", "B": "Fund Y는 Sharpe ratio(0.50)가 가장 높지만, active return의 일관성은 Sharpe ratio가 아니라 IR로 봅니다. Y의 IR(0.24)은 Z(0.25)보다 낮습니다."}, "orig": "ECO Module 2 Q6"}, {"id": "ECO-M2-Q7", "src": "ECO 오답", "module": 2, "tag": "SR_P² = SR_B² + IR²", "vig": 4, "stem": "Based on Exhibit 1, combining Fund W with a fund that replicates the benchmark would produce a Sharpe ratio closest to:", "opts": {"A": "0.44.", "B": "0.56.", "C": "0.89."}, "ans": "B", "en": "B is correct. Given the IR for Fund W of 0.35 and the benchmark’s SR of 0.44, the optimal combination of the benchmark and Fund W has SR_P² = SR_B² + IR², so SR_P = (0.44² + 0.35²)^0.5 = 0.56.", "ko": "벤치마크와 액티브 펀드를 최적으로 결합한 포트폴리오의 Sharpe ratio: SR_P = √(0.44² + 0.35²) = √(0.1936 + 0.1225) = 0.56.", "trap": "SR과 IR을 단순 합산하지 말고, 제곱해서 더한 뒤 제곱근.", "f": "SR_P² = SR_B² + IR²", "why": {"A": "0.44는 벤치마크 SR 그대로입니다. 액티브 펀드를 더하면 IR만큼 SR이 올라갑니다.", "C": "0.89는 SR과 IR을 그냥 더한 값(0.44 + 0.35 = 0.79)과도 다르며, 공식은 제곱합의 제곱근입니다."}, "orig": "ECO Module 2 Q7"}, {"id": "ECO-M2-Q9", "src": "ECO 오답", "module": 2, "tag": "Active return 달성 능력 = IR", "vig": 4, "stem": "Based on the data presented in Exhibit 2, the candidate with the greatest skill at achieving active returns appears to be:", "opts": {"A": "Candidate A.", "B": "Candidate B.", "C": "Candidate C."}, "ans": "B", "en": "B is correct. The IR measures the consistency of active return generation. A higher ratio generally indicates better managerial skill at achieving active returns on a risk-adjusted basis. The IR for Candidate B (0.746) is higher than the IR for Candidate A (0.582) and Candidate C (0.723).\nThus, Candidate B appears to have the greatest skill, as indicated by the highest IR of 0.746.", "ko": "실제 active return을 '달성'하는 능력은 IR로 비교(TC까지 반영된 종합 지표). IR: A 0.582, B 0.746, C 0.723 → Candidate B.", "trap": "'achieving / consistency / 실제 성과' → IR. 예측 정확도만 묻는 경우에만 IC.", "f": "IR ≈ TC × IC × √BR", "why": {"A": "Candidate A는 TC(0.832)가 가장 높지만, 실제 성과를 보여주는 IR(0.582)은 가장 낮습니다.", "C": "Candidate C는 IC(0.22)가 가장 높아 예측력은 좋지만, TC가 낮아(0.548) 예측을 포트폴리오로 잘 옮기지 못했습니다. IR(0.723)은 B보다 낮습니다."}, "orig": "ECO Module 2 Q9"}, {"id": "ECO-M2-Q14", "src": "ECO 오답", "module": 2, "tag": "IR: 현금 추가 vs 액티브 비중 비례 확대", "vig": 5, "stem": "Which of Singh’s statements regarding the information ratio is correct?", "opts": {"A": "Only Statement 1", "B": "Only Statement 2", "C": "Both Statement 1 and Statement 2"}, "ans": "C", "en": "C is correct. Adding cash to the portfolio increases the expected SR, but the benchmark’s expected SR remains unchanged – therefore the IR must decrease, meaning statement 1 is correct.\n\nAs for statement 2, as long as we change the active weights in a proportional manner there should be no change in the expected information ratio – however, if we do some type of asymmetrical change across multiple sources of active risk we cannot be assured of the same result.", "ko": "Statement 1 맞음: IR은 현금을 추가하면 변함(SR은 현금·레버리지에 영향을 받지 않지만, IR은 비현금 벤치마크 대비로 측정되므로 현금 추가 시 보통 감소). Statement 2 맞음: 액티브 비중을 '비례적으로' 키우면 active return과 active risk가 같은 비율로 커져 IR은 그대로.", "trap": "SR: 현금·레버리지에 불변. IR: 현금·레버리지에 변함, 액티브 비중의 비례 확대에는 불변.", "f": "", "why": {"A": "Statement 2도 맞습니다. 액티브 비중을 비례적으로 확대하면 IR은 변하지 않습니다.", "B": "Statement 1도 맞습니다. Sharpe ratio와 달리 IR은 현금 추가나 레버리지 사용으로 변합니다."}, "orig": "ECO Module 2 Q14"}, {"id": "ECO-M2-Q16", "src": "ECO 오답", "module": 2, "tag": "Closet index의 특징", "vig": null, "stem": "An analyst is given the following information about a portfolio and its benchmark. In particular, the analyst is concerned that the portfolio is a closet index fund. The T-bill return chosen to represent the risk-free rate is 0.50%.\n\tBenchmark\tPortfolio\nReturn\t8.75%\t8.90%\nRisk\t17.50%\t17.60%\nActive return\t0.00%\t0.15%\nActive risk\t0.00%\t0.79%\nSharpe ratio\t0.4714\t0.4773\nInformation ratio\tN/A\t0.1896\nWhich of the following three statements does not justify your belief that the portfolio is a closet index?\nI. The Sharpe ratio of the portfolio is close to the Sharpe ratio of the benchmark.\nII. The information ratio of the portfolio is relatively small.\nIII. The active risk of the portfolio is very low.", "opts": {"A": "Statement I", "B": "Statement II", "C": "Statement III"}, "ans": "B", "en": "B is correct. A closet index will have a very low active risk and will also have a Sharpe ratio very close to the benchmark. Therefore, Statements I and III are consistent with a closet index portfolio. A closet index’s information ratio can be indeterminate (because the active risk is so low) and is often negative due to management fees.", "ko": "Closet index의 특징: active risk가 매우 낮음, SR ≈ 벤치마크 SR. IR은 active risk가 너무 작아 값이 불안정하고(indeterminate), 보수 때문에 음수인 경우가 많음 → 'IR이 작다'는 closet index의 근거가 아님.", "trap": "Closet index에서 IR은 indeterminate(분모 ≈ 0) → IR 크기로 판단 불가.", "f": "", "why": {"A": "SR이 벤치마크와 비슷한 것은 closet index의 전형적인 특징이라 근거가 됩니다.", "C": "Active risk가 매우 낮은 것이 closet index의 핵심 특징입니다."}, "orig": "ECO Module 2 Q16"}, {"id": "ECO-M2-Q19", "src": "ECO 오답", "module": 2, "tag": "최적 active risk와 비중", "vig": 6, "stem": "Which of the following pairs of weights would be used to achieve the highest Sharpe ratio and optimal amount of active risk through combining the Indigo Fund and benchmark portfolio, respectively?", "opts": {"A": "1.014 on Indigo and −0.014 on the benchmark", "B": "1.450 on Indigo and −0.450 on the benchmark", "C": "1.500 on Indigo and −0.500 on the benchmark"}, "ans": "A", "en": "A is correct. The optimal amount of active risk is σA = (IR/SR_B) × σB = (0.15/0.333) × 18.0% = 8.11%. The weight on the active portfolio (Indigo) is 8.11%/8.0% = 1.014, and the weight on the benchmark is 1 − 1.014 = −0.014.\nCheck: Indigo’s expected active return is 1.014(1.2%) = 1.217%, the total excess return is 6.0% + 1.217% = 7.217%, σP² = 18.0² + 8.11² = 389.79, σP = 19.743, and the Sharpe ratio is 7.217/19.743 = 0.365, the maximum.", "ko": "최적 active risk σA* = (IR/SR_B) × σB = (0.15/0.333) × 18% = 8.11%. Indigo의 active risk가 8%이므로 Indigo 비중 = 8.11/8.0 = 1.014, 벤치마크 비중 = 1 − 1.014 = −0.014. 이때 SR = 7.217/19.743 = 0.365로 최대.", "trap": "최적 active risk를 먼저 구한 뒤, 그것을 펀드의 active risk로 나눠 비중을 구함.", "f": "σA* = (IR / SR_B) × σB,  w(active) = σA* / σA", "why": {"B": "1.450은 근거 없는 비중입니다. 최적 active risk(8.11%)를 Indigo의 active risk(8.0%)로 나눠야 합니다.", "C": "1.500은 근거 없는 비중입니다. 비중 = σA*/σA(Indigo) = 8.11%/8.0% = 1.014입니다."}, "orig": "ECO Module 2 Q19"}, {"id": "ECO-M2-Q23", "src": "ECO 오답", "module": 2, "tag": "TC 정의", "vig": null, "stem": "Two analysts make the following statements about the transfer coefficient in the expanded fundamental law of active management:\nAnalyst One says, “The transfer coefficient measures how well the realized returns correlate with the anticipated returns, adjusted for risk.”\nAnalyst Two says, “The transfer coefficient measures how well the realized returns correlate with the active weights, adjusted for risk.”\nWhich, if either, analyst is correct?", "opts": {"A": "Only Analyst One is correct.", "B": "Only Analyst Two is correct.", "C": "Neither analyst is correct."}, "ans": "C", "en": "C is correct. The transfer coefficient measures how well the anticipated (ex ante), risk-adjusted returns correlate with the risk-adjusted active weights. This is also expressed in the equation for the transfer coefficient: TC = ρ(μi/σi,Δwiσi).", "ko": "TC = 사전(ex ante) 위험조정 기대수익(μi/σi)과 위험조정 액티브 비중(Δwi·σi)의 상관관계. 두 분석가 모두 '실현수익(realized)'을 넣었으므로 둘 다 틀림.", "trap": "IC = 예측 vs 실현. TC = 예측 vs 액티브 비중. 실현수익은 TC에 없음.", "f": "TC = corr(μi/σi, Δwi·σi),  IC = corr(μi/σi, RAi/σi)", "why": {"A": "Analyst One의 설명(실현수익과 예측수익의 상관)은 TC가 아니라 IC의 정의입니다.", "B": "TC는 실현수익이 아니라 '예측' 수익과 액티브 비중의 상관입니다."}, "orig": "ECO Module 2 Q23"}, {"id": "ECO-M2-Q25", "src": "ECO 오답", "module": 2, "tag": "예측 능력 = IC", "vig": 7, "stem": "Suppose all three managers claim to be good at forecasting returns. According to the expanded fundamental law of active management, which manager is the best at efficiently building portfolios by anticipating future returns?", "opts": {"A": "Manager 1", "B": "Manager 2", "C": "Manager 3"}, "ans": "C", "en": "C is correct. The proper statistic is the information coefficient, IC = ρ(RAi/σi, μi/σi). A manager is a good forecaster if ex ante active return forecasts are highly correlated with realized active returns, with both risk-weighted.\nRisk-weighted forecasts μi/σi (Manager 1 / 2 / 3) and realized RAi/σi:\nSecurity 1: 0.176 / 0.235 / 0.147; realized 0.353\nSecurity 2: 0.400 / 0.100 / 0.150; realized 0.700\nSecurity 3: 0.417 / 0.000 / 0.042; realized 0.333\nSecurity 4: 0.240 / 0.080 / 0.060; realized 0.080\nICs: Manager 1 = 0.5335, Manager 2 = 0.0966, Manager 3 = 0.6769. Manager 3 has the highest IC.", "ko": "'예측을 통해 포트폴리오를 효율적으로 구성(anticipating future returns)' = 예측 정확도 → IC. 위험가중 예측(μi/σi)과 위험가중 실현수익(RAi/σi)의 상관: Manager 1 0.5335, Manager 2 0.0966, Manager 3 0.6769 → Manager 3.", "trap": "'anticipating returns' → IC, 'make full use of forecasts in weights' → TC.", "f": "IC = corr(μi/σi, RAi/σi)", "why": {"A": "Manager 1의 IC는 0.5335로 Manager 3(0.6769)보다 낮습니다. 예측값을 위험(σ)으로 나눠야 순위가 정확합니다.", "B": "Manager 2는 TC가 가장 높지만(포트폴리오 구성 효율), 예측 정확도인 IC는 0.0966으로 가장 낮습니다."}, "orig": "ECO Module 2 Q25"}, {"id": "ECO-M2-Q26", "src": "ECO 오답", "module": 2, "tag": "예측을 비중에 반영하는 능력 = TC", "vig": 7, "stem": "Suppose all three managers claim to be efficient in portfolio construction. According to the expanded fundamental law of active management, which manager is the best at building portfolios to make full use of their ability to correctly anticipate returns?", "opts": {"A": "Manager 1", "B": "Manager 2", "C": "Manager 3"}, "ans": "B", "en": "B is correct. The proper statistic is the transfer coefficient, TC = ρ(μi/σi, Δwi·σi): the cross-sectional correlation between forecasted active returns and actual active weights, adjusted for risk.\nRisk-adjusted weights Δwi·σi (Manager 1 / 2 / 3):\nSecurity 1: −0.0213 / 0.0340 / −0.0085\nSecurity 2: 0.0025 / 0.0000 / 0.0050\nSecurity 3: 0.0090 / −0.0120 / 0.0060\nSecurity 4: 0.0063 / −0.0250 / −0.0125\nTCs: Manager 1 = 0.7267, Manager 2 = 0.8504, Manager 3 = −0.0020. Manager 2 has the highest TC.", "ko": "'예측 능력을 포트폴리오 구성에 최대한 활용' → TC. 위험가중 예측(μi/σi)과 위험조정 비중(Δwi·σi)의 상관: Manager 1 0.7267, Manager 2 0.8504, Manager 3 −0.0020 → Manager 2.", "trap": "같은 데이터로 IC와 TC를 연달아 묻는 문제. 비중(Δw)이 들어가면 TC.", "f": "TC = corr(μi/σi, Δwi·σi)", "why": {"A": "Manager 1의 TC(0.7267)는 Manager 2(0.8504)보다 낮습니다.", "C": "Manager 3은 IC는 가장 높지만 TC가 거의 0(−0.0020)이라 예측을 비중에 반영하지 못했습니다."}, "orig": "ECO Module 2 Q26"}, {"id": "ECO-M2-Q43", "src": "ECO 오답", "module": 2, "tag": "Closet indexer: 위험조정 가치 없음", "vig": 8, "stem": "Based on Exhibit 1, which of the following statements regarding Atlanta Asset Management is least likely correct?", "opts": {"A": "The manager is likely a closet indexer", "B": "On a risk-adjusted basis, the manager has added value", "C": "The manager’s strategy has not added value on a risk-adjusted basis"}, "ans": "B", "en": "Correct. Atlanta Asset Management has not added value on a risk-adjusted basis. A fund manager that pursues an active investment strategy but manages the portfolio in such a way to appear more like an index fund is referred to as a closet index fund manager. The Sharpe ratio for the portfolio is close to the benchmark: The portfolio Sharpe ratio is –2.26, and the benchmark Sharpe ratio is –2.32. In addition, the information ratio is negative, –0.53. Taken together, these data suggest there is very little active management.\nA: Incorrect. This statement is correct.\nC: Incorrect. This statement is correct.", "ko": "Atlanta: 포트폴리오 SR(−2.26)이 벤치마크 SR(−2.32)과 거의 같고, IR = (−11% − (−9%))/3.75% = −0.53으로 음수 → closet indexer일 가능성이 높고 위험조정 기준으로 가치를 더하지 못함. 'B: 가치를 더했다'가 가장 틀린 설명.", "trap": "포트폴리오 SR(−2.26)이 벤치마크(−2.32)보다 '조금' 높다고 가치를 더했다고 보면 안 됨. Active return 자체가 −2%.", "f": "IR = (RP − RB)/σA = −2%/3.75% = −0.53", "why": {"A": "SR이 벤치마크와 비슷하고 IR이 음수라는 점이 closet indexer의 특징과 맞아 옳은 설명입니다.", "C": "IR이 음수이므로 위험조정 기준으로 가치를 더하지 못했다는 설명은 옳습니다."}, "orig": "ECO Module 2 Q43"}, {"id": "ECO-M2-Q45", "src": "ECO 오답", "module": 2, "tag": "매니저 선택 기준 = 기대 IR", "vig": 8, "stem": "Is Spencer’s response to Moore regarding small-cap managers most likely correct?", "opts": {"A": "Yes", "B": "No, the committee should focus on active risk", "C": "No, the committee should focus on the expected information ratio"}, "ans": "C", "en": "Correct. The expected information ratio is the single best criterion for evaluating active investment managers’ performance given the same benchmark. Selecting the highest information ratio manager will produce the highest Sharpe ratio for the portfolio.\nA: Incorrect. The committee should focus on the information ratio. It is the single best criterion for evaluating active investment manager’s performance given the same benchmark.\nB: Incorrect, active risk alone will not lead to the highest Sharpe ratio given the fund’s risk aversion. The highest information ratio manager will produce the highest Sharpe ratio for the fund.", "ko": "같은 벤치마크라면 매니저 평가·선택의 가장 좋은 단일 기준은 기대 IR. IR이 가장 높은 매니저를 고르면 포트폴리오 SR이 가장 높아짐(SR_P² = SR_B² + IR²). active risk는 위험 선호에 맞게 조절하면 됨 → 'Both equally important'는 틀림.", "trap": "IR이 높은 매니저를 고른 뒤 active risk는 비중으로 조절.", "f": "SR_P² = SR_B² + IR²", "why": {"A": "두 지표의 중요도는 같지 않습니다. 기대 IR이 매니저 선택의 핵심 기준입니다.", "B": "Active risk만으로는 SR을 최대화할 수 없습니다. active risk는 IR을 보고 고른 뒤 비중으로 조절하는 변수입니다."}, "orig": "ECO Module 2 Q45"}, {"id": "ECO-M2-Q50", "src": "ECO 오답", "module": 2, "tag": "Breadth 정의", "vig": 9, "stem": "Which of Barolo’s points regarding the fundamental law of active management is least likely accurate?", "opts": {"A": "Point 1", "B": "Point 2", "C": "Point 3"}, "ans": "C", "en": "Correct because Barolo is correct with regard to Points 1 and 2. When she discusses breadth in Point 3, mathematically, it is expressed as the square root of the number of independent investment opportunities. Conceptually, breadth is equal to the number of independent decisions made per year by the investor in constructing the portfolio.\nA: Incorrect because Point 1 is correct.\nB: Incorrect because Point 2 is correct.", "ko": "Point 3이 틀림. Breadth = 연간 독립적인 투자 결정 수(BR). 공식에서는 √BR로 들어감. '독립적 투자기회 수의 제곱'이라고 한 것이 틀림. Point 1, 2는 맞음.", "trap": "IR = IC × √BR. BR의 '제곱'이 아니라 '제곱근'.", "f": "E(RA) = TC × IC × √BR × σA", "why": {"A": "Point 1(성과 = 실력 × 기회 수, IR = active risk 대비 active return)은 맞습니다.", "B": "Point 2(IC = 예측 vs 실현 상관, TC = 예측이 액티브 비중으로 옮겨진 정도)는 맞습니다."}, "orig": "ECO Module 2 Q50"}, {"id": "ECO-M2-Q52", "src": "ECO 오답", "module": 2, "tag": "Value added = RP − RB", "vig": 10, "stem": "Which statement regarding the measurement of value added is least likely to be correct?", "opts": {"A": "The statement made by Wert", "B": "The statement made by Marano", "C": "The statement made by Gladden"}, "ans": "A", "en": "Correct. Positive return alone does not reflect value added. The value added of an actively managed portfolio (RA) is the difference between the return on the portfolio (RP) and the return on the benchmark portfolio (RB).\nB: Incorrect. Marano’s statement is correctly referring to value added and further breaking down the measurement into subsections of security selection and industry weightings.\nC: Incorrect. Value added is the difference between the return on the portfolio and the return on the benchmark portfolio, so Gladden’s statement is true.", "ko": "Value added = 포트폴리오 수익률 − 벤치마크 수익률. 수익률이 양수라는 것만으로는 가치를 더했다고 할 수 없음 → Wert의 설명이 틀림. Gladden(RP > RB)과 Marano(자산배분·종목선택에서 발생)는 맞음.", "trap": "절대 수익률(+)이 아니라 벤치마크 대비 상대 수익률.", "f": "RA = RP − RB", "why": {"B": "Marano의 설명(value added는 자산배분·종목선택 등 여러 원천에서 나옴)은 맞습니다.", "C": "Gladden의 설명(포트폴리오 수익률 > 벤치마크 수익률이면 가치를 더함)은 value added의 정의와 같습니다."}, "orig": "ECO Module 2 Q52"}, {"id": "ECO-M2-Q56", "src": "ECO 오답", "module": 2, "tag": "IC와 TC의 의미 (correlation triangle)", "vig": 10, "stem": "Is Wert correct in her assessment of the Fundamental Law of Active Management?", "opts": {"A": "Yes", "B": "No, she is incorrect about the manager’s forecasts", "C": "No, she is incorrect about the manager’s security weightings"}, "ans": "A", "en": "Correct. Both observations are correct. A manager’s forecasts must correspond at least somewhat to the realized returns if the manager is to generate a positive relative return (information coefficient), and the manager must overweight securities for which he has forecasted the best relative returns in order to generate positive relative returns (transfer coefficient).\nB: Incorrect. A manager’s forecasts must correspond at least somewhat to the realized returns if the manager is to generate a positive relative return (information coefficient).\nC: Incorrect. A manager must overweight securities for which he has forecasted the best relative returns in order to generate positive relative returns (transfer coefficient).", "ko": "Wert의 두 관찰 모두 맞음: ① 예측이 실현 active return과 어느 정도 맞아야 함(IC > 0) ② 가장 좋다고 예측한 종목을 실제로 overweight해야 함(TC > 0). 둘 다 있어야 양(+)의 active return.", "trap": "Correlation triangle: 예측(μ) – 비중(Δw) = TC, 예측(μ) – 실현(RA) = IC.", "f": "", "why": {"B": "예측이 실현 active return과 맞아야 한다는 설명은 IC의 의미 그대로라 옳습니다.", "C": "좋다고 예측한 종목을 overweight해야 한다는 설명은 TC의 의미 그대로라 옳습니다."}, "orig": "ECO Module 2 Q56"}, {"id": "ECO-M2-Q63", "src": "ECO 오답", "module": 2, "tag": "파생상품 헤지 → Breadth ↑", "vig": null, "stem": "Breadth can be greater than the number of securities when:", "opts": {"A": "derivatives are used for hedging in the portfolio.", "B": "return forecasts from period to period are correlated.", "C": "a decision is made to overweight all stocks in a given industry."}, "ans": "A", "en": "Correct because, when fundamental law concepts are applied to hedging strategies using derivatives or other forms of arbitrage, breadth can increase well beyond the number of securities.\nB: Incorrect because the number of individual assets, N, is not an adequate measure of strategy breadth, BR, when the active returns between individual assets are correlated, as defined by the risk model, and forecasts are not independent from period to period.\nC: Incorrect because decisions to overweight all the stocks in a given industry or all the countries in a given region because they are responding to similar influences cannot be counted as completely independent decisions, so breadth in these contexts is lower than the number of assets.", "ko": "파생상품 헤지나 차익거래 전략에서는 독립적인 결정이 새로 생겨 breadth가 종목 수보다 커질 수 있음.", "trap": "상관된 결정 → BR ↓, 파생상품 헤지·차익거래 → BR ↑.", "f": "", "why": {"B": "예측이 기간마다 상관돼 있으면 결정이 독립적이지 않아 breadth가 종목 수보다 '작아집니다'.", "C": "같은 산업 전체를 overweight하는 것은 독립적인 결정이 아니므로 breadth가 '줄어듭니다'."}, "orig": "ECO Module 2 Q63"}, {"id": "ECO-M2-Q66", "src": "ECO 오답", "module": 2, "tag": "TC = 예측 active return vs 액티브 비중", "vig": null, "stem": "In active portfolio management, the transfer coefficient is the correlation between:", "opts": {"A": "realized active returns and active weights.", "B": "forecasted active returns and active weights.", "C": "forecasted active returns and realized active returns."}, "ans": "B", "en": "Correct because the correlation between any set of active weights, Δwi, and forecasted active returns, μi, measures the degree to which the investor’s forecasts are translated into active weights, called the transfer coefficient (TC).\nA: Incorrect because the transfer coefficient is the correlation between the active weights and the forecasted (not realized) active returns.\nC: Incorrect because this is called the information coefficient. Signal quality is measured by the correlation between the forecasted active returns, μi, and the realized active returns, RAi, commonly called the information coefficient (IC).", "ko": "TC = 예측 active return(μi)과 액티브 비중(Δwi)의 상관관계 → 예측이 비중에 얼마나 옮겨졌는지 측정.", "trap": "TC = forecast vs weight, IC = forecast vs realized.", "f": "TC = corr(μi/σi, Δwi·σi)", "why": {"A": "TC에는 실현 수익이 아니라 '예측' 수익이 들어갑니다.", "C": "예측 active return과 실현 active return의 상관관계는 IC입니다."}, "orig": "ECO Module 2 Q66"}, {"id": "VAR-M2-01", "module": 2, "tag": "Closet index 특징", "orig": "변형 (오답노트 R35)", "stem": "A fund marketed as actively managed is suspected of being a closet index fund. Which of the following characteristics is most consistent with that suspicion?", "opts": {"A": "High active risk and an information ratio near zero", "B": "Very low active risk and a Sharpe ratio close to that of the benchmark", "C": "A high information ratio resulting from very low management fees"}, "ans": "B", "en": "A closet index fund has very low active risk, and its Sharpe ratio is close to the benchmark’s. Its information ratio is indeterminate because active risk is so low, and after fees it is often negative.", "ko": "Closet index: active risk 매우 낮음 + SR ≈ 벤치마크 SR. IR은 분모(active risk)가 너무 작아 불안정하고, 보수 때문에 음수인 경우가 많음.", "why": {"A": "Closet index의 핵심은 active risk가 '낮다'는 것입니다.", "C": "Closet index는 보수를 빼면 IR이 보통 음수입니다. 보수가 낮다고 IR이 높아지지 않습니다."}, "trap": "Closet index → active risk ≈ 0, IR indeterminate/음수.", "f": "", "src": "변형", "vig": null}, {"id": "VAR-M2-02", "module": 2, "tag": "Fundamental law 계산", "orig": "변형 (오답노트 R35)", "stem": "A manager has an information coefficient of 0.10, a transfer coefficient of 0.80, and makes 100 independent active decisions per year. If the manager targets active risk of 5%, the expected active return is closest to:", "opts": {"A": "0.40%.", "B": "4.00%.", "C": "5.00%."}, "ans": "B", "en": "E(RA) = TC × IC × √BR × σA = 0.80 × 0.10 × √100 × 5% = 0.80 × 0.10 × 10 × 5% = 4.00%.", "ko": "E(RA) = TC × IC × √BR × σA = 0.8 × 0.1 × 10 × 5% = 4.0%.", "why": {"A": "0.40%는 √BR(= 10)을 빠뜨린 값입니다.", "C": "5.00%는 TC(0.8)를 빠뜨린 값으로, 제약이 없는 이론적 최대치(TC = 1)입니다."}, "trap": "BR은 제곱근으로 들어가고, TC < 1이면 기대 active return이 줄어듦.", "f": "E(RA) = TC × IC × √BR × σA", "src": "변형", "vig": null}, {"id": "VAR-M2-03", "module": 2, "tag": "최적 active risk 계산", "orig": "변형 (ECO M2 Q19, 오답노트 R35)", "stem": "A benchmark has a Sharpe ratio of 0.50 and a standard deviation of 15%. An active fund benchmarked to it has an information ratio of 0.40. The optimal amount of active risk for an investor combining the active fund with the benchmark is closest to:", "opts": {"A": "12.0%.", "B": "18.8%.", "C": "6.0%."}, "ans": "A", "en": "σA* = (IR / SR_B) × σB = (0.40 / 0.50) × 15% = 12.0%.", "ko": "최적 active risk σA* = (IR/SR_B) × σB = (0.40/0.50) × 15% = 12.0%.", "why": {"B": "18.8%는 비율을 뒤집은 값(SR_B/IR × σB)입니다.", "C": "6.0%는 IR × σB로, SR_B로 나누지 않은 값입니다."}, "trap": "분자는 IR, 분모는 벤치마크 SR.", "f": "σA* = (IR / SR_B) × σB", "src": "변형", "vig": null}, {"id": "ECO-M3-Q1", "src": "ECO 오답", "module": 3, "tag": "ETF의 primary/secondary market", "vig": null, "stem": "Which of the following statements regarding exchange-traded funds (ETFs) is correct? ETFs:", "opts": {"A": "disclose their holdings on a quarterly basis.", "B": "trade in both primary and secondary markets.", "C": "offer a creation/redemption mechanism that allows any investor to create or redeem shares."}, "ans": "B", "en": "B is correct. ETFs trade in both primary and secondary markets. The primary market for ETF trading is that which exists on an over-the-counter basis between authorized participants (APs), a special group of institutional investors, and the ETF issuer or sponsor. This process is referred to as creation/redemption, and it is only through these primary market transactions that shares of the ETF can be created or destroyed. ETFs also trade in the secondary market on exchanges. Secondary market trading happens between any pair of market participants—individual or institutional investors, market makers, and so on.", "ko": "ETF는 두 시장에서 거래됨: primary market(AP ↔ ETF sponsor 사이의 장외 창설·환매, 이 과정에서만 ETF 주식이 생기거나 없어짐)과 secondary market(거래소에서 누구나 거래).", "trap": "창설·환매 = AP만 가능.", "f": "", "why": {"A": "ETF는 보유 종목을 보통 '매일' 공개합니다. 분기 공개는 뮤추얼펀드의 특징입니다.", "C": "창설·환매는 아무 투자자나 할 수 없고, AP(authorized participant)라는 특정 기관투자자만 할 수 있습니다."}, "orig": "ECO Module 3 Q1"}, {"id": "ECO-M3-Q7", "src": "ECO 오답", "module": 3, "tag": "Tracking error 낮추는 요인", "vig": 11, "stem": "Which ETF in Exhibit 1 is most likely to have the lowest tracking error?", "opts": {"A": "ETF 2", "B": "ETF 3", "C": "ETF 4"}, "ans": "A", "en": "A is correct. Compared with a full replication approach, ETF portfolios managed using a representative sampling/optimization approach are likely to have greater tracking error. Also, differences in trading hours for depositary receipts and local constituent shares create discrepancies between the portfolio and index values. These discrepancies can lead to greater tracking error for portfolios holding ADRs in lieu of the underlying local shares. In exchange, the ETF receives a fee and earns interest on the collateral posted by the borrower (generally, overnight fixed-income securities), which creates income for the portfolio. As long as this securities-lending income is less than the fund expenses, it will lower the tracking error, but if it becomes larger, then it will become a source of tracking error. ETF 2 uses a full replication approach, holds only local foreign shares, and engages in securities lending. Therefore, ETF 2 will likely have the lowest tracking error out of the ETFs in Exhibit 1. ETF 3 will likely have greater tracking error than ETF 2 because it is managed using a representative sampling approach and is invested in depositary receipts in lieu of local shares. ETF 4 will likely have greater tracking error than ETF 2 because it is invested in depositary receipts in lieu of local shares and does not engage in securities lending.", "ko": "Tracking error ↓ 요인: full replication(sampling보다 정확), 현지 주식 보유(ADR은 거래시간 차이로 오차 발생), securities lending(대여 수익이 비용을 상쇄, 단 수익이 비용보다 크면 오히려 오차의 원인). 세 조건을 모두 갖춘 ETF 2가 가장 낮음.", "trap": "Full replication + 현지 주식 + securities lending = 최소 tracking error.", "f": "", "why": {"B": "ETF 3은 representative sampling과 ADR을 써서 tracking error가 더 큽니다.", "C": "ETF 4는 full replication이지만 ADR을 보유하고 securities lending을 하지 않아 ETF 2보다 tracking error가 큽니다."}, "orig": "ECO Module 3 Q7"}, {"id": "ECO-M3-Q8", "src": "ECO 오답", "module": 3, "tag": "Bid–ask spread 결정요인", "vig": 11, "stem": "Stosur’s statement about quoted bid–ask spreads is incorrect with respect to the:", "opts": {"A": "amount of the ongoing order flow in the ETF.", "B": "costs and risks for the ETF liquidity providers.", "C": "amount of competition among market makers for the ETF."}, "ans": "C", "en": "C is correct. Several factors determine the width of an ETF’s quoted bid–ask spread. First, the amount of ongoing order flow in the ETF is negatively related to the bid–ask spread (more flow means lower spreads). Second, the actual costs and risks for the liquidity provider are positively related to spreads (more costs and risks mean higher spreads); the spread is compensation to the liquidity provider for incurring these costs and risks. Finally, the amount of competition among market makers for that ETF is negatively related to the bid–ask spread (more competition means lower spreads).\nA is incorrect because Stosur is correct in stating that the quoted bid–ask spread for a particular transaction size is negatively related to the amount of the ongoing order flow in the ETF (more flow means lower spreads).\nB is incorrect because Stosur is correct in stating that the quoted bid–ask spread for a particular transaction size is positively related to the costs and risks for the ETF liquidity provider (more costs and risks mean higher spreads). The bid–ask spread represents the market maker’s price for taking the other side of the ETF transaction, which includes the costs and risks to carry the position on its books and/or to hedge the position using underlying securities or closely related ETFs or derivatives.", "ko": "Spread와의 관계: 주문 흐름 ↑ → spread ↓(음), 유동성 공급자의 비용·위험 ↑ → spread ↑(양), 시장조성자 간 경쟁 ↑ → spread ↓(음). Stosur는 경쟁을 '양(+)의 관계'라고 해서 틀림.", "trap": "경쟁 ↑ → spread ↓. 세 요인 중 '양'의 관계는 비용·위험뿐.", "f": "", "why": {"A": "주문 흐름과 spread가 음의 관계라는 Stosur의 설명은 맞습니다(흐름이 많을수록 spread가 좁음).", "B": "비용·위험과 spread가 양의 관계라는 설명은 맞습니다. spread는 유동성 공급자의 비용·위험에 대한 보상입니다."}, "orig": "ECO Module 3 Q8"}, {"id": "ECO-M3-Q9", "src": "ECO 오답", "module": 3, "tag": "NAV 대비 프리미엄/할인 큰 ETF", "vig": 11, "stem": "Which ETF in Exhibit 2 is most likely to trade at the largest premium or discount relative to NAV?", "opts": {"A": "ETF 5", "B": "ETF 6", "C": "ETF 7"}, "ans": "C", "en": "C is correct. ETFs that trade infrequently may have large premiums or discounts to NAV, because the ETF may not have traded in the hours leading up to the market close and NAV may have significantly risen or fallen during that time because of market movement. Furthermore, NAV is often a poor fair value indicator for ETFs holding foreign securities because of differences in exchange closing times between the underlying (e.g., foreign stocks, bonds, or commodities) and the exchange where the ETF trades. Therefore, ETF 7 is most likely to have the largest discount or premium because it has a low trading frequency and has the highest percentage of foreign holdings among the three ETFs.\nA is incorrect because ETF 5 has the lowest percentage of foreign holdings among the three ETFs and is the one ETF with a high trading frequency. Therefore, relative to ETF 7, with its low trading frequency and high foreign holdings, ETF 5 is likely to trade at smaller premiums or discounts.\nB is incorrect because ETF 6 has a lower percentage of foreign holdings than ETF 7. Even though both ETF 6 and ETF 7 have the same low trading frequency, the lower percentage of foreign holdings for ETF 6 is likely to result in it trading at smaller premiums or discounts.", "ko": "NAV와 가격의 괴리 ↑ 요인: 거래 빈도 낮음(장 마감 전에 거래가 없어 가격이 낡음), 해외 보유 비중 높음(거래소 마감 시간이 달라 NAV가 공정가치를 잘 나타내지 못함). 거래 빈도가 낮고 해외 비중이 90%로 가장 높은 ETF 7.", "trap": "거래 적음 + 해외 비중 큼 = 괴리 최대.", "f": "", "why": {"A": "ETF 5는 거래 빈도가 높고 해외 비중이 10%로 가장 낮아 괴리가 가장 작습니다.", "B": "ETF 6은 거래 빈도는 ETF 7처럼 낮지만 해외 비중(50%)이 더 낮아 괴리가 더 작습니다."}, "orig": "ECO Module 3 Q9"}, {"id": "ECO-M3-Q10", "src": "ECO 오답", "module": 3, "tag": "ETF 총 보유비용 계산", "vig": 11, "stem": "Excluding the compounding effect, the expected total holding period cost for investing in the ETF over a nine-month holding period is closest to:", "opts": {"A": "0.54%.", "B": "0.62%.", "C": "0.64%."}, "ans": "A", "en": "A is correct. The expected total holding period cost for investing in the ETF over the nine-month holding period is calculated as follows:\nTotal expected holding period cost = Annual management fee + Round-trip trading commissions + Bid–offer spread on purchase/sale.\nTotal expected holding period cost = (9/12) × (0.32%) + 0.20% + 0.10% = 0.54%.", "ko": "총 보유기간 비용 = 운용보수 × (보유기간) + 왕복 수수료 + bid–offer spread = (9/12)(0.32%) + 0.20% + 0.10% = 0.24% + 0.30% = 0.54%.", "trap": "운용보수만 기간 비례, 거래 수수료와 spread는 1회분 그대로.", "f": "총비용 = 연보수 × (보유개월/12) + 왕복 수수료 + bid–offer spread", "why": {"B": "0.62%는 연 운용보수 0.32%를 9개월로 안분하지 않고 그대로 더한 값입니다(0.32 + 0.20 + 0.10).", "C": "0.64%는 bid–offer spread 0.10%를 매수·매도에 각각 두 번 더한 값입니다(0.24 + 0.20 + 0.20). 주어진 0.10%가 매수·매도를 합친 비용입니다."}, "orig": "ECO Module 3 Q10"}, {"id": "ECO-M3-Q12", "src": "ECO 오답", "module": 3, "tag": "Rolling holding period(tracking difference)", "vig": null, "stem": "To best assess an ETF’s performance, which reflects the impact of portfolio rebalancing expenses and other fees, an investor should:", "opts": {"A": "review daily return differences between the ETF and its benchmark.", "B": "perform a rolling return assessment between the ETF and its benchmark.", "C": "compare the ETF’s annual expense
