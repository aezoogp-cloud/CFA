": "0.1114.", "C": "0.1164."}, "ans": "C", "en": "Profit margin (E/S) = 5.35/342 = 0.0156. Justified P0/S0 = (E0/S0)(1 − b)(1 + g)/(r − g) = 0.0156 × 0.75 × 1.045/(0.15 − 0.045) = 0.1164.", "ko": "PM = 5.35/342 = 1.56%. P0/S0 = PM × payout × (1 + g)/(r − g) = 0.0156 × 0.75 × 1.045/0.105 = 0.1164.", "why": {"A": "배당성향 대신 다른 값을 쓰는 등 공식을 잘못 적용한 값입니다.", "B": "0.1114 ≈ (1 + g)를 빼고 계산한 leading P/S(0.0156 × 0.75/0.105)입니다. 현재(trailing) 매출 기준이면 (1+g) 포함."}, "trap": "ECO M4 Q89 오답과 같은 공식(trailing은 ×(1+g)).", "f": "P0/S0 = (E0/S0)(1 − b)(1 + g)/(r − g)", "orig": "Schweser MQ 20.2–20.4 Q1", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R20-210", "module": 4, "tag": "Underlying EPS 조정", "stem": "The 12-month trailing EPS for Sample Fabrication Company as of December 31, 20X3, is $1.29. Sample stock trades at $42.50 per share as of 12/31/20X3. In the first quarter of 20X3, Sample reported an extraordinary loss of $0.22 per share. In the third quarter, the company reported a loss from the write-down of inventory of $0.04 per share. In the fourth quarter, Sample reported a gain of $0.08 per share from a change in accounting estimate when it increased the estimate of useful life of certain manufacturing equipment. Sample’s trailing P/E ratio based on underlying earnings is closest to:", "opts": {"A": "24.6.", "B": "28.9.", "C": "32.9."}, "ans": "B", "en": "Underlying earnings = $1.29 + $0.22 + $0.04 − $0.08 = $1.47. P/E = 42.50/1.47 = 28.9.", "ko": "비경상 손실 가산(0.22 + 0.04), 추정변경 이익 차감(0.08) → 1.47. P/E = 42.50/1.47 = 28.9.", "why": {"A": "조정 방향을 반대로 하는 등 underlying EPS를 잘못 구한 값입니다.", "C": "32.9 = 42.50/1.29 — 조정하지 않은 보고 EPS입니다."}, "trap": "ECO M4 Q24 오답과 같은 조정 원리.", "f": "", "orig": "Schweser MQ 20.2–20.4 Q10", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R20-211", "module": 4, "tag": "Normalized EPS – average ROE", "stem": "The average ROE for Lever, Inc., over the last business cycle was 32%. Lever’s earnings per share for the coming year is expected to be $5. The dividend payout ratio is 30%, and the current book value per share is $14. Shares are trading in the market at $54. Lever’s normalized earnings per share are closest to:", "opts": {"A": "$4.48.", "B": "$5.00.", "C": "$5.26."}, "ans": "A", "en": "Only the average ROE and the book value per share are relevant for calculating normalized earnings: normalized earnings = average ROE × BVPS = 0.32 × $14 = $4.48 per share.", "ko": "평균 ROE × 현재 BVPS = 0.32 × 14 = $4.48. 예상 EPS·배당성향·주가는 미끼.", "why": {"B": "$5.00은 내년 예상 EPS입니다.", "C": "정상화 EPS 계산에 무관한 정보를 사용한 값입니다."}, "trap": "ECO M4 Q22·Q76 오답과 같은 공식.", "f": "Normalized EPS = Avg ROE × current BVPS", "orig": "Schweser MQ 20.2–20.4 Q11", "src": "Schweser MQ", "vig": null}, {"id": "VAR-R20-01", "module": 4, "tag": "EV 계산 – 이자부 부채만 포함", "stem": "A company has a market value of common equity of $5,000 million, preferred stock (market value) of $300 million, long-term debt of $1,200 million, short-term borrowings of $200 million, accounts payable of $400 million, and cash and short-term investments of $600 million. Its enterprise value (in $ millions) is closest to:", "opts": {"A": "$6,100.", "B": "$6,300.", "C": "$6,500."}, "ans": "A", "en": "EV = 5,000 + 300 + (1,200 + 200) − 600 = $6,100 million. Accounts payable (non-interest-bearing operating liabilities) are excluded.", "ko": "EV = 보통주 5,000 + 우선주 300 + 이자부부채(장기 1,200 + 단기차입 200) − 현금 600 = $6,100M. 매입채무는 제외.", "why": {"B": "$6,300 = 5,000 + 300 + 1,200 + 400 − 600 — 단기차입금(200) 대신 매입채무(400)를 부채로 넣은 오류입니다.", "C": "$6,500은 매입채무(400)까지 부채로 포함한 오류입니다."}, "trap": "노트: EV의 debt = 장기부채 + 단기차입금, AP·미지급비용 제외.", "f": "EV = MV(common) + MV(preferred) + Interest-bearing debt + Minority − Cash & ST investments", "orig": "변형 (오답노트 + ECO M4 Q20)", "src": "변형", "vig": null}, {"id": "VAR-R20-02", "module": 4, "tag": "Justified trailing vs leading P/E", "stem": "A company has a dividend payout ratio of 50%, a required return on equity of 9%, and a constant growth rate of 5%. Its justified trailing P/E is closest to:", "opts": {"A": "12.50.", "B": "13.13.", "C": "26.25."}, "ans": "B", "en": "Justified trailing P/E = (1 − b)(1 + g)/(r − g) = 0.50 × 1.05/0.04 = 13.13. (Justified leading P/E = 0.50/0.04 = 12.50.)", "ko": "Trailing = payout × (1 + g)/(r − g) = 0.50 × 1.05/0.04 = 13.13. Leading은 12.50.", "why": {"A": "12.50은 justified leading P/E입니다.", "C": "26.25는 배당성향 대신 1(전액)을 쓴 값(1.05/0.04)입니다."}, "trap": "ECO M2 Q75 오답과 반대 방향 질문.", "f": "P0/E0 = (1 − b)(1 + g)/(r − g),  P0/E1 = (1 − b)/(r − g)", "orig": "변형 (ECO M2 Q75, Schweser R20)", "src": "변형", "vig": null}, {"id": "ECO-M5-Q9", "src": "ECO 오답", "module": 5, "tag": "Market value added (MVA)", "vig": 28, "stem": "Based on the information in Exhibit 1, the market value added of the hypothetical firm is closest to:", "opts": {"A": "R65 million.", "B": "R113 million.", "C": "R168 million."}, "ans": "C", "en": "C is correct. Market value added equals the market value of firm minus total accounting book value of total capital.\nMarket value added = Market value of company – Accounting book value of total capital\nMarket value of firm = Market value of debt + Market value of equity\nMarket value of firm = R55 million + (30,000,000 × R25.43)\nMarket value of firm = R55 million + R762.9 million = R817.9 million\nMarket value added = R817.9 million – R650 million = R167.9 million, or approximately R168 million.", "ko": "MVA = 기업 시장가치 − 총자본 장부가. 시장가치 = 부채 R55M + 주식 30M × R25.43 = R817.9M. MVA = 817.9 − 650 = R167.9M ≈ R168M.", "trap": "MVA = MV(debt + equity) − BV(total capital). 시장가격 사용.", "f": "MVA = Market value of firm − Accounting book value of total capital", "why": {"A": "R65M은 시장주가 대신 RI 내재가치(R22)를 쓴 값입니다(30M × 22 + 55 − 650). MVA는 '시장'가치 기준.", "B": "R113M은 부채 시장가치(R55M)를 빼먹은 값입니다(762.9 − 650)."}, "orig": "ECO Module 5 Q9"}, {"id": "ECO-M5-Q12", "src": "ECO 오답", "module": 5, "tag": "Single-stage RI model", "vig": 28, "stem": "Based on the information in Exhibit 2, the intrinsic value per share of the equity of Jackson Breweries is closest to:", "opts": {"A": "R97.67.", "B": "R130.22.", "C": "R186.03."}, "ans": "B", "en": "B is correct. With a single-stage residual income (RI) model, the intrinsic value, V0, is calculated assuming a constant return on equity (ROE) and a constant earnings growth (g).\nV\n0\n=\nB\n0\n+\nB\n0\n(\nROE\n−\nr\n)\n(\nr\n−\ng\n)\nV\n0\n=\nR\n55.81\n+\nR\n55.81\n(\n0.13\n−\n0.11\n)\n(\n0.11\n−\n0.095\n)\nV\n0\n=\nR\n130.22", "ko": "V0 = B0 + B0(ROE − r)/(r − g) = 55.81 + 55.81 × (0.13 − 0.11)/(0.11 − 0.095) = 55.81 + 74.41 = R130.22.", "trap": "분자 ROE − r(초과수익), 분모 r − g.", "f": "V0 = B0 + (ROE − r)B0/(r − g)", "why": {"A": "R97.67은 단일단계 RI 공식(B0 + B0(ROE − r)/(r − g))과 맞지 않는 값입니다.", "C": "R186.03은 분자에 (ROE − g)를 넣은 오류입니다(55.81 × 0.035/0.015). 분자는 (ROE − r)."}, "orig": "ECO Module 5 Q12"}, {"id": "ECO-M5-Q16", "src": "ECO 오답", "module": 5, "tag": "Multistage RI – 종료시 P = B (terminal 0)", "vig": 28, "stem": "Under Scenario 2, the intrinsic value per share of the equity of Amersheen is closest to:", "opts": {"A": "R13.29.", "B": "R15.57.", "C": "R16.31."}, "ans": "A", "en": "A is correct. The multistage residual income model results in an intrinsic value of R13.29. The multistage residual income model, is:\nV\n0\n=\nB\n0\n+\n∑\nt\n=\n1\nT\n(\nE\nt\n−\nr\nB\nt\n−\n1\n)\n(\n1\n+\nr\n)\nt\n+\n(\nP\nT\n−\nB\nT\n)\n(\n1\n+\nr\n)\nT\nThe first step is to calculate residual income per share for years 2022–2024:\n2022\t2023\t2024\nBeginning book value per share\tR7.60 (given)\tR7.60 + R3.28 – R2.46\n= R8.42\tR8.42 + R3.15 – R2.36\n= R9.21\nROE\tR3.28/R7.60 = 0.4316\tR3.15/R8.42 = 0.3741\tR2.90/R9.21 = 0.3149\nRetention rate\t1 – (R2.46/R3.28) = 0.25\t1 – (R2.36/R3.15) = 0.2508\t1 – (R2.06/R2.90) = 0.2897\nGrowth rate\t0.4316 × 0.25=0.1079\t0.3741 × 0.2508 = 0.0938\t0.3149 × 0.2897= 0.0912\nEquity charge per share\tR7.60 × 0.10 = R0.76\tR8.42 × 0.10 = R0.842\tR9.21 × 0.10 = R0.921\nResidual income per share\tR3.28 – R0.76 = R2.52\tR3.15 – R0.842 = R2.31\tR2.90 – 0.921= R1.98\nROE = Earnings/Book value\nGrowth rate = ROE × Retention rate\nRetention rate = 1 – (Dividends/Earnings)\nBook valuet = Book valuet–1 + Earningst–1 – Dividendst–1\nResidual income per share = EPS – Equity charge per share\nEquity charge per share = Book value per sharet × Cost of equity\nUnder Scenario 2, at the end of 2024, it is assumed that share price will be equal to book value per share. This results in the second term in the equation above, the present value of the terminal value, being equal to zero.\nThen, intrinsic value per share is:\nV\n0\n=\nR\n7.60\n+\nR\n2.52\n(\n1.10\n)\n+\nR\n2.31\n(\n1.10\n)\n2\n+\nR\n1.98\n(\n1.10\n)\n3\n=\nR\n13.29", "ko": "BV 2022 = 7.60 → 2023 = 7.60 + 3.28 − 2.46 = 8.42 → 2024 = 9.21. RI = EPS − 0.10 × 기초 BV: 2.52, 2.31, 1.98. Scenario 2는 2024년 말 P = B → terminal 항 = 0. V0 = 7.60 + 2.52/1.1 + 2.31/1.1² + 1.98/1.1³ = R13.29.", "trap": "P_T = B_T → (P_T − B_T) = 0. Equity charge는 '기초' BV × r. BV는 clean surplus로 갱신.", "f": "V0 = B0 + Σ (Et − r·B(t−1))/(1+r)^t + (PT − BT)/(1+r)^T", "why": {"B": "R15.57은 Scenario 2의 'P = B(terminal = 0)' 조건을 반영하지 않았거나 할인을 잘못한 값입니다.", "C": "R16.31은 persistence factor·장기성장 등 Scenario 1 성격의 terminal value를 더한 값입니다."}, "orig": "ECO Module 5 Q16"}, {"id": "ECO-M5-Q24", "src": "ECO 오답", "module": 5, "tag": "Multistage RI – 영구 지속 RI (ω = 1)", "vig": 29, "stem": "Based on Exhibits 2 and 3 and the multistage RI model, Castovan should estimate the intrinsic value of TTCI to be closest to:", "opts": {"A": "€54.88.", "B": "€83.01.", "C": "€85.71."}, "ans": "C", "en": "C is correct. Residual income per share for the next three years is calculated as follows.\nYear 1\tYear 2\tYear 3\nBeginning book value per share\t45.25\t51.61\t58.25\nEarnings per share\t7.82\t8.17\t8.54\nLess dividends per share\t1.46\t1.53\t1.59\nChange in retained earnings\t6.36\t6.64\t6.95\nEnding book value per share\t51.61\t58.25\t65.20\nEarnings per share\t7.82\t8.17\t8.54\nLess per share equity charge*\t3.94\t4.49\t5.07\nResidual income\t3.88\t3.68\t3.47\n* Per share equity charge = Beginning book value per share × Cost of equity\nYear 1 per share equity charge = 45.25 × 0.087 = 3.94\nYear 2 per share equity charge = 51.61 × 0.087 = 4.49\nYear 3 per share equity charge = 58.25 × 0.087 = 5.07\nBecause Castovan forecasts that residual income per share will be constant into perpetuity, equal to Year 3 residual income per share, the present value of the terminal value is calculated using a persistence factor of 1.\nPresent value of terminal value =\n8.54\n−\n(\n0.087\n×\n58.25\n)\n(\n1\n+\n0.087\n−\n1\n)\n(\n1\n+\n0.087\n)\n2\n=\n3.47\n(\n0.087\n)\n(\n1.087\n)\n2\n= 33.78\nSo, the intrinsic value of TTCI is then calculated as follows.\nV\n0\n=\n€\n45.25\n+\n3.88\n1.087\n+\n3.68\n1.087\n2\n+\n33.78\n=\n€\n85.71", "ko": "RI: 7.82 − 0.087×45.25 = 3.88, 8.17 − 0.087×51.61 = 3.68, 8.54 − 0.087×58.25 = 3.47. Year 3 RI 영구 지속(ω = 1): TV(Year 2 시점) = 3.47/(1 + 0.087 − 1) → PV = 3.47/0.087/1.087² = 33.78. V0 = 45.25 + 3.88/1.087 + 3.68/1.087² + 33.78 = €85.71.", "trap": "Year 3 RI 영구 지속 → TV = RI3/(1 + r − ω)를 Year 2 시점 값으로 두고 2년 할인(Schweser 공식). ω = 1이면 RI3/r.", "f": "PV(continuing RI) = RI_T / [(1 + r − ω)(1 + r)^(T−1)]", "why": {"A": "€54.88은 terminal value(Year 3 이후 RI)를 반영하지 않은 수준입니다.", "B": "€83.01은 terminal value 할인 시점 등을 잘못 적용한 값입니다."}, "orig": "ECO Module 5 Q24"}, {"id": "ECO-M5-Q25", "src": "ECO 오답", "module": 5, "tag": "Persistence factor ↓ → 가치 ↓", "vig": 29, "stem": "The persistence factor suggested by Beckworth will lead to a multistage value estimate of TTCI’s shares that is:", "opts": {"A": "less than Castovan’s multistage value estimate.", "B": "equal to Castovan’s multistage value estimate.", "C": "greater than Castovan’s multistage value estimate."}, "ans": "A", "en": "A is correct. In Castovan’s multistage valuation, she assumes that TTCI’s residual income will remain constant in perpetuity after Year 3. This perpetuity assumption implies a persistence factor of 1 in the calculation of the terminal value. A persistence factor of 0.10 indicates that TTCI’s residual income is forecasted to decline at an average rate of 90% per year. This assumption would lead to a lower valuation than Castovan’s multistage value estimate, which assumes that residual income will remain constant in perpetuity after Year 3.", "ko": "Castovan은 Year 3 이후 RI가 영구 지속(ω = 1)한다고 봄. ω = 0.10은 RI가 매년 90%씩 사라진다는 뜻 → terminal value가 훨씬 작아져 가치가 더 낮음.", "trap": "ω ∈ [0,1], 클수록 RI 지속. 노트: 장기·경쟁↑ → ROE fade → premium → 0.", "f": "TV = RI_T/(1 + r − ω)", "why": {"B": "ω가 1 → 0.10으로 바뀌면 terminal value가 달라지므로 같을 수 없습니다.", "C": "ω가 낮을수록 continuing RI의 가치가 줄어듭니다."}, "orig": "ECO Module 5 Q25"}, {"id": "ECO-M5-Q51", "src": "ECO 오답", "module": 5, "tag": "Multistage RI – (P_T − B_T) 할인", "vig": 30, "stem": "Based on the multistage residual income model, Paramount's intrinsic value per share is closest to:", "opts": {"A": "MYR 82.", "B": "MYR 86.", "C": "MYR 93."}, "ans": "A", "en": "(A) Correct because the intrinsic value of the stock using a multistage model is:\nBook value of the stock + PV of Residual Income (RI) during the forecast period + PV of RI after the forecast period\n= MYR 58 + MYR 10.16 + MYR 13.73\n= MYR 81.89\n≈ MYR 82.\nPV of RI during the forecast period = RI of Year 1 / (1 + Required rate of return) + RI of Year 2 / (1 + Required rate of return)2 + RI of Year 3 / (1 + Required rate of return)3 + RI of Year 4 / (1 + Required rate of return)4 =  MYR 3 / 1.07 + MYR 3 / (1.07)2 + MYR 3 / (1.07)3 + MYR 3 / (1.07)4 = MYR 10.16.\nThe residual income after the forecast period is: Expected market value after the forecast period – Book value after the forecast period = MYR 108 – MYR 90 = MYR 18.\nThe PV of Residual Income after the forecast period: MYR 18 / (1.07)4 = MYR 13.73.\n(B) Incorrect because the candidate did not discount the residual income after the forecast period. The candidate calculates the intrinsic value as:\nBook value of the stock + PV of Residual Income during the forecast period +  Residual Income after the forecast period\n= MYR 58 + MYR 10.16 + MYR 18\n= MYR 86.16\n≈ MYR 86.\nPV of RI during the forecast period = RI of Year 1 / (1 + Required rate of return) + RI of Year 2 / (1 + Required rate of return)2 + RI of Year 3 / (1 + Required rate of return)3 + RI of Year 4 / (1 + Required rate of return)4 = MYR 3 / 1.07 + MYR 3 / (1.07)2 + MYR 3 / (1.07)3 + MYR 3 / (1.07)4 = MYR 10.16.\nThe residual income after the forecast period is: Expected market value after the forecast period – Book value after the forecast period = MYR 108 – MYR 90 = MYR 18.\n(C) Incorrect because the candidate ignores the current book value, and instead of using the present value of the residual income after the forecast period, calculates the intrinsic value as: PV of Residual Income during the forecast period + Present value of expected market value after the forecast period\n= MYR 10.16 + MYR 82.39\n= MYR 92.55\n≈ MYR 93.\nPV of RI during the forecast period = RI of Year 1 / (1 + Required rate of return) + RI of Year 2 / (1 + Required rate of return)2 + RI of Year 3 / (1 + Required rate of return)3 + RI of Year 4 / (1 + Required rate of return)4 = MYR 3 / 1.07 + MYR 3 / (1.07)2 + MYR 3 / (1.07)3 + MYR 3 / (1.07)4 = MYR 10.16.\nThe present value of expected market value after the forecast period: The expected market value after the forecast period / (1 + Required rate of return)4 = MYR 108 / (1.07)4 = MYR 82.39.", "ko": "V0 = B0 58 + PV(RI 3 × 4년, 7%) 10.16 + PV(108 − 90 = 18)/1.07⁴ = 13.73 → MYR 81.89 ≈ 82.", "trap": "노트: Terminal value = P − B를 T시점에서 현재로 할인.", "f": "V0 = B0 + Σ PV(RI) + (PT − BT)/(1+r)^T", "why": {"B": "MYR 86은 종료 시점 (P − B) = 18을 할인하지 않은 값입니다.", "C": "MYR 93은 종료 시점 시장가치 또는 장부가 처리를 잘못한 값입니다. Terminal 항은 (P_T − B_T)의 PV."}, "orig": "ECO Module 5 Q51"}, {"id": "ECO-M5-Q52", "src": "ECO 오답", "module": 5, "tag": "Book value를 바꾸는 조정 – fair value 재평가", "vig": 30, "stem": "The change in Paramount's book value per share under Ahmed's revised valuation was most likely driven by:", "opts": {"A": "Adjustment 1.", "B": "Adjustment 2.", "C": "Adjustment 3."}, "ans": "A", "en": "(A) Correct because to have a reliable measure of book value of equity reported assets and liabilities should be adjusted to fair value when possible. Adjustment 1, whereby assets and liabilities are changed to reflect their fair values, will have driven a change in the book value per share.\n(B) Incorrect because operating leases do not affect the amount of equity (because leases involve off-balance-sheet assets that offset the off-balance-sheet liabilities) but can affect an assessment of future earnings for the residual income component of value. Therefore, Adjustment 2, whereby operating leases are included in assets and liabilities, will not have driven a change in the book value per share.\n(C) Incorrect because in applying a residual income model, it is important to develop a forecast of future residual income based on recurring items. No adjustments to book value are necessary for these items, however, because non-recurring gains and losses are reflected in the value of assets in place. Therefore, Adjustment 3 will not have driven a change in the book value per share.", "ko": "자산·부채를 공정가치로 조정(Adjustment 1)하면 순자산(장부가) 자체가 변합니다.", "trap": "노트 정리 그대로.", "f": "", "why": {"B": "운용리스 반영은 자산·부채가 같은 크기로 늘어 순자산 불변(미래 이익 추정에는 영향 가능).", "C": "비경상 손익은 이미 현재 자산가치에 반영 → 미래 RI 예측에서만 제외, 장부가 조정 불필요."}, "orig": "ECO Module 5 Q52"}, {"id": "ECO-M5-Q53", "src": "ECO 오답", "module": 5, "tag": "RI 모형의 성질", "vig": 31, "stem": "Which of Khan's statements about residual income models is most likely correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "A", "en": "(A) Correct because the residual income model has a clear relationship to other valuation models, such as the DDM (dividend discount model). In fact, the residual income model can be derived from the DDM.\n(B) Incorrect because the residual income model of valuation analyzes the intrinsic value of equity as the sum of two components: the current book value of equity, and the present value of expected future residual income. Future residual income depends on future book value of equity and the excess of future ROE over required rate of return. Future book value is directly affected by future dividends, i.e., dividend payments reduces the book value. Therefore, the intrinsic value based on a residual income model is affected by dividend payments by the company.\n(C) Incorrect because a company can have net profit but negative residual income. A  company that is not generating enough income to cover its cost of capital—that is, a company with negative residual income—is destroying value. The residual income model of valuation analyzes the intrinsic value of equity as the sum of two components: the current book value of equity, and the present value of expected future residual income. Therefore, a company with a negative residual income will have an intrinsic value that is less than the book value even if the company is profitable.", "ko": "Statement 1 맞음: RI 모형은 DDM 등 다른 모형과 명확한 관계(DDM에서 도출 가능)를 가집니다.", "trap": "순이익 > 0 ≠ RI > 0. RI = NI − r × B.", "f": "", "why": {"B": "배당은 장부가를 줄여 미래 equity charge와 RI에 영향 → RI 가치는 배당의 영향을 받습니다.", "C": "흑자여도 RI가 음수(이익 < 자기자본비용)일 수 있고, 그러면 가치 < 장부가입니다."}, "orig": "ECO Module 5 Q53"}, {"id": "ECO-M5-Q58", "src": "ECO 오답", "module": 5, "tag": "Single-stage RI 계산", "vig": 32, "stem": "Based on the given information, the intrinsic value of Company B's stock is closest to:", "opts": {"A": "$10.3.", "B": "$15.0.", "C": "$25.0."}, "ans": "C", "en": "(A) Incorrect because candidates mistakenly miss subtracting the long-term growth rate by using the following inaccurate formula:\nB\n0\n+\nB\n0\nR\nO\nE\n-\nr\nr\n.\nThe inaccurate calculation is: $10 + $10 × (6.5% – 5%) / 4% = $10 + $0.3 = $10.3.\n(B) Incorrect because candidates mistakenly miss adding the current book value per share by using the following inaccurate formula:\nR\nO\nE\n-\nr\nr\n-\ng\nB\n0\n.\nThe inaccurate calculation is: $10 × (6.5% – 5%) / (5% – 4%) = $15.\n(C) Correct because the intrinsic value of Company B’s stock is calculated using the single-stage residual income model in Equation 5 on page 223.\nThe accurate formula is:\nV\n0\n=\nB\n0\n+\nR\nO\nE\n-\nr\nr\n-\ng\nB\n0\n.\nwhere,\nV\n0\n= Value of a share of stock,\nB\n0\n= Current per-share book value of equity, ROE = Long-term return on equity, r = Required rate of return, and g = Long-term growth rate.\nThe accurate calculation is: $10 + $10 × (6.5% – 5%) / (5% – 4%) = $10 + $15 = $25.", "ko": "V0 = B0 + B0(ROE − r)/(r − g) = 10 + 10 × (6.5% − 5%)/(5% − 4%) = 10 + 15 = $25.", "trap": "", "f": "V0 = B0 + (ROE − r)B0/(r − g)", "why": {"A": "$10.3은 분모에 r만 쓰고 g를 빼지 않은 오류입니다.", "B": "$15는 현재 장부가 B0를 더하지 않은 값입니다."}, "orig": "ECO Module 5 Q58"}, {"id": "ECO-M5-Q60", "src": "ECO 오답", "module": 5, "tag": "Two-stage RI – (P_T − B_T) 포함", "vig": 32, "stem": "Based on the information given, Parker should conclude that Company D’s share is:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "A", "en": "(A) Correct because this answer accurately calculates the intrinsic value of Company D’s share by using the formula for two-stage residual income model.\nThe accurate formula is:\nV\n0\n=\nB\n0\n+\n∑\nt\n=\n1\nT\nE\nt\n-\nr\nB\nt\n-\n1\n1\n+\nr\nt\n+\nP\nT\n-\nB\nT\n1\n+\nr\nT\nThe accurate calculation is:\nExpected net income = 32% × Beginning book value = 32% × $20 = $6.40\nExpected dividends = 50% × Expected net income = 50% × $6.40 = $3.20\nEnding book value = Beginning book value + Expected net income – Expected dividends = $20 + $6.40 – $3.20 = $23.20\nEquity charge = 10% x Beginning book value = 10% × $20 = $2.00\nResidual income = Expected net income – Equity charge = $6.40 – $2 = $4.40\nPV of Residual income = Residual income / (1 + 10%) = $4.40 / 1.1 = $4.00\nTerminal value = (1.1 – 1) × Ending book value = 0.1 times; $23.2 = $2.32\nPV of Terminal value = Terminal value / (1 + 10%) = $2.32 / 1.1 = $2.11\nIntrinsic value of Company D’s share = Beginning book value + PV of Residual income + PV of Terminal value = $20.00 + $4.00 + $2.11 = $26.11\nSince the current market price ($24) is lower than the intrinsic value ($26.11), Company D’s share is undervalued.\n(B) Incorrect because this answer mistakenly excludes the present value of the terminal value. The beginning book value is $20, and the present value of residual income is $4. When addition two parts: $20 + $4 = $24, the inaccurate value is equal to the current market price. Based on the inaccurate result, candidates could mistakenly conclude that Company D’s share is fairly valued.\n(C) Incorrect because this answer mistakenly applies the expected price to book value ratio to the beginning book value. The beginning book value is $20, and the expected price to book value ratio is 1.1x. The inaccurate value is lower than the current market price when multiplying two numbers: $20 x 1.1 = $22. Based on the inaccurate result, candidates could mistakenly conclude that Company D’s share is overvalued.", "ko": "NI = 32% × 20 = 6.40, 배당 3.20, 기말 BV = 23.20. RI = 6.40 − 0.10 × 20 = 4.40 → PV 4.00. 기말 P = 1.1 × 23.20 → P − B = 0.1 × 23.20 = 2.32 → PV 2.11. V0 = 20 + 4.00 + 2.11 = $26.11 > $24 → undervalued.", "trap": "P/B = 1.1 → P_T − B_T = 0.1 × B_T.", "f": "V0 = B0 + PV(RI) + PV(PT − BT)", "why": {"B": "Terminal 항(P − B)의 PV를 빼먹으면 24로 적정가처럼 보입니다.", "C": "가치 26.11 > 가격 24이므로 고평가가 아닙니다."}, "orig": "ECO Module 5 Q60"}, {"id": "ECO-M5-Q61", "src": "ECO 오답", "module": 5, "tag": "RI = NI − r × '기초' 자기자본", "vig": 33, "stem": "Using the information in Exhibits 1 and 2, DongSun’s residual income (in millions) in 2013 is closest to:", "opts": {"A": "KRW15,000.", "B": "KRW22,560.", "C": "KRW63,000."}, "ans": "B", "en": "(A) Incorrect. It calculates the equity charge based on end of year equity: 105,000 – (0.12 × 750,000) = 15,000.\n(B) Correct.\nKRW millions\nNet income\t \t105,000\nMinus equity charge*\t0.12 × KRW687,000\t–82,440\nResidual income\t \t22,560\n* Based on start-of-year equity × Cost of equity\n(C) Incorrect. It ignores the equity charge and calculates RI as Net income – Dividends: 105,000 – 42,000 = 63,000.", "ko": "RI = 105,000 − 0.12 × 687,000(2012년 말 = 2013년 기초) = 22,560.", "trap": "Equity charge는 기초(beginning) 장부가 × r.", "f": "RI_t = NI_t − r × B(t−1)", "why": {"A": "15,000은 기말 자기자본(750,000)으로 equity charge를 계산한 오류입니다.", "C": "63,000은 NI − 배당(유보이익 증가)입니다. RI는 equity charge를 차감."}, "orig": "ECO Module 5 Q61"}, {"id": "ECO-M5-Q63", "src": "ECO 오답", "module": 5, "tag": "Clean surplus 위반 판정", "vig": 33, "stem": "With respect to the three items that Kim examined, which item is least likely to result in a clean surplus accounting violation?", "opts": {"A": "Item 1", "B": "Item 2", "C": "Item 3"}, "ans": "B", "en": "(A) Incorrect. Although available for sale marketable securities are measured at fair market value on the balance sheet, any unrealized gains and losses that arise bypass the income statement and are reported in equity as a component of other comprehensive income thereby violating the clean surplus relationship.\n(B) Correct. There is no clean surplus violation if the ending book value of equity is equal to the beginning book value plus earnings minus dividends, apart from ownership transactions. In the ordinary course of business, non-domestic currency transactions with customers and suppliers (resulting from import purchase or export sale) are accounted for on both the income statement and balance sheet at fair value, and hence they do not violate clean surplus accounting. The other two items examined would affect other comprehensive income and hence violate the equity clean surplus relationship.\n(C) Incorrect. Financial statements of self-sustaining subsidiaries will be translated using the current rate method and any foreign exchange gains and losses will bypass the income statement and go into other comprehensive income, thus violating the clean surplus relationship.", "ko": "통상적 외화 거래(수출입)의 손익은 손익계산서에 반영 → clean surplus 위반 아님. AFS 미실현손익·자립적 자회사 환산손익(current rate method)은 OCI로 우회 → 위반.", "trap": "노트 정리 그대로: transaction exposure → I/S / translation(current rate) → OCI.", "f": "Clean surplus: B_t = B(t−1) + NI_t − D_t", "why": {"A": "AFS 미실현손익은 OCI로 가므로 clean surplus 위반입니다.", "C": "자립적 자회사의 환산손익(current rate method)은 OCI(누적환산조정)로 가므로 위반입니다."}, "orig": "ECO Module 5 Q63"}, {"id": "ECO-M5-Q64", "src": "ECO 오답", "module": 5, "tag": "EVA 개선 요인", "vig": 33, "stem": "Which of management’s three strategic goals will least likely result in a higher EVA for DongSun?", "opts": {"A": "Goal 1", "B": "Goal 2", "C": "Goal 3"}, "ans": "C", "en": "(A) Incorrect. Adjusting financial leverage to the optimal level will decrease the cost of capital and therefore increase EVA.\n(B) Incorrect. Efficiencies in the administrative functions will decrease operating expenses, increase NOPAT, and thus increase EVA.\n(C) Correct. By definition, EVA = NOPAT – (C% × TC), where NOPAT is the net operating profit after taxes, C% is the cost of capital, and TC is the total capital employed. Efficiencies in the administrative functions will decrease operating expenses, increase NOPAT, and thus increase EVA. Adjusting financial leverage to the optimal level will decrease the cost of capital and thus increase EVA. R&D costs are added back to NOPAT when calculating EVA. Therefore, decreasing R&D will serve to lower NOPAT and thus lower EVA.", "ko": "EVA = NOPAT − C% × TC. R&D는 EVA 계산 시 NOPAT에 가산(자본화)되는 항목이라, R&D 축소는 EVA를 높이지 않습니다(오히려 낮춤) → Goal 3.", "trap": "EVA 조정: R&D 가산(자본화), 이연법인세·LIFO reserve 등 조정.", "f": "EVA = NOPAT − WACC × Total capital", "why": {"A": "최적 레버리지로 조정 → 자본비용(C%)↓ → EVA↑.", "B": "관리 효율화 → 영업비용↓ → NOPAT↑ → EVA↑."}, "orig": "ECO Module 5 Q64"}, {"id": "ECO-M5-Q66", "src": "ECO 오답", "module": 5, "tag": "RI 예측 – 기초 자기자본 × r", "vig": 34, "stem": "Based on the information in Exhibit 1, Armishaw’s estimate of VFG’s residual income per share for 2015 is closest to:", "opts": {"A": "–$0.28.", "B": "$0.84.", "C": "$1.17."}, "ans": "C", "en": "(A) Incorrect. It uses increase in retained earnings less equity charge (values from table below):\n[324.73 – 366.24]/150 million shares = –$0.28/share\n(B) Incorrect. It grows earnings but determines the equity charge based on end of year equity.\nNet Income = 541.22\nEquity charge = 414.96 (0.15 × 2,766.38 end equity from table below)\nResidual income = 126.26/150 million shares = $0.84/share\n(C) Correct. Residual income for 2015 = Net income (2015) – Equity charge at the beginning of 2015\n(all amounts in millions except per share data)\t2014\t2015\nGrowth rate\t14%\t12.5%\t2015 growth:\n14% – (14% – 5%)/6 years\nNet income: $422 in 2013\t$481.08\t$541.22\tPrior year × (1 + g):\ng = 14% and 12.5%, respectively\nLess Dividends\t192.43\t216.49\t40% × Net income\nIncrease in retained earnings\t$288.65\t$324.73\nStarting equity\t$2,153.00\t$2,441.65\tStart of 2014: $1,075 + $1,078\nIncrease in retained earnings\t288.65\t324.73\nEnding equity\t$2,441.65\t$2,766.38\nNet income\t \t$541.22\tFrom above\nLess equity charge\t \t366.24\tStarting equity (2,441.65) × 15%\nResidual income\t \t$174.98\nResidual income per share\t \t$1.17\tDivide by 150 (million shares)", "ko": "NI: 2013 $422 → 2014 ×1.14 = 481.08 → 2015 ×1.125 = 541.22 (14% − 9%/6). 기초 자기자본 2014 = 2,153, 2015 = 2,153 + 481.08 × 60% = 2,441.65. RI 2015 = 541.22 − 0.15 × 2,441.65 = 174.98 → 주당 $1.17.", "trap": "2015 성장률 = 14% − (14% − 5%)/6 = 12.5%. Equity charge = 기초 BV × r.", "f": "RI = NI − r × B(beginning)", "why": {"A": "−$0.28은 '유보이익 증가'에서 equity charge를 뺀 오류입니다.", "B": "$0.84는 기말 자기자본으로 equity charge를 계산한 오류입니다."}, "orig": "ECO Module 5 Q66"}, {"id": "ECO-M5-Q67", "src": "ECO 오답", "module": 5, "tag": "Persistence factor 반영 terminal value", "vig": 34, "stem": "Using the information in Exhibit 2, comparing Armishaw’s approach to terminal value to Stack’s approach, Stack’s assumption leads to a 2024 value that is approximately:", "opts": {"A": "$6.50 lower than Armishaw’s approach.", "B": "$6.74 lower than Armishaw’s approach.", "C": "$26.30 higher than Armishaw’s approach."}, "ans": "A", "en": "(A) Correct.\nArmishaw’s assumption\tVT = 5.32/0.15 = $35.47\tPerpetuity of $5.32 per year starting in 2024\nStack’s assumption\nEstimated 2024 growth rate\t0.20 × 0.60 = 0.12\tROE2023 × Retention ratio\nResidual income in 2024\t5.32 × 1.12 = 5.96\tRI2024 = RI2023 × (1 + 0.12)\nTerminal value 2024\t5.96/(1 + 0.15 – 0.50) = $9.17\tVT = RI2024/(1 + r – ω)\nDifference in VT\t9.17 – 35.47 = –26.30\tStack’s vs. Armishaw’s assumptions\nDifference in PV(VT)\t–26.30/(1.1510) = –$6.50\tStack’s estimate will be $6.50 lower\nWhere r = required return on equity; ω = persistence factor for residual income; VT = terminal value at forecast horizon.\n(B) Incorrect. It does not grow Stack’s RI in 2023 by 12%:\nStack’s terminal value = 5.32/(1 + 0.15 – 0.50) = $8.18\nPV Difference = (8.18 – 35.47)/(1.1510) = –6.74\n(C) Incorrect. It ignores PV to time 0 and reverses effect (misunderstanding persistence factor):\n35.47 – 9.17 = +26.30", "ko": "Armishaw: 5.32 영구(ω = 1) → TV = 5.32/0.15 = 35.47. Stack: RI2024 = 5.32 × (1 + 0.20 × 0.60) = 5.96, TV = 5.96/(1 + 0.15 − 0.50) = 9.17. 차이 −26.30을 10년 할인: −26.30/1.15¹⁰ = −$6.50.", "trap": "Stack 방식의 성장률 = ROE × 유보율 = 0.20 × 0.60 = 12%.", "f": "TV = RI_(T+1)/(1 + r − ω)", "why": {"B": "−6.74는 RI를 12% 성장시키지 않고 5.32를 그대로 쓴 값입니다.", "C": "+26.30은 현재가치로 할인하지 않았고, 방향도 반대입니다(ω↓ → 가치↓)."}, "orig": "ECO Module 5 Q67"}, {"id": "ECO-M5-Q69", "src": "ECO 오답", "module": 5, "tag": "RI vs DDM 비교", "vig": 35, "stem": "In Sonberg’s comparison of the residual income and dividend discount models, which of her statements is least accurate?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "(A) Incorrect. Statement 1 is accurate. Given the same set of assumptions, the residual income model and the dividend discount model will yield the same results.\n(B) Incorrect. Statement 2 is accurate. The residual income is based on the sum of the current book value plus the present value of expected future residual income. The current book value normally makes up a large portion of the value. The dividend discount model has no initial value component and hence derives the value from the future stream of earnings.\n(C) Correct. Statement 3 is the least accurate. The residual income model does not make assumptions about future earnings and dividend growth.", "ko": "Statement 3이 가장 부정확: RI 모형은 미래 이익·배당 성장에 대한 가정을 하는 모형이 아닙니다(장부가 + 초과이익의 PV).", "trap": "노트: clean surplus 하에서 RI = DDM.", "f": "", "why": {"A": "Statement 1 정확: clean surplus 하에서 RI와 DDM은 같은 값을 냅니다.", "B": "Statement 2 정확: RI는 현재 장부가가 가치의 큰 부분 → 가치가 앞쪽에서 인식, DDM은 뒤쪽."}, "orig": "ECO Module 5 Q69"}, {"id": "ECO-M5-Q70", "src": "ECO 오답", "module": 5, "tag": "RI per share – 기초 BV 사용", "vig": 35, "stem": "Using Exhibit 1, the forecasted residual income per share for current fiscal year is closest to:", "opts": {"A": "$0.69.", "B": "$1.41.", "C": "$6.18."}, "ans": "B", "en": "(A) Incorrect. It incorrectly uses the end-of-period book value, not the beginning-of-period book value.\nStep 1: Book value per share end of period (error)\t$52.98\nStep 2: Multiple beginning book value per share by cost of equity\t13%\nPer share equity charge\t$6.89\nStep 3: Earnings per share forecast\t$7.58\nLess per share equity charge\t–$6,89\nPer share residual income\t$0.69\n(B) Correct. Using Exhibit 1, residual income per share is calculated as follows:\nStep 1: Book value per share beginning of period (31 August previous year):\t$47.50\nStep 2: Multiply beginning book value per share by cost of equity\t13%\nPer share equity charge\t$6.18\nStep 3: Earnings per share forecast\t$7.58\nLess per share equity charge\t–$6,18\nPer share residual income\t$1.41\n(C) Incorrect. It correctly calculates the equity charge per share but does not subtract the earnings per share to determine the residual earnings.\nStep 1: Book value per share beginning of period (31 August previous year):\t$47.50\nStep 2: Multiple beginning book value per share by cost of equity\t13%\nPer share equity charge\t$6.18", "ko": "RI = EPS 7.58 − 0.13 × 기초 BVPS 47.50 (= 6.18) = $1.41.", "trap": "", "f": "RI = EPS − r × BVPS(beginning)", "why": {"A": "$0.69는 기말 BVPS(52.98)로 equity charge를 계산한 오류입니다.", "C": "$6.18은 equity charge 자체입니다."}, "orig": "ECO Module 5 Q70"}, {"id": "ECO-M5-Q71", "src": "ECO 오답", "module": 5, "tag": "Single-stage RI (ROE − r)", "vig": 35, "stem": "Using Exhibit 1 and the single-stage residual income model, the intrinsic value of Sparrow is closest to:", "opts": {"A": "$61.07.", "B": "$77.50.", "C": "$108.57."}, "ans": "A", "en": "(A) Correct. The single-stage residual income model is:\nB\n0\n+\nR\nO\nE\n+\nr\nr\n−\ng\n×\nB\n0\nWhere:\nB0 = book value per share at the beginning of the period, see calculation below\nROE = return on equity: 15%\ng = long-term growth rate: 6%\nre = cost of equity\nBook value per share (31 August previous fiscal year) = $47.50 per share\nP\n=\n47.50\n+\n.15\n−\n.13\n.13\n−\n.06\n×\n47.50\n=\n$\n61.07\n(B) Incorrect. It is the book value per share plus the present value of the dividends:\n47.50\n+\n2.10\n.13\n−\n.06\n=\n$\n77.50\n(C) Incorrect. It misstates the numerator of the formula subtracting g from return on equity not r:\nB\n0\n+\nR\nO\nE\n−\ng\nr\n−\ng\n×\nB\n0\n=\n47.50\n+\n.15\n−\n.06\n.13\n−\n.06\n×\n47.50\n=\n$\n108.57", "ko": "V0 = 47.50 + 47.50 × (0.15 − 0.13)/(0.13 − 0.06) = 47.50 + 13.57 = $61.07.", "trap": "M5 Q12 오답과 동일 함정(분자 ROE − r).", "f": "V0 = B0 + (ROE − r)B0/(r − g)", "why": {"B": "$77.50은 장부가 + 배당 영구성장 가치(2.10/0.07)를 더한 혼합 오류입니다.", "C": "$108.57은 분자에 (ROE − g)를 넣은 오류입니다."}, "orig": "ECO Module 5 Q71"}, {"id": "ECO-M5-Q72", "src": "ECO 오답", "module": 5, "tag": "EVA 계산", "vig": 35, "stem": "Using Exhibit 2, the EVA for Sparrow is closest to:", "opts": {"A": "$34,765.", "B": "$157,965.", "C": "$213,072."}, "ans": "A", "en": "(A) Correct. EVA = NOPAT – (C% × TC)\nWhere:\nNOPAT = Net operating profit after tax: $616,000 × (1 – 0.20) = $492,800\nC% = Cost of capital (WACC): 7.0%\nTC = Total capital: $4,391,600 + $2,151,750 = $6,543,350\nEVA = 492,800 – (0.070 × 6,543,350) = 492,800 – 458,035 = $34,765\n(B) Incorrect. It uses operating profit before tax (EBIT), not after tax: 616,000 – (0.070 × 6,543,350) = $157,965\n(C) Incorrect. It uses the cost of equity and only the book value of equity: 492,800 – (0.13 × 2,151,750) = $213,072", "ko": "NOPAT = 616,000 × (1 − 0.20) = 492,800. 총자본 = 4,391,600 + 2,151,750 = 6,543,350. EVA = 492,800 − 0.07 × 6,543,350 = $34,765.", "trap": "EVA는 기업 전체(WACC, 총자본), RI는 주주(r_e, 자기자본).", "f": "EVA = EBIT(1 − t) − WACC × (Debt + Equity)", "why": {"B": "$157,965는 세전 EBIT를 NOPAT 대신 쓴 오류입니다.", "C": "$213,072는 자기자본비용과 자기자본만으로 계산한 오류입니다. EVA는 WACC × 총자본."}, "orig": "ECO Module 5 Q72"}, {"id": "ECO-M5-Q76", "src": "ECO 오답", "module": 5, "tag": "RI 모형 적합/부적합 요인", "vig": null, "stem": "An analyst believes a company with variable cash flows has been smoothing out earnings and its reported interest expense understates its marginal cost of capital. Which of the following factors best supports using a residual income model for valuation?", "opts": {"A": "The earnings record", "B": "The variability of cash flows", "C": "The low marginal cost of capital"}, "ans": "B", "en": "(A) Incorrect because the analyst believes the company is using the flexibility of accounting rules to smooth out earnings. The residual income (RI) model is based on accounting data. The models are based on accounting data that can be subject to manipulation by management. In this scenario, if the company is smoothing out earnings, a form of manipulation, the RI model would not be the best choice.\n(B) Correct because the residual income (RI) models rely on accounting data and can be readily applied to companies that do not have positive expected near-term free cash flows. The models can be used when cash flows are unpredictable. The cash flows for the company in this scenario are variable (unpredictable), which would favor a RI model over a FCFE model.\n(C) Incorrect because the residual income (RI) model relies on accounting data and it assumes that the cost of debt capital is reflected appropriately by interest expense. This is not the case for this company, the interest expense appears to be understated due to rising interest rates, therefore net income would be overstated when calculating the residual income.", "ko": "현금흐름 변동성(예측 곤란)은 RI 모형을 지지하는 요인입니다. 이익 평활화(earnings smoothing)와 이자비용 과소계상(한계자본비용 미반영)은 RI 모형을 약화시킵니다.", "trap": "노트 정리 그대로.", "f": "", "why": {"A": "이익 평활화(회계 조작)는 RI 모형의 핵심 입력(NI)의 신뢰도를 훼손합니다.", "C": "이자비용이 실제 자본비용을 과소반영하면 NI가 과대계상되어 RI가 왜곡됩니다."}, "orig": "ECO Module 5 Q76"}, {"id": "ECO-M5-Q80", "src": "ECO 오답", "module": 5, "tag": "Multistage RI 계산", "vig": null, "stem": "An analyst gathers the following information about a company:\n\tYear 1\tYear 2\nCost of equity\t8.5%\t\nBook value per share at beginning of Year 1\t€25.50\t\nP/B ratio at end of Year 2\t1.5×\t\nEPS\t€5.10\t€5.87\nDividend per share\t€1.25\t€1.50\nUsing a multi-stage residual income model, the per share value of the company's stock is closest to:", "opts": {"A": "€20.", "B": "€45.", "C": "€74."}, "ans": "B", "en": "(A) Incorrect because it does not include the beginning book value in the calculation, just the present value of the residual income and present value of the terminal residual value. Using the values calculated in the correct response:\nValue = Present value of Residual Income + Present value of Terminal residual value\nValue = €5.57 + €14.32 = €19.89\n(B) Correct because the share value = B0 + Present value (PV) of the Residual income (RI) + Present value of the Residual terminal value.\nStep 1: Calculate the PV of the Residual income (RI)\nResidual income = Net income per share – (cost of equity × beginning BV)\nYear 1\tYear 2\nBeginning book value\t€25.50\t€29.35\nplus net income\t5.10\t5.87\nless dividends\t1.25\t1.50\nEnding book value\t€29.35\t€33.72\nResidual income (RI)\ncalculation\n5.10 – (0.085 × 25.50)\t5.87 – (0.085 × 29.35)\nResidual income\t€2.93\t€3.38\nPresent value of RI at cost of equity\n2.93/(1 + 0.085)^1\n€2.70\n3,38/(1 + 0.085)^2\n€2.87\nTotal present value of the RI = €2.70 + €2.87 = €5.57\nStep 2: Calculate the PV of the residual terminal value (PT – BT)\nTerminal market price of share (PT) at end of year 2: 1.5 × €33.72 = €50.58\nTerminal residual value = PT – BT = €50.58 – €33.72 = €16.86\nPV of (PT – BT) for 2 years at cost of equity: 16.86/(1+0.85)^2 = €14.32\nStep 3: Calculate the value per share:\nCurrent book value + PV of 2 years RI + PV Residual terminal value\n€25.50 + €5.57 + €14.32 = €45.39 ≈ €45.00\n(C) Incorrect because it uses the terminal market price of the share not the terminal residual value in the calculation.\nUsing the values calculated in the correct response\nBeginning book value B0\t \t€ 25.50\nPresent value of Residual income from correct calculation\t \t5.57\nTerminal share price (PT)\t€50.58\nPresent value of PT for 2 years at cost of equity 50.58/(1.085)^2\t \t42.97\nShare value\t \t€74.04", "ko": "BV: 25.50 → 29.35 → 33.72. RI: 5.10 − 0.085×25.50 = 2.93, 5.87 − 0.085×29.35 = 3.38 → PV 5.57. P2 = 1.5 × 33.72 = 50.58, P − B = 16.86 → PV 14.32. V0 = 25.50 + 5.57 + 14.32 = €45.39 ≈ €45.", "trap": "Terminal 항은 P_T − B_T. B0 반드시 포함.", "f": "V0 = B0 + Σ PV(RI) + PV(PT − BT)", "why": {"A": "€20은 기초 장부가(25.50)를 더하지 않은 값입니다.", "C": "€74는 terminal 항으로 (P − B)가 아니라 P 전체를 쓰는 등 terminal 처리를 잘못한 값입니다."}, "orig": "ECO Module 5 Q80"}, {"id": "ECO-M5-Q82", "src": "ECO 오답", "module": 5, "tag": "Continuing RI – premium → 0 조건", "vig": null, "stem": "Under the residual income valuation model, the premium over book value at the end of the forecast period will most likely be close to zero when the forecast period is:", "opts": {"A": "short and competition is low.", "B": "short and competition is high.", "C": "long and competition is high."}, "ans": "C", "en": "(A) Incorrect because, while ROE has been found to revert to mean levels over time and may decline to the cost of equity in a competitive environment, a low degree of competition would partially offset or delay the process by allowing a company to maintain a higher return on equity, thereby increasing the company's persistence factor. Additionally, for shorter forecast periods, a forecast of the premium should be calculated.\n(B) Incorrect because ROE fades to the cost of equity over time and therefore, for shorter forecast periods, a forecast of the premium should be calculated.\n(C) Correct because, as ROE has been found to revert to mean levels over time and may decline to the cost of equity in a competitive environment, residual income approaches often model ROE fading toward the cost of equity. As ROE approaches the cost of equity, residual income approaches zero.\nAnalysts make a variety of assumptions concerning continuing residual income. Frequently, one of the following assumptions is made:\nresidual income continues indefinitely at a positive level;\nresidual income is zero from the terminal year forward;\nresidual income declines to zero as ROE reverts to the cost of equity through time; or\nresidual income reflects the reversion of ROE to some mean level.\nOne finite-horizon model of residual income valuation assumes that, at the end of time horizon T, a certain premium over book value (PT − BT) exists for the company, in which case current value equals the following (Bauman, 1999):\nV0 = B0 + Σt [(Et − rBt−1)/(1 + r)t] + (PT − BT)/(1 + r)T, t = 1, ..., T\nAlternatively,\nV0 = B0 + Σt [(ROEt − r)Bt−1/(1 + r)t] + (PT − BT)/(1 + r)T, t = 1, ..., T\nThe last component in both specifications represents the premium over book value at the end of the forecast horizon. The longer the forecast period, the greater the chance that the company’s residual income will converge to zero. For long forecast periods, this last term may be treated as zero. For shorter forecast periods, a forecast of the premium should be calculated.", "ko": "예측기간이 길고 경쟁이 치열하면 ROE가 자기자본비용으로 수렴 → RI → 0 → 예측기간 말 장부가 대비 프리미엄 ≈ 0.", "trap": "노트: Long horizon → ROE fades → RI fades → terminal premium ≈ 0.", "f": "", "why": {"A": "경쟁이 약하면 높은 ROE가 유지(ω↑)되고, 짧은 기간이면 프리미엄을 따로 예측해야 합니다.", "B": "기간이 짧으면 아직 ROE가 수렴하지 않아 프리미엄을 예측해야 합니다."}, "orig": "ECO Module 5 Q82"}, {"id": "ECO-M5-Q84", "src": "ECO 오답", "module": 5, "tag": "Single-stage RI – 내재 성장률", "vig": null, "stem": "An analyst gathers the following information about a company:\nCurrent stock price\t$24.50\nCurrent book value per share\t$10.50\nCost of equity\t7.2%\nLong-term ROE\t11.0%\nUsing a single-stage residual income model, the implied long-term growth rate in the company's residual income is closest to:", "opts": {"A": "4.35%.", "B": "5.57%.", "C": "6.93%."}, "ans": "A", "en": "(A) Correct because the implied long-term growth rate in the residual income is calculated using: P0 = B0 + [(ROE – r)/(r – g)] × B0, where B0 is the current book value per share, ROE is the return on equity, r is the cost of equity, and g is the implied growth rate of residual income. This implies:\ng = r – (ROE – r)/[(P0 – B0)/B0]\n= 0.072 – (0.11 – 0.072)/[($24.50 – $10.50)/$10.50]\n= 4.35%\n(B) Incorrect because the implied long-term growth rate in the residual income is calculated using an incorrect equation: P0 = [(ROE – r)/(r – g)] × B0. This incorrect equation implies:\ng = r – (ROE – r)/(P0/B0)\n= 0.072 – (0.11 – 0.072)/($24.50/$10.50)\n= 5.57%\n(C) Incorrect because the implied long-term growth rate in the residual income is calculated using an incorrect equation: P0 = B0 + (ROE – r)/(r – g). This incorrect equation implies:\ng = r – (ROE – r)/(P0 – B0)\n= 0.072 – (0.11 – 0.072)/($24.50 – $10.50)\n= 6.93%", "ko": "P0 = B0 + (ROE − r)B0/(r − g) → g = r − (ROE − r)/[(P0 − B0)/B0] = 0.072 − 0.038/(14/10.5) = 4.35%.", "trap": "", "f": "g = r − (ROE − r)·B0/(P0 − B0)", "why": {"B": "5.57%는 B0를 빼지 않은 식(P0 = (ROE − r)B0/(r − g))으로 푼 값입니다.", "C": "6.93%는 (P0 − B0)를 B0로 나누지 않은 식으로 푼 값입니다."}, "orig": "ECO Module 5 Q84"}, {"id": "ECO-M5-Q14", "src": "ECO 관련유형", "module": 5, "tag": "비경상 항목 – 미래 RI 예측에서 제외", "vig": 28, "stem": "The most appropriate treatment of the estimated restructuring charge, in response to Nkomo’s Question 3, would be:", "opts": {"A": "an upward adjustment to book value.", "B": "an upward adjustment to the cost of equity.", "C": "to exclude it from the estimate of net income."}, "ans": "C", "en": "C is correct. The restructuring charge is a non-recurring item and not indicative of future earnings. In applying a residual income model, it is important to develop a forecast of future residual income based on recurring items. Using the net income reported in Amersheen’s 2020 net income statement to model subsequent future earnings, without adjustment for the restructuring charge, would understate the firm’s future earnings. By upward adjusting the firm’s net income, by adding back the R2 million restructuring charge to reflect the fact that the charge is non-recurring, future earnings will be more accurately forecasted.", "ko": "구조조정 비용은 비경상 항목 → 미래 이익 예측 시 제외(가산 조정). 장부가·자기자본비용 조정 대상 아님.", "trap": "M5 Q52 오답(Adjustment 3)과 같은 개념.", "f": "", "why": {"A": "장부가는 이미 과거 손익을 반영하므로 조정하지 않습니다.", "B": "자기자본비용과 무관합니다."}, "orig": "ECO Module 5 Q14"}, {"id": "ECO-M5-Q18", "src": "ECO 관련유형", "module": 5, "tag": "RI 모형 사용 근거 – 배당 예측 불가", "vig": 29, "stem": "Which of Castovan’s reasons best justifies the use of a residual income model to value PTU?", "opts": {"A": "Reason 1", "B": "Reason 2", "C": "Reason 3"}, "ans": "A", "en": "A is correct. Dividend payments are forecasted to be unpredictable over Castovan’s five-year forecast horizon. A residual income model is appropriate when a company does not pay dividends or when its dividends are not predictable, which is the case for PTU.", "ko": "배당이 예측 불가능하면 RI 모형이 적절(무배당·불규칙 배당).", "trap": "", "f": "", "why": {"B": "FCF가 양(+)이고 예측 가능하면 FCF 모형이 적합.", "C": "OCI가 크면 clean surplus 위반 → RI에 불리."}, "orig": "ECO Module 5 Q18"}, {"id": "ECO-M5-Q78", "src": "ECO 관련유형", "module": 5, "tag": "RI vs DDM – 가치 인식 시점", "vig": null, "stem": "Compared to the dividend discount model, the residual income model:", "opts": {"A": "is based on discounting future cash flows.", "B": "tends to be more sensitive to terminal value estimation.", "C": "attributes most of a stock's value to earnings from earlier periods."}, "ans": "C", "en": "(A) Incorrect because the residual income model does not require the forecast of future cash flows. Unlike the residual income model, however, the discounted dividend and free cash flow models forecast future cash flows and find the value of stock by discounting them back to the present using the required return.\n(B) Incorrect because residual income valuations typically are less sensitive [not more sensitive] to terminal value estimates.\n(C) Correct because in the residual income (RI) model, most of the stock’s total value is attributed to the earnings from the earlier periods. In contrast, in the dividend discount model (DDM), value is derived from the receipt of dividends, and typically, a smaller proportion of value is attributed to the earlier periods.", "ko": "RI 모형은 가치의 대부분을 앞쪽(장부가 + 초기 RI)에서 인식 → terminal value 민감도가 낮음.", "trap": "", "f": "", "why": {"A": "RI는 현금흐름이 아니라 회계이익 기반.", "B": "RI가 terminal value에 '덜' 민감합니다."}, "orig": "ECO Module 5 Q78"}, {"id": "ECO-M5-Q79", "src": "ECO 관련유형", "module": 5, "tag": "공격적 자본화 → RI 가치 과대", "vig": null, "stem": "If a company aggressively capitalizes an expenditure in the current year rather than expense it, it most likely leads to:", "opts": {"A": "an increase in its future earnings.", "B": "a decrease in its current return on equity.", "C": "an overstatement of the company's value in the residual income model."}, "ans": "C", "en": "(A) Incorrect because in an aggressive accounting to capitalize an expense, this item will need to be amortized and/or depreciated in the future, leading to a decrease in future earnings.\nIf the company capitalized the expenditure rather than expensing it immediately, it would at some time in the future this capitalized item will likely be amortized or written off, thus reducing (not increasing) realized future earnings.\n(B) Incorrect because an aggressive accounting to capitalize an expense will lead to an increase in return on equity (ROE), not decrease in ROE.\nTake, for example, a company with $1,000,000 of book value and $200,000 of earnings before taxes, after expensing an expenditure of $50,000. Ignoring taxes, this company has a ROE of 20%. If the company capitalized the expenditure rather than expensing it immediately, it would have a higher ROE of 23.81% ($250,000/$1,050,000).\n(C) Correct because aggressive accounting choices will lead to lower reported future earnings, consider an example in which a company chooses to capitalize an expenditure in the current year rather than expense it. Doing so overstates current-year earnings as well as current book value. If an analyst uses current earnings (or ROE) naively in predicting future residual earnings, the RI model will overestimate the company’s value.", "ko": "비용을 자본화하면 현재 이익·장부가·ROE가 과대 → RI 모형 가치 과대평가. 이후 상각으로 미래 이익은 감소.", "trap": "", "f": "", "why": {"A": "자본화된 항목은 이후 상각되어 미래 이익을 '줄입니다'.", "B": "현재 ROE는 '증가'합니다."}, "orig": "ECO Module 5 Q79"}, {"id": "SCH-R21-11", "module": 5, "tag": "Continuing RI (영구) – 가치", "stem": "The present value of Sporting Shoes (SS) projected residual income for the next five years plus beginning book value is C$75.00 per share. Beyond that time horizon, the firm will sustain a residual income of C$11.25 per share, which is the residual income for Year 6. The cost of equity is 10%. The justified value of SS’s common stock is closest to:", "opts": {"A": "C$69.85.", "B": "C$112.50.", "C": "C$144.85."}, "ans": "C", "en": "Terminal value as of Year 5 = 11.25/0.10 = 112.50. Present value = 112.50/1.10^5 = 69.85. Justified value = 75.00 + 69.85 = C$144.85.", "ko": "TV(Year 5) = RI6/r = 112.50 → PV 69.85 → 75.00 + 69.85 = C$144.85.", "why": {"A": "C$69.85는 terminal value의 PV만입니다.", "B": "C$112.50은 할인 전 terminal value입니다."}, "trap": "ECO M5 Q24·Q51 오답과 같은 구조(B0 + PV(RI) + PV(TV)).", "f": "V0 = B0 + Σ PV(RI) + PV[RI(T+1)/r]", "orig": "Schweser MQ 21.1/21.2 Q1", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R21-32", "module": 5, "tag": "Justified P/B → 내재 자기자본비용", "stem": "An investor is considering the purchase of Capital City Investments, Inc., which has a price-to-book value (P/B ratio) of 5.00. Return on equity (ROE) is expected to be 18%, the market price per share is $25.00, and the growth rate is expected to be 8%. Assume the shares are currently priced at their fair value. The cost of equity implied by the current P/B ratio is closest to:", "opts": {"A": "12%.", "B": "16%.", "C": "10%."}, "ans": "C", "en": "P/B = 1 + (ROE − r)/(r − g) → 5 = 1 + (0.18 − r)/(r − 0.08) → 4r − 0.32 = 0.18 − r → r = 10%.", "ko": "5 = 1 + (0.18 − r)/(r − 0.08) → r = 10%.", "why": {"A": "12%를 넣으면 P/B = 1 + 0.06/0.04 = 2.5로 맞지 않습니다.", "B": "16%를 넣으면 P/B = 1.25로 맞지 않습니다."}, "trap": "", "f": "P/B = 1 + (ROE − r)/(r − g)", "orig": "Schweser MQ 21.3 Q2", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R21-33", "module": 5, "tag": "Justified P/B → ROE", "stem": "Century Scales has a required return on equity of 12% and is expected to grow indefinitely at a rate of 5%. The expected return on equity (ROE) that would justify a price-to-book multiple of 2.14 is closest to:", "opts": {"A": "10%.", "B": "15%.", "C": "20%."}, "ans": "C", "en": "2.14 = 1 + (ROE − 0.12)/(0.12 − 0.05) → ROE = 0.12 + 1.14 × 0.07 = 19.98% ≈ 20%.", "ko": "2.14 = 1 + (ROE − 0.12)/0.07 → ROE ≈ 20%.", "why": {"A": "ROE < r이면 P/B < 1이어야 합니다.", "B": "15%면 P/B = 1 + 0.03/0.07 = 1.43."}, "trap": "", "f": "P/B = 1 + (ROE − r)/(r − g)", "orig": "Schweser MQ 21.3 Q3", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R21-43", "module": 5, "tag": "Multistage RI (P/B 종료) 가치", "stem": "Josef Robien, CFA, is valuing the common stock of British Cornucopia Bank (BCB) as of December 31, 20X3, when the book value per share is £10.62. Earnings per share (EPS) will be 20% of the beginning book value per share for each of the next three years. BCB will pay cash dividends equal to 40% of EPS. At the end of three years, BCB’s common stock will trade at four times its book value. Beta for BCB is 0.7, the risk-free rate is 4.5%, and the equity risk premium is 5.0%.\nThe value per share of BCB stock using the residual income model is closest to:", "opts": {"A": "£39.17.", "B": "£49.80.", "C": "£53.20."}, "ans": "B", "en": "r = 4.5% + 0.7 × 5.0% = 8.0%. Book value grows 12% per year (20% × 60% retained): B1 = 11.89, B2 = 13.32, B3 = 14.92. RI_t = (0.20 − 0.08) × B(t−1) = 1.27, 1.43, 1.60. P3 − B3 = 3 × 14.92 = 44.76. V0 = 10.62 + PV(RI) + 44.76/1.08^3 ≈ £49.80.", "ko": "r = 8%. BV 연 12% 증가(20% × 60%). RI = 12% × 기초 BV: 1.27, 1.43, 1.60 → PV 3.67. P3 − B3 = 3 × 14.92 = 44.76 → PV 35.53. V0 = 10.62 + 3.67 + 35.53 = £49.82 ≈ 49.80.", "why": {"A": "Terminal 항을 P/B 4배가 아닌 다른 방식으로 처리하는 등 계산을 잘못한 값입니다.", "C": "할인 또는 RI 계산을 잘못한 값입니다(정답 ≈ 49.8)."}, "trap": "P/B = 4 → PT − BT = 3 × BT.", "f": "V0 = B0 + Σ PV(RI) + PV(PT − BT)", "orig": "Schweser MQ 21.4 Q3", "src": "Schweser MQ", "vig": null}, {"id": "VAR-R21-01", "module": 5, "tag": "Clean surplus 위반 판정", "stem": "Which of the following items is least likely to cause a violation of the clean surplus relation in a residual income valuation?", "opts": {"A": "Foreign currency translation adjustments under the current rate method.", "B": "Unrealized gains on investments classified as fair value through OCI (available-for-sale).", "C": "Foreign exchange gains on routine export sales recorded in the income statement."}, "ans": "C", "en": "Clean surplus holds when ending book value = beginning book value + net income − dividends. FX gains on ordinary transactions pass through the income statement, so they do not violate clean surplus. Translation adjustments (current rate method) and AFS/FVOCI unrealized gains bypass the income statement through OCI.", "ko": "통상 거래(수출) 외환손익은 손익계산서 반영 → 위반 아님. Current rate 환산조정·FVOCI 미실현손익은 OCI 우회 → 위반.", "why": {"A": "Current rate method 환산조정은 OCI로 가므로 위반입니다.", "B": "FVOCI(AFS) 미실현손익은 OCI로 가므로 위반입니다."}, "trap": "ECO M5 Q63 오답을 다른 표현으로 재출제.", "f": "B_t = B(t−1) + NI_t − D_t", "orig": "변형 (ECO M5 Q63, Schweser R21)", "src": "변형", "vig": null}, {"id": "ECO-M6-Q2", "src": "ECO 오답", "module": 6, "tag": "Strategic buyer – synergistic control premium", "vig": 36, "stem": "During Schwalke’s meeting with his former classmate, they discuss how their approaches to private company valuation vary given the different uses of their analysis. Which of the following best characterizes how Schwalke’s approach differs from that of his former classmate?", "opts": {"A": "Schwalke usually incorporates a DLOM.", "B": "Schwalke usually adjusts the investment value as a minority interest.", "C": "Schwalke’s approach usually considers a synergistic control premium."}, "ans": "C", "en": "C is correct. As Schwalke’s firm specializes in buying and restructuring private companies to be taken public, as a strategic buyer it will consider a control premium. Choices A and B are inconsistent with his firm’s strategy of controlling and restructuring companies over a five-year period.", "ko": "Schwalke의 회사는 비상장사를 인수·구조조정 후 상장시키는 전략적 매수자(지배) → 시너지 control premium을 고려. 동창은 소송 목적 평가 → 다른 관점.", "trap": "", "f": "", "why": {"A": "DLOM은 비지배·비유동 지분 평가에서 쓰며, 지배·5년 내 상장 전략과 맞지 않습니다.", "B": "소수지분 조정은 지배권을 인수하는 전략과 맞지 않습니다."}, "orig": "ECO Module 6 Q2"}, {"id": "ECO-M6-Q4", "src": "ECO 오답", "module": 6, "tag": "비상장사 WACC 편향 – 자기자본 비중↑", "vig": 36, "stem": "Which statement best describes a possible bias in the WACC of the private target with a suboptimal debt ratio?", "opts": {"A": "Private companies are likely to have WACC estimates below their optimal WACC because of a lower weight on debt.", "B": "Private companies are likely to have WACC estimates above their optimal WACC because of a higher weight on equity.", "C": "Private companies are likely to have WACC estimates above their optimal WACC because of a higher weight on debt."}, "ans": "B", "en": "B is correct. Recall the formula for WACC:\nrWACC = wdrd + were\nFirst, a higher equity weight implies a lower debt weight, as these proportions combined must equal one. Also, re > rd, as equity is riskier than debt. Therefore, as wd falls, the WACC increases, approaching re as the debt ratio approaches zero. A suboptimal debt ratio translates to a higher than optimal WACC. A is incorrect because a lower debt ratio does not reduce WACC. C is incorrect because a higher debt weight likely lowers the WACC.", "ko": "비상장사는 부채조달 접근성이 낮아 자기자본 비중이 높음 → r_e > r_d이므로 WACC가 최적보다 높아집니다.", "trap": "노트 정리 그대로.", "f": "WACC = wd·rd(1 − t) + we·re", "why": {"A": "부채 비중이 낮으면 WACC는 '낮아지지' 않고 올라갑니다.", "C": "부채 비중이 높으면 오히려 WACC가 낮아지는 쪽입니다."}, "orig": "ECO Module 6 Q4"}, {"id": "ECO-M6-Q5", "src": "ECO 오답", "module": 6, "tag": "Synergistic vs financial control premium", "vig": 36, "stem": "Schwalke learns that his firm intends to combine the new target company with an existing portfolio company prior to taking it public. Should Schwalke apply a financial or synergistic control premium, and how does this level of control premium compare to the other?", "opts": {"A": "Financial; higher", "B": "Financial; lower", "C": "Synergistic; higher"}, "ans": "C", "en": "C is correct. As Schwalke’s firm seeks to realize synergies from the business combination of the target and existing portfolio company, it is likely to consider a synergistic premium which exceeds that of a financial buyer.", "ko": "기존 포트폴리오 회사와 결합해 시너지를 실현 → synergistic premium, 이는 financial buyer의 premium보다 높습니다.", "trap": "Strategic(synergistic) premium > Financial premium.", "f": "", "why": {"A": "시너지 결합이므로 financial premium이 아닙니다.", "B": "financial premium은 synergistic보다 낮고, 이 상황에 맞지 않습니다."}, "orig": "ECO Module 6 Q5"}, {"id": "ECO-M6-Q9", "src": "ECO 오답", "module": 6, "tag": "Terminal value 방법 – EEM은 기업 전체 평가에 덜 유용", "vig": 37, "stem": "Which terminal value estimation method is least useful for Schwalke?", "opts": {"A": "CCM", "B": "EEM", "C": "Market multiple method"}, "ans": "B", "en": "B is correct. Because Schwalke’s work involves valuing entire businesses, the EEM is likely to be the least useful due to its reliance on multiple discount rates. The EEM is more commonly used to value a company’s intangible assets, while the CCF and market multiple methods are more useful in valuing entire businesses.", "ko": "EEM(excess earnings method)은 여러 할인율을 쓰고 주로 무형자산 평가에 사용 → 기업 전체 평가에는 가장 덜 유용. CCM·시장배수법이 기업 전체 평가에 유용.", "trap": "EEM = 무형자산 가치(초과이익 자본화).", "f": "", "why": {"A": "CCM은 기업 전체 평가에 유용합니다.", "C": "Market multiple method도 기업 전체 평가에 유용합니다."}, "orig": "ECO Module 6 Q9"}, {"id": "ECO-M6-Q13", "src": "ECO 오답", "module": 6, "tag": "CCM – FCFF1 사용", "vig": 38, "stem": "Which of the following is closest to the proper calculation of LPE’s EV using the CCM?", "opts": {"A": "EUR 15 million", "B": "EUR 30 million", "C": "EUR 15.6 million"}, "ans": "C", "en": "C is correct. The CCM uses the following formula:\nFirm Value\nt\n=\nFCFF\nt\n+\n1\nWACC\n−\ng\nRecall that the FCFF at time t+1 must equal the base year FCFF multiplied by one plus the growth rate.\nFirm Value\nt\n=\n600\n,\n000\n×\n1.04\n0.08\n−\n0.04\n=\n15\n,\n600\n,\n000", "ko": "기준연도 FCFF0 = 600,000 → FCFF1 = 624,000. Firm = 624,000/(0.08 − 0.04) = EUR 15.6M.", "trap": "노트: CCM → FCFF1 = FCFF0 × (1+g).", "f": "V = FCFF0(1 + g)/(WACC − g)", "why": {"A": "EUR 15M은 FCFF0를 성장시키지 않고 나눈 값입니다(600,000/0.04).", "B": "EUR 30M은 정확한 공식(FCFF1/(WACC − g))과 맞지 않습니다."}, "orig": "ECO Module 6 Q13"}, {"id": "ECO-M6-Q14", "src": "ECO 오답", "module": 6, "tag": "EV/Sales → equity value", "vig": 38, "stem": "Which of the following is closest to the proper calculation of LPE’s equity value using the EV/Sales multiple?", "opts": {"A": "EUR 18 million", "B": "EUR 12 million", "C": "EUR 24 million"}, "ans": "B", "en": "B is correct. Applying the EV/Sales multiple of 0.60 to LPE’s base year sales of EUR 30 million results in an EV of EUR 18 million. To calculate equity value from EV, we deduct the debt of EUR 6 million to arrive at an equity value of EUR 12 million.", "ko": "EV = 0.60 × 매출 30M = 18M. Equity = 18 − 부채 6 = EUR 12M.", "trap": "EV 배수 → EV → 부채 차감해 equity.", "f": "Equity = EV − Debt", "why": {"A": "EUR 18M은 EV 자체입니다(부채 미차감).", "C": "EUR 24M은 부채를 더한 오류입니다."}, "orig": "ECO Module 6 Q14"}, {"id": "ECO-M6-Q18", "src": "ECO 오답", "module": 6, "tag": "비상장사 할인율 – target의 자본비용", "vig": 39, "stem": "Which of Aaron's statements regarding the selection of an appropriate discount rate is accurate?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "B", "en": "(A) Incorrect because Statement 1: Due to its ease of access and liquidity, private companies tend to rely on bank financing is not accurate. In calculating a weighted average cost of capital (WACC) for a valuation based on FCFF, analysts should note that a private company may have less access to debt financing than a similar public company. This lesser access means the private company may need to rely more on equity financing, which would tend to increase its WACC.\n(B) Correct because Statement 2: In evaluating an acquisition the buyer’s cost of capital is irrelevant is accurate. In evaluating an acquisition, finance theory indicates that the cost of capital used should be based on the target company’s capital structure and the riskiness of the target company’s cash flows—the buyer’s cost of capital is irrelevant.\n(C) Incorrect because Statement 3: An adjustment for managerial experience is rarely necessary is not accurate. Management of a private company (on whom analysts may need to rely for forecasts) may have less experience forecasting future financial performance. Projections may reflect excessive optimism or pessimism. Any adjustments to a discount rate to account for projection risk or managerial inexperience in forecasting, however, would typically be highly judgmental.", "ko": "Statement 2 정확: 인수 평가 시 할인율은 대상회사의 자본구조·현금흐름 위험에 근거 → 매수자 자본비용은 무관.", "trap": "", "f": "", "why": {"A": "비상장사는 부채조달 접근성이 '낮아' 자기자본 의존 → WACC↑. 은행 차입이 쉽다는 서술은 틀림.", "C": "비상장사 경영진은 예측 경험이 부족할 수 있어 조정이 필요할 수 있습니다(판단적)."}, "orig": "ECO Module 6 Q18"}, {"id": "ECO-M6-Q23", "src": "ECO 오답", "module": 6, "tag": "Expanded CAPM vs Build-up", "vig": 40, "stem": "Brady's estimate for the required return on equity for Ajacks using the expanded CAPM is closest to:", "opts": {"A": "13.0%.", "B": "14.1%.", "C": "16.1%."}, "ans": "B", "en": "(A) Incorrect as the candidate used the build-up method:\nRequired equity return = RFR + equity risk premium + small stock premium + industry risk premium + company risk premium\nRequired equity return = 3% + 5.5% + 3.5% + 0% + 1% = 13.0%\nThe build-up approach, introduced earlier as part of return concept topics, relies on building up the required rate of return as a set of premia added to the risk-free rate. The added premia are typically based on factors such as size and company risk. The build-up method, unlike the expanded CAPM, excludes the application of beta to the equity risk premium. In the build-up model, in which beta is implicitly assumed equal to 1, an argument exists to include an industry risk adjustment (premium or discount), although there are challenges in measuring industry risk adjustments. For the baseline implementation of the build-up model, we take the model with an industry risk adjustment.\n(B) Correct as the candidate correctly applied the expanded CAPM:\nExpanded CAPM = RFR + beta*equity risk premium + small stock premium + company-specific risk premium.\nExpanded CAPM = 3% + (1.20)(5.5%) + 3.5% + 1% = 14.1%\nThe expanded CAPM is an adaptation of the CAPM that adds to the CAPM premiums for small size and company-specific risk.\n(C) Incorrect because the candidate adds the expected inflation rate to a correctly computed expanded CAPM: 14.1% (correct expanded CAPM calculation) + 2% expected inflation = 16.1%.", "ko": "Expanded CAPM = rf + β × ERP + 소형주 프리미엄 + 회사고유 프리미엄 = 3% + 1.2 × 5.5% + 3.5% + 1% = 14.1%.", "trap": "Expanded CAPM: β 적용, 산업 프리미엄 X / Build-up: β 없음(=1), 산업 프리미엄 O.", "f": "r = rf + β·ERP + SSP + CSRP", "why": {"A": "13.0%는 build-up 방법(베타 없이 ERP 그대로 + 산업 프리미엄)입니다.", "C": "16.1%는 기대 인플레이션(2%)을 추가로 더한 오류입니다. 명목 rf에 이미 인플레 포함."}, "orig": "ECO Module 6 Q23"}, {"id": "ECO-M6-Q24", "src": "ECO 오답", "module": 6, "tag": "Normalized earnings 조정 (세후)", "vig": 41, "stem": "The total additional adjustment (in USD) needed to normalize Horzak’s previous year net income in the event of a takeover is closest to:", "opts": {"A": "385,000.", "B": "550,000.", "C": "595,000."}, "ans": "A", "en": "(A) Correct because the excessive Board remuneration is an above-market expense whose excess over the normal rate of remuneration needs to be added to reported net income, while the free use of storage facilities is a benefit that requires a deduction from net income to reflect its normal market cost. Earnings normalization in private companies seeks to adjust for anomalies such as under- or over- reporting of earnings arising from noneconomic or non-recurring factors, in order to establish a baseline for forecasting future earnings under new ownership. These anomalies can include executive remuneration that deviates significantly from market practice, private use by executives of the companies’ assets, or free use of personal assets by the company.\nNew ownership of Horzak Digital would likely cut executive remuneration to the market rate, bringing about an increase in net income of USD 700,000 (USD 1.5 million less USD 0.8 million). Likewise, under new ownership, the CEO is unlikely to want to continue to provide free use of storage facilities in property he personally owns, resulting in a loss of USD 150,000.  Combining these two adjustments results in a pre-tax gain of USD 550,000. Accounting for a 30% tax rate results in a total adjustment to net income of USD 385,000 [=550,000 × (1-30%)].\n(B) Incorrect because this response does not taken into account the 30% tax rate and has adjusted the pre-tax amount to net income.\n(C) Incorrect because this response has made an incorrect adjustment for the free storage costs, by adding them back instead of subtracting them. Adding USD 700,000 and USD 150,000 equals USD 850,000, which, after adjusting for a tax rate of 30%, is USD 595,000.", "ko": "과다 이사회 보수 1.5M − 0.8M = +0.7M(가산), 사장 소유 창고 무상사용 −0.15M(시장비용 차감) → 세전 +0.55M → 세후 0.55 × (1 − 0.30) = USD 385,000.", "trap": "과다 비용 → 가산, 무상 혜택 → 시장비용만큼 차감, 그다음 세후 환산.", "f": "", "why": {"B": "550,000은 세전 금액입니다. 순이익 조정은 세후.", "C": "595,000은 창고 비용을 차감하지 않고 더하는 등 방향을 잘못 처리한 값입니다."}, "orig": "ECO Module 6 Q24"}, {"id": "ECO-M6-Q25", "src": "ECO 오답", "module": 6, "tag": "CCM (FCFE) – 자기자본가치", "vig": 41, "stem": "The estimated value (in USD millions) of Horzak’s equity under the capitalized cash flow method is closest to:", "opts": {"A": "27.0.", "B": "32.0.", "C": "33.6."}, "ans": "C", "en": "(A) Incorrect because this response incorrectly subtracts the market value of debt of USD 6.6 million from the correct answer.\nThe incorrect formula to arrive at this response is:\nV\n=\nF\nC\nF\nE\n1\n(\nr\n-\ng\n)\n-\nmarket\nvalue\nof\ndebt\nV\n=\n4\n.\n0\n×\n1\n.\n05\n0\n.\n175\n-\n0\n.\n05\n-\n6\n.\n6\n=\n4\n.\n2\n0\n.\n125\n-\n6\n.\n6\n=\n33\n.\n6\n-\n6\n.\n6\n=\nUSD\n27\nmillion\n.\n(B) Incorrect because this response omits the growth rate, g, in the numerator of the equation, as shown below:\nV=\nFCFE0\n(r-g)\n=\n4.0\n0.175-0.05\n=\n4.0\n0.125\n=USD 32.0 million.\n(C) Correct because, according to the FCFE variation of the capitalized cash flow method, the estimated value of equity equals the estimate of the normalized free cash flow to equity for the next period divided by the capitalization rate for equity. The capitalization rate is the required rate of return (i.e., cost of equity) for equity less the long-term growth rate in free cash flow to equity.\nThe formula for the value of equity, V, is:\nV\n=\nF\nC\nF\nE\n1\nr\n-\ng\nwhere FCFE1 is the next period's FCFE, equivalent to the current period's FCFE increased by the long-term growth rate, g, and is r is the cost of equity.\nV\n=\n4\n.\n0\n×\n1\n.\n05\n0\n.\n175\n-\n0\n.\n05\n=\n4\n.\n2\n0\n.\n125\n=\nUSD\n33\n.\n6\nmillion\n.", "ko": "V(equity) = FCFE1/(r − g) = 4.0 × 1.05/(0.175 − 0.05) = 4.2/0.125 = USD 33.6M.", "trap": "FCFE 모형 결과 = 이미 equity value. 부채 차감은 FCFF 모형에서만.", "f": "V_equity = FCFE0(1 + g)/(r − g)", "why": {"A": "27.0은 FCFE로 구한 '자기자본' 가치에서 부채를 또 뺀 오류입니다.", "B": "32.0은 FCFE0를 성장시키지 않은 값입니다."}, "orig": "ECO Module 6 Q25"}, {"id": "ECO-M6-Q26", "src": "ECO 오답", "module": 6, "tag": "Normalized operating income after taxes", "vig": 42, "stem": "Using the company’s data and Hester’s assessments and estimates in Exhibits 1 and 2, FDF’s normalized operating income after taxes for the previous year is closest to:", "opts": {"A": "$325,500.", "B": "$367,500.", "C": "$402,500."}, "ans": "B", "en": "(A) Incorrect. The mistake is in subtracting the interest expense as well.\nFDF’s Financial Performance for the previous year\nAs reported ($)\tNormalized ($)\nGross Revenues from crops, livestock, feed, etc.\t2,500,000\t2,500,000\nCost of goods sold: Normalized to 45% of Revenues\t–1,000,000\t–1,125,000\nGross profit\t1,500,000\t1,375,000\nSG&A (reflects $200,000 reduction in owner’s compensation and $100,000 reduction in operating expenses related to the ranch)\t–900,000\t–600,000\nEBITDA\t600,000\t775,000\nDepreciation and amortization (normalized to 10% of revenues)\t–200,000\t–250,000\nEarnings before interest and taxes\t400,000\t525,000\nInterest expense: $750,000 at 8%\t \t–60,000\nEarnings before taxes\t \t465,000\nPro forma taxes (at 30 percent)\t–120,000\t–139,500\nOperating income after taxes\t280,000\t325,500\n(B) Correct.\nFDF’s Financial Performance for the Previous Year Ended\nAs Reported ($)\tNormalized ($)\nGross revenues from crops, livestock, feed, and so on\t2,500,000\t2,500,000\nCost of goods sold (normalized to 45% of revenues)\t–1,000,000\t–1,125,000\nGross profit\t1,500,000\t1,375,000\nSG&A (reflects $200,000 reduction in owner’s compensation and $100,000 reduction in operating expenses related to the ranch)\t–900,000\t–600,000\nEBITDA\t600,000\t775,000\nDepreciation and amortization (normalized to 10% of revenues)\t–200,000\t–250,000\nEarnings before interest and taxes\t400,000\t525,000\nPro forma taxes (at 30%)\t–120,000\t–157,500\nOperating income after taxes\t280,000\t367,500\n(C) Incorrect. The mistake is in depreciation. It keeps the old depreciation as reported.\nFDF’s Financial Performance for the previous year\nAs reported ($)\tNormalized ($)\nGross Revenues from crops, livestock, feed, etc.\t2,500,000\t2,500,000\nCost of goods sold: Normalized to 45% of Revenues\t–1,000,000\t–1,125,000\nGross profit\t1,500,000\t1,375,000\nSG&A (reflects $200,000 reduction in owner’s compensation and $100,000 reduction in operating expenses related to the ranch)\t–900,000\t–600,000–\nEBITDA\t600,000\t775,000\nDepreciation and amortization (normalized to 10% of revenues)\t–200,000\t–200,000\nEarnings before interest and taxes\t400,000\t575,000\nPro forma taxes (at 30 percent)\t–120,000\t–172,500\nOperating income after taxes\t280,000\t402,500", "ko": "매출 2.5M, 매출원가 45% → 1.125M, SG&A 900k − 오너보수 초과 200k − 목장 운영비 100k = 600k, D&A 10% = 250k → EBIT 525k → 세후 525k × 0.7 = $367,500 (영업이익이므로 이자 차감 X).", "trap": "Operating income after taxes = EBIT × (1 − t). 이자 차감 X.", "f": "", "why": {"A": "$325,500은 이자비용(60k)까지 차감한 오류입니다. '영업' 이익은 이자 전.", "C": "$402,500 = 575,000 × 0.7 — D&A를 매출의 10%(250k)로 정상화하지 않고 200k를 그대로 쓴 값입니다."}, "orig": "ECO Module 6 Q26"}, {"id": "ECO-M6-Q27", "src": "ECO 오답", "module": 6, "tag": "FCFF → equity (WACC, 당해 FCFF = 1기)", "vig": 42, "stem": "Using the data and assumptions in Exhibit 3 compiled by Hester, FDF’s value of equity as at the end of the previous year is closest to:", "opts": {"A": "$2,986,111.", "B": "$4,423,077.", "C": "$4,681,731."}, "ans": "B", "en": "(A) Incorrect. The mistake is in the use of cost of equity instead of WACC\nV = FCFF1/(WACC – g)\t336,250/(0.14 – 0.05) = 3,736,111\nValue of equity\t3,736,111 – 750,000\t2,986,111\n(B) Correct.\nVprev yr = FCFFcurr yr/(WACC – g)\t336.250/(0.115 – 0.05)\t$5,173,077\nLess debt\t \t(750,000)\nValue of equity (Prevous Year end)\t \t$4,423,077\n(C) Incorrect. The mistake is in multiplying FCFF1 with (1 + g)\nV = FCFF1(1 + g)/(WACC – g)\t336,250(1.05)/(0.115 – 0.05) = 5,431,731\nValue of equity\t5,431,731 – 750,000\t4,681,731", "ko": "평가 시점(전년도 말) 기준 당해 FCFF 336,250이 1기 현금흐름. V = 336,250/(0.115 − 0.05) = 5,173,077 − 부채 750,000 = $4,423,077.", "trap": "'Current year FCFF'로 '전년도 말' 가치 → 이미 FCFF1.", "f": "V = FCFF1/(WACC − g) − Debt", "why": {"A": "자기자본비용(14%)으로 FCFF를 할인한 오류입니다. FCFF는 WACC.", "C": "이미 1기 값인 FCFF에 (1+g)를 또 곱한 오류입니다."}, "orig": "ECO Module 6 Q27"}, {"id": "ECO-M6-Q29", "src": "ECO 오답", "module": 6, "tag": "Build-up method → WACC", "vig": 43, "stem": "According to the method used by Metev for computing the cost of equity and data in Exhibits 1B and 3, RRBL’s WACC is closest to:", "opts": {"A": "9.2%.", "B": "10.9%.", "C": "12.0%."}, "ans": "C", "en": "(A) Incorrect. It uses the regular CAPM and adds the company-specific risk premium.\nCost of equity = Risk-free rate + Equity risk premium × (Beta) + Company-specific premium\n= 3.9 + 6 × (0.75) + 1.5 = 9.9%\n= 10.0 × (1 – 0.25) × (0.3) + 9.9 × (0.7) = 2.25 + 6.30 = 9.18%\n(B) Incorrect. It uses expanded the CAPM method instead of the build-up method.\nCost of equity (expanded CAPM) = Risk-free rate + Equity risk premium adjusted for beta + Small stock premium + Company-specific risk adjustment\n= 3.9 + 6 × (0.75) + 2.5 + 1.5 = 12.4%\n= 10.0 × (1 – 0.25) × (0.3) + 12.4 × (0.7) =2.25 + 8.68 = 10.93%\n(C) Correct. Using data from Exhibit 3, the cost of equity (build-up method) = Risk-free rate + Equity risk premium + Small stock risk premium + Industry risk premium + Company-specific risk adjustment.\nCost of equity = 3.9 + 6.0 + 2.5 + 0.0 + 1.5 = 13.9%\nWACC = Pre-tax cost of debt × (1 – T) × (Debt weight) + Cost of equity × (Equity weight)\nWACC = 10.0 × (1 – 0.25) × (0.3) + 13.9 × (0.7) = 2.25 + 9.03 = 11.98%", "ko": "Build-up: r_e = 3.9 + 6.0 + 2.5 + 0.0 + 1.5 = 13.9%. WACC = 10% × (1 − 0.25) × 0.3 + 13.9% × 0.7 = 11.98% ≈ 12.0%.", "trap": "문제에서 지정한 방법(build-up) 확인. Build-up엔 β 없음.", "f": "Build-up r_e = rf + ERP + SSP + IRP + CSRP", "why": {"A": "9.2%는 일반 CAPM(β 적용) + 회사고유 프리미엄만 쓴 값입니다.", "B": "10.9%는 expanded CAPM을 쓴 값입니다. Metev는 build-up 방법 사용."}, "orig": "ECO Module 6 Q29"}, {"id": "ECO-M6-Q30", "src": "ECO 오답", "module": 6, "tag": "Capitalization rate = WACC − g", "vig": 43, "stem": "According to the revised method used by Metev, the WACC suggested by Nenkov, and the data provided in Exhibit 3, RRBL’s capitalization rate is closest to:", "opts": {"A": "6.0%.", "B": "8.5%.", "C": "11.0%."}, "ans": "A", "en": "(A) Correct. Capitalization rate = (WACC – Long-term growth rate) = 11.0% – 5.0% = 6.0%.\n(B) Incorrect. It is the equity risk premium plus small stock risk-premium = 6.0% + 2.5% = 8.5%.\n(C) Incorrect. It is the same as RRBL’s estimate of WACC, which is 11.0%.", "ko": "FCFF 기반 CCM의 자본화율 = WACC − 장기성장률 = 11% − 5% = 6%.", "trap": "노트: Capitalization rate = WACC − g (FCFE면 r − g).", "f": "Cap rate = WACC − g", "why": {"B": "8.5%는 ERP + 소형주 프리미엄입니다.", "C": "11%는 WACC 자체입니다."}, "orig": "ECO Module 6 Q30"}, {"id": "ECO-M6-Q38", "src": "ECO 오답", "module": 6, "tag": "비상장사 평가 목적 분류", "vig": null, "stem": "A private company valuation conducted for tax reporting purposes is best classified as which type of valuation?", "opts": {"A": "Litigation-related", "B": "Transaction-related", "C": "Compliance-related"}, "ans": "C", "en": "(A) Incorrect because litigation valuations are used for legal proceedings requiring valuations and include those related to damages, lost profits, shareholder disputes, and divorce.\n(B) Incorrect because transaction-related valuations encompass events affecting the ownership or financing of a business. Compliance-related valuations support actions required by law or regulation and include financial reporting and tax reporting. For example, activities such as corporate restructurings, transfer pricing, and property tax matters may require valuations.\n(C) Correct because compliance-related valuations support actions required by law or regulation and include financial reporting and tax reporting. Tax-related reasons for private company valuations include corporate and individual tax reporting. For example, activities such as corporate restructurings, transfer pricing, and property tax matters may require valuations.", "ko": "세무 보고 목적 평가 = compliance-related(법·규정 준수: 재무보고·세무).", "trap": "노트 표 그대로.", "f": "", "why": {"A": "Litigation은 손해배상·주주분쟁·이혼 등 법적 분쟁용.", "B": "Transaction은 M&A·구조조정·자금조달 등 소유권·자금 관련 거래."}, "orig": "ECO Module 6 Q38"}, {"id": "ECO-M6-Q39", "src": "ECO 오답", "module": 6, "tag": "PE 유형 – LBO", "vig": null, "stem": "A fund manager plans to take a majority stake in a private company with the goal of exiting at a higher valuation after improving the efficiency of the company's business practices. The fund is most likely a:", "opts": {"A": "growth equity fund.", "B": "venture capital fund.", "C": "leveraged buy-out fund."}, "ans": "C", "en": "(A) Incorrect because although growth equity funds target companies with potential for scalability, they usually take a minority stake
