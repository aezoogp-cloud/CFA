0 – 2,249 = $9,751 million.\nValue per share = Equity value/Number of shares\n= 9,751 million/411 million\n= 23.7251 = $23.73 per share\n(C) Incorrect. It does not deduct the market value of debt: $12 million/411 million shares = $29.20.", "ko": "Firm = FCFF1/(WACC − g) = 600/(0.09 − 0.04) = $12,000M. Equity = 12,000 − 2,249 = $9,751M. Per share = 9,751/411 = $23.73.", "trap": "FCFF ↔ WACC, 그다음 부채 차감. 2013 FCFF(600)는 이미 FCFF1.", "f": "Equity = FCFF1/(WACC − g) − Debt", "why": {"A": "$12.78은 FCFF를 자기자본비용(12%)으로 할인한 오류입니다.", "C": "$29.20은 부채를 차감하지 않은 값입니다."}, "orig": "ECO Module 3 Q66"}, {"id": "ECO-M3-Q67", "src": "ECO 오답", "module": 3, "tag": "FCFE 예측 (목표부채비율 방식)", "vig": 20, "stem": "Using Yee’s alternative valuation assumptions and the FCFE valuation approach, the year-end 2012 value per share of McLaughlin’s common stock is closest to:", "opts": {"A": "$18.00.", "B": "$22.80.", "C": "$24.17."}, "ans": "B", "en": "(A) Incorrect. It uses FCFF: (1.80 – 0.54 – 0.18)/(0.12 – 0.06) = 18.00\n(B) Correct. First, it is necessary to estimate FCFE2013.\nFCFE = Net income – (1 – DR) × (FCInv – Depreciation) – (1 – DR) × (WCInv)\nwhere\nDR = debt ratio, which is 40%\nFCInv = investment in fixed capital, which is 30% of EPS\nWCInv = investment in working capital, which is 10% of EPS\nOn a per-share basis:\nFCFE1 (2013) = 1.80 – (1 – 0.40) × (0.30 ×1.80) – (1 – 0.40) × (0.10 ×1.80)\n= 1.80 – 0.324 – 0.108\n= 1.368.\nFCFE will grow at the same rate as net income, 6% annually.\nEquity value\n=\nFCFE\n1\nr\n−\ng\n=\n1.368\n0.12\n−\n0.06\n=\n$\n22.80\nThe value per share is $22.80.\n(C) Incorrect. It uses FCFE1 × (1 + g) = 1.368 × (1.06)/(0.12 – 0.06) = 24.17.", "ko": "FCFE1 = EPS − (1 − DR)(FCInv − Dep) − (1 − DR)WCInv = 1.80 − 0.6×(0.30×1.80) − 0.6×(0.10×1.80) = 1.368. V = 1.368/(0.12 − 0.06) = $22.80.", "trap": "순투자 중 DR만큼은 부채로 조달 → 주주 부담은 (1 − DR)만큼.", "f": "FCFE = NI − (1 − DR)(FCInv − Dep) − (1 − DR)WCInv", "why": {"A": "$18.00은 투자액 전부를 차감(부채조달분 무시)한 값입니다.", "C": "$24.17은 이미 2013년(=1기) 값인 FCFE1에 (1+g)를 또 곱한 오류입니다."}, "orig": "ECO Module 3 Q67"}, {"id": "ECO-M3-Q69", "src": "ECO 오답", "module": 3, "tag": "FCF vs DDM, FCFF vs FCFE 선택", "vig": 20, "stem": "Which of Nicosia’s three statements pertaining to McLaughlin’s valuation is the most accurate? Statement:", "opts": {"A": "1", "B": "2", "C": "3"}, "ans": "A", "en": "(A) Correct. Nicosia’s first statement is correct. Analysts should use a FCFE valuation whenever dividends differ significantly from the company’s capacity to pay dividends or when a change of control is anticipated. A FCFF valuation is preferred over a FCFE valuation whenever the capital structure is unstable or ever-changing. So, Nicosia’s first statement is correct, and her second and third statements are incorrect.\n(B) Incorrect. Analysts should use free cash flow to equity valuation whenever dividends differ significantly from the company’s capacity to pay dividends. FCFF valuation is preferred over FCFE valuation whenever the capital structure is unstable or ever-changing.\n(C) Incorrect. With control comes discretion over the uses of free cash flow, as does the capacity to change dividend levels. As such, a free cash flow valuation approach is likely to be superior to a discounted dividend valuation approach.", "ko": "Statement 1 정확: 배당이 FCFE(배당 지급 능력)와 크게 다르면 FCF 접근이 DDM보다 우월합니다.", "trap": "불안정 자본구조 → FCFF / 배당 ≠ 지급능력 or 지배 관점 → FCF.", "f": "", "why": {"B": "Statement 2 오류: 자본구조가 불안정하면 FCFF가 FCFE보다 우월합니다.", "C": "Statement 3 오류: 지배권 변경 시에는 FCF 접근이 우월합니다(배당 결정권 확보)."}, "orig": "ECO Module 3 Q69"}, {"id": "ECO-M3-Q74", "src": "ECO 오답", "module": 3, "tag": "FCFF 계산 – NWC 감소는 현금 원천", "vig": null, "stem": "An analyst gathers the following information (in $ millions) from a company's financial statements:\n\tYear 1\tYear 2\nNet income\t300\t330\nInterest expense\t40\t44\nNet working capital\t500\t300\nGross fixed assets\t6,000\t6,800\nDepreciation expense\t300\t400\nLong-term debt\t5,000\t5,700\nIf the corporate tax rate is 25%, what is the company's FCFF (in $ millions) in Year 2?", "opts": {"A": "–$237", "B": "$163", "C": "$174"}, "ans": "B", "en": "(A) Incorrect because it treats the decrease in net working capital as a use of cash rather than a source of cash as follows:\nFCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv. FCFF = $330 + 400 + 44 × (1 – 25%) – $800 – $200 = $330 + $400 + $33 – $800 – $200 = –$237.\n(B) Correct because FCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv. Also, the adjustment for net increases in working capital represents the net investment in current assets (such as accounts receivable) less current liabilities (such as accounts payable).\nWCInv = change in NWC = 300 – 500 = –$200.\nFCInv = change in gross fixed assets = $6,800 – $6,000 = $800.\nFCFF = $330 + 400 + 44 × (1 – 25%) – $800 – (–$200) = $330 + $400 + $33 – $800 + $200 = $163.\n(C) Incorrect because it adds back total interest expense rather than tax adjusted interest expense in the calculation as follows: FCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv\nFCFF = $330 + 400 + 44 – $800 – (–$200) = $330 + $400 + $44 – $800 + $200 = $163.", "ko": "FCInv = 6,800 − 6,000 = 800. WCInv = 300 − 500 = −200. FCFF = 330 + 400 + 44×0.75 − 800 − (−200) = $163M.", "trap": "WCInv 음수 → 차감하면 결국 더해짐. 이자는 세후.", "f": "FCFF = NI + NCC + Int(1 − t) − FCInv − WCInv", "why": {"A": "−$237M은 NWC 감소(−200)를 현금 '사용'으로 처리한 오류입니다. NWC 감소는 현금 원천 → 가산.", "C": "$174M은 세후가 아니라 세전 이자(44)를 더한 값입니다."}, "orig": "ECO Module 3 Q74"}, {"id": "ECO-M3-Q77", "src": "ECO 오답", "module": 3, "tag": "CFO → FCFF (US GAAP)", "vig": null, "stem": "For a company that reports under US GAAP, an analyst estimates its FCFF by adding back pretax interest expense to cash flow from operating activities and subtracting investment in fixed capital. Is the analyst correct?", "opts": {"A": "Yes", "B": "No, the analyst should add investment in fixed capital", "C": "No, the analyst should add back after-tax interest expense"}, "ans": "C", "en": "(A) Incorrect because the analyst should add back after-tax interest expense instead of pretax interest expense. The after-tax interest expense is added back because it was previously taken out of net income but must be included in FCFF because it is a component of the total cash flows available to all suppliers of the firm’s capital.\n(B) Incorrect because investment in fixed capital should be subtracted. Free cash flow to the firm = Cash flow from operations Plus: Interest expense × (1 − Tax rate) Less: Investment in fixed capital.\n(C) Correct because the analyst should calculate the FCFF by adding back after-tax interest expense to cash flow from operations and subtracting investment in fixed capital. The after-tax interest expense is added back because it was previously taken out of net income but must be included in FCFF because it is a component of the total cash flows available to all suppliers of the firm’s capital.", "ko": "FCFF = CFO + Int(1 − t) − FCInv. 이자는 세후로 가산해야 합니다(US GAAP는 이자지급을 영업활동으로 분류).", "trap": "CFO에서 시작하면 NCC·WCInv는 이미 반영 → 세후이자 가산·FCInv 차감만.", "f": "FCFF = CFO + Int(1 − t) − FCInv", "why": {"A": "세전 이자가 아니라 세후 이자를 더해야 하므로 'Yes'가 아닙니다.", "B": "고정자본투자는 '차감'이 맞습니다."}, "orig": "ECO Module 3 Q77"}, {"id": "ECO-M3-Q81", "src": "ECO 오답", "module": 3, "tag": "인수 대상 평가 – FCF 사용", "vig": null, "stem": "An analyst is evaluating a company for a potential takeover. Which of the following measures is most suitable for this valuation?", "opts": {"A": "FCFE", "B": "Dividends", "C": "Cash flow from operations"}, "ans": "A", "en": "(A) Correct because dividends are the cash flow actually going to shareholders whereas free cash flow to equity (FCFE) is the cash flow available to be distributed to shareholders without impairing the company’s value. If a company is being analyzed because it is a target for takeover, free cash flow is the appropriate cash flow measure; once the company is taken over, the new owners will have discretion over how free cash flow is used including its distribution in the form of dividends. The advantage of FCFF and FCFE over other cash-flow concepts is that they can be used directly in a DCF framework to value the firm or to value equity.\n(B) Incorrect because dividends are the cash flow actually going to shareholders whereas free cash flow to equity is the cash flow available to be distributed to shareholders without impairing the company’s value. If a company is being analyzed because it is a target for takeover, free cash flow, not dividends, is the appropriate cash flow measure.\n(C) Incorrect because if a company is being analyzed because it is a target for takeover, free cash flow, not cash flow from operations (CFO), is the appropriate cash flow measure. Although a company reports CFO on the statement of cash flows, CFO is not free cash flow.", "ko": "인수 대상이면 새 주인이 FCF 사용(배당 포함)을 결정할 재량을 가지므로 free cash flow(FCFE)가 적절합니다. 배당은 실제 지급액일 뿐이고, CFO는 FCF가 아닙니다.", "trap": "", "f": "", "why": {"B": "배당은 지배권 이전 후 바뀔 수 있어 인수 평가에 부적합합니다.", "C": "CFO는 자본지출을 반영하지 않아 free cash flow가 아닙니다."}, "orig": "ECO Module 3 Q81"}, {"id": "ECO-M3-Q87", "src": "ECO 오답", "module": 3, "tag": "Sensitivity analysis – range 비교", "vig": null, "stem": "An analyst reviews the following information:\n\tLow Estimate\tHigh Estimate\tValuation with Low Estimate\tValuation with High Estimate\nCost of debt\t8.2%\t10.3%\t$540 million\t$240 million\nCost of equity\t10.0%\t12.5%\t$370 million\t$230 million\nManufacturing costs (% of revenue)\t20.3%\t24.8%\t$410 million\t$300 million\nBased on this information, the company's value is most sensitive to changes in the:", "opts": {"A": "cost of debt.", "B": "cost of equity.", "C": "manufacturing costs."}, "ans": "A", "en": "(A) Correct because to examine how sensitive the final valuation is to changes in each of a valuation model’s input variables, a sensitivity analysis can be performed.\nRange = Valuation with Low Estimate minus Valuation with High Estimate\nRange for cost of debt = $540 million − $240 million = $300 million\nRange for cost of equity = $370 million − $230 million = $140 million\nRange for manufacturing costs = $410 million − $300 million = $110 million\nThe valuation is most sensitive to the cost of debt because its range of estimated values is larger than the ranges for the cost of equity and for manufacturing costs.\n(B) Incorrect because to examine how sensitive the final valuation is to changes in each of a valuation model’s input variables, a sensitivity analysis can be performed.\nRange = Valuation with Low Estimate minus Valuation with High Estimate\nRange for cost of debt = $540 million − $240 million = $300 million\nRange for cost of equity = $370 million − $230 million = $140 million\nRange for manufacturing costs = $410 million − $300 million = $110 million\nThe valuation is not most sensitive to the cost of equity because the range for the cost of debt is greater, which means it is more sensitive to the cost of debt.\n(C) Incorrect because to examine how sensitive the final valuation is to changes in each of a valuation model’s input variables, a sensitivity analysis can be performed.\nRange = Valuation with Low Estimate minus Valuation with High Estimate\nRange for cost of debt = $540 million − $240 million = $300 million\nRange for cost of equity = $370 million − $230 million = $140 million\nRange for manufacturing costs = $410 million − $300 million = $110 million\nThe valuation is not most sensitive to manufacturing costs because the range for the cost of debt is greater, which means it is more sensitive to the cost of debt.", "ko": "Range = 저추정치 가치 − 고추정치 가치: 부채비용 540 − 240 = 300, 자기자본비용 140, 제조원가 110 → 부채비용에 가장 민감.", "trap": "입력 % 변화폭(2.1%p vs 2.5%p vs 4.5%p)이 아니라 '가치'의 range로 비교.", "f": "Range = V(low) − V(high)", "why": {"B": "자기자본비용 range(140)는 부채비용 range(300)보다 작습니다.", "C": "제조원가 range(110)가 가장 작습니다."}, "orig": "ECO Module 3 Q87"}, {"id": "ECO-M3-Q35", "src": "ECO 관련유형", "module": 3, "tag": "배당·자사주 vs 레버리지의 FCF 영향", "vig": 15, "stem": "Which of Ho’s statements regarding free cash flow is (are) correct?", "opts": {"A": "Statement 1 only", "B": "Statement 2 only", "C": "Neither Statement 1 nor Statement 2"}, "ans": "C", "en": "C is correct. Transactions between the company and its shareholders (through cash dividends, share repurchases, and share issuances) do not affect free cash flow. However, leverage changes, such as the use of more debt financing, have some impact on free cash flow because they increase the interest tax shield (reduce corporate taxes because of the tax deductibility of interest) and reduce the cash flow available to equity.", "ko": "둘 다 틀림. Statement 1: 레버리지 변화는 이자 절세효과와 주주 가용현금 감소를 통해 FCFE에 '영향을 줍니다'. Statement 2: 배당·자사주매입 등 주주와의 거래는 FCF에 영향을 주지 '않습니다'.", "trap": "M3 Q56 오답과 같은 개념.", "f": "", "why": {"A": "Statement 1(레버리지 무영향)은 틀렸습니다.", "B": "Statement 2(배당·자사주가 FCF에 영향)는 틀렸습니다."}, "orig": "ECO Module 3 Q35"}, {"id": "ECO-M3-Q57", "src": "ECO 관련유형", "module": 3, "tag": "FCFF 선택 근거 – 자본구조 변화", "vig": 17, "stem": "Which of the following reasons best supports Nilsen's decision to use the FCFF model?", "opts": {"A": "Reason 1", "B": "Reason 2", "C": "Reason 3"}, "ans": "C", "en": "(A) Incorrect because FCFE is the simpler and more direct model than FCFF. Using FCFE to value equity is more direct and simpler than using FCFF. The value of equity can be estimated directly by discounting FCFE at the required rate of return for equity.\n(B) Incorrect because when the target debt/equity ratio is expected to remain consistent for the foreseeable future, the capital structure is also likely to remain consistent or relatively stable. The FCFE model is simpler and more direct than the FCFF model in these circumstances. If the company’s capital structure is relatively stable, using FCFE to value equity is more direct and simpler than using FCFF.\n(C) Correct because FCFF is particularly appropriate for companies with changing capital structures. FCFF better reflects the fundamental changes in free cash flow and is unaffected by the fluctuating levels of borrowing costs that would be associated with a series of new preferred share issues. Note that preferred shares are viewed as a type of borrowing. The FCFF model is often chosen for a levered company with a changing capital structure.", "ko": "향후 5년간 우선주 연속 발행 → 자본구조 변화 → FCFF가 적합. FCFE는 자본구조가 안정적일 때 더 단순·직접적.", "trap": "", "f": "", "why": {"A": "더 단순·직접적인 것은 FCFE입니다.", "B": "목표 부채비율이 일정하면 오히려 FCFE가 더 적합합니다."}, "orig": "ECO Module 3 Q57"}, {"id": "ECO-M3-Q83", "src": "ECO 관련유형", "module": 3, "tag": "EBITDA가 FCFF의 나쁜 대용치인 이유", "vig": null, "stem": "Which of the following factors causes EBITDA to be a poor proxy for FCFF? Not accounting for:", "opts": {"A": "after-tax interest cost", "B": "depreciation tax shield", "C": "cash flow from new borrowings"}, "ans": "B", "en": "(A) Incorrect because this explains it being a poor proxy for FCFE, but the question asks for FCFF instead of FCFE. EBITDA is a poor proxy for free cash flow to the firm because it does not account for the depreciation tax shield and the investment in fixed capital and working capital, but EBITDA is an even poorer proxy for free cash flow to equity. From a stockholder’s perspective, additional defects of EBITDA include its failure to account for the after-tax interest costs or cash flows from new borrowing or debt repayments.\n(B) Correct because EBITDA is a poor proxy for free cash flow to the firm because it does not account for the depreciation tax shield and the investment in fixed capital and working capital.\n(C) Incorrect because this explains it being a poor proxy for FCFE, but the question asks for FCFF instead of FCFE. EBITDA is a poor proxy for free cash flow to the firm because it does not account for the depreciation tax shield and the investment in fixed capital and working capital, but EBITDA is an even poorer proxy for free cash flow to equity. From a stockholder’s perspective, additional defects of EBITDA include its failure to account for the after-tax interest costs or cash flows from new borrowing or debt repayments.", "ko": "EBITDA는 감가상각 절세효과(Dep × t)와 고정·운전자본 투자를 반영하지 못해 FCFF의 나쁜 대용치입니다. 세후이자·신규차입은 FCFE 관점의 추가 결함.", "trap": "FCFF = EBITDA(1 − t) + Dep × t − FCInv − WCInv.", "f": "FCFF = EBITDA(1 − t) + Dep·t − FCInv − WCInv", "why": {"A": "세후 이자비용 미반영은 FCFE 대용으로서의 결함입니다(FCFF는 이자 전).", "C": "신규 차입 미반영도 FCFE 관점의 결함입니다."}, "orig": "ECO Module 3 Q83"}, {"id": "ECO-M3-Q88", "src": "ECO 관련유형", "module": 3, "tag": "FCFE에 영향을 주는 행동 – 레버리지", "vig": null, "stem": "Which of the following actions affects a company's FCFE?", "opts": {"A": "Increasing leverage", "B": "Issuing shares of common stock", "C": "Paying cash dividends on common stock"}, "ans": "A", "en": "(A) Correct because an increase in leverage affects FCFE in two ways. In the year the debt is issued, it increases the FCFE by the amount of debt issued. After the debt is issued, FCFE is then reduced by the after-tax interest expense.\n(B) Incorrect because issuing shares of common stock does not affect FCFF or FCFE since these measures are the amounts of cash available to all investors or to common stockholders.\n(C) Incorrect because paying cash dividends on common stock does not affect FCFF or FCFE, which are the amounts of cash available to all investors or to common stockholders.", "ko": "레버리지 증가는 발행 연도에 차입액만큼 FCFE를 늘리고, 이후 세후 이자만큼 FCFE를 줄입니다. 신주발행·현금배당은 FCFE에 영향 없음.", "trap": "노트 정리와 동일.", "f": "", "why": {"B": "신주발행은 FCFF·FCFE에 영향 없음.", "C": "현금배당은 FCFE의 사용처일 뿐 영향 없음."}, "orig": "ECO Module 3 Q88"}, {"id": "SCH-R19-24", "module": 3, "tag": "FCFE 계산 – 설비 처분이익", "stem": "Imagine that we are provided the following information for a firm:\nNet income = $50.\nWorking capital investment = $4.\nBeginning gross fixed assets = $90; ending gross fixed assets = $136.\nBeginning accumulated depreciation = $30; ending accumulated depreciation = $40.\nDepreciation expense = $27.\nNet borrowing = $0.\nIn addition, a piece of equipment with an original book value of $19 was sold for $10. The equipment had a book value at the time of the sale of $2. The gain was classified as unusual. Free cash flow to equity is closest to:", "opts": {"A": "$6.", "B": "$10.", "C": "$18."}, "ans": "B", "en": "NI = 50; depreciation = 27; ending net PP&E = 136 − 40 = 96; beginning net PP&E = 90 − 30 = 60; gain on sale = 10 − 2 = 8. Capital expenditure = 96 − 60 + 27 + 2 = 65; FCInv = 65 − 10 (proceeds) = 55. FCFE = 50 + 27 − 8 − 55 − 4 + 0 = $10.", "ko": "처분이익 8(비현금)은 차감. FCInv = 순PP&E 증가 36 + 감가상각 27 + 처분자산 장부가 2 − 처분대금 10 = 55. FCFE = 50 + 27 − 8 − 55 − 4 = $10.", "why": {"A": "처분대금(10)을 FCInv에서 빼지 않는 등 투자액을 과대 계상한 값입니다.", "C": "처분이익(8)을 순이익에서 차감하지 않은 값입니다."}, "trap": "비현금 이익(처분이익) 차감, 처분대금은 FCInv를 줄임. ECO M3 Q62와 연결.", "f": "FCFE = NI + NCC − FCInv − WCInv + Net borrowing", "orig": "Schweser MQ 19.2/19.3 Q4", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R19-41", "module": 3, "tag": "CFO → FCFF", "stem": "The adjustments to cash flow from operations necessary to obtain free cash flow to the firm (FCFF) are:", "opts": {"A": "add noncash charges, subtract fixed capital investment, and subtract working capital investment.", "B": "add after-tax interest expense and subtract fixed capital investment.", "C": "add net borrowing and subtract fixed capital investment."}, "ans": "B", "en": "Free cash flow to the firm is equal to cash flow from operations plus after-tax interest expense [interest(1 − tax rate)] minus fixed capital investment.", "ko": "FCFF = CFO + Int(1 − t) − FCInv. CFO에는 이미 비현금 항목·운전자본 변화가 반영.", "why": {"A": "NCC·WCInv 조정은 순이익(NI)에서 출발할 때 필요합니다.", "C": "Net borrowing 가산은 FCFE입니다."}, "trap": "ECO M3 Q77 오답과 같은 공식.", "f": "FCFF = CFO + Int(1 − t) − FCInv", "orig": "Schweser MQ 19.4 Q1", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R19-51", "module": 3, "tag": "FCFE 예측 (목표 부채비율) → 주식가치", "stem": "The Gray Furniture Co. earned £3.50 per share last year. Investment in fixed capital was £2.00 per share, depreciation was £1.60, and the investment in working capital was £0.50 per share. Gray is currently operating at its target debt-to-asset ratio of 40%. Thus, 40% of annual investments in working capital and fixed capital will be financed with new borrowings. Shareholders require a return of 14% on their investment, and the expected growth rate is 4%. The value of Gray’s stock is closest to:", "opts": {"A": "£27.04.", "B": "£29.90.", "C": "£30.78."}, "ans": "C", "en": "FCFE0 = 3.50 − (1 − 0.40)(2.00 − 1.60) − (1 − 0.40)(0.50) = 3.50 − 0.24 − 0.30 = 2.96. V0 = 2.96 × 1.04/(0.14 − 0.04) = £30.78.", "ko": "FCFE0 = 3.50 − 0.6 × 0.40 − 0.6 × 0.50 = 2.96 → 'last year' 값이므로 × 1.04 → V0 = 3.0784/0.10 = £30.78.", "why": {"A": "FCFE0 계산(부채조달분 40% 반영) 또는 할인을 잘못한 값입니다. 정확한 FCFE0 = 2.96.", "B": "FCFE0(2.96)를 1.04로 성장시키고 (r − g) = 10%로 나누는 절차가 빠진 오답입니다(정답 30.78)."}, "trap": "ECO M3 Q67과 반대: 여기는 '작년' 값 → 성장시켜야 함.", "f": "FCFE = EPS − (1 − DR)(FCInv − Dep) − (1 − DR)WCInv", "orig": "Schweser MQ 19.5 Q1", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R19-510", "module": 3, "tag": "EBITDA → FCFF", "stem": "Which of the following is the best estimate of the cash flows available to the firm’s investors before any financing decisions?", "opts": {"A": "EBITDA × (1 - tax rate).", "B": "EBITDA × (1 - tax rate) + (Dep × tax rate) - FCInv - WCInv.", "C": "EBITDA × (1 - tax rate) + (Dep × tax rate) - FCInv - WCInv + Int × (1 - tax rate)."}, "ans": "B", "en": "FCFF is the estimate of the cash flows available to the firm’s investors before any financing decisions. FCFF = [EBITDA × (1 – tax rate)] + (Dep × tax rate) – FCInv – WCInv.", "ko": "FCFF = EBITDA(1 − t) + Dep × t − FCInv − WCInv. EBITDA는 이자 전이므로 이자를 더할 필요 없음.", "why": {"A": "감가상각 절세효과와 투자를 반영하지 않습니다.", "C": "EBITDA는 이미 이자 '전' 수치 → 이자 가산은 이중계산."}, "trap": "출발점별 FCFF: NI(+NCC+Int(1−t)−FCInv−WCInv), CFO(+Int(1−t)−FCInv), EBIT(1−t)(+Dep−FCInv−WCInv), EBITDA(1−t)(+Dep·t−FCInv−WCInv).", "f": "FCFF = EBITDA(1 − t) + Dep·t − FCInv − WCInv", "orig": "Schweser MQ 19.5 Q10", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R19-514", "module": 3, "tag": "할인율 불일치의 효과", "stem": "Suppose an analyst estimates equity value by discounting free cash flow to equity (FCFE) at the weighted average cost of capital (WACC) in the FCFE model and estimates firm and equity value by discounting free cash flow to the firm (FCFF) at the required return on equity in the FCFF model. The analyst would most likely:", "opts": {"A": "overestimate equity value with the FCFE model and underestimate firm value and equity value with the FCFF model.", "B": "underestimate equity value with the FCFE model and overestimate firm value and equity value with the FCFF model.", "C": "underestimate equity value with the FCFE model and underestimate firm value and equity value with the FCFF model."}, "ans": "A", "en": "WACC is less than required return on equity. Incorrectly using the WACC (which is too low) in the FCFE model will overestimate equity value. Incorrectly using required return on equity (which is too high) in the FCFF model will underestimate firm value and equity value.", "ko": "WACC < r_e. FCFE를 WACC(너무 낮음)로 할인 → 과대평가. FCFF를 r_e(너무 높음)로 할인 → 과소평가.", "why": {"B": "방향이 반대입니다.", "C": "FCFE를 낮은 할인율로 할인하면 '과대'평가됩니다."}, "trap": "ECO M3 Q63·Q66, M6 Q27 오답의 공통 함정.", "f": "FCFE ↔ r_e, FCFF ↔ WACC", "orig": "Schweser MQ 19.5 Q14", "src": "Schweser MQ", "vig": null}, {"id": "VAR-R19-01", "module": 3, "tag": "Net borrowing = 단기차입 + 장기부채 증가", "stem": "A company reports net income of $400 million, depreciation of $150 million, fixed capital investment of $300 million, and working capital investment of $40 million. During the year, notes payable increased from $200 million to $230 million and long-term debt increased from $1,000 million to $1,050 million. FCFE (in $ millions) is closest to:", "opts": {"A": "$210.", "B": "$260.", "C": "$290."}, "ans": "C", "en": "Net borrowing = increase in notes payable (30) + increase in long-term debt (50) = 80. FCFE = 400 + 150 − 300 − 40 + 80 = $290 million.", "ko": "Net borrowing = notes payable 증가 30 + 장기부채 증가 50 = 80. FCFE = 400 + 150 − 300 − 40 + 80 = $290M. (노트의 'LTD만'이면 260으로 틀림)", "why": {"A": "$210은 net borrowing을 아예 빼먹은 값입니다.", "B": "$260은 장기부채 증가(50)만 넣고 notes payable 증가(30)를 뺀 값입니다. 단기차입금도 net borrowing입니다."}, "trap": "Notes payable(단기차입)은 WCInv에서 제외하고 net borrowing에 포함. (Holt, ECO M3 Q26)", "f": "FCFE = NI + NCC − FCInv − WCInv + (ΔNotes payable + ΔLTD)", "orig": "변형 (오답노트 수정 포인트 + ECO M3 Q26, Schweser R19)", "src": "변형", "vig": null}, {"id": "ECO-M4-Q10", "src": "ECO 오답", "module": 4, "tag": "P/E 선택 – 대형 인수 → Forward P/E", "vig": 21, "stem": "Based on the information in Exhibit 1, the mostappropriate price-to-earnings ratio to use in the valuation of Delite is closest to:", "opts": {"A": "18.71.", "B": "19.04.", "C": "24.44."}, "ans": "A", "en": "A is correct. The forward P/E should be used given the recent significant acquisition of the water bottling company. Since a major change such as an acquisition or divestiture can affect results, the forward P/E, also known as the leading P/E or prospective P/E, is the most appropriate P/E to use for Delite. Earnings estimates for 2021 should incorporate the performance of the water bottling company. The forward P/E is calculated as the current price divided by the projected earnings per share, or $65.50/$3.50 = 18.71.", "ko": "Delite는 대형 인수(생수 회사)로 향후 실적이 크게 바뀜 → 인수 효과를 반영하는 forward(leading) P/E 사용: $65.50/$3.50 = 18.71.", "trap": "노트: 대형 M&A·구조변화 → forward P/E / 경기순환 → normalized EPS.", "f": "Forward P/E = P0/E1", "why": {"B": "19.04 = 65.50/3.44는 trailing P/E입니다. 인수 효과가 반영되지 않은 과거 이익입니다.", "C": "24.44는 가격을 FCF/주(2.68)로 나눈 P/FCF입니다."}, "orig": "ECO Module 4 Q10"}, {"id": "ECO-M4-Q11", "src": "ECO 오답", "module": 4, "tag": "P/S 계산 – 주당 매출", "vig": 21, "stem": "Based on the information in Exhibit 1, the price-to-sales ratio for You Fix It is closest to:", "opts": {"A": "0.28.", "B": "0.55.", "C": "0.90."}, "ans": "C", "en": "C is correct. The price-to-sales ratio is calculated as price per share divided by annual net sales per share.\nPrice per share = $37.23.\nAnnual net sales per share = $67.44 billion/1.638821 billion shares = $41.15.\nPrice-to-sales ratio (P/S) = $37.23/$41.15 = 0.90.", "ko": "주당 매출 = $67.44B/1.638821B주 = $41.15. P/S = 37.23/41.15 = 0.90.", "trap": "회사별 데이터(매출·주식 수)를 정확히 매칭.", "f": "P/S = Price / (Sales / Shares)", "why": {"A": "0.28 = BVPS 11.64/주당매출 41.15 — 가격 대신 장부가를 분자에 넣은 오류입니다.", "B": "0.55 = 37.23/67.44 — 총매출(십억 달러)을 주당매출처럼 나눈 오류입니다. 주식 수로 나눠 주당매출을 먼저 구해야 합니다."}, "orig": "ECO Module 4 Q11"}, {"id": "ECO-M4-Q13", "src": "ECO 오답", "module": 4, "tag": "P/E vs P/S – 재무레버리지 반영", "vig": 21, "stem": "Cannan’s preference to use the P/E over the P/S is best supported by:", "opts": {"A": "Reason 1.", "B": "Reason 2.", "C": "Reason 3."}, "ans": "C", "en": "C is correct. The price to sales ratio (P/S) fails to consider differences in cost structures. Also, while share price reflects the effect of debt financing on profitability and risk, sales is a pre-financing income measure and does not incorporate the impact of debt in the firm’s capital structure. Earnings reflect operating and financial leverage, and thus the price-to-earnings ratio (P/E) incorporates the impact of debt in the firm’s capital structure.", "ko": "Reason 3이 맞습니다: 주가는 부채조달의 효과(수익성·위험)를 반영하는데, 매출은 금융비용 이전 지표라 자본구조를 반영하지 못합니다. 이익은 영업·재무 레버리지를 반영 → P/E가 일관됨.", "trap": "P/S 장점: 매출은 음수 불가·안정적·조작 어려움. 단점: 비용구조·레버리지 미반영.", "f": "", "why": {"A": "매출은 이익보다 '더' 안정적입니다(이익이 아니라 매출이 P/S의 장점).", "B": "매출이 이익보다 조작이 '덜' 쉬운 편입니다. P/S의 장점이지 P/E 선호 이유가 아닙니다."}, "orig": "ECO Module 4 Q13"}, {"id": "ECO-M4-Q14", "src": "ECO 오답", "module": 4, "tag": "P/CF – 이자차감후 + 운전자본·비현금수익 반영 = FCFE", "vig": 21, "stem": "The cash flow measure that Ritter would most likely recommend to address Cannan’s concern is:", "opts": {"A": "free cash flow to equity.", "B": "earnings plus noncash charges.", "C": "earnings before interest, tax, depreciation, and amortization."}, "ans": "A", "en": "A is correct. Free cash flow to equity (FCFE) is defined as cash flow available to shareholders after deducting all operating expenses, interest and debt payments, and investments in working and fixed capital. Cannan’s requirement that the cash flows include interest expense, working capital, and noncash revenue is satisfied by FCFE.", "ko": "이자비용 차감 후(주가와 일관) + 운전자본·비현금수익 반영 → FCFE.", "trap": "노트 정리 그대로: '이자차감후 + 운전자본 반영' = FCFE.", "f": "", "why": {"B": "Earnings + noncash charges(CF)는 운전자본·비현금수익을 반영하지 못합니다.", "C": "EBITDA는 이자 '이전' 수치로 주가와 불일치하며 운전자본도 반영하지 않습니다."}, "orig": "ECO Module 4 Q14"}, {"id": "ECO-M4-Q15", "src": "ECO 오답", "module": 4, "tag": "PEG ratio – 적정가치 판정", "vig": 21, "stem": "Based on the information in Exhibits 1 and 2, Cannan would most likely conclude that Delite’s shares are:", "opts": {"A": "overvalued.", "B": "undervalued.", "C": "fairly valued."}, "ans": "C", "en": "C is correct. The P/E-to-growth (PEG) ratio is calculated by dividing a stock’s P/E by the expected earnings growth rate, expressed as a percentage. To calculate Delite’s PEG ratio, first calculate the P/E: $65.50/$3.50 = 18.71. In this case, the forward earnings should be used given the recent acquisition of the water bottling company. Next, calculate Delite’s PEG ratio: 18.71/12.41 = 1.51.\nComparing Delite’s PEG ratio of 1.51 with the PEG ratios of 1.74 (16.59/9.52) for Fresh Iced Tea and 1.31 (15.64/11.94) for Nonutter Soda and with the beverage sector average of 1.52 (16.40/10.80), it appears that Delite’s shares are fairly valued. This is determined by the fact that Delite’s PEG ratio is in the middle of the range of PEG ratios and very close to the sector average. Therefore, the shares appear to be fairly valued.", "ko": "Delite forward P/E = 18.71, PEG = 18.71/12.41 = 1.51. Fresh Iced Tea 1.74, Nonutter 1.31, 업종평균 1.52 → 범위 중간 & 업종평균과 거의 같음 → fairly valued.", "trap": "PEG의 P/E는 forward(인수 반영). 성장률은 % 숫자(12.41) 그대로.", "f": "PEG = (P/E) / g(%)", "why": {"A": "PEG 1.51은 업종평균(1.52)과 거의 같아 고평가 근거가 없습니다.", "B": "PEG가 동종 대비 낮지 않으므로 저평가 근거도 없습니다."}, "orig": "ECO Module 4 Q15"}, {"id": "ECO-M4-Q16", "src": "ECO 오답", "module": 4, "tag": "Harmonic mean – 큰 이상치만 완화", "vig": 21, "stem": "The measure of central tendency that Ritter will most likely recommend is the:", "opts": {"A": "median.", "B": "harmonic mean.", "C": "arithmetic mean."}, "ans": "B", "en": "B is correct. The harmonic mean is sometimes used to reduce the impact of large outliers—which are typically the major concern in using the arithmetic mean multiple—but not the impact of small outliers (i.e., those close to zero). The harmonic mean may aggravate the impact of small outliers, but such outliers are bounded by zero on the downside.", "ko": "조화평균은 큰 이상치(Tasty Root Beer 44.10 같은)의 영향은 줄이지만 0에 가까운 작은 이상치 영향은 줄이지 않습니다(작은 이상치는 하한 0으로 제한).", "trap": "노트 정리 그대로.", "f": "Harmonic mean = n / Σ(1/Xi)", "why": {"A": "중앙값은 큰·작은 이상치를 '모두' 완화합니다. 비대칭 요구를 충족하지 못합니다.", "C": "산술평균은 큰 이상치에 가장 취약합니다."}, "orig": "ECO Module 4 Q16"}, {"id": "ECO-M4-Q18", "src": "ECO 오답", "module": 4, "tag": "Justified forward P/E (Gordon)", "vig": 22, "stem": "Based on Exhibit 1 and Risso’s estimates of return and dividend growth, Centralino’s justified forward P/E based on the Gordon growth dividend discount model is closest to:", "opts": {"A": "5.4.", "B": "5.7.", "C": "8.3."}, "ans": "A", "en": "A is correct. The justified forward P/E is calculated as follows:\nP\n0\nE\n1\n=\nD\n1\n/\nE\n1\nr\n−\ng\n=\n(\n2.91\n/\n6.00\n)\n(\n0.15\n−\n0.06\n)\n=\n5.4.", "ko": "P0/E1 = (D1/E1)/(r − g) = (2.91/6.00)/(0.15 − 0.06) = 0.485/0.09 = 5.4.", "trap": "Forward P/E에는 '다음해' 배당성향 D1/E1(2020E) 사용.", "f": "P0/E1 = (D1/E1)/(r − g)", "why": {"B": "5.7 ≈ 5.4 × 1.06 — leading P/E에 (1+g)를 한 번 더 곱한 오류입니다(그건 trailing 공식).", "C": "8.3은 Exhibit 3의 동종사(Camporio) forward P/E입니다. Justified P/E는 회사 자체 펀더멘털(배당성향, r, g)로 계산."}, "orig": "ECO Module 4 Q18"}, {"id": "ECO-M4-Q19", "src": "ECO 오답", "module": 4, "tag": "P/B – 우선주 차감", "vig": 22, "stem": "Based on Exhibit 2, the price-to-book multiple for Centralino is closest to:", "opts": {"A": "2.0.", "B": "2.2.", "C": "2.5."}, "ans": "B", "en": "B is correct. Price to book is calculated as the current market price per share divided by book value per share. Book value per share is common shareholders’ equity divided by the number of common shares outstanding. Common shareholders’ equity is calculated as total shareholders’ equity minus the value of preferred stock.\nThus,\nCommon shareholders’ equity = €1,027 – €80 = €947 million.\nBook value per share = €947 million/41.94 million = €22.58.\nPrice-to-book ratio (P/B) for Centralino = €50/€22.58 = 2.2.", "ko": "보통주 자본 = 총자본 1,027 − 우선주 80 = 947. BVPS = 947/41.94 = €22.58. P/B = 50/22.58 = 2.2.", "trap": "P/B의 B = 보통주 장부가치(우선주 제외).", "f": "P/B = Price / [(Total equity − Preferred)/Shares]", "why": {"A": "2.0 ≈ 50/(1,027/41.94) — 우선주(80)를 차감하지 않은 오류입니다.", "C": "2.5 ≈ 50/(826/41.94) — 보통주 납입자본만 쓰고 이익잉여금(121)을 빠뜨린 오류입니다."}, "orig": "ECO Module 4 Q19"}, {"id": "ECO-M4-Q20", "src": "ECO 오답", "module": 4, "tag": "EV/Sales – EV 구성", "vig": 22, "stem": "Based on Exhibit 2, the multiple of enterprise value to sales for Centralino as of 31 December 2019 is closest to:", "opts": {"A": "0.67.", "B": "0.74.", "C": "0.77."}, "ans": "C", "en": "C is correct. Enterprise value (EV) is calculated as follows:\nEV = Market value of common equity + Market value of preferred stock + Market value of debt – Cash, cash equivalents, and short-term investments\n= (€50 × 41.94 million) + (€5.25 × 16.00 million) + €367 million – €102 million\n= €2,446 million (or €2.446 billion).\nSo, EV/sales = €2.446 billion/€3.182 billion = 0.77.", "ko": "EV = 보통주 시총(50×41.94M = 2,097) + 우선주 시총(5.25×16M = 84) + 부채 367 − 현금 102 = €2,446M. EV/Sales = 2,446/3,182 = 0.77.", "trap": "EV에는 우선주 '시장가치' 포함, 매입채무 등 영업부채는 제외, 현금·단기투자 차감.", "f": "EV = MV(common) + MV(preferred) + MV(debt) + Minority − Cash & ST investments", "why": {"A": "0.67은 EV 구성(보통주 + 우선주 + 부채 − 현금)을 잘못 적용한 값입니다. 정답 EV = 2,446.", "B": "0.74 = (2,097 + 367 − 102)/3,182 — 우선주 시장가치(84)를 빠뜨린 값입니다."}, "orig": "ECO Module 4 Q20"}, {"id": "ECO-M4-Q22", "src": "ECO 오답", "module": 4, "tag": "Normalized EPS – average ROE 방법", "vig": 22, "stem": "Based on Exhibits 1 and 2, the normalized earnings per share for Centralino as calculated by Risso should be closest to:", "opts": {"A": "€2.96.", "B": "€3.21.", "C": "€5.07."}, "ans": "A", "en": "A is correct. Based on the method of average ROE, normalized EPS are calculated as the average ROE from the most recent full business cycle multiplied by current book value per share. The most recent business cycle was 2016–2019, and the average ROE over that period was\n0.1301\n+\n0.1371\n+\n0.1158\n+\n0.1421\n4\n=\n0.131.\nThe book value of (common) equity, or simply book value, is the value of shareholders’ equity less any value attributable to the preferred stock: €1,027 million – €80 million = €947 million.\nCurrent book value per share (BVPS) is calculated as €947 million/41.94 million = €22.58.\nSo, normalized EPS is calculated as\nAverage ROE × BVPS = 0.131 × €22.58 = €2.96.", "ko": "2016–2019 평균 ROE = (13.01 + 13.71 + 11.58 + 14.21)/4 = 13.13%. 현재 BVPS = (1,027 − 80)/41.94 = €22.58. Normalized EPS = 0.131 × 22.58 = €2.96.", "trap": "Average ROE × '현재' BVPS(우선주 제외). 2020E는 제외(완성된 경기순환만).", "f": "Normalized EPS = Avg ROE (full cycle) × current BVPS", "why": {"B": "€3.21 ≈ 0.131 × (1,027/41.94) — BVPS에서 우선주를 차감하지 않은 오류입니다.", "C": "€5.07 = 2016–2019 EPS 평균 — historical average EPS 방법입니다. 문제는 average ROE 방법."}, "orig": "ECO Module 4 Q22"}, {"id": "ECO-M4-Q23", "src": "ECO 오답", "module": 4, "tag": "음수 이익 → E/P로 순위", "vig": 23, "stem": "Based on Pinho’s directive and the data from the last four quarters presented in Exhibit 1, the valuation metric that Silveira should use is the:", "opts": {"A": "price-to-earnings ratio (P/E).", "B": "production-to-demand ratio (P/D).", "C": "earnings-to-price ratio (E/P)."}, "ans": "C", "en": "C is correct. The E/P based on trailing earnings would offer the most meaningful ranking of the shares. Using E/P places Gesticular’s negative EPS in the numerator rather than the denominator, leading to a more meaningful ranking.", "ko": "Gesticular의 trailing EPS가 음수 → P/E가 무의미. E/P(earnings yield)는 이익을 분자에 두어 음수여도 의미 있는 순위를 매길 수 있습니다.", "trap": "노트: E/P = 순위 도구. 비경상·경기순환 왜곡은 normalized EPS가 해결.", "f": "E/P = 1/(P/E)", "why": {"A": "음수 EPS 때문에 P/E는 의미 있는 순위가 불가능합니다.", "B": "P/D(production-to-demand)는 커리큘럼의 가치평가 지표가 아닙니다."}, "orig": "ECO Module 4 Q23"}, {"id": "ECO-M4-Q24", "src": "ECO 오답", "module": 4, "tag": "Underlying EPS – 비경상 항목 조정 (diluted)", "vig": 23, "stem": "Based on Exhibit 1 and the note to Adesivo’s financial statements, the trailing P/E for Adesivo using underlying EPS is closest to:", "opts": {"A": "17.7.", "B": "18.2.", "C": "18.4."}, "ans": "C", "en": "C is correct. The EPS figure that Silveira should use is diluted trailing EPS of BRL0.81, adjusted as follows:\nSubtract the BRL0.04 nonrecurring legal gain.\nAdd BRL0.03 for the nonrecurring factory integration charge.\nNo adjustment needs to be made for the BRL0.01 charge related to depreciation because it is a recurring charge.\nTherefore, underlying trailing EPS = BRL0.81 – BRL0.04 + BRL0.03 = BRL0.80 and trailing P/E using underlying trailing EPS = BRL14.72/BRL0.80 = 18.4.", "ko": "희석 trailing EPS 0.81 − 비경상 이익 0.04 + 비경상 비용 0.03 = 0.80 (반복적 감가상각 0.01은 조정 안 함). P/E = 14.72/0.80 = 18.4.", "trap": "Underlying EPS: 비경상 이익 차감·비경상 비용 가산, 반복 항목은 그대로. 희석(diluted) EPS 기준.", "f": "Underlying EPS = Reported − nonrecurring gains + nonrecurring losses", "why": {"A": "17.7 = 14.72/0.83 — basic EPS(0.84)에서 조정한 값입니다. 희석(diluted) EPS 0.81을 써야 합니다.", "B": "18.2 = 14.72/0.81 — 비경상 항목을 조정하지 않은 희석 EPS 그대로입니다."}, "orig": "ECO Module 4 Q24"}, {"id": "ECO-M4-Q25", "src": "ECO 오답", "module": 4, "tag": "Forward PEG 비교", "vig": 23, "stem": "Based on Exhibit 1 and Exhibit 2, which company’s shares are the most attractively priced based on the five-year forward P/E-to-growth (PEG) ratio?", "opts": {"A": "Adesivo", "B": "Enviado", "C": "Gesticular"}, "ans": "A", "en": "A is correct. The forward PEG ratios for the three companies are calculated as follows:\nForward P/E = Stock’s current price/Forecasted EPS.\nForward PEG ratio = Forward P/E ÷ Expected earnings growth rate (in percentage terms).\nAdesivo forward P/E = BRL14.72/BRL0.91 = 16.18.\nAdesivo forward PEG ratio = 16.18/16.67 = 0.97.\nEnviado forward P/E = BRL72.20/BRL3.10 = 23.29.\nEnviado forward PEG ratio = 23.29/21.91 = 1.06.\nGesticular forward P/E = BRL132.16/BRL2.85 = 46.37.\nGesticular forward PEG ratio = 46.37/32.33 = 1.43.\nAdesivo has the lowest forward PEG ratio, 0.97, indicating that it is the most undervalued of the three equities based on the forward PEG ratio.", "ko": "Forward PEG: Adesivo 16.18/16.67 = 0.97, Enviado 23.29/21.91 = 1.06, Gesticular 46.37/32.33 = 1.43 → 가장 낮은 Adesivo가 가장 매력적.", "trap": "PEG 낮을수록 매력적. Forward P/E = 가격/다음 4분기 EPS.", "f": "PEG = Forward P/E ÷ g(%)", "why": {"B": "Enviado PEG 1.06 > 0.97.", "C": "Gesticular PEG 1.43으로 가장 높습니다(가장 비쌈)."}, "orig": "ECO Module 4 Q25"}, {"id": "ECO-M4-Q27", "src": "ECO 오답", "module": 4, "tag": "Fed model & Yardeni model", "vig": 23, "stem": "Which of Silveira’s statements concerning the Fed and Yardeni models is correct?", "opts": {"A": "Statement 3 only", "B": "Statement 4 only", "C": "Both Statement 3 and Statement 4"}, "ans": "C", "en": "C is correct. The Fed model considers the equity market to be undervalued when the market’s current earnings yield is greater than the 10-year Treasury bond yield. The Yardeni model incorporates the consensus five-year earnings growth rate forecast for the market index, a variable missing in the Fed model.", "ko": "둘 다 맞음. Fed model: 시장 이익수익률 > 10년 국채수익률이면 시장 저평가. Yardeni model: Fed 모형에 없는 컨센서스 5년 이익성장률을 포함.", "trap": "Fed: E/P vs 국채수익률(성장 미고려). Yardeni: 회사채수익률 + 성장률 반영.", "f": "", "why": {"A": "Statement 4(Yardeni는 5년 성장률 포함)도 맞습니다.", "B": "Statement 3(Fed model 판단 기준)도 맞습니다."}, "orig": "ECO Module 4 Q27"}, {"id": "ECO-M4-Q29", "src": "ECO 오답", "module": 4, "tag": "Momentum 지표 – SUE 분모", "vig": 23, "stem": "Which of Silveira’s statements concerning momentum indicators is correct?", "opts": {"A": "Statement 5 only", "B": "Statement 6 only", "C": "Both Statement 5 and Statement 6"}, "ans": "A", "en": "A is correct. Relative-strength indicators compare an equity’s performance with the performance of a group of equities or with its own past performance. SUE is unexpected earnings scaled by the standard deviation in past unexpected earnings (not the standard deviation of analysts’ earnings forecasts, which is used in the calculation of the scaled earnings surprise).", "ko": "Statement 5 맞음(relative strength = 그룹 또는 자기 과거 대비 성과). Statement 6 틀림: SUE의 분모는 '과거 unexpected earnings의 표준편차'. 애널리스트 예측치 표준편차는 scaled earnings surprise의 분모.", "trap": "SUE = (실제 − 예상 EPS)/σ(과거 unexpected earnings).", "f": "SUE_t = (EPS_t − E[EPS_t]) / σ(EPS_t − E[EPS_t])", "why": {"B": "Statement 6은 SUE와 scaled earnings surprise의 분모를 혼동했습니다.", "C": "Statement 6이 틀렸으므로 둘 다 맞을 수 없습니다."}, "orig": "ECO Module 4 Q29"}, {"id": "ECO-M4-Q56", "src": "ECO 오답", "module": 4, "tag": "Weighted harmonic mean", "vig": 24, "stem": "The weighted harmonic mean of the P/Es in Zhang’s index (Exhibit 2) is closest to:", "opts": {"A": "10.8.", "B": "11.1.", "C": "15.4"}, "ans": "A", "en": "(A) Correct. The weighted harmonic mean is the value obtained by calculating the weighted average (based on market capitalization weights) of the reciprocals of the observations (the P/E) and then taking the reciprocal of the average. The weighted harmonic mean for Zhang’s index in Exhibit 2 is calculated as follows:\n(1)\t(2)\t(3)\t(4)\t(5)\nIndex\tMarket Cap\n($ millions)\n(Ex 2)\tMarket Cap % Using\nColumn 1\n(Weighting)\tP/E\n(Ex 2)\t1/(P/E)\n1 ÷ (3)\n(Reciprocal)\tWeighted Harmonic Mean\n(2) × (4)\nFAF Inc.\t5.81\t0.3\t12.9\t0.077519\t0.0002\nMila Industries Inc.\t26.21\t1.4\t12.4\t0.080645\t0.0011\nWatson Brothers Co.\t545.62\t29.4\t5.2\t0.192308\t0.0566\nLane Foods Ltd.\t700.15\t37.8\t21.1\t0.047393\t0.0179\nDelta Delights Inc.\t575.53\t31.1\t18.4\t0.054348\t0.0169\nTotal\t1,853.32\t100%\t \t \t0.0928\nAverage (arithmetic mean)\t \t \t14.00\nWeighted harmonic mean\t \t1 ÷ (0.0928) = 10.8\n(B) Incorrect. It is the harmonic mean—equally weighted by the number of stocks (20% each) times E/P. Calculations are shown below.\nIndex\tMarket Cap\n($ millions)\tP/E\tMarket Cap %\tHarmonic Mean (1/5)\tWeighted P/E\nFAF Inc.\t5.81\t12.9\t0.3\t0.01550\t0.04044\nMila Industries Inc.\t26.21\t12.4\t1.4\t0.01613\t0.17536\nWatson Brothers Co.\t545.62\t5.2\t29.4\t0.03846\t1.53089\nLane Foods Ltd.\t700.15\t21.1\t37.8\t0.00948\t7.97119\nDelta Delights Inc.\t575.53\t18.4\t31.1\t0.01087\t5.71394\nTotal\t1,853.32\t \t100%\t0.0904\t15.4 (C)\nAverage\t370.66\t14.00\t \t1/0.0904=11.1(B)\n(C) Incorrect. It is weighted correctly but multiplied by P/E, not its reciprocal, E/P. Calculations are shown below.\nIndex\tMarket Cap\n($ millions)\tP/E\tMarket Cap %\tHarmonic Mean (1/5)\tWeighted P/E\nFAF Inc.\t5.81\t12.9\t0.3\t0.01550\t0.04044\nMila Industries Inc.\t26.21\t12.4\t1.4\t0.01613\t0.17536\nWatson Brothers Co.\t545.62\t5.2\t29.4\t0.03846\t1.53089\nLane Foods Ltd.\t700.15\t21.1\t37.8\t0.00948\t7.97119\nDelta Delights Inc.\t575.53\t18.4\t31.1\t0.01087\t5.71394\nTotal\t1,853.32\t \t100%\t0.0904\t15.4 (C)\nAverage\t370.66\t14.00\t \t1/0.0904=11.1(B)", "ko": "시가총액 가중으로 1/(P/E)를 평균한 뒤 역수: Σ w_i × (1/PE_i) = 0.0928 → 1/0.0928 = 10.8.", "trap": "가중 조화평균 = 1 / Σ(w_i / X_i). 큰 시총의 저 P/E(Watson 5.2)가 크게 반영.", "f": "WHM = 1 / Σ (w_i / PE_i)", "why": {"B": "11.1은 동일가중(각 20%) 조화평균입니다. 문제는 시가총액 가중.", "C": "15.4는 시가총액 가중 '산술'평균 P/E입니다."}, "orig": "ECO Module 4 Q56"}, {"id": "ECO-M4-Q59", "src": "ECO 오답", "module": 4, "tag": "Justified P/E > trailing P/E → 저평가", "vig": 24, "stem": "Which of the following best supports Kaminski’s recommendation for KPK? The justified (fundamental) P/E is greater than the:", "opts": {"A": "index P/E.", "B": "trailing P/E.", "C": "forward P/E."}, "ans": "B", "en": "(A) Incorrect. The index is a general comparable and does not represent the value of the company as well as the justified P/E. Therefore, it not as reliable a buy signal.\n(B) Correct. Kaminski recommends that the club invest in KPK. That would be appropriate if the company is currently undervalued. He has forecasted a share price based on fundamentals (DCF) and has forecasted EPS. Therefore, the club can calculate a justified (fundamental) trailing P/E based on those inputs and compare it with the other P/E values to determine the attractiveness of the stock. The justified (fundamental) trailing P/E would be a better metric to base the decision on than one of the other P/Es because it is supported by company fundamentals. From Exhibit 3, the justified (fundamental) trailing P/E is greater than the trailing P/E. Therefore, KPK is currently undervalued by (15.0 – 14.6) ÷ 14.6 = 2.7%, and the club should invest.\n(C) Incorrect. The forward P/E is not the most reliable P/E, because it is not based on company fundamentals.", "ko": "펀더멘털(DCF)로 구한 justified trailing P/E(15.0) > 실제 trailing P/E(14.6) → 시장이 저평가 → 매수 근거. 같은 기준(trailing)끼리 비교해야 합니다.", "trap": "Justified trailing ↔ 실제 trailing, justified leading ↔ 실제 leading.", "f": "", "why": {"A": "지수 P/E는 일반 비교대상일 뿐 회사 펀더멘털 가치를 대표하지 않습니다.", "C": "Forward P/E와 justified trailing P/E는 기준(시점)이 달라 비교 부적절합니다."}, "orig": "ECO Module 4 Q59"}, {"id": "ECO-M4-Q61", "src": "ECO 오답", "module": 4, "tag": "E/P vs Normalized EPS – 역할 구분", "vig": 25, "stem": "Is the analyst's response to Anwar's question about extremely low, zero or negative earnings accurate?", "opts": {"A": "Yes", "B": "No with regard to ranking securities and earnings", "C": "No with regard to non-recurring items and business cycles influences"}, "ans": "C", "en": "(A) Incorrect because part of her response is not accurate. Her statement, \"earnings yield helps me deal with non-recurring items and business cycle influences.\" is incorrect.  To deal with non-recurring items and business cycle influences, analysts address this problem by normalizing EPS—that is, estimating the level of EPS that the business could be expected to achieve under mid-cyclical conditions (normalized EPS or normal EPS). Please note that we are using the term “normalized earnings” to refer to earnings adjusted for the effects of a business cycle. Some sources use the term “normalized earnings” also to refer to earnings adjusted for nonrecurring items. The part of her response, \"When I am interested in ranking securities that include those types of earnings I use an inverse price ratio, the earnings yield. When I rank securities from highest to lowest the securities are correctly ranked from cheapest to most costly. I can also use normalized EPS, expected or trailing EPS in the calculation.\" is however accurate.\n(B) Incorrect because her statement regarding ranking securities is accurate. She states, \"When I am interested in ranking securities that include those types of earnings I use an inverse price ratio, the earnings yield. When I rank securities from highest to lowest the securities are correctly ranked from cheapest to most costly. I can also use normalized EPS, expected or trailing EPS in the calculation.\" is accurate. The use of inverse price multiples addresses the issue of consistent ranking because price is never negative. In the case of the P/E, the inverse price ratio is earnings to price (E/P), known as the earnings yield. Ranked by earnings yield from highest to lowest, the securities are correctly ranked from cheapest to most costly in terms of the amount of earnings one unit of currency buys. Earnings yield can be based on normalized EPS, expected next-year EPS, or trailing EPS. In these cases earnings yield provides a consistent ranking.\n(C) Correct because her response regarding non-recurring items is not accurate. Her statement, \"earnings yield helps me deal with non-recurring items and business cycle influences.\" is incorrect. To deal with non-recurring items and business cycle influences, analysts address this problem by normalizing EPS—that is, estimating the level of EPS that the business could be expected to achieve under mid-cyclical conditions (normalized EPS or normal EPS). Please note that we are using the term “normalized earnings” to refer to earnings adjusted for the effects of a business cycle. Some sources use the term “normalized earnings” also to refer to earnings adjusted for nonrecurring items.", "ko": "순위 매기기 부분(earnings yield 사용, 높은 순 = 싼 순, normalized·expected·trailing EPS 사용 가능)은 맞습니다. 그러나 'earnings yield가 비경상 항목·경기순환 영향을 해결한다'는 틀림 — 그것은 normalized EPS의 역할입니다.", "trap": "노트 정리 그대로: E/P는 순위 도구일 뿐 이익 왜곡을 고치지 않음.", "f": "", "why": {"A": "비경상·경기순환 부분 설명이 틀렸으므로 전부 맞지는 않습니다.", "B": "순위 매기기·이익 관련 설명은 정확합니다."}, "orig": "ECO Module 4 Q61"}, {"id": "ECO-M4-Q62", "src": "ECO 오답", "module": 4, "tag": "Terminal value – comparables 방식", "vig": 25, "stem": "Using Exhibit 2, the terminal value based on comparables for Evan Myers is closest to:", "opts": {"A": "$33.18.", "B": "$40.60.", "C": "$101.67."}, "ans": "B", "en": "(A) Incorrect because this would be the answer if the candidate calculated the present value of year 3 earnings to determine the terminal value using r = 7.0% given in Exhibit 2\nPV = $2.90/(1 + .07)3 = $2.37\nVn = 14.0 x $2.37 = $33.18\n(B) Correct because,\nVn = Benchmark Value of P/E x En\nor\nVn = Industry Avg P/E x En\nWhere:\nVn = Terminal Value\nEn = Earnings in year 3\nVn = 14.0 x $2.90 = $40.60\n(C) Incorrect because the analyst used the Gordon Growth Model to determine the terminal value. The question instructs the candidate to use the method based on comparables.\nEstimate that the dividend at t = 3 will equal earnings in Year 3 of $2.90 times the average payout ratio of 0.60, or Dn = $2.90 × 0.60 = $1.74. The sustainable growth rate g = b × ROE, where b is the retention rate b = (1 − 0.60) = 0.40, and ROE = 0.13 (the industry average). Therefore, g = b × ROE = 0.40 × 0.13 = 0.052  r = 7.0%\nVn = Dn(1 + g)/(r – g)\n= $1.74(1 + 0.052)/(0.07 – 0.052)\n= $1.83/0.018\n= $101.67", "ko": "Comparables 기반 terminal value = 업종평균 P/E × n년차 이익 = 14.0 × $2.90 = $40.60.", "trap": "노트 정리 그대로: comparables → 업종 P/E × E_n. r·g·payout 쓰면 펀더멘털 방식(다른 질문).", "f": "Vn = Benchmark trailing P/E × En", "why": {"A": "$33.18은 Year 3 이익을 먼저 할인한 뒤 곱한 오류입니다. Terminal value는 n시점 가치.", "C": "$101.67은 Gordon growth(펀더멘털) 방식입니다. 질문은 comparables 방식."}, "orig": "ECO Module 4 Q62"}, {"id": "ECO-M4-Q66", "src": "ECO 오답", "module": 4, "tag": "Terminal value – comparables 방식", "vig": 26, "stem": "Based on the information given, the terminal price multiple calculated by Thomas is closest to:", "opts": {"A": "$36.", "B": "$45.", "C": "$50."}, "ans": "A", "en": "(A) Correct because candidates calculate terminal value based on comparables, using the estimated industry average P/E as the benchmark. For the given information, the figure is computed as: (terminal value based on comparables) = (Industry average P/E) × (Earnings in Year 5) = 9.00 × 4.00 = 36.\nHaving selected a terminal multiple, the expression for terminal value when using a terminal P/E multiple is Vn = Benchmark value of trailing terminal P/E × En, or Vn = Benchmark value of forward terminal P/E × En+1, where Vn = Terminal value at time n.\n(B) Incorrect because candidates calculate forward terminal value based on fundamentals, using the given information. The trailing terminal price multiple based on fundamentals is different from the terminal value based on comparables. The relevant expression is Vn = Dn/(r − g). The dividend at t = 5 is equal earnings in Year 5 of $4.00 times the average payout ratio of 45%: Dn = $4.00 × 45% = $1.80. Also, the sustainable growth rate is g = b × ROE, where b is the retention rate (1 minus the dividend payout ratio). For the given information, b = (1 – 0.45) = 0.55, and ROE = 20% (the industry average). Therefore, g = b × ROE = 0.55 × 0.20 = 0.11. Given the required rate of return of 15%, candidates obtain the estimate: Vn = $1.80 / (0.15 − 0.11) = $45.\n(C) Incorrect because candidates calculate trailing terminal value based on fundamentals, using the given information. The trailing terminal price multiple based on fundamentals is different from the terminal value based on comparables. The relevant expression is Vn = Dn(1 + g)/(r − g). The dividend at t = 5 is equal earnings in Year 5 of $4.00 times the average payout ratio of 45%: Dn = $4.00 × 0.45 = $1.80. Also, the sustainable growth rate is g = b × ROE, where b is the retention rate (1 minus the dividend payout ratio). For the given information, b = (1 − 0.45) = 0.55, and ROE = 0.20 (the industry average). Therefore, g = b × ROE = 0.55 × 0.20 = 0.11. Given the required rate of return of 15%, candidates obtain the estimate: Vn = ($1.80)(1 + 0.11)/(0.15 − 0.11) = $50.", "ko": "업종평균 P/E × Year 5 이익 = 9.00 × $4.00 = $36.", "trap": "M4 Q62와 동일 함정 반복.", "f": "Vn = Benchmark P/E × En", "why": {"B": "$45는 펀더멘털(Gordon) 방식: D5 = 4×45% = 1.80, g = 0.55×20% = 11%, 1.80/(0.15−0.11) = 45.", "C": "$50은 펀더멘털 방식의 다른 변형 계산입니다. Comparables는 P/E × E만."}, "orig": "ECO Module 4 Q66"}, {"id": "ECO-M4-Q69", "src": "ECO 오답", "module": 4, "tag": "EV/EBITDA → equity value", "vig": 27, "stem": "Using Nenkov’s findings from his search of the database, his suggestions regarding appropriate adjustments, the information in Exhibits 1A and 2, and the EV/EBITDA multiples approach, RRBL’s value of equity is closest to:", "opts": {"A": "BGN916 million.", "B": "BGN946 million.", "C": "BGN966 million."}, "ans": "C", "en": "(A) Incorrect because it ignores cash and short-term investments and accounts only for debt.\nValue of equity = 945.9 – 30.0 = 915.9\n(B) Incorrect because it is simply the EV without adjustments for cash and short-term investments and long-term debt.\nEnterprise Value = EBITDA2012 × Adjusted EV/EBITDA = 105.1 × 9.0 = 945.9\n(C) Correct.\nAdjusted EV/EBITDA multiple = 7.2 × (1.25) = 9.0\nEV = EBITDA2013 × Adjusted EV/EBITDA = 105.1 × 9.0 = 945.9\nValue of equity = EV + Cash and short-term investments – Long-term debt\n= 945.9 + 50.0 – 30.0\n= 965.9", "ko": "조정 EV/EBITDA = 7.2 × 1.25 = 9.0. EV = forward EBITDA(2013) 105.1 × 9.0 = 945.9. Equity = EV + 현금·단기투자 50 − 장기부채 30 = BGN 965.9M.", "trap": "Equity = EV − Debt + Cash (EV는 순부채 기준).", "f": "Equity = EV − Debt + Cash & ST investments", "why": {"A": "916은 부채만 차감하고 현금을 더하지 않았습니다.", "B": "946은 EV 그 자체입니다. 현금 가산·부채 차감이 필요."}, "orig": "ECO Module 4 Q69"}, {"id": "ECO-M4-Q70", "src": "ECO 오답", "module": 4, "tag": "EV/EBITDA 장단점", "vig": 27, "stem": "Regarding Nenkov’s two cautionary statements concerning the use of the enterprise value method of valuation, he is most likely correct with respect to:", "opts": {"A": "Statement 1 only.", "B": "Statement 2 only.", "C": "both Statements 1 and 2."}, "ans": "A", "en": "(A) Correct. Statement 1 is correct because EBITDA is a pre-interest earnings figure, in contrast to earnings per share, which is a post-interest figure. Differences in financial leverage do not affect EBITDA. Statement 2 is incorrect because EBITDA overestimates cash flow from operations if working capital is growing. Therefore, only Statement 1 is correct.\n(B) Incorrect because EBITDA overestimates cash flow from operations if working capital is growing.\n(C) Incorrect because only Statement 1 is correct, not both.", "ko": "Statement 1 맞음: EBITDA는 이자 전 수치라 재무레버리지 차이에 영향받지 않음 → 레버리지가 다른 회사 비교에 P/E보다 적합. Statement 2 틀림: 운전자본이 증가하면 EBITDA는 CFO를 '과대'평가합니다.", "trap": "노트 정리 그대로: WC↑ → EBITDA가 현금흐름보다 부풀려짐.", "f": "", "why": {"B": "Statement 2(과소평가)는 틀렸습니다.", "C": "Statement 2가 틀렸으므로 둘 다 맞지 않습니다."}, "orig": "ECO Module 4 Q70"}, {"id": "ECO-M4-Q71", "src": "ECO 오답", "module": 4, "tag": "Method of comparables – P/E 비교", "vig": null, "stem": "Company X’s EPS is $2.00. Its closest competitor, Company Y, is trading at a P/E of 18, and both companies have a similar operating and financial profile. If Company X is trading at $33.00 per share, Company X is most likely:", "opts": {"A": "undervalued compared to Company Y.", "B": "fairly valued compared to Company Y.", "C": "overvalued compared to Company Y."}, "ans": "A", "en": "(A) Correct because if Company X’s stock is trading at $33.00, its P/E will be: $33.00/$2.00 = 16.5. Since both companies are similar, this P/E would indicate that Company X is undervalued relative to Company Y.\n(B) Incorrect because if Company X’s stock is trading at $33.00, its P/E will be: $33.00/$2.00 = 16.5. Since both companies are similar, this P/E would indicate that Company X is undervalued relative to Company Y.\n(C) Incorrect because if Company X’s stock is trading at $33.00, its P/E will be: $33.00/$2.00 = 16.5. Since both companies are similar, this P/E would indicate that Company X is undervalued relative to Company Y.", "ko": "X의 P/E = 33/2 = 16.5 < Y의 18 (펀더멘털 유사) → X는 Y 대비 저평가.", "trap": "", "f": "", "why": {"B": "P/E가 다르므로(16.5 vs 18) 적정평가가 아닙니다.", "C": "P/E가 더 낮으므로 고평가가 아니라 저평가입니다."}, "orig": "ECO Module 4 Q71"}, {"id": "ECO-M4-Q72", "src": "ECO 오답", "module": 4, "tag": "Earnings yield 순위", "vig": null, "stem": "An analyst gathers the following information:\n\tCurrent Price\tEPS\nCompany A\t$32\t$4\nCompany B\t$20\t$5\nCompany C\t$80\t$12\nWhich company is ranked highest based on earnings yield?", "opts": {"A": "Company A", "B": "Company B", "C": "Company C"}, "ans": "B", "en": "(A) Incorrect because Company A has the lowest earnings yield, so it is not ranked the highest.\nE/P for Company A = 4 / 32 = 12.5% (third rank)\nE/P for Company B = 5 / 20 = 25.0% (first rank)\nE/P for Company C = 12 / 80 = 15.0% (second rank)\n(B) Correct because the inverse price ratio is earnings to price (E/P), known as the earnings yield. Company B has the highest earnings yield.\nE/P for Company A = 4 / 32 = 12.5% (third rank)\nE/P for Company B = 5 / 20 = 25.0% (first rank)\nE/P for Company C = 12 / 80 = 15.0% (second rank)\nFor P/E, the inverse price ratio is earnings to price (E/P), known as the earnings yield. Ranked by earnings yield from highest to lowest, the securities are correctly ranked from cheapest to most costly. Therefore, Company B is the highest ranked.\n(C) Incorrect because Company B has the highest earnings yield, not Company C. Therefore, Company C is not highest ranked.\nE/P for Company A = 4 / 32 = 12.5% (third rank)\nE/P for Company B = 5 / 20 = 25.0% (first rank)\nE/P for Company C = 12 / 80 = 15.0% (second rank)", "ko": "E/P: A 12.5%, B 25%, C 15% → B가 가장 높음(가장 싼 주식).", "trap": "EPS 금액이 크다고(C의 $12) 이익수익률이 높은 것이 아님.", "f": "E/P = EPS/Price", "why": {"A": "A는 E/P 12.5%로 가장 낮습니다.", "C": "C는 15%로 2위입니다."}, "orig": "ECO Module 4 Q72"}, {"id": "ECO-M4-Q74", "src": "ECO 오답", "module": 4, "tag": "Forecasted fundamentals 방식", "vig": null, "stem": "An analyst estimates a company's stock value using a residual income model, then divides this value by the company's book value per share. The resulting ratio is subsequently compared to the company's actual P/B ratio. The analyst's approach to valuation is best described as the:", "opts": {"A": "method of comparables.", "B": "method based on forecasted fundamentals.", "C": "momentum indicator based on fundamentals."}, "ans": "B", "en": "(A) Incorrect because information from comparable companies are not used. The method of comparables refers to the valuation of an asset based on multiples of comparable (similar) assets—that is, valuation based on multiples benchmarked to the multiples of similar assets.\n(B) Correct because the method based on forecasted fundamentals refers to the use of multiples that are derived from forecasted fundamentals—characteristics of a business related to profitability, growth, or financial strength. An example of a justified multiple based on fundamentals: Suppose that we are using a residual income model and estimate that the value of the stock is $46. Then, the justified P/B based on forecasted fundamentals is $46/$23 ($23 is the current book value per share) = 2.0, which we can again compare with the actual value of the stock’s P/B.\n(C) Incorrect because it does not use the time series of its own past data. Momentum indicators typically relate either price or a fundamental (such as earnings) to the time series of its own past values or, in some cases, to its expected value.", "ko": "RI 모형(내재가치 추정)으로 구한 가치를 BVPS로 나눈 justified P/B를 실제 P/B와 비교 → method based on forecasted fundamentals.", "trap": "", "f": "Justified P/B = V0(model)/B0", "why": {"A": "비교 대상 회사의 배수를 쓰지 않았습니다.", "C": "자기 과거 시계열 대비가 아니므로 momentum 지표가 아닙니다."}, "orig": "ECO Module 4 Q74"}, {"id": "ECO-M4-Q76", "src": "ECO 오답", "module": 4, "tag": "Normalized EPS – average ROE × 현재 BVPS", "vig": null, "stem": "An analyst gathers the following information about a company:\n\tYear 1\tYear 2\tYear 3\tYear 4\nBook value per share\t$40.00\t$42.00\t$45.00\t$48.00\nROE\t12.00%\t7.62%\t12.89%\t8.33%\nOver the 4-year period, the normalized EPS by the method of average ROE is closest to:", "opts": {"A": "$3.64.", "B": "$4.47.", "C": "$4.90."}, "ans": "C", "en": "(A) Incorrect because this is the average book value per share multiplied by the latest ROE.\nAverage book value per share is ($40 + $42 + $45 + $48) / 4 = $43.75\nThe incorrect normalize EPS = Average book value per share × current (Year 4) ROE = $43.75 × 8.33% = $3.644 ≈ $3.64.\n(B) Incorrect because this is the average ROE multiplied by the average book value per share, and not current book value per share.\nAverage ROE is (12% + 7.62% + 12.89% + 8.33%) / 4 = 10.21%.\nAverage book value per share is (40 + 42 + 45 + 48) / 4 = $43.75\nThe incorrect normalized EPS = Average ROE × Average book value per share = 10.21% × $ 43.75 = $4.467 ≈ $4.47.\n(C) Correct because the method of average return on equity, in which normalized EPS is calculated as the average return on equity (ROE) from the most recent full cycle, multiplied by current book value per share.\nAverage ROE is (12% + 7.62% + 12.89% + 8.33%) / 4 = 10.21%.\nNormalized EPS = Average ROE × current book value per share = 10.21% × $ 48.00 = $4.9008 ≈ $4.90.", "ko": "평균 ROE = (12 + 7.62 + 12.89 + 8.33)/4 = 10.21%. × 현재(Year 4) BVPS $48 = $4.90.", "trap": "노트 정리 그대로: 평균 ROE × '현재' BVPS.", "f": "Normalized EPS = Avg ROE × current BVPS", "why": {"A": "$3.64는 평균 BVPS × 최근 ROE(8.33%)입니다.", "B": "$4.47은 평균 ROE × '평균' BVPS입니다. 현재 BVPS를 써야 규모 변화가 반영됩니다."}, "orig": "ECO Module 4 Q76"}, {"id": "ECO-M4-Q89", "src": "ECO 오답", "module": 4, "tag": "Justified P/S", "vig": null, "stem": "An analyst makes the following long-term forecasts for a company:\nEarnings retention rate\t40%\nEarnings growth rate\t5%\nProfit margin\t10%\nExpected rate of return\t15%\nWeighted average cost of capital\t14%\nThe company’s justified price-to-sales (P/S) is closest to:", "opts": {"A": "0.40.", "B": "0.60.", "C": "0.67."}, "ans": "B", "en": "(A) Incorrect because the justified price-to-sales (P/S) is 0.6. It is not 0.4, which is wrongly calculated by using the earnings retention rate (40%) as pay-out ratio (60%).\nThe incorrect calculation is shown below:\nP0 /S1 = [(E1/S1) × (1 – b)] / (r – g)\nWhere E1/S1= 10%; b = 60%; r = 15%; and g = 5%\n= [10% (1 – 60%)] / (15% – 5%)\n= (0.10 × 0.40) / (0.15 – 0.05)\n= 0.04 / 0.1 = 0.40\n(B) Correct because the justified price-to-sales (P/S) is 0.6, calculated below.\nThe correct calculation is shown below:\nP0/S1 = [(E1/S1) × (1– b)] / (r – g)\nWhere E1/S1= 10%; b = 40%; r = 15%; and g = 5%\nP0/S1 = [(E1/S1)(1– b) / (r – g)\n= [10% (1 – 40%)] / (15% – 5%)\n= (0.10 × 0.60) / (0.15 – 0.05)\n= 0.06 / 0.10 = 0.60\n(C) Incorrect because the justified price-to-sales (P/S) is 0.6. It is not 0.67, which is an incorrect calculation using the weighted average cost of capital (14%) instead of the expected rate of return figure (15%) in the equation.\nThe incorrect calculation is shown below:\nP0/S1 = [(E1/S1) × (1– b)] / (r – g)\nWhere E1/S1= 10%; b = 40%; r = 14%; and g = 5%\n= [10% (1 – 40%)] / (14% – 5%)\n= (0.10 × 0.60) / (0.14 – 0.05)\n= 0.060 / 0.09 = 0.67", "ko": "P0/S1 = (E1/S1)(1 − b)/(r − g) = 0.10 × 0.60/(0.15 − 0.05) = 0.60.", "trap": "Equity 배수 → r_e. 배당성향 = 1 − 유보율.", "f": "P0/S1 = PM × payout / (r − g)", "why": {"A": "0.40은 유보율(40%)을 배당성향 자리에 넣은 오류입니다.", "C": "0.67은 자기자본 요구수익률(15%) 대신 WACC(14%)를 쓴 오류입니다."}, "orig": "ECO Module 4 Q89"}, {"id": "ECO-M4-Q92", "src": "ECO 오답", "module": 4, "tag": "Trailing vs leading dividend yield", "vig": null, "stem": "An analyst gathers the following information about a company:\n\tYear 1 (Actual)\tYear 2 (Projected)\nDividend\t$1.0\t$2.0\nThe current stock price at the end of Year 1 is $10. The analyst forecasts a 30% revenue growth in Year 2. The trailing dividend yield is:", "opts": {"A": "10%.", "B": "13%.", "C": "20%."}, "ans": "A", "en": "(A) Correct because 10% is the trailing dividend yield. Trailing dividend yield is calculated by using the dividend rate divided by the current market price per share.\nTrailing dividend yield = Dividend rate / Current stock price\n= $1.0 / $10.0 = 10%\n(B) Incorrect because the correct answer of 10% trailing dividend yield is multiplied by the sum of one plus the revenue growth forecast.\nTrailing dividend yield × (1 + Revenue growth)\n= 10% × (1 + 30%) = 10% × 1.3 = 13%\n(C) Incorrect because 30% is the leading dividend yield.\nThe leading dividend yield is calculated as forecasted dividends per share over the next year divided by the current market price per share.\nLeading dividend yield = Forecasted dividend / Current stock price\n= $2.0 / $10.0 = 20%", "ko": "Trailing dividend yield = 최근 실제 배당/현재가 = 1.0/10 = 10%. Leading = 2.0/10 = 20%.", "trap": "Trailing = 과거 실적, leading = 예상치. 매출성장률은 무관한 미끼.", "f": "", "why": {"B": "13%는 trailing yield에 매출성장(30%)을 곱한 무의미한 값입니다.", "C": "20%는 leading(forward) dividend yield입니다."}, "orig": "ECO Module 4 Q92"}, {"id": "ECO-M4-Q58", "src": "ECO 관련유형", "module": 4, "tag": "Normalized EPS – 규모 변화 시 average ROE 방법", "vig": 24, "stem": "When determining Rapier’s P/E, the most appropriate method for Kaminski to use to calculate the company’s normalized EPS is the:", "opts": {"A": "current EPS because Rapier is mid-cycle.", "B": "average EPS over the most recent full cycle.", "C": "average ROE over the most recent full cycle times the current book value per share."}, "ans": "C", "en": "(A) Incorrect. Even though the company is mid-cycle, the current EPS may not be the same as the average or normalized EPS over the cycle.\n(B) Incorrect. Averaging the EPS over the cycle is one way to calculate normalized EPS in a cyclical industry but does not account for changes in the business’s size.\n(C) Correct. The average ROE over the most recent full cycle times the current book value is the most appropriate method to use to calculate normalized EPS in cyclical industries when there have been changes in the company’s size, as is the case for Rapier and its asset growth.", "ko": "경기순환 산업 + 총자산이 꾸준히 증가(규모 변화) → average ROE × 현재 BVPS가 가장 적절(규모 변화 반영).", "trap": "노트: Average ROE 방법이 size effect 반영 → 선호.", "f": "", "why": {"A": "Mid-cycle이라도 현재 EPS가 정상화 EPS와 같다는 보장이 없습니다.", "B": "평균 EPS 방법은 규모 변화를 반영하지 못합니다."}, "orig": "ECO Module 4 Q58"}, {"id": "ECO-M4-Q65", "src": "ECO 관련유형", "module": 4, "tag": "P/CF의 단점 – FCFE 변동성", "vig": 26, "stem": "Which of the following is most likely a drawback of using price to cash flow?", "opts": {"A": "Point 1", "B": "Point 2", "C": "Point 3"}, "ans": "B", "en": "(A) Incorrect because Point 1 (Cash flow is less subject to manipulation by management than earnings) is a rationale for, not a possible drawback to, the use of price to cash flow.\nAnalysts have offered the following rationales for the use of price to cash flow: Cash flow is less subject to manipulation by management than earnings.\n(B) Correct because Point 2 (FCFE (free cash flow to equity) is more volatile than cash flow for many businesses) is a possible drawback to using price to cash flow.\nTheory views free cash flow to equity (FCFE) rather than cash flow as the appropriate variable for price-based valuation multiples. We can use P/FCFE, but FCFE does have the possible drawback of being more volatile than cash flow for many businesses. FCFE is also more frequently negative than cash flow.\n(C) Incorrect because Point 3 (US GAAP allow more flexibility than IFRS, in classification of interest paid, interest received, and dividends received) is incorrectly stated regarding possible drawbacks to using price to cash flow. US GAAP allow less, not more, flexibility than IFRS with respect to these three items.\nOperating cash flow from the statement of cash flows under IFRS may not be comparable to operating cash flow under US GAAP because IFRS allow more flexibility in classification of interest paid, interest received, and dividends received. Under US GAAP, all three of these items are classified in operating cash flow, but under IFRS, companies have the option to classify them as operating or investing (for interest and dividends received) and as operating or financing (for interest paid).", "ko": "Point 2: 이론상 적절한 FCFE는 많은 기업에서 cash flow보다 변동성이 크고 음수가 더 자주 나와 P/FCFE의 단점이 됩니다.", "trap": "노트: FCFE → 변동성 큼, 음수 가능(단점).", "f": "", "why": {"A": "현금흐름이 이익보다 조작이 어렵다는 것은 P/CF 사용의 '근거'입니다.", "C": "US GAAP vs IFRS 분류 차이는 오히려 IFRS가 이자·배당 분류에 더 유연합니다(서술 자체가 틀림)."}, "orig": "ECO Module 4 Q65"}, {"id": "ECO-M4-Q73", "src": "ECO 관련유형", "module": 4, "tag": "손실·0 이익 기업 순위 → earnings yield", "vig": null, "stem": "An analyst is creating a ranking of companies in the same industry. Most of the companies are profitable, but a few have losses and one has zero earnings. Which of the following is most suitable for a comparative analysis?", "opts": {"A": "Justified P/E", "B": "Forward P/E", "C": "Earnings yield"}, "ans": "C", "en": "(A) Incorrect because zero earnings and negative earnings pose a problem if the analyst wishes to use P/E as the valuation metric. Because division by zero is undefined, P/Es cannot be calculated for zero earnings. Therefore, he should not use justified P/E.\n(B) Incorrect because zero earnings and negative earnings pose a problem if the analyst wishes to use P/E as the valuation metric. Because division by zero is undefined, P/Es cannot be calculated for zero earnings. Therefore, he should not use forward P/E.\n(C) Correct because one solution applicable to any ratio involving a quantity that can be negative or zero is the use of an inverse price ratio—that is, the reciprocal of the original ratio, which places price in the denominator. The use of inverse price multiples addresses the issue of consistent ranking because price is never negative. In the case of the P/E, the inverse price ratio is earnings to price (E/P), known as the earnings yield. Therefore, he should use the earnings yield ratio.", "ko": "0 또는 음수 이익이 있으면 P/E는 정의되지 않거나 무의미 → 가격을 분모로 둔 E/P로 일관된 순위.", "trap": "", "f": "", "why": {"A": "Justified P/E도 0 이익이면 계산 불가.", "B": "Forward P/E도 같은 문제."}, "orig": "ECO Module 4 Q73"}, {"id": "ECO-M4-Q81", "src": "ECO 관련유형", "module": 4, "tag": "EBITDA 배수의 분자 = EV", "vig": null, "stem": "Which of the following is the most appropriate numerator when calculating an EBITDA multiplier for a leveraged firm?", "opts": {"A": "Equity value", "B": "Enterprise value", "C": "Market value of debt"}, "ans": "B", "en": "(A) Incorrect because EBITDA is a flow to both debt and equity holders. Equity value alone does not reflect the total company value.\n(B) Correct because EBITDA is a flow to both debt and equity, as noted, defining an EBITDA multiple by using a measure of total company value in the numerator, such as enterprise value (EV), is appropriate.\n(C) Incorrect because EBITDA is a flow to both debt and equity holders. Market value of debt alone does not reflect the total company value.", "ko": "EBITDA는 채권자·주주 모두에게 귀속되는 흐름 → 분자는 기업 전체가치(EV).", "trap": "", "f": "", "why": {"A": "주식가치만으로는 전체 가치가 아닙니다.", "C": "부채 시장가치만으로도 아닙니다."}, "orig": "ECO Module 4 Q81"}, {"id": "ECO-M4-Q87", "src": "ECO 관련유형", "module": 4, "tag": "Harmonic mean", "vig": null, "stem": "Which of the following methods of describing central tendency helps to reduce the impact of large outliers but not the impact of small outliers?", "opts": {"A": "Median", "B": "Harmonic mean", "C": "Arithmetic mean"}, "ans": "B", "en": "(A) Incorrect because the median rather than the arithmetic mean to derive an average multiple mitigates the effect of outliers. The harmonic mean is sometimes also used to reduce the impact of large outliers—which are typically the major concern in using the arithmetic mean multiple—but not the impact of small outliers (i.e., those close to zero).\n(B) Correct because the harmonic mean is sometimes also used to reduce the impact of large outliers—which are typically the major concern in using the arithmetic mean multiple—but not the impact of small outliers (i.e., those close to zero). The harmonic mean tends to mitigate the impact of large outliers. The harmonic mean may aggravate the impact of small outliers, but such outliers are bounded by zero on the downside.\n(C) Incorrect because the median rather than the arithmetic mean to derive an average multiple mitigates the effect of outliers. The harmonic mean is sometimes also used to reduce the impact of large outliers—which are typically the major concern in using the arithmetic mean multiple—but not the impact of small outliers (i.e., those close to zero).", "ko": "큰 이상치 영향은 줄이고 작은 이상치(0 근처)는 줄이지 않는 것 = 조화평균.", "trap": "M4 Q16 오답과 동일 개념.", "f": "", "why": {"A": "중앙값은 양쪽 이상치를 모두 완화.", "C": "산술평균은 큰 이상치에 취약."}, "orig": "ECO Module 4 Q87"}, {"id": "ECO-M4-Q94", "src": "ECO 관련유형", "module": 4, "tag": "Comparables 방식 terminal value 특징", "vig": null, "stem": "Which of the following is a characteristic of the comparables approach to estimating a stock’s terminal value?", "opts": {"A": "The model is grounded in market data", "B": "The terminal value does not reflect any mispricing in the benchmark used", "C": "The model's output is sensitive to changes in the required rate of return estimate"}, "ans": "A", "en": "(A) Correct because the comparables approach suggests the use of industry and peer companies as comparison assets. The use of a comparables approach has the strength that it is entirely grounded in market data.\n(B) Incorrect because a possible disadvantage to the comparables approach is that, when the benchmark value reflects mispricing (over- or undervaluation), so will the estimate of terminal value.\n(C) Incorrect because the comparables approach suggests the use of industry and peer companies as comparison assets. The use of a comparables approach has the strength that it is entirely grounded in market data. In contrast, the Gordon growth model calls for specific estimates (the required rate of return, the dividend payout ratio, and the expected mature growth rate), and the model’s output is very sensitive to changes in those estimates. So, this is an attribute of the Gordon growth model, not the comparables approach.", "ko": "Comparables 방식의 강점은 전적으로 시장 데이터에 기반한다는 점. 단점: 벤치마크가 잘못 가격되면 terminal value도 그대로 왜곡.", "trap": "", "f": "", "why": {"B": "벤치마크의 미스프라이싱이 그대로 반영되는 것이 단점입니다.", "C": "요구수익률에 민감한 것은 Gordon growth(펀더멘털) 방식입니다."}, "orig": "ECO Module 4 Q94"}, {"id": "ECO-M4-Q95", "src": "ECO 관련유형", "module": 4, "tag": "Terminal value – trailing P/E × E5", "vig": null, "stem": "An analyst estimates a stock’s terminal value at the end of Year 5 using industry comparables as the benchmark and has gathered the following information:\nIndustry average trailing terminal P/E ratio\t12.5\nIndustry average forward terminal P/E ratio\t13.8\nEarnings per share in Year 5\t$4.40\nBased on the above information, the company’s terminal value in Year 5 is closest to:", "opts": {"A": "$55.00.", "B": "$57.86.", "C": "$60.72."}, "ans": "A", "en": "(A) Correct because the terminal value in Year 5 is calculated using Vn = Benchmark value of trailing terminal P/E × En. Here, V5 = Benchmark value of trailing terminal P/E × E5, that is, V5 = 12.5 × $4.40 = $55.00. We use the trailing terminal P/E ratio because we are given the earnings per share in Year 5 and we need to compute the company's terminal value in Year 5.\n(B) Incorrect because the terminal value in Year 5 is incorrectly calculated using the average of the trailing and forward terminal P/E ratios as: V5 = [(12.5 + 13.8)/2] × $4.40 = $57.86. However, we need to use the trailing terminal P/E ratio because we are given the earnings per share in Year 5 and we need to compute the company's terminal value in Year 5.\n(C) Incorrect because the terminal value in Year 5 is incorrectly calculated using the industry average forward terminal P/E ratio as: V5 = 13.8 × $4.40 = $60.72. However, Vn = Benchmark value of forward terminal P/E × En+1, so the earnings per share in Year 6 would be required to compute the terminal value in Year 5 using the industry average forward terminal P/E ratio. As we are given the earnings per share in Year 5, we use the trailing terminal P/E ratio.", "ko": "E5가 주어졌으므로 trailing P/E 사용: V5 = 12.5 × 4.40 = $55.00. (Forward P/E를 쓰려면 E6가 필요)", "trap": "노트: trailing ↔ E_n, forward ↔ E_(n+1).", "f": "Vn = trailing P/E × En = forward P/E × E(n+1)", "why": {"B": "두 P/E의 평균을 쓴 오류입니다.", "C": "Forward P/E(13.8) × E5 = 60.72 — forward는 E6와 짝."}, "orig": "ECO Module 4 Q95"}, {"id": "SCH-R20-11", "module": 4, "tag": "Method of comparables – P/E", "stem": "Consumer Products, Inc., has a trailing P/E of 27.52, while the median peer group P/E is 33.25. Assuming that there are no differences in the fundamentals among the peer firms and Consumer Products, it is most likely that the firm’s stock:", "opts": {"A": "should be sold short.", "B": "appears to be overvalued.", "C": "appears to be undervalued."}, "ans": "C", "en": "Consumer Products appears to be undervalued with a trailing P/E of 27.52 compared with the benchmark of 33.25.", "ko": "펀더멘털이 같다면 P/E가 낮은 쪽(27.52 < 33.25)이 저평가.", "why": {"A": "저평가이므로 공매도 대상이 아닙니다.", "B": "P/E가 벤치마크보다 낮아 고평가가 아닙니다."}, "trap": "", "f": "", "orig": "Schweser MQ 20.1 Q1", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R20-13", "module": 4, "tag": "Justified leading P/E vs 실제 P/E", "stem": "At the end of 20X3, an analyst estimates the value of Copyright, Inc., common stock to be $84 per share using a two-stage, dividend discount H-model and forecasts earnings for 20X4 to be $4.20 per share. Copyright is most likely:", "opts": {"A": "underpriced if its actual leading P/E is 15.0 times.", "B": "underpriced if its actual leading P/E is 23.0 times.", "C": "overpriced if its actual leading P/E is 16.6 times."}, "ans": "A", "en": "Copyright’s justified leading P/E multiple using the valuation from the H-model is $84/$4.20 = 20 times. The firm is underpriced if its actual P/E is less than 20; it is overpriced if its actual P/E is greater than 20.", "ko": "Justified leading P/E = 84/4.20 = 20×. 실제 P/E < 20 → 저평가(15.0×).", "why": {"B": "23.0 > 20 → 고평가입니다.", "C": "16.6 < 20 → 저평가인데 고평가라고 했습니다."}, "trap": "ECO M4 Q59와 같은 비교 구조(justified vs 실제, 같은 기준).", "f": "Justified P/E = V0/E1", "orig": "Schweser MQ 20.1 Q3", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R20-21", "module": 4, "tag": "Justified P/S", "stem": "An analyst researching Blue Ridge Camping has determined that the firm has:\nA payout ratio of 75%.\nA return on equity (ROE) of 18%.\nAn earnings per share (EPS) of $5.35.\nSales per share of $342.\nExpected earnings/dividends/sales growth of 4.5%.\nShareholders required return of 15%.\nThe firm’s justified price to sales ratio (P/S) multiple based on the above fundamentals is closest to:", "opts": {"A": "0.0780.", "B
