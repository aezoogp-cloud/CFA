.\n(B) Incorrect because venture capital (VC) funds are early stage and might not necessarily be focused on scalability and majority ownership. VC or growth equity, which both involve minority-stake investments in early-stage or growing companies unlike leveraged buyout firms which acquire majority control and seek to create value through more efficient business practices and optimizing the balance sheet.\n(C) Correct because leveraged buy-out firms acquire majority control and seek to create value through more efficient business practices and optimizing the balance sheet.", "ko": "과반 지분 인수 + 효율화로 가치 창출 후 엑시트 → leveraged buyout 펀드.", "trap": "", "f": "", "why": {"A": "Growth equity는 보통 소수지분.", "B": "VC는 초기단계·소수지분 위주."}, "orig": "ECO Module 6 Q39"}, {"id": "ECO-M6-Q41", "src": "ECO 오답", "module": 6, "tag": "Market approach 3종 – GTM", "vig": null, "stem": "An analyst seeks to value a private company using a market-based approach. Which of the following methods is based on pricing multiples derived from acquisitions of entire public or private companies?", "opts": {"A": "Prior transaction method", "B": "Guideline transactions method", "C": "Guideline public company method"}, "ans": "B", "en": "(A) Incorrect because there are three major variations of the market approach. The prior transaction method considers actual transactions in the stock of the subject private company.\n(B) Correct because there are three major variations of the market approach. The guideline transactions method (GTM) establishes a value estimate based on pricing multiples derived from the acquisition of control of entire public or private companies. Unlike the GPCM, the GTM uses pricing multiples derived from acquisitions of public or private companies.\n(C) Incorrect because there are three major variations of the market approach. The guideline public company method (GPCM) establishes a value estimate based on observed multiples from trading activity in the shares of public companies viewed as comparable to the subject private company.", "ko": "상장·비상장 '기업 전체 인수'(지배권 거래)에서 도출한 배수 = guideline transactions method(GTM).", "trap": "GPCM(상장사 주가) / GTM(인수거래) / Prior transaction(자사 주식 거래).", "f": "", "why": {"A": "Prior transaction method는 대상 비상장사 자체 주식의 실제 거래를 사용.", "C": "GPCM은 비교 상장사의 '주식 거래' 배수를 사용."}, "orig": "ECO Module 6 Q41"}, {"id": "ECO-M6-Q42", "src": "ECO 오답", "module": 6, "tag": "비상장사 특성 – 경영진 지배의 장점", "vig": null, "stem": "An analyst identifies the following characteristics that make a private company different from public companies:\nThe financial statements have limited disclosures\nThe senior management owns 60% of the shares\nThe shareholder agreement restricts the ability to sell shares\nWhich characteristic would most likely have a positive effect on the private company valuation?", "opts": {"A": "Limited financial statement disclosures", "B": "Senior management owning a controlling interest in the company", "C": "A shareholder agreement that restricts the shareholders' ability to sell shares"}, "ans": "B", "en": "(A) Incorrect because limited disclosure in the financial statements would be a negative factor in projecting future cash flows to value the company. Public company valuation is usually conducted based on standard issuer disclosures. Analysts typically rely on audited financial statements as a basis to project future cash flows.\n(B) Correct because when senior management has a controlling interest it reduces the principal-agent problem and gives them more direct control over strategic decisions. Both factors allow managers to take a longer-term perspective in decision-making which would be a positive factor in valuing the company. The senior management of many private firms often has a controlling ownership interest in the company. This feature of private companies greatly reduces the principal-agent problem which may arise when owners and managers are separate allows more direct control over strategic decisions than for public companies. Private company managers can take a longer-term perspective in strategic decision making without pressure from external investors seeking short-term gains on publicly traded shares.\n(C) Incorrect because a shareholder agreement with restrictions would be a negative factor. Shareholder agreements that restrict the ability to sell shares may also reduce the marketability of equity interests. The stock-specific factors just listed are generally a negative for private company valuation.", "ko": "경영진이 지배 지분을 보유 → 주인-대리인 문제 감소, 장기적 의사결정 가능 → 가치에 긍정적.", "trap": "", "f": "", "why": {"A": "공시 부족은 현금흐름 예측을 어렵게 해 부정적 요인입니다.", "C": "주식 매각 제한은 시장성을 낮춰 부정적 요인입니다."}, "orig": "ECO Module 6 Q42"}, {"id": "ECO-M6-Q48", "src": "ECO 오답", "module": 6, "tag": "DLOC + DLOM 결합 (곱셈)", "vig": null, "stem": "An investor considers purchasing a non-controlling minority interest in a private company whose shares have not traded recently. The private company's closest comparable public company is trading at €60.00 per share and the appropriate at-the-money put option premium on shares of the public company is €7.50. Assuming a control premium of 20%, the estimated total discount due to lack of control and lack of marketability is closest to:", "opts": {"A": "27.1%.", "B": "29.2%.", "C": "30.0%."}, "ans": "A", "en": "(A) Correct because a discount for lack of control (DLOC) involves a deduction from the pro rata share of 100% of the value of an equity interest to reflect the absence of some or all powers of control.\nA discount for lack of marketability (DLOM) is a deduction from an ownership interest’s value to reflect the relative absence (compared with publicly traded companies) of a liquid market for a company’s shares.\nLack of marketability discounts are frequently applied in the valuation of non-controlling equity interests in private companies. Although a DLOM differs from a DLOC, they are often linked; that is, if a valuation is on a non-controlling interest basis, a lack of marketability discount is typically appropriate.\nOption-based approaches seek to quantify DLOMs using the right to sell shares as captured by a put option premium. This premium is used to quantify the ability to sell at a given price. As a first step, an at-the-money put option is priced. The put option premium as a percentage of the stock value provides an estimate of the DLOM.\nThe DLOC is 1 – [1/(1 + Control premium)] = 1 – [1/(1 + 0.2)] = 1 – [1/1.2] ≈ 1 – 0.833 = 0.167 = 16.7%. The DLOM is €7.50/€60.00 = 0.125 = 12.5%. The total discount for lack of control and lack of marketability is therefore 1 – [(1 – 0.167) × (1 – 0.125)] ≈ 0.271 = 27.1%.\n(B) Incorrect because in this answer the DLOC and DLOM are simply being added together: 16.7% + 12.5% = 29.2%.\n(C) Incorrect because the control premium is being used as the DLOC. Therefore, the incorrect DLOC is 20%. The DLOM is €7.50/€60.00 = 12.5%. The total discount for lack of control and lack of marketability is therefore 1 – [(1 – 0.200) × (1 – 0.125)] = 0.300 = 30.0%.", "ko": "DLOC = 1 − 1/(1 + 20%) = 16.7%. DLOM = 풋옵션 프리미엄/주가 = 7.50/60 = 12.5%. 총할인 = 1 − (1 − 0.167)(1 − 0.125) = 27.1%.", "trap": "DLOC ≠ control premium. DLOC = 1 − 1/(1 + CP). 총할인 = 1 − (1 − DLOC)(1 − DLOM).", "f": "Total discount = 1 − (1 − DLOC)(1 − DLOM)", "why": {"B": "29.2%는 두 할인을 더한 값(16.7% + 12.5%)입니다. 할인은 곱셈으로 결합.", "C": "30.0% = 1 − (1 − 0.20)(1 − 0.125) — control premium 20%를 DLOC로 그대로 쓴 오류입니다. DLOC는 16.7%."}, "orig": "ECO Module 6 Q48"}, {"id": "ECO-M6-Q32", "src": "ECO 관련유형", "module": 6, "tag": "DLOC = 1 − 1/(1 + control premium)", "vig": 43, "stem": "The discount for lack of control, given the typical control premium indicated by Nenkov, is closest to:", "opts": {"A": "12%.", "B": "23%.", "C": "30%."}, "ans": "B", "en": "(A) Incorrect because it simply is the control premium.\n(B) Correct.\nDiscount for lack of control = 1 – [1/(1+ Control premium)]\n= 1 – [1/(1.30 = 23.1%\n(C) Incorrect because it takes 30% of 40% (0.3 × 0.4 = 0.12) as the answer.", "ko": "DLOC = 1 − 1/1.30 = 23.1%.", "trap": "M6 Q48 오답과 같은 개념.", "f": "DLOC = 1 − 1/(1 + CP)", "why": {"A": "12%(= 30% × 40%)는 control premium에 지분율을 곱한 무의미한 값입니다.", "C": "30%는 control premium 자체입니다. DLOC로 변환해야 합니다."}, "orig": "ECO Module 6 Q32"}, {"id": "ECO-M6-Q49", "src": "ECO 관련유형", "module": 6, "tag": "비상장사 WACC 조정 방향", "vig": null, "stem": "When compared to publicly traded peers, a private company's WACC should be adjusted:", "opts": {"A": "upward when the company has reduced access to debt financing.", "B": "downward when the company is smaller in size relative to its peers.", "C": "downward when the company's management is not experienced in forecasting financial performance."}, "ans": "A", "en": "(A) Correct because reduced debt access may lead a private company to rely more on equity financing, which would tend to increase its WACC.\n(B) Incorrect because WACC estimates should be adjusted upward when a company is smaller than its peers. In assessing private company valuations, size premiums are frequently used, resulting in a small size discount in private company valuations. Using a higher WACC would result in a discounted valuation.\n(C) Incorrect because WACC estimates should be adjusted upward for projection risk. A relative lack of information concerning a private company’s operations or business model compared with that of a similar public company introduces greater uncertainty into projections that may lead to a higher required rate of return.", "ko": "부채조달 접근성이 낮으면 자기자본 의존↑ → WACC 상향 조정.", "trap": "노트: 비상장사 WACC > 최적 WACC.", "f": "", "why": {"B": "규모가 작으면 size premium으로 '상향'.", "C": "예측 경험 부족(projection risk)도 '상향'."}, "orig": "ECO Module 6 Q49"}, {"id": "SCH-R22-11", "module": 6, "tag": "비상장사 특성 – 장기 관점", "stem": "Compared to public firms, private firms are most likely to have:", "opts": {"A": "fewer tax concerns.", "B": "a longer-term focus.", "C": "less managerial ownership."}, "ans": "B", "en": "Private firms can take a longer-term view because their managers/owners do not have to focus on the short-term desires of external shareholders. Private firms are more concerned with taxes. In most private firms, management has substantial ownership.", "ko": "외부 주주의 단기 압력이 없어 장기적 관점 가능.", "why": {"A": "오너에게 미치는 세금 영향 때문에 세금 고려가 '더' 큽니다.", "C": "경영진 지분이 '더' 높습니다."}, "trap": "ECO M6 Q42와 같은 개념.", "f": "", "orig": "Schweser MQ 22.1 Q1", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R22-21", "module": 6, "tag": "인수 시 WACC – target 기준", "stem": "The most appropriate WACC to apply to a private company being acquired is:", "opts": {"A": "the target’s WACC.", "B": "the acquirer’s WACC.", "C": "a weighted average of the target’s and acquirer’s WACC that factors in financing arrangements."}, "ans": "A", "en": "The private target’s WACC should be used. This may be much different than the acquirer’s WACC, given that acquirers are usually larger and more mature than targets.", "ko": "인수 대상 현금흐름의 위험을 반영하는 target의 WACC 사용(매수자 WACC 무관).", "why": {"B": "매수자의 자본비용은 무관합니다.", "C": "가중평균도 아닙니다."}, "trap": "ECO M6 Q18 오답과 같은 개념.", "f": "", "orig": "Schweser MQ 22.2 Q1", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R22-22", "module": 6, "tag": "Build-up method 적용 조건", "stem": "Which of the following models is most appropriate for estimating the discount rate for a private company when there are no comparable public equity firms?", "opts": {"A": "The CAPM.", "B": "The build-up method.", "C": "The expanded CAPM."}, "ans": "B", "en": "If there are no comparable public firms with which to estimate beta, the build-up method can be used, whereby various risk premiums are added to the risk-free rate (it implicitly assumes a beta of one). The CAPM and expanded CAPM require comparable public companies to estimate beta.", "ko": "비교 상장사가 없으면 베타 추정 불가 → build-up(β = 1 암묵 가정).", "why": {"A": "CAPM은 비교 상장사의 베타가 필요합니다.", "C": "Expanded CAPM도 베타가 필요합니다."}, "trap": "ECO M6 Q23·Q29 오답과 연결.", "f": "", "orig": "Schweser MQ 22.2 Q2", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R22-25", "module": 6, "tag": "DLOM 크기 결정요인", "stem": "All else equal, a larger DLOM is most likely to be associated with:", "opts": {"A": "an imminent IPO.", "B": "lower asset risk.", "C": "a smaller pool of buyers."}, "ans": "C", "en": "An IPO will increase liquidity and, thus, decrease the DLOM. Lower asset risk should result in less value uncertainty and a lower DLOM. A smaller pool of buyers would result in reduced liquidity and a higher DLOM.", "ko": "매수자 풀이 작을수록 유동성↓ → DLOM↑.", "why": {"A": "임박한 IPO는 유동성↑ → DLOM↓.", "B": "자산위험↓ → 가치 불확실성↓ → DLOM↓."}, "trap": "", "f": "", "orig": "Schweser MQ 22.2 Q5", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R22-26", "module": 6, "tag": "Control premium → DLOC, DLOM 결합", "stem": "An analyst has been tasked with valuing a minority interest in a private company. Upon examining numerous comparable firms that have been acquired, she determines that a control premium of 18% is present in the acquisition prices. Further, the analyst determines that a discount for lack of marketability (DLOM) of 22% is appropriate for the private company interest. The total adjustment the analyst should make to the value of the comparables when valuing the private company interest is closest to:", "opts": {"A": "33.9%.", "B": "36.0%.", "C": "40.6%."}, "ans": "A", "en": "DLOC = 1 − 1/(1 + 0.18) = 15.25%. Total discount = 1 − (1 − 0.1525)(1 − 0.22) = 33.9%.", "ko": "DLOC = 1 − 1/1.18 = 15.25%. 총할인 = 1 − 0.8475 × 0.78 = 33.9%.", "why": {"B": "36.0% = 1 − (1 − 0.18)(1 − 0.22) — control premium을 DLOC로 그대로 쓴 오류입니다.", "C": "40.6% = 18% + 22% 단순합에 가까운 오류입니다. 할인은 곱셈 결합."}, "trap": "ECO M6 Q48 오답과 같은 함정.", "f": "Total = 1 − (1 − DLOC)(1 − DLOM)", "orig": "Schweser MQ 22.2 Q6", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R22-34", "module": 6, "tag": "재무곤경 기업 – asset-based approach", "stem": "An analyst is valuing the equity of a firm that has been experiencing financial distress for several months. The most appropriate valuation approach that the analyst might use is the:", "opts": {"A": "market approach.", "B": "income approach.", "C": "asset-based approach."}, "ans": "C", "en": "The analyst is most likely to use the asset-based approach, which values a firm as its assets minus liabilities. The firm’s future cash flows are uncertain, and it may have to be liquidated, given its distress.", "ko": "재무곤경 → 미래 현금흐름 불확실·청산 가능 → 자산 − 부채(asset-based).", "why": {"A": "계속기업과의 비교(시장 접근)는 부적절.", "B": "현금흐름이 불확실해 소득 접근은 부적절."}, "trap": "ECO M1 Q21(liquidation value)과 연결.", "f": "", "orig": "Schweser MQ 22.3 Q4", "src": "Schweser MQ", "vig": null}, {"id": "VAR-R22-01", "module": 6, "tag": "DLOC + DLOM 결합", "stem": "A private company valuation uses a control premium of 25% observed in comparable acquisitions and a discount for lack of marketability of 20%. The combined discount for a non-controlling, non-marketable interest is closest to:", "opts": {"A": "36.0%.", "B": "40.0%.", "C": "45.0%."}, "ans": "A", "en": "DLOC = 1 − 1/1.25 = 20%. Total discount = 1 − (1 − 0.20)(1 − 0.20) = 36.0%.", "ko": "DLOC = 1 − 1/1.25 = 20%. 총할인 = 1 − 0.80 × 0.80 = 36%.", "why": {"B": "40%는 DLOC(20%) + DLOM(20%) 단순합입니다. 할인은 곱셈 결합.", "C": "45%는 control premium(25%)을 DLOC로 그대로 더한 오류입니다."}, "trap": "ECO M6 Q48 오답과 같은 2단 함정.", "f": "Total = 1 − (1 − DLOC)(1 − DLOM),  DLOC = 1 − 1/(1 + CP)", "orig": "변형 (ECO M6 Q48, Schweser R22)", "src": "변형", "vig": null}], "vignettes": ["Bruno Santos is an equity analyst with a regional investment bank. Santos reviews the growth prospects and quality of earnings for Phoenix Enterprises, one of the companies he follows. He has developed a stock valuation model for this firm based on its forecasted fundamentals. His revenue growth rate estimate is less than that implied by the market price.\nPhoenix’s financial statements over the past five years show strong performance, with above average growth. Santos has decided to use a lower forecasted growth rate in his models, reflecting the effect of “regression to the mean” over time. He notes two reasons for his lower growth rate forecast:\nReason 1:\nSuccessful companies tend to draw more competition, putting their high profits under pressure.\nReason 2:\nPhoenix’s intellectual property and franchise agreements will be weakening over time.\nSantos meets with Walter Hartmann, a newly hired associate in his department. In their conversation, Hartmann states, “Security analysts forecast company performance using both top-down and bottom-up analysis. I can think of three examples:\nA restaurant chain forecasts its sales to be its market share times forecast industry sales.\nAn electric utility company forecasts that its sales will grow proportional to increases in GDP.\nA retail furniture company forecasts next year’s sales by assuming that the sales in its newly built stores will have similar sales per square meter to that of its existing stores.”\nHartmann is reviewing some possible trades for three stocks in the health care industry based on a pairs-trading strategy. Hartmann’s evaluations are as follows:\nHG Health is 15% overvalued.\nCorgent Cell Sciences is 10% overvalued.\nJohnson Labs is 15% undervalued.", "Sasha Davis, a successful entrepreneur, is preparing for retirement and considering selling off her businesses. She is meeting with Erle Goldsman, an independent valuation consultant, to discuss the process and her options.\nDavis owns 100% of two chains of spas and wellness centers. The spa market can be divided into two segments:\nSmaller operations, typically in urban settings. Clients usually book only one or two services at a time and spend an hour or two at the outlet. Outlets compete on location, price and reputation.\nLarger full-service facilities, that operate in more rural settings. These offer more services than the urban spas and clients typically spend a full day at the facility. Providing good customer service and products are key to success in this market.\nDavis explains: \"I initially owned and operated two full-service spas as a chain under the banner of Davis Spa Days (DSD). The outlets have done well since established ten years ago and the company has a good reputation in the area. I believe in offering an exceptional customer experience supported by a full complement of well-trained staff. Five years ago, a chain of four urban spas became available for sale. Although the chain appeared able to survive for the next 12 months, it was undercapitalized and in financial distress, so I was able to acquire it at a good price. By converting those spas to the Davis banner and adding my management skills I was able to quickly offer, and keep offering, good quality services at industry average prices while keeping costs lower than competitors in this segment.\nGoldsman explains that spas and personal service businesses are usually valued using a multiple of gross revenue model. He makes the following note for his file: Due to the competitive strategies of the two chains, I will be able to apply a higher multiple than the industry average to value both businesses.\nBefore calculating a value for the chain of full-service spas, Goldsman asks Davis about that company's financial performance. \"It seems like the most recent year was very successful, revenue is up 20% but your operating costs are generally the same or lower, can you explain that discrepancy to me?\"\nDavis gives three explanations:\nPeople buy a lot of spa packages as gifts, but not all packages get used on a timely basis, so we changed to recording them as revenue when we are paid.\nSome of the costs we incur maintaining and growing our customer base are really investments in the future, therefore, we started recording one-half of our marketing costs as customer acquisition assets.\nWe did not record any depreciation expense this past year for some of our smaller assets because they are already fully depreciated.", "Brian Dobson, an analyst at UK-based globally diversified equity mutual fund, has been assigned the task of estimating a fair value of the common stock of Charmed Energy. Dobson is aware of several approaches that could be used for this purpose. After carefully considering the characteristics of the company and its competitors, he believes Charmed will have extraordinary growth for the next few years and normal growth thereafter. So, he has concluded that a two-stage DDM is the most appropriate for valuing the stock.\nCharmed pays semi-annual dividends. The total dividends during 2016, 2017, and 2018 have been C$0.114, C$0.15, and C$0.175, respectively. These imply a growth rate of 32% in 2017 and 17% in 2018. Dobson believes that the growth rate will be 14% in the next year. He has estimated that the first stage will include the next eight years.\nDobson is using the CAPM to estimate the required return on equity for Charmed. He has estimated that the company’s beta, as measured against the S&P/TSX Composite Index (formerly TSE 300 Composite Index), is 0.84. The Canadian risk-free rate, as measured by the annual yield on the 10-year government bond, is 4.1%. The equity risk premium for the Canadian market is estimated at 5.5%. Based on these data, Dobson has estimated that the required return on Charmed Energy’s stock is 0.041 + 0.84(0.055) = 0.0872, or 8.72%. Dobson is doing the analysis in January 2019, and the stock price at that time is C$17.\nDobson realizes that even within the two-stage DDM, there could be some variations in the approach. He would like to explore how these variations affect the stock’s valuation. Specifically, he wants to estimate the value of the stock for each of the following approaches separately.\nFirst approach: The dividend growth rate will be 14% throughout the first stage of eight years. The dividend growth rate thereafter will be 7%.\nSecond approach: Instead of using the estimated stable growth rate of 7% in the second stage, Dobson wants to use his estimate that eight years later, Charmed Energy’s stock will be worth 17 times its earnings per share (trailing P/E of 17). He expects that the earnings retention ratio at that time will be 0.70.\nThird approach (H-model): In contrast to the first approach, in which the growth rate declines abruptly from 14% in the eighth year to 7% in the ninth, the growth rate would decline linearly from 14% in the first year to 7% in the ninth.", "Gianna Peters is an investment analyst who focuses on dividend-paying stocks. Peters uses a DCF approach to stock selection. She is meeting with her staff to evaluate portfolio holdings based on a bottom-up screening of stocks listed in the United States and Canada. Peters and her staff begin by reviewing the characteristics of the following portfolio candidates.\nCompany ABC\nA Canadian company in the consumer staples sector with a required rate of return of 7.35%. Recent media reports suggest that ABC might be a takeover candidate. Peters and her team estimate that if the incumbent Canadian prime minister’s party retains its power, the company’s current annual dividend of C$0.65 per share will grow 12% a year for the next four years and then stabilize at a 3.5% growth rate a year indefinitely. If a new government takes office in Canada, however, then the team estimates that ABC will likely not experience the elevated 12% short-run growth because of new regulatory and tax changes, and instead it will grow by 3.5% indefinitely.\nCompany XYZ\nA mid-sized US company in the utilities sector with a required rate of return of 10%. Peters and her team believe that because of a recent restructuring, the company is unlikely to pay dividends for the next three years. The team expects XYZ to pay an annual dividend of US$1.72 per share beginning four years from now, however. Thereafter, the dividend is expected to grow indefinitely at 4% even though the current price implies a growth rate of 6% during this same period.\nCompany JZY\nA large US company in the telecom sector with a required rate of return of 8%. The stock is currently trading at US$32.76 per share with an implied earnings growth rate of 5.3%. Peters believes that because JZY is mature and has a stable capital structure, the company will grow at its sustainable growth rate. Over the past 10 years, the company’s return on equity (ROE) has averaged 8.17% and its payout ratio has averaged 40%. Recently, the company paid an annual dividend of US$0.84 per share.\nPeters asks a newly hired analyst, Kurt Thomas, to comment on the evaluation approach for these three stocks. Thomas makes the following statements:\nStatement 1: A free cash flow valuation model would not be appropriate to evaluate Company ABC if the firm becomes a takeover candidate.\nStatement 2: A dividend discount model cannot be applied to Company XYZ if dividends are suspended for a few years.\nStatement 3: A dividend discount model is suitable for evaluating the stock of Company JZY because of the historically consistent payout ratio.\nPeters then asks the team to examine the growth opportunities of three Canadian stocks currently held in the portfolio. These stocks are listed in Exhibit 1. Peters believes that the stocks are fairly valued.\nExhibit 1\nSelected Stock Characteristics\nStock\tRequired Rate of Return\tNext Year’s Forecasted EPS (C$)\tCurrent Price per Share (C$)\nABTD\t10.5%\t7.30\t80.00\nBKKQ\t8.0%\t2.12\t39.00\nCPMN\t12.0%\t1.90\t27.39", "Jacob Daniel is the chief investment officer at a US pension fund sponsor, and Steven Rae is an analyst for the pension fund who follows consumer/non-cyclical stocks. At the beginning of 20X9, Daniel asks Rae to value the equity of Tasty Foods Company for its possible inclusion in the list of approved investments. Tasty Foods Company is involved in the production of frozen foods that are sold under its own brand name to retailers.\nRae is considering whether a dividend discount model would be appropriate for valuing Tasty Foods. He has compiled the information in the following table for the company’s EPS and DPS during the last five years. The quarterly dividends paid by the company have been added to arrive at the annual dividends. Rae has also computed the dividend payout ratio for each year as DPS/EPS and the growth rates in EPS and DPS.\nYear\tEPS ($)\tDPS ($)\tPayout Ratio\tGrowth in EPS (%)\tGrowth in DPS (%)\n20X8\t2.12\t0.59\t0.278\t2.9\t3.5\n20X7\t2.06\t0.57\t0.277\t2.5\t5.6\n20X6\t2.01\t0.54\t0.269\t6.3\t5.9\n20X5\t1.89\t0.51\t0.270\t6.2\t6.3\n20X4\t1.78\t0.48\t0.270\nRae notes that the company’s EPS has been increasing at an average rate of 4.48% per year. The dividend payout ratio has remained fairly stable, and dividends have increased at an average rate of 5.30%. In view of a history of dividend payments by the company and the understandable relationship dividend policy bears to the company’s earnings, Rae concludes that the DDM is appropriate to value the equity of Tasty Foods. Further, he expects the company’s moderate growth rate to persist and decides to use the Gordon growth model.\nRae uses the CAPM to compute the return on equity. He uses the annual yield of 4% on the 10-year Treasury bond as the risk-free return. He estimates the expected US equity risk premium, with the S&P 500 Index used as a proxy for the market, to be 6.5% per year. The estimated beta of Tasty Foods against the S&P 500 Index is 1.10. Accordingly, Rae’s estimate for the required return on equity for Tasty Foods is 0.04 + 1.10(0.065) = 0.1115, or 11.15%.\nUsing the past growth rate in dividends of 5.30% as his estimate of the future growth rate in dividends, Rae computes the value of Tasty Foods stock. He shows his analysis to Alex Renteria, his colleague at the pension fund who specializes in the frozen foods industry. Renteria concurs with the valuation approach used by Rae but disagrees with the future growth rate he used. Renteria believes that the stock’s current price of $8.42 is the fair value of the stock.", "BJL Financial provides clients with professional investment management services that are tailored to the specific needs of each client. The firm’s portfolio manager, Angelique Kwaza, has called a meeting with the senior analyst, Samira Khan, to discuss the quarterly rebalancing of three client portfolios. The valuation model used in the analyses is the discounted dividend model.\nClient 1 has a portfolio with significant exposure to dividend-paying stocks.\nClient 2 is interested in including preferred stock in the portfolio.\nClient 3 has a growth-oriented equity-only portfolio.\nKhan has identified two utilities (ABC and XYZ) for possible inclusion in Client 1’s portfolio, as shown in Exhibit 1. She uses a discount rate of 7% for both common stocks.\nExhibit 1\nCandidate Stocks for Client 1\nStock\tCompany Description\nABC\nABC is a publicly traded utility with an expected constant growth rate for earnings and dividends of 3.5%.\nThe most recent year’s dividend payout is 70%. The expected dividend payout in future years is 60%.\nThe common stock price is $14.49 per share.\nXYZ\nXYZ is a publicly traded utility with several unregulated business subsidiaries.\nThe company generates 3% growth in dividends and has an annual dividend payout of 80%. No changes in dividend growth or payout are expected.\nThe common stock price is $10 per share.\nThe current year earnings are $0.45 per share, and next year’s earnings are expected to be $0.50 per share.\nKwaza asks Khan to investigate the most appropriate models for valuing utility companies. She tells Khan about the following points mentioned in various research reports on the utilities sector.\nReport 1: A resurgence in domestic manufacturing activity will generate long-term growth in earnings and dividends that exceeds the cost of equity.\nReport 2: Share repurchases are expected to increase. The report expresses confidence in the forecasts regarding the magnitude and timing of these repurchases.\nReport 3: The report forecasts earnings growth of 4.5%. The key growth drivers are increases in population and business creation associated with stable GDP growth of 2.75%.\nFor Client 2’s portfolio, Khan has identified the non-callable perpetual preferred stocks of Standard Company and Main Company.\nThe Standard Company’s preferred stock pays 2.75% on a par value of $100. Khan believes it to be fairly valued at a market price of $49.60.\nThe perpetual preferred stock of Main Company has a par value of $50 per share and pays an annual dividend of 5.5%. Khan estimates a capitalization rate at 6%. The current market price of Main Company preferred stock is $42.\nFinally, Khan has identified three stocks, shown in Exhibit 2, as likely candidates for Client 3’s portfolio.\nExhibit 2\nCandidate Stocks for Client 3\nStock\tCompany Description\nBIOK\nBIOK is a profitable biotech firm that currently pays an annual dividend of $1.20 per share.\nThe current annual dividend growth rate is 15%.\nPatent protection runs out in eight years, after which dividend growth will likely decline at a steady rate over three years before stabilizing at a mature growth rate.\nCCAX\nCCAX builds communication software for state and federal prisons and detention facilities.\nThe company is expected to hold its cash dividends steady at $0.56 per share for six years as it builds out facilities and acquires properties.\nDividends are expected to grow at the nominal GDP growth rate after the next six years.\nHLTV\nHLTV is a health care equipment and services firm that is expected to maintain a stable dividend payout ratio.\nEarnings are forecast to grow over the next two years by 27% annually.\nAfter that, earnings will likely grow by 12% annually for another 10 years before stabilizing at a mature growth rate.", "June Withers is analyzing four stocks in the processed food industry as of 31 December 2019. All stocks pay a dividend at the end of each year.\nUkon Corporation\nWithers estimates a required rate of return for Ukon Corporation of 8% and notes that the dividend for 2019 was EUR 2.315 per share. Her first valuation approach is a basic two-stage DDM, with dividends growing at a rate of 5% from 2020 through 2023, after which time dividends will grow at a sustainable rate of 3%. Her second valuation approach is the H-model, assuming that dividend growth of 5% in 2020 declines linearly during the years 2021 through 2023 to the 3% growth rate after 2023. Exhibit 1 summarizes Withers’s dividend growth assumptions.\nExhibit 1\nUkon Corporation Dividend Growth Assumptions, by Model\nModel\tPeriod\tRate\nTwo-stage DDM\t2020 through 2023\t5%\nBeginning 2024\t3%\nH-model\t2020\t5%\n2021 through 2023\tDeclining linearly to 3.5%\nBeginning 2024\t3%\nVenus Company\nWithers has assembled the data on Venus Company in Exhibit 2. After analyzing competitive pressures and financial conditions in the industry, she predicts that Venus Company will lose market share because of new entrants but will stabilize within a few years. The required rate of return for Venus Company is 8%. Beginning with a per-share dividend of USD3.15 in 2019, she develops two scenarios regarding Venus Company’s dividend growth. The scenarios, shown in Exhibit 2, are summarized as follows:\nIn Scenario 1, the growth rate will fall in a linear manner over the years 2020 through 2023 from 8% to 4%. Using the H-model, Withers calculates a value of USD58.79 per share of Venus Company stock.\nIn Scenario 2, the growth rate falls from 8% in 2019 to 6% in 2020 and 2021, to 5% in 2022 and 2023, and then to a sustainable rate of 3% for 2024 and beyond.\nExhibit 2\nVenus Company Dividend Growth Scenarios\nScenario\tPeriod\tRate\nScenario 1\t2020 through 2023\tDeclining linearly to 4%\nBeginning 2024\tRemaining stable at 4%\nScenario 2\t2020 and 2021\t6%\n2022 and 2023\t5%\nBeginning 2024\tRemaining stable at 3%\nWakuni Corporation\nWithers evaluates Wakuni Corporation and uses recent financial data from Exhibit 3 to calculate a sustainable growth based on the DuPont model. In addition to this estimate, she performs a sensitivity analysis on the sustainable growth rate whereby the dividend payout ranges from 0% to 10% and the return on equity ranges from 8% to 12%.\nExhibit 3\nSelected Data for Wakuni Corporation (JPY billions)\nNet income\t43,923\nSales\t423,474\nTotal assets, average during year\t486,203\nShareholders’ equity, beginning of year\t397,925\nDividends paid\t1,518\nXavier Corporation\nIn her analysis of the stock of Xavier Corporation, Withers observes that it has a dividend of USD2 per share and a stock price of USD52. Two analyst interns have offered estimates of the company’s required rate of return and dividend growth rate, as shown in Exhibit 4.\nExhibit 4\nXavier Corporation Required Rate of Return and Dividend Growth Rates (Estimates)\n \tIntern 1\tIntern 2\nRequired rate of return\t8.3%\t7.8%\nGrowth rate, first four years\t5.0%\t4.8%\nGrowth rate, beyond first four years\t3.6%\t4.0%", "Susan Miller is an analyst for a global equity mutual fund. The fund is well-diversified and holds both dividend-paying and non-dividend-paying shares. She is evaluating three of the fund's holdings.\nOne holding is Canada-based Aster, a profitable non-dividend-paying company that is viewed by the market as an acquisition target. Miller expects Aster's level of corporate debt to change significantly over time. Because Aster reports a number of items through other comprehensive income, its net income does not always fully reflect underlying economic conditions. Miller considers the type of model she should use to value Aster.\nA second holding, UK-based Camelia, currently pays an annual dividend of £2.30 per share. Dividends are initially expected to grow at an annual rate of 10%, but then decline linearly during an 8-year period to a final and perpetual annual growth rate of 5%. Camelia's required return on equity is 9.25%. Miller uses the H-model to value Camelia.\nA third holding, France-based Dahlia, is in a mature growth phase. Dahlia has a dividend payout ratio of 45%, a return on assets of 7.50%, and an equity multiplier of 1.25. Upon further analysis, Miller concludes that Dahlia is over valued.", "Dong Tian is an equity analyst whose required ROE is 10%. He evaluates the stocks of several companies.\nCompany A\nTian wants to value Company A using a suitable DCF model. His forecasts on Company A are presented in Exhibit 1. Tian assumes that there are no capital issuances or repayments during his forecast period.\nExhibit 1\nYear\tDividend Payout Ratio\tEarnings ($ millions)\tOperating Cash Flow ($ millions)\tCapital Expenditure ($ millions)\n1\t30%\t81.90\t125.00\t100.00\n2\t25%\t83.76\t131.25\t120.00\n3\t20%\t85.32\t137.81\t144.00\n4\t15%\t86.52\t144.70\t172.80\n5\t5%\t87.23\t151.94\t207.36\nCompany C\nCompany C has just paid out an annual dividend of $2 per share. Tian expects dividends from Company C to grow at 5% annually in perpetuity and calculates the fair value of the stock of Company C using the Gordon growth model.\nCompany D\nCompany D just ended the year with earnings per share of $3 and its stock trades at $40 per share. Tian expects Company D's earnings to grow at 10% next year and calculates the present value of growth opportunities reflected in its share price.\nCompany E\nCompany E has just declared an annual dividend of $1 per share. Tian expects the company to have a dividend growth rate of 20% every year for the next 10 years and thereafter grow dividends at 8% per year in perpetuity. He calculates the fair value of Company E's stock using the H-model.", "Ellen Chau, an analyst with a regional investment broker, is researching Strongsville Metal & Glass Industries (SMGI). The company specializes in preparing scrap metal and glass for recycling. It buys surplus metal and glass from equipment manufacturers, construction companies, and a local network of individual suppliers. The company sorts and shreds the metals and crushes the glass and then packages the materials for resale.\nChau presents the following company analysis (Exhibit 1) to Robert Simms, her immediate supervisor. Chau is bullish on SMGI, but Simms is not convinced and asks her to do some additional work on the report.\nExhibit 1 Excerpt from Draft Report on SMGI\nChau's Operational Analysis of SMGI\nFollowing more than a decade of mediocre financial results, SMGI has benefited from the improved economic environment in recent years. Scrap metal and glass is, well, scrap metal and glass. There is nothing particularly unique about it. Therefore, rather than emphasizing marketing, the company has taken strong preemptive steps to contain its costs of operations, introducing fuel hedging as well as the acquisition of more efficient machinery, both of which are improving its profitability. These actions should allow SMGI to price its products at or near the industry averages.\nExhibits 2 and 3 detail selected financial and market information for SMGI and its industry.\nExhibit 2 SMGI and Industry Average Selected Financial Information for the Fiscal Year Ended 30 June 2014\n \tSMGI\tIndustry Average\nReturn on assets\t10.60%\t11.00%\nReturn on equity\t18.40%\t16.00%\nNet profit margin\t4.30%\t4.10%\nEarnings per share (EPS) 2014\t$2.45\tn/a*\nForecast EPS for fiscal year ended June 2015\t$2.84\tn/a*\n* n/a indicates not applicable\nExhibit 3 Market Data for SMGI and Industry Average, 30 June 2014\n \tSMGI\tIndustry Average\nMarket price\t$29.64\tn/a*\nBeta (relative to S&P 500)\t1.35\t1.1\nRequired return on equity (CAPM)\t14.60%\t12.1%\nRisk-free rate\t5.00%\n* n/a = not applicable\nChau sums up her case for recommending a “Buy” rating on SMGI shares by noting three of the company’s strengths:\nStrength 1: SMGI uses less financial leverage than the average company in its industry.\nStrength 2: SMGI uses assets more efficiently than the average company in its industry.\nStrength 3: SMGI’s return on equity (ROE) exceeds the required return on equity calculated using the capital asset pricing model (CAPM).\nSimms is not convinced and prepares some alternate assumptions relating SMGI’s valuation. He believes that SMGI’s current price builds in overly optimistic expectations regarding its growth prospects. He agrees with Chau’s 2014 EPS number (see Exhibit 2) but disagrees with her earnings forecast for 2015 and later years. Simms believes that earnings growth in 2015 and 2016 will be 20% each year and then will drop sharply as a result of intense industry rivalry. Simms expects earnings growth beyond 2016 to be only 2% per year. Simms also assumes that SMGI will have a dividend payout ratio of 40% for the foreseeable future. Finally, using a different determination of beta than Chau, he estimates that the required rate of return on the company’s equity is 16.0%.", "Gregory Armishaw is an equity analyst specializing in the food and beverage industry at Fulsom-Wagner Investment Counsel in Minneapolis, Minnesota. In late January 2014, he became aware of a new salt substitute, SansSalt, that was developed by a local company, Vitality FoodGroup, Inc. (VFG).\nWith the continuing concern over health matters arising from excessive salt use, Armishaw believes that the addition of this product line could be quite beneficial to VFG. He uses the data in Exhibit 1 to calculate the value of VFG using (1) the residual income model and (2) the H-model version of the dividend discount model.\nExhibit 1 Vitality FoodGroup Selected Information for Valuation, 31 December 2013\nNet income\t$422 million\nCommon stock (par plus paid-in-excess of par)\t$1,075 million\nRetained earnings\t$1,078 million\nWeighted average cost of capital\t11.9%\nCost of debt, before tax\t7.0%\nCost of equity capital\t15%\nExpected dividend growth behavior:\nExpected for 2014\t14%\nAfter 2014, dividend growth rate declines linearly over a 6 year period\nThe final and perpetual growth rate:\t5%\nEstimated earnings per share (EPS) in 2019\t$5.04\nDividend payout ratio\t40%\nShares outstanding\t150 million\nArmishaw shows his report to Anthony Stack, Fulsom-Wagner’s senior portfolio manager and Armishaw’s reporting official. In the H-model calculation, Stack notices that Armishaw assumes a sustainable growth rate of 5% following the period of high growth. Stack asks Armishaw if it is true that the sustainable growth model assumes the company will require\nAssumption 1: external debt financing,\nAssumption 2: external equity financing, and\nAssumption 3: improving return on equity.\nStill concerned with the estimate of growth after 2019, Stack asks Armishaw what the present value of growth opportunities (PVGO) will be in 2019 when the perpetual growth period begins.\nArmishaw next presents Exhibit 2, which contains the basis for his estimates for the share price (as of 15 January 2014) if he assumes a terminal value in 2023 arising from treating 2023’s residual income as a perpetuity.\nExhibit 2 Vitality FoodGroup Basis for Terminal Value and Revised Price Estimate, 15 January 2014\nForecasted residual income (RI) per share at end of 2023\t$5.32\nEstimated return on equity (ROE) in 2023\t20%\nNature of stream beyond 2023\tPerpetuity\nGrowth rate beyond 2023\t0%\nCost of equity\t15%\nDividend payout\t40%\nStack questions Armishaw’s assumption in his 2014 valuation (Exhibit 2) that a perpetuity would best describe the terminal value of the stream and suggests that residual income should fade over time. Stack further suggests that a persistence factor of 0.50 might be appropriate.\nStack tells Armishaw that he prefers the use of a residual income model to value the company over other available methods. He provides three justifications for his preference:\nThe model explicitly incorporates the cost of debt capital.\nThe model can be used when cash flows are unpredictable.\nThere is less of an impact arising from the uncertainty in forecasting terminal value.", "D’Shaun Jackson, an individual do-it-yourself investor, is reviewing retail companies for potential addition to his portfolio. The first company he considers is Discount Days Ltd. (DDL) an up-and-coming regional competitor in the dollar store segment. Jackson’s analysis shows that the company is profitable and has strong positive operating cash flows. While the company is working to expand the number of stores in its network, investing cash flows are exceeding operating cash flows. To date, the company has not paid dividends, but Jackson believes it will likely start once it has finished its expansion plans. Jackson decides to use a dividend discount model to value the shares and estimates that DDL will start paying an annual dividend of $0.50 per share at the end of year 4 with a modest growth rate of 2% per year. He uses the capital asset pricing model to estimate a cost of equity of 7.25%.\nNext, Jackson looks at a stock that has caught his eye due to its high current dividend and high growth rate. He summarizes the information he has gathered about the stock (Exhibit 1). He expects the growth rate to decline consistently over the next six years and decides to use the H-model to estimate a value for the stock.\nExhibit 1 Information About High Growth Stock\nCurrent dividend\t$2.00\nGrowth rate expected years 1–6\t8%\nGrowth rate expected after year 6\t4%\nRequired rate of return\t12%\nJackson has been researching how to value shares using a dividend growth model if the transition from one growth rate to a lower one is gradual. In that scenario, he understands he would use the H-model to evaluate the shares. If, however, the difference in growth rates is large, or the length of the high growth rate is extraordinarily long, then he would have to use a spreadsheet model instead.", "Mary Barton is a junior equity analyst for an investment company. She is currently working on a large US-based equity fund.\nThe large US-based fund uses discount models to estimate the value of stock prices. For this fund, a difference in price of $1 or more between the market and estimated prices indicates that the shares are mispriced for the fund’s investment purposes. The fund is allowed to take either long or short positions in shares identified as misvalued. Barton’s manager, George Eckhart, asks her to evaluate the stocks of two companies for possible inclusion in that fund: XRail Company (XRL) and Z-Tarp Limited (ZTL). Selected data for the stocks are shown in Exhibit 1.\nExhibit 1 Selected Stock Data for XRL and ZTL and Additional Market Information\n \tXRL\tZTL\n \tEPS ($)\tDPS ($)\tEPS ($)\tDPS ($)\nMost Recent Year\t3.15\t1.77\t5.62\t2.53\n1 Year Prior\t3.08\t1.52\t4.98\t2.24\n2 Years Prior\t2.99\t1.36\t4.73\t2.13\n3 Years Prior\t2.77\t1.21\t4.5\t2.02\n4 Years Prior\t2.52\t0.9\t4.2\t1.89\nCurrent market price\t$77.23\t---\t$93.05\t---\nReturn on assets\t27.40%\t---\t25.80%\t---\nReturn on common equity\t31.60%\t---\t32.80%\t---\nBeta\t0.94\t---\t1.2\t---\nRequired rate of return on common equity\t8.84%\t---\t10.48%\t---\nAdditional Information\nRisk-free rate\t2.94%\nEquity risk premium for common shares\t6.28%\nUS economy real growth rate\t3.70%\nUS inflation rate\t2.00%\nNote: DPS is dividends per share, and EPS is earnings per share.\nBarton begins her analysis by looking at XRL. After doing some research, she concludes that a reasonable growth estimate for the company is the sustainable growth rate using the most recent year’s retention ratio and calculates a price for XRL using this information. She makes the following note:\nIt will not be possible to use the Gordon growth model for the analysis of XRL.\nBarton and Eckhart discuss the impact of a company’s growth rate on its future stock price. Barton determines XRL’s growth rate of earnings for the period from 4 Years Prior to the Most Recent Year and compares it with the current nominal growth rate of the US economy. She concludes that XRL is likely to be in the transition stage of growth.\nNext, Eckhart asks Barton to calculate the intrinsic value of ZTL shares using the Gordon growth model to determine whether it meets the fund’s investment objectives. He suggests that rather than using the sustainable growth rate, she should use the growth rate of dividends over the past five years.\nEckhart tells Barton that he has heard rumors that ZTL is contemplating selling one of its major manufacturing facilities. If that should happen, he believes that the company would pay a series of special dividends in each of the three years following the sale. Barton asks him how she could best incorporate such a possibility into the valuation of the shares.", "Yandie Izzo manages a dividend growth strategy for a large asset management firm. Izzo meets with her investment team to discuss potential investments in three companies: Company A, Company B, and Company C. Statements of cash flow for the three companies are presented in Exhibit 1.\nExhibit 1\nStatements of Cash Flow, Most Recent Fiscal Year End (Amounts in Millions of Dollars)\n \tCompany A\tCompany B\tCompany C\nCash Flow from Operating Activities\nNet Income\t4,844\t1,212\t15,409\nAdjustments\nDepreciation\t500\t288\t3,746\nOther noncash expenses\t1,000\t—\t—\nChanges in working capital\n(Increase) Decrease accounts receivable\t(452)\t(150)\t(536)\n(Increase) Decrease inventories\t—\t(200)\t(803)\nIncrease (Decrease) accounts payable\t(210)\t100\t(3)\nIncrease (Decrease) other current liabilities\t540\t14\t350\nNet cash from operating activities\t6,222\t1,264\t18,163\nCash Flow from Investing Activities\n(Purchase) Sale of fixed assets\t2,379\t(1,000)\t(3,463)\nNet cash from investing activities\t2,379\t(1,000)\t(3,463)\nCash Flow from Financing Activities\nIncrease (Decrease) notes payable\t25\t3000\t1,238\nIncrease (Decrease) long-term debt\t(1,500)\t(1,000)\t(1,379)\nPayment of common stock dividends\t(1,000)\t(237)\t(15,000)\nNet cash from financing activities\t(2,475)\t1,763\t(15,141)\nNet change in cash and cash equivalents\t6,126\t2,027\t(441)\nCash and equivalents at beginning of year\t50\t100\t3,000\nCash and equivalents at end of year\t6,176\t2,127\t2,559\nSupplemental Cash Flow Disclosures\nInterest\t(353)\t(50)\t(552)\nIncome taxes\t(1,605)\t(648)\t(3,787)\nIzzo’s team first discusses key characteristics of Company A. The company has a history of paying modest dividends relative to FCFE, has a stable capital structure, and is owned by a controlling investor.\nThe team also considers the impact of Company A’s three noncash transactions in the most recent year on its FCFE, including the following:\nTransaction 1: A $900 million loss on a sale of equipment\nTransaction 2: An impairment of intangibles of $400 million\nTransaction 3: A $300 million reversal of a previously recorded restructuring charge\nIn addition, Company A’s annual report indicates that the firm expects to incur additional noncash charges related to restructuring over the next few years.\nTo value the three companies’ shares, one team member suggests valuing the companies’ shares using net income as a proxy for FCFE. Another team member proposes forecasting FCFE using a sales-based methodology based on the following equation:\nFCFE = NI – (1 – DR)(FCInv – Dep) – (1 – DR)(WCInv).\nIzzo’s team ultimately decides to use actual free cash flow to value the three companies’ shares. Selected data and assumptions are provided in Exhibit 2.\nExhibit 2\nSupplemental Data and Valuation Assumptions\n \tCompany A\tCompany B\tCompany C\nTax rate\t35%\t35%\t30%\nBeta\t1.00\t0.90\t1.10\nBefore-tax cost of debt\t6%\t7%\t6%\nTarget debt ratio\t50%\t30%\t40%\nMarket data:\nRisk-free rate: 3%\nMarket risk premium: 7%\nThe team calculates the intrinsic value of Company B using a two-stage FCFE model. FCFE growth rates for the first four years are estimated at 10%, 9%, 8%, and 7%, respectively, before declining to a constant 6% starting in the fifth year.\nTo calculate the intrinsic value of Company C’s equity, the team uses the FCFF approach assuming a single-stage model where FCFF is expected to grow at 5% indefinitely.", "Ryan Leigh is preparing a presentation that analyzes the valuation of the common stock of two companies under consideration as additions to his firm’s recommended list, Emerald Corporation and Holt Corporation. Leigh has prepared preliminary valuations of both companies using an FCFE model and is also preparing a value estimate for Emerald using a dividend discount model. Holt’s 2019 and 2020 financial statements, contained in Exhibit 1 and Exhibit 2, are prepared in accordance with US GAAP.\nExhibit 1\nHolt Corporation Consolidated Balance Sheets (US$ Millions)\n \t \t \tAs of 31 December\n \t \t \t2020\t \t \t \t2019\nAssets\nCurrent assets\nCash and cash equivalents\t \t \t$ 372\t \t \t \t$ 315\nAccounts receivable\t \t \t770\t \t \t \t711\nInventories\t \t \t846\t \t \t \t780\nTotal current assets\t \t \t1,988\t \t \t \t1,806\nGross fixed assets\t4,275\t \t \t \t3,752\nLess: Accumulated depreciation\t1,176\t \t3,099\t \t906\t \t2,846\nTotal assets\t \t \t$5,087\t \t \t \t$4,652\nLiabilities and shareholders’ equity\nCurrent liabilities\nAccounts payable\t \t \t$ 476\t \t \t \t$ 443\nAccrued taxes and expenses\t \t \t149\t \t \t \t114\nNotes payable\t \t \t465\t \t \t \t450\nTotal current liabilities\t \t \t1,090\t \t \t \t1,007\nLong-term debt\t \t \t1,575\t \t \t \t1,515\nCommon stock\t \t \t525\t \t \t \t525\nRetained earnings\t \t \t1,897\t \t \t \t1,605\nTotal liabilities and shareholders’ equity\t \t \t$5,087\t \t \t \t$4,652\nExhibit 2\nHolt Corporation Consolidated Income Statement for the Year Ended 31 December 2020 (US$ Millions)\nTotal revenues\t$3,323\nCost of goods sold\t1,287\nSelling, general, and administrative expenses\t858\nEarnings before interest, taxes, depreciation, and amortization (EBITDA)\t1,178\nDepreciation expense\t270\nOperating income\t908\nInterest expense\t195\nPretax income\t713\nIncome tax (at 32%)\t228\nNet income\t$ 485\nLeigh presents his valuations of the common stock of Emerald and Holt to his supervisor, Alice Smith. Smith has the following questions and comments:\n“I estimate that Emerald’s long-term expected dividend payout rate is 20% and its return on equity is 10% over the long term.”\n“Why did you use an FCFE model to value Holt’s common stock? Can you use a DDM instead?”\n“How did Holt’s FCFE for 2008 compare with its FCFF for the same year? I recommend you use an FCFF model to value Holt’s common stock instead of using an FCFE model because Holt has had a history of leverage changes in the past.”\n“In the last three years, about 5% of Holt’s growth in FCFE has come from decreases in inventory.”\nLeigh responds to each of Smith’s points as follows:\n“I will use your estimates and calculate Emerald’s long-term, sustainable dividend growth rate.”\n“There are two reasons why I used the FCFE model to value Holt’s common stock instead of using a DDM. The first reason is that Holt’s dividends have differed significantly from its capacity to pay dividends. The second reason is that Holt is a takeover target and once the company is taken over, the new owners will have discretion over the uses of free cash flow.”\n“I will calculate Holt’s FCFF for 2020 and estimate the value of Holt’s common stock using an FCFF model.”\n“Holt is a growing company. In forecasting either Holt’s FCFE or FCFF growth rates, I will not consider decreases in inventory to be a long-term source of growth.”", "Gurmeet Singh, an equity portfolio manager at a wealth management company, meets with junior research analyst Cindy Ho to discuss potential investments in three companies: Sienna Limited, Colanari Manufacturing, and Bern Pharmaceutical.\nSingh and Ho review key financial data from Sienna’s most recent annual report, which are presented in Exhibit 1 and Exhibit 2, to assess the company’s ability to generate free cash flow.\nExhibit 1\nSelected Data from Sienna Limited’s Statement of Income for the Year Ended 31 December 2019 (Amounts in Millions of Euros)\nEBITDA\t4,000\nDepreciation expense\t800\nOperating income (EBIT)\t3,200\nInterest expense\t440\nTax rate\t35%\nExhibit 2\nSienna Limited’s Statement of Cash Flows for the Year Ended 31 December 2019 (Amounts in Millions of Euros)\nCash flow from operations\nNet income\t1,794\nPlus: Depreciation\t800\nIncrease in accounts receivable\t(2,000)\nIncrease in inventory\t(200)\nIncrease in accounts payable\t1,000\nCash flow from operations\t1,394\nCash flow from investing activities\nPurchases of PP&E\t(1,000)\nCash flow from financing activities\nBorrowing (repayment)\t500\nTotal cash flow\t894\nSingh and Ho also discuss the impact of dividends, share repurchases, and leverage on Sienna’s free cash flow. Ho tells Singh the following:\nStatement 1:\nChanges in leverage do not impact free cash flow to equity.\nStatement 2:\nTransactions between the company and its shareholders, such as the payment of dividends or share repurchases, do affect free cash flow.\nSingh and Ho next analyze Colanari. Last year, Colanari had FCFF of €140 million. Singh instructs Ho to perform an FCFF sensitivity analysis of Colanari’s firm value using the three sets of estimates presented in Exhibit 3. In her analysis, Ho assumes a tax rate of 35% and a stable capital structure of 30% debt and 70% equity.\nExhibit 3\nSensitivity Analysis for Colanari Valuation\nVariable\tBase-Case Estimate\tLow Estimate\tHigh Estimate\nFCFF growth rate\t4.6%\t4.2%\t5.0%\nBefore-tax cost of debt\t4.9%\t3.9%\t5.9%\nCost of equity\t11.0%\t10.0%\t12.0%\nFinally, Singh and Ho analyze Bern. Selected financial information on Bern is presented in Exhibit 4.\nExhibit 4\nSelected Financial Data on Bern Pharmaceutical\n \tMarket Value\tRequired Return\nDebt\t€15,400 million\t6.0%\nPreferred stock\t€4,000 million\t5.5%\nCommon stock\t€18,100 million\t11.0%\nFCFF, most recent year\t€3,226 million\nCorporate tax rate\t26.9%\nSingh notes that Bern has two new drugs that are currently in clinical trials awaiting regulatory approval. In addition to its operating assets, Bern owns a parcel of land from a decommissioned manufacturing facility with a current market value of €50 million that is being held for investment. Singh and Ho elect to value Bern under two scenarios:\nScenario 1:\nValue Bern assuming the two new drugs receive regulatory approval. In this scenario, FCFF is forecast to grow at 4.5% into perpetuity.\nScenario 2:\nValue Bern assuming the two new drugs do not receive regulatory approval. In this scenario, FCFF is forecast using a stable growth in FCFF of 1.5% for the next three years and then 0.75% thereafter into perpetuity.", "Juan Porto is an equity analyst preparing a research report for retail clients. He is valuing two Spanish publicly traded companies, Barco S.A. and Vela S.A. Both companies report under IFRS.\nPorto chooses the FCFF approach to value Barco’s shares. He summarizes Barco’s financial information (in EUR millions) for the most recent year in Exhibit 1.\nExhibit 1\nNet income\t2,542\nNet non-cash charges\t432\nInterest expense after taxes\t650\nInvestment in working capital\t532\nInvestment in fixed capital\t896\nNet borrowing\t1,035\nPorto estimates the value of a Barco share using a single-stage FCFF model with a discount rate of 8%, and an annual growth rate of 4%. He projects Barco’s FCFF for next year to be EUR 3,360 million. Barco has 512 million of outstanding shares and EUR 16,840 million of debt outstanding.\nPorto compiles information about Vela’s capital structure in Exhibit 2. Vela’s effective tax rate is 25%.\nExhibit 2\n \tWeight\tRequired Return\nDebt\t30%\t4.0% (before tax)\nPreferred stock\t10%\t7.0%\nCommon stock\t60%\t10.0%\nTotal\t100%\t---\nWhen analyzing Vela’s cash flows, Porto notices that the company repurchased common shares during the most recent year. He considers the effect of this transaction on Vela’s FCFE.", "Magnus Nilsen is an equity analyst valuing the shares of Laksgård asa, a Norwegian company that uses sustainable fish farming practices to produce salmon and generates revenue from the global sale of its production.\nNilsen decides to use the FCFF model rather than the FCFE for the following reasons:\nReason 1: FCFF is a simpler and more direct valuation approach than FCFE.\nReason 2: The target debt/equity ratio is expected to remain consistent for the foreseeable future.\nReason 3: Laksgård has announced a series of preferred share issues that will take place over the next five years.\nHe computes Laksgård's FCFF for the most recent year which amounts to NOK 2.1 billion. Nilsen expects the FCFF to grow at a stable growth rate of 3.7%. Laksgård has a WACC of 12.5%, outstanding debt of NOK 11.7 billion and preferred stock of NOK 1.8 billion. Using this information, Nilsen calculates the value of Laksgård's total common equity.\nNilsen realizes he has not considered the following ESG points in his analysis and wonders how they will affect his previously calculated value.\nLaksgård correctly anticipated the costly containment regulations recently imposed on the industry. Compared to its competitors, the company's future costs of compliance will be significantly lower.\nThe risk associated with farmed salmon escaping and contaminating the wild population has been over estimated. Escapes will be less likely under the new containment regulations and recent studies show the wild salmon are not threatened by the non-native breeds raised by Laksgård.\nAt the industry level, Nilsen notes that the demand for sustainably farmed fish is likely to outpace the population growth through 2055 when the global population is expected to peak. He decides to further refine his FCFF model to separate out the following stages:\nStage 1: Rapid growth for the first 3 years\nStage 2: Declining growth at a lower rate for the next 3 years\nStage 3: Stable growth thereafter", "Daniel Pegham is a mergers and acquisitions analyst currently advising Horzak Digital, a privately owned, rapidly growing satellite dish manufacturer that reports in USD.\nPegham wants to use FCFE to value the company and recalls that some peers have used EBITDA as a proxy for FCFE. He concludes that EBITDA is not a good proxy for Horzak’s FCFE for two reasons. First, EBITDA fails to account for cash flows from new borrowings. Second, EBITDA understates cash flows for growth companies such as Horzak.\nInstead, Pegham uses the indirect method to calculate FCFE, starting with Horzak’s previous year’s net income. Horzak had two unusual noncash items in the previous year: a USD 5 million after-tax reversal of noncash restructuring charges taken in the previous year, and a USD 2 million after-tax gain.\nHorzak is entirely family-owned, and the president is the largest shareholder. Horzak is subject to a 30% tax rate. Pegham determines that, in the event of a takeover, his valuation should reflect two additional adjustments to normalize net income.\nBoard compensation was USD 1,500,000 in the previous year, compared to USD 800,000 at comparable companies.\nHorzak has had free use of storage facilities owned by the company’s president for warehousing inventory. This benefit would otherwise have cost USD 150,000 in the previous year.\nLastly, Pegham evaluates Horzak using the capitalized cash flow method under the following assumptions.\nNormalized FCFE in the current period (FCFE0) is USD 4.0 million.\nThe long-term growth rate of FCFE is 5%.\nThe market value of debt is USD 6.6 million.\nThe cost of equity is 17.5%.", "Minneapolis Viking Arbitrageurs, LLC (MVA), is a fledgling US-based hedge fund having slightly more than $50 million in assets under management. MVA specializes in owning and managing small-sized properties in agriculture, forestry, and mining.\nJim Hester, MVA’s merger and acquisition (M&A) analyst is evaluating Fargo Durum Farms, Inc. (FDF) for a potential acquisition. FDF owns 1,500 acres of fertile land, farm buildings, machinery, residential quarters, livestock, cattle feed, seeds, grain, significant amounts of intangible assets, and so on. Selected data from FDF’s income statement for the previous year ended and additional estimates compiled by Hester are presented in Exhibits 1 and 2.\nExhibit 1 FDF’s Select Financial Data for the Previous Year Ended\nGross revenues from crops, livestock, feed, and so on\t$2,500,000\nCost of goods sold\t1,000,000\nSelling, general, and administrative expenses (SG&A)\t900,000\nDepreciation and amortization\t200,000\nTax rate\t30%\nNotes:\n1) FDF carries debt in the amount of $750,000 at an interest rate of 8%, and it comprises 30% of total assets on a book value basis. Debt will be a part of the acquisition transaction.\n2) FDF holds $200,000 in cash and short-term investments, but it will not be a part of the assets under acquisition transaction.\nExhibit 2 Additional Data and Hester’s Estimates for Normalization\n1.\tThe cost of goods sold ratio should be higher at 45%.\n2.\tSG&A includes $400,000 in owners’ compensation. According to Hester’s research, owners’ compensation expense for similar sized farms is $200,000.\n3.\tA ranch and living quarters are not required for the farm’s core operations. The reported SG&A expenses include $100,000 for operating expenses relating to those properties. The ranch and living quarters will be kept by the current owners and are not a part of FDF’s farming operations being considered for purchase by the hedge fund.\n4.\tFor pro forma estimations, Hester will consider depreciation and amortization at 10% of gross revenues. He thinks the current tax rate of 30% is reasonable.\nFirst, Hester assesses FDF’s normalized operating income after tax. Next, Hester values FDF’s equity starting with the free cash flow to the firm (FCFF) with the data and assumptions in Exhibit 3.\nExhibit 3 FDF’s Data and Estimates for Valuing Its Equity\nFCFF for Current Year\t$336,250\nFCFF annual growth rate for the foreseeable future\t5%\nFDF’s debt holding at an interest rate of 8.0% per year\t$750,000\nFDF’s weighted average cost of capital (WACC)\t11.50%\nFDF’s cost of equity\t14.00%\nHester presents his initial assessment and valuation of FDF to MVA’s investment committee. The following are comments and suggestions from some members on the committee.\nXavier Moreno, commodities analyst, suggests the use of the excess earnings method (EEM) for valuing FDF and makes the following three statements in support of his preference:\nStatement 1: EEM involves estimating the earnings remaining before deducting amounts that reflect the required returns to the tangible assets.\nStatement 2: EEM is a widely-used method for valuing entire private businesses similar to FDF.\nStatement 3: EEM is especially useful for valuing FDF because it allows for valuing working capital, fixed assets, and intangibles using different discount rates.\nJamal Bahrami, the external consultant on the committee, differs from Hester and prefers the use of the free cash flow to equity (FCFE) model. Furthermore, he develops his own estimates for valuing FDF's equity, shown in Exhibit 4.\nExhibit 4 Bahrami’s Estimates for Valuing FDF’s Equity\n1.\tIn current year, FDF will:\nrealize $1,000,000 in cash flow from operations.\nrequire $400,000 in new capital investment.\nneed additional borrowing in the amount of $250,000 at an interest cost of 8%.\n2.\tBecause of the continued strength in the global demand for wheat, FDF will experience a higher annual growth rate of 10% for the following year; thereafter, it will grow at a constant rate of 6% per year.\n3.\tBecause of illiquidity and small-firm risk premiums, the appropriate WACC and required return on equity will be higher at 12.9% and 16%, respectively.", "Chan Mei Yee is valuing McLaughlin Corporation common shares using a free cash flow approach. Yee gathered information about McLaughlin from several sources. She begins her analysis by determining free cash flow to the firm (FCFF) and free cash flow to equity (FCFE) for the 2012 fiscal year, using the financial statements in Exhibits 1 and 2. McLaughlin’s fiscal year ends 31 December.\nExhibit 1 McLaughlin Corporation Selected Financial Data ($ millions, except per share amounts)\nFor Year Ending 31 December\t2012\nRevenues\t$6,456\nEarnings before interest, taxes, depreciation, and amortization (EBITDA)\t1,349\nDepreciation expense\t243\nOperating income\t1,106\nInterest expense\t186\nPretax income\t920\nIncome tax (32%)\t294\nNet income\t$626\nNumber of outstanding shares (millions)\t411\n2012 earnings per share\t$1.52\n2012 dividends paid (millions)\t148\n2012 dividends per share\t0.36\n2012 fixed capital investment (millions)\t535\nCost of equity\t12.0%\nWeighted average cost of capital (WACC)\t9.0%\nExhibit 2 McLaughlin Corporation Consolidated Balance Sheets ($ millions)\n \tas of 31 December\n2012\t2011\nAssets\nCash and cash equivalents\t$32\t$21\nAccounts receivable\t413\t417\nInventories\t709\t638\nOther current assets\t136\t123\nTotal current assets\t$1,290\t$1,199\nCurrent liabilities\t$2,783\t$2,678\nLong-term debt\t2,249\t2,449\nCommon stockholders' equity\t1,072\t594\nTotal liabilities and stockholders' equity\t$6,104\t$5,721\nYee plans to perform two different valuations of McLaughlin, which she calls the “base case” valuation and the “alternative” valuation. Critical assumptions for each are given in the following lists.\nBase case valuation\n2013 FCFF will be $600 million.\nBeyond 2013, FCFF will grow in perpetuity at 4% annually.\nThe market value and book value of McLaughlin’s long-term debt are approximately equal.\nAlternative valuation\n2013 earnings per share (EPS) will be $1.80.\nEPS will grow forever at 6% annually.\nFor 2013 and beyond:\nNet capital expenditures (fixed capital expenditures minus depreciation) will be 30% of EPS.\nInvestments in working capital will be 10% of EPS.\nOf future investments, 60% will be financed with equity and 40% will be financed with debt.\nYee is also concerned about the effects on McLaughlin’s 2013 FCFE of the following three possible financial actions by McLaughlin during the year 2013:\nAction 1: Increasing common stock cash dividends by $110 million\nAction 2: Repurchasing $60 million of common shares\nAction 3: Reducing its outstanding long-term debt by $100 million\nMelissa Nicosia, Yee’s supervisor, reviews McLaughlin’s valuations. Specifically, Nicosia makes the following three statements:\nStatement 1: The free cash flow valuation approach is superior to the discounted dividend valuation approach because the company’s dividends have been substantially different from its FCFE.\nStatement 2: Because the company’s capital structure seems unstable, the FCFE valuation approach is superior to the FCFF valuation approach.\nStatement 3: If there is a change in control at McLaughlin, the discounted dividend valuation approach would be superior to a free cash flow valuation approach.", "Mark Cannan is updating research reports on two well-established consumer companies before first quarter 2021 earnings reports are released. His supervisor, Sharolyn Ritter, has asked Cannan to use market-based valuations when updating the reports.\nDelite Beverage is a manufacturer and distributor of soft drinks and recently acquired a major water bottling company in order to offer a broader product line. The acquisition will have a significant impact on Delite’s future results.\nYou Fix It is a US retail distributor of products for home improvement, primarily for those consumers who choose to do the work themselves. The home improvement industry is cyclical; the industry was adversely affected by the recent downturn in the economy, the level of foreclosures, and slow home sales. Although sales and earnings at You Fix It weakened, same store sales are beginning to improve as consumers undertake more home improvement projects. Poor performing stores were closed, resulting in significant restructuring charges in 2020.\nBefore approving Cannan’s work, Ritter wants to discuss the calculations and choices of ratios used in the valuation of Delite and You Fix It. The data used by Cannan in his analysis are summarized in Exhibit 1.\nExhibit 1\nSelect Financial Data for Delite Beverage and You Fix It\n \tDelite Beverage\tYou Fix It\n2020 earnings per share (EPS)\t$3.44\t$1.77\n2021 estimated EPS\t$3.50\t$1.99\nBook value per share end of year\t$62.05\t$11.64\nCurrent share price\t$65.50\t$37.23\nSales (billions)\t$32.13\t$67.44\nFree cash flow per share\t$2.68\t$0.21\nShares outstanding end of year\t2,322,034,000\t1,638,821,000\nCannan advises Ritter that he is considering three different approaches to value the shares of You Fix It:\nApproach 1:\nPrice-to-book ratio (P/B)\nApproach 2:\nPrice-to-earnings ratio (P/E) using trailing earnings\nApproach 3:\nPrice-to-earnings ratio using normalized earnings\nCannan tells Ritter that he calculated the price-to-sales ratio (P/S) for You Fix It but chose not to use it in the valuation of the shares. Cannan states to Ritter that it is more appropriate to use the P/E than the P/S because\nReason 1:\nEarnings are more stable than sales.\nReason 2:\nEarnings are less easily manipulated than sales.\nReason 3:\nThe P/E reflects financial leverage, whereas the P/S does not.\nCannan also informs Ritter that he did not use a price-to-cash-flow multiple in valuing the shares of Delite or You Fix It. The reason is that he could not identify a cash flow measure that would both account for working capital and noncash revenues and be after interest expense and thus not be mismatched with share price. Ritter advises Cannan that such a cash flow measure does exist.\nRitter provides Cannan with financial data on three close competitors as well as the overall beverage sector, which includes other competitors, in Exhibit 2. She asks Cannan to determine, based on the P/E-to-growth (PEG) ratio, whether Delite shares are overvalued, fairly valued, or undervalued.\nExhibit 2\nBeverage Sector Data\n \tForward P/E\tEarnings Growth\nDelite\t—\t12.41%\nFresh Iced Tea Company\t16.59\t9.52%\nNonutter Soda\t15.64\t11.94%\nTasty Root Beer\t44.10\t20%\nBeverage sector average\t16.40\t10.80%\nAfter providing Ritter his answer, Cannan is concerned about the inclusion of Tasty Root Beer in the comparables analysis. Specifically, Cannan says to Ritter:\n“I feel we should mitigate the effect of large outliers but not the impact of small outliers (i.e., those close to zero) when calculating the beverage sector P/E. What measure of central tendency would you suggest we use to address this concern?”\nRitter requests that Cannan incorporate their discussion points before submitting the reports for final approval.", "Andrea Risso is a junior analyst with AquistareFianco, an independent equity research firm. Risso’s supervisor asks her to update, as of 1 January 2020, a quarterly research report for Centralino S.p.A., a telecommunications company headquartered in Italy. On that date, Centralino’s common share price is €50 and its preferred shares trade for €5.25 per share.\nRisso gathers information on Centralino. Exhibit 1 presents earnings and dividend data, and Exhibit 2 presents balance sheet data. Net sales were €3.182 billion in 2019. Risso estimates a required return of 15% for Centralino and forecasts growth in dividends of 6% into perpetuity.\nExhibit 1\nEarnings and Dividends for Centralino, 2016–2020\n \t2016\t2017\t2018\t2019\t2020(E)\nEarnings per share (EPS, €)\t4.93\t5.25\t4.46\t5.64\t6.00\nDividends per share (DPS, €)\t2.45\t2.60\t2.60\t2.75\t2.91\nReturn on equity (ROE)\t13.01%\t13.71%\t11.58%\t14.21%\t14.96%\nNote: The data for 2016–2019 are actual and for 2020 are estimated.\nExhibit 2\nSummary Balance Sheet for Centralino, Year Ended 31 December 2019\nAssets (€ millions)\t \t \tLiabilities and Shareholders’ Equity (€ millions)\nCash and cash equivalents\t102\t \tCurrent liabilities\t259\nAccounts receivable\t305\t \tLong-term debt\t367\nInventory\t333\t \tTotal liabilities\t626\nTotal current assets\t740\t \tPreferred shares\t80\nProperty and equipment, net\t913\t \tCommon shares\t826\nTotal assets\t1,653\t \tRetained earnings\t121\n \t \t \tTotal shareholders’ equity\t1,027\n \t \t \tTotal liabilities and shareholders’ equity\t1,653\nNotes: The market value of long-term debt is equal to its book value. Shares outstanding are 41.94 million common shares and 16.00 million preferred shares.\nExhibit 3 presents forward price-to-earnings ratios (P/Es) for Centralino’s peer group. Risso assumes no differences in fundamentals among the peer-group companies.\nExhibit 3\nPeer Group Forward P/Es\nCompany\tForward P/E\nBrinaregalo\t5.9\nCamporio\t8.3\nEsperto\t3.0\nFornodissione\t15.0\nRadoresto\t4.6\nRisso also wants to calculate normalized EPS using the average return on equity method. She determines that the 2016–19 time period in Exhibit 1 represents a full business cycle for Centralino.", "Cátia Pinho is a supervisor in the equity research division of Suite Securities. Pinho asks Flávia Silveira, a junior analyst, to complete an analysis of Adesivo S.A., Enviado S.A., and Gesticular S.A.\nPinho directs Silveira to use a valuation metric that would allow for a meaningful ranking of relative value of the three companies’ shares. Exhibit 1 provides selected financial information for the three companies.\nExhibit 1\nSelected Financial Information for Adesivo, Enviado, and Gesticular (Brazilian Real, BRL)\n \tAdesivo\tEnviado\tGesticular\nStock’s current price\t14.72\t72.20\t132.16\nDiluted EPS (last four quarters)\t0.81\t2.92\t–0.05\nDiluted EPS (next four quarters)\t0.91\t3.10\t2.85\nDividend rate (annualized most recent dividend)\t0.44\t1.24\t0.00\nSilveira reviews underlying trailing EPS for Adesivo. Adesivo has basic trailing EPS of BRL0.84. Silveira finds the following note in Adesivo’s financial statements:\n“On a per share basis, Adesivo incurred in the last four quarters\ni. from a lawsuit, a nonrecurring gain of BRL0.04; and\nii. from factory integration, a nonrecurring cost of BRL0.03 and a recurring cost of BRL0.01 in increased depreciation.”\nSilveira notes that Adesivo is forecasted to pay semiannual dividends of BRL0.24 next year. Silveira estimates five-year earnings growth rates for the three companies, which are presented in Exhibit 2.\nExhibit 2\nEarnings Growth Rate Estimates over Five Years\nCompany\tEarnings Growth Rate Estimate (%)\nAdesivo\t16.67\nEnviado\t21.91\nGesticular\t32.33\nPinho asks Silveira about the possible use of the price-to-sales ratio (P/S) in assessing the relative value of the three companies. Silveira tells Pinho:\nStatement 1:\nThe P/S is not affected by revenue recognition practices.\nStatement 2:\nThe P/S is less subject to distortion from expense accounting than is the P/E.\nPinho asks Silveira about using the Fed and Yardeni models to assess the value of the equity market. Silveira states:\nStatement 3:\nThe Fed model concludes that the market is undervalued when the market’s current earnings yield is greater than the 10-year Treasury bond yield.\nStatement 4:\nThe Yardeni model includes the consensus five-year earnings growth rate forecast for the market index.\nSilveira also analyzes the three companies using the enterprising value (EV)-to-EBITDA multiple. Silveira notes that the EBITDA for Gesticular for the most recent year is BRL560 million and gathers other selected information on Gesticular, which is presented in Exhibit 3.\nExhibit 3\nSelected Information on Gesticular at Year End (BRL Millions)\nMarket Value of Debt\tMarket Value of Common Equity\tMarket Value of Preferred Equity\tCash\tShort-Term Investments\n1,733\t6,766\t275\t581\t495\nPinho asks Silveira about the use of momentum indicators in assessing the shares of the three companies. Silveira states:\nStatement 5:\nRelative-strength indicators compare an equity’s performance during a period with the performance of some group of equities or its own past performance.\nStatement 6:\nIn
