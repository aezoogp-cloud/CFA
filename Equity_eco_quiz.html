<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Equity Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand">
    <h1>Equity 오답 퀴즈<span>CFA Level II, Schweser 기준</span></h1>
    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>
  </div>
  <div class="progress"><i id="pbar"></i></div>
  <div class="ptext"><span id="ptxt">0 / 0</span><span id="pmode"></span></div>
</div></header>
<main class="wrap">
  <div class="tools">
    <button class="btn" id="bHome">처음 화면</button>
    <button class="btn" id="bResult">결과 보기</button>
    <button class="btn" id="bExport">결과 내보내기</button>
    <button class="btn" id="bImport">결과 불러오기</button>
    <input type="file" id="fImport" accept=".json,application/json" hidden>
  </div>
  <div id="view"></div>
</main>
<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q9", "src": "ECO 오답", "module": 1, "tag": "Implied growth vs 합리적 성장률", "vig": 0, "stem": "Based on Santos’s revenue growth rate estimate, the shares of Phoenix are most likely:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "C", "en": "C is correct. If the revenue growth rate inferred by the market price exceeds the growth rate that the firm could reasonably expect, Santos should conclude that the market price is too high and thus that the firm is overvalued.", "ko": "시장가격에 내재된(implied) 매출성장률이 회사가 합리적으로 달성할 수 있는 성장률(Santos의 더 낮은 추정치)보다 높으면, 시장이 과도한 성장을 가격에 반영한 것 → 주가가 너무 높음 → overvalued.", "trap": "'시장이 기대하는 성장 > 내가 보는 성장' = 비싸다.", "f": "Implied g (from price) > Estimated g ⇒ Overvalued", "why": {"A": "방향 반대. 시장 내재 성장률 > 내 추정 성장률이면 '고평가'입니다. 저평가는 시장 내재 성장률이 더 낮을 때.", "B": "두 성장률이 같을 때만 적정가치입니다. Santos는 더 낮은 성장률을 쓰기로 했습니다."}, "orig": "ECO Module 1 Q9"}, {"id": "ECO-M1-Q21", "src": "ECO 오답", "module": 1, "tag": "가치 개념 – Liquidation value (재무곤경)", "vig": 1, "stem": "The price Davis paid for the chain of four urban spas was most likely based on its:", "opts": {"A": "liquidation value.", "B": "fair market value.", "C": "going-concern value."}, "ans": "A", "en": "(A) Correct because the group was in financial distress and seemed to be lacking the value added by assets working together and by human capital. Davis was able to add that value after she took over, via her management skills and by converting to the Davis banner. Therefore, the valuation was most likely based on a liquidation value.\n(B) Incorrect because FMV is the price at which an asset (or liability) would change hands between a willing buyer and a willing seller when the former is not under any compulsion to buy and the latter is not under any compulsion to sell. Because the urban group was in financial distress it is likely the seller was not completely willing and potentially was under a compulsion to sell.\n(C) Incorrect because a going concern assumption may not be appropriate for a company in financial distress as the chain of urban spas was at that time. Also, the chain should be able to survive for the next 12 months which does not constitute a going concern issue. In estimating value, a going-concern assumption is the assumption that the company will continue its business activities into the foreseeable future.", "ko": "인수 당시 도시형 spa 체인은 재무곤경 상태로, 자산이 함께 작동해 만드는 부가가치(조직·인적자본)가 결여되어 있었습니다 → going concern 가정이 부적절 → 가격은 liquidation value 기준이었을 가능성이 높음.", "trap": "'financial distress, 자산이 따로 노는 상태' → liquidation value.", "f": "", "why": {"B": "Fair market value는 정보를 가진 자발적 매수·매도자 간 공정 거래가격입니다. 재무곤경 매물의 가격 근거로 보기 어렵습니다.", "C": "Going-concern value는 계속기업을 전제합니다. 재무곤경 상태라 해당 가정이 부적절합니다."}, "orig": "ECO Module 1 Q21"}, {"id": "ECO-M1-Q30", "src": "ECO 오답", "module": 1, "tag": "Conglomerate discount", "vig": null, "stem": "Conglomerates often trade at:", "opts": {"A": "a discount because the capital allocation between segments does not maximize overall shareholder value.", "B": "fair market value because the conglomerate operates in multiple unrelated businesses.", "C": "a premium because poorly performing conglomerates expand by acquiring unrelated businesses."}, "ans": "A", "en": "(A) Correct because explanations for the conglomerate discount include inefficiency of internal capital markets, i.e., companies’ allocation of investment capital among divisions does not maximize overall shareholder value.\n(B) Incorrect because the market applies a discount to the stock of a company operating in multiple, unrelated businesses compared to the stock of companies with narrower focuses.\n(C) Incorrect because the market applies a discount to the stock of a company operating in multiple, unrelated businesses compared to the stock of companies with narrower focuses. Another explanation for the conglomerate discount includes endogenous factors, i.e., poorly performing companies tend to expand by making acquisitions in unrelated businesses.", "ko": "복합기업(conglomerate)은 흔히 부분합보다 할인되어 거래됩니다. 이유: ① 사업부 간 자본배분이 주주가치를 극대화하지 못함(내부 자본시장 비효율) ② 저성과 기업이 무관한 사업을 인수해 확장하는 경향(내생성) ③ 측정 오류.", "trap": "선지 C의 내용(저성과 기업의 무관한 인수) 자체는 사실이지만 결론(premium)이 틀림.", "f": "", "why": {"B": "시장은 여러 무관한 사업을 영위하는 회사에 '할인'을 적용합니다. 적정가치가 아닙니다.", "C": "저성과 기업이 무관한 사업을 인수한다는 것은 '할인'의 설명 요인이지 프리미엄의 근거가 아닙니다."}, "orig": "ECO Module 1 Q30"}, {"id": "ECO-M1-Q31", "src": "ECO 오답", "module": 1, "tag": "가치 개념 – Intrinsic value (상장주식)", "vig": null, "stem": "For an analyst valuing public equities, the most relevant concept of value is:", "opts": {"A": "intrinsic value.", "B": "liquidation value.", "C": "fair market value."}, "ans": "A", "en": "(A) Correct because for an analyst valuing public equities, intrinsic value is typically the relevant concept of value. Intrinsic value of any asset is the value of the asset given a hypothetically complete understanding of the asset’s investment characteristics.\n(B) Incorrect because this is the value if the company is dissolved and its assets are sold individually.\n(C) Incorrect because for an analyst valuing public equities, intrinsic value is typically the relevant concept of value. While in the long run intrinsic value is expected to converge to fair market value, the active investment manager hopes to capture a positive alpha as a result of his or her efforts to estimate intrinsic value.", "ko": "상장주식을 분석하는 애널리스트에게 가장 관련 있는 가치 개념은 intrinsic value(내재가치). 장기적으로 내재가치는 fair market value로 수렴한다고 보지만, 액티브 매니저는 내재가치 추정으로 알파를 추구합니다.", "trap": "", "f": "", "why": {"B": "Liquidation value는 회사를 해산해 자산을 개별 매각할 때의 가치로 계속기업 상장사 분석과 맞지 않습니다.", "C": "Fair market value는 거래가격 개념(주로 세무·법률 목적)입니다. 상장주식 액티브 분석의 기준은 intrinsic value."}, "orig": "ECO Module 1 Q31"}, {"id": "SCH-R17-02", "module": 1, "tag": "가치 개념 – Liquidation value", "stem": "For a company for which the going-concern assumption is not valid, the most appropriate valuation approach would be to calculate its:", "opts": {"A": "residual income model value.", "B": "dividend discount model value.", "C": "liquidation value."}, "ans": "C", "en": "The liquidation value is the estimate of what the assets of the firm will bring when sold separately, net of the company’s liabilities. It is most appropriate when the firm is not a going concern and will not pay dividends. The residual income model is based on the going concern assumption.", "ko": "계속기업 가정이 성립하지 않으면 자산을 개별 매각해 부채를 갚은 가치 = liquidation value.", "why": {"A": "RI 모형은 계속기업 가정에 기반합니다.", "B": "DDM도 계속 배당을 전제합니다."}, "trap": "ECO M1 Q21과 같은 개념.", "f": "", "orig": "Schweser MQ 17.1 Q2", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R17-07", "module": 1, "tag": "가치 개념 – Investment value (시너지)", "stem": "Sun Pharma is a large pharmaceutical company based in Sri Lanka that manufactures prescription drugs under license from large multinational pharmaceutical companies. Delenga Mahamurthy, CEO of Sun Pharma, is evaluating a potential acquisition of Island Cookware, a small manufacturing company that produces cooking utensils. Mahamurthy feels that Sun Pharma’s excellent distribution network could add value to Island Cookware. Sun Pharma plans to acquire Island Cookware for cash.\nSun Pharma’s most appropriate valuation for Island Cookware is its:", "opts": {"A": "sum-of-the-parts value.", "B": "investment value.", "C": "liquidation value."}, "ans": "B", "en": "The appropriate valuation for Sun Pharma’s acquisition is the investment value, which incorporates the value of any synergies present in the acquisition. Sum-of-the-parts value is not applicable, and liquidation value is not relevant as Sun Pharma does not intend to liquidate.", "ko": "특정 매수자에게의 가치(시너지 포함) = investment value.", "why": {"A": "사업부별 분리 평가가 필요한 상황이 아닙니다.", "C": "청산 의도가 없습니다."}, "trap": "Investment value = 특정 매수자 관점(시너지 포함) / Fair market value = 일반적 매수·매도자.", "f": "", "orig": "Schweser MQ 17.1 Q7", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R17-08", "module": 1, "tag": "Conglomerate discount", "stem": "Sun Pharma, a large pharmaceutical company, acquires Island Cookware, a small manufacturer of cooking utensils, at market price. Upon announcement of the merger, the market price of Sun Pharma drops. This is most likely a result of the:", "opts": {"A": "unrelated business effect.", "B": "tax effect.", "C": "conglomerate discount."}, "ans": "C", "en": "Upon announcement of the acquisition, the market price of Sun Pharma should not change if the acquisition was at fair value. However, the market is valuing the whole company at a value less than the value of its parts: this is a conglomerate discount. There is no defined “unrelated business effect.”", "ko": "공정가 인수라면 주가가 변하지 않아야 하는데 하락 → 시장이 전체를 부분합보다 낮게 평가 = conglomerate discount.", "why": {"A": "'unrelated business effect'라는 정의된 개념은 없습니다.", "B": "세금 효과에 대한 정보가 없습니다."}, "trap": "ECO M1 Q30과 같은 개념.", "f": "", "orig": "Schweser MQ 17.1 Q8", "src": "Schweser MQ", "vig": null}, {"id": "ECO-M2-Q5", "src": "ECO 오답", "module": 2, "tag": "H-model 가치평가", "vig": 2, "stem": "Based on the third approach (the H-model), the stock is:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "C", "en": "C is correct. Using the H-model,\n,\nwhere\nD0 = 0.175\nr = 0.0872\nH = 4\ngS = 0.14\ngL = 0.07\nV0 =\n.\nThe market price is C$17, which is greater than C$13.7355. So, the stock is overvalued in the market.", "ko": "H-model: V0 = D0(1+gL)/(r−gL) + D0·H·(gS−gL)/(r−gL). D0 = 0.175, r = 8.72%, gS = 14%, gL = 7%, H = 8/2 = 4 → V0 = 0.175×1.07/0.0172 + 0.175×4×0.07/0.0172 = 10.89 + 2.85 = C$13.74 < 시장가 C$17 → overvalued.", "trap": "H = 고성장 '감소 기간'의 절반(8년 → 4). 첫 항은 D0(1+gL), 두 번째 항은 D0(gS−gL)·H — (1+g) 붙이지 않음.", "f": "V0 = [D0(1+gL) + D0·H·(gS−gL)] / (r − gL),  H = t/2", "why": {"A": "계산가치(13.74)가 시장가(17)보다 낮으므로 저평가가 아니라 고평가입니다.", "B": "가치와 가격 차이가 C$3.26으로 큽니다."}, "orig": "ECO Module 2 Q5"}, {"id": "ECO-M2-Q6", "src": "ECO 오답", "module": 2, "tag": "고성장 기간 연장의 효과", "vig": 2, "stem": "Dobson is wondering what the consequences would be if the duration of the first stage was assumed to be 11 years instead of 8, with all the other assumptions and estimates remaining the same. Considering this change, which of the following is true?", "opts": {"A": "In the second approach, the proportion of the total value of the stock represented by the second stage would not change.", "B": "The total value estimated using the third approach would increase.", "C": "Using this new assumption and the first approach will lead Dobson to conclude that the stock is overvalued."}, "ans": "B", "en": "B is correct. If the extraordinary growth rate of 14% is expected to continue for a longer duration, the stock’s value would increase. Choice A is false because given that the first stage is longer (11 years instead of 8), the terminal value is being calculated at a later point in time. So, its present value would be smaller. Moreover, the first stage has more years and contributes more to the total value. Overall, the proportion contributed by the second stage would be smaller. Choice C is false because the intrinsic value of the stock would be higher and the appropriate conclusion would be that the stock would be undervalued to a greater extent based on the first approach.", "ko": "14% 초과성장이 8년 → 11년으로 길어지면 H-model(세 번째 접근)의 H가 커져 가치가 증가합니다.", "trap": "초과성장 기간↑ → 가치↑, 2단계(terminal) 비중↓.", "f": "H = (초과성장 기간)/2", "why": {"A": "1단계가 길어지면 terminal value가 더 늦은 시점에 계산되어 PV가 작아지고, 1단계 기여는 커집니다 → 2단계 비중은 '감소'합니다.", "C": "가치가 커지므로 첫 번째 접근에서는 '더 크게 저평가'되었다는 결론이 됩니다(고평가 아님)."}, "orig": "ECO Module 2 Q6"}, {"id": "ECO-M2-Q7", "src": "ECO 오답", "module": 2, "tag": "DDM 적합성 판단", "vig": 3, "stem": "Which of the following statements made by Thomas is correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "C is correct. A dividend discount model is especially useful when dividend policy bears an understandable and consistent relationship to the company’s profitability. The relatively consistent dividend payout ratio suggests Company JZY would be a suitable candidate for a dividend discount model.", "ko": "Statement 3이 맞습니다: 배당정책이 수익성과 이해 가능하고 일관된 관계(안정적 payout)를 가질 때 DDM이 특히 유용합니다.", "trap": "DDM 적합: 배당 지급 이력 + 배당과 이익의 일관된 관계 + 비지배(noncontrol) 관점.", "f": "", "why": {"A": "Statement 1 오류: 인수 대상(takeover candidate)이면 지배 관점이므로 오히려 FCF 모형이 '적합'합니다.", "B": "Statement 2 오류: 배당이 몇 년 중단되어도 재개 시점과 이후 배당을 예측하면 DDM 적용이 가능합니다."}, "orig": "ECO Module 2 Q7"}, {"id": "ECO-M2-Q15", "src": "ECO 오답", "module": 2, "tag": "PVGO – P/E의 성장 성분 (PVGO/E1)", "vig": 3, "stem": "Based on Exhibit 1, the growth component of the leading P/E is largest for:", "opts": {"A": "ABTD.", "B": "BKKQ.", "C": "CPMN."}, "ans": "C", "en": "C is correct. The leading P/E is calculated as follows:\nP0/E1 = [1/r] + [PVGO/E1],\nwhere 1/r captures the no-growth component of P/E and PVGO/E1 captures the growth component of the P/E.\nPVGO is computed as follows:\nPVGO (ABTD) = P0 – E1/r = 80.00 – [7.30/0.105] = C$10.48\nPVGO (BKKQ) = P0 – E1/r = 39.00 – [2.12/0.08] = C$12.50\nPVGO (CPMN) = P0 – E1/r = 27.39 – [1.90/0.12] = C$11.56\nwhere P0 is the current price per share, E1 is the forecasted earnings per share, and r is the required rate of return.\nThe growth component of the P/E for each stock [PVGO/E1] is as follows:\nABTD: 10.48/7.30 = 1.44×\nBKKQ: 12.50/2.12 = 5.90×\nCPMN: 11.56/1.90 = 6.08×", "ko": "Leading P/E = 1/r + PVGO/E1. 성장 성분 = PVGO/E1. PVGO = P0 − E1/r: ABTD 10.48, BKKQ 12.50, CPMN 11.56. 성장 성분: ABTD 1.44×, BKKQ 5.90×, CPMN 6.08× → CPMN 최대.", "trap": "PVGO(금액) 최대 ≠ P/E 성장성분(PVGO/E1) 최대. 질문이 무엇을 묻는지 확인.", "f": "P0/E1 = 1/r + PVGO/E1,  PVGO = P0 − E1/r", "why": {"A": "ABTD는 PVGO/E1 = 1.44×로 가장 작습니다.", "B": "PVGO '금액'은 BKKQ가 가장 크지만(12.50), 질문은 P/E의 성장 성분(PVGO/E1)입니다."}, "orig": "ECO Module 2 Q15"}, {"id": "ECO-M2-Q21", "src": "ECO 오답", "module": 2, "tag": "Gordon growth – 적정가격이면 자본이득률 = g", "vig": 4, "stem": "If Renteria is correct that the current price of Tasty Foods stock is its fair value, what is the expected capital gains yield on the stock?", "opts": {"A": "3.87%.", "B": "4.25%.", "C": "5.30%."}, "ans": "A", "en": "A is correct. If the stock is fairly priced in the market as per the Gordon growth model, the stock price is expected to increase at g, the expected growth rate in dividends. The implied growth rate in dividends, if price is the fair value, is 3.87%. Therefore, the expected capital gains yield is 3.87%.", "ko": "GGM에서 주가가 적정가치면 주가는 g로 성장 → 기대 자본이득률 = g. 시장가에 내재된 g: 8.42 = 0.59(1+g)/(0.1115−g) → g = (8.42×0.1115 − 0.59)/(8.42+0.59) = 3.87%.", "trap": "GGM: 총수익률 = 배당수익률(D1/P0) + 자본이득률(g).", "f": "g = (P0·r − D0)/(P0 + D0),  r = D1/P0 + g", "why": {"B": "4.25%는 내재 g 계산과 맞지 않는 값입니다. 정확한 내재 g는 3.87%.", "C": "5.30%는 Rae가 쓴 과거 배당성장률입니다. Renteria는 현재가가 적정가라고 보므로 가격에 내재된 g를 써야 합니다."}, "orig": "ECO Module 2 Q21"}, {"id": "ECO-M2-Q24", "src": "ECO 오답", "module": 2, "tag": "Gordon growth model 적용 조건", "vig": 5, "stem": "Which sector report best describes a situation in which the Gordon growth model could be used to value utility stocks?", "opts": {"A": "Report 1", "B": "Report 2", "C": "Report 3"}, "ans": "B", "en": "B is correct because the Gordon growth model can accurately value companies that are repurchasing shares when the analyst can appropriately adjust the dividend growth rate for the impact of share repurchases.", "ko": "Report 2: 자사주매입 규모·시기를 신뢰성 있게 예측할 수 있다면, 애널리스트가 배당성장률을 자사주매입 효과에 맞게 조정하여 GGM을 쓸 수 있습니다.", "trap": "GGM 전제: g < r, g는 장기 지속 가능(대체로 명목 GDP 성장 이하).", "f": "V0 = D1/(r − g),  g < r", "why": {"A": "Report 1: 성장률이 자기자본비용을 초과(g > r)하면 GGM이 성립하지 않습니다(분모 음수).", "C": "Report 3: 4.5% 이익성장이 장기 GDP 성장(2.75%)을 웃돌아 영구 성장률로 쓰기에 지속 불가능합니다."}, "orig": "ECO Module 2 Q24"}, {"id": "ECO-M2-Q27", "src": "ECO 오답", "module": 2, "tag": "3-stage DDM (H-model in stage 2·3)", "vig": 5, "stem": "Based on Exhibit 2, which stock can most appropriately be valued using a three-stage DDM with the second and third stages being treated as an H-model?", "opts": {"A": "BIOK", "B": "CCAX", "C": "HLTV"}, "ans": "A", "en": "A is correct because the dividend growth is declining linearly during the second stage of a three-stage DDM used to value BIOK. As noted in the text, a three-stage valuation clearly has an H-model process in the second and third stages. In contrast, abrupt—rather than linearly declining—dividend growth rates are implied for CCAX and HLTV.", "ko": "BIOK: 8년간 15% 고성장 → 이후 3년간 '선형적으로' 하락 → 성숙 성장. 2·3단계가 선형 감소 + 안정 성장 = H-model 구조 → 3-stage DDM(2·3단계를 H-model로) 적합.", "trap": "'linearly declining' 키워드 = H-model.", "f": "", "why": {"B": "CCAX는 6년간 배당 고정 후 GDP 성장으로 '급변' → 기본 2단계 모형.", "C": "HLTV는 27% → 12% → 성숙으로 '계단식(abrupt)' 변화 → 일반 3단계 모형(선형 감소 아님)."}, "orig": "ECO Module 2 Q27"}, {"id": "ECO-M2-Q29", "src": "ECO 오답", "module": 2, "tag": "2-stage DDM – 1단계 말 terminal value의 의미", "vig": 6, "stem": "Based on Exhibit 1, when Withers applies the first valuation approach to Ukon Corporation, the estimated value of the stock at the end of the first stage represents the:", "opts": {"A": "present value of the dividends beyond year 2023.", "B": "present value of the dividends for years 2020 through 2023.", "C": "sum of the present value of the dividends for 2020 through 2023 and the present value of dividends beyond year 2023."}, "ans": "A", "en": "A is correct because the estimated value of the stock at the end of the first stage of a basic two-stage DDM (terminal value) is the present value of all dividends beyond the first stage. The first stage is 2020 through 2023, and the second stage begins in 2024, so the terminal value (that is, the value of the stock at the end of 2023) is the present value of future dividends beyond 2023.", "ko": "기본 2단계 DDM에서 1단계 말(2023년 말) 주식가치 = 1단계 이후(2024년~) 모든 배당의 그 시점 현재가치.", "trap": "Terminal value(Vn) = n시점 이후 배당만의 PV (n시점 기준).", "f": "Vn = D(n+1)/(r − gL)", "why": {"B": "2020–2023 배당의 PV는 1단계 가치이지 1단계 '말'의 주식가치가 아닙니다.", "C": "두 부분의 합은 '오늘(0시점)' 주식가치입니다."}, "orig": "ECO Module 2 Q29"}, {"id": "ECO-M2-Q36", "src": "ECO 오답", "module": 2, "tag": "Sustainable growth → 배당성향", "vig": 6, "stem": "Based on Exhibit 4 and Intern 1’s analysis, Xavier Corporation’s sustainable dividend payout ratio is closest to:", "opts": {"A": "43.4%.", "B": "44.6%.", "C": "56.6%."}, "ans": "C", "en": "C is correct because it is based on the sustainable growth rate and the required rate of return:\nSustainable growth rate = (b in mature phase) × (Return on equity)\n= (1 – Dividend payout) × (Return on equity)\n0.036 = (1 – Dividend payout) × 0.083\nSolving for the dividend payout ratio, the dividend payout = 56.627% ≈ 56.6%.", "ko": "g = b × ROE → 0.036 = (1 − payout) × 0.083 → payout = 1 − 0.036/0.083 = 56.6%.", "trap": "g = b × ROE에서 구한 건 b. 배당성향 = 1 − b.", "f": "g = b × ROE,  payout = 1 − b", "why": {"A": "43.4%는 유보율 b(= 0.036/0.083)입니다. 질문은 배당성향(1 − b).", "B": "44.6%는 계산 오류 값입니다. 정확히는 1 − 0.4337 = 56.6%."}, "orig": "ECO Module 2 Q36"}, {"id": "ECO-M2-Q37", "src": "ECO 오답", "module": 2, "tag": "2-stage DDM – 저평가 판단", "vig": 6, "stem": "Based on Exhibit 4, Intern 2 should conclude that the Xavier stock is:", "opts": {"A": "underpriced.", "B": "fairly priced.", "C": "overpriced."}, "ans": "A", "en": "A is correct. Intern 2 values Xavier stock at USD56.372 per share, which is higher than the current price of USD52.\nD1 = 2.000 × (1.048)1 = 2.096\nD2 = 2.000 × (1.048)2 = 2.197\nD3 = 2.000 × (1.048)3 = 2.302\nD4 = 2.000 × (1.048)4 = 2.413\nD5 = 2.000 × (1.048)4 × 1.04 = 2.510\nValue per share\n=\n2.096\n(\n1\n+\n0.078\n)\n1\n+\n2.197\n(\n1\n+\n0.078\n)\n2\n+\n2.302\n(\n1\n+\n0.078\n)\n3\n+\n2.413\n+\n2.510\n(\n0.078\n−\n0.04\n)\n(\n1\n+\n0.078\n)\n4\n= USD56.372", "ko": "Intern 2: r = 7.8%, 4년간 4.8%, 이후 4.0%. D1~D4 = 2.096, 2.197, 2.302, 2.413; D5 = 2.413×1.04 = 2.510. V0 = Σ PV(D1~D4) + [2.510/(0.078−0.04)]/1.078⁴ = $56.37 > 가격 $52 → underpriced.", "trap": "Terminal value는 D5(= D4 × 1.04)로 계산하고 4년 할인.", "f": "V0 = Σ Dt/(1+r)^t + [D(n+1)/(r − gL)]/(1+r)^n", "why": {"B": "가치 56.37과 가격 52의 차이가 큽니다.", "C": "가치 > 가격이므로 고평가가 아니라 저평가입니다."}, "orig": "ECO Module 2 Q37"}, {"id": "ECO-M2-Q39", "src": "ECO 오답", "module": 2, "tag": "모형 선택 – FCFF (비배당·인수대상·레버리지 변화)", "vig": 7, "stem": "Which of the following is the most appropriate model for Miller to use in valuing Aster?", "opts": {"A": "Residual income", "B": "Free cash flow to equity", "C": "Free cash flow to the firm"}, "ans": "C", "en": "(A) Incorrect because Aster is a profitable company and is also an acquisition target; therefore, the free cash flow model is more appropriate. The residual income model, is most suitable when:\nthe company is not paying dividends, as an alternative to a free cash flow model, or\nthe company’s expected free cash flows are negative within the analyst’s comfortable forecast horizon.\nIn addition, the residual income model is less appropriate because Aster reports a number of items through other comprehensive income on the balance sheet, which distorts its reported income statement results. Although Miller may be able to adjust for such items in her model, this in combination with the above means that residual income is not the most appropriate model in this case.\n(B) Incorrect because free cash flow models are most suitable when the company is non-dividend-paying and the investor takes a control perspective. In this circumstance, however, Aster has expectations of a changing level of corporate debt (leverage) and so FCFF is therefore more appropriate to use as a valuation model than FCFE.\n(C) Correct because free cash flow models are most suitable when the company is non-dividend-paying and the investor takes a control perspective. Since Aster is a target for acquisition and has expectations of a changing level of corporate debt (leverage), the FCFF model is the appropriate model to use for valuation purposes.", "ko": "Aster: 무배당 + 인수 대상(지배 관점) → FCF 모형. 부채 수준이 크게 변할 것으로 예상 → FCFE보다 FCFF가 적합(FCFF는 자본구조 변화에 덜 민감, WACC로 할인).", "trap": "레버리지 변화 큼 → FCFF. 안정적 자본구조 → FCFE가 더 직접적.", "f": "", "why": {"A": "RI는 무배당·FCF 음수일 때 유용하지만, Aster는 수익성 있고 인수대상이며 OCI 항목이 많아 순이익이 경제 실질을 왜곡 → RI 부적합.", "B": "레버리지가 크게 변할 때는 FCFE보다 FCFF가 낫습니다."}, "orig": "ECO Module 2 Q39"}, {"id": "ECO-M2-Q43", "src": "ECO 오답", "module": 2, "tag": "모형 선택 – RI (배당 불규칙 + FCF 음수)", "vig": 8, "stem": "For company A, the most suitable forecast input to a DCF model is:", "opts": {"A": "dividends.", "B": "free cash flow.", "C": "residual income."}, "ans": "C", "en": "(A) Incorrect because the expected dividend payout of Company A has no consistent relationship with earnings, as evidenced by the varying expected dividend payout rates over the forecast years. The earnings of Company A are expected to grow every year during the forecast period, but the dividend is not likely to mimic the growth of earnings. This is probably because the management of Company A wants to conserve cash to fund its capital expenditure requirements. Hence, the expected dividends of Company A is not a good proxy for the value creation expected to happen in Company A during Tian's forecast period.\nIf dividends do not bear an understandable relation to value creation in the company, applying the DDM to value the stock is prone to error. Generally, the definition of returns as dividends, and the DDM, is most suitable when the company is dividend-paying (i.e., the analyst has a dividend record to analyze);\nthe board of directors has established a dividend policy that bears an understandable and consistent relationship to the company’s profitability; and\nthe investor takes a non-control perspective.\n(B) Incorrect because the capital expenditure of Company A is much larger than its operating cash flow so that free cash flow of the Company is negative over a few years in the forecast horizon, especially since the Company is not expected to witness any debt or equity issuances or repayments during this period.\nJust as there are cases in which an analyst would find it impractical to apply the DDM, applying the free cash flow approach is a problem in some cases. Some companies have intense capital demands and, as a result, have negative expected free cash flows far into the future. The present value of a series of negative free cash flows is a negative number: The use of a free cash flow model may entail a long forecast horizon to capture the point at which expected free cash flow turns positive. The uncertainty associated with distant forecasts may be considerable. In such cases, the analyst may have more confidence using another approach, such as residual income valuation.\n(C) Correct because analysts may choose a residual income approach for companies with negative expected free cash flows within their comfortable forecast horizon. In such cases, a residual income valuation often brings the recognition of value closer to the present as compared with a free cash flow valuation, producing higher value estimates. Also, a residual income model can be used for both dividend-paying and non-dividend-paying stocks.\nThe residual income model is a useful addition to an analyst’s toolbox. Because the record of residual income can always be calculated, a residual income model can be used for both dividend-paying and non-dividend-paying stocks. Analysts may choose a residual income approach for companies with negative expected free cash flows within their comfortable forecast horizon. In such cases, a residual income valuation often brings the recognition of value closer to the present as compared with a free cash flow valuation, producing higher value estimates.", "ko": "Company A: 배당성향이 불규칙(30% → 5%)해 이익과 일관된 관계가 없음 → DDM 부적합. 설비투자가 영업현금흐름보다 커 FCF가 음수 → FCF 모형 부적합. → Residual income 모형이 가장 적합.", "trap": "RI 모형 선호 조건: 무배당/불규칙 배당, 예측기간 내 FCF 음수, 회계 투명성.", "f": "", "why": {"A": "배당이 가치창출을 반영하지 못합니다(배당성향이 계속 감소).", "B": "Capex > 영업현금흐름 → FCF 음수(예측기간 중 여러 해)."}, "orig": "ECO Module 2 Q43"}, {"id": "ECO-M2-Q44", "src": "ECO 오답", "module": 2, "tag": "Gordon growth model – D1 사용", "vig": 8, "stem": "The fair value of Company C's stock for Tian is closest to:", "opts": {"A": "$21.", "B": "$40.", "C": "$42."}, "ans": "C", "en": "(A) Incorrect because the candidate uses V0\n=\nD1\n/\nr\nHence incorrect fair value\n=\n2\n×\n1\n+\n0\n.\n05\n/\n0\n.\n1\n=\n$21\nThe correct formula and calculation would have been:\nV\n0\n=\nD\n0\n1\n+\ng\nr\n-\ng\n=\nD\n1\nr\n-\ng\nCorrect fair value\n=\n2\n×\n1\n+\n0\n.\n05\n/\n0\n.\n1\n-\n0\n.\n05\n=\n$42\n(B) Incorrect because the candidate uses V0\n=\nD0\n/\nr\n-\ng\nHence incorrect fair value\n=\n2\n/\n0\n.\n1\n-\n0\n.\n05\n=\n$40\nThe correct formula and calculation would have been:\nV\n0\n=\nD\n0\n1\n+\ng\nr\n-\ng\n=\nD\n1\nr\n-\ng\nCorrect fair value\n=\n2\n×\n1\n+\n0\n.\n05\n/\n0\n.\n1\n-\n0\n.\n05\n=\n$42\n(C) Correct because it applies the formula of Gordon growth model.\nV\n0\n=\nD\n0\n1\n+\ng\nr\n-\ng\n=\nD\n1\nr\n-\ng\nwhere\nV0 is the fair value of the stock according to the GGM\nD0 is the most recent dividend at time t=0\nD1 is the expected dividend payable at time t=1\nr is the required rate of return on equity\ng is the expected constant growth rate in dividends\nCorrect fair value\n=\n2\n×\n1\n+\n0\n.\n05\n/\n0\n.\n1\n-\n0\n.\n05\n=\n$\n42\nThe Gordon growth model, developed by Gordon and Shapiro (1956) and Gordon (1962), assumes that dividends grow indefinitely at a constant rate. This assumption, applied to the general dividend discount model, leads to a simple and elegant valuation formula that has been influential in investment practice.\nTo illustrate the calculation, suppose that an annual dividend of €5 has just been paid (D0 = €5). The expected long-term growth rate is 5% and the required return on equity is 8%. The Gordon growth model value per share is D0(1 + g)/(r − g) = (€5 × 1.05)/(0.08 − 0.05) = €5.25/0.03 = €175. When calculating the model value, be careful to use D1 and not D0 in the numerator.", "ko": "방금 지급한 배당 D0 = $2 → D1 = 2 × 1.05 = 2.10. V0 = 2.10/(0.10 − 0.05) = $42.", "trap": "'just paid' = D0 → 반드시 D1 = D0(1+g).", "f": "V0 = D0(1+g)/(r − g) = D1/(r − g)", "why": {"A": "$21 = D1/r: 분모에서 g를 빼지 않았습니다.", "B": "$40 = D0/(r − g): D0를 D1로 성장시키지 않았습니다."}, "orig": "ECO Module 2 Q44"}, {"id": "ECO-M2-Q49", "src": "ECO 오답", "module": 2, "tag": "2-stage DDM – terminal value 할인 시점", "vig": 9, "stem": "Based on the information in Exhibit 2 and Simms’ alternate assumptions, the per share value of SMGI’s common shares is closest to:", "opts": {"A": "$8.65.", "B": "$9.70.", "C": "$12.35."}, "ans": "B", "en": "(A) Incorrect. The collapsed value of future growth is discounted for three years, not two.\nP = 1.18/1.16 + 1.41/1.162 + 10.28/1.163 = 8.65\n(B) Correct. Using Simms’s assumptions and the two-stage dividend discount model:\n2015\t2016\t2017\nEarnings\t$2.45 × 1.20 = $2.94\t$2.94 × 1.20 = $3.53\t$3.53 × 1.02 = $3.60\nDividends\t$2.94 × 0.40 = $1.18\t$3.53 × 0.40 = $1.41\t$3.60 × 0.40 = $1.44\nTerminal value at 2016\t \t$ 1.44/(0.16 – 0.02) = 10.28\nValues to be discounted to 2014\t$1.18\t$10.28 + 1.41 = $11.69\nValue at 2014 = (1.18/1.16) + (11.69/1.162) = $9.70\n(C) Incorrect. The dividend in 2016 is discounted, but the collapsed value of future growth is not.\nP = 1.18/1.16 + 1.41/1.162 + 10.28 = 12.35", "ko": "EPS 2015 = 2.45×1.2 = 2.94, 2016 = 3.53, 2017 = 3.60(2%). 배당(40%): 1.18, 1.41, 1.44. TV(2016) = 1.44/(0.16 − 0.02) = 10.28. V(2014) = 1.18/1.16 + (1.41 + 10.28)/1.16² = $9.70.", "trap": "TV(n) = D(n+1)/(r−g)는 n시점 가치 → n년 할인. D(n+1)의 시점(n+1)으로 착각 금지.", "f": "V0 = Σ Dt/(1+r)^t + Vn/(1+r)^n,  Vn = D(n+1)/(r − g)", "why": {"A": "$8.65는 2016년 말 TV를 3년 할인한 오류. TV는 2016년 시점 가치이므로 2년 할인.", "C": "$12.35는 TV를 할인하지 않은 오류."}, "orig": "ECO Module 2 Q49"}, {"id": "ECO-M2-Q51", "src": "ECO 오답", "module": 2, "tag": "Sustainable growth model의 가정", "vig": 10, "stem": "Which of Stack’s three assumptions regarding the sustainable growth rate model is most accurate?", "opts": {"A": "1", "B": "2", "C": "3"}, "ans": "A", "en": "(A) Correct. The sustainable growth rate model assumes that the growth will be financed with the issuance of debt and only internally generated equity will be used to maintain a target capital structure. No additional common equity will be issued. The ROE is assumed to be a constant during this period.\n(B) Incorrect. It is assumed in the sustainable growth model that all additional equity comes from internally generated funds, not new issues.\n(C) Incorrect. The ROE is constant during this period.", "ko": "Sustainable growth(g = b × ROE)는 ① 신주발행 없이 내부유보로만 자기자본 증가 ② ROE 일정 ③ 자본구조(부채비율) 일정을 가정합니다. 자본구조가 일정하려면 자기자본 증가에 맞춰 부채도 늘어야 하므로 외부 '부채' 조달은 가정에 부합합니다(Assumption 1).", "trap": "SGR: 신주발행 X, ROE 일정, 자본구조 일정(→ 부채는 비례해서 증가).", "f": "g = b × ROE", "why": {"B": "외부 '주식' 조달은 가정하지 않습니다. 추가 자기자본은 모두 내부 유보에서 나옵니다.", "C": "ROE는 '개선'이 아니라 일정(constant)하다고 가정합니다."}, "orig": "ECO Module 2 Q51"}, {"id": "ECO-M2-Q53", "src": "ECO 오답", "module": 2, "tag": "DDM 적합 – noncontrol 관점", "vig": 11, "stem": "Which of the following factors would make the model Jackson selects to value DDL’s shares the most appropriate model to use?", "opts": {"A": "Jackson has a noncontrol perspective.", "B": "The company has intense capital demands for the next few years.", "C": "The model considers Jackson’s opportunity cost of investing in the stock."}, "ans": "A", "en": "(A) Correct. A dividend discount model (DDM) is most suitable when an investor takes a noncontrol perspective because he does not have the ability to meaningfully influence the timing or magnitude of a company’s cash flows and is therefore reliant on dividend policy. Because Jackson is looking for an investment for his personal portfolio, it is most likely that he has a noncontrol perspective.\n(B) Incorrect. If a company has intense capital demands — as DDL does based on its investment cash flows exceeding its operating ones — it may have negative free cash flow and be unable to pay dividends. In this situation, a residual income model would be the most appropriate model to use.\n(C) Incorrect. The residual income model considers the opportunity cost to an investor of investing in a stock, not a dividend discount model.", "ko": "개인 포트폴리오용 소수지분 투자자는 비지배(noncontrol) 관점 → 현금흐름의 시기·규모에 영향을 줄 수 없어 배당정책에 의존 → DDM이 적합.", "trap": "Noncontrol → DDM, Control(인수) → FCF.", "f": "", "why": {"B": "대규모 자본지출 수요로 수년간 배당이 없다는 것은 DDM 적용을 '어렵게' 하는 요인입니다.", "C": "투자자의 기회비용(equity charge)을 명시적으로 반영하는 것은 residual income 모형입니다."}, "orig": "ECO Module 2 Q53"}, {"id": "ECO-M2-Q56", "src": "ECO 오답", "module": 2, "tag": "H-model 한계", "vig": 11, "stem": "Jackson’s understanding of when he would switch from an H-model to a spreadsheet model is best described as:", "opts": {"A": "correct.", "B": "incorrect with respect to the difference in growth rates.", "C": "incorrect with respect to the length of the first growth period."}, "ans": "A", "en": "(A) Correct. Jackson’s understanding is correct. The H-model is appropriate to use when the transition from a higher rate of growth to a lower one is linear over time but does not provide a very close approximation for a long extraordinary growth period or for a large difference in growth rates.\n(B) Incorrect. Jackson’s understanding is correct with respect to the growth rates. The H-model is appropriate to use when the transition from a higher rate of growth to a lower one is linear over time.\n(C) Incorrect. Jackson’s understanding is correct with respect to the length of the first growth period. The H-model is appropriate to use when the transition from a higher rate of growth to a lower one is linear over time, but it does not provide a very close approximation for a long extraordinary growth period.", "ko": "Jackson이 맞습니다: H-model은 고성장 → 저성장 전환이 선형일 때 적합하지만, 초과성장 기간이 매우 길거나 성장률 차이가 크면 근사 오차가 커지므로 스프레드시트(다단계) 모형을 씁니다.", "trap": "", "f": "", "why": {"B": "'성장률 차이가 크면 부적합' 부분은 정확합니다.", "C": "'초과성장 기간이 매우 길면 부적합' 부분도 정확합니다."}, "orig": "ECO Module 2 Q56"}, {"id": "ECO-M2-Q58", "src": "ECO 오답", "module": 2, "tag": "성장 단계 판정 – 명목 GDP 성장률 비교", "vig": 12, "stem": "Barton’s conclusion that XRL is in the transition phase is best described as:", "opts": {"A": "correct.", "B": "incorrect, because the company is in the mature phase.", "C": "incorrect, because the company is in the supernormal growth phase."}, "ans": "B", "en": "(A) Incorrect. A company in the transition phase is characterized by earnings growth rates above the average nominal growth for the economy but with the growth rate declining. The growth rate is not above the economy’s nominal growth rate, so the fact that it is declining (2.7% for Most Recent Year vs. 1 Year Prior) is not relevant.\n(B) Correct. Barton’s statement is incorrect because the company is in the mature phase. The economy’s nominal growth rate, from Exhibit 1, is Real growth rate + Inflation rate = 3.7% + 2% = 5.7%.\nXRL’s compound growth rate over the four-year period is 5.7%, which is approximately equal to the economy’s growth rate and calculated as follows:\ng\n=\n(\nEPS\nM\no\ns\nt\nR\ne\nc\ne\nn\nt\nY\nr\nEPS\n1\nY\ne\na\nr\nP\nr\ni\no\nr\n)\n1\n/\n4\n=\n(\n3.15\n2.52\n)\n1\n/\n4\n=\n5.7\n%\nwhere g is the compound growth rate in earnings, and EPS is earnings per share.\nA company in the mature phase typically has earnings growth at a rate comparable with the economy’s growth rate.\n(C) Incorrect. A company in the supernormal growth phase has growth higher than the economy’s nominal growth rate.", "ko": "명목 GDP 성장 = 실질 3.7% + 인플레 2% = 5.7%. XRL 4년 EPS 성장 = (3.15/2.52)^(1/4) − 1 = 5.7% ≈ 경제 성장률 → mature phase. Transition phase는 성장률이 경제 성장보다 '높으면서' 하락하는 단계.", "trap": "비교 기준은 '명목' GDP(실질 + 인플레). 4년간 CAGR은 n = 4.", "f": "g = (EPS_end/EPS_begin)^(1/n) − 1", "why": {"A": "성장률이 경제 명목성장률보다 높지 않으므로 transition이 아닙니다. 최근 성장 둔화는 무관.", "C": "Supernormal(초과성장)은 경제 명목성장률보다 훨씬 높은 성장입니다."}, "orig": "ECO Module 2 Q58"}, {"id": "ECO-M2-Q59", "src": "ECO 오답", "module": 2, "tag": "Gordon growth – 과거 배당성장률 사용, 미스프라이싱 기준", "vig": 12, "stem": "Using the data in Exhibit 1 and following Eckhart’s suggestions regarding the valuation of ZTL, the most appropriate conclusion that Barton should make about the ZTL shares is that the fund should:", "opts": {"A": "take a long position in ZTL.", "B": "not add ZTL to the portfolio.", "C": "take a short position in ZTL."}, "ans": "B", "en": "(A) Incorrect. The stock’s intrinsic value differs by less than $1 from the market price, so it should not be added to the portfolio.\n(B) Correct. The growth rate of dividends over the past five years is calculated as follows:\n(\nD\n5\nD\n1\n)\n1\n/\nn\n−\n1\n=\n(\n2.53\n1.89\n)\n1\n/\n4\n−\n1\n=\n7.56\n%\nwhere\nD5 = 2015 dividend\nD1 = 2011 dividend\nn = number of years between the first and last dividends\nUsing the Gordon growth model, the intrinsic value is\nD\n0\n×\n(\n1\n+\ng\n)\nr\n−\ng\n=\n2.53\n×\n1.0756\n(\n0.1048\n−\n0.0756\n)\n=\n$\n93.19\nwhere\nD0 = dividend just paid (in Most Recent Year)\ng = compound growth rate in dividends\nr = required return on the stock, given in Exhibit 1\nWith a current market price of $93.05, the stock is fairly valued according to the fund’s definition of mispricing (i.e., mispriced by less than $1). It should not be added to the portfolio as either a short or long position.\nNote that the answer is calculated without rounding intermediate steps. If rounding is used, the calculated answer may differ slightly.\n(C) Incorrect. The stock’s intrinsic value differs by less than $1 from the market price, so it should not be added to the portfolio.", "ko": "g = (2.53/1.89)^(1/4) − 1 = 7.56%. V0 = 2.53 × 1.0756/(0.1048 − 0.0756) = $93.19. 시장가 $93.05 → 차이 $0.14 < $1 → 펀드 기준상 적정가 → 편입하지 않음.", "trap": "5년 데이터의 성장 기간은 4년(n = 4). 문제의 '미스프라이싱 기준($1)'을 꼭 적용.", "f": "V0 = D0(1+g)/(r − g)", "why": {"A": "가치가 약간 높지만 차이가 $1 미만이라 펀드 기준상 미스프라이싱이 아닙니다.", "C": "공매도 근거도 없습니다(차이 $1 미만)."}, "orig": "ECO Module 2 Q59"}, {"id": "ECO-M2-Q75", "src": "ECO 오답", "module": 2, "tag": "Justified leading P/E (Gordon)", "vig": null, "stem": "An analyst gathers the following information about a company:\nRequired return on equity\t10.3%\nDividend growth rate\t5.2%\nDividends per share (D0)\t$1.00\nTrailing EPS\t$2.50\nThe justified leading P/E ratio of the company's stock is closest to:", "opts": {"A": "7.8.", "B": "8.3.", "C": "11.8."}, "ans": "A", "en": "(A) Correct because the justified leading P/E ratio using the Gordon growth model is P0/E1= (1 – b)/(r – g) where b is the retention rate, r is the required return on equity and g is the dividend growth rate. The dividend payout ratio is 1 – b = D0/E0 = $1.00/$2.50 = 40% and thus P0/E1 = 0.4/(0.103 – 0.052) ≈ 7.84\n(B) Incorrect because the justified trailing (and not leading) P/E ratio is calculated. P0/E0= (1 – b) × (1 + g)/(r – g). The dividend payout ratio is correctly calculated as 1 – b = D0/E0 = $1.00/$2.50 = 40% and P0/E0 is thus calculated as [0.4 × (1 + 0.052)]/(0.103 – 0.052) ≈ 8.25\n(C) Incorrect because the retention rate b and not the dividend payout ratio (1– b) is used in the calculation for the justified leading P/E ratio. The dividend payout ratio is calculated as 1 – b = D0/E0 = $1.00/$2.50 = 40% and the justified leading P/E ratio is thus calculated incorrectly as P0/E1 = b/(r – g) = 0.6/(0.103 – 0.052) ≈ 11.76", "ko": "배당성향 = D0/E0 = 1.00/2.50 = 40%. Justified leading P/E = (1 − b)/(r − g) = 0.40/(0.103 − 0.052) = 7.84.", "trap": "Leading P/E = payout/(r−g), Trailing P/E = payout × (1+g)/(r−g).", "f": "P0/E1 = (1 − b)/(r − g),  P0/E0 = (1 − b)(1 + g)/(r − g)", "why": {"B": "8.3 ≈ 0.40 × 1.052/0.051 = 8.25는 justified 'trailing' P/E(P0/E0)입니다. Leading(P0/E1)에는 (1+g)를 곱하지 않습니다.", "C": "11.8은 유보율 b(0.60)를 배당성향 자리에 넣은 오류입니다."}, "orig": "ECO Module 2 Q75"}, {"id": "SCH-R18-01", "module": 2, "tag": "모형 선택 – RI (무배당 + FCF 음수)", "stem": "Restoration Software is a growth stock that has never paid a dividend. Free cash flow is forecasted to be negative for the next five years because of Restoration’s aggressive expansion plans. Restoration has always received an unqualified opinion from its auditors and is generally considered to have high-quality earnings. Which of the following models is most appropriate to value Restoration?", "opts": {"A": "Free cash flow to the firm model.", "B": "Free cash flow to equity model.", "C": "Residual income model."}, "ans": "C", "en": "Residual income models are the best valuation method if the firm does not pay dividends, has negative free cash flow over the forecast horizon, and has transparent financial reporting and high earnings quality.", "ko": "무배당 + 예측기간 FCF 음수 + 높은 이익의 질 → RI 모형.", "why": {"A": "FCF가 음수라 FCF 모형이 부적합합니다.", "B": "같은 이유로 FCFE도 부적합합니다."}, "trap": "ECO M2 Q43과 같은 판단 구조.", "f": "", "orig": "Schweser MQ 18.1 Q1", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R18-03", "module": 2, "tag": "Gordon growth – 내재 성장률", "stem": "CFCRegs, Inc., just paid a dividend of $2.00 per share. The required return is 13%, and the stock is currently trading at $30.28 per share. The growth rate implied by the Gordon growth model is closest to:", "opts": {"A": "4%.", "B": "6%.", "C": "8%."}, "ans": "B", "en": "Solve 30.28 = 2.00(1 + g)/(0.13 − g) for g: g = (30.28 × 0.13 − 2.00)/(30.28 + 2.00) ≈ 6%.", "ko": "30.28 = 2(1+g)/(0.13 − g) → g = (30.28×0.13 − 2)/(30.28 + 2) = 6.0%.", "why": {"A": "4%는 D0를 성장시키지 않거나 식을 잘못 푼 값입니다.", "C": "8%로 계산하면 가격이 2×1.08/0.05 = 43.2가 되어 맞지 않습니다."}, "trap": "ECO M2 Q21과 같은 '가격에 내재된 g' 계산.", "f": "g = (P0·r − D0)/(P0 + D0)", "orig": "Schweser MQ 18.2 Q3", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R18-05", "module": 2, "tag": "배당 개시 지연 – GGM 시점", "stem": "Titan Industries is not expected to pay a dividend until ten years from now, at which time it is expected to pay a dividend of $1.25 and increase the dividend at a rate of 4% thereafter. If the required rate of return is 12%, the current value of Titan is closest to:", "opts": {"A": "$5.64.", "B": "$12.78.", "C": "$15.63."}, "ans": "A", "en": "We calculate the value of the expected cash flows at nine years because the formula uses the value of the dividend of t + 1: V9 = 1.25/(0.12 − 0.04) = 15.625, then discount to the present: 15.625/1.12^9 = $5.63 ≈ $5.64.", "ko": "첫 배당이 10년 후 → V9 = D10/(r − g) = 1.25/0.08 = 15.625 → 9년 할인 = $5.63(≈5.64).", "why": {"B": "10년으로 할인하는 등 시점 오류입니다.", "C": "15.63은 할인 전 V9 그 자체입니다."}, "trap": "Vn = D(n+1)/(r − g)은 n시점 가치 → ECO M2 Q49와 같은 시점 함정.", "f": "V0 = [D(n+1)/(r − g)]/(1+r)^n", "orig": "Schweser MQ 18.2 Q5", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R18-10", "module": 2, "tag": "H-model 계산", "stem": "Lisa Design pays a current annual dividend of €2.00 and is currently growing at a rate of 20%. This rate is expected to decline to 10% over four years and remain at that level indefinitely. The required rate of return for an investment in Lisa Design is 18%. The current estimated value of Lisa Design using the H-model is closest to:", "opts": {"A": "€24.22.", "B": "€29.78.", "C": "€32.50."}, "ans": "C", "en": "The H-model uses a half-life factor equal to one-half of the declining stage in years (H = 2): V0 = [2.00(1.10) + 2.00(2)(0.20 − 0.10)]/(0.18 − 0.10) = (2.20 + 0.40)/0.08 = €32.50.", "ko": "H = 4/2 = 2. V0 = [D0(1 + gL) + D0·H·(gS − gL)]/(r − gL) = (2.20 + 0.40)/0.08 = €32.50.", "why": {"A": "초과성장 프리미엄 항이나 H를 잘못 적용한 값입니다.", "B": "H를 잘못 잡은 값입니다(H = 기간의 절반 = 2)."}, "trap": "ECO M2 Q5 H-model과 같은 공식.", "f": "V0 = [D0(1+gL) + D0·H·(gS − gL)]/(r − gL)", "orig": "Schweser MQ 18.3 Q10", "src": "Schweser MQ", "vig": null}, {"id": "SCH-R18-11", "module": 2, "tag": "2-stage DDM 계산", "stem": "Lisa Design pays a current annual dividend of €2.00. Suppose the 20% growth rate is expected to persist for four years and then decline immediately to 10%, at which level it will remain indefinitely. The required rate of return is 18%. The current estimated value of Lisa Design is closest to:", "opts": {"A": "€31.99.", "B": "€32.50.", "C": "€37.76."}, "ans": "C", "en": "D1 = 2.40; D2 = 2.88; D3 = 3.456; D4 = 4.147; P4 = D5/(r − g) = 4.147 × 1.10/0.08 = 57.02. V0 = 2.40/1.18 + 2.88/1.18² + 3.456/1.18³ + (4.147 + 57.02)/1.18⁴ = €37.76.", "ko": "D1~D4 = 2.40, 2.88, 3.456, 4.147. P4 = 4.147 × 1.10/0.08 = 57.02. V0 = PV(D1~D4) + PV(P4) = €37.76.", "why": {"A": "Terminal value 시점·할인을 잘못 처리한 값입니다.", "B": "€32.50은 H-model(선형 감소) 결과입니다. 여기서는 4년 후 '급감'."}, "trap": "급감 → 2-stage / 선형 감소 → H-model. 같은 데이터에서 급감 가치가 더 큼(고성장이 더 오래 유지).", "f": "", "orig": "Schweser MQ 18.3 Q11", "src": "Schweser MQ", "vig": null}, {"id": "VAR-R18-01", "module": 2, "tag": "H-model 계산", "stem": "A stock’s current dividend is $1.50. Dividend growth is currently 12% and is expected to decline linearly over six years to a long-term rate of 4%. The required return is 10%. Using the H-model, the value of the stock is closest to:", "opts": {"A": "$26.00.", "B": "$32.00.", "C": "$35.00."}, "ans": "B", "en": "H = 6/2 = 3. V0 = [1.50 × 1.04 + 1.50 × 3 × (0.12 − 0.04)]/(0.10 − 0.04) = (1.56 + 0.36)/0.06 = $32.00.", "ko": "H = 3. V0 = [1.50 × 1.04 + 1.50 × 3 × 0.08]/0.06 = (1.56 + 0.36)/0.06 = $32.00.", "why": {"A": "$26.00은 초과성장 프리미엄 항을 빼고 Gordon 부분만 계산한 값입니다.", "C": "$35.00은 H를 6(기간 전체)으로 잡은 오류입니다."}, "trap": "H = 감소 기간의 '절반'. 첫 항 D0(1 + gL), 둘째 항 D0·H·(gS − gL).", "f": "V0 = [D0(1 + gL) + D0·H·(gS − gL)]/(r − gL)", "orig": "변형 (ECO M2 Q5, Schweser R18)", "src": "변형", "vig": null}, {"id": "ECO-M3-Q13", "src": "ECO 오답", "module": 3, "tag": "Single-stage FCFF → equity value (target debt ratio)", "vig": 13, "stem": "Based on Exhibit 1 and Exhibit 2 and the proposed single-stage FCFF model, the intrinsic value of Company C’s equity is closest to:", "opts": {"A": "$277,907 million.", "B": "$295,876 million.", "C": "$306,595 million."}, "ans": "C", "en": "C is correct. Company C’s firm value is calculated as follows:\nThe required rate of return on equity for Company C is\nr = E(Ri) = RF + βi[E(RM) – RF] = 3% + 1.1(7%) = 10.7%.\nWACC\n=\nMV\n(\nDebt\n)\nMV\n(\nDebt\n)\n+\nMV\n(\nEquity\n)\nr\nd\n(\n1\n−\nTax rate\n)\n+\nMV\n(\nEquity\n)\nMV\n(\nDebt\n)\n+\nMV\n(\nEquity\n)\nr\ne\n.\nWACC = 0.40(6%)(1 – 0.30) + 0.60(10.7%) = 1.68% + 6.42% = 8.10%.\nFCFF for the most recent year for Company C is calculated as follows:\nNet income\t$15,409.00\nPlus: Net noncash charges\t3,746.00\nLess: Investment in working capital\t992.00\nLess: Investment in fixed capital\t3,463.00\nPlus: Interest expense × (1 – Tax rate)\t386.40\nFCFF (in millions)\t$15,086.40\nInvestment in working capital is found by adding the increase in accounts receivable, the increase in inventories, the decrease in accounts payable, and the increase in other current liabilities: –$536 million – $803 million – $3 million + $350 million = –$992 million.\nFCFF is expected to grow at 5.0% indefinitely. Thus,\nFirm value\n=\nFCFF\n1\nWACC\n−\ng\n=\nFCFF\n0\n(\n1\n+\ng\n)\nWACC\n−\ng\n=\n15\n,\n086.4\n(\n1.05\n)\n0.081\n−\n0.05\n=\n$\n510\n,\n990.97\nmillion\n.\nThe value of equity is the value of the firm minus the value of debt. The value of debt is found by multiplying the target debt ratio by the total firm value:\nDebt value = 0.40($510,990.97) = $204,396.39.\nTherefore, equity value = $510,990.97 – $204,396.39 = $306,594.58 million.", "ko": "r_e = 3% + 1.1×7% = 10.7%. WACC = 0.40×6%×(1−0.30) + 0.60×10.7% = 8.10%. FCFF0 = NI 15,409 + NCC 3,746 − WCInv 992 − FCInv 3,463 + Int(1−t) 552×0.7 = 386.4 → 15,086.4. Firm = 15,086.4×1.05/(0.081 − 0.05) = 510,991. Debt = 40% × firm = 204,396 → Equity = 306,595.", "trap": "① WCInv = AR증가 + 재고증가 − AP증가 − 기타유동부채증가 ② Int × (1 − t) ③ FCFF1 = FCFF0(1+g) ④ 부채 = 목표비율 × 기업가치.", "f": "Firm = FCFF0(1+g)/(WACC − g),  Equity = Firm − Debt", "why": {"A": "정확한 절차(WACC 8.10%, FCFF0 × 1.05, 부채 = 목표부채비율 40% × 기업가치)를 따르면 306,595가 나옵니다. 277,907은 이 중 일부 단계를 잘못 적용한 값입니다.", "B": "295,876도 정확한 계산과 다릅니다. 특히 FCFF0를 (1+g)로 성장시키고, 이자는 세후로 더하고, WCInv(992)를 차감해야 합니다."}, "orig": "ECO Module 3 Q13"}, {"id": "ECO-M3-Q26", "src": "ECO 오답", "module": 3, "tag": "FCFE 계산 (NI 기준) – net borrowing 포함 범위", "vig": 14, "stem": "Holt’s FCFE (in millions) for 2020 is closest to:", "opts": {"A": "$175.", "B": "$250.", "C": "$364."}, "ans": "B", "en": "B is correct. FCFE = NI + NCC – FCInv – WCInv + Net borrowing. In this case:\nNI\n=\n$485 million\n.\nNCC\n=\nDepreciation expense\n=\n$270 million\n.\nFCInv\n=\nNet purchase of fixed assets\n=\nIncrease in gross fixed\nassets\n=\n4,275\n−\n3,752\n=\n$523 million\n.\nWCInv\n=\nIncrease in accounts receivable\n+\nIncrease in\ninventory\n−\nIncrease in accounts payable\n−\nIncrease\nin accrued liabilities\n=\n(\n770\n−\n711\n)\n+\n(\n846\n−\n780\n)\n−\n(\n476\n−\n443\n)\n−\n(\n149\n−\n114\n)\n=\n$57 million\n.\nNet borrowing\n=\nIncrease in notes payable\n+\nIncrease in long-term debt\n=\n(\n465\n−\n450\n)\n+\n(\n1,575\n−\n1,515\n)\n=\n$75 million\n.\nFCFE\n=\n485\n+\n270\n−\n523\n−\n57\n+\n75\n=\n$250 million\n.\nAn alternative calculation is\nFCFE = FCFF – Int(1 – Tax rate) + Net borrowing.\nFCFE = 307.6 – 195(1 – 0.32) + (15 +60) = $250 million.", "ko": "FCFE = NI 485 + Dep 270 − FCInv (4,275 − 3,752 = 523) − WCInv [(770−711) + (846−780) − (476−443) − (149−114) = 57] + Net borrowing [notes payable (465−450) + LTD (1,575−1,515) = 75] = $250M. (노트 보강: net borrowing에는 장기부채 증가뿐 아니라 단기차입금·notes payable 증가도 포함됩니다. Schweser·ECO 기준. 노트의 'Long-term debt만'은 수정 필요.)", "trap": "WCInv에서는 현금·notes payable(단기차입) 제외 / Net borrowing에는 notes payable + LTD 증가 포함. FCInv는 gross fixed assets 증가.", "f": "FCFE = NI + NCC − FCInv − WCInv + Net borrowing", "why": {"A": "$175M은 net borrowing(75)을 빠뜨린 값입니다.", "C": "$364M은 WCInv(57)를 차감하지 않고 더한 값입니다(485 + 270 − 523 + 57 + 75)."}, "orig": "ECO Module 3 Q26"}, {"id": "ECO-M3-Q27", "src": "ECO 오답", "module": 3, "tag": "FCF 성장 원천 – 재고 감소의 한계", "vig": 14, "stem": "Leigh’s comment about not considering decreases in inventory to be a source of long-term growth in free cash flow for Holt is:", "opts": {"A": "inconsistent with a forecasting perspective.", "B": "mistaken because decreases in inventory are a use rather than a source of cash.", "C": "consistent with a forecasting perspective because inventory reduction has a limit, particularly for a growing firm."}, "ans": "C", "en": "C is correct. Inventory cannot be reduced below zero. Furthermore, sales growth tends to increase inventory.", "ko": "재고 감소는 0 아래로 내려갈 수 없어 한계가 있고, 성장하는 기업은 매출 증가에 따라 재고가 늘어나는 경향 → 재고 감소를 장기 FCF 성장 원천으로 보지 않는 것은 예측 관점에서 타당합니다.", "trap": "", "f": "", "why": {"A": "예측 관점과 '일치'합니다. 재고 감소는 지속 가능한 성장 원천이 아닙니다.", "B": "재고 감소는 현금의 '원천(source)'입니다(재고 증가가 사용)."}, "orig": "ECO Module 3 Q27"}, {"id": "ECO-M3-Q36", "src": "ECO 오답", "module": 3, "tag": "Sensitivity analysis – range(가치 차이)로 판단", "vig": 15, "stem": "Based on Exhibit 3, Ho’s FCFF sensitivity analysis should conclude that Colanari’s value is most sensitive to the:", "opts": {"A": "FCFF growth rate.", "B": "before-tax cost of debt.", "C": "required rate of return for equity."}, "ans": "C", "en": "C is correct. Colanari’s valuation is most sensitive to the cost of equity (re) because the range of estimated values is larger than the valuation ranges estimated from the sensitivity analysis of both the FCFF growth rate (GFCFF) and the before-tax cost of debt (rd).\nVariable\tBase Case\tLow Estimate\tHigh Estimate\tValuation with Low Estimate (€ millions)\tValuation with High Estimate (€ millions)\tRange (€ millions)\nGFCFF\t4.6%\t4.2%\t5.0%\t3,274.16\t4,021.34\t747.18\nrd\t4.9%\t3.9%\t5.9%\t3,793.29\t3,445.24\t348.05\nre\t11.0%\t10.0%\t12.0%\t4,364.18\t3,079.38\t1,284.80\nWACC = [wd × rd(1 – Tax rate)] + (we × re).\nFirm value = FCFF0(1 + g)/(WACC – g).\nCost of equity sensitivity\nUsing the base case estimates for the FCFF growth rate and the before-tax cost of debt and using the low estimate for the cost of equity (re) of 10.0%, the valuation estimate is\nWACC = [(0.30)(0.049)(1 – 0.35)] + (0.70)(0.10) = 7.96%.\nFirm value = 140 million(1 + 0.046)/(0.0796 – 0.046) = €4,364.18 million.\nUsing the base case estimates for the FCFF growth rate and the before-tax cost of debt and using the high estimate for the cost of equity (re) of 12.0%, the valuation estimate is\nWACC = [(0.30)(0.049)(1 – 0.35)] + (0.70)(0.120) = 9.36%.\nFirm value = 140 million(1 + 0.046)/(0.0936 – 0.046) = €3,079.38 million.\nTherefore, the range in valuation estimates from using the highest and lowest estimates of the cost of equity is €1,284.80 million.\nFCFF growth rate sensitivity\nUsing the base case estimates for the cost of equity and the before-tax cost of debt and using the low estimate for the FCFF growth rate (GFCFF) of 4.2%, the valuation estimate is\nWACC = [(0.30)(0.049)(1 – 0.35)] + (0.70)(0.11) = 8.66%.\nFirm value = 140 million(1 + 0.042)/(0.0866 – 0.042) = €3,274.16 million.\nUsing the base case estimates for the cost of equity and the before-tax cost of debt and using the high estimate for the FCFF growth rate (GFCFF) of 5.0%, the valuation estimate is\nWACC = [(0.30)(0.049)(1 – 0.35)] + (0.70)(0.11) = 8.66%.\nFirm value = 140 million(1 + 0.05)/(0.0866 – 0.05) = €4,021.34 million.\nTherefore, the range in valuation estimates from using the highest and lowest estimates of the FCFF growth rate is €747.18 million.\nBefore-tax cost of debt sensitivity\nUsing the base case estimates for the FCFF growth rate and the cost of equity and using the low estimate for the before-tax cost of debt (rd) of 3.9%, the valuation estimate is\nWACC = [(0.30)(0.039)(1 – 0.35)] + (0.70)(0.11) = 8.46%.\nFirm value = 140 million(1 + 0.046)/(0.0846 – 0.046) = €3,793.29 million.\nUsing the base case estimates for the FCFF growth rate and the cost of equity and using the high estimate for the before-tax cost of debt (rd) of 5.9%, the valuation estimate is\nWACC = [(0.30)(0.059)(1 – 0.35)] + (0.70)(0.11) = 8.85%.\nFirm value = 140 million(1 + 0.046)/(0.0885 – 0.046) = €3,445.24 million.\nTherefore, the range in valuation estimates from using the highest and lowest estimates of the before-tax cost of debt is €348.05 million.", "ko": "각 변수의 low/high 추정치로 계산한 '가치'의 범위를 비교: g(4.2~5.0%) → 747.18, r_d(3.9~5.9%) → 348.05, r_e(10~12%) → 1,284.80 → 자기자본비용에 가장 민감.", "trap": "입력값(%)의 폭이 아니라 '가치(Valuation)'의 range로 비교. 노트 정리와 동일.", "f": "Range = |V(low) − V(high)|", "why": {"A": "FCFF 성장률 범위(747.18)는 r_e 범위(1,284.80)보다 작습니다.", "B": "세전 부채비용 범위(348.05)가 가장 작습니다."}, "orig": "ECO Module 3 Q36"}, {"id": "ECO-M3-Q37", "src": "ECO 오답", "module": 3, "tag": "Total firm value = 영업자산 + 비영업자산", "vig": 15, "stem": "Based on Exhibit 4, Bern’s firm value under Scenario 1 is closest to:", "opts": {"A": "€100,951.3 million.", "B": "€105,349.1 million.", "C": "€105,399.1 million."}, "ans": "C", "en": "C is correct. Based on Scenario 1, where Bern receives regulatory approval for its new drugs, the growth rate in FCFF for Bern will be constant at 4.5%. Therefore, a constant-growth valuation model can be used to calculate firm value.\nBern’s weighted average cost of capital is calculated as\nWACC = [wd × rd(1 – Tax rate)] + (wp × rp) + (we × re).\nThe total market value of the firm is the sum of the debt, preferred stock, and common stock market values: 15,400 + 4,000 + 18,100 = 37,500.\nWACC = [(15,400/37,500)(0.060)(1 – 0.269] + (4,000/37,500)(0.055) + (18,100/37,500)(0.11) = 7.70%.\nValue of operating assets = FCFF0(1 + g)/(WACC – g).\nValue of operating assets = 3,226 million(1 + 0.045)/(0.0770 – 0.045) = €105,349.06 million.\nTotal value of the company = Value of operating assets + Value of non-operating assets.\nTotal value of the company = 105,349.06 million + 50 million = €105,399.06 million.", "ko": "WACC = (15,400/37,500)×6.0%×(1−0.269) + (4,000/37,500)×5.5% + (18,100/37,500)×11% = 7.70%. 영업자산 = 3,226×1.045/(0.077 − 0.045) = €105,349.1M. 비영업자산(투자목적 토지) €50M 가산 → €105,399.1M.", "trap": "'Total firm value' → FCFF로 구한 영업자산 + 비영업자산. 보통주 가치는 여기서 부채·우선주 차감.", "f": "Firm = FCFF0(1+g)/(WACC − g) + Non-operating assets", "why": {"A": "100,951.3은 정확한 WACC(7.70%)와 FCFF1 = FCFF0 × 1.045 절차를 따른 값과 다릅니다.", "B": "€105,349.1M은 영업자산 가치만입니다. 투자목적 토지(비영업자산) €50M을 더해야 기업 전체가치."}, "orig": "ECO Module 3 Q37"}, {"id": "ECO-M3-Q54", "src": "ECO 오답", "module": 3, "tag": "Single-stage FCFF – 주당가치", "vig": 16, "stem": "The estimated value (in EUR) of a Barco share is closest to:", "opts": {"A": "131.17.", "B": "137.73.", "C": "164.06."}, "ans": "A", "en": "(A) Correct because Barco’s value per share (in EUR millions) is computed as follows:\nFirm value = FCFF1 / (WACC – g) = 3,360 / (8% – 4%) = 84,000\nwhere,\nFCFF1 = Free cash flow to the firm for next year\nWACC = weighted average cost of capital = discount rate\ng = growth rate\nEquity value = Firm value – Debt = 84,000 – 16,840 = 67,160\nValue per share = Equity value / Outstanding shares = 67,160 / 512 = 131.17\n(B) Incorrect because it double counts growth in FCFF1: 3,360 (1 + 4%)\nFirm value = FCFF1 (1 + g) / (WACC – g) = 3,360 (1 + 4%) / (8% – 4%) = 87,360\nEquity value = Firm value – Debt = 87,360 – 16,840 = 70,520\nValue per share = Equity value / Outstanding shares = 70,520 / 512 = 137.73\n(C) Incorrect because it does not deduct net debt:\nFirm value = FCFF1 / (WACC – g) = 3,360 / (8% – 4%) = 84,000\nEquity value = Firm value – Debt = 84,000 – 0 = 84,000\nValue per share = Equity value / Outstanding shares = 84,000 / 512 = 164.06", "ko": "FCFF1이 이미 '내년' 값(3,360)이므로 그대로: Firm = 3,360/(0.08 − 0.04) = 84,000. Equity = 84,000 − 16,840 = 67,160. Per share = 67,160/512 = €131.17.", "trap": "문제에 '다음 해(next year)' FCFF가 주어지면 성장시키지 않음. Firm → Equity는 부채 차감.", "f": "Firm = FCFF1/(WACC − g)", "why": {"B": "137.73은 FCFF1에 (1+g)를 한 번 더 곱한 이중성장 오류입니다.", "C": "164.06은 부채를 차감하지 않은 값입니다."}, "orig": "ECO Module 3 Q54"}, {"id": "ECO-M3-Q56", "src": "ECO 오답", "module": 3, "tag": "자사주매입은 FCFE에 영향 없음", "vig": 16, "stem": "If the transaction noticed by Porto had not taken place, Vela's FCFE in the most recent year would have been:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "B", "en": "(A) Incorrect because, a repurchase of shares is not a source of FCFE but a use of FCFE.  Therefore, if Vela had not repurchased its common shares, its FCFE in the most recent year would have been the same.  Do dividends, share repurchases, share issuance have a role on FCFE?  The simple answer is not much, FCFE is the cash flow available to stockholders, dividends and share repurchases are uses of these cash flows. Also, transactions between the company and its shareholders (through cash dividends, share repurchases, and share issuances) do not affect free cash flow.\n(B) Correct because a repurchase of shares is not a source of FCFE but a use of FCFE.  Therefore, if Vela had not repurchased its common shares, its FCFE in the most recent year would have been the same.  Do dividends, share repurchases, share issuance have a role on FCFE?  The simple answer is not much, FCFE is the cash flow available to stockholders, dividends and share repurchases are uses of these cash flows. Also, transactions between the company and its shareholders (through cash dividends, share repurchases, and share issuances) do not affect free cash flow.\n(C) Incorrect because a repurchase of shares is not a source of FCFE but a use of FCFE.  Therefore, if Vela had not repurchased its common shares, its FCFE in the most recent year would have been the same.  Do dividends, share repurchases, share issuance have a role on FCFE?  The simple answer is not much, FCFE is the cash flow available to stockholders, dividends and share repurchases are uses of these cash flows. Also, transactions between the company and its shareholders (through cash dividends, share repurchases, and share issuances) do not affect free cash flow.", "ko": "자사주매입·배당·신주발행 등 회사-주주 간 거래는 FCFE의 '사용처'일 뿐 FCFE 자체에 영향을 주지 않습니다 → 매입이 없었어도 FCFE는 동일.", "trap": "노트 정리: 배당·자사주매입·신주발행 → FCFE 무영향 / 레버리지 변화 → FCFE 영향.", "f": "", "why": {"A": "자사주매입은 FCFE의 원천이 아니라 사용처입니다. FCFE는 변하지 않습니다.", "C": "매입이 없어도 FCFE가 커지지 않습니다(FCFE는 분배 '가능'한 현금)."}, "orig": "ECO Module 3 Q56"}, {"id": "ECO-M3-Q60", "src": "ECO 오답", "module": 3, "tag": "3-stage FCFF 모형 특징", "vig": 17, "stem": "Nilsen's refined FCFF model will most likely feature:", "opts": {"A": "a decrease in operating assets in Stage 2.", "B": "the use of a growth rate slightly lower than the GDP growth rate for Stage 3.", "C": "a heavier proportion of the valuation attributable to Stage 3 than Stages 1 and 2."}, "ans": "C", "en": "(A) Incorrect because although Stage 2 features declining growth, Laksgård is still expected to grow over this period, just at a lower rate than in Stage 1. As a result, Laksgård's operating assets should be expected to grow along with it, but at rates lower than in the first stage. Therefore, operating assets are still increasing.\n(B) Incorrect because in a three-stage model, the growth rate in the third stage is a long-run sustainable growth rate. As demand for farmed fish is expected to outpace population growth through 2055, the fish farming industry is likely to grow faster than the overall economy. As such, it is reasonable to assume the growth rate would be slightly higher than the GDP growth rate, not lower. For an industry that is expected to grow in the future faster than the overall economy, the third-stage growth rate could be slightly greater than the GDP growth rate.\n(C) Correct because the third stage of the model essentially calculates the terminal value of FCFF from year 7 forward. The present value of the terminal value is often a substantial portion of the total value of the stock.", "ko": "3단계(안정 성장) terminal value가 전체 가치에서 가장 큰 비중을 차지하는 것이 일반적입니다.", "trap": "노트와 동일: declining growth ≠ 감소. 산업 > 경제 성장이면 terminal g ≥ GDP 가능.", "f": "", "why": {"A": "2단계는 성장률이 '낮아지는' 것이지 음수가 아닙니다 → 영업자산은 계속 증가(증가 속도만 둔화).", "B": "양식 연어 수요가 인구 증가를 앞질러 산업이 경제보다 빠르게 성장할 전망 → 3단계 성장률을 GDP보다 약간 '높게' 둘 수 있습니다."}, "orig": "ECO Module 3 Q60"}, {"id": "ECO-M3-Q61", "src": "ECO 오답", "module": 3, "tag": "EBITDA가 FCFE의 나쁜 대용치인 이유", "vig": 18, "stem": "Are Pegham’s reasons for rejecting EBITDA as a proxy for FCFE correct?", "opts": {"A": "Yes", "B": "No, his first reason is incorrect", "C": "No, his second reason is incorrect"}, "ans": "C", "en": "(A) Incorrect because EBITDA is a poor proxy for cash flows available to shareholders since EBITDA is earnings before interest, tax, depreciation and amortization and doesn’t account for capital spending. Horzak Digital is described as a fast-growth company, so it is likely to be investing in operating assets, with capital spending in excess of depreciation. In this case, there will be less free cash flows available to shareholders, so EBITDA overstates, not understates as Pegham suggests, cash flows available to shareholders. Pegham’s reasons for rejecting the colleague’s suggestion is therefore incorrect with respect to understating cash flows.\n(B) Incorrect because EBITDA is earnings before interest, tax, depreciation and amortization, so doesn’t account for new borrowings. It is therefore a poor proxy of cash flows available to shareholders. So Pegham’s reason for rejecting the colleague’s suggestion is correct with respect to new borrowings.\n(C) Correct because EBITDA is earnings before interest, tax, depreciation and amortization and doesn’t account for capital spending. Horzak Digital is described as a fast-growth company, so it is likely to be investing in operating assets, with capital spending in excess of depreciation. In this case, there will be less free cash flows available to shareholders, so EBITDA overstates, not understates as Pegham suggests, cash flows available to shareholders.\nPegham is correct with respect to EBITDA not being a good proxy for cash flows as it doesn’t account for new borrowings. However, his reason for rejecting the colleague’s suggestion is incorrect only with respect to cash flows being understated.", "ko": "첫 번째 이유(신규 차입 현금흐름 미반영)는 맞습니다. 두 번째 이유가 틀렸습니다: 고성장 기업은 감가상각보다 큰 설비투자를 하므로 EBITDA는 주주 현금흐름을 '과대' 평가합니다(과소 아님).", "trap": "EBITDA는 capex·WCInv·세금·이자를 반영 못함 → 성장기업에서 FCF를 과대평가.", "f": "", "why": {"A": "두 번째 이유(EBITDA가 과소평가한다)가 틀렸습니다.", "B": "첫 번째 이유(신규 차입 미반영)는 정확합니다."}, "orig": "ECO Module 3 Q61"}, {"id": "ECO-M3-Q62", "src": "ECO 오답", "module": 3, "tag": "비현금 항목 조정 – 구조조정 환입·처분이익", "vig": 18, "stem": "To properly account for the two unusual noncash items when calculating FCFE, Horzak’s previous year’s net income should be:", "opts": {"A": "reduced by USD 7 million.", "B": "reduced by USD 3 million.", "C": "increased by USD 3 million."}, "ans": "A", "en": "(A) Correct because the USD 5 million restructuring charge reversal is a noncash item that will have boosted earnings in previous year, as it is a reversal of a previous charge that has been added back to net income. He is trying to use a normalized definition of net income to calculate FCFE, so this must be subtracted from net income to arrive at FCFE. Similarly with the USD 2 million after-tax gain on the sale of two manufacturing plants, this is a boost to net income that is a noncash item, so it also must be subtracted from net income to arrive at FCFE. So in total both items must be subtracted to arrive at FCFE, in total a reduction of USD 7 million.\n(B) Incorrect because this response mistakenly adds the USD 2 million after-tax gain on the sale of two manufacturing plants instead of subtracting it, though has correctly subtracted the USD 5 million restructuring charge reversal. This results in an incorrect response of a reduction of USD 3 million.\n(C) Incorrect because this response mistakenly adds the USD 5 million restructuring charge reversal instead of subtracting it. This results in an incorrect response of an increase of USD 3 million (when the USD 2 million after-tax gain on the sale of two manufacturing plants is subtracted from the USD 5 million restructuring charge reversal).", "ko": "비현금 '이익'은 순이익에서 차감: 구조조정 충당금 환입(비현금 이익) $5M 차감 + 자산처분이익(비현금 이익; 현금은 투자활동) $2M 차감 → 총 $7M 감소.", "trap": "비현금 손실 → 가산, 비현금 이익(환입·처분이익) → 차감.", "f": "", "why": {"B": "−$3M은 처분이익 $2M을 차감하지 않고 더한 오류입니다.", "C": "+$3M은 환입 $5M을 더하고 처분이익 $2M을 뺀 오류입니다. 둘 다 차감 대상."}, "orig": "ECO Module 3 Q62"}, {"id": "ECO-M3-Q63", "src": "ECO 오답", "module": 3, "tag": "2-stage FCFE – 시점 처리", "vig": 19, "stem": "According to the approach preferred by Bahrami and using the estimates developed by him in Exhibit 4, the value of FDF’s equity as of the previous year end is closest to:", "opts": {"A": "$8,554,891.", "B": "$8,793,104.", "C": "$12,755,292."}, "ans": "B", "en": "(A) Incorrect. The mistakes are in treating the FCFE for the current year as if it were for the previous year and the associated timing differences.\nCash flow from operations (CFO) for the current year\t1,000,000\nLess: Investment in fixed capital\t(400,000)\nPlus: Net borrowing\t250,000\nFree cash flow to equity (FCFE) )mistakenly taken for the previous year )\t850,000\nFCFEcurr yr +2 = 850,000 × 1.102 × 1.06 = 1,090,210\nTVcurr yr +1 = 1,090,210/(0.16 – 0.06) = 10,902,100\nVprev yr = (850,000 × 1.10)/1.16 + (850,000 × 1.102)/1.162 + 10,902,100/1.163\n= 806,034 + 764,343 + 6,984,514\n= 8,554,891\n(B) Correct.\nCalculation of the current year's FCFE and Value of Equity at the End of the previous year\nCash flow from operations (CFO) for current year\t$1,000,000\nLess: investment in fixed capital\t–400,000\nPlus: net borrowing\t250,000\nFree cash flow to equity (FCFEcurr yr)\t$850,000\nFCFEcurr yr +1 = FCFEcurr yr × 1.10 = 850,000 × 1.10\t935,000\nFCFEcurr yr +2 = FCFEcurr yr +1 × 1.06 = 935,000 × 1.06\t991,100\nUsing a two-stage model:\nTVcurr yr + 1 = 991,100/(0.16 – 0.06) = 9,911,000\nVprev yr = 850,000/1.16 + 935,000/1.162 + 9,911,000/1.162\n= 732,759 + 694,857 + 7,365,488 =\t8,793,104\n(C) Incorrect. The mistake is in using WACC for discount rate, instead of the required return on equity.\nCash flow from operations (CFO) for the current year end\t1,000,000\nLess: Investment in fixed capital\t(400,000)\nPlus: Net borrowing\t250,000\nFree cash flow to equity (FCFE) for the current year end\t850,000\nFCFEcurr yr +2 = 850,000 × 1.10 × 1.06 = 991,100\nTVcurr yr +1 = 991,100/(0.129 – 0.06) = 14,363,768\nVprev yr = 850,000/1.129 + (850,000 × 1.10)/1.1292 + 12,388,750/1.1292\n= 752,879 + 733,540 + 11,268,873\n= 12,755,292", "ko": "FCFE(당해) = CFO 1,000,000 − FCInv 400,000 + 차입 250,000 = 850,000. 다음해 = 935,000(10%), 그 다음 = 991,100(6%). TV(다음해 말) = 991,100/(0.16 − 0.06) = 9,911,000. V(전년도 말) = 850,000/1.16 + (935,000 + 9,911,000)/1.16² = $8,793,104.", "trap": "평가 시점(전년도 말) 기준 당해 FCFE = 1기 현금흐름. FCFE ↔ r_e, FCFF ↔ WACC.", "f": "V0 = Σ FCFE_t/(1+r)^t + TV/(1+r)^n", "why": {"A": "당해 FCFE를 전년도 값으로 취급해 한 기간씩 밀린 타이밍 오류입니다.", "C": "FCFE를 WACC로 할인한 오류입니다. FCFE는 자기자본비용(16%)으로 할인."}, "orig": "ECO Module 3 Q63"}, {"id": "ECO-M3-Q64", "src": "ECO 오답", "module": 3, "tag": "FCFF 계산 – 운전자본 감소(음의 WCInv)", "vig": 20, "stem": "McLaughlin’s FCFF ($ millions) for 2012 is closest to:", "opts": {"A": "$418.", "B": "$460.", "C": "$485."}, "ans": "C", "en": "(A) Incorrect. It uses t not (1 – t).\nFCFF = 626 + 243 + 186(0.32) – 535 – (–25) = 418.2 = $418 million\n(B) Incorrect. It ignores working capital investment\nFCFF = 626 + 243 + 186(1 – 0.32) – 535 = 460.48 = $460 million\n(C) Correct.\nFCFF = NI + NCC + Int(1 – Tax rate) – FCInv – WCInv\nNet income (given) = $626; Non-cash charges (depreciation, given) = $243; Interest expense (given) = $186; Tax rate = 294/920 = 32%; Fixed capital investment (given) = $535\nWorking Capital Investment\t2012\n($ millions)\t2011\n($ millions)\tNet increase\n($ millions)\nCurrent assets excluding cash\t1,290 – 32 = 1,258\t1,199 – 21 =1,178\t---\nCurrent liabilities\t2,783\t2,678\t---\nWorking capital\t–1,525\t–1,500\t–25\nFCFF = 626 + 243 + 186(1 – 0.32) – 535 – (–25) = 485.48 = $485 million", "ko": "WC(현금 제외) = (1,290 − 32) − 2,783 = −1,525 (2012), (1,199 − 21) − 2,678 = −1,500 (2011) → WCInv = −25. 세율 = 294/920 = 32%. FCFF = 626 + 243 + 186×0.68 − 535 − (−25) = $485M.", "trap": "WCInv가 음수면 FCFF에 '더해짐'. 운전자본은 현금 제외.", "f": "FCFF = NI + NCC + Int(1 − t) − FCInv − WCInv", "why": {"A": "$418M은 이자에 (1 − t)가 아니라 t를 곱한 오류입니다.", "B": "$460M은 운전자본 투자(−25)를 무시한 값입니다."}, "orig": "ECO Module 3 Q64"}, {"id": "ECO-M3-Q65", "src": "ECO 오답", "module": 3, "tag": "FCFF → FCFE (net borrowing 음수)", "vig": 20, "stem": "Assuming 2012 FCFF equals $500 million, McLaughlin’s FCFE ($ millions) for 2012 is closest to:", "opts": {"A": "$114.", "B": "$174.", "C": "$574."}, "ans": "B", "en": "(A) Incorrect. It ignores tax adjustment for interest expense.\nFCFE = 500 – 186 + (–200) = $114 million\n(B) Correct.\nFCFE = FCFF – Interest (1 – T) + Net borrowing\nGiven: 2012 FCFF base case estimate = $500; Interest expense = $186; Tax rate = 32%\n2012\t2011\tNet increase\nLong-term debt ($)\t2,249\t2,449\t–200\nFCFE = 500 – 186 × (1 – 0.32) + (–200) = $174 million\n(C) Incorrect. It switches the sign for net borrowing\nFCFE = 500 – 186 × (1 – 0.32) + 200 = $574 million", "ko": "FCFE = FCFF − Int(1 − t) + Net borrowing = 500 − 186×0.68 + (2,249 − 2,449 = −200) = $174M.", "trap": "부채 감소 = 음(−)의 net borrowing.", "f": "FCFE = FCFF − Int(1 − t) + Net borrowing", "why": {"A": "$114M은 이자를 세후로 조정하지 않은 값입니다(500 − 186 − 200).", "C": "$574M은 순차입의 부호를 반대로(+200) 쓴 오류입니다. 부채 상환은 FCFE를 '감소'."}, "orig": "ECO Module 3 Q65"}, {"id": "ECO-M3-Q66", "src": "ECO 오답", "module": 3, "tag": "FCFF 가치 → 주당가치 (WACC 할인)", "vig": 20, "stem": "Using Yee’s base case valuation assumptions and the FCFF valuation approach, the year-end 2012 value per share of McLaughlin common stock is closest to:", "opts": {"A": "$12.78.", "B": "$23.73.", "C": "$29.20."}, "ans": "B", "en": "(A) Incorrect. It uses cost of equity, not WACC: [600/(0.12 – 0.04) – 2249]/411 = 12.78.\n(B) Correct. In the base case, the growth rate is stable, thus using the constant-growth FCFF model the value of the firm is\nFirm value\n=\nFCFF\n1\nWACC\n−\ng\n=\n600\n0.09\n−\n0.04\n=\n$\n12\n,\n000\nmillion\nEquity value = Firm value – Market value of debt = 12,00
