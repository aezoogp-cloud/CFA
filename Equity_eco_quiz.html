 the calculation of standardized unexpected earnings (SUE), the magnitude of unexpected earnings is typically scaled by the standard deviation of analysts’ earnings forecasts.", "The Stratton Club is a US-based small investment club formed by a group of friends who had recently graduated from university. Today the club holds a regular bimonthly meeting, and two members have new companies for the club to analyze. The club uses a combination of comparables and forecasted fundamentals to make its investment decisions.\nAlice Zhang has done some preliminary research on Cratt Ltd. (Cratt). Located in Pennsylvania, Cratt is a small manufacturer of products, supplies, and food for domestic animals. Zhang starts by showing the club a recent news release from Cratt’s website (Exhibit 1).\nExhibit 1 Cratt Ltd. Press Release Core EPS Announcement\nWe are pleased to report an increase in Core EPS from $1.01 to $1.31 for the year-ended 31 December 2017. The company continues to pursue its growth-by-acquisition strategy, acquiring smaller specialty companies in the pet supplies industry. Acquisitions over the past two years have allowed us to increase our asset base by 20%, and we expect similar opportunities for growth in the next few years.\n \t31 December 2017\t31 December 2016\nEPS\t$1.03\t$0.89\nCore EPS*\t$1.31\t$1.01\n* Core EPS is a non-GAAP measure that excludes acquisition charges of $0.18 and $0.12 in 2017 and 2016, respectively, as well as $0.10 in 2017 related to the settlement of a lawsuit.\nZhang notes that Cratt is currently trading at $11.31 and reminds the club that the company had been sued over patent infringement for producing coats and blankets for dogs with the names and logos of local professional sports teams on them without the teams’ permission. The company had settled quickly out of court to avoid further negative publicity. Zhang believes the company will not be incurring legal fees again in the foreseeable future but believes that because the company’s strategy is to grow by acquisition, costs related to acquisitions will continue to be incurred and are relevant in any analysis. She does not agree with the company’s exclusion of those costs from core EPS. She calculates Cratt’s trailing price-to-earnings ratio (P/E) on the basis of her beliefs.\nUsing data available from the New York Stock Exchange (NYSE), Zhang finds the average P/E multiple for the Consumer Goods Index (14.8) and the Processed and Packaged Goods sector of that index (32.9). She then performs a screen to narrow the latter group down to other, smaller processed and packaged goods producers to create her own index for comparison purposes. Partial results for the companies identified in her screen are shown in Exhibit 2.\nExhibit 2 Partial Results of Market Screen of Companies in Processed and Packaged Goods Zhang’s Index\nCompany\tMarket Cap\nin US$ millions\tP/E\nFAF Inc.\t5.81\t12.9\nMila Industries Inc.\t26.21\t12.4\nWatson Brothers Co.\t545.62\t5.2\nLane Foods Ltd.\t700.15\t21.1\nDelta Delights Inc.\t575.53\t18.4\nZhang observes that Lane Foods must have both a higher-than-average growth rate and risk to justify its high P/E and that perhaps they should consider looking at Lane as a potential investment at their next meeting.\nThe club members further discuss Zhang’s index and the wide range in both market capitalizations and P/Es for companies in the index. The discussion focuses on whether the arithmetic mean of the index is the best value to be using in their analysis. Zhang remembers learning about the weighted harmonic mean. She decides to calculate the weighted harmonic mean for the index and makes the following statement to support her decision:\n“The harmonic mean can be used to mitigate the effects of both large and small outliers.”\nMoving on from Cratt, Tom Kaminski, another group member, presents some preliminary research on Rapier Ltd., an integrated producer in the forest products industry. Kaminski explains that the industry is cyclical and is currently at mid-cycle. He notes that over this portion of the current cycle, Rapier has shown steady growth in total assets. Kaminski realizes he needs to take these factors into consideration when calculating normalized EPS to determine Rapier’s P/E.\nThe meeting continues with Kaminski providing some follow-up from the club’s last meeting:\n“I have more information on KPK Inc., which we discussed in our last meeting. You may recall that we settled on a discounted cash flow model that we considered appropriate for the stock. I have used it to calculate the justified fundamental trailing P/E. In addition, along with current and forecasted EPS for the next four quarters, I have determined other P/Es for the stock (Exhibit 3). Because the stock is part of the NYSE Consumer Goods Index that Zhang mentioned earlier, I have also included the index P/E. Based on this analysis, I recommend that the club buy KPK shares.”\nExhibit 3 Various P/E Multiples Related to KPK Inc. and Its Industry\nTrailing P/E\tForward P/E\tJustified (Fundamental) Trailing P/E\tConsumer Goods Index P/E\n14.6\t13.7\t15.0\t14.8", "Wesley Anwar recently accepted a position as an assistant research analyst for B&N Securities (BNS), a large global brokerage firm. Anwar's first two weeks with the firm is spent in training which is being trained in equity valuation by several of the firm's senior analysts.\nOne of the analysts discusses Price/Earnings multiples and introduces a company under her coverage, Bentley & Matias (BAM), a large multinational in the consumer staples industry. She presents the information in Exhibit 1 below.\nExhibit 1\nBentley & Matias (BAM)\tSelect Information\nMost Recent Earnings\t$3.00/share\nMost Recent Dividend\t$1.20/share\nExpected Earnings Growth Rate\t4.0%\nRequired Rate of Return\t6.4%\nFollowing a discussion about dividend yield, Anwar asks the analyst how she deals with extremely low, zero or negative earnings. She replies, \"When I am interested in ranking securities that include those types of earnings I use the inverse price ratio or the earnings yield. When I rank securities from highest to lowest earnings yield the securities are correctly ranked from cheapest to most costly. I can also use normalized EPS, expected or trailing EPS in the calculation.  Additionally, earnings yield helps me deal with non-recurring items and business cycle influences.\nThe analyst moves on to review the determination of terminal value and displays the information for Evan Myers a large manufacturer under her coverage in Exhibit 2 below.\nExhibit 2\nEvan Myers\tSelect Information\nYear 3 Earnings\t$2.90\nDividend Payout\t60.0%\nAverage Industry P/E\t14.0x\nAverage Industry ROE\t13.0%\nRequired Rate of Return\t7.0%\nThe final topic on the agenda involves a discussion of momentum. The analyst makes the following statements regarding momentum indicators:\nStatement 1:\tThey relate either price or a fundamental, to a time series of their own past values.\nStatement 2:\tThe indicators demonstrate how positive surprises may be associated with persistent positive returns.\nStatement 3:\tThey indicate when the market price will converge with its estimated intrinsic value.", "Sarah Thomas is the head of research for an asset management company. Thomas presents the firm’s valuation process at an industry conference and the presentation is concentrated on the market-based valuation.\nIn her presentation, Thomas links justified price multiples to discounted cash flow models by assuming the Gordon growth model and the sustainable growth rate. She shows a numerical example on justified P/B using the following details: a firm’s ROE is 11.5%, its required rate of return is 9.5%, and its expected growth rate is 6.5%.\nThomas also suggests price to cash flow is a widely reported valuation indicator. She stresses that using price to cash flow can address the issue of differences in accounting conservatism between companies. While responding to a question on possible drawbacks to using price to cash flow, she mentions the following points:\nPoint 1: Cash flow is less subject to manipulation by management than earnings.\nPoint 2: Free cash flow to equity (FCFE) is more volatile than cash flow for many businesses.\nPoint 3: US GAAP allows more flexibility than IFRS, in classification of interest paid, interest received, and dividends received.\nThomas’ presentation includes a calculation example to show terminal value in a multistage discounted cash flow (DCF) model by using price multiples. Based on the following data and estimates, she uses the estimated industry average P/E as the benchmark and calculates the terminal value based on comparables:\nYear at which the final stage begins = 5\nEarnings in Year 5 = $4.00\nRequired rate of return = 15%\nIndustry average ROE = 20%\nIndustry average P/E = 9.00\nMarket average dividend payout rate for mature companies = 45%\nThomas points out that positive earnings surprises may be associated with persistent positive abnormal returns and describes popular momentum indicators used in valuation. While demonstrating the calculation of standardized unexpected earnings (SUE), she states “In SUE, the magnitude of unexpected earnings is scaled by a variability measure.” In response to a question on what measure can be used for the calculation, she mentions the following possible measures:\nMeasure 1: The standard deviation of analysts’ earnings forecasts.\nMeasure 2: The standard deviation in past industry average earnings surprise.\nMeasure 3: The standard deviation in past unexpected earnings over some period.", "Rila Rakia & Beer Ltd. (RRBL), a small privately owned company, produces high quality rakia (a high-potency hard liquor), vino (wine), and bira (beer) in Bulgaria. After Bulgaria joined the European Union in 2007, international demand for the country’s liquor, wine, and beer increased substantially. Most firms in the industry, including RRBL, have been reporting double-digit sales growth on a year-over-year basis.\nMetiu Metev, a portfolio strategist at a major German investment consulting firm, inherited RRBL from his grandparents. Frankfurter Destillerie & LiqueurFabrik (FDLF), a German distillery interested in entering the Bulgarian market, has made a cash offer of BGN900 million for the company’s equity (BGN = Bulgarian Lev; EUR1 = BGN1.95586, pegged rate). FDLF will assume RRBL’s entire outstanding debt, including both current liabilities and long-term debt. If Metev does not want to sell a controlling interest, FDLF’s minimum equity stake will be 40%, with an appropriate discount for lack of control.\nMetev starts by evaluating the company himself using the capitalized cash flow method (CCM) and taking the following steps:\nUsing the build-up method to estimate the required rate of return on equity\nComputing the firm’s weighted average cost of capital (WACC) using the book values of debt and considering the current weight of total debt in capital structure to be optimal\nExhibits 1A, 1B, 2, and 3 contain RRBL’s financial data and other inputs that Metev uses.\nBefore responding to FDLF’s offer, however, Metev meets with Vasil Nenkov, his colleague and a senior equity analyst covering the wine and beer industry in the Balkan region. After reviewing the data and Metev’s valuation analysis, Nenkov suggests that 11% would be a more reasonable estimate of RRBL’s WACC based on an analysis of industry peers. Metev decides to use this rate to calculate the value of RRBL’s equity.\nNenkov also makes the following comments:\nComment 1: CCM is most often used for the valuation of large public companies, and it is less valid for valuing private companies such as RRBL.\nComment 2: The excess earnings method is preferable because it provides an estimate of the value of intangible assets by capitalizing future earnings in excess of the estimated return requirements associated with working capital and fixed assets.\nNenkov also suggests that the enterprise value (EV) multiple approach should work well for valuing RRBL. After searching his database, Nenkov finds that Rhodopi Wineries PLC, a publicly traded company and a close competitor of RRBL, is currently valued at an EV/EBITDA (earnings before interest, taxes, depreciation, and amortization) multiple of 7.2. Nenkov further suggests two adjustments:\nAdjustment 1: RRBL should command an upward adjustment of 25% in the EV/EBITDA multiple reflecting its lower risk and higher growth relative to Rhodopi Wineries.\nAdjustment 2: Forward-looking EBITDA should be used to determine RRBL’s value.\nOn a cautionary note, Nenkov makes two statements regarding the use of EV/EBITDA approach to valuation.\nStatement 1: It is more appropriate than the P/E for comparing companies with different financial leverage.\nStatement 2: EBITDA underestimates cash flow from operations if working capital is growing.\nFinally, Metev recalls FDLF’s willingness to purchase a non-controlling ownership interest at a discount for lack of control. Nenkov responds by saying that a control premium of 30% is typically applied for purchase transactions of small privately owned firms similar to RRBL and that proper adjustment for lack of control should be made if the transaction involves a non-controlling interest. Metev thanks Nenkov for his help and goes back to his desk to revise his valuations.\nExhibit 1A RRBL EBITDA and Other Data (BGN millions)\n \tFY2012\n(Actual)\tFY2013\n(Pro Forma)\nRevenues\t248.5\t300.6\nCost of goods sold\t–132.3\t–172.5\nGross profit\t116.2\t128.1\nSelling, general, and administrative expenses\t–19.2\t–23.0\nEBITDA\t97\t105.1\nOther Data\nCapital expenditures\t2.5\t4\nInterest expense\t2.7\t3.6\nDepreciation and amortization\t5\t6.4\nIncrease in working capital\t0.8\t1\nExhibit 1B Additional Information for RRBL\nPre-tax cost of debt\t10.00%\nWeight of total debt in capital structure\t30%\nTax rate\t25%\nExhibit 2 RRBL Balance Sheet for FY2012 (BGN millions)\nAssets\tLiabilities and Equity\nCash and short-term investment\t50\tAccounts payable\t10\nReceivables and inventory\t40\tNotes payable\t8\nNet fixed assets\t50\tLong-term debt\t30\nPatents and trademarks\t20\tCommon equity\t112\nTotal assets\t100\tTotal liabilities and equity\t160\nExhibit 3 Other Data and Inputs\nBulgarian government’s 10-year bond yield\t3.90%\nBeta of publicly traded firms in the industry\t0.75\nEquity risk premium\t6.00%\nSmall stock risk premium\t2.50%\nIndustry risk premium\t0.00%\nRRBL’s company-specific risk premium\t1.50%\nLong-term growth rate beyond FY2013\t5.00%", "Mangoba Nkomo, CFA, a senior equity analyst with Robertson-Butler Investments, South Africa, has been assigned a recent graduate, Manga Mahlangu, to assist in valuations. Mahlangu is interested in pursuing a career in equity analysis. In their first meeting, Nkomo and Mahlangu discuss the concept of residual income and its commercial applications. Nkomo asks Mahlangu to determine the market value added for a hypothetical South African firm using the data provided in Exhibit 1.\nExhibit 1\nHypothetical Firm Data (amounts in South African rand)\nCurrent share price\tR25.43\nBook value per share\tR20.00\nTotal shares outstanding\t30 million\nCost of equity\t13%\nMarket value of debt\tR55 million\nAccounting book value of total capital\tR650 million\nIntrinsic share value of equity derived from residual income model\tR22.00\nNkomo also shares his valuation report of the hypothetical firm with Mahlangu. Nkomo’s report concludes that the intrinsic value of the hypothetical firm, based on the residual income model, is R22.00 per share. To assess Mahlangu’s knowledge of residual income valuation, Nkomo asks Mahlangu two questions about the hypothetical firm:\nQuestion 1:\nWhat conclusion can we make about future residual earnings given the current book value per share and my estimate of intrinsic value per share?\nQuestion 2:\nSuppose you estimated the intrinsic value of a firm’s shares using a constant growth residual income model, and you found that your estimate of intrinsic value equaled the book value per share. What would that finding imply about that firm’s return on equity?\nSatisfied with Mahlangu’s response, Nkomo requests that Mahlangu use the single-stage residual income model to determine the intrinsic value of the equity of Jackson Breweries, a brewery and bottling company, using data provided in Exhibit 2.\nExhibit 2\nJackson Breweries Data (amounts in South African rand)\nConstant long-term growth rate\t9.5%\nConstant long-term ROE\t13%\nCurrent market price per share\tR150.70\nBook value per share\tR55.81\nCost of equity\t11%\nNkomo also wants to update an earlier valuation of Amersheen, a food retailer. The valuation report, completed at the end of 2020, concluded an intrinsic value per share of R11.00 for Amersheen. The share price at that time was R8.25. Nkomo points out to Mahlangu that in late 2020, Amersheen announced a significant restructuring charge, estimated at R2 million, that would be reported as part of operating earnings in Amersheen’s 2020 annual income statement. Nkomo asks Mahlangu the following question about the restructuring charge:\nQuestion 3:\nWhat was the correct way to treat the estimated R2 million restructuring charge in my 2020 valuation report?\nSatisfied with Mahlangu’s response, Nkomo mentions to Mahlangu that Amersheen recently (near the end of 2021) completed the acquisition of a chain of convenience stores. Nkomo requests that Mahlangu complete, as of the beginning of 2022, an updated valuation of Amersheen under two scenarios:\nScenario 1:\nEstimate the value of Amersheen shares using a multistage residual income model with the data provided in Exhibit 3. Under Scenario 1, expected ROE in 2025 is 26%, but it is assumed that the firm’s ROE will slowly decline towards the cost of equity thereafter.\nScenario 2:\nEstimate the value of Amersheen shares using a multistage residual income model with the data provided in Exhibit 3, but assume that at the end of 2024, share price is expected to equal book value per share.\nScenario 3:\nExhibit 3\nAmersheen Data (amounts in South African rand)\nLong-term growth rate starting in 2025\t9.0%\nExpected ROE in 2025\t26%\nCurrent market price per share\tR16.55\nBook value per share, beginning of 2022\tR7.60\nCost of equity\t10%\nPersistence factor\t0.70\n \t2022\t2023\t2024\nExpected earnings per share\tR3.28\tR3.15\tR2.90\nExpected dividend per share\tR2.46\tR2.36\tR2.06", "Elena Castovan is a junior analyst with Contralith Capital, a long-only equity investment manager. She has been asked to value three stocks on Contralith’s watch list: Portous, Inc. (PTU), SSX Financial (SSX), and Tantechi Ltd. (TTCI).\nDuring their weekly meeting, Castovan and her supervisor, Ariana Beckworth, discuss characteristics of residual income models. Castovan tells Beckworth the following.\nStatement 1:\nThe present value of the terminal value in RI models is often a larger portion of the total intrinsic value than it is in other DCF valuation models.\nStatement 2:\nThe RI model’s use of accounting income assumes that the cost of debt capital is appropriately reflected by interest expense.\nStatement 3:\nRI models cannot be readily applied to companies that do not have positive expected near-term free cash flows.\nBeckworth asks Castovan why an RI model may be more appropriate for valuing PTU than the dividend discount model or a free cash flow model. Castovan tells Beckworth that, over her five-year forecast horizon, she expects PTU to perform the following actions.\nReason 1:\nPay dividends that are unpredictable\nReason 2:\nGeneratepositiveand fairly predictable free cash flows\nReason 3:\nReport significant amounts of other comprehensive income\nAt the conclusion of their meeting, Beckworth asks Castovan to value SSX using RI models. Selected financial information on SSX is presented in Exhibit 1.\nExhibit 1\nSSX Financial (SSX) Selected Financial Data\nTotal assets (millions)\t€4,000.00\nCapital structure\t60% debt/40% equity\nEBIT (millions)\t€700.00\nTax rate\t35.00%\nReturn on equity (ROE)\t23.37%\nPretax cost of debta\t5.20%\nCost of equity\t15.00%\nMarket price per share\t€48.80\nPrice-to-book ratio\t2.10\na Interest expense is tax-deductible.\nCastovan’s final assignment is to determine the intrinsic value of TTCI using both a single-stage and a multistage RI model. Selected data and assumptions for TTCI are presented in Exhibit 2.\nExhibit 2\nTantechi Ltd. (TTCI) Selected Financial Data and Assumptions\nBook value per share\t€45.25\nMarket price per share\t€126.05\nConstant long-term ROE\t12.00%\nConstant long-term earnings growth rate\t4.50%\nCost of equity\t8.70%\nFor the multistage model, Castovan forecasts TTCI’s ROE to be higher than its long-term ROE for the first three years. Forecasted earnings per share and dividends per share for TTCI are presented in Exhibit 3. Starting in Year 4, Castovan forecasts TTCI’s ROE to revert to the constant long-term ROE of 12% annually. The terminal value is based on an assumption that residual income per share will be constant from Year 3 into perpetuity.\nExhibit 3\nTantechi Ltd. (TTCI) Forecasts of Earnings and Dividends\n \tYear 1\tYear 2\tYear 3\nEarnings per share (€)\t7.82\t8.17\t8.54\nDividends per share (€)\t1.46\t1.53\t1.59\nBeckworth questions Castovan’s assumption regarding the implied persistence factor used in the multistage RI valuation. She tells Castovan that she believes that a persistence factor of 0.10 is appropriate for TTCI.", "Ryan Ahmed is an analyst at a Malaysian asset management company. He is researching Paramount Industries, a palm oil producer that reports its earnings in Malaysian ringgit (MYR).\nAhmed's initial approach uses a single-stage residual income model to value Paramount's stock based on the information in Exhibit 1. Ahmed assumes a long-term ROE of 10% and a long-term growth rate of 3%. He considers a stock to be fairly valued if its current price is within 2.5% of its intrinsic value.\nExhibit 1\nBook value per share\tMYR 60\nCurrent price per share\tMYR 86\nNumber of shares outstanding\t10 million\nCost of equity\t7%\nBook value of debt\tMYR 600 million\nMarket value of debt\tMYR 690 million\nAhmed's supervisor raises a concern about the initial valuation. He believes that the palm oil industry in Malaysia will be much more competitive than Ahmed has forecast. Ahmed reassesses his assumptions and recalculates Paramount's intrinsic value using a multistage residual income model. For this revised valuation, Ahmed makes the following three adjustments:\nAdjustment 1:\tAssets and liabilities are adjusted to their fair values\nAdjustment 2:\tAssets and liabilities are adjusted to include operating leases\nAdjustment 3:\tNon-recurring gains and losses are excluded from the calculation of residual income\nAs a result of these adjustments, Ahmed uses the following inputs for his multistage model:\nRevised current book value per share of MYR 58\nResidual income per share of MYR 3 for each of the next four years\nEstimated book value per share of MYR 90 and market price per share of MYR 108 at the end of Year 4\nCost of equity of 7%", "Farhan Khan, an analyst at an asset management company, is new to the concepts of residual income valuation. In response to some questions from his supervisor, Richard Smith, Khan makes the following statements about the residual income model:\nStatement 1: The residual income model has a clear relationship to other valuation models, such as the dividend discount models.\nStatement 2:  The intrinsic value based on a residual income model is not affected by dividend payments by the company.\nStatement 3: The intrinsic value based on a residual income model will be at least equal to the book value if the company remains profitable.\nSmith asks Khan to calculate the residual income of Alpha Company based on the information in Exhibit 1.\nExhibit 1\nEarnings before interest and taxes\t$165 million\nInterest expense (tax deductible)\t$65 million\nTax rate\t20%\nEquity charge\t$45 million\nSmith also asks Khan to calculate the justified P/B ratio of Beta Company. Khan assumes a long-term ROE of 8% and a required rate of return of 7% for calculating the justified P/B ratio of Beta. Based on a single-stage residual income model, he calculates the justified P/B ratio of 1.5.\nSmith believes the justified P/B ratio of 1.5 is too low for Beta and asks Khan to calculate its intrinsic value using a multistage residual income model. Khan uses the following assumptions and estimates for the calculation:\nBeginning book value per share is $12.00\nPresent value of four years' residual income per share is $7.50\nAt the end of four years, book value per share will be $15.00\nAt the end of four years, market value per share will be $21.00\nThe required rate of return is 7%", "Lisa Parker is a junior analyst with a long-only equity investment manager. Parker is asked to value several stocks on a watch list. During a weekly meeting to discuss her approach, Parker and Russell Stark, the firm's director of research, review the residual income model and its characteristics. Stark begins by explaining how to calculate the intrinsic value of Company A's common stock using the residual income model. Stark provides Parker with the following data to calculate Company A's residual income for the year.\nBeginning book value per share is $10.00.\nExpected net income per share is $2.00.\nExpected dividends per share is $0.40.\nRequired rate of return on equity is 10%.\nStark asks Parker to calculate the intrinsic value of Company B's common stock using a single-stage residual income model. Parker assumes that Company B has a constant ROE and a constant earnings growth rate through time. For her analysis, Parker uses the following inputs.\nCurrent book value per share is $10.00.\nExpected long-term ROE is 6.5%.\nExpected long-term growth rate is 4%.\nCost of equity is 5%.\nStark asks Parker to calculate the intrinsic value of Company C's common stock using a multi-stage residual income model. Parker wants to assume that company’s ROE will regress toward its industry’s ROE over time and asks Stark how to incorporate this assumption into estimating continuing residual income at the forecast horizon. Stark advises Parker to use a persistence parameter. For her analysis, Parker assumes the following:\nBeginning book value per share is $100.00.\nAt the end of the year, expected book value per share will be $120.00.\nAt the end of the year, expected earnings per share will be $20.00.\nRequired rate of return is 10%.\nPersistence parameter is 0.6.\nStark asks Parker to compare residual income models to dividend discount models and free cash flow models. Parker recognizes that valuation models based on discounting dividends or discounting free cash flows are as theoretically sound as the residual income model. While investigating the relationship of the residual income model to other valuation models, Parker makes the following statements.\nStatement 1: Residual income valuations recognize value later than different present value approaches.\nStatement 2: In theory, residual income valuations are mutually consistent with other present value approaches.\nStark asks Parker to evaluate whether the common stock of Company D is undervalued, fairly valued, or overvalued based on a residual income model. Parker uses the two-stage residual income model to value Company D’s share. For her analysis, she assumes the following:\nCurrent market price is $24.00.\nBeginning book value per share is $20.00.\nEarnings per share will be 32% of beginning book value for the next year.\nCash dividends will be 50% of earnings per share for the next year.\nAt the end of the year, the stock's P/B ratio will be 1.1.\nRequired rate of return on equity is 10%.", "Kim Chung-hee is an equity analyst with Incheon Securities. Kim is writing a research report on DongSun Electronics, a South Korean company that is dual-listed on a US exchange and complies with US GAAP. As part of his analysis, Kim wants to determine the intrinsic value of DongSun’s common shares under both residual income and comparable valuation methods.\nWhen examining DongSun’s financial data, Kim notices that the company is underusing its debt capacity and its debt ratio is well below the optimal level. To support the valuation process, Kim assembles in Exhibit 1 selected financial information from DongSun’s 2013 and 2012 audited financial statements (values stated in South Korean won [KRW]). Other financial data pertaining to the valuation of DongSun’s shares at 31 December 2013 are shown in Exhibit 2.\nExhibit 1 Selected Information from DongSun’s 2013 and 2012 Financial Statements (KRW millions, except where noted)\n \tYear Ended 31 December 2013\nNet income\t105,000\nDividends\t42,000\nNumber of common shares outstanding (actual)\t30,000,000\n \tKRW at 31 December\n \t2013\t2012\nTotal stockholders' equity\t750,000\t687,000\nExhibit 2 Other Financial Data for DongSun Electronics\nPretax cost of long-term debt\t6%\nRequired return on equity\t12%\nMarket price per share at 31 December 2013\tKRW62,000\nAt 31 December 2013, Kim provided the following forecasted fundamentals for DongSun:\nprojected earnings per share (EPS) for 2014 are KRW4,000;\nexpected long-term return on equity (ROE) is 15%;\nDongSun will retain 60% of its earnings over the long term; and\nafter 2014, earnings and dividends will grow at 9% per year.\nKim’s supervisor is concerned that the residual income model may not apply, and she asks Kim to investigate possible clean surplus violations. Looking at DongSun’s financial statement information, Kim considers three items with possible violations to clean surplus accounting:\nItem 1: Marketable securities classified as available-for-sale\nItem 2: Non-domestic currency transactions with customers and suppliers\nItem 3: Non-domestic currency translation adjustments from the consolidation of any self-sustaining subsidiary companies (for which the local currency is the functional currency)\nUpon completing the analysis, Kim concludes that the net effects are not material to the financial statements and, accordingly, makes no adjustments to the information in Exhibit 1.\nKim believes that analyst forecasts are too pessimistic with respect to DongSun’s residual income prospects after 2014. In a recent conference call, DongSun’s management presented its plan to improve future profitability, particularly the economic value added (EVA), by focusing on the following three strategic company goals:\nGoal 1: Adjust financial leverage to the optimal level.\nGoal 2: Implement efficiencies in administrative functions.\nGoal 3: Reduce research and development (R&D) expenses.\nAs a final question, Kim’s supervisor asks him why he prefers the residual income model to other approaches.", "Gregory Armishaw is an equity analyst specializing in the food and beverage industry at Fulsom-Wagner Investment Counsel in Minneapolis, Minnesota. In late January 2014, he became aware of a new salt substitute, SansSalt, that was developed by a local company, Vitality FoodGroup, Inc. (VFG).\nWith the continuing concern over health matters arising from excessive salt use, Armishaw believes that the addition of this product line could be quite beneficial to VFG. He uses the data in Exhibit 1 to calculate the value of VFG using (1) the residual income model and (2) the H-model version of the dividend discount model.\nExhibit 1 Vitality FoodGroup Selected Information for Valuation, 31 December 2013\nNet income\t$422 million\nCommon stock (par plus paid-in-excess of par)\t$1,075 million\nRetained earnings\t$1,078 million\nWeighted average cost of capital\t11.9%\nCost of debt, before tax\t7.0%\nCost of equity capital\t15%\nExpected dividend growth behavior:\nExpected for 2014\t14%\nAfter 2014, dividend growth rate declines linearly over a 6 year period\nThe final and perpetual growth rate:\t5%\nEstimated earnings per share (EPS) in 2019\t$5.04\nDividend payout ratio\t40%\nShares outstanding\t150 million\nArmishaw shows his report to Anthony Stack, Fulsom-Wagner’s senior portfolio manager and Armishaw’s reporting official. In the H-model calculation, Stack notices that Armishaw assumes a sustainable growth rate of 5% following the period of high growth. Stack asks Armishaw if it is true that the sustainable growth model assumes the company will require\nAssumption 1: external debt financing,\nAssumption 2: external equity financing, and\nAssumption 3: improving return on equity.\nStill concerned with the estimate of growth after 2019, Stack asks Armishaw what the present value of growth opportunities (PVGO) will be in 2019 when the perpetual growth period begins.\nArmishaw next presents Exhibit 2, which contains the basis for his estimates for the share price (as of 15 January 2014) if he assumes a terminal value in 2023 arising from treating 2023’s residual income as a perpetuity.\nExhibit 2 Vitality FoodGroup Basis for Terminal Value and Revised Price Estimate, 15 January 2014\nForecasted residual income (RI) per share at end of 2023\t$5.32\nEstimated return on equity (ROE) in 2023\t20%\nNature of stream beyond 2023\tPerpetuity\nGrowth rate beyond 2023\t0%\nCost of equity\t15%\nDividend payout\t40%\nStack questions Armishaw’s assumption in his 2014 valuation (Exhibit 2) that a perpetuity would best describe the terminal value of the stream and suggests that residual income should fade over time. Stack further suggests that a persistence factor of 0.50 might be appropriate.\nStack tells Armishaw that he prefers the use of a residual income model to value the company over other available methods. He provides three justifications for his preference:\nStatement 1: The model explicitly incorporates the cost of debt capital.\nStatement 2: The model can be used when cash flows are unpredictable.\nStatement 3: There is less of an impact arising from the uncertainty in forecasting terminal value.", "Woojae Park and Shelly Sonberg, junior analysts at Felix & Danick are valuing Sparrow Telecom Company (Sparrow) a regional telecom provider. Their supervisor instructed them to use residual income models for the valuation.\nSonberg starts the meeting by saying she wants to be sure Park understands the difference between the residual income approach and the dividend discount approach and makes the following statements:\nStatement 1:\tIf there is clean surplus accounting, the residual income model and the dividend discount model will yield the same results.\nStatement 2:\tThe residual income model has more of its value determined in the current time period, whereas the dividend discount model has more of its value determined in later periods.\nStatement 3:\tThe residual income model makes assumptions about future earnings and dividend growth, whereas the dividend discount model makes assumptions only about dividend growth.\nTo start their analysis, the analysts gather the information in Exhibit 1 for Sparrow and calculate the forecasted residual income for the current fiscal year ending 31 August.\nExhibit 1 Forecasted Residual Income\n \tPer share\nBook value per share 31 August previous year\t$47.50\nForecasted earnings for year-end 31 August current year\t$7.58\nForecasted dividends for current fiscal year\t$2.10\nBook value per share 31 August current fiscal year\t$52.98\nRequired rate of return = re\t13%\nLong-term growth rate\t6%\nReturn on equity (ROE)\t15%\nThey continue by selecting the single-stage residual income model to calculate the intrinsic value of the Sparrow.\nNext, the analysts decide to calculate the economic value added (EVA) for Sparrow and gather some additional data (Exhibit 2):\nExhibit 2 Sparrow Telecom Company Additional Information (US$, thousands)\nTotal debt, 31 August previous fiscal year\t$4,391,600\nTotal equity, 31 August previous fiscal year\t$2,151,750\nEarnings before interest and taxes\t$616,000\nTax rate\t20%\nWeighted average cost of capital (WACC)\t7.0%\nCost of equity re\t13%", "Ulrich Schwalke has been recently hired as an analyst at a private equity firm that specializes in buying and restructuring private companies to be taken public within five years. Given his background with valuing public firms, this role will provide him his first experiences in valuing private companies.\nBefore starting his new position, Schwalke meets with a former classmate who works as an associate focused on private company valuations in order to resolve legal disputes. During the meeting, Schwalke’s classmate mentions that private business valuation often requires normalizing certain expense items on a company’s income statement before taking next steps.\nOn his first assignment, Schwalke is asked to estimate a WACC for a potential private target company. The partner has commented that the private target has a far lower debt ratio than would be considered optimal.\nSchwalke’s firm recently announced plans to buy one of the private companies that Schwalke has valued. Schwalke spent considerable time assessing the validity of different control premiums in analyzing a possible offer price.", "Ulrich Schwalke continues his work in valuing private companies, taking specific interest in transactions involving public companies buying private company targets. As he has seen in his work, private company discount rates are often biased because private firms typically have less access to debt capital.\nWhile Schwalke has experience using CAPM for public companies, he has rarely used it for private firms, instead relying on the expanded CAPM or a build-up approach to estimate required return on equity. When using the expanded CAPM for a private company, JNK Corporation, Schwalke gathered beta estimates from publicly traded comparable companies. On a recent engagement, he found the average beta from public comparables of 1.20. The average debt ratio of the public comparables exceeded that of JNK, while tax rates were equal between the public comparables and JNK.\nContinuing in his role, Schwalke completed many private company valuations for entire businesses. As a result, certain methods of calculating terminal values seemed to be more useful for his work than other methods.\nSchwalke had initially struggled with applying discounts in private company valuation but became more comfortable with different estimation methods. In particular, he finds an option-based approach to quantifying the lack of marketability quite useful. In his recent work on valuing JNK, he estimated the value of three put options with three months until expiration on the most similar public comparable company to JNK. The public comparable was trading at a stock price of EUR 29.70. The three-month risk-free rate is 4%. The put option valuation results are summarized as follows:\nJNK Put Option Exercise Prices and Values\nExercise price\tPut option value\nEUR 25\tEUR 1.25\nEUR 30\tEUR 3.75\nEUR 35\tEUR 6.95", "Schwalke is currently valuing LPE, a private furniture manufacturing company based in France. The company is owned entirely by the Lapiere family, with several family members employed as senior company managers. Jean Lapiere is the current CEO and owns 25% of LPE stock. LPE’s most recent income statement as part of its reviewed financial statements is as follows:\nAs of 31 December (in EUR)\tAs Reported\nRevenues\t30,000,000\nCost of goods sold\t18,000,000\nGross profit\t12,000,000\nSG&A expenses\t8,000,000\nEBITDA\t4,000,000\nDepreciation and amortization\t2,400,000\nEarnings before interest and taxes\t1,600,000\nPro forma taxes (at 25%)\t400,000\nOperating income after taxes\t1,200,000\nAs Schwalke reviews compensation expenses, he learns that Jean Lapiere’s annual compensation is EUR 300,000 and that CEOs of similarly sized consumer durable goods companies earn EUR 600,000 on average.\nTo estimate LPE’s required return on equity, Schwalke gathers betas from public furniture manufacturing companies, and after making appropriate adjustments, estimates LPE’s beta at 0.80. He uses an equity risk premium of 6%, a small-cap stock premium of 2%, a company-specific stock premium of 1.5%, and an industry risk premium of 1%.\nAfter making other normalizing assumptions to LPE’s income statement and deducting the change in long-term assets of EUR 600,000 (equal to EUR 3,000,000 in capital expenditures less EUR 2,400,000 in depreciation), Schwalke estimates FCFF for the base year to be EUR 600,000. He decides to use the CCM in his income approach to valuing LPE with a WACC of 8% and perpetual growth of 4%.\nGiven the availability of similar publicly traded furniture manufacturing companies, Schwalke also uses a market approach to value LPE. He finds an average EV/Sales multiple of 0.60 from these public comparable companies. Schwalke notes that LPE’s debt is currently EUR 6 million.\nJean Lapiere is seeking an estimate of the value of his LPE ownership stake. In the course of discussing the ownership structure, Schwalke concludes that none of the family members, including Jean, has a controlling interest in the company. Schwalke estimates discounts for lack of control and lack of marketability as 20% and 15%, respectively.", "Ian Aaron owns a small consulting firm that specializes in private company valuation. He is asked to make a presentation at a local university about his company's role in the investment industry, which he agrees to do.\nAaron opens by explaining how valuation approaches for private companies are conceptually similar to those used for public companies. He talks about how his firm uses the various methodologies available but that the method most frequently employed provides a direct comparisons to public companies. This method values an asset based on pricing multiples from sales of assets that are viewed as similar and relies on data generated in actual transactions. He stresses that a stable, mature company, where the sales and cash flows are more predictable, might be best valued utilizing this method.\nAaron describes how private company earnings can potentially require significant adjustments in order to estimate the company’s normalized earnings. It may be necessary to adjust for non-recurring, non-economic, or other unusual items to eliminate anomalies and facilitate comparisons. A member of the audience asks about a new business his family recently started and comments:\nComment 1:\tRevenues are limited, family members working for the business have deferred their compensation.\nComment 2:\tThe business operates in a building that is currently owned by a family member.\nComment 3:\tThe few employees the business does have are paid similar to other start-ups in our area.\nAaron next discusses how standard ways of determining an appropriate discount rate are not applicable to private firm valuation. He points out that several adjustments may be necessary to incorporate the real risk of the investment. He states the following may affect the selection of an appropriate discount rate:\nStatement 1:\tDue to its ease of access and liquidity, private companies tend to rely on bank financing.\nStatement 2:\tIn evaluating an acquisition the buyer’s cost of capital is irrelevant.\nStatement 3:\tAn adjustment for managerial experience is rarely necessary.\nHe concludes on his discussion regarding the discount rate by talking about the various methods available to estimate a required rate of return for valuing a private company. Aaron explains that his firm typically uses the method that was used to determine the discount rate as a set of premia added to the risk-free rate. He explains that the premia are typically based on factors such as size and company risk. This model is often used when guideline public companies are unavailable and excludes the application of beta to the equity risk premium. He also indicates an  industry risk adjustment may need to be made.", "Dan Brady is a partner at a firm that facilitates investments and sales of interests in privately-held firms. He is reviewing several firms that are seeking investors or purchasers.\nHILLSIDE COMPANY\nTed Samant founded Hillside Company 23 years ago and wants to retire. Knowing the importance of sound financial practices, Samant has audited financial statements for Hillside for each of the past 10 years. Hillside operates in a declining growth segment of its industry. The firm's plant is located in a busy and growing industrial area and may be attractive to nearby businesses seeking to expand. Many of its fixed assets, including machinery and equipment, can be used in other businesses. There are two large multinational publicly-held firms that are in the same industry as Hillside and private market transactions of firms in the industry occur once every 1-2 years.  After collecting information from Samant, Brady considers what method he should use for valuing Hillside and the type of transaction he would need to identify to obtain maximum value for Hillside.\nThe following month, Samant contacts Brady to tell him that his oldest daughter is willing to leave her position with a public firm and become CEO of Hillside. As part of the arrangement, the daughter wants Brady to find minority investors to provide capital for various plant upgrades and for developing new markets.  Brady estimates investors in a private firm such as Hillside will require a 15% discount for lack of control and a 20% discount for lack of marketability.\nAJACKS COMPANY\nAjacks is a family-owned firm that the family wishes to sell in order to set up a charitable foundation. The father, mother, and son all participate in the business. Brady reviews their financial statements and comes to these conclusions:\nCompensation, which is part of SG&A, was $800,000 higher per year for family members than is typical for firms of comparable size and sales revenue.\nThe top officers of the firm had annual “strategic planning retreats” at various resort locations with annual expenses (part of SG&A) averaging $50,000. Brady thought this was unnecessary and excessive for this type of firm.\nThe firm owns a private plane, book value of $180,000 with annual operating expenses of $14,000  and annual depreciation expense of $30,000. Given their business, owning such an asset is unusual as annual business air travel would cost approximately $4,000.\nThe parents own a 500,000 square foot warehouse which they rent to Ajacks at a cost of $8 a square foot annually.  Market-based leases for this type of facility average $6 a square foot.  This would affect reported SG&A expense.\nExhibit 1 shows selected financial data from Ajacks. Brady computes the firm's normalized operating income after taxes.\nExhibit 1\n \tAs reported\nRevenues\t$40,000,000\nCosts of goods sold\t$25,500,000\nGross profit\t14,500,000\nSG&A expense\t$6,800,000\nEBITDA\t$7,700,000\nDepreciation\t$1,750,000\nEBIT\t$5,950,000\nPro forma taxes (35%)\t$2,082,500\nOperating income after taxes\t$3,867,500\nBrady also collects the following estimates to compute a discount rate and estimated firm value for Ajacks:\nNominal risk-free rate: 3%\nExpected inflation rate: 2%\nEquity risk premium: 5.5%\nBeta for similar firms, adjusted for capital structure differences: 1.2\nSmall stock premium: 3.5%\nIndustry risk premium: 0%\nCompany-specific risk adjustment: 1%", "Daniel Pegham is a mergers and acquisitions analyst currently advising Horzak Digital, a privately owned, rapidly growing satellite dish manufacturer that reports in USD.\nPegham wants to use FCFE to value the company and recalls that some peers have used EBITDA as a proxy for FCFE. He concludes that EBITDA is not a good proxy for Horzak’s FCFE for two reasons. First, EBITDA fails to account for cash flows from new borrowings. Second, EBITDA understates cash flows for growth companies such as Horzak.\nInstead, Pegham uses the indirect method to calculate FCFE, starting with Horzak’s previous year’s net income. Horzak had two unusual noncash items in the previous year: a USD 5 million after-tax reversal of noncash restructuring charges taken in the previous year, and a USD 2 million after-tax gain.\nHorzak is entirely family-owned, and the president is the largest shareholder. Horzak is subject to a 30% tax rate. Pegham determines that, in the event of a takeover, his valuation should reflect two additional adjustments to normalize net income.\nBoard compensation was USD 1,500,000 in the previous year, compared to USD 800,000 at comparable companies.\nHorzak has had free use of storage facilities owned by the company’s president for warehousing inventory. This benefit would otherwise have cost USD 150,000 in the previous year.\nLastly, Pegham evaluates Horzak using the capitalized cash flow method under the following assumptions.\nNormalized FCFE in the current period (FCFE0) is USD 4.0 million.\nThe long-term growth rate of FCFE is 5%.\nThe market value of debt is USD 6.6 million.\nThe cost of equity is 17.5%.", "Minneapolis Viking Arbitrageurs, LLC (MVA), is a fledgling US-based hedge fund having slightly more than $50 million in assets under management. MVA specializes in owning and managing small-sized properties in agriculture, forestry, and mining.\nJim Hester, MVA’s merger and acquisition (M&A) analyst is evaluating Fargo Durum Farms, Inc. (FDF) for a potential acquisition. FDF owns 1,500 acres of fertile land, farm buildings, machinery, residential quarters, livestock, cattle feed, seeds, grain, significant amounts of intangible assets, and so on. Selected data from FDF’s income statement for the previous year ended and additional estimates compiled by Hester are presented in Exhibits 1 and 2.\nExhibit 1 FDF’s Select Financial Data for the Previous Year Ended\nGross revenues from crops, livestock, feed, and so on\t$2,500,000\nCost of goods sold\t1,000,000\nSelling, general, and administrative expenses (SG&A)\t900,000\nDepreciation and amortization\t200,000\nTax rate\t30%\nNotes:\n1) FDF carries debt in the amount of $750,000 at an interest rate of 8%, and it comprises 30% of total assets on a book value basis. Debt will be a part of the acquisition transaction.\n2) FDF holds $200,000 in cash and short-term investments, but it will not be a part of the assets under acquisition transaction.\nExhibit 2 Additional Data and Hester’s Estimates for Normalization\n1.\tThe cost of goods sold ratio should be higher at 45%.\n2.\tSG&A includes $400,000 in owners’ compensation. According to Hester’s research, owners’ compensation expense for similar sized farms is $200,000.\n3.\tA ranch and living quarters are not required for the farm’s core operations. The reported SG&A expenses include $100,000 for operating expenses relating to those properties. The ranch and living quarters will be kept by the current owners and are not a part of FDF’s farming operations being considered for purchase by the hedge fund.\n4.\tFor pro forma estimations, Hester will consider depreciation and amortization at 10% of gross revenues. He thinks the current tax rate of 30% is reasonable.\nFirst, Hester assesses FDF’s normalized operating income after tax. Next, Hester values FDF’s equity starting with the free cash flow to the firm (FCFF) with the data and assumptions in Exhibit 3.\nExhibit 3 FDF’s Data and Estimates for Valuing Its Equity\nFCFF for Current Year\t$336,250\nFCFF annual growth rate for the foreseeable future\t5%\nFDF’s debt holding at an interest rate of 8.0% per year\t$750,000\nFDF’s weighted average cost of capital (WACC)\t11.50%\nFDF’s cost of equity\t14.00%\nHester presents his initial assessment and valuation of FDF to MVA’s investment committee. The following are comments and suggestions from some members on the committee.\nXavier Moreno, commodities analyst, suggests the use of the excess earnings method (EEM) for valuing FDF and makes the following three statements in support of his preference:\nStatement 1: EEM involves estimating the earnings remaining before deducting amounts that reflect the required returns to the tangible assets.\nStatement 2: EEM is a widely-used method for valuing entire private businesses similar to FDF.\nStatement 3: EEM is especially useful for valuing FDF because it allows for valuing working capital, fixed assets, and intangibles using different discount rates.\nJamal Bahrami, the external consultant on the committee, differs from Hester and prefers the use of the free cash flow to equity (FCFE) model. Furthermore, he develops his own estimates for valuing FDF's equity, shown in Exhibit 4.\nExhibit 4 Bahrami’s Estimates for Valuing FDF’s Equity\n1.\tIn current year, FDF will:\nrealize $1,000,000 in cash flow from operations.\nrequire $400,000 in new capital investment.\nneed additional borrowing in the amount of $250,000 at an interest cost of 8%.\n2.\tBecause of the continued strength in the global demand for wheat, FDF will experience a higher annual growth rate of 10% for the following year; thereafter, it will grow at a constant rate of 6% per year.\n3.\tBecause of illiquidity and small-firm risk premiums, the appropriate WACC and required return on equity will be higher at 12.9% and 16%, respectively.", "Rila Rakia & Beer Ltd. (RRBL), a small privately owned company, produces high quality rakia (a high-potency hard liquor), vino (wine), and bira (beer) in Bulgaria. After Bulgaria joined the European Union in 2007, international demand for the country’s liquor, wine, and beer increased substantially. Most firms in the industry, including RRBL, have been reporting double-digit sales growth on a year-over-year basis.\nMetiu Metev, a portfolio strategist at a major German investment consulting firm, inherited RRBL from his grandparents. Frankfurter Destillerie & LiqueurFabrik (FDLF), a German distillery interested in entering the Bulgarian market, has made a cash offer of BGN900 million for the company’s equity (BGN = Bulgarian Lev; EUR1 = BGN1.95586, pegged rate). FDLF will assume RRBL’s entire outstanding debt, including both current liabilities and long-term debt. If Metev does not want to sell a controlling interest, FDLF’s minimum equity stake will be 40%, with an appropriate discount for lack of control.\nMetev starts by evaluating the company himself using the capitalized cash flow method (CCM) and taking the following steps:\nUsing the build-up method to estimate the required rate of return on equity\nComputing the firm’s weighted average cost of capital (WACC) using the book values of debt and considering the current weight of total debt in capital structure to be optimal\nExhibits 1A, 1B, 2, and 3 contain RRBL’s financial data and other inputs that Metev uses.\nBefore responding to FDLF’s offer, however, Metev meets with Vasil Nenkov, his colleague and a senior equity analyst covering the wine and beer industry in the Balkan region. After reviewing the data and Metev’s valuation analysis, Nenkov suggests that 11% would be a more reasonable estimate of RRBL’s WACC based on an analysis of industry peers. Metev decides to use this rate to calculate the value of RRBL’s equity.\nNenkov also makes the following comments:\nComment 1: CCM is most often used for the valuation of large public companies, and it is less valid for valuing private companies such as RRBL.\nComment 2: The excess earnings method is preferable because it provides an estimate of the value of intangible assets by capitalizing future earnings in excess of the estimated return requirements associated with working capital and fixed assets.\nNenkov also suggests that the enterprise value (EV) multiple approach should work well for valuing RRBL. After searching his database, Nenkov finds that Rhodopi Wineries PLC, a publicly traded company and a close competitor of RRBL, is currently valued at an EV/EBITDA (earnings before interest, taxes, depreciation, and amortization) multiple of 7.2. Nenkov further suggests two adjustments:\nAdjustment 1: RRBL should command an upward adjustment of 25% in the EV/EBITDA multiple reflecting its lower risk and higher growth relative to Rhodopi Wineries.\nAdjustment 2: Forward-looking EBITDA should be used to determine RRBL’s value.\nOn a cautionary note, Nenkov makes two statements regarding the use of EV/EBITDA approach to valuation.\nStatement 1: It is more appropriate than the P/E for comparing companies with different financial leverage.\nStatement 2: EBITDA underestimates cash flow from operations if working capital is growing.\nFinally, Metev recalls FDLF’s willingness to purchase a non-controlling ownership interest at a discount for lack of control. Nenkov responds by saying that a control premium of 30% is typically applied for purchase transactions of small privately owned firms similar to RRBL and that proper adjustment for lack of control should be made if the transaction involves a non-controlling interest. Metev thanks Nenkov for his help and goes back to his desk to revise his valuations.\nExhibit 1A RRBL EBITDA and Other Data (BGN millions)\n \tFY2012\n(Actual)\tFY2013\n(Pro Forma)\nRevenues\t248.5\t300.6\nCost of goods sold\t–132.3\t–172.5\nGross profit\t116.2\t128.1\nSelling, general, and administrative expenses\t–19.2\t–23.0\nEBITDA\t97\t105.1\nOther Data\nCapital expenditures\t2.5\t4\nInterest expense\t2.7\t3.6\nDepreciation and amortization\t5\t6.4\nIncrease in working capital\t0.8\t1\nExhibit 1B Additional Information for RRBL\nPre-tax cost of debt\t10.00%\nWeight of total debt in capital structure\t30%\nTax rate\t25%\nExhibit 2 RRBL Balance Sheet for FY2012 (BGN millions)\nAssets\tLiabilities and Equity\nCash and short-term investment\t50\tAccounts payable\t10\nReceivables and inventory\t40\tNotes payable\t8\nNet fixed assets\t50\tLong-term debt\t30\nPatents and trademarks\t20\tCommon equity\t112\nTotal assets\t100\tTotal liabilities and equity\t160\nExhibit 3 Other Data and Inputs\nBulgarian government’s 10-year bond yield\t3.90%\nBeta of publicly traded firms in the industry\t0.75\nEquity risk premium\t6.00%\nSmall stock risk premium\t2.50%\nIndustry risk premium\t0.00%\nRRBL’s company-specific risk premium\t1.50%\nLong-term growth rate beyond FY2013\t5.00%"], "modules": {"1": "Equity Valuation: Applications and Processes", "2": "Discounted Dividend Valuation", "3": "Free Cash Flow Valuation", "4": "Market-Based Valuation: Price and EV Multiples", "5": "Residual Income Valuation", "6": "Private Company Valuation"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "Equity", KEY = "Equity_quiz_state_v1", EXPKEY = "Equity_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function flush(){ if(!tbl.length) return; html+='<div class="tbl"><table>'+tbl.map(function(r){return "<tr>"+r.split("\t").map(function(c){return "<td>"+esc(c.trim())+"</td>";}).join("")+"</tr>";}).join("")+"</table></div>"; tbl=[]; }
  lines.forEach(function(l){
    if(l.indexOf("\t")>=0){ tbl.push(l); }
    else { flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>"; }
  });
  flush(); return html;
}
function mname(m){ return "Reading "+(16+Number(m))+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 모듈 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">Equity 전체 Reading 오답 퀴즈 (R17–R22)</h2>'+
   '<p class="muted">ECO에서 틀린 114문제 전부 + 오답 개념과 연결된 ECO 정답 유형 17문제 + Schweser Module Quiz 28문제 + 변형 6문제 (총 165문제). 정답은 ECO 원본·Schweser 해답 기준, 해설은 Schweser 기준으로 작성했습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<label>출처 <select id="selSrc"><option value="all">전체</option><option value="wrong">ECO 오답만 (114)</option><option value="nowrong">오답 외 문제만</option></select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start">'+resume+'<button class="btn '+(resume?'':'primary')+'" id="bStart">새로 시작</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  $("bStart").onclick=function(){
    var m=$("selMod").value, s=$("selSrc").value;
    var order=Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (s==="all"||(s==="wrong"?q.src==="ECO 오답":q.src!=="ECO 오답")); }).map(function(q){return q.id;});
    if(!order.length) return;
    S=fresh(order,"all"); save(); render();
  };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    '<button class="btn primary" id="bNext" '+(r?'':'disabled')+'>'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button></div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=next;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d, at;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ alert(SUBJECT+" 결과 파일이 아닙니다."); return; }
    at=d.attempts[d.attempts.length-1];
    var order=[], round={};
    (at.questions||[]).forEach(function(x){
      var q=BYID[x.id]; if(!q) return;
      order.push(x.id);
      if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
    });
    if(!order.length){ alert("불러올 문제가 없습니다."); return; }
    if(S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return;
    var all=(S&&S.all)||{};
    (at.questions||[]).forEach(function(x){
      if(!BYID[x.id] || all[x.id] || !x.selected) return;
      var ok=x.selected===BYID[x.id].ans;
      all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
    });
    var idx=0; while(idx<order.length && round[order[idx]]) idx++;
    var done=idx>=order.length;
    S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
       started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz"};
    save(); render(); window.scrollTo(0,0);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
})();
</script>
