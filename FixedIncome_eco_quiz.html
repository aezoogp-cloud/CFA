 must hold for a market to be arbitrage free.", "ko": "무차익 원칙은 무위험 증권·포트폴리오에 적용됩니다: ① 같은 시점·금액의 무위험 현금흐름은 같은 가격(dominance 없음, Condition 2) ② 포트폴리오 가격 = 개별 가격의 합(value additivity, Condition 3). Condition 1(위험이 높으면 기대수익도 높아야)은 위험자산의 위험-수익 관계로 무차익 조건이 아닙니다.", "trap": "무차익 = 무위험 자산 대상. 'risk–return' 문장이 섞이면 그것이 틀린 조건.", "f": "No-arbitrage: (1) Value additivity (2) Dominance 부재", "why": {"B": "Condition 2(동일 무위험 payoff → 동일 가격)는 dominance 부재로 무차익의 필수 조건입니다.", "C": "Condition 3(포트폴리오 = 구성요소 합)은 value additivity로 필수 조건입니다."}, "orig": "ECO Module 2 Q24"}, {"id": "ECO-M2-Q25", "src": "ECO 오답", "module": 2, "tag": "Spot rate로 option-free 채권 평가", "vig": 12, "stem": "The value Fujioka calculates for the four-year bond is closest to:", "opts": {"A": "96.764.", "B": "96.931.", "C": "98.149."}, "ans": "B", "en": "B is correct. Discount each cash flow at its own spot rate: 96.931 = 3.5/1.0215 + 3.5/1.0345^2 + 3.5/1.0401^3 + 103.5/1.0440^4.\nA (96.764) uses the four-year zero rate for every cash flow. C (98.149) uses the three-year zero rate for every cash flow.", "ko": "각 현금흐름을 해당 만기 zero(spot) 금리로 할인: 3.5/1.0215 + 3.5/1.0345² + 3.5/1.0401³ + 103.5/1.0440⁴ = 96.931.", "trap": "하나의 금리로 모두 할인 = YTM 접근. Arbitrage-free = 각 시점 spot.", "f": "V = Σ CF_t/(1+z_t)^t", "why": {"A": "4년 zero 금리(4.40%)를 모든 현금흐름의 YTM처럼 사용 → 96.764. 단기 현금흐름은 더 낮은 spot으로 할인해야 합니다.", "C": "3년 zero 금리(4.01%)를 모든 현금흐름에 적용 → 98.149."}, "orig": "ECO Module 2 Q25"}, {"id": "ECO-M2-Q26", "src": "ECO 오답", "module": 2, "tag": "Binomial tree backward induction (3년, 쿠폰 2.8%)", "vig": 12, "stem": "The value Maalouf estimates for the three-year bond using the binomial tree in Exhibit 2 is closest to:", "opts": {"A": "100.623", "B": "100.908", "C": "103.507"}, "ans": "B", "en": "B is correct. Time 2: 102.8/1.0456 = 98.317; 102.8/1.0345 = 99.372; 102.8/1.0260 = 100.195.\nTime 1: [2.8 + (0.5 × 98.317 + 0.5 × 99.372)]/1.0285 = 98.828; [2.8 + (0.5 × 99.372 + 0.5 × 100.195)]/1.0216 = 100.415.\nTime 0: [2.8 + (0.5 × 98.828 + 0.5 × 100.415)]/1.0150 = 100.908.\nA uses the lowest rate on the tree as a spot rate for each period (100.623). C adds an extra coupon at Time 2 (103.507).", "ko": "Year 2 노드: 102.8/1.0456 = 98.317, 102.8/1.0345 = 99.372, 102.8/1.0260 = 100.195. Year 1: [2.8 + 0.5(98.317 + 99.372)]/1.0285 = 98.828, [2.8 + 0.5(99.372 + 100.195)]/1.0216 = 100.415. Year 0: [2.8 + 0.5(98.828 + 100.415)]/1.0150 = 100.908.", "trap": "만기 노드 CF = 원금 + 마지막 쿠폰 (한 번만). 중간 노드마다 그 시점 쿠폰 더하기.", "f": "V = [C + 0.5(V_u + V_d)]/(1 + r_node)", "why": {"A": "각 기간의 '가장 낮은 금리'를 spot처럼 사용한 값(100.623). 트리는 노드마다 위·아래 평균을 내야 합니다.", "C": "Year 2 노드에서 쿠폰을 한 번 더 더한 값(103.507). 만기 CF 102.8에는 이미 마지막 쿠폰이 포함되어 있습니다."}, "orig": "ECO Module 2 Q26"}, {"id": "ECO-M2-Q27", "src": "ECO 오답", "module": 2, "tag": "Pathwise valuation – 경로 수 2^(N−1)", "vig": 12, "stem": "Is Maalouf most likely correct in his description of pathwise valuation?", "opts": {"A": "Yes.", "B": "No, the values on each path are weighted by their probability of occurrence.", "C": "No, he is incorrect regarding the number of paths needed to value the four-year bond."}, "ans": "C", "en": "(A) Incorrect because Maalouf is incorrect regarding the number of paths needed to value the four-year bond.\n(B) Incorrect because the values for each path are averaged to determine the value of the security. That is, the paths are assumed to have equal probability of occurring.\n(C) Correct. Valuing a four-year bond requires 23 = 8 interest rate paths. The discount rate for cash flows occurring in the first period is known with certainty and forms the base of the interest rate tree. The one-year forward rates for one, two, and three years from now are unknown and described by the branches of the tree. For a one-year tree, the choices from Time 0 are u or d, where u indicates interest rates going up and d indicates interest rates going down. For a two-year tree, interest rates can increase or decrease from where they are after one year, so there are 2 × 2 = 22 = 4 paths, or uu, ud, du, and dd. In general, the number of paths is 2N, where N is the number of periods. For the three-year tree, the possible paths from Time 0 are uuu, uud, udu, udd, duu, dud, ddu, and ddd.", "ko": "N년 채권의 금리 경로 수 = 2^(N−1). 첫 기간 금리는 오늘 알려져 있으므로 불확실한 forward는 N−1개. 4년 채권 → 2³ = 8개 경로(16개 아님). 각 경로는 동일 확률로 단순 평균.", "trap": "경로 수 = 2^(N−1), 2^N 아님. 1기간 금리는 이미 알려져 있음.", "f": "# paths = 2^(N−1)", "why": {"A": "Maalouf가 '각 경로 값을 평균'한다고 한 것은 맞습니다(동일 확률이므로 단순평균). 'Yes'가 아닌 이유는 경로 수(16)가 틀렸기 때문입니다.", "B": "lognormal 이항트리에서 경로들은 동일 확률이므로 단순 평균 = 확률가중 평균. 이 부분은 오류가 아닙니다."}, "orig": "ECO Module 2 Q27"}, {"id": "ECO-M2-Q28", "src": "ECO 오답", "module": 2, "tag": "Monte Carlo vs Binomial tree 차이", "vig": 12, "stem": "Of the three differences Maalouf describes between the binomial tree approach to fixed-income valuation and the Monte Carlo simulation approach, he is least likely correct regarding:", "opts": {"A": "Difference 1.", "B": "Difference 2.", "C": "Difference 3."}, "ans": "A", "en": "(A) Correct. A Monte Carlo forward rate simulation randomly generates a large number of interest rate paths that will correctly value benchmark bonds only by chance. A fixed amount, known as a drift term, is added to every forward interest rate on every simulated path to calibrate the simulation so that the values estimated for benchmark bonds equal their market prices.\n(B) Incorrect because Monte Carlo simulation is commonly applied to securities with path-dependent cash flows. Interest rate trees cannot be used to value these securities.\n(C) Incorrect because Monte Carlo requires simulation of a limited (though large) number of interest rate paths out of all possible paths, whereas in binomial tree valuation all paths on the interest rate tree are considered.", "ko": "Difference 1이 틀렸습니다. Monte Carlo로 무작위 생성한 경로는 '우연히'만 벤치마크 가격을 맞추므로, 모든 경로의 모든 금리에 상수(drift adjustment)를 더해 벤치마크 가격과 일치하도록 calibration해야 합니다. Pathwise valuation에는 이런 상수 조정이 없습니다(‘pathwise에 상수를 더한다’는 오답). 조정 방향: 가치가 너무 높으면 +상수, 너무 낮으면 −상수.", "trap": "Monte Carlo도 calibration 필요(drift 상수 추가). 'calibration 불필요'는 오답 단골.", "f": "MC calibration: 모든 경로 금리 + 상수 → PV(benchmark) = 시장가", "why": {"B": "Difference 2는 맞습니다: 경로의존 현금흐름(MBS 등)은 Monte Carlo로 평가하고, 트리는 노드당 하나의 CF만 허용합니다.", "C": "Difference 3도 맞습니다: Monte Carlo는 일부(대량) 경로만 샘플링, 트리는 모든 경로를 고려."}, "orig": "ECO Module 2 Q28"}, {"id": "ECO-M2-Q30", "src": "ECO 오답", "module": 2, "tag": "Arbitrage-free 가치 vs 시장가격 (다시장)", "vig": 13, "stem": "According to the data in Exhibits 1 and 2, in which trading location is the bond most likely mispriced?", "opts": {"A": "Dubai", "B": "Shanghai", "C": "New York"}, "ans": "C", "en": "C is correct. New York: 4/1.05 + 104/1.06^2 = 96.369, versus a quote of 94.630 → underpriced (mispriced). Dubai: 1/1.05 + 101/1.06^2 = 90.842 (= quote). Shanghai: 2/1.05 + 102/1.06^2 = 92.684 (= quote).", "ko": "2년 채권을 spot으로 할인. New York(쿠폰 4%): 4/1.05 + 104/1.06² = 96.369 vs 호가 94.630 → 저평가(오가격). Dubai(1%): 1/1.05 + 101/1.06² = 90.842 = 호가, Shanghai(2%): 2/1.05 + 102/1.06² = 92.684 = 호가.", "trap": "coupon rate 열이 아닌 spot rate 열로 할인. 세 시장을 모두 계산해 비교.", "f": "V = Σ CF_t/(1+z_t)^t", "why": {"A": "Dubai 공정가 90.842 = 호가 90.842 → 정상 가격.", "B": "Shanghai 공정가 92.684 = 호가 92.684 → 정상 가격."}, "orig": "ECO Module 2 Q30"}, {"id": "ECO-M2-Q31", "src": "ECO 오답", "module": 2, "tag": "트리 평가 – backward induction", "vig": 13, "stem": "Which of Zhang’s three steps to value bonds with embedded options is least likely correct?", "opts": {"A": "Step 1", "B": "Step 2", "C": "Step 3"}, "ans": "C", "en": "(A) Incorrect. Steps 1 and 2 are correct steps in constructing a binomial interest rate tree.\n(B) Incorrect. Steps 1 and 2 are correct steps in constructing a binomial interest rate tree.\n(C) Correct. Step 3 (Starting with the current market price, calculate each successive node’s value.) is incorrect. To find the value of a bond at a particular node in a binomial tree, the backward induction methodology is used. Starting with the known bond valuation at maturity (barring default), preceding values can be calculated backwards using the interest rate model generated.", "ko": "Step 3이 틀렸습니다. 노드 가치는 '현재 시장가격에서 출발'하는 것이 아니라, 만기의 알려진 가치(원금+쿠폰)에서 출발해 거꾸로(backward induction) 계산합니다.", "trap": "Backward induction = 만기 → 현재. 시장가격에서 출발하지 않음.", "f": "", "why": {"A": "Step 1(벤치마크 가격으로 현재 par curve 결정)은 트리 구축의 올바른 단계입니다.", "B": "Step 2(변동성 추정 후 미래 금리 경로 계산)도 올바른 단계입니다."}, "orig": "ECO Module 2 Q31"}, {"id": "ECO-M2-Q32", "src": "ECO 오답", "module": 2, "tag": "Calibration 요소 – 벤치마크 vs 평가대상 채권", "vig": 13, "stem": "When describing calibrating the interest rate tree, Holly is least likely correct with respect to the:", "opts": {"A": "volatility assumption.", "B": "assumption of log-normality.", "C": "value of the bond being evaluated."}, "ans": "C", "en": "(A) Incorrect, as they are part of the interest rate tree calibration process.\n(B) Incorrect, as they are part of the interest rate tree calibration process.\n(C) Correct. Calibration of the interest rate tree is dependent on a volatility assumption, an interest rate model, and the observed market value of the benchmark bond—not the bond being evaluated. The assumption of log-normality results in the binomial tree spreading out around the implied forward rate curve, but slightly higher.", "ko": "Calibration은 변동성 가정, 금리 모형(lognormal), '벤치마크 채권'의 관측 시장가격과 일치하도록 하는 과정입니다. Holly가 '평가 대상 채권의 시장가'라고 한 것이 틀렸습니다. 평가 대상 채권 가격에 맞추면 오가격을 찾을 수 없습니다.", "trap": "Calibrate to BENCHMARK bond, not the bond being valued.", "f": "", "why": {"A": "변동성 가정은 calibration의 구성요소가 맞습니다.", "B": "lognormal 가정도 맞습니다(트리가 forward 커브 주변으로, 약간 위로 퍼짐)."}, "orig": "ECO Module 2 Q32"}, {"id": "ECO-M2-Q34", "src": "ECO 오답", "module": 2, "tag": "Interest rate tree 구성 – 금리 모형의 factor", "vig": 14, "stem": "Goll’s response to Zhong’s question is least likely correct with respect to:", "opts": {"A": "the interest model.", "B": "interest rate volatility.", "C": "the benchmark yield curve."}, "ans": "A", "en": "(A) Correct. Goll’s response to Zhong is incorrect with respect to the interest rate model. Goll states that the factors in the interest rate model must have predictable paths, which is incorrect. The factors that explain the dynamics of interest rates are random or stochastic. Goll is correct regarding the assumption of interest rate volatility and the current benchmark yield curve.\n(B) Incorrect. She is correct that an interest rate tree is based on an assumption about interest rate volatility.\n(C) Incorrect. She is correct that the forward rates on the tree must be consistent with the current benchmark yield curve.", "ko": "Goll의 '금리 모형이 예측 가능한 경로(predictable paths)를 가진 factor를 식별한다'가 틀렸습니다. 금리 동학을 설명하는 factor는 무작위(stochastic)입니다. 변동성 가정과 벤치마크 커브 일관성 언급은 맞습니다. 금리가 예측 가능하다면 트리가 갈라질 이유가 없고 옵션 행사 여부가 오늘 확정되어 embedded option 가치가 0이 됩니다 — 불확실성이 옵션 가치의 원천.", "trap": "금리 모형 factor = random/stochastic. 'predictable'이라는 단어가 함정.", "f": "", "why": {"B": "트리는 금리 변동성 가정에 기반합니다 — Goll 설명이 맞습니다.", "C": "트리의 forward rate는 현재 벤치마크 커브와 일관되어야 합니다 — 맞습니다."}, "orig": "ECO Module 2 Q34"}, {"id": "ECO-M2-Q39", "src": "ECO 오답", "module": 2, "tag": "Value additivity – stripping & reconstitution 차익", "vig": 15, "stem": "Based on the market price of the Tangoran government bond and the interest rates in Exhibit 1, what profitable arbitrage opportunity should Hake’s algorithm most likely identify?", "opts": {"A": "Buying the strips and selling the bond", "B": "Buying the bond and selling the strips", "C": "Buying the Year 1 and Year 2 strips and selling the Year 3 strip"}, "ans": "A", "en": "A is correct. Value of the bond's cash flows at spot rates: 3.20/1.011 + 3.20/1.0150^2 + 103.20/1.0201^3 = 3.1652 + 3.1059 + 97.2105 = 103.4816. Strips can be purchased for $103.4816 and reconstituted into the bond, which can be sold for $103.50.\nB incorrectly uses par rates (value 103.519). C is incorrect because no strip prices are given for comparison.", "ko": "Spot으로 할인한 strip 가치 = 3.20/1.011 + 3.20/1.0150² + 103.20/1.0201³ = 103.4816 < 시장가 103.50. strip을 사서 재결합(reconstitution) 후 채권을 103.50에 매도 → 차익.", "trap": "Strip(zero) 가치 = spot 할인. par/forward 열 사용 금지. 싸게 사고(strip) 비싸게 판다(bond).", "f": "Σ strip value < bond price → buy strips, reconstitute, sell bond", "why": {"B": "par rate로 잘못 할인하면 103.519 > 103.50이 되어 반대 방향(채권 매수·strip 매도)으로 착각합니다. strip 가치는 spot으로 할인해야 합니다.", "C": "strip 개별 시장가격이 주어지지 않았으므로 strip끼리 비교할 근거가 없습니다. 채권 전체 vs strip 합을 비교해야 합니다."}, "orig": "ECO Module 2 Q39"}, {"id": "ECO-M2-Q43", "src": "ECO 오답", "module": 2, "tag": "Option-free 채권: tree 가치 = spot 가치", "vig": 15, "stem": "Assuming Annisquam’s spot rate valuation is correct, why does his model most likely produce a different result?", "opts": {"A": "He is valuing a non-benchmark bond.", "B": "The yield curve is downward sloping.", "C": "The model is incorrect because both methodologies should value the bonds equally."}, "ans": "C", "en": "(A) Incorrect because the use of a benchmark bond would not impact the valuation.\n(B) Incorrect because the shape of the curve would not impact valuations under the two methodologies.\n(C) Correct. The binomial tree is based on the spot rate curve and a no arbitrage condition, therefore any option-free bond should have the same value whether using the spot rate curve or the binomial tree.", "ko": "Binomial tree는 spot curve에 calibration되고 무차익 조건을 만족하므로, option-free 채권이면 어떤 커브 모양이든·벤치마크 여부와 관계없이 두 방법의 가치가 같아야 합니다. 값이 다르면 모형(calibration)이 잘못된 것입니다.", "trap": "'값이 다르다'의 원인은 항상 calibration 오류(모형 오류).", "f": "", "why": {"A": "비벤치마크 채권이어도 option-free면 두 방법의 가치는 같습니다.", "B": "하향 커브든 상향 커브든 커브 모양은 두 방법의 일치 여부에 영향을 주지 않습니다."}, "orig": "ECO Module 2 Q43"}, {"id": "ECO-M2-Q44", "src": "ECO 오답", "module": 2, "tag": "Monte Carlo calibration – drift 상수", "vig": 15, "stem": "To correct the problem Hake encounters when using a Monte Carlo simulation, he would most likely:", "opts": {"A": "adjust the volatility assumption.", "B": "increase the number of simulations.", "C": "add a constant to all interest rates on all paths."}, "ans": "C", "en": "(A) Incorrect because adjusting the volatility assumption will generate another random value not equal to the benchmark bond value. The benchmark bond is option-free, so its value should not be affected by interest rate volatility.\n(B) Incorrect because increasing the model beyond 2000 paths will not lead to a different average value for the benchmark bond.\n(C) Correct. Using a Monte Carlo simulation, the model will produce benchmark bond values equal to the market prices only by chance. A constant is added to all interest rates on all paths such that the average present value for each benchmark bond equals its market value.", "ko": "Monte Carlo 경로는 벤치마크 가격을 우연히만 맞춥니다. 모든 경로의 모든 금리에 상수(drift adjustment)를 더해 벤치마크 채권의 평균 PV = 시장가격이 되도록 합니다. 방향: 시뮬레이션 평균 가치가 시장가보다 높으면 금리에 상수를 '더하고', 낮으면 '뺍니다'(Schweser). 노트 메모(값 > 시장가 → 뺌)는 반대이니 고쳐두세요.", "trap": "MC 가격 불일치 해결 = 상수 더하기(drift adjustment).", "f": "", "why": {"A": "벤치마크는 option-free라 가치가 변동성과 무관합니다. 변동성을 바꿔도 해결되지 않습니다.", "B": "경로를 늘리면 통계적 정확도만 오를 뿐, 체계적인 가격 차이는 남습니다."}, "orig": "ECO Module 2 Q44"}, {"id": "ECO-M2-Q46", "src": "ECO 오답", "module": 2, "tag": "Monte Carlo 특징", "vig": null, "stem": "Which of the following statements regarding the Monte Carlo method to value bonds is most accurate?", "opts": {"A": "It is not appropriate for securities whose cash flows are path dependent", "B": "The greater the number of paths, the closer the model is to the security's fundamental value", "C": "A probability distribution and a volatility assumption are needed to generate interest rate paths"}, "ans": "C", "en": "(A) Incorrect because Monte Carlo methods are often used when a security’s cash flows are path dependent. Cash flows are path dependent when the cash flow to be received depends on the path followed to reach its current level as well as the current level itself.\n(B) Incorrect because more paths increase the accuracy of the estimate in a statistical sense, but this does not mean the model is closer to the true fundamental value of the security. The Monte Carlo method is only as good as the valuation model used and the accuracy of the inputs.\n(C) Correct because interest rate paths are generated on the basis of some probability distribution and a volatility assumption, and the model is fit to the current benchmark term structure of interest rates.", "ko": "금리 경로는 어떤 확률분포와 변동성 가정에 따라 생성되고, 모형은 현재 벤치마크 term structure에 맞춰집니다.", "trap": "M2 Q18과 동일 함정: 'more paths → true value'는 오답.", "f": "", "why": {"A": "반대입니다. Monte Carlo는 경로의존(path-dependent) 현금흐름(MBS 등)에 주로 쓰입니다.", "B": "경로↑ → 통계적 정확도↑일 뿐, 진짜 펀더멘털 가치에 더 가까워지는 것은 아닙니다."}, "orig": "ECO Module 2 Q46"}, {"id": "ECO-M2-Q47", "src": "ECO 오답", "module": 2, "tag": "Ho–Lee = 최초의 arbitrage-free 모형 (binomial lattice)", "vig": null, "stem": "Which of the following term structure models is arbitrage-free and uses a binomial lattice approach?", "opts": {"A": "The Vasicek model", "B": "The Ho–Lee model", "C": "The Cox–Ingersoll–Ross model"}, "ans": "B", "en": "(A) Incorrect because the Vasicek model is an equilibrium model, not an arbitrage-free model. The Vasicek model is viewed as an equilibrium term structure model. Similar to the CIR model, the Vasicek model includes mean reversion...The stochastic or volatility term follows a random normal distribution for which the mean is zero and the standard deviation is 1.\n(B) Correct because the first arbitrage-free model was introduced by Ho and Lee (1986). The model is calibrated to market data and uses a binomial lattice approach to generate a distribution of possible future interest rates.\n(C) Incorrect because the Cox-Ingersoll-Ross model is an equilibrium based model, not an arbitrage based model. The Cox–Ingersoll–Ross (CIR) model assumes interest rates follow a mean-reverting process. However, the variance of rate changes differs depending on the level of rates.", "ko": "Ho–Lee(1986)는 최초의 arbitrage-free 모형으로 시장 데이터에 calibration되고 binomial lattice로 미래 금리 분포를 생성합니다. Vasicek·CIR은 equilibrium 모형.", "trap": "Arbitrage-free → Ho–Lee, KWF. 나머지(CIR, Vasicek)는 equilibrium.", "f": "", "why": {"A": "Vasicek은 equilibrium 모형(평균회귀, 일정 변동성).", "C": "CIR은 equilibrium 모형(평균회귀, 변동성이 금리수준에 따라 변함)."}, "orig": "ECO Module 2 Q47"}, {"id": "ECO-M2-Q49", "src": "ECO 오답", "module": 2, "tag": "Binomial tree calibration 정의", "vig": null, "stem": "Which of the following statements regarding the calibration of a binomial interest rate tree to the term structure is most accurate?", "opts": {"A": "The interest rate model used in the process is based on the normal distribution", "B": "The volatility assumption used in the binomial tree impacts the valuation of an option-free bond", "C": "The interest rate tree is fit to the current yield curve so that the model produces the benchmark bond values"}, "ans": "C", "en": "(A) Incorrect because the model is based on a lognormal distribution rather than a normal distribution. Two assumptions are required: an interest rate model and a volatility of interest rates. Recall an interest rate model puts structure on the randomness. We are going to use the lognormal random walk, and the resulting tree structure is often referred to as a lognormal tree.\n(B) Incorrect because the valuation of a bond using spot rates and the valuation of a bond from an interest rate tree will be the same regardless of the volatility assumption used in the model.\n(C) Correct because the first step in constructing a binomial interest tree is to describe the calibration of a binomial interest rate tree to match a specific term structure. We do this to ensure that the model is arbitrage free. We fit the interest rate tree to the current yield curve by choosing interest rates such that the model produces the benchmark bond values. Also, finding the rates in the tree is an iterative process, and the interest rates are found numerically.", "ko": "Calibration = 트리 금리를 선택해 모형이 벤치마크 채권 가치를 정확히 산출하도록(현재 수익률곡선에 fit) 만드는 과정. 반복(iterative)적·수치적으로 금리를 찾습니다.", "trap": "Lognormal(O) / Normal(X). Option-free는 변동성 무관.", "f": "", "why": {"A": "금리 모형은 정규분포가 아니라 lognormal 분포(lognormal random walk)를 사용합니다.", "B": "Option-free 채권 가치는 변동성 가정에 영향받지 않습니다(spot 할인 가치와 동일)."}, "orig": "ECO Module 2 Q49"}, {"id": "ECO-M2-Q50", "src": "ECO 오답", "module": 2, "tag": "Spot 가치 ≠ Tree 가치가 되는 유일한 경우", "vig": null, "stem": "The value of an option-free bond obtained when discounting cash flows with spot rates will most likely differ from the value obtained by using a binomial interest rate tree when:", "opts": {"A": "interest rate volatility is assumed to be zero.", "B": "the binomial interest rate tree is not properly calibrated to the spot curve.", "C": "interest rates are simulated using an insufficient number of potential paths."}, "ans": "B", "en": "(A) Incorrect because the valuation of a bond using spot rates and the valuation of a bond from an interest rate tree will be the same regardless of the volatility assumption used in the model as long as the binomial interest rate tree is calibrated to the current benchmark yield curve.\n(B) Correct because the binomial interest rate tree should produce the same value as when discounting the cash flows with the spot rates. An option-free bond that is valued by using the binomial interest rate tree should have the same value as when discounting by the spot rates, which is true because the binomial interest rate tree is arbitrage free. If the binomial interest rate tree is not calibrated to the current spot curve, then it is not arbitrage-free and would not produce the same value as when discounting the cash flows with the spot rates.\n(C) Incorrect because simulation of interest rate paths relates to the Monte Carlo method and not the binomial interest rate tree framework, which has a specific number of interest rate paths. The Monte Carlo method is an alternative method for simulating a sufficiently large number of potential interest rate paths to discover how the value of a security is affected. This method involves randomly selecting paths to approximate the results of a complete pathwise valuation.", "ko": "Option-free 채권은 calibration된 트리와 spot 할인의 가치가 같아야 합니다. 다르게 나오는 경우는 트리가 spot curve에 제대로 calibration되지 않았을 때(= arbitrage-free가 아님)뿐입니다. 정리: V(tree) = V(spot) ⟺ calibration 완료. Spot 할인은 태생적으로 arbitrage-free, 트리는 calibration으로, Monte Carlo는 drift adjustment로 arbitrage-free를 달성합니다.", "trap": "M2 Q43과 같은 개념. 차이의 원인 = calibration 실패.", "f": "", "why": {"A": "변동성 가정(0 포함)과 무관하게 calibration만 되어 있으면 값은 같습니다.", "C": "경로 수 부족은 Monte Carlo의 문제입니다. 이항트리는 경로 수가 정해져 있습니다."}, "orig": "ECO Module 2 Q50"}, {"id": "ECO-M2-Q52", "src": "ECO 오답", "module": 2, "tag": "Lognormal tree – forward curve 주변으로 퍼짐", "vig": null, "stem": "A correctly calibrated binomial interest rate tree most likely spreads out around the:", "opts": {"A": "spot rate curve.", "B": "forward rate curve.", "C": "benchmark rate curve."}, "ans": "B", "en": "(A) Incorrect because the binomial tree spreads out around the forward rate curve. The average is slightly higher than the implied forward rate because of the assumption of lognormality.\n(B) Correct because the binomial tree spreads out around the forward rate curve. The average is slightly higher than the implied forward rate because of the assumption of lognormality.\n(C) Incorrect because the binomial tree spreads out around the forward rate curve. The average is slightly higher than the implied forward rate because of the assumption of lognormality.", "ko": "Calibration된 이항트리는 forward rate curve를 중심으로 퍼지며, lognormal 가정 때문에 평균은 implied forward rate보다 약간 높습니다.", "trap": "트리의 각 노드 금리 = 1기간 forward rate.", "f": "r_up = r_down × e^(2σ)", "why": {"A": "Spot curve가 아니라 forward curve 중심입니다(각 노드는 1기간 forward rate).", "C": "벤치마크 커브(par/spot)가 아니라 forward curve 중심입니다."}, "orig": "ECO Module 2 Q52"}, {"id": "ECO-M2-Q53", "src": "ECO 오답", "module": 2, "tag": "Backward induction – 쿠폰 포함 후 현재 spot으로 할인", "vig": null, "stem": "An analyst gathers the following data about a binomial interest rate tree for an option-free, annual coupon bond maturing in two years.\n\tTime 1 Bond Value\tTime 1 Forward Rate\nUpper node\t99.715\t2.292%\nLower node\t100.247\t1.749%\nIf the current 1-year spot rate is 1.5% and the bond pays a coupon of 2.0%, the current value of the bond using the backward induction methodology is closest to:", "opts": {"A": "98.50.", "B": "99.96.", "C": "100.47."}, "ans": "C", "en": "(A) Incorrect because the value does not include the coupon.\nValue = ((99.715 × 0.5) + (100.247 x 0.5))/(1 + 0.015)\nValue = 98.50345 ≈ 98.50\n(B) Incorrect because the value discounts the bonds using each forward rate.\nValue = ((99.715 + (100 × 0.02))/(1 + 0.02292)) × 0.5 + ((100.247+(100 × 0.02))/(1 + 0.01749)) × 0.5\nValue = 99.96268 ≈ 99.96\n(C) Correct because both bond values at time 1 have to be discounted by the spot rate, including the coupon.\nValue = ((99.715 × 0.5) + (100.247 × 0.5) + (100 × 0.02)) / (1 + 0.015)\nValue = 100.4739 ≈ 100.47", "ko": "Time 1 노드 가치(이미 Time 1 forward로 할인된 값)의 평균에 Time 1 쿠폰 2를 더한 뒤 Time 0 금리(1.5%)로 할인: [0.5×99.715 + 0.5×100.247 + 2]/1.015 = 100.47.", "trap": "Time 1 노드 가치는 이미 Time 1 시점 가치. 쿠폰 더하고 '현재 노드 금리'로 1번만 할인.", "f": "V0 = [C + 0.5(V_u + V_d)]/(1 + r0)", "why": {"A": "쿠폰 2를 빠뜨린 값(98.50). Time 1에 받는 쿠폰을 포함해야 합니다.", "B": "Time 1 노드 가치를 Time 1 forward로 '다시' 할인한 이중할인 오류(99.96). Time 0으로 가져올 때는 Time 0 금리(1.5%)를 씁니다."}, "orig": "ECO Module 2 Q53"}, {"id": "ECO-M2-Q56", "src": "ECO 오답", "module": 2, "tag": "Arbitrage-free valuation = spot curve 할인", "vig": null, "stem": "The arbitrage-free valuation of an option-free corporate bond is equal to the present value of bond's expected cash flows discounted using the:", "opts": {"A": "spot curve.", "B": "forward curve.", "C": "bond's yield to maturity."}, "ans": "A", "en": "(A) Correct because the traditional approach to valuing bonds is to discount all cash flows with the same discount rate as if the yield curve were flat. However, a bond is properly thought of as a package or portfolio of zero-coupon bonds, also referred to as zeros or discount instruments. Each zero-coupon bond in such a package can be valued separately at a discount rate that depends on the shape of the yield curve and when its single cash flow is delivered in time. The term structure of these discount rates is referred to as the spot curve. Bond values derived by summing the present values of the individual zeros (cash flows) determined by such a procedure can be shown to be arbitrage free.\n(B) Incorrect because the traditional approach to valuing bonds is to discount all cash flows with the same discount rate as if the yield curve were flat. However, a bond is properly thought of as a package or portfolio of zero-coupon bonds, also referred to as zeros or discount instruments. Each zero-coupon bond in such a package can be valued separately at a discount rate that depends on the shape of the yield curve and when its single cash flow is delivered in time. The term structure of these discount rates is referred to as the spot curve. Bond values derived by summing the present values of the individual zeros (cash flows) determined by such a procedure can be shown to be arbitrage free.\n(C) Incorrect because the traditional approach to valuing bonds is to discount all cash flows with the same discount rate as if the yield curve were flat. However, a bond is properly thought of as a package or portfolio of zero-coupon bonds, also referred to as zeros or discount instruments. Each zero-coupon bond in such a package can be valued separately at a discount rate that depends on the shape of the yield curve and when its single cash flow is delivered in time. The term structure of these discount rates is referred to as the spot curve. Bond values derived by summing the present values of the individual zeros (cash flows) determined by such a procedure can be shown to be arbitrage free.", "ko": "채권은 zero-coupon 채권들의 묶음이므로, 각 현금흐름을 그 시점 spot rate로 할인해 합산하면 arbitrage-free 가치가 됩니다.", "trap": "Arbitrage-free = spot. YTM은 결과값(가격에서 역산)일 뿐.", "f": "V = Σ CF_t/(1+z_t)^t", "why": {"B": "Forward rate는 미래 구간 금리로, 현재가치 할인에는 spot(또는 forward의 누적곱)이 필요합니다. forward를 그대로 할인율로 쓰지 않습니다.", "C": "단일 YTM 할인은 flat curve를 가정한 전통적 방식으로 arbitrage-free가 아닙니다."}, "orig": "ECO Module 2 Q56"}, {"id": "ECO-M2-Q60", "src": "ECO 오답", "module": 2, "tag": "Zero curve 가격 = arbitrage-free lattice 가격", "vig": null, "stem": "An analyst calculates the arbitrage-free value of an option-free fixed-rate coupon bond. Compared to the price found using the zero-coupon yield curve, the price using an arbitrage-free binomial lattice must be:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "B", "en": "(A) Incorrect because the two values must be the same.\n(B) Correct because pricing using the zero-coupon yield curve and pricing using an arbitrage-free binomial lattice are arbitrage free, and thus the values must be the same.\n(C) Incorrect because the two values must be the same.", "ko": "Option-free 채권은 zero-coupon curve 할인과 arbitrage-free binomial lattice가 모두 무차익 평가이므로 가격이 같아야 합니다.", "trap": "Option-free + arbitrage-free 두 방법 → 항상 동일.", "f": "", "why": {"A": "두 값은 같아야 합니다.", "C": "두 값은 같아야 합니다."}, "orig": "ECO Module 2 Q60"}, {"id": "ECO-M2-Q61", "src": "ECO 오답", "module": 2, "tag": "Bootstrapping 후 arbitrage-free 가격", "vig": null, "stem": "An investor analyses a 2-year, 5% annual coupon, option-free bond with the same risk and liquidity characteristics as the following benchmarks:\n\tPar Rate\n1-year annual coupon bond\t3%\n2-year annual coupon bond\t4%\nThe arbitrage-free price for the bond is closest to:", "opts": {"A": "101.8861.", "B": "101.8951.", "C": "101.9328."}, "ans": "B", "en": "(A) Incorrect because it calculates the bond price using 4% yield for discounting the bond's cashflows in both years: P0 = 5/1.04 + (5 + 100)/1.042 ≈ 101.8861.\n(B) Correct because the arbitrage-free value is the sum of the present values of expected future values using the benchmark spot rates.\nStep 1: find the correct spot rate (zero-coupon rates) for each year’s cash flow. The spot rates may be determined using bootstrapping, which is an iterative process.\nThe one-year spot rate z1 = one-year par rate = 3%\nThe two-year spot rate z2 is determined by solving the equation:\n1 = Par rate/(1 + z1) + (Par rate + 1)/(1+ z2)^2 or\n1 = 0.04/(1 + 0.03) + (0.04 + 1)/(1 + z2)^2\n(0.04 + 1)/(1+ z2)^2 = 1 – 0.04/(1 + 0.03) ≈ 1 – 0.038834 ≈ 0.961165\n(1 + z2)^2 = 1.04/0.961165 ≈ 1.082020\n1 + z2 = 1.082020^0.5 ≈ 1.040202\nz2 = 1.0402 – 1 = 0.040202 = 4.0202%\nStep 2: Compute the arbitrage-free price for the bond:\nP0 = 5/1.03 + (5 + 100)/1.0402022 ≈ 101.8951.\n(C) Incorrect because it uses 3% yield for the first year and 4% yield for the second year for discounting bond's cash flows: P0 = 5/1.03 + (5 + 100)/1.042 ≈ 101.9328.\nPractice Topics\nCFA-26-11-LII-C: Fixed Income", "ko": "z1 = 3%. 1 = 0.04/1.03 + 1.04/(1+z2)² → z2 = 4.0202%. 가격 = 5/1.03 + 105/1.040202² = 101.8951.", "trap": "par rate를 그대로 spot처럼 쓰는 실수. 2년 이상은 반드시 bootstrapping.", "f": "1 = p2/(1+z1) + (1+p2)/(1+z2)^2", "why": {"A": "두 해 모두 4%(2년 par)로 할인 → 101.8861. par rate는 spot이 아닙니다.", "C": "1년 3%, 2년 4%(par rate)로 할인 → 101.9328. 2년차는 bootstrapping한 z2 = 4.0202%를 써야 합니다."}, "orig": "ECO Module 2 Q61"}, {"id": "ECO-M2-Q22", "src": "ECO 관련유형", "module": 2, "tag": "Ho–Lee vs KWF", "vig": null, "stem": "Which of the following statements comparing the Ho–Lee and Kalotay–Williams–Fabozzi (KWF) equilibrium term structure models is correct?", "opts": {"A": "The Ho–Lee model assumes constant volatility, while the KWF model does not.", "B": "The KWF model incorporates the possibility of negative rates, while the Ho–Lee model does not.", "C": "The KWF model describes the log of the dynamics of the short rate, while the Ho–Lee model does not."}, "ans": "C", "en": "C is correct. The Kalotay–Williams–Fabozzi equilibrium term structure model is similar to the Ho–Lee model in that it assumes constant drift, no mean reversion, and constant volatility, but the KWF model describes the log of the dynamics of the short rate, while the Ho–Lee model does not.", "ko": "KWF는 Ho–Lee와 유사(일정 drift, 평균회귀 없음, 일정 변동성)하지만 단기금리의 'log' 동학을 모델링합니다(lognormal → 음(−) 금리 불가). Ho–Lee는 정규분포라 음의 금리가 가능합니다.", "trap": "KWF = log(r) → 음수 불가. Ho–Lee = r 정규 → 음수 가능.", "f": "Ho–Lee: dr = θt dt + σdz,  KWF: d ln(r) = θt dt + σdz", "why": {"A": "둘 다 일정(constant) 변동성을 가정합니다.", "B": "반대입니다. 음의 금리가 가능한 것은 Ho–Lee(정규분포)입니다."}, "orig": "ECO Module 2 Q22"}, {"id": "ECO-M2-Q36", "src": "ECO 관련유형", "module": 2, "tag": "Spot 가치 = Tree 가치 조건 (calibration)", "vig": 14, "stem": "With respect to Wenger’s question on valuing BIR Corporation bonds using the rates from Exhibit 1, who is most likely correct?", "opts": {"A": "Goll", "B": "Geng", "C": "Tandon"}, "ans": "C", "en": "(A) Incorrect. Goll’s statement has no bearing on valuation.\n(B) Incorrect. The statement made by Geng is incorrect, because the binomial interest rate tree is based on a specific interest rate model and an assumption of rate volatility; however, the calculations of forward rates in Exhibit 1 do not require an interest rate volatility assumption.\n(C) Correct. Tandon is correct. The binomial interest rate tree will produce the same arbitrage-free value for a bond as the valuation from using spot rates if the binomial interest rate tree is calibrated to match the term structure of the spot rate curve. Calibration means that the binomial interest rate tree produces the same benchmark bond values as the spot rates. The statement made by Geng is incorrect, because the binomial interest rate tree is based on a specific interest rate model and an assumption of rate volatility; however the calculations of forward rates in Exhibit 1 do not require an interest rate volatility assumption. Goll’s statement has no bearing on valuation.", "ko": "Tandon이 맞습니다: 트리가 Exhibit 1 term structure에 calibration되어 벤치마크 가치를 정확히 재현해야 spot 할인 가치와 같아집니다. Geng의 조건(‘forward rate의 변동성 = 트리 변동성’)은 성립 불가 — spot→forward 변환은 순수 산술이라 변동성이 개입하지 않습니다.", "trap": "V(tree) = V(spot) ⟺ calibration 완료. 다른 조건(변동성 일치 등)은 함정.", "f": "(1+S2)² = (1+S1)(1+f1,1) — 변동성 무관", "why": {"A": "Goll의 '트리는 여러 경로가 있다'는 말은 사실이지만 option-free 채권 가치에는 영향이 없습니다(경로와 무관하게 같은 값).", "B": "Exhibit 1의 forward rate 계산에는 변동성 가정이 필요 없습니다. 변동성이 필요한 것은 트리뿐."}, "orig": "ECO Module 2 Q36"}, {"id": "ECO-M2-Q45", "src": "ECO 관련유형", "module": 2, "tag": "Pathwise valuation – 경로 수", "vig": null, "stem": "When valuing a 4-year zero-coupon bond using pathwise valuation, the total number of possible paths is:", "opts": {"A": "4.", "B": "8.", "C": "16."}, "ans": "B", "en": "(A) Incorrect because for a three-year zero-coupon bond. From Pascal’s Triangle, there are four possible paths to arrive at Year 3: HH, HT, TH, TT.\n(B) Correct because for a four-year zero-coupon bond, there would be eight possible paths to arrive at year 4. HHH HHT HTH THH HTT THT TTH TTT.\n(C) Incorrect because for a five-year zero-coupon bond, there would be 16 possible paths to arrive at year 5. There are only 8 paths for a four-year security.", "ko": "4년 채권 → 불확실한 1년 forward가 3개 → 2³ = 8개 경로.", "trap": "M2 Q27 오답과 같은 개념: 2^(N−1).", "f": "# paths = 2^(N−1)", "why": {"A": "4개는 3년 채권(2²)의 경로 수입니다.", "C": "16개는 5년 채권(2⁴)의 경로 수입니다."}, "orig": "ECO Module 2 Q45"}, {"id": "ECO-M2-Q48", "src": "ECO 관련유형", "module": 2, "tag": "CIR – 변동성이 금리 수준에 따라 변함", "vig": null, "stem": "Which of the following term structure models includes a varying short-rate volatility?", "opts": {"A": "The Vasicek model", "B": "The Ho–Lee model", "C": "The Cox–Ingersoll–Ross model"}, "ans": "C", "en": "(A) Incorrect because unlike the CIR model, interest rates are calculated assuming constant volatility over the period of analysis.\n(B) Incorrect because the Ho–Lee model, similar to the Vasicek model, has constant volatility.\n(C) Correct because another important feature of the CIR model is that the random component varies as rates change. In other words, the short-rate volatility is a function of the short rate. Importantly, at low rates, rt, the term becomes small, which prevents rates from turning negative.", "ko": "CIR 모형의 확률항은 σ√r 형태로, 단기금리 변동성이 금리 수준에 따라 변하며 금리가 낮을수록 작아져 음의 금리를 막습니다.", "trap": "CIR만 'varying volatility(σ√r)'. Vasicek·Ho–Lee는 constant σ.", "f": "CIR: dr = a(b − r)dt + σ√r dz  /  Vasicek: dr = a(b − r)dt + σdz", "why": {"A": "Vasicek은 일정한 변동성(음의 금리 가능).", "B": "Ho–Lee도 일정한 변동성."}, "orig": "ECO Module 2 Q48"}, {"id": "ECO-M2-Q51", "src": "ECO 관련유형", "module": 2, "tag": "Binomial tree 생성 가정", "vig": null, "stem": "The creation of a binominal interest rate tree requires the assumption of:", "opts": {"A": "an interest rate model only.", "B": "the volatility of interest rates only.", "C": "both an interest rate model and the volatility of interest rates."}, "ans": "C", "en": "(A) Incorrect because on a binomial lattice, to obtain the two possible values for the one-year interest rate one year from today two assumptions are required: an interest rate model and a volatility of interest rates.\n(B) Incorrect because on a binomial lattice, to obtain the two possible values for the one-year interest rate one year from today two assumptions are required: an interest rate model and a volatility of interest rates.\n(C) Correct because on a binomial lattice, to obtain the two possible values for the one-year interest rate one year from today two assumptions are required: an interest rate model and a volatility of interest rates.", "ko": "1년 후 두 개의 1년 금리 값을 얻으려면 ① 금리 모형(lognormal 등)과 ② 금리 변동성, 두 가정이 필요합니다.", "trap": "M2 Q15 오답과 연결: 요건은 벤치마크 금리 + 금리 모형 + 변동성.", "f": "", "why": {"A": "금리 모형만으로는 위·아래 금리 폭을 정할 수 없습니다.", "B": "변동성만으로는 금리 분포 구조를 정할 수 없습니다."}, "orig": "ECO Module 2 Q51"}, {"id": "ECO-M2-Q54", "src": "ECO 관련유형", "module": 2, "tag": "Lognormal tree – 상승/하락 확률", "vig": null, "stem": "In the binomial interest rate tree framework, under the assumption of lognormal distribution, the probabilities for the rate going up or down are:", "opts": {"A": "equal.", "B": "functions of the forward rates.", "C": "dependent on interest rate volatility."}, "ans": "A", "en": "(A) Correct because in the lognormal model the probabilities for the rate going up or down are equal.\n(B) Incorrect because while the expected value depends on the level of the forward rates, the probabilities do not. The expected value is a simple average because in the lognormal model the probabilities for the rate going up or down are equal.\n(C) Incorrect because while the higher and lower rates on the binomial tree depend on the volatility assumption, the probabilities do not. The expected value is a simple average because in the lognormal model the probabilities for the rate going up or down are equal.", "ko": "Lognormal 이항모형에서 금리 상승·하락 확률은 각각 0.5로 동일합니다. 그래서 노드 가치는 단순평균 후 할인합니다.", "trap": "변동성은 금리 '간격'을 바꾸지 확률을 바꾸지 않음.", "f": "r_u = r_d × e^(2σ),  p = 0.5", "why": {"B": "기대값 수준은 forward rate에 의존하지만 확률 자체는 아닙니다.", "C": "위·아래 금리의 '폭'은 변동성에 의존하지만 확률은 0.5로 고정."}, "orig": "ECO Module 2 Q54"}, {"id": "ECO-M2-Q57", "src": "ECO 관련유형", "module": 2, "tag": "YTM 기반 가격 vs arbitrage-free 가격", "vig": null, "stem": "An analyst gathers the following information about spot rates:\n• 1-year spot rate: 1.50%\n• 2-year spot rate: 2.00%\n• 3-year spot rate: 4.25%\nA 3-year, 5% annual coupon bond with similar risk as the benchmark is trading at a yield-to-maturity of 4.25%. Compared to the arbitrage-free price, the bond is currently:", "opts": {"A": "undervalued.", "B": "fairly valued.", "C": "overvalued."}, "ans": "A", "en": "(A) Correct because the arbitrage-free price is above the current market price. To be arbitrage free, each cash flow of a bond must be discounted by the spot rate for zero-coupon bonds maturing on the same date as the cash flow.\nCurrent price is P = (5 /(1 + 0.0425)) + (5/(1 + 0.0425)^2) + (105/(1 + 0.0425)^3)\nP =  102.0715 ≈ 102.1\nArbitrage-free price = (5/(1 + 0.015)) + (5/(1 + 0.02)^2) + (105/(1 + 0.0425)^3)\nArbitrage-free price = 102.40664 ≈ 102.4 > 102.1\nThe answer can be deduced by the fact that the 3-year spot rate is equal to the yield to maturity and the other spot rates are lower than the yield to maturity.\n(B) Incorrect because the arbitrage-free price is above the current market price, as shown in the correct answer.\n(C) Incorrect because the arbitrage-free price is above the current market price, as shown in the correct answer.", "ko": "시장가격(YTM 4.25% 일괄 할인) = 102.07, arbitrage-free(spot 1.5%, 2.0%, 4.25%) = 102.41 → 공정가 > 시장가 → 저평가. 직관: 3년 spot = YTM이고 앞쪽 spot들이 YTM보다 낮으니 공정가가 더 높음.", "trap": "공정가 > 시장가 = undervalued(매수).", "f": "", "why": {"B": "spot 할인가 102.41 ≠ 시장가 102.07.", "C": "공정가가 시장가보다 높으므로 고평가가 아닙니다."}, "orig": "ECO Module 2 Q57"}, {"id": "VAR-M2-01", "module": 2, "tag": "Binomial tree backward induction (2년)", "stem": "A two-year, 5% annual-coupon, option-free bond (par 100) is valued with a calibrated binomial tree: Time 0 rate = 2.00%; Time 1 rates = 4.00% (upper) and 3.00% (lower). The bond's value today is closest to:", "opts": {"A": "99.462.", "B": "104.364.", "C": "100.840."}, "ans": "B", "en": "Time 1: 105/1.04 = 100.962; 105/1.03 = 101.942. Time 0: [5 + 0.5(100.962 + 101.942)]/1.02 = 104.364.", "ko": "Time 1 노드: 105/1.04 = 100.962, 105/1.03 = 101.942. Time 0: [5 + 0.5 × (100.962 + 101.942)]/1.02 = 104.364.", "why": {"A": "Time 1 쿠폰(5)을 빠뜨렸습니다.", "C": "Time 1 노드 가치를 Time 1 금리로 한 번 더 할인(이중할인)했습니다."}, "trap": "ECO M2 Q10·Q26·Q53 패턴: 노드마다 쿠폰 더하기, 그 노드 금리로 1번만 할인.", "f": "V = [C + 0.5(V_u + V_d)]/(1 + r_node)", "orig": "변형 (ECO M2 Q53)", "src": "변형", "vig": null}, {"id": "VAR-M2-02", "module": 2, "tag": "Pathwise valuation – 경로 수 2^(N−1)", "stem": "Using a binomial interest rate tree with annual periods, the number of interest rate paths needed for pathwise valuation of a five-year annual-pay bond is:", "opts": {"A": "8.", "B": "16.", "C": "32."}, "ans": "B", "en": "Number of paths = 2^(N−1) = 2^4 = 16 (the first one-year rate is known today).", "ko": "5년 채권: 불확실한 1년 forward가 4개 → 2⁴ = 16개 경로.", "why": {"A": "8개는 4년 채권(2³)입니다.", "C": "32개는 2^N으로 계산한 오류입니다."}, "trap": "ECO M2 Q27(Maalouf의 2^N 오류)과 동일 함정.", "f": "# paths = 2^(N−1)", "orig": "변형 (ECO M2 Q27·Q45)", "src": "변형", "vig": null}, {"id": "VAR-M2-03", "module": 2, "tag": "Equilibrium vs Arbitrage-free 모형 분류", "stem": "Which of the following term structure models assumes mean reversion and constant volatility, and can therefore produce negative interest rates?", "opts": {"A": "Ho–Lee model", "B": "Vasicek model", "C": "Cox–Ingersoll–Ross model"}, "ans": "B", "en": "The Vasicek model is an equilibrium model with mean reversion and constant volatility; rates are normally distributed and can be negative. CIR has volatility proportional to √r (non-negative rates). Ho–Lee is arbitrage-free with no mean reversion.", "ko": "Vasicek: equilibrium, 평균회귀 O, 변동성 일정 → 음의 금리 가능. CIR: 평균회귀 O, 변동성 σ√r → 음의 금리 불가. Ho–Lee: arbitrage-free, 평균회귀 X(시간가변 drift), 음의 금리 가능.", "why": {"A": "Ho–Lee는 음의 금리가 가능하지만 평균회귀가 없습니다(arbitrage-free, 시간가변 drift).", "C": "CIR은 변동성이 금리 수준에 따라 변해 음의 금리를 막습니다."}, "trap": "ECO M2 Q19·Q47·Q48 연결: 모형 특징 표로 암기.", "f": "Vasicek: dr = a(b − r)dt + σdz  /  CIR: dr = a(b − r)dt + σ√r dz", "orig": "변형 (Schweser LOS 24.i Key Concepts)", "src": "변형", "vig": null}, {"id": "VAR-M2-04", "module": 2, "tag": "Monte Carlo drift adjustment 방향", "stem": "An analyst uses a Monte Carlo forward-rate simulation to value a benchmark bond. The average present value across the simulated paths is higher than the benchmark bond's market price. To calibrate the model, the analyst should most likely:", "opts": {"A": "subtract a constant from all interest rates on all paths.", "B": "add a constant to all interest rates on all paths.", "C": "increase the number of simulated paths until the values match."}, "ans": "B", "en": "Calibration entails adding (subtracting) a constant to all rates when the value obtained from the simulated paths is too high (too low) relative to market prices. Higher discount rates lower the simulated value. This produces a drift-adjusted model (Schweser, Reading 24).", "ko": "시뮬레이션 가치 > 시장가격 → 할인율이 너무 낮다는 뜻 → 모든 경로의 모든 금리에 상수를 '더해' 가치를 낮춥니다(drift adjusted model). 시뮬레이션 가치가 너무 낮으면 상수를 뺍니다.", "why": {"A": "금리를 빼면 할인율이 더 낮아져 가치가 더 높아집니다 — 반대 방향. (노트의 '값 > 시장가격이면 상수를 뺌'은 Schweser와 반대이니 수정 필요)", "C": "경로 수를 늘려도 통계적 정확도만 오르고 체계적 차이는 그대로입니다."}, "trap": "가치가 높다 = 금리가 낮다 → 금리를 올린다(상수 +). 가치와 금리는 반대 방향.", "f": "Simulated value too high → add constant / too low → subtract", "orig": "변형 (오답노트 + Schweser R24 Monte Carlo)", "src": "변형", "vig": null}, {"id": "ECO-M3-Q1", "src": "ECO 오답", "module": 3, "tag": "옵션 행사 스타일 – European/American/Bermudan", "vig": 16, "stem": "The call feature of Bond #2 is best described as:", "opts": {"A": "European style.", "B": "American style.", "C": "Bermudan style."}, "ans": "C", "en": "C is correct. The call option embedded in Bond #2 can be exercised only at two predetermined dates: 1 October 20X1 and 1 October 20X2. Thus, the call feature is Bermudan style.", "ko": "미리 정해진 여러 날짜(20X1.10.1, 20X2.10.1)에만 행사 가능 → Bermudan style. European = 단 한 번(특정일), American = 기간 내 언제든.", "trap": "'여러 개의 지정일' = Bermudan.", "f": "European: 1회 / Bermudan: 여러 지정일 / American: 기간 중 언제나", "why": {"A": "European은 단 한 번의 정해진 날에만 행사. 여기는 두 번의 지정일이 있습니다.", "B": "American은 call protection 이후 만기까지 아무 때나 행사 가능. 지정된 날짜에만 가능하면 Bermudan입니다."}, "orig": "ECO Module 3 Q1"}, {"id": "ECO-M3-Q5", "src": "ECO 오답", "module": 3, "tag": "Putable bond 가치 – 트리 backward induction", "vig": 16, "stem": "The value of Bond #3 is closest to:", "opts": {"A": "102.103% of par.", "B": "103.688% of par.", "C": "103.744% of par."}, "ans": "C", "en": "C is correct. Year 2: 104.4/1.04647 = 99.765 → put → 100; 104.4/1.038046 = 100.574; 104.4/1.03115 = 101.246.\nYear 1: [4.4 + 0.5 × (100 + 100.574)]/1.03593 = 101.056; [4.4 + 0.5 × (100.574 + 101.246)]/1.029417 = 102.301.\nYear 0: [4.4 + 0.5 × (101.056 + 102.301)]/1.0225 = 103.744.", "ko": "Year 2: 104.4/1.04647 = 99.765 → put 행사, 100으로 대체 / 104.4/1.038046 = 100.574 / 104.4/1.03115 = 101.246. Year 1 up: [4.4 + 0.5(100 + 100.574)]/1.03593 = 101.056, down: [4.4 + 0.5(100.574 + 101.246)]/1.029417 = 102.301 (둘 다 100 이상 → put 미행사). Year 0: [4.4 + 0.5(101.056 + 102.301)]/1.0225 = 103.744.", "trap": "Putable: 노드값 = max(V, put price). Callable: min(V, call price). 만기 노드(Year 3)는 104.4 고정.", "f": "V_putable = max(Put price, [C + 0.5(V_u+V_d)]/(1+r))", "why": {"A": "102.103은 put을 반영하지 않은 option-free(Bond #1) 가치입니다. 투자자 put은 가치를 '더'합니다.", "B": "103.688은 정확한 backward induction 결과(103.744)와 다릅니다. Year 2 최상단 노드(99.765)를 put price 100으로 대체한 뒤 위로 올라가야 합니다. Putable: 각 노드에서 max(계산값, put price)."}, "orig": "ECO Module 3 Q5"}, {"id": "ECO-M3-Q10", "src": "ECO 오답", "module": 3, "tag": "Convertible – stock-like일 때 가격 반응", "vig": 16, "stem": "If the market price of Pro Star’s common stock falls from its level on 19 October 20X0, the price of the convertible bond will most likely:", "opts": {"A": "fall at the same rate as Pro Star’s stock price.", "B": "fall but at a slightly lower rate than Pro Star’s stock price.", "C": "be unaffected until Pro Star’s stock price reaches the conversion price."}, "ans": "B", "en": "B is correct. The conversion value of the bond is 31 × $37.50 or $1,162.50, which represents its minimum value. Thus, the convertible bond exhibits mostly stock risk–return characteristics; a fall in the stock price will result in a fall in the convertible bond price. However, the change in the convertible bond price is less than the change in the stock price because the convertible bond has a floor. That floor is the value of the straight (option-free) bond.", "ko": "전환가치 = 31 × $37.50 = $1,162.50 > straight value $1,060 → 주식 성격(stock-like). 주가가 하락하면 전환사채 가격도 하락하지만, straight bond 가치가 바닥(floor) 역할을 하므로 주가보다 약간 덜 떨어집니다.", "trap": "Stock-like convertible: 주가 따라 움직이되 floor 때문에 하락 폭은 더 작음(비대칭).", "f": "Conversion value = Conversion ratio × Share price,  Min value = max(straight value, conversion value)", "why": {"A": "전환사채에는 straight value 바닥이 있어 주가와 '같은 비율'로 하락하지 않습니다.", "C": "이미 전환가격(1,000/31 = $32.26) 위에 있으므로(주가 37.50) 주가 하락에 즉시 반응합니다. 전환가격 도달 전까지 무반응이라는 것은 틀렸습니다."}, "orig": "ECO Module 3 Q10"}, {"id": "ECO-M3-Q13", "src": "ECO 오답", "module": 3, "tag": "금리 하락 시 Callable bond 가격 상승 제한", "vig": 17, "stem": "Assuming the forecast for interest rates is proven accurate, which bond in Exhibit 2 will likely experience the smallest price increase?", "opts": {"A": "Bond 1", "B": "Bond 3", "C": "Bond 4"}, "ans": "C", "en": "C is correct. The consensus economic forecast is for interest rates to decrease. In an environment of decreasing interest rates, all bond prices should rise, ignoring any price impact resulting from any embedded options. When interest rates fall, the value of the embedded call option in Bond 4 (callable) increases, causing an opposing effect on price. The put option of putable bonds, by contrast, increases in value when interest rates rise rather than decline.", "ko": "금리 하락 예상 → 모든 채권 가격 상승. 그러나 callable(Bond 4)은 금리 하락 시 issuer의 call option 가치가 올라 (V_callable = V_straight − V_call) 가격 상승이 가장 작습니다(price compression).", "trap": "금리↓ → call 가치↑ → callable 가격 상승 제한(negative convexity).", "f": "V_callable = V_straight − V_call", "why": {"A": "Bond 1(straight)은 금리 하락의 효과를 온전히 누립니다.", "B": "Bond 3(putable)의 put은 금리 하락 시 가치가 '줄지만', V_putable = V_straight + V_put이므로 straight의 상승이 크게 반영됩니다. 상승 제한 효과는 call이 훨씬 강합니다."}, "orig": "ECO Module 3 Q13"}, {"id": "ECO-M3-Q15", "src": "ECO 오답", "module": 3, "tag": "금리 변동성↑ → 옵션 가치↑ (put·call 모두)", "vig": 17, "stem": "If Smith’s interest rate volatility forecast turns out to be true, which bond in Exhibit 2 is likely to experience the greatest price increase?", "opts": {"A": "Bond 2", "B": "Bond 3", "C": "Bond 4"}, "ans": "B", "en": "B is correct. An increase in interest rate volatility will cause the value of the put and call options embedded in Bond 3 and Bond 4 to increase. Bond 3 (putable) would experience an increase in price because the increased value of the put option increases the bond’s value. In contrast, Bond 4 (callable) will experience a price decrease because the increased value of the call option reduces the callable bond’s value. Bond 2, an out-of-the-money convertible, will resemble the risk–return characteristics of a straight bond and will thus be unaffected by interest rate volatility.", "ko": "변동성↑ → 내재 put·call 가치 모두↑. Putable(Bond 3) = straight + put → 가치 상승. Callable(Bond 4) = straight − call → 가치 하락. Out-of-the-money convertible(Bond 2)은 straight bond와 비슷하게 행동해 금리 변동성 영향이 작습니다.", "trap": "변동성은 '옵션' 가치를 항상 올림. 채권 가치 방향은 누가 옵션을 보유하느냐(투자자 long put → ↑, 투자자 short call → ↓).", "f": "σ↑: V_putable ↑, V_callable ↓", "why": {"A": "Bond 2는 OTM 전환사채(busted)로 straight bond처럼 움직여 금리 변동성 영향이 거의 없습니다.", "C": "Callable은 issuer가 옵션을 보유(투자자는 short call) → 변동성↑ → call 가치↑ → 채권 가치 '하락'."}, "orig": "ECO Module 3 Q15"}, {"id": "ECO-M3-Q16", "src": "ECO 오답", "module": 3, "tag": "Yield curve 모양 변화 → put/call 가치", "vig": 17, "stem": "If the Brown and Company forecast comes true, which of the following is most likely to occur? The value of the embedded option in:", "opts": {"A": "Bond 3 decreases.", "B": "Bond 4 decreases.", "C": "both Bond 3 and Bond 4 increases."}, "ans": "A", "en": "A is correct. All else being equal, the value of a put option decreases as the yield curve moves from being upward sloping to flat to downward sloping (inverted). Alternatively, a call option’s value increases as the yield curve flattens and increases further if the yield curve inverts. Therefore, if the yield curve became inverted, the value of the embedded option in Bond 3 (putable) would decrease and the value of the embedded option in Bond 4 (callable) would increase.", "ko": "커브가 상향 → flat → 역전(inverted)으로 가면 put 가치는 감소, call 가치는 증가합니다. 역전 시 forward rate들이 낮아져 call 행사 기회는 늘고, put 행사 기회는 줄기 때문. → Bond 3(putable)의 put 가치 감소. 노트 표의 'flattening → callable·putable 가격 하락'은 straight 대비 상대 효과입니다. 가격 자체는 장기금리 하락 시 오를 수 있습니다(ECO M3 Q48).", "trap": "Upward curve: put 유리(높은 forward) / Flat·Inverted: call 유리(낮은 forward).", "f": "Curve flattening/inversion: V_call ↑, V_put ↓", "why": {"B": "역전 커브에서는 call 가치가 '증가'합니다.", "C": "put은 감소, call은 증가 — 둘 다 증가하지 않습니다."}, "orig": "ECO Module 3 Q16"}, {"id": "ECO-M3-Q17", "src": "ECO 오답", "module": 3, "tag": "Callable at par (no protection) – 가격 상한", "vig": 17, "stem": "Based on Exhibit 2 and Exhibit 3, the market price of Bond 4 is closest to:", "opts": {"A": "100.0000.", "B": "100.5123.", "C": "100.8790."}, "ans": "A", "en": "A is correct. The market price of callable Bond 4 with no protection period cannot exceed 100.", "ko": "Bond 4는 call protection 없이 par에 언제든 call 가능 → 가격이 100을 넘으면 issuer가 즉시 상환하므로 시장가격은 100을 초과할 수 없습니다. 쿠폰(1.55%)이 모든 금리보다 높아 계산상 가치가 100 이상이라 결국 100.0000.", "trap": "'Callable at par without protection' → price ≤ call price(100).", "f": "V_callable_node = min(call price, [C + 0.5(V_u+V_d)]/(1+r))", "why": {"B": "100.5123은 100을 초과합니다. 언제든 par에 call 가능한 채권은 100을 넘는 가격이 불가능합니다.", "C": "100.8790은 Exhibit 1 spot으로 할인한 option-free(straight) 가치(1.55/1.01 + 1.55/1.012012² + 101.55/1.012515³ ≈ 100.88)입니다. call을 반영하면 100으로 제한됩니다."}, "orig": "ECO Module 3 Q17"}, {"id": "ECO-M3-Q22", "src": "ECO 오답", "module": 3, "tag": "Effective duration (callable) 계산", "vig": 18, "stem": "The effective duration of Bond #4 is closest to:", "opts": {"A": "0.76.", "B": "1.88.", "C": "3.77."}, "ans": "B", "en": "B is correct. PV0 (from the Exhibit 3 tree, with the call) = 100.873. ED = (101.238 − 100.478)/(2 × 0.0020 × 100.873) = 1.88.", "ko": "PV0는 Exhibit 3 트리로 계산(callable 반영) = 100.873. ED = (PV− − PV+)/(2 × ΔCurve × PV0) = (101.238 − 100.478)/(2 × 0.0020 × 100.873) = 0.760/0.40349 = 1.88.", "trap": "① 분모의 2 ② ΔCurve는 소수(20bp = 0.0020) ③ PV0는 주어지지 않으면 트리로 직접 계산.", "f": "ED = (PV− − PV+) / (2 × ΔCurve × PV0)", "why": {"A": "0.76은 분자(가격 차이)만 쓰거나 PV0·2배를 빠뜨린 값입니다.", "C": "3.77은 분모에서 '2'를 빠뜨린 값(0.760/(0.002×100.873))입니다."}, "orig": "ECO Module 3 Q22"}, {"id": "ECO-M3-Q27", "src": "ECO 오답", "module": 3, "tag": "Busted convertible – 채권 성격", "vig": 18, "stem": "The factor that is currently least likely to affect the risk–return characteristics of Bond #9 is:", "opts": {"A": "interest rate movements.", "B": "Whorton’s credit spreads.", "C": "Whorton’s common stock price movements."}, "ans": "C", "en": "C is correct. The risk–return characteristics of a convertible bond depend on the market price of the issuer’s common stock (underlying share price) relative to the bond’s conversion price. When the underlying share price is well below the conversion price, the convertible bond exhibits mostly bond risk–return characteristics. In this case, the price of the convertible bond is mainly affected by interest rate movements and the issuer’s credit spreads. In contrast, when the underlying share price is above the conversion price, the convertible bond exhibits mostly stock risk–return characteristics. In this case, the price of the convertible bond is mainly affected by the issuer’s common stock price movements. The underlying share price ($30) is lower than the conversion price of Bond #9 ($50). Thus, Bond #9 exhibits mostly bond risk–return characteristics and is least affected by Whorton’s common stock price movements.", "ko": "주가($30) ≪ 전환가격($50) → busted convertible(채권 성격). 가격은 주로 금리와 발행사 신용스프레드에 의해 움직이고, 주가 변동의 영향은 가장 작습니다.", "trap": "주가 ≪ 전환가격 → bond-like / 주가 > 전환가격 → stock-like.", "f": "", "why": {"A": "busted convertible은 straight bond처럼 금리 변동에 민감합니다.", "B": "발행사 신용스프레드도 채권 성격 전환사채 가격에 크게 영향을 줍니다."}, "orig": "ECO Module 3 Q27"}, {"id": "ECO-M3-Q34", "src": "ECO 오답", "module": 3, "tag": "Market conversion premium per share", "vig": 19, "stem": "Based on Exhibit 3, the market conversion premium per share for the DE bond on 17 September 20X5 is closest to:", "opts": {"A": "€0.90.", "B": "€2.13.", "C": "€2.53."}, "ans": "B", "en": "B is correct. Market conversion price = Convertible bond price / Conversion ratio = €1,123/(€1,000/€10 per share) = €11.23 per share. Market conversion premium per share = €11.23 − €9.10 = €2.13.", "ko": "Conversion ratio = 1,000/10 = 100주. Market conversion price = 1,123/100 = €11.23. Premium per share = 11.23 − 9.10 = €2.13.", "trap": "Market conversion price = 전환사채 '시장가' ÷ 전환비율 (≠ 약정 conversion price). 주가는 현재가.", "f": "MCP = CB price / Conversion ratio,  Premium/share = MCP − Share price", "why": {"A": "€0.90은 conversion price(10.00) − 주가(9.10)입니다. 전환'가격'이 아니라 '시장' 전환가격(채권가/전환비율)을 써야 합니다.", "C": "€2.53은 market conversion price − 발행일 주가(8.70)입니다. 현재 주가(9.10)를 써야 합니다."}, "orig": "ECO Module 3 Q34"}, {"id": "ECO-M3-Q40", "src": "ECO 오답", "module": 3, "tag": "Convertible vs Callable 평가 비교", "vig": 20, "stem": "Which of the statements made by Rhie is most likely correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "(A) Incorrect because the value of a convertible bond equals the value of the otherwise identical option-free bond plus the value of the conversion (call) option given to the bondholder, whereas the value of a callable bond equals the value of the otherwise identical option-free bond minus the value of the call option given to the issuer.\n(B) Incorrect because an interest rate tree is used to value both a callable and a convertible bond.\n(C) Correct. Convertible bonds are more difficult to value than callable bonds because the analyst must consider all of the factors that affect the value of a callable bond, including interest rates and interest rate volatility, plus all of the factors that affect the issuer’s common stock price and options on its common stock, such as its price volatility.", "ko": "Statement 3이 맞습니다: 전환사채 평가는 callable bond에 영향을 주는 모든 요인(금리, 금리 변동성)에 더해 주가와 주식옵션 관련 요인(주가 변동성 등)까지 고려해야 하므로 더 어렵습니다.", "trap": "투자자가 보유한 옵션 → 더하기(+), 발행사가 보유한 옵션 → 빼기(−).", "f": "V_convertible = V_straight + V_conversion call (− V_issuer call + V_investor put)", "why": {"A": "Convertible = straight + 투자자 conversion(call) option → '더하기'. Callable = straight − issuer call → '빼기'. 둘이 같은 구조가 아닙니다.", "B": "Callable·convertible 모두 '금리' 트리로 평가합니다(커리큘럼 기준). 전환사채 트리가 주가만 모델링한다는 구분은 틀렸습니다."}, "orig": "ECO Module 3 Q40"}, {"id": "ECO-M3-Q45", "src": "ECO 오답", "module": 3, "tag": "금리 상승 시 Callable/Putable effective duration", "vig": 21, "stem": "Muniz’s comments regarding effective duration are most likely:", "opts": {"A": "incorrect with regard to callable and putable bonds.", "B": "incorrect with regard to callable bonds and correct with regard to putable bonds.", "C": "correct with regard to callable bonds and incorrect with regard to putable bonds."}, "ans": "A", "en": "(A) Correct. Muniz’s comments on the effective duration of callable and putable bonds are incorrect. For callable bonds, when interest rates rise and are high compared to the bond’s coupon rate, the call option is out of the money and the price of the callable bond and an otherwise identical straight bond are almost the same. Thus, the effect of an interest rate change on the price of a callable bond and the straight bond is similar—that is, the effective duration of the callable and straight bonds is similar. For putable bonds, when interest rates rise and are high compared to the bond’s coupon rate, the put option is in the money and the price of the putable bond will not fall as much as the straight bond because the investor can put the bond. Thus, the effective duration of the putable bond is lower than the effective duration of the straight bond.\n(B) Incorrect. Muniz’s comments on the effective duration of callable and putable bonds are incorrect.\n(C) Incorrect. Muniz’s comments on the effective duration of callable and putable bonds are incorrect.", "ko": "금리가 오르고 쿠폰 대비 높으면: callable의 call은 OTM → callable ≈ straight → ED가 straight와 '비슷'. putable의 put은 ITM → 가격 하락이 제한 → ED가 straight보다 '낮음'. Muniz는 정반대로 말했으므로 둘 다 틀렸습니다.", "trap": "Callable ED 감소 = 금리 '하락' 시. Putable ED 감소 = 금리 '상승' 시. 방향을 바꿔치기하는 문제.", "f": "금리↑: ED_putable < ED_straight ≈ ED_callable  /  금리↓: ED_callable < ED_straight ≈ ED_putable", "why": {"B": "Putable에 대한 Muniz 설명(금리 상승 시 straight와 유사)도 틀렸습니다. 금리 상승 시 putable ED는 짧아집니다.", "C": "Callable 설명(금리 상승 시 ED가 낮아짐)도 틀렸습니다. 금리 상승 시 call은 OTM이라 straight와 비슷."}, "orig": "ECO Module 3 Q45"}, {"id": "ECO-M3-Q49", "src": "ECO 오답", "module": 3, "tag": "Callable bond 가치 – 트리", "vig": 22, "stem": "Using information provided in Exhibits 1 and 2, the value of Bond A is closest to:", "opts": {"A": "$102.92.", "B": "$105.05.", "C": "$105.23."}, "ans": "A", "en": "A is correct. Year 2: 105.5/1.06312 = 99.2362; 105.5/1.04676 = 100.7872 → called at 100; 105.5/1.034641 = 101.9677 → called at 100.\nYear 1: [5.5 + (0.5 × 99.2362 + 0.5 × 100)]/1.04516 = 100.5761 → called at 100; [5.5 + (0.5 × 100 + 0.5 × 100)]/1.033456 = 102.0847 → called at 100.\nYear 0: [5.5 + (0.5 × 100 + 0.5 × 100)]/1.025 = 102.9268.\nB is the value of the option-free bond; C is the value of the putable bond.", "ko": "Year 2: 105.5/1.06312 = 99.236, 105.5/1.04676 = 100.787 → call → 100, 105.5/1.034641 = 101.968 → call → 100. Year 1 up: [5.5 + 0.5(99.236 + 100)]/1.04516 = 100.576 → call → 100, down: [5.5 + 0.5(100 + 100)]/1.033456 = 102.085 → call → 100. Year 0: [5.5 + 0.5(100 + 100)]/1.025 = 102.927 ≈ $102.92.", "trap": "Callable 노드: min(V, 100). Year 0 노드는 call 불가(Month 12, 24에만 call)라 계산값 그대로.", "f": "V_callable_node = min(call price, [C + 0.5(V_u+V_d)]/(1+r))", "why": {"B": "$105.05는 call을 반영하지 않은 option-free 채권 가치입니다.", "C": "$105.23은 put(투자자 옵션)으로 처리한 putable 채권 가치입니다. Bond A는 callable."}, "orig": "ECO Module 3 Q49"}, {"id": "ECO-M3-Q62", "src": "ECO 오답", "module": 3, "tag": "Convertible 지표 – 전환가격·전환가치·시장전환프리미엄", "vig": 23, "stem": "Is Hamilton most likely accurate regarding her convertible bond calculations?", "opts": {"A": "Yes.", "B": "No, the conversion value is incorrect.", "C": "No, the market conversion premium is incorrect."}, "ans": "A", "en": "(A) Correct. Given the initial conversion premium is 20%, the initial conversion price per share is $80.00 × 1.2 = $96. The conversion ratio is the par value of the bond divided by the conversion price per share: $1,000/$96 = 10.4167. The conversion value of a convertible bond is equal to the underlying share price times the conversion ratio: 10.4167 × $90.00 = $937.50. The market conversion premium is the convertible bond price divided by the conversion ratio minus the stock price: $1,050/10.4167 = $100.80 – $90.00 = $10.80.\n(B) Incorrect. The conversion value of a convertible bond is equal to the underlying share price times the conversion ratio: 10.4167 × $90.00 = $937.50.\n(C) Incorrect. The market conversion premium is the convertible bond price divided by the conversion ratio minus the stock price: $1,050/10.4167 = $100.80 – $90.00 = $10.80.", "ko": "최초 전환가격 = $80 × 1.20 = $96 → 전환비율 = 1,000/96 = 10.4167. 전환가치 = 10.4167 × $90 = $937.50. 시장전환가격 = 1,050/10.4167 = $100.80 → 프리미엄/주 = 100.80 − 90 = $10.80. Hamilton 계산 모두 정확.", "trap": "Initial conversion premium 20% → 전환가격 = 발행일 주가 × 1.2. 전환비율 = par/전환가격.", "f": "CR = Par/Conversion price,  CV = CR × S,  MCP = CB price/CR,  Premium = MCP − S", "why": {"B": "전환가치 = 전환비율 × 현재 주가 = 10.4167 × 90 = 937.50으로 맞습니다.", "C": "시장전환프리미엄 = 1,050/10.4167 − 90 = 10.80으로 맞습니다."}, "orig": "ECO Module 3 Q62"}, {"id": "ECO-M3-Q64", "src": "ECO 오답", "module": 3, "tag": "Market conversion premium ratio", "vig": 24, "stem": "Based on the information provided about the convertible bond issued by Juruá Automotivo, the bond’s market conversion premium ratio is closest to:", "opts": {"A": "4.88%.", "B": "5.13%.", "C": "6.20%."}, "ans": "B", "en": "(A) Incorrect. This is erroneously calculated as the market conversion premium divided by the market conversion price.\n(B) Correct. The current conversion ratio is the par value of the bond divided by the current conversion price or 100,000 / 25 = 4,000. The market conversion price is the convertible bond price divided by the conversion ratio or 127,000 / 4,000 = 31.75. The market conversion premium ratio is the market conversion premium divided by the current share price = 1.55 / 30.20 = 0.0513 = 5.13%.\n(C) Incorrect. This is erroneously calculated as the market conversion premium divided by the conversion price.", "ko": "전환비율 = 100,000/25 = 4,000. 시장전환가격 = 127,000/4,000 = 31.75. 프리미엄/주 = 31.75 − 30.20 = 1.55. 프리미엄 '비율' = 1.55/현재 주가 30.20 = 5.13%.", "trap": "Premium ratio의 분모 = 현재 주가(underlying share price).", "f": "Market conversion premium ratio = (MCP − S)/S", "why": {"A": "4.88% = 1.55/31.75(시장전환가격으로 나눔). 분모는 현재 '주가'입니다.", "C": "6.20% = 1.55/25(전환가격으로 나눔). 분모는 현재 주가입니다."}, "orig": "ECO Module 3 Q64"}, {"id": "ECO-M3-Q68", "src": "ECO 오답", "module": 3, "tag": "Issuer 관점 옵션 포지션", "vig": null, "stem": "A company that has issued both a callable bond and a putable bond is:", "opts": {"A": "long the put option and short the call option.", "B": "short the put option and short the call option.", "C": "short the put option and long the call option."}, "ans": "C", "en": "(A) Incorrect because this is the perspective of the investor, not the issuer. For a callable bond, the decision to exercise the call option is made by the issuer. Thus, the investor is long the bond but short the call option and the issuer is long the call option. For a putable bond, the decision to exercise the put option is made by the investor. Thus, the investor has a long position in both the bond and the put option\" and the issuer is short the put option.\n(B) Incorrect because the issuer is short the put option but long the call option.\n(C) Correct because for a callable bond, the decision to exercise the call option is made by the issuer. Thus, the investor is long the bond but short the call option and the issuer is long the call option. For a putable bond, the decision to exercise the put option is made by the investor. Thus, the investor has a long position in both the bond and the put option and the issuer is short the put option.", "ko": "Callable: 발행사가 call을 보유(long call), 투자자는 short call. Putable: 투자자가 put 보유(long put), 발행사는 short put. → 발행사: short put + long call.", "trap": "옵션 보유자 = 행사 결정권자. Call → issuer, Put → investor.", "f": "Issuer: long call, short put", "why": {"A": "long put·short call은 '투자자' 관점입니다.", "B": "발행사는 call을 보유(long)합니다."}, "orig": "ECO Module 3 Q68"}, {"id": "ECO-M3-Q69", "src": "ECO 오답", "module": 3, "tag": "금리 하락 시 발행사에 유리한 채권", "vig": null, "stem": "Which of the following type of bond benefits the issuer if interest rates decline?", "opts": {"A": "Putable bond", "B": "Callable bond", "C": "Extendible bond"}, "ans": "B", "en": "(A) Incorrect because the put provision allows the bondholders to put back the bonds to the issuer prior to maturity, usually at par. This usually happens when interest rates have risen and higher-yielding bonds are available. This is a benefit to the bondholder rather than the issuer.\n(B) Correct because a callable bond is a bond that includes an embedded call option. The call provision allows the issuer to redeem the bond issue prior to maturity. Early redemption usually happens when the issuer has the opportunity to replace a high-coupon bond with another bond that has more favorable terms, typically when interest rates have fallen.\n(C) Incorrect because another type of embedded option that resembles a put option is an extension option. At maturity, the holder of an extendible bond (sometimes spelled 'extendable') has the right to keep the bond for a number of years after maturity, possibly with a different coupon. In this case, the terms of the bond’s indenture or offering circular are modified, but the bond remains outstanding. This is a benefit to the bondholder rather than the issuer.", "ko": "Callable bond: 금리가 하락하면 발행사가 고쿠폰 채권을 조기상환하고 낮은 금리로 재조달할 수 있어 발행사에 유리합니다.", "trap": "Extendible = put과 유사(투자자 옵션).", "f": "", "why": {"A": "Putable은 금리 '상승' 시 투자자에게 유리합니다.", "C": "Extendible은 만기 연장 권리가 투자자에게 있어 put과 유사(투자자 유리)."}, "orig": "ECO Module 3 Q69"}, {"id": "ECO-M3-Q72", "src": "ECO 오답", "module": 3, "tag": "변동성↑ → Callable OAS↓", "vig": null, "stem": "The OAS of a callable bond is 75 basis points in a zero volatility environment. As interest rate volatility increases, the bond's OAS most likely:", "opts": {"A": "decreases.", "B": "remains the same.", "C": "increases."}, "ans": "A", "en": "(A) Correct because as interest rate volatility increases, the OAS for the callable bond decreases.\n(B) Incorrect because as interest rate volatility increases, the OAS for the callable bond decreases.\n(C) Incorrect because as interest rate volatility increases, the OAS for the callable bond decreases.", "ko": "변동성↑ → call 가치↑ → 모형 가치(callable)↓. 같은 시장가격에 맞추려면 더 작은 spread가 필요 → OAS 감소.", "trap": "σ↑: OAS_callable ↓, OAS_putable ↑.", "f": "", "why": {"B": "OAS는 변동성 가정에 따라 변합니다.", "C": "증가는 putable bond의 경우입니다(변동성↑ → put 가치↑ → 모형가치↑ → 더 큰 OAS 필요)."}, "orig": "ECO Module 3 Q72"}, {"id": "ECO-M3-Q73", "src": "ECO 오답", "module": 3, "tag": "OAS 정의 – 1년 forward rate에 더하는 상수", "vig": null, "stem": "In a zero interest rate volatility environment, the OAS reconciles the market price of a bond to its arbitrage-free value when a constant spread is added to all of the 1-year:", "opts": {"A": "par rates.", "B": "spot rates.", "C": "forward rates."}, "ans": "C", "en": "(A) Incorrect because forward rates, not par rates, are used to calculate OAS through an iterative process.\n(B) Incorrect because forward rates, not spot rates, are used to calculate OAS through an iterative process.\n(C) Correct because if the bond’s price is given, the OAS is determined by trial and error. To determine the OAS, we try shifting all the one-year forward rates in each state by adding a constant spread.", "ko": "OAS는 트리의 모든 1기간 forward rate에 상수 spread를 더해 모형 가치를 시장가격과 일치시키는 spread입니다(시행착오/반복 계산).", "trap": "Z-spread = spot curve + 상수 / OAS = 트리 forward rate + 상수.", "f": "", "why": {"A": "par rate가 아니라 트리의 1기간 forward rate에 더합니다.", "B": "spot rate에 상수를 더하는 것은 Z-spread입니다."}, "orig": "ECO Module 3 Q73"}, {"id": "ECO-M3-Q76", "src": "ECO 오답", "module": 3, "tag": "Yield curve flattening → long call 포지션", "vig": null, "stem": "A portfolio manager expects the current upward sloping yield curve to flatten due to a decrease in long-term rates. The manager is considering the following bonds, all with a 5% coupon rate and ten years left to maturity:\nBond A\tputable bond\nBond B\tcallable bond\nBond C\tstraight bond\nAll else being equal, the strategy that would benefit the most from the manager's expectation is to:", "opts": {"A": "buy Bond A and sell Bond B.", "B": "buy Bond C and sell Bond B.", "C": "buy Bond A and sell Bond C."}, "ans": "B", "en": "(A) Incorrect because this position is net long both a put and a call, and thus the increase in the value of the call will be partially offset by the loss in the value of the put. Position = A – B = (straight bond + put option) – (straight bond – call option) = put option + call option. All else being equal, the value of the call option increases as the yield curve flattens. Also, all else being equal, the value of the put option decreases as the yield curve moves from being upward sloping, to flat, to downward sloping.\n(B) Correct because this position is net long a call, which will benefit if the yield curve flattens. Position C – B = straight bond – (straight bond – call option) = call option. All else being equal, the value of the call option increases as the yield curve flattens.\n(C) Incorrect because this position is net long a put, which will lose if the yield curve flattens. Position A – C = (straight bond + put option) – straight bond = put option. All else being equal, the value of the put option decreases as the yield curve moves from being upward sloping, to flat, to downward sloping.", "ko": "커브 flattening → call 가치↑, put 가치↓. C 매수 − B 매도 = straight − (straight − call) = long call → flattening에서 가장 이익. 단, 채권 가격의 절대 방향은 주로 장기금리가 좌우합니다(장기↓ → 세 채권 모두 상승). 여기서는 옵션 가치 변화로 '상대' 성과를 비교합니다.", "trap": "포지션을 옵션으로 분해: C − B = call, A − C = put, A − B = put + call.", "f": "Flattening: V_call ↑, V_put ↓", "why": {"A": "A − B = put + call: call 이익이 put 손실로 일부 상쇄됩니다.", "C": "A − C = long put: flattening에서 put 가치가 감소해 손실."}, "orig": "ECO Module 3 Q76"}, {"id": "ECO-M3-Q77", "src": "ECO 오답", "module": 3, "tag": "Yield curve steepening → long put 포지션", "vig": null, "stem": "A portfolio manager expects the yield curve to steepen due to an increase in long-term rates. A strategy that would benefit the most from this expectation is to go:", "opts": {"A": "long a putable bond and short an otherwise similar straight bond.", "B": "long a straight bond and short an otherwise similar callable bond.", "C": "short a callable bond and long an otherwise similar putable bond."}, "ans": "A", "en": "(A) Correct because this position is net long a put, which benefits from a steepening yield curve. Position = (straight bond + put option) – straight bond = put option. When the yield curve is upward sloping, the one-period forward rates in the interest rate tree are high, which creates more opportunities for the investor to put the bond.\n(B) Incorrect because this position is net long a call, which loses from a steepening yield curve. Position = straight bond – (straight bond – call) = call. All else being equal, the value of the call option increases as the yield curve flattens.\n(C) Incorrect because this position is net long both a call and a put, and the increase in the put value is partially offset by a decrease in the call value (compared to owning the put only). When the yield curve is upward sloping, the one-period forward rates in the interest rate tree are high, which creates more opportunities for the investor to put the bond. Also, all else being equal, the value of the call option increases as the yield curve flattens.", "ko": "커브 steepening(장기금리↑) → forward rate 상승 → put 행사 기회↑, call 가치↓. Putable 매수 − straight 매도 = long put → 가장 이익.", "trap": "Steepening(상승 커브 강화) → put 유리 / Flattening → call 유리.", "f": "", "why": {"B": "Straight − callable = long call → steepening에서 call 가치 하락.", "C": "Putable − callable = put + call: put 이익이 call 손실로 일부 상쇄."}, "orig": "ECO Module 3 Q77"}, {"id": "ECO-M3-Q81", "src": "ECO 오답", "module": 3, "tag": "Convertible – stock-like 판별", "vig": null, "stem": "An analyst gathers the following information about a $1,000 par value convertible bond and the underlying common stock:\nCurrent share price of stock\t$50\nConversion ratio\t25\nConvertible bond value\t$1,290\nThe bond has risk-return characteristics most similar to:", "opts": {"A": "a busted convertible bond.", "B": "the common stock of the company.", "C": "a straight corporate bond issued by the same company."}, "ans": "B", "en": "(A) Incorrect because when the underlying share price is well below the conversion price, the convertible bond is described as \"busted convertible\" and exhibits mostly bond risk–return characteristics. Here the conversion price is par value/conversion ratio = $1,000/25 = $40. The current share price is well above the conversion price.\n(B) Correct because when the underlying share price is above the conversion price, a convertible bond exhibits mostly stock risk–return characteristics. Here the conversion price is par value/conversion ratio = $1,000/25 = $40, which is significantly less than the $50 underlying share price.\n(C) Incorrect because a straight bond issued by the company is the same as a busted convertible. When the underlying share price is well below the conversion price, the convertible bond is described as \"busted convertible\" and exhibits mostly bond risk–return characteristics. That is, the risk–return characteristics of the convertible bond resemble those of the underlying option-free (straight) bond.", "ko": "전환가격 = 1,000/25 = $40 < 주가 $50 → 주가가 전환가격보다 높음 → 주식 성격(stock-like). 전환가치 = 25 × 50 = $1,250.", "trap": "전환가격 = par/전환비율을 먼저 계산해 주가와 비교.", "f": "Conversion price = Par / Conversion ratio", "why": {"A": "Busted convertible은 주가가 전환가격보다 '훨씬 낮을' 때입니다.", "C": "Straight bond 성격은 busted일 때입니다."}, "orig": "ECO Module 3 Q81"}, {"id": "ECO-M3-Q85", "src": "ECO 오답", "module": 3, "tag": "Callable vs Putable – convexity", "vig": null, "stem": "Compared to a putable bond, an otherwise identical callable bond:", "opts": {"A": "has less downside risk when interest rates rise.", "B": "has more upside potential when interest rates decline.", "C": "has lower convexity when the call option is near the money."}, "ans": "C", "en": "(A) Incorrect because putable bonds also have less downside risk than otherwise identical callable bonds when interest rates rise.\n(B) Incorrect because putable bonds have more upside potential than otherwise identical callable bonds when interest rates decline.\n(C) Correct because the effective convexity of the callable bond turns negative when the call option is near the money, while putable bonds always have positive convexity.", "ko": "Callable은 call이 near the money일 때 effective convexity가 음(−)이 됩니다. Putable은 항상 양(+)의 convexity → callable의 convexity가 더 낮습니다.", "trap": "Putable: 상승여력 크고 하방위험 작음, 항상 positive convexity.", "f": "", "why": {"A": "금리 상승 시 하방위험이 더 작은 쪽은 putable입니다(put이 가격 하락을 제한).", "B": "금리 하락 시 상승여력이 더 큰 쪽도 putable입니다(callable은 call로 상승 제한)."}, "orig": "ECO Module 3 Q85"}, {"id": "ECO-M3-Q88", "src": "ECO 오답", "module": 3, "tag": "Putable ED ≈ straight → put OTM", "vig": null, "stem": "The effective duration of a putable bond is similar to that of an otherwise identical option-free bond, and is not sensitive to a small yield shift. An analyst should conclude that the embedded put option is:", "opts": {"A": "in the money.", "B": "at the money.", "C": "out of the money."}, "ans": "C", "en": "(A) Incorrect because when interest rates rise, the put option moves into the money and limits the price depreciation because the investor can put the bond and reinvest the proceeds of the retired bond at a higher yield. Thus, the put option reduces the effective duration of the putable bond relative to that of the straight bond.\n(B) Incorrect because when the put option is at the money, the effective duration will be sensitive to a small yield shift. When interest rates are low relative to the bond’s coupon, the put option is out of the money so the bond is unlikely to be put. Thus, the effective duration of the putable bond is in this case very similar to that of an otherwise identical option-free bond. In contrast, when interest rates rise, the put option moves into the money and limits the price depreciation because the investor can put the bond and reinvest the proceeds of the retired bond at a higher yield. Thus, the put option reduces the effective duration of the putable bond relative to that of the straight bond.\n(C) Correct because when interest rates are low relative to the bond’s coupon, the put option is out of the money so the bond is unlikely to be put. Thus, the effective duration of the putable bond is in this case very similar to that of an otherwise identical option-free bond.", "ko": "금리가 쿠폰 대비 낮으면 put은 OTM → 행사 가능성 낮음 → putable의 ED가 option-free와 거의 같고, 작은 금리 변화에도 둔감.", "trap": "ED ≈ straight → 옵션 OTM(무의미한 상태).", "f": "", "why": {"A": "ITM이면 put이 가격 하락을 제한해 ED가 straight보다 짧아집니다.", "B": "ATM이면 작은 금리 변화에도 ED가 민감하게 변합니다."}, "orig": "ECO Module 3 Q88"}, {"id": "ECO-M3-Q89", "src": "ECO 오답", "module": 3, "tag": "Convertible – 주식분할 시 조정", "vig": null, "stem": "When the issuer of a convertible bond announces a stock split, an analyst adjusts the conversion price down and the conversion ratio up accordingly. Are these adjustments correct?", "opts": {"A": "Yes", "B": "No, because the conversion ratio does not need to be adjusted", "C": "No, because the conversion price does not need to be adjust
