<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fixed Income Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand">
    <h1>Fixed Income 오답 퀴즈<span>CFA Level II, Schweser 기준</span></h1>
    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>
  </div>
  <div class="progress"><i id="pbar"></i></div>
  <div class="ptext"><span id="ptxt">0 / 0</span><span id="pmode"></span></div>
</div></header>
<main class="wrap">
  <div class="tools">
    <button class="btn" id="bHome">처음 화면</button>
    <button class="btn" id="bResult">결과 보기</button>
    <button class="btn" id="bExport">결과 내보내기</button>
    <button class="btn" id="bImport">결과 불러오기</button>
    <input type="file" id="fImport" accept=".json,application/json" hidden>
  </div>
  <div id="view"></div>
</main>
<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q11", "src": "ECO 오답", "module": 1, "tag": "Forward rate model – spot rate from forwards", "vig": null, "stem": "The one-year spot rate z1 is 4%, the forward rate for a one-year loan beginning in one year is 6%, and the forward rate for a one-year loan beginning in two years is 8%. Which of the following rates is closest to the three-year spot rate?", "opts": {"A": "4.0%", "B": "6.0%", "C": "8.0%"}, "ans": "B", "en": "B is correct. Applying the forward rate model: (1 + z3)^3 = (1 + z1)(1 + f1,1)(1 + f2,1) = (1.04)(1.06)(1.08) = 1.1906 → z3 = 1.1906^(1/3) − 1 = 5.987%.", "ko": "3년 spot은 1년 spot과 연속된 1년 forward들의 기하평균입니다. (1+z3)^3 = 1.04 × 1.06 × 1.08 = 1.1906 → z3 = 5.987% ≈ 6.0%.", "trap": "spot = forward들의 '기하평균'. 처음 값(z1)이나 마지막 forward를 그대로 고르는 함정.", "f": "(1+z_N)^N = (1+z1)(1+f1,1)(1+f2,1)…  /  (1+z_A)^A × (1+f_A,B−A)^(B−A) = (1+z_B)^B", "why": {"A": "4.0%는 1년 spot(z1) 그대로입니다. 3년 투자는 Year 2·3의 더 높은 forward(6%, 8%)까지 복리로 누적되므로 z1보다 높아야 합니다.", "C": "8.0%는 마지막 구간 forward f(2,1)일 뿐입니다. spot은 경로 전체의 (기하)평균이므로 4~8% 사이가 됩니다."}, "orig": "ECO Module 1 Q11"}, {"id": "ECO-M1-Q13", "src": "ECO 오답", "module": 1, "tag": "Swap rate 정의", "vig": null, "stem": "In a typical interest rate swap contract, the swap rate is best describedas the interest rate for the:", "opts": {"A": "fixed-rate leg of the swap.", "B": "floating-rate leg of the swap.", "C": "difference between the fixed and floating legs of the swap."}, "ans": "A", "en": "A is correct. The swap rate is the interest rate for the fixed-rate leg of an interest rate swap.", "ko": "Swap rate = interest rate swap의 fixed-rate leg 금리입니다. Floating leg는 MRR(SOFR 등)이고, 두 leg의 차이를 swap rate라고 부르지 않습니다.", "trap": "swap rate(고정 leg 금리) vs swap spread(swap rate − 동일만기 국채) 용어 혼동.", "f": "Swap spread = Swap rate(fixed leg) − 동일만기 on-the-run 국채 수익률", "why": {"B": "floating leg는 MRR(시장기준금리)로 결정됩니다. swap rate는 그와 교환되는 '고정' 금리입니다.", "C": "fixed와 floating의 차이는 swap rate가 아니라 (net) 결제액 개념입니다. swap spread도 'swap rate − 국채 수익률'이지 두 leg의 차이가 아닙니다."}, "orig": "ECO Module 1 Q13"}, {"id": "ECO-M1-Q18", "src": "ECO 오답", "module": 1, "tag": "Bootstrapping – 5년 spot rate", "vig": 0, "stem": "Based on Exhibit 1, the five-year spot rate is closest to:", "opts": {"A": "4.40%.", "B": "4.45%.", "C": "4.50%."}, "ans": "B", "en": "B is correct. Forward substitution (bootstrapping) using the known one- to four-year spot rates:\n1 = 0.0437/1.025 + 0.0437/1.03^2 + 0.0437/1.035^3 + 0.0437/1.04^4 + 1.0437/(1 + z5)^5\nz5 = (1.0437/0.8394)^(1/5) − 1 = 4.453%", "ko": "5년 par rate 4.37%짜리 par bond(가격 1)의 쿠폰을 1~4년 spot으로 할인하고, 남는 가치로 z5를 풉니다. 1 = 0.0437/1.025 + 0.0437/1.03² + 0.0437/1.035³ + 0.0437/1.04⁴ + 1.0437/(1+z5)⁵ → 앞 4개 PV 합 = 0.1606, 1.0437/(1+z5)⁵ = 0.8394 → z5 = 4.453% ≈ 4.45%.", "trap": "Upward-sloping 커브에서는 spot > par (차이가 작음). par rate를 그대로 쓰거나 대충 반올림하지 말 것.", "f": "1 = Σ PMT/(1+z_t)^t + (1+PMT)/(1+z_N)^N   (par bond, 가격 = 1)", "why": {"A": "4.40%는 par rate(4.37%) 근처에서 근사한 값입니다. 상승하는 커브에서는 spot이 par보다 더 높아야 합니다(쿠폰이 낮은 spot으로 할인되므로 마지막 spot이 보상).", "C": "4.50%는 과대추정입니다. 실제 계산값은 4.453%로 4.45%에 가장 가깝습니다."}, "orig": "ECO Module 1 Q18"}, {"id": "ECO-M1-Q26", "src": "ECO 오답", "module": 1, "tag": "Riding the yield curve vs maturity matching", "vig": 1, "stem": "In presenting Investment 1, using Shire Gate Advisers’ interest rate outlook, Smith could show that riding the yield curve provides a total return that is most likely:", "opts": {"A": "lower than the return on a maturity-matching strategy.", "B": "equal to the return on a maturity-matching strategy.", "C": "higher than the return on a maturity-matching strategy."}, "ans": "C", "en": "C is correct. When the spot curve is upward sloping and its level and shape are expected to remain constant over an investment horizon (Shire Gate Advisers’ view), buying bonds with a maturity longer than the investment horizon (i.e., riding the yield curve) will provide a total return greater than the return on a maturity-matching strategy.", "ko": "커브가 upward sloping이고 level·shape이 그대로 유지된다고 보면(= Shire Gate의 전망), 투자기간보다 만기가 긴 채권을 사서 기간 말에 파는 riding(rolling down) 전략이 maturity matching보다 높은 총수익을 냅니다. 시간이 지나 잔존만기가 짧아지면 더 낮은 수익률로 평가되어 가격이 오르기 때문입니다.", "trap": "'커브 불변(static)' ≠ 'forward대로 실현'. static upward curve → riding 수익 > matching. forward대로 실현 → 모든 전략 수익 동일.", "f": "Riding 조건: upward-sloping + level/shape 유지 → HPR > maturity-matching", "why": {"A": "커브가 '그대로 유지'된다는 가정에서는 roll-down 가격 상승이 추가 수익이 됩니다. 낮아지는 경우는 금리가 forward보다 더 오를 때입니다.", "B": "같아지는 것은 미래 spot이 '현재 forward대로' 실현될 때(이때 모든 채권 수익률 = 1기간 무위험금리)입니다. '커브 불변'은 forward대로 실현되는 것과 다릅니다."}, "orig": "ECO Module 1 Q26"}, {"id": "ECO-M1-Q27", "src": "ECO 오답", "module": 1, "tag": "Riding the yield curve – swap rate을 회사채 수익률 대용", "vig": 1, "stem": "In presenting Investment 2, Smith should show an annual return closest to:", "opts": {"A": "4.31%.", "B": "5.42%.", "C": "6.53%."}, "ans": "C", "en": "C is correct. The swap spread is a common way to indicate credit spreads in a market. The four-year swap rate (fixed leg of an interest rate swap) can be used as an indication of the four-year corporate yield. Riding the yield curve by purchasing a four-year zero-coupon bond with a yield of 4.75% {i.e., 4.05% + 0.70%, [P4 = 100/(1 + 0.0475)^4 = 83.058]} and then selling it when it becomes a two-year zero-coupon bond with a yield of 3.00% {i.e., 2.70% + 0.30%, [P2 = 100/(1 + 0.0300)^2 = 94.260]} produces an annual return of 6.53%: (94.260/83.058)^0.5 – 1.0 = 0.0653.", "ko": "Swap rate = 국채 spot + swap spread를 회사채 수익률 대용으로 씁니다. 4년 zero: 4.05% + 0.70% = 4.75% → P4 = 100/1.0475⁴ = 83.058. 2년 후 2년 zero로 매도: 2.70% + 0.30% = 3.00% → P2 = 100/1.03² = 94.260. 연환산 수익률 = (94.260/83.058)^0.5 − 1 = 6.53%.", "trap": "① 매입·매도 시점 각각 '해당 만기'의 spot + swap spread 사용 ② 보유기간 2년 → 0.5승 연환산.", "f": "연환산 HPR = (P_sell / P_buy)^(1/n) − 1,  회사채 yield 대용 = 국채 spot + swap spread", "why": {"A": "swap spread를 빼먹거나 매도시점 수익률을 잘못 적용한 값입니다. 매입 4.75%, 매도 3.00%를 각각 써야 합니다.", "B": "5.42%는 2년 수익률을 단순 평균하거나 연환산을 잘못한 값입니다. 2년 보유 → (P2/P4)^(1/2) − 1로 기하 연환산해야 합니다."}, "orig": "ECO Module 1 Q27"}, {"id": "ECO-M1-Q30", "src": "ECO 오답", "module": 1, "tag": "Bootstrapping = forward substitution", "vig": 2, "stem": "Did Tyo’s assistant accurately describe the process of bootstrapping?", "opts": {"A": "Yes", "B": "No, with respect to par yields", "C": "No, with respect to backward substitution"}, "ans": "C", "en": "C is correct. The assistant states that bootstrapping entails backward substitution using par yields to solve for zero-coupon rates one by one, in order from latest to earliest maturities. Bootstrapping entails forward substitution, however, using par yields to solve for zero-coupon rates one by one, in order from earliest to latest maturities.", "ko": "Bootstrapping은 par yield를 이용해 zero(spot) rate를 '짧은 만기 → 긴 만기' 순서로 하나씩 푸는 forward substitution입니다. 조수가 말한 'backward substitution, 가장 긴 만기부터'가 틀렸고, par yield를 쓴다는 부분은 맞습니다.", "trap": "'Backward induction'은 binomial tree 가치평가(만기→현재) 용어. Bootstrapping은 'forward substitution'(짧은 만기→긴 만기).", "f": "z1 = par1 → z2: 1 = p2/(1+z1) + (1+p2)/(1+z2)^2 → z3 … (순차)", "why": {"A": "조수 설명 중 '역방향(backward), 긴 만기부터'는 틀렸습니다. 1년 spot(=1년 par)부터 시작해 순차적으로 풉니다.", "B": "par yield를 사용하는 것은 맞습니다. 틀린 부분은 par yield가 아니라 substitution 방향입니다."}, "orig": "ECO Module 1 Q30"}, {"id": "ECO-M1-Q32", "src": "ECO 오답", "module": 1, "tag": "Swap spread 계산·해석", "vig": 2, "stem": "Based on Exhibit 2, the implied credit and liquidity risks as indicated by the historical three-year swap spreads for Country B were the lowest:", "opts": {"A": "1 month ago.", "B": "6 months ago.", "C": "12 months ago."}, "ans": "B", "en": "B is correct. The historical three-year swap spread for Country B was the lowest six months ago. Swap spread is defined as the spread paid by the fixed-rate payer of an interest rate swap over the rate of the “on the run” (most recently issued) government bond security with the same maturity as the swap. The lower (higher) the swap spread, the lower (higher) the return that investors require for credit and/or liquidity risks.\nThe fixed rate of the three-year fixed-for-floating Libor swap was 0.01% six months ago, and the three-year government bond yield was –0.08% six months ago. Thus the swap spread six months ago was 0.01% – (–0.08%) = 0.09%.\nOne month ago, the fixed rate of the three-year fixed-for-floating Libor swap was 0.16%, and the three-year government bond yield was –0.10%. Thus the swap spread one month ago was 0.16% – (–0.10%) = 0.26%.\nTwelve months ago, the fixed rate of the three-year fixed-for-floating Libor swap was 0.71%, and the three-year government bond yield was –0.07%. Thus, the swap spread 12 months ago was 0.71% – (–0.07%) = 0.78%.", "ko": "Swap spread = swap(fixed) rate − 동일만기 국채 수익률. 6개월 전: 0.01 − (−0.08) = 0.09%(최저), 1개월 전: 0.16 − (−0.10) = 0.26%, 12개월 전: 0.71 − (−0.07) = 0.78%. Spread가 낮을수록 시장이 요구하는 신용·유동성 위험 보상이 낮습니다.", "trap": "국채금리가 음수일 때 부호 실수. swap rate만 보고 최저 시점을 고르면 안 됨(반드시 차이 계산).", "f": "Swap spread = Swap rate − Government yield (same maturity)", "why": {"A": "1개월 전 spread는 0.16 − (−0.10) = 0.26%. 음수 국채금리를 빼면 spread가 커진다는 점(마이너스의 마이너스)을 놓치기 쉽습니다.", "C": "12개월 전은 0.78%로 가장 높습니다 → 신용·유동성 위험이 가장 컸던 시점입니다."}, "orig": "ECO Module 1 Q32"}, {"id": "ECO-M1-Q33", "src": "ECO 오답", "module": 1, "tag": "Riding the yield curve 조건", "vig": 2, "stem": "Based on Exhibit 1 and Tyo’s expectations, which country’s term structure is currently best for traders seeking to ride the yield curve?", "opts": {"A": "Country A", "B": "Country B", "C": "Country C"}, "ans": "A", "en": "A is correct. Country A’s yield curve is upward sloping—a condition for the strategy—and more so than Country B’s.", "ko": "Riding the yield curve는 upward-sloping 커브가 유지될 때 유리하며, 기울기가 가팔라질수록 roll-down 이익이 큽니다. Country A는 상승 커브이고 '수준·형태 유지' 전망이므로 최적. Country B도 상승하지만 기울기가 완만하고 커브 반전을 예상, Country C는 하향 커브입니다.", "trap": "절대 금리 수준(C가 가장 높음)에 끌리지 말 것. 조건은 '기울기(upward) + 유지 전망'.", "f": "Riding 이익 ↑ : 커브 기울기 가파를수록, 커브가 유지될수록", "why": {"B": "B도 상승 커브지만 기울기가 A보다 완만하고, Tyo는 기울기 '반전'과 미래 spot > forward를 예상 → riding에 불리.", "C": "C는 downward sloping 커브(14% → 10.7%)라 riding 전략 조건 자체를 충족하지 못합니다."}, "orig": "ECO Module 1 Q33"}, {"id": "ECO-M1-Q36", "src": "ECO 오답", "module": 1, "tag": "Term structure 이론 – Liquidity preference", "vig": 2, "stem": "With respect to their discussion of yield curves, Tyo and her assistant are most likely discussing which term structure theory?", "opts": {"A": "Pure expectations theory", "B": "Local expectations theory", "C": "Liquidity preference theory"}, "ans": "C", "en": "C is correct. Liquidity preference theory suggests that liquidity premiums exist to compensate investors for the added interest rate risk that they face when lending long term and that these premiums increase with maturity. Tyo and her assistant are assuming that liquidity premiums exist.", "ko": "Tyo와 조수는 '투자자가 유동성 프리미엄을 요구한다'는 가정 하에서도 커브가 하향할 수 있는지 논의합니다. 유동성 프리미엄(만기 증가에 따라 커짐)을 전제하는 이론은 liquidity preference theory입니다. 프리미엄이 있어도 기대 spot이 크게 하락(심한 디플레 예상)하면 하향 커브 가능.", "trap": "키워드 매칭: 'liquidity premium·요구 보상' → Liquidity preference. 'risk neutral, unbiased' → Pure expectations. '단기 보유수익률 = rf' → Local expectations.", "f": "Liquidity preference: forward = E(future spot) + liquidity premium (forward는 상향 편의)", "why": {"A": "Pure(unbiased) expectations theory는 위험중립·프리미엄 없음 → forward = 기대 미래 spot. 유동성 프리미엄을 가정하지 않습니다.", "B": "Local expectations theory는 '단기 보유수익률이 모든 채권에서 무위험금리와 같다'는 이론으로, 장기에 대해서만 위험프리미엄을 허용하지만 '유동성 프리미엄이 만기에 따라 증가'를 핵심 전제로 하지 않습니다."}, "orig": "ECO Module 1 Q36"}, {"id": "ECO-M1-Q39", "src": "ECO 오답", "module": 1, "tag": "Fiscal policy – supply-side effect", "vig": null, "stem": "When government budget deficits fall, fiscal supply-side effects are most likely to result in:", "opts": {"A": "higher bond yields.", "B": "a steeper yield curve.", "C": "lower bond yields."}, "ans": "C", "en": "C is correct. When government budget deficits fall, fiscal supply-side effects are most likely to result in lower bond yields.", "ko": "재정적자 감소 → 국채 공급 감소 → 국채 가격 상승 → 수익률 하락. Fiscal supply-side effect: 적자↑ → 공급↑ → 수익률↑, 적자↓ → 수익률↓.", "trap": "방향 반대로 외우기 쉬움: 적자↓ = 공급↓ = 가격↑ = 수익률↓.", "f": "재정적자 ↑ → 국채공급 ↑ → yield ↑  /  적자 ↓ → yield ↓", "why": {"A": "더 높은 수익률은 재정적자 '확대'(국채 공급 증가) 시의 결과입니다.", "B": "적자 축소는 커브의 기울기보다는 수익률 수준(특히 국채 공급이 많은 구간)을 낮추는 효과로 설명됩니다. 'steeper curve'는 근거가 없습니다."}, "orig": "ECO Module 1 Q39"}, {"id": "ECO-M1-Q50", "src": "ECO 오답", "module": 1, "tag": "Level/Steepness/Curvature 3-factor model", "vig": 3, "stem": "Based on Exhibit 1, the results of Analysis 1 should show the yield on the 20-year bond decreasing by:", "opts": {"A": "0.3015%.", "B": "0.6030%.", "C": "0.8946%."}, "ans": "B", "en": "B is correct. Because the factors in Exhibit 1 have been standardized to have unit standard deviations, a two-standard-deviation increase in the steepness factor will lead to the yield on the 20-year bond decreasing by 0.6030%, calculated as follows:\nChange in 20-year bond yield = –0.3015% × 2 = –0.6030%", "ko": "Exhibit 1의 factor는 1 SD 증가 시 수익률 변화(표준화). Steepness 2 SD 증가 → 20년 수익률 = −0.3015% × 2 = −0.6030% (감소).", "trap": "SD 배수 곱하기 누락, 다른 factor까지 더하는 실수.", "f": "Δyield = Σ (factor loading × factor 변화(SD 단위))", "why": {"A": "0.3015%는 1 SD 효과입니다. 문제는 '2 SD' 증가이므로 2배를 곱해야 합니다.", "C": "0.8946%는 level 등 다른 factor까지 합산한 값입니다. Analysis 1은 steepness factor만 변합니다."}, "orig": "ECO Module 1 Q50"}, {"id": "ECO-M1-Q51", "src": "ECO 오답", "module": 1, "tag": "Level/Steepness/Curvature 3-factor model", "vig": 3, "stem": "Based on Exhibit 1, the results of Analysis 2 should show the yield on the five-year bond:", "opts": {"A": "decreasing by 0.8315%.", "B": "decreasing by 0.0389%.", "C": "increasing by 0.0389%."}, "ans": "C", "en": "C is correct. Because the factors in Exhibit 1 have been standardized to have unit standard deviations, a one-standard-deviation decrease in both the level factor and the curvature factor will lead to the yield on the five-year bond increasing by 0.0389%, calculated as follows:\nChange in five-year bond yield = 0.4352% – 0.3963% = 0.0389%", "ko": "5년물: level 1 SD 감소 → −(−0.4352%) = +0.4352%, curvature 1 SD 감소 → −(0.3963%) = −0.3963%. 합계 = +0.0389% (상승).", "trap": "'Factor 감소' = loading × (−1). 음수 loading의 감소 → 수익률 상승.", "f": "Δy(5y) = (−1)(−0.4352%) + (−1)(0.3963%) = +0.0389%", "why": {"A": "0.8315% 감소는 부호를 반대로 적용하고 두 효과를 더한 값입니다(−0.4352 − 0.3963). factor '감소'면 loading의 부호를 뒤집어야 합니다.", "B": "크기는 맞지만 방향이 틀렸습니다. level loading이 음수(−0.4352%)라 level 감소는 수익률을 '올립니다'."}, "orig": "ECO Module 1 Q51"}, {"id": "ECO-M1-Q58", "src": "ECO 오답", "module": 1, "tag": "Spot/forward/DF → 채권 가치, YTM 비교(rich/cheap)", "vig": 4, "stem": "Based on the data in Exhibit 1 and the yield to maturity quoted by the dealer referenced in Module 2, what action should an analyst most likely take with regard to the Treasury bond?", "opts": {"A": "Buy", "B": "Sell", "C": "Hold"}, "ans": "B", "en": "B is correct. Step 1: z3 = (1/0.8163)^(1/3) − 1 = 7.00%. Step 2: (1 + z2)^2 = 1.07^3/1.0852 = 1.128824 → z2 = 6.25%. Step 3: Value = 4/1.055 + 4/1.0625^2 + 4/1.07^3 + 104/1.0825^4 = 86.34, implying YTM = 8.14%. Step 4: The quoted YTM of 7.89% (price = $87.08) is more expensive than the fair value (8.14%, price = $86.34), so the analyst should sell the bond.", "ko": "① DF3 = 0.8163 → z3 = (1/0.8163)^(1/3) − 1 = 7.00% ② (1+z2)² = 1.07³/1.0852 → z2 = 6.25% ③ 공정가 = 4/1.055 + 4/1.0625² + 4/1.07³ + 104/1.0825⁴ = 86.34 → 공정 YTM 8.14% ④ 딜러 호가 YTM 7.89%(가격 87.08) < 8.14% → 시장가격이 공정가보다 비쌈(rich) → Sell.", "trap": "YTM과 가격의 역관계! 호가 YTM < 공정 YTM → 비싸다(Sell).", "f": "z_N = (1/DF_N)^(1/N) − 1,  (1+z3)^3 = (1+z2)^2 (1+f2,1)", "why": {"A": "YTM이 낮을수록 가격이 높습니다. 7.89% < 8.14% → 가격 87.08 > 공정가 86.34 → 고평가(rich)이므로 매수가 아니라 매도입니다.", "C": "Hold는 호가 YTM이 spot 기반 공정 YTM(8.14%)과 같을 때만 맞습니다."}, "orig": "ECO Module 1 Q58"}, {"id": "ECO-M1-Q59", "src": "ECO 오답", "module": 1, "tag": "Riding the yield curve – 금리 예상외 상승 시", "vig": 4, "stem": "Is Akron most likely correct with regard to how portfolio managers can profit from riding the yield curve?", "opts": {"A": "Yes.", "B": "No, he is incorrect with respect to bond maturities.", "C": "No, he is incorrect regarding the impact of interest rate changes."}, "ans": "C", "en": "(A) Incorrect because Akron is incorrect in stating that the strategy will increase total return even if rates rise unexpectedly.\n(B) Incorrect because Akron is correct regarding the increased yield.\n(C) Correct. Akron is incorrect in stating that the strategy will increase total return even if rates rise unexpectedly. If rates rise by more than predicted by forward rates, then the bond will lose value as it is priced using higher rates.", "ko": "Akron의 첫 번째 설명(upward 커브 유지 시 만기 긴 채권 매입으로 수익률 증대)은 맞습니다. 하지만 '금리가 예상치 못하게 올라도 roll-down 덕분에 가격이 오른다'는 틀렸습니다. 금리가 forward가 예측한 것보다 더 오르면 더 높은 금리로 할인되어 가격이 하락합니다.", "trap": "Riding 전략의 위험: 금리가 forward 이상으로 오르면 손실. '항상 이익'이라는 문장은 틀림.", "f": "미래 spot > 현재 forward → HPR < 무위험금리 (손실 가능)", "why": {"A": "두 번째 주장(예상외 금리 상승에도 가격 상승)이 틀렸으므로 'Yes'가 될 수 없습니다.", "B": "투자기간보다 '긴 만기' 채권을 사는 것은 riding 전략의 정확한 설명입니다. 만기 관련 부분은 맞습니다."}, "orig": "ECO Module 1 Q59"}, {"id": "ECO-M1-Q60", "src": "ECO 오답", "module": 1, "tag": "Spread 지표 – TED / MRR–OIS / Z-spread", "vig": 4, "stem": "Akron is least likely correct with regard to which spread measure in Module 4?", "opts": {"A": "Z-spread", "B": "TED spread", "C": "MRR–OIS spread"}, "ans": "B", "en": "(A) Incorrect because Akron’s description of the Z-spread is correct.\n(B) Correct. The TED spread is not used for individual bonds but rather is an indicator of perceived risk in the general economy. The TED spread is calculated as the difference between MRR and the yield on a T-bill of equal maturity.\n(C) Incorrect because Akron’s description of the MRR–OIS spread is correct.", "ko": "TED spread = 3개월 MRR − 3개월 T-bill. 개별 국채 가치평가용이 아니라 경제 전반의 위험 인식(은행 신용위험) 지표입니다. Akron은 TED를 '국채 valuation용'이라고 해서 틀렸습니다. Z-spread와 MRR–OIS 설명은 맞습니다.", "trap": "TED = 경제 전반 위험(counterparty) 지표, 개별 채권 가치평가 X. MRR–OIS = 은행 신용·유동성.", "f": "TED = MRR(3M) − T-bill(3M),  MRR–OIS = MRR − OIS rate", "why": {"A": "Z-spread = 벤치마크 spot curve에 더해 가격을 맞추는 상수 spread. 회사채 등 신용위험 측정에 유용 — Akron 설명 정확.", "C": "MRR–OIS spread는 은행 간 무담보 대출 위험을 반영하며 money market 증권의 위험·유동성 지표 — Akron 설명 정확."}, "orig": "ECO Module 1 Q60"}, {"id": "ECO-M1-Q61", "src": "ECO 오답", "module": 1, "tag": "Swap spread 보간 – on-the-run 기준", "vig": 4, "stem": "Based on the data in Exhibit 2, the spread the market is expecting for the credit and liquidity component of the yield to maturity for the ESB bond is closest to:", "opts": {"A": "0.59", "B": "0.66", "C": "1.14"}, "ans": "B", "en": "(A) Incorrect because it uses the off-the-run Bund rather than the on-the-run Bund:\n0.46 + 0.86 × (0.57 – 0.46) = 0.55\n1.05 + 0.86 × (1.16 – 1.05) = 1.14\n1.14 – 0.59 = 0.59\n(B) Correct. The swap spread represents the return that investors require for credit and liquidity. Since dealers are quoting the bond flat to swaps or swaps + 0 basis points there is no added spread to swaps. The swap spread is measured over the “on-the-run” or most recently issued government security, in this case the Bund. Simple interpolation is used to calculate the swap spread.\nFirst, calculate the Bund yield for the maturity: 0.41 + 0.86 × (0.50 – 0.41) = 0.49.\nSecond, calculate the swap rate for the maturity: 1.05 + 0.86 × (1.16 – 1.05) = 1.14.\nThird, the difference represents the swap spread: 1.14 – 0.49 = 0.66.\n(C) Incorrect because it only uses swap rates, not the spread itself: 1.05 + 0.86 × (1.16 – 1.05) = 1.14.", "ko": "Swap spread는 'on-the-run(최근 발행) 국채' 대비로 측정합니다. 3.86년 보간: Bund = 0.41 + 0.86×(0.50 − 0.41) = 0.49, Swap = 1.05 + 0.86×(1.16 − 1.05) = 1.14 → spread = 1.14 − 0.49 = 0.66. 'flat to swaps'이므로 추가 spread 없음.", "trap": "① on-the-run vs off-the-run ② swap rate 자체를 spread로 착각 ③ 보간 비율 0.86.", "f": "보간: y = y3 + 0.86×(y4 − y3),  Swap spread = Swap − on-the-run govt", "why": {"A": "0.59는 off-the-run Bund(0.46~0.57)를 사용한 값입니다. swap spread 벤치마크는 on-the-run입니다.", "C": "1.14는 보간한 swap rate 자체입니다. 신용·유동성 요소는 swap rate − 국채 = spread입니다."}, "orig": "ECO Module 1 Q61"}, {"id": "ECO-M1-Q68", "src": "ECO 오답", "module": 1, "tag": "YTM이 기대수익률의 좋은 추정치가 되는 조건", "vig": 5, "stem": "Which of Salah’s three statements is least likely correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "B", "en": "(A) Incorrect. Statement 1 is correct. The value of a bond calculated by discounting its future cash flows by their corresponding spot rates will be the same as the value obtained by discounting future cash flows by the yield-to-maturity of a bond, only if the yield-to-maturity is some weighted average of the spot rates used to value the bond.\n(B) Correct. Statement 2 is incorrect. The yield-to-maturity provides a poor estimate of expected return if interest rates are volatile, the yield curve is steeply sloped upward or downward, there is significant risk of default, or the bond has embedded options. Yield-to-maturity is a poor estimate of expected return because it does not capture the effect of reinvesting coupons at new rates due to changes in the shape of the yield curve. Recall that to realize the initial yield-to-maturity requires that coupons be reinvested as implied by the initial yield-to-maturity.\n(C) Incorrect. Statement 3 is correct. If the yield curve remains flat during the holding period, the realized rate of return on a bond will be the same as the expected rate of return.", "ko": "Statement 2가 틀렸습니다. YTM이 실현수익률과 같으려면 쿠폰이 'YTM으로' 재투자되어야 합니다. 커브가 가파르거나 금리 변동성이 크거나, 부도위험·내재옵션이 있으면 YTM은 기대수익률의 나쁜 추정치입니다. 'spot rate로 재투자'를 가정하면 YTM과 달라집니다.", "trap": "YTM = 실현수익률 조건: ① 만기 보유 ② 쿠폰을 YTM으로 재투자 ③ 무부도. 'spot으로 재투자'는 조건이 아님.", "f": "YTM ≈ 기대수익률 ⇔ flat curve, 낮은 변동성, 무부도, 옵션 없음", "why": {"A": "Statement 1은 맞습니다: YTM은 spot rate들의 일종의 가중평균이므로 YTM 할인가치 = spot 할인가치.", "C": "Statement 3은 맞습니다: 커브가 flat으로 유지되면 모든 재투자가 같은 금리 → 실현수익률 = 기대수익률."}, "orig": "ECO Module 1 Q68"}, {"id": "ECO-M1-Q69", "src": "ECO 오답", "module": 1, "tag": "Par rate 정의 & Bootstrapping 식", "vig": 5, "stem": "Is Klopp’s statement on par rates and bootstrapping most likely correct?", "opts": {"A": "Yes.", "B": "No, he is incorrect about par rates.", "C": "No, he is incorrect about bootstrapping."}, "ans": "C", "en": "C is correct. Klopp correctly describes par rates but is incorrect about the process of bootstrapping. Bootstrapping is forward substitution: the one-year spot rate equals the one-year par rate, and the two-year spot rate r(2) solves Par value = 2-year par coupon/(1 + r(1)) + (2-year par coupon + Par value)/(1 + r(2))^2, where r(1) = 2.041%. In the vignette, Klopp incorrectly discounts the first coupon at (1 + r(2)) instead of (1 + r(1)).\nA/B are incorrect: Klopp correctly describes par rates and incorrectly describes bootstrapping.", "ko": "Par rate 설명(on-the-run 국채가 par에 거래될 때의 YTM)은 맞습니다. 하지만 Klopp의 2년 spot 식에서 첫 쿠폰을 r(2)로 할인한 것이 틀렸습니다. 첫 해 쿠폰은 1년 spot r(1)로 할인해야 합니다: Par = C/(1+r(1)) + (C+Par)/(1+r(2))².", "trap": "각 현금흐름은 '그 시점의 spot'으로 할인. 1년차 쿠폰 → r(1).", "f": "Par = C/(1+r1) + (C+Par)/(1+r2)^2", "why": {"A": "식의 첫 항 분모를 (1+r(2))로 쓴 오류가 있으므로 완전히 맞지 않습니다.", "B": "Par rate 정의는 정확합니다. 틀린 곳은 bootstrapping 식입니다."}, "orig": "ECO Module 1 Q69"}, {"id": "ECO-M1-Q71", "src": "ECO 오답", "module": 1, "tag": "전통적 Term structure 이론 비교", "vig": 6, "stem": "With regard to Aguero’s question regarding traditional theories of the term structure of interest rates, who is most likely correct?", "opts": {"A": "Torres", "B": "Dengler", "C": "Pochettino"}, "ans": "C", "en": "(A) Incorrect. Torres is incorrect. He is correct that under segmented markets theory, the shape of the yield curve is determined by supply and demand for funds at each maturity. He is also correct that depending on the nature of supply and demand mismatch, a downward or upward sloping yield curve is possible. However, the theory does not state that institutions will deviate from their preferred maturities if they are adequately compensated, which is true only under the preferred habitat theory.\n(B) Incorrect. Dengler is incorrect. Dengler is correct that forward rates are an unbiased predictor of expected future spot rates and that the theory can explain an upward sloping or downward sloping yield curve. However, the unbiased expectations theory assumes risk neutrality and only applies to risk-free assets, not risk assets.\n(C) Correct. Pochettino correctly describes the liquidity preference theory of the term structure of interest rates. The theory states that investors require a liquidity premium to lend over longer maturities. Consequently, forward rates are an upwardly biased estimate of expected future spot rates, and the yield curve will typically be upward sloping. A downward sloping yield curve is possible only if expected future spot rates decline by enough to offset the liquidity premium.", "ko": "Pochettino(liquidity preference)가 정확합니다: 장기 대출에 유동성 프리미엄 요구 → forward는 기대 spot의 상향 편의 추정치 → 커브는 보통 상승, 하락은 기대 spot의 큰 하락으로만 가능.", "trap": "Segmented = 선호 만기 이탈 불가 / Preferred habitat = 보상 충분하면 이탈. Unbiased expectations = risk-neutral, 무위험 자산.", "f": "Liquidity preference: f = E(S) + LP(만기↑ → LP↑)", "why": {"A": "Torres는 segmented markets theory에 '충분히 보상받으면 선호 만기를 벗어난다'를 붙였는데, 이는 preferred habitat theory의 내용입니다.", "B": "Dengler는 unbiased expectations theory가 위험자산에도 적용된다고 했지만, 이 이론은 위험중립을 가정하고 무위험 자산에만 적용됩니다."}, "orig": "ECO Module 1 Q71"}, {"id": "ECO-M1-Q74", "src": "ECO 오답", "module": 1, "tag": "Volatility term structure", "vig": 6, "stem": "Which of Torres’ statements on interest rate volatility is least likely correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "B", "en": "(A) Incorrect. Statement 1 is correct. Interest rate volatility impacts fixed-income investing and portfolio management because volatility impacts the option values embedded in fixed-income securities.\n(B) Correct. Statement 2 is incorrect. The volatility term structure shows that short-term interest rates are more volatile than long-term rates.\n(C) Incorrect. Statement 3 is correct. Long-term interest rate volatility is linked to uncertainty regarding the real economy and inflation, whereas short-term interest rate volatility is related to uncertainty regarding monetary policy.", "ko": "Statement 2가 틀렸습니다. Volatility term structure는 보통 단기금리가 장기금리보다 변동성이 큽니다. 단기 변동성 = 통화정책 불확실성, 장기 변동성 = 실물경제·인플레이션 불확실성(Statement 3 맞음). 변동성은 내재옵션 가치에 영향(Statement 1 맞음).", "trap": "'금리' 변동성: 단기 > 장기. '채권 가격' 변동성: 장기 > 단기(듀레이션 때문). 둘을 혼동하지 말 것.", "f": "σ(short rate) > σ(long rate),  하지만 σ(long bond price) > σ(short bond price)", "why": {"A": "Statement 1은 맞습니다: 금리 변동성은 채권에 내재된 옵션 가치에 영향을 줍니다.", "C": "Statement 3은 정확한 Schweser/커리큘럼 서술입니다(장기=실물·인플레, 단기=통화정책)."}, "orig": "ECO Module 1 Q74"}, {"id": "ECO-M1-Q75", "src": "ECO 오답", "module": 1, "tag": "YTM vs 실현수익률 (upward curve, forward대로 실현)", "vig": 7, "stem": "Using the information provided in Exhibit 1 and assuming that Bird’s interest rate expectation materializes, the realized return for an investor who buys and holds to maturity the US Treasury 7.00% coupon bond would most likely be:", "opts": {"A": "less than the yield to maturity.", "B": "equal to the yield to maturity.", "C": "greater than the yield to maturity."}, "ans": "C", "en": "(A) Incorrect because the realized return will be less than the yield to maturity only when the yield curve is downward sloping.\n(B) Incorrect because the realized return will equal the yield to maturity only when the coupons are reinvested at the YTM.\n(C) Correct. The realized return would be greater than the yield to maturity (YTM) because the coupons would be reinvested at forward rates that increase and eventually exceed the YTM because the spot curve is upward sloping. The YTM can be a poor estimate of expected return if interest rates are volatile and if the yield curve is steeply sloped. YTM assumes that all reinvestment of coupons is made at the assumed rate, which is the YTM. Although this math is not necessary to answer the question, the present value of the bond is 101.15; the future value of the bond assuming that all coupons are reinvested at the forward rates is 141.87; the annualized realized return is 7.0%, which is greater than the 6.72% yield to maturity.\nWhere 141.87 =\nYear 1 FVCFs = 7(1 + 0.05)(1 + 0.07)(1.091)(1.111) = 9.53\nYear 2 FVCFs = 7(1 + 0.07)(1.091)(1.111) = 9.08\nYear 3 FVCFs = 7(1.091)(1.111) = 8.48\nYear 4 FVCFs = 7(1.111) = 7.78\nYear 5 FVCFs = 107\nAnd where (141.87 – 101.15)/101.15 = 0.40257 [solve 1.075 = 1 + 0.40257].", "ko": "Spot curve가 상승(3%→7%)하고 금리가 forward대로 실현되면, 쿠폰은 점점 높아지는 forward rate(5.01%→11.10%)로 재투자되어 결국 YTM(6.72%)보다 높은 금리로 재투자됩니다 → 실현수익률(약 7.0%) > YTM.", "trap": "YTM의 숨은 가정 = 'YTM으로 재투자'. 상승 커브 + forward 실현 → 재투자율 ↑ → 실현수익률 > YTM.", "f": "실현수익률 = (Σ 쿠폰×재투자 FV + 원금)/Price 의 연환산", "why": {"A": "실현수익률 < YTM은 재투자율이 YTM보다 낮을 때(하향 커브)입니다.", "B": "실현수익률 = YTM은 쿠폰이 정확히 YTM으로 재투자될 때만 성립합니다."}, "orig": "ECO Module 1 Q75"}, {"id": "ECO-M1-Q80", "src": "ECO 오답", "module": 1, "tag": "Bootstrapping 목적", "vig": null, "stem": "The process of bootstrapping is most likely used to:", "opts": {"A": "derive the forward rate curve using the spot rate curve.", "B": "adjust for the shape of the par curve when deriving the spot rate curve.", "C": "derive zero-coupon rates using the par yields of coupon-paying government bonds."}, "ans": "C", "en": "(A) Incorrect because even though the spot rate curve can be used to derive the forward rate curve, this is not known as bootstrapping.\n(B) Incorrect because the shape of the yield curve is not relevant in the process of bootstrapping. The zero-coupon rates are determined by using the par yields and solving for the zero-coupon rates one by one, from the shortest to longest maturities.\n(C) Correct because zero-coupon rates are determined by using the par yields and solving for the zero-coupon rates one by one, from the shortest to longest maturities using a forward substitution process known as bootstrapping. The par curve represents the yields to maturity on coupon-paying government bonds, priced at par, over a range of maturities.", "ko": "Bootstrapping = coupon-paying 국채의 par yield로부터 zero-coupon(spot) rate를 짧은 만기부터 순차적으로 도출하는 forward substitution 과정입니다.", "trap": "Bootstrapping: par → spot. Forward rate model: spot → forward. 혼동 주의.", "f": "par curve —(bootstrapping)→ spot curve —(forward model)→ forward curve", "why": {"A": "spot curve로 forward curve를 구하는 것은 forward rate model이며 bootstrapping이라 부르지 않습니다.", "B": "커브 '모양'을 보정하는 절차가 아닙니다. 모양과 무관하게 par yield에서 spot을 하나씩 풉니다."}, "orig": "ECO Module 1 Q80"}, {"id": "ECO-M1-Q86", "src": "ECO 오답", "module": 1, "tag": "YTM이 좋은 기대수익률 추정치인 경우", "vig": null, "stem": "The YTM of a bond provides a good estimate for expected return if the spot rate curve is:", "opts": {"A": "downward sloping.", "B": "flat.", "C": "upward sloping."}, "ans": "B", "en": "(A) Incorrect because the YTM can provide a poor estimate of expected return if the yield curve is sloped either upward or downward.\n(B) Correct because the YTM is generally a realistic estimate of expected return only if the yield curve is flat.\n(C) Incorrect because the YTM can provide a poor estimate of expected return if the yield curve is sloped either upward or downward.", "ko": "YTM은 spot curve가 flat일 때만 현실적인 기대수익률 추정치입니다. 커브가 상승이든 하락이든 기울어 있으면 재투자율이 YTM과 달라져 부정확해집니다.", "trap": "기울기 방향과 상관없이 '기울어 있으면' YTM은 부정확.", "f": "Flat curve ⇒ 모든 재투자율 = YTM ⇒ 실현수익률 = YTM", "why": {"A": "하향 커브 → 재투자율 < YTM → 실현수익률 < YTM. 좋은 추정치가 아닙니다.", "C": "상승 커브 → 재투자율 > YTM(forward대로면) → 실현수익률 ≠ YTM."}, "orig": "ECO Module 1 Q86"}, {"id": "ECO-M1-Q87", "src": "ECO 오답", "module": 1, "tag": "Swap spread vs I-spread vs G-spread", "vig": null, "stem": "A German manufacturing company has an outstanding bond maturing in five years and trading with a YTM of 3.90%. If the 5-year Bund is yielding 2.65% and the fixed rate of a 5-year, fixed-for-float MRR swap is 3.20%, the swap spread is:", "opts": {"A": "55 bps.", "B": "70 bps.", "C": "125 bps."}, "ans": "A", "en": "(A) Correct because a swap spread is an excess yield of swap rates over the yields on government bonds, and we use the terms I-spread, ISPRD, or interpolated spread to refer to bond yields net of the swap rates of the same maturities.\nSwap spread = 3.20% – 2.65% = 0.55% = 55 bps.\n(B) Incorrect because this is the I-spread, a swap spread is an excess yield of swap rates over the yields on government bonds, and we use the terms I-spread, ISPRD, or interpolated spread to refer to bond yields net of the swap rates of the same maturities. In its simplest form, the I-spread can be measured as the difference between the yield-to-maturity of the bond and the swap rate given by a straight-line interpolation of the swap curve.\nI-spread = 3.90% – 3.20% = 0.70% = 70 bps.\n(C) Incorrect because this is the spread between the yield-to-maturity of the company's bond and the benchmark government bond.\nBenchmark spread = 3.90% – 2.65% = 1.25% = 125 bps.", "ko": "Swap spread = swap rate − 동일만기 국채 = 3.20% − 2.65% = 0.55% = 55 bps. I-spread = 채권 YTM − swap rate = 3.90 − 3.20 = 70 bps. G-spread(benchmark spread) = 채권 YTM − 국채 = 3.90 − 2.65 = 125 bps.", "trap": "3가지 spread를 한 문제에 모두 선지로 제시하는 전형적 패턴. '무엇에서 무엇을 빼는지' 공식으로 구분.", "f": "Swap spread = Swap − Govt  |  I-spread = Bond YTM − Swap  |  G-spread = Bond YTM − Govt", "why": {"B": "70 bps는 I-spread(채권 YTM − swap rate)입니다. swap spread는 회사채 YTM을 쓰지 않습니다.", "C": "125 bps는 회사채 YTM − 국채(G-spread/benchmark spread)입니다."}, "orig": "ECO Module 1 Q87"}, {"id": "ECO-M1-Q88", "src": "ECO 오답", "module": 1, "tag": "Segmented markets vs Preferred habitat", "vig": null, "stem": "In contrast to the preferred habitat theory of the term structure of interest rates, the segmented market theory assumes that:", "opts": {"A": "borrowers and lenders have strong preferences for particular maturities.", "B": "investors will accept additional risk in return for additional expected returns.", "C": "yields are determined entirely by the supply and demand for funds of a particular maturity."}, "ans": "C", "en": "(A) Incorrect because this applies to both theories. The preferred habitat theory is similar to the segmented markets theory in proposing that many borrowers and lenders have strong preferences for particular maturities, but it does not assert that yields at different maturities are determined independently of each other.\n(B) Incorrect because the preferred habitat theory is based on the realistic notion that agents and institutions will accept additional risk in return for additional expected returns. The theory contends that if the expected additional returns to be gained become large enough, institutions will be willing to deviate from their preferred maturities or habitats. On the other hand, the segmented markets theory assumes that market participants are either unwilling or unable to invest in anything other than securities of their preferred maturity.\n(C) Correct because this is a characteristic of the segmented markets theory. In summary, the segmented markets theory assumes that market participants are either unwilling or unable to invest in anything other than securities of their preferred maturity. It follows that the yield of securities of a particular maturity is determined entirely by the supply and demand for funds of that particular maturity.", "ko": "Segmented markets theory: 참여자는 선호 만기 외에는 투자하지 않거나 못하므로, 각 만기 수익률은 그 만기의 자금 수요·공급만으로 (다른 만기와 독립적으로) 결정됩니다.", "trap": "'In contrast to' 문제 → 공통점(A)은 오답. Segmented만의 고유 특징 = 만기별 '독립적' 수급 결정.", "f": "Segmented: 이탈 불가, 만기별 독립 / Preferred habitat: 보상 충분 시 이탈", "why": {"A": "차입자·대여자가 특정 만기를 강하게 선호한다는 것은 두 이론 '공통' 전제입니다. 차이점이 아닙니다.", "B": "추가 기대수익이 충분하면 위험을 감수하고 선호 만기를 벗어난다 → preferred habitat theory의 특징입니다."}, "orig": "ECO Module 1 Q88"}, {"id": "ECO-M1-Q89", "src": "ECO 오답", "module": 1, "tag": "Yield curve 움직임 – level/steepness/curvature", "vig": null, "stem": "Short-term yields moving in the opposite direction of long-term yields primarily represents a change in the:", "opts": {"A": "level of the curve.", "B": "curvature of the curve.", "C": "steepness of the curve."}, "ans": "C", "en": "(A) Incorrect because the level movement refers to an upward or downward shift in the yield curve.\n(B) Incorrect because the curvature movement is a reference to movement in three segments of the yield curve: The short-term and long-term segments rise while the middle-term segment falls, or vice versa.\n(C) Correct because the steepness movement refers to a non-parallel shift in the yield curve when either short-term rates change more than long-term rates or long-term rates change more than short-term rates.", "ko": "단기와 장기 수익률이 반대 방향으로 움직이면(또는 변화폭이 다르면) 기울기, 즉 steepness 변화입니다.", "trap": "2구간(단기 vs 장기) 반대 → steepness. 3구간(단·장 vs 중기) → curvature.", "f": "Level: 평행 이동 / Steepness: 단·장기 차이 변화 / Curvature: 중기 vs 양끝", "why": {"A": "Level = 커브 전체가 평행하게 위/아래로 이동.", "B": "Curvature = 단기·장기는 같이 오르고 중기는 내리는(또는 반대) 3구간 움직임(나비형, butterfly)."}, "orig": "ECO Module 1 Q89"}, {"id": "ECO-M1-Q92", "src": "ECO 오답", "module": 1, "tag": "Swap rate 계산 (discount factor 이용)", "vig": null, "stem": "An analyst computes the following discount factors using a government spot curve:\nMaturity (Years)\tDiscount Factor\n1\t0.9709\n2\t0.8653\n3\t0.7938\nBased on this information, the 3-year swap rate is closest to:", "opts": {"A": "7.8%.", "B": "8.0%.", "C": "9.0%."}, "ans": "A", "en": "(A) Correct because the three-year swap rate can be determined from spot rates solving the equation; s3 /(1 + z1 )^1 + s3 /(1 + z2 )^2 + s3 /(1 + z3 )^3 + 1 /(1 + z3 )^3 = 1. Here, it should be noted that each discount factor, DFN = 1 /(1 + zN )N. Therefore, the equation above is equivalent to: s3 × DF1 + s3 × DF2 + s3 × DF3 + DF3 = 1. Using the values provided in this case: 0.9709 × s3 + 0.8653 × s3 + 0.7938 × s3 + 0.7938 = 1.\n2.6300 × s3 = 0.2062.\ns3 = 0.0784 ≈ 7.8%.\n(B) Incorrect because this is the three-year spot rate. The three-year spot rate (z3) using the three-year discount factor (DF3) is: z3 = (1 / DF3 )^1/3 – 1. Using the values provided in this case:\nz3 = (1 / 0.7938 )^1/3 – 1 = 0.08001 ≈ 8.0%.\n(C) Incorrect because this is the one-year forward rate applicable in year three, that is the one-year forward rate two-year hence (f2,1), which can be obtained using the equation: (1 + f2,1)^1 = (1 + z3 )^3 / (1 + z2 )^2 . Here, it should be noted that each discount factor, DFN = 1 /(1 + zN )N. Therefore, (1 + f2,1)^1 = DF2 / DF3 . Using the values provided in this case: 1 + f2,1 = 0.8653 / 0.7938 = 1.09007.\nf2,1 = 0.09007 ≈ 9.0%.", "ko": "Swap rate = 해당 만기 par rate. s3 × (DF1 + DF2 + DF3) + DF3 = 1 → s3 = (1 − 0.7938)/(0.9709 + 0.8653 + 0.7938) = 0.2062/2.6300 = 7.84% ≈ 7.8%.", "trap": "Swap rate = par rate (≠ spot, ≠ forward). 상승 커브에서 par < spot.", "f": "s_N = (1 − DF_N) / Σ DF_t", "why": {"B": "8.0%는 3년 spot rate z3 = (1/0.7938)^(1/3) − 1 입니다. swap rate는 par rate이므로 spot과 다릅니다.", "C": "9.0%는 f(2,1) = DF2/DF3 − 1 입니다."}, "orig": "ECO Module 1 Q92"}, {"id": "ECO-M1-Q93", "src": "ECO 오답", "module": 1, "tag": "Segmented markets theory – 차입자·대여자 선호", "vig": null, "stem": "Which of the following theories of the term structure of interest rates is best represented by both lender and borrower preferences influencing the shape of the yield curve?", "opts": {"A": "Local expectations theory", "B": "Liquidity preference theory", "C": "Segmented markets theory"}, "ans": "C", "en": "(A) Incorrect because local expectations theory contends that the expected return for every bond over short periods is the risk-free rate.\n(B) Incorrect because liquidity preference theory claims that lenders require a liquidity premium as an incentive to lend long term.\n(C) Correct because unlike expectations theory and liquidity preference theory, segmented markets theory allows for lender and borrower preferences to influence the shape of the yield curve. The result is that yields are not a reflection of expected spot rates or liquidity premiums. Rather, they are solely a function of the supply and demand for funds of a particular maturity. That is, each maturity sector can be thought of as a segmented market in which yield is determined independently from the yields that prevail in other maturity segments.", "ko": "대여자와 차입자의 선호(특정 만기 수급)가 커브 모양을 결정한다고 보는 이론은 segmented markets theory입니다. 수익률은 기대 spot이나 유동성 프리미엄이 아니라 각 만기의 자금 수급만으로 결정됩니다.", "trap": "'Both lender and borrower preferences' → segmented markets (또는 preferred habitat).", "f": "Segmented: yield_N = f(supply_N, demand_N)", "why": {"A": "Local expectations theory는 '단기 보유 시 모든 채권의 기대수익률 = 무위험금리'라는 이론입니다.", "B": "Liquidity preference theory는 '대여자'가 장기 대출에 유동성 프리미엄을 요구한다는 이론이지, 차입자·대여자 양측 선호가 커브를 결정한다는 이론이 아닙니다."}, "orig": "ECO Module 1 Q93"}, {"id": "ECO-M1-Q94", "src": "ECO 오답", "module": 1, "tag": "Factor별 설명력 – level > steepness > curvature", "vig": null, "stem": "Which yield curve factor typically has the smallest impact in explaining the total variance in interest rates?", "opts": {"A": "Level", "B": "Curvature", "C": "Steepness"}, "ans": "B", "en": "(A) Incorrect because in practice, the level movement factor explains most of the total changes in swap and bond market yields. Therefore, it has the greatest impact.\n(B) Correct because curvature, tends to have a negative impact on intermediate yields and a positive impact on short- and long-term yields. This variable explaining the twist in the yield curve has the smallest impact of the three.\n(C) Incorrect because the steepness factor explains less of the total variance in rates than the level factor. However, it still has more impact than the curvature factor, which has the smallest impact of the three.", "ko": "수익률 변동의 설명력: level(가장 큼) > steepness > curvature(가장 작음). Curvature는 중기 수익률에는 음(−), 단기·장기에는 양(+)의 영향을 주는 'twist' 요인으로 설명력이 가장 작습니다.", "trap": "'smallest' vs 'most important' 문구를 거꾸로 읽는 실수. 설명력 순서 L > S > C 암기.", "f": "설명력: Level > Steepness > Curvature", "why": {"A": "Level은 swap·채권 수익률 변화의 대부분을 설명하는 가장 큰 요인입니다.", "C": "Steepness는 level보다는 작지만 curvature보다는 큽니다."}, "orig": "ECO Module 1 Q94"}, {"id": "ECO-M1-Q97", "src": "ECO 오답", "module": 1, "tag": "Bootstrapping – 2년 spot rate", "vig": null, "stem": "The par curve for US Treasuries paying annual coupons is presented below:\nMaturity (Years)\tPar Rate\n1\t4.15%\n2\t5.25%\n3\t6.35%\nThe 2-year zero-coupon rate is closest to:", "opts": {"A": "4.70%.", "B": "5.25%.", "C": "5.28%."}, "ans": "C", "en": "(A) Incorrect because although the discounting is done correctly, the numerator of the equation for the first period does not use the correct coupon rate.\n1 = [0.0415/(1 + 0.0415)] + [1.0525/(1 + z2)^2]\n[1.0525/(1 + z2)^2] = 1 – [0.0415/(1 + 0.0415)]= 1 – 0.039846 = 0.960154\n(1+z2)^2 = 1.0525/0.960154 = 1.096178 gives z2 = 4.6985%\n(B) Incorrect because no bootstrapping is applied and this corresponds to the par rate and not the zero rate for year 2. The par curve represents the yields to maturity on coupon-paying government bonds, priced at par, over a range of maturities and the par curve is important for valuation in that it can be used to construct a zero-coupon yield curve.\n(C) Correct because to get to the spot rate z2  the following equation needs to be solved:\n1 = [0.0525/(1 + 0.0415)] + [1.0525/(1 + z2)^2]\n[1.0525/(1 + z2)^2] =1 – [0.0525/(1 + 0.0415)]= 1 – 0.050408 = 0.949592\n(1 + z2)^2 = 1.0525/0.949592 = 1.108371 gives z2 = 5.2792%", "ko": "2년 par bond(쿠폰 5.25%)의 1년차 쿠폰은 1년 spot(=1년 par 4.15%)으로 할인: 1 = 0.0525/1.0415 + 1.0525/(1+z2)² → 1.0525/(1+z2)² = 0.949592 → (1+z2)² = 1.108371 → z2 = 5.279% ≈ 5.28%.", "trap": "쿠폰은 '해당 채권의 par rate', 할인율은 '각 시점 spot'. 분자와 분모를 혼동하지 말 것.", "f": "1 = p2/(1+z1) + (1+p2)/(1+z2)^2", "why": {"A": "분자 쿠폰을 2년 par 쿠폰(5.25%)이 아니라 1년 par rate(4.15%)로 넣은 오류 → 4.70%.", "B": "5.25%는 2년 par rate 그 자체입니다. bootstrapping을 하지 않았습니다. 상승 커브에서 spot은 par보다 약간 높습니다."}, "orig": "ECO Module 1 Q97"}, {"id": "ECO-M1-Q14", "src": "ECO 관련유형", "module": 1, "tag": "Swap spread 계산", "vig": null, "stem": "A two-year fixed-for-floating MRR swap is 1.00%, and the two-year US Treasury bond is yielding 0.63%. The swap spread is closest to:", "opts": {"A": "37 bps.", "B": "100 bps.", "C": "163 bps."}, "ans": "A", "en": "A is correct. The swap spread = 1.00% − 0.63% = 0.37%, or 37 bps.", "ko": "Swap spread = 2년 swap rate − 2년 국채 수익률 = 1.00% − 0.63% = 0.37% = 37 bps.", "trap": "Swap spread는 '차이'. swap rate 자체나 합계를 고르는 실수.", "f": "Swap spread = Swap rate − Govt yield", "why": {"B": "100 bps는 swap rate 자체입니다.", "C": "163 bps는 두 금리를 더한 값입니다."}, "orig": "ECO Module 1 Q14"}, {"id": "ECO-M1-Q16", "src": "ECO 관련유형", "module": 1, "tag": "TED spread 방향", "vig": null, "stem": "If the three-month T-bill rate drops and MRR remains the same, the relevant TED spread:", "opts": {"A": "increases.", "B": "decreases.", "C": "does not change."}, "ans": "A", "en": "A is correct. The TED spread is the difference between the three-month MRR and the three-month Treasury bill rate. If the T-bill rate falls and MRR does not change, the TED spread will increase.", "ko": "TED = 3개월 MRR − 3개월 T-bill. T-bill 금리가 하락하고 MRR이 불변이면 spread는 커집니다(위험 인식 증가 신호, flight to quality에서 흔함).", "trap": "빼는 쪽(T-bill)이 하락 → spread 확대.", "f": "TED = MRR − T-bill", "why": {"B": "빼는 항(T-bill)이 줄면 차이는 커집니다.", "C": "T-bill이 변했으므로 spread도 변합니다."}, "orig": "ECO Module 1 Q16"}, {"id": "ECO-M1-Q38", "src": "ECO 관련유형", "module": 1, "tag": "통화긴축 → bearish flattening", "vig": null, "stem": "During economic expansions, monetary authorities raise benchmark rates to help control inflation. This action is most often consistent with:", "opts": {"A": "bearish flattening.", "B": "bullish steepening.", "C": "bearish steepening."}, "ans": "A", "en": "A is correct. This action is most often consistent with bearish flattening, or short-term bond yields rising more than long-term bond yields resulting in a flatter yield curve.", "ko": "경기 확장기 인플레 억제를 위한 기준금리 인상 → 단기금리가 장기금리보다 더 크게 상승 → bearish flattening(금리↑ + 커브 평탄화).", "trap": "Bearish/bullish = 금리 상승/하락(가격 기준), flattening/steepening = 단기·장기 상대 움직임.", "f": "긴축 → bearish flattening / flight to quality → bullish flattening", "why": {"B": "bullish steepening은 금리 하락(주로 단기 급락, 완화적 정책) 시 나타납니다.", "C": "bearish steepening은 장기금리가 더 크게 오를 때(인플레 기대·재정 우려)입니다."}, "orig": "ECO Module 1 Q38"}, {"id": "ECO-M1-Q81", "src": "ECO 관련유형", "module": 1, "tag": "Forward contract 전략 – 미래 spot < forward 예상", "vig": null, "stem": "If an investor believes that future spot rates will be below the rates predicted by the existing forward rates, the investor should:", "opts": {"A": "sell a forward contract.", "B": "buy a forward contract.", "C": "neither buy nor sell a forward contract because the forward price will not change."}, "ans": "B", "en": "(A) Incorrect because if the trader expects the future spot rate to be above that predicted by the existing forward rate, then the forward contract value is expected to decrease and the trader would sell the forward contract.\n(B) Correct because if a trader expects the future spot rate to be below what is predicted by the prevailing forward rate, the forward contract value is expected to increase and the trader would buy the forward contract.\n(C) Incorrect because the forward contract price remains unchanged as long as future spot rates evolve as predicted by today’s forward curve.", "ko": "미래 spot이 현재 forward보다 낮을 것으로 예상하면, 미래 채권가격이 forward 가격보다 높아질 것이므로 forward contract 가치가 오릅니다 → forward를 매수.", "trap": "금리↓ 예상 = 가격↑ 예상 = 매수(long).", "f": "E(S) < f → 채권 저평가 → Buy", "why": {"A": "forward 매도는 미래 spot이 forward보다 '높을' 것으로 예상할 때입니다.", "C": "forward 가격은 미래 spot이 forward대로 실현될 때만 변하지 않습니다."}, "orig": "ECO Module 1 Q81"}, {"id": "ECO-M1-Q83", "src": "ECO 관련유형", "module": 1, "tag": "미래 spot vs forward → 1년 보유수익률", "vig": null, "stem": "For an investor expecting future spot rates to be below the current forward rates, the expected return of a bond over a 1-year period will be:", "opts": {"A": "less than the 1-year risk-free rate.", "B": "equal to the 1-year risk-free rate.", "C": "greater than the 1-year risk-free rate."}, "ans": "C", "en": "(A) Incorrect because if a portfolio manager's projected spot curve is above (below) the forward curve and his expectation turns out to be true, the return will be less (more) than the one-period risk-free interest rate.\n(B) Incorrect because if a portfolio manager's projected spot curve is above (below) the forward curve and his expectation turns out to be true, the return will be less (more) than the one-period risk-free interest rate.\n(C) Correct because if a portfolio manager's projected spot curve is above (below) the forward curve and his expectation turns out to be true, the return will be less (more) than the one-period risk-free interest rate.", "ko": "미래 spot이 현재 forward보다 낮게 실현되면(예상이 맞으면) 채권 가격이 forward가 내재한 가격보다 높아져 1년 수익률 > 1년 무위험금리. forward대로 실현되면 모든 만기의 1년 수익률 = 1년 무위험금리.", "trap": "Forward대로 실현 ⇒ HPR = 1기간 무위험금리 (만기와 무관).", "f": "spot < forward ⇒ HPR > rf  /  spot = forward ⇒ HPR = rf", "why": {"A": "미래 spot > forward일 때 수익률 < 무위험금리입니다.", "B": "같아지는 것은 spot이 정확히 forward대로 실현될 때입니다."}, "orig": "ECO Module 1 Q83"}, {"id": "ECO-M1-Q90", "src": "ECO 관련유형", "module": 1, "tag": "Volatility term structure", "vig": null, "stem": "Long-term rates are typically:", "opts": {"A": "less volatile than short-term rates.", "B": "similarly volatile as short-term rates.", "C": "more volatile than short-term rates."}, "ans": "A", "en": "(A) Correct because the volatility term structure typically shows that short-term rates are more volatile than long-term rates.\n(B) Incorrect because the volatility term structure typically shows that short-term rates are more volatile than long-term rates.\n(C) Incorrect because the volatility term structure typically shows that short-term rates are more volatile than long-term rates.", "ko": "Volatility term structure는 일반적으로 단기금리가 장기금리보다 변동성이 큽니다(단기 = 통화정책 불확실성).", "trap": "금리 변동성(단기>장기) ≠ 가격 변동성(장기>단기).", "f": "σ(short rate) > σ(long rate)", "why": {"B": "단기와 장기의 변동성은 보통 다릅니다.", "C": "반대입니다. 장기 '금리'는 덜 변동적입니다."}, "orig": "ECO Module 1 Q90"}, {"id": "ECO-M1-Q95", "src": "ECO 관련유형", "module": 1, "tag": "금리 변동성 vs 가격 변동성", "vig": null, "stem": "Which of the following statements is most accurate with respect to the term structure of interest rates and volatility?", "opts": {"A": "Short-term rates are more volatile than long-term rates, and short-term bond prices are more volatile than long-term bond prices", "B": "Short-term rates are more volatile than long-term rates, and long-term bond prices are more volatile than short-term bond prices", "C": "Long-term rates are more volatile than short-term rates, and long-term bond prices are more volatile than short-term bond prices"}, "ans": "B", "en": "(A) Incorrect because the volatility term structure typically shows that short-term rates are more volatile than long-term rates. That said, long-term bond prices tend to vary more than short-term bond prices given the impact of duration.\n(B) Correct because the volatility term structure typically shows that short-term rates are more volatile than long-term rates. That said, long-term bond prices tend to vary more than short-term bond prices given the impact of duration.\n(C) Incorrect because the volatility term structure typically shows that short-term rates are more volatile than long-term rates.", "ko": "단기 '금리'는 장기 금리보다 변동성이 크지만, 장기 채권 '가격'은 듀레이션이 커서 단기 채권 가격보다 더 크게 움직입니다.", "trap": "M1 오답 Q74와 같은 함정: '금리'와 '가격'을 구분.", "f": "%ΔP ≈ −Duration × Δy", "why": {"A": "가격 변동성은 듀레이션이 큰 장기채가 더 큽니다.", "C": "금리 변동성은 단기가 더 큽니다."}, "orig": "ECO Module 1 Q95"}, {"id": "ECO-M1-Q96", "src": "ECO 관련유형", "module": 1, "tag": "Flight to quality → bullish flattening", "vig": null, "stem": "Which of the following yield curve changes would most likely result from a flight to quality?", "opts": {"A": "Bullish flattening", "B": "Bearish flattening", "C": "Bullish steepening"}, "ans": "A", "en": "(A) Correct because bullish flattening typically occurs as a result of investor demand. During highly uncertain market periods, investors flock to government bonds in what is termed a flight to quality. This term refers to investors’ selling off higher-risk asset classes such as stocks and commodities in favor of default-risk-free government bonds. A flight to quality is often associated with bullish flattening, in which the yield curve flattens as long-term rates fall by more than short-term rates.\n(B) Incorrect because during economic expansions, monetary authorities raise benchmark rates to help control inflation. This action is often consistent with bearish flattening, or short-term bond yields rising more than long-term bond yields, resulting in a flatter yield curve. Therefore, this occurs as a result of a change in monetary policy.\n(C) Incorrect because during economic recessions or anticipated recessions, the monetary authority cuts benchmark rates to help stimulate economic activity. The lowering of interest rates is associated with bullish steepening, in which short-term rates fall by more than long-term yields, resulting in a steeper term structure. Therefore, this occurs as a result of a change in monetary policy.", "ko": "불안기에 위험자산을 팔고 국채로 몰림 → 장기금리가 단기금리보다 더 크게 하락 → bullish flattening.", "trap": "노트 정리 그대로: flight to quality → bullish flattening, 긴축 → bearish flattening.", "f": "", "why": {"B": "bearish flattening은 긴축 통화정책(단기금리 급등) 시나리오입니다.", "C": "bullish steepening은 단기금리가 더 크게 하락(금리 인하)할 때입니다."}, "orig": "ECO Module 1 Q96"}, {"id": "VAR-M1-01", "module": 1, "tag": "Forward rate model – f(1,2)", "stem": "The one-year spot rate is 4.00% and the three-year spot rate is 6.00%. The forward rate for a two-year loan beginning in one year, f(1,2), is closest to:", "opts": {"A": "5.00%.", "B": "7.01%.", "C": "14.52%."}, "ans": "B", "en": "(1 + z3)^3 = (1 + z1)(1 + f1,2)^2 → (1 + f1,2)^2 = 1.06^3/1.04 → f1,2 = 7.01%.", "ko": "(1.06)³ = (1.04)(1 + f1,2)² → (1 + f1,2)² = 1.191016/1.04 = 1.145208 → f1,2 = 7.01%. 2년짜리 forward이므로 제곱근을 취해 연율화합니다.", "why": {"A": "5.00%는 두 spot의 단순 평균입니다. forward는 spot의 산술평균이 아닙니다.", "C": "연율화(제곱근)를 하지 않은 2년 누적 수익률입니다."}, "trap": "f(A, B−A)의 기간이 2년 이상이면 (1/기간)승으로 연율화.", "f": "(1+z_B)^B = (1+z_A)^A × (1+f_A,B−A)^(B−A)", "orig": "변형 (ECO M1 Q11·Schweser LOS 23.a 근거)", "src": "변형", "vig": null}, {"id": "VAR-M1-02", "module": 1, "tag": "Swap spread vs I-spread vs G-spread", "stem": "A five-year corporate bond yields 4.80%. The five-year government bond yields 3.10% and the five-year fixed-for-floating MRR swap rate is 3.65%. The bond's I-spread is closest to:", "opts": {"A": "55 bps.", "B": "115 bps.", "C": "170 bps."}, "ans": "B", "en": "I-spread = bond yield − swap rate = 4.80% − 3.65% = 115 bps. (55 bps is the swap spread; 170 bps is the G-spread.)", "ko": "I-spread(interpolated spread) = 채권 YTM − 동일만기 swap rate = 4.80 − 3.65 = 115bp.", "why": {"A": "55bp는 swap spread(swap − 국채)입니다.", "C": "170bp는 G-spread(채권 − 국채)입니다."}, "trap": "ECO M1 Q87과 같은 3-spread 함정을 I-spread 관점에서 재출제.", "f": "I-spread = YTM − Swap rate", "orig": "변형 (ECO M1 Q87)", "src": "변형", "vig": null}, {"id": "VAR-M1-03", "module": 1, "tag": "Level/Steepness/Curvature 3-factor model", "stem": "A three-factor model shows that a one-standard-deviation increase in each factor changes the five-year yield by: level -0.42%, steepness -0.06%, curvature +0.38%. For a one-standard-deviation increase in the level factor combined with a two-standard-deviation decrease in the steepness factor, the five-year yield will change by approximately:", "opts": {"A": "-0.30%.", "B": "-0.54%.", "C": "-0.36%."}, "ans": "A", "en": "Δy = (+1)(−0.42%) + (−2)(−0.06%) = −0.42% + 0.12% = -0.30%.", "ko": "Level +1SD: −0.42%. Steepness −2SD: (−2) × (−0.06%) = +0.12%. 합계 = -0.30%. 'Factor 감소'는 loading 부호를 뒤집고 SD 배수를 곱합니다.", "why": {"B": "steepness '감소'인데 부호를 뒤집지 않았습니다(−0.42 + 2 × −0.06).", "C": "SD 배수(2배)를 빠뜨렸습니다."}, "trap": "ECO M1 Q50·Q51 패턴: 배수 누락 + 감소 시 부호 반전.", "f": "Δy = Σ loading_i × (SD 변화)_i", "orig": "변형 (ECO M1 Q50·Q51)", "src": "변형", "vig": null}, {"id": "VAR-M1-04", "module": 1, "tag": "TED spread vs MRR–OIS spread", "stem": "The three-month MRR is 5.30%, the three-month T-bill rate is 5.05%, and the three-month OIS rate is 5.15%. The TED spread is closest to:", "opts": {"A": "15 bps.", "B": "10 bps.", "C": "25 bps."}, "ans": "C", "en": "TED spread = MRR − T-bill = 5.30% − 5.05% = 25 bps. (15 bps is the MRR–OIS spread.)", "ko": "TED = 3M MRR − 3M T-bill = 25bp. MRR–OIS(= 15bp)는 은행 신용·유동성 지표.", "why": {"A": "MRR − OIS = MRR–OIS spread입니다.", "B": "OIS − T-bill은 표준 spread 지표가 아닙니다."}, "trap": "ECO M1 Q60 연결: TED = 경제 전반 위험(MRR vs T-bill), MRR–OIS = 은행 간 위험.", "f": "TED = MRR − T-bill,  MRR–OIS = MRR − OIS", "orig": "변형 (ECO M1 Q60, Schweser LOS 23.g)", "src": "변형", "vig": null}, {"id": "ECO-M2-Q5", "src": "ECO 오답", "module": 2, "tag": "Binomial tree calibration의 목적", "vig": 8, "stem": "A benefit of performing Task 1 is that it:", "opts": {"A": "enables the model to price bonds with embedded options.", "B": "identifies benchmark bonds that have been mispriced by the market.", "C": "allows investors to realize arbitrage profits through stripping and reconstitution."}, "ans": "A", "en": "A is correct. Calibrating a binomial interest rate tree to match a specific term structure is important because we can use the known valuation of a benchmark bond from the spot rate pricing to verify the accuracy of the rates shown in the binomial interest rate tree. Once its accuracy is confirmed, the interest rate tree can then be used to value bonds with embedded options. While discounting with spot rates will produce arbitrage-free valuations for option-free bonds, this spot rate method will not work for bonds with embedded options where expected future cash flows are interest-rate dependent (because rate changes impact the likelihood of options being exercised). The interest rate tree allows for the alternative paths that a bond with embedded options might take.\nB is incorrect because calibration does not identify mispriced benchmark bonds. In fact, benchmark bonds are employed to prove the accuracy of the binomial interest rate tree, because they are assumed to be correctly priced by the market.\nC is incorrect because the calibration of the binomial interest rate tree is designed to produce an arbitrage-free valuation approach and such an approach does not allow a market participant to realize arbitrage profits through stripping and reconstitution.", "ko": "트리를 벤치마크 term structure에 calibration하면(벤치마크 채권 가격을 정확히 재현) 무차익(arbitrage-free) 트리가 됩니다. 그 트리로 금리경로에 따라 현금흐름이 달라지는 내재옵션 채권을 평가할 수 있습니다. Spot rate 할인은 option-free 채권에만 쓸 수 있습니다.", "trap": "벤치마크 = 정확히 가격된 기준. Calibration = 벤치마크 가격 재현 → arbitrage-free → 옵션부 채권 평가 가능.", "f": "Calibrated tree: Σ PV(benchmark CF on tree) = benchmark market price", "why": {"B": "Calibration은 벤치마크 채권이 '올바르게 가격 매겨져 있다'고 가정하고 그 가격에 맞추는 과정입니다. 벤치마크의 오가격을 찾는 도구가 아닙니다.", "C": "Calibration의 결과는 차익거래가 '없는' 평가 틀입니다. stripping/reconstitution 차익을 얻게 해주는 것이 아닙니다."}, "orig": "ECO Module 2 Q5"}, {"id": "ECO-M2-Q8", "src": "ECO 오답", "module": 2, "tag": "Bootstrapping 후 spot 할인 – 오가격 금액", "vig": 9, "stem": "Based on Exhibits 2 and 3 and using Method 1, the amount (in absolute terms) by which the Hutto-Barkley Inc. corporate bond is mispriced is closest to:", "opts": {"A": "0.3368 per 100 of par value.", "B": "0.4682 per 100 of par value.", "C": "0.5156 per 100 of par value."}, "ans": "C", "en": "C is correct. Bootstrap the par curve: z1 = 3%; 100 = 4/1.03 + 104/(1 + z2)^2 → z2 = 4.02%; 100 = 5/1.03 + 5/1.0402^2 + 105/(1 + z3)^3 → z3 = 5.07%.\nArbitrage-free price of Hutto-Barkley = 3/1.03 + 3/1.0402^2 + 103/1.0507^3 = 94.4828. Mispricing = 94.9984 − 94.4828 = 0.5156 per 100 of par.\nA is incorrect because it discounts with each maturity's YTM (value 94.6616). B is incorrect because it bootstraps using the Year 3 coupon for every maturity (value 94.5302).", "ko": "① par curve(3%, 4%, 5%)를 bootstrapping: z1 = 3%, 100 = 4/1.03 + 104/(1+z2)² → z2 = 4.02%, 100 = 5/1.03 + 5/1.0402² + 105/(1+z3)³ → z3 = 5.07%. ② Hutto-Barkley 공정가 = 3/1.03 + 3/1.0402² + 103/1.0507³ = 94.4828. ③ 시장가 94.9984 − 94.4828 = 0.5156 (고평가).", "trap": "Par curve가 주어지면 반드시 bootstrapping으로 spot을 먼저 구한 뒤 할인.", "f": "Arbitrage-free value = Σ CF_t/(1+z_t)^t", "why": {"A": "각 만기의 par YTM(3%, 4%, 5%)으로 할인한 오류 → 94.6616. par rate ≠ spot rate.", "B": "모든 만기 spot을 3년 쿠폰(5%)으로 bootstrapping한 오류 → 94.5302. 각 만기 벤치마크의 '자기 쿠폰'을 써야 합니다."}, "orig": "ECO Module 2 Q8"}, {"id": "ECO-M2-Q10", "src": "ECO 오답", "module": 2, "tag": "Binomial tree backward induction – 쿠폰 처리", "vig": 9, "stem": "Based on Exhibit 4 and using Method 2, the correct price for Bond X is closest to:", "opts": {"A": "97.2998.", "B": "109.0085.", "C": "115.0085."}, "ans": "B", "en": "B is correct. 106/1.06 = 100.0000; 106/1.05 = 100.9524; 106/1.03 = 102.9126.\n[6 + (0.5 × 100.0000 + 0.5 × 100.9524)]/1.04 = 102.3810; [6 + (0.5 × 100.9524 + 0.5 × 102.9126)]/1.02 = 105.8162.\n[6 + (0.5 × 102.3810 + 0.5 × 105.8162)]/1.01 = 109.0085.\nA is incorrect because the coupon is subtracted at each node. C is incorrect because it assumes a coupon is paid at Time 0.", "ko": "만기 CF 106을 각 Year 2 노드 금리로 할인: 106/1.06 = 100.0000, 106/1.05 = 100.9524, 106/1.03 = 102.9126. Year 1: [6 + (0.5×100 + 0.5×100.9524)]/1.04 = 102.3810, [6 + (0.5×100.9524 + 0.5×102.9126)]/1.02 = 105.8162. Year 0: [6 + (0.5×102.3810 + 0.5×105.8162)]/1.01 = 109.0085.", "trap": "Backward induction: 각 노드에서 '그 시점에 받는 쿠폰'을 더하고 그 노드의 1기간 금리로 할인. Time 0 쿠폰 없음.", "f": "V_node = [C + 0.5×V_up + 0.5×V_down] / (1 + r_node)", "why": {"A": "97.2998은 각 노드에서 쿠폰을 더하지 않고 빼버린 값입니다. 노드 가치 = (쿠폰 + 기대 가치)/(1+노드 금리).", "C": "115.0085는 Time 0에 쿠폰 6을 추가로 더한 값입니다. Time 0(현재)에는 쿠폰이 지급되지 않습니다."}, "orig": "ECO Module 2 Q10"}, {"id": "ECO-M2-Q11", "src": "ECO 오답", "module": 2, "tag": "No-arbitrage 원칙 – Dominance vs Value additivity", "vig": 10, "stem": "Based on Exhibit 1, Alvarez finds that an arbitrage opportunity is:", "opts": {"A": "not available.", "B": "available based on the dominance principle.", "C": "available based on the value additivity principle."}, "ans": "B", "en": "B is correct. Based on the dominance principle, an arbitrage opportunity exists. The dominance principle asserts that a financial asset with a risk-free payoff in the future must have a positive price today. Because Asset A and Asset B are both risk-free assets, they should have the same discount rate. Relative to its payoff, Asset A is priced at $500/525, or 0.95238, and Asset B is priced at $1,000/1,100, or 0.90909. Given its higher implied discount rate (10%) and lower corresponding price, Asset B is cheap relative to Asset A, which has a lower implied discount rate (5%) and a higher corresponding price.\nThe arbitrage opportunity based on dominance is to sell two units of Asset A for $1,000 and buy one unit of Asset B. There is no cash outlay today, and in one year, the portfolio delivers a net cash inflow of $50 [= $1,100 – (2 × $525)].", "ko": "두 자산 모두 무위험이므로 할인율이 같아야 합니다. A: 500/525 = 0.9524(할인율 5%), B: 1,000/1,100 = 0.9091(할인율 10%) → B가 상대적으로 쌈. A 2단위 매도(+1,000), B 1단위 매수(−1,000) → 오늘 현금 0, 1년 후 1,100 − 1,050 = +50. 동일 위험(무위험)인데 가격이 다른 것 = dominance 원칙 위반.", "trap": "Dominance: 같은(무위험) 수익원에 다른 가격. Value additivity: 전체 ≠ 부분의 합(strip/reconstitution).", "f": "무위험 할인계수: P/Payoff 동일해야 함", "why": {"A": "무위험 자산의 내재할인율이 5% vs 10%로 다르므로 차익거래 기회가 있습니다.", "C": "Value additivity는 '포트폴리오 가격 = 구성요소 가격의 합'(예: 채권 vs strip 합)이 깨질 때입니다. 여기는 동일 성격 자산 간 가격 비교이므로 dominance입니다."}, "orig": "ECO Module 2 Q11"}, {"id": "ECO-M2-Q15", "src": "ECO 오답", "module": 2, "tag": "Binomial tree 구성 요건 & 변동성 추정", "vig": 10, "stem": "Which of the various statements regarding binomial interest rate trees is correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "B", "en": "B is correct. Two methods are commonly used to estimate potential interest rate volatility in a binomial interest rate tree. The first method bases estimates on historical interest rate volatility. The second method uses observed market prices of interest rate derivatives.\nStatement 1 is incorrect because there are three requirements to create a binomial interest rate tree, not two. The third requirement is an assumption regarding the interest rate model. Statement 3 is incorrect because the valuation of a bond using spot rates and the valuation of a bond from an interest rate tree will be the same regardless of the volatility assumption used in the model.", "ko": "Statement 2가 맞습니다: 트리의 금리 변동성은 ① 과거(historical) 금리 변동성 또는 ② 금리 파생상품 시장가격의 내재(implied) 변동성으로 추정합니다.", "trap": "Option-free 채권: 변동성 무관. Calibrated tree 가치 = spot 할인 가치(항상).", "f": "Tree 요건: (1) benchmark rates (2) interest rate model (3) volatility", "why": {"A": "Statement 1 오류: 트리 생성에는 벤치마크 금리, 변동성 가정 외에 '금리 모형(interest rate model, 예: lognormal)' 가정이 필요합니다(3가지).", "C": "Statement 3 오류: calibration된 트리로 평가한 option-free 채권 가치는 변동성 가정과 무관하게 spot 할인 가치와 같습니다."}, "orig": "ECO Module 2 Q15"}, {"id": "ECO-M2-Q18", "src": "ECO 오답", "module": 2, "tag": "Monte Carlo – 경로 수와 정확도", "vig": 10, "stem": "Which of the statements regarding Monte Carlo simulation is correct?", "opts": {"A": "Only Statement 4 is correct.", "B": "Only Statement 5 is correct.", "C": "Both Statement 4 and Statement 5 are correct."}, "ans": "A", "en": "A is correct. Increasing the number of paths using the Monte Carlo method does increase the estimate’s statistical accuracy. It does not, however, provide a value that is closer to the bond’s true fundamental value.", "ko": "경로 수를 늘리면 추정치의 '통계적' 정확도(표본오차 감소)는 높아집니다(Statement 4 맞음). 하지만 모형·입력값이 틀리면 진짜 펀더멘털 가치에 더 가까워지지는 않습니다(Statement 5 틀림).", "trap": "'More paths = statistical accuracy ↑' (O) vs 'closer to true value' (X).", "f": "Monte Carlo: 경로↑ → 표본오차↓, 모형오차는 그대로", "why": {"B": "Statement 5는 틀립니다. Monte Carlo는 '모형과 입력값이 좋은 만큼만' 정확합니다.", "C": "Statement 5가 틀리므로 둘 다 맞을 수 없습니다."}, "orig": "ECO Module 2 Q18"}, {"id": "ECO-M2-Q19", "src": "ECO 오답", "module": 2, "tag": "Term structure 모형 – arbitrage-free vs equilibrium", "vig": null, "stem": "Which term structure model can be calibrated to closely fit an observed yield curve?", "opts": {"A": "The Ho–Lee model", "B": "The Vasicek model", "C": "The Cox–Ingersoll–Ross model"}, "ans": "A", "en": "A is correct. The Ho–Lee model is arbitrage free and can be calibrated to closely match the observed term structure.", "ko": "Ho–Lee 모형은 arbitrage-free 모형으로, 시간에 따라 변하는 drift(θt)를 사용해 관측된 term structure에 정확히 calibration할 수 있습니다. Vasicek과 CIR은 equilibrium 모형으로 소수의 파라미터로 이론적 커브를 만들 뿐 관측 커브에 정확히 맞추지 못합니다.", "trap": "Arbitrage-free = Ho–Lee, KWF (시장가격에서 시작, 정확히 fit). Equilibrium = CIR, Vasicek (경제변수, 파라미터 적음).", "f": "Ho–Lee: dr = θt dt + σ dz  (θt 시간가변 → calibration)", "why": {"B": "Vasicek은 equilibrium 모형(평균회귀, 일정 변동성). 관측 커브에 정확히 맞추는 모형이 아닙니다.", "C": "CIR도 equilibrium 모형(평균회귀, 변동성이 금리 수준에 비례)."}, "orig": "ECO Module 2 Q19"}, {"id": "ECO-M2-Q20", "src": "ECO 오답", "module": 2, "tag": "Equilibrium vs Arbitrage-free 모형 정의", "vig": 11, "stem": "Which of Jones’s statements regarding equilibrium and arbitrage-free term structure models is incorrect?", "opts": {"A": "Statement 1 only", "B": "Statement 2 only", "C": "Both Statement 1 and Statement 2"}, "ans": "C", "en": "C is correct. Both statements are incorrect because Jones incorrectly describes both types of model. Equilibrium term structure models are factor models that seek to describe the dynamics of the term structure by using fundamental economic variables that are assumed to affect interest rates. Arbitrage-free term structure models use observed market prices of a reference set of financial instruments, assumed to be correctly priced, to model the market yield curve.", "ko": "Jones는 두 정의를 뒤바꿨습니다. Equilibrium 모형 = 금리에 영향을 주는 '펀더멘털 경제변수'로 term structure 동학을 설명하는 factor 모형. Arbitrage-free 모형 = 올바르게 가격된 기준 상품들의 '관측 시장가격'을 이용해 시장 수익률곡선을 모델링.", "trap": "정의 바꿔치기 패턴. Equilibrium = 경제 펀더멘털, Arbitrage-free = 시장가격.", "f": "Equilibrium: CIR, Vasicek / Arbitrage-free: Ho–Lee, KWF", "why": {"A": "Statement 2도 틀렸습니다(arbitrage-free 모형을 equilibrium 정의로 설명).", "B": "Statement 1도 틀렸습니다(equilibrium 모형을 arbitrage-free 정의로 설명)."}, "orig": "ECO Module 2 Q20"}, {"id": "ECO-M2-Q21", "src": "ECO 오답", "module": 2, "tag": "Equilibrium vs Arbitrage-free – 파라미터 수와 정밀도", "vig": 11, "stem": "Is Jones correct in describing key differences in equilibrium and arbitrage-free models as they relate to the number of parameters and model accuracy?", "opts": {"A": "Yes", "B": "No, she is incorrect about which type of model requires fewer parameter estimates.", "C": "No, she is incorrect about which type of model is more precise at modeling market yield curves."}, "ans": "A", "en": "A is correct. Consistent with Jones’s statement, equilibrium term structure models require fewer parameters to be estimated relative to arbitrage-free models, and arbitrage-free models allow for time-varying parameters. Consequently, arbitrage-free models can model the market yield curve more precisely than equilibrium models.", "ko": "Jones 설명이 맞습니다: equilibrium 모형은 추정할 파라미터가 적고, arbitrage-free 모형은 시간가변 파라미터를 허용하므로 시장 수익률곡선을 더 정밀하게 모델링합니다.", "trap": "Equilibrium: 파라미터 적음, 단순 / Arbitrage-free: 시간가변 파라미터, 시장 커브 정확 재현.", "f": "", "why": {"B": "파라미터가 더 적은 쪽은 equilibrium 모형이 맞습니다.", "C": "시장 커브를 더 정확히 맞추는 쪽은 arbitrage-free 모형이 맞습니다."}, "orig": "ECO Module 2 Q21"}, {"id": "ECO-M2-Q23", "src": "ECO 오답", "module": 2, "tag": "Calibration 비용/난이도 & spot vs tree 가치 동일성", "vig": 12, "stem": "Is Fujioka most likely correct when comparing her approach to valuation with the binomial interest rate tree framework?", "opts": {"A": "Yes.", "B": "No, she is incorrect regarding calibration of interest rate trees.", "C": "No, the values estimated by the two approaches will likely be different."}, "ans": "B", "en": "(A) Incorrect because she is incorrect about the skills and expense needed to calibrate an interest rate tree.\n(B) Correct. Calibrating an interest rate tree can be accomplished using spreadsheet software (e.g., the solver function in Microsoft Excel) and is thus relatively easy to do without the knowledge of special programming techniques and without great expense.\n(C) Incorrect because for an option-free bond, the interest rate volatility captured by the binomial tree doesn’t matter and the values estimated using spot rates (the zero-coupon yield curve) and a properly calibrated binomial tree should be the same.", "ko": "Fujioka의 첫 주장(option-free 채권은 spot 할인 = calibrated tree 가치)은 맞습니다. 틀린 부분은 'calibration에 특수 프로그래밍이 필요해 비용이 크다'입니다. 트리 calibration은 스프레드시트(Excel solver 등)로 비교적 쉽게, 큰 비용 없이 할 수 있습니다.", "trap": "'두 방법 값이 다르다'는 선지는 option-free 채권에선 항상 오답.", "f": "Option-free: V(spot) = V(calibrated tree)", "why": {"A": "calibration 난이도·비용에 대한 주장이 틀렸으므로 'Yes'가 아닙니다.", "C": "Option-free 채권은 변동성과 무관하게 두 방법의 가치가 같아야 합니다. 이 부분은 Fujioka가 맞습니다."}, "orig": "ECO Module 2 Q23"}, {"id": "ECO-M2-Q24", "src": "ECO 오답", "module": 2, "tag": "No-arbitrage의 조건", "vig": 12, "stem": "Of the three conditions Maalouf claims are necessary for a market to be arbitrage free, he is least likely correct regarding:", "opts": {"A": "Condition 1.", "B": "Condition 2.", "C": "Condition 3."}, "ans": "A", "en": "(A) Correct. The principle of no arbitrage applies to risk-free securities and portfolios, not too risky ones. Value additivity (Condition 3) and lack of dominance (Condition 2) must hold for a market to be arbitrage free but not a relationship between risk and expected return of risky securities.\n(B) Incorrect because Condition 1, which describes a lack of dominance, must hold for a market to be arbitrage free.\n(C) Incorrect because Condition 2, which describes value additivity,
