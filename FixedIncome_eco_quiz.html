s in the market. Annisquam and Hake are discussing several applications that need to be developed for the traders.\nHake begins development on an algorithm that will evaluate government bonds that have been stripped. He tests his logic by evaluating a dollar-denominated Tangoran government bond with a 3.20%, annual pay coupon maturing in three years, using data in Exhibit 1. The bond is quoted in the market at $103.50.\nExhibit 1 Spot, Par, and Forward Rates\n \tYear 1\tYear 2\tYear 3\nSpot Rate\t1.10%\t1.50%\t2.01%\nPar Rate\t1.10%\t1.50%\t2.00%\nForward Rate\t1.10%\t1.91%\t3.04%\nHake develops a framework for valuing bonds using a binomial interest rate tree. He understands that there are several factors used in developing the tree and asks Annisquam for counsel on the correct data to use. Annisquam makes the following comments to Hake:\n• Comment 1: In the valuation process, the interest rate tree generates cash flows that are interest rate dependent but does not provide the interest rates used to discount those cash flows.\n• Comment 2: Two assumptions must be made to create a binomial tree. The first is an interest rate model such as a lognormal model of interest rates. The second is a volatility of interest rates.\n• Comment 3: Volatility can be measured relative to the current level of rates. By using a lognormal distribution, interest rate movements are proportional to the level of rates and are bounded at the low end by zero.\nAnnisquam asks Hake to use a binomial interest rate tree to calculate the value of a bond. He tests the module using a three-year, $100 par value, 4% annual pay coupon bond and the data in Exhibit 2.\nExhibit 2 Three-Year Binomial Rate Tree\nTime 0\tYear 1\tYear 2\n2.90%\t3.60%\t4.50%\n\t2.60%\t3.25%\n\t\t2.35%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nAnnisquam tells Hake that he needs to calibrate the binomial interest rate tree to match a term structure of interest rates. Hake wants to better understand this process and asks Annisquam to describe it. Annisquam says, “Calibrating an interest rate tree requires an iterative process that ensures that the upper and lower rates are consistent with the volatility assumption, the interest rate model, and the observed market value of the benchmark bond. The cash flows of the bond are discounted using the interest rate tree, and if this doesn’t produce the correct price, another pair of forward rates is selected and the process is repeated.”\nAnnisquam then develops a model that compares the value of a bond determined using a binomial interest rate tree to its value determined using spot rates. The bond he selects for the comparison is non-benchmark, option-free, and has five years to maturity and an annual-pay coupon rate of 3%. The coupon rate is below the coupon rate of the benchmark bond. The yield curve is currently downward sloping. The output of Annisquam’s model shows that the spot rates generate a value equal to the market price of the bond, but the interest rate tree methodology produces a higher value.\nAnnisquam wants Hake to develop a program for pricing securities that are interest rate path dependent, such as mortgage-backed securities (MBS). He believes that using the Monte Carlo method and employing 2,000 simulations will provide an average present value across all scenarios equal to the actual market value of the securities. Hake runs a simulation and uses it to value a benchmark bond. He finds that the value generated does not equal the market price of the bond.", "Samuel & Sons is a fixed-income specialty firm that offers advisory services to investment management companies. On 1 October 20X0, Steele Ferguson, a senior analyst at Samuel, is reviewing three fixed-rate bonds issued by a local firm, Pro Star, Inc. The three bonds, whose characteristics are given in Exhibit 1, carry the highest credit rating.\nExhibit 1\nFixed-Rate Bonds Issued by Pro Star, Inc.\nBond\tMaturity\tCoupon\tType of Bond\nBond #1\t1 October 20X3\t4.40% annual\tOption-free\nBond #2\t1 October 20X3\t4.40% annual\tCallable at par on 1 October 20X1 and on 1 October 20X2\nBond #3\t1 October 20X3\t4.40% annual\tPutable at par on 1 October 20X1 and on 1 October 20X2\nThe one-year, two-year, and three-year par rates are 2.250%, 2.750%, and 3.100%, respectively. Based on an estimated interest rate volatility of 10%, Ferguson constructs the binomial interest rate tree shown in Exhibit 2.\nExhibit 2\nBinomial Interest Rate Tree\nYear 0\tYear 1\tYear 2\n2.2500%\t3.5930%\t4.6470%\n\t2.9417%\t3.8046%\n\t\t3.1150%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nOn 19 October 20X0, Ferguson analyzes the convertible bond issued by Pro Star given in Exhibit 3. That day, the option-free value of Pro Star’s convertible bond is $1,060 and its stock price $37.50.\nExhibit 3\nConvertible Bond Issued by Pro Star, Inc.\nIssue Date:\t6 December 20X0\nMaturity Date:\t6 December 20X4\nCoupon Rate:\t2%\nIssue Price:\t$1,000\nConversion Ratio:\t31", "John Smith, an investment adviser, meets with Lydia Carter to discuss her pending retirement and potential changes to her investment portfolio. Domestic economic activity has been weakening recently, and Smith’s outlook is that equity market values will be lower during the next year. He would like Carter to consider reducing her equity exposure in favor of adding more fixed-income securities to the portfolio.\nGovernment yields have remained low for an extended period, and Smith suggests considering investment-grade corporate bonds to provide additional yield above government debt issues. In light of recent poor employment figures and two consecutive quarters of negative GDP growth, the consensus forecast among economists is that the central bank, at its next meeting this month, will take actions that will lead to lower interest rates.\nSmith and Carter review par, spot, and one-year forward rates (Exhibit 1) and four fixed-rate investment-grade bonds issued by Alpha Corporation that are being considered for investment (Exhibit 2).\nExhibit 1\nPar, Spot, and One-Year Forward Rates (annual coupon payments)\nMaturity (Years)\tPar Rate (%)\tSpot Rate (%)\tOne-Year Forward (%)\n1\t1.0000\t1.0000\t1.0000\n2\t1.2000\t1.2012\t1.4028\n3\t1.2500\t1.2515\t1.3522\nExhibit 2\nSelected Fixed-Rate Bonds of Alpha Corporation\nBond\tAnnual Coupon\tType of Bond\nBond 1\t1.5500%\tStraight bond\nBond 2\t1.5500%\tConvertible bond: currently trading out of the money\nBond 3\t1.5500%\tPutable bond: putable at par one year and two years from now\nBond 4\t1.5500%\tCallable bond: callable at par without any protection periods\nNote: All bonds in Exhibit 2 have remaining maturities of exactly three years.\nCarter tells Smith that the local news media have been reporting that housing starts, exports, and demand for consumer credit are all relatively strong, even in light of other poor macroeconomic indicators. Smith explains that the divergence in economic data leads him to believe that volatility in interest rates will increase. Smith also states that he recently read a report issued by Brown and Company forecasting that the yield curve could invert within the next six months.\nSmith develops a binomial interest rate tree with a 15% interest rate volatility assumption to assess the value of Alpha Corporation’s bonds. Exhibit 3 presents the interest rate tree.\nExhibit 3\nBinomial Interest Rate Tree for Alpha Corporation with 15% Interest Rate Volatility\nYear 0\tYear 1\tYear 2\n1.0000%\t1.6121%\t1.7862%\n\t1.1943%\t1.3233%\n\t\t0.9803%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nCarter asks Smith about the possibility of analyzing bonds that have lower credit ratings than the investment-grade Alpha bonds. Smith discusses four other corporate bonds with Carter. Exhibit 4 presents selected data on the four bonds.\nExhibit 4\nSelected Information on Fixed-Rate Bonds for Beta, Gamma, Delta, and Rho Corporations\nBond\tIssuer\tBond Features\tCredit Rating\nBond 5\tBeta Corporation\tCoupon 1.70%; callable in Year 2; OAS of 45 bps\tB\nBond 6\tGamma Corporation\tCoupon 1.70%; callable in Year 2; OAS of 65 bps\tB\nBond 7\tDelta Corporation\tCoupon 1.70%; callable in Year 2; OAS of 85 bps\tB\nBond 8\tRho Corporation\tCoupon 1.70%; callable in Year 2; OAS of 105 bps\tCCC\nNotes: All bonds have remaining maturities of three years. OAS stands for option-adjusted spread.", "Rayes Investment Advisers specializes in fixed-income portfolio management. Meg Rayes, the owner of the firm, would like to add bonds with embedded options to the firm’s bond portfolio. Rayes has asked Mingfang Hsu, one of the firm’s analysts, to assist her in selecting and analyzing bonds for possible inclusion in the firm’s bond portfolio.\nHsu first selects two corporate bonds that are callable at par and have the same characteristics in terms of maturity, credit quality, and call dates. Hsu uses the option adjusted spread (OAS) approach to analyze the bonds, assuming an interest rate volatility of 10%. The results of his analysis are presented in Exhibit 1.\nExhibit 1\nSummary Results of Hsu’s Analysis Using the OAS Approach\nBond\tOAS (in bps)\nBond #1\t25.5\nBond #2\t30.3\nHsu then selects the four bonds issued by RW, Inc., given in Exhibit 2. These bonds all have a maturity of three years and the same credit rating. Bonds #4 and #5 are identical to Bond #3, an option-free bond, except that they each include an embedded option.\nExhibit 2\nBonds Issued by RW, Inc.\nBond\tCoupon\tSpecial Provision\nBond #3\t4.00% annual\t—\nBond #4\t4.00% annual\tCallable at par at the end of years 1 and 2\nBond #5\t4.00% annual\tPutable at par at the end of years 1 and 2\nBond #6\tOne-year reference rate annually, set in arrears\t—\nTo value and analyze RW’s bonds, Hsu uses an estimated interest rate volatility of 15% and constructs the binomial interest rate tree provided in Exhibit 3.\nExhibit 3\nBinomial Interest Rate Tree Used to Value RW’s Bonds\nYear 0\tYear 1\tYear 2\n2.5000%\t4.6343%\t5.3340%\n\t3.4331%\t3.9515%\n\t\t2.9274%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nRayes asks Hsu to determine the sensitivity of Bond #4’s price to a 20 bps parallel shift of the benchmark yield curve. The results of Hsu’s calculations are shown in Exhibit 4.\nExhibit 4\nSummary Results of Hsu’s Analysis about the Sensitivity of Bond #4’s Price to a Parallel Shift of the Benchmark Yield Curve\nMagnitude of the parallel shift in the benchmark yield curve\t+20 bps\t–20 bps\nFull price of Bond #4 (% of par)\t100.478\t101.238\nHsu also selects the two floating-rate bonds issued by Varlep, plc, given in Exhibit 5. These bonds have a maturity of three years and the same credit rating.\nExhibit 5\nFloating-Rate Bonds Issued by Varlep, plc\nBond\tCoupon\nBond #7\tOne-year reference rate annually, set in arrears, capped at 5.00%\nBond #8\tOne-year reference rate annually, set in arrears, floored at 3.50%\nTo value Varlep’s bonds, Hsu constructs the binomial interest rate tree provided in Exhibit 6.\nExhibit 6\nBinomial Interest Rate Tree Used to Value Varlep’s Bonds\n[Exhibit 6 tree not reproduced – not needed for the questions in this quiz.]\nLast, Hsu selects the two bonds issued by Whorton, Inc., given in Exhibit 7. These bonds are close to their maturity date and are identical, except that Bond #9 includes a conversion option. Whorton’s common stock is currently trading at $30 per share.\nExhibit 7\nBonds Issued by Whorton, Inc.\nBond\tType of Bond\nBond #9\tConvertible bond with a conversion price of $50\nBond #10\tIdentical to Bond #9 except that it does not include a conversion option", "Jules Bianchi is a bond analyst for Maneval Investments, Inc. Bianchi gathers data on three corporate bonds, as shown in Exhibit 1.\nExhibit 1\nSelected Bond Data\nIssuer\tCoupon Rate\tPrice\tBond Description\nAyrault, Inc. (AI)\t5.25%\t100.200\tCallable at par in one year and two years from today\nBlum, Inc. (BI)\t5.25%\t101.300\tOption-free\nCresson Enterprises (CE)\t5.25%\t102.100\tPutable at par in one year from today\nNote: Each bond has a remaining maturity of three years, annual coupon payments, and a credit rating of BBB.\nTo assess the interest rate risk of the three bonds, Bianchi constructs two binomial interest rate trees based on a 10% interest rate volatility assumption and a current one-year rate of 4%. Panel A of Exhibit 2 provides an interest rate tree assuming the benchmark yield curve shifts down by 30 bps, and Panel B provides an interest rate tree assuming the benchmark yield curve shifts up by 30 bps. Bianchi determines that the AI bond is currently trading at an option-adjusted spread (OAS) of 13.95 bps relative to the benchmark yield curve.\nExhibit 2\nBinomial Interest Rate Trees\nInterest Rates Shift Down by 30 bps\nYear 0\tYear 1\tYear 2\n3.7000%\t5.1968%\t7.0037%\n\t4.2548%\t5.7342%\n\t\t4.6947%\nInterest Rates Shift Up by 30 bps\nYear 0\tYear 1\tYear 2\n4.3000%\t5.8605%\t7.7432%\n\t4.7982%\t6.3396%\n\t\t5.1904%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nArmand Gillette, a convertible bond analyst, stops by Bianchi’s office to discuss two convertible bonds. One is issued by DeLille Enterprises (DE), and the other is issued by Raffarin Incorporated (RI). Selected data for the two bonds are presented in Exhibit 3 and Exhibit 4.\nExhibit 3\nSelected Data for DE Convertible Bond\nIssue price\t€1,000 at par\nConversion period\t13 September 20X5 to 12 September 20X8\nInitial conversion price\t€10.00 per share\nThreshold dividend\t€0.50 per share\nChange of control conversion price\t€8.00 per share\nCommon stock share price on issue date\t€8.70\nShare price on 17 September 20X5\t€9.10\nConvertible bond price on 17 September 20X5\t€1,123\nExhibit 4\nSelected Data for RI Convertible Bond\nStraight bond value\t€978\nValue of embedded issuer call option\t€43\nValue of embedded investor put option\t€26\nValue of embedded call option on issuer’s stock\t€147\nConversion price\t€12.50\nCurrent common stock share price\t€11.75\nGillette makes the following comments to Bianchi:\n• “The DE bond does not contain any call or put options, but the RI bond contains both an embedded call option and put option. I expect that DeLille Enterprises will soon announce a common stock dividend of €0.70 per share.”\n• “My belief is that, over the next year, Raffarin’s share price will appreciate toward the conversion price but not exceed it.”", "The Busan Fund, based in South Korea, invests in Asian corporate bonds, including convertible bonds.\nOne of the convertible bonds in the fund was issued on 15 June 2015 by Soyang, Ltd., an electronics manufacturer, when Soyang’s common stock was selling for KRW3,245 per share. Each bond has a par value of KRW1,000,000. The initial conversion price was KRW4,500. The bonds have a threshold dividend of KRW300 and a change of control conversion price of KRW3,500.\nAt the end of trading on 2 September 2015, the market conversion price for Soyang bonds was KRW5,025 and its common shares closed at KRW2,985. The next day, Soyang, which had never previously paid a dividend to common shareholders, paid a dividend of KRW400 per share.\nKang Dae Rhie, the portfolio manager of the Busan Fund, is making a presentation to potential investors regarding the portfolio’s holdings of convertible bonds. He explains that convertible bonds benefit investors in two ways. The first benefit is they generally provide higher coupon rates for investors than similarly rated option-free bonds. The second benefit is they generally increase in value if the issuer’s common stock price increases.\nLater, during his presentation, Rhie is asked to compare the valuation of convertible bonds with that of callable bonds. He responds with three statements:\nStatement 1:\nConvertible bonds are similar to callable bonds in that their value is equal to the value of an otherwise identical option-free bond minus the value of an embedded option.\nStatement 2:\nFor both callable and convertible bonds, a tree can be used for valuation; but the tree used to value a convertible bond models changes in the issuer’s common stock price whereas the tree used to value a callable bond models changes in the level of market interest rates.\nStatement 3:\nConvertible bonds are more difficult to value than callable bonds because the analyst must consider the impact of all of the economic conditions that affect the value of the callable bond plus additional conditions that affect the value of the issuer's common stock.", "Diane Muniz is the fixed-income trading strategist at Greentown Capital Management, an investment firm based in Miami, Florida. Muniz is running a training session for three recently hired junior analysts, Amanda Morgan, David Scahill, and Hamza Gomaa.\nMuniz welcomes Morgan, Scahill, and Gomaa to the firm and states that at today’s session they will be discussing bonds with embedded options. She asks the group, “Can any of you list a few general characteristics of bonds with embedded options?” Morgan responds with the following statements:\n• Statement 1: “Depending on the type of bond, the embedded option can be exercised by either the bondholder or the bond issuer to exploit interest rate movements.”\n• Statement 2: “However, both types of options—bondholder and bond issuer options—cannot be embedded in the same bond.”\n• Statement 3: “The embedded options cannot be traded independently of the bond.”\nMuniz moves on to a discussion of the valuation of risky bonds with embedded options and asks if there is a metric that can be used to determine relative value and how such a measure is calculated. In response Scahill states: “The option-adjusted spread, or OAS, can be used to determine the value of a risky bond with embedded options. When assessing relative value for two bonds that are otherwise similar in all respects, the bond with the lower OAS is most likely underpriced or cheap.” Morgan adds: “The OAS is a variable spread that is based on the likelihood of cash flows occurring.” Gomaa disagrees with Scahill and Morgan, stating: “I believe OAS is the constant spread that when added to all one-period forward rates on the interest rate tree, equates the present value of the bond’s cash flows to the market price. Furthermore, for two bonds that have similar characteristics and credit quality, the bond with the higher OAS is underpriced.”\nScahill then asks, “While we are on the topic of OAS, a question that comes to mind is how the interest rate volatility assumption impacts the OAS of callable and putable bonds.” Morgan responds, “It is my understanding that as interest rate volatility declines, the OAS for callable bonds decreases while the OAS for putable bonds increases.”\nIn order to initiate discussion on the interest rate risk of bonds with embedded options, Muniz asks the group to use the information presented in Exhibit 1 to calculate the effective duration of a 5% annual coupon bond with 2 years remaining to maturity and callable in 1 year. The current price of this bond is $100.50, and the face value is $100.00\nExhibit 1 Bond Price Information\nShift in Yield\tBond Price\n+10 basis points\t$100.32\n–10 basis point\t$100.64\nMuniz states that effective duration indicates the sensitivity of a bond’s price to interest rate changes and is a measure of interest rate risk. She notes: “When interest rates rise and are high relative to the bond’s coupon rate, the effective duration of a callable bond falls and is lower than the effective duration of an otherwise similar straight bond. On the other hand, for the same interest rate scenario, the effective duration of a putable bond will be similar to the effective duration of a comparable straight bond.”\nMuniz wraps up the training session by posing the following question: “If you expect a steepening of the yield curve, what duration measure provides the best indication of the interest rate risk for a callable bond?” The group is asked to submit answers to Muniz the following day.", "High Hill Capital Advisers (HHCA) is an investment management firm serving high-net-worth and institutional clients. Harry Allardyce is senior portfolio manager for fixed-income strategies. He is meeting with co-portfolio managers Emma Lee and Sarah Jarvis to evaluate securities for possible inclusion in client portfolios. Information on the bonds under review is provided in Exhibit 1.\nExhibit 1 Bond Information\nBond\tPar\tCoupon\tMaturity\tSpecial Provisions\nA\t$100\t5.50%\tThree years\tCallable in Month 12 and Month 24 at par\nB\t$100\t4.75%\tThree years\tPutable in Month 12 and Month 24 at par\nAllardyce states, “Note that interest rate volatility and the term structure of interest rates may also affect the value of Bonds A and B. Our economists indicate that there are two possible scenarios that may play out in the near term:\n• Scenario 1: Interest rate volatility declines, and the yield curve remains flat.\n• Scenario 2: Interest rate volatility remains at current levels, and the yield curve flattens further, with rates in the zero- to one-year maturity rising and rates in the two-year maturity and above declining.”\nAllardyce indicates that he would like the team’s opinion on the behavior of both bonds under the alternate volatility and interest rate scenarios.\nThe discussion continues on to bonds with embedded options, and Allardyce asks Lee and Jarvis to identify different valuation approaches. Jarvis responds, “There are two possible approaches. One approach would be to use a binomial interest rate tree (such as the one provided in Exhibit 2) and then use a process of backward induction to determine the value of the bond. This value is compared with the current market price to identify whether the bond is overpriced or underpriced.”\nExhibit 2 Binomial Interest Rate Tree (15% volatility assumed)\nToday\tYear 1\tYear 2\n2.5000%\t4.5160%\t6.3120%\n\t3.3456%\t4.6760%\n\t\t3.4641%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\n“The second valuation approach,” Jarvis continues, “uses the option-adjusted spread (OAS), a measure of relative value. In this instance, if the bond’s OAS is greater than the OAS of bonds with similar characteristics and credit quality, then it is most likely underpriced. One factor to consider is that if interest rate volatility declines, then the OAS and thus relative cheapness of Bond A will increase.”", "Stellwagen Investment Partners is an institutional investment manager located in Boston that offers advice on both equity and fixed-income strategies. Stellwagen manages a number of separate accounts for large institutional investors and also serves as a subadviser for mutual funds.\nThomas Harding, a fixed-income portfolio manager at Stellwagen, is a member of the firm’s investment committee. Harding is responsible for management of the firm’s short-and intermediate-duration credit strategies. When making investment decisions, he often relies on input from Stellwagen’s team of 15 credit analysts. Sarah Hamilton is a credit analyst at Stellwagen and covers the technology and telecommunication sectors.\nHamilton is analyzing three bonds being considered for investment by Harding: CommCo, which is currently callable at par; StorageTech, which is currently putable at par; and NexTec, which has a make-whole call provision. All three bonds have a five-year maturity, are of equivalent credit quality, and pay the same coupon (3.5%). Harding believes that interest rates will increase more rapidly than currently implied by the market.\nHarding asks Hamilton what the impact of increased interest rate volatility and changes to the shape of the yield curve would have on the value of these bonds. She states that all else being equal,\n• Comment 1: increased interest rate volatility decreases the value of the CommCo bond,\n• Comment 2: the value of NexTec’s make-whole call provision increases as the yield curve flattens,\n• Comment 3: and the value of StorageTech’s option will be more valuable with a downward-sloping yield curve than with a flat yield curve.\nHamilton has been working on interest rate scenarios to model how bond prices would change given a 40 bp (basis point) upward or downward shift in the yield curve. Her work is shown in Exhibit 1.\nExhibit 1 Bond Sensitivity Analysis to 40 bp Interest Rate Shifts\n \tCommCo\tStorageTech\tNexTec\nCurrent price\t99.70\t100.35\t100.05\nPrice rates up 40 bps\t98.20\t100.00\t98.40\nPrice rates down 40 bps\t100.00\t101.85\t101.70\nTo prepare for rising rates, Harding asks Hamilton to evaluate floating-rate bond issues. She reviews a two-year floater issued by NexTec and creates a two-year binomial interest rate tree for valuation purposes, as shown in Exhibit 2. The bond pays annual coupons based in the one-year MRR. The MRR swap curve is the same as the par yield curve: 2.5% at one year and 3.0% at two years.\nExhibit 2\nYear 0\tYear 1\tYear 2\n2.5000%\t3.8695%\t5.5258%\n\t3.1681%\t4.5242%\n\t\t3.7041%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nHarding subadvises a core-plus bond fund that allows for up to 5% of assets to be invested in convertible debt. Hamilton has read research from Stellwagen’s equity team that has identified StorageTech equity as a top idea, with a price target of $120 per share. The stock does not pay a dividend and is trading for $90.00 per share on 2 April 2017. Harding asks Hamilton to provide him with the current conversion price, conversion value, and market conversion premium per share based on data in Exhibit 3.\nExhibit 3 StorageTech Convertible Bond Data\nIssue Date\t1 April 2015\nMaturity\t1 April 2020\nIssue Par Price\t$1,000.00\nStock Price at Issue\t$80.00\nInitial Conversion Premium\t20.0%\nConvertible Price 2 April 2017\t$1,050.00\nAnnual Coupon\t2.5%\nBased on this information, Hamilton calculates the conversion value to be $937.50 and the market conversion premium per share to be $10.80 per share.", "Joao Pereira is a fixed-income specialist at Tocantins Consultores, an investment advisory firm located in São Paulo, Brazil. Paraná Fundação Educacional, one of Tocantins’s clients, is looking for ways to add equity exposure to its fixed-income portfolio given that he expects an equity market rally. Pereira has recommended investments in convertible bonds. He is meeting with Adriana Silva, chief investment officer for Paraná, to discuss the recommendation.\nAt the meeting, Silva asks Pereira, “I understand convertible bonds are complex securities with multiple features. I am concerned about corporate actions an issuer might take that would negatively affect the value of any convertible bonds outstanding. Can you describe some of these actions, their potential impact, and how, if at all, that impact is mitigated by typical bond covenants?”\nPereira responds, “Let me review three potential corporate actions.”\nAction 1:\nThe issuer could be acquired by another firm; possibly one that is unattractive to the investor. Covenants typically allow investors to put the bond back to the issuer, convert at a lower “change of control” conversion price, or both.\nAction 2:\nThe issuer could split the stock or declare a large cash or stock dividend. This likely would reduce the price per share and, therefore, reduce the value of the convertible bond. Convertible bonds adjust the conversion price for stock splits or stock dividends and any cash dividends.\nAction 3:\nConvertible bonds often contain an embedded call option feature allowing the issuer to repurchase the bond. An issuer will call the bond only when it can replace it with one that has a lower interest rate — either because market interest rates have dropped or because the issuer’s credit rating has improved. It might also call the bond to use excess cash to retire debt.\nSilva asks Pereira for investment recommendations. Pereira responds by describing a 10-year bond issued three years ago by Juruá Automotivo (JA). The bond has a par value of BRL R$100,000 and annual interest payments based on an 8.0% coupon rate. It became convertible one month after issue and remains convertible until one month before maturity. At issuance, JA’s share price was BRL R$41.50 and its conversion price was BRL R$50.00. It will become callable on the interest payment date at 106% of par in years 5 and 6, 104% of par in years 7 and 8, and 102% of par in year 9.\nThe bond’s third interest payment was just paid. It is trading at BRL R$127,000, its current conversion price is BRL R$25.00, and JA’s share price is BRL R$30.20. Market interest rates have not changed substantially since the bond was issued, and JA’s credit rating remains unchanged since the bond was issued.\nSilva tells Pereira, “The many types of embedded options found in different convertible bonds makes their valuation difficult. Despite that, it is my understanding that the most common approach to valuation in practice involves using the current yield curve with a set of assumptions of future interest rate volatility to build a binomial interest rate tree. The cash flows are determined for each node of the tree, based on whether any of the embedded options are expected to be exercised. The resulting cash flows are valued on the tree using the same process as for an option-free bond. Conceptually, this means the value of the convertible is equal to the value of the option-free bond minus the value of any embedded options that can be exercised by the investor plus the value of any embedded options that can be exercised by the issuer.”", "Lena Liecken is a senior bond analyst at Taurus Investment Management. Kristel Kreming, a junior analyst, works for Liecken in helping conduct fixed-income research for the firm’s portfolio managers. Liecken and Kreming meet to discuss several bond positions held in the firm’s portfolios.\nBonds I and II both have a maturity of one year, an annual coupon rate of 5%, and a market price equal to par value. The risk-free rate is 3%. Historical default experiences of bonds comparable to Bonds I and II are presented in Exhibit 1.\nExhibit 1\nCredit Risk Information for Comparable Bonds\nBond\tRecovery Rate\tPercentage of Bonds That Survive and Make Full Payment\nI\t40%\t98%\nII\t35%\t99%\nBond III is a zero-coupon bond with three years to maturity. Liecken evaluates similar bonds and estimates a recovery rate of 38% and a risk-neutral default probability of 2%, assuming conditional probabilities of default. Kreming creates Exhibit 2 to compute Bond III’s credit valuation adjustment. She assumes a flat yield curve at 3%, with exposure, recovery, and loss given default values expressed per 100 of par value.\nExhibit 2\nAnalysis of Bond III\nDate\tExposure\tRecovery\tLoss Given Default\tProbability of Default\tProbability of Survival\tExpected Loss\tPresent Value of Expected Loss\n0\t\t\t\t\t\t\t\n1\t94.2596\t35.8186\t58.4410\t2.0000%\t98.0000%\t1.1688\t1.1348\n2\t97.0874\t36.8932\t60.1942\t1.9600%\t96.0400%\t1.1798\t1.1121\n3\t100.0000\t38.0000\t62.0000\t1.9208%\t94.1192%\t1.1909\t1.0898\nSum\t\t\t\t5.8808%\t\t3.5395\t3.3367\nBond IV is an AA rated bond that matures in five years, has a coupon rate of 6%, and a modified duration of 4.2. Liecken is concerned about whether this bond will be downgraded to an A rating, but she does not expect the bond to default during the next year. Kreming constructs a partial transition matrix, which is presented in Exhibit 3, and suggests using a model to predict the rating change of Bond IV using leverage ratios, return on assets, and macroeconomic variables.\nExhibit 3\nPartial One-Year Corporate Transition Matrix (entries in %)\nFrom/To\tAAA\tAA\tA\nAAA\t92.00\t6.00\t1.00\nAA\t2.00\t89.00\t8.00\nA\t0.05\t1.00\t85.00\nCredit Spread (%)\t0.50\t1.00\t1.75\nKreming calculates the risk-neutral probabilities, compares them with the actual default probabilities of bonds evaluated over the past 10 years, and observes that the actual and risk-neutral probabilities differ. She makes two observations regarding the comparison of these probabilities:\nObservation 1: Actual default probabilities include the default risk premium associated with the uncertainty in the timing of the possible default loss.\nObservation 2: The observed spread over the yield on a risk-free bond in practice includes liquidity and tax considerations, in addition to credit risk.", "Daniela Ibarra is a senior analyst in the fixed-income department of a large wealth management firm. Marten Koning is a junior analyst in the same department, and David Lok is a member of the credit research team.\nThe firm invests in a variety of bonds. Ibarra is presently analyzing a set of bonds with some similar characteristics, such as four years until maturity and a par value of €1,000. Exhibit 1 includes details of these bonds.\nExhibit 1\nA Brief Description of the Bonds Being Analyzed\nBond\tDescription\nB1\tA zero-coupon, four-year corporate bond with a par value of €1,000. The wealth management firm’s research team has estimated that the risk-neutral probability of default for each date for the bond is 1.50%, and the recovery rate is 30%.\nB2\tA bond similar to B1, except that it has a fixed annual coupon rate of 6% paid annually.\nB3\tA bond similar to B2 but rated AA.\nB4\tA bond similar to B2 but the coupon rate is the one-year benchmark rate plus 4%.\nIbarra asks Koning to assist her with analyzing the bonds. She wants him to perform the analysis with the assumptions that there is no interest rate volatility and that the government bond yield curve is flat at 3%.\nIbarra performs the analysis assuming an upward-sloping yield curve and volatile interest rates. Exhibit 2 provides the data on annual payment benchmark government bonds.\nShe uses these data to construct a binomial interest rate tree, shown in Exhibit 3, based on an assumption of future interest rate volatility of 20%.\nExhibit 2\nPar Curve for Annual Payment Benchmark Government Bonds\nMaturity\tCoupon Rate\tPrice\tDiscount Factor\tSpot Rate\tForward Rate\n1\t–0.25%\t€100\t1.002506\t–0.2500%\t\n2\t0.75%\t€100\t0.985093\t0.7538%\t1.7677%\n3\t1.50%\t€100\t0.955848\t1.5166%\t3.0596%\n4\t2.25%\t€100\t0.913225\t2.2953%\t4.6674%\nExhibit 3\nInterest Rate Tree\nDate 0\tDate 1\tDate 2\tDate 3\n−0.2500%\t2.1180%\t4.3999%\t8.0804%\n\t1.4197%\t2.9493%\t5.4164%\n\t\t1.9770%\t3.6307%\n\t\t\t2.4338%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nAnswer the first five questions (9-13) based on the assumptions made by Marten Koning, the junior analyst.\nNote: All calculations in this problem set are carried out on spreadsheets to preserve precision. The rounded results are reported in the solutions.", "Henry Cromwell is the director of quantitative research at Blackfriars Asset Advisers, a fixed-income firm located in London. Rebecca Thames recently joined Cromwell’s analyst team supporting credit analysis and credit risk modeling. After a brief orientation on the firm and its investment process, Cromwell instructs Thames to develop a model that derives the credit valuation adjustment (CVA). Cromwell makes the following comments regarding credit modeling.\n• Comment 1: The factors to consider in modeling credit risk are the expected exposure to default loss, the risk-neutral probability of default, and the loss given default.\n• Comment 2: The use of an actual default rate in the model may overstate the observed value for a corporate bond because it includes a default risk premium associated with uncertainty over the timing of possible default loss.\n• Comment 3: The observed credit spread may also be higher than required for credit risk to compensate for a liquidity premium and tax considerations.\nThames reminds Cromwell that her model assumes zero interest rate volatility and a flat government yield curve. Cromwell responds that Thames should relax these unrealistic assumptions. Thames outlines the steps to take in valuing risky bonds under this scenario in Exhibit 1.\nExhibit 1 Steps in Valuing Risky Bonds, Arbitrage-Free Framework\nStep 1\n• Build the binomial interest rate tree under the assumption of no arbitrage.\n• Apply an assumption of interest rate volatility.\n• Using the spot curve, derive implied zero-coupon rates, discount factors, and forward rates.\nStep 2\n• Use the risk-neutral probability of default as determined by a credit model.\n• Assign a recovery rate based on the company’s credit rating.\n• Calculate the present value of the product of the loss given default and the probability of default.\nStep 3\n• Determine the value for the corporate bond assuming no default (VND).\n• Calculate the CVA.\n• Calculate the fair value of the bond as the VND minus the CVA.\nCromwell works with another analyst, George Hastings, to discuss credit scoring and credit rating models. Hastings starts the conversation by saying, “Credit scoring models are primarily applied to consumers or small business borrowers. In some cases, only negative information, such as delinquencies or defaults, are used, while other models use a mix of factors, such as payment history and recent credit searches.” The focus of credit scores is the probability of default. Hastings continues, “Credit ratings, on the other hand, are used in the corporate and sovereign bond market and also for asset-backed securities. Ratings are focused on probability of default. Credit rating agencies, such as Standard & Poor’s, consider the loss given default by means of notching, which adjusts the issuer rating to reflect the priority of claims in the capital structure.”\nCromwell explains that the migration of a company’s ratings can have an impact on the total return of a bond holding. As an example, he selects a 10-year maturity, 5% coupon bond currently trading at par and rated A+ by Standard & Poor’s. He asks Thames to calculate the expected total return over a one-year horizon assuming the bond is downgraded by two notches and to determine why the year-end duration for the bond is 6.9. The average G-spread for corporate bonds across the credit spectrum is shown in Exhibit 2.\nExhibit 2 Bond Market G-Spread by Credit Rating\nS&P Rating\tG-Spread\tS&P Rating\tG-Spread\nAAA\t0.30\tA\t1.00\nAA+\t0.45\tA–\t1.10\nAA\t0.60\tBBB+\t1.30\nAA–\t0.70\tBBB\t1.45\nA+\t0.85\tBBB–\t1.60\nCromwell and Thames get into a discussion on structural and reduced-form models of credit risk. Cromwell is a proponent of these models and tells Thames, “Structural models are dependent on the structure of the company’s balance sheet. Equity is analogous to a purchased call option on the assets of the company whereby the strike price equals the face value of the debt. Strengths of these models are that they aim to explain why default occurs and are dependent on readily available public information, such as the market value of the company’s assets. Weaknesses are that the models can be burdensome to implement and measuring the default barrier can be challenging.”\nThames responds with her view of credit models for corporate credit risk, saying “Reduced-form models have less restrictive assumptions than structural models. The default intensity is estimated using regression analysis on company-specific and macroeconomic variables. Strengths of these models are that they directly reflect the business cycle in the credit risk measure and its inputs are observable variables. Weaknesses of the model are that they do not explain the reason for default and they assume that default occurs at a defined point in time.”", "Ursula Suess is a senior portfolio manager at Emblem Multi-Asset Capital, a fixed income manager. Junior analyst, Cyrus Wong, has been analyzing two groups of securities; corporate bonds and asset backed securities. He discusses his processes and observations with Suess.\nWong states: “When analyzing corporate bonds, I use a model that helps me calculate the present value of the credit risk. My model includes the following factors:\n• Factor 1: The projected amount of possible default loss before recovery\n• Factor 2: An assumed loss severity\nSuess explains: “We purchased the BBB rated Echo Financial five-year bond, which currently has a modified duration of 4.3, and a yield to maturity of 5.40%.”\nWong comments: “I recently analyzed the bond using the data in Exhibit 1 containing a one-year transition matrix and spread data, and calculated it has an expected return of 1.41% over the next year.\"\nExhibit 1\nFrom/To\tAAA\tAA\tA\tBBB\tBB\tB\tCCC & Below\nBBB\t.05\t.75\t4.75\t84.50\t6.00\t3.00\t.95\nCredit Spread\t.70\t.90\t1.00\t1.50\t3.50\t6.70\t10.00\nSix months after the Echo Financial bond purchase, it is downgraded to BB. Wong examines the market reaction and states:\n“Following the downgrade, the actual credit spread observed in the market is smaller than that predicted in my model.\"\nSuess observes: “I see that the credit spreads on the near-term Echo Financial bonds rose significantly above credit spreads on the longer term bonds. This tells us valuable information regarding market expectations.”\nSuess comments: “Credit analysis for corporate debt is different than that for asset-backed securities. I understand this pool of automobile loans is the first securitized bond issue you have evaluated for us and I would like to understand some of your conclusions.”\nWong replies: \"The originator of the auto ABS supplied us with the FICO credit score distribution of the large number of individual borrowers in the pool. This underlying assets are considered to be both granular and homogenous. The originator sold the loans into a special purpose entity, which typically leads to higher financing costs compared to the direct obligation financings of the originator. However, investors seeking greater diversification, with more stable underlying cash flows, are attracted to these types of securities.\"", "Benjamin Wong is a quantitative analyst modeling the credit risk of a fixed-income fund (the Fund) to support portfolio management. James Cage, the portfolio manager, asks Wong to calculate certain metrics on the Fund's positions to measure the credit risk of the Fund. Wong analyzes the following fixed-income instruments held by the Fund.\nBond 1 is an A rated corporate bond maturing in 4 years, with details presented in Exhibit 1 below:\nExhibit 1\nPar value\t$1,000\nCoupon rate\t2.00%\nGovernment bond yield\t1.00%\nRisk-neutral probability of default\t1.20%\nRecovery rate\t40%\nWong calculates the Credit Valuation Adjustment and the credit spread of Bond 1 as requested by Cage.\nPer Cage's request, Wong calculates the credit spread of Bond 2, a BBB rated zero-coupon bond maturing in 5 years, in order to compare its valuation relative to other zero-coupon bonds with similar credit rating and maturity. Bond 2's details presented in Exhibit 2 below:\nExhibit 2\nPar value\t$1,000.00\nMarket value\t$923.70\nValue assuming no default\t$953.82\nCredit valuation adjustment\t$67.81\nWhile reviewing the Fund's investment grade portfolio, Wong examines Bond 3, an AAA rated bond.\nBond 3 matures in 5 years with a modified duration of 4, and a yield to maturity of 1.50%. Assuming no default and the market spreads and yield will remain stable over the year. Wong compiles the data in Exhibit 3 which comprises a partial credit transition matrix and credit spreads for different rating categories, in order to assess the expected return of the bond over the next year:\nExhibit 3\n \tAAA\tAA\tA\tBBB\tBB\tB\tCCC or below\nProbability (%)\t90.00\t9.00\t0.60\t0.15\t0.10\t0.10\t0.05\nCredit spread (%)\t0.60\t0.90\t1.10\t1.50\t3.40\t6.50\t9.50\nWong analyzes the ABS positions held by the fund, and considers the appropriate credit analysis approach for ABS 1. ABS 1's underlying collateral pool comprises medium-term automobile loans which are considered both granular and homogenous.", "Tom River is a global credit portfolio manager at Monmouth Asset Advisors, a fixed-income firm located in New Jersey. Each Monday, River reviews the firm’s weekly strategy update, prepared by Reed Bank, which is used as an input in positioning credit portfolios that reflect the firm’s evolving market views. In this week’s strategy report, Bank states the following: “Markets are experiencing a heightened level of volatility across both the Treasury curve and credit spreads. Employment trends, however, have been strong thus far, with low unemployment and higher-than-expected wage growth. In addition, the recent rise in oil demand and other commodities is beginning to impact input prices for manufacturers. The credit rating agencies are reassessing economic conditions and as a result are changing credit outlooks and credit watches to negative. We are seeing bond dealers shrink their balance sheets.”\nRiver asks his analyst, Sandy Manasquan, to collect data and estimate the expected price return over one year for the BBB-rated bonds in his portfolio. The bonds would have a modified duration at the end of the year of 6.5, and they have an average weighted coupon of 2.50%. Manasquan compiles the data shown in Exhibit 1 for his analysis, which comprises the migration probabilities from BBB and the spread level for each rating category.\nExhibit 1 One-Year Transition Matrix (%) and Credit Spreads\n \tAAA\tAA\tA\tBBB\tBB\nMigration (%)\t0.03\t0.27\t4.6\t86\t9.1\nCredit Spread (bps)\t50\t75\t120\t160\t280\nRiver considers buying a 1.75% annual payment corporate bond in which dealers are quoting a market price (bid/ask) of $101.15/$101.65. He asks Manasquan to complete the data in Exhibit 3 and use the data from Exhibits 2 and 3 to provide him with a fair value price for the bond. The bond is assumed to have a 1% probability of default and a 40% recovery rate.\nExhibit 2 Value of a 1.75% Annual Payment Corporate Bond Assuming No Default (VND)\n[Exhibit 2 tree not reproduced – not needed for the questions in this quiz.]\nExhibit 3 Credit Valuation Adjustment (CVA) for the 1.75% Annual Payment Corporate Bond\nDate\tExpected Exposure\tLGD\tPOD\tDiscount Factor\tCVA per Year\n0\t---\t---\t---\t---\t---\n1\t?\t?\t?\t1.004016\t?\n2\t100.8859\t60.5316\t0.9900%\t0.990030\t0.5933\n3\t101.7500\t61.1468\t0.9703%\t0.931942\t0.5571\n4\t101.7500\t61.0500\t0.9703%\t0.931942\t0.5521\nRiver asks Bank to collect data for the term structure of credit spreads. Bank plots the data and is surprised to find that some curves are higher than others and that across the term structure, some are upward sloping while others are flat or downward sloping. River provides his interpretation of the graph to Bank and makes the following comments:\nComment 1:\n“Credit quality tends to be a key driver of credit spreads. For high-quality securities, investors do not demand much higher compensation for longer maturities because those companies have less sensitivity to the credit cycle, therefore resulting in only slightly upward sloping curves.\nComment 2:\nThe liquidity of an issuer can influence the curve as even wider bid/ask spreads for certain issuers can impact the curve’s shape. If an issuer currently plans to refinance front end issues with longer maturities, the issuer’s credit curve will flatten.\nComment 3:\nAnother factor in the shape of the curve is that government bonds used in the benchmark curve may not be available for certain maturities, requiring an interpolation between the two closest maturities. An alternative to address this issue is to use a benchmark swap curve based on interbank rates.”", "Brad Belmar is the director of risk management at Neptune Asset Advisors, a fixed-income firm located in New Jersey. Louise Lake, an analyst in his group, models credit risk in the firm’s funds for risk management oversight. Belmar and Lake discuss the process of modeling credit risk, and Belmar makes the following comments:\nComment 1:\n“When modeling credit risk, the expected exposure reflects the amount of money an investor is expected to lose given default, discounted by the risk-free rate.\nComment 2:\nThe credit valuation adjustment for each bond is the present value of expected loss over its term to maturity and reflects the probability of default and recovery rate.\nComment 3:\nAnother modeling factor is the probability of default, which reflects actual historical probabilities of default.”\nBelmar asks Lake to develop a credit rating system for Neptune, independent of the ratings provided by such credit rating agencies as Moody’s, S&P, and Fitch. The key objective is for Neptune’s ratings to transition more rapidly than that of the agencies based on new information flow. Belmar would like the internal methodology to have the same characteristics as the outside agencies. He tells Lake, “These characteristics should include:\n• First, developing ordinal ratings—focusing on the probability of default and representing a lettering system applied to issuers as well as specific bond issues—and an outlook indicating improvement or deterioration in credit quality.\n• Second, the ratings should be notched to incorporate differences in the expected loss given default for specific issues arising from subordination. In this manner, we can adjust the rating downward one or two notches to distinguish between subordinated debt and senior unsecured debt.”\nBelmar also wants the risk monitoring of portfolios to include not only corporate bonds but also securitized debt. He explains to Lake that there are various types of securitized debt and that there are differences in the credit analysis of these securities compared to corporate bonds. He suggests that they segment the analysis depending on the characteristics of the securities. He tells Lake, “We should apply a portfolio-based analytical approach to the existing book of loans in short-term structured finance vehicles with granular, homogeneous assets. For example, in a credit card ABS securitization, we can use the distribution of FICO scores to derive a mean default and recovery rates. On the other hand, we should apply a statistical-based approach to medium-term, granular, and heterogeneous obligations, such as auto ABS. Finally, a loan-by-loan approach is appropriate for discrete or non-granular heterogeneous portfolios, such as CMBS.”\nBelmar wants to develop a quantitative model that would augment the fundamental analysis conducted by the firm’s analysts. He and Lake debate the merits of different models of corporate credit risk.\nBelmar points out to Lake several issues related to these models:\nIssue 1:\n“A structural model is best suited for risk management. At Neptune, we have access to the all the data inputs needed in the model for companies held in the firm’s funds. I like the option approach the model takes, which explains why default occurs. Although we do not know the value of each firm’s assets, we can imply it from market data.\nIssue 2:\nA reduced form model uses company-specific and macroeconomic variables, with all the inputs readily available, and the model explains when default occurs. These models treat default as an endogenous event.\nIssue 3:\nBoth types of models have disadvantages. With structural models, for example, it is difficult to measure the default barrier. For reduced form models, a disadvantage is that they don’t explain the reasons for default, which can be a surprise that does not typically happen in practice.\"", "UNAB Corporation\nOn 1 January 20X2, Deem Advisors purchased a $10 million six-year senior unsecured bond issued by UNAB Corporation. Six months later (1 July 20X2), concerned about the portfolio’s credit exposure to UNAB, Doris Morrison, the chief investment officer at Deem Advisors, buys $10 million protection on UNAB with a standardized coupon rate of 5%. The reference obligation of the CDS is the UNAB bond owned by Deem Advisors. UNAB adheres to the ISDA CDS protocols.\nOn 1 January 20X3, Morrison asks Bill Watt, a derivatives analyst, to assess the current credit quality of UNAB bonds and the value of Deem Advisors’ CDS on UNAB debt. Watt gathers the following information on UNAB’s debt issues currently trading in the market:\nBond 1: A two-year senior unsecured bond trading at 40% of par\nBond 2: A five-year senior unsecured bond trading at 50% of par\nBond 3: A five-year subordinated unsecured bond trading at 20% of par\nWith respect to the credit quality of UNAB, Watt makes the following statement:\n“There is severe near-term stress in the financial markets, and UNAB’s credit curve clearly reflects the difficult environment.”\nOn 1 July 20X3, UNAB fails to make a scheduled interest payment on the outstanding subordinated unsecured obligation after a grace period; however, the company does not file for bankruptcy. Morrison asks Watt to determine if UNAB experienced a credit event and, if so, to recommend a settlement preference.\nKand Corporation\nMorrison is considering purchasing protection on Kand Corporation debt to hedge the portfolio’s position in Kand. She instructs Watt to determine if an upfront payment would be required and, if so, the amount of the premium. Watt presents the information for the CDS in Exhibit 1.\nExhibit 1\nSummary Data for 10-year CDS on Kand Corporation\nCredit spread\t700 bps\nDuration\t7 years\nCoupon rate\t5%\nMorrison purchases 10-year protection on Kand Corporation debt. Two months later the credit spread for Kand Corporation has increased by 200 bps. Morrison asks Watt to close out the firm’s CDS position on Kand Corporation by entering into a new, offsetting contract.\nTollunt Corporation\nDeem Advisors’ chief credit analyst recently reported that Tollunt Corporation’s five-year bond is currently yielding 7% and a comparable CDS contract has a credit spread of 4.25%. Since the current market reference rate is 2.5%, Watt has recommended executing a basis trade to take advantage of the pricing of Tollunt’s bonds and CDS. The basis trade would consist of purchasing both the bond and the CDS contract.", "John Smith, a fixed-income portfolio manager at a €10 billion sovereign wealth fund (the Fund), meets with Sofia Chan, a derivatives strategist with Shire Gate Securities (SGS), to discuss investment opportunities for the Fund. Chan notes that SGS adheres to ISDA (International Swaps and Derivatives Association) protocols for credit default swap (CDS) transactions and that any contract must conform to ISDA specifications. Before the Fund can engage in trading CDS products with SGS, the Fund must satisfy compliance requirements.\nSmith explains to Chan that fixed-income derivatives strategies are being contemplated for both hedging and trading purposes. Given the size and diversified nature of the Fund, Smith asks Chan to recommend a type of CDS that would allow the Fund to simultaneously fully hedge multiple fixed-income exposures.\nSmith and Chan discuss opportunities to add trading profits to the Fund. Smith asks Chan to determine the probability of default associated with a five-year investment-grade bond issued by Orion Industrial. Selected data on the Orion Industrial bond are presented in Exhibit 1.\nExhibit 1\nSelected Data on Orion Industrial Five-Year Bond\nYear\tHazard Rate\n1\t0.22%\n2\t0.35%\n3\t0.50%\n4\t0.65%\n5\t0.80%\nChan explains that a single-name CDS can also be used to add profit to the Fund over time. Chan describes a hypothetical trade in which the Fund sells £6 million of five-year CDS protection on Orion, where the CDS contract has a duration of 3.9 years. Chan assumes that the Fund closes the position six months later, after Orion’s credit spread narrowed from 150 bps to 100 bps.\nChan discusses the mechanics of a long/short trade. In order to structure a number of potential trades, Chan and Smith exchange their respective views on individual companies and global economies. Chan and Smith agree on the following outlooks.\nOutlook 1: The European economy will weaken.\nOutlook 2: The US economy will strengthen relative to that of Canada.\nOutlook 3: The credit quality of electric car manufacturers will improve relative to that of traditional car manufacturers.\nChan believes US macroeconomic data are improving and that the general economy will strengthen in the short term. Chan suggests that a curve trade could be used by the Fund to capitalize on her short-term view of a steepening of the US credit curve.\nAnother short-term trading opportunity that Smith and Chan discuss involves the merger and acquisition market. SGS believes that Delta Corporation may make an unsolicited bid at a premium to the market price for all of the publicly traded shares of Zega, Inc. Zega’s market capitalization and capital structure are comparable to Delta’s; both firms are highly levered. It is anticipated that Delta will issue new equity along with 5- and 10-year senior unsecured debt to fund the acquisition, which will significantly increase its debt ratio.", "Marcos Pereira is a credit analyst with Tundra Partners, a hedge fund manager. Tundra enters into single-name CDS for speculative purposes.  Pereira compiles information about Tundra’s CDS portfolio in Exhibit 1.\nExhibit 1\n \tPosition\tCoupon\tOrigination Credit Spread\tCurrent Credit Spread\nCDS 1\tProtection Buyer\t1.0%\t75 bps\t100 bps\nCDS 2\tProtection Seller\t1.0%\t100 bps\t200 bps\nCDS 3\tProtection Seller\t5.0%\t650 bps\t600 bps\nCDS 4\tProtection Seller\t5.0%\t450 bps\tIn default\nCDS 1 and 2 relate to the same reference entity, and were entered into by Tundra on the same date. CDS 1 and 2 have a remaining time to maturity of 2 and 5 years respectively.\nExhibit 2\n \tMaturity\tTrading Price\nSenior unsecured bond\t3 years\t30% of par\nSenior unsecured bond\t5 years\t35% of par\nSubordinated unsecured bond\t8 years\t20% of par\nPereira also whether Tundra should invest in CDS 5. He calculates that CDS 5’s reference entity has a hazard rate of 1.35% and 2.35% in each of the next 2 years.\nPereira notices that the market expects a local company to be the target of a leveraged buyout (LBO), whereby it will issue large amounts of debt and use the proceeds to repurchase its publicly traded equity. As a result, the credit spread of the company's senior unsecured bonds with 5 years until maturity has increased to 450 bps. A comparable 5-year CDS currently trades at a spread of 400 bps. Pereira believes that credit spreads in both markets should soon converge.", "FIQ Bank is a highly rated corporate and institutional bank that operates a client-facing credit default swap (CDS) desk. Larry Eckle is a CDS client strategist. Mark Priore is FIQ’s chief CDS trader. Eckle and Priore are meeting with Brian Bregen, a portfolio manager for BLB Fund, to discuss investment and trading strategies for bonds, CDSs, and equities.\nBregen begins the discussion by asking for a refresher on basic CDS concepts and parameters. Eckle replies that a CDS includes both a premium leg and a payment leg and that expected loss is among the functions that affect its price. Eckle provides information for a bond issued by Apollo Company.\nExhibit 1 Information for Apollo Bond\nAmount\t$1,000.00\nCoupon\t5.00%\nMaturity\t3 years\nProbability of Default\tYear 1: 2.0%. Year 2: 2.5%. Year 3: 3.0%\nRecovery Rate\t40%\nBregen reviews the data and opines that the market is incorrectly assessing Apollo’s credit risk. He believes that Apollo’s conditional probability of default is 2.0% for Year 1, Year 2, and Year 3. Priore reviews Apollo’s CDSs and adds that the market is pricing no basis between Apollo’s bonds and its CDSs.\nBregen expresses confidence in Apollo’s credit condition over a longer cycle, stating that Apollo is likely to experience improving credit fundamentals over the next five years. Priore compares Apollo’s bonds with its CDSs. Priore notes that Apollo’s five-year bond has a 200 bp credit spread and that Apollo’s five-year CDS has a 400 bp up-front premium. The CDS is based on a 1.00% fixed coupon and has duration of four years. Priore suggests that FIQ and BLB execute a five-year naked CDS in which FIQ buys the CDS and BLB sells the CDS.\nIn building credit portfolios, Bregen conducts fundamental credit research on companies. He discusses observations on three separate companies that he has been researching. Bregen states that Webster has low leverage and that its free cash flow will increase because of its new product pipeline. Bregen describes Levrom as being highly leveraged following an acquisition whose integration, he believes, will be more complex than originally expected. Bregen shares his view that Hamsco may potentially be affected by environmental litigation following its recent purchase of a manufacturing facility that contains unremediated hazardous materials.\nPriore believes that credit research should consider the proper pricing of credit risk. He states that basis trades are used by credit investors to ensure that the credit risk of bonds and CDSs is priced appropriately. He provides bond and CDS information for Webster, Hamsco, and Levrom. The current level of MRR is 2.00%.\nExhibit 2 Information for Three-Year Bonds and Three-Year CDSs\nCompany\tBond Yield\tCDS Spread\nWebster\t5.00%\t3.00%\nHamsco\t5.50%\t3.25%\nLevrom\t5.25%\t3.50%\nEckle adds that speculation about company balance sheet recapitalizations frequently affects bond yields, CDS spreads, and stock prices. He outlines three such recapitalization scenarios for Webster, Hamsco, and Levrom and an associated CDS trade idea for each scenario.\nExhibit 3 Recapitalization Scenarios and Related Trade Ideas\n \tRecapitalization Scenario\tTrade Idea\nScenario 1\tWebster issues five-year debt to acquire 100% of Levrom equity at a premium.\tBuy Webster CDS\nScenario 2\tLevrom issues equity in a “follow-on” (post-IPO) equity offering to retire debt.\tBuy Levrom CDS\nScenario 3\tHamsco issues five-year debt to acquire 100% of its public equity at a premium.\tSell Hamsco CDS", "Eleni Petsas is a portfolio manager in the fixed-income division of PDK Wealth Management (PDKW), based in Los Angeles. Petsas is running a training session for newly hired analysts Bonita Vasquez, Neil Gorman, and Rohit Kumar to examine the use of Credit Default Swaps (CDSs) in fixed-income portfolio management.\nPetsas begins the session by asking the analysts to identify types of CDSs. Vasquez responds, “There are three types of CDS; single-name CDSs, index CDSs, and tranche CDSs. A single-name CDS is on any obligation of a specific reference entity. An index CDS allows investors to take a position on the credit risk of multiple companies, although higher credit correlations make the index CDS more expensive to purchase. Tranche CDSs also cover multiple borrowers, but losses are covered only up to a specific level.”\nPetsas notes that a payment from the credit protection seller to the credit protection buyer is triggered whenever a credit event occurs. She asks each of the analysts to identify a credit event in the United States that will trigger a payment. The following are the responses of each analyst:\n• Vasquez: “A declaration of bankruptcy by the reference entity is a credit event that will trigger a payment from the CDS seller.”\n• Gorman: “If the reference entity fails to make a scheduled interest or principal payment, it is recognized as a failure-to-pay credit event.”\n• Kumar: “A change in seniority of outstanding obligations is also recognized as a credit event that will trigger a payment by the protection seller.”\nTo facilitate a discussion of CDS pricing and CDS trading strategies, Petsas presents the group with the information in Exhibit 1.\nExhibit 1 Select CDS Information\nCDS\tType\tCredit Spread (bps)\tRecovery Rate\tTenor (yrs.)\tCoupon (bps)\tDuration\nCDX NA IG\tIndex\t59\t40%\t5\t100\t4.76\nCDX NA HY\tIndex\t328\t30%\t5\t500\t4.34\nCompany A\tSingle-Name\t194\t25%\t5\t100\t4.57\nCompany A\tSingle-Name\t266\t40%\t10\t100\t7.38\nCompany B\tSingle-Name\t165\t40%\t5\t500\t4.55\nCompany B\tSingle-Name\t326\t40%\t10\t500\t8.19\nNotes: CDX NA IG is an index of CDSs of investment-grade North American corporations. CDX NA HY is an index of CDSs of high-yield North American corporations.\nPetsas states, “I would like you to formulate appropriate CDS trading strategies using the information provided in the following statements:”\n• Statement 1: “Our economists expect the US economy to strengthen over the coming year, with spreads on high-yield CDSs tightening by 100 bps and spreads on investment-grade CDSs tightening by 8 bps.”\n• Statement 2: “Our analysts expect that the credit curve for Company A will flatten, whereas the credit curve for Company B is expected to steepen.”\n• Statement 3: “Company A has a bond with five years to maturity with a credit risk premium of 85.40 bps, and Company B has a bond with five years to maturity with a credit risk premium of 205.60 bps.”\nOnly Kumar responds, as follows: “A trade that addresses Statement 2 would be to sell Company A CDSs with a 10-year tenor and buy Company A CDSs with a 5-year tenor. Alternatively, one could buy Company B CDSs with a 10-year tenor and sell Company B CDSs with a 5-year tenor.”"], "modules": {"1": "Term Structure & Interest Rate Dynamics", "2": "Arbitrage-Free Valuation Framework", "3": "Bonds with Embedded Options", "4": "Credit Analysis Models", "5": "Credit Default Swaps"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "FixedIncome", KEY = "FixedIncome_quiz_state_v1", EXPKEY = "FixedIncome_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function flush(){ if(!tbl.length) return; html+='<div class="tbl"><table>'+tbl.map(function(r){return "<tr>"+r.split("\t").map(function(c){return "<td>"+esc(c.trim())+"</td>";}).join("")+"</tr>";}).join("")+"</table></div>"; tbl=[]; }
  lines.forEach(function(l){
    if(l.indexOf("\t")>=0){ tbl.push(l); }
    else { flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>"; }
  });
  flush(); return html;
}
function mname(m){ return "Module "+m+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 모듈 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">Fixed Income 전체 모듈 오답 퀴즈</h2>'+
   '<p class="muted">ECO에서 틀린 130문제 전부 + 오답 개념과 연결된 ECO 정답 유형 40문제 + 같은 개념을 다른 각도에서 묻는 변형 17문제 (총 187문제). 정답은 ECO 원본 정답, 해설은 ECO 원본 해설과 Schweser 기준으로 작성했습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<label>출처 <select id="selSrc"><option value="all">전체</option><option value="wrong">ECO 오답만 (130)</option><option value="nowrong">오답 외 문제만</option></select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">새로 시작</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  $("bStart").onclick=function(){
    var m=$("selMod").value, s=$("selSrc").value;
    var order=Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (s==="all"||(s==="wrong"?q.src==="ECO 오답":q.src!=="ECO 오답")); }).map(function(q){return q.id;});
    if(!order.length) return;
    S=fresh(order,"all"); save(); render();
  };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    '<button class="btn primary" id="bNext" '+(r?'':'disabled')+'>'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button></div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=next;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz"};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저에 진행 기록이 없으면 자동으로 이어 풀고, 있으면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if(!S || !S.order || !Object.keys(S.round||{}).length){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>
