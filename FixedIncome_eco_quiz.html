B": "a profit on the CDS position.", "C": "neither a loss nor a profit on the CDS position."}, "ans": "B", "en": "B is correct. Deem Advisors purchased protection and therefore is economically short and benefits from an increase in the company’s spread. Since putting on the protection, the credit spread increased by 200 bps, and Deem Advisors realizes the profit by entering into a new, offsetting contract (sells protection to another party at a higher premium).\nA is incorrect because a decrease (not increase) in the spread would result in a loss for the credit protection buyer. C is incorrect because Deem Advisors, the credit protection buyer, would profit from an increase in the company’s credit spread, not break even.", "ko": "Protection 매수 = 신용에 대해 경제적으로 short. 매수 후 spread가 200bp 확대 → CDS 가치 상승. 반대(매도) 계약으로 청산하면 더 높은 프리미엄으로 protection을 팔게 되어 이익 실현.", "trap": "Buyer = short credit: spread↑ → 이익. Seller = long credit: spread↑ → 손실.", "f": "ΔCDS value(buyer) ≈ Δspread × Duration × Notional", "why": {"A": "손실은 spread가 '축소'될 때 protection buyer에게 발생합니다.", "C": "spread가 변했으므로 손익이 발생합니다(확대 → buyer 이익)."}, "orig": "ECO Module 5 Q5"}, {"id": "ECO-M5-Q6", "src": "ECO 오답", "module": 5, "tag": "Basis trade – 이익 크기", "vig": 32, "stem": "If convergence occurs in the bond and CDS markets for Tollunt Corporation, a basis trade will capture a profit closest to:", "opts": {"A": "0.25%.", "B": "1.75%.", "C": "2.75%."}, "ans": "A", "en": "A is correct. A difference in credit spreads in the bond market and CDS market is the foundation of the basis trade strategy. If the spread is higher in the bond market than in the CDS market, it is said to be a negative basis. In this case, the bond credit spread is currently 4.50% (bond yield minus MRR) and the comparable CDS contract has a credit spread of 4.25%. The credit risk is cheap in the CDS market relative to the bond market. Since the protection and the bond were both purchased, if convergence occurs, the trade will capture the 0.25% differential in the two markets (4.50% – 4.25%).\nB is incorrect because the bond market implies a 4.50% credit risk premium (bond yield minus the market reference rate) and the CDS market implies a 4.25% credit risk premium. Convergence of the bond market credit risk premium and the CDS credit risk premium would result in capturing the differential, 0.25%. The 1.75% is derived by incorrectly subtracting MRR from the credit spread on the CDS (= 4.25% – 2.50%).\nC is incorrect because convergence of the bond market credit risk premium and the CDS credit risk premium would result in capturing the differential, 0.25%. The 2.75% is derived incorrectly by subtracting the credit spread on the CDS from the current bond yield (= 7.00% – 4.25%).", "ko": "Bond credit spread = 채권수익률 − MRR = 7.00% − 2.50% = 4.50%. CDS spread = 4.25%. Bond spread > CDS spread → negative basis. 채권 매수 + protection 매수 후 수렴하면 차이 0.25%를 확보.", "trap": "Bond credit spread = Bond yield − MRR. 그 다음 CDS spread와 비교.", "f": "Basis = CDS spread − (Bond yield − MRR)", "why": {"B": "1.75%는 CDS spread에서 MRR을 뺀 값(4.25 − 2.50). CDS spread는 이미 '신용' spread입니다.", "C": "2.75%는 채권수익률 − CDS spread(7.00 − 4.25). 채권수익률에서 MRR을 먼저 빼야 합니다."}, "orig": "ECO Module 5 Q6"}, {"id": "ECO-M5-Q14", "src": "ECO 오답", "module": 5, "tag": "Equity-versus-credit trade (M&A)", "vig": 33, "stem": "A profitable equity-versus-credit trade involving Delta and Zega is to:", "opts": {"A": "short Zega shares and buy protection on Delta using the 10-year CDS.", "B": "go long Zega shares and buy protection on Delta using 5-year CDS.", "C": "go long Delta shares and buy protection on Delta using 5-year CDS."}, "ans": "B", "en": "B is correct. The shares of Zega can be sold at a higher price as a result of the unsolicited bid in the market. If Delta Corporation issues significantly more debt, there is a higher probability that it may default. If the Fund sells protection on Delta now, the trade will realize a profit as credit spreads widen. An equity-versus-credit trade would be to go long (buy) the Zega shares and buy protection on Delta.", "ko": "Delta가 프리미엄을 얹어 Zega 주식을 인수할 전망 → Zega 주가 상승 → Zega 주식 매수(long). Delta는 5·10년 신규 부채로 자금 조달 → 신용 악화 → spread 확대 → Delta protection 매수(이익).", "trap": "M&A: 피인수(target) 주식 long, 인수자(부채 조달) CDS protection 매수.", "f": "", "why": {"A": "Zega 주식은 인수 프리미엄으로 오를 것이므로 공매도하면 손실입니다.", "C": "Delta 주식은 인수자로서 과다 레버리지 위험 → 매수 근거가 약합니다. 이 trade의 equity leg는 '피인수' Zega long."}, "orig": "ECO Module 5 Q14"}, {"id": "ECO-M5-Q20", "src": "ECO 오답", "module": 5, "tag": "CDS 청산 – seller, spread 축소", "vig": 34, "stem": "If Tundra closes its position in CDS 3 today, it will:", "opts": {"A": "pay an upfront premium and monetize a loss.", "B": "pay an upfront premium and monetize a gain.", "C": "receive an upfront premium and monetize a gain."}, "ans": "B", "en": "(A) Incorrect because Tundra will pay an upfront premium and monetize a gain.\n(B) Correct because if Tundra was to close its position in CDS 3, it will have to buy credit protection with a newly created CDS with a coupon of 5.0% and the same remaining maturity as CDS 3.  As the reference entity’s credit spread is currently 600 bps, to buy such credit protection, Tundra has to pay an upfront premium.\nHowever, as the reference entity’s credit spread decreased by 50 bps (i.e., credit quality improved) the upfront premium that Tundra has to pay is lower than the upfront premium it received at origination. Therefore, it will monetize a gain.\n(C) Incorrect because Tundra will pay an upfront premium and monetize a gain.", "ko": "CDS 3: protection seller, 쿠폰 5%, 체결 시 spread 650bp → 현재 600bp. 청산하려면 같은 조건의 protection을 '매수'해야 함. 현재 spread 600bp > 쿠폰 500bp → 매수자는 upfront를 '지급'. 하지만 spread가 50bp 축소(신용 개선)해 지급액이 체결 시 받은 upfront보다 작음 → 이익 실현.", "trap": "Upfront 방향: spread > coupon → buyer가 지급. 손익: seller는 spread 축소 시 이익.", "f": "Upfront (buyer pays) ≈ (Spread − Coupon) × Duration", "why": {"A": "spread 축소는 seller(long credit)에게 이익입니다.", "C": "spread(600) > 쿠폰(500)이므로 protection을 사는 쪽이 upfront를 '지급'합니다(받지 않음)."}, "orig": "ECO Module 5 Q20"}, {"id": "ECO-M5-Q22", "src": "ECO 오답", "module": 5, "tag": "Basis trade 방향 – negative basis", "vig": 34, "stem": "Which of the following trades is consistent with Pereira's belief about the local company's credit spread convergence?", "opts": {"A": "Buy bonds and sell CDS credit protection", "B": "Buy bonds and buy CDS credit protection", "C": "Sell bonds and buy CDS credit protection"}, "ans": "B", "en": "(A) Incorrect because as explained in the rationale for the correct answer Tundra should buy bonds and buy credit protection.\n(B) Correct because the credit spread situation provide an opportunity for a basis trade.  Per the reading, the general idea behind most basis trades is that any such mispricing is likely to be temporary and the spreads in the bond and the CDS markets should return to equivalence when the market recognizes the disparity. For example, suppose the bond market implies a 4.5% credit risk premium whereas the CDS market implies a 4.0% credit risk premium. The trader does not know which is correct but believes these two rates will eventually converge. From the perspective of the CDS, its risk premium is too low relative to the bond credit risk premium. From the perspective of the bond, its risk premium is too high relative to the CDS market, which means its price is too low. So, the CDS market could be pricing in too little credit risk, and/or the bond market could be pricing in too much credit risk. Either market could be correct, it does not matter. The investor would buy the bond at a price that appears to overestimate its credit risk, and, at the same time, buy credit protection at what appears to be an unjustifiably low premium. If the convergence occurs, the trade would capture the 0.5% differential in the two markets.\n(C) Incorrect because as explained in the rationale for the correct answer Tundra should buy bonds and buy credit protection.", "ko": "Bond spread 450bp > CDS spread 400bp → negative basis. 채권이 신용위험을 과다 반영(가격이 쌈), CDS는 과소 반영(protection이 쌈) → 채권 매수 + CDS protection 매수. 수렴 시 50bp 이익.", "trap": "Negative basis(bond spread > CDS) → buy bond + buy protection. Positive basis → sell(short) bond + sell protection.", "f": "", "why": {"A": "CDS protection을 '매도'하면 채권과 같은 방향(long credit)이라 헤지·차익이 아닙니다.", "C": "채권 매도는 싼 채권을 파는 것이라 basis 수렴 이익과 반대 방향입니다."}, "orig": "ECO Module 5 Q22"}, {"id": "ECO-M5-Q23", "src": "ECO 오답", "module": 5, "tag": "Expected loss – 연도별 조건부 PD (ECO 방식)", "vig": 35, "stem": "Based on the information in Exhibit 1, the expected loss for Apollo bond is most likely closest to:", "opts": {"A": "$35.28.", "B": "$48.03.", "C": "$90.00."}, "ans": "B", "en": "(A) Incorrect. An expected loss of $35.28 incorrectly presumes an equivalent hazard rate of 2% for each year:\n1.Probability of survival represents the probability of no default: 0.98 × 0.98 × 0.98 = 0.94119.\n2. Probability of default: 1.0 – Probability of survival = 1 – 0.94119 = 0.058810 = 5.8810%.\n3. Expected loss = Probability of default × Loss given default × Face amount = 5.8810% × 60% × $1,000 = $35.28.\n(B) Correct. Expected loss = Summation of conditional probability of default × Loss given default for each discrete cash flow, as illustrated.\nCalculation:\nCash flow (CF): $50.00 interest coupons, $1,000.00 principal repayment\nExpected loss (EL) = CF × Conditional probability of default (PD) × Loss given default (LGD), where LGD = 1 – Recovery rate\nConditional probability of default:\nYear 1 PD = 2.0% = 2% Hazard rate\n[98% no default in Year 1 (100% – 2% PD)].\nYear 2 conditional PD = 4.45% = 2.0% (Y1 PD) + 2.45% (Y2 conditional PD)\n[(2.5% Hazard rate × 98% No default Y1); 95.50% no default in Year 2 (100% – 4.5% PD)].\nYear 3 conditional PD = 7.317% = 2.0% (Y1 PD) + 2.45% (Y2 conditional PD) + 2.867% (Y3 conditional PD)\n[(3.0% Hazard rate × 0.955 No default Y2); 92.684% no default in Year 3 (100% – 7.317% PD)].\nExpected loss = $48.03, where\nYear 1 = $50.00 CF × (2.00% Y1 PD × 0.60 LGD) = $0.60.\nYear 2 = $50.00 CF × (4.45% Y2 conditional PD × 0.60 LGD) = $1.34.\nYear 3 = $1,050.00 CF × (7.316% Y3 conditional PD × 0.60 LGD) = $46.09.\n(C) Incorrect. An expected loss of $90.00 is incorrectly determined by the following calculation: $1,000 (face amount of the bond) × 15.00% (summation of the three years of 5.00% interest coupons) × (1.0 – 0.40 Recovery rate).", "ko": "ECO 해설 방식: 각 현금흐름 × 누적 조건부 PD × LGD(60%). 누적 PD: Y1 2.00%, Y2 2.00% + 2.5%×0.98 = 4.45%, Y3 4.45% + 3.0%×0.955 = 7.317%. EL = 50×2.00%×0.6 + 50×4.45%×0.6 + 1,050×7.317%×0.6 = 0.60 + 1.34 + 46.09 = $48.03. 노트 공식과 동일: PS_t = (1−h1)(1−h2)…(1−h_t), 누적 PD_t = 1 − PS_t → PS3 = 0.98 × 0.975 × 0.97 = 0.92684 → 누적 PD3 = 7.316%.", "trap": "연도별 hazard rate가 다르면 조건부로 누적(직전 생존확률 × 당해 hazard). Bregen의 '견해'가 아니라 Exhibit 1 시장자료를 사용.", "f": "PD_t(조건부) = hazard_t × S_(t−1),  S_t = S_(t−1) × (1 − hazard_t)", "why": {"A": "$35.28은 매년 2%(Bregen의 가정)를 적용해 3년 누적 PD 5.881% × 60% × $1,000으로 계산한 값입니다. Exhibit 1의 연도별 2.0%/2.5%/3.0%를 써야 합니다.", "C": "$90.00은 쿠폰 합계 15% × $1,000 × 60%라는 무의미한 계산입니다."}, "orig": "ECO Module 5 Q23"}, {"id": "ECO-M5-Q28", "src": "ECO 오답", "module": 5, "tag": "Recapitalization 시나리오 → CDS 거래", "vig": 35, "stem": "For which of the recapitalization scenarios outlined by Eckle is its associated CDS trade idea most likely profitable?", "opts": {"A": "Scenario 1", "B": "Scenario 2", "C": "Scenario 3"}, "ans": "A", "en": "(A) Correct. The trade idea associated with Scenario 1 is likely profitable. Webster’s issuance of debt will most likely cause Webster’s credit fundamentals to deteriorate (buying the Webster CDS is likely profitable).\n(B) Incorrect. The trade idea associated with Scenario 2 is likely not profitable. The debt reduction is likely to cause Levrom’s credit condition to improve (buying the Levrom CDS is likely not profitable).\n(C) Incorrect. The trade idea associated with Scenario 3 is likely not profitable. Hamsco’s issuance of debt to acquire 100% of its public equity will most likely cause its credit condition to deteriorate (selling the Hamsco CDS is likely not profitable).", "ko": "Scenario 1: Webster가 5년 부채를 발행해 Levrom을 인수 → Webster 신용 악화 → Webster CDS protection 매수가 이익.", "trap": "부채↑(레버리지↑) → spread↑ → protection 매수 이익. 부채↓ → spread↓ → protection 매도 이익.", "f": "", "why": {"B": "Levrom이 주식 발행으로 부채를 상환 → 신용 개선 → Levrom protection 매수는 손실.", "C": "Hamsco가 부채로 자사주 100% 매입(LBO형) → 신용 악화 → Hamsco protection '매도'는 손실."}, "orig": "ECO Module 5 Q28"}, {"id": "ECO-M5-Q29", "src": "ECO 오답", "module": 5, "tag": "CDS 유형 – single-name 대상 채무", "vig": 36, "stem": "In her response to Petsas regarding types of CDS, Vasquez is least likely correct with regard to:", "opts": {"A": "index CDSs.", "B": "tranche CDSs.", "C": "single-name CDSs."}, "ans": "C", "en": "(A) Incorrect. Vasquez correctly describes an index CDS.\n(B) Incorrect. Vasquez correctly describes a tranche CDS.\n(C) Correct. Vasquez is incorrect about single-name CDSs. A single-name CDS is typically on a senior unsecured obligation (reference obligation) of a specific borrower (reference entity). However, only debt obligations of the borrower that are ranked equivalently, in terms of priority of claims, are covered by the CDS. Vasquez incorrectly states that a single-name CDS is on any reference obligation, regardless of the priority of claims. Vasquez correctly describes index CDSs and tranche CDSs.", "ko": "Single-name CDS는 특정 차주의 선순위 무담보 채무(reference obligation)를 기준으로 하며, 그와 '동순위'인 채무만 커버합니다. Vasquez가 '어떤 채무든(any obligation)'이라 한 것이 틀렸습니다.", "trap": "Single-name = senior unsecured reference obligation + 동순위(pari passu) 채무만.", "f": "", "why": {"A": "Index CDS 설명(여러 회사 신용위험, 상관관계↑ → 비용↑)은 맞습니다.", "B": "Tranche CDS 설명(여러 차주, 특정 손실 구간까지만 보장)은 맞습니다."}, "orig": "ECO Module 5 Q29"}, {"id": "ECO-M5-Q31", "src": "ECO 오답", "module": 5, "tag": "CDS 가격 & upfront premium", "vig": 36, "stem": "Based on Exhibit 1, the price per 100 par of Company A CDSs is closest to:", "opts": {"A": "95.70.", "B": "99.06.", "C": "104.29."}, "ans": "A", "en": "(A) Correct. Up-front premium = (Credit spread – Fixed coupon) × CDS duration\n= (1.94 – 1.0) × 4.57 = 4.2958.\nPrice of CDS per 100 par = 100 – Up-front premium\n= 100 – 4.2958 = 95.7042.\n(B) Incorrect. It is incorrectly calculated as follows: Up-front premium = (Credit spread – Fixed coupon)\n= (1.94 – 1.0) = 0.94.\nPrice of CDS per 100 par = 100 – Up-front premium\n= 100 – 0.94 = 99.06.\n(C) Incorrect. It is incorrectly calculated as follows: Up-front premium = (Fixed coupon – Credit spread) × CDS duration\n= (1.0 – 1.94) × 4.57 = –4.2958.\nPrice of CDS per 100 par = 100 – Up-front premium\n= 100 – (–4.2958) = 104.2958.", "ko": "Upfront premium(%) ≈ (credit spread − fixed coupon) × CDS duration = (1.94% − 1.00%) × 4.57 = 4.2958%. CDS price per 100 = 100 − 4.2958 = 95.70.", "trap": "Price = 100 − upfront. spread > coupon → price < 100 (buyer가 upfront 지급).", "f": "Upfront ≈ (Spread − Coupon) × Duration,  Price = 100 − Upfront(%)", "why": {"B": "99.06은 duration을 곱하지 않은 값(100 − 0.94).", "C": "104.29는 부호를 반대로(coupon − spread) 적용한 값."}, "orig": "ECO Module 5 Q31"}, {"id": "ECO-M5-Q32", "src": "ECO 오답", "module": 5, "tag": "Long/short CDS trade – 경기 개선", "vig": 36, "stem": "Based on the information in Exhibit 1 and Statement 1, an appropriate long/short trade would be to:", "opts": {"A": "sell CDX NA IG and buy CDX NA HY.", "B": "sell CDX NA HY and buy CDX NA IG.", "C": "sell Company A CDSs and buy Company B CDSs."}, "ans": "B", "en": "(A) Incorrect. The trade to sell CDX NA IG (long) and buy CDX NA HY (short) is only appropriate if the US economy is expected to weaken.\n(B) Correct. The appropriate long/short trade in this case is to take a long position by selling CDX NA HY and take a short position by buying CDX NA IG. Because high-yield spreads (100 bps) are expected to tighten by more than investment-grade spreads (8 bps), CDX NA HY will gain by more than CDX NA IG, resulting in a net gain on the trade.\n(C) Incorrect. The trade to sell Company A CDSs (long) and buy Company B CDSs (short) may be appropriate if the US economy is expected to weaken. The coupon on Company A is 100 bps, indicating it is investment grade, whereas company B, with a 500 bp coupon, is high yield.", "ko": "경기 개선 → HY spread 100bp 축소, IG 8bp 축소 → HY가 더 크게 개선. HY CDS 매도(long credit) + IG CDS 매수(short credit) → 순이익.", "trap": "CDS 'sell' = long credit (spread 축소 시 이익). 개선 폭이 큰 쪽을 sell.", "f": "", "why": {"A": "IG 매도·HY 매수는 경기 '악화'를 예상할 때의 trade입니다.", "C": "Company A(IG) 매도·B(HY) 매수도 경기 악화 시나리오에 맞는 trade입니다."}, "orig": "ECO Module 5 Q32"}, {"id": "ECO-M5-Q34", "src": "ECO 오답", "module": 5, "tag": "Basis trade – positive basis (Company A)", "vig": 36, "stem": "Which of the following trades is most likely appropriate on the basis of the information in Statement 3 and Exhibit 1? Go long:", "opts": {"A": "Company B five-year CDSs and short Company B five-year bonds.", "B": "Company A five-year CDSs and short Company A five-year bonds.", "C": "Company A five-year bonds and CDSs and go short Company B five-year bonds and CDSs."}, "ans": "B", "en": "(A) Incorrect. For Company B, the correct strategy is to go short (buy) Company B five-year CDSs and go long Company B five-year bonds. The bond credit spread of 205.60 bps is greater than the CDS credit spread of 165.29 bps. This implies that the bond is underpriced and the CDS is overpriced. Thus, the appropriate strategy is to short the overpriced CDS (buy CDSs) and go long the underpriced bond.\n(B) Correct. The correct trade is to go long (sell) Company A five-year CDSs and short Company A five-year bonds. The bond credit spread of 85.40 bps is less than the CDS credit spread of 193.45 bps. This implies that the bond is overpriced and the CDS is underpriced. Thus, the appropriate strategy is to short the overpriced bond and go long the underpriced CDS (sell CDSs).\n(C) Incorrect. Company A bond is overpriced, so you would go short, not long. Company B bond is underpriced, so you would go long, not short.", "ko": "Company A: bond spread 85.40bp < CDS spread 193.45bp → 채권 고평가(spread 너무 낮음), CDS 저평가(protection 프리미엄 높음 → 팔기 좋음). → CDS 매도(long CDS) + 채권 공매도.", "trap": "'Long CDS' = protection 매도(long credit). Bond spread < CDS spread → short bond + sell protection.", "f": "", "why": {"A": "Company B는 bond spread 205.60 > CDS 165.29 → 채권 매수 + protection 매수가 맞는 방향. 선지는 반대.", "C": "Company A 채권은 고평가라 매수가 아니라 공매도, B 채권은 저평가라 공매도가 아니라 매수."}, "orig": "ECO Module 5 Q34"}, {"id": "ECO-M5-Q36", "src": "ECO 오답", "module": 5, "tag": "CDS payout = Notional × LGD", "vig": null, "stem": "In the event of default, the payout amount for a credit default swap (CDS) is equal to the notional principal multiplied by:", "opts": {"A": "the recovery rate.", "B": "the loss given default.", "C": "the probability of default."}, "ans": "B", "en": "(A) Incorrect because the payout amount is determined as the loss given default multiplied by the notional where loss given default = 1 – Recovery rate (%).\n(B) Correct because the payout amount is determined as the loss given default multiplied by the notional.\n(C) Incorrect because the payout amount is the loss given default, not the probability of default.", "ko": "부도 시 CDS 지급액 = 명목금액 × LGD(= 1 − 회수율).", "trap": "Payout = (1 − RR) × Notional.", "f": "Payout = Notional × (1 − RR)", "why": {"A": "회수율 × 명목금액은 '회수되는' 금액. 보호매도자는 손실분(1 − RR)을 지급.", "C": "부도확률은 가격결정 요소일 뿐 부도 후 지급액과 무관."}, "orig": "ECO Module 5 Q36"}, {"id": "ECO-M5-Q40", "src": "ECO 오답", "module": 5, "tag": "Negative basis trade", "vig": null, "stem": "The current price of a company's 3-year bond implies a credit spread of 5%. A comparable 3-year CDS contract has a credit spread of 4%. To best exploit the mispricing, an investor can engage in:", "opts": {"A": "a positive basis trade by selling the bond and selling protection through the CDS.", "B": "a negative basis trade by buying the bond and buying protection through the CDS.", "C": "a negative basis trade by buying the bond and selling protection through the CDS."}, "ans": "B", "en": "(A) Incorrect because this would be a negative basis trade. If the spread is higher in the bond market than in the CDS market, it is said to be a negative basis. If the spread is higher in the CDS market than in the bond market, it is said to be a positive basis.\n(B) Correct because this would be a negative basis trade. If the spread is higher in the bond market than in the CDS market, it is said to be a negative basis. From the perspective of the CDS, its risk premium is too low relative to the bond credit risk premium. From the perspective of the bond, its risk premium is too high relative to the CDS market, which means its price is too low. The investor would buy the bond at a price that appears to overestimate its credit risk and, at the same time, buy credit protection at what appears to be an unjustifiably low premium.\n(C) Incorrect because even though this would be a negative basis trade (if the spread is higher in the bond market than in the CDS market, it is said to be a negative basis), From the perspective of the CDS, its risk premium is too low relative to the bond credit risk premium. From the perspective of the bond, its risk premium is too high relative to the CDS market, which means its price is too low. The investor would buy the bond at a price that appears to overestimate its credit risk and, at the same time, buy (and not sell) credit protection at what appears to be an unjustifiably low premium.", "ko": "Bond spread 5% > CDS spread 4% → negative basis. 채권 매수 + CDS protection 매수 → 수렴 시 1% 확보.", "trap": "M5 Q22 오답과 같은 개념. Negative basis → buy bond + buy protection.", "f": "", "why": {"A": "Bond spread > CDS spread는 positive가 아니라 negative basis이고, 방향도 반대입니다.", "C": "Negative basis는 맞지만 protection을 '매도'하면 채권과 같은 long credit이라 차익이 안 됩니다."}, "orig": "ECO Module 5 Q40"}, {"id": "ECO-M5-Q42", "src": "ECO 오답", "module": 5, "tag": "CDS 특징 – counterparty risk", "vig": null, "stem": "With respect to CDS:", "opts": {"A": "the protection buyer assumes counterparty risk with respect to the protection seller.", "B": "the protection buyer makes a series of periodic, variable payments to the protection seller.", "C": "the change in value of the CDS contract fully offsets the change in the value of the underlying."}, "ans": "A", "en": "(A) Correct because in addition, the credit protection buyer assumes counterparty risk with respect to the credit protection seller. Under CDS agreements, the credit protection buyer relies on payment from the seller in the event of the underlying entity's default.\n(B) Incorrect because the buyer agrees to make a series of periodic payments to the seller over the life of the contract (which are determined and fixed at contract initiation). Thus, the protection buyer's payments are fixed rather than variable.\n(C) Incorrect because a CDS does not eliminate credit risk. The definition of a default in the swap contract may not perfectly align with a traditional default event, so the magnitude of the change in value of the contract may differ from the change in value of the underlying.", "ko": "Protection buyer는 부도 시 seller의 지급에 의존하므로 seller에 대한 거래상대방 위험을 부담합니다.", "trap": "CDS는 신용위험을 완전히 제거하지 못함(basis risk, counterparty risk).", "f": "", "why": {"B": "Buyer의 정기지급은 계약 시 정해진 '고정' 금액입니다(변동 아님).", "C": "CDS 부도 정의와 실제 부도가 완벽히 일치하지 않을 수 있어 기초자산 가치변화를 완벽히 상쇄하지 못합니다."}, "orig": "ECO Module 5 Q42"}, {"id": "ECO-M5-Q8", "src": "ECO 관련유형", "module": 5, "tag": "CDS 유형 – 다수 익스포저 헤지 = Index CDS", "vig": 33, "stem": "Which type of CDS should Chan recommend to Smith?", "opts": {"A": "CDS index", "B": "Tranche CDS", "C": "Single-name CDS"}, "ans": "A", "en": "A is correct. A CDS index (e.g., CDX and iTraxx) would allow the Fund to simultaneously fully hedge multiple fixed-income exposures. A tranche CDS will also hedge multiple exposures, but it would only partially hedge those exposures.", "ko": "여러 채권 익스포저를 동시에 '완전히' 헤지 → CDS index(CDX: 북미, iTraxx: 유럽·아시아). Tranche CDS는 특정 손실 구간까지만 커버해 부분 헤지.", "trap": "지역(CDX 북미 / iTraxx 유럽) × 등급(IG·Main / HY·Crossover).", "f": "", "why": {"B": "Tranche CDS도 다수 차주를 다루지만 손실이 특정 수준까지만 보장되어 '완전' 헤지가 아닙니다.", "C": "Single-name CDS는 한 발행자만 커버합니다."}, "orig": "ECO Module 5 Q8"}, {"id": "ECO-M5-Q35", "src": "ECO 관련유형", "module": 5, "tag": "Protection seller = long credit", "vig": null, "stem": "The protection seller in a credit default swap (CDS) most likely:", "opts": {"A": "is long credit risk exposure.", "B": "receives a one-time upfront payment for the life of the contract.", "C": "pays the notional value of the security in the event of default."}, "ans": "A", "en": "(A) Correct because the protection seller is long the credit risk exposure and must pay in the event of default. In a CDS contract there are two counterparties, the credit protection buyer and the credit protection seller. The buyer agrees to make a series of periodic payments to the seller over the life of the contract (which are determined and fixed at contract initiation) and receives in return a promise that if default occurs, the protection seller will compensate the protection buyer.\n(B) Incorrect because the buyer agrees to make a series of periodic payments to the seller over the life of the contract (which are determined and fixed at contract initiation) and receives in return a promise that if default occurs, the protection seller will compensate the protection buyer. If default occurs, the periodic payments made by the protection buyer to the protection seller terminate.\n(C) Incorrect because in the event of a credit event on the underlying security, the buyer of credit protection receives a payment from the credit protection seller equal to the par or notional value of the security less the expected recovery value.", "ko": "Protection seller는 신용위험을 떠안는 long credit 포지션이며 부도 시 지급 의무가 있습니다.", "trap": "", "f": "", "why": {"B": "Buyer는 계약기간 동안 정기 프리미엄을 지급합니다(일시불 X).", "C": "부도 시 지급액은 명목금액 전체가 아니라 (명목 − 회수가치)."}, "orig": "ECO Module 5 Q35"}, {"id": "ECO-M5-Q37", "src": "ECO 관련유형", "module": 5, "tag": "회수율↑ → CDS 가치↓", "vig": null, "stem": "An increase in which of the following factors reduces the value of a CDS?", "opts": {"A": "Recovery rate", "B": "Expected exposure", "C": "Present value of expected loss"}, "ans": "A", "en": "(A) Correct because the recovery rate is the percentage of loss recovered from a bond in default.\nCVA = Σ (PV of Expected Loss (EL))\nEL = Loss given default (LGD) × Probability of default (PD)\nLGD = Expected exposure × (1 – Recovery rate)\nThe higher the recovery rate, the lower the loss given default, the lower the expected loss and the lower the CVA.\n(B) Incorrect because the expected exposure reflects the notional value of the underlying CDS contract. As this exposure increases, the value of the CDS also increases.\n(C) Incorrect because this is the actual value of the CDS and as it moves higher, the value of the CDS also moves higher.", "ko": "회수율↑ → LGD↓ → EL↓ → CDS 가치↓.", "trap": "", "f": "LGD = Exposure × (1 − RR)", "why": {"B": "Exposure↑ → CDS 가치↑.", "C": "EL의 PV↑ → CDS 가치↑."}, "orig": "ECO Module 5 Q37"}, {"id": "ECO-M5-Q39", "src": "ECO 관련유형", "module": 5, "tag": "Basis trade의 기준", "vig": null, "stem": "A basis trade strategy is based on the difference between a company's CDS spread and the:", "opts": {"A": "company's bond yield.", "B": "market reference rate.", "C": "excess of the company's bond yield over the market reference rate."}, "ans": "C", "en": "(A) Incorrect because a difference in the credit spreads in these two markets [the bond market and the CDS market] is the foundation of a strategy known as a basis trade. The company's bond yield includes the market reference rate and is therefore not directly comparable to the CDS spread.\n(B) Incorrect because a difference in the credit spreads in these two markets (the bond market and the CDS market) is the foundation of a strategy known as a basis trade. The market reference rate does not include the company's credit spread and is therefore not comparable to the CDS spread.\n(C) Correct because the basis trade strategy is based on the difference between the company's bond credit spread and the CDS spread.  A difference in the credit spreads in these two markets is the foundation of a strategy known as a basis trade. To determine the profit potential of such a trade, it is necessary to decompose the bond yield into the risk-free rate plus the funding spread plus the credit spread. The risk-free rate plus the funding spread is essentially the market reference rate. The credit spread is then the excess of the yield over the market reference rate and can be compared with the credit spread in the CDS market.", "ko": "Basis = CDS spread vs 채권의 credit spread(= 채권수익률 − MRR) 차이.", "trap": "M5 Q6 오답과 같은 개념.", "f": "", "why": {"A": "채권수익률에는 MRR이 포함되어 CDS spread와 직접 비교 불가.", "B": "MRR에는 신용 spread가 없습니다."}, "orig": "ECO Module 5 Q39"}, {"id": "ECO-M5-Q41", "src": "ECO 관련유형", "module": 5, "tag": "CDS 매도 vs 채권 매수", "vig": null, "stem": "Compared to a bond purchase, a sale of CDS protection on the bond's issuer most likely:", "opts": {"A": "incurs higher transaction costs.", "B": "establishes a less liquid position.", "C": "mitigates exposure to interest rate risk."}, "ans": "C", "en": "(A) Incorrect because if the bondholder wants only credit risk, it can obtain it by selling protection, which would require far less capital and incur potentially lower overall transaction costs than buying the bond.\n(B) Incorrect because the CDS can be more liquid than the bond, so the position can be unwound much more easily.\n(C) Correct because any bondholder is a buyer of credit and interest rate risk. If the bondholder wants only credit risk, it can obtain it by selling protection.", "ko": "채권 매수 = 신용위험 + 금리위험. CDS protection 매도는 신용위험만 취해 금리위험 노출을 줄입니다(자본·거래비용도 적고 유동성 높을 수 있음).", "trap": "", "f": "", "why": {"A": "CDS 매도가 거래비용이 더 '낮을' 수 있습니다.", "B": "CDS가 더 유동적일 수 있습니다."}, "orig": "ECO Module 5 Q41"}, {"id": "ECO-M5-Q43", "src": "ECO 관련유형", "module": 5, "tag": "CDS 결제 방식", "vig": null, "stem": "Which of the following statements is most accurate with respect to the settlement of CDS?", "opts": {"A": "Cash settlement is more common than physical settlement", "B": "The actual recovery rate is typically determined close to the payoff date of the CDS", "C": "Settlement typically occurs the business day following the declaration of a credit event"}, "ans": "A", "en": "(A) Correct because CDS can be settled by physical settlement or by cash settlement. The former is less common and involves actual delivery of the debt instrument in exchange for a payment by the credit protection seller of the notional amount of the contract.\n(B) Incorrect because actual recovery can be a very long process, however, and can occur much later than the payoff date of the CDS.\n(C) Incorrect because settlement typically occurs 30 days after declaration of the credit event by the DC (Determinations Committee).", "ko": "Cash settlement가 physical settlement보다 일반적입니다.", "trap": "M5 Q1 오답과 연결.", "f": "", "why": {"B": "실제 회수는 오래 걸려 CDS 지급일보다 훨씬 뒤일 수 있습니다(경매로 결정).", "C": "결제는 신용사건 선언 후 약 30일 후."}, "orig": "ECO Module 5 Q43"}, {"id": "ECO-M5-Q44", "src": "ECO 관련유형", "module": 5, "tag": "Spread 확대 → seller 손실", "vig": null, "stem": "In a CDS position on a company whose credit spread has widened, the protection seller:", "opts": {"A": "is long credit exposure and would monetize a gain upon unwinding the position.", "B": "is long credit exposure and would monetize a loss upon unwinding the position.", "C": "is short credit exposure and would monetize a loss upon unwinding the position."}, "ans": "B", "en": "(A) Incorrect because as noted in the correct answer, if credit spreads widen, the protection seller would monetize a loss upon unwinding the position.\n(B) Correct because the protection seller is effectively long the reference entity. Thus, the credit protection seller is more or less long the company’s bonds and going back to the example where the credit quality of the reference entity improved. The implied upfront premium on a new CDS that matches the terms of the original CDS with adjusted maturity is now the market value of the original CDS. The premium on the new CDS is smaller than that on the original CDS. The protection seller in the original transaction could offset his position by entering into a new CDS as a protection buyer. He would pay an upfront premium that is less than what he originally received. The original protection buyer monetizes a loss, and the seller monetizes a gain. Conversely, if credit spreads widen, the protection seller would monetize a loss.\n(C) Incorrect because as noted in the correct answer, the protection seller is effectively long credit exposure.", "ko": "Protection seller = long credit. Spread 확대 → 청산 시 더 큰 upfront 지급(또는 덜 받음) → 손실 실현.", "trap": "M5 Q5/Q20 오답과 같은 축.", "f": "", "why": {"A": "Spread 확대는 seller에게 손실입니다.", "C": "Seller는 short가 아니라 long credit."}, "orig": "ECO Module 5 Q44"}, {"id": "VAR-M5-01", "module": 5, "tag": "CDS 가격 & upfront premium", "stem": "A five-year CDS has a standard coupon of 1.00%, a credit spread of 3.20%, and a duration of 4.2. The CDS price per 100 par is closest to:", "opts": {"A": "90.76.", "B": "97.80.", "C": "109.24."}, "ans": "A", "en": "Upfront premium ≈ (3.20% − 1.00%) × 4.2 = 9.24% of notional (paid by the protection buyer). CDS price = 100 − 9.24 = 90.76.", "ko": "Upfront = (spread − coupon) × duration = 2.20% × 4.2 = 9.24%. Price = 100 − 9.24 = 90.76. spread > coupon → buyer가 upfront 지급, 가격 < 100.", "why": {"B": "Duration을 곱하지 않았습니다.", "C": "부호를 반대로 적용했습니다."}, "trap": "ECO M5 Q31과 동일 함정.", "f": "Upfront ≈ (Spread − Coupon) × Duration,  Price = 100 − Upfront", "orig": "변형 (ECO M5 Q31)", "src": "변형", "vig": null}, {"id": "VAR-M5-02", "module": 5, "tag": "Basis trade – 수렴 시 이익", "stem": "A company's five-year bond yields 6.10% and the market reference rate is 3.00%. A comparable five-year CDS trades at a spread of 2.60%. If the bond and CDS credit spreads converge, a basis trade will capture approximately:", "opts": {"A": "50 bps by buying the bond and buying CDS protection.", "B": "50 bps by selling the bond and selling CDS protection.", "C": "350 bps by buying the bond and buying CDS protection."}, "ans": "A", "en": "Bond credit spread = 6.10% − 3.00% = 3.10% > CDS spread 2.60% (negative basis). Buy the (cheap) bond and buy (cheap) protection; on convergence the trade captures 50 bps.", "ko": "채권 credit spread = 6.10 − 3.00 = 3.10% > CDS 2.60% → negative basis → 채권 매수 + protection 매수, 수렴 시 50bp.", "why": {"B": "크기는 맞지만 방향이 반대입니다(positive basis일 때의 trade).", "C": "채권수익률에서 MRR을 빼지 않았습니다."}, "trap": "ECO M5 Q6·Q22·Q40을 결합한 변형: 크기(MRR 차감) + 방향(negative basis).", "f": "Basis = CDS spread − (Bond yield − MRR)", "orig": "변형 (ECO M5 Q6·Q22·Q40)", "src": "변형", "vig": null}, {"id": "VAR-M5-03", "module": 5, "tag": "CDS 청산 손익 – seller, spread 확대", "stem": "An investor sold $5 million of CDS protection. Since then, the reference entity's credit spread has widened from 150 bps to 250 bps, and the CDS duration is 4.0. If the investor closes the position now, the investor will most likely:", "opts": {"A": "monetize a gain of about $200,000.", "B": "monetize a loss of about $200,000.", "C": "monetize a loss of about $50,000."}, "ans": "B", "en": "The protection seller is long credit risk. Change in value ≈ −Δspread × duration × notional = −1.00% × 4.0 × $5,000,000 = $-200,000 (a loss).", "ko": "Seller = long credit. Spread 100bp 확대 → 손실 ≈ 1.00% × 4.0 × $5M = $200,000.", "why": {"A": "방향 오류: spread 확대는 seller에게 손실입니다.", "C": "Duration을 곱하지 않았습니다(1.00% × $5M)."}, "trap": "ECO M5 Q5·Q20 패턴: buyer/seller 방향 + duration 곱하기.", "f": "ΔValue(seller) ≈ −Δspread × Duration × Notional", "orig": "변형 (ECO M5 Q5·Q20·Q44)", "src": "변형", "vig": null}], "vignettes": ["Jane Nguyen is a senior bond trader for an investment bank, and Chris Alexander is a junior bond trader at the bank. Nguyen is responsible for her own trading activities and also for providing assignments to Alexander that will develop his skills and create profitable trade ideas. Exhibit 1 presents the current par and spot rates.\nExhibit 1\nCurrent Par and Spot Rates\nMaturity\tPar Rate\tSpot Rate\nOne year\t2.50%\t2.50%\nTwo years\t2.99%\t3.00%\nThree years\t3.48%\t3.50%\nFour years\t3.95%\t4.00%\nFive years\t4.37%\nNote: Par and spot rates are based on annual-coupon sovereign bonds.\nNguyen gives Alexander two assignments that involve researching various questions:\nAssignment 1: What is the yield-to-maturity of the option-free, default-risk-free bond presented in Exhibit 2? Assume that the bond is held to maturity, and use the rates shown in Exhibit 1. Exhibit 2Selected Data for $1,000 Par Bond\nBond Name\tMaturity (T)\tCoupon\nBond Z\tThree years\t6.00%\nNote: Terms are today for a T-year loan.\nAssignment 2: Assuming that the projected spot curve two years from today will be below the current forward curve, is Bond Z fairly valued, undervalued, or overvalued?\nAfter completing his assignments, Alexander asks about Nguyen’s current trading activities. Nguyen states that she has a two-year investment horizon and will purchase Bond Z as part of a strategy to ride the yield curve. Exhibit 1 shows Nguyen’s yield curve assumptions implied by the spot rates.", "Laura Mathews recently hired Robert Smith, an investment adviser at Shire Gate Advisers, to assist her in investing. Mathews states that her investment time horizon is short, approximately two years or less. Smith gathers information on spot rates for on-the-run annual-coupon government securities and swap spreads, as presented in Exhibit 1. Shire Gate Advisers recently published a report for its clients stating its belief that, based on the weakness in the financial markets, interest rates will remain stable, the yield curve will not change its level or shape for the next two years, and swap spreads will also remain unchanged.\nExhibit 1\nGovernment Spot Rates and Swap Spreads\nMaturity (years)\t1\t2\t3\t4\nGovernment spot rate\t2.25%\t2.70%\t3.30%\t4.05%\nSwap spread\t0.25%\t0.30%\t0.45%\t0.70%\nSmith decides to examine the following three investment options for Mathews:\nInvestment 1:\nBuy a government security that would have an annualized return that is nearly risk free. Smith is considering two possible implementations: a two-year investment or a combination of two one-year investments.\nInvestment 2:\nBuy a four-year, zero-coupon corporate bond and then sell it after two years. Smith illustrates the returns from this strategy using the swap rate as a proxy for corporate yields.\nInvestment 3:\nBuy a lower-quality, two-year corporate bond with a coupon rate of 4.15% and a Z-spread of 65 bps.\nWhen Smith meets with Mathews to present these choices, Mathews tells him that she is somewhat confused by the various spread measures. She is curious to know whether there is one spread measure that could be used as a good indicator of the risk and liquidity of money market securities during the recent past.", "Liz Tyo is a fund manager for an actively managed global fixed-income fund that buys bonds issued in Countries A, B, and C. She and her assistant are preparing the quarterly markets update. Tyo begins the meeting by distributing the daily rates sheet, which includes the current government spot rates for Countries A, B, and C as shown in Exhibit 1\nExhibit 1\nToday’s Government Spot Rates\nMaturity\tCountry A\tCountry B\tCountry C\nOne year\t0.40%\t–0.22%\t14.00%\nTwo years\t0.70\t–0.20\t12.40\nThree years\t1.00\t–0.12\t11.80\nFour years\t1.30\t–0.02\t11.00\nFive years\t1.50\t0.13\t10.70\nTyo asks her assistant how these spot rates were obtained. The assistant replies, “Spot rates are determined through the process of bootstrapping. It entails backward substitution using par yields to solve for zero-coupon rates one by one, in order from latest to earliest maturities.”\nTyo then provides a review of the fund’s performance during the last year and comments, “The choice of an appropriate benchmark depends on the country’s characteristics. For example, although Countries A and B have both an active government bond market and a swap market, Country C’s private sector is much bigger than its public sector, and its government bond market lacks liquidity.”\nTyo further points out, “The fund’s results were mixed; returns did not benefit from taking on additional risk. We are especially monitoring the riskiness of the corporate bond holdings. For example, our largest holdings consist of three four-year corporate bonds (Bonds 1, 2, and 3) with identical maturities, coupon rates, and other contract terms. These bonds have Z-spreads of 0.55%, 1.52%, and 1.76%, respectively.”\nTyo continues, “We also look at risk in terms of the swap spread. We considered historical three-year swap spreads for Country B, which reflect that market’s credit and liquidity risks, at three different points in time.” Tyo provides the information in Exhibit 2.\nExhibit 2\nSelected Historical Three-Year Rates for Country B\nPeriod\tGovernment Bond Yield (%)\tFixed-for-Floating MRR Swap (%)\n1 month ago\t–0.10\t0.16\n6 months ago\t–0.08\t0.01\n12 months ago\t–0.07\t0.71\nTyo then suggests that the firm was able to add return by riding the yield curve. The fund plans to continue to use this strategy but only in markets with an attractive yield curve for this strategy.\nShe moves on to present her market views on the respective yield curves for a five-year investment horizon.\nCountry A: “The government yield curve has changed little in terms of its level and shape during the last few years, and I expect this trend to continue. We assume that future spot rates reflect the current forward curve for all maturities.”\nCountry B: “Because of recent economic trends, I expect a reversal in the slope of the current yield curve. We assume that future spot rates will be higher than current forward rates for all maturities.”\nCountry C: “To improve liquidity,Country C’s central bank is expected to intervene, leading to a reversal in the slope of the existing yield curve. We assume that future spot rates will be lower than today’s forward rates for all maturities.”\nTyo’s assistant asks, “Assuming investors require liquidity premiums, how can a yield curve slope downward? What does this imply about forward rates?”\nTyo answers, “Even if investors require compensation for holding longer-term bonds, the yield curve can slope downward—for example, if there is an expectation of severe deflation. Regarding forward rates, it can be helpful to understand yield curve dynamics by calculating implied forward rates. To see what I mean, we can use Exhibit 1 to calculate the forward rate for a two-year Country C loan beginning in three years.”", "Rowan Madison is a junior analyst at Cardinal Capital. Sage Winter, a senior portfolio manager and Madison’s supervisor, meets with Madison to discuss interest rates and review two bond positions in the firm’s fixed-income portfolio.\nWinter begins the meeting by asking Madison to state her views on the term structure of interest rates. Madison responds:\n“Yields are a reflection of expected spot rates and risk premiums. Investors demand risk premiums for holding long-term bonds, and these risk premiums increase with maturity.”\nWinter tells Madison that, based on recent changes in spreads, she is concerned about a perceived increase in counterparty risk in the economy and its effect on the portfolio. Madison asks Winter:\n“Which spread measure should we use to assess changes in counterparty risk in the economy?”\nWinter is also worried about the effect of yield volatility on the portfolio. She asks Madison to identify the economic factors that affect short-term and long-term rate volatility. Madison responds:\n“Short-term rate volatility is mostly linked to uncertainty regarding monetary policy, whereas long-term rate volatility is mostly linked to uncertainty regarding the real economy and inflation.”\nFinally, Winter asks Madison to analyze the interest rate risk portfolio positions in a 5-year and a 20-year bond. Winter requests that the analysis be based on level, slope, and curvature as term structure factors. Madison presents her analysis in Exhibit 1.\nExhibit 1\nThree-Factor Model of Term Structure\nTime to Maturity (years)\nFactor\t5\t20\nLevel\t–0.4352%\t–0.5128%\nSteepness\t–0.0515%\t–0.3015%\nCurvature\t0.3963%\t0.5227%\nNote: Entries indicate how yields would change for a one standard deviation increase in a factor.\nWinter asks Madison to perform two analyses:\nAnalysis 1:\nCalculate the expected change in yield on the 20-year bond resulting from a two-standard-deviation increase in the steepness factor.\nAnalysis 2:\nCalculate the expected change in yield on the five-year bond resulting from a one-standard-deviation decrease in the level factor and a one-standard-deviation decrease in the curvature factor.", "Bill Akron is Director of Research at Cuyahoga Fixed Income Advisors. He has a large staff of research analysts and each year adds six new hires to the group. In addition to their regular work assignments, the analysts undergo formal training conducted by Akron. He plans to have six modules over the coming weeks each covering key fixed-income concepts. In each module, Akron starts out by outlining a lesson.\nModule 1:\n“A good place to start a fixed-income program is with a discussion of the yield curve and the information it conveys. This lesson will be theoretical in nature as we discuss interpretations of the term structure of interest rates. I want to present three theories that explain the shape of the yield curve. First is the pure expectations theory, which states that the forward rate is an unbiased predictor of the future spot rate. This theory assumes investors are affected by uncertainty and require a risk premium. Second is the liquidity preference theory, which postulates that investors are willing to take on more risk by investing in longer maturity bonds if they are paid a liquidity premium. Its explanation for an upward sloping yield curve, even if spot rates are expected to be unchanged, is the liquidity premium. A third explanation of the shape of the yield curve is the segmented markets theory, which says that yields are a function of supply and demand for funds in a specific maturity segment. This last theory is very similar to the preferred habitat theory and is premised on investors and borrowers having strong preferences for particular maturities.”\nModule 2:\n“Let’s use the term structure of interest rates to price bonds, and in particular, I want you to fully understand the relationships between spot and forward rates and yield to maturity. Use the data in Exhibit 1 to determine whether a 4% coupon Treasury bond, maturing in four years and offered by a dealer at a yield-to maturity of 7.89% is cheap (buy recommendation), fairly valued (hold recommendation), or rich (sell recommendation) based on arbitrage opportunities.”\nExhibit 1 Select Spot and Forward Rates\n \tYear 1\tYear 2\tYear 3\tYear 4\nSpot Rate\t0.055\t---\t---\t0.0825\nDiscount Factor\t---\t---\t0.8163\t---\nForward Rate f(2,1)\t---\t---\t0.0852\t---\nModule 3:\n“Today I want to go over techniques we use at Cuyahoga to add alpha to our active fixed-income strategies. Many of our portfolio managers like to use a portfolio management strategy called riding the yield curve. This strategy can enhance total return in two ways. First, it increases the yield of the portfolio by buying bonds with maturities longer than their investment horizon whenever the yield curve is upward sloping and expected to maintain the same level and whenever the shape and spot rates rise as predicted by forward rates. Second, even if interest rates increase unexpectedly, since the bonds roll down the yield curve, the bonds will appreciate in price.”\nModule 4:\n“Today I want to go over several spread measures used in fixed-income markets. The Z-spread provides a useful measure of risk for credit instruments such as corporate bonds. It uses the implied spot yield curve and adds the spread necessary to discount the bond’s cash flows and derive its current market price. The TED spread is used for the valuation of government bonds and is calculated as the difference between MRR and the yield on a T-bill of equal maturity. The MRR–OIS spread incorporates unsecured lending between banks. It serves as a good measure of the risk and liquidity of money market securities.”\nModule 5:\n“Swap rates are very useful in the valuation of bonds. I would like you to use the information in Exhibit 2 to value a bond, issued by AAA-rated European Supranational Bank (ESB), maturing in 3.86 years, with a coupon rate of 2.86% paid annually. Dealers are quoting the bond flat to swaps. Simple interpolation can be used to perform the calculations.”\nExhibit 2 Yield Measures at Various Maturities\nMaturity (Years)\t1\t2\t3\t4\t5\nOff the run Bund yield (%)\t0.25\t0.32\t0.46\t0.57\t0.66\nOn the run Bund yield (%)\t0.21\t0.27\t0.41\t0.5\t0.59\nSwap rate (%)\t0.81\t0.89\t1.05\t1.16\t1.27\nModule 6:\n“Consider a portfolio of zero-coupon bonds that mature at different times in the future. Changes in interest rates are not always parallel across maturities, so let’s analyze what happens as rates change across the yield curve. Let’s assume that the portfolio has sensitivities to factors as provided in Exhibit 3. The portfolio has equal weightings in each key rate duration and an effective duration of 4.7. I would like you to assess the impact on the return of the portfolio if rates rise evenly across the curve and also when the curve flattens but does not twist.”\nExhibit 3 Factor Movements per One Standard Deviation Shift and Portfolio Key Rate Durations\nYear\t5\t10\t30\nParallel\t1\t1\t1\nSteepness\t1\t0.5\t–1\nCurvature\t0.5\t0\t1\nKey rate curations\t1.8\t3.6\t8.7", "SCAI is a registered investment adviser based in Nashville, Tennessee, providing investment and private wealth management advice to endowments, retirement plans, and corporations. Dieter Klopp, a portfolio manager, is meeting with analysts Nabil Salah and Lisa Suarez to discuss fixed-income investment opportunities and portfolio management strategies. Klopp presents the group with the information on spot rates shown in Exhibit 1:\nExhibit 1 Spot Rates for Zero-Coupon Bonds\nMaturity (Years)\tSpot Rate\n1\t2.041%\n2\t2.598%\n3\t2.818%\n4\t2.956%\n5\t3.304%\nSalah is currently evaluating a corporate bond and makes the following statements:\n• Statement 1: “The value of a bond calculated by discounting its future cash flows by their corresponding spot rates will be the same as the value obtained by discounting future cash flows by the yield-to-maturity of a bond, as long as the yield-to-maturity is some weighted average of the spot rates.”\n• Statement 2: “Yield-to-maturity is a good estimate of the expected return on a bond assuming coupons are reinvested at the prevailing spot rates.”\n• Statement 3: “If the yield curve remains flat during the holding period, the realized rate of return on a bond will be the same as the expected rate of return.”\nSalah asks Klopp to explain the spot curve in Exhibit 1. Klopp responds that the spot rate curve in Exhibit 1 is derived from the par curve using a process called bootstrapping. The par rates are yields-to-maturity, at various maturities, for on-the-run, coupon-paying government bonds priced at par. Bootstrapping is a process of forward substitution, where successive spot rates are derived from par rates one at a time. The process begins with recognizing that the one-year spot rate is the same as the one-year par rate. The two-year spot rate, r(2), is then calculated by solving the following equation:\nPar Value= 2-year Par coupon(1+2)+2-year Par coupon+Par value(1+r(2))2.\nThis process continues until all spot rates are derived.\nKlopp then asks Suarez how the spot curve can be used in fixed-income analysis. Suarez responds, “Our expectations regarding the evolution of future spot rates compared to the forward curve allow for an evaluation of the relative value of a bond and the identification of appropriate bond trading strategies. Interest rate scenarios and corresponding appropriate strategies are outlined here”:\n• Scenario 1: If we expect future spot rates to be lower than current forward rates, then we should short the bond since it is likely to be overvalued.\n• Scenario 2: If the spot curve is expected to be above the forward curve and our expectations turn out to be correct, the bond should be purchased since the one-year return will be more than the one-year risk-free rate.\n• Scenario 3: If the yield curve is upward sloping and we expect it to remain static, then a strategy of buying bonds with maturities longer than the investment holding period will allow us to earn a return greater than a maturity matching strategy.", "GFC Advisory is a private independent investment firm that provides solutions and advice to individuals and institutions in the United States and internationally. Fernando Aguero is the director of research and is meeting with analysts Sergio Torres, Matteo Pochettino, and Karen Dengler to discuss the development of a research note that explains the role of the term structure of interest rates in fixed-income investment decision making.\nAguero asks the group to describe how traditional theories of the term structure of interest rates explain the shape of the yield curve as well as the relationship between forward rates and expected future spot rates. Each of the analysts responds as follows:\nDengler states that the unbiased expectations theory applies to risky and risk-free assets and maintains that forward rates are an unbiased predictor of expected future spot rates. This theory can explain an upward sloping or downward sloping yield curve.\nPochettino responds that under the liquidity preference theory, investors require a liquidity premium to lend over longer maturities. The theory states that forward rates are an upwardly biased estimate of expected future spot rates, and the yield curve will typically be upward sloping. A downward sloping yield curve is only possible if expected future spot rates decline by enough to offset the liquidity premium.\nTorres notes that according to the segmented markets theory, the shape of the yield curve is determined by supply and demand for funds at each maturity and that institutions will deviate from their preferred maturities if they are adequately compensated.\nAguero states there are modern theories of the term structure that offer more precise ways of describing the evolution of interest rates, specifically the Cox–Ingersoll–Ross (CIR) model, the Vasicek model, and the Ho–Lee model. He notes that all three models are structured similarly in that they have a drift term and a stochastic term. Aguero states the three models also assume that short-term interest rates converge to the long-term rate over time. He concludes by stating that while the CIR and Vasicek models assume constant interest rate volatility, the Ho–Lee model allows for interest rate volatility to increase with the level of interest rates.\nAguero notes that yield curve shaping risk is important in fixed-income portfolio management and asks for input on how this should be addressed in the research note. Dengler responds that our note should indicate three factors that describe yield curve movement: level, steepness, and curvature. The risk associated with these three factors can be measured using effective duration.\nTorres states the research note should also include a discussion of the impact of interest rate volatility on fixed-income portfolio management and makes the following statements:\n• Statement 1: “Interest rate volatility is an important consideration because it impacts the option values embedded in some fixed-income securities.”\n• Statement 2: “Long-term interest rates are typically more volatile than short-term interest rates.”\n• Statement 3: “Long-term interest rate volatility is linked to uncertainty regarding the real economy and inflation, whereas short-term interest rate volatility is related to uncertainty regarding monetary policy.", "Halstead Capital Advisors is an investment advisory firm that specializes in taxable fixed-income investing. Its clients consist of medium sized foundations and endowments who select outside managers such as Halstead after having formulated their investment policy and asset allocation targets.\nHalstead’s chief investment strategist, Charles Scott, and quantitative analyst, Catherine Bird, are meeting to discuss a research report that Bird is producing. The report will address various fixed-income investing topics, including investment strategies, credit spreads, and yield curve movements.\nBird is evaluating two US Treasury instruments. The first is a newly issued 7.00% coupon bond with a 5-year maturity issued at a price of $101.15 ($100.00 face value) with a yield to maturity of 6.72%. The second is newly issued zero-coupon bond with a 5-year maturity issued at a price of $71.30 ($100.00 face value) with a yield to maturity of 7.00%. Current US Treasury spot rates and extrapolated forward rates are provided in Exhibit 1. Bird expects that the future path of interest rates will follow that which is implied by the forward curve.\nExhibit 1 Spot and Forward Interest Rates\nMaturity (n)\tSpot rate r(n)\tOne-year forward rate n−1 years forward, f(n−1,1)\t(n−1)-year forward rate one year forward, f(1,n−1)\n1\t3.00%\t3.00%\t3.00%\n2\t4.00%\t5.01%\t5.01%\n3\t5.00%\t7.03%\t6.01%\n4\t6.00%\t9.06%\t7.02%\n5\t7.00%\t11.10%\t8.02%\nBird proposes to review other credit spread indicators that measure credit and liquidity risk for money market securities, general creditworthiness of individual debt issuers, and counterparty risk. Bird offers the following statements about measures of credit risk:\n• Statement 1: The TED spread represents the difference between MRR and overnight bank lending rates.\n• Statement 2: The MRR–OIS spread represents the difference between MRR and corporate bond spreads.\n• Statement 3: The Z spread represents the constant basis point spread that is added to the implied spot yield curve to measure the price of credit risky bonds.", "Katrina Black, a portfolio manager at Coral Bond Management, Ltd., is conducting a training session with Alex Sun, a junior analyst in the fixed-income department. Black wants to explain to Sun the arbitrage-free valuation framework used by the firm. Black presents Sun with Exhibit 1, showing a fictitious bond being traded on three exchanges, and asks Sun to identify the arbitrage opportunity of the bond. Sun agrees to ignore transaction costs in his analysis.\nExhibit 1\nThree-Year, €100 par, 3.00% Coupon, Annual Pay Option-Free Bond\n \tEurex\tNYSE Euronext\tFrankfurt\nPrice\t€103.7956\t€103.7815\t€103.7565\nBlack shows Sun some exhibits that were part of a recent presentation. Exhibit 3 presents most of the data of a binomial lognormal interest rate tree fit to the yield curve shown in Exhibit 2. Exhibit 4 presents most of the data of the implied values for a four-year, option-free, annual pay bond with a 2.5% coupon based on the information in Exhibit 3.\nExhibit 2\nYield-to-Maturity Par Rates for One-, Two-, and Three-Year Annual Pay Option-Free Bonds\nOne-year\tTwo-year\tThree-year\n1.25%\t1.50%\t1.70%\nExhibit 3\nBinomial Interest Rate Tree Fit to the Yield Curve (Volatility = 10%)\n[Exhibit 3 tree – description] Time 0: 1.2500%. Time 1: 1.8229% / 1.4925%. Time 2: 1.8280%, (node 2–2), 1.2254%. Time 3: 2.6241%, (node 3–2), 1.7590%, (node 3–4). Time 4: 4.2000%, 3.4300%, 2.8100%, (node 4–5). Some nodes are intentionally missing (Task 1 asks Sun to complete them).\nExhibit 4\nImplied Values (in Euros) for a 2.5%, Four-Year, Option-Free, Annual Pay Bond Based on Exhibit 3\n[Exhibit 4 – description] Time 0: 103.4960 (1.25%). Time 1: 101.7877 (1.8229%) and node 1–2 (1.4925%). Time 2: 100.7696 (1.8280%), 101.5168 (1.4967%), 102.1350 (1.2254%). Time 3: 99.8791 (2.6241%), 100.3442 (2.1484%), 100.7282 (1.7590%), 101.0449 (1.4401%). Time 4 values: 102.5.\nBlack asks about the missing data in Exhibits 3 and 4 and directs Sun to complete the following tasks related to those exhibits:\nTask 1\nTest that the binomial interest tree has been properly calibrated to be arbitrage free.\nTask 2\nDevelop a spreadsheet model to calculate pathwise valuations. To test the accuracy of the spreadsheet, use the data in Exhibit 3 and calculate the value of the bond if it takes a path of lowest rates in Year 1 and Year 2 and the second lowest rate in Year 3.\nTask 3\nIdentify a type of bond where the Monte Carlo calibration method should be used in place of the binomial interest rate method.\nTask 4\nUpdate Exhibit 3 to reflect the current volatility, which is now 15%.", "Betty Tatton is a fixed-income analyst with the hedge fund Sailboat Asset Management (SAM). SAM invests in a variety of global fixed-income strategies, including fixed-income arbitrage. Tatton is responsible for pricing individual investments and analyzing market data to assess the opportunity for arbitrage. She uses two methods to value bonds:\nMethod 1: Discount each year’s cash flow separately using the appropriate interest rate curve.\nMethod 2: Build and use a binomial interest rate tree.\nTatton compiles pricing data for a list of annual pay bonds (Exhibit 1). Each of the bonds will mature in two years, and Tatton considers the bonds risk-free; both the one-year and two-year benchmark spot rates are 2%. Tatton calculates the arbitrage-free prices and identifies an arbitrage opportunity to recommend to her team.\nExhibit 1\nMarket Data for Selected Bonds\nAsset\tCoupon\tMarket Price\nBond A\t1%\t98.0584\nBond B\t3%\t100.9641\nBond C\t5%\t105.8247\nNext, Tatton uses the benchmark yield curve provided in Exhibit 2 to consider arbitrage opportunities of both option-free corporate bonds and corporate bonds with embedded options. The benchmark bonds in Exhibit 2 pay coupons annually, and the bonds are priced at par.\nExhibit 2\nBenchmark Par Curve\nMaturity (years)\tYield-to-Maturity (YTM)\n1\t3.0%\n2\t4.0%\n3\t5.0%\nTatton then identifies three mispriced three-year annual coupon bonds and compiles data on the bonds (see Exhibit 3).\nExhibit 3\nMarket Data of Annual Pay Corporate Bonds\nCompany\tCoupon\tMarket Price\tYield\tEmbedded Option?\nHutto-Barkley Inc.\t3%\t94.9984\t5.6%\tNo\nLuna y Estrellas Intl.\t0%\t88.8996\t4.0%\tYes\nPeaton Scorpio Motors\t0%\t83.9619\t6.0%\tNo\nLastly, Tatton identifies two mispriced Swiss bonds, Bond X, a three-year bond, and Bond Y, a five-year bond. Both are 6% annual coupon bonds. To calculate the bonds’ values, Tatton devises the first three years of the interest rate lognormal tree presented in Exhibit 4 using historical interest rate volatility data. Tatton considers how these data would change if implied volatility, which is higher than historical volatility, were used instead.\nExhibit 4\nInterest Rate Tree—Forward Rates Based on Swiss Market\nTime 0\tTime 1\tTime 2\n1.00%\t4.00% (upper)\t6.00%\n\t2.00% (lower)\t5.00%\n\t\t3.00%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)", "Meredith Alvarez is a junior fixed-income analyst with Canzim Asset Management. Her supervisor, Stephanie Hartson, asks Alvarez to review the asset price and payoff data shown in Exhibit 1 to determine whether an arbitrage opportunity exists.\nExhibit 1\nPrice and Payoffs for Two Risk-Free Assets\nAsset\tPrice Today\tPayoff in One Year\nAsset A\t$500\t$525\nAsset B\t$1,000\t$1,100\nHartson also shows Alvarez data for a bond that trades in three different markets in the same currency. These data appear in Exhibit 2.\nExhibit 2\n2% Coupon, Five-Year Maturity, Annual Pay Bond\n \tNew York\tHong Kong SAR\tMumbai\nYield-to-Maturity\t1.9%\t2.3%\t2.0%\nHartson asks Alvarez to value two bonds (Bond C and Bond D) using the binomial tree in Exhibit 3. Exhibit 4 presents selected data for both bonds.\nExhibit 3\nBinomial Interest Rate Tree with Volatility = 25%\nTime 0\tTime 1\tTime 2\n1.500%\t2.8853%\t2.7183%\n\t1.7500%\t1.6487%\n\t\t1.0000%\nExhibit 4\nSelected Data on Annual Pay Bonds\nBond\tMaturity\tCoupon Rate\nBond C\t2 years\t2.5%\nBond D\t3 years\t3.0%\nHartson tells Alvarez that she and her peers have been debating various viewpoints regarding the conditions underlying binomial interest rate trees. The following statements were made in the course of the debate.\nStatement 1: The only requirements needed to create a binomial interest rate tree are current benchmark interest rates and an assumption about interest rate volatility.\nStatement 2: Potential interest rate volatility in a binomial interest rate tree can be estimated using historical interest rate volatility or observed market prices from interest rate derivatives.\nStatement 3: A bond value derived from a binomial interest rate tree with a relatively high volatility assumption will be different from the value calculated by discounting the bond’s cash flows using current spot rates.\nBased on data in Exhibit 5, Hartson asks Alvarez to calibrate a binomial interest rate tree starting with the calculation of implied forward rates shown in Exhibit 6.\nExhibit 5\nSelected Data for a Binomial Interest Rate Tree\nMaturity\tPar Rate\tSpot Rate\n1\t2.5000%\t2.5000%\n2\t3.5000%\t3.5177%\nExhibit 6\nTime 0\tTime 1\n2.500%\t5.8365%\n\t? (lower one-period forward rate)\nHartson mentions pathwise valuations as another method to value bonds using a binomial interest rate tree. Using the binomial interest rate tree in Exhibit 3, Alvarez calculates the possible interest rate paths for Bond D shown in Exhibit 7.\nExhibit 7\nInterest Rate Paths for Bond D\nPath\tTime 0\tTime 1\tTime 2\n1\t1.500%\t2.8853%\t2.7183%\n2\t1.500\t2.8853\t1.6487\n3\t1.500\t1.7500\t1.6487\n4\t1.500\t1.7500\t1.0000\nBefore leaving for the day, Hartson asks Alvarez about the value of using the Monte Carlo method to simulate a large number of potential interest rate paths to value a bond. Alvarez makes the following statements.\nStatement 4: Increasing the number of paths increases the estimate’s statistical accuracy.\nStatement 5: The bond value derived from a Monte Carlo simulation will be closer to the bond’s true fundamental value.", "Keisha Jones is a junior analyst at Sparling Capital. Julie Anderson, a senior partner and Jones’s manager, meets with Jones to discuss interest rate models used for the firm’s fixed-income portfolio.\nAnderson begins the meeting by asking Jones to describe features of equilibrium and arbitrage-free term structure models. Jones responds by making the following statements:\nStatement 1: Equilibrium term structure models are factor models that use the observed market prices of a reference set of financial instruments, assumed to be correctly priced, to model the market yield curve.\nStatement 2: In contrast, arbitrage-free term structure models seek to describe the dynamics of the term structure by using fundamental economic variables that are assumed to affect interest rates.\nAnderson then asks Jones about her preferences concerning term structure models. Jones states:\nI prefer arbitrage-free models. Even though equilibrium models require fewer parameters to be estimated relative to arbitrage-free models, arbitrage-free models allow for time-varying parameters. In general, this allowance leads to arbitrage-free models being able to model the market yield curve more precisely than equilibrium models.", "Susan Fujioka, a fixed-income portfolio manager at Desna Securities, hires Ahti Maalouf, an independent contractor who is an expert in fixed-income valuation. Fujioka provides him with copies of the spreadsheets she currently uses for valuation. She asks him to help her build models that will allow her to more accurately identify mispriced securities.\nAt their first meeting, Maalouf notes that Fujioka currently values option-free bonds by discounting their future expected cash flows using the zero-coupon yield curve. He asks her why she has not adopted the more flexible binomial interest rate tree framework. She replies, “My approach will calculate the same values for option-free bonds as those produced by a properly calibrated binomial tree. Furthermore, it would require special programming techniques to calibrate a binomial tree to match benchmark risk-free bond prices, making implementation of that approach quite costly.”\nMaalouf explains, “Valuation using a binomial interest rate tree is based on the principle of no arbitrage. In order for there to be no arbitrage in a financial market, three conditions must be met:\n• Condition 1: If the risk of any security is higher than that of another, its expected return must also be higher.\n• Condition 2: The price of any two risk-free securities with the same timing and amount of payoffs must be the same.\n• Condition 3: The price of any portfolio of securities must equal the sum of the prices of the individual securities in the portfolio.\"\nMaalouf provides Fujioka with the zero-coupon yield curve in Exhibit 1 and asks her to use her current approach to calculate the arbitrage-free value of an option-free, fixed-rate, four-year bond with a 3.5% coupon rate, annual payments, and a face value of 100.\nExhibit 1 Zero-Coupon Yield Curve\nMaturity\tYield\n1\t2.15%\n2\t3.45\n3\t4.01\n4\t4.4\nUsing a different set of benchmark bond values, Maalouf constructs the calibrated binomial interest rate tree shown in Exhibit 2. He shows Fujioka how to value a three-year, option-free, fixed-rate bond with a 2.8% coupon rate, annual payments, and a face value of 100 using this interest rate tree.\nExhibit 2 Calibrated Binomial Interest Rate Tree\nToday\tYear 1\tYear 2\tYear 3\n1.50%\t2.85%\t4.56%\t6.76%\n\t2.16%\t3.45%\t5.11%\n\t\t2.60%\t3.86%\n\t\t\t2.92%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nMaalouf explains, “An alternative to the calculations I just showed you is pathwise valuation. In this variation, you would determine all the possible paths interest rates could take in our binomial tree and value the bond along each path. The value of the bond is then calculated as the average of the values across all paths. For the four-year bond you evaluated earlier, you would need to calculate its value for 24, or 16, different paths.”\nFujioka tells Maalouf that she has been reading about the use of Monte Carlo forward-rate simulation for fixed-income valuation. She asks Maalouf to further explain this approach to her. Maalouf replies, “The Monte Carlo approach is quite different from the binomial tree approach I have been describing to you. Some of these differences include the following:\n• Difference 1: The Monte Carlo approach does not require calibration, whereas the binomial tree approach does.\n• Difference 2: The Monte Carlo approach is typically used when cash flows are path dependent, whereas the binomial tree approach only allows one expected cash flow per node, regardless of the path of interest rates.\n• Difference 3: The Monte Carlo approach randomly simulates a fixed number of interest rate paths and values the security only across those paths, whereas the binomial tree approach values the security across all possible interest rate paths on the tree.", "Davis Zhang is a fixed-income analyst at Arbitrage Partners, a hedge fund focusing on global macro arbitrage opportunities. The fixed-income team focuses on securities issued in developing markets that trade in multiple world financial centers. Zhang is conducting a training session for a new analyst, John Holly.\nZhang explains: “Our fixed-income team focuses on constructing a portfolio of fixed-income securities issued in local markets that trade in multiple markets around the world. We seek out securities we believe to be mispriced and identify these using an arbitrage-free approach to valuation, which can be described as follows. The cash flows of any fixed-income security can be thought of as a package of separate zero-coupon bonds. Each zero-coupon bond in such a package is valued separately at a discount rate corresponding to the interest rate on the yield curve at the time of the cash flow.\nWhen the present values of the coupon payments are summed and added to the present value of the principal payment at maturity, the result should equal the current price of the bond. In order to calculate the arbitrage-free value of a bond, we determine the future coupon and principal payments for the bond. If the yield curve is positively sloped, the appropriate interest rate used to discount each cash flow will be different. However, in the event the yield curve is flat, all cash flows will be discounted in the same manner as in the traditional approach to valuing bonds.”\nHolly comments: “Last year, South Africa issued multiple two-year and four-year Green Bonds denominated in US dollars with annual coupons. The four-year bonds were callable, while the two-year bonds had no embedded options.\nI recall an example of an arbitrage opportunity of the two-year bonds trading in different global financial centers. The benchmark yield curve, bond coupon rates, and bond prices are shown in Exhibits 1 and 2.”\nExhibit 1 Benchmark Interest Rates\nMaturity (years)\tCoupon Rate\tSpot Rate\t1-Year Implied Forward Rate\n1\t5.00%\t5%\t5.00% (current)\n2\t5.97%\t6%\t7.01%\n3\t6.91%\t7%\t9.03%\n4\t7.81%\t8%\t11.06%\nExhibit 2 Bond Price Quotes\nMarket\tCoupon Rate\tQuoted Price\nDubai\t1%\t90.842\nShanghai\t2%\t92.684\nNew York\t4%\t94.630\nZhang adds: “While your example represents good practice, we also need to be able to value bonds with embedded options where expected cash flows of bonds with options change depending on the path of future interest rates. We typically construct an interest rate tree as a visual representation of the paths of future interest rates, with the average of possible future values being centered on the current yield curve. The following three steps can be employed to construct an interest rate tree for valuing a particular bond:\n• Step 1: Using prices of the benchmark bonds, determine the current par curve.\n• Step 2: Estimate interest rate volatility, and calculate the potential paths of future rates.\n• Step 3: Starting with the current market price, calculate each successive node’s value.”\nThe interest rate tree must then be calibrated to fit the actual yield curve while being consistent with an underlying interest rate model.”\nHolly states: “I believe the iterative process must involve a trial-and-error search to determine the higher and lower rates subsequent to each node in the tree, which branches out from an average yield centered on the forward rate curve. The rates must also be consistent with an assumption of log-normality, the volatility assumption, and the observed market value of the bond being evaluated.”", "Laurent Wenger is a portfolio manager in the fixed-income division of WPC Capital Management (WPCM), based in Charlotte, North Carolina. WPCM seeks to identify and exploit fixed-income market inefficiencies. Wenger is meeting with analysts Zhong Geng, Irene Goll, and Rakesh Tandon to evaluate securities for inclusion in WPCM’s US Core Bond portfolio.\nWenger asks the group to determine the arbitrage-free value of an option-free bond issued by ECWI Corporation that matures in four years and pays an annual coupon of 1.25% on a face amount of $100. This bond is priced to yield 2.241%. To assist with the analysis, Wenger presents the group with the following interest rate information in Exhibits 1 and 2.\nExhibit 1 Benchmark Spot Rates (Zero-Coupon Yield Curve)\nMaturity (Years)\tSpot Rate\n1\t1.550%\n2\t1.822%\n3\t2.241%\n4\t2.614%\nExhibit 2 One-Year Implied Forward Rates\nMaturity (Years)\tOne-Year Forward Rate\nCurrent one-year rate\t1.550%\nOne year forward\t2.096%\nTwo years forward\t3.084%\nThree years forward\t3.742%\nZhong asks, “Are there other ways to calculate the arbitrage-free value of a bond?” Goll responds, “Yes, the arbitrage-free value of a bond can also be calculated using a binomial interest rate tree, such as the one in Exhibit 3 below, where the interest rate tree provides a representation of how one-year forward rates evolve based on an interest rate model that identifies factors with predictable paths, an interest rate volatility assumption, and where forward rates on the tree are consistent with the current benchmark yield curve.”\nWenger asks the group to use the binomial interest rate tree in Exhibit 3 to calculate the arbitrage-free value of a three-year option-free bond issued by BIR Corporation. This bond pays an annual coupon of 1.75% on a face amount of $100.\nExhibit 3 Three-Year Binomial Interest Rate Tree\nTime 0\tTime 1\tTime 2\n1.55%\t2.41%\t4.08%\n\t1.78%\t3.02%\n\t\t2.24%\n(Each column lists the one-year forward rates at that date, from the highest node to the lowest. Up and down moves are equally likely.)\nWenger asks, “Would you get the same value for the BIR Corporation bond if you used the spot rates from Exhibit 1?”\nGeng responds: “Yes, if the volatility assumed in the one-year implied forward rates in Exhibit 1 matches the volatility assumed in the binomial tree.”\nGoll responds: “No, because the binomial interest rate tree in Exhibit 3 provides multiple paths for the evolution of interest rates, whereas the spot rates in Exhibit 1 do not allow for rates to follow multiple paths.”\nTandon responds: “Yes, but only if the binomial interest rates in Exhibit 3 are calibrated to match the term structure of interest rates in Exhibit 1 so that they produce the correct benchmark bond values.”\nWenger presents the group with a third bond to evaluate. Issued by the NIAA Corporation, this bond matures in three years and has an embedded option that allows it to be called in two years. The bond pays an annual coupon of 2.5% on a face amount of $100. Wenger asks the group to identify appropriate methods to calculate the arbitrage-free value for this bond. Geng responds, “The arbitrage-free value of this bond can be calculated using the benchmark spot rate curve (zero-coupon yield curve), the binomial interest rate tree, or the Monte Carlo method.”\nTandon asks Geng how pathwise valuation compares with the Monte Carlo method. Geng responds with the following statements:\n• Statement 1: “Pathwise valuation calculates the present value of the bond’s cash flows for each possible interest rate path, whereas the Monte Carlo method calculates present values for randomly selected interest rate paths.”\n• Statement 2: “Interest rate paths for both the pathwise valuation and the Monte Carlo method are based on an assumption of interest rate volatility and an interest rate model that is calibrated to the current benchmark term structure of interest rates.”\n• Statement 3: “In pathwise valuation, a constant is added to all interest rate paths so that the resulting present value for each benchmark bond is equal to its market value. No such adjustment is made in the Monte Carlo method.”", "Sandy Annisquam is the head of trading at Wingaersheek Arbitrage Opportunities, LLP, a hedge fund specializing in fixed-income strategies. The firm’s investment approach is to exploit small price differences across similar or identical securities. Annisquam has asked Choate Hake to develop a comprehensive automated trading system that will allow traders to identify opportunitie
