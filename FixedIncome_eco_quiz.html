ed"}, "ans": "A", "en": "(A) Correct because the conversion price and conversion ratio need to be adjusted when the issuer splits stocks. Corporate actions—such as stock splits, bonus share issuances, and rights or warrants issuances—affect a company’s share price and may reduce the benefit of conversion for the convertible bondholders. Thus, the terms of issuance of the convertible bond contain detailed information defining how the conversion price and conversion ratio are adjusted should such a corporate action occur during the life of the bond. For example, suppose an issuer performs a 2-for-1 stock split. The conversion price would need to be adjusted down (to half) and the conversion ratio would need to be adjusted up (to double).\n(B) Incorrect because both the conversion price and conversion ratio need to be adjusted. Corporate actions—such as stock splits, bonus share issuances, and rights or warrants issuances—affect a company’s share price and may reduce the benefit of conversion for the convertible bondholders. Thus, the terms of issuance of the convertible bond contain detailed information defining how the conversion price and conversion ratio are adjusted should such a corporate action occur during the life of the bond.\n(C) Incorrect because both the conversion price and conversion ratio need to be adjusted. Corporate actions—such as stock splits, bonus share issuances, and rights or warrants issuances—affect a company’s share price and may reduce the benefit of conversion for the convertible bondholders. Thus, the terms of issuance of the convertible bond contain detailed information defining how the conversion price and conversion ratio are adjusted should such a corporate action occur during the life of the bond.", "ko": "주식분할·주식배당·권리 발행 등은 주가에 영향을 주므로, 전환사채 조건에 따라 전환가격은 낮추고 전환비율은 높입니다. 예: 2:1 분할 → 전환가격 1/2, 전환비율 2배.", "trap": "전환가격 × 전환비율 = par → 하나를 바꾸면 다른 하나도 반비례로 조정.", "f": "", "why": {"B": "전환비율도 조정해야 합니다(2:1 분할 → 2배).", "C": "전환가격도 조정해야 합니다(2:1 분할 → 1/2)."}, "orig": "ECO Module 3 Q89"}, {"id": "ECO-M3-Q20", "src": "ECO 관련유형", "module": 3, "tag": "Floater effective duration ≈ 다음 리셋까지 기간", "vig": 18, "stem": "The effective duration of Bond #6 is:", "opts": {"A": "close to 1.", "B": "higher than 1 but lower than 3.", "C": "higher than 3."}, "ans": "A", "en": "A is correct. The effective duration of a floating-rate bond is close to the time to next reset. As the reset for Bond #6 is annual, the effective duration of this bond is close to 1.", "ko": "변동금리채(매년 리셋, in arrears)의 effective duration ≈ 다음 리셋까지의 시간 = 약 1년. 만기(3년)는 보지 않습니다.", "trap": "연 1회 리셋 ≈ 1, 반기 ≈ 0.5, 분기 ≈ 0.25 — 만기 무관.", "f": "ED(floater) ≈ time to next reset", "why": {"B": "만기나 남은 쿠폰 수를 반영한 값입니다. Floater duration은 리셋 주기로 결정.", "C": "고정금리채처럼 만기 기준으로 생각한 값입니다."}, "orig": "ECO Module 3 Q20"}, {"id": "ECO-M3-Q33", "src": "ECO 관련유형", "module": 3, "tag": "Threshold dividend → 전환가격 하향 조정", "vig": 19, "stem": "Based on Exhibit 3, if DeLille Enterprises pays the dividend expected by Gillette, the conversion price of the DE bond will:", "opts": {"A": "be adjusted downward.", "B": "not be adjusted.", "C": "be adjusted upward."}, "ans": "A", "en": "A is correct. The conversion price would be adjusted downward because Gillette’s expected dividend payment of €0.70 is greater than the threshold dividend of €0.50.", "ko": "예상 배당 €0.70 > threshold dividend €0.50 → 전환가격 하향(= 전환비율 상향) 조정. 전환사채 보유자는 배당을 못 받는데 배당으로 주가만 떨어지므로 보상하는 조항입니다.", "trap": "Threshold 초과 배당 → conversion price ↓, conversion ratio ↑. Change of control conversion price도 같은 보호 성격.", "f": "Conversion ratio = Par / Conversion price", "why": {"B": "배당이 threshold를 초과하므로 조정됩니다.", "C": "배당은 보유자에게 불리 → 보호를 위해 전환가격을 '낮춥니다'."}, "orig": "ECO Module 3 Q33"}, {"id": "ECO-M3-Q48", "src": "ECO 관련유형", "module": 3, "tag": "Curve flattening → callable·putable 모두 straight 대비 열위", "vig": 22, "stem": "If interest rates change as described in Scenario 2, it is most likely that Bond A:", "opts": {"A": "and Bond B will rise but less rapidly than the straight bond.", "B": "and Bond B will rise but more rapidly than the straight bond.", "C": "will rise less rapidly than the straight bond and Bond B will rise more rapidly than the straight bond."}, "ans": "A", "en": "(A) Correct. All else being equal, as the yield curve flattens, the value of the call option embedded in Bond A increases. Thus, although the value of Bond A increases, the increase is partially offset by the increase in the value of the call option. Therefore, Bond A does not increase as much as the straight bond. As the yield curve flattens, the value of the put option embedded in Bond B declines because opportunities for the investor to put the bond decline. Bond B will increase as the yield curve declines but not as much as the straight bond.\n(B) Incorrect. All else being equal, as the yield curve flattens the value of the call option embedded in Bond A increases. Thus, although the value of Bond A increases, the increase is partially offset by the increase in the value of the call option. Therefore, Bond A does not increase as much as the straight bond. As the yield curve flattens, the value of the put option embedded in Bond B declines because opportunities for the investor to put the bond decline. Bond B will increase as the yield curve declines but not as much as the straight bond.\n(C) Incorrect. All else being equal, as the yield curve flattens the value of the call option embedded in Bond A increases. Thus, although the value of Bond A increases, the increase is partially offset by the increase in the value of the call option. Therefore, Bond A does not increase as much as the straight bond. As the yield curve flattens, the value of the put option embedded in Bond B declines because opportunities for the investor to put the bond decline. Bond B will increase as the yield curve declines but not as much as the straight bond.", "ko": "Scenario 2: 단기↑·장기↓(flattening). 채권 가격은 주로 장기금리가 좌우하므로 straight·A·B 모두 가격 상승. 그러나 flattening → call 가치↑(A 상승 제한), put 가치↓(B 상승 제한) → 둘 다 straight보다 '덜' 오릅니다.", "trap": "1단계: 가격 방향(장기금리) → 상승. 2단계: straight 대비 → flattening이면 callable·putable 모두 열위. 노트 표의 '하락'은 'straight 대비 상대적 하락'으로 읽을 것.", "f": "Flattening: V_call ↑, V_put ↓", "why": {"B": "flattening은 call 가치를 올리고 put 가치를 낮춰 두 채권 모두 straight보다 불리합니다.", "C": "Putable B도 put 가치 하락으로 straight보다 덜 오릅니다."}, "orig": "ECO Module 3 Q48"}, {"id": "ECO-M3-Q71", "src": "ECO 관련유형", "module": 3, "tag": "Upward curve → call 위험 감소", "vig": null, "stem": "In a zero volatility environment with an upward sloping yield curve, the risk of a callable bond valued near par being called most likely:", "opts": {"A": "decreases over time.", "B": "remains the same over time.", "C": "increases over time."}, "ans": "A", "en": "(A) Correct because with an upward sloping yield curve, forward rates increase faster than spot and par rates. As forward rates rise, the discount rate used to value the bond also rises and reduces the bonds value, and consequently, call risk. When the yield curve is upward sloping, the one-period forward rates on the interest rate tree are high and opportunities for the issuer to call the bond are fewer. When the yield curve flattens or inverts, many nodes on the tree have lower forward rates that increase the opportunities to call.\n(B) Incorrect because call risk is reduced over time due to the higher discount factor resulting from an upward sloping yield curve.\n(C) Incorrect because call risk is reduced over time due to the higher discount factor resulting from an upward sloping yield curve.", "ko": "상승 커브에서는 트리의 1기간 forward rate가 높아 call 행사 기회가 적어집니다 → 시간이 지날수록 call 위험 감소. 커브가 flatten/역전되면 call 기회 증가.", "trap": "M3 Q16·Q76과 같은 개념: 상승 커브 → call 불리, put 유리.", "f": "", "why": {"B": "forward가 상승하므로 call 위험은 변합니다.", "C": "증가는 flat/역전 커브의 경우."}, "orig": "ECO Module 3 Q71"}, {"id": "ECO-M3-Q74", "src": "ECO 관련유형", "module": 3, "tag": "One-sided duration – callable", "vig": null, "stem": "A 10-year bond is priced at 100 and is currently callable at par. Compared to its one-sided down-duration, this bond's one-sided up-duration is most likely:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "C", "en": "(A) Incorrect because the bond is more sensitive to interest rate increases than interest rate decreases because of the call feature. The one-sided up-duration is higher than the one-sided down-duration confirms that the callable bond is more sensitive to interest rate rises than to interest rate declines.\n(B) Incorrect because the bond is more sensitive to interest rate increases than interest rate decreases because of the call feature. The one-sided up-duration is higher than the one-sided down-duration confirms that the callable bond is more sensitive to interest rate rises than to interest rate declines.\n(C) Correct because the bond is more sensitive to interest rate increases than interest rate decreases because of the call feature. The one-sided up-duration is higher than the one-sided down-duration confirms that the callable bond is more sensitive to interest rate rises than to interest rate declines.", "ko": "Par에 callable인 채권은 금리 하락 시 가격이 call price 근처로 제한되어 하방 duration(금리↓)이 작고, 금리 상승에는 더 민감 → one-sided up-duration > down-duration.", "trap": "Callable: up-duration > down-duration. Putable: down-duration > up-duration.", "f": "", "why": {"A": "callable은 금리 상승에 더 민감합니다.", "B": "옵션 때문에 비대칭입니다."}, "orig": "ECO Module 3 Q74"}, {"id": "ECO-M3-Q75", "src": "ECO 관련유형", "module": 3, "tag": "Shape 변화(steepening) → key rate duration", "vig": null, "stem": "If an investor believes that the yield curve will steepen significantly over the near term, which of the following duration measures is most appropriate for analyzing the risk of fixed-income securities?", "opts": {"A": "Key rate duration", "B": "Effective duration", "C": "One-sided duration"}, "ans": "A", "en": "(A) Correct because using key rate durations (also known as partial durations), which reflect the sensitivity of the bond’s price to changes in specific maturities on the benchmark yield curve. Thus, key rate durations help portfolio managers and risk managers identify the \"shaping risk\" for bonds—that is, the bond’s sensitivity to changes in the shape of the yield curve (e.g., steepening and flattening).\n(B) Incorrect because effective duration is calculated by assuming parallel shifts in the benchmark yield curve, not changes in the shape of the yield curve.\n(C) Incorrect because one-sided duration is a subset of effective duration. Effective duration is calculated by assuming parallel shifts in the benchmark yield curve, not changes in the shape of the yield curve. One-sided durations—that is, the effective durations when interest rates go up or down—are better at capturing the interest rate sensitivity of a callable or putable bond than the (two-sided) effective durations, particularly when the embedded option is near the money.", "ko": "커브 모양 변화(steepening·flattening)에 대한 민감도 = shaping risk → key rate(partial) duration으로 측정.", "trap": "M1 Q56(shaping risk 측정)과 같은 축: effective duration은 shaping risk 측정 불가.", "f": "", "why": {"B": "Effective duration은 평행이동 가정입니다.", "C": "One-sided duration은 상·하 평행이동의 비대칭만 봅니다."}, "orig": "ECO Module 3 Q75"}, {"id": "ECO-M3-Q82", "src": "ECO 관련유형", "module": 3, "tag": "변동성↑ → putable 가치↑, callable 가치↓", "vig": null, "stem": "All else being equal, an increase in interest rate volatility increases the value of:", "opts": {"A": "a putable bond only.", "B": "a callable bond only.", "C": "both a putable bond and a callable bond."}, "ans": "A", "en": "(A) Correct because as interest rate volatility increases, the value of the putable bond increases.\n(B) Incorrect because as interest rate volatility increases, the value of the callable bond decreases.\n(C) Incorrect because as interest rate volatility increases, the value of the callable bond decreases.", "ko": "변동성↑ → 모든 옵션 가치↑. Putable(투자자 long put) 가치↑, Callable(투자자 short call) 가치↓.", "trap": "M3 Q15 오답과 동일 개념.", "f": "", "why": {"B": "callable은 변동성↑에 가치가 '하락'합니다.", "C": "callable은 하락하므로 둘 다 증가하지 않습니다."}, "orig": "ECO Module 3 Q82"}, {"id": "ECO-M3-Q84", "src": "ECO 관련유형", "module": 3, "tag": "Negative convexity – callable", "vig": null, "stem": "Which of the following bonds is most likely to exhibit negative convexity?", "opts": {"A": "A putable bond", "B": "A callable bond", "C": "An option-free bond"}, "ans": "B", "en": "(A) Incorrect because putable bonds always have positive convexity.\n(B) Correct because the effective convexity of the callable bond turns negative when the call option is near the money.\n(C) Incorrect because an option-free bond exhibits low positive convexity.", "ko": "Callable bond는 call이 near the money일 때 negative effective convexity. Putable은 항상 positive, option-free는 작은 positive.", "trap": "Negative convexity = callable (그리고 MBS).", "f": "", "why": {"A": "Putable은 항상 positive convexity.", "C": "Option-free는 positive convexity."}, "orig": "ECO Module 3 Q84"}, {"id": "ECO-M3-Q87", "src": "ECO 관련유형", "module": 3, "tag": "금리 하락 시 ED 감소 → callable", "vig": null, "stem": "If the effective duration of a bond decreases significantly when interest rates fall, the bond is most likely a(n):", "opts": {"A": "putable bond.", "B": "callable bond.", "C": "option-free bond."}, "ans": "B", "en": "(A) Incorrect because the effective duration of a putable bond decreases significantly when interest rates start to rise. When interest rates rise the put option moves into the money, which limits the price depreciation of the putable bond and shortens its effective duration.\n(B) Correct because the effective duration of the callable bond shortens when interest rates fall, which is when the call option moves into the money and thus limits the price appreciation of the callable bond.\n(C) Incorrect because when interest rates fall, the effective duration of an option-free bond slightly increases. The effective duration of an option-free bond changes very little in response to interest rate movements.", "ko": "금리 하락 → call이 ITM → 가격 상승 제한 → callable의 ED가 크게 짧아짐.", "trap": "M3 Q45 오답과 같은 개념: 어떤 금리 방향에서 어떤 옵션이 ITM인지.", "f": "", "why": {"A": "Putable의 ED는 금리 '상승' 시 짧아집니다.", "C": "Option-free ED는 금리 변화에 크게 변하지 않습니다(하락 시 약간 증가)."}, "orig": "ECO Module 3 Q87"}, {"id": "ECO-M3-Q93", "src": "ECO 관련유형", "module": 3, "tag": "Convertible 최소가치", "vig": null, "stem": "In an arbitrage-free framework, the minimum value of a convertible bond is equal to the:", "opts": {"A": "value of an otherwise similar straight bond.", "B": "the lower of the value of the straight bond and the conversion value.", "C": "the higher of the value of the straight bond and the conversion value."}, "ans": "C", "en": "(A) Incorrect because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond.\n(B) Incorrect because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond.\n(C) Correct because the minimum value of a convertible bond is equal to the greater of the conversion value and the value of the underlying option-free bond.", "ko": "전환사채 최소가치 = max(straight bond 가치, 전환가치).", "trap": "Floor = max(straight, conversion value).", "f": "Min V_CB = max(V_straight, CR × S)", "why": {"A": "straight value만이 아니라 전환가치와 비교한 더 큰 값.", "B": "더 작은 값이 아니라 더 큰 값."}, "orig": "ECO Module 3 Q93"}, {"id": "ECO-M3-Q96", "src": "ECO 관련유형", "module": 3, "tag": "변동성↑ → OAS (callable↓, putable↑)", "vig": null, "stem": "Which of the following best explains how interest rate volatility effects an option-adjusted spread (OAS)? As interest volatility increases:", "opts": {"A": "the OAS for both a callable bond and a putable bond increases.", "B": "the OAS for a callable bond decreases and the OAS for a putable bond increases.", "C": "the OAS for a callable bond increases and the OAS for a putable bond decreases."}, "ans": "B", "en": "(A) Incorrect because as interest rate volatility increases, the OAS for the callable bond decreases.\n(B) Correct because as interest rate volatility increases, the OAS for the callable bond decreases. Also, higher interest rate volatility means a higher likelihood of an option being exercised and therefore a higher value for the embedded option in the putable bond. For a putable bond, because the value of the put option is added to the value of the straight bond to obtain the value of the putable bond, a higher value for the put option leads to a higher value for the putable bond. The average cash flow in the binomial tree is therefore higher as well in a high volatility environment. Higher cash flows need to be discounted at higher rates to match the quoted market price. As a result, high volatility means a higher OAS for a putable bond.\n(C) Incorrect because as interest rate volatility increases, the OAS for the callable bond decreases.", "ko": "변동성↑: callable의 OAS 감소, putable의 OAS 증가.", "trap": "M3 Q72 오답과 동일 개념.", "f": "", "why": {"A": "callable OAS는 감소합니다.", "C": "방향이 반대입니다."}, "orig": "ECO Module 3 Q96"}, {"id": "VAR-M3-01", "module": 3, "tag": "Effective duration 계산", "stem": "A callable bond has a current full price of 101.20. Using a calibrated tree, its value is 102.00 if the benchmark curve shifts down by 25 bps and 100.10 if the curve shifts up by 25 bps. The bond's effective duration is closest to:", "opts": {"A": "1.88.", "B": "3.75.", "C": "7.51."}, "ans": "B", "en": "ED = (PV− − PV+)/(2 × ΔCurve × PV0) = (102.00 − 100.10)/(2 × 0.0025 × 101.20) = 3.75.", "ko": "ED = (102.00 − 100.10)/(2 × 0.0025 × 101.20) = 1.90/0.506 = 3.75.", "why": {"A": "분모에 2를 한 번 더 곱한(또는 ΔCurve를 50bp로 쓴) 오류입니다.", "C": "분모의 '2'를 빠뜨렸습니다."}, "trap": "ECO M3 Q22 패턴: 분모 2 × ΔCurve × PV0.", "f": "ED = (PV− − PV+)/(2 × ΔCurve × PV0)", "orig": "변형 (ECO M3 Q22)", "src": "변형", "vig": null}, {"id": "VAR-M3-02", "module": 3, "tag": "Market conversion premium ratio", "stem": "A $1,000 par convertible bond has a conversion price of $40.00 and trades at $980. The underlying share price is $36.00. The market conversion premium ratio is closest to:", "opts": {"A": "8.00%.", "B": "8.16%.", "C": "8.89%."}, "ans": "C", "en": "Conversion ratio = 1,000/40 = 25. Market conversion price = 980/25 = $39.20. Premium per share = 39.20 − 36.00 = $3.20. Premium ratio = 3.20/36.00 = 8.89%.", "ko": "전환비율 = 25, 시장전환가격 = 39.20, 프리미엄/주 = 3.20, 비율 = 3.20/36.00(현재 주가) = 8.89%.", "why": {"A": "전환가격(40)으로 나눴습니다. 분모는 현재 주가.", "B": "시장전환가격(39.20)으로 나눴습니다. 분모는 현재 주가."}, "trap": "ECO M3 Q64와 같은 분모 함정.", "f": "Premium ratio = (CB price/CR − S)/S", "orig": "변형 (ECO M3 Q64)", "src": "변형", "vig": null}, {"id": "VAR-M3-03", "module": 3, "tag": "변동성↓ → OAS (putable)", "stem": "All else equal, if the interest rate volatility assumed in the binomial tree is lowered, the OAS computed for a putable bond at its current market price will most likely:", "opts": {"A": "decrease.", "B": "remain unchanged.", "C": "increase."}, "ans": "A", "en": "Lower volatility reduces the value of the embedded put, lowering the model value of the putable bond. A smaller spread is then needed to equate the model value to the market price, so the OAS decreases.", "ko": "변동성↓ → put 가치↓ → putable 모형가치↓ → 시장가격에 맞추려면 더 작은 spread 필요 → OAS↓. (callable은 반대: 변동성↓ → OAS↑)", "why": {"B": "OAS는 변동성 가정에 의존합니다.", "C": "증가는 callable bond의 경우입니다."}, "trap": "ECO M3 Q72·Q96을 '변동성 감소 + putable'로 뒤집은 변형.", "f": "σ↑: OAS_call ↓, OAS_put ↑  (σ↓는 반대)", "orig": "변형 (ECO M3 Q72, Schweser LOS 25.h)", "src": "변형", "vig": null}, {"id": "ECO-M4-Q1", "src": "ECO 오답", "module": 4, "tag": "Expected exposure", "vig": 25, "stem": "The expected exposure to default loss for Bond I is:", "opts": {"A": "less than the expected exposure for Bond II.", "B": "the same as the expected exposure for Bond II.", "C": "greater than the expected exposure for Bond II."}, "ans": "B", "en": "B is correct. The expected exposure is the projected amount of money that an investor could lose if an event of default occurs, before factoring in possible recovery. The expected exposure for both Bond I and Bond II is 100 + 5 = 105.", "ko": "Expected exposure = 부도 발생 시 회수 전에 잃을 수 있는 금액(투자자에게 지급될 예정 금액). Bond I·II 모두 1년 만기, 쿠폰 5% → 100 + 5 = 105로 동일. 회수율·생존율 차이는 exposure가 아니라 LGD·PD에 반영됩니다.", "trap": "Exposure(회수 전) ≠ LGD(회수 후 손실) ≠ Expected loss(× PD).", "f": "LGD = Exposure × (1 − RR),  EL = LGD × PD", "why": {"A": "회수율(40% vs 35%)이나 생존율 차이는 exposure에 영향을 주지 않습니다. exposure는 '회수 전' 금액.", "C": "Bond I이 회수율이 높아도 exposure는 동일(105)합니다."}, "orig": "ECO Module 4 Q1"}, {"id": "ECO-M4-Q3", "src": "ECO 오답", "module": 4, "tag": "부도 고려 기대 미래가치", "vig": 25, "stem": "Based on Exhibit 1, the expected future value of Bond I at maturity is closest to:", "opts": {"A": "98.80.", "B": "103.74.", "C": "105.00."}, "ans": "B", "en": "B is correct. In the event of no default, the investor is expected to receive 105. In the event of a default, the investor is expected to receive 105 – [105 × (1 – 0.40)] = 42. The expected future value of the bond is, therefore, the weighted average of the no-default and default amounts, or (105 × 0.98) + (42 × 0.02) = 103.74.", "ko": "무부도 시 105 수령(확률 98%). 부도 시 회수 = 105 × 40% = 42 (확률 2%). 기대 미래가치 = 105 × 0.98 + 42 × 0.02 = 103.74.", "trap": "기대값 = Σ(시나리오 수령액 × 확률). 부도 시나리오 수령액 = exposure × 회수율.", "f": "E[FV] = Exposure × (1 − PD) + Exposure × RR × PD", "why": {"A": "98.80 = 100 × 0.98 + 40 × 0.02 → 쿠폰 5를 빼고 액면 100만으로 계산한 값입니다. 만기 수령액은 105(원금 + 쿠폰), 부도 시 105 × 40% = 42.", "C": "105.00은 부도 가능성을 무시한 값입니다."}, "orig": "ECO Module 4 Q3"}, {"id": "ECO-M4-Q6", "src": "ECO 오답", "module": 4, "tag": "신용등급 변화 → 가격변화 (duration × Δspread)", "vig": 25, "stem": "Based on Exhibit 3, if Bond IV’s credit rating changes during the next year to an A rating, its expected price change would be closest to:", "opts": {"A": "–8.00%.", "B": "–7.35%.", "C": "–3.15%."}, "ans": "C", "en": "C is correct. The expected percentage price change is the product of the negative of the modified duration and the difference between the credit spread in the new rating and the old rating:\nExpected percentage price change = –4.2 × (0.0175 – 0.01) = –0.0315, or –3.15%.", "ko": "AA → A: spread 1.00% → 1.75%. %ΔP ≈ −ModDur × Δspread = −4.2 × (0.0175 − 0.0100) = −3.15%.", "trap": "Δspread = 새 등급 spread − 기존 등급 spread. 전이확률은 '기대' 수익률 계산에서만 곱함.", "f": "%ΔP ≈ −ModDur × (s_new − s_old)", "why": {"A": "−8.00%는 전이확률(8%)을 가격변화로 착각한 값입니다. 문제는 '등급이 A로 바뀌었을 때'의 가격변화입니다.", "B": "−7.35%는 새 spread 1.75%만 사용(−4.2 × 1.75%)한 값. spread의 '변화분'을 써야 합니다."}, "orig": "ECO Module 4 Q6"}, {"id": "ECO-M4-Q7", "src": "ECO 오답", "module": 4, "tag": "Reduced-form vs Structural model", "vig": 25, "stem": "Kreming’s suggested model for Bond IV is a:", "opts": {"A": "structural model.", "B": "reduced-form model.", "C": "term structure model."}, "ans": "B", "en": "B is correct. A reduced-form model in credit risk analysis uses historical variables, such as financial ratios and macroeconomic variables, to estimate the default intensity. A structural model for credit risk analysis, in contrast, uses option pricing and relies on a traded market for the issuer’s equity.", "ko": "재무비율(레버리지, ROA)과 거시변수로 default intensity를 추정 → reduced-form model. Structural model은 옵션가격결정 이론을 쓰며 주식 시장가격(자산가치)에 의존합니다.", "trap": "'관측 가능한 변수(재무비율·거시) + 회귀' → reduced-form. '옵션·자산가치·default barrier' → structural.", "f": "", "why": {"A": "Structural model은 자산가치·변동성·부채(default barrier)로 옵션 접근. 회귀분석 변수 기반이 아닙니다.", "C": "Term structure model은 금리 모형(CIR, Vasicek 등)이지 신용위험 모형이 아닙니다."}, "orig": "ECO Module 4 Q7"}, {"id": "ECO-M4-Q8", "src": "ECO 오답", "module": 4, "tag": "Actual vs Risk-neutral default probability", "vig": 25, "stem": "Which of Kreming’s observations regarding actual and risk-neutral default probabilities is correct?", "opts": {"A": "Only Observation 1", "B": "Only Observation 2", "C": "Both Observation 1 and Observation 2"}, "ans": "B", "en": "B is correct. Observation 1 is incorrect, but Observation 2 is correct. The actual default probabilities do not include the default risk premium associated with the uncertainty in the timing of the possible default loss. The observed spread over the yield on a risk-free bond in practice does include liquidity and tax considerations, in addition to credit risk.", "ko": "Observation 1 틀림: 부도 '시점' 불확실성에 대한 default risk premium은 actual(과거) 부도확률이 아니라 risk-neutral 확률에 포함됩니다(risk-neutral > actual). Observation 2 맞음: 관측 spread에는 신용위험 외에 유동성·세금 요소도 포함됩니다.", "trap": "Risk-neutral PD > Actual PD (차이 = default risk premium + 유동성·세금).", "f": "", "why": {"A": "Observation 1은 틀렸습니다. actual 확률에는 default risk premium이 없습니다.", "C": "Observation 1이 틀렸으므로 둘 다 맞을 수 없습니다."}, "orig": "ECO Module 4 Q8"}, {"id": "ECO-M4-Q12", "src": "ECO 오답", "module": 4, "tag": "부도 시나리오 실현수익률 (IRR)", "vig": 26, "stem": "The market price of Bond B2 is €1,090. If the bond is purchased at this price and there is a default on Date 3, the rate of return to the bond buyer would be closest to:\n[Note from the previous question's CVA table (flat 3% curve, RR = 30%): recovery on Date 3 = €326.74.]", "opts": {"A": "–28.38%.", "B": "–41.72%.", "C": "–69.49%."}, "ans": "A", "en": "A is correct. Solve for IRR: €1,090 = €60/(1 + IRR) + €60/(1 + IRR)^2 + €326.74/(1 + IRR)^3, where €60 is the coupon received at Dates 1 and 2 and €326.74 is the recovery at Date 3 (from the CVA table). IRR = −28.38%.", "ko": "Date 1·2에 쿠폰 60씩 받고 Date 3에 부도 → 회수액 326.74(= Date 3 exposure 1,089.13 × 30%). 1,090 = 60/(1+r) + 60/(1+r)² + 326.74/(1+r)³ → IRR = −28.38%.", "trap": "부도 시점 이전 쿠폰은 받음. 부도일에는 '회수액'만 (쿠폰 별도 X — exposure에 이미 포함).", "f": "Price = Σ CF_t/(1+IRR)^t,  Recovery_t = Exposure_t × RR", "why": {"B": "정답 현금흐름(CF0 = −1,090, CF1 = 60, CF2 = 60, CF3 = 326.74)의 IRR은 −28.38%입니다. −41.72%는 이 현금흐름과 맞지 않습니다.", "C": "−69.49%는 쿠폰 수령분과 3년의 기간을 제대로 반영하지 않은 값입니다. IRR은 CF0 = −1,090, 60, 60, 326.74로 계산합니다."}, "orig": "ECO Module 4 Q12"}, {"id": "ECO-M4-Q13", "src": "ECO 오답", "module": 4, "tag": "Rating migration → 기대수익률 조정", "vig": 26, "stem": "Bond B3 will have a modified duration of 2.75 at the end of the year. Based on the representative one-year corporate transition matrix in Exhibit 4 and assuming no default, how should the analyst adjust the bond’s yield to maturity to assess the expected return on the bond over the next year?\nExhibit 4 Representative One-Year Corporate Transition Matrix (entries are in %)\nFrom/To\tAAA\tAA\tA\tBBB\tBB\tB\tCCC, CC, C\tD\nAAA\t90.00\t9.00\t0.60\t0.15\t0.10\t0.10\t0.05\t0.00\nAA\t1.50\t88.00\t9.50\t0.75\t0.15\t0.05\t0.03\t0.02\nA\t0.05\t2.50\t87.50\t8.40\t0.75\t0.60\t0.12\t0.08\nBBB\t0.02\t0.30\t4.80\t85.50\t6.95\t1.75\t0.45\t0.23\nBB\t0.01\t0.06\t0.30\t7.75\t79.50\t8.75\t2.38\t1.25\nB\t0.00\t0.05\t0.15\t1.40\t9.15\t76.60\t8.45\t4.20\nCCC, CC, C\t0.00\t0.01\t0.12\t0.87\t1.65\t18.50\t49.25\t29.60\nCredit Spread\t0.60%\t0.90%\t1.10%\t1.50%\t3.40%\t6.50%\t9.50%\t", "opts": {"A": "Add 7.7 bps to YTM.", "B": "Subtract 7.7 bps from YTM.", "C": "Subtract 9.0 bps from YTM."}, "ans": "B", "en": "B is correct. For each possible transition, the expected percentage price change, computed as the product of the modified duration and the change in the spread as shown in Exhibit 4 (relating to question 5), is calculated as follows:\nFrom AA to AAA: –2.75 × (0.60% – 0.90%) = +0.83%.\nFrom AA to A: –2.75 × (1.10% – 0.90%) = –0.55%.\nFrom AA to BBB: –2.75 × (1.50% – 0.90%) = –1.65%.\nFrom AA to BB: –2.75 × (3.40% – 0.90%) = –6.88%.\nFrom AA to B: –2.75 × (6.50% – 0.90%) = –15.40%.\nFrom AA to C: –2.75 × (9.50% – 0.90%) = –23.65%.\nThe expected percentage change in the value of the AA rated bond is computed by multiplying each expected percentage price change for a possible credit transition by its respective transition probability given in Exhibit 4 and summing the products:\n(0.0150 × 0.83%) + (0.8800 × 0%) + (0.0950 × –0.55%) + (0.0075 × –1.65%) + (0.0015 × –6.88%) + (0.0005 × –15.40%) + (0.0003 × –23.65%)= –0.0774%.\nTherefore, the expected return on the bond over the next year is its YTM minus 0.0774%, assuming no default.", "ko": "B3는 AA. 각 전이별 %ΔP = −2.75 × (s_new − 0.90%): AAA +0.83%, A −0.55%, BBB −1.65%, BB −6.88%, B −15.40%, C −23.65%. 확률가중 합 = 0.015(0.83) + 0.095(−0.55) + 0.0075(−1.65) + 0.0015(−6.88) + 0.0005(−15.40) + 0.0003(−23.65) = −0.0774% → YTM에서 7.7bp 차감.", "trap": "① AA 행 사용(B3 = AA) ② 등급 유지(88%)는 0% ③ Default(D) 열은 '무부도 가정'이므로 제외.", "f": "E[%ΔP] = Σ p_i × [−ModDur × (s_i − s_0)],  E[R] = YTM + E[%ΔP]", "why": {"A": "하향 전이 시 spread 확대가 상향 시 축소보다 크고(비대칭) 하향 확률도 높아 기대 가격변화는 음(−)입니다. 더하는 것이 아닙니다.", "C": "정확한 확률가중 합은 −7.74bp(≈ −7.7bp)입니다. 9.0bp는 AA 행 전체 전이(상향 포함)를 정확히 가중하지 않은 값입니다."}, "orig": "ECO Module 4 Q13"}, {"id": "ECO-M4-Q15", "src": "ECO 오답", "module": 4, "tag": "Structural vs Reduced-form – 정보 요구", "vig": 26, "stem": "In the presentation, Lok is asked why the research team chose to use a reduced-form credit model instead of a structural model. Which statement is he likely to make in reply?", "opts": {"A": "Structural models are outdated, having been developed in the 1970s; reduced-form models are more modern, having been developed in the 1990s.", "B": "Structural models are overly complex because they require the use of option pricing models, whereas reduced-form models use regression analysis.", "C": "Structural models require “inside” information known to company management, whereas reduced-form models can use publicly available data on the firm."}, "ans": "C", "en": "C is correct. Structural models require information best known to the managers of the company. Reduced-form models require information only generally available in financial markets.\nA is incorrect because although it is literally true, when the models were developed is immaterial. Structural models are currently used in practice by commercial banks and credit rating agencies.\nB is incorrect because computer technology facilitates valuation using option pricing models as well as regression analysis.", "ko": "Structural model은 경영진이 가장 잘 아는 '내부' 정보(자산가치, 부채구조 등)를 필요로 하고, reduced-form model은 금융시장에서 공개적으로 얻을 수 있는 정보만으로 됩니다.", "trap": "Structural 약점 = 데이터(자산가치, 비공개 부채) 확보 어려움.", "f": "", "why": {"A": "개발 시기는 무관합니다. Structural model은 현재도 은행·신평사가 실무에서 씁니다.", "B": "컴퓨터로 옵션가격모형도 회귀분석도 쉽게 계산 가능 → 복잡성은 핵심 이유가 아닙니다."}, "orig": "ECO Module 4 Q15"}, {"id": "ECO-M4-Q17", "src": "ECO 오답", "module": 4, "tag": "Credit spread over 동일 쿠폰 가상 국채", "vig": 26, "stem": "Ibarra wants to know the credit spread of Bond B2 over a theoretical comparable-maturity government bond with the same coupon rate as this bond. The foregoing credit spread is closest to:\n[Note from the previous question's solution (Ibarra's 20% volatility tree): fair value of B2 = €1,101.24; value of B2 assuming no default (VND) = €1,144.63.]", "opts": {"A": "108 bps.", "B": "101 bps.", "C": "225 bps."}, "ans": "A", "en": "A is correct. YTM of B2 from fair value €1,101.24 (IRR of 60, 60, 60, 1,060) = 3.26%. YTM of a theoretical 6% government bond priced at VND €1,144.63 = 2.18%. Credit spread = 3.26% − 2.18% = 1.08% = 108 bps.\nB is the spread over the four-year government par bond (2.25%): 101 bps. C is the YTM of the four-year government bond.", "ko": "B2 YTM: 1,101.24 = 60/(1+r) + 60/(1+r)² + 60/(1+r)³ + 1,060/(1+r)⁴ → 3.26%. 같은 6% 쿠폰 가상 국채(VND 1,144.63) YTM → 2.18%. Credit spread = 3.26% − 2.18% = 1.08% = 108 bps.", "trap": "'Same coupon theoretical government bond' → VND(무부도 가치)의 YTM과 비교.", "f": "Credit spread = YTM(fair value) − YTM(VND)", "why": {"B": "101 bps는 4년 국채 par bond YTM(2.25%) 대비 spread입니다. 문제는 '같은 쿠폰'의 가상 국채 대비 spread.", "C": "225 bps는 4년 국채 par bond의 YTM 자체입니다."}, "orig": "ECO Module 4 Q17"}, {"id": "ECO-M4-Q33", "src": "ECO 오답", "module": 4, "tag": "Credit score vs Credit rating", "vig": 27, "stem": "Are Hastings’s comments regarding credit scores and credit ratings most likely correct?", "opts": {"A": "Yes.", "B": "No, he is incorrect with regard to credit scores.", "C": "No, he is incorrect with regard to credit ratings."}, "ans": "A", "en": "(A) Correct. Hastings’s comments regarding both credit scores and credit ratings are correct.\n(B) Incorrect because Hastings is correct regarding credit scores.\n(C) Incorrect because Hastings is correct regarding credit ratings.", "ko": "Hastings 설명 모두 맞음. Credit score: 소비자·소기업 대상, 부도확률 중심, 부정적 정보만 쓰거나 다양한 요인 혼합. Credit rating: 회사채·국채·ABS 대상, 부도확률 중심이며 notching으로 LGD(청구권 순위)를 반영.", "trap": "Notching = issue rating을 청구권 순위에 따라 조정 → LGD 반영.", "f": "", "why": {"B": "Credit score 설명(소비자·소기업, PD 중심)은 정확합니다.", "C": "Credit rating 설명(notching으로 LGD 반영)도 정확합니다."}, "orig": "ECO Module 4 Q33"}, {"id": "ECO-M4-Q34", "src": "ECO 오답", "module": 4, "tag": "Rating migration → 1년 기대수익률", "vig": 27, "stem": "Assuming no change in market conditions and a flat yield curve and using Exhibit 2, the expected return on Cromwell’s sample bond over a one-year horizon is closest to:", "opts": {"A": "–1.73%.", "B": "3.28%.", "C": "6.73%."}, "ans": "B", "en": "(A) Incorrect because it does not consider the coupon payment: 3.275% – 5.00% = –1.725%.\n(B) Correct. The bond is expected to be downgraded from A+ to A–. The G-spread is expected to widen from 0.85% to 1.10% based on market pricing. The expected return over a one-year horizon is, therefore,\n[–Duration × (New spread – Initial spread)] + Annual Coupon =\n[–6.9 × (1.10% – 0.85%)] + 5.00% = 3.275%.\n(C) Incorrect because it uses the wrong sign for duration—that is, +6.9 instead of –6.9: [+6.9 × (1.10% – 0.85%)] + 5.00% = 6.725%.", "ko": "A+ → A−(2 notch 하락): G-spread 0.85% → 1.10%. 기대수익률 = 쿠폰 + [−Duration × Δspread] = 5.00% + [−6.9 × 0.25%] = 5.00% − 1.725% = 3.275% ≈ 3.28%.", "trap": "Notch 세기(A+ → A → A−), 쿠폰 포함, 부호(−Duration).", "f": "E[R] ≈ Coupon (or YTM) − ModDur × Δspread", "why": {"A": "−1.73%는 쿠폰 수익(5%)을 빼먹은 값입니다. 총수익 = 이자수익 + 가격변화.", "C": "6.73%는 duration 부호를 +로 쓴 값입니다. spread 확대는 가격 '하락'."}, "orig": "ECO Module 4 Q34"}, {"id": "ECO-M4-Q35", "src": "ECO 오답", "module": 4, "tag": "Structural model 장단점", "vig": 27, "stem": "Cromwell is least likely correct with regard to which aspect of structural models?", "opts": {"A": "The strengths", "B": "The description", "C": "The weaknesses"}, "ans": "A", "en": "(A) Correct. Cromwell is incorrect regarding the strengths of structural models. The necessary data are not always readily available. There are limitations in available data, such as debt that is not disclosed, making it difficult to measure the default barrier. Structural models also assume that the company’s assets trade in markets and have observable market values, which is not a realistic assumption.\n(B) Incorrect because the description of structural models is correct.\n(C) Incorrect because the weaknesses of structural models is correct.", "ko": "Cromwell은 structural model의 '강점'을 잘못 말했습니다. 회사 자산의 시장가치 같은 데이터는 쉽게 구할 수 없고(비공개 부채 등), 자산이 시장에서 거래된다는 가정도 비현실적입니다. 정의(옵션 비유)와 약점(구현 부담, default barrier 측정 어려움)은 맞습니다.", "trap": "Structural 강점: '왜' 부도나는지 설명. 약점: 데이터(자산가치) 비관측·자산 비거래.", "f": "E_T = max(A_T − K, 0)", "why": {"B": "Equity = 자산에 대한 long call(행사가 = 부채 액면) — 설명이 맞습니다.", "C": "약점 설명(구현 부담, default barrier 측정 어려움)은 맞습니다."}, "orig": "ECO Module 4 Q35"}, {"id": "ECO-M4-Q36", "src": "ECO 오답", "module": 4, "tag": "Reduced-form model 약점", "vig": 27, "stem": "Thames is least likely correct with regard to which aspect of reduced-form models?", "opts": {"A": "The strengths", "B": "The description", "C": "The weaknesses"}, "ans": "C", "en": "(A) Incorrect because the strengths of reduced-form models is correct.\n(B) Incorrect because the description of reduced-form models is correct.\n(C) Correct. Thames is incorrect regarding the weaknesses of reduced-form models. A key disadvantage of these models is that they assume default comes as a 'surprise' and can occur at any time. She is correct in stating that a weakness of reduced-form models is that they do not explain the reason for default.", "ko": "Thames는 reduced-form의 '약점'에서 '부도가 정해진 시점에 발생한다고 가정'이라 했는데 틀렸습니다. Reduced-form은 부도가 '예고 없이(surprise) 언제든' 발생한다고 가정합니다. 부도 원인을 설명 못 한다는 부분은 맞습니다.", "trap": "Reduced-form: default = 외생적(exogenous), 언제든 surprise. 'defined point in time'은 오답.", "f": "", "why": {"A": "강점(경기순환 반영, 관측가능 입력값)은 정확합니다.", "B": "설명(제약이 적은 가정, 회귀분석으로 default intensity 추정)은 정확합니다."}, "orig": "ECO Module 4 Q36"}, {"id": "ECO-M4-Q38", "src": "ECO 오답", "module": 4, "tag": "Spread 결정요인 – recovery rate", "vig": 28, "stem": "The difference in credit spreads between Wong’s expectation in his model and the actual spread observed after Echo bond's downgrade is most likely due to the market assuming a higher:", "opts": {"A": "recovery rate.", "B": "loss given default.", "C": "credit valuation adjustment."}, "ans": "A", "en": "(A) Correct. Wong has observed a lower credit spread than predicted. Smaller credit spreads indicate that risk-averse investors require less compensation for uncertainty. A higher assumed recovery rate would be a factor for a lower spread, while a higher loss given default or higher CVA would imply a higher credit spread.\n(B) Incorrect because a higher assumed loss given default would be a sign of a higher default (and credit) risk and results in a higher instead of a lower credit spread.\n(C) Incorrect because the credit valuation adjustment (CVA) is the sum of present values of expected losses and a higher CVA would result in a higher instead of a lower credit spread.", "ko": "관측 spread가 모형 예측보다 작음 → 시장이 위험을 덜 크게 본다는 뜻. 더 높은 회수율을 가정하면 LGD·CVA가 낮아져 spread가 작아집니다.", "trap": "RR↑ → LGD↓ → CVA↓ → spread↓.", "f": "Credit spread ≈ PD × LGD = PD × (1 − RR)", "why": {"B": "LGD가 높으면 신용위험↑ → spread '확대'.", "C": "CVA(기대손실의 현재가치)가 높으면 spread '확대'."}, "orig": "ECO Module 4 Q38"}, {"id": "ECO-M4-Q39", "src": "ECO 오답", "module": 4, "tag": "ABS – SPE와 자금조달비용", "vig": 28, "stem": "Regarding Wong's comments on the auto ABS, he is most likely correct on:", "opts": {"A": "both financing costs and investor preferences.", "B": "investor preferences, but incorrect on financing costs.", "C": "financing costs, but incorrect on investor preferences."}, "ans": "B", "en": "(A) Incorrect, because while Wong is correct with respect to investor preferences, he is incorrect with respect to financing costs.\n(B) Correct because while Wong is correct with respect to investor preferences, he is incorrect with respect to financing costs. Investors, however, seek to benefit from greater diversification, more stable and predictable underlying cash flows, and a return that is greater than that of securities with similar ratings, which provide a reward for accepting the greater complexity associated with collateralized debt. The isolation of securitized assets in a special purpose entity generally decreases the relative financing cost for these assets on a stand-alone basis as compared to a general obligation financing of the debt originator.\n(C) Incorrect, because while Wong is correct with respect to investor preferences, he is incorrect with respect to financing costs.", "ko": "Wong은 투자자 선호(분산, 안정적 현금흐름, 동일 등급 대비 높은 수익)에 대해서는 맞고, 조달비용에 대해서는 틀렸습니다. 자산을 SPE로 격리(bankruptcy remote)하면 원보유자(originator)의 일반 채무보다 조달비용이 '낮아'집니다.", "trap": "SPE 격리 → 신용위험 분리 → 조달비용 ↓.", "f": "", "why": {"A": "SPE가 조달비용을 높인다는 부분이 틀렸습니다.", "C": "투자자 선호 설명은 맞고, 조달비용 설명이 틀렸습니다(반대)."}, "orig": "ECO Module 4 Q39"}, {"id": "ECO-M4-Q42", "src": "ECO 오답", "module": 4, "tag": "Credit spread = YTM(FV) − YTM(VND)", "vig": 29, "stem": "The credit spread of Bond 2 is closest to:", "opts": {"A": "150 bps.", "B": "156 bps.", "C": "160 bps."}, "ans": "A", "en": "(A) Correct because the YTM can be calculated by solving the following equation for IRR:\nFV = VND – CVA = $953.82 – $67.81 = $886.01\n$886.01 = $1,000 / (1+IRR)^5\nThe solution to this equation is 2.45%.\nValuation assuming no default is $953.82, its YTM is calculated by solving the following equation for IRR:\nVND = $953.82 = $1,000 / (1+IRR)^5\nThe solution to this equation is 0.95%. Therefore, the credit spread of Bond 2 is 2.45% – 0.95% = 1.50%, or 150 bps.\n(B) Incorrect because it calculated the credit spread using market value (MV) instead of VND in the calculation. Consequently, the YTM is calculated by solving the following equation for IRR: MV – CVA = $923.70 – $67.81 = $855.89\n$855.89 = $1,000 / (1+IRR)^5\nThe solution to this equation is 3.16%.\nMV is $923.70, its YTM is calculated by solving the following equation for IRR:\nMV = $923.70 = $1,000 / (1+IRR)5. The solution to this equation is 1.60%.\nTherefore, the credit spread of Bond 2 is 3.16% – 1.60% = 1.56%, or 156 bps.\n(C) Incorrect because it calculated the credit spread solely based on MV instead of VND and CVA. Consequently, the YTM is calculated by solving the following equation for IRR: MV = $923.70 = $1,000 / (1+IRR)5. The solution to this equation is 1.60%.", "ko": "공정가치 FV = VND − CVA = 953.82 − 67.81 = 886.01 → YTM: (1,000/886.01)^(1/5) − 1 = 2.45%. VND 953.82 → YTM 0.95%. Credit spread = 2.45% − 0.95% = 1.50% = 150 bps.", "trap": "Credit spread 계산엔 '시장가'가 아니라 VND와 FV(VND − CVA)를 사용.", "f": "FV = VND − CVA,  Spread = YTM(FV) − YTM(VND)", "why": {"B": "156 bps는 VND 대신 시장가(MV 923.70)를 기준으로 계산한 값입니다(MV − CVA 등).", "C": "160 bps는 MV의 YTM(1.60%)만으로 계산한 값입니다. Credit spread는 FV(=VND − CVA)와 VND 각각의 YTM 차이."}, "orig": "ECO Module 4 Q42"}, {"id": "ECO-M4-Q45", "src": "ECO 오답", "module": 4, "tag": "Benchmark yield(거시) vs Spread(미시) 결정요인", "vig": 30, "stem": "Based on Bank’s strategy report, what should River conclude regarding the direction of benchmark yields and spreads over the benchmark yield, respectively? Yields and spreads, respectively, most likely will be:", "opts": {"A": "higher and wider.", "B": "lower and narrower.", "C": "higher and narrower."}, "ans": "A", "en": "(A) Correct. The strategy report describes conditions that should result in higher benchmark yields and wider spreads over the benchmark yield. Benchmark bond yields capture the macroeconomic factors affecting all debt securities, such as expected inflation rate and the expected real rate of return, and the uncertainty regarding those variables. Rising wages and higher commodity prices would drive inflation higher thus pushing the benchmark yield up. The spread over the benchmark bond yield captures the microeconomic factors that pertain to the corporate issuer and the specific issue itself, such as the expected loss due to default, and other factors, like liquidity. Credit rating migration from year to year is a concern even for investment-grade corporate bonds. Bank notes the deteriorating economic environment that is resulting in downgrade risk, which would cause spreads to widen. Note the various components of a corporate bond yield outlined in the reading for reference.\n(B) Incorrect because inflation would drive higher benchmark yields, not lower and wider spreads and not narrower over the benchmark yield due to rising expected inflation.\n(C) Incorrect because rising expected inflation would drive wider spreads, not narrower, over the benchmark yield.", "ko": "임금·원자재 상승 → 인플레이션 기대↑ → 벤치마크 수익률↑(거시). 경기 악화로 신평사 전망 부정적·딜러 재고 축소(유동성↓) → 등급하향 위험 → spread 확대(미시·유동성). 결론: 수익률 상승 + spread 확대.", "trap": "벤치마크 = 거시(인플레·실질금리), spread = 발행사·종목 요인(EL, 유동성).", "f": "Corporate yield = Benchmark (real rate + inflation) + Spread (EL + liquidity + …)", "why": {"B": "인플레이션 압력은 벤치마크 수익률을 '올립니다'.", "C": "등급하향 위험·딜러 대차대조표 축소는 spread를 '확대'시킵니다."}, "orig": "ECO Module 4 Q45"}, {"id": "ECO-M4-Q50", "src": "ECO 오답", "module": 4, "tag": "Credit rating 방법론 특징", "vig": 31, "stem": "Is Belmar’s explanation of credit rating methodology characteristics most likely correct?", "opts": {"A": "Yes.", "B": "No, with regard to his first characteristic.", "C": "No, with regard to his second characteristic."}, "ans": "A", "en": "(A) Correct. Belmar asks Lake to develop a credit rating system that has the same characteristics as those used by the public rating agencies but that maintains the ability to more actively reflect new information flow. The characteristics he describes in both statements are correct with regard to outside rating agencies.\n(B) Incorrect, as the statement is correct.\n(C) Incorrect, as the statement is correct.", "ko": "Belmar가 말한 두 특징 모두 신평사 방법론과 일치: ① 서수적(ordinal) 등급, PD 중심, 발행자·개별 발행물에 적용, 전망(outlook) 제시 ② LGD 차이를 notching으로 반영(후순위는 선순위 무담보 대비 1~2 notch 하향).", "trap": "신용등급 = ordinal(서열) 척도, cardinal 아님.", "f": "", "why": {"B": "첫 번째 특징(서수 등급, PD 중심, outlook)은 맞습니다.", "C": "두 번째 특징(notching으로 subordination 반영)도 맞습니다."}, "orig": "ECO Module 4 Q50"}, {"id": "ECO-M4-Q52", "src": "ECO 오답", "module": 4, "tag": "Reduced-form – default는 외생(exogenous)", "vig": 31, "stem": "Which of the issues that Belmar points out regarding quantitative credit models is least likely correct?", "opts": {"A": "Issue 1", "B": "Issue 2", "C": "Issue 3"}, "ans": "B", "en": "(A) Incorrect because Belmar’s comments regarding structural models (Issue 1) are correct. Asset values are not known, but they can be inferred from Assets = Liabilities + Equity.\n(B) Correct. Belmar is incorrect with regard to Issue 2. Reduced-form models get around the problem of not knowing the firm’s asset values by not treating default as an endogenous (internal) variable. Instead, the default is an exogenous (external) variable that occurs randomly. Unlike structural models that aim to explain why a default occurs, reduced-form models aim to explain statistically when it occurs.\n(C) Incorrect because Belmar’s comments regarding disadvantages of each model (Issue 3) are correct.", "ko": "Issue 2가 틀렸습니다. Reduced-form model은 부도를 '외생적(exogenous)' 무작위 사건으로 취급합니다(자산가치를 몰라도 됨). 부도를 내생적으로 설명하는 것은 structural model. Reduced-form은 '언제(when)' 부도나는지를 통계적으로 설명합니다.", "trap": "Structural = endogenous(왜), Reduced-form = exogenous(언제).", "f": "", "why": {"A": "Issue 1(structural: 옵션 접근, 부도 원인 설명, 자산가치를 시장자료로 추정)은 맞습니다.", "C": "Issue 3(structural: default barrier 측정 어려움 / reduced-form: 부도 원인 설명 못함)은 맞습니다."}, "orig": "ECO Module 4 Q52"}, {"id": "ECO-M4-Q58", "src": "ECO 오답", "module": 4, "tag": "Notching의 기준 – senior unsecured", "vig": null, "stem": "Notching adjustments are typically made to an issuer's credit ratings based on its:", "opts": {"A": "subordinated debt.", "B": "senior secured debt.", "C": "senior unsecured debt."}, "ans": "C", "en": "(A) Incorrect because notching adjustments are typically made based on an issuer's senior unsecured debt, not senior subordinated debt.\n(B) Incorrect because notching adjustments are typically made based on an issuer's senior unsecured debt, not senior secured debt.\n(C) Correct because the credit rating agencies consider the expected loss given default by means of notching, which is a rating adjustment methodology to reflect the priority of claim for specific debt issues of that issuer and to reflect any subordination. The issuer rating is typically for senior unsecured debt.", "ko": "발행자(issuer) 등급은 통상 선순위 무담보(senior unsecured) 채무 기준이며, 개별 발행물은 청구권 순위에 따라 여기서 notch 조정합니다(담보부는 상향, 후순위는 하향 가능).", "trap": "Issuer rating ≈ senior unsecured rating.", "f": "", "why": {"A": "후순위채는 senior unsecured 기준에서 '하향 notch'되는 대상이지 기준이 아닙니다.", "B": "선순위 담보부는 상향 notch될 수 있는 대상입니다."}, "orig": "ECO Module 4 Q58"}, {"id": "ECO-M4-Q64", "src": "ECO 오답", "module": 4, "tag": "등급변화 가격효과 – Δspread 사용", "vig": null, "stem": "An analyst estimates the following partial 1-year transition matrix:\nFrom/To\tAAA\tAA\tA\nAAA (%)\t90.00\t7.00\t2.00\nAA (%)\t1.00\t92.00\t6.00\nA (%)\t0.10\t1.50\t87.00\nCredit spread (%)\t0.75\t1.25\t1.75\nThe expected price change for an AAA rated bond with a duration of 3.7, when downgraded to an A rating, is closest to:", "opts": {"A": "–6.48%.", "B": "–3.70%.", "C": "–0.07%."}, "ans": "B", "en": "(A) Incorrect because the credit spread of the old rating is ignored in the expected percentage price change calculation:\nExpected percentage price change = –3.7 × 0.0175 = –0.0648, or –6.48%.\n(B) Correct because the expected percentage price change is the product of the negative of the modified duration and the difference between the credit spread in the new rating and the old rating:\nExpected percentage price change = –3.7 × (0.0175 – 0.0075) = –0.0370, or –3.70%.\n(C) Incorrect because the probability of transition from AAA to A of 0.02 is incorrectly applied in the expected percentage price change calculation:\nExpected percentage price change = 0.02 × [–3.7 × (0.0175 – 0.0075)] = –0.00074, or –0.07%.", "ko": "AAA → A: %ΔP = −3.7 × (1.75% − 0.75%) = −3.70%. '하향되었을 때'의 가격변화이므로 전이확률은 곱하지 않습니다. 노트 규칙: 'AAA → A처럼 하나의 이동이 명시되면 확률을 곱하지 않고', 'expected change/return considering probability'면 전이확률을 곱합니다.", "trap": "'When downgraded' → 확률 곱하지 않음. 'Expected return over next year' → 확률 가중.", "f": "%ΔP = −Dur × (s_new − s_old)", "why": {"A": "−6.48%는 기존 spread(0.75%)를 빼지 않고 새 spread만 사용(−3.7 × 1.75%).", "C": "−0.07%는 전이확률 2%를 곱한 '기대' 기여분입니다. 질문은 하향 '발생 시' 가격변화."}, "orig": "ECO Module 4 Q64"}, {"id": "ECO-M4-Q65", "src": "ECO 오답", "module": 4, "tag": "Structural model – 옵션 해석", "vig": null, "stem": "Which of the following is the most appropriate interpretation of debt and equity in terms of options in a structural model of credit risk?", "opts": {"A": "Equity is a purchased call option on the assets", "B": "Debt is short a risk-free bond and long a put option on the assets", "C": "Debt is short the assets and long a call option sold by the shareholders"}, "ans": "A", "en": "(A) Correct because E(T) = max[A(T) – K, 0], where A(T) is the random asset value as of time T and K is the face value of the bonds, and this equation indicates that equity is essentially a purchased call option on the assets of the company whereby the strike price is the face value of the debt.\n(B) Incorrect because D(T) = K – max[K – A(T), 0], where K is long position in a risk-free bond and –max[K – A(T),0] is a written (sold) put option on the assets.\n(C) Incorrect because D(T) = A(T) – max[A(T) – K, 0] and this equation shows that in this formulation, the debtholders own the assets of the company and have written the call option held by the shareholders.", "ko": "E_T = max(A_T − K, 0) → 주식 = 회사 자산에 대한 매수 콜옵션(행사가 = 부채 액면).", "trap": "Debt = K − Put(long rf bond, short put) = A − Call(long assets, short call).", "f": "E = max(A − K, 0),  D = K − max(K − A, 0) = A − max(A − K, 0)", "why": {"B": "부채 = 무위험채권 'long' + 자산에 대한 put 'short(매도)'. 방향을 반대로 썼습니다.", "C": "부채 = 자산 'long' + 주주에게 판 call 'short'. 자산을 short한다는 것은 틀렸습니다."}, "orig": "ECO Module 4 Q65"}, {"id": "ECO-M4-Q66", "src": "ECO 오답", "module": 4, "tag": "Securitized debt 분석 접근법", "vig": null, "stem": "For which of the following structured finance asset types is a statistics-based approach the most appropriate credit analysis approach?", "opts": {"A": "Auto asset-backed securities", "B": "Asset-backed commercial paper", "C": "Consumer asset-backed securities"}, "ans": "B", "en": "(A) Incorrect because a portfolio-based approach is appropriate for medium-term granular and homogeneous obligations because the portfolio is not static but changes over time. Auto ABS are backed by auto loans or leases, have a medium-term risk horizon, are granular, and homogeneous.\n(B) Correct because asset-backed commercial paper has granular and homogenous commercial discount credits or credit advances as underlying collateral with a short-term risk horizon. Short-term structured finance vehicles with granular, homogeneous assets tend to be evaluated using a statistics-based approach to the existing book of loans.\n(C) Incorrect because a portfolio-based approach is appropriate for medium-term granular and homogeneous obligations because the portfolio is not static but changes over time. Consumer ABS are backed by consumer loans which have a medium-term risk horizon, are granular and homogeneous.", "ko": "단기·granular·homogeneous 자산(ABCP) → 기존 대출장부에 대한 statistics-based 접근. 중기·granular·homogeneous(auto ABS, consumer ABS) → portfolio-based. Non-granular·heterogeneous(CMBS 등) → loan-by-loan. (노트 표의 'Book approach = 개별 채무 분석'은 loan-by-loan을 가리키는 것으로 보입니다. ECO 용어로 book(statistics-based)은 단기 G·H 풀용.)", "trap": "기간(단기/중기) + granularity + homogeneity 세 기준으로 판별.", "f": "단기 G·H → statistics / 중기 G·H → portfolio / 이질·비G → loan-by-loan", "why": {"A": "Auto ABS는 중기·granular·homogeneous → portfolio-based 접근.", "C": "Consumer ABS도 중기·granular·homogeneous → portfolio-based."}, "orig": "ECO Module 4 Q66"}, {"id": "ECO-M4-Q67", "src": "ECO 오답", "module": 4, "tag": "Inverted credit spread curve 원인", "vig": null, "stem": "An analyst observes a term structure of credit spreads for a company's debt that is declining for longer maturities. Which of the following best explains the inverted credit spread yield curve?", "opts": {"A": "Greater equity volatility is increasing the implied default probability", "B": "Near-term maturities that are less liquid than longer-term maturities", "C": "The issuer being of high quality with a strong competitive position in a stable industry"}, "ans": "B", "en": "(A) Incorrect because holding other factors constant, any microeconomic factor that increases the implied default probability, such as greater equity volatility, will tend to drive a steeper credit spread curve, and the reverse is true with a decline in equity volatility.\n(B) Correct because the credit curve will be most heavily influenced by the most frequently traded securities. For example, although one might expect the credit curve to steepen for a borrower refinancing near-term maturities with long-term debt, this effect may be partially offset by a tighter bid–offer spread for longer credit maturities. Infrequently traded bonds trading with wider bid–offer spreads can also impact the shape of the term structure, so it is important to gauge the size and frequency of trades in bonds across the maturity spectrum to ensure consistency. The infrequently traded near-term bonds will have higher relative bid-ask spreads than the longer-term bonds.\n(C) Incorrect because for investment-grade securities with the highest credit ratings and extremely low spreads, credit spread migration is only possible in one direction given the implied lower bound of zero on credit spreads. As a result, the credit term structure for the most highly rated securities tends to be either flat or slightly upward sloping. Positive-sloped credit spread curves are likely when a high-quality issuer with a strong competitive position in a stable industry has low leverage, strong cash flow, and a high profit margin. This type of issuer tends to exhibit very low short-term credit spreads rising with increasing maturity given greater uncertainty due to the macroeconomic environment.", "ko": "Credit curve는 거래가 활발한 증권의 영향을 가장 크게 받습니다. 단기물이 덜 유동적(bid–ask 넓음)이면 단기 spread가 높아져 커브가 역전될 수 있습니다.", "trap": "역전 원인: 임박한 부도(distress), 경기 저점의 경기순환 산업, 단기물 비유동성.", "f": "", "why": {"A": "주식 변동성↑ → 내재 부도확률↑ → credit curve가 '가팔라짐(steeper)'.", "C": "안정 산업의 고신용 발행사 → flat 또는 약간 '상승' 기울기."}, "orig": "ECO Module 4 Q67"}, {"id": "ECO-M4-Q69", "src": "ECO 오답", "module": 4, "tag": "Credit(G) spread 계산 – YTM 먼저", "vig": null, "stem": "A 10-year corporate bond with an annual coupon rate of 4.56% is priced at 98.2% of par. The yield on a 10-year government bond is 3.50%. The credit spread of the corporate bond is closest to:", "opts": {"A": "0.98%.", "B": "1.06%.", "C": "1.29%."}, "ans": "C", "en": "(A) Incorrect because it is calculated as 98.2% × 4.56% – 3.50% ≈ 0.98%, which is not the credit spread.\n(B) Incorrect because it is the difference between the coupon rate of the corporate bond and the yield of the government bond. 4.56% – 3.50% = 1.06%.\n(C) Correct because the yield to maturity of the corporate bond is 4.79%, subtracting the 10-year government bond yield of 3.50% to get a credit spread of 1.29%. The difference between the yields to maturity on a corporate bond and a government bond with the same maturity is the most commonly used measure of credit risk. It is called the credit spread and is also known in practice as the G-spread. For the corporate bond, N = 10, PMT = 4.56, PV = –98.2, FV = 100, solve for I/Y to get a yield to maturity of 4.79%. The credit spread is thus 4.79% – 3.50% = 1.29%.", "ko": "회사채 YTM: N=10, PMT=4.56, PV=−98.2, FV=100 → I/Y = 4.79%. G-spread = 4.79% − 3.50% = 1.29%.", "trap": "가격 ≠ par면 쿠폰 ≠ YTM. 반드시 YTM 계산 후 차감.", "f": "G-spread = YTM_corp − YTM_govt", "why": {"A": "0.98%는 98.2% × 4.56% − 3.50% 같은 무의미한 계산입니다.", "B": "1.06%는 쿠폰 − 국채수익률. 쿠폰은 수익률이 아닙니다(가격이 par 미만 → YTM > 쿠폰)."}, "orig": "ECO Module 4 Q69"}, {"id": "ECO-M4-Q72", "src": "ECO 오답", "module": 4, "tag": "Expected loss의 현재가치", "vig": null, "stem": "An analyst gathers the following information about a bond to calculate a credit valuation adjustment:\nExposure in Period 1\tRecovery Rate\tProbability of Default\n105.80\t60%\t1.5%\nIf the risk-free rate is 3% for this period, the present value of the expected loss is closest to:", "opts": {"A": "0.616.", "B": "0.635.", "C": "0.925."}, "ans": "A", "en": "(A) Correct because the present value of the expected loss is estimated as loss given default (LGD) × Probability of default. The LGD = the exposure × (1 – recovery rate); = 105.80 × (1 – 60%) = 42.32. The expected loss = LGD × probability of default; = 42.32 × 1.5% ≈ 0.6348.  The present value of the expected loss = 0.635/1.03 ≈ 0.616.\n(B) Incorrect because it is the expected loss one period from now and omits finding the present value of this expected loss. The expected loss (= loss given default (LGD) × Probability of default). LGD = the exposure × (1 – recovery rate) = 105.80 × (1 – 60%) = 42.32. The expected loss = LGD × probability of default = 42.32 × 1.5% ≈ 0.635.\n(C) Incorrect because it uses the recovery rate as the loss rate. The resulting calculation is [105.80 × (1 – 40%) × 1.5%] / 1.03 = 0.92447 ≈ 0.925.", "ko": "LGD = 105.80 × (1 − 0.60) = 42.32. EL = 42.32 × 1.5% = 0.635. PV = 0.635/1.03 = 0.616.", "trap": "① LGD = Exposure × (1 − RR) ② PV 할인 잊지 말기.", "f": "PV(EL) = Exposure × (1 − RR) × PD / (1 + r)^t", "why": {"B": "0.635는 할인 전 기대손실입니다. '현재가치'를 구해야 합니다.", "C": "0.925는 회수율 60%를 손실률로 착각(1 − 40%)한 값입니다."}, "orig": "ECO Module 4 Q72"}, {"id": "ECO-M4-Q73", "src": "ECO 오답", "module": 4, "tag": "CVA 변화 → credit spread 변화", "vig": null, "stem": "An analyst gathers the following information about a 4-year bond with an annual pay coupon of 5.5%:\nBond value assuming no default\t105.45\nDefault-free YTM\t4.00%\nCurrent bond price\t103.15\nCurrent credit spread\t0.62%\nIf the credit valuation adjustment increases to 3.45, the change in the credit spread is closest to:", "opts": {"A": "0.32%.", "B": "0.94%.", "C": "1.59%."}, "ans": "A", "en": "(A) Correct because the credit spread with the credit valuation adjustment (CVA) is estimated by first finding the yield to maturity of the bond when adjusting the default-free bond value by the CVA; Bond's new price = 105.45 – 3.45 = 102. The yield-to-maturity of a four-year bond with an annual coupon rate of 5.5% and a price of 102 is 4.937% ≈ 4.94% (PV = –102, Pmt = 5.5, FV = 100, n = 4; cpt I/Y = 4.937%).  The resulting credit spread is 4.94% – 4.00% = 0.94%.  The change in the credit spread = 0.94% – 0.62% = 0.32%.\n(B) Incorrect because it is the bond's new credit spread, not the change in the credit spread. Bond's new price = 105.45 – 3.45 = 102. The yield-to-maturity of a four-year bond with an annual coupon rate of 5.5% and a price of 102 is 4.937% ≈ 4.94% (PV = –102, Pmt = 5.5, FV = 100, n = 4; cpt I/Y ≈ 4.94%).  The resulting credit spread is 4.94% – 4.00% = 0.94%.\n(C) Incorrect because it is the credit spread (not change in credit spread) from adjusting the bond's current value (not default free value) by the credit valuation adjustment to compute the new yield-to-maturity; = 103.15 – 3.45 = 99.70.  The yield-to-maturity with a price of 99.7 ≈ 5.59% (PV = –99.70, Pmt = 5.5, FV = 100, n = 4; cpt I/Y = 5.586%).  The credit spread is 5.59% – 4.00% = 1.59%.", "ko": "새 가격 = VND − CVA = 105.45 − 3.45 = 102.00 → YTM (N=4, PMT=5.5, FV=100, PV=−102) = 4.937%. 새 spread = 4.94% − 4.00% = 0.94%. 변화 = 0.94% − 0.62% = 0.32%.", "trap": "① FV = VND − CVA (시장가 − CVA 아님) ② '변화량' 질문이면 기존 spread 차감.", "f": "Spread = YTM(VND − CVA) − YTM_rf", "why": {"B": "0.94%는 새 spread 자체입니다. 질문은 spread의 '변화'.", "C": "1.59%는 현재 시장가(103.15)에서 CVA를 뺀(99.70) 오류. CVA는 VND(무부도 가치)에서 차감합니다."}, "orig": "ECO Module 4 Q73"}, {"id": "ECO-M4-Q74", "src": "ECO 오답", "module": 4, "tag": "Portfolio 접근의 근거 – granularity(자산 수)", "vig": null, "stem": "A credit analyst uses a portfolio approach to evaluate a securitized pool comprised of numerous underlying assets that have widely varying debt characteristics and a short-term risk horizon. Which of the pool's characteristics best supports the analyst's approach for credit evaluation?", "opts": {"A": "Risk horizon", "B": "Number of assets", "C": "Variability of debt characteristics"}, "ans": "B", "en": "(A) Incorrect because short-term assets are typically evaluated using a book approach to credit analysis since the maturity of the debt is relatively soon. Short-term structured finance vehicles with granular, homogeneous assets tend to be evaluated using a statistics-based approach to the existing book of loans.\n(B) Correct because a highly granular portfolio may have hundreds of underlying debtors, suggesting it is appropriate to draw conclusions about creditworthiness based on portfolio summary statistics rather than investigating each borrower. Alternatively, an asset pool with fewer more-discrete or non-granular investments would warrant analysis of each individual obligation.\n(C) Incorrect because the characteristics of the underlying debt are not similar (homogeneous) but varied (heterogeneous). Homogeneity refers to the degree to which underlying debt characteristics within a structured finance instrument are similar across individual obligations. On the one hand, an investor or credit analyst might draw general conclusions about the nature of homogeneous credit card or auto loan obligations given that an individual obligation faces strict eligibility criteria to be included in a specific asset pool. On the other hand, heterogeneous leveraged loan, project finance, or real estate transactions require scrutiny on a loan-by-loan basis given their different characteristics.", "ko": "자산 수가 매우 많으면(granular) 개별 차주를 조사하지 않고 포트폴리오 요약통계로 신용도를 판단하는 것이 타당 → portfolio 접근을 지지하는 특성은 '자산 수'. 용어 주의: 'book approach'는 단기·granular·homogeneous 풀의 기존 대출장부를 통계로 보는 statistics-based 접근이고, 소수·이질 자산을 하나씩 보는 것은 loan-by-loan입니다.", "trap": "Granular(다수) → 요약통계 가능. Heterogeneous → 개별 분석.", "f": "", "why": {"A": "단기 위험기간은 오히려 statistics-based(대출장부) 접근의 근거입니다.", "C": "부채 특성이 다양(heterogeneous)하면 loan-by-loan 분석이 필요 → portfolio 접근을 지지하지 않습니다."}, "orig": "ECO Module 4 Q74"}, {"id": "ECO-M4-Q75", "src": "ECO 오답", "module": 4, "tag": "Rating migration → 기대 연수익률", "vig": null, "stem": "An analyst uses the data in the following exhibit about 1-year rating transition matrix, with average credit spreads (entries in %) to determine the effect of a downgrade of a bond's credit rating from A to BBB:\nFrom/To\tA\tBBB\nA\t87.50\t11.00\nBBB\t0.20\t85.50\nCredit spread\t1.35\t2.30\nThe bond has a yield to maturity of 5.95% and a modified duration of 1.90. All else being equal, the expected annual return of this bond is closest to:", "opts": {"A": "5.75%.", "B": "5.85%.", "C": "5.95%."}, "ans": "A", "en": "(A) Correct because the price change is calculated with reference to the modified duration and expected change in spread:\n–1.90 × (2.30% – 1.35%) = –1.805%.\nThis is then weighted by the probability of the rating transition occurring:\n11.00% × –1.805% = –0.19855%.\nThe expected return is the sum of the yield to maturity and the probability weighted expected price change due to transition:\n5.95% – 0.19855% = 5.75145% ≈ 5.75%.\n(B) Incorrect because the price change is calculated with reference to the expected change in spread, but the modified duration is ignored:\n(2.30% – 1.35%) = –0.95%.\nThis is then weighted by the probability of the rating transition occurring:\n11.00% × –0.95% = –0.1045%.\nThe expected return is the sum of the yield to maturity and the probability weighted expected price change due to transition:\n5.95% – 0.1045% = 5.8455% ≈ 5.85%.\n(C) Incorrect because the wrong rating transition is used. The price change is first calculated with reference to the modified duration and expected change in spread:\n–1.90 × (2.30% – 1.35%) = –1.805%.\nThis is then weighted by the probability of a rating transition from BBB to A, rather than A to BBB:\n0.20% × –1.805% = –0.00361%.\nThe expected return is the sum of the yield to maturity and the probability weighted expected price change due to transition:\n5.95% – 0.0.00361% = 5.94639% ≈ 5.95%.\nAlternatively, this answer is simply the yield to maturity.", "ko": "A → BBB 가격변화 = −1.90 × (2.30% − 1.35%) = −1.805%. 확률가중: 11.00% × −1.805% = −0.199%. 기대수익률 = 5.95% − 0.199% = 5.75%.", "trap": "'Expected' return → 확률 가중. 행(From) = 현재 등급.", "f": "E[R] = YTM + p × [−Dur × Δs]", "why": {"B": "5.85%는 duration을 곱하지 않은 값(−0.95% × 11%).", "C": "5.95%는 BBB → A 확률(0.20%)을 쓰거나 migration을 무시한 값. A 등급 행(A → BBB 11%)을 써야 합니다."}, "orig": "ECO Module 4 Q75"}, {"id": "ECO-M4-Q11", "src": "ECO 관련유형", "module": 4, "tag": "CVA 표 작성 – fair value", "vig": 26, "stem": "The fair value of Bond B2 is closest to:", "opts": {"A": "€1,069.34.", "B": "€1,111.51.", "C": "€1,153.68."}, "ans": "A", "en": "A is correct. CVA = sum of PV of expected losses = €42.17.\nDate\tExposure\tRecovery\tLGD\tPOD\tPOS\tExpected Loss\tDF\tPV of EL\n1\t€1,144.86\t€343.46\t€801.40\t1.5000%\t98.5000%\t€12.02\t0.970874\t€11.67\n2\t€1,117.40\t€335.22\t€782.18\t1.4775%\t97.0225%\t€11.56\t0.942596\t€10.89\n3\t€1,089.13\t€326.74\t€762.39\t1.4553%\t95.5672%\t€11.10\t0.915142\t€10.15\n4\t€1,060.00\t€318.00\t€742.00\t1.4335%\t94.1337%\t€10.64\t0.888487\t€9.45\nValue if default free (VND) = €60 × DF1 + €60 × DF2 + €60 × DF3 + €1,060 × DF4 = €1,111.51. Fair value = €1,111.51 − €42.17 = €1,069.34.", "ko": "Flat 3%, PD 1.5%/년, RR 30%. Exposure(Date t) = 쿠폰 + 남은 CF의 PV: 1,144.86 / 1,117.40 / 1,089.13 / 1,060. LGD = 70% × exposure. POD_t = 1.5% × POS_(t−1). PV(EL) 합계 = CVA = 42.17. VND = 1,111.51 → FV = 1,111.51 − 42.17 = 1,069.34.", "trap": "POD_t = hazard × 직전 POS (조건부). Exposure에는 그 날짜 쿠폰 포함.", "f": "CVA = Σ LGD_t × POD_t × DF_t,  FV = VND − CVA", "why": {"B": "1,111.51은 VND(무부도 가치)입니다. CVA를 차감해야 합니다.", "C": "1,153.68은 CVA를 더한 오류입니다."}, "orig": "ECO Module 4 Q11"}, {"id": "ECO-M4-Q57", "src": "ECO 관련유형", "module": 4, "tag": "FICO score 가중치", "vig": null, "stem": "Which of the following factors carries the highest weight in the FICO score?", "opts": {"A": "Payment history", "B": "Type of credit used", "C": "Number of hard credit inquiries"}, "ans": "A", "en": "(A) Correct because of the five primary factors that are included in the proprietary algorithm used to get the FICO score, the largest weight, at 35%, is given to the payment history: This includes the presence or lack of such information as delinquency, bankruptcy, court judgments, repossessions, and foreclosures.\n(B) Incorrect because this is a smaller factor, with a 10% weight in the FICO score for the types of credit used. This includes the use of installment payments, consumer finance, and mortgages.\n(C) Incorrect because there is a 10% weight in the FICO score for recent searches for credit: This includes 'hard' credit inquiries when consumers apply for new loans but not 'soft' inquiries, such as for employee verification or self-checking one’s score.", "ko": "FICO 5개 요인 중 가장 큰 비중(35%)은 payment history(연체·파산·압류 등 기록).", "trap": "", "f": "", "why": {"B": "사용한 신용 유형(credit mix)은 약 10%.", "C": "최근 신용조회(hard inquiries) 등 new credit은 약 10%."}, "orig": "ECO Module 4 Q57"}, {"id": "ECO-M4-Q59", "src": "ECO 관련유형", "module": 4, "tag": "Credit spread 결정요인", "vig": null, "stem": "An increase in which of the following will lead to a decrease in the credit spread of a security?", "opts": {"A": "Credit rating", "B": "Annual default probability", "C": "Cumulative default probability"}, "ans": "A", "en": "(A) Correct because an increase in the credit rating of a security is negatively correlated with the credit spread of that security. A higher credit spread implies more credit risk and a lower credit rating.\n(B) Incorrect because an increase in default probability implies higher credit risk which implies a higher credit spread.\n(C) Incorrect because a higher cumulative default probability implies higher credit risk which implies a higher credit spread.", "ko": "신용등급 상승 → 신용위험↓ → spread 축소.", "trap": "", "f": "", "why": {"B": "연간 부도확률↑ → spread↑.", "C": "누적 부도확률↑ → spread↑."}, "orig": "ECO Module 4 Q59"}, {"id": "ECO-M4-Q60", "src": "ECO 관련유형", "module": 4, "tag": "CVA↑ → 가격↓", "vig": null, "stem": "All else being equal, as the credit valuation adjustment increases, there is a decrease in the bond's:", "opts": {"A": "YTM.", "B": "price.", "C": "credit risk."}, "ans": "B", "en": "(A) Incorrect because a higher CVA implies a lower fair value of a bond and thus a higher YTM. The CVA is subtracted from the (hypothetical) value of the bond, if it were default risk free, to get the bond’s fair value given its credit risk.\n(B) Correct because the credit valuation adjustment (CVA) is subtracted from the (hypothetical) value of the bond, if it were default risk free, to get the bond’s fair value given its credit risk.  A higher CVA implies a lower fair value of a bond, given its credit risk.\n(C) Incorrect because the CVA is the value of the credit risk in present value terms.  A higher CVA implies higher credit risk.", "ko": "FV = VND − CVA → CVA↑ → 공정가치(가격)↓ → YTM↑.", "trap": "M4 Q73 오답과 연결: CVA↑ → 가격↓ → spread↑.", "f": "FV = VND − CVA", "why": {"A": "가격↓ → YTM은 '상승'.", "C": "CVA↑는 신용위험이 '높다'는 뜻."}, "orig": "ECO Module 4 Q60"}, {"id": "ECO-M4-Q61", "src": "ECO 관련유형", "module": 4, "tag": "Structural model 특징", "vig": null, "stem": "A structural form model of corporate credit risk:", "opts": {"A": "treats default as an exogenous variable.", "B": "can explain the economic reason for default.", "C": "does not require an estimate of the company's volatility to implement."}, "ans": "B", "en": "(A) Incorrect because structural form models treat default as endogenous.\n(B) Correct because structural models explain the economic reasons for default while reduced-form models do not.\n(C) Incorrect because structural models provide insight into the nature of credit risk but can be burdensome to implement. The modeler needs to determine the value of the company, its volatility, and the default barrier.", "ko": "Structural model은 부도의 경제적 이유(자산가치 < 부채)를 설명합니다(default = endogenous).", "trap": "M4 Q35/Q52 오답과 같은 축: structural = why, endogenous.", "f": "", "why": {"A": "외생적(exogenous) 취급은 reduced-form.", "C": "Structural은 회사 가치와 그 변동성, default barrier 추정이 필요합니다."}, "orig": "ECO Module 4 Q61"}, {"id": "ECO-M4-Q62", "src": "ECO 관련유형", "module": 4, "tag": "Reduced-form model 특징", "vig": null, "stem": "A reduced-form model of credit risk:", "opts": {"A": "can explain the economic reason for default.", "B": "assumes default is a surprise and can occur at any time.", "C": "requires a measure of the company's asset volatility to implement."}, "ans": "B", "en": "(A) Incorrect because a disadvantage of reduced-form models is that, unlike structural models, they do not explain the economic reasons for default.\n(B) Correct because reduced-form models assume that default comes as a surprise and can occur at any time.\n(C) Incorrect because this is a requirement of structural models of credit risk. Structural models provide insight into the nature of credit risk but can be burdensome to implement. The modeler needs to determine the value of the company, its volatility, and reduced-form models have the advantage that the inputs are observable variables, including historical data.", "ko": "Reduced-form은 부도가 예고 없이(surprise) 언제든 일어날 수 있다고 가정합니다.", "trap": "M4 Q36 오답과 같은 개념.", "f": "", "why": {"A": "부도 원인 설명은 structural의 장점.", "C": "자산 변동성 필요는 structural."}, "orig": "ECO Module 4 Q62"}, {"id": "ECO-M4-Q68", "src": "ECO 관련유형", "module": 4, "tag": "Upward credit spread curve 원인", "vig": null, "stem": "An upward sloping credit spread term structure for a company's bonds is best explained by:", "opts": {"A": "a company with high-yield bonds facing imminent default.", "B": "a cyclical company in an economy coming out of a recession.", "C": "a company with investment-grade bonds operating in a stable industry."}, "ans": "C", "en": "(A) Incorrect because as a high-yield bond moves further down the credit spectrum into a more distressed scenario, the contractual cash flows through maturity become less certain—with the value of distressed debt converging to a dollar price equal to the recovery rate as default becomes more certain, regardless of the remaining time to maturity. Such a scenario will result in a steeply inverted credit spread term structure. Bonds with a very high likelihood of default tend to trade on a price basis that converges toward the recovery rate rather than on a spread to benchmark rates.\n(B) Incorrect because an inverted credit term structure might result when issuers in a historically cyclical industry (such as oil and gas exploration or retail) find themselves at the bottom of an economic cycle, with investor expectations of a recovery in the industry tied to improving credit spreads over time.\n(C) Correct because positive-sloped credit spread curves are likely when a high-quality issuer with a strong competitive position in a stable industry has low leverage, strong cash flow, and a high profit margin. This type of issuer tends to exhibit very low short-term credit spreads rising with increasing maturity given greater uncertainty due to the macroeconomic environment, potential adverse changes in the competitive landscape, technological change, or other factors that drive a higher implied probability of default over time.", "ko": "저레버리지·강한 현금흐름의 안정 산업 투자등급 발행사 → 단기 spread 매우 낮고 만기↑에 따라 불확실성↑ → 상승 커브.", "trap": "M4 Q67 오답과 짝: 상승 = 고신용·안정, 역전 = distress·경기순환 저점·단기 비유동성.", "f": "", "why": {"A": "임박한 부도 → 가격이 회수율로 수렴 → 가파른 '역전' 커브.", "B": "경기 저점의 경기순환 산업 → 회복 기대로 '역전' 가능."}, "orig": "ECO Module 4 Q68"}, {"id": "VAR-M4-01", "module": 4, "tag": "Rating migration → 기대수익률", "stem": "A BBB-rated bond has a YTM of 5.20% and a modified duration of 5.0 at year-end. One-year transition probabilities from BBB are: A 5%, BBB 88%, BB 7%. Credit spreads are: A 1.00%, BBB 1.60%, BB 3.20%. Assuming no default and stable benchmark yields, the expected one-year return is closest to:", "opts": {"A": "4.79%.", "B": "5.20%.", "C": "5.61%."}, "ans": "A", "en": "A: −5 × (1.00% − 1.60%) = +3.00% × 0.05 = +0.15%; BB: −5 × (3.20% − 1.60%) = −8.00% × 0.07 = −0.56%. Expected price change = -0.41%. Expected return = 5.20% -0.41% = 4.79%.", "ko": "상향(A): +3.00% × 5% = +0.15%, 하향(BB): −8.00% × 7% = −0.56%. 합 = -0.41% → 기대수익률 = 5.20% -0.41% = 4.79%.", "why": {"B": "Migration 효과를 무시한 YTM 그대로입니다.", "C": "기대 가격변화의 부호를 반대로 적용했습니다(하향 효과가 더 큼 → 음수)."}, "trap": "ECO M4 Q13·Q75 패턴: 하향 spread 확대 폭이 상향 축소 폭보다 커서 기대효과는 보통 음(−).", "f": "E[R] = YTM + Σ p_i × [−Dur × (s_i − s_0)]", "orig": "변형 (ECO M4 Q13·Q75)", "src": "변형", "vig": null}, {"id": "VAR-M4-02", "module": 4, "tag": "Expected loss의 현재가치 (CVA 1기간)", "stem": "A bond has an expected exposure of 104.00 at Date 1, a recovery rate of 35%, and a probability of default of 2.0% for Date 1. If the risk-free rate is 4%, the present value of the expected loss for Date 1 is closest to:", "opts": {"A": "0.700.", "B": "1.352.", "C": "1.300."}, "ans": "C", "en": "LGD = 104.00 × (1 − 0.35) = 67.60; EL = LGD × PD = 1.352; PV = 1.352/1.04 = 1.300.", "ko": "LGD = 104 × 65% = 67.60, EL = 67.60 × 2% = 1.352, PV = 1.352/1.04 = 1.300.", "why": {"A": "회수율(35%)을 손실률로 착각했습니다. LGD = Exposure × (1 − RR).", "B": "현재가치 할인을 빠뜨렸습니다."}, "trap": "ECO M4 Q72와 동일 2단 함정.", "f": "PV(EL) = Exposure × (1 − RR) × PD / (1 + r)", "orig": "변형 (ECO M4 Q72)", "src": "변형", "vig": null}, {"id": "VAR-M4-03", "module": 4, "tag": "Securitized debt 분석 접근 – loan-by-loan", "stem": "A structured finance vehicle is backed by a small number of large commercial real estate loans with widely differing terms and borrowers. The most appropriate credit analysis approach is:", "opts": {"A": "a statistics-based approach applied to the existing book of loans.", "B": "a portfolio-based approach using summary statistics of the pool.", "C": "loan-by-loan analysis of the individual obligations."}, "ans": "C", "en": "Discrete and non-granular (heterogeneous) portfolios have to be evaluated at the individual loan level. Short-term granular and homogeneous vehicles use a statistics-based approach (to the existing book of loans); medium-term granular and homogeneous obligations use a portfolio-based approach (Schweser, Reading 26).", "ko": "소수·대형·이질적(non-granular, heterogeneous) 자산 → 개별 대출 단위(loan-by-loan) 분석. 단기·granular·homogeneous → '기존 대출장부(existing book)'에 대한 statistics-based 접근. 중기·granular·homogeneous → portfolio-based.", "why": {"A": "Statistics-based(book) 접근은 단기·granular·homogeneous 풀(예: ABCP)용입니다. 노트 표에서 개별 분석을 'Book approach'라고 적은 부분은 ECO/Schweser 용어와 다르니 주의: 'book'은 대출장부 전체를 통계로 보는 쪽입니다.", "B": "Portfolio-based는 자산 수가 많고(granular) 동질적일 때 요약통계를 쓰는 방법입니다."}, "trap": "Book(statistics-based) = 단기 G·H / Portfolio = 중기 G·H / Loan-by-loan = 비G·이질.", "f": "", "orig": "변형 (오답노트 + Schweser R26 LOS 26.k, ECO M4 Q66·Q74)", "src": "변형", "vig": null}, {"id": "ECO-M5-Q1", "src": "ECO 오답", "module": 5, "tag": "CDS 결제 – Cash vs Physical settlement", "vig": 32, "stem": "If UNAB experienced a credit event on 1 July, Watt should recommend that Deem Advisors:", "opts": {"A": "prefer a cash settlement.", "B": "prefer a physical settlement.", "C": "be indifferent between a cash or a physical settlement."}, "ans": "A", "en": "A is correct. Deem Advisors would prefer a cash settlement. Deem Advisors owns Bond 2 (trading at 50% of par), which is worth more than the cheapest-to-deliver obligation (Bond 1, also a senior secured bond, trading at 40% of par). Based on the price of this cheapest-to-deliver security, the estimated recovery rate is 40%. Thus, Deem Advisors can cash settle for $6 million [= (1 – 40%) × $10 million] on its CDS contract and sell the bond it owns, Bond 2, for $5 million, for total proceeds of $11 million. If Deem Advisors were to physically settle the contract, only $10 million would be received, the face amount of the bonds, and it would deliver Bond 2.\nB is incorrect because if Deem Advisors were to physically settle the contract, it would receive only $10 million, which is less than the $11 million that could be obtained from a cash settlement. C is incorrect because Deem Advisors would not be indifferent between settlement protocols as the firm would receive $1 million more with a cash settlement in comparison to a physical settlement.", "ko": "Cheapest-to-deliver(동순위 senior unsecured 중 가장 싼 Bond 1, 40% of par) → 추정 회수율 40%. Cash settlement: (1 − 40%) × $10M = $6M 수령 + 보유 Bond 2(50% of par)를 $5M에 매도 = 총 $11M. Physical settlement: Bond 2를 인도하고 액면 $10M 수령. → Cash가 $1M 유리.", "trap": "CDS payoff는 CTD 가격 기준. 내가 가진 채권이 CTD보다 비싸면 → cash 결제 + 채권 시장 매도.", "f": "Cash payoff = (1 − RR_CTD) × Notional", "why": {"B": "Physical은 $10M만 수령합니다. 보유 채권이 CTD보다 비쌀 때(50% > 40%) cash settlement가 유리합니다.", "C": "두 방식의 수령액이 $11M vs $10M로 다르므로 무차별하지 않습니다."}, "orig": "ECO Module 5 Q1"}, {"id": "ECO-M5-Q5", "src": "ECO 오답", "module": 5, "tag": "CDS 청산 – protection buyer의 손익", "vig": 32, "stem": "If Deem Advisors enters into a new offsetting contract two months after purchasing protection on Kand Corporation, this action will most likely result in:", "opts": {"A": "a loss on the CDS position.", "
