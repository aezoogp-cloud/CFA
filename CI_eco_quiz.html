SCRP = 3.5% + 1.5 × 6.0% + 4.5% + 5.0% = 22.0%", "ko": "Build-up = rf + ERP + SP + SCRP = 3.5 + 6.0 + 4.5 + 5.0 = 19.0%. 베타는 쓰지 않습니다(평균 대형주 기준이라 β = 1로 본 셈).", "trap": "peer beta가 주어져도 build-up에서는 무시. β를 쓰면 expanded CAPM.", "f": "Build-up: re = rf + ERP + SP (+IP) + SCRP ; Expanded CAPM: re = rf + β_peer × ERP + SP + SCRP", "why": {"A": "무위험이자율 3.5%를 빼먹은 값입니다.", "C": "β 1.5를 곱한 expanded CAPM 값(3.5 + 1.5 × 6 + 4.5 + 5)입니다."}, "orig": "ECO Module 3 Q12"}, {"id": "ECO-M3-Q14", "src": "ECO 오답", "module": 3, "tag": "Matrix pricing (YTM 보간)", "vig": null, "stem": "An analyst researches Trenson, a private company whose total debt consists of a straight bond issue that pays interest semiannually and has a residual maturity of seven years. To estimate Trenson's cost of debt, the analyst gathers the following information on two straight bonds issued by companies that have similar credit quality to Trenson and pay interest semiannually:\n\tCoupon Rate\tRemaining Maturity\tCurrent Price (per 100 of par)\nBond 1\t4.8%\t5 years\t102.34\nBond 2\t6.4%\t8 years\t95.67\nBased on matrix pricing, the estimated yield to maturity of the Trenson bond is closest to:", "opts": {"A": "5.70%.", "B": "5.87%.", "C": "6.17%."}, "ans": "C", "en": "A is incorrect because 5.70% is the average YTM of the 5-year and 8-year bonds, rather than the interpolated YTM of the 7-year bond. Using these YTM from the correct answer, the average YTM is (4.275% + 7.119%)/2 = 5.697% ≈ 5.70%\nB is incorrect because it uses the coupon rates instead of the YTMs of the 5-year and 8-year bonds in calculating the YTM of the 7-year bond. The coupon rates for the 5-and 8-year bonds are 4.8% and 6.4%, respectively.\nThe estimated annual incremental in the coupon rate is (6.4% – 4.8%)/(8 – 5) ≈ 0.533%.\nUsing linear interpolation, the estimation of the YTM of the 7-year Trenson bond is: 4.8% + ((7 – 5) × 0.533%) = 5.867% ≈ 5.87%\nC is correct because this is the YTM of a bond with 7 years left to maturity using matrix pricing method. Using a financial calculator (with semi-annual payments):\nYTM for Bond 1:\nN = 5 × 2 = 10; PV = –102.34; PMT = 4.8/2 = 2.4; FV = 100; CPT I/Y = 2.1376%. 2.1376% × 2 ≈ 4.275%.\nYTM for Bond 2:\nN = 8 × 2 = 16; PV = –95.67; PMT = 6.4/2 = 3.2; FV = 100; CPT I/Y = 3.5596%. 3.5596% × 2 ≈ 7.119%.\nThe estimated annual incremental in the yield is (7.119% – 4.275%)/(8 – 5) = 0.948%.\nUsing linear interpolation, the estimation of the YTM of the 7-year maturity Trenson bond is: 4.275% + ((7 – 5) × 0.948%) = 6.171% ≈ 6.17%", "ko": "먼저 각 채권의 YTM을 구합니다. Bond 1: N=10, PV=−102.34, PMT=2.4, FV=100 → 2.1376% × 2 = 4.275%. Bond 2: N=16, PV=−95.67, PMT=3.2, FV=100 → 3.5596% × 2 = 7.119%. 연간 증가분 = (7.119 − 4.275) / 3 = 0.948%. 7년 YTM = 4.275 + 2 × 0.948 = 6.17%.", "trap": "쿠폰이 아니라 YTM을 보간. 단순 평균도 아님(7년은 5년과 8년의 중간이 아님).", "f": "YTM(7y) = YTM(5y) + (7 − 5) × [YTM(8y) − YTM(5y)] / (8 − 5)", "why": {"A": "두 YTM의 단순 평균((4.275 + 7.119) / 2)입니다. 만기 7년에 맞춰 보간해야 합니다.", "B": "YTM 대신 쿠폰(4.8%, 6.4%)으로 보간한 값입니다."}, "orig": "ECO Module 3 Q14"}, {"id": "ECO-M3-Q16", "src": "ECO 오답", "module": 3, "tag": "Bottom-up 요인: 이익 예측가능성", "vig": null, "stem": "All else equal, which of the following business model characteristics most likely results in a lower cost of capital of a company when compared to its peers?", "opts": {"A": "Higher operating leverage", "B": "Higher earnings predictability", "C": "Higher revenue concentration"}, "ans": "B", "en": "A is incorrect because with regard to the relationships between business model characteristics and a company’s cost of capital, the effect of higher operating leverage is a higher, rather than lower, cost of capital.\nB is correct because with regard to the relationships between business model characteristics and a company’s cost of capital, the effect of higher earnings predictability is a lower cost of capital.\nC is incorrect because with regard to the relationships between business model characteristics and a company’s cost of capital, the effect of higher revenue concentration is a higher, rather than lower, cost of capital.", "ko": "이익을 예측하기 쉬울수록(변동성 낮음) 영업위험이 낮아 자본비용이 낮습니다.", "trap": "영업레버리지↑, 매출 집중도↑ → 위험↑ → 자본비용↑.", "f": "", "why": {"A": "영업레버리지가 높으면 이익 변동성이 커져 자본비용이 올라갑니다.", "C": "매출이 소수 고객에 몰리면(customer concentration) 매출 위험이 커져 자본비용이 올라갑니다."}, "orig": "ECO Module 3 Q16"}, {"id": "ECO-M3-Q18", "src": "ECO 오답", "module": 3, "tag": "우선주 자본비용", "vig": null, "stem": "A company's preferred equity is trading at $140 per share. The annual dividend rate is 8.0% and the par value is $150 per share. The cost of the preferred equity is closest to:", "opts": {"A": "7.1%.", "B": "8.0%.", "C": "8.6%."}, "ans": "C", "en": "A is incorrect because this is the current discount on the par value divided by the current price or ($150 – $140)/$140 = 7.14% ≈ 7.1%.\nB is incorrect because this is the annual dividend rate, not the cost of the preferred equity.\nC is correct because the cost of the preferred equity is (8.0% × $150)/$140 = 8.57% ≈ 8.6%.", "ko": "우선주 배당 = 액면 × 배당률 = $150 × 8% = $12. 자본비용 = 12 / 140 = 8.57% ≈ 8.6%. 시장가가 액면보다 낮으니 자본비용 > 배당률.", "trap": "배당은 액면(par) 기준, 나누는 가격은 시장가.", "f": "r_p = D / P0 = (par × 배당률) / 시장가", "why": {"A": "(액면 − 시장가) / 시장가, 즉 할인율입니다.", "B": "표면 배당률일 뿐 시장가 기준 자본비용이 아닙니다."}, "orig": "ECO Module 3 Q18"}, {"id": "ECO-M3-Q20", "src": "ECO 오답", "module": 3, "tag": "Grinold–Kroner ERP (TIPS로 인플레이션)", "vig": null, "stem": "An analyst gathers the following information to calculate the equity risk premium (ERP) for the US market:\nBroad-based market index dividend yield\t2.4%\nExpected growth rate in the P/E ratio\t1.2%\nReal GDP growth rate\t2.8%\nExpected change in shares outstanding\t0.0%\n10-year Treasury bond yield-to-maturity\t5.0%\n10-year Treasury inflation protected security (TIPS) yield-to-maturity\t2.7%\nRisk-free rate\t2.1%\nThe ERP using the forward-looking Grinold–Kroner model is closest to:", "opts": {"A": "4.3%.", "B": "6.5%.", "C": "7.0%."}, "ans": "B", "en": "A is incorrect because the inflation rate has been omitted in the calculation based on the assumption that the GDP growth rate includes inflation i.e. nominal.\nERP = [DY + Δ(P/E) + g + ΔS] – E(rf)\nWhere, DY = Expected income component = broad-based market index dividend yield = 2.4%, ΔP/E = Expected growth rate in the P/E ratio = 1.2%, g = Expected growth rate in real earnings per share = real GDP growth rate = 2.8%, ΔS = Expected change in shares outstanding = 0% and E(rf) = Risk-free rate = 2.1%.\nERP = [2.4% + 1.2% + 2.8% + 0.0%] – 2.1% = 4.3%\nB is correct because based on the forward-looking macroeconomic approach using the Grinold-Kroner model:\nERP = [DY + Δ(P/E) + i + g + ΔS] – E(rf)\nWhere, DY = Expected income component = broad-based market index dividend yield = 2.4%, ΔP/E = Expected growth rate in the P/E ratio = 1.2%, i = Expected inflation = (1 + YTMTreasury bond/1 + YTMTIPS) – 1 = (1.05/1.027) – 1 ≈ 2.2%, g = Expected growth rate in real earnings per share = real GDP growth rate = 2.8%, ΔS = Expected change in shares outstanding = 0% and E(rf) = Risk-free rate = 2.1%.\nERP = [2.4% + 1.2% + 2.2% + 2.8% + 0.0%] – 2.1% = 6.5%\nC is incorrect because the calculation assumes that the yield-to-maturity of the Treasury inflation protected security is a proxy for the inflation rate.\nERP = [DY + Δ(P/E) + i + g + ΔS] – E(rf)\nWhere, DY = Expected income component = broad-based market index dividend yield = 2.4%, ΔP/E = Expected growth rate in the P/E ratio = 1.2%, i = YTMTIPS = 2.7%, g = Expected growth rate in real earnings per share = real GDP growth = 2.8%, ΔS = Expected change in shares outstanding = 0% and E(rf) = Risk-free rate = 2.1%.\nERP = [2.4% + 1.2% + 2.7% + 2.8% + 0.0%] – 2.1% = 7.0%", "ko": "i = 1.05 / 1.027 − 1 ≈ 2.2%. ERP = [2.4 + 1.2 + 2.2 + 2.8 − 0] − 2.1 = 6.5%. (Schweser 공식은 ΔS를 빼는 형태 −ΔS인데 여기서는 0이라 결과가 같습니다.)", "trap": "인플레이션 = 명목채와 TIPS 수익률로 구함. TIPS 수익률 자체는 실질금리이지 인플레이션이 아님.", "f": "ERP = [DY + ΔP/E + i + g − ΔS] − rf, i = (1 + YTM_Treasury)/(1 + YTM_TIPS) − 1", "why": {"A": "인플레이션 i를 빼먹은 값입니다. 실질 GDP 성장률을 쓰므로 i를 따로 더해야 합니다.", "C": "TIPS 수익률 2.7%를 인플레이션으로 쓴 값입니다. TIPS 수익률은 실질금리입니다."}, "orig": "ECO Module 3 Q20"}, {"id": "ECO-M3-Q22", "src": "ECO 오답", "module": 3, "tag": "자기자본비용 방법 선택: Bond yield + RP", "vig": null, "stem": "An analyst gathers the following information about a public company:\nGrowth rate\t3%\nForward dividend (D1)\t$5\nRisk premium over cost of debt\t7%\nCost of debt\t6%\nRisk-free rate\t2%\nEstimated beta\t1.1\nBased only on the data in the table, the required ROE can be calculated using which of the following?", "opts": {"A": "DDM", "B": "CAPM", "C": "Bond yield plus risk premium approach"}, "ans": "C", "en": "A is incorrect because the current share price of the company is unknown, and therefore the DDM cannot be used. The formula for calculating cost of equity (required ROE) using the DDM is:\nre = D1/P0 + g, where g is the dividend growth rate, D1 is the forward dividend and P0 is the current share price.\nB is incorrect because the equity (market) risk premium is unknown, and therefore the CAPM cannot be used. The formula for calculating cost of equity (required ROE) using the CAPM is:\nre = rf + β(ERP), where rf is the risk-free rate, β is the estimated beta, and ERP is the equity risk premium.\nC is correct because the cost of debt and the risk premium over the cost of debt are known, so the cost of equity (required ROE) can be calculated using the bond yield plus risk premium approach (BYPRP). The BYPRP is:\nre = rd + RP, where rd is the cost of debt and RP is the risk premium over the cost of debt. In this case re = 6% + 7% = 13%.", "ko": "부채비용 6%와 '부채비용 대비 위험프리미엄' 7%가 있으니 bond yield plus risk premium으로 계산할 수 있습니다: 6 + 7 = 13%.", "trap": "7%는 '채권 대비' 프리미엄이지 ERP가 아님 → CAPM 불가. 주가가 없어 DDM 불가.", "f": "BYPRP: re = rd + RP ; DDM: re = D1/P0 + g ; CAPM: re = rf + β × ERP", "why": {"A": "현재 주가 P0가 없어 D1/P0 + g를 계산할 수 없습니다.", "B": "ERP(시장 위험프리미엄)가 없습니다. 7%는 부채비용 대비 프리미엄입니다."}, "orig": "ECO Module 3 Q22"}, {"id": "ECO-M3-Q25", "src": "ECO 오답", "module": 3, "tag": "Bottom-up 요인 비교: 집중도·레버리지·유형자산", "vig": null, "stem": "An analyst gathers the following information about cost of capital factors for three companies:\n\tCompany 1\tCompany 2\tCompany 3\nRevenue concentration\tLow\tHigh\tLow\nFinancial leverage\tLow\tLow\tHigh\nProportion of tangible assets\tHigh\tHigh\tLow\nBased only on this information, the company that most likely has the lowest cost of capital is:", "opts": {"A": "Company 1.", "B": "Company 2.", "C": "Company 3."}, "ans": "A", "en": "A is correct because it is companies that generate a majority of their revenues from a few customers, and thus face customer concentration risk, which have higher sales risk. Also, companies with higher operating and financial leverage (or a higher proportion of fixed costs and debt burden) have greater earnings volatility. Moreover, tangible assets are physical assets such as property, plant and equipment, and inventory. In general, companies with primarily tangible assets are likely to be able to access debt capital at lower cost than companies with a high proportion of intangible assets because they have the ability to pledge these assets as collateral. Company 1 has low revenue concentration and financial leverage, as well as a high proportion of tangible assets. Therefore, Company 1 most likely has the lowest cost of capital among the companies.\nB is incorrect because companies that generate a majority of their revenues from a few customers, and thus face customer concentration risk, have higher sales risk. As Company 2 has high revenue concentration, it most likely has a higher cost of capital than Company 1.\nC is incorrect because companies with higher operating and financial leverage (or a higher proportion of fixed costs and debt burden) have greater earnings volatility. Moreover, tangible assets are physical assets such as property, plant and equipment, and inventory. In general, companies with primarily tangible assets are likely to be able to access debt capital at lower cost than companies with a high proportion of intangible assets because they have the ability to pledge these assets as collateral. As Company 3 has high financial leverage and a low proportion of tangible assets, it most likely has a higher cost of capital than Company 1.", "ko": "매출 집중도 낮음(매출 위험↓), 재무레버리지 낮음(이익 변동성↓), 유형자산 비중 높음(담보로 싸게 차입) → 세 요인 모두 유리한 Company 1의 자본비용이 가장 낮습니다.", "trap": "유형자산 비중↑ = 회수율↑ → 위험프리미엄↓.", "f": "", "why": {"B": "매출 집중도가 높아 매출 위험이 큽니다.", "C": "재무레버리지가 높고 유형자산 비중이 낮아 자본비용이 높습니다."}, "orig": "ECO Module 3 Q25"}, {"id": "ECO-M3-Q26", "src": "ECO 오답", "module": 3, "tag": "상장 straight debt 부채비용", "vig": null, "stem": "A company has publicly traded debt with no embedded options. Which of the following is the best estimate of the company’s cost of debt?", "opts": {"A": "Estimated credit spread plus benchmark risk-free rate", "B": "Yield to maturity on the company’s existing debt with the longest maturity", "C": "Yield to maturity of bonds of other companies with the same or similar maturities and credit ratings"}, "ans": "B", "en": "A is incorrect because this is the cost of debt estimation for non-traded debt, but not publicly traded debt. The analyst can determine the current credit spread for that credit rating and maturity of the company’s debt. This credit spread is then added to the benchmark risk-free rate to arrive at an estimate of the cost of debt for the subject company.\nB is correct because if a company has publicly traded debt with no embedded options, otherwise known as straight debt, the yield to maturity (YTM) on the company’s existing debt with the longest maturity could be a reasonable estimate of the company’s cost of issuing straight debt.\nC is incorrect because this is the cost of debt estimation for non-traded debt, but not publicly traded debt. An analyst can check whether credit ratings exist for the company’s debt securities. If so, one approach to estimating a company’s cost of debt is to use the yields to maturity of bonds of other companies with the same or similar maturities and credit ratings and apply matrix pricing to estimate a YTM for the subject company’s bonds.", "ko": "옵션 없는 공개 거래 채권이 있으면, 만기가 가장 긴 기존 채권의 YTM이 부채비용의 가장 좋은 추정치입니다(최장기물 거래가 뜸하면 신뢰할 만한 짧은 만기 채권 사용).", "trap": "Matrix pricing·등급별 스프레드 방식은 비거래·무등급 채권용.", "f": "", "why": {"A": "신용스프레드 + 벤치마크 금리는 거래되지 않는 채권에 쓰는 방법입니다.", "C": "같은 만기·등급 다른 회사 채권 YTM(matrix pricing)도 비거래 채권용입니다."}, "orig": "ECO Module 3 Q26"}, {"id": "ECO-M3-Q27", "src": "ECO 오답", "module": 3, "tag": "부채비용 영향 요인", "vig": null, "stem": "Which of the following statements about factors influencing the cost of debt is most accurate?", "opts": {"A": "Amortizing loans typically have a lower cost of debt than non-amortizing loans", "B": "An issuer's overall credit rating is equal to the credit ratings on its issued securities", "C": "Sovereign risk measures the factors of political stability, economic competitiveness, and human development"}, "ans": "A", "en": "A is correct because amortizing loans typically have a lower cost of debt because of their lower default risk, given that some portion of principal is being repaid over the loan term. In contrast, non-amortizing loans, where the entire principal is repaid at maturity, similar to a bullet bond, typically have higher default risk and a higher cost of debt.\nB is incorrect because the issuer’s overall credit rating might be different than the credit ratings on its issued securities. Further, some companies have different credit ratings for their own different outstanding debt issues, based on bond features. For instance, a company could have both AA- and A-rated debt, with the AA debt granting more protection to the investor through collateral, seniority, convertibility, or other features.\nC is incorrect because sovereign risk is a component of country risk and relates to a country’s likelihood of defaulting on its debt obligations, whereas country risk includes the factors beyond the sovereign risk, such as political stability, economic competitiveness, and human development.", "ko": "원금을 나눠 갚는 amortizing 대출은 부도위험이 낮아 만기 일시상환(bullet) 대출보다 부채비용이 낮습니다.", "trap": "Issuer rating ≠ issue rating. Sovereign risk(국가 부도 가능성) ⊂ country risk(정치·경제·인간개발 포함).", "f": "", "why": {"B": "발행자 전체 신용등급은 개별 채권 등급(선순위·담보·전환권 등에 따라 다름)과 다를 수 있습니다.", "C": "정치 안정성·경제 경쟁력·인간개발은 country risk에 들어가는 요인입니다. Sovereign risk는 국가 채무불이행 가능성만 뜻합니다."}, "orig": "ECO Module 3 Q27"}, {"id": "VAR-M3-01", "src": "변형", "module": 3, "tag": "Country risk premium (Damodaran)", "vig": null, "stem": "An emerging market's sovereign yield spread over a developed-market benchmark is 2.0%. The annualized standard deviation of the emerging market's equity index is 24%, and that of its sovereign bond market is 16%. Using Damodaran's adjustment, the country risk premium is closest to:", "opts": {"A": "1.3%.", "B": "2.0%.", "C": "3.0%."}, "ans": "C", "en": "Damodaran recommended adjusting the sovereign yield spread by the ratio of the standard deviation of the country’s equity market to that of its bond market: CRP = 2.0% × (24% / 16%) = 3.0%.", "ko": "CRP = 국채 수익률 스프레드 × (주식시장 표준편차 / 채권시장 표준편차) = 2.0% × 24/16 = 3.0%.", "trap": "비율은 주식/채권(주식이 분자). 뒤집으면 1.3%.", "f": "CRP = sovereign yield spread × (σ_equity / σ_bond)", "why": {"A": "비율을 뒤집어(16/24) 곱한 값입니다.", "B": "변동성 조정을 하지 않은 국채 스프레드 그대로입니다."}, "orig": "변형 (오답노트 R15, Schweser LOS 15.e)"}, {"id": "VAR-M3-02", "src": "변형", "module": 3, "tag": "우선주 자본비용 (시장가 > 액면)", "vig": null, "stem": "A company's perpetual preferred stock has a par value of $100 and an annual dividend rate of 6%. The preferred shares currently trade at $120. The cost of the preferred equity is closest to:", "opts": {"A": "5.0%.", "B": "6.0%.", "C": "7.2%."}, "ans": "A", "en": "The cost of preferred equity = D / P0 = (6% × $100) / $120 = $6 / $120 = 5.0%.", "ko": "배당 = 액면 $100 × 6% = $6. 자본비용 = 6 / 120 = 5.0%. 시장가가 액면보다 높으니 자본비용 < 배당률.", "trap": "배당은 액면 기준, 나누는 가격은 시장가.", "f": "r_p = (par × 배당률) / 시장가", "why": {"B": "표면 배당률일 뿐입니다.", "C": "배당을 시장가 기준(6% × 120)으로 계산한 오류입니다."}, "orig": "변형 (오답노트 R15, ECO M3 Q18)"}, {"id": "VAR-M3-03", "src": "변형", "module": 3, "tag": "Grinold–Kroner: 기대 인플레이션 추정", "vig": null, "stem": "The yield to maturity on a 10-year Treasury bond is 4.0%, and the yield on a 10-year Treasury inflation-protected security (TIPS) is 1.5%. The expected inflation rate to use in the Grinold–Kroner model is closest to:", "opts": {"A": "1.50%.", "B": "2.46%.", "C": "4.00%."}, "ans": "B", "en": "Expected inflation = (1 + YTM on Treasury) / (1 + YTM on TIPS) − 1 = 1.040 / 1.015 − 1 = 2.46%.", "ko": "i = (1 + 명목 국채 수익률) / (1 + TIPS 수익률) − 1 = 1.04 / 1.015 − 1 = 2.46%.", "trap": "TIPS 수익률(실질금리)이나 명목 수익률을 그대로 인플레이션으로 쓰지 않는다.", "f": "i = (1 + YTM_Treasury) / (1 + YTM_TIPS) − 1", "why": {"A": "TIPS 수익률은 실질금리이지 인플레이션이 아닙니다.", "C": "명목 국채 수익률에는 실질금리도 들어 있습니다."}, "orig": "변형 (오답노트 R15, Schweser LOS 15.c)"}, {"id": "VAR-M3-04", "src": "변형", "module": 3, "tag": "Historical ERP: survivorship bias", "vig": null, "stem": "A historical equity risk premium estimate that includes only firms that survived the entire measurement period is most likely:", "opts": {"A": "biased upward.", "B": "biased downward.", "C": "unbiased, provided the sample covers several business cycles."}, "ans": "A", "en": "A concern with a historical estimate is that it may suffer from survivorship bias: it will be upward-biased if only firms that have survived during the period of measurement are included in the sample.", "ko": "망한 회사(나쁜 수익률)가 빠지고 살아남은 회사만 남으면 평균 수익률이 높게 나와 ERP가 위로 편향됩니다.", "trap": "역사적 추정 약점 = survivorship bias(상향), 비정상성(stationarity 가정). 전망적 추정은 이 문제가 적음.", "f": "", "why": {"B": "살아남은 회사만 포함하면 수익률이 높게 측정돼 위쪽으로 편향됩니다.", "C": "표본 기간을 늘려도 생존 편향은 없어지지 않습니다."}, "orig": "변형 (오답노트 R15, Schweser LOS 15.c)"}, {"id": "ECO-M4-Q4", "src": "ECO 오답", "module": 4, "tag": "Sum-of-the-parts EV (세그먼트별 배수)", "vig": 5, "stem": "Based on Exhibit 1 and the peer median EV/EBITDA multiples, Saturn’s estimated enterprise value is closest to:", "opts": {"A": "USD392,000 million.", "B": "USD408,000 million.", "C": "USD421,440 million."}, "ans": "C", "en": "C is correct. USD421,440 million is calculated as follows:\nUpstream: USD14,400 × 19 = USD273,600.\nMidstream: USD5,760 × 17 = USD97,920.\nDownstream: USD3,840 × 13 = USD49,920.\nConsolidated: USD421,440 million.\nA is incorrect because USD392,000 million is incorrectly calculated by using the average of the peer segment multiples [(19 + 17 + 13)/3 = 16.33] to estimate the consolidated enterprise value.\nUpstream: USD14,400 × 16.33 = USD234,720.\nMidstream: USD5,760 × 16.33 = USD93.888.\nDownstream: USD3,840 × 16.33 = USD62,592.\nConsolidated: USD392,000 million.\nB is incorrect because USD408,000 million is Saturn’s current enterprise value, not the estimated enterprise value based on median peer multiples for all three segments.", "ko": "세그먼트마다 해당 peer 중앙값 배수를 곱해 더합니다: 14,400 × 19 = 273,600, 5,760 × 17 = 97,920, 3,840 × 13 = 49,920 → 합계 USD421,440m.", "trap": "평균 배수 하나를 전체 EBITDA에 곱하지 않는다.", "f": "SOTP EV = Σ (세그먼트 EBITDA × 세그먼트 peer 배수)", "why": {"A": "세 배수의 평균 16.33을 모든 세그먼트에 쓴 값입니다.", "B": "Saturn의 현재 EV(24,000 × 17)입니다."}, "orig": "ECO Module 4 Q4"}, {"id": "ECO-M4-Q5", "src": "ECO 오답", "module": 4, "tag": "Comparable company analysis 장단점", "vig": 5, "stem": "Which of Chang’s colleague’s three statements is correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "B", "en": "B is correct. An advantage of the comparable company analysis method is that estimates of value are derived directly from the market. This approach is unlike the discounted cash flow method, in which the value is determined based on many assumptions and estimates. A is incorrect because the comparable company analysis method is sensitive to market mispricing. As an example, suppose that all the comparable companies are currently overvalued by the market. A valuation relative to those companies may suggest a value that is too high in the sense that values would be revised downward upon a correction. C is incorrect because the comparable company analysis method provides a reasonable approximation of a target company’s value relative to similar companies (not transactions) in the market. It assumes that “like” assets should be valued on a similar basis in the market.", "ko": "Statement 2가 맞습니다. CCA는 DCF처럼 많은 가정에 기대지 않고 시장 가격에서 직접 가치를 얻는 것이 장점입니다.", "trap": "CCA = 유사 '기업'의 시장가격(시장 오류에 민감, 프리미엄 별도 추정) / CTA = 유사 '거래'의 가격.", "f": "", "why": {"A": "CCA는 비교 기업들이 시장에서 잘못 평가돼 있으면 그 오류가 그대로 옮겨오므로 mispricing에 민감합니다.", "C": "유사 '거래(transactions)' 대비 가치는 CTA의 설명입니다. CCA는 유사 '기업' 대비입니다."}, "orig": "ECO Module 4 Q5"}, {"id": "ECO-M4-Q8", "src": "ECO 오답", "module": 4, "tag": "인수 후 자본구조(자기자본 비중)", "vig": 6, "stem": "The weight of equity in Stratton’s capital structure as a result of the acquisition of Midwest assuming Lee’s two assumptions is closest to:", "opts": {"A": "29%.", "B": "71%.", "C": "81%."}, "ans": "B", "en": "B is correct. Prior to the acquisition, Stratton had approximately (62 − 4.3 − 26 =) USD31.7 billion in debt and (1.096 billion shares × USD125 =) USD137.0 billion in equity: 19% debt and 81% equity. After the acquisition, Stratton will have USD62 billion in debt and (1.096 billion + 104 million =) 1.2 billion shares, which at USD125 per share is USD150 billion in equity: 29% debt and 71% equity.\nA is incorrect because 29% is the weight of debt after the acquisition. C is incorrect because 81% is the weight of equity prior to the acquisition.", "ko": "인수 전 부채 = 62 − 4.3 − 26 = 31.7bn, 자기자본 = 1.096bn × 125 = 137bn → 19% / 81%. 인수 후 부채 62bn, 주식 1.2bn × 125 = 150bn → 부채 29%, 자기자본 71%.", "trap": "질문이 '인수 후' '자기자본' 비중인지 확인.", "f": "w_E = E / (D + E), E = 주식 수 × 주가", "why": {"A": "인수 후 부채 비중입니다.", "C": "인수 전 자기자본 비중입니다."}, "orig": "ECO Module 4 Q8"}, {"id": "ECO-M4-Q10", "src": "ECO 오답", "module": 4, "tag": "Conglomerate discount 계산", "vig": 6, "stem": "Stratton’s estimated conglomerate discount just prior to the announcement is:", "opts": {"A": "−USD17 billion.", "B": "USD0.", "C": "USD17 billion."}, "ans": "C", "en": "C is correct. The estimated conglomerate discount just prior to the announcement is calculated as follows: Total estimated enterprise value from sum-of-the-parts valuation − Current trading enterprise value = USD187 billion − USD170 billion = USD17 billion. A is incorrect because it incorrectly subtracts the estimated enterprise value from the current trading enterprise value. B is incorrect because the estimated and current trading enterprise values are not equal.", "ko": "Conglomerate discount = SOTP EV − 현재 거래 EV = 187 − 170 = USD17bn(양수).", "trap": "부호: SOTP가 시장 EV보다 크면 그 차이가 discount(양수로 표시).", "f": "Conglomerate discount = SOTP EV − Current trading EV", "why": {"A": "뺄셈 순서를 바꾼 값입니다.", "B": "두 EV가 같지 않습니다."}, "orig": "ECO Module 4 Q10"}, {"id": "ECO-M4-Q11", "src": "ECO 오답", "module": 4, "tag": "수직계열화 → Acquisition", "vig": null, "stem": "A company seeking to increase vertical integration will most likely pursue a(n):", "opts": {"A": "acquisition.", "B": "divestment.", "C": "balance sheet restructuring."}, "ans": "A", "en": "A is correct because vertical integration is achieved through an acquisition. Moreover, a corporation may be dependent on another company for inputs or for distribution of its products. By acquiring that company, the acquirer will increase its vertical integration, which can result in lower costs and lower risks and provides a more compelling proposition to customers and investors.\nB is incorrect because divesting assets typically would either reduce or have no effect on vertical integration. The source of performance improvement for the divested business may be increased management attention, focus, or effort and potential synergies with the acquirer.\nC is incorrect because the motivation of a balance sheet restructuring is typically not vertical integration, but rather improving returns on capital. There are two general types of issuer-specific motivations for restructuring actions: opportunistic improvement and forced improvement. Opportunistic improvement includes actions that alter the business model, trim the cost structure, or modify the composition of the balance sheet—all with the intention to improve returns on capital. Forced improvements are actions taken to enhance returns on capital when profitability falls below investors’ required rate of return.", "ko": "원재료 공급처나 유통사를 사들이면 수직계열화가 됩니다. 즉 인수(acquisition)입니다.", "trap": "Divestment는 계열화를 줄이거나 무관. Balance sheet restructuring은 자본수익률 개선 목적.", "f": "", "why": {"B": "자산을 팔면 수직계열화는 줄거나 변화가 없습니다.", "C": "재무상태표 구조조정(sale-leaseback, dividend recap 등)의 목적은 자본수익률 개선이지 수직계열화가 아닙니다."}, "orig": "ECO Module 4 Q11"}, {"id": "ECO-M4-Q13", "src": "ECO 오답", "module": 4, "tag": "CTA: 중앙값 P/E로 적정 인수가", "vig": null, "stem": "An analyst gathers the following information in conducting comparable transaction analysis of an acquisition. For her analysis, she uses the median of valuation ratios from three recently closed comparable acquisitions.\nValuation Variable\tAcquired Company 1\tAcquired Company 2\tAcquired Company 3\nAcquisition share price\t$30\t$40\t$50\nEPS\t$2.50\t$2.20\t$3.00\nIf the target company had an EPS of $2.50 and was acquired at a price of $40 per share, the analyst should conclude that the acquirer:", "opts": {"A": "underpaid for this transaction.", "B": "paid fair value for this transaction.", "C": "overpaid for this transaction."}, "ans": "A", "en": "A is correct because the P/E ratio for the three companies is $30/$2.50 = 12 for Company 1, $40/$2.20 = 18.2 for Company 2 and $50/$3.00 = 16.7 for Company 3. The median of these three ratios is 16.7 and the estimated fair takeover value is 16.7 × $2.5 = $41.75. Compared to an acquisition price of $40, the acquirer underpaid for this transaction.\nB is incorrect because as demonstrated in the correct answer, the acquirer underpaid for this transaction.\nC is incorrect because as demonstrated in the correct answer, the acquirer underpaid for this transaction.", "ko": "거래 P/E: 30/2.50 = 12, 40/2.20 = 18.2, 50/3.00 = 16.7 → 중앙값 16.7. 적정 인수가 = 16.7 × 2.50 = $41.75 > 실제 $40 → 덜 지불(underpaid).", "trap": "중앙값은 '배수'의 중앙값(16.7). 가격 $40의 중앙값과 같다고 fair라고 보면 함정.", "f": "적정가 = 중앙값(거래가/EPS) × 타깃 EPS", "why": {"B": "인수가격 $40이 비교 거래 가격의 중앙값과 같아 보일 뿐, 배수 기준 적정가는 $41.75입니다.", "C": "적정가($41.75)보다 낮게 샀으므로 과다 지불이 아닙니다."}, "orig": "ECO Module 4 Q13"}, {"id": "ECO-M4-Q15", "src": "ECO 오답", "module": 4, "tag": "Synergy-adjusted 인수 배수", "vig": null, "stem": "An analyst gathers the following information about a firm that is an acquisition target:\nMost recent annual EBITDA (in millions)\t$356\nEV (in millions)\t$6,000\nEV/EBITDA range of peers\t8x to 12x\nIf the acquirer expects to realize $270 million in EBITDA synergies by Year 2, the acquisition multiple implied by this transaction:", "opts": {"A": "is lower than the range of peers.", "B": "falls within the range of peers.", "C": "is higher than the range of peers."}, "ans": "B", "en": "A is incorrect because the multiple falls within the range of peers. One could arrive at this incorrect answer by subtracting the multiple before synergies from the multiple after synergies. In this case, 6,000/270 – 6,000/356 = 5.37x, which is lower than the range of peers' multiples.\nB is correct because if synergies are included in the analysis, the acquisition EV/EBITDA multiple would be: 6,000/(270 + 356) = 9.58x, which falls within the range of peers' multiples.\nC is incorrect because the multiple falls within the range of peers. One could arrive at this incorrect answer if the synergies are not included in the analysis. In this case, the acquisition multiple would be: 6,000 / 356 = 16.85x, which is higher than the range of peers' multiples.", "ko": "시너지 포함 배수 = 6,000 / (356 + 270) = 9.58x → peer 범위 8~12x 안.", "trap": "시너지를 분모 EBITDA에 더한다. 빼거나 무시하지 않는다.", "f": "Synergy-adjusted multiple = EV / (타깃 EBITDA + EBITDA 시너지)", "why": {"A": "시너지 후 배수에서 시너지 전 배수를 뺀 엉뚱한 계산(5.37x)입니다.", "C": "시너지를 반영하지 않은 배수(6,000 / 356 = 16.85x)입니다."}, "orig": "ECO Module 4 Q15"}, {"id": "ECO-M4-Q16", "src": "ECO 오답", "module": 4, "tag": "Cost restructuring: 영업비용 감축률", "vig": null, "stem": "A company has $189 million in sales and $17 million of EBIT. All else equal, if the company restructures its operations to achieve an EBIT margin of 20%, the required percentage reduction in its operating expenses is closest to:", "opts": {"A": "9.9%.", "B": "11.0%.", "C": "12.1%."}, "ans": "C", "en": "A is incorrect because the percentage reduction in operating expenses is incorrectly calculated as EBIT divided by the operating expenses, or $17 million / $172 million = 9.9%.\nB is incorrect because the percentage reduction in operating expenses is incorrectly calculated as the target EBIT margin minus the actual EBIT margin, or 20% – 9% = 11%, where the current EBIT margin is calculated as EBIT/sales, or $17 million/$189 million = 9.0%.\nC is correct because the company's current EBIT margin is $17 million/$189 million = 9.0% which implies that the company had operating expenses of Sales – EBIT = $189 million – $17 million = $172 million. To achieve an EBIT margin of 20%, EBIT needs to be $189 million × 20% = $37.8 million, and the company must decrease its operating expenses by $37.8 million – $17 million = $20.8 million. In percent, the reduction is equal to $20.8 million/$172 million = 12.1%.", "ko": "현재 영업비용 = 189 − 17 = $172m. 목표 EBIT = 189 × 20% = $37.8m → 비용을 37.8 − 17 = $20.8m 줄여야 함. 감축률 = 20.8 / 172 = 12.1%.", "trap": "'영업비용' 대비 비율을 묻는다. 마진 차이(20% − 9%)가 답이 아님.", "f": "감축률 = (목표 EBIT − 현재 EBIT) / 현재 영업비용", "why": {"A": "EBIT / 영업비용(17 / 172)입니다.", "B": "목표 마진 − 현재 마진(20% − 9%)입니다. 매출 대비 비율이지 영업비용 대비가 아닙니다."}, "orig": "ECO Module 4 Q16"}, {"id": "ECO-M4-Q17", "src": "ECO 오답", "module": 4, "tag": "구조조정 분석 4단계: Initial evaluation", "vig": null, "stem": "The initial evaluation phase of a corporate restructuring typically includes:", "opts": {"A": "modeling the pro forma financial statements.", "B": "determining the materiality of the restructuring.", "C": "conducting a preliminary valuation of the transaction."}, "ans": "B", "en": "A is incorrect because this is part of the third step (modelling and valuation) of the corporate restructuring.\nB is correct because the third question in the initial evaluation step is determining materiality.\nC is incorrect because this is the second step, after the initial evaluation.", "ko": "1단계 initial evaluation은 What, Why, When, Is it material? 네 질문에 답하는 단계라 materiality 판단이 포함됩니다.", "trap": "1 Initial evaluation → 2 Preliminary valuation → 3 Modeling & valuation(pro forma) → 4 Update investment thesis.", "f": "", "why": {"A": "Pro forma 재무제표 작성은 3단계(modeling and valuation)입니다.", "C": "예비 가치평가는 2단계입니다."}, "orig": "ECO Module 4 Q17"}, {"id": "ECO-M4-Q18", "src": "ECO 오답", "module": 4, "tag": "신주 조달 인수 → WACC", "vig": null, "stem": "A company acquires another company that has a similar structure. If the acquisition is financed entirely with new equity, and both the cost of debt and the cost of equity of the issuer are not expected to change after the transaction, the WACC of the acquirer would most likely:", "opts": {"A": "decrease.", "B": "not change.", "C": "increase."}, "ans": "C", "en": "A is incorrect because both companies have a similar capital structure, so the combined capital structure should be similar. The fact that the transaction is not financed with debt and there is no increase in leverage could point to lower cost of capital, but considering the new equity raised, the weight of equity in the capital structure should increase relative to the weight of debt. Because the cost of equity is higher than cost of debt, WACC should increase, not decrease.\nB is incorrect because both companies have a similar capital structure, so the combined capital structure should be similar. Although cost of debt and cost of equity do not change, which could point to this choice, considering the new equity raised, the weight of equity in the capital structure of WACC should increase relative to the weight of debt. Because the cost of equity is higher than cost of debt, WACC should increase, not remain unchanged.\nC is correct because both companies have a similar capital structure, so the combined capital structure should be similar. But considering the new equity raised, the weight of equity in the capital structure of WACC should increase relative to the weight of debt. Because the cost of equity is normally higher than cost of debt, WACC should increase.", "ko": "두 회사 자본구조가 비슷해도, 신주로만 조달하면 자기자본 비중이 늘어납니다. 자기자본비용 > 부채비용이므로 각 비용이 그대로여도 가중평균인 WACC는 올라갑니다.", "trap": "비용(re, rd)이 안 변해도 '가중치'가 변하면 WACC가 변한다.", "f": "WACC = w_D × rd(1 − t) + w_E × re", "why": {"A": "레버리지가 늘지 않는다는 점만 보면 낮아질 것 같지만, 비싼 자기자본 비중이 커져 오릅니다.", "B": "re와 rd는 그대로여도 자기자본 비중이 커져 WACC가 바뀝니다."}, "orig": "ECO Module 4 Q18"}, {"id": "ECO-M4-Q23", "src": "ECO 오답", "module": 4, "tag": "인수 후 부채 비중 계산", "vig": null, "stem": "An analyst gathers the following information about two companies:\n\tCompany A\tCompany B\nOutstanding debt\t$22 billion\t$4 billion\nNumber of shares outstanding\t500 million\t125 million\nShare price\t$100\t$45\nCompany A recently announced its intent to acquire Company B. To fund the acquisition, Company A will issue 50 million new shares, raise $7 billion in new debt, and fund the remainder with cash on hand. Company A will also repay Company B's outstanding debt using proceeds from the debt issuance. The book value of Company A's debt is equal to its market value. If the share prices remain unchanged following the acquisition, the weight of debt in Company A's capital structure as a result of the acquisition of Company B is closest to:", "opts": {"A": "32%.", "B": "35%.", "C": "38%."}, "ans": "B", "en": "A is incorrect because the number of outstanding shares following the acquisition are calculated as the sum of the number of shares outstanding of both companies, 500 million + 125 million = 625 million. The resulting value of equity is then calculated as 625 million × $100 = $62.5 billion.  Total debt following the acquisition is correctly calculated as $22 billion + $7 billion = $29 billion. The weight of debt is then calculated as $29 billion/($29 billion + $62.5 billion) = 0.3169 ≈ 32%.\nB is correct because following the acquisition, Company's A debt amounts to $22 billion + $7 billion = $29 billion. Its number of shares outstanding will be 500 million + 50 million = 550 million, thus resulting in total equity of 550 million × $100 = $55 billion. The weight of debt is then $29 billion/($29 billion + $55 billion) = 0.3452 ≈ 35%\nC is incorrect because the calculation for Company A's debt includes the outstanding debt of Company B, which is incorrect as it is repaid by the acquirer. Company's A debt is incorrectly calculated as $22 billion + $4 billion + $7 billion = $33 billion. Its number of shares outstanding are correctly calculated as 500 million + 50 million = 550 million, resulting in total equity of 550 million × $100 = $55 billion. The weight of debt is then incorrectly calculated as $33 billion/($33 billion + $55 billion) = 0.375 ≈ 38%", "ko": "부채 = 22 + 7 = $29bn(B의 부채 4bn은 상환되므로 제외). 주식 = 500m + 50m = 550m × $100 = $55bn. 부채 비중 = 29 / (29 + 55) = 34.5% ≈ 35%.", "trap": "B의 부채는 신규 차입금으로 갚으니 이중으로 더하지 않는다. 새 주식은 50m주뿐.", "f": "w_D = D / (D + E)", "why": {"A": "B의 주식 수 125m을 더해 주식을 625m으로 본 오류입니다. A가 새로 발행하는 주식은 50m주입니다.", "C": "상환되는 B의 부채 $4bn을 부채에 더한 오류입니다."}, "orig": "ECO Module 4 Q23"}, {"id": "ECO-M4-Q29", "src": "ECO 오답", "module": 4, "tag": "Conglomerate discount: 본사비용 배분", "vig": null, "stem": "An analyst gathers the following information about Best Shopping Ltd, a conglomerate with online and retail store subsidiaries:\nEBITDA of online subsidiary\t$88.0 million\nEBITDA of retail store subsidiary\t$105.0 million\nCorporate costs\t$4.8 million\nMedian EV/EBITDA multiple of peers of the online subsidiary\t8.6\nMedian EV/EBITDA multiple of peers of the retail store subsidiary\t6.3\nAll corporate costs are allocated to the online subsidiary. If Best Shopping is trading at an EV of $1,350.0 million, its conglomerate discount is closest to:", "opts": {"A": "$27.0 million.", "B": "$38.1 million.", "C": "$77.2 million."}, "ans": "A", "en": "A is correct because a sum-of-the-parts valuation yields the following:\nEV of online subsidiary: ($88.0 million – $4.8 million) × 8.6 = $715.52 million\nEV of retail store subsidiary: $105.0 million × 6.3 = $661.50 million\nSum-of-the-parts EV = $715.52 million + $661.50 million = $1,377.02 million\nTrading EV = $1,350.00 million\nConglomerate discount = $1,377.02 million – $1,350.00 million = $27.02 million ≈ $27.0 million.\nB is incorrect because corporate costs are allocated to the retail store subsidiary, rather than the online subsidiary.\nEV of online subsidiary: $88.0 million × 8.6 = $756.80 million\nEV of retail store subsidiary: ($105.0 million – $4.8 million) × 6.3 = $631.26 million\nSum-of-the-parts EV = $756.80 million + $631.26 million = $1,388.06 million\nTrading EV = $1,350.00 million\nConglomerate discount = $1,388.06 million – $1,350.00 million = $38.06 million ≈ $38.1 million.\nC is incorrect because multiples are applied to the incorrect subsidiaries.\nEV of online subsidiary: ($88.0 million – $4.8 million) × 6.3 = $524.16 million\nEV of retail store subsidiary: $105.0 million × 8.6 = $903.00 million\nSum-of-the-parts EV = $524.16 million + $903.00 million = $1,427.16 million\nTrading EV = $1,350.00 million\nConglomerate discount = $1,427.16 million – $1,350.00 million = $77.16 million ≈ $77.2 million.", "ko": "온라인 EV = (88.0 − 4.8) × 8.6 = 715.52, 오프라인 EV = 105.0 × 6.3 = 661.50 → SOTP = 1,377.02. Discount = 1,377.02 − 1,350 = $27.0m.", "trap": "본사비용은 지시된 세그먼트(온라인)의 EBITDA에서 빼고, 그 세그먼트의 배수를 곱한다.", "f": "Conglomerate discount = Σ(조정 EBITDA × 해당 배수) − 현재 EV", "why": {"B": "본사비용을 오프라인 자회사에 배분한 값입니다.", "C": "두 자회사의 배수를 서로 바꿔 쓴 값입니다."}, "orig": "ECO Module 4 Q29"}, {"id": "ECO-M4-Q30", "src": "ECO 오답", "module": 4, "tag": "Conglomerate discount: 세그먼트별 다른 배수", "vig": null, "stem": "An analyst gathers the following information about a company with two business segments:\n\tSegment 1\tSegment 2\nSales revenue\t$100 million\t$50 million\nEBITDA (before corporate cost allocation)\t$10 million\t$12 million\nCorporate/unallocated cost\t---\t–$2 million\nRelevant peer multiple\tEV/Sales 1.0x\tEV/EBITDA 12.0x\nIf the company currently trades at a total EV/EBITDA multiple of 10.0x, the conglomerate discount is closest to:", "opts": {"A": "zero.", "B": "$20 million.", "C": "$40 million."}, "ans": "B", "en": "B is correct. Sum-of-the-parts EV = Segment 1 (100 × 1.0x EV/Sales = 100) + Segment 2 ((12 − 2) × 12.0x EV/EBITDA = 120) = $220 million. The current EV of the company is $200 million (= $20 million EBITDA after corporate costs × 10.0x). Conglomerate discount = $220 million − $200 million = $20 million.\nA is incorrect because it omits the corporate cost allocation when calculating the current value of the business as $220 million (= $22 million EBITDA × 10.0x), giving a discount of zero.\nC is incorrect because it uses the EV/EBITDA multiple of Segment 2 to value Segment 1 (10 × 12.0x = 120 instead of 100 × 1.0x = 100), giving a sum of the parts of $240 million and a discount of $40 million.", "ko": "Segment 1 EV = 매출 100 × 1.0 = 100. Segment 2 EBITDA = 12 − 2 = 10 → EV = 10 × 12 = 120. SOTP = 220. 현재 EV = 전체 EBITDA(본사비용 반영) 20 × 10 = 200. Discount = 220 − 200 = $20m.", "trap": "세그먼트마다 주어진 배수 종류(EV/Sales vs EV/EBITDA)를 그대로 쓴다. 현재 EV도 본사비용 뺀 EBITDA로.", "f": "SOTP = Σ 세그먼트 EV ; Discount = SOTP − 현재 EV", "why": {"A": "현재 EV를 본사비용 차감 전 EBITDA 22 × 10 = 220으로 계산한 오류입니다.", "C": "Segment 1에 EV/Sales 대신 EV/EBITDA 12x를 써서 SOTP를 240으로 계산한 오류입니다."}, "orig": "ECO Module 4 Q30"}, {"id": "ECO-M4-Q31", "src": "ECO 오답", "module": 4, "tag": "사업부 매각 최소 수용가격(peer 중앙값)", "vig": null, "stem": "A conglomerate operates in two business segments, manufacturing and retail. The conglomerate is considering a sale of its retail business and gathers the following information (in $ millions) about three retail industry peers:\n\tEV\tEBITDA\nPeer 1\t1,200\t150\nPeer 2\t1,500\t125\nPeer 3\t900\t100\nAll else being equal, if the conglomerate's retail segment EBITDA is $50 million, the minimum amount (in $ millions) it should accept for a sale is closest to:", "opts": {"A": "400.", "B": "450.", "C": "600."}, "ans": "B", "en": "B is correct because it values the business at the median EV/EBITDA of its peers. Peer multiples: 1,200/150 = 8x, 1,500/125 = 12x, 900/100 = 9x; median = 9x. $50 × 9 = $450 million.\nA is incorrect because the segment is valued at Peer 1's multiple (8x), which is below the industry median of 9x.\nC is incorrect because this is closer to the maximum value the conglomerate is likely to receive, not the minimum. It is the valuation at the highest priced peer, Peer 2 (12x).", "ko": "Peer 배수: 1,200/150 = 8x, 1,500/125 = 12x, 900/100 = 9x → 중앙값 9x. 최소 수용가 = 50 × 9 = $450m.", "trap": "중앙값 배수를 쓴다. 최저(8x)나 최고(12x) 배수가 아님.", "f": "가치 = 세그먼트 EBITDA × peer 중앙값 EV/EBITDA", "why": {"A": "가장 낮은 Peer 1 배수(8x)를 쓴 값입니다. 업계 중앙값 9x보다 낮게 팔 이유가 없습니다.", "C": "가장 높은 Peer 2 배수(12x)를 쓴 값으로, 받을 수 있는 최대치에 가깝습니다."}, "orig": "ECO Module 4 Q31"}, {"id": "SCH-R16-01", "src": "Schweser MQ", "module": 4, "tag": "Sale-leaseback = Balance sheet restructuring", "vig": null, "stem": "A large retail pharmacy chain has made a significant capital investment to incorporate health care kiosks within their stores. If the company would like to receive cash up front in exchange for the kiosks, and yet retain the right for their future use, the company would most appropriately pursue a:", "opts": {"A": "spin-off.", "B": "balance sheet restructuring.", "C": "reorganization."}, "ans": "B", "en": "The company could unlock capital by undertaking a sale-and-leaseback transaction, which is considered to be a type of balance sheet restructuring.", "ko": "자산을 팔아 현금을 받고 다시 빌려 계속 쓰는 sale-and-leaseback은 balance sheet restructuring입니다.", "trap": "Balance sheet restructuring = sale-leaseback, dividend recapitalization.", "f": "", "why": {"A": "Spin-off는 사업부를 별도 회사로 떼어 주주에게 나눠주는 것으로 현금이 들어오지 않습니다.", "C": "Reorganization은 파산 절차에서 법원이 주도하는 구조조정입니다."}, "orig": "Schweser MQ 16.1 Q1"}, {"id": "SCH-R16-02", "src": "Schweser MQ", "module": 4, "tag": "Top-down 동인 vs CEO confidence", "vig": null, "stem": "Which of the following is least likely to represent a top-down driver of corporate actions?", "opts": {"A": "Industry shocks.", "B": "CEO confidence.", "C": "High security prices."}, "ans": "B", "en": "CEO confidence is associated with the level of corporate actions, but is not itself a top-down factor.", "ko": "Top-down 동인은 높은 증권가격과 산업 충격 두 가지입니다. CEO 자신감은 높은 증권가격이 거래를 늘리는 '이유' 중 하나일 뿐 그 자체가 top-down 동인은 아닙니다.", "trap": "", "f": "", "why": {"A": "산업 충격(업종 내 M&A 연쇄)은 top-down 동인입니다.", "C": "높은 증권가격은 top-down 동인입니다."}, "orig": "Schweser MQ 16.1 Q3"}, {"id": "VAR-M4-01", "src": "변형", "module": 4, "tag": "Spin-off vs Sale", "vig": null, "stem": "Compared with the sale of a division, a spin-off of the same division most likely:", "opts": {"A": "generates cash proceeds that can be returned to shareholders.", "B": "does not generate proceeds for the divesting company.", "C": "requires the divesting company to retain exposure to the business through a controlling stake."}, "ans": "B", "en": "A spin-off involves creating a new, separate legal entity and distributing equity in it to the divesting company’s shareholders. Unlike a sale, a spin-off does not generate any proceeds for the divesting company, and hence is easier to model.", "ko": "Spin-off는 새 회사를 만들어 그 주식을 기존 주주에게 나눠주는 것이라 회사에 매각대금이 들어오지 않습니다(그래서 모델링이 더 단순). 매각(sale)은 대금이 들어옵니다.", "trap": "Spin-off = 대금 없음 / Sale = 대금 있음.", "f": "", "why": {"A": "매각대금이 들어오는 것은 sale입니다.", "C": "Spin-off 후에는 분리된 회사의 주식이 주주에게 넘어가 모회사가 지배 지분을 남기지 않습니다."}, "orig": "변형 (오답노트 R16, Schweser LOS 16.a, 16.f)"}, {"id": "VAR-M4-02", "src": "변형", "module": 4, "tag": "CCA vs CTA: 인수 프리미엄", "vig": null, "stem": "Which valuation approach requires the analyst to estimate a takeover premium separately when valuing an acquisition target?", "opts": {"A": "Comparable company analysis", "B": "Comparable transaction analysis", "C": "Neither approach"}, "ans": "A", "en": "Comparable company analysis uses market prices of comparable companies, which provide an estimate of a fair stock price rather than a fair takeover price, so an appropriate takeover premium must be determined separately. Comparable transaction analysis uses actual takeover prices, which already include a takeover premium.", "ko": "CCA는 비교 기업의 '시장 주가'를 쓰므로 인수 프리미엄을 따로 더해야 합니다(그래서 주로 spin-off 평가에 사용). CTA는 실제 인수 '거래가'라 프리미엄이 이미 들어 있습니다.", "trap": "CCA = 프리미엄 별도 추정 / CTA = 프리미엄 내장.", "f": "", "why": {"B": "CTA는 실제 인수가격을 써서 프리미엄이 이미 포함돼 있습니다.", "C": "CCA는 프리미엄을 따로 추정해야 합니다."}, "orig": "변형 (오답노트 R16, Schweser LOS 16.c)"}, {"id": "VAR-M4-03", "src": "변형", "module": 4, "tag": "Materiality: cost restructuring 크기", "vig": null, "stem": "A company with revenues of $400 million and an enterprise value of $2 billion announces a cost restructuring expected to save $45 million per year. Based on size, an analyst would most likely conclude that the restructuring is:", "opts": {"A": "not material, because the savings are only about 2% of enterprise value.", "B": "material, because the savings exceed 10% of sales.", "C": "not material, because cost restructurings are evaluated only on fit."}, "ans": "B", "en": "Analysts typically evaluate materiality along the dimensions of size and fit. For an acquisition or divestiture, size is measured relative to the acquirer's enterprise value; a cost restructuring may be evaluated as estimated savings as a percentage of sales. A proportion greater than 10% generally indicates a material action. Here, $45 million / $400 million = 11.25%.", "ko": "비용 구조조정의 크기는 '절감액 ÷ 매출'로 봅니다: 45 / 400 = 11.25% > 10% → material. EV 대비 비율은 인수·매각 거래에 씁니다.", "trap": "인수·매각 = 거래가치 ÷ 인수 회사 EV / 비용 구조조정 = 절감액 ÷ 매출. 기준 10%.", "f": "", "why": {"A": "EV 대비 비율은 인수·매각 거래의 기준입니다. 비용 구조조정은 매출 대비로 봅니다.", "C": "Materiality는 크기(size)와 적합성(fit) 두 가지로 봅니다."}, "orig": "변형 (오답노트 R16, Schweser LOS 16.b)"}, {"id": "VAR-M4-04", "src": "변형", "module": 4, "tag": "Premium paid: unaffected price", "vig": null, "stem": "A target's shares traded at €20 one week before takeover rumors appeared and at €23 just before the deal was announced. The acquirer agrees to pay €25 per share. Using the unaffected price, the premium paid is closest to:", "opts": {"A": "25%.", "B": "20%.", "C": "9%."}, "ans": "A", "en": "Premium = (DP − UP) / UP, where UP is the unaffected (pre-announcement) price. Because rumors may already be reflected in the price just before the announcement, analysts use a week-old price or volume-weighted price over the prior week as UP. Premium = (€25 − €20) / €20 = 25%.", "ko": "Unaffected price는 루머 영향이 없는 가격(€20)을 씁니다. 프리미엄 = (25 − 20) / 20 = 25%.", "trap": "분모는 거래가가 아니라 unaffected price. 루머가 반영된 €23을 쓰면 프리미엄이 작게 나온다.", "f": "Premium = (DP − UP) / UP", "why": {"B": "거래가 €25로 나눈 값((25 − 20) / 25)입니다. 분모는 UP입니다.", "C": "루머가 반영된 €23을 UP로 쓴 값((25 − 23) / 23)입니다."}, "orig": "변형 (오답노트 R16, Schweser LOS 16.c)"}], "vignettes": ["John Ladan is an analyst in the research department of an international securities firm. Ladan is currently analyzing Yeta Products, a publicly traded global consumer goods company located in the United States. Selected data for Yeta are presented in Exhibit 1.\nExhibit 1: Selected Financial Data for Yeta Products\nMost Recent Fiscal Year\t\tCurrent\t\nPretax income\tUS$280 million\tShares outstanding\t100 million\nNet income after tax\tUS$182 million\tBook value per share\tUS$25.60\nCash flow from operations\tUS$235 million\tShare price\tUS$20.00\nCapital expenditures\tUS$175 million\t\t\nEarnings per share\tUS$1.82\t\t\nYeta currently does not pay a dividend, and the company operates with a target capital structure of 40% debt and 60% equity. However, on a recent conference call, Yeta’s management indicated that they are considering four payout proposals:\nProposal #1: Issue a 10% stock dividend.\nProposal #2: Repurchase US$40 million in shares using surplus cash.\nProposal #3: Repurchase US$40 million in shares by borrowing US$40 million at an after-tax cost of borrowing of 8.50%.\nProposal #4: Initiate a regular cash dividend.", "Barbara Carlyle is a financial adviser to high-net-worth individuals. She is currently reviewing the equity portfolio of a client and is considering adding new securities to it, as the client has indicated a preference for more income-producing securities. With this in mind, Carlyle takes a closer look at Avignon Corporation (“Avignon”), a chain of Canadian boutiques that has recently registered unusually high sales, resulting in large increases in the company’s cash balance. Avignon’s current stock price is C$47.33. Exhibit 1 shows earnings and dividends for the preceding four years.\nExhibit 1: Avignon Corporation Earnings and Dividend History\n\t2013\t2014\t2015\t2016\nEPS\tC$1.38\tC$1.39\tC$1.37\tC$1.44\nDPS\tC$0.20\tC$0.22\tC$0.22\tC$0.22\nCarlyle reviews analysts’ reports. She notes the significant change in cash due to the high sales volume and wonders whether that will prompt a dividend increase. However, most analysts have stated that because the industry is cyclical, the increase in sales is believed to be temporary.\nCarlyle asks her assistant, Richard Lee, to investigate whether Avignon might use its surplus cash for a share repurchase rather than for dividends. Lee, a junior analyst, comments that share repurchases can be beneficial for several reasons:\nStatement 1: The distribution of cash among shareholders is equivalent to what would have otherwise been distributed to them as dividends.\nStatement 2: Share repurchases provide greater flexibility to management than the payment of cash dividends.\nStatement 3: When directly negotiated, share repurchases can be used to purchase stock for less than the current market price.\nLee believes that looking at other companies that have completed share repurchases could be helpful to his analysis. He looks at the history of SpeedyPro Inc. (“SpeedyPro”), a US-based industrial services company whose business depends heavily on the petroleum exploration and production sector. SpeedyPro made its first share repurchase in early 2017 using surplus cash. SpeedyPro’s selected financial information just prior to the repurchase is shown in Exhibit 2.\nExhibit 2: SpeedyPro, Inc. Selected Financial Information as of Year-End 2016\nNet income\t$124 million\nEPS\t$1.24\nShares outstanding\t100 million\nCash available for repurchase\t$836 million\nShare price at the time of repurchase\t$38.00\nPremium over current share price for repurchase\t10.0%\nLee returns to Carlyle to continue the discussion. Carlyle explains to Lee that a complete analysis of the impact of a share repurchase should also include an evaluation of the effects on leverage. She points out that Avignon’s most recent bond issue includes a covenant that limits the company’s debt-to-equity ratio to 35%. She asks Lee to prepare an analysis for Avignon, using the information in Exhibit 3, to see if the debt covenant will be violated if the company repurchases shares.\nExhibit 3: Avignon Corporation Selected Financial Information as of Year-End 2016\nBook value of equity\tC$3,600 million\nShares outstanding\t200 million\nCash available for repurchase\tC$155 million\nDebt-to-equity ratio\t30.0%\nAfter-tax cost of debt\t5.0%", "Michael Thornhill is CFO at American Automotive Parts & Service Corporation (AAPS), an automotive manufacturer that specializes in engine components in a number of established vehicle production lines. He is preparing for a meeting with members of the executive committee to discuss and prepare recommendations for the board to determine if AAPS should make any changes to its dividend policy and structure over the next fiscal year.\nIn preparation for this meeting, Thornhill summarizes AAPS's historical dividends and related information in Exhibit 1.\nExhibit 1\nDividend frequency\tQuarterly\nDividend amount, current\t$0.50/share\nNumber of shares outstanding\t10,000,000\nTarget payout ratio\t20%\nCorporate tax rate\t35%\nShare price – 52-week low-high\t$7.84 – $10.62\nShare price – closing\t$9.89\nIn the meeting, the first topic discussed is the recently completed sale of AAPS's brake parts division. The sale generated $29 million in cash proceeds. Thornhill recommends that the company issue a one-time dividend of $0.95/share to existing shareholders.\nThe Chief Operating Officer (COO) highlights that the company has a number of potential investments options and suggests that the company consider a 4% stock dividend instead. Thornhill agrees to prepare a summary of the effect the stock dividend would have on the company's results assuming a purchase price per share based on the current market price.\nThe following statements about the stock dividend are discussed:\nStatement 1: The stock dividend would be negatively received by shareholders because it would increase their tax liability.\nStatement 2: The stock dividend would have a more adverse effect on the company's financial leverage ratios which are being closely monitored by the bank.\nStatement 3: The flotation costs of the stock dividend would be lower than a traditional issuance and should be considered in their analysis.\nAs a result of the extended discussion and different perspectives on dividend payout structures, Thornhill suggests an alternative approach could be a share buyback transaction. The following statements are made:\nStatement 1: AAPS should negotiate a greenmail transaction directly with a major activist shareholder in order to secure a discount to the current market price.\nStatement 2: If there is a concern about the perception of excluding other shareholders with the greenmail transaction, a fixed price tender offer could be accomplished quickly and allow them to purchase a pro rata portion of shares from all interested shareholders.\nStatement 3: AAPS should announce an open market repurchase program as it would provide flexibility to cancel the share purchases if the company is able to identify another project that would be a more effective use of funds.", "Andrea Larsen is the CFO of Fjord Marine Industries (FMI), a Norwegian pleasure boat manufacturer. Larsen is reviewing FMI's dividend policy in advance of recommending a course of action to the Board of Directors regarding the current year dividend payment.\nFMI's business is influenced by many factors, including commodity prices, interest rates and general economic conditions.\nExhibit 1\n\tCurrent Year\tPrior Year\tTwo Years Ago\nPre-tax income (in NOK millions)\t600\t450\t400\nAfter-tax net income (in NOK millions)\t420\t315\t300\nDividends paid (in NOK millions)\t---\t120\t115\nNumber of shares outstanding (in millions)\t6\t6\t6\nFMI's shares are currently trading at NOK 460.\nExhibit 1 shows that FMI had a very strong year in the current year, generating an additional NOK 105 million net income over the previous year. Larsen considers four possible options in addition to the regular dividend to return a portion of this additional capital to shareholders in the current year:\nOption 1: Issue a stock dividend of 20%.\nOption 2: Increase the annual per share dividend by 20% more than the prior year.\nOption 3: Maintain the current annual dividend and pay a special dividend of NOK 10 per share.\nOption 4: Repurchase NOK 200 million worth of shares at a NOK 40 premium to the current share price.", "An equity index is established in Year 1 for a country that has recently moved to a market economy. The index vendor constructed returns for the four years prior to Year 1 based on the initial group of companies constituting the index in Year 1. From Year 12 to Year 16, a series of military confrontations concerning a disputed border disrupted the economy and financial markets. The dispute is conclusively arbitrated at the end of Year 16. In total, 20 years of equity market return history is available. Other selected data are in the following tables.\nSelected Data\nGeometric mean return relative to 10-year government bond returns (over a 20-year period)\t2% per year\nArithmetic mean return relative to 10-year government bond returns (over a 20-year period)\t2.3% per year\nIndex forward dividend yield\t1%\nForecasted public company earnings growth\t5% per year\nForecasted market P/E growth\t1% per year\nForecasted real GDP growth rate (by Year 19)\t4%\nCurrent vs. long-term inflation forecast\t6% vs. 4% per year\nCurrent yield curve (inversion)\tShort maturities: 9%; 10-year maturities: 7%", "Jane Chang is an analyst at Alpha Fund covering the real estate and energy sectors. She and her colleague are analyzing two companies that are currently held by the fund.\nThe first company is Jupiter Corp., a publicly traded, national retail grocery store chain that has 2,800 physical stores. Jupiter leases most of its grocery stores and all five of its office locations that help the company achieve its core business of operating 50,000 square foot stores in all markets of the United States. Jupiter also owns the real estate (land and building) associated with 100 physical store locations. Jupiter recently announced that its board of directors approved a strategic real estate plan to pursue a separation of all its owned assets. The company currently has a speculative-grade credit rating.\nThe separation would be achieved through a series of sale-leaseback transactions with real estate investment trusts (REITs) that specialize in owning retail properties. Under the plan, Jupiter will sell its 100 owned grocery stores and lease them for 15-year terms with a combined annual rent expense of USD40 million. Jupiter expects to receive cash proceeds of approximately USD800 million from the property sales, which will be used to retire approximately USD600 million of debt and repurchase 4 million common shares.\nJupiter believes the pro forma capital structure following the transactions will enable it to receive an investment-grade credit rating. The sale-leaseback transactions value the 100 assets at an average capitalization rate of 5.50%. Based on Chang’s colleague’s research, the 25th, 50th, and 75th percentile cap rates for sale transactions for similarly situated properties and similar lease terms in the last three years were 5.00%, 5.50%, and 6.00%, respectively.\nThe second company is Saturn Corp., a publicly traded US energy company. Chang has been asked to assess the valuation of a potential spin off for this company. Saturn operates and reports three segments: Upstream, Midstream, and Downstream. In the last 12 months, the company reported the financial results shown in Exhibit 1.\nExhibit 1\nSegment\tEBITDA (USD millions)\nUpstream\t14,400\nMidstream\t5,760\nDownstream\t3,840\nConsolidated\t24,000\nSaturn is currently trading at an enterprise value of USD408,000 million, or an EV/EBITDA multiple of 17. A spin off of the Downstream segment has long been rumored because it has been under-invested in by the current management team, resulting in slower revenue growth than its peers. Chang finds that the median Upstream, Midstream, and Downstream peers are trading at enterprise value-to-EBITDA multiples of 19, 17, and 13, respectively.\nDuring an internal discussion, Chang’s colleague makes the following three statements about the comparable company analysis method:\nStatement 1: The method is not sensitive to market mispricing.\nStatement 2: The estimates of value are derived directly from the market.\nStatement 3: The method provides a reasonable approximation of a target company’s value relative to similar transactions in the market.", "Elaine Lee is an analyst at an investment bank covering the energy sector. She and her junior analyst are analyzing Stratton Oil Corporation.\nStratton Oil Corporation is a publicly traded, US-based energy company that just announced its acquisition of Midwest Oil Corporation, a smaller US-based energy company. Stratton will pay USD55 in cash and 2.25 Stratton shares for each Midwest share, for a total consideration of USD40 billion based on share prices just prior to the announcement. Stratton’s current trading enterprise value just prior to the announcement was USD170 billion. Lee concludes that the acquisition does not signal a change in strategy or focus for Stratton.\nStratton expects to realize annual recurring cost synergies of USD350 million (pre-tax), primarily from efficiencies in oil exploration and production activities and savings in corporate costs. The achievement of the full USD350 million in synergies is expected by the end of the third year after the acquisition closes. Synergies are realized in the amounts of USD117 million, USD233 million, and USD350 million in Years 1–3, respectively, and cash costs of USD175 million, USD280 million, and USD395 million are incurred in Years 1–3, respectively.\nExpectations for revenues and total operating expenses for Stratton and Midwest for the next three years prior to the acquisition announcement are shown in Exhibit 1.\nExhibit 1: Stratton and Midwest Year 1–3 Figures, Prior to Acquisition (USD millions)\n\tYear 1\tYear 2\tYear 3\nStratton revenues\t21,325\t22,391\t23,511\nStratton operating expenses\t16,525\t17,351\t18,219\nMidwest revenues\t5,350\t5,618\t5,898\nMidwest operating expenses\t3,050\t3,203\t3,363\nLee’s junior analyst makes the following comment during a conversation with Lee:\n“The acquisition is considered immaterial in the initial evaluation step for Stratton because it does not signal a change in strategy or focus.”\nStratton’s offer valued Midwest at an enterprise value of USD40.6 billion, including USD4.3 billion of existing Midwest debt. To finance the consideration of USD55 in cash and 2.25 Stratton shares for each Midwest share, Stratton will issue 104 million new shares and raise approximately USD26 billion in new debt and fund the remainder with cash on hand. Following the close, Stratton expects its outstanding debt will be approximately USD62 billion. Prior to the acquisition, Stratton has 1.096 billion shares outstanding trading at USD125 per share. Lee wants to determine how much the weights of debt and equity in Stratton’s capital structure will change assuming a constant share price and that the book value of debt equals its market value.\nDuring an internal meeting, Lee asks if Stratton could have achieved its same goals by undertaking an equity investment or joint venture. In response, Lee’s junior analyst makes the following three statements.\nStatement 1: Acquisitions require substantially greater capital investments than equity investments.\nStatement 2: Acquisitions and equity investments are similar in that they both allow the acquirer to gain control of the target.\nStatement 3: Relative to joint ventures, equity investments provide more equal governance representation and require larger investments.\nLee conducted a sum-of-the-parts valuation of Stratton’s three segments and calculated an estimated enterprise value of USD187 billion just prior to the announcement."], "modules": {"1": "Analysis of Dividends and Share Repurchases", "2": "Environmental, Social, and Governance (ESG) Considerations in Investment Analysis", "3": "Cost of Capital: Advanced Topics", "4": "Corporate Restructuring"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "CorpIssuer", KEY = "CorpIssuer_quiz_state_v1", EXPKEY = "CorpIssuer_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function flush(){ if(!tbl.length) return; html+='<div class="tbl"><table>'+tbl.map(function(r){return "<tr>"+r.split("\t").map(function(c){return "<td>"+esc(c.trim())+"</td>";}).join("")+"</tr>";}).join("")+"</table></div>"; tbl=[]; }
  lines.forEach(function(l){
    if(l.indexOf("\t")>=0){ tbl.push(l); }
    else { flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>"; }
  });
  flush(); return html;
}
function mname(m){ return "Reading "+(12+Number(m))+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 모듈 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">Equity 전체 Reading 오답 퀴즈 (R17–R22)</h2>'+
   '<p class="muted">ECO에서 틀린 114문제 전부 + 오답 개념과 연결된 ECO 정답 유형 17문제 + Schweser Module Quiz 28문제 + 변형 6문제 (총 165문제). 정답은 ECO 원본·Schweser 해답 기준, 해설은 Schweser 기준으로 작성했습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<label>출처 <select id="selSrc"><option value="all">전체</option><option value="wrong">ECO 오답만 (114)</option><option value="nowrong">오답 외 문제만</option></select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">새로 시작</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  $("bStart").onclick=function(){
    var m=$("selMod").value, s=$("selSrc").value;
    var order=Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (s==="all"||(s==="wrong"?q.src==="ECO 오답":q.src!=="ECO 오답")); }).map(function(q){return q.id;});
    if(!order.length) return;
    S=fresh(order,"all"); save(); render();
  };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    '<button class="btn primary" id="bNext" '+(r?'':'disabled')+'>'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button></div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=next;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz"};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저에 진행 기록이 없으면 자동으로 이어 풀고, 있으면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if(!S || !S.order || !Object.keys(S.round||{}).length){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
