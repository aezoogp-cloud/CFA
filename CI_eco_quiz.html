<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>Corporate Issuers Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q7", "src": "ECO 오답", "module": 1, "tag": "차입 자사주매입 EPS: E/P vs 세후 차입비용", "vig": 0, "stem": "Based on Exhibit 1, if Yeta’s management implemented Proposal #3 at the current share price, earnings per share would:", "opts": {"A": "decrease.", "B": "remain unchanged.", "C": "increase."}, "ans": "C", "en": "C is correct. In the case of external funding, a company’s earnings per share will increase if the stock’s earnings yield, which is the ratio of earnings per share to share price, exceeds the after-tax cost of borrowing. Yeta’s earnings yield is 9.10% (= US$1.82/US$20.00), which exceeds the after-tax cost of borrowing of 8.50%.\nA is incorrect because EPS will increase (not decrease) if the stock’s earnings yield (= US$1.82/US$20.00) exceeds the after-tax cost of borrowing. Yeta’s earnings yield of 9.10% exceeds the after-tax cost of borrowing of 8.50%.\nB is incorrect because EPS will increase (not remain unchanged) if the stock’s earnings yield (= US$1.82/US$20.00) exceeds the after-tax cost of borrowing. Yeta’s earnings yield of 9.10% exceeds the after-tax cost of borrowing of 8.50%.", "ko": "Earnings yield(E/P) = 1.82 / 20.00 = 9.10%. 세후 차입비용 8.50%보다 높으므로, 빌린 돈으로 자사주를 사면 줄어드는 이익(이자)보다 줄어드는 주식 수 효과가 커서 EPS가 증가합니다.", "trap": "'이자가 생기니 EPS 감소'는 분자만 본 오류. 분모(주식 수)도 줄어든다. 비교 기준은 세후 차입비용.", "f": "E/P > 세후 rd → EPS↑ / E/P < 세후 rd → EPS↓ / 같으면 불변", "why": {"A": "E/P(9.10%)가 세후 차입비용(8.50%)보다 작을 때의 결론입니다. 여기서는 반대.", "B": "E/P와 세후 차입비용이 정확히 같을 때만 EPS가 변하지 않습니다."}, "orig": "ECO Module 1 Q7"}, {"id": "ECO-M1-Q12", "src": "ECO 오답", "module": 1, "tag": "Tax-exempt clientele: 배당락 가격으로 재투자", "vig": null, "stem": "Sophie Chan owns 100,000 shares of PAT Company. PAT is selling for €40 per share, so Chan’s investment is worth €4,000,000. Chan reinvests the gross amount of all dividends received to purchase additional shares. Assume that the clientele for PAT shares consists of tax-exempt investors. If PAT pays a €1.50 dividend, Chan’s new share ownership after reinvesting dividends at the ex-dividend price is most likely to be closest to:", "opts": {"A": "103,600.", "B": "103,750.", "C": "103,900."}, "ans": "C", "en": "C is correct. Because the clientele for PAT investors has the same tax rate (zero) for dividends and capital gains, the ex-dividend stock price of PAT should decline by the amount of the dividend to €40 − €1.50 = €38.50. Chan will purchase €150,000/€38.50 = 3,896 additional shares. This increases her total shares owned to 103,896. Chan’s new share ownership is closest to 103,900.", "ko": "고객층이 비과세(배당세 = 자본이득세 = 0)이므로 배당락 주가는 배당만큼 정확히 떨어집니다: €40 − €1.50 = €38.50. 받은 배당 100,000 × €1.50 = €150,000을 €38.50에 재투자 → 3,896주 추가 → 103,896 ≈ 103,900주.", "trap": "재투자 가격은 배당락(ex-dividend) 가격. 배당 전 가격 €40으로 나누면 안 된다.", "f": "Ex-div price = P − D (세율 동일 시) ; 추가 주식 = 배당 총액 / ex-div price", "why": {"A": "배당락 가격 하락을 제대로 반영하지 않은 값입니다. 정확한 계산은 €150,000 / €38.50 = 3,896주.", "B": "배당 전 가격 €40으로 나눈 값(€150,000 / €40 = 3,750주)입니다. 재투자는 배당락 가격 €38.50에 합니다."}, "orig": "ECO Module 1 Q12"}, {"id": "ECO-M1-Q15", "src": "ECO 오답", "module": 1, "tag": "배당정책 결정요인: 낮은 payout과 무관한 것", "vig": null, "stem": "Which of the following factors is least likely to be associated with a company having a low dividend payout ratio?", "opts": {"A": "High flotation costs on new equity issues.", "B": "High tax rates on dividends.", "C": "Low growth prospects."}, "ans": "C", "en": "C is correct. With low growth prospects, a company would typically have a high payout ratio, returning funds to its shareholders rather than retaining funds.", "ko": "성장 기회가 적으면 회사가 쌓아둘 이유가 없어 오히려 배당을 많이 줍니다(높은 payout). 반면 신주발행비용(flotation cost)이 높거나 배당세율이 높으면 배당을 줄이는 쪽(낮은 payout)과 연결됩니다.", "trap": "'least likely' 문제 → 낮은 payout과 반대 방향인 요인을 고른다.", "f": "", "why": {"A": "Flotation cost가 높으면 외부 자금이 비싸 유보이익으로 투자하려고 배당을 줄입니다 → 낮은 payout과 관련 있음.", "B": "배당세율이 높으면 투자자가 배당을 꺼립니다(tax aversion) → 낮은 payout과 관련 있음."}, "orig": "ECO Module 1 Q15"}, {"id": "ECO-M1-Q17", "src": "ECO 오답", "module": 1, "tag": "Stable dividend policy", "vig": null, "stem": "Beta Corporation is a manufacturer of inflatable furniture. Which of the following scenarios best reflects a stable dividend policy for Beta?", "opts": {"A": "Maintaining a constant dividend payout ratio of 40–50%.", "B": "Maintaining the dividend at US$1.00 a share for several years given no change in Beta’s long-term prospects.", "C": "Increasing the dividend 5% a year over several years to reflect the two years in which Beta recognized mark-to-market gains on derivatives positions."}, "ans": "B", "en": "B is correct. Choice A is consistent with a constant dividend target payout ratio policy. Choice C is not correct because the earnings increases described are not sustainable long term.", "ko": "Stable dividend policy = 이익이 해마다 흔들려도 장기 이익 전망에 맞춰 주당배당금을 안정적으로 유지. 장기 전망이 그대로이니 US$1.00을 유지하는 B가 해당합니다.", "trap": "Stable = 주당배당금 안정 / Constant payout ratio = 비율 고정(배당액은 이익 따라 출렁).", "f": "", "why": {"A": "일정 배당성향(constant payout ratio) 정책의 설명입니다.", "C": "일회성 파생상품 평가이익(mark-to-market gain)은 장기적으로 지속되는 이익이 아니므로 그것에 맞춰 배당을 올리는 것은 stable policy가 아닙니다."}, "orig": "ECO Module 1 Q17"}, {"id": "ECO-M1-Q18", "src": "ECO 오답", "module": 1, "tag": "잉여현금 자사주매입 EPS", "vig": null, "stem": "A company has 1 million shares outstanding and earnings are £2 million. The company decides to use £10 million in surplus cash to repurchase shares in the open market. The company’s shares are trading at £50 per share. If the company uses the entire £10 million of surplus cash to repurchase shares at the market price, the company’s earnings per share will be closest to:", "opts": {"A": "£2.00.", "B": "£2.30.", "C": "£2.50."}, "ans": "C", "en": "C is correct. At the current market price, the company can repurchase 200,000 shares (£10 million/£50 = 200,000 shares). The company would have 800,000 shares outstanding after the repurchase (1 million shares − 200,000 shares = 800,000 shares).\nEPS before the buyback is £2.00 (£2 million/1 million shares = £2.00). Total earnings after the buyback are the same because the company uses surplus (nonearning) cash to purchase the shares, but the number of shares outstanding is reduced to 800,000. EPS increases to £2.50 (£2 million/ 800,000 shares = £2.50).", "ko": "£10m / £50 = 200,000주 매입 → 남은 주식 800,000주. 잉여현금은 이익을 내지 않던 돈이라 이익은 £2m 그대로. 새 EPS = £2m / 800,000 = £2.50.", "trap": "잉여(무수익) 현금 사용 → 포기하는 이익 0 → 주식 수만 줄어 EPS 상승.", "f": "새 EPS = 이익 / (기존 주식 수 − 매입 주식 수)", "why": {"A": "매입 전 EPS(£2m / 1m주)입니다. 주식 수 감소를 반영하지 않았습니다.", "B": "계산 오류 값입니다. 이익은 그대로이고 주식 수가 800,000주로 줄어 £2.50이 됩니다."}, "orig": "ECO Module 1 Q18"}, {"id": "ECO-M1-Q20", "src": "ECO 오답", "module": 1, "tag": "차입 자사주매입 EPS: E/P vs 세후 차입비용", "vig": null, "stem": "A company can borrow funds at an after-tax cost of 4.5%. The company’s stock price is US$40 per share, earnings per share is US$2.00, and the company has 15 million shares outstanding. If the company borrows just enough to repurchase 2 million shares of stock at the prevailing market price, that company’s earnings per share is most likely to:", "opts": {"A": "increase.", "B": "decrease.", "C": "remain the same."}, "ans": "A", "en": "A is correct. The company’s earnings yield (E/P) is US$2/US$40 = 0.05. When the earnings yield is greater than the after-tax cost of borrowed funds, EPS will increase if shares are repurchased using borrowed funds.", "ko": "E/P = US$2 / US$40 = 5.0% > 세후 차입비용 4.5% → 차입해서 자사주를 사면 EPS 증가.", "trap": "E/P의 P는 실제 매입가격. 세후 비용과 비교.", "f": "E/P > 세후 rd → EPS↑", "why": {"B": "E/P가 세후 차입비용보다 낮을 때의 결론입니다. 여기서는 5.0% > 4.5%.", "C": "두 값이 같을 때만 EPS가 그대로입니다."}, "orig": "ECO Module 1 Q20"}, {"id": "ECO-M1-Q22", "src": "ECO 오답", "module": 1, "tag": "자사주매입 BVPS: 매입가 vs BVPS", "vig": null, "stem": "A company with 20 million shares outstanding decides to repurchase 2 million shares at the prevailing market price of €30 per share. At the time of the buyback, the company reports total assets of €850 million and total liabilities of €250 million. As a result of the buyback, that company’s book value per share will most likely:", "opts": {"A": "increase.", "B": "decrease.", "C": "remain the same."}, "ans": "C", "en": "C is correct. The company’s book value before the buyback is €850 million in assets − €250 million in liabilities = €600 million. Book value per share is €600 million/20 million = €30 per share. The buyback will reduce equity by 2 million shares at the prevailing market price of €30 per share. The book value of equity will be reduced to €600 million − €60 million = €540 million, and the number of shares will be reduced to 18 million; €540 million/18 million = €30 book value per share. If the prevailing market price is equal to the book value per share at the time of the buyback, book value per share is unchanged.", "ko": "BV = 850 − 250 = €600m, BVPS = 600 / 20 = €30. 매입가 €30 = BVPS €30 → 매입 후 (600 − 60) / 18 = €30으로 변하지 않음.", "trap": "BVPS 변화는 '매입가 vs 매입 전 BVPS'만 비교. 같으면 불변.", "f": "매입가 > BVPS → BVPS↓ / 매입가 < BVPS → BVPS↑ / 같으면 불변", "why": {"A": "매입가가 BVPS보다 낮을 때 BVPS가 오릅니다. 여기서는 같습니다.", "B": "매입가가 BVPS보다 높을 때 BVPS가 내려갑니다. 여기서는 같습니다."}, "orig": "ECO Module 1 Q22"}, {"id": "ECO-M1-Q24", "src": "ECO 오답", "module": 1, "tag": "자사주매입 방법: 주가 하락 시 지지 → Open market", "vig": null, "stem": "If a company’s objective is to support its stock price in the event of a market downturn, it would be advised to authorize:", "opts": {"A": "an open market share repurchase plan to be executed over the next five years.", "B": "a tender offer share repurchase at a fixed price effective in 30 days.", "C": "a Dutch auction tender offer effective in 30 days."}, "ans": "A", "en": "A is correct. Of the three methods, only an authorized open market share repurchase plan allows the company the flexibility to time share repurchases to coincide with share price declines.", "ko": "주가가 떨어질 때마다 사서 받치려면 매입 시점을 고를 수 있어야 합니다. 여러 해에 걸친 open market 매입 프로그램만 그 유연성이 있습니다.", "trap": "Open market = 가장 유연(시점 선택, 중단 가능). Tender offer류 = 빠르지만 한 번에 정해진 날.", "f": "", "why": {"B": "Fixed-price tender offer는 30일 뒤 정해진 가격으로 한 번 사는 방식이라 하락 시점에 맞춰 살 수 없습니다.", "C": "Dutch auction도 정해진 날 한 번 하는 tender offer라 시장 하락 시점에 맞출 수 없습니다."}, "orig": "ECO Module 1 Q24"}, {"id": "ECO-M1-Q32", "src": "ECO 오답", "module": 1, "tag": "자사주매입 vs 배당: 현금 분배 대상", "vig": 1, "stem": "Which of Lee’s statements to Carlyle about share repurchases is least accurate?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "A", "en": "A is correct. Statement 1 is least accurate. Although the amount of cash distributed is the same, only those shareholders who have their shares purchased by the company will receive any cash.\nB is incorrect. Statement 2 is correct. Management is not obligated to follow through after stating an intention to repurchase shares, whereas they must meet a declared dividend statement.\nC is incorrect. Statement 3 is correct. Research showed that 45% of private repurchases between 1984 and 2001 were actually made at discounts, indicating that many direct negotiation repurchases are generated by the liquidity needs of large investors who are in a weak negotiating position.", "ko": "Statement 1이 틀렸습니다. 나가는 현금 총액은 배당과 같아도, 자사주매입은 주식을 판 주주만 현금을 받습니다. 배당은 모든 주주가 지분 비율대로 받습니다.", "trap": "'경제적으로 동등(주주부 동일)'과 '모두에게 똑같이 분배'는 다른 말.", "f": "", "why": {"B": "Statement 2는 맞습니다. 자사주매입은 발표해도 실행 의무가 없지만, 선언된 배당은 지급해야 하므로 매입이 더 유연합니다.", "C": "Statement 3는 맞습니다. 직접협상 매입은 매도자의 급한 유동성 필요 때문에 시장가보다 싸게 이뤄지는 경우도 많습니다(Schweser도 동일)."}, "orig": "ECO Module 1 Q32"}, {"id": "ECO-M1-Q34", "src": "ECO 오답", "module": 1, "tag": "자사주매입 방법: 프리미엄 → Fixed-price tender", "vig": 1, "stem": "Based on Exhibit 2, SpeedyPro most likely repurchased shares using:", "opts": {"A": "open market purchases.", "B": "a fixed-price tender offer.", "C": "a negotiated purchase agreement."}, "ans": "B", "en": "A is incorrect. Open market purchases are market based and can be timed to avoid price impact.\nB is correct. SpeedyPro offered a 10% premium over the current price. This is most consistent with a fixed-price tender offer, which normally requires a premium. Negotiated purchase agreements are almost as likely to take place at prices lower than market because they are at prices above market, particularly when shareholders are trying to meet liquidity needs. Open market purchases are market based and can be timed to avoid price impact.\nC is incorrect. Negotiated purchase agreements are almost as likely to take place at prices lower than market as they are at prices above market when shareholders are trying to meet liquidity needs.", "ko": "SpeedyPro는 현재가 대비 10% 프리미엄을 제시했습니다. 정해진 가격(보통 프리미엄 포함)으로 정해진 수량을 사는 fixed-price tender offer와 가장 잘 맞습니다.", "trap": "프리미엄 + 전체 주주 대상 → tender offer. 직접협상은 할인/할증 둘 다 가능.", "f": "", "why": {"A": "Open market 매입은 시장가로 사고 시점을 조절해 가격 충격을 피합니다. 프리미엄을 붙이지 않습니다.", "C": "직접협상 매입은 시장가보다 낮게도 높게도 이뤄질 수 있어 '10% 프리미엄'의 근거가 되지 않습니다."}, "orig": "ECO Module 1 Q34"}, {"id": "ECO-M1-Q35", "src": "ECO 오답", "module": 1, "tag": "자사주매입과 D/E covenant", "vig": 1, "stem": "The best answer to Carlyle’s question about the potential violation of the debt covenants is that the covenant:", "opts": {"A": "is not violated if Avignon repurchases shares.", "B": "will be violated if Avignon uses debt to finance the repurchase.", "C": "will be violated if Avignon uses the surplus cash to finance the repurchase."}, "ans": "B", "en": "B is correct. The debt-financed repurchase increases the debt-to-equity ratio above the 35% threshold and thus violates the debt covenant.\nBook value of debt = 30% × C$3,600 = C$1,080\nD/E with cash repurchase = C$1,080 ÷ (C$3,600 – C$155) = 31.3%\nD/E with debt-financed repurchase = (C$1,080 + C$155) ÷ (C$3,600 – C$155) = 35.8%\nA is incorrect. The D/E is above the 35% threshold when the repurchase is financed with debt.\nC is incorrect. The D/E stays below 35% when the company uses the surplus cash to finance the repurchase.", "ko": "부채 = 30% × C$3,600 = C$1,080. 현금으로 매입: 1,080 / (3,600 − 155) = 31.3% < 35% → 위반 아님. 차입으로 매입: (1,080 + 155) / (3,600 − 155) = 35.8% > 35% → 위반.", "trap": "자사주매입은 어느 재원이든 자기자본을 줄인다. 차입이면 분자(부채)까지 커진다.", "f": "D/E(현금) = D / (E − 매입액) ; D/E(차입) = (D + 매입액) / (E − 매입액)", "why": {"A": "차입으로 매입하면 D/E가 35.8%로 한도 35%를 넘습니다.", "C": "현금으로 매입하면 D/E는 31.3%로 한도 아래입니다."}, "orig": "ECO Module 1 Q35"}, {"id": "ECO-M1-Q37", "src": "ECO 오답", "module": 1, "tag": "Stock dividend 후 주가", "vig": 2, "stem": "If AAPS follows the COO's suggestion, the expected share price after the stock dividend is closest to:", "opts": {"A": "$9.49.", "B": "$9.51.", "C": "$10.29."}, "ans": "B", "en": "A is incorrect because it assumes the 4% stock divided reduces the stock price by 4%\n= $9.89 x (1 – 0.04) = $9.49\nB is correct. For a stock dividend, the total market value of the company is unaffected by the stock dividend because the decrease in the share price is exactly offset by the increase in the number of shares outstanding. The total cost basis of the shares remains the same; however, the number of shares owned increases.\nAssuming a shareholder owns 100 shares.\nTotal value  = $989.00 [$9.89 x 100]\nWith a 4.0% stock dividend, the number of shares would increase to 104.\nThe new share price = Total value / new number of shares\n= $989.00 / 104\n= $9.51\nC is incorrect because it multiplies the current share price with the expected stock dividend growth\n= $9.89 × (1 + 0.04)\n= $10.29", "ko": "주식배당은 회사 전체 가치를 바꾸지 않고 주식 수만 늘립니다. 4% 주식배당 → 주가 = $9.89 / 1.04 = $9.51.", "trap": "4% 주식배당 ≠ 주가 4% 하락. 나누기(÷1.04)로 계산.", "f": "새 주가 = 기존 주가 / (1 + 주식배당률)", "why": {"A": "주가를 4% 깎은 값($9.89 × 0.96)입니다. 주식 수가 1.04배가 되므로 1.04로 나눠야 합니다.", "C": "주가에 1.04를 곱한 값입니다. 주식배당으로 주가가 오르지는 않습니다."}, "orig": "ECO Module 1 Q37"}, {"id": "ECO-M1-Q38", "src": "ECO 오답", "module": 1, "tag": "Stock dividend: 세금·레버리지·flotation cost", "vig": 2, "stem": "Which of the following statements about the effect of the stock dividend is most accurate?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "A is incorrect because a stock dividend is generally not taxable to shareholders because a stock dividend merely divides the \"pie\" (the market value of shareholders' equity) into smaller pieces.\nB is incorrect because a stock dividend has no economic impact on a company. Stock dividends do not affect assets or shareholders’ equity. Although retained earnings are reduced by the value of the stock dividends paid (i.e., by the number of shares issued × price per share), contributed capital increases by the same amount (i.e., the value of the shares issued). As a result, total shareholders’ equity does not change. Neither stock dividends nor stock splits affect liquidity ratios or financial leverage ratios.\nC is correct. Flotation costs are the costs associated with selling shares to the public that would include underwriters' fees, legal costs, registration expenses, and possible negative price effects and would be lower with a direct stock dividend to existing owners. The company did not have to spend any actual money issuing a dividend.", "ko": "Statement 3이 맞습니다. 기존 주주에게 직접 주식을 주는 주식배당은 일반 신주발행에 드는 인수수수료·법률·등록비용, 가격 하락 효과 등이 없어 flotation cost가 더 낮고, 현금도 나가지 않습니다.", "trap": "주식배당 = 이익잉여금 → 납입자본 이동일 뿐. 과세 X, 자본총계·레버리지 비율 불변.", "f": "", "why": {"A": "주식배당은 보통 과세 대상이 아닙니다(파이를 더 잘게 나눌 뿐).", "B": "주식배당은 자산과 자본총계를 바꾸지 않아 레버리지 비율에 영향이 없습니다."}, "orig": "ECO Module 1 Q38"}, {"id": "ECO-M1-Q40", "src": "ECO 오답", "module": 1, "tag": "Stock dividend → float↑ → 변동성↓", "vig": 3, "stem": "For FMI, Option 1 would most likely:", "opts": {"A": "affect its capital structure.", "B": "reduce the volatility of its share price.", "C": "increase the value of each shareholder's ownership position in the company."}, "ans": "B", "en": "A is incorrect because from a company’s perspective, the key difference between a stock dividend and a cash dividend is that a cash dividend affects a company’s capital structure, whereas a stock dividend has no economic impact on a company.\nB is correct because the payment of a stock dividend also helps increase the stock’s float, which improves the liquidity of the shares and dampens share price volatility.\nC is incorrect because a stock dividend does not change the value of each shareholder’s ownership position because the increase in the number of shares held is accompanied by an offsetting decrease in earnings per share, and other measures of value per share, resulting from the greater number of shares outstanding.", "ko": "주식배당은 유통주식(float)을 늘려 유동성을 높이고 주가 변동성을 낮춥니다.", "trap": "주식배당이 '가치'는 못 바꾸지만 유동성·주가 수준(거래 범위)은 바꾼다.", "f": "", "why": {"A": "주식배당은 이익잉여금이 납입자본으로 옮겨질 뿐이라 자본구조가 바뀌지 않습니다. 자본구조를 바꾸는 것은 현금배당입니다.", "C": "주식 수가 늘어나는 만큼 주당 가치가 줄어 지분 가치는 그대로입니다."}, "orig": "ECO Module 1 Q40"}, {"id": "ECO-M1-Q48", "src": "ECO 오답", "module": 1, "tag": "FCFE coverage ratio로 배당 안전성 비교", "vig": null, "stem": "An analyst gathers the following financial statement data of three companies for the most recent fiscal year (amounts are in $ millions):\n\tCompany A\tCompany B\tCompany C\nNet income\t550\t725\t254\nCash flow from operations\t745\t810\t295\nCapital expenditures\t315\t432\t75\nNet borrowing\t–100\t–250\t–85\nDividends paid\t135\t40\t45\nStock repurchases\t65\t70\t50\nBased on the FCFE coverage ratio, the company with the greatest dividend safety is:", "opts": {"A": "Company A.", "B": "Company B.", "C": "Company C."}, "ans": "A", "en": "A is correct. Under the FCFE method Company A has the greatest dividend safety.\nFCFE coverage ratio = FCFE / (Dividends + Share repurchases)\nFCFE = Cash flow from operations – Capital expenditures + Net borrowing\nFCFE A = 745 – 315 – 100 = 330; B = 810 – 432 – 250 = 128; C = 295 – 75 – 85 = 135\nCoverage A = 330 / (135 + 65) = 1.65; B = 128 / (40 + 70) = 1.16; C = 135 / (45 + 50) = 1.42", "ko": "FCFE = CFO − CapEx + 순차입(음수면 차감). A: 745 − 315 − 100 = 330 → 330 / (135 + 65) = 1.65. B: 128 / 110 = 1.16. C: 135 / 95 = 1.42. 가장 높은 A가 가장 안전.", "trap": "순차입이 음수(부채 상환)면 FCFE에서 뺀다. 분모에 자사주매입 포함. (NI 기준 dividend coverage로 보면 B가 가장 높아 함정)", "f": "FCFE coverage = FCFE / (배당 + 자사주매입), FCFE = CFO − FCInv + Net borrowing", "why": {"B": "순이익/배당으로 보면 B가 가장 높지만, FCFE 기준으로는 1.16으로 가장 낮습니다(순상환 250이 큼).", "C": "C는 1.42로 A(1.65)보다 낮습니다."}, "orig": "ECO Module 1 Q48"}, {"id": "ECO-M1-Q49", "src": "ECO 오답", "module": 1, "tag": "배당 지속 불가능 신호", "vig": null, "stem": "Which of the following is most likely an early signal that a company might not be able to sustain its cash dividend?", "opts": {"A": "Dividends being financed by new debt", "B": "Dividend yield at the lowest historical level", "C": "Dividend coverage ratio consistently increasing"}, "ans": "A", "en": "A is correct because analysts should be particularly alert to companies that support their dividends and stock repurchases by reducing productive capital spending or by adding net debt or by some combination of the two because these neither are sustainable policies.\nB is incorrect because extremely high dividend yields in comparison with a company’s past record and forward-looking earnings is often another warning signal that investors are predicting a dividend cut. Thus, a dividend yield at the highest, rather than the lowest, would be a warning signal that a company might not be able to sustain its cash dividend.\nC is incorrect because a higher dividend payout ratio or a lower dividend coverage ratio tends to indicate, all else equal, higher risk of a dividend cut.", "ko": "새 부채로 배당을 대는 것(또는 생산적 투자를 줄여 배당을 유지하는 것)은 지속할 수 없는 정책이라 배당 삭감의 초기 신호입니다.", "trap": "경고 신호 = 배당수익률이 '역사적 최고', 커버리지 '하락', 차입으로 배당.", "f": "", "why": {"B": "과거보다 아주 높은 배당수익률이 경고 신호입니다(시장이 삭감을 예상해 주가가 떨어진 상태). 최저 수준은 신호가 아닙니다.", "C": "커버리지가 계속 오르면 배당이 더 안전해지는 것입니다."}, "orig": "ECO Module 1 Q49"}, {"id": "ECO-M1-Q51", "src": "ECO 오답", "module": 1, "tag": "Target payout adjustment model", "vig": null, "stem": "An analyst gathers the following information about a company with a stable dividend policy:\nPrevious year's EPS\t$2.00\nPrevious year's payout ratio\t30%\nCurrent year's expected EPS\t$2.50\nTarget payout ratio\t36%\nIf the company uses a 3-year period to adjust its dividends, the expected increase in the current year dividend per share should be:", "opts": {"A": "$0.10.", "B": "$0.20.", "C": "$0.30."}, "ans": "A", "en": "A is correct because Expected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) × Adjustment factor, where the adjustment factor is equal to 1 / Number of years to adjust dividends. In this case:\nAdjustment factor = 1/3\nExpected increase in dividends = (2.50 × 36% − 2.00 × 30%) × 1/3 = 0.10 = $0.10\nB is incorrect because it assumes that the adjustment towards the target payout ratio is done linearly over time. Since the difference between the target payout ratio and current payout ratio is 36% − 30% = 6%, the annual equal adjustment over the three-year period will be 6% / 3 = 2%. Therefore, this year's payout ratio is expected to be current payout ratio + 2%, that is 30% + 2% = 32%. Finally:\nExpected increase in dividends = (Expected earnings × This year's target payout ratio − Previous dividend) = (2.50 × 32% − 2 × 30%) = 0.20 = $0.20\nC is incorrect because this calculation overlooks the adjustment factor. In that case:\nExpected increase in dividends = (Expected earnings × Target payout ratio − Previous dividend) = (2.50 × 36% − 2 × 30%) = 0.30 = $0.30", "ko": "이전 배당 = 2.00 × 30% = 0.60. 증가액 = (2.50 × 36% − 0.60) × 1/3 = (0.90 − 0.60) / 3 = $0.10.", "trap": "조정계수 1/n을 곱한다. payout 비율을 매년 2%p씩 올리는 식으로 계산하지 않는다.", "f": "ΔD = (기대 EPS × 목표 payout − D0) × (1 / 조정 연수)", "why": {"B": "목표 배당성향까지 비율을 매년 똑같이(30% → 32%) 올린다고 본 오류입니다. 모델은 금액 차이에 1/3을 곱합니다.", "C": "조정계수(1/3)를 빼먹은 값입니다."}, "orig": "ECO Module 1 Q51"}, {"id": "ECO-M1-Q52", "src": "ECO 오답", "module": 1, "tag": "차입 자사주매입 EPS: E/P vs 세후 차입비용", "vig": null, "stem": "An analyst gathers the following information about a company that plans to issue new debt to repurchase shares:\nEPS before share repurchase\t$3\nMarket price per share at the time of repurchase\t$40\nAfter-tax cost of new debt\t7%\nAs a result of the share repurchase, the company's EPS will:", "opts": {"A": "decrease.", "B": "not change.", "C": "increase."}, "ans": "C", "en": "A is incorrect because any after-tax borrowing rate above the earnings yield would result in a decline in EPS. However, in this case, the earnings yield is 3 / 40 = 7.5%, which is greater than 7%, the after-tax cost of new debt.\nB is incorrect because when the after-tax borrowing rate equals the earnings yield, EPS is unchanged as a result of the buyback. However, in this case, the earnings yield is 3 / 40 = 7.5%, which is greater than 7%, the after-tax cost of new debt.\nC is correct because in the case of external financing, the effect on EPS is positive if the earnings yield exceeds the after-tax cost of financing the repurchase. The earnings yield, the ratio of earnings per share to share price, is 3/ 40 = 7.5%. Since this value is greater than 7%, the after-tax cost of new debt, the share repurchase will have a positive effect on EPS.", "ko": "E/P = 3 / 40 = 7.5% > 세후 차입비용 7% → EPS 증가.", "trap": "7.5% vs 7%처럼 차이가 작아도 방향만 보면 된다.", "f": "E/P > 세후 rd → EPS↑", "why": {"A": "세후 차입비용이 E/P보다 높을 때의 결론입니다.", "B": "두 값이 같을 때만 EPS가 그대로입니다."}, "orig": "ECO Module 1 Q52"}, {"id": "ECO-M1-Q54", "src": "ECO 오답", "module": 1, "tag": "글로벌 배당정책 추세", "vig": null, "stem": "Based on global trends in corporate payout policies, which of the following has generally decreased over time?", "opts": {"A": "Dividend payout ratios", "B": "Aggregate dividend amounts paid", "C": "Percentage of companies paying dividends"}, "ans": "C", "en": "C is correct. Research on dividend behavior globally shows that aggregate dividend amounts as well as payout ratios have generally increased over time, although the fraction of dividend payers has decreased.\nA is incorrect because payout ratios have generally increased over time.\nB is incorrect because aggregate dividend amounts have generally increased over time.", "ko": "Schweser: 선진시장에서 현금배당을 하는 회사의 비율은 장기적으로 하락했고, 자사주매입을 하는 회사 비율은 상승했습니다. 총배당액과 배당성향은 대체로 증가했습니다.", "trap": "'배당하는 회사 수(비율)'↓ ≠ '배당 금액·배당성향'↓.", "f": "", "why": {"A": "배당성향은 대체로 증가했습니다.", "B": "총배당액도 대체로 증가했습니다."}, "orig": "ECO Module 1 Q54"}, {"id": "ECO-M1-Q55", "src": "ECO 오답", "module": 1, "tag": "FCFE coverage ratio 계산", "vig": null, "stem": "An analyst gathers the following information (in $ millions) about a company:\nFCFE\t492\nDividends paid\t215\nStock repurchases\t173\nThe company's FCFE coverage ratio is closest to:", "opts": {"A": "1.27x.", "B": "2.29x.", "C": "2.84x."}, "ans": "A", "en": "A is correct because FCFE coverage ratio = FCFE/[Dividends + Share repurchases]. Based on the provided inputs:\nFCFE coverage ratio = 492 / (215 + 173) = 1.268041 ≈ 1.27x\nB is incorrect because repurchases are omitted in the denominator. In that case, FCFE coverage ratio = FCFE / Dividends. Based on the provided inputs:\nFCFE coverage ratio = 492 / 215 = 2.288372 ≈ 2.29x\nC is incorrect because dividends are omitted in the denominator. In that case, FCFE coverage ratio = FCFE / Share repurchases. Based on the provided inputs:\nFCFE coverage ratio = 492 / 173 = 2.843931 ≈ 2.84x", "ko": "FCFE coverage = FCFE / (배당 + 자사주매입) = 492 / (215 + 173) = 1.27x.", "trap": "분모에 배당과 자사주매입을 모두 넣는다.", "f": "FCFE coverage = FCFE / (Dividends + Share repurchases)", "why": {"B": "분모에서 자사주매입을 뺀 값(492 / 215)입니다.", "C": "분모에서 배당을 뺀 값(492 / 173)입니다."}, "orig": "ECO Module 1 Q55"}, {"id": "ECO-M1-Q57", "src": "ECO 오답", "module": 1, "tag": "Agency 문제(과잉투자) 완화 → 현금배당", "vig": null, "stem": "Which of the following would best constrain management's ability to overinvest by taking on negative NPV projects?", "opts": {"A": "Increase stock dividends", "B": "Increase internally financed cash dividends", "C": "Set minimum levels of EBITDA coverage of interest charges as a condition for paying dividends"}, "ans": "B", "en": "A is incorrect because to prevent potential overinvestment agency problems the company should increase cash dividends, not stock dividends. From a company’s perspective, the key difference between a stock dividend and a cash dividend is that a cash dividend affects a company’s capital structure, whereas a stock dividend has no economic impact on a company. Cash dividends reduce assets (because cash is being paid out) and shareholders’ equity (by reducing retained earnings), while stock dividends do not. Therefore, by increasing stock dividends any free cash will remain available to managers for potential overinvestment in negative NPV projects.\nB is correct because one managerial incentive of particular concern is the potential private benefit managers may obtain from investment in negative net present value (NPV) projects. The potential overinvestment agency problem might be alleviated by the payment of dividends. In particular, by paying out all free cash flow to equity in dividends, managers would be constrained in their ability to overinvest by taking on negative NPV projects.\nC is incorrect because all else equal, both dividends and share repurchases increase the default risk of debt. Reflecting bondholders’ concern, the bond indenture (contract) often includes a covenant restricting distributions to shareholders that might impair the position of bondholders. Covenants that specify minimum levels of EBITDA and/or EBIT coverage of interest charges are frequently used. Therefore, covenants are designed to protect bondholders rather than alleviating potential overinvestment agency problems.", "ko": "경영진이 NPV < 0 프로젝트에 돈을 쓰는(empire building) 문제는 잉여현금을 현금배당으로 내보내면 줄어듭니다.", "trap": "주식배당은 현금이 안 나가 과잉투자 억제 효과 없음. 커버넌트는 채권자 보호 장치.", "f": "", "why": {"A": "주식배당은 현금이 빠져나가지 않아 경영진이 쓸 수 있는 현금이 그대로입니다.", "C": "이자보상 조건 같은 커버넌트는 주주-채권자 갈등에서 채권자를 보호하는 장치이지 과잉투자 억제 수단이 아닙니다."}, "orig": "ECO Module 1 Q57"}, {"id": "ECO-M1-Q61", "src": "ECO 오답", "module": 1, "tag": "배당 삭감 위험: dividend coverage", "vig": null, "stem": "An analyst gathers the following information of three companies in the same industry:\n\tCompany A\tCompany B\tCompany C\nDividend coverage ratio (x)\t3.13\t2.50\t1.12\nDebt ratio\t37%\t22%\t26%\nIf the earnings of all three companies are expected to decline by 20% due to a business downturn, which company has the highest risk of a dividend cut?", "opts": {"A": "Company A", "B": "Company B", "C": "Company C"}, "ans": "C", "en": "A is incorrect because Company A has the highest dividend coverage ratio. A higher dividend payout ratio or a lower dividend coverage ratio tends to indicate, all else equal, higher risk of a dividend cut. In this case, Company A is safer than the other two. Fundamental risk factors with regard to dividend safety include above-average financial leverage. Additional issuance of debt, whether to fund projects or to finance the dividend, may be restricted during business downturns. While Company A has the highest financial leverage due to its debt ratio, its low dividend coverage ratio reduces the likelihood of debt issuance to finance the dividends.\nB is incorrect because Company B has a relatively high dividend coverage ratio that may be better able to withstand a 20% earnings decline. It also has the lowest financial leverage due to its debt ratio, which gives the management flexibility to avoid a dividend cut in a business downturn since it has more capacity to issue debt to finance the dividends.\nC is correct because higher dividend payout ratios (or lower dividend coverage ratios) often constitute a risk factor that a dividend may be cut if earnings decline. High dividend payout ratios in relation to those of peer group companies may also point to dividend safety concerns. Company C has the lowest dividend coverage ratio. An earnings decline will likely reduce this ratio so that a dividend cut would be the most likely among the three companies.", "ko": "이익이 20% 줄면 C의 커버리지는 1.12 × 0.8 ≈ 0.90으로 1 아래가 됩니다. 커버리지가 가장 낮은(배당성향이 가장 높은) C가 삭감 위험이 가장 큽니다.", "trap": "부채비율이 가장 높은 A를 고르기 쉽지만, 1차 기준은 커버리지(배당성향).", "f": "Dividend coverage = NI / 배당 (낮을수록 위험)", "why": {"A": "A는 커버리지가 3.13으로 가장 높아 이익이 20% 줄어도 여유가 있습니다.", "B": "B는 커버리지 2.50에 부채비율도 가장 낮아 차입으로 배당을 유지할 여력도 있습니다."}, "orig": "ECO Module 1 Q61"}, {"id": "ECO-M1-Q62", "src": "ECO 오답", "module": 1, "tag": "MM vs Graham·Dodd(bird-in-hand)", "vig": null, "stem": "A company operating under perfect capital market assumptions has a dividend yield of 10%. Compared to the company's change in share price predicted by the Miller and Modigliani model, the change in share price predicted by the model of Graham, Dodd, et al. is:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "C", "en": "A is incorrect because the model of Graham, Dodd, et al., or the 'bird in the hand' argument, predicts a higher share price than the Miller and Modigliani model predicts.\nB is incorrect because the model of Graham, Dodd, et al, or the 'bird in the hand' argument, predicts a higher share price than the Miller and Modigliani model predicts.\nC is correct because the model of Graham, Dodd, et al, or the \"bird in the hand\" argument, predicts a higher share price than the Miller and Modigliani model predicts, since the Miller and Modigliani model predicts that the dividend yield does not matter, while the Graham, Dodd, et al model predicts that the dividend yield positively influences the stock price.\nFinancial theorists have argued that, even under perfect capital markets assumptions, investors prefer a dollar of dividends to a dollar of potential capital gains from reinvesting earnings because they view dividends as less risky. A related viewpoint is that 'the typical dollar of reinvestment has less economic value to the shareholder than a dollar paid in dividends' (Graham, Dodd, Cottle, and Tatham 1962). These arguments are similar and have sometimes been called the 'bird in the hand' argument, a reference to the proverb 'a bird in the hand is worth two in the bush.' By assuming that a given amount of dividends is less risky than the same amount of capital gains, the argument is that a company that pays dividends will have a lower cost of equity capital than an otherwise similar company that does not pay dividends; the lower cost of equity should result in a higher share price. In a 1961 paper, Miller and Modigliani (MM) argued that in a world without taxes, transaction costs, and equal ('symmetric') information among all investors—that is, under perfect capital market assumptions—a company’s dividend policy should have no impact on its cost of capital or on shareholder wealth.", "ko": "MM: 완전자본시장에서 배당수익률은 주가에 영향 없음. Graham·Dodd(bird-in-hand): 투자자는 불확실한 자본이득보다 지금 받는 배당을 선호 → 배당수익률이 높을수록 자기자본비용↓ → 주가↑. 따라서 Graham·Dodd가 예측하는 주가가 더 높습니다.", "trap": "'완전자본시장 가정'이 문제에 있어도 bird-in-hand는 배당 선호를 주장한다.", "f": "", "why": {"A": "방향 반대입니다. Bird-in-hand는 배당이 주가를 올린다고 봅니다.", "B": "같다고 보는 것은 MM의 배당무관론뿐입니다."}, "orig": "ECO Module 1 Q62"}, {"id": "ECO-M1-Q63", "src": "ECO 오답", "module": 1, "tag": "Stock dividend 회계: RE → 납입자본", "vig": null, "stem": "An analyst gathers the following information about a company:\nRetained earnings\t€12 million\nContributed capital\t€28 million\nTotal shareholders’ equity\t€40 million\nAll else being equal, a €2 million stock dividend would result in contributed capital of:", "opts": {"A": "€26 million.", "B": "€28 million.", "C": "€30 million."}, "ans": "C", "en": "A is incorrect because contributed capital would be €28 million, as illustrated in the correct answer.\nB is incorrect because contributed capital would be €28 million, as illustrated in the correct answer.\nC is correct because a stock dividend is accounted for as a transfer of retained earnings to contributed capital. In this case:\nRetained earnings after the stock dividend = Retained earnings before the stock dividend – Stock dividend = €12 million – €2 million = €10 million\nContributed capital after the stock dividend = Contributed capital before the stock dividend + Stock dividend = €28 million + €2 million = €30 million\nAs an aside, total shareholders’ equity after the stock dividend would remain the same at €40 million.", "ko": "주식배당은 이익잉여금에서 납입자본으로 옮기는 회계처리입니다. 이익잉여금 12 − 2 = €10m, 납입자본 28 + 2 = €30m, 자본총계는 €40m 그대로.", "trap": "자본총계 불변 ≠ 구성 불변. 납입자본은 늘어난다.", "f": "주식배당: RE ↓, Contributed capital ↑, Total equity 불변", "why": {"A": "방향이 반대입니다. 납입자본은 줄지 않고 늘어납니다.", "B": "자본총계가 변하지 않는 것과 헷갈린 답입니다. 구성(이익잉여금 → 납입자본)은 바뀝니다."}, "orig": "ECO Module 1 Q63"}, {"id": "ECO-M1-Q64", "src": "ECO 오답", "module": 1, "tag": "Imputation 세제 유효세율", "vig": null, "stem": "An analyst gathers the following information about a company:\nPretax income\t$1,000,000\nCorporate tax rate\t30%\nDividend payout\t100%\nThe shareholder's marginal tax rate is 22%. Under the dividend imputation tax system, the effective tax rate on dividends is:", "opts": {"A": "22.0%.", "B": "30.0%.", "C": "45.4%."}, "ans": "A", "en": "A is correct because under the dividend imputation tax system, a corporation’s earnings are first taxed at the corporate level. When those earnings are distributed to shareholders in the form of dividends, shareholders receive a tax credit, known as a franking credit, for the taxes that the corporation paid on those distributed earnings (i.e., corporate taxes paid are imputed to the individual shareholder). A shareholder with a lower marginal tax bracket than the company’s actually receives a tax credit for the difference between the corporate rate and his own rate. This system effectively applies the shareholder tax rate to corporate pretax income by using tax credits or additional taxes to account for any differences between the corporate and shareholder tax rates.\nIn this case:\nTaxes at 30% corporate tax rate = Pretax income × 30% = 1,000,000 × 30% = 300,000\nNet income after tax = Pretax income – Taxes at 30% corporate tax rate = 1,000,000 – 300,000 = 700,000\nDividends paid = Net income after tax × Dividend payout = 700,000 × 100% = 700,000\nShareholder tax on pretax income = Pretax income × Shareholder’s marginal tax rate = 1,000,000 × 22% = 220,000\nTax credit for corporate payment = Taxes at 30% corporate tax rate = 300,000\nTax credit to the shareholder = Shareholder tax on pretax income – Tax credit for corporate payment = 220,000 – 300,000 = –80,000\nAmounts received by shareholder = Dividends + Tax credit = 700,000 + 80,000= 780,000.\nEffective tax rate on dividend = Shareholder tax on pretax income/Pretax income = 220,000/1,000,000= 22% or (Pretax income – Amounts received by shareholder)/Pretax income = (1,000,000 – 780,000)/1,000,000 = 220,000/1,000,000 = 22%.\nB is incorrect because this is the corporate tax rate (30%) and it ignores the tax credit to the shareholder considering the lower shareholder’s marginal tax rate (22%).\nC is incorrect because this considers the double taxation system where corporate pretax earnings are taxed at the corporate level and then taxed again at the shareholder level if they are distributed to taxable shareholders as dividends.\nIn this case:\nTaxes at 30% corporate tax rate = Pretax income × 30% = 1,000,000 × 30% = 300,000. Net income after tax = Pretax income – Taxes at 30% corporate tax rate = 1,000,000 – 300,000 = 700,000\nDividends paid = Net income after tax × Dividend payout = 700,000 × 100% = 700,000\nShareholder tax on dividends paid = Dividends paid × Shareholder’s marginal tax rate = 700,000 × 22% = 154,000\nAmounts received by shareholder = Dividends – Shareholder tax on dividends paid = 700,000 – 154,000 = 546,000.\nEffective tax rate on dividend = (Pretax income – Amounts received by shareholder)/Pretax income = (1,000,000 – 546,000)/1,000,000 = 454,000/1,000,000 = 45.4%.", "ko": "Imputation 제도에서는 법인세가 주주에게 세액공제로 넘어가 최종 부담은 주주의 한계세율이 됩니다 → 22%. 법인세율 30%는 계산에 쓰지 않습니다.", "trap": "Imputation이면 법인세율이 주어져도 답은 주주 세율.", "f": "Imputation: ETR = 주주 한계세율 ; Double: t_c + (1 − t_c)t_i", "why": {"B": "법인세율입니다. 주주 세율이 더 낮으면 차액을 세액공제로 돌려받습니다.", "C": "이중과세 공식 0.30 + 0.70 × 0.22 = 45.4%입니다. Imputation에서는 쓰지 않습니다."}, "orig": "ECO Module 1 Q64"}, {"id": "ECO-M1-Q66", "src": "ECO 오답", "module": 1, "tag": "자사주매입 방법: 속도 → Fixed-price tender", "vig": null, "stem": "A company seeking to repurchase shares prioritizes speed over other factors such as cost and flexibility. Which of the following is the most appropriate method of share repurchase for the company?", "opts": {"A": "Fixed price tender offer", "B": "Dutch auction tender offer", "C": "Open market share repurchase"}, "ans": "A", "en": "A is correct because a fixed price tender offer can be accomplished quickly, but the company usually has to offer a premium.\nB is incorrect because Dutch auctions can be accomplished quickly, though not usually as quickly as fixed price tender offers.\nC is incorrect because open market repurchases are typically made opportunistically, with cost a more important consideration than speed.", "ko": "속도가 최우선이면 fixed-price tender offer. 빨리 끝낼 수 있지만 보통 프리미엄을 줘야 합니다.", "trap": "속도: Fixed-price tender > Dutch auction > Open market. 유연성은 Open market이 최고.", "f": "", "why": {"B": "Dutch auction도 빠른 편이지만 fixed-price tender offer만큼 빠르지는 않습니다.", "C": "Open market 매입은 비용과 시점을 중시해 기회를 봐서 사는 방식이라 느립니다."}, "orig": "ECO Module 1 Q66"}, {"id": "ECO-M1-Q67", "src": "ECO 오답", "module": 1, "tag": "자사주매입 BVPS 계산", "vig": null, "stem": "An analyst gathers the following information about a company undertaking a share buyback:\nBook value\t$100 million\nShare price\t$5.00\nShares outstanding\t10 million\nIf the company buys back 200,000 shares, the book value per share after the buyback will be closest to:", "opts": {"A": "$10.00.", "B": "$10.10.", "C": "$10.20."}, "ans": "B", "en": "A is incorrect because this is the book value per share prior to the buyback: $100,000,000/10,000,000 = $10.00.\nB is correct because if the company buys back 200,000 shares, this equates to 200,000 × $5.00 = $1,000,000 buyback amount. The book value of the company after the buyback is therefore:\n$100,000,000 – $1,000,000 = $99,000,000\nBook value per share after the buyback is $99,000,000/(10,000,000 – 200,000) = $99,000,000/9,800,000 = $10.1020 ≈ $10.10.\nC is incorrect because the book value of the company is not reduced to account for the buyback:\n$100,000,000/(10,000,000 – 200,000) = $100,000,000/9,800,000 =$10.2040 ≈ $10.20.", "ko": "매입액 = 200,000 × $5 = $1m. 매입 후 BV = 100 − 1 = $99m, 주식 수 9.8m → BVPS = 99 / 9.8 = $10.10. 매입가 $5 < BVPS $10이라 BVPS가 오릅니다.", "trap": "BV에서 매입액(장부가 아니라 실제 지급액)을 빼는 것을 잊지 말 것.", "f": "새 BVPS = (BV − 매입액) / (주식 수 − 매입 주식 수)", "why": {"A": "매입 전 BVPS($100m / 10m)입니다.", "C": "BV에서 매입액 $1m을 빼지 않은 값($100m / 9.8m)입니다."}, "orig": "ECO Module 1 Q67"}, {"id": "SCH-R13-01", "src": "Schweser MQ", "module": 1, "tag": "글로벌 배당정책 추세", "vig": null, "stem": "Over the past 25 years, in the developed markets including the United States, the United Kingdom, and the European Union, the fraction of companies that:", "opts": {"A": "pay out cash dividends has decreased.", "B": "repurchase shares has decreased.", "C": "use particular dividend policies has been consistent over time and across countries."}, "ans": "A", "en": "Over the past decades, it has been observed that the percentage of companies engaging in share repurchases has increased over time. At the same time, the fraction of companies paying cash dividends has decreased. In addition to changing over time, dividend policies have been noted to differ between countries.", "ko": "현금배당을 하는 회사 비율은 줄었고, 자사주매입을 하는 회사 비율은 늘었습니다. 배당정책은 시기와 나라에 따라 다릅니다.", "trap": "ECO M1 Q54와 같은 개념: 배당하는 '회사 비율'↓.", "f": "", "why": {"B": "자사주매입을 하는 회사 비율은 늘었습니다.", "C": "배당정책은 시기와 나라에 따라 달라졌습니다."}, "orig": "Schweser MQ 13.2 Q1"}, {"id": "SCH-R13-02", "src": "Schweser MQ", "module": 1, "tag": "배당 지속가능성 지표 해석", "vig": null, "stem": "Which of the following is most likely to be sustainable?", "opts": {"A": "A FCFE coverage ratio of 0.5.", "B": "A dividend payout ratio of 0.5.", "C": "A dividend coverage ratio of 0.5."}, "ans": "B", "en": "An FCFE coverage ratio or dividend coverage ratio much less than one is not sustainable because the company is drawing on cash and marketable securities to make payments. A dividend payout ratio less than one indicates that the company is paying out less in dividends than it is earning, which is the normal (and desirable) situation.", "ko": "배당성향 0.5 = 번 돈의 절반만 배당 → 정상. 커버리지 비율(FCFE coverage, dividend coverage)이 1보다 많이 작으면 현금을 까먹으며 지급하는 것이라 지속 불가능.", "trap": "커버리지 < 1은 위험, 배당성향 < 1은 정상(방향 반대).", "f": "Payout = D / NI ; Coverage = NI / D", "why": {"A": "FCFE coverage 0.5 = FCFE의 두 배를 배당·자사주매입으로 내보내는 중이라 지속 불가능합니다.", "C": "Dividend coverage 0.5 = 이익의 두 배를 배당하는 중이라 지속 불가능합니다."}, "orig": "Schweser MQ 13.2 Q2"}, {"id": "SCH-R13-03", "src": "Schweser MQ", "module": 1, "tag": "자사주매입 이유", "vig": null, "stem": "Which of the following would not be a good reason for a company to repurchase shares of its own stock? Management:", "opts": {"A": "believes a stable cash dividend is in the best interests of shareholders.", "B": "believes its stock is overvalued.", "C": "wants to increase the amount of leverage in its capital structure."}, "ans": "B", "en": "Management would repurchase shares of its own stock if it believed the shares were undervalued, not overvalued.", "ko": "자사주매입은 주가가 '저평가'됐다고 볼 때 하는 것입니다. 고평가된 주식을 사들이는 것은 좋은 이유가 아닙니다.", "trap": "자사주매입 5가지 이유: 세금, 주가 지지/신호(저평가), 유연성, 스톡옵션 희석 상쇄, 레버리지 확대.", "f": "", "why": {"A": "작은 안정 배당 + 남는 돈은 자사주매입 → 유연성 확보라는 정당한 이유입니다.", "C": "차입 자사주매입으로 레버리지를 높이는 것은 정당한 이유입니다."}, "orig": "Schweser MQ 13.2 Q4"}, {"id": "SCH-R13-04", "src": "Schweser MQ", "module": 1, "tag": "Target payout adjustment model", "vig": null, "stem": "Last year, Wolverine Shoes and Boots had earnings of $4.00 per share and paid a dividend of $0.20. In the current year, the company expects to earn $4.40 per share. The company has a 30% target payout ratio and plans to bring its dividend up to the target payout ratio over an 8-year period. Next year’s expected dividend is closest to:", "opts": {"A": "$0.14.", "B": "$0.24.", "C": "$0.34."}, "ans": "C", "en": "Expected increase in dividends = [(expected earnings × target payout ratio) – previous dividend] × adjustment factor = [($4.40 × 30%) – $0.20] × (1/8) = $0.14. Expected dividend = $0.20 + $0.14 = $0.34.", "ko": "증가액 = (4.40 × 30% − 0.20) × 1/8 = (1.32 − 0.20) / 8 = 0.14. 묻는 것은 '배당액'이므로 0.20 + 0.14 = $0.34.", "trap": "'증가액'(ECO M1 Q51)인지 '배당액'인지 확인. 여기선 배당액.", "f": "D1 = D0 + (EPS1 × 목표 payout − D0) × 1/n", "why": {"A": "증가액만 구한 값입니다. 이전 배당 0.20을 더해야 합니다.", "B": "계산 오류 값입니다. 0.20 + 0.14 = 0.34."}, "orig": "Schweser MQ 13.2 Q5"}, {"id": "SCH-R13-05", "src": "Schweser MQ", "module": 1, "tag": "Bird-in-hand 이론", "vig": null, "stem": "The bird-in-hand argument for dividend policy is based on the idea that:", "opts": {"A": "rs = D1 / P0 + g is constant for any dividend policy.", "B": "a decrease in current dividends signals that future earnings will fall.", "C": "because of perceived differences in risk, investors value a dollar of dividends more highly than a dollar of expected capital gains."}, "ans": "C", "en": "The bird-in-hand argument for dividend policy is based on the fact that a dividend payment is more certain than future capital gains.", "ko": "Bird-in-hand(Gordon·Lintner): 지금 받는 배당이 불확실한 미래 자본이득보다 덜 위험 → 배당 1달러를 더 높이 평가 → 배당성향↑이면 자기자본비용↓.", "trap": "ECO M1 Q62(Graham·Dodd)와 같은 논리.", "f": "", "why": {"A": "자기자본비용이 배당정책과 무관하다는 것은 MM 무관론입니다.", "B": "배당 삭감이 이익 악화를 알린다는 것은 신호(signaling) 이론입니다."}, "orig": "Schweser MQ 13.1 Q4"}, {"id": "VAR-M1-01", "src": "변형", "module": 1, "tag": "Dutch auction 체결가격", "vig": null, "stem": "In a Dutch auction share repurchase, bids are accepted starting with the lowest price until the desired number of shares is filled. All accepted shares are then purchased at:", "opts": {"A": "the lowest price tendered.", "B": "each shareholder's own bid price.", "C": "the highest accepted bid price."}, "ans": "C", "en": "In a Dutch auction, bids are accepted based on lowest price first until the desired quantity is filled. The price of the last offer accepted (i.e., the highest accepted bid price) is the price paid for all shares tendered.", "ko": "낮은 가격부터 채택하다가 원하는 수량이 차면 멈추고, 마지막으로 채택된 가격(채택된 것 중 최고가)으로 모든 주식을 삽니다.", "trap": "'낮은 가격부터 채택' ≠ '최저가로 체결'. 체결가는 채택된 최고가.", "f": "", "why": {"A": "최저가부터 '채택'할 뿐 체결가는 마지막 채택가(최고가)입니다.", "B": "모든 채택 주식에 같은 가격(마지막 채택가)을 지급합니다."}, "orig": "변형 (오답노트 R13, Schweser LOS 13.i)"}, {"id": "VAR-M1-02", "src": "변형", "module": 1, "tag": "Split-rate 유효세율", "vig": null, "stem": "In a jurisdiction with a split-rate tax system, the corporate tax rate is 35% on retained earnings and 25% on earnings distributed as dividends. The individual tax rate on dividends is 20%. The effective tax rate on a unit of corporate earnings distributed as dividends is closest to:", "opts": {"A": "40.0%.", "B": "48.0%.", "C": "20.0%."}, "ans": "A", "en": "Under a split-rate system, the effective tax rate is computed as under double taxation but using the corporate tax rate for distributed income: 0.25 + (1 − 0.25)(0.20) = 0.25 + 0.15 = 0.40 = 40.0%.", "ko": "Split-rate는 이중과세 공식과 같되, 법인세율 자리에 '배당분' 법인세율(25%)을 씁니다: 0.25 + 0.75 × 0.20 = 40.0%.", "trap": "유보이익 법인세율(35%)은 쓰지 않는다. Imputation(주주 세율)과도 구분.", "f": "ETR = t_c(배당분) + (1 − t_c(배당분)) × t_i", "why": {"B": "유보이익 법인세율 35%를 쓴 값(0.35 + 0.65 × 0.20)입니다.", "C": "주주 세율만 쓴 값으로 imputation 제도의 답입니다."}, "orig": "변형 (오답노트 R13, Schweser LOS 13.f)"}, {"id": "VAR-M1-03", "src": "변형", "module": 1, "tag": "자사주매입 BVPS: 매입가 < BVPS", "vig": null, "stem": "A company's book value per share is $50 and its shares trade at $40. If the company repurchases shares at the market price, its book value per share will most likely:", "opts": {"A": "decrease.", "B": "remain unchanged.", "C": "increase."}, "ans": "C", "en": "After a stock repurchase, if the price paid is lower than the pre-repurchase BVPS, BVPS will increase; if the price paid is higher, BVPS will decrease.", "ko": "매입가 $40 < BVPS $50 → 장부가보다 싸게 사서 소각하는 셈이라 남은 주식의 BVPS가 오릅니다.", "trap": "직관과 반대로 느껴지는 방향: 싸게 사면 BVPS↑, 비싸게 사면 BVPS↓.", "f": "매입가 < BVPS → BVPS↑ / 매입가 > BVPS → BVPS↓", "why": {"A": "매입가가 BVPS보다 높을 때의 결과입니다.", "B": "매입가 = BVPS일 때만 변하지 않습니다."}, "orig": "변형 (오답노트 R13, Schweser LOS 13.k)"}, {"id": "VAR-M1-04", "src": "변형", "module": 1, "tag": "Stock dividend vs cash dividend: 자본총계", "vig": null, "stem": "Compared with paying a cash dividend of the same value, paying a stock dividend will most likely:", "opts": {"A": "reduce total shareholders' equity.", "B": "leave total shareholders' equity unchanged.", "C": "increase the company's debt-to-equity ratio."}, "ans": "B", "en": "In the case of a stock dividend, a decrease in retained earnings is offset by an increase in contributed capital, leaving total equity unchanged. Cash dividends reduce cash and shareholders’ equity, which raises leverage ratios; stock dividends do not affect these ratios.", "ko": "주식배당은 이익잉여금 → 납입자본 이동이라 자본총계가 그대로입니다. 현금배당은 현금과 자본을 줄여 부채비율을 높입니다.", "trap": "자본총계·레버리지가 바뀌는 건 현금배당.", "f": "주식배당: RE↓ = Contributed capital↑", "why": {"A": "자본총계를 줄이는 것은 현금배당입니다.", "C": "주식배당은 자본구조를 바꾸지 않아 D/E가 그대로입니다. D/E를 높이는 것은 현금배당입니다."}, "orig": "변형 (오답노트 R13, Schweser LOS 13.a)"}, {"id": "VAR-M1-05", "src": "변형", "module": 1, "tag": "Tax-exempt clientele: 배당락 가격으로 재투자", "vig": null, "stem": "An investor owns 1,000 shares of a company trading at $60. The company's shareholder clientele consists of tax-exempt investors. If the company pays a $2.40 dividend and the investor reinvests the entire dividend at the ex-dividend price, the investor's new share ownership is closest to:", "opts": {"A": "1,040.0.", "B": "1,041.7.", "C": "1,050.0."}, "ans": "B", "en": "Because dividends and capital gains are taxed equally (at zero), the ex-dividend price declines by the full dividend: $60 − $2.40 = $57.60. Dividends received = 1,000 × $2.40 = $2,400. Additional shares = $2,400 / $57.60 = 41.7. New ownership = 1,041.7 shares.", "ko": "비과세 고객층 → 배당락 가격 = 60 − 2.40 = $57.60. 배당 $2,400 / 57.60 = 41.7주 → 1,041.7주.", "trap": "배당 전 가격($60)으로 나누면 1,040주(함정).", "f": "Ex-div price = P − D ; 추가 주식 = 배당 / ex-div price", "why": {"A": "배당 전 가격 $60으로 나눈 값입니다.", "C": "계산 오류 값입니다. $2,400 / $57.60 = 41.7주."}, "orig": "변형 (오답노트 R13, ECO M1 Q12)"}, {"id": "SCH-R14-01", "src": "Schweser MQ", "module": 2, "tag": "소유구조와 principal–agent 문제", "vig": null, "stem": "The principal–agent problem is most severe under a corporate ownership structure of:", "opts": {"A": "dispersed ownership and dispersed voting power.", "B": "concentrated ownership and concentrated voting power.", "C": "dispersed ownership and concentrated voting power."}, "ans": "A", "en": "Under the combination of dispersed ownership and dispersed voting power, the principal–agent problem is likely to arise: this is the risk that managers will use a company’s resources to pursue their own interests. The other two ownership structures mentioned are more closely associated with the principal–principal problem.", "ko": "소유도 의결권도 흩어져 있으면 약한 주주 vs 강한 경영진 → principal–agent 문제가 가장 큽니다. 나머지 두 구조는 지배주주 vs 소수주주(principal–principal) 문제와 연결됩니다.", "trap": "분산+분산만 principal–agent. 나머지 조합은 principal–principal.", "f": "", "why": {"B": "집중 소유·집중 의결권은 지배주주가 소수주주를 희생시키는 principal–principal 문제가 큽니다.", "C": "피라미드·차등의결권으로 의결권만 집중된 경우도 principal–principal 문제입니다."}, "orig": "Schweser MQ 14.1 Q1"}, {"id": "SCH-R14-02", "src": "Schweser MQ", "module": 2, "tag": "Two-tier board", "vig": null, "stem": "A corporation’s two-tier board of directors is most likely to consist of a(n):", "opts": {"A": "executive board that oversees an internal board.", "B": "external board that oversees a nonexecutive board.", "C": "supervisory board that oversees a management board."}, "ans": "C", "en": "Two-tier boards of directors consist of a supervisory board that oversees a management board. A one-tier board is a single board of directors that is composed of internal (i.e., executive) and external (i.e., nonexecutive) directors.", "ko": "Two-tier = 감독이사회(supervisory board)가 경영이사회(management board)를 감독(독일·러시아·아르헨티나 등 의무). One-tier = 사내·사외이사가 한 이사회에 함께.", "trap": "감독하는 쪽이 supervisory, 감독받는 쪽이 management.", "f": "", "why": {"A": "사내(executive)·사외 이사 구분은 one-tier 이사회 구성 설명이며, 감독 관계가 아닙니다.", "B": "external/nonexecutive는 one-tier 이사회 안의 사외이사를 뜻합니다."}, "orig": "Schweser MQ 14.1 Q2"}, {"id": "SCH-R14-03", "src": "Schweser MQ", "module": 2, "tag": "CEO duality", "vig": null, "stem": "CEO duality refers to a situation where the chief executive officer (CEO):", "opts": {"A": "is a shareholder in the company.", "B": "serves as chairperson of the board.", "C": "has been granted superior or even sole voting rights."}, "ans": "B", "en": "CEO duality refers to the situation when the chief executive officer also serves as chairperson of the board. When a board director or manager is also a shareholder of a company, they are known as insiders. Dual-class shares generally grant one or more share classes superior or even sole voting rights.", "ko": "CEO duality = CEO가 이사회 의장을 겸임 → 이사회의 감독 기능이 약해질 우려.", "trap": "주주인 경영진 = insider, 우월 의결권 = dual-class. 혼동 주의.", "f": "", "why": {"A": "경영진이 주주이면 insider라고 합니다.", "C": "우월·단독 의결권은 dual-class shares입니다."}, "orig": "Schweser MQ 14.2 Q1"}, {"id": "SCH-R14-04", "src": "Schweser MQ", "module": 2, "tag": "채권 ESG 분석 초점", "vig": null, "stem": "In fixed-income analysis, ESG integration is:", "opts": {"A": "generally focused on identifying downside risk.", "B": "used to identify both potential opportunities and downside risk.", "C": "generally focused on identifying potential opportunities."}, "ans": "A", "en": "In fixed-income analysis, ESG integration is generally focused on identifying downside risk. (In equity analysis, ESG integration is used to identify both potential opportunities and downside risk.)", "ko": "채권은 상방이 제한돼(원리금만 받음) ESG 분석도 하방 위험에 집중합니다. 주식은 기회(상방)와 위험(하방)을 모두 봅니다.", "trap": "채권 = 하방만 / 주식 = 상방 + 하방.", "f": "", "why": {"B": "기회와 위험을 모두 보는 것은 주식 분석입니다.", "C": "채권 분석은 기회보다 하방 위험에 집중합니다."}, "orig": "Schweser MQ 14.2 Q2"}, {"id": "VAR-M2-01", "src": "변형", "module": 2, "tag": "ESG 식별 방법: Industry organizations", "vig": null, "stem": "An analyst identifies relevant ESG factors by relying on frameworks developed by not-for-profit groups such as the SASB and the IIRC, which promote standardized corporate ESG disclosures. This approach is best described as using:", "opts": {"A": "ESG data providers.", "B": "industry organizations.", "C": "proprietary methods."}, "ans": "B", "en": "Industry organizations are not-for-profit groups (e.g., IIRC, SASB) that work to promote standardized corporate disclosures of ESG issues. ESG data providers (e.g., MSCI, Sustainalytics, RepRisk) sell rankings, scores, and quantitative analysis. Proprietary methods use the analyst's own tools and judgment with sources such as 10-K filings and sustainability reports.", "ko": "SASB·IIRC 같은 비영리 단체의 표준화 프레임워크 → industry organizations. 데이터 판매 업체(MSCI 등)는 ESG data providers, 10-K·지속가능성 보고서를 직접 분석하면 proprietary methods.", "trap": "비영리 + 공시 표준화 = industry organizations.", "f": "", "why": {"A": "MSCI·Sustainalytics·RepRisk 같은 업체가 점수·순위를 제공하는 방식입니다.", "C": "애널리스트가 10-K·연차보고서 등을 직접 모아 자체 판단으로 분석하는 방식입니다."}, "orig": "변형 (오답노트 R14, Schweser LOS 14.c)"}, {"id": "VAR-M2-02", "src": "변형", "module": 2, "tag": "Green bond 특징", "vig": null, "stem": "Compared with an issuer's conventional bonds, a green bond issued by the same company most likely has:", "opts": {"A": "a higher credit rating because its proceeds fund environmental projects.", "B": "the same recourse and credit rating as the issuer's other bonds.", "C": "no exposure to greenwashing risk."}, "ans": "B", "en": "Aside from the intended use of the proceeds, green bonds tend to have the same recourse and credit ratings as the issuer’s other bonds. Green bonds may command a price premium. One concern is greenwashing, where a bond’s proceeds are not actually used for the environmental purpose advertised.", "ko": "Green bond는 자금 용도만 환경 프로젝트로 정해져 있을 뿐, 상환청구권과 신용등급은 같은 발행자의 다른 채권과 같습니다. 가격 프리미엄이 붙을 수 있고, greenwashing 위험이 있습니다.", "trap": "용도가 친환경이라고 신용도가 오르지 않는다.", "f": "", "why": {"A": "신용등급은 발행자의 다른 채권과 같습니다.", "C": "자금이 실제로 환경 목적에 쓰이지 않을 greenwashing 위험이 대표적인 우려입니다."}, "orig": "변형 (오답노트 R14, Schweser LOS 14.c)"}, {"id": "VAR-M2-03", "src": "변형", "module": 2, "tag": "차등의결권 → principal–principal", "vig": null, "stem": "A company's founders own 15% of its shares but control a majority of the votes through dual-class shares. The remaining shares are widely held. The governance conflict most likely to arise is a:", "opts": {"A": "principal–agent problem between dispersed shareholders and strong managers.", "B": "principal–principal problem between the controlling founders and minority shareholders.", "C": "no significant conflict, because concentrated voting power eliminates agency problems."}, "ans": "B", "en": "Dispersed ownership and concentrated voting power arises when controlling shareholders gain control over other minority shareholders through pyramid structures or dual-class shares despite less-than-majority ownership. This creates a principal–principal problem. The controlling shareholders' voting power also allows them to monitor management.", "ko": "분산 소유 + 집중 의결권(차등의결권) → 지배주주(창업자)가 소수주주를 희생시킬 수 있는 principal–principal 문제. 의결권이 집중돼 경영진은 감시되므로 principal–agent 문제는 작습니다.", "trap": "지분율 < 50%여도 의결권으로 지배하면 principal–principal.", "f": "", "why": {"A": "의결권이 창업자에게 집중돼 경영진을 감시할 수 있어 principal–agent 문제는 크지 않습니다.", "C": "집중 의결권은 다른 형태의 갈등(지배주주 vs 소수주주)을 만듭니다."}, "orig": "변형 (오답노트 R14, Schweser LOS 14.a)"}, {"id": "VAR-M2-04", "src": "변형", "module": 2, "tag": "Voting caps", "vig": null, "stem": "A government limits the voting rights of large shareholdings in companies in a strategic industry to discourage foreign investors from gaining control. This situation is best described as:", "opts": {"A": "concentrated ownership and dispersed voting power.", "B": "dispersed ownership and concentrated voting power.", "C": "dispersed ownership and dispersed voting power."}, "ans": "A", "en": "Concentrated ownership and dispersed voting power occurs in the presence of voting caps, where the voting rights of large share positions are restricted. Sovereign countries sometimes enact voting caps to discourage foreign investors from taking a controlling position in a company belonging to an industry that is considered important.", "ko": "큰 지분의 의결권을 제한하는 voting cap → 소유는 집중돼 있어도 의결권은 분산.", "trap": "Voting cap = 집중 소유 + 분산 의결권. 차등의결권·피라미드 = 분산 소유 + 집중 의결권.", "f": "", "why": {"B": "피라미드·차등의결권으로 적은 지분으로 의결권을 모으는 경우입니다.", "C": "주주가 많고 아무도 지배하지 않는 경우(principal–agent)입니다."}, "orig": "변형 (Schweser LOS 14.a)"}, {"id": "VAR-M2-05", "src": "변형", "module": 2, "tag": "Special voting arrangements", "vig": null, "stem": "Rules that give minority shareholders an advantage in board nomination and election are best described as:", "opts": {"A": "stewardship codes.", "B": "special voting arrangements.", "C": "comply-or-explain corporate governance codes."}, "ans": "B", "en": "Some countries attempt to provide an advantage to minority shareholders through special voting arrangements for board nomination and election. Stewardship codes seek to engage investors in corporate governance by exercising their legal rights. Comply-or-explain codes require firms to adopt best practices of corporate governance or explain why they have not.", "ko": "소수주주에게 이사 후보 추천·선임에서 유리함을 주는 장치 = special voting arrangements. Stewardship code는 기관투자자가 의결권 행사 등으로 지배구조에 관여하도록 하는 것.", "trap": "소수주주 보호(의결 장치) vs 기관투자자 관여(stewardship) 구분.", "f": "", "why": {"A": "Stewardship code는 투자자(주로 기관)가 권리를 행사해 지배구조에 관여하도록 유도하는 규범입니다.", "C": "Comply-or-explain 코드는 모범 지배구조를 따르거나 따르지 않는 이유를 설명하게 하는 규범입니다."}, "orig": "변형 (오답노트 R14, Schweser LOS 14.a)"}, {"id": "VAR-M2-06", "src": "변형", "module": 2, "tag": "주식 ESG 통합: 할인율 조정", "vig": null, "stem": "An equity analyst concludes that a company has implemented manufacturing practices that are more environmentally friendly than those of its competitors. The analyst's adjustment is most likely to:", "opts": {"A": "use a lower discount rate in valuing the company's stock.", "B": "increase the credit spread used to value the company's bonds.", "C": "make no adjustment, because equity analysis of ESG factors focuses only on downside risk."}, "ans": "A", "en": "Equity analysts consider both the upside and downside impact of ESG factors when valuing a firm’s stock. For example, the analyst may use a lower discount rate for a company that has implemented new manufacturing practices that are environmentally friendly compared to those of competitors.", "ko": "주식 분석은 ESG의 상방(기회)과 하방(위험)을 모두 봅니다. 경쟁사보다 친환경적인 제조 방식 → 위험이 낮다고 보고 할인율을 낮춥니다.", "trap": "하방만 보는 것은 채권 분석. 좋은 ESG → 할인율↓ 또는 이익 전망↑.", "f": "", "why": {"B": "좋은 ESG 요인은 신용스프레드를 넓히지 않습니다(넓히는 것은 부정적 요인).", "C": "하방에만 집중하는 것은 채권 분석입니다."}, "orig": "변형 (오답노트 R14, Schweser LOS 14.c–d)"}, {"id": "ECO-M3-Q5", "src": "ECO 오답", "module": 3, "tag": "평균 체계적위험(β=1) 주식의 요구수익률", "vig": 4, "stem": "Common stock issues in the aforementioned market with average systematic risk are most likely to have required rates of return of:", "opts": {"A": "between 2% and 7%.", "B": "between 7% and 9%.", "C": "9% or greater."}, "ans": "C", "en": "C is correct. Based on a long-term government bond yield of 7%, a beta of 1, and any of the risk premium estimates that can be calculated from the givens (e.g., a 2% historical risk premium estimate or 3.0% Grinold–Kroner ERP estimate), the required rate of return would be at least 9%. Based on using a short-term rate of 9%, C is the correct choice.", "ko": "평균 체계적위험 = β 1. 요구수익률 = 무위험이자율 + 1 × ERP. 10년 국채 7%에 어떤 ERP 추정치(역사적 2%, Grinold–Kroner 약 3%)를 더해도 9% 이상이고, 단기금리 9%를 쓰면 더 높습니다.", "trap": "'average systematic risk' = β 1 → 요구수익률 = rf + ERP.", "f": "r = rf + β × ERP (β = 1)", "why": {"A": "무위험이자율(최소 7%)보다 낮은 범위라 불가능합니다.", "B": "7% + ERP(최소 2%) = 9%이므로 9% 미만은 나올 수 없습니다."}, "orig": "ECO Module 3 Q5"}, {"id": "ECO-M3-Q6", "src": "ECO 오답", "module": 3, "tag": "Forward-looking ERP: Macroeconomic model", "vig": null, "stem": "An analyst wants to use a forward-looking approach to estimate the equity risk premium of a market in which public equities represent a relatively large share of the economy. The analyst has collected inflation and earnings growth data and wants to avoid the estimate being sensitive to recent market returns. The analyst also believes it is important to account for different rates of growth in earnings, dividends, and prices. The analyst should use which of the following estimation methods?", "opts": {"A": "Survey-based estimates", "B": "Macroeconomic modeling", "C": "The Gordon growth model"}, "ans": "B", "en": "A is incorrect because surveys used to estimate the equity risk premium tend to be sensitive to recent market returns. Because the analyst wants to avoid his estimate being sensitive to recent market returns, survey-based estimates is not the best method to use.\nB is correct because equity risk premium estimates derived from macroeconomic models rely on a number of forecasted economic variables such as inflation and expected growth in real earnings per share. These models might be more reliable when public equities represent a relatively large share of the economy, as in many developed markets. Given the analyst's use of inflation and growth data, coupled with the fact that public equities represent a relatively large share of the economy, macroeconomic modeling is the best choice.\nC is incorrect because the Gordon growth model does not allow for changes in growth, dividends, and prices. An underlying assumption of the Gordon growth model is that earnings, dividends, and prices will grow at the same rate, resulting in a constant P/E. If, however, the analyst believes this is not likely to be the case going forward, an adjustment would be needed that reflects anticipated P/E multiple expansion or contraction. Therefore, using the Gordon growth model is not useful because the analyst believes that it is important to allow for different rates for the growth earnings, dividends, and prices in the estimation.", "ko": "인플레이션·이익성장 자료를 쓰고, 최근 수익률에 덜 민감하며, 이익·배당·가격이 서로 다른 속도로 크는 것을 반영하려면 거시경제 모형(Grinold–Kroner)이 맞습니다. 상장주식이 경제에서 차지하는 비중이 클 때 더 신뢰할 수 있습니다.", "trap": "Survey = 최근 수익률 편향 / GGM = 이익·배당·가격 동일 성장(P/E 일정) 가정.", "f": "ERP = [DY + ΔP/E + i + g − ΔS] − rf (Schweser)", "why": {"A": "설문 추정치는 최근 시장 수익률에 편향되는 경향이 있습니다.", "C": "Gordon growth model은 이익·배당·가격이 같은 속도로 성장한다고(P/E 일정) 가정합니다."}, "orig": "ECO Module 3 Q6"}, {"id": "ECO-M3-Q7", "src": "ECO 오답", "module": 3, "tag": "Finance lease 부채비용: RIIL vs IBR", "vig": null, "stem": "Last year, a company acquired an asset using a finance lease. At that time, the company disclosed the interest rate for the lease liability and the rate of interest it would pay to borrow, using a collateralized loan over the same term. However, the company did not disclose the direct initial costs associated with the lease. The company has no other liabilities. Since then, interest rates have significantly increased. Which of the following is the most appropriate method to estimate the company's current cost of debt?", "opts": {"A": "Calculate the rate implicit in the lease", "B": "Determine the company's incremental borrowing rate", "C": "Use the interest rate disclosed by the company at the time of asset acquisition"}, "ans": "B", "en": "A is incorrect because the rate implicit in the lease (RIIL) is the discount rate that equates the sum of the present value of the lease payments and the present value of the residual value with the sum of the fair value of the leased asset and the lessor’s direct costs (e.g., legal fees). However, the direct costs associated with the lease are not disclosed. Therefore, the RIIL cannot be calculated.\nB is correct because the present value of the residual value and the lessor’s direct initial costs are often not known to the lessee (company) or analyst. If unknown [as in this case], the incremental borrowing rate (IBR), which is the rate of interest the company would pay to borrow using a collateralized loan over the same term, might be used. Therefore, provided the change in the interest environment, the IBR is an appropriate method to estimate the cost of debt of the company.\nC is incorrect because since the time of asset acquisition, interest rates have significantly increased. Therefore, using the interest rate disclosed at time of asset acquisition is not an accurate estimator for the current cost of debt of the company.", "ko": "RIIL을 구하려면 lessor의 초기 직접비용이 필요한데 공시되지 않았습니다. 그 경우 같은 기간 담보대출 금리인 incremental borrowing rate(IBR)를 씁니다. 금리가 크게 올랐으니 현재 IBR을 다시 구해야 합니다.", "trap": "리스 조건 공시 → RIIL / 미공시 → IBR. 과거 금리는 현재 비용이 아님.", "f": "RIIL: PV(리스료) + PV(잔존가치) = 자산 공정가치 + lessor 초기 직접비용", "why": {"A": "lessor의 초기 직접비용이 공시되지 않아 RIIL을 계산할 수 없습니다.", "C": "취득 이후 금리가 크게 올라 과거 금리는 현재 부채비용을 반영하지 못합니다."}, "orig": "ECO Module 3 Q7"}, {"id": "ECO-M3-Q8", "src": "ECO 오답", "module": 3, "tag": "자본비용 요인: Top-down vs Bottom-up", "vig": null, "stem": "Which of the following is a bottom-up factor affecting a company's cost of capital?", "opts": {"A": "ESG risk", "B": "The risk-free rate", "C": "Capital availability"}, "ans": "A", "en": "A is correct because ESG risks are specific to an individual company and are therefore bottom-up factors. Even if industry peers face similar environmental risks, they will have varied approaches to dealing with them. No two companies are exactly alike with respect to their ESG risks, as reflected in company disclosures. A company with higher environmental, social, and governance (ESG) risk is likely to have a higher cost of capital.\nB is incorrect because the risk-free rate is a macroeconomic factor and therefore a top-down factor. Macroeconomic and country-specific economic factors, such as inflation rates, are reflected in benchmark interest rates and the overall level of credit spreads. Higher relative rates of inflation, represented in a higher risk-free rate, increase the cost of capital for companies.\nC is incorrect because capital availability represents a top-down, and not a bottom-up factor, that influences a company's cost of capital.", "ko": "ESG 위험은 회사마다 다른 회사 고유 요인이라 bottom-up입니다. 무위험이자율(시장 상황)과 자본 가용성은 거시 요인이라 top-down입니다.", "trap": "Top-down = 자본 가용성, 시장 상황(금리·인플레), 법·규제, 세제 / Bottom-up = 영업위험, 자산 성격, 재무건전성, 증권 조건, ESG.", "f": "", "why": {"B": "무위험이자율은 인플레이션·금리 같은 시장 상황(거시) 요인이라 top-down입니다.", "C": "자본 가용성은 대표적인 top-down 요인입니다."}, "orig": "ECO Module 3 Q8"}, {"id": "ECO-M3-Q12", "src": "ECO 오답", "module": 3, "tag": "Build-up approach (β 사용 X)", "vig": null, "stem": "An analyst wants to estimate the cost of equity of a private company using the build-up approach, and gathers the following data about relevant risk premia:\nEquity risk premium (ERP)\t6.0%\nSize premium (SP)\t4.5%\nSpecific-company risk premium (SCRP)\t5.0%\nIf the risk-free rate is 3.5% and peer beta is 1.5, the estimated cost of equity is closest to:", "opts": {"A": "15.5%.", "B": "19.0%.", "C": "22.0%."}, "ans": "B", "en": "A is incorrect because this answer choice omits the risk-free rate:\nre = 6.0% + 4.5% + 5.0% = 15.5%.\nB is correct because the build-up approach involves 'building up' the required return on equity, beginning with the risk-free rate, and then adding relevant risk premia to account for various risk considerations:\nre = rf + ERP + SP + SCRP\nwhere SP is a size premium and SCRP is a specific-company risk premium.\nThus, re = 3.5% + 6.0% + 4.5% + 5.0% = 19.0%.\nC is incorrect because this answer choice uses the expanded CAPM model instead of the build-up approach:\nre = rf + βpeer ERP + SP +
