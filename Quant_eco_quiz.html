 a \"currencysign\" token. Group 2 still has inflected forms; Group 3 has inflected forms, the \"EUR\" symbol, and the uppercase \"Sales.\"", "ko": "정제·가공 완료 신호: 소문자화, 통화기호 → 'currencysign' 같은 annotation, n-gram(부정어 유지), stemming(어간만 남김: increas). Group 1만 모두 해당합니다.", "trap": "Group 2도 n-gram은 있지만 stemming이 안 되어 있음.", "f": "Stemming: increased → increas", "why": {"B": "n-gram은 있지만 'increased', 'decreased'처럼 어간 추출(stemming)이 안 되어 있습니다.", "C": "어간 추출도 없고, 'EUR' 기호와 대문자 'Sales'도 그대로입니다."}, "orig": "ECO Module 7 Q18"}, {"id": "ECO-M7-Q20", "src": "ECO 오답", "module": 7, "tag": "TF 너무 높음·너무 낮음 → 둘 다 제거", "vig": 19, "stem": "Based on Exhibit 2, Achler should exclude from further analysis words in:", "opts": {"A": "only Group 1.", "B": "only Group 2.", "C": "both Group 1 and Group 2."}, "ans": "C", "en": "Group 1 has the highest frequency values (mostly stop words) and Group 2 has the lowest (rare terms). The most frequent tokens make it hard to choose a decision boundary (underfitting), and the least frequent tokens mislead the model into classifying texts with rare terms into a specific class (overfitting). Both are noise features and should be removed.", "ko": "고빈도 토큰(stop words) → 모든 문서에 있어 구분력 없음 → underfitting. 저빈도 토큰 → 특정 문서에만 있는 noise → overfitting. 둘 다 제거합니다.", "trap": "한쪽만 noise라고 생각하는 함정.", "f": "High TF → underfit, Low TF → overfit → 둘 다 제거", "why": {"A": "저빈도 단어(Group 2)도 감성 구분에 기여하지 않는 noise라 제거해야 합니다.", "B": "고빈도 단어(Group 1)는 대부분 stop words라 제거해야 합니다."}, "orig": "ECO Module 7 Q20"}, {"id": "ECO-M7-Q22", "src": "ECO 오답", "module": 7, "tag": "AUC – 높고 train/CV 차이 작아야", "vig": 19, "stem": "Based on Exhibit 3, which threshold p-value indicates the best fitting model?", "opts": {"A": "0.57", "B": "0.79", "C": "0.84"}, "ans": "B", "en": "The higher the AUC, the better the model performance. For p = 0.79, the AUC is 91.3% (training) and 89.7% (CV), so the model performs similarly on both – a good fit. For p = 0.57, AUC near 50% signifies random guessing. For p = 0.84, the large gap (98.4% vs 87.1%) suggests overfitting.", "ko": "AUC는 높을수록 좋고(0.5 = 무작위 추측), training과 CV의 AUC 차이가 작아야 일반화가 잘 된 모델입니다.", "trap": "training AUC가 가장 높은 0.84를 고르는 함정 – CV와 차이가 커서 과적합.", "f": "Best: high AUC + small (train − CV) gap", "why": {"A": "AUC가 약 57%로 50%(무작위 추측)에 가깝습니다.", "C": "training AUC(98.4%)와 CV AUC(87.1%) 차이가 커서 과적합입니다."}, "orig": "ECO Module 7 Q22"}, {"id": "ECO-M7-Q25", "src": "ECO 오답", "module": 7, "tag": "중간 TF 토큰이 정보 가치 큼", "vig": 20, "stem": "Based on the text exploration method used for Dataset ABC, tokens that potentially carry important information useful for differentiating the sentiment embedded in the text are most likely to have values that are:", "opts": {"A": "low.", "B": "intermediate.", "C": "high."}, "ans": "B", "en": "When analyzing term frequency at the corpus level (collection frequency), tokens with intermediate TF values potentially carry important information useful for differentiating sentiment. The highest TF tokens are mostly stop words; the lowest TF tokens are mostly proper nouns or sparse terms.", "ko": "collection frequency 분석: 너무 높으면 stop words, 너무 낮으면 고유명사·희귀어 → 둘 다 noise. 중간 TF가 감성 구분에 유용합니다.", "trap": "", "f": "Useful tokens = intermediate TF", "why": {"A": "가장 낮은 TF는 주로 고유명사·희귀어(noise)입니다.", "C": "가장 높은 TF는 주로 stop words(noise)입니다."}, "orig": "ECO Module 7 Q25"}, {"id": "ECO-M7-Q26", "src": "ECO 오답", "module": 7, "tag": "IDF·TF-IDF 정의", "vig": 20, "stem": "Which of Bector's statements regarding TF, IDF, and TF–IDF is correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "Statement 3 is correct: TF–IDF values vary by the number of documents in the dataset, so model performance can vary when applied to a dataset with just a few documents. Statement 1 is incorrect because IDF is the log of the inverse of document frequency. Statement 2 is incorrect because TF at the sentence (not collection) level is multiplied by IDF.", "ko": "IDF = log(1/DF) – 그냥 역수가 아니라 '로그'. TF-IDF = 문장(문서) 수준 TF × IDF – collection 수준 TF가 아님. 문서 수가 적으면 TF-IDF가 불안정합니다.", "trap": "'inverse'만 보고 log를 놓치기 쉬움.", "f": "IDF = ln(1/DF);  TF-IDF = TF(sentence) × IDF", "why": {"A": "IDF는 DF의 역수가 아니라 역수의 로그입니다.", "B": "TF-IDF에는 collection 수준이 아니라 문장(문서) 수준 TF를 씁니다."}, "orig": "ECO Module 7 Q26"}, {"id": "ECO-M7-Q27", "src": "ECO 오답", "module": 7, "tag": "Ground truth 없음 → 비지도, 분할 불필요", "vig": 20, "stem": "What percentage of Dataset ABC should be allocated to a training subset?", "opts": {"A": "0%", "B": "20%", "C": "60%"}, "ans": "A", "en": "Dataset ABC has no ground truth (no known outcome or target variable), so it is an unsupervised ML problem. For unsupervised learning, no splitting of the master dataset is needed because there is no labeled training data.", "ko": "Ground truth(정답 레이블)가 없음 → 비지도학습 → training/CV/test 분할 자체가 필요 없음 → 0%. 지도학습이면 보통 60/20/20.", "trap": "지도학습 기본 분할(60%)을 기계적으로 고르는 함정.", "f": "Supervised: ~60/20/20;  Unsupervised: no split", "why": {"B": "20%는 지도학습에서 CV·test 세트의 일반적 비율입니다. 이 데이터는 비지도입니다.", "C": "60%는 지도학습 training 세트의 일반적 비율입니다. 비지도는 분할하지 않습니다."}, "orig": "ECO Module 7 Q27"}, {"id": "ECO-M7-Q30", "src": "ECO 오답", "module": 7, "tag": "Confusion matrix → accuracy", "vig": 20, "stem": "Based on Exhibit 2, the accuracy metric for Dataset XYZ's test set sample is closest to:", "opts": {"A": "0.67.", "B": "0.70.", "C": "0.75."}, "ans": "B", "en": "With threshold 0.65, a p-value > 0.65 is predicted Class 1. Sentences 1, 4, 6 are TP; 9 is FP; 3 and 8 are FN; 2, 5, 7, 10 are TN. TP = 3, FP = 1, FN = 2, TN = 4. Accuracy = (TP + TN)/(TP + FP + TN + FN) = 7/10 = 0.70. (Precision = 0.75; recall = 0.60; F1 = 0.67.)", "ko": "임계값보다 크면 1로 예측 → 실제와 비교해 TP/FP/FN/TN 세기. 정확도 = 맞춘 수/전체. 0.75는 정밀도, 0.67은 F1입니다.", "trap": "정밀도·F1과 정확도를 혼동.", "f": "Accuracy = (TP + TN)/N;  Precision = TP/(TP + FP);  Recall = TP/(TP + FN)", "why": {"A": "0.67은 F1 = 2PR/(P + R) = 2(0.75)(0.60)/1.35입니다.", "C": "0.75는 정밀도 TP/(TP + FP) = 3/4입니다."}, "orig": "ECO Module 7 Q30"}, {"id": "ECO-M7-Q31", "src": "ECO 오답", "module": 7, "tag": "모델 학습 3단계 (선택→평가→튜닝)", "vig": 20, "stem": "Which of Bector's remarks related to model training is correct?", "opts": {"A": "Only Remark 1", "B": "Only Remark 2", "C": "Both Remark 1 and Remark 2"}, "ans": "A", "en": "Method selection is governed by (1) supervised or unsupervised learning, (2) the type of data, and (3) the size of data. Remark 2 is incorrect because model fitting errors (bias and variance error) are used in tuning, not performance evaluation. Performance evaluation uses error analysis, ROC plots, and RMSE.", "ko": "모델 학습 순서: ① Method selection(지도/비지도, 데이터 유형, 크기) → ② Performance evaluation(오류 분석·ROC·RMSE) → ③ Tuning(bias/variance error 균형).", "trap": "bias/variance error는 '평가'가 아니라 '튜닝' 단계.", "f": "Method selection → Performance evaluation → Tuning", "why": {"B": "Remark 2는 틀렸습니다 – bias/variance error는 튜닝 단계에서 씁니다.", "C": "Remark 2가 틀렸으므로 둘 다 맞을 수 없습니다."}, "orig": "ECO Module 7 Q31"}, {"id": "ECO-M7-Q32", "src": "ECO 오답", "module": 7, "tag": "텍스트 정제 단계 vs 가공 단계", "vig": 21, "stem": "Wu's recollection about the preparation of the textual data is most accurate with respect to:", "opts": {"A": "numbers.", "B": "stop words.", "C": "lowercasing."}, "ans": "A", "en": "Punctuation, HTML tags, numbers, and white space are removed in the text preparation (cleansing) stage; numbers are replaced with an annotation such as \"/number/\". Stop words and lowercasing are part of the text wrangling (preprocessing) stage.", "ko": "텍스트 정제(cleansing): HTML 태그, 구두점, 숫자, 공백 제거. 텍스트 가공(wrangling/preprocessing): 토큰화, 소문자화, stop words 제거, stemming·lemmatization.", "trap": "stop words·소문자화를 정제 단계로 착각.", "f": "Cleansing: HTML·punctuation·numbers·white space", "why": {"B": "stop words 제거는 정제가 아니라 가공(preprocessing) 단계입니다.", "C": "소문자화는 정제가 아니라 가공(preprocessing) 단계입니다."}, "orig": "ECO Module 7 Q32"}, {"id": "ECO-M7-Q34", "src": "ECO 오답", "module": 7, "tag": "실제 1, 예측 0 → Type II error", "vig": 21, "stem": "Based on Exhibit 2, the most appropriate statement about the model's performance for the selected credit applicant is that it results in:", "opts": {"A": "a Type I error.", "B": "a Type II error.", "C": "the correct classification."}, "ans": "B", "en": "The threshold p-value for Class 1 (default) is 0.60, which has not been met (p = 0.41), so the model predicts non-default (Class 0). The loan actually defaulted, so it is a false negative (Type II error).", "ko": "p = 0.41 < 0.60 → Class 0(정상) 예측 → 실제는 부도(Class 1) → 거짓 음성(FN) = Type II error.", "trap": "Type I = FP(실제 0인데 1로 예측), Type II = FN(실제 1인데 0으로 예측).", "f": "FP = Type I,  FN = Type II", "why": {"A": "Type I(거짓 양성)은 부도가 아닌데 부도로 예측한 경우입니다.", "C": "부도를 정상으로 예측했으므로 오분류입니다."}, "orig": "ECO Module 7 Q34"}, {"id": "ECO-M7-Q35", "src": "ECO 오답", "module": 7, "tag": "클래스 불균형 → F1 score", "vig": 21, "stem": "Using Exhibit 3 and Quinn's reminder, the most appropriate measure of the accuracy of the model is:", "opts": {"A": "0.79.", "B": "0.86.", "C": "0.92."}, "ans": "B", "en": "With unequal class distributions, F1 (the harmonic mean of precision and recall) is a better measure. P = 118/(118 + 32) = 0.79; R = 118/(118 + 8) = 0.94; F1 = 2PR/(P + R) = 0.86. Accuracy (118 + 320)/478 = 0.92 is less appropriate with class imbalance.", "ko": "클래스 불균형(부도 ≪ 정상)이면 accuracy보다 F1이 적절합니다. F1 = 2PR/(P + R).", "trap": "accuracy(0.92)를 그대로 고르는 함정.", "f": "F1 = 2 × P × R / (P + R)", "why": {"A": "0.79는 정밀도(precision)입니다.", "C": "0.92는 정확도(accuracy)로, 클래스 불균형일 때는 F1보다 부적절합니다."}, "orig": "ECO Module 7 Q35"}, {"id": "ECO-M7-Q42", "src": "ECO 오답", "module": 7, "tag": "N-grams – 다단어 패턴 유지", "vig": null, "stem": "Which of the following is a feature engineering technique where multi-word patterns that are particularly discriminative can be identified and their connection kept intact?", "opts": {"A": "N-grams", "B": "Parts of speech", "C": "Name entity recognition"}, "ans": "A", "en": "N-grams is a feature engineering technique where multi-word patterns that are particularly discriminative are identified and their connection kept intact (e.g., \"stock market\" vs. \"market\"). POS tags each token with a part of speech; NER tags tokens with an object class.", "ko": "N-gram: 여러 단어를 하나의 토큰으로 묶어 순서 유지(예: expansionary_monetary_policy). POS: 품사 태그. NER: 조직·장소·날짜 등 개체 태그.", "trap": "", "f": "N-gram = multi-word token", "why": {"B": "POS는 각 토큰에 품사(명사·동사 등) 태그를 붙입니다.", "C": "NER은 토큰에 조직·장소 같은 개체 클래스 태그를 붙입니다."}, "orig": "ECO Module 7 Q42"}, {"id": "ECO-M7-Q43", "src": "ECO 오답", "module": 7, "tag": "Type I error = 거짓 양성", "vig": null, "stem": "In error analysis for classification problems, a Type I error refers to the situation where:", "opts": {"A": "both the predicted condition and the actual condition are negative.", "B": "the predicted condition is negative but the actual condition is positive.", "C": "the predicted condition is positive but the actual condition is negative."}, "ans": "C", "en": "A false positive (predicted positive, actually negative) is a Type I error. A false negative is a Type II error. Both negative is a true negative.", "ko": "Type I error = FP(실제 음성인데 양성으로 예측). Type II error = FN(실제 양성인데 음성으로 예측).", "trap": "", "f": "FP = Type I,  FN = Type II", "why": {"A": "예측·실제 모두 음성이면 TN(맞힌 것)입니다.", "B": "실제 양성을 음성으로 예측하면 FN = Type II error입니다."}, "orig": "ECO Module 7 Q43"}, {"id": "ECO-M7-Q44", "src": "ECO 오답", "module": 7, "tag": "IDF 계산 = ln(1/DF)", "vig": null, "stem": "In textual analysis of data, the inverse document frequency (IDF) measures how unique a term is across the entire corpus. If the entire corpus consists of 2,718 sentences and a particular word occurs in 1,618 sentences, the IDF is closest to:", "opts": {"A": "0.52.", "B": "0.60.", "C": "1.68."}, "ans": "A", "en": "DF = 1,618/2,718 = 0.5953. IDF = log(1/DF) (natural log) = ln(1/0.5953) = 0.5187 ≈ 0.52.", "ko": "DF = 단어가 들어간 문장 수/전체 문장 수. IDF = ln(1/DF). 흔한 단어일수록 IDF가 작습니다.", "trap": "DF(0.60)나 1/DF(1.68)에서 멈추는 실수.", "f": "DF = n_with_word / N;  IDF = ln(1/DF)", "why": {"B": "0.60은 DF 자체입니다.", "C": "1.68은 1/DF로, 로그를 취하지 않았습니다."}, "orig": "ECO Module 7 Q44"}, {"id": "ECO-M7-Q46", "src": "ECO 오답", "module": 7, "tag": "Parts of speech – 품사 태그", "vig": null, "stem": "Which of the following text processing techniques tags different words in a sentence with tags such as noun, verb, or adjective?", "opts": {"A": "N-grams", "B": "Parts of speech", "C": "Name entity recognition"}, "ans": "B", "en": "Parts of speech (POS) uses language structure and dictionaries to tag every token with a corresponding part of speech, such as noun, verb, adjective, and proper noun. NER tags object classes such as organizations, dates, and locations.", "ko": "POS = 품사 태그(명사·동사·형용사). NER = 개체명 태그(ORG, Place, Date).", "trap": "POS와 NER 혼동.", "f": "POS: noun/verb/adj;  NER: ORG/Place/Date", "why": {"A": "n-gram은 다단어 패턴을 하나의 토큰으로 묶는 기법입니다.", "C": "NER은 품사가 아니라 조직·날짜·장소 같은 개체 클래스를 태그합니다."}, "orig": "ECO Module 7 Q46"}, {"id": "VAR-M7-01", "src": "변형", "module": 7, "tag": "표준화(standardization) 계산", "vig": null, "stem": "A feature has a mean of 3.0, a standard deviation of 0.5, a minimum of 1.0, and a maximum of 11.0. For an observation with a value of 5.0, the standardized value is closest to:", "opts": {"A": "4.0.", "B": "0.4.", "C": "2.0."}, "ans": "A", "en": "Standardization centers the variable at 0 and scales it in units of standard deviation: (X − μ)/σ = (5.0 − 3.0)/0.5 = 4.0. Normalization would give (5 − 1)/(11 − 1) = 0.4.", "ko": "표준화 = (X − 평균)/표준편차 → 평균 0, 표준편차 1. 정규화 = (X − 최솟값)/(최댓값 − 최솟값) → 0~1.", "trap": "정규화(0.4)와 혼동, 표준편차로 나누기 누락(2.0).", "f": "Standardized = (X − μ)/σ;  Normalized = (X − Xmin)/(Xmax − Xmin)", "why": {"B": "0.4는 정규화 값입니다.", "C": "5.0 − 3.0 = 2.0에서 표준편차 0.5로 나누지 않았습니다."}, "orig": "변형 (오답노트 R4 normalization/standardization, Schweser LOS 4.b)"}, {"id": "VAR-M7-02", "src": "변형", "module": 7, "tag": "Feature selection vs feature engineering", "vig": null, "stem": "An analyst states: \"Appropriate feature selection is a key factor in minimizing model overfitting, whereas feature engineering tends to prevent model underfitting.\" The analyst's statement is:", "opts": {"A": "correct.", "B": "incorrect with respect to feature selection.", "C": "incorrect with respect to feature engineering."}, "ans": "A", "en": "Feature selection removes unneeded features, reducing model complexity and feature-induced noise, which mitigates overfitting. Feature engineering, when properly done, creates or improves features and tends to reduce the underfitting problem.", "ko": "Feature selection(불필요한 특성 제거) → 과적합 완화. Feature engineering(유용한 특성 생성·개선) → 과소적합 완화.", "trap": "", "f": "Selection → overfit↓;  Engineering → underfit↓", "why": {"B": "특성 선택은 노이즈 특성을 줄여 과적합을 완화하므로 맞는 설명입니다.", "C": "특성 공학은 과소적합을 줄이는 경향이 있으므로 맞는 설명입니다."}, "orig": "변형 (오답노트 R4 feature selection/engineering, Schweser LOS 4.e)"}, {"id": "VAR-M7-03", "src": "변형", "module": 7, "tag": "Train 오차 작고 CV 오차 큼 → 과적합", "vig": null, "stem": "During a grid search, an analyst observes that for the current hyperparameter values the prediction error on the training dataset is small, whereas the prediction error on the cross-validation dataset is significantly larger. The model most likely:", "opts": {"A": "has high bias error and is underfitted.", "B": "has high variance error and is overfitted.", "C": "is well fitted and needs no further tuning."}, "ans": "B", "en": "A small training error with a much larger cross-validation error indicates high variance error, i.e., overfitting. The analyst would tune toward lower complexity (e.g., more regularization).", "ko": "Training 오차 ≪ CV 오차 → 차이가 큼 = high variance = 과적합. 규제가 약하면(slight regularization) 모델이 복잡해져 과적합이 생깁니다.", "trap": "", "f": "Gap(CV − train) 큼 → variance error → overfit", "why": {"A": "bias error가 크면 training 오차부터 큽니다.", "C": "training과 CV 오차 차이가 크므로 잘 적합된 모델이 아닙니다."}, "orig": "변형 (오답노트 R4 overfitting, Schweser LOS 4.c)"}, {"id": "VAR-M7-04", "src": "변형", "module": 7, "tag": "텍스트 데이터 수집(curation) 단계", "vig": null, "stem": "In a text-based big data project, the step that involves determining the sources of the data (for example, web scouring or specific social media sites) and, for supervised learning, annotating a reliable target variable is:", "opts": {"A": "data collection (curation).", "B": "text preparation and wrangling.", "C": "text exploration."}, "ans": "A", "en": "For unstructured text projects the steps are: (1) text problem formulation, (2) data collection (curation) – determining the sources of data such as web scouring and specific social media sites, and annotating the target for supervised learning, (3) text preparation and wrangling, and (4) text exploration.", "ko": "텍스트 프로젝트 순서: ① 문제 정의 → ② 데이터 수집(curation: 웹 스파이더링 등 출처 결정, 레이블 지정) → ③ 텍스트 준비·가공(정제·전처리) → ④ 텍스트 탐색(시각화, 특성 선택·공학) → ⑤ 모델 학습.", "trap": "curation에 '정제·전처리'까지 포함된다고 착각하는 함정.", "f": "Formulation → Curation → Prep & wrangling → Exploration → Training", "why": {"B": "텍스트 준비·가공은 수집 이후 비정형 데이터를 정제·전처리하는 단계입니다.", "C": "텍스트 탐색은 시각화와 특성 선택·공학 단계입니다."}, "orig": "변형 (오답노트 R4 data curation, Schweser LOS 4.a)"}, {"id": "VAR-M7-05", "src": "변형", "module": 7, "tag": "Document frequency(DF) 계산", "vig": null, "stem": "In a corpus of 600 documents, a particular token appears in 150 documents. The document frequency (DF) of the token is:", "opts": {"A": "0.25.", "B": "4.00.", "C": "1.39."}, "ans": "A", "en": "The DF of a token is the number of documents containing that token divided by the total number of documents: 150/600 = 0.25.", "ko": "DF = 토큰이 들어간 문서 수/전체 문서 수. (1/DF = 4.00, ln(1/DF) = 1.39는 IDF 계산 단계입니다.)", "trap": "DF와 IDF 혼동.", "f": "DF = docs with token / total docs;  IDF = ln(1/DF)", "why": {"B": "4.00은 1/DF입니다.", "C": "1.39는 ln(1/DF) = IDF입니다."}, "orig": "변형 (오답노트 R4 TF/DF, Schweser LOS 4.e)"}, {"id": "VAR-M7-06", "src": "변형", "module": 7, "tag": "데이터 변환 – Selection (열 제거)", "vig": null, "stem": "During data preprocessing, an analyst removes several data columns (features) that are not needed for the project. This type of data transformation is best described as:", "opts": {"A": "filtration.", "B": "selection.", "C": "aggregation."}, "ans": "B", "en": "Selection involves removing features (data columns) not needed for processing. Filtration involves removing irrelevant observations (rows). Aggregation consolidates two related variables into one using appropriate weights.", "ko": "Selection = 불필요한 열(특성) 제거, Filtration = 불필요한 행(관측치) 제거, Extraction = 기존 변수에서 새 변수 생성.", "trap": "행(filtration)과 열(selection) 혼동.", "f": "Columns → selection;  Rows → filtration", "why": {"A": "filtration은 관측치(행)를 제거하는 것입니다.", "C": "aggregation은 관련 변수 둘을 합쳐 하나로 만드는 것입니다."}, "orig": "변형 (오답노트 R4 Extraction, Schweser LOS 4.b)"}], "vignettes": ["You are a junior analyst at an asset management firm. Your supervisor asks you to analyze the return drivers for one of the firm's portfolios. She asks you to construct a regression model of the portfolio's monthly excess returns (RET) against three factors: the market excess return (MRKT), a value factor (HML), and the monthly percentage change in a volatility index (VIX).\nYou collect the data and run the regression, and the resulting model is\nYRET = –0.999 + 1.817 XMRKT + 0.489 XHML + 0.037 XVIX.\nYou then create some diagnostic charts to help determine the model fit. (Chart images are replaced by the ECO text descriptions.)\nChart 1 – RET vs. VIX: Percent change in VIX (−60 to 160) on the x-axis and RET (−40 to 30) on the y-axis. A straight line falls from (−40, 10) through (40, −5) to (120, −15); dots surround the origin. The relationship appears to be more curved (i.e., quadratic) than linear.\nChart 3 – MRKT vs. HML: A flatter line passes through (−5, −3), (0, 0) and (10, 1); dots are scattered on and around the line.\nChart 4 – RET predicted values (x-axis) vs. RET residuals (y-axis): dots are scattered around a horizontal line at 0.", "Matthew Markham is a recently hired analyst at an equity research firm. Markham joins several other new employees for a training session hosted by Alexandra Garcia, a senior analyst, on the firm's approach to utilizing multiple regression in their portfolio and investment analysis.\nTo open the training session, Garcia explains the relationship between the dependent and independent variables in a regression model. She explains the multiple linear regression model and asks the analysts to demonstrate their understanding by confirming the assumptions for the classical model. The analysts provide the following responses about the assumptions:\n• Assumption 1: The regression residuals are normally distributed.\n• Assumption 2: The independent variables are not random.\n• Assumption 3: The regression residuals are correlated across observations.", "You are a junior analyst at an asset management firm. Your supervisor asks you to analyze the return drivers for one of the firm's portfolios using regression models of the portfolio's monthly excess returns (RET). Your three models are as follows (96 observations each):\nModel 1: RETi = b0 + bMRKT MRKTi + bHML HMLi + bVIX VIXi + εi\nModel 2: RETi = b0 + bMRKT MRKTi + bHML HMLi + bVIX VIXi + bSMB SMBi + εi\nModel 3: RETi = b0 + bMRKT MRKTi + bHML HMLi + bVIX VIXi + bSMB SMBi + bMOM MOMi + εi\nExhibits 1–3 (summary of regression statistics)\n\tR-squared\tAdjusted R-squared\tStandard error\tF\nModel 1\t0.823\t0.817\t3.438\t142.628\nModel 2\t0.852\t0.846\t3.161\t131.000\nModel 3\t0.852\t0.844\t3.177\t103.751\nIn Model 3, the MOM coefficient is –0.067 (t = –0.276, p = 0.783).\nYour supervisor asks for your assessment of the model that provides the best fit as well as the model that is best for predicting values of the monthly portfolio return. So, you calculate Akaike's information criterion (AIC) and Schwarz's Bayesian information criterion (BIC) for all three models, as shown in Exhibit 4.\nExhibit 4 – Goodness-of-Fit Measures\n\tAIC\tBIC\nModel 1\t241.03\t251.29\nModel 2\t225.85\t238.67\nModel 3\t227.77\t243.16", "Anna Gabor is an analyst with an investment management firm. She is investigating the impact of leverage on annual ROE in the firm's Eurozone equities fund (\"the fund\"). She collects data on the 72 stocks in the fund, including company size as an independent variable.\nExhibit 1 shows the results from estimating the model Ri = b0 + b1(Sizei) + b2(D/Ei) + εi, where:\n• Ri is the annual ROE for company i in the last calendar year in numbers (0.05 is 5%);\n• Sizei is the natural log of the market capitalization of company i (millions of euro) on 31 December;\n• D/Ei is the debt/equity ratio of company i on 31 December;\n• b0 is the intercept; b1, b2 are the slope coefficients for Sizei and D/Ei; εi is the error term.\nExhibit 1\n\tCoefficient\tStandard Error\nIntercept\t0.2248\t---\nSizei\t–0.012\t---\nD/Ei\t–0.0172\t0.00986\nANOVA\tDegrees of freedom\tSum of squares\nRegression\t2\t0.0960\nResidual\t69\t0.5704\nExhibit 2 – Selected values of Student's t-distribution (69 degrees of freedom)\nArea in right tail\tt-value\n0.05\t1.6670\n0.025\t1.9950\nGabor expects to find that both the debt/equity ratio and size are negatively related to ROE. She considers a relationship meaningful when it is statistically significant at the 0.05 level. As part of her analysis Gabor compares the predictions of her model with the actual ROE for two stocks in the portfolio which have the same debt ratio: A and B, which have market capitalizations EUR 100 million and EUR 200 million respectively.\nGabor shares her results with a colleague, Eva Szabo, who warns that the variance of the error terms might not be constant, but positively correlated with D/E and Size. Szabo states that such a flaw would lead to the F- and t-statistics being biased and failing to reject the null hypothesis when it is false.\nAs an additional goal Gabor investigates the impact of qualitative governance factors. She is considering adding two dummy variables to the model: D1 and D2. D1 is 1 for firms with two or more female board members, and otherwise 0. The value of D2 is 1 if the audit committee of the board includes only independent directors, and otherwise 0.\nFinally, Gabor wishes to test the hypothesis that whether or not a stock in the fund is listed on a US (as well as European) exchange is determined by the same independent variables as above (including the governance factors). She employs a logistic regression with the dependent variable of A, which takes on a value of 1 for a company listed on a US exchange and otherwise 0. For Tekdat, a company in the fund which does not have gender diversity on its board, the probability, based on the model, of being listed on a US exchange is 0.65. The regression coefficient of D1 in the logistic model is 0.80 and is statistically significant.", "Alwyn Rivera is a portfolio manager at Elite Investments (EI) based in the US. Rivera has a shortlist of 50 US public firms and wants to better understand the factors that may explain the cross-sectional variation in these stocks' returns. He believes firm size and book-to-market ratio are important factors, and that being included in the Dow Jones Industrial Average Index (DJIA) may also affect a stock's return.\nRivera collects the annual returns (r) of these 50 stocks in the year that just ended, as well as their market capitalizations (Size, in billions of dollars) and book-to-market ratios (BMRatio) at the end of the previous year. He also creates a dummy variable (Dow) that is coded 1 if a stock is included in the DJIA and 0 otherwise, and then runs the following regression:\nri = b0 + b1 lnSizei + b2 BMRatioi + b3 Dowi + εi\nwhere lnSizei is the natural log of the market capitalization of company i in billions of dollars.\nExhibit 1\n\tCoefficient\tt-statistic\tp-value\nIntercept\t–0.6483\t–3.8773\t0.0003\nSize\t0.1777\t5.1125\t<0.0001\nBMRatio\t0.0433\t2.9346\t0.0052\nDow\t–0.1641\t–1.8362\t0.0728\nR²\t0.3700\tAdjusted R²\t0.3289\nStandard error\t0.2827\tObservations\t50", "A chief investment officer asks you to test a factor model for multicollinearity among its four explanatory variables. You calculate the variance inflation factor (VIF) for each of the four factors; the results are shown in Exhibit 3.\nExhibit 3 – Multicollinearity Test Results\nVariable\tR²\tVIF\nX1\t0.748\t3.968\nX2\t0.451\t1.820\nX3\t0.942\t17.257\nX4\t0.926\t13.434", "Angela Martinez, an energy sector analyst at an investment bank, examines West Texas Intermediate (WTI) monthly crude oil price data, expressed in US dollars per barrel, for the 181-month period from August 2000 through August 2015. The end-of-month WTI oil price was $51.16 in July 2015 and $42.86 in August 2015 (Month 181).\nAfter reviewing the time-series data, Martinez determines that the mean and variance of the time series of oil prices are not constant over time. She then runs the following four regressions:\n• Linear trend model: Oil price t = b0 + b1t + et\n• Log-linear trend model: ln Oil price t = b0 + b1t + et\n• AR(1) model: Oil price t = b0 + b1 Oil price t−1 + et\n• AR(2) model: Oil price t = b0 + b1 Oil price t−1 + b2 Oil price t−2 + et\nExhibit 1 – Crude Oil Price per Barrel, August 2000–August 2015 (t-statistics in parentheses)\n\tLinear\tLog-Linear\tAR(1)\tAR(2)\nR²\t0.5703\t0.6255\t0.9583\t0.9656\nStandard error\t18.6327\t0.3034\t5.7977\t5.2799\nObservations\t181\t181\t180\t179\nDurbin–Watson\t0.10\t0.08\t1.16\t2.08\nRMSE\t\t\t2.0787\t2.0530\nIntercept\t28.3278 (10.1846)\t3.3929 (74.9091)\t1.5948 (1.4610)\t2.0017 (1.9957)\nt (Trend)\t0.4086 (15.4148)\t0.0075 (17.2898)\t\t\nOil price t−1\t\t\t0.9767 (63.9535)\t1.3946 (20.2999)\nOil price t−2\t\t\t\t−0.4249 (−6.2064)\nAt the 5% significance level, the lower critical value for the Durbin–Watson test statistic is 1.75 for both the linear and log-linear regressions.\nExhibit 2 – Autocorrelations of the Residual from AR(1) Model\nLag\tAutocorrelation\tt-Statistic\n1\t0.4157\t5.5768\n2\t0.2388\t3.2045\n3\t0.0336\t0.4512\n4\t−0.0426\t−0.5712\nNote: At the 5% significance level, the critical value for a t-statistic is 1.97.", "Max Busse is an analyst in the research department of a large hedge fund. He gathers monthly exchange rate data from the most recent 10-year period and runs a regression based on the following AR(1) model specification:\nRegression 1: xt = b0 + b1xt−1 + εt, where xt is the exchange rate at time t.\nBased on his analysis, Busse concludes that the variance of xt increases over time, the mean-reverting level is undefined, and b0 does not appear to be significantly different from 0.\nBusse then first-differences the data and runs a new regression:\nRegression 2: yt = b0 + b1yt−1 + εt, where yt = xt − xt−1.\nExhibit 1 – First-Differenced Exchange Rate AR(1) Model: Month-End Observations, Last 10 Years\nR²\t0.0017\tObservations\t118\nStandard error\t7.3336\tDurbin–Watson\t1.9937\n\tCoefficient\tStandard Error\tt-Statistic\nIntercept\t−0.8803\t0.6792\t−1.2960\nxt−1 − xt−2\t0.0412\t0.0915\t0.4504\nResidual autocorrelation lag\tAutocorrelation\tStandard Error\tt-Statistic\n1\t0.0028\t0.0921\t0.0300\n2\t0.0205\t0.0921\t0.2223\n3\t0.0707\t0.0921\t0.7684\n4\t0.0485\t0.0921\t0.5271\nNote: The critical t-statistic at the 5% significance level is 1.98.", "Peer Olsen, a junior analyst at New Markets Inc., is studying the Gross Domestic Product (GDP) of Namibia using quarterly data from the last 3 years.\nHis first attempt was a linear trend model, yt = b0 + b1t, where yt is the size of GDP in Namibia at time t. In plotting the results, he observed that the level of GDP is constantly growing over time and that the trend alternates between periods when it is persistently above or persistently below GDP.\nOlsen then decided a log-linear trend regression model would be more appropriate for predicting the quarterly GDP level for Namibia in USD. Exhibit 1 shows regression statistics from estimating this equation.\nExhibit 1\nR²\t.967\tStandard error\t.129\nObservations\t12\tDurbin–Watson\t.274\n\tCoefficient\tStandard Error\tt-Statistic\nIntercept\t8.9673\t.3754\t206.80\nT (Trend)\t0.0851\t.0019\t35.875", "Thomas Knight, an analyst with Wanjarri Investment Management, is tasked with forecasting future results for Rudall Hardware, a publicly traded retail business specializing in home improvements.\nJohnson, his supervisor, asks Knight to forecast Rudall Hardware's net margin (net income/sales) for the next four quarters. Knight explains that he will use a first-order autoregressive model since each quarter's net margin appears related to the prior quarter's net margin. Knight also mentions that he will use an intercept of 0.0415 and a coefficient on the first lag of the net margin of 0.8295.", "Xyrees Taylor is an equity analyst evaluating the stock of Maclaurin Corporation.\nTaylor builds Model B, an autoregressive AR(1) model, for the exchange rate between Maclaurin's domestic currency and that of its primary export market. The regression estimates for the intercept and the coefficient of the first lag are 0.3000 and 0.9093, respectively.\nTaylor builds another AR(1) model (Model C) for the exchange rate between Maclaurin's domestic currency and that of its secondary export market. Taylor suspects that the time series used for Model C may have a unit root and he runs a Dickey–Fuller test.", "John Hall is examining the time series behavior of copper and gold prices over the last year.\nHall uses Model B, a first-order autoregressive model, AR(1), for the gold price series. He determines that the coefficient of the first lag of the original weekly gold price series is significantly different from zero. He also calculates the autocorrelations of the residuals up to four lags and determines that only the residual autocorrelation at the third lag is significantly different from zero.\nHall then conducts a Dickey–Fuller test for the gold price series using the regression equation Pt − Pt–1 = b0 + g1Pt–1 + εt, where Pt denotes the gold price at time t. The results are shown in Exhibit 2.\nExhibit 2\n\tCoefficient\tStandard Error\tt-Statistic\tp-Value\nIntercept\t9.3724\t48.2508\t0.1942\t0.8467\nPt–1\t0.0003\t0.0332\t0.0093\t0.9926", "Eduardo DeMolay, a research analyst at Mumbai Securities, is studying the time-series behavior of price-to-earnings ratios (P/Es) computed with trailing 12-month earnings. He and his assistant, Deepa Kamini, are reviewing the results of the ordinary least squares time series regression shown in Exhibit 1.\nExhibit 1 – Results of Regression of P/E on Lagged P/E (P/Et = b0 + b1P/Et–1 + εt)\n\tCoefficient\tStandard Error\tt\tSignificance of t\nConstant (b0)\t0.143\t0.153\t0.935\t0.176\nLagged P/E (b1)\t0.991\t0.003\t292.958\t0\nDeMolay states: \"This regression is a special case of a first-order autoregressive [AR(1)] model in which the value for b0 is close to zero and the value of b1 is close to 1. These values suggest that the time series is a random walk.\"\nKamini replies: \"I'm convinced the P/E series based on trailing earnings truly is a random walk.\"\nKamini and DeMolay next examine P/Es calculated using forward 12-month earnings. Kamini estimates another AR(1) model using the forward P/E values and denotes the errors from this second regression as ηt. She states: \"The presence of first-order autoregressive conditional heteroskedasticity [ARCH(1)] errors in this regression is highly likely given the results reported in Exhibit 2.\"\nExhibit 2 – Results of Regression of Squared Residuals on Lagged Squared Residuals (η²t = c0 + c1η²t−1 + ut)\n\tCoefficient\tStandard Error\tt\tSignificance of t\nConstant (c0)\t0.339\t0.039\t8.768\t0\nLag 1 (c1)\t0.273\t0.024\t11.405\t0\nDeMolay proposes a variation of the Fed model, in which the earnings-to-price ratio (E/P) is regressed on long-term interest rates. He cautions Kamini: \"Remember that when we analyze two time series in regression analysis, we need to ensure that:\n1. neither the dependent variable series nor the independent variable series has a unit root, or\n2. that both series have a unit root and are not cointegrated.\nUnless Condition 1 or Condition 2 holds, we cannot rely on the validity of the estimated regression coefficients.\"", "Alef Associates manages a long-only fund specializing in global small-cap equities. Alef maintains a portfolio of 100 stocks (out of an eligible universe of about 10,000 stocks). Its Chief Investment Officer, Paul Moresanu, feels that data science should play a role in the way Alef selects its investments. He has also noticed that much of Alef's past outperformance is due to stocks that became takeover targets. He proposes the following four steps, repeated every quarter:\nStep 1: We apply ML techniques to a model including fundamental and technical variables (features) to predict next quarter's return for each of the 100 stocks currently in our portfolio. Then, the 20 stocks with the lowest estimated return are identified for replacement.\nStep 2: We utilize ML techniques to divide our investable universe of about 10,000 stocks into 20 different groups, based on a wide variety of the most relevant financial and non-financial characteristics. The idea is to prevent unintended portfolio concentration by selecting stocks from each of these distinct groups.\nStep 3: For each of the 20 different groups, we use labeled data to train a model that will predict the five stocks (in any given group) that are most likely to become acquisition targets in the next one year.\nStep 4: Our five experienced securities analysts are each assigned four of the groups, and then each analyst selects their one best stock pick from each of their assigned groups. These 20 \"high-conviction\" stocks will be added to our portfolio.", "Carlos Martin has been hired by Jubilación S.L., a Madrid-based firm that specializes in retirement planning. He has been asked to develop a machine learning (ML) tool to help assign each client to one of the firm's five strategic investment portfolios.\nTo build the training set with 50 defined features, 300 randomly selected working-age clients will be asked a set of open-ended questions. A Jubilación analyst will assign each individual in the sample to one of the five portfolios.\nMany of the responses obtained are complex and subjective. For example, most individuals interviewed are not clear about the concept of risk tolerance and provide comparisons or abstract concepts rather than specific numbers or levels. In some cases, their fear of loss seems to increase at an increasing rate when some scenarios are presented. Martin decides he will have to review these risk tolerance responses and use a model that groups them into risk categories.", "Roger Stigwood is a partner at a private equity advisory firm. He is meeting with a data analysis consultant, Cindy Emerson. Stigwood states that his firm has structured data from private equity transactions that had been conducted over the past year. He desires to merge that data with related publicly traded firm data to find factors that can be used to predict future firm valuations.\nStigwood suggests a support vector machine algorithm because the target variable is continuous and the algorithm does not require a user defined hyperparameter. Instead, Emerson suggests using an algorithm with a least absolute shrinkage and selection operator.\nStigwood then expresses concerns about the model overfitting problem. Emerson responds that managing overfitting is a tradeoff between cost and complexity. She suggests using k-fold cross-validation to mitigate overfitting.", "Avery White is a financial analyst at SafeGrowth Investments (SGI). The first task is to develop machine-learning based models to predict bankruptcy by grouping firms into two categories: \"bankrupt\" or \"not bankrupt\". White collects 25 fundamental and technical features of 800 firms that experienced financial distress, of which 100 filed bankruptcy in the last ten years. She splits the 800 observations into training, validation, and test datasets.\nAfter training her first model, White discovers that the model can identify \"bankrupt\" and \"not bankrupt\" firms with low error in the training dataset, but does not perform well on the validation and test datasets.\nWhite then considers other machine learning algorithms and wants to choose one that meets the following requirements:\n• Requirement 1: There is no need to specify an initial hyperparameter. However, regularization parameters can be added to avoid a potential overfitting problem;\n• Requirement 2: The algorithm can provide a visual explanation and rationale for the prediction.", "Amandeep Jain is a credit analyst at the Entrepreneurship Business Development Corporation (EBDC). Jain and Peiran Zhang, a recently hired data scientist, have been asked to develop a machine learning model to improve EBDC's predictive ability of identifying potential defaults. The current model is a k-nearest neighbor (k-NN) model.\nJain tells Zhang that the \"goal\" has been and continues to be predicting what is stored in the system in a field called Default_Status, which records whether a loan is either <In Default> or <Not In Default>.\nZhang develops an initial prototype and shares the results based on a subset of the portfolio that was segmented for the purpose of training the model. Exhibit 1 compares predicted and actual defaults from the model.\nExhibit 1 (ECO image description): A boundary line runs diagonally from (7, 0) to (19, 19), roughly horizontally to (23, 19) and then diagonally to (23, 25), twisting to separate the points. Almost all Not in default points lie on one side and almost all In default points lie on the other side; only one point of each class is on the \"wrong\" side.", "Aaliyah Schultz is a fixed-income portfolio manager at Aries Investments. She supervises Ameris Steele, a junior analyst, who begins building a model that combines structured financial data and sentiment data. Exhibit 1 presents a small sample of the raw dataset before cleansing.\nExhibit 1 – Sample of Raw Structured Data Before Cleansing\nID\tTicker\tIPO Date\tIndustry (NAICS)\tEBIT\tInterest Expense\tTotal Debt\n1\tABC\t4/6/17\t44\t9.4\t0.6\t10.1\n2\tBCD\tNovember 15, 2004\t52\t5.5\t0.4\t6.2\n3\tHIJ\t26-Jun-74\t54\t8.9\t1.2\t15.8\n4\tKLM\t14-Mar-15\t72\t5.7\t1.5\t0.0\nAfter cleansing the data, Steele preprocesses the dataset. She creates two new variables: an \"Age\" variable based on the firm's IPO date and an \"Interest Coverage Ratio\" variable equal to EBIT divided by interest expense. She also deletes the \"IPO Date\" variable from the dataset. After applying these transformations, Steele scales the financial data using normalization. She notes that over the full sample dataset, the \"Interest Expense\" variable ranges from a minimum of 0.2 and a maximum of 12.2, with a mean of 1.1 and a standard deviation of 0.4.\nAfter properly cleansing and preprocessing the raw text data, Steele performs exploratory data analysis. To assist in feature selection, she wants to create a visualization that shows the most informative words in the dataset based on their term frequency (TF) values.", "Bernadette Rivera is a portfolio manager at Voxkor, a private equity company. She is working with a data analyst, Tim Achler, on a text-based machine-learning (ML) model that classifies text information into positive or negative sentiment classes.\nAchler uses a web spidering program to obtain the data. After curating the text, Achler removes unnecessary elements from the raw text and completes additional text cleansing and preprocessing tasks. Next, Achler divides unique tokens into three groups; a sample of each group is shown in Exhibit 1.\nExhibit 1 – Summary of Sample Tokens\nToken Group 1\tToken Group 2\tToken Group 3\n\"not_increas_market\"\t\"not_increased_market\"\t\"not,\" \"increased,\" \"market\"\n\"currencysign\"\t\"currencysign\"\t\"EUR\"\n\"sale_decreas\"\t\"sale_decreased\"\t\"Sales,\" \"decreased\"\nAs part of the text exploration step, Achler conducts a term frequency analysis to identify outliers (Exhibit 2).\nExhibit 2 – Words with Highest and Lowest Frequency Value\nGroup 1 word\tFrequency\tGroup 2 word\tFrequency\nthe\t0.04935\tnaval\t1.0123e-05\nand\t0.04661\tstereotype\t1.5185e-05\nto\t0.04179\ttill\t1.5185e-05\nthat\t0.03577\tribbon\t2.0247e-05\nin\t0.03368\tdeposit\t2.5308e-05\nAchler splits the DTM into training, cross-validation, and test datasets and trains a logistic regression model. Applying ROC and AUC metrics, Achler evaluates model performance on both the training and the cross-validation datasets (Exhibit 3).\nExhibit 3 – AUC for Different Threshold p-values\nThreshold p-Value\tTraining Set\tCross-Validation Set\np = 0.57\t56.7%\t57.3%\np = 0.79\t91.3%\t89.7%\np = 0.84\t98.4%\t87.1%", "Iesha Azarov is a senior analyst at Ganymede Moon Partners, where he works with junior analyst Pàola Bector. Bector develops ML models for two unstructured stock sentiment datasets, Dataset ABC and Dataset XYZ. Both datasets have been cleaned and preprocessed in preparation for text exploration and model training.\nFollowing an exploratory data analysis that revealed Dataset ABC's most frequent tokens, Bector conducts a collection frequency analysis. Bector then computes TF–IDF for several words in the collection and tells Azarov the following:\nStatement 1: IDF is equal to the inverse of the document frequency measure.\nStatement 2: TF at the collection level is multiplied by IDF to calculate TF–IDF.\nStatement 3: TF–IDF values vary by the number of documents in the dataset, and therefore, model performance can vary when applied to a dataset with just a few documents.\nBector notes that Dataset ABC is characterized by the absence of ground truth.\nFor Dataset XYZ, each sentence has been labeled as either positive sentiment (Class \"1\") or negative sentiment (Class \"0\"). Azarov requests that Bector apply the ML model to the test dataset for Dataset XYZ, assuming a threshold p-value of 0.65. Exhibit 2 contains a sample of results from the test dataset corpus.\nExhibit 2 – 10 Sample Results of Test Data for Dataset XYZ\nSentence #\tActual Sentiment\tTarget p-Value\n1\t1\t0.75\n2\t0\t0.45\n3\t1\t0.64\n4\t1\t0.81\n5\t0\t0.43\n6\t1\t0.78\n7\t0\t0.59\n8\t1\t0.60\n9\t0\t0.67\n10\t0\t0.54\nBector makes the following remarks regarding model training:\nRemark 1: Method selection is governed by such factors as the type of data and the size of data.\nRemark 2: In the performance evaluation stage, model fitting errors, such as bias error and variance error, are used to measure goodness of fit.", "James Quinn is the founder and CEO of GoogolMining Inc. (GMI), which applies data science and machine learning to assist lenders in predicting the credit risk of their customers. Quinn is meeting with Judy Wu, the chief lending officer at onLineLoans.com.\nWu tells Quinn that she recalls that text preparation must be carried out by removing such items as HTML tags, punctuation, numbers, and stop words and eliminating the distinction between uppercase and lowercase words by lowercasing them all.\nQuinn uses logistic regression to train the model: Defaulting loans are classified as Class 1, and non-defaulting loans are classified as Class 0. After tuning, the threshold p-value of 0.60 (for Class 1) is used to predict the outcome for each loan application in the test data. Exhibit 2 indicates the result for one of those applications.\nExhibit 2 – Result for a Selected Credit Applicant in Test Data\nActual Outcome\tp\nDefaulted (Class 1)\t0.41\nAfter running his model on the test set, Quinn produces a confusion matrix (Exhibit 3). He reminds Wu that since the number of defaults in the dataset is likely much smaller than the number of non-defaults, this needs to be considered in evaluating model performance.\nExhibit 3 – Confusion Matrix (Threshold p-Value = 0.60)\n\tActual Class 1\tActual Class 0\nPredicted Class 1\tTP = 118\tFP = 32\nPredicted Class 0\tFN = 8\tTN = 320"], "modules": {"1": "Basics of Multiple Regression and Underlying Assumptions", "2": "Evaluating Regression Model Fit and Interpreting Model Results", "3": "Model Misspecification", "4": "Extensions of Multiple Regression", "5": "Time-Series Analysis", "6": "Machine Learning", "7": "Big Data Projects"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "Quant", KEY = "Quant_quiz_state_v1", EXPKEY = "Quant_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function flush(){ if(!tbl.length) return; html+='<div class="tbl"><table>'+tbl.map(function(r){return "<tr>"+r.split("\t").map(function(c){return "<td>"+esc(c.trim())+"</td>";}).join("")+"</tr>";}).join("")+"</table></div>"; tbl=[]; }
  lines.forEach(function(l){
    if(l.indexOf("\t")>=0){ tbl.push(l); }
    else { flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>"; }
  });
  flush(); return html;
}
var RD = {1:1,2:1,3:1,4:1,5:2,6:3,7:4};
function mname(m){ return "Reading "+RD[m]+" · M"+m+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 모듈 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">Quantitative Methods 전체 Reading 오답 퀴즈 (R1–R4)</h2>'+
   '<p class="muted">ECO에서 틀린 66문제 전부 + 오답노트 기반 변형 25문제 (총 91문제). 정답은 ECO 원본 기준, 해설과 변형 문제는 Schweser 기준으로 작성했습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<label>출처 <select id="selSrc"><option value="all">전체</option><option value="wrong">ECO 오답만 (66)</option><option value="nowrong">오답 외 문제만</option></select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">새로 시작</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  $("bStart").onclick=function(){
    var m=$("selMod").value, s=$("selSrc").value;
    var order=Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (s==="all"||(s==="wrong"?q.src==="ECO 오답":q.src!=="ECO 오답")); }).map(function(q){return q.id;});
    if(!order.length) return;
    S=fresh(order,"all"); save(); render();
  };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    '<button class="btn primary" id="bNext" '+(r?'':'disabled')+'>'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button></div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=next;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz"};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저에 진행 기록이 없으면 자동으로 이어 풀고, 있으면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if(!S || !S.order || !Object.keys(S.round||{}).length){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
