<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quant Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <div class="brand">
    <h1>Quantitative Methods 오답 퀴즈<span>CFA Level II, Schweser 기준</span></h1>
    <div class="stats"><span class="s-ok">정답 <b id="nOk">0</b></span><span class="s-bad">오답 <b id="nBad">0</b></span></div>
  </div>
  <div class="progress"><i id="pbar"></i></div>
  <div class="ptext"><span id="ptxt">0 / 0</span><span id="pmode"></span></div>
</div></header>
<main class="wrap">
  <div class="tools">
    <button class="btn" id="bHome">처음 화면</button>
    <button class="btn" id="bResult">결과 보기</button>
    <button class="btn" id="bExport">결과 내보내기</button>
    <button class="btn" id="bImport">결과 불러오기</button>
    <input type="file" id="fImport" accept=".json,application/json" hidden>
  </div>
  <div id="view"></div>
</main>
<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q3", "src": "ECO 오답", "module": 1, "tag": "회귀 가정 – 선형성 (산점도 곡선)", "vig": 0, "stem": "Identify the regression assumption that may be violated based on Chart 1, RET vs. VIX.", "opts": {"A": "Independence of errors", "B": "Independence of independent variables", "C": "Linearity between dependent variable and explanatory variables"}, "ans": "C", "en": "Chart 1 is a scatterplot of RET versus VIX. Linearity between the dependent variable and the independent variables is an assumption underlying multiple linear regression. The relationship appears to be more curved (i.e., quadratic) than linear.", "ko": "Y와 X 하나를 그린 산점도(Chart 1)가 곡선 모양이면 'Y–X 선형성' 가정 위반입니다. 독립변수끼리의 관계(다중공선성)는 X–X 산점도(Chart 3), 오차의 독립성은 잔차를 시간/순서에 따라 그린 그림으로 봅니다.", "trap": "어떤 축끼리 그린 그림인지 먼저 확인: Y vs X → 선형성, X vs X → 독립변수 간 독립성, 잔차 vs 예측값 → 등분산.", "f": "Y vs X 곡선 → linearity 위반", "why": {"A": "오차의 독립성(serial correlation)은 잔차를 순서/시간에 따라 그린 그림에서 확인합니다. Chart 1은 Y와 X의 산점도입니다.", "B": "독립변수 간 독립성은 X끼리 그린 산점도(Chart 3: MRKT vs HML)로 봅니다. Chart 1은 RET(Y) vs VIX(X)입니다."}, "orig": "ECO Module 1 Q3"}, {"id": "ECO-M1-Q7", "src": "ECO 오답", "module": 1, "tag": "고전적 정규 다중회귀 가정", "vig": 1, "stem": "Regarding the classical normal multiple linear regression model, which of the following assumptions provided by the analysts is incorrect?", "opts": {"A": "Assumption 1", "B": "Assumption 2", "C": "Assumption 3"}, "ans": "C", "en": "For the classical normal multiple linear regression model the required assumption is that the error term is uncorrelated across observations. Normally distributed residuals (Assumption 1) and non-random (fixed, known) independent variables (Assumption 2) are correct assumptions.", "ko": "고전적 다중회귀 가정: ① Y–X 선형, ② X는 확률변수가 아님(고정·알려진 값) & X 사이 정확한 선형관계 없음, ③ E(ε|X)=0, ④ 오차 분산 일정(등분산), ⑤ 오차가 관측치끼리 상관 없음, ⑥ 오차 정규분포. Assumption 3은 '상관 있다'고 해서 틀렸습니다.", "trap": "'not random'(X 고정)은 맞는 가정이라 헷갈리기 쉬움. 틀린 건 '잔차가 서로 상관됨'.", "f": "Errors: E(ε)=0, 등분산, 무상관, 정규분포", "why": {"A": "잔차의 정규분포는 classical normal 모형의 실제 가정입니다(가설검정을 위해 필요).", "B": "독립변수가 random이 아니라는 것(고정·알려진 값)도 고전적 모형의 실제 가정입니다."}, "orig": "ECO Module 1 Q7"}, {"id": "ECO-M1-Q11", "src": "ECO 오답", "module": 1, "tag": "회귀식 해석 – 오차항은 확률적 부분", "vig": null, "stem": "Which of the following statements is most accurate with respect to interpreting a multiple regression with the equation\nYi = b0 + b1X1i + b2X2i + b3X3i + εi?", "opts": {"A": "εi represents the stochastic part of the model", "B": "If the change in each of the variables X1, X2, and X3 is zero, the change in Y is b0", "C": "b3 represents the percentage variation in Y that can be explained by the variable X3"}, "ans": "A", "en": "The error term, εi, is the stochastic or random part of the model. If the change in each X is zero, the change in Y is zero (not b0). b3 measures the change in Y (not the variation in Y) for a one-unit change in X3, holding X1 and X2 constant.", "ko": "b0 + b1X1 + b2X2 + b3X3 는 결정론적(deterministic) 부분, εi는 확률적(stochastic) 부분입니다. b0는 X가 모두 0일 때 Y의 '수준'이지 '변화량'이 아닙니다. 기울기 계수는 다른 X를 고정했을 때 X 1단위 변화에 따른 Y의 변화량입니다.", "trap": "'X 변화가 0이면 Y 변화는 b0' – 수준(level)과 변화(change)를 섞은 함정.", "f": "Y = [b0 + Σ biXi](deterministic) + ε(stochastic)", "why": {"B": "X들의 변화가 모두 0이면 Y의 변화도 0입니다. b0는 X가 모두 0일 때 Y의 값(수준)입니다.", "C": "b3는 X3가 1단위 변할 때 Y의 변화량(다른 X 고정)입니다. 설명되는 변동 비율은 R²의 개념입니다."}, "orig": "ECO Module 1 Q11"}, {"id": "ECO-M2-Q2", "src": "ECO 오답", "module": 2, "tag": "AIC vs BIC – 적합도(fit)는 BIC", "vig": 2, "stem": "Identify the model that provides the best fit.", "opts": {"A": "Model 1", "B": "Model 2", "C": "Model 3"}, "ans": "B", "en": "BIC is the preferred measure for determining which model provides the best fit, and a lower BIC is better. Since Model 2 has the lowest BIC value (238.67), it provides the best fit among the three models.", "ko": "AIC는 예측(forecast) 목적, BIC는 적합도(goodness of fit) 목적의 기준이며 둘 다 낮을수록 좋습니다. BIC는 ln(n)×k 벌점이라 AIC보다 과적합에 더 큰 벌점을 줍니다. Model 2의 BIC(238.67)가 가장 낮습니다.", "trap": "R²가 같거나 높은 모델(Model 3)에 끌리기 쉬움. '적합도' = BIC 최저.", "f": "Fit → lowest BIC, Forecast → lowest AIC", "why": {"A": "Model 1은 AIC·BIC 모두 가장 높아(241.03, 251.29) 가장 나쁜 모델입니다.", "C": "Model 3은 R²는 Model 2와 같지만 무의미한 MOM 변수를 더해 BIC(243.16)가 Model 2보다 높습니다."}, "orig": "ECO Module 2 Q2"}, {"id": "ECO-M2-Q6", "src": "ECO 오답", "module": 2, "tag": "단측검정 귀무가설 설정 (b2 ≥ 0)", "vig": 3, "stem": "Based on Exhibits 1, 2 and Gabor's expectations, which is the best null hypothesis and conclusion regarding D/E?", "opts": {"A": "b2 ≥ 0; reject the null hypothesis.", "B": "b2 = 0; cannot reject the null hypothesis.", "C": "b2 ≥ 0; cannot reject the null hypothesis."}, "ans": "A", "en": "Gabor expects D/E to be negatively related to ROE, so the alternative is b2 < 0 and the null is b2 ≥ 0 (one-tailed test). t = –0.0172/0.00986 ≈ –1.74. The one-tailed critical value with 69 df at 0.05 is 1.667, so reject H0 if t < –1.667. Since –1.74 < –1.667, reject the null.", "ko": "보여주고 싶은 주장(음(-)의 관계)을 Ha에 두고 H0는 그 반대(b2 ≥ 0)로 → 단측검정. 단측 5% 임계값 1.667을 써야 하며 t ≈ –1.74이므로 기각합니다.", "trap": "양측 임계값(1.995)을 쓰면 '기각 못함'으로 잘못 결론냅니다. 방향이 있는 기대 → 단측.", "f": "t = (b̂ − b_H0) / SE(b̂);  H0: b2 ≥ 0, Ha: b2 < 0", "why": {"B": "b2 = 0은 양측검정 귀무가설입니다. Gabor는 '음(-)의 관계'라는 방향을 기대하므로 단측(b2 ≥ 0)이 맞고, 양측 임계값 1.995와 비교한 결론도 틀립니다.", "C": "귀무가설은 맞지만 결론이 틀렸습니다. t ≈ –1.74 < –1.667(단측 임계값)이므로 기각합니다. 1.995(양측 값)와 비교하면 이 오답이 나옵니다."}, "orig": "ECO Module 2 Q6"}, {"id": "ECO-M2-Q7", "src": "ECO 오답", "module": 2, "tag": "로그 변수 계수 해석 (ln 2 × b1)", "vig": 3, "stem": "Based on Gabor's regression, the amount that ROE for Company A exceeds that of Company B (in percentage points) is closest to:", "opts": {"A": "0.83.", "B": "1.20.", "C": "6.36."}, "ans": "A", "en": "D/E is the same for both companies, so only Size differs. SizeA = ln(100), SizeB = ln(200) = ln(2) + ln(100). ROE_A − ROE_B = –0.012 × [ln(100) − ln(200)] = 0.012 × ln(2) = 0.008318 ≈ 0.83 percentage points.", "ko": "Size는 시가총액의 자연로그입니다. 두 회사 차이는 ln(200) − ln(100) = ln 2 이므로 ROE 차이 = 0.012 × ln 2 = 0.0083 = 0.83%p. 계수가 음수라 작은 회사 A의 ROE가 더 높습니다.", "trap": "독립변수가 ln(X)이면 차이는 '금액 차이'가 아니라 'ln 비율'로 계산.", "f": "ΔY = b1 × [ln(X_B) − ln(X_A)] = b1 × ln(X_B/X_A)", "why": {"B": "시가총액 차이(100)에 계수를 곱하거나(100 × 0.012), D/E 계수(0.0172 × ln2 = 1.19)를 잘못 쓴 결과입니다.", "C": "ln(200) × 0.012 = 6.36%로, 차이가 아니라 B의 Size 항 전체를 계산했습니다."}, "orig": "ECO Module 2 Q7"}, {"id": "ECO-M2-Q16", "src": "ECO 오답", "module": 2, "tag": "더미변수 포함 예측값 (Dow = 1)", "vig": 4, "stem": "The predicted annual return for a stock that is included in the DJIA, has a market capitalization of $52 billion and a book-to-market ratio of 0.45 is closest to:", "opts": {"A": "−9.08%.", "B": "3.59%.", "C": "7.33%."}, "ans": "A", "en": "r = −0.6483 + 0.1777 × ln(52) + 0.0433 × 0.45 − 0.1641 × 1 = −0.6483 + 0.7021 + 0.0195 − 0.1641 ≈ −0.0908 = −9.08%.", "ko": "Size는 '10억 달러 단위' 시가총액의 자연로그이므로 ln(52)를 넣고, DJIA 편입 → Dow = 1 이므로 −0.1641을 반영합니다.", "trap": "더미 = 1 반영 누락(7.33%), 단위(billions) 무시(3.59%)가 대표 함정.", "f": "ŷ = b0 + b1 ln(Size) + b2 BM + b3 Dow", "why": {"B": "ln(52,000,000,000)처럼 달러 금액 그대로 넣은 결과입니다. Size는 billions 단위입니다.", "C": "Dow = 0(DJIA 미편입)으로 계산한 값입니다. 이 종목은 DJIA에 포함되므로 −0.1641을 더해야 합니다."}, "orig": "ECO Module 2 Q16"}, {"id": "ECO-M2-Q25", "src": "ECO 오답", "module": 2, "tag": "예측값 – 유의하지 않은 계수도 포함", "vig": null, "stem": "Based on a sample of 300 firms, an analyst wants to predict ROA using cash/total assets (CASH), capex/total assets (CAPEX), sales/total assets (TURNOVER), and debt/total assets (D/A). The analyst uses a 5% level of significance, and the regression model produces the following output:\n\tCoefficient\tp-Value\nIntercept\t0.092\t< 0.01\nCASH\t–0.007\t0.88\nCAPEX\t0.072\t0.29\nTURNOVER\t0.024\t< 0.01\nD/A\t–0.070\t0.01\nThe predicted ROA for a company with assumed values of CASH = 0.100, CAPEX = 0.042, TURNOVER = 1.000, and D/A = 0.260 is closest to:", "opts": {"A": "0.81%.", "B": "9.78%.", "C": "10.01%."}, "ans": "C", "en": "ROA = 0.092 – 0.007(0.100) + 0.072(0.042) + 0.024(1.000) – 0.070(0.260) = 0.1001 = 10.01%. All regression coefficients must be included because each estimate reflects the correlation structure of all the independent variables; excluding the insignificant ones is incorrect.", "ko": "예측값을 구할 때는 절편과 모든 계수를 넣습니다. 유의하지 않은 변수(CASH, CAPEX)를 빼면 안 됩니다 – 각 계수는 다른 변수들과의 상관 구조를 반영해 추정된 값이기 때문입니다.", "trap": "'유의하지 않으니 빼자'(9.78%), '절편 빼먹기'(0.81%).", "f": "Ŷ = b0 + Σ b̂i Xi (모든 항 포함)", "why": {"A": "절편(0.092)을 빼고 계산한 값입니다.", "B": "유의하지 않은 CASH, CAPEX를 제외한 값입니다. 예측에는 모든 계수를 사용합니다."}, "orig": "ECO Module 2 Q25"}, {"id": "VAR-M2-01", "src": "변형", "module": 2, "tag": "AIC vs BIC – 예측(forecast)은 AIC", "vig": null, "stem": "An analyst compares three regression models for the same dependent variable:\n\tAIC\tBIC\nModel X\t212.4\t236.0\nModel Y\t215.1\t229.8\nModel Z\t218.0\t231.5\nIf the analyst's goal is to choose the model that provides the best forecasts, the analyst should select:", "opts": {"A": "Model X.", "B": "Model Y.", "C": "Model Z."}, "ans": "A", "en": "AIC is used if the goal is a better forecast, while BIC is used if the goal is a better goodness of fit; lower values are better under either criterion. Model X has the lowest AIC (212.4).", "ko": "목적이 '예측'이면 AIC 최저(Model X), '적합도'면 BIC 최저(Model Y). 둘 다 낮을수록 좋습니다.", "trap": "AIC/BIC 목적을 바꿔 기억하는 함정.", "f": "Forecast → min AIC;  Fit → min BIC", "why": {"B": "Model Y는 BIC가 가장 낮아 '적합도' 기준 최선입니다. 예측 목적에는 AIC를 봅니다.", "C": "Model Z는 AIC·BIC 어느 기준으로도 최선이 아닙니다."}, "orig": "변형 (오답노트 R1 AIC/BIC, Schweser LOS 1.d)"}, {"id": "VAR-M2-02", "src": "변형", "module": 2, "tag": "t-통계량 – 귀무가설 값이 0이 아닐 때", "vig": null, "stem": "A regression slope coefficient is estimated at 1.30 with a standard error of 0.12. To test whether the coefficient differs from 1.0, the t-statistic is closest to:", "opts": {"A": "2.50.", "B": "10.83.", "C": "0.30."}, "ans": "A", "en": "t = (estimated coefficient − hypothesized value)/standard error = (1.30 − 1.00)/0.12 = 2.50.", "ko": "t = (추정치 − 귀무가설 값)/표준오차. 귀무가설 값이 1이면 0이 아니라 1을 뺍니다.", "trap": "습관적으로 b̂/SE(= 10.83)로 계산하는 실수.", "f": "t = (b̂ − b_H0)/SE(b̂)", "why": {"B": "1.30/0.12 = 10.83은 귀무가설 값이 0일 때의 t입니다.", "C": "1.30 − 1.00 = 0.30에서 표준오차로 나누지 않았습니다."}, "orig": "변형 (오답노트 R1 t-value, Schweser LOS 1.e)"}, {"id": "VAR-M2-03", "src": "변형", "module": 2, "tag": "가설 설정 – 보이고 싶은 주장은 Ha", "vig": null, "stem": "An analyst wants to provide statistical support for her claim that the slope coefficient on X is positive. The most appropriate hypotheses are:", "opts": {"A": "H0: b ≤ 0 versus Ha: b > 0.", "B": "H0: b > 0 versus Ha: b ≤ 0.", "C": "H0: b = 0 versus Ha: b ≠ 0."}, "ans": "A", "en": "The claim to be supported goes in the alternative hypothesis; the null is its complement. A one-tailed test with H0: b ≤ 0 and Ha: b > 0 is appropriate. Rejecting H0 supports the claim.", "ko": "통계적으로 뒷받침받고 싶은 주장(b > 0)을 Ha에 두고, H0는 그 여집합(b ≤ 0). H0를 기각하면 주장이 지지됩니다.", "trap": "주장을 H0에 두는 함정, 방향이 있는데 양측검정을 쓰는 함정.", "f": "Claim → Ha;  H0 = complement (with =)", "why": {"B": "주장을 H0에 두었습니다. H0를 '기각'해야 주장이 지지되므로 주장은 Ha에 둡니다.", "C": "방향(양수)이 있는 주장이므로 양측이 아니라 단측검정이 적절합니다."}, "orig": "변형 (오답노트 R1 Ha, Schweser LOS 1.e)"}, {"id": "ECO-M3-Q4", "src": "ECO 오답", "module": 3, "tag": "다중공선성 해결 방법", "vig": 5, "stem": "Identify the correct answer related to the following statement.\nPossible solutions for addressing the multicollinearity issues identified in Exhibit 3 include:\n1. excluding one or more of the regression variables.\n2. using a different proxy for one of the variables.\n3. increasing the sample size.", "opts": {"A": "Only Solution 1 is correct.", "B": "Only Solution 2 is correct.", "C": "Solutions 1, 2, and 3 are each correct."}, "ans": "C", "en": "Possible solutions for addressing multicollinearity include all of the solutions mentioned: excluding one or more of the regression variables, using a different proxy for one of the variables, and increasing the sample size.", "ko": "Schweser: 가장 흔한 방법은 상관된 독립변수 하나 이상을 빼는 것이고, 대안으로 다른 proxy 변수 사용이나 표본 크기 확대도 가능합니다. VIF > 5 추가 검토, VIF > 10 심각(X3, X4).", "trap": "'가장 흔한 방법(변수 제거)'만 맞다고 고르기 쉬움 – 세 가지 모두 정답.", "f": "VIF_j = 1/(1 − R²_j);  >5 주의, >10 심각", "why": {"A": "변수 제거가 가장 흔한 방법일 뿐, 다른 proxy 사용과 표본 확대도 해결책입니다.", "B": "proxy 교체만이 아니라 변수 제거·표본 확대도 해결책입니다."}, "orig": "ECO Module 3 Q4"}, {"id": "ECO-M3-Q8", "src": "ECO 오답", "module": 3, "tag": "양(+)의 serial correlation 영향", "vig": null, "stem": "Positive serial correlation in the residuals of a regression model typically results in:", "opts": {"A": "more Type I errors.", "B": "a deflated F-statistic.", "C": "inconsistent regression coefficients."}, "ans": "A", "en": "Positive serial correlation does not affect the consistency of regression coefficients (when there is no lagged dependent variable), but it does affect statistical tests. The MSE tends to underestimate the error variance, so the F-statistic may be inflated, and standard errors are underestimated so t-statistics are inflated, leading to more Type I errors.", "ko": "양의 serial correlation → 표준오차 과소 → t·F 과대 → 귀무가설을 너무 자주 기각(Type I error). 시차 종속변수가 없다면 계수 자체는 consistent합니다.", "trap": "F가 '작아진다'(X) – 커진다. 계수 불일치는 lagged Y가 있을 때만.", "f": "Positive SC: SE↓ → t, F↑ → Type I↑", "why": {"B": "MSE가 오차분산을 과소추정하므로 F는 '부풀려집니다'(inflated), 작아지지 않습니다.", "C": "시차 종속변수가 독립변수로 없으면 serial correlation이 있어도 계수는 consistent합니다."}, "orig": "ECO Module 3 Q8"}, {"id": "ECO-M3-Q11", "src": "ECO 오답", "module": 3, "tag": "BP 검정 해석 & White 보정", "vig": null, "stem": "A Breusch–Pagan (BP) test is run on the residuals from two regression models to detect heteroskedasticity, with the following results:\n\tBP Test Statistic\tP-Value\nModel 1\t5.458\t0.0195\nModel 2\t0.046\t0.8302\nIf the level of significance is 5%, which of the following is the most appropriate conclusion that can be drawn?", "opts": {"A": "Model 1 has homoskedastic residuals", "B": "White's correction should be applied to Model 1", "C": "The t-statistics for Model 2 cannot be relied upon"}, "ans": "B", "en": "A p-value below 0.05 on a BP test indicates heteroskedasticity, which is the case for Model 1, so White's correction (robust standard errors) should be applied to Model 1. Model 2's p-value (0.8302) > 0.05, so its residuals are homoskedastic and its t-statistics can be relied upon.", "ko": "BP 검정 H0 = 등분산. Model 1은 p = 0.0195 < 0.05 → 이분산 → White-corrected(robust) 표준오차로 t를 다시 계산합니다. Model 2는 p > 0.05 → 등분산 → t 신뢰 가능.", "trap": "Model 2의 '검정통계량' 0.046을 p-value처럼 읽는 함정.", "f": "BP = n × R²(잔차² 회귀) ~ χ²(k);  교정: White-corrected SE", "why": {"A": "Model 1은 p-value 0.0195 < 0.05로 이분산이 있습니다.", "C": "Model 2는 p-value 0.83 > 0.05로 등분산이므로 t값을 믿을 수 있습니다. 0.046은 검정통계량이지 p-value가 아닙니다."}, "orig": "ECO Module 3 Q11"}, {"id": "ECO-M3-Q12", "src": "ECO 오답", "module": 3, "tag": "Breusch–Godfrey F 자유도", "vig": null, "stem": "For an initial regression model with five independent variables and a sample size of 100, a Breusch–Godfrey test is carried out to test for serial correlation in the model's residuals up to lag two. The degrees of freedom of the F-statistic for this test are:", "opts": {"A": "92 and 2.", "B": "93 and 2.", "C": "94 and 2."}, "ans": "A", "en": "For a Breusch–Godfrey test, the test statistic is approximately F-distributed with n – p – k – 1 and p degrees of freedom, where p is the number of lags. Here n – p – k – 1 = 100 – 2 – 5 – 1 = 92, so the degrees of freedom are 92 and 2.", "ko": "BG 검정 F 자유도 = (p, n − p − k − 1). p = 검정하는 시차 수. 100 − 2 − 5 − 1 = 92.", "trap": "−1을 빼먹거나(93) 더하는(94) 실수.", "f": "BG F df = p and n − p − k − 1", "why": {"B": "n − p − k에서 1을 빼지 않았습니다(100 − 2 − 5 = 93).", "C": "1을 빼는 대신 더했습니다(100 − 2 − 5 + 1 = 94)."}, "orig": "ECO Module 3 Q12"}, {"id": "ECO-M3-Q14", "src": "ECO 오답", "module": 3, "tag": "오차항–X 상관 → 누락변수 편의", "vig": null, "stem": "Which of the following is the most appropriate corrective action if the error term in a regression model is correlated with one of the independent variables?", "opts": {"A": "Use the natural logarithm of the independent variable in the revised model", "B": "Include important variables that have been omitted and re-estimate the revised model", "C": "Use the subsample of data most representative of conditions during the model forecasting period"}, "ans": "B", "en": "If the residuals have a clear linear relationship with an independent variable, the misspecification is omitted variable bias. The correction is to include the omitted variable(s) and re-estimate the revised model.", "ko": "오차항이 X와 상관 → 빠진 변수가 오차항에 들어가 있다는 신호(omitted variable bias) → 빠진 변수를 넣고 다시 추정합니다.", "trap": "로그 변환은 '비선형' 문제, 부분표본은 '잘못된 데이터 풀링' 문제의 해결책.", "f": "ε ~ X 상관 → omitted variable → 변수 추가 후 재추정", "why": {"A": "자연로그 변환은 Y와 X의 관계가 비선형일 때(형태 오지정)의 교정 방법입니다.", "C": "대표성 있는 부분표본 사용은 합치면 안 되는 표본을 합친(pooling) 문제의 교정 방법입니다."}, "orig": "ECO Module 3 Q14"}, {"id": "ECO-M3-Q16", "src": "ECO 오답", "module": 3, "tag": "Serial correlation + lagged Y → 계수 불일치", "vig": null, "stem": "An analyst runs the following regressions involving time series Xt and Yt:\nRegression 1: Yt = a0 + a1Xt + a2Xt–1 + εt\nRegression 2: Yt = b0 + b1Xt + b2Yt–1 + εt\nIf the error terms in both regressions are serially correlated, the coefficient estimates are invalid in:", "opts": {"A": "Regression 1 only.", "B": "Regression 2 only.", "C": "both Regression 1 and Regression 2."}, "ans": "B", "en": "If none of the regressors is a lagged value of the dependent variable, the estimated parameters remain consistent despite serial correlation. If one of the independent variables is a lagged value of the dependent variable (Yt–1 in Regression 2), serial correlation causes all parameter estimates to be inconsistent.", "ko": "Serial correlation만 있으면 계수는 OK(표준오차만 문제). 그런데 독립변수에 lagged Y가 있으면 계수까지 inconsistent합니다. Regression 1의 Xt–1은 lagged X이지 lagged Y가 아닙니다.", "trap": "lagged X(Xt–1)와 lagged Y(Yt–1)를 구분.", "f": "SC + lagged Y as regressor → coefficients inconsistent", "why": {"A": "Regression 1에는 lagged Y가 없으므로 계수는 consistent합니다. 문제는 Yt–1이 있는 Regression 2입니다.", "C": "Regression 1은 lagged X만 있어 계수가 유효합니다. Regression 2만 무효입니다."}, "orig": "ECO Module 3 Q16"}, {"id": "VAR-M3-01", "src": "변형", "module": 3, "tag": "Breusch–Godfrey F 자유도 (변형)", "vig": null, "stem": "A regression with three independent variables is estimated using 60 observations. A Breusch–Godfrey test for serial correlation up to four lags is performed. The test statistic is F-distributed with degrees of freedom of:", "opts": {"A": "4 and 52.", "B": "4 and 53.", "C": "3 and 56."}, "ans": "A", "en": "The BG test statistic has an F-distribution with p and n − p − k − 1 degrees of freedom, where p is the number of lags tested: p = 4 and 60 − 4 − 3 − 1 = 52.", "ko": "BG F 자유도 = (p, n − p − k − 1). p = 4, n − p − k − 1 = 60 − 4 − 3 − 1 = 52.", "trap": "−1 누락, k와 p 혼동.", "f": "BG F df = p and n − p − k − 1", "why": {"B": "n − p − k에서 1을 빼지 않았습니다(60 − 4 − 3 = 53).", "C": "분자 자유도는 독립변수 수(k)가 아니라 검정하는 시차 수(p)입니다."}, "orig": "변형 (오답노트 R1 BG F-test df, Schweser LOS 1.i)"}, {"id": "VAR-M3-02", "src": "변형", "module": 3, "tag": "Serial correlation 교정 – Newey–West", "vig": null, "stem": "A regression model that does not include any lagged dependent variable shows significant positive serial correlation in its residuals. The most appropriate action is to:", "opts": {"A": "calculate Newey–West corrected standard errors and recompute the t-statistics.", "B": "re-estimate the slope coefficients because they are inconsistent.", "C": "omit one of the highly correlated independent variables."}, "ans": "A", "en": "Without a lagged dependent variable, the slope coefficients remain consistent; only the standard errors are wrong (too small). The correction is to calculate robust (Newey–West corrected) standard errors and use them to recalculate t-statistics with the original coefficients.", "ko": "lagged Y가 없으면 serial correlation이 있어도 계수는 consistent – 문제는 표준오차뿐. Newey–West(robust) 표준오차로 t를 다시 계산합니다.", "trap": "계수 자체가 틀렸다고 생각하는 함정. 변수 제거는 다중공선성 해결책.", "f": "SC 교정: Newey–West SE;  이분산 교정: White SE", "why": {"B": "lagged 종속변수가 없으므로 계수는 consistent합니다. 표준오차만 교정하면 됩니다.", "C": "상관된 독립변수 제거는 다중공선성의 해결책입니다."}, "orig": "변형 (오답노트 R1 serial correlation only, Schweser LOS 1.i)"}, {"id": "VAR-M3-03", "src": "변형", "module": 3, "tag": "다중공선성 영향 – Type II error", "vig": null, "stem": "Severe multicollinearity in a multiple regression most likely results in:", "opts": {"A": "Type I errors because standard errors are understated.", "B": "Type II errors because standard errors are overstated.", "C": "inconsistent slope coefficient estimates."}, "ans": "B", "en": "Multicollinearity does not affect the consistency of slope coefficients but makes the estimates imprecise. Standard errors are too high, which lowers t-statistics and leads to Type II errors (failing to reject a false null).", "ko": "다중공선성 → 표준오차 과대 → t 과소 → 유의한 변수를 무의미하다고 판단(Type II). 계수의 consistency에는 영향 없음. (Serial correlation·이분산은 반대로 SE 과소 → Type I.)", "trap": "SC·이분산(Type I)과 방향을 혼동.", "f": "Multicollinearity: SE↑ → t↓ → Type II", "why": {"A": "SE 과소 → Type I은 양(+)의 serial correlation이나 이분산의 영향입니다.", "C": "다중공선성은 계수의 consistency에 영향을 주지 않고 정밀도만 떨어뜨립니다."}, "orig": "변형 (오답노트 R1, Schweser LOS 1.j)"}, {"id": "ECO-M4-Q13", "src": "ECO 오답", "module": 4, "tag": "로지스틱 회귀 – log odds 변화로 확률 계산", "vig": 3, "stem": "Based on the logistic model and with a diverse board, the probability of Tekdat being listed on a US exchange would be closest to:", "opts": {"A": "0.73.", "B": "0.81.", "C": "0.93."}, "ans": "B", "en": "Without a diverse board, P = 0.65, so odds = 0.65/0.35 = 1.8571 and log odds = ln(1.8571) = 0.6190. With gender diversity, the log odds increase by 0.80 to 1.4190. New odds = e^1.4190 = 4.1331, so P = 4.1331/(1 + 4.1331) = 0.8052 ≈ 0.81.", "ko": "로지스틱 회귀 계수는 'log odds'의 변화량입니다. 확률 → odds → ln(odds) → +0.80 → e^ → odds → 확률 순서로 풉니다.", "trap": "odds에 0.8을 더하면(0.73) 틀림. 계수는 ln(odds)에 더함.", "f": "ln[P/(1−P)] 에 b 더하기 → P = odds/(1+odds)", "why": {"A": "odds(1.8571)에 0.8을 더했습니다. 계수 0.8은 odds가 아니라 log odds에 더해야 합니다.", "C": "odds에 0.8을 더한 값(2.6571)을 log odds처럼 지수화했습니다(로그 단계 누락)."}, "orig": "ECO Module 4 Q13"}, {"id": "ECO-M4-Q14", "src": "ECO 오답", "module": 4, "tag": "더미변수 개수 = 범주 수 − 1", "vig": null, "stem": "In a regression analysis using a sample of 20 companies, the number of dummy variables needed to distinguish among four different categories of companies is:", "opts": {"A": "3.", "B": "4.", "C": "19."}, "ans": "A", "en": "To distinguish among n categories, we need n − 1 dummy variables. With four categories, we use three dummies.", "ko": "n개 범주 → n − 1개 더미(빠진 범주가 기준이 되어 절편에 반영). n개를 다 넣으면 완전 다중공선성이 생깁니다. 표본 수(20)와는 무관합니다.", "trap": "표본 수(20)로 계산하거나 −1을 빼먹는 실수.", "f": "# dummies = # categories − 1", "why": {"B": "−1을 빠뜨렸습니다. 4개를 모두 넣으면 절편과 완전 공선성이 생깁니다.", "C": "범주 수가 아니라 회사 수(20)로 계산했습니다."}, "orig": "ECO Module 4 Q14"}, {"id": "ECO-M5-Q1", "src": "ECO 오답", "module": 5, "tag": "선형 추세 예측 (t = 183)", "vig": 6, "stem": "Based on Exhibit 1, the predicted WTI oil price for October 2015 using the linear trend model is closest to:", "opts": {"A": "$29.15.", "B": "$74.77.", "C": "$103.10."}, "ans": "C", "en": "October 2015 is the second month out of sample, or t = 183. The predicted value = 28.3278 + 0.4086(183) = $103.10.", "ko": "선형 추세 모형 ŷ = b0 + b1t. 표본 마지막이 t = 181(2015년 8월)이므로 9월 = 182, 10월 = 183입니다. 절편을 빼먹지 않도록 주의.", "trap": "t를 잘못 세거나 절편 누락(74.77 = 0.4086 × 183).", "f": "ŷt = b0 + b1t", "why": {"A": "t나 계수를 잘못 넣은 값입니다. 28.3278 + 0.4086 × 183 = 103.10이 맞습니다.", "B": "0.4086 × 183만 계산하고 절편 28.3278을 더하지 않았습니다."}, "orig": "ECO Module 5 Q1"}, {"id": "ECO-M5-Q2", "src": "ECO 오답", "module": 5, "tag": "로그-선형 추세 예측 (e^ 변환)", "vig": 6, "stem": "Based on Exhibit 1, the predicted WTI oil price for September 2015 using the log-linear trend model is closest to:", "opts": {"A": "$29.75.", "B": "$29.98.", "C": "$116.50."}, "ans": "C", "en": "September 2015 is the first month out of sample, t = 182. ln(price) = 3.3929 + 0.0075(182) = 4.7579, so price = e^4.7579 = $116.50.", "ko": "로그-선형 모형은 ln(y)를 예측하므로 마지막에 반드시 e^로 되돌립니다. t = 182(표본 마지막 181 다음 달).", "trap": "ln 값을 그대로 쓰거나 지수 변환을 빼먹는 실수.", "f": "ln ŷt = b0 + b1t → ŷt = e^(b0 + b1t)", "why": {"A": "로그-선형 식을 잘못 적용한 값입니다. e^(3.3929 + 0.0075 × 182) = 116.50입니다.", "B": "로그-선형 식을 잘못 적용한 값입니다. ln 가격 4.7579를 e^로 변환해야 합니다."}, "orig": "ECO Module 5 Q2"}, {"id": "ECO-M5-Q6", "src": "ECO 오답", "module": 5, "tag": "잔차 자기상관 표준오차 = 1/√T", "vig": 6, "stem": "Based on the data for the AR(1) model in Exhibit 1 and Exhibit 2, Martinez can conclude that the:", "opts": {"A": "residuals are not serially correlated.", "B": "autocorrelations do not differ significantly from zero.", "C": "standard error for each of the autocorrelations is 0.0745."}, "ans": "C", "en": "The standard error of the autocorrelations is 1/√T, where T is the number of observations used in the regression: 1/√180 = 0.0745. The residuals are serially correlated because two of the four autocorrelations (lags 1 and 2) have |t| greater than the critical value of 1.97.", "ko": "AR 모형 잔차 자기상관의 표준오차 = 1/√T (T = AR(1) 회귀 관측치 180). Lag 1(t = 5.58), Lag 2(t = 3.20)가 1.97을 넘으므로 잔차에 serial correlation이 있습니다 → AR(1)은 잘못 지정된 모형.", "trap": "AR 모형에서는 DW(1.16)를 보지 말고 잔차 자기상관 t-통계량을 봅니다.", "f": "SE(ρ) = 1/√T,  t = ρ / (1/√T)", "why": {"A": "Lag 1, 2의 t값(5.58, 3.20)이 1.97보다 커서 잔차가 serial correlation을 가집니다.", "B": "4개 중 2개의 자기상관이 유의하게 0과 다릅니다."}, "orig": "ECO Module 5 Q6"}, {"id": "ECO-M5-Q28", "src": "ECO 오답", "module": 5, "tag": "1차 차분 시계열 – covariance stationary", "vig": 7, "stem": "Based on the regression output in Exhibit 1, the first-differenced series used to run Regression 2 is consistent with:", "opts": {"A": "a random walk.", "B": "covariance stationarity.", "C": "a random walk with drift."}, "ans": "B", "en": "The critical t-statistic is 1.98. Neither the intercept nor the lag coefficient in Regression 2 differs significantly from zero, and the residual autocorrelations do not differ significantly from zero. Regression 2 reduces to yt = εt, with a mean-reverting level of 0/(1 − 0) = 0 and constant variance σ². Therefore, yt is covariance stationary.", "ko": "차분 시계열 yt에서 b0 = 0, b1 = 0, 잔차 자기상관 없음 → yt = εt (백색잡음) → 평균·분산 일정 → covariance stationary. 원래 xt는 random walk(단위근)였다는 뜻이지만, 질문은 '차분된 시계열'에 대한 것입니다.", "trap": "원래 시계열(random walk)과 차분된 시계열(stationary)을 혼동.", "f": "yt = xt − xt−1 = εt → 평균 0, 분산 σ² 일정", "why": {"A": "random walk인 것은 원래 시계열 xt입니다. 차분한 yt = εt는 covariance stationary입니다.", "C": "절편이 유의하지 않아(t = −1.30) drift도 없고, 어차피 차분된 시계열 자체는 stationary입니다."}, "orig": "ECO Module 5 Q28"}, {"id": "ECO-M5-Q48", "src": "ECO 오답", "module": 5, "tag": "로그-선형 추세 예측 (t = 13)", "vig": 8, "stem": "Based on the data in Exhibit 1, Olsen's model predicts the value of Namibia's GDP at t = 13 will be closest to:", "opts": {"A": "USD 8.54 billion.", "B": "USD 12.43 billion.", "C": "USD 23.71 billion."}, "ans": "C", "en": "In a log-linear trend model, the predicted trend value of yt is e^(b0 + b1t) = e^(8.9673 + 0.0851 × 13) = e^10.0736 ≈ 23,708 (i.e., USD 23.71 billion when the underlying data are in millions).", "ko": "로그-선형 모형: ŷ = e^(b0 + b1t). b1에 t = 13을 반드시 곱합니다. (ECO 정답 23.71 billion은 e^10.0736 ≈ 23,708(백만 단위)을 billion으로 표시한 것 – 단위 표기만 다를 뿐 방법이 핵심.)", "trap": "b1에 t를 곱하지 않거나, 절편의 표준오차(.3754)를 더하는 실수.", "f": "ŷt = e^(b0 + b1t)", "why": {"A": "e^(8.9673 + 0.0851)으로 b1에 13을 곱하지 않았습니다.", "B": "b1에 13을 곱하지 않고 절편 표준오차 0.3754까지 더했습니다."}, "orig": "ECO Module 5 Q48"}, {"id": "ECO-M5-Q53", "src": "ECO 오답", "module": 5, "tag": "AR(1) 2기간 앞 예측 (chain rule)", "vig": 9, "stem": "If Rudall Hardware's net margin is 15% this quarter, Knight's first-order autoregressive model will predict the net margin two quarters from now to be closest to:", "opts": {"A": "15.88%.", "B": "17.91%.", "C": "20.74%."}, "ans": "B", "en": "One quarter ahead: 0.0415 + 0.8295(0.15) = 16.59%. Two quarters ahead: 0.0415 + 0.8295(0.1659) = 17.91%. The formula must be applied twice (chain rule of forecasting).", "ko": "AR(1) 2기간 예측은 1기간 예측값을 다시 식에 넣습니다(chain rule). 평균회귀 수준 0.0415/(1 − 0.8295) = 24.3%로 수렴해 가는 과정입니다.", "trap": "절편을 두 번 더하기(20.74%), 순서 바꿔 곱하기(15.88%).", "f": "x̂t+1 = b0 + b1xt;  x̂t+2 = b0 + b1x̂t+1", "why": {"A": "(0.0415 + 0.15) × 0.8295로 순서를 잘못 적용했습니다.", "C": "0.15 × 0.8295에 절편을 두 번 더했습니다. 두 번째 기간은 첫 예측값(16.59%)을 다시 넣어야 합니다."}, "orig": "ECO Module 5 Q53"}, {"id": "ECO-M5-Q58", "src": "ECO 오답", "module": 5, "tag": "Dickey–Fuller 변환 (양변에서 xt−1 빼기)", "vig": 10, "stem": "In order to run his test on Model C, Taylor should:", "opts": {"A": "take the first difference of the time series.", "B": "subtract the first lag of the time series from both sides of the model equation.", "C": "take the natural logarithms of both the independent and dependent variables."}, "ans": "B", "en": "The Dickey–Fuller test transforms the AR(1) model xt = b0 + b1xt–1 + εt by subtracting xt–1 from both sides: xt – xt–1 = b0 + (b1 – 1)xt–1 + εt = b0 + g1xt–1 + εt. If there is a unit root, g1 = 0.", "ko": "DF 검정은 AR(1) 양변에서 xt−1을 빼서 g1 = b1 − 1을 검정합니다. H0: g1 = 0(단위근), Ha: g1 < 0. '1차 차분 AR 모형'(xt − xt−1을 xt−1 − xt−2에 회귀)과는 다릅니다.", "trap": "'1차 차분'은 단위근을 '고치는' 방법, DF는 단위근을 '검정하는' 변환.", "f": "xt − xt−1 = b0 + g1xt−1 + εt,  g1 = b1 − 1", "why": {"A": "1차 차분 모형은 xt − xt−1 = b0 + b1(xt−1 − xt−2)로 두 번째 시차가 들어갑니다. DF 검정은 우변에 xt−1 수준을 둡니다.", "C": "로그-로그 모형이 아닙니다. 필요한 변환은 양변에서 xt−1을 빼는 것입니다."}, "orig": "ECO Module 5 Q58"}, {"id": "ECO-M5-Q67", "src": "ECO 오답", "module": 5, "tag": "DF 검정 – p-value 큼 → 단위근", "vig": 11, "stem": "Based on Exhibit 2, the test that Hall conducts for the gold price series:", "opts": {"A": "is inconclusive.", "B": "indicates that the series is stationary.", "C": "indicates that the series exhibits a unit root."}, "ans": "C", "en": "The Dickey–Fuller null hypothesis is H0: g1 = 0 (unit root, nonstationary) versus Ha: g1 < 0. The t-statistic is 0.0093 with p-value 0.9926, so the null is not rejected: the gold price series exhibits a unit root and is nonstationary.", "ko": "DF 검정에서 H0 = 단위근 있음. p-value 0.99 → 기각 못함 → 단위근 있음(비정상). '기각 못함'이 '판단 불가'가 아닙니다 – H0(단위근)를 유지하는 결론입니다.", "trap": "t값이 아주 작으면 '결론 없음'으로 착각하기 쉬움.", "f": "DF: H0: g1 = 0 (unit root), Ha: g1 < 0", "why": {"A": "H0를 기각하지 못했다는 것은 '단위근이 있다'는 결론입니다. 판단 불가가 아닙니다.", "B": "stationary라는 결론은 H0(단위근)를 기각할 때입니다. p = 0.99라 기각 못합니다."}, "orig": "ECO Module 5 Q67"}, {"id": "ECO-M5-Q69", "src": "ECO 오답", "module": 5, "tag": "Random walk 최선 예측 = 현재 값", "vig": 12, "stem": "If Kamini is correct regarding the trailing P/E time series, the best forecast of next period's trailing P/E is most likely to be the:", "opts": {"A": "current period's trailing P/E.", "B": "average P/E of the time series.", "C": "forecast derived from applying the AR(1) model depicted in Exhibit 1 to the data."}, "ans": "A", "en": "If a time series is a random walk, the best forecast of xt made in period t – 1 is xt–1. So, the best forecast of next period's trailing P/E is the current period's trailing P/E.", "ko": "Random walk: xt = xt−1 + εt → 다음 기 최선 예측 = 이번 기 값. 평균회귀 수준이 정의되지 않으므로(b0/(1−1)) 평균값은 의미가 없고, 비정상 시계열이라 AR(1) 추정 결과도 쓸 수 없습니다.", "trap": "평균으로 회귀할 것이라는 직관 함정 – random walk에는 평균회귀 수준이 없음.", "f": "Random walk: E(xt+1) = xt", "why": {"B": "random walk는 평균회귀 수준이 정의되지 않으므로 평균을 쓰는 예측은 개선 효과가 없습니다.", "C": "random walk는 covariance stationary가 아니므로 AR(1) 추정은 적절하지 않습니다."}, "orig": "ECO Module 5 Q69"}, {"id": "ECO-M5-Q70", "src": "ECO 오답", "module": 5, "tag": "ARCH(1) 판단 – 기울기 c1 ≠ 0", "vig": 12, "stem": "The results depicted in Exhibit 2 are best described as consistent with a regression that has ARCH(1) errors because:", "opts": {"A": "c1 is significantly different from 0.", "B": "c1 is significantly different from 1.", "C": "c0 is significantly different from 0."}, "ans": "A", "en": "To test for ARCH(1), regress the squared residuals on a constant and one lag of the squared residuals. If the slope (c1) is statistically significantly different from 0, the time series is ARCH(1).", "ko": "ARCH(1) 검정: 잔차²를 직전 잔차²에 회귀. 기울기 c1이 0과 유의하게 다르면 → 오차 분산이 직전 오차 크기에 의존 → ARCH(1).", "trap": "절편(c0)이 유의한 것은 의미 없음. 비교 기준은 1이 아니라 0.", "f": "ε̂²t = a0 + a1ε̂²t−1 + ut;  a1 ≠ 0 → ARCH(1)", "why": {"B": "기울기를 1과 비교하는 것은 단위근 검정 개념입니다. ARCH는 0과 비교합니다.", "C": "절편이 아니라 기울기(c1)를 검정해야 합니다."}, "orig": "ECO Module 5 Q70"}, {"id": "ECO-M5-Q72", "src": "ECO 오답", "module": 5, "tag": "두 시계열 회귀 – 둘 다 단위근 검정", "vig": 12, "stem": "DeMolay's caution given in Condition 1 is best described as:", "opts": {"A": "correct.", "B": "incorrect because only the independent variable series needs to be tested for the absence of a unit root.", "C": "incorrect because only the dependent variable series needs to be tested for the absence of a unit root."}, "ans": "A", "en": "When working with two time series in a regression analysis, both series must be tested for the presence of a unit root. If neither series has a unit root, linear regression can safely be used to test the relationship between the two time series.", "ko": "두 시계열 회귀에서는 Y와 X 모두 단위근 검정을 합니다. 둘 다 단위근 없음 → 회귀 OK(Condition 1 맞음). 하나만 단위근 → 신뢰 불가. 둘 다 단위근 → 공적분이면 OK. (참고: DeMolay의 Condition 2 '둘 다 단위근이고 공적분 아님'은 틀린 문장 – 공적분이어야 함.)", "trap": "한쪽만 검정해도 된다는 함정. Condition 2 문구(not cointegrated)도 오류.", "f": "둘 다 stationary → OK / 하나만 단위근 → X / 둘 다 단위근 + 공적분 → OK", "why": {"B": "종속변수에 단위근이 있고 독립변수에 없으면 회귀를 쓸 수 없으므로 종속변수도 검정해야 합니다.", "C": "독립변수에 단위근이 있고 종속변수에 없어도 회귀를 쓸 수 없으므로 독립변수도 검정해야 합니다."}, "orig": "ECO Module 5 Q72"}, {"id": "ECO-M5-Q74", "src": "ECO 오답", "module": 5, "tag": "두 시계열 모두 단위근 → 공적분이면 유효", "vig": null, "stem": "An analyst estimates a simple linear regression of a time series yt on another time series xt. In which of the following situations could the estimates of the regression test statistics be valid?", "opts": {"A": "Both the dependent variable yt and the independent variable xt have a unit root", "B": "The dependent variable yt has a unit root, but the independent variable xt does not", "C": "The independent variable xt has a unit root, but the dependent variable yt does not"}, "ans": "A", "en": "If both time series have a unit root, we must establish whether they are cointegrated. If they are cointegrated, the error term is covariance stationary and the coefficients and standard errors are consistent, so the test statistics are valid. If only one series has a unit root, the error term is not covariance stationary and the results would be spurious.", "ko": "하나만 단위근 → 항상 무효. 둘 다 단위근 → 공적분이면 유효할 '수 있음'. 'could be valid'를 물었으므로 둘 다 단위근인 경우가 답입니다.", "trap": "'둘 다 단위근'이 가장 나빠 보이지만, 공적분 가능성 때문에 유일하게 유효할 수 있는 경우.", "f": "Cointegrated → 회귀 잔차 stationary → 회귀 유효", "why": {"B": "종속변수만 단위근 → 오차항이 stationary가 아니어서 계수·표준오차가 inconsistent(가짜 회귀)합니다.", "C": "독립변수만 단위근 → 오차항이 stationary가 아니어서 회귀를 쓸 수 없습니다."}, "orig": "ECO Module 5 Q74"}, {"id": "ECO-M5-Q80", "src": "ECO 오답", "module": 5, "tag": "ARCH(p) 정의", "vig": null, "stem": "An analyst models the quarterly sales growth data of an online retailer and observes that the model's error term is heteroskedastic and follows an ARCH(2) process. This implies that the variance of the error term in the current quarter:", "opts": {"A": "follows an autoregressive moving-average (ARMA) process.", "B": "depends linearly on the squared errors from the previous two quarters.", "C": "depends linearly on a time trend and the squared error from the previous quarter."}, "ans": "B", "en": "In an ARCH(p) model, the variance of the error term in the current period depends linearly on the squared errors from the previous p periods. For ARCH(2), it depends linearly on the squared errors from the previous two quarters.", "ko": "ARCH(p): 이번 기 오차 분산 = 직전 p기 오차 제곱들의 선형함수. ARCH(2) → 직전 2개 분기의 오차².", "trap": "p = 시차 수. 시간 추세나 ARMA와 무관.", "f": "σ²t = a0 + a1ε²t−1 + … + apε²t−p", "why": {"A": "ARCH 분산은 ARMA 과정을 따르는 것이 아니라 과거 오차 제곱에 선형으로 의존합니다.", "C": "시간 추세는 들어가지 않으며, ARCH(2)는 직전 '두' 분기의 오차²에 의존합니다."}, "orig": "ECO Module 5 Q80"}, {"id": "ECO-M5-Q81", "src": "ECO 오답", "module": 5, "tag": "단위근 + 공적분 아님 → 회귀 무효", "vig": null, "stem": "An analyst regresses changes in an exchange rate over time on the two countries' inflation rate differential. While each of the two time series has a unit root, the time series are not cointegrated. This implies that the error term in the linear regression will:", "opts": {"A": "be covariance stationary and the regression coefficients will be consistent.", "B": "be covariance stationary but the regression coefficients will not be consistent.", "C": "not be covariance stationary and the regression coefficients will not be consistent."}, "ans": "C", "en": "If both time series have a unit root but are not cointegrated, the error term will not be covariance stationary, regression assumptions will be violated, the coefficients and standard errors will not be consistent, and they cannot be used for hypothesis tests.", "ko": "둘 다 단위근 + 공적분 아님 → 잔차도 단위근(비정상) → 계수·표준오차 inconsistent → 검정 불가.", "trap": "공적분 여부가 '잔차가 stationary인가'를 결정한다는 연결고리를 기억.", "f": "Not cointegrated → ε nonstationary → 회귀 무효", "why": {"A": "공적분이 아니면 오차항은 covariance stationary가 아닙니다.", "B": "공적분이 아니면 오차항부터 stationary가 아닙니다."}, "orig": "ECO Module 5 Q81"}, {"id": "ECO-M5-Q90", "src": "ECO 오답", "module": 5, "tag": "표본기간 선택 – 최근 AR(1) 사용", "vig": null, "stem": "A research report of a brokerage firm estimates the change in a company's quarterly sales, using data for the past four decades. For the entire sample period, the report concludes that an AR(4) model is appropriate. Because the firm's industry has become more competitive, an analyst decides to estimate an autoregressive model using data for only the most recent decade. The analyst estimates an AR(1) model and finds that the residual autocorrelations at lag 1 to lag 4 are not statistically different from zero. To forecast next quarter's sales, the analyst should:", "opts": {"A": "estimate an AR(4) model for the most recent decade.", "B": "use the AR(1) model estimated for the most recent decade.", "C": "use the AR(4) model estimated for the entire sample period."}, "ans": "B", "en": "There has been a change (regime shift) in the most recent decade. Because the residual autocorrelations from the AR(1) model are not different from zero, there is no need to estimate an AR(4) model; the AR(1) model estimated over the most recent decade is appropriate and more parsimonious.", "ko": "구조 변화(경쟁 심화)가 있으면 최근 기간 데이터로 추정합니다. 최근 AR(1) 잔차에 자기상관이 없으므로 AR(1)이 올바르게 지정된 모형이고, 더 간결(parsimonious)합니다.", "trap": "'긴 표본 = 더 좋음'은 시계열이 한 regime일 때만.", "f": "잔차 자기상관 없음 → 그 AR(p) 채택", "why": {"A": "AR(1) 잔차에 유의한 자기상관이 없으므로 AR(4)는 불필요합니다.", "C": "전체 기간 AR(4)는 최근의 구조 변화를 반영하지 못합니다."}, "orig": "ECO Module 5 Q90"}, {"id": "ECO-M5-Q91", "src": "ECO 오답", "module": 5, "tag": "DF 검정 p = 0.90 → 단위근", "vig": null, "stem": "An analyst wants to forecast quarterly GDP using an AR(1) model that has produced the following regression output:\n\tCoefficient\tt-Statistic\nIntercept\t0.03\t6.91\nGDPt–1\t0.99\t100.39\nThe Dickey–Fuller test statistic is 0.12 with a p-value of 0.90. The analyst should conclude that the GDP time series:", "opts": {"A": "has a unit root.", "B": "is covariance stationary.", "C": "does not have a unit root."}, "ans": "A", "en": "The null hypothesis of the Dickey–Fuller test is that the series has a unit root (H0: g1 = 0) versus Ha: g1 < 0. With a p-value of 0.90, we cannot reject the null that GDP has a unit root.", "ko": "DF H0 = 단위근. p = 0.90 → 기각 못함 → 단위근 있음 → 비정상. GDPt−1 계수의 큰 t(100.39)는 0과의 비교라 단위근 판단과 무관합니다.", "trap": "AR 계수의 일반 t-통계량(0과 비교)으로 정상성을 판단하는 함정.", "f": "p > α → H0(unit root) 유지", "why": {"B": "H0(비정상)를 기각하지 못했으므로 covariance stationary라고 할 수 없습니다.", "C": "H0(단위근)를 기각하지 못했으므로 단위근이 있다고 결론냅니다."}, "orig": "ECO Module 5 Q91"}, {"id": "ECO-M5-Q92", "src": "ECO 오답", "module": 5, "tag": "DF 검정 대립가설 g1 < 0", "vig": null, "stem": "In evaluating an AR(1) model using the Dickey–Fuller test, an analyst estimates the following time-series regression: xt – xt–1 = b0 + g1xt–1 + εt. The alternative hypothesis for the Dickey–Fuller test is:", "opts": {"A": "g1 < 0.", "B": "g1 = 0.", "C": "g1 > 0."}, "ans": "A", "en": "The Dickey–Fuller test transforms the AR(1) model by subtracting xt–1 from both sides, giving g1 = b1 – 1. The null is g1 = 0 (b1 = 1, unit root, not stationary) and the alternative is g1 < 0 (no unit root, stationary).", "ko": "g1 = b1 − 1. 정상 시계열이면 |b1| < 1 → g1 < 0. 그래서 대립가설은 단측 g1 < 0입니다.", "trap": "H0와 Ha 혼동, 부호 방향 혼동.", "f": "H0: g1 = 0 (unit root);  Ha: g1 < 0", "why": {"B": "g1 = 0은 귀무가설(단위근)입니다.", "C": "g1 > 0이면 b1 > 1(폭발적 시계열)입니다. 정상성은 g1 < 0입니다."}, "orig": "ECO Module 5 Q92"}, {"id": "ECO-M5-Q93", "src": "ECO 오답", "module": 5, "tag": "ARCH(1) 다음 기 분산 예측", "vig": null, "stem": "An analyst estimates an AR(1) model for the daily returns of a major stock market index, using data from the past year. Denoting the residual from the AR(1) model in time period t as εt, the analyst regresses the squared residual, εt², on its first lag, εt–1², and presents the following results:\n\tCoefficient\tp-Value\nIntercept\t0.0005\t< 0.01\nεt–1²\t0.3000\t< 0.01\nThe AR(1) residual for the last day in the sample period is 0.018755. The predicted variance of the error for the next day is closest to:", "opts": {"A": "0.0005.", "B": "0.0006.", "C": "0.0061."}, "ans": "B", "en": "The ARCH(1) model is εt² = a0 + a1εt–1²: 0.0005 + 0.3000 × 0.018755² = 0.000606 ≈ 0.0006.", "ko": "ARCH(1) 예측 분산 = 절편 + 계수 × (직전 잔차)². 잔차를 반드시 제곱합니다. a1이 유의하므로 절편만 쓰면 안 됩니다.", "trap": "잔차를 제곱하지 않는 실수(0.0061).", "f": "σ̂²t+1 = a0 + a1ε̂²t", "why": {"A": "절편만 쓴 값입니다. a1이 0과 유의하게 다르므로 직전 오차² 항을 더해야 합니다.", "C": "직전 잔차를 제곱하지 않고 곱했습니다(0.0005 + 0.3 × 0.018755)."}, "orig": "ECO Module 5 Q93"}, {"id": "VAR-M5-01", "src": "변형", "module": 5, "tag": "DW 해석 – 2보다 훨씬 작음", "vig": null, "stem": "A linear trend model estimated with 80 monthly observations has a Durbin–Watson statistic of 0.45. The lower critical value at the 5% significance level is 1.55. The analyst should most likely conclude that the residuals exhibit:", "opts": {"A": "no serial correlation.", "B": "positive serial correlation.", "C": "negative serial correlation."}, "ans": "B", "en": "For a trend model without serial correlation, DW should be approximately 2.0. A DW well below 2 (and below the lower critical value of 1.55) indicates positive serial correlation, so the standard errors are biased downward and hypothesis tests on the coefficients are unreliable.", "ko": "DW ≈ 2 → serial correlation 없음, DW < 2(특히 하한 임계값 미만) → 양의 serial correlation, DW > 2 → 음의 serial correlation. 임계값이 주어지면 그것과 비교합니다.", "trap": "", "f": "DW ≈ 2(1 − r)", "why": {"A": "DW 0.45는 2보다 훨씬 작고 하한 임계값 1.55보다도 작으므로 serial correlation이 있습니다.", "C": "음의 serial correlation은 DW가 2보다 클 때입니다."}, "orig": "변형 (오답노트 R2 DW, Schweser LOS 2.b)"}, {"id": "VAR-M5-02", "src": "변형", "module": 5, "tag": "AR 모형 잔차 검정 – DW 말고 t-test", "vig": null, "stem": "To determine whether an AR(1) model is correctly specified, an analyst should test for serial correlation in the residuals by:", "opts": {"A": "comparing the Durbin–Watson statistic with its critical values.", "B": "testing whether the residual autocorrelations differ significantly from zero using t-statistics with a standard error of 1/√T.", "C": "regressing the squared residuals on the independent variables (Breusch–Pagan test)."}, "ans": "B", "en": "The Durbin–Watson test used with trend models is not appropriate for testing serial correlation of the error terms in an autoregressive model (which contains a lagged dependent variable). Instead, the residual autocorrelations are tested with t = autocorrelation/(1/√T).", "ko": "lagged Y가 독립변수인 AR 모형에서는 DW를 쓰지 않고, 잔차 자기상관 각각의 t-통계량(SE = 1/√T)을 봅니다. 유의한 자기상관이 없어야 올바른 모형입니다.", "trap": "DW가 2 근처라고 AR 모형이 괜찮다고 판단하는 함정.", "f": "t = ρk/(1/√T)", "why": {"A": "DW는 lagged 종속변수가 있는 AR 모형에는 적절하지 않습니다.", "C": "BP 검정은 이분산 검정이지 serial correlation 검정이 아닙니다."}, "orig": "변형 (오답노트 R2 lagged dependent variable, Schweser LOS 2.e)"}, {"id": "VAR-M5-03", "src": "변형", "module": 5, "tag": "로그-선형 추세 – 성장률 = e^b1 − 1", "vig": null, "stem": "An analyst estimates the log-linear trend model ln(Salest) = 5.20 + 0.04t using quarterly data. The model implies that sales grow each quarter at a constant rate closest to:", "opts": {"A": "4.00%.", "B": "4.08%.", "C": "1.04%."}, "ans": "B", "en": "In a log-linear trend model, ln(yt+1) − ln(yt) = b1, so yt+1/yt = e^b1. The constant growth rate is e^0.04 − 1 = 4.08% per quarter (continuously compounded rate of 4%).", "ko": "로그-선형 모형의 b1은 연속복리 성장률입니다. 기간 성장률 = e^b1 − 1 = e^0.04 − 1 = 4.08%.", "trap": "b1을 그대로 성장률로 읽는 함정(연속복리 vs 기간 성장률).", "f": "Growth = e^b1 − 1", "why": {"A": "4%는 연속복리 성장률(b1)입니다. 분기 성장률은 e^0.04 − 1입니다.", "C": "e^0.04 = 1.0408을 잘못 읽은 값입니다. 성장률은 1.0408 − 1 = 4.08%입니다."}, "orig": "변형 (오답노트 R2 log-linear 성장률)"}, {"id": "VAR-M5-04", "src": "변형", "module": 5, "tag": "ARCH(1) 분산 예측 (변형)", "vig": null, "stem": "An ARCH(1) regression of squared residuals on lagged squared residuals produces an intercept of 0.002 and a slope of 0.40, both statistically significant. If the most recent residual is 0.05, the predicted variance of the error in the next period is closest to:", "opts": {"A": "0.0030.", "B": "0.0220.", "C": "0.0010."}, "ans": "A", "en": "Predicted variance = a0 + a1ε²t = 0.002 + 0.40 × 0.05² = 0.002 + 0.40 × 0.0025 = 0.0030.", "ko": "ARCH(1) 다음 기 분산 = 절편 + 계수 × (직전 잔차)². 잔차를 제곱하고 절편을 더합니다.", "trap": "잔차를 제곱하지 않거나(0.022) 절편을 빼먹는(0.001) 실수.", "f": "σ̂²t+1 = a0 + a1ε̂²t", "why": {"B": "잔차를 제곱하지 않았습니다(0.002 + 0.40 × 0.05).", "C": "절편 0.002를 더하지 않았습니다."}, "orig": "변형 (오답노트 R2 ARCH(1), Schweser LOS 2.m)"}, {"id": "VAR-M5-05", "src": "변형", "module": 5, "tag": "공적분 검정 – 잔차에 DF(-EG) 검정", "vig": null, "stem": "Two time series, Y and X, each have a unit root. An analyst regresses Y on X and applies a Dickey–Fuller (Engle–Granger) test to the residuals. The test rejects the null hypothesis of a unit root in the residuals. The analyst should conclude that:", "opts": {"A": "the two series are cointegrated, and the regression can be used to model their relationship.", "B": "the two series are not cointegrated, and the regression results are spurious.", "C": "both series are covariance stationary, so no further testing is needed."}, "ans": "A", "en": "To test for cointegration, regress one variable on the other and test the residuals for a unit root using the DF–EG test. If the null of a unit root is rejected, the error terms are covariance stationary and the two series are cointegrated, so the regression can be used.", "ko": "공적분 검정: Y를 X에 회귀 → 잔차에 DF-EG 검정. H0 = 잔차에 단위근(공적분 아님). H0 기각 → 잔차 stationary → 공적분 → 회귀 사용 가능.", "trap": "'단위근 기각'이 원래 시계열 이야기라고 착각하는 함정 – 검정 대상은 잔차.", "f": "Residual DF: reject unit root → cointegrated", "why": {"B": "잔차의 단위근을 기각했으므로 공적분입니다. 기각 못했을 때가 공적분 아님입니다.", "C": "각 시계열은 여전히 단위근을 가집니다. stationary인 것은 둘의 회귀 잔차입니다."}, "orig": "변형 (오답노트 R2 cointegration test, Schweser LOS 2.n)"}, {"id": "VAR-M5-06", "src": "변형", "module": 5, "tag": "차분 결과 b0 = b1 = 0 → 원래 시계열은 random walk", "vig": null, "stem": "An analyst first-differences a time series xt and estimates yt = b0 + b1yt−1 + εt, where yt = xt − xt−1. Neither b0 nor b1 is significantly different from zero, and the residual autocorrelations are not significant. The original series xt is most likely:", "opts": {"A": "covariance stationary.", "B": "a random walk without drift.", "C": "a random walk with drift."}, "ans": "B", "en": "If b0 = 0 and b1 = 0, then yt = xt − xt−1 = εt, so xt = xt−1 + εt: a simple random walk (unit root) without drift. The differenced series is covariance stationary, but the original series is not.", "ko": "차분 회귀에서 b0 = 0, b1 = 0, 잔차 자기상관 없음 → xt − xt−1 = εt → xt = xt−1 + εt → 원래 시계열은 drift 없는 random walk(단위근). 차분된 yt는 stationary.", "trap": "차분된 시계열(stationary)과 원래 시계열(random walk)을 혼동.", "f": "xt = xt−1 + εt (random walk);  + b0 ≠ 0 → drift", "why": {"A": "covariance stationary인 것은 차분된 yt입니다. 원래 xt는 단위근을 가집니다.", "C": "절편 b0가 0과 다르지 않으므로 drift가 없습니다."}, "orig": "변형 (오답노트 R2 first-differenced series)"}, {"id": "VAR-M5-07", "src": "변형", "module": 5, "tag": "계절성 – seasonal lag 추가", "vig": null, "stem": "An analyst estimates an AR(1) model using quarterly data. The residual autocorrelations at lags 1 through 3 are not significant, but the autocorrelation at lag 4 is significant. The most appropriate step is to:", "opts": {"A": "add the fourth lag of the dependent variable to the model as an additional independent variable.", "B": "first-difference the time series because it has a unit root.", "C": "conclude that the model is correctly specified because most lags are insignificant."}, "ans": "A", "en": "Significant residual autocorrelation at lag 4 in quarterly data indicates seasonality. To adjust, an additional lag of the dependent variable corresponding to the same period in the previous year (lag 4 for quarterly, lag 12 for monthly) is added as another independent variable.", "ko": "분기 데이터에서 4차 잔차 자기상관이 유의 → 계절성. 같은 분기 전년도 값(xt−4)을 독립변수로 추가합니다(AR(1) + seasonal lag).", "trap": "", "f": "Quarterly → lag 4;  Monthly → lag 12", "why": {"B": "단위근 문제가 아니라 계절성 문제입니다.", "C": "유의한 잔차 자기상관이 하나라도 있으면 모형은 잘못 지정된 것입니다."}, "orig": "변형 (오답노트 R2 seasonality, Schweser LOS 2.l)"}, {"id": "VAR-M5-08", "src": "변형", "module": 5, "tag": "지수 추세 + 단위근 → 로그 후 차분", "vig": null, "stem": "A company's quarterly sales grow at a roughly constant rate (exponential trend), and a Dickey–Fuller test indicates that the log of sales has a unit root. The most appropriate model is:", "opts": {"A": "a linear trend model of sales.", "B": "a log-linear trend model of sales.", "C": "an AR(1) model of first differences in the natural log of sales."}, "ans": "C", "en": "Exponential growth suggests taking the natural log of the series; a unit root means the series is not covariance stationary and should be first-differenced. Therefore model Δln(Salest) = b0 + b1Δln(Salest−1) + εt.", "ko": "지수(일정 비율) 성장 → 로그 변환으로 선형화. 단위근 → 1차 차분으로 stationary화. 그 후 AR 모형(잔차 자기상관이 남으면 시차 추가).", "trap": "로그-선형 추세 모형만으로 끝내는 함정 – 단위근이 있으면 추세 모형 잔차도 문제.", "f": "Exponential → ln;  unit root → Δ", "why": {"A": "일정 비율로 성장하는 시계열에는 선형 추세가 맞지 않습니다.", "B": "로그 변환은 맞지만 단위근이 있으므로 차분해서 stationary로 만들어야 합니다."}, "orig": "변형 (오답노트 R2 model selection)"}, {"id": "VAR-M5-09", "src": "변형", "module": 5, "tag": "평균회귀 수준 b0/(1 − b1)", "vig": null, "stem": "An AR(1) model is estimated as xt = 0.04 + 0.60xt−1 + εt. The mean-reverting level of the series is closest to:", "opts": {"A": "0.100.", "B": "0.025.", "C": "0.067."}, "ans": "A", "en": "The mean-reverting level of an AR(1) model is b0/(1 − b1) = 0.04/(1 − 0.60) = 0.10. When xt is above 0.10, the model predicts a decrease; below 0.10, an increase.", "ko": "AR(1) 평균회귀 수준 = b0/(1 − b1). |b1| < 1이면 유한한 값이 존재하고, b1 = 1(random walk)이면 정의되지 않습니다.", "trap": "분모를 b1으로 쓰는 실수.", "f": "Mean-reverting level = b0/(1 − b1)", "why": {"B": "공식을 잘못 적용했습니다. 0.04/(1 − 0.60) = 0.10입니다.", "C": "0.04/0.60으로 분모를 (1 − b1)이 아니라 b1으로 썼습니다."}, "orig": "변형 (오답노트 R2 random walk/mean reversion, Schweser LOS 2.f)"}, {"id": "ECO-M6-Q1", "src": "ECO 오답", "module": 6, "tag": "연속형 target → 지도학습 회귀", "vig": 13, "stem": "The machine learning techniques appropriate for executing Step 1 are most likely to be based on:", "opts": {"A": "regression", "B": "classification", "C": "clustering"}, "ans": "A", "en": "The target variable (quarterly return) is continuous, hence this calls for a supervised machine learning based regression model. Classification uses categorical or ordinal target variables; clustering is unsupervised and has no target variable.", "ko": "Step 1은 다음 분기 '수익률'(연속형)을 예측 → 지도학습 회귀. 범주형 target이면 분류, target이 없으면 군집(비지도).", "trap": "'하위 20개를 고른다'는 표현 때문에 분류로 착각. 예측하는 값 자체가 연속형.", "f": "Continuous target → regression;  categorical → classification;  no target → clustering", "why": {"B": "분류는 범주형·순서형 target에 씁니다. 수익률은 연속형입니다.", "C": "군집은 target이 없는 비지도학습입니다."}, "orig": "ECO Module 6 Q1"}, {"id": "ECO-M6-Q3", "src": "ECO 오답", "module": 6, "tag": "그룹 나누기 → K-means", "vig": 13, "stem": "Which of the following machine learning techniques is most appropriate for executing Step 2:", "opts": {"A": "K-Means Clustering", "B": "Principal Components Analysis (PCA)", "C": "Classification and Regression Trees (CART)"}, "ans": "A", "en": "K-means clustering is an unsupervised machine learning algorithm which repeatedly partitions observations into a fixed number, k, of non-overlapping clusters. PCA is for dimension reduction, not clustering. CART is supervised and most commonly applied to binary classification or regression.", "ko": "Step 2는 레이블 없이 1만 종목을 정해진 수(20개)의 그룹으로 나누기 → 비지도 군집, k를 지정하는 K-means.", "trap": "PCA는 '변수(특성)'를 줄이는 것이지 '관측치'를 묶는 것이 아님.", "f": "K-means: k(그룹 수) 고정, 비지도", "why": {"B": "PCA는 상관된 특성을 소수의 무상관 합성변수로 줄이는 차원 축소 기법입니다.", "C": "CART는 레이블이 필요한 지도학습(분류·회귀)입니다."}, "orig": "ECO Module 6 Q3"}, {"id": "ECO-M6-Q5", "src": "ECO 오답", "module": 6, "tag": "인수 대상 여부 → 범주형 target", "vig": 13, "stem": "The target variable for the labelled training data to be used in Step 3 is most likely which one of the following?", "opts": {"A": "A continuous target variable.", "B": "A categorical target variable.", "C": "An ordinal target variable."}, "ans": "B", "en": "To predict which stocks are likely to become acquisition targets, the model would be trained on categorical labelled data with two categories: \"0\" for not an acquisition target and \"1\" for an acquisition target.", "ko": "'인수 대상이다/아니다'는 두 범주(0/1) → 범주형 target. 순서형은 1등·2등처럼 순서가 있는 경우입니다.", "trap": "'가장 가능성 높은 5개'라는 표현 때문에 순서형으로 착각.", "f": "Target = 0/1 → categorical (binary classification)", "why": {"A": "인수 대상 여부는 연속값이 아니라 범주입니다.", "C": "순서형(1st, 2nd, 3rd…)이 아니라 두 범주의 범주형입니다."}, "orig": "ECO Module 6 Q5"}, {"id": "ECO-M6-Q6", "src": "ECO 오답", "module": 6, "tag": "CART vs KNN 장점", "vig": 13, "stem": "Comparing two ML models that could be used to accomplish Step 3, which statement(s) best describe(s) the advantages of using Classification and Regression Trees (CART) instead of K-Nearest Neighbor (KNN)?\nStatement 1: For CART there is no requirement to specify an initial hyperparameter (like K).\nStatement 2: For CART there is no requirement to specify a similarity (or distance) measure.\nStatement 3: For CART the output provides a visual explanation for the prediction.", "opts": {"A": "Statement 1 only.", "B": "Statement 3 only.", "C": "Statements 1, 2, and 3."}, "ans": "C", "en": "CART has no requirement to specify an initial hyperparameter (like K) or a similarity (distance) measure as with KNN, and CART provides a visual explanation for the prediction (the features and cut-off values at each node).", "ko": "KNN은 k(하이퍼파라미터)와 거리(유사도) 척도를 정해야 하고 블랙박스에 가깝습니다. CART는 둘 다 필요 없고 트리로 예측 근거를 시각적으로 보여줍니다.", "trap": "세 문장 모두 CART 장점.", "f": "CART: no k, no distance measure, visual explanation", "why": {"A": "Statement 2(거리 척도 불필요)와 3(시각적 설명)도 CART의 장점입니다.", "B": "Statement 1(초기 하이퍼파라미터 불필요)과 2도 CART의 장점입니다."}, "orig": "ECO Module 6 Q6"}, {"id": "ECO-M6-Q13", "src": "ECO 오답", "module": 6, "tag": "비선형·복잡한 데이터 → 신경망", "vig": 14, "stem": "The most appropriate model for Martin to use in analyzing the responses to the risk tolerance questions is a:", "opts": {"A": "neural network (NN) model.", "B": "penalized regression model.", "C": "least absolute shrinkage and selection operator (LASSO) model."}, "ans": "A", "en": "The responses to the risk tolerance questions, while labeled data used in a classification analysis, appear to be non-linear (fear of loss increases at an increasing rate). Thus, an NN model would be the most appropriate choice. Penalized regression and LASSO are used for linear relationships.", "ko": "응답이 복잡·주관적이고 손실 공포가 '체증적으로' 커짐 → 비선형. 신경망은 비선형·복잡한 관계에 적합합니다. 벌점회귀(LASSO 포함)는 선형 모형입니다.", "trap": "'increase at an increasing rate' = 비선형 신호.", "f": "Nonlinear, complex → NN;  linear + many features → penalized regression", "why": {"B": "벌점회귀는 선형 데이터용 회귀 기법이라 비선형 응답에 맞지 않습니다.", "C": "LASSO도 벌점회귀의 일종으로 선형 관계를 가정합니다."}, "orig": "ECO Module 6 Q13"}, {"id": "ECO-M6-Q15", "src": "ECO 오답", "module": 6, "tag": "SVM은 이진 분류용 (연속 target X)", "vig": 15, "stem": "Stigwood's suggested algorithm is most likely:", "opts": {"A": "correct.", "B": "incorrect in regard to the continuous target variable.", "C": "incorrect in regard to the user define hyperparameter."}, "ans": "B", "en": "The support vector machine requires the target variable to be a binary classification variable. Firm valuation is a continuous variable, which makes the suggestion incorrect. SVM is a linear classifier that determines the hyperplane that optimally separates the observations into two sets of data points. Consistent with the suggestion, SVM does not require a user-defined hyperparameter.", "ko": "SVM = 두 집단을 가장 넓은 마진으로 나누는 선형 '분류기'. 기업가치(연속형) 예측에는 맞지 않습니다. 하이퍼파라미터가 필요 없다는 부분은 맞습니다.", "trap": "두 가지 이유 중 어느 쪽이 틀렸는지 구분.", "f": "SVM: binary classification, maximum margin", "why": {"A": "SVM은 이진 분류용이라 연속형 target(기업가치)에는 맞지 않습니다.", "C": "SVM은 사용자 지정 하이퍼파라미터가 필요 없다는 Stigwood의 말은 맞습니다. 틀린 것은 연속형 target 부분입니다."}, "orig": "ECO Module 6 Q15"}, {"id": "ECO-M6-Q16", "src": "ECO 오답", "module": 6, "tag": "LASSO = 벌점회귀", "vig": 15, "stem": "The algorithm suggested by Emerson is a:", "opts": {"A": "k-nearest neighbor algorithm.", "B": "penalized regression algorithm.", "C": "classification and regression tree algorithm."}, "ans": "B", "en": "A least absolute shrinkage and selection operator (LASSO) is a popular type of penalized regression algorithm.", "ko": "LASSO는 SSE와 함께 계수 절댓값 합에 벌점을 주는 벌점회귀입니다. 덜 중요한 특성의 계수를 0으로 만들어 간결한 모형을 만듭니다.", "trap": "", "f": "LASSO: min SSE + λΣ|b|", "why": {"A": "KNN에는 LASSO 벌점이 없습니다.", "C": "CART에는 LASSO 벌점이 없습니다(CART의 규제는 가지치기·최대 깊이)."}, "orig": "ECO Module 6 Q16"}, {"id": "ECO-M6-Q17", "src": "ECO 오답", "module": 6, "tag": "과적합 관리의 cost = in/out-of-sample 오차 차이", "vig": 15, "stem": "What is most likely the cost referenced by Emerson in regard to managing overfitting?", "opts": {"A": "The variance error less the base error", "B": "Computational time and resource expenses", "C": "The difference between the in- and out-of-sample error rates"}, "ans": "C", "en": "Data scientists express the trade-off between overfitting and generalization as a trade-off between cost (the difference between in- and out-of-sample error rates) and complexity.", "ko": "과적합 trade-off의 'cost' = in-sample 오차와 out-of-sample 오차의 차이. 복잡도가 커질수록 이 차이가 커집니다.", "trap": "'cost'를 일상적 의미(시간·비용)로 해석하는 함정.", "f": "Cost = out-of-sample error − in-sample error", "why": {"A": "variance error와 base error는 out-of-sample 오차의 구성요소일 뿐 cost의 정의가 아닙니다.", "B": "계산 시간·자원 비용을 말하는 것이 아닙니다."}, "orig": "ECO Module 6 Q17"}, {"id": "ECO-M6-Q21", "src": "ECO 오답", "module": 6, "tag": "Training 좋고 test 나쁨 → overfitting + variance error", "vig": 16, "stem": "White's first model is most likely subject to:", "opts": {"A": "overfitting and bias error.", "B": "underfitting and bias error.", "C": "overfitting and variance error."}, "ans": "C", "en": "The model performs well on the training data but not on new data, indicating overfitting. Variance error refers to how much the model's results change in response to new data from validation and test samples. Bias error refers to the degree to which a model fits the training data; here it is low.", "ko": "Bias error = training 데이터를 못 맞춤(underfitting). Variance error = training은 잘 맞추지만 새 데이터에서 성능 급락(overfitting). White의 모델은 후자입니다.", "trap": "overfitting과 bias error 짝짓기 함정.", "f": "Overfit → low bias, high variance;  Underfit → high bias", "why": {"A": "training 데이터 오차가 낮으므로 bias error는 낮습니다. overfitting은 variance error와 짝입니다.", "B": "underfitting은 training 데이터부터 못 맞추는 경우입니다."}, "orig": "ECO Module 6 Q21"}, {"id": "ECO-M6-Q22", "src": "ECO 오답", "module": 6, "tag": "하이퍼파라미터 없음 + 시각적 설명 → CART", "vig": 16, "stem": "Which of the following machine learning algorithms meets both of White's requirements?", "opts": {"A": "K-nearest neighbor", "B": "Support vector machine", "C": "Classification and regression tree"}, "ans": "C", "en": "CART makes no assumptions about the characteristics of the training data; regularization parameters can be added to avoid overfitting. CART also provides a visual explanation (and rationale) for the prediction. KNN requires the hyperparameter k and gives no visual explanation; SVM gives no visual explanation.", "ko": "요구 1(초기 하이퍼파라미터 불필요, 규제 추가 가능) + 요구 2(시각적 설명) → CART.", "trap": "SVM도 하이퍼파라미터가 필요 없지만 시각적 설명이 없음.", "f": "CART = visual tree + regularization(max depth, pruning)", "why": {"A": "KNN은 k(하이퍼파라미터)를 정해야 하고 시각적 설명도 없습니다.", "B": "SVM은 하이퍼파라미터가 필요 없지만 시각적 설명을 제공하지 않습니다."}, "orig": "ECO Module 6 Q22"}, {"id": "ECO-M6-Q24", "src": "ECO 오답", "module": 6, "tag": "예측 대상 = target", "vig": 17, "stem": "The Default_Status field is best described as:", "opts": {"A": "a feature.", "B": "the target.", "C": "the labeled data."}, "ans": "B", "en": "The Default_Status field is identified as the goal variable to be predicted by the model, which means it is the target variable. A feature is an independent variable; labeled data is the training data set used to train a supervised algorithm.", "ko": "모델이 예측하려는 '목표' 변수 = target(종속변수). feature = 독립변수, labeled data = target 값이 붙은 학습 데이터셋 전체.", "trap": "'레이블'이라는 단어에 끌려 labeled data를 고르는 함정.", "f": "Target = Y,  Features = X", "why": {"A": "feature는 target을 설명하는 독립변수입니다.", "C": "labeled data는 target 값이 붙어 있는 학습 데이터셋 전체를 말합니다."}, "orig": "ECO Module 6 Q24"}, {"id": "ECO-M6-Q26", "src": "ECO 오답", "module": 6, "tag": "경계선이 과도하게 꼬임 → overfitted", "vig": 17, "stem": "Based on Exhibit 1, the initial results can be best described as being:", "opts": {"A": "underfitted.", "B": "a good fit.", "C": "overfitted."}, "ans": "C", "en": "The model's predictive output, which is very non-linear, fits the training set too well and will not likely generalize well to new data, which is known as overfitting.", "ko": "학습 데이터의 점들을 거의 완벽히 가르도록 경계선이 복잡하게 꺾임 → 노이즈까지 학습 → 과적합.", "trap": "학습 데이터 오분류가 거의 없다 = 좋은 모델(X), 과적합 의심(O).", "f": "Good fit: 단순한 경계 + 패턴 없는 약간의 오분류", "why": {"A": "underfitting이면 경계가 단순(선형)하고 오분류가 많습니다.", "B": "good fit은 비교적 단순한 경계에 패턴 없는 약간의 오분류가 있는 모습입니다."}, "orig": "ECO Module 6 Q26"}, {"id": "ECO-M6-Q28", "src": "ECO 오답", "module": 6, "tag": "SVM – 관측치에서 가장 먼 경계", "vig": null, "stem": "Which of the following statements about the support vector machine algorithm is most accurate?", "opts": {"A": "Adding more training data away from the support vectors will affect the boundary", "B": "The algorithm determines the boundary that is the furthest away from all the observations", "C": "In soft margin classification, the discriminant boundary chosen minimizes the total error penalty regardless of margin width"}, "ans": "B", "en": "SVM maximizes the probability of making a correct prediction by determining the boundary that is the furthest away from all the observations. The margin is determined by the observations closest to the boundary (support vectors), so adding data away from them does not affect the boundary. Soft margin classification optimizes the trade-off between a wider margin and a lower total error penalty.", "ko": "SVM: 두 집단 사이 마진을 최대화하는 경계. 경계는 가장 가까운 관측치(support vectors)만으로 정해집니다. soft margin은 '넓은 마진 vs 오분류 벌점'의 균형을 맞춥니다.", "trap": "support vector에서 먼 데이터는 경계에 영향 없음.", "f": "Max margin; boundary set by support vectors only", "why": {"A": "경계는 support vector(가장 가까운 관측치)로만 결정되므로 멀리 있는 데이터 추가는 영향이 없습니다.", "C": "soft margin은 마진 폭과 오차 벌점의 trade-off를 최적화합니다. 마진을 무시하고 벌점만 최소화하지 않습니다."}, "orig": "ECO Module 6 Q28"}, {"id": "ECO-M6-Q30", "src": "ECO 오답", "module": 6, "tag": "활성화 함수 – sigmoid", "vig": null, "stem": "Which of the following statements about activation functions in neural networks is most accurate?", "opts": {"A": "The activation function is a linear function with output range from 0 to 1", "B": "The rectified linear unit takes on a value of 0 for a negative input and 1 for a positive input", "C": "For a sigmoidal (S-shaped) activation function, a positive total net input is transformed into an output closer to one than to zero"}, "ans": "C", "en": "For a sigmoidal activation function, a negative total net input is transformed into an output close to 0 (the node does not trigger), and a positive total net input is transformed into an output close to 1 (the node triggers). The activation function is characteristically non-linear. ReLU, f(x) = max(0, x), is 0 for negative input and equals the input (not 1) for positive input.", "ko": "활성화 함수는 비선형(예: S자 sigmoid, 출력 0~1). 양(+)의 순입력 → 1에 가까움, 음(−) → 0에 가까움. ReLU = max(0, x)로 양수 입력이면 입력값 그대로 출력합니다.", "trap": "ReLU 양수 출력이 1이라는 함정.", "f": "Sigmoid: (0, 1);  ReLU: max(0, x)", "why": {"A": "활성화 함수는 비선형(예: S자 sigmoid)입니다.", "B": "ReLU는 양수 입력일 때 1이 아니라 입력값 그대로를 출력합니다."}, "orig": "ECO Module 6 Q30"}, {"id": "VAR-M6-01", "src": "변형", "module": 6, "tag": "LASSO λ = 0 → OLS", "vig": null, "stem": "In a LASSO regression, if the penalty hyperparameter λ is set equal to zero, the resulting model is:", "opts": {"A": "equivalent to an ordinary least squares regression.", "B": "one in which all slope coefficients are forced to zero.", "C": "one that keeps only the single most predictive feature."}, "ans": "A", "en": "LASSO minimizes SSE plus λ times the sum of the absolute values of the slope coefficients. With λ = 0 there is no penalty, so the model reduces to OLS. Larger λ imposes stronger regularization and can shrink some coefficients to zero.", "ko": "λ = 0 → 벌점 없음 → OLS. λ가 작지만 0보다 크면 약한 규제, 클수록 강한 규제(일부 계수를 0으로).", "trap": "", "f": "LASSO: min [SSE + λΣ|bi|]", "why": {"B": "계수를 0으로 미는 것은 λ가 클 때입니다. λ = 0이면 벌점이 없습니다.", "C": "특성을 강하게 줄이는 것은 큰 λ일 때입니다."}, "orig": "변형 (오답노트 R3 LASSO λ, Schweser LOS 3.b)"}, {"id": "VAR-M6-02", "src": "변형", "module": 6, "tag": "Deep learning network – hidden layer 수", "vig": null, "stem": "Deep learning networks (DLNs) are best described as neural networks with:", "opts": {"A": "many hidden layers – at least 2, but often more than 20.", "B": "exactly one hidden layer with many nodes.", "C": "no hidden layers, connecting inputs directly to the output layer."}, "ans": "A", "en": "Deep learning networks are neural networks with many hidden layers (at least 2, but often more than 20). DLNs are often used for image, pattern, and character recognition.", "ko": "DLN = hidden layer가 많은 신경망(최소 2개, 보통 20개 이상). 이미지·패턴·문자 인식에 쓰입니다.", "trap": "", "f": "DLN: hidden layers ≥ 2 (often > 20)", "why": {"B": "hidden layer가 하나면 일반 신경망이지 deep learning이 아닙니다.", "C": "hidden layer가 없으면 신경망의 핵심 구조가 없는 것입니다."}, "orig": "변형 (오답노트 R3 NN hidden layer, Schweser LOS 3.c)"}, {"id": "VAR-M6-03", "src": "변형", "module": 6, "tag": "CART 규제 – 가지치기(pruning)", "vig": null, "stem": "Which of the following is most likely used to reduce overfitting in a classification and regression tree (CART)?", "opts": {"A": "Pruning sections of the tree that have minimal explanatory power.", "B": "Increasing the maximum tree depth.", "C": "Specifying the number of nearest neighbors, k."}, "ans": "A", "en": "To avoid overfitting in CART, regularization criteria such as maximum tree depth and maximum number of decision nodes are specified by the researcher. Alternatively, sections of the tree with minimal explanatory power are pruned.", "ko": "CART 과적합 방지 = 규제: 최대 깊이·최대 노드 수 제한, 또는 설명력이 작은 가지를 잘라냄(pruning).", "trap": "최대 깊이를 '늘리면' 오히려 복잡해짐.", "f": "CART regularization: max depth, pruning", "why": {"B": "깊이를 늘리면 트리가 더 복잡해져 과적합이 심해집니다.", "C": "k는 KNN(또는 K-means)의 하이퍼파라미터입니다."}, "orig": "변형 (오답노트 R3 regression tree pruning, Schweser LOS 3.b)"}, {"id": "VAR-M6-04", "src": "변형", "module": 6, "tag": "높은 in-sample 오차 → underfitting (bias error)", "vig": null, "stem": "A model has high error rates in the training sample, and as the training sample grows, its in-sample and out-of-sample accuracy rates converge but remain far below the desired level. The model most likely suffers from:", "opts": {"A": "overfitting and high variance error.", "B": "underfitting and high bias error.", "C": "a good fit with only base error."}, "ans": "B", "en": "Bias error is the in-sample error resulting from models with a poor fit. Models with high bias error see the in-sample and out-of-sample error rates converge, but far below the desired accuracy level – underfitting.", "ko": "Bias error = training 데이터부터 잘 못 맞춤(underfitting, 너무 단순). Variance error = training은 잘 맞추지만 새 데이터에서 성능 급락(overfitting).", "trap": "", "f": "Underfit → high bias;  Overfit → high variance", "why": {"A": "과적합이면 in-sample 정확도는 높고 out-of-sample만 크게 뒤처집니다.", "C": "정확도가 목표보다 훨씬 낮으므로 good fit이 아닙니다."}, "orig": "변형 (오답노트 R3 bias error → underfitting, Schweser LOS 3.a)"}, {"id": "ECO-M7-Q5", "src": "ECO 오답", "module": 7, "tag": "데이터 변환 – Extraction", "vig": 18, "stem": "During the preprocessing of the data in Exhibit 1, what type of data transformation did Steele perform during the data preprocessing step?", "opts": {"A": "Extraction", "B": "Conversion", "C": "Aggregation"}, "ans": "A", "en": "Steele created a new \"Age\" variable from the firm's IPO date and a new \"Interest Coverage Ratio\" variable (EBIT/interest expense). Extraction refers to a transformation where a new variable is extracted from a current variable, such as creating an age variable from a date variable or a ratio variable. Deleting the IPO Date column is a selection transformation.", "ko": "Schweser 데이터 변환 5종: Extraction(기존 변수에서 새 변수 생성, 예: 날짜→나이), Aggregation(관련 변수 둘을 가중 합쳐 하나로), Filtration(불필요한 '관측치(행)' 제거), Selection(불필요한 '특성(열)' 제거), Conversion(명목·순서 등 데이터 형식 변환).", "trap": "IPO Date → Age는 '형식 변환'(conversion)이 아니라 새 변수 추출.", "f": "Extraction / Aggregation / Filtration / Selection / Conversion", "why": {"B": "Conversion은 서로 다른 데이터 유형(명목·순서 등)을 바꾸는 것입니다. 나이·비율 변수 생성은 extraction입니다.", "C": "Aggregation은 관련된 두 변수를 가중치로 합쳐 하나로 만드는 것입니다."}, "orig": "ECO Module 7 Q5"}, {"id": "ECO-M7-Q6", "src": "ECO 오답", "module": 7, "tag": "정규화(normalization) 계산", "vig": 18, "stem": "Based on Exhibit 1, for the firm with ID #3, Steele should compute the scaled value for the \"Interest Expense\" variable as:", "opts": {"A": "0.008.", "B": "0.083.", "C": "0.250."}, "ans": "B", "en": "Normalization rescales a variable to the range [0, 1]: (Xi − Xmin)/(Xmax − Xmin). For ID #3, interest expense = 1.2, so (1.2 − 0.2)/(12.2 − 0.2) = 1.0/12.0 = 0.083.", "ko": "정규화 = (X − 최솟값)/(최댓값 − 최솟값) → 0~1. 표준화 = (X − 평균)/표준편차 → 평균 0, 표준편차 1. Steele은 정규화를 씁니다.", "trap": "표준화((1.2 − 1.1)/0.4 = 0.25)와 혼동.", "f": "Normalized = (X − Xmin)/(Xmax − Xmin)", "why": {"A": "공식을 잘못 적용한 값입니다. (1.2 − 0.2)/(12.2 − 0.2) = 0.083입니다.", "C": "표준화 (1.2 − 1.1)/0.4 = 0.25를 계산했습니다. Steele은 정규화를 사용합니다."}, "orig": "ECO Module 7 Q6"}, {"id": "ECO-M7-Q10", "src": "ECO 오답", "module": 7, "tag": "단어 빈도 시각화 → word cloud", "vig": 18, "stem": "Given her objective, the visualization that Steele should create in the exploratory data analysis step is a:", "opts": {"A": "scatter plot.", "B": "word cloud.", "C": "document term matrix."}, "ans": "B", "en": "A word cloud is a common visualization for text data that shows the most informative words and their TF values; higher-frequency words are shown in larger font, and color can add dimensions such as frequency and length of words.", "ko": "텍스트 EDA에서 단어 빈도를 글자 크기로 보여주는 시각화 = word cloud. DTM은 시각화가 아니라 문서×토큰 행렬(구조화 데이터)입니다.", "trap": "DTM을 시각화로 착각.", "f": "Word cloud: 빈도 ↑ → 글자 크기 ↑", "why": {"A": "scatter plot은 두 수치 변수의 관계를 보는 구조화 데이터용 시각화입니다.", "C": "DTM은 텍스트를 구조화한 행렬이지 시각화가 아닙니다."}, "orig": "ECO Module 7 Q10"}, {"id": "ECO-M7-Q18", "src": "ECO 오답", "module": 7, "tag": "텍스트 정제·가공 완료 토큰 (stemming, n-gram)", "vig": 19, "stem": "Based on Exhibit 1, which token group has most likely undergone the text preparation and wrangling process?", "opts": {"A": "Token Group 1", "B": "Token Group 2", "C": "Token Group 3"}, "ans": "A", "en": "Token Group 1 includes n-grams (\"not_increas_market,\" \"sale_decreas\"), words converted from inflected forms into their base word (stemming: \"increas,\" \"decreas\"), and the currency symbol replaced with
