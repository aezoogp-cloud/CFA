, Consol-Can, operates solely in Canada. It was created on 31 December 20X1, and Consolidated Motors determined at that time that it should use the US dollar as its functional currency.\n\nChief Financial Officer Monica Templeton was asked to explain to the board of directors how exchange rates affect the financial statements of both Consol-Can and the consolidated financial statements of Consolidated Motors. For the presentation, Templeton collects Consol-Can’s balance sheets for the years ended 20X1 and 20X2 (Exhibit 1), as well as relevant exchange rate information (Exhibit 2).\n\nExhibit 1\nConsol-Can Condensed Balance Sheet for Fiscal Years Ending 31 December (C$ millions)\nAccount\t20X2\t \t20X1\nCash\t135\t \t167\nAccounts receivable\t98\t \t—\nInventory\t77\t \t30\nFixed assets\t100\t \t100\nAccumulated depreciation\t(10)\t \t—\nTotal assets\t400\t \t297\nAccounts payable\t77\t \t22\nLong-term debt\t175\t \t175\nCommon stock\t100\t \t100\nRetained earnings\t48\t \t—\nTotal liabilities and shareholders’ equity\t400\t \t297\nExhibit 2\nExchange Rate Information\n \tUS$/C$\nRate on 31 December 20X1\t0.86\nAverage rate in 20X2\t0.92\nWeighted-average rate for inventory purchases\t0.92\nRate on 31 December 20X2\t0.95\nTempleton explains that Consol-Can uses the FIFO inventory accounting method and that purchases of C$300 million and the sell-through of that inventory occurred evenly throughout 20X2. Her presentation includes reporting the translated amounts in US dollars for each item, as well as associated translation-related gains and losses. The board responds with several questions.\n\nWould there be a reason to change the functional currency to the Canadian dollar?\n\nWould there be any translation effects for Consolidated Motors if the functional currency for Consol-Can were changed to the Canadian dollar?\n\nWould a change in the functional currency have any impact on financial statement ratios for the parent company?\n\nWhat would be the balance sheet exposure to translation effects if the functional currency were changed?", "Redline Products, Inc. is a US-based multinational with subsidiaries around the world. One such subsidiary, Acceletron, operates in Singapore, which has seen mild but not excessive rates of inflation. Acceletron was acquired in 2000 and has never paid a dividend. It records inventory using the FIFO method.\n\nChief Financial Officer Margot Villiers was asked by Redline’s board of directors to explain how the functional currency selection and other accounting choices affect Redline’s consolidated financial statements. Villiers gathers Acceletron’s financial statements denominated in Singapore dollars (SGD) in Exhibit 1 and the US dollar/Singapore dollar exchange rates in Exhibit 2. She does not intend to identify the functional currency actually in use but rather to use Acceletron as an example of how the choice of functional currency affects the consolidated statements.\n\nExhibit 1\nSelected Financial Data for Acceletron, 31 December 2007 (SGD millions)\nCash\tSGD125\nAccounts receivable\t230\nInventory\t500\nFixed assets\t1,640\nAccumulated depreciation\t(205)\nTotal assets\tSGD2,290\nAccounts payable\t185\nLong-term debt\t200\nCommon stock\t620\nRetained earnings\t1,285\nTotal liabilities and equity\t2,290\nTotal revenues\tSGD4,800\nNet income\tSGD450\nExhibit 2\nExchange Rates Applicable to Acceletron\nExchange Rate in Effect at Specific Times\tUSD per SGD\nRate when first SGD1 billion of fixed assets were acquired\t0.568\nRate when remaining SGD640 million of fixed assets were acquired\t0.606\nRate when long-term debt was issued\t0.588\n31 December 2006\t0.649\nWeighted-average rate when inventory was acquired\t0.654\nAverage rate in 2007\t0.662\n31 December 2007\t0.671", "Mark Crawley is an analyst at a London-based private equity firm and is reviewing the firm’s file on Thames Air Plc (Thames), a company it provides financing for. Thames uses International Financial Reporting Standards (IFRS) in the preparation of its financial statements. Thames is a relatively new airline based in the United Kingdom specializing in flights and vacation packages to Mediterranean locations, primarily Spain. Thames sells most of its flights and vacation packages to British residents in British pounds (GBP) and considers the costs of local competitors’ packages when determining its prices. Costs are incurred in multiple currencies:\n\nWage costs are primarily in GBP.\nTypical of the industry, airline fuel and lease costs are normally priced in US dollars (USD).\nThe landing fees paid at the vacation-area airports are in the local currency, primarily euros (EUR).\nFirst, Crawley turns his attention to the effect of the transactions undertaken in various currencies by Thames.\n\nHe reviews the change in the exchange rate for the USD to GBP during 2015, shown in Exhibit 1, and wonders what the effect of this change was on Thames’s operating income.\nAt year-end (31 December), Thames had a large outstanding payable in Spain related to landing fees that were incurred there evenly over the final quarter. The company paid the amount in full on its due date of 28 February. Crawley observed that the EUR to GBP exchange rate had changed between when the costs were incurred and the year-end and again by the payment date, as also shown in Exhibit 1.\nExhibit 1 Selected Exchange Rate Data\n\n \tGBP/USD Close\tGBP/EUR Close\n1-Jan-15\t0.64\t---\n30-Jun-15\t---\t0.72\n31-Dec-15\t0.68\t0.75\n28-Feb-16\t---\t0.73\nAverage, 1 July–31 December 2015\t---\t0.7325\nAverage, 1 October–31 December 2015\t---\t0.74\nBecause of the growing demand for vacation rentals in Spain during the past year, Thames acquired 100% of Tagus SA (Tagus), a Spanish company that owns a small vacation hotel and a few villas. Tagus has long-term debt outstanding from a Spanish bank that financed the 2012 purchase of the vacation properties, which will now be rented as part of the vacation packages offered by Thames. Tagus incurs all costs related to operating and maintaining the rental properties in EUR.\n\nSince the acquisition, all of Tagus’s revenue comes from Thames’s sales in Britain of the vacation packages. Tagus receives the amounts in GBP. But Tagus hopes to expand and start renting out any excess capacity of the properties, or newly acquired properties, to local tourists in the next few years. Crawley notices that Thames is using the temporal method to translate Tagus’s financial statements prior to consolidation and asks another analyst, Dee Chopra, if this is appropriate.\n\nCrawley next reviews the information in Exhibit 2 related to the Tagus acquisition to consider the effect on Thames’s year-end financial statements (31 December 2015).\n\nExhibit 2 Selected Financial Information of Tagus SA at Acquisition and Year-End (EUR thousands)\n\n \tBalance Sheet\tIncome Statement\n \tDate of Acquisition (30 June 2015)\tYear-End (31 December 2015)\tSix-Month Period Ending 31 December 2015\nCash and accounts receivable\t4,000\t4,200\tRevenues\t8,200\nInventory\t2,000\t2,250\tOperating costs\t6,485\nCapital assets\t15,000\t14,625\tOperating income\t1,715\nTotal assets\t21,000\t21,075\tInterest expense\t395\n \tEarnings before taxes\t1,320\nCurrent liabilities\t3,500\t3,400\tIncome taxes\t395\nLong-term debt\t10,000\t9,750\tEarnings after tax\t925\nShare capital\t5,000\t5,000\t \n \tDividends\t500\nRetained earnings\t2,500\t2,925\t \nAs the final step in his review, Crawley starts a ratio analysis of Thames and Tagus, and he asks Chopra which ratios, if any, would be unaffected by Thames’s choice of translation method for Tagus.", "Claus Petersen, a pension fund equity analyst, is preparing an analysis of Rhine AG for the upcoming quarterly fund meeting. Rhine is a Germany-based manufacturer that operates three distinct divisions: children’s products (infant car seats, strollers, cribs, etc.), recreational products (bicycles, bicycle trailers, etc.), and home furnishings (contemporary furniture). All three divisions sell through retail outlets around the world.\n\nThe company has been pursuing an aggressive growth strategy, achieved through both foreign acquisitions and organic growth. Petersen is interested in determining how well Rhine is allocating its resources between the three divisions and the effects of the foreign acquisitions on overall performance. Exhibit 1 summarizes selected divisional and corporate data for the current year and the prior year.\n\nExhibit 1 Rhine AG Selected Divisional and Corporate Data (€ millions)\n \tTotal for Three Divisions\tChildren's Products\tRecreational Products\tHome Furnishings\n \tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\nRevenues\t2,837.1\t2,775.5\t1,176.2\t1,236.2\t1,034.1\t930.0\t626.8\t609.3\nGross profit\t621.4\t640.8\t296.6\t337.6\t246.0\t220.3\t78.8\t82.9\nOperating profit\t172.7\t219.4\t64.7\t115.7\t72.9\t62.2\t35.1\t41.5\nEarnings before taxes (EBT)\t136.6\t170.0\t---\t---\t---\t---\t---\t---\nNet earnings after tax\t109.9\t132.3\t---\t---\t---\t---\t---\t---\nTotal assets\t2,498.0\t2,479.5\t1,270.9\t1,249.6\t961.5\t948.5\t265.6\t281.4\nCapital expenditures\t32.7\t42.3\t22.1\t30.0\t6.7\t8.6\t3.9\t3.7\nProportion of capital expenditures\t100%\t100%\t67.6%\t70.9%\t20.5%\t20.3%\t11.9%\t8.7%\nProportion of total assets\t100%\t100%\t50.9%\t50.4%\t38.5%\t38.3%\t10.6%\t11.3%\nPetersen’s preferred method to determine which division is becoming less significant over time is to review the relationship between capital expenditures and total assets by operating division. He plans to base his conclusion on the assumption that the current year's investment behavior is representative of future investment patterns.\n\nPetersen knows that revenues in the children’s products division have suffered because of declining birth rates in Europe and North America, but he believes that if Rhine can maintain the operating margin for this division then overall company profitability should not be affected.\n\nCorinna Berg, another analyst with the fund, reminds Petersen that during the current year, the US dollar weakened against the euro by 4% and that 50% of the sales in the recreational products division are sold in the United States.\n\nPetersen recalls that some of the recent global expansion was aimed at establishing operations in Ireland because its statutory corporate tax rate is lower than the German rate of 29.8%. If Petersen assumes that other tax credits were the same in the current year as the prior year, he can analyze changes in Rhine’s effective tax rate to determine whether the geographic mix of the company’s profits has changed in the current year.\n\nPetersen finally examines the company’s liquidity ratios, which are shown in Exhibit 2. Even though the company’s current and quick ratio have improved, his interpretation of the changes in the company’s cash conversion cycle is that the company’s liquidity position has deteriorated.\n\nExhibit 2 Rhine AG Selected Ratios\n\nRatio\tCurrent Year\tPrior Year\t2 Years Prior\nCurrent ratio\t2.31\t2.17\t1.16\nQuick ratio\t1.06\t0.89\t0.53\nAccounts receivable turnover\t5.82\t6.08\t6.11\nInventory turnover\t3.78\t3.91\t4.09\nAccounts payable turnover\t5.71\t5.78\t5.60\nCash conversion cycle\t95 days\t90 days\t84 days\nWorried that the balance sheet–based and cash flow–based accruals ratios (not shown) raise some concerns about the possible use of accruals to manage earnings, Petersen asks Berg for advice on what further type of analysis he should do as a follow-up on this issue.", "Sunjet Airlines Ltd. (Sunjet), a US-based “no frills” carrier, has the following existing non-domestic operations.\n\nNanuk Air Inc. (Nanuk) is a Canadian carrier that Sunjet purchased several years ago. It provides service to remote mining operations in the Canadian north. The company has been very profitable, and it recently financed a renewal of its fleet of seaplanes with CAD-denominated long-term debt.\n\nSunjet Mexico SA (SunMex) was established on 1 April 2016 to facilitate expansion of the Sunjet network to six Mexican destinations. The company purchased hangar assets in Mexico that were 100% financed with MXN-denominated loans guaranteed by Sunjet, and operations began shortly thereafter. Although most of SunMex’s revenues are generated in the US vacation travel market, the company also serves domestic Mexican passengers. These MXN-denominated sales amounted to approximately 10% of SunMex’s fiscal 2016–17 revenues, and they are expected to remain below 15% in the future.\n\nToday is 30 April 2017, one month after Sunjet’s fiscal year end, and the CEO, Mark Napier, is meeting with the CFO, Lisa Cameron, to discuss the international operations. Napier mentions that he will be meeting next week with the president of SunMex to discuss the first year of operations. Cameron pulls out the draft year-end results (Exhibit 1) and some exchange rate data (Exhibit 2). She notes that the SunMex president’s bonus is tied to fixed asset turnover and net income targets. She reminds Napier that the bonus thresholds are evaluated based on the translated USD-denominated financial statements rather than the MXN-denominated ones, and she promises to send the translated version once the results are finalized.\n\nExhibit 1 Summarized Draft Financial Statements for SunMex, Fiscal 2016–17 (MXN millions)\n\nCash and accounts receivable\t47\nFixed assets (net)\t370\nTotal assets\t417\n \nCurrent liabilities\t33\nLong-term debt\t224\nCommon shares\t160\nRetained earnings\t0\nTotal liabilities and shareholders’ equity\t417\n \nSales\t140\nDepreciation expense\t20\nOther expenses\t120\nTax expense\t0\nNet income\t0\nExhibit 2 Selected Exchange Rates\n\n \tUSD per MXN\tCAD per USD\n31 March 2017\t0.0513\t1.352\nAverage for fiscal 2016–17\t0.0538\t1.340\n1 June 2016\t0.0625\t1.300\n31 March 2016\t0.0625\t1.303\nAverage for fiscal 2015–16\t0.0855\t1.312\nNanuk, which prepares its translated statements using the current rate method, is next on the agenda. Cameron reports that annual translated USD-equivalent sales are up from 22.3 million last year to 23.7 million this year. Cameron reminds Napier that one of the performance metrics in the bonus calculation for Nanuk’s president is Nanuk’s sales growth determined in the local currency. Napier asks Cameron to calculate that figure for the 2016–17 fiscal year.\n\nNapier also asks Cameron what effect Nanuk’s translated statements will have on Sunjet’s other comprehensive income for the current year.", "Viktoria Smith is a recently hired junior analyst at Aries Investments. Smith and her supervisor, Ingrid Johansson, meet to discuss some of the firm’s investments in banks and insurance companies.\n\nJohansson asks Smith to explain why the evaluation of banks is different from the evaluation of non-financial companies. Smith tells Johansson the following:\n\nStatement 1:\nAs intermediaries, banks are more likely to be systemically important than non-financial companies.\n\nStatement 2:\nThe assets of banks mostly consist of deposits, which are exposed to different risks than the tangible assets of non-financial companies.\n\nSmith and Johansson also discuss key aspects of financial regulations, particularly the framework of Basel III. Johansson tells Smith:\n\n“Basel III specifies the minimum percentage of its risk-weighted assets that a bank must fund with equity. This requirement of Basel III prevents a bank from assuming so much financial leverage that it is unable to withstand loan losses or asset write-downs.”\n\nJohansson tells Smith that she uses the CAMELS approach to evaluate banks, even though it has some limitations. To evaluate P&C insurance companies, Johansson tells Smith that she places emphasis on the efficiency of spending on obtaining new premiums. Johansson and Smith discuss differences between P&C and L&H insurance companies. Smith notes the following differences:\n\nDifference 1:\nL&H insurers’ claims are more predictable than P&C insurers’ claims.\n\nDifference 2:\nP&C insurers’ policies are usually short term, whereas L&H insurers’ policies are usually longer term.\n\nDifference 3:\nRelative to L&H insurers, P&C insurers often have lower capital requirements and can also seek higher returns offered by riskier investments.\n\nJohansson asks Smith to review key performance ratios for three P&C insurers in which Aries is invested. The ratios are presented in Exhibit 1.\n\nExhibit 1\nKey Performance Ratios for Selected P&C Insurers\n \tInsurer A\tInsurer B\tInsurer C\nLoss and loss adjustment expense ratio\t68.8%\t65.9%\t64.1%\nUnderwriting expense ratio\t33.7%\t37.8%\t32.9%\nCombined ratio\t102.5%\t103.7%\t97.0%\nJohansson also asks Smith to review key performance ratios for ABC Bank, a bank in which Aries is invested. The ratios are presented in Exhibit 2.\n\nExhibit 2\nKey Performance Ratios for ABC Bank*\n \t2017\t2016\t2015\nCommon equity Tier 1 capital ratio\t10.7%\t11.5%\t12.1%\nTier 1 capital ratio\t11.5%\t12.6%\t13.4%\nTotal capital ratio\t14.9%\t14.8%\t14.9%\nLiquidity coverage ratio\t123.6%\t121.4%\t119.1%\nNet stable funding ratio\t114.9%\t113.2%\t112.7%\nTotal trading VaR (all market risk factors)\t$11\t$13\t$15\nTotal trading and credit portfolio VaR\t$15\t$18\t$21\n* Note: VaR amounts are in millions and are based on a 99% confidence interval and a single-day holding period.", "Judith Yoo is a financial sector analyst writing an industry report. In the report, Yoo discusses the relative global systemic risk across industries, referencing Industry A (international property and casualty insurance), Industry B (credit unions), and Industry C (global commercial banks).\n\nPart of Yoo’s analysis focuses on Company XYZ, a global commercial bank, and its CAMELS rating, risk management practices, and performance. First, Yoo considers the firm’s capital adequacy as measured by the key capital ratios (common equity Tier 1 capital, total Tier 1 capital, and total capital) in Exhibit 1.\n\nExhibit 1\nCompany XYZ: Excerpt from Annual Report Disclosure\nAt 31 December\t2017\t2016\t2015\nRegulatory capital\t$m\t$m\t$m\n   Common equity Tier 1 capital\t146,424\t142,367\t137,100\n   Additional Tier 1 capital\t22,639\t20,443\t17,600\n   Tier 2 capital\t22,456\t27,564\t38,200\n   Total regulatory capital\t191,519\t190,374\t192,900\n \t \t \t \nRisk-weighted assets (RWAs) by risk type\t \t \t \n   Credit risk\t960,763\t989,639\t968,600\n   Market risk\t44,100\t36,910\t49,600\n   Operational risk\t293,825\t256,300\t224,300\nTotal RWAs\t1,298,688\t1,282,849\t1,242,500\nYoo turns her attention to Company XYZ’s asset quality using the information in Exhibit 2.\n\nExhibit 2\nCompany XYZ: Asset Composition\nAt 31 December\t2017\t2016\t2015\n \t$m\t$m\t$m\nTotal liquid assets\t361,164\t354,056\t356,255\nInvestments\t434,256\t367,158\t332,461\nConsumer loans\t456,957\t450,576\t447,493\nCommercial loans\t499,647\t452,983\t403,058\nGoodwill\t26,693\t26,529\t25,705\nOther assets\t151,737\t144,210\t121,780\nTotal assets\t1,930,454\t1,795,512\t1,686,752\nTo assess Company XYZ’s risk management practices, Yoo reviews the consumer loan credit quality profile in Exhibit 3 and the loan loss analysis in Exhibit 4.\n\nExhibit 3\nCompany XYZ: Consumer Loan Profile by Credit Quality\nAt 31 December\t2017\t2016\t2015\n \t$m\t$m\t$m\n   Strong credit quality\t338,948\t327,345\t320,340\n   Good credit quality\t52,649\t54,515\t54,050\n   Satisfactory credit quality\t51,124\t55,311\t56,409\n   Substandard credit quality\t23,696\t24,893\t27,525\n   Past due but not impaired\t2,823\t2,314\t2,058\n   Impaired\t8,804\t9,345\t10,235\nTotal gross amount\t478,044\t473,723\t470,617\n   Impairment allowances\t−5,500\t−4,500\t−4,000\nTotal\t472,544\t469,223\t466,617\nExhibit 4\nCompany XYZ: Loan Loss Analysis Data\nAt 31 December\t2017\t2016\t2015\n \t$m\t$m\t$m\nConsumer loans\t \t \t \n   Allowance for loan losses\t11,000\t11,500\t13,000\n   Provision for loan losses\t3,000\t2,000\t1,300\n   Charge-offs\t3,759\t3,643\t4,007\n   Recoveries\t1,299\t1,138\t1,106\n   Net charge-offs\t2,460\t2,505\t2,901\nCommercial loans\t \t \t \n   Allowance for loan losses\t1,540\t1,012\t169\n   Provision for loan losses\t1,100\t442\t95\n   Charge-offs\t1,488\t811\t717\n   Recoveries\t428\t424\t673\n   Net charge-offs\t1,060\t387\t44\nFinally, Yoo notes the following supplementary information from Company XYZ’s annual report:\n\nCompetition in the commercial loan space has become increasingly fierce, leading XYZ managers to pursue higher-risk strategies to increase market share.\n\nThe net benefit plan obligation has steadily decreased during the last three years.\n\nCompany XYZ awards above-average equity-based compensation to its top managers.", "Ivan Paulinic, an analyst at a large wealth management firm, meets with his supervisor to discuss adding financial institution equity securities to client portfolios. Paulinic focuses on Vermillion Insurance (Vermillion), a property and casualty company, and Cobalt Life Insurance (Cobalt). To evaluate Vermillion further, Paulinic compiles the information presented in Exhibit 1.\n\nExhibit 1\nSelect Financial Ratios for Vermillion Insurance\nRatio\t2017\t2016\nLoss and loss adjustment expense\t59.1%\t61.3%\nUnderwriting expense\t36.3%\t35.8%\nCombined\t95.4%\t97.1%\nDividend\t2.8%\t2.6%\nIn addition to the insurance companies, Paulinic gathers data on three national banks that meet initial selection criteria but require further review. This information is shown in Exhibits 2, 3, and 4.\n\nExhibit 2\nSelect Balance Sheet Data for National Banks—Trading: Contribution to Total Revenues\nBank\t2017\t2013\t2009\t2005\nN-bank\t4.2%\t7.0%\t10.1%\t8.9%\nR-bank\t8.3%\t9.1%\t17.0%\t7.9%\nT-bank\t5.0%\t5.0%\t11.9%\t6.8%\nFocusing on N-bank and T-bank, Paulinic prepares the following data.\n\nExhibit 3\n2017 Select Data for N-bank and T-bank\n \tN-bank\t \tT-bank\n \t2017\t2016\t \t2017\t2016\nAverage daily trading VaR ($ millions)\t11.3\t12.6\t \t21.4\t20.5\nAnnual trading revenue/average daily trading VaR\t160×\t134×\t \t80×\t80×\nPaulinic investigates R-bank’s risk management practices with respect to the use of credit derivatives to enhance earnings, following the 2008 financial crisis. Exhibit 4 displays R-bank’s exposure over the last decade to credit derivatives not classified as hedges.\n\nExhibit 4\n  R-bank’s Exposure to Freestanding Credit Derivatives\nCredit Derivative Balances\t2017\t2012\t2007\nNotional amount ($ billions)\t13.4\t15.5\t305.1\nAll of the national banks under consideration primarily make long-term loans and source a significant portion of their funding from retail deposits. Paulinic and the rest of the research team note that the central bank is unwinding a long period of monetary easing as evidenced by two recent increases in the overnight funding rate. Paulinic informs his supervisor that:\n\nStatement 1:\nGiven the recently reported stronger-than-anticipated macroeconomic data, there is an imminent risk that the yield curve will invert.\n\nStatement 2:\nN-bank is very active in the 30-day reverse repurchase agreement market during times when the bank experiences significant increases in retail deposits.", "Mindy Chen manages a global equity portfolio for First Dawn Investment Management. Chen analyzes Great White North Bank (GWNB) for possible inclusion in the portfolio. Chen uses the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) approach with an emphasis on capital adequacy and asset quality.\n\nChen begins her analysis by assessing GWNB's capital adequacy using the data in Exhibit 1.\n\nExhibit 1 (in USD millions)\n\nRegulatory Capital and Risk-Weighted Assets\tCurrent Year\tPrior Year\nCommon Equity Tier 1 capital\t17,252\t14,783\nAdditional Tier 1 Capital\t1,879\t1,927\nTier 2 Capital\t1,554\t988\nRisk-weighted assets\t218,617\t212,587\nChen recalls that the minimum total capital ratio under Basel III is 8%. Chen then analyzes GWNB's asset quality using the data in Exhibit 2.\n\nExhibit 2 (in USD millions)\n\nAssets\tCurrent Year\tPrior Year\nLiquid assets\t62,809\t41,474\nInvestments\t14,602\t14,481\nLoans\t211,537\t220,828\nAllowance for loan losses\t\n17,500\n\n18,600\nTangible assets\t32,180\t\n32,405\n\nIntangible assets\t13,798\t13,482\nDeferred tax assets\t4,897\t4,735\nTotal assets\t357,323\t346,005\nChen considers the proportionate increases in the following income statement items and how they would impact GWNB's CAMELS rating:\n\nItem 1: Trading income\nItem 2: Service income\nItem 3: Net interest income", "Matthew Green, a research analyst, is asked to evaluate the performance of Second National Bank (SNB), a US commercial bank. Green prepares a research report to support his recommendation. \n\nGreen notices that SNB's CEO was appointed 18 months ago. Previously, the CEO was the president of a non-profit, non-public depository institution that offered a comparable selection of deposits, loans, and mortgages as SNB.\n\nGreen includes the following Basel III highlights in his research report:\n\nHighlight 1 : Basel III specifies the minimum percentage of its risk-weighted assets that a bank must fund with equity capital. \nHighlight 2 : Basel III specifies that a bank must hold enough high-quality liquid assets to cover its liquidity needs in a 30-day liquidity stress scenario. \nHighlight 3 : Basel III requires a bank to have a minimum amount of stable funding relative to the bank's liquidity needs in a 90-day liquidity stress scenario. \nTo assess the ability of SNB to meet Basel III minimum capital requirements, Green calculates SNB's Total Tier 1 Capital. Green reviews the latest financial disclosures, and includes retained earnings, accumulated other comprehensive income, and all instruments with a fixed maturity that are subordinate to depositors in his calculation.\n\nGreen notices that the allowance for loan losses decreased year over year as a result of a recovery of a prior fiscal year charge-off. Green calculates several comparative ratios to assess the quality of the allowance for loan losses.", "Aiko Takahashi works as a senior examiner for the Financial Institutions Agency (FIA), and Haruto Suzuki is one of the analysts who reports to her. Suzuki is a new hire who previously worked at an investment firm that specialized in manufacturing companies. His first two weeks at the FIA were spent in training sessions focused on the Basel III regulatory framework for banks to prepare him for his new analyst role.\n\nAt today’s weekly meeting, Takahashi and her analysts are conducting a preliminary review of some of their assigned insurance institutions. Suzuki arrives early, so Takahashi takes the opportunity to ask him to explain his understanding of the Basel III framework. Suzuki describes three enhancements that Basel III incorporated as part of its transition from the previous iteration:\n\nEnhancement 1: Additional measures to ensure sufficient earnings quality, thereby strengthening banks’ regulatory capital.\nEnhancement 2: More stringent capital requirements that prevent banks from taking on excessive financial leverage.\nEnhancement 3: Increased funding stability by giving preference to interbank deposits over those from consumers.\nThe other analysts arrive, and the meeting gets underway. The group is scheduled to review two insurance companies: Yatabe Holdings (YH) and Sapporo Hoken (SH). Takahashi focuses first on YH, a property and casualty insurer. Takahashi notes that the property and casualty market has been in a “hard” phase for a few years now, and she wonders whether the results will show the beginning of a cyclical shift.\n\nThe group reviews YH’s profitability information that Suzuki has provided in Exhibit 1. Takahashi asks Suzuki to calculate YH’s combined ratio:\n\nExhibit 1 Excerpts from YH’s Financial Statements\n\n(¥ billions)\t \nLoss expense and loss adjustment expense\t38,467\nNet premiums earned\t62,939\nNet premiums written\t49,241\nUnderwriting expense\t23,960\nGlancing at her watch, Takahashi notes that they don’t have enough time to look at SH. She comments that SH has a lot of international business and suggests they finish this discussion at next week’s meeting.", "Suri Reddy, a junior equity analyst at Sutton Management Inc. (Sutton), is currently on rotation in the Financial Institutions sub-group at Sutton to assist in the evaluation of First West Bank (First West), a small regional bank in the northwestern United States.\n\nIn preparation for her first meeting with her new team, Reddy makes the following notes about how she thinks banks differ from the industrial companies on which she usually works.\n\nBanks will have fewer tangible assets.\nBank assets are predominantly measured at fair market value.\nBecause banks do not carry inventory, liquidity risks will be negligible.\nSutton uses the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) approach to analyzing banks, and Reddy is assigned to look at First West’s capital adequacy. Exhibit 1 contains the capital adequacy ratios for First West for the past five years and the Basel III guidelines.\n\nExhibit 1 Capital Adequacy Ratios for First West Bank and Basel III Requirements\n\n \tBasel III\tCurrent Year\tPrevious Year\t2 Years Prior\t3 Years Prior\t4 Years Prior\nCommon equity tier 1 ratio\t4.5%\t9.5%\t9.1%\t8.5%\t8.0%\t8.0%\nTotal tier 1 capital ratio\t6.0\t10.7\t11.0\t9.7\t9.3\t9.7\nTotal capital ratio\t8.0\t12.5\t13.1\t12.7\t12.8\t13.9\nTo further understand the changes in the Current Year, Reddy retrieves the detailed components of the ratios for the past two years, shown in Exhibit 2.\n\nExhibit 2 Details of Capital Adequacy Ratios for First West Bank for the Current Year and the Previous Year (in $ thousands)\n\nCommon equity tier 1\tCurrent Year\tPrevious Year\nQualifying common shares\t756,800\t749,600\nRetained earnings\t1,488,600\t1,355,000\nAccumulated other comprehensive income\t(29,000)\t(32,700)\n \t2,216,400\t2,071,900\nRegulatory adjustments\t(206,800)\t(208,600)\nCommon equity tier 1\t2,009,600\t1,863,300\n \nTier 1 capital\t2,274,800\t2,233,400\nTotal capital (tier 1 & 2)\t2,644,800\t2,669,400\n \nRisk-weighted assets\t21,180,100\t20,364,500\nFinally, Reddy reviews First West’s annual report for background information on non-CAMELS factors that will be relevant to the analysis. First West focuses on loans to small and mid-sized regional businesses. Its mission is to provide a comprehensive approach to business owners of the region by primarily serving their domestic needs for business, personal banking, and wealth management. Using a relationship-based approach, First West holds the dominant position in its regional market. Reddy considers how these factors affect risk exposure for First West relative to global competitors that are considering entering its market.", "Joseph Cioffi and Amanda Yu, interns in the financial institutions division of an investment firm, are cleaning up outstanding issues in a few files.\n\nThey start by examining the investment allocation and returns on the investment portfolio for NANLife Group, a life and health insurance company, using data Cioffi prepared (Exhibit 1).\n\nExhibit 1 Investment Allocation and Returns, NANLife Group, in $ Millions\n\nInvestment portfolio as of 31 December\t2018\t2017\nLoans and deposits\t8,800\t9,000\nDebt securities \t141,000\t130,800\nEquity securities\t40,250\t34,000\nDerivative financial instruments\t130\t90\nTotal financial investments \t190,180\t173,890\nTotal investment portfolio\t195,080\t178,490\nInvestment returns for the year ending 31 December\t2018\t2017\nInterest income\t6,610\t5,850\nDividend income\t820\t750\nRental income\t175\t170\nInvestment income\t7,605\t6,770\nGains (losses) on fixed-income investments\t300\t(125)\nGains (losses) on other investments\t1,540\t1,665\nTotal investment returns\t9,445\t8,310\nCioffi asks, “Why does NANLife have a much larger portion of its investment portfolio in equity securities compared with the property and casualty company we were working on yesterday?”\n\nYu replies, “NANLife can take greater risks with its investments for two reasons: First, its claims are relatively more predictable, and second, the claims have a shorter duration.”\n\nBefore moving on Cioffi comments,\n\n“It was interesting to learn about the insurance industry when working on the NANLife file. Unlike the banking industry, it does not have to follow international standards for capital adequacy, but as a US-based insurer, NANLife still has some US requirements to meet. The company also prepares its financial statements using statutory accounting rules that differ from both US GAAP and IFRS.”\n\nNext, they turn their attention to a commercial bank file that still required some work on the assessment of earnings quality, using summary earnings information prepared by Yu (Exhibit 2).\n\nExhibit 2 Selected Earnings Information from Bank File, in $ Thousands\n\n \t2018\t2017\t2016\t2015\t2014\nInterest income\t640,400\t614,000\t606,300\t607,300\t599,000\nInterest expense\t225,800\t231,700\t246,600\t260,300\t262,700\nNet interest income\t414,600\t382,300\t359,700\t347,000\t336,300\n \nTrading income\t3,200\t5,140\t6,600\t(900)\t15,430\nOther income\t135,400\t125,200\t116,500\t117,200\t100,300\n \nTotal income net of interest expense\t553,200\t512,640\t482,800\t463,300\t452,030\n \nProvision for credit losses\t8,400\t13,800\t9,900\t10,500\t7,090\n \nEarnings before taxes\t117,600\t95,800\t91,600\t78,800\t87,211\nYu states,\n\n“We have to finish the CAMELS (capital adequacy, asset quality, management capabilities, earnings sufficiency, liquidity position, and sensitivity to market risk) analysis on this file. In my preliminary review of the bank’s earnings information, I assigned a score reflecting high quality of earnings, based on the following points:\n\nThe trading income is volatile, but it is a small portion of the earnings.\nNet interest income has been growing at a constant rate over the period.\nThe proportion of total income from net interest income has been stable in the most recent years.”\nCioffi replies,\n\n“I think we need to dig a little deeper. We need to look at the estimates that are used to determine earnings and whether the bank is using them to manage earnings before taxes (EBT). The provision for credit losses is an estimate where management can exercise wide discretion. Let’s look at what portion of the 2018 increase in EBT comes from the change in that estimate.”", "Giulia Gallo works as a senior manager at the National Banking Regulatory Commission (NBRC). She is meeting with her team today to review Banco San Bruno (BSB), a large commercial bank with operations across the country. The central bank announced a rate hike last month, and Gallo wants to re-examine BSB’s ability to withstand the changing environment. Antonio Rossi, her junior colleague, displays the summary information (Exhibit 1) he has gathered on BSB’s earnings composition and comments that he thinks the earnings composition has become less volatile and more sustainable.\n\nExhibit 1 Key Components of BSB’s Earnings\n\n(€ millions)\tCurrent Year\tPrior Year\nNet interest income\t55,288\t50,285\nNet fee income\t22,648\t21,107\nNet trading income\t18,651\t18,624\nTotal\t96,587\t90,016\nGallo further explains that BSB has been flagged by the data analytics system. The flag warns that BSB may be acting to boost its net interest income by shifting its portfolio toward more long-term assets without a corresponding shift on the liability side of the balance sheet. “I don’t like it,” said Gallo. Seeing Rossi’s puzzled look, she adds, “It’s a value creation strategy in a stable interest rate market, but it heightens their risk, especially in this environment of increasing rates.”\n\nThe team next turns to BSB’s balance sheet. Rossi displays the information he has gathered (Exhibit 2), and they use it to calculate the Total Tier 1 Capital.\n\nExhibit 2 Excerpts from BSB’s Year-End Balance Sheet\n\n(€ billions)\tCurrent Year\tPrior Year\nCustomer deposits\t502\t572\nSubordinated debt\t23\t21\nPreferred shares\t17\t17\nCommon shares\t12\t12\nRetained earnings\t187\t201\nAs the discussion draws to a close, Gallo mentions that at the next meeting, they will complete a detailed CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) analysis of BSB.", "Ioana Matei is a senior portfolio manager for an international wealth management firm. She directs research analyst Teresa Pereira to investigate the earnings quality of Miland Communications and Globales, Inc.\n\nPereira first reviews industry data and the financial reports of Miland Communications for the past few years. Pereira then makes the following three statements about Miland:\n\nStatement 1:\nMiland shortened the depreciable lives for capital assets.\n\nStatement 2:\nRevenue growth has been higher than that of industry peers.\n\nStatement 3:\nDiscounts to customers and returns from customers have decreased.\n\nPereira also observes that Miland has experienced increasing inventory turnover, increasing receivables turnover, and net income greater than cash flow from operations. She estimates the following regression model to assess Miland’s earnings persistence:\n\nEarningst+1 = α + β1Cash flowt + β2Accrualst + ε\nPereira and Matei discuss quantitative models such as the Beneish model, used to assess the likelihood of misreporting. Pereira makes the following two statements to Matei:\n\nStatement 4:\nAn advantage of using quantitative models is that they can determine cause and effect between model variables.\n\nStatement 5:\nA disadvantage of using quantitative models is that their predictive power declines over time because many managers have learned to test the detectability of manipulation tactics by using the model.\n\nPereira concludes her investigation of Miland by examining the company’s reported pre-tax income of $5.4 billion last year. This amount includes $1.2 billion of acquisition and divestiture-related expenses, $0.5 billion of restructuring expenses, and $1.1 billion of other non-operating expenses. Pereira determines that the acquisition and divestiture-related expenses as well as restructuring expenses are non-recurring expenses, but other expenses are recurring expenses.\n\nMatei then asks Pereira to review last year’s financial statements for Globales, Inc. and assess the effect of two possible misstatements. Upon doing so, Pereira judges that Globales improperly recognized EUR50 million of revenue and improperly capitalized EUR100 million of its cost of revenue. She then estimates the effect of these two misstatements on net income, assuming a tax rate of 25%.\n\nPereira compares Globales, Inc.’s financial statements with those of an industry competitor. Both firms have similar, above-average returns on equity (ROE), although Globales has a higher cash flow component of earnings. Pereira applies the mean reversion principle in her forecasts of the two firms’ future ROE.", "Emmitt Dodd is a portfolio manager for Upsilon Advisers. Dodd meets with Sonya Webster, the firm’s analyst responsible for the machinery industry, to discuss three established companies: BIG Industrial, Construction Supply, and Dynamic Production. Webster provides Dodd with research notes for each company that reflect trends during the last three years:\n\n \n\nBIG Industrial:\n\nNote 1:\nOperating income has been much lower than operating cash flow (OCF).\n\nNote 2:\nAccounts payable has increased, while accounts receivable and inventory have substantially decreased.\n\nNote 3:\nAlthough OCF was positive, it was just sufficient to cover capital expenditures, dividends, and debt repayments.\n\nConstruction Supply:\n\nNote 4:\nOperating margins have been relatively constant.\n\nNote 5:\nThe growth rate in revenue has exceeded the growth rate in receivables.\n\nNote 6:\nOCF was stable and positive, close to its reported net income, and just sufficient to cover capital expenditures, dividends, and debt repayments.\n\nDynamic Production:\n\nNote 7:\nOCF has been more volatile than that of other industry participants.\n\nNote 8:\nOCF has fallen short of covering capital expenditures, dividends, and debt repayments.\n\nDodd asks Webster about the use of quantitative tools to assess the likelihood of misreporting. Webster tells Dodd she uses the Beneish model, and she presents the estimated M-scores for each company in Exhibit 1.\n\nExhibit 1\nBeneish Model M-scores\nCompany\t2017\t2016\tChange in M-score\nBIG Industrial\t−1.54\t−1.82\t0.28\nConstruction Supply\t−2.60\t−2.51\t−0.09\nDynamic Production\t−1.86\t−1.12\t−0.74\nWebster tells Dodd that Dynamic Production was required to restate its 2016 financial statements as a result of its attempt to inflate sales revenue. Customers of Dynamic Production were encouraged to take excess product in 2016, and they were then allowed to return purchases in the subsequent period, without penalty.\n\nWebster’s industry analysis leads her to believe that innovations have caused some of the BIG Industrial’s inventory to become obsolete. Webster expresses concern to Dodd that although the notes to the financial statements for BIG Industrial are informative about its inventory cost methods, its inventory is overstated.\n\nThe BIG Industrial income statement reflects a profitable 49% unconsolidated equity investment. Webster calculates the return on sales of BIG Industrial based on the reported income statement. Dodd notes that industry peers consolidate similar investments. Dodd asks Webster to use a comparable method of calculating the return on sales for BIG Industrial.", "Mike Martinez is an equity analyst who has been asked to analyze Stellar, Inc. by his supervisor, Dominic Anderson. Stellar exhibited strong earnings growth last year; however, Anderson is skeptical about the sustainability of the company’s earnings. He wants Martinez to focus on Stellar’s financial reporting quality and earnings quality.\n\nAfter conducting a thorough review of the company’s financial statements, Martinez concludes the following:\n\nConclusion 1:\nAlthough Stellar’s financial statements adhere to generally accepted accounting principles (GAAP), Stellar understates earnings in periods when the company is performing well and overstates earnings in periods when the company is struggling.\n\nConclusion 2:\nStellar most likely understated the value of amortizable intangibles when recording the acquisition of Solar, Inc. last year. No goodwill impairment charges have been taken since the acquisition.\n\nConclusion 3:\nOver time, the accruals component of Stellar’s earnings is large relative to the cash component.\n\nConclusion 4:\nStellar reported an unusually sharp decline in accounts receivable in the current year, and an increase in long-term trade receivables.", "Marcio Bruno is an equity analyst studying the earnings quality of Libra S.A., a Colombian publicly-traded company that reports under IFRS. Bruno computes some financial ratios for Libra in Exhibit 1.\n\nExhibit 1\n\nMost Recent Year\tPrevious Year\tTwo Years Ago\nReceivables turnover ratio\t9.0\t6.3\t6.2\nInventory turnover ratio\t2.5\t4.1\t4.2\nLibra competes in a very mature industry with a 3% annual rate of revenue growth. In the last three years, Libra’s revenue growth was the same as the industry’s average, which allowed the company to maintain its market share.  Libra had no significant change in its sales, collection, purchases or inventory policies.\n\nBruno realizes that most of Libra’s competitors are US companies, which report under US GAAP. When reviewing Libra’s cash flow statement, he notices that the only difference in cash flow classification relates to interest paid. To improve comparability with those competitors, Bruno reclassifies interest paid in Libra’s cash flow statement.\n\nBruno believes that Libra's management significantly underestimates the environmental risks of its business. To investigate the issue, Bruno refers to different information sources.", "Quentin Abay, CFA, is an analyst for a private equity firm interested in purchasing Bickchip Enterprises, a conglomerate. His first task is to determine the trends in ROE and the main drivers of the trends using DuPont analysis. To do so he gathers the data in Exhibit 1.\n\nExhibit 1\nSelected Financial Data for Bickchip Enterprises (€ Thousands)\n \t2020\t2019\t2018\nRevenue\t72,448\t66,487\t55,781\nEarnings before interest and tax\t6,270\t4,710\t3,609\nEarnings before tax\t5,101\t4,114\t3,168\nNet income\t4,038\t3,345\t2,576\nAsset turnover\t0.79\t0.76\t0.68\nAssets/Equity\t3.09\t3.38\t3.43\nAfter conducting the DuPont analysis, Abay believes that his firm could increase the ROE without operational changes. Further, Abay thinks that ROE could improve if the company divested segments that were generating the lowest returns on capital employed (total assets less non-interest-bearing liabilities). Segment EBIT margins in 2020 were 11 percent for Automation Equipment, 5 percent for Power and Industrial, and 8 percent for Medical Equipment. Other relevant segment information is presented in Exhibit 2.\n\nExhibit 2\nSegment Data for Bickchip Enterprises (€ Thousands)\n \tCapital Employed\t\tCapital Expenditures (Excluding Acquisitions)\nOperating Segments\t2020\t\t2019\t\t2018\t\t2020\t\t2019\t\t2018\nAutomation Equipment\t10,705\t\t6,384\t\t5,647\t\t700\t\t743\t\t616\nPower and Industrial\t15,805\t\t13,195\t\t12,100\t\t900\t\t849\t\t634\nMedical Equipment\t22,870\t\t22,985\t\t22,587\t\t908\t\t824\t\t749\n \t49,380\t\t42,564\t\t40,334\t\t2,508\t\t2,416\t\t1,999\nAbay is also concerned with earnings quality, so he intends to calculate Bickchip’s cash-flow-based accruals ratio and the ratio of operating cash flow before interest and taxes to operating income. To do so, he prepares the information in Exhibit 3.\n\nExhibit 3\nEarnings Quality Data for Bickchip Enterprises (€ Thousands)\n \t2020\t2019\t2018\nNet income\t4,038\t3,345\t2,576\nNet cash flow provided by (used in) operating activitya\t9,822\t5,003\t3,198\nNet cash flow provided by (used in) investing activity\t(10,068)\t(4,315)\t(5,052)\nNet cash flow provided by (used in) financing activityb\t(5,792)\t1,540\t(2,241)\nAverage net operating assets\t43,192\t45,373\t40,421\na includes cash paid for taxes of:\t(1,930)\t(1,191)\t(1,093)\nb includes cash paid for interest of:\t(1,169)\t(596)\t(441)", "Ione Bailey is a financial analyst who is examining the most recent annual report of Eastview Inc., a US-based company that complies with US GAAP. Bailey wants to determine Eastview's ROE as well as the trend in its ROE components by using DuPont analysis. Data used for this purpose is presented in Exhibit 1.\n\nExhibit 1\n\n \tMost Recent Year\tPrevious Year\tTwo Years Ago\nRevenue (USD million)\t 750\t680\t600\nNet income (USD million)\t60\t55\t50\nTotal liabilities (USD million)\t230\t220\t200\nTotal asset turnover ratio\t1.30\t1.25\t1.20\nBailey also wants to evaluate Eastview's three geographic operating segments to assess their ROI and growth during the most recent year. For this purpose, she prepares the data presented in Exhibit 2 for the most recent year.\n\nExhibit 2\n\n \tEurope\tAsia\tAmericas\nSegment EBIT margin %\t12.5\t13.1\t12.8\nSegment % of total assets\t26.5\t31.2\t42.3\nSegment % of total capital expenditures\t32.2\t29.1\t38.7\nNext, while reading the notes to the financial statements in the annual report, Bailey observes that Eastview's property, plant and equipment have depreciable lives that are 20% longer than its industry competitors' average. For comparison purposes, Bailey adjusts the financial statements to determine the effect of the difference on the company's financial ratios and information.\n\nFinally, in order to assess Eastview's accruals and earnings quality, Bailey calculates the accruals ratios that are presented in Exhibit 3.\n\nExhibit 3\n\n \tMost Recent Year\tPrevious Year\tTwo Years Ago\nBalance-sheet-based accruals ratio (%)\t7.9\t3.8\t3.1\nCash-flow-based accruals ratio (%)\t4.7\t4.4\t2.6", "Natalyn Winslow is an analyst working for High Impact Investments (HII), which manages a variety of investment funds. She analyzes the recent performance of Dorado Beverages SA (DB), a multinational brewer of carbonated beverages that recently entered the energy drinks market. As a core holding, DB's prominence in Europe provides geographic diversification for HII which tends to be North-America-centric. \n\nWinslow refers to DB's most recent year and previous year balance sheets and comments: \"DB is continuing to follow a growth-by-acquisition strategy.\" In addition, Winslow adjusts DB's most recent year income statement to determine the company's net income under the direct control of management by using information (in EUR millions) in Exhibit 1.\n\nExhibit 1\n\n \tMost Recent Year\nIncome from operations\t1,765\nIncome from investments in associates\t191\nInterest expense\t(648)\nTaxes\t(238)\nNet income\t1,070\nOf which:\nNet income attributable to non-controlling interests\t86\nNet income attributable to shareholders\t984\nWinslow and her team assess the quality of DB's overall performance. The consensus is positive, but Winslow disagrees with her team for the following reasons:\n\nReason 1: The rate of fluctuation in the cash-flow-based accruals ratio is low.\n\nReason 2: Balance-sheet-based accruals are trending down relative to total assets.\n\nReason 3: Income from operations is consistently higher than cash generated from operations.\n\nWinslow and her team notice from DB's annual report that the company has four segments. They analyze DB's segments by using information (in EUR millions) in Exhibit 2.\n\nExhibit 2\n\n \tMost Recent Year\tPrevious Year\n \tSales\tEBIT\tAssets\tSales\nCarbonated drinks - Europe\t2,845\t955\t12,416\t2,758\nCarbonated drinks - North America\t1,913\t558\t5,876\t1,721\nCarbonated drinks - Asia Pacific\t535\t172\t2,661\t503\nEnergy drinks\t284\t16\t1,219\t202\nTotal\t5,577\t1,701\t22,172\t5,184\nAfter performing the segment analysis, Winslow and her team conclude on the following statements:\n\nStatement 1: The sales growth rate in carbonated drinks - North America is stronger than that of energy drinks.\nStatement 2: Carbonated drinks - Europe's EBIT margin is superior to that of carbonated drinks - North America. \nStatement 3: Asset turnover in carbonated drinks - Europe is better than that of DB overall.", "Claus Petersen, a pension fund equity analyst, is preparing an analysis of Rhine AG for the upcoming quarterly fund meeting. Rhine is a Germany-based manufacturer that operates three distinct divisions: children’s products (infant car seats, strollers, cribs, etc.), recreational products (bicycles, bicycle trailers, etc.), and home furnishings (contemporary furniture). All three divisions sell through retail outlets around the world.\n\nThe company has been pursuing an aggressive growth strategy, achieved through both foreign acquisitions and organic growth. Petersen is interested in determining how well Rhine is allocating its resources between the three divisions and the effects of the foreign acquisitions on overall performance. Exhibit 1 summarizes selected divisional and corporate data for the current year and the prior year.\n\nExhibit 1 Rhine AG Selected Divisional and Corporate Data (€ millions)\n\n \tTotal for Three Divisions\tChildren's Products\tRecreational Products\tHome Furnishings\n \tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\tCurrent Year\tPrior Year\nRevenues\t2,837.1\t2,775.5\t1,176.2\t1,236.2\t1,034.1\t930.0\t626.8\t609.3\nGross profit\t621.4\t640.8\t296.6\t337.6\t246.0\t220.3\t78.8\t82.9\nOperating profit\t172.7\t219.4\t64.7\t115.7\t72.9\t62.2\t35.1\t41.5\nEarnings before taxes (EBT)\t136.6\t170.0\t---\t---\t---\t---\t---\t---\nNet earnings after tax\t109.9\t132.3\t---\t---\t---\t---\t---\t---\nTotal assets\t2,498.0\t2,479.5\t1,270.9\t1,249.6\t961.5\t948.5\t265.6\t281.4\nCapital expenditures\t32.7\t42.3\t22.1\t30.0\t6.7\t8.6\t3.9\t3.7\nProportion of capital expenditures\t100%\t100%\t67.6%\t70.9%\t20.5%\t20.3%\t11.9%\t8.7%\nProportion of total assets\t100%\t100%\t50.9%\t50.4%\t38.5%\t38.3%\t10.6%\t11.3%\nPetersen’s preferred method to determine which division is becoming less significant over time is to review the relationship between capital expenditures and total assets by operating division. He plans to base his conclusion on the assumption that the current year's investment behavior is representative of future investment patterns.\n\nPetersen knows that revenues in the children’s products division have suffered because of declining birth rates in Europe and North America, but he believes that if Rhine can maintain the operating margin for this division then overall company profitability should not be affected.\n\nCorinna Berg, another analyst with the fund, reminds Petersen that during the current year, the US dollar weakened against the euro by 4% and that 50% of the sales in the recreational products division are sold in the United States.\n\nPetersen recalls that some of the recent global expansion was aimed at establishing operations in Ireland because its statutory corporate tax rate is lower than the German rate of 29.8%. If Petersen assumes that other tax credits were the same in the current year as the prior year, he can analyze changes in Rhine’s effective tax rate to determine whether the geographic mix of the company’s profits has changed in the current year.\n\nPetersen finally examines the company’s liquidity ratios, which are shown in Exhibit 2. Even though the company’s current and quick ratio have improved, his interpretation of the changes in the company’s cash conversion cycle is that the company’s liquidity position has deteriorated.\n\nExhibit 2 Rhine AG Selected Ratios\n\nRatio\tCurrent Year\tPrior Year\t2 Years Prior\nCurrent ratio\t2.31\t2.17\t1.16\nQuick ratio\t1.06\t0.89\t0.53\nAccounts receivable turnover\t5.82\t6.08\t6.11\nInventory turnover\t3.78\t3.91\t4.09\nAccounts payable turnover\t5.71\t5.78\t5.60\nCash conversion cycle\t95 days\t90 days\t84 days\nWorried that the balance sheet–based and cash flow–based accruals ratios (not shown) raise some concerns about the possible use of accruals to manage earnings, Petersen asks Berg for advice on what further type of analysis he should do as a follow-up on this issue."], "modules": {"1": "Intercorporate Investments", "2": "Employee Compensation", "3": "Multinational Operations", "4": "Analysis of Financial Institutions", "5": "Quality of Financial Reports", "6": "Integration of FSA Techniques"}}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('quizdata').textContent);
var Q = DATA.questions, VIG = DATA.vignettes, MN = DATA.modules;
var BYID = {}; Q.forEach(function(q){BYID[q.id]=q;});
var SUBJECT = "FSA", KEY = "FSA_quiz_state_v1", EXPKEY = "FSA_quiz_exports_v1";

/* ---------- storage with memory fallback ---------- */
var mem = {};
var store = {
  get:function(k){ try{ var v=window.localStorage.getItem(k); return v===null?null:JSON.parse(v);}catch(e){ return mem[k]===undefined?null:mem[k]; } },
  set:function(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k]=v; } }
};
var S = store.get(KEY);
function fresh(order, mode){
  return {order:order, idx:0, mode:mode, round:{}, all:(S&&S.all)||{}, started:new Date().toISOString(), finished:false, view:"quiz"};
}
function save(){ store.set(KEY,S); }

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rich(text){ // paragraphs + tab tables
  var lines = String(text||"").split("\n"), html="", tbl=[];
  function flush(){ if(!tbl.length) return; html+='<div class="tbl"><table>'+tbl.map(function(r){return "<tr>"+r.split("\t").map(function(c){return "<td>"+esc(c.trim())+"</td>";}).join("")+"</tr>";}).join("")+"</table></div>"; tbl=[]; }
  lines.forEach(function(l){
    if(l.indexOf("\t")>=0){ tbl.push(l); }
    else { flush(); if(l.trim()) html+="<p>"+esc(l)+"</p>"; }
  });
  flush(); return html;
}
function mname(m){ return "Module "+m+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 모듈 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">FSA 전체 모듈 오답 퀴즈</h2>'+
   '<p class="muted">ECO에서 틀린 120문제 전부 + 오답 개념과 연결된 ECO 정답 유형 26문제 + Schweser Module Quiz 기반 문제 40개 + 변형 11개. 정답·해설은 ECO 원본 해설과 Schweser 기준으로 작성했습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<label>출처 <select id="selSrc"><option value="all">전체</option><option value="wrong">ECO 오답만 (120)</option><option value="nowrong">오답 외 문제만</option></select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start">'+resume+'<button class="btn '+(resume?'':'primary')+'" id="bStart">새로 시작</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  $("bStart").onclick=function(){
    var m=$("selMod").value, s=$("selSrc").value;
    var order=Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (s==="all"||(s==="wrong"?q.src==="ECO 오답":q.src!=="ECO 오답")); }).map(function(q){return q.id;});
    if(!order.length) return;
    S=fresh(order,"all"); save(); render();
  };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    '<button class="btn primary" id="bNext" '+(r?'':'disabled')+'>'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button></div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=next;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d, at;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ alert(SUBJECT+" 결과 파일이 아닙니다."); return; }
    at=d.attempts[d.attempts.length-1];
    var order=[], round={};
    (at.questions||[]).forEach(function(x){
      var q=BYID[x.id]; if(!q) return;
      order.push(x.id);
      if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
    });
    if(!order.length){ alert("불러올 문제가 없습니다."); return; }
    if(S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return;
    var all=(S&&S.all)||{};
    (at.questions||[]).forEach(function(x){
      if(!BYID[x.id] || all[x.id] || !x.selected) return;
      var ok=x.selected===BYID[x.id].ans;
      all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
    });
    var idx=0; while(idx<order.length && round[order[idx]]) idx++;
    var done=idx>=order.length;
    S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
       started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz"};
    save(); render(); window.scrollTo(0,0);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
})();
</script>
