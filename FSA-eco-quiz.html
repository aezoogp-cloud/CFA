cause the costs must be estimated far into the future."}, "ans": "C", "en": "Short-term compensation is settled within 12 months, usually in cash, so there is limited scope for measurement error. It is expensed as service is provided.", "ko": "단기급여는 12개월 내 현금 정산 → 측정오차가 작음. 측정오차가 큰 것은 DB pension·장기급여.", "trap": "", "f": "", "why": {"A": "맞는 설명입니다(용역 제공 시 비용, 미지급분은 유동부채).", "B": "맞는 설명입니다(단기급여 구성 항목)."}, "orig": "Schweser MQ 8.1 변형"}, {"id": "SCH-M2-04", "src": "Schweser MQ", "module": 2, "tag": "Plan assets 기말 공정가치", "vig": null, "stem": "For a DB plan: PBO at 1 January = $200m; PBO at 31 December = $226m; service cost plus interest cost for the year = $40m; plan assets at 1 January = $160m; actual return on plan assets = $30m. There were no employer contributions, no actuarial changes, and no other events. Plan assets at 31 December are closest to:", "opts": {"A": "$146m.", "B": "$176m.", "C": "$190m."}, "ans": "B", "en": "Benefits paid = 200 + 40 − 226 = $14m. Ending plan assets = 160 + 30 (actual return) − 14 = $176m.", "ko": "① PBO 롤포워드로 benefits paid 역산: 200 + 40 − 226 = 14. ② 자산 롤포워드: 160 + 30 + 기여금 0 − 14 = 176.", "trap": "Benefits paid를 빼지 않으면 190. 자산에는 '실제' 수익을 씁니다.", "f": "PBO말 = PBO초 + SC + IC ± 보험수리손익 − 지급 / 자산말 = 자산초 + 실제수익 + 기여금 − 지급", "why": {"A": "146은 실제수익(30)을 빠뜨린 값(160 − 14)입니다.", "C": "190은 benefits paid(14)를 차감하지 않은 값입니다."}, "orig": "Schweser MQ 8.2 변형"}, {"id": "SCH-M2-05", "src": "Schweser MQ", "module": 2, "tag": "US GAAP pension cost", "vig": null, "stem": "A company reporting under US GAAP has a beginning PBO of $15.0m, a discount rate of 8%, current service cost of $1.0m, and expected return on plan assets of $1.1m. Ignoring amortization of prior service cost and actuarial gains/losses, pension cost reported in P&L is closest to:", "opts": {"A": "$0.9m.", "B": "$1.1m.", "C": "$2.2m."}, "ans": "B", "en": "US GAAP periodic pension cost = service cost + interest cost − expected return = 1.0 + (0.08 × 15.0) − 1.1 = $1.1m.", "ko": "US GAAP: service cost 1.0 + interest cost(8% × 15.0 = 1.2) − 기대수익 1.1 = 1.1.", "trap": "기대수익 차감 누락 시 2.2. US GAAP은 '기대'수익, IFRS는 할인율로 net interest.", "f": "US GAAP cost = SC + r×PBO초 − Expected return (+ 상각항목)", "why": {"A": "0.9는 구성요소(service cost + interest cost − expected return)를 잘못 조합한 값입니다.", "C": "2.2는 기대수익(1.1)을 차감하지 않은 값입니다."}, "orig": "Schweser MQ 8.2 변형"}, {"id": "SCH-M2-06", "src": "변형", "module": 2, "tag": "IFRS net interest (변형)", "vig": null, "stem": "Same plan as before (beginning PBO $15.0m, discount rate 8%, current service cost $1.0m), with beginning plan assets of $12.0m and no past service cost. Under IFRS, pension cost recognized in P&L is closest to:", "opts": {"A": "$1.10m.", "B": "$1.24m.", "C": "$2.20m."}, "ans": "B", "en": "IFRS P&L pension cost = service cost + net interest = 1.0 + 0.08 × (15.0 − 12.0) = $1.24m. Under IFRS the expected return is implicitly the discount rate.", "ko": "IFRS: net interest = 할인율 × 기초 순확정급여부채(15.0 − 12.0) = 0.24 → 1.0 + 0.24 = 1.24. 기대수익률 가정은 IFRS에서 쓰지 않습니다.", "trap": "US GAAP 방식(기대수익 차감)을 IFRS에 적용하는 함정.", "f": "IFRS cost = Service cost + r × (PBO − Plan assets)기초", "why": {"A": "1.10은 US GAAP 방식(기대수익 차감)입니다. IFRS는 할인율 × 순부채로 net interest를 계산합니다.", "C": "2.20은 interest cost를 PBO 전체에 적용하고 plan assets 효과를 무시한 값입니다."}, "orig": "Schweser R8 개념 변형"}, {"id": "SCH-M2-07", "src": "Schweser MQ", "module": 2, "tag": "임금상승률 가정", "vig": null, "stem": "The most likely effect of an increase in the assumed rate of compensation growth for a DB plan is:", "opts": {"A": "lower retained earnings.", "B": "a lower PBO.", "C": "higher plan assets."}, "ans": "A", "en": "A higher compensation growth rate increases the PBO and periodic pension cost, reducing net income and retained earnings. It does not affect plan assets.", "ko": "임금상승률↑ → PBO↑ → 비용↑ → NI↓ → 이익잉여금↓. Plan assets와 무관.", "trap": "", "f": "", "why": {"B": "임금상승률↑은 미래 급여를 키워 PBO를 '증가'시킵니다.", "C": "임금상승률은 plan assets에 영향을 주지 않습니다."}, "orig": "Schweser MQ 8.2 변형"}, {"id": "SCH-M2-08", "src": "Schweser MQ", "module": 2, "tag": "할인율 하락 – funded status (all else equal)", "vig": null, "stem": "All else equal (holding plan assets constant), a decrease in the discount rate used for a DB plan most likely causes the funded status to:", "opts": {"A": "increase.", "B": "decrease.", "C": "remain unchanged."}, "ans": "B", "en": "A lower discount rate raises the PBO; with plan assets held constant, funded status (plan assets − PBO) decreases.", "ko": "할인율↓ → PBO↑ → funded status(자산 − PBO)↓. ECO Kensington 문제처럼 '자산도 오를 수 있다'는 단서가 있으면 악화폭이 줄어든다는 점까지 기억.", "trap": "", "f": "", "why": {"A": "할인율↓ → PBO↑ → funded status는 '감소'합니다.", "C": "PBO가 변하므로 funded status도 변합니다."}, "orig": "Schweser MQ 8.2 변형"}, {"id": "SCH-M2-09", "src": "변형", "module": 2, "tag": "Tax windfall – US GAAP 처리 (변형)", "vig": null, "stem": "Under US GAAP, a tax windfall arising when RSUs vest at a share price above the grant-date price is recognized:", "opts": {"A": "directly in shareholders' equity.", "B": "as a reduction in income tax expense.", "C": "in other comprehensive income."}, "ans": "B", "en": "Tax windfalls (shortfalls) reduce (increase) income tax expense under US GAAP; under IFRS they are taken directly to equity.", "ko": "US GAAP = 법인세비용 감소(ETR↓, 이익 변동성↑), IFRS = 자본 직접 반영.", "trap": "IFRS와 바꿔 기억하는 함정.", "f": "", "why": {"A": "자본 직접 반영은 IFRS 처리입니다.", "C": "OCI가 아니라 US GAAP은 손익계산서의 법인세비용에 반영합니다."}, "orig": "Schweser R8 개념 변형"}, {"id": "SCH-M2-10", "src": "변형", "module": 2, "tag": "DCF – Pension 처리 (변형)", "vig": null, "stem": "An analyst's DCF model includes only service cost as a pension expense in free cash flow and deducts the net pension liability (at present value) from enterprise value to arrive at equity value. The analyst should most likely:", "opts": {"A": "make no changes.", "B": "also deduct net interest expense from free cash flow.", "C": "add back service cost to free cash flow because it is non-cash."}, "ans": "A", "en": "Service cost is a genuine operating cost and belongs in FCF. Because the net pension liability is already deducted at present value, also expensing net interest would double-count the time value of money.", "ko": "Service cost는 FCF에 남기고, net interest는 빼지 않으며, net pension liability(PV)는 EV에서 차감 — 이미 올바른 구조입니다.", "trap": "Net interest까지 차감하면 시간가치 이중계산.", "f": "", "why": {"B": "Net interest까지 차감하면 PV로 차감한 순부채와 시간가치가 이중계산됩니다.", "C": "Service cost는 실질 영업비용이므로 FCF에서 차감한 상태가 맞습니다."}, "orig": "ECO DCF 변형"}, {"id": "ECO-M3-Q1", "src": "ECO 오답", "module": 3, "tag": "Transaction exposure 식별", "vig": 15, "stem": "Which transaction would generate foreign currency transaction exposure for Ambleu?", "opts": {"A": "Transaction 1", "B": "Transaction 2", "C": "Transaction 3"}, "ans": "C", "en": "C is correct. In Transaction 3, the payment for the inventory is due in Bindiar francs, a different currency from the Norvoltian krone, which is Ambleu’s presentation currency. Because the import purchase (account payable) is under 45-day credit terms, Ambleu has foreign currency transaction exposure. The payment is subject to fluctuations in the ₣B/NVK exchange rate during the 45-day period between the sale and payment dates. Thus, Ambleu is exposed to potential foreign currency gains if the Bindiar franc weakens against the Norvoltian krone or foreign currency losses if the Bindiar franc strengthens against the Norvoltian krone.", "ko": "거래 노출 = 기능통화가 아닌 통화로 거래 + 결제 시점이 나중. T1: 당일 결제 → 노출 없음. T2: Ngcorp(기능통화 ₣B)의 ₣B 대출 → 거래노출 아님(번역노출). T3: Ambleu가 45일 후 ₣B로 지급 → 거래노출.", "trap": "통화가 다르다는 것만 보고 결제 시차를 확인하지 않는 함정.", "f": "", "why": {"A": "구매일에 대금을 받았으므로 환율 변동 노출 기간이 없습니다.", "B": "Ngcorp의 기능통화가 ₣B이고 대출도 ₣B → 거래노출 없음(연결 시 번역노출 문제)."}, "orig": "ECO Module 3 Q1"}, {"id": "ECO-M3-Q2", "src": "ECO 오답", "module": 3, "tag": "번역방법 결정 기준", "vig": 15, "stem": "Yu’s determination regarding Transaction 2 should be based on the currency of the:", "opts": {"A": "loan.", "B": "bank.", "C": "borrower."}, "ans": "C", "en": "C is correct. The currency of Ngcorp as the borrowing foreign subsidiary, relative to that of Ambleu, determines Ambleu’s choice of translation method for Transaction 2. Because Ngcorp’s functional currency is the Bindiar franc and Ambleu’s presentation currency is the Norvoltian krone, the current rate method rather than the temporal method should be used. Regardless of the currency in which the loan is denominated, the loan is first recorded in Ngcorp’s financial statements. Then, Ngcorp’s financial statements, which include the bank loan, are translated into Ambleu’s consolidated financial statements.", "ko": "대출은 Ngcorp 장부에 먼저 기록되고 Ngcorp 재무제표 전체가 번역됩니다. 방법 선택은 차입자(Ngcorp) 기능통화 vs 모회사 표시통화 비교 → 다르므로 current rate method.", "trap": "대출 통화나 은행 소재국으로 판단하는 함정.", "f": "", "why": {"A": "대출 통화가 아니라, 대출을 기록하는 실체(Ngcorp)의 기능통화 vs 모회사 표시통화로 방법을 정합니다.", "B": "은행의 표시통화는 Ambleu의 회계처리와 무관합니다."}, "orig": "ECO Module 3 Q2"}, {"id": "ECO-M3-Q3", "src": "ECO 오답", "module": 3, "tag": "Transaction gain 계산", "vig": 15, "stem": "Based on Exhibit 1, what is the foreign exchange gain resulting from Transaction 3 on the 31 December 2016 financial statements?", "opts": {"A": "NVK1.70 per ton", "B": "NVK90.75 per ton", "C": "NVK248.54 per ton"}, "ans": "A", "en": "A is correct. On Ambleu’s balance sheet, the cost included in the inventory account is the translation of ₣B27,000/ton into Norvoltian krone on the purchase date. Ambleu could have paid this amount on the purchase date but chose to wait 45 days to settle the account. The inventory cost is determined using the ₣B/NVK exchange rate of 4.1779 on the purchase date of 1 June 2016. ₣B27,000/₣B4.1779/NVK = NVK6,462.58/ton\n\nThe cash outflow is the amount exchanged from the Norvoltian krone to the Bindiar franc to pay the ₣B27,000/ton owed for the inventory 45 days after the transaction date. This payment uses the ₣B/NVK exchange rate of 4.1790 on the settlement date of 15 July 2016.\n\n₣B 27,000/₣B4.1790 per NVK = NVK6,460.88/ton\nForeign exchange gain = Inventory cost − Cash payment\n = NVK6,462.58 − NVK6,460.88\n = NVK1.70/ton\nThus, Ambleu’s cash outflow is less than the cost included in the inventory account, and NVK1.70/ton is the realized foreign exchange gain relating to this transaction. By deferring payment for 45 days, and because the Bindiar franc decreased in value during this period, Ambleu pays NVK1.70/ton less than the inventory cost on the purchase date of 1 June 2016. Thus, Ambleu will report a foreign exchange gain in its 2016 net income.", "ko": "구매일 원가 27,000/4.1779 = 6,462.58 NVK, 결제일 지급 27,000/4.1790 = 6,460.88 NVK → 차액 1.70 NVK/ton 이익(₣B 약세로 부채 가치 감소).", "trap": "결제가 7/15에 끝났으므로 연말 환율(4.2374)이나 평균환율은 쓰지 않습니다.", "f": "FX gain on payable = FC금액/구매일환율 − FC금액/결제일환율 (FC per NVK 호가)", "why": {"B": "90.75는 연말 환율(4.2374)로 계산한 값입니다. 7/15에 이미 결제되었으므로 결제일 환율을 씁니다.", "C": "248.54는 2016년 평균환율(4.3450)로 계산한 값입니다. 결제일 환율(4.1790)을 써야 합니다."}, "orig": "ECO Module 3 Q3"}, {"id": "ECO-M3-Q4", "src": "ECO 오답", "module": 3, "tag": "Net sales growth 구성", "vig": 15, "stem": "What is the best response to Question 1?", "opts": {"A": "Yes", "B": "No, because it would reduce organic sales growth", "C": "No, because it would reduce net price realization and mix"}, "ans": "A", "en": "A is correct. Net sales growth equals organic sales growth plus or minus the effects of acquisitions, divestitures, and foreign exchange. A foreign currency translation loss would reduce net sales growth. Thus the answer to Question 1 is yes.", "ko": "Net sales growth = organic(가격·수량) ± 인수·매각 ± FX. 환산손실(외화 약세)은 net sales growth를 낮추므로 답은 'Yes'. Organic growth와 price/mix는 FX를 제외한 개념입니다.", "trap": "Organic growth에 FX가 포함된다고 착각하는 함정.", "f": "", "why": {"B": "Organic growth는 FX 효과를 제외한 개념이라 환산손실이 organic growth를 줄이지 않습니다.", "C": "Net price realization·mix도 FX와 별개 구성요소입니다. 환산손실은 FX 항목으로 net sales growth를 직접 낮춥니다."}, "orig": "ECO Module 3 Q4"}, {"id": "ECO-M3-Q6", "src": "ECO 오답", "module": 3, "tag": "Hyperinflation – Flow 항목 재작성 (IFRS)", "vig": 15, "stem": "Based on Exhibit 1 and Note 1 in Exhibit 2, the amount that Ambleu should include in its 31 December 2017 revenue from Cendaró is closest to:", "opts": {"A": "NVK10.60 million.", "B": "NVK13.25 million.", "C": "NVK19.73 million."}, "ans": "A", "en": "A is correct. Crenland experienced hyperinflation from 31 December 2015 to 31 December 2017, as shown by the General Price Index, with cumulative inflation of 128.2% during this period. According to IFRS, Cendaró’s financial statements must be restated for local inflation, then translated into Norvoltian kroner using the current exchange rate. The 2017 revenue from Cendaró that should be included in Ambleu’s income statement is calculated as follows:\n\nRevenue in CRG × (GPI 31 December 2017/GPI average 2017) = Inflation-adjusted revenue in CRG\nCRG125.23 million × (228.2/186.2) = CRG153.48 million\nInflation-adjusted revenue in CRG/31 December 2017 exchange rate (CRG/NVK) = Revenue in Norvoltian kroner\nCRG153.48 million/14.4810 = NVK10.60 million", "ko": "Crenland 누적 인플레이션 >100% → IFRS: 먼저 GPI로 재작성 후 기말환율로 환산. 매출(flow)은 기말GPI/평균GPI: 125.23 × 228.2/186.2 = 153.48 → ÷ 14.4810 = NVK 10.60m.", "trap": "재작성 없이 환산하거나 평균환율을 쓰면 오답. Flow 항목은 '평균 GPI', stock 항목은 '취득시점 GPI'.", "f": "Flow: 금액 × GPI기말/GPI평균 × 기말환율", "why": {"B": "재작성 후 '평균'환율(11.5823)로 나눈 값입니다. IFRS 초인플레이션은 기말(current) 환율을 사용합니다.", "C": "기초 GPI(100)로 재작성한 값입니다. 매출(flow)은 평균 GPI(186.2) 기준으로 재작성합니다."}, "orig": "ECO Module 3 Q6"}, {"id": "ECO-M3-Q7", "src": "ECO 오답", "module": 3, "tag": "ETR reconciliation – Profit mix", "vig": 15, "stem": "Based on Exhibit 2 and Note 2, the change in Ambleu’s consolidated income tax rate from 2016 to 2017 most likely resulted from a:", "opts": {"A": "decrease in Ambleu’s domestic tax rate.", "B": "more profitable business mix in its subsidiaries.", "C": "stronger Norvoltian krone relative to the currencies of its subsidiaries."}, "ans": "B", "en": "B is correct. The consolidated income tax rate is calculated as income tax expense divided by profit before tax. Note 2 shows that Ambleu’s consolidated income tax rate decreases by 2.29%, from 34.94% (=94/269) in 2016 to 32.65% (=96/294) in 2017. The largest component of the decrease stems from the 1.42% change in the effect of tax rates in non-domestic jurisdictions, which lowers Ambleu’s consolidated income tax rate in 2016 by 3.34% (=9/269) and in 2017 by 4.76% (=14/294). The decrease in 2017 could indicate that Ambleu’s business mix shifted to countries with lower marginal tax rates, resulting in a lower consolidated income tax rate and more profit. (The change could also indicate that the marginal tax rates decreased in the countries in which Ambleu earns profits.)", "ko": "Profit mix 판단은 'effect of tax rates in non-domestic jurisdictions' 항목만 봅니다. −9 → −14로 음(−)의 효과가 커짐 → 저세율 국가 이익 비중↑(more profitable business mix).", "trap": "ETR 합계 변화나 국내세율 변화로 판단하는 함정. 환율은 세율과 무관.", "f": "", "why": {"A": "국내세율 효과는 reconciliation에서 따로 보이며, profit mix 판단 근거가 아닙니다.", "C": "환율은 세율 차이를 설명하지 못합니다. 판단 근거는 'non-domestic jurisdictions' 세율효과 항목입니다."}, "orig": "ECO Module 3 Q7"}, {"id": "ECO-M3-Q9", "src": "ECO 오답", "module": 3, "tag": "Current rate method – 자산 환산", "vig": 15, "stem": "Based on Exhibit 1 and Note 4 in Exhibit 2, the total intangible assets on Ngcorp’s balance sheet as of 31 December 2016 are closest to:", "opts": {"A": "₣B12.54 million.", "B": "₣B12.71 million.", "C": "₣B13.04 million."}, "ans": "B", "en": "B is correct. Because Ngcorp has a functional currency that is different from Ambleu’s presentation currency, the intangible assets are translated into Norvoltian kroner using the current rate method. The current ₣B/NVK exchange rate is 4.2374 as of 31 December 2016. Thus, the intangible assets on Ngcorp’s 2016 balance sheet are NVK3 million × ₣B4.2374/NVK = ₣B12.71 million.", "ko": "Ngcorp 기능통화(₣B) ≠ 표시통화(NVK) → current rate method → 무형자산도 기말환율 4.2374로: NVK3m × 4.2374 = ₣B12.71m.", "trap": "취득일(7/15) 환율 4.1790 사용(12.54) = temporal 방식 함정.", "f": "", "why": {"A": "12.54는 무형자산 취득일(7/15) 환율 4.1790 — temporal 방식입니다.", "C": "13.04는 평균환율 4.3450 — 자산은 기말환율로 환산합니다."}, "orig": "ECO Module 3 Q9"}, {"id": "ECO-M3-Q11", "src": "ECO 오답", "module": 3, "tag": "Translation adjustment – 부채 방향", "vig": 16, "stem": "Based on Exhibits 1 and 2, the translation adjustment for Triofind-B’s liabilities into Triofind’s presentation currency for the six months ended 31 December 2016 is:", "opts": {"A": "negative.", "B": "zero.", "C": "positive."}, "ans": "C", "en": "C is correct. The monetary balance sheet items for Triofind-B are translated at the current exchange rate, which reflects that the Borliand dollar weakened during the period relative to the Norvolt euro. The rate as of 30 June 2016 was BRD1.15/NER (or NER/BRD0.8696) and as of 31 December 2016 was BRD1.20/NER (or NER/BRD0.8333). Therefore, notes payable translates to NER416,667 (BRD500,000 × NER/BRD0.8333) as of 31 December 2016, compared with NER434,783 (BRD500,000 × NER/BRD0.8696) as of 30 June 2016. Thus, the translation adjustment for liabilities is positive.", "ko": "BRD per NER 1.15 → 1.20 = BRD 약세. BRD500,000 부채의 NER 환산액 434,783 → 416,667로 감소 → 부채 감소 = positive(유리한) 조정.", "trap": "숫자가 커졌으니 BRD가 강해졌다는 착각 — 호가 단위(BRD per NER)를 확인하세요.", "f": "", "why": {"A": "BRD per NER가 1.15 → 1.20으로 오른 것은 BRD 약세 → 부채의 NER 환산액 감소 → 유리한(positive) 조정입니다.", "B": "부채는 화폐성이라 기말환율로 재환산되므로 환율이 바뀌면 조정이 생깁니다."}, "orig": "ECO Module 3 Q11"}, {"id": "ECO-M3-Q12", "src": "ECO 오답", "module": 3, "tag": "Temporal method – 이익잉여금 plug", "vig": 16, "stem": "Based on Exhibits 1 and 2 and Janssen’s translation method, retained earnings for Triofind-B translated into Triofind’s presentation currency as of 30 June 2017 are closest to:", "opts": {"A": "NER150,225.", "B": "NER170,940.", "C": "NER172,414."}, "ans": "A", "en": "A is correct. Triofind uses the temporal method to translate the financial statements of Triofind-B. The temporal method uses the current exchange rate for translating monetary assets and liabilities and the historical exchange rate (based on the date when the assets were acquired) for non-monetary assets and liabilities. Monetary assets and liabilities are translated using the current exchange rate (as of 30 June 2017) of NER1 = BRD1.17 (or NER0.8547/BRD), and non-monetary assets and liabilities are translated using the historical exchange rate (as of 30 June 2016) of NER1 = BRD1.15 (or NER0.8696/BRD). Inventory is translated at the 2017 weighted average rate of NER1 = BRD1.18 (or NER0.8475/BRD). The difference required to maintain equality between (a) total assets and (b) total liabilities and shareholder’s equity is then recorded as retained earnings. The retained earnings for Triofind-B translated into Norvolt euros (Triofind’s presentation currency) as of 30 June 2017 is calculated as follows:\n\nAssets\t30 June 2017 (BRD)\tExchange Rate (NER/BRD)\tRate Used\t30 June 2017 (NER)\tLiabilities and Stockholders’ Equity\t30 June 2017 (BRD)\tExchange Rate (NER/BRD)\tRate Used\t30 June 2017 (NER)\nCash\t1,350,000\t0.8547\tC\t1,153,846\tNotes Payable\t500,000\t0.8547\tC\t427,350\nInventory\t500,000\t0.8475\tH\t423,729\tCommon Stock\t1,150,000\t0.8696\tH\t1,000,000\n \t \t \t \t \tRetained Earnings\t200,000\t \t \t150,225\n \t1,850,000\t \t \t1,577,575\tTotal\t1,850,000\t \t \t1,577,575", "ko": "Temporal: 현금·부채 = current(1.17), 재고 = 취득시 환율(2017 가중평균 1.18), 자본금 = 역사적(1.15). 자산 1,577,575 − 부채 427,350 − 자본금 1,000,000 = RE 150,225.", "trap": "모든 항목에 current rate를 쓰면(170,940) current rate method 방식.", "f": "Temporal: 화폐성 = current / 비화폐성·자본금 = historical / RE = plug", "why": {"B": "170,940은 RE 200,000을 기말환율(1.17)로 직접 환산한 값입니다. Temporal에서 RE는 B/S를 맞추는 plug입니다.", "C": "RE를 단일 환율로 직접 환산한 값입니다. 자산·부채·자본금을 각 규칙대로 환산한 뒤 plug로 구합니다."}, "orig": "ECO Module 3 Q12"}, {"id": "ECO-M3-Q24", "src": "ECO 오답", "module": 3, "tag": "Temporal method – RE 환산", "vig": 17, "stem": "After translating Consol-Can’s 31 December 20X2 balance sheet into the parent company’s currency (US$), the translated value of retained earnings will be closest to:", "opts": {"A": "$41 million.", "B": "$44 million.", "C": "$46 million."}, "ans": "B", "en": "B is correct. Translating the 20X2 balance sheet using the temporal method, as is required in this instance, results in assets of US$369 million. The translated liabilities and common stock are equal to US$325 million, meaning that the value for 20X2 retained earnings is US$369 million − US$325 million = US$44 million.\n\nTemporal Method (20X2)\nAccount\tC$\t \tRate\t \tUS$\nCash\t135\t \t0.95\t \t128\nAccounts receivable\t98\t \t0.95\t \t93\nInventory\t77\t \t0.92\t \t71\nFixed assets\t100\t \t0.86\t \t86\nAccumulated depreciation\t(10)\t \t0.86\t \t(9)\nTotal assets\t400\t \t \t \t369\nAccounts payable\t77\t \t0.95\t \t73\nLong-term debt\t175\t \t0.95\t \t166\nCommon stock\t100\t \t0.86\t \t86\nRetained earnings\t48\t \tto balance\t \t44\nTotal liabilities and shareholders’ equity\t400\t \t \t \t369", "ko": "Consol-Can 기능통화 = USD(모회사 통화) → temporal. 자산 369(현금·AR·AP·LTD는 0.95, 재고 0.92, 고정자산 0.86) − 부채 239 − 자본금 86 = RE 44.", "trap": "Current rate로 모두 환산하면 다른 값이 나옵니다. 기능통화부터 확인하세요.", "f": "", "why": {"A": "일부 항목(재고·고정자산 등)에 잘못된 환율을 적용한 값입니다. Temporal 규칙: 화폐성 = 0.95, 재고 = 0.92, 고정자산·자본금 = 0.86.", "C": "화폐성/비화폐성 구분을 잘못 적용한 값입니다. RE는 자산 369 − 부채 239 − 자본금 86 = 44."}, "orig": "ECO Module 3 Q24"}, {"id": "ECO-M3-Q25", "src": "ECO 오답", "module": 3, "tag": "기능통화 변경 근거", "vig": 17, "stem": "In response to the board’s first question, Templeton would most likely reply that such a change would be justified if:", "opts": {"A": "the inflation rate in the United States became hyperinflationary.", "B": "management wanted to flow more of the gains through net income.", "C": "Consol-Can were making autonomous decisions about operations, investing, and financing."}, "ans": "C", "en": "C is correct. The Canadian dollar would be the appropriate reporting currency when substantially all operating, financing, and investing decisions are based on the local currency. The parent country’s inflation rate is never relevant. Earnings manipulation is not justified, and at any rate changing the functional currency would take the gains off of the income statement.", "ko": "기능통화 = 주된 경제환경의 통화. 자회사가 영업·투자·재무 결정을 현지통화 기반으로 자율적으로 내리면 CAD로 변경이 정당합니다. 모회사 국가 인플레이션은 무관하고, 이익조작 목적의 변경은 불가.", "trap": "초인플레이션은 '자회사 소재국'일 때 의미 있음 — 모회사(미국) 인플레이션은 무관.", "f": "", "why": {"A": "초인플레이션 판단은 자회사 소재국 기준 — 모회사(미국) 인플레이션은 기능통화 선택과 무관합니다.", "B": "이익 조작 목적의 기능통화 변경은 불가하며, CAD로 바꾸면 오히려 환산손익이 NI에서 빠집니다(OCI)."}, "orig": "ECO Module 3 Q25"}, {"id": "ECO-M3-Q26", "src": "ECO 오답", "module": 3, "tag": "Temporal → Current rate 변경 효과", "vig": 17, "stem": "In response to the board’s second question, Templeton should reply that if the change is made, the consolidated financial statements for Consolidated Motors would begin to recognize:", "opts": {"A": "realized gains and losses on monetary assets and liabilities.", "B": "realized gains and losses on non-monetary assets and liabilities.", "C": "unrealized gains and losses on non-monetary assets and liabilities."}, "ans": "C", "en": "C is correct. If the functional currency were changed from the parent currency (US dollar) to the local currency (Canadian dollar), the current rate method would replace the temporal method. The temporal method ignores unrealized gains and losses on non-monetary assets and liabilities, but the current rate method does not.", "ko": "Current rate method는 모든 자산·부채를 기말환율로 환산 → 비화폐성 항목의 미실현 환산손익도 반영(CTA, OCI). Temporal은 비화폐성 항목을 역사적 환율로 고정해 이를 무시합니다.", "trap": "'실현'손익 선지 — 번역손익은 미실현입니다.", "f": "", "why": {"A": "화폐성 항목은 두 방법 모두 기말환율로 환산되어 이미 손익이 반영됩니다. 또한 번역손익은 '미실현'입니다.", "B": "번역손익은 실현되지 않은(미실현) 손익입니다."}, "orig": "ECO Module 3 Q26"}, {"id": "ECO-M3-Q36", "src": "ECO 오답", "module": 3, "tag": "Temporal exposure 축소", "vig": 18, "stem": "If the US dollar were chosen as the functional currency for Acceletron in 2007, Redline could reduce its balance sheet exposure to exchange rates by:", "opts": {"A": "selling SGD30 million of fixed assets for cash.", "B": "issuing SGD30 million of long-term debt to buy fixed assets.", "C": "issuing SGD30 million in short-term debt to purchase marketable securities."}, "ans": "A", "en": "A is correct. If the US dollar is the functional currency, the temporal method must be used, and the balance sheet exposure will be the net monetary assets of 125 + 230 − 185 − 200 = −30, or a net monetary liability of SGD30 million. This net monetary liability would be eliminated if fixed assets (non-monetary) were sold to increase cash. Issuing debt, either short-term or long-term, would increase the net monetary liability.", "ko": "USD 기능통화 → temporal → 노출 = 순화폐성자산 = 125 + 230 − 185 − 200 = −30(순화폐성부채). 고정자산(비화폐성) 매각 → 현금(화폐성)↑ → 노출 제거. 부채 발행은 순부채 노출 확대.", "trap": "Current rate 노출(순자산)로 생각하는 함정.", "f": "Temporal 노출 = 화폐성자산 − 화폐성부채", "why": {"B": "장기부채 발행 = 화폐성부채 증가 → 순화폐성부채 노출이 오히려 커집니다.", "C": "단기부채로 유가증권 매입 = 화폐성자산·부채가 같이 늘어 순노출 불변(−30 유지)."}, "orig": "ECO Module 3 Q36"}, {"id": "ECO-M3-Q40", "src": "ECO 오답", "module": 3, "tag": "환율 적용 – 화폐성 부채", "vig": 18, "stem": "When translating Acceletron’s financial statements into US dollars, Redline is least likely to use an exchange rate of USD per SGD:", "opts": {"A": "0.671.", "B": "0.588.", "C": "0.654."}, "ans": "B", "en": "B is correct. USD0.671/SGD is the current exchange rate. That rate would be used regardless of whether Acceletron uses the current rate or temporal method. USD0.654 was the weighted-average rate when inventory was acquired. That rate would be used if the company translated its statements under the temporal method but not the current rate method. USD0.588/SGD was the exchange rate in effect when long-term debt was issued. As a monetary liability, long-term debt is always translated using current exchange rates. Consequently, that rate is not applicable regardless of how Acceletron translates its financial statements.", "ko": "LT debt는 화폐성 → 두 방법 모두 current rate. 따라서 발행일 환율 0.588은 어떤 방법에서도 사용되지 않습니다. 0.671(기말)은 양쪽, 0.654(재고 취득)는 temporal에서 사용.", "trap": "부채를 발행일(역사적) 환율로 환산한다는 착각.", "f": "", "why": {"A": "0.671은 기말환율 — current rate·temporal 모두 화폐성 항목 등에 사용합니다.", "C": "0.654는 재고 취득 가중평균 환율 — temporal method에서 재고에 사용합니다."}, "orig": "ECO Module 3 Q40"}, {"id": "ECO-M3-Q42", "src": "ECO 오답", "module": 3, "tag": "USD 강세 – 비용 측 영향", "vig": 19, "stem": "Which of the following statements about the effect of the change in the USD to GBP exchange rate during the year is most accurate? Operating income for Thames would:", "opts": {"A": "increase because of the positive effect on revenues.", "B": "increase because of the positive effect on operating costs.", "C": "decrease because of the negative effect on operating costs."}, "ans": "C", "en": "Correct. Thames incurs fuel and lease costs in USD. During the year, the USD has strengthened relative to the GBP (from GBP0.6400/USD to GBP0.6800/USD), thereby making purchases (costs) in USD more expensive for Thames and thus decreasing operating income.", "ko": "GBP/USD 0.64 → 0.68 = USD 강세. 연료·리스 비용이 USD → GBP 기준 비용↑ → 영업이익↓. 매출은 주로 GBP라 영향 미미.", "trap": "USD 강세를 매출 증가로 연결하는 함정 — 어느 쪽(매출/비용)이 외화인지 먼저 확인.", "f": "", "why": {"A": "Incorrect. The strengthening USD would not significantly affect revenues because most sales are in GBP.", "B": "Incorrect. The USD strengthened thereby increasing the costs incurred in USD and decreasing operating margins."}, "orig": "ECO Module 3 Q42"}, {"id": "ECO-M3-Q43", "src": "ECO 관련유형", "module": 3, "tag": "Transaction exposure – 연말 미실현손실", "vig": 19, "stem": "Which of the following best describes the effect on Thames’s financial statements of the payment terms related to the landing fees in Spain? Thames would:", "opts": {"A": "report an unrealized exchange loss at year-end.", "B": "defer recognizing any currency effects until the payable is paid.", "C": "adjust the landing fees expense to reflect the change in exchange rate when they are paid."}, "ans": "A", "en": "Correct. Between incurring the fees and the year-end, the EUR appreciated against the GBP (GBP0.7400/EUR to GBP0.7500/EUR), and Thames would report an unrealized loss (from holding a liability in an appreciating currency) in net income. The payable would be originally recorded when the landing fees were incurred during the final quarter (GBP0.7400) but revalued at year-end to GBP0.7500; an increase in a liability results in a loss.", "ko": "4분기 발생 EUR 부채를 0.74로 기록, 연말 0.75로 재측정 → 부채 증가 → 미실현손실을 NI에 인식. 결제 전이라도 연말엔 무조건 인식.", "trap": "'결제 시까지 인식 보류'(B)는 틀림.", "f": "", "why": {"B": "Incorrect. FX gains/losses from payables (monetary liabilities) are reported in the period they occur even if not realized.", "C": "Incorrect. The expense would not be adjusted. The choice to not pay it immediately and incur a payable is a financing decision, and the gains and losses from that are not adjusted to the operating cost."}, "orig": "ECO Module 3 Q43"}, {"id": "ECO-M3-Q45", "src": "ECO 오답", "module": 3, "tag": "Temporal – 순화폐성부채 + 외화 강세", "vig": 19, "stem": "The most likely effect of the change in the exchange rate between the EUR and GBP arising from Thames’s investment in Tagus in 2015 will be a translation:", "opts": {"A": "loss reported in net income.", "B": "gain reported in net income.", "C": "adjustment reported in other comprehensive income."}, "ans": "A", "en": "Correct. Thames is using the temporal method for its translation of Tagus, and the initial exposure is a net liability exposure (monetary liabilities of EUR13,500 exceed the monetary assets of EUR4,000). The EUR strengthened against the GBP during the six-month period (from GBP0.7200/EUR to GBP0.7500/EUR). The net effect of having a net liability position in a strengthening currency will be a translation loss for Thames, which, under the temporal method, is reported in net income.", "ko": "Temporal(기능통화 GBP)에서 노출 = 순화폐성 포지션: 화폐성부채 13,500 > 화폐성자산 4,000 → 순부채. EUR 강세(0.72 → 0.75) → 환산손실, temporal이므로 NI 보고.", "trap": "OCI(C)는 current rate method일 때. 순부채 + 강세 통화 = 손실.", "f": "부채 노출 + 외화 강세 → 손실 / 부채 노출 + 외화 약세 → 이익", "why": {"B": "Incorrect. Due to the net liability position in a strengthening currency, it will be a loss not a gain.", "C": "Incorrect. Under the temporal method, it is reported in net income not other comprehensive income."}, "orig": "ECO Module 3 Q45"}, {"id": "ECO-M3-Q52", "src": "ECO 오답", "module": 3, "tag": "FX 효과 – 경영 성과 평가", "vig": 20, "stem": "Which of the following is the most appropriate use of Berg’s reminder about the US dollar versus euro exchange rate in the current year? Peterson should use the information:", "opts": {"A": "when evaluating management’s historical performance.", "B": "to confirm that the division’s organic growth was less than 11.2%.", "C": "to determine the exchange gains or losses included in net income."}, "ans": "A", "en": "Correct. Analysts should consider the foreign currency effect on sales growth for evaluating management’s historical performance. Foreign currency fluctuations are out of management’s control, so management should not be held accountable for the fluctuations when their performance is evaluated.", "ko": "FX 변동은 경영진 통제 밖 → 과거 경영 성과 평가 시 FX 효과를 분리합니다. USD 약세는 매출의 50%를 줄이는 방향 → organic growth는 보고 성장률보다 높음.", "trap": "B는 방향이 반대(organic은 더 높음), C는 매출 환산 효과만으로 FX 손익을 계산할 수 없음.", "f": "", "why": {"B": "Incorrect. The unadjusted growth is 11.3%. If the currency devalued on 50% of the sales, then organic growth must have been greater than 11.3%.", "C": "Incorrect. Whether the FX gains/losses are included in net income depends on the type of foreign subsidiary. The calculation of the FX gains and losses considers more than just the devaluation on sales."}, "orig": "ECO Module 3 Q52"}, {"id": "ECO-M3-Q53", "src": "ECO 관련유형", "module": 3, "tag": "ETR 하락 → 해외 이익 비중↑", "vig": 20, "stem": "The best conclusion Petersen can make about the geographic mix of Rhine’s profit in the current year is that compared with the prior year the mix is:", "opts": {"A": "more domestic.", "B": "about the same.", "C": "more international."}, "ans": "C", "en": "Correct. The current year effective tax rate on earnings is lower than in the prior year (see table), implying that more profits were earned in a lower tax jurisdiction. The foreign operations are in lower tax regimes, so it is reasonable to conclude that more of the profits were earned internationally.\n(€ millions)\tCurrent Year\tPrior Year\nEarnings before taxes\t136.6\t170.0\nNet earnings after tax\t109.9\t132.3\nIncome taxes\t26.7\t37.7\nEffective tax rate (Income taxes/EBT)\t19.6%\t22.2%", "ko": "ETR 22.2% → 19.6% 하락(기타 세액공제 동일 가정) → 저세율(아일랜드 등 해외) 이익 비중 증가 → more international.", "trap": "", "f": "", "why": {"A": "Incorrect. The effective tax rate went down, implying that more business is done in lower tax regimes", "B": "Incorrect. The current year effective tax rate on earnings is lower than in the prior year (see table), implying that more profits were earned in a lower tax jurisdiction. The foreign operations are in lower tax regimes, so it is reasonable to conclude that more of the profits were earned internationally.\n(€ millions)\tCurrent Year\tPrior Year\nEarnings before taxes\t136.6\t170.0\nNet earnings after tax\t109.9\t132.3\nIncome taxes\t26.7\t37.7\nEffective tax rate (Income taxes/EBT)\t19.6%\t22.2%"}, "orig": "ECO Module 3 Q53"}, {"id": "ECO-M3-Q55", "src": "ECO 오답", "module": 3, "tag": "Temporal remeasurement gain", "vig": 21, "stem": "On translation, SunMex’s USD-denominated net income most likely includes:", "opts": {"A": "no re-measurement gains or losses.", "B": "a re-measurement loss of $1.792 million.", "C": "a re-measurement gain of $2.526 million."}, "ans": "C", "en": "Correct. SunMex will be translated using the temporal method because the competitive environment that mainly determines SunMex’s sales prices is that of the United States. Under this approach, monetary assets and liabilities are translated at the year-end rate, and non-monetary items are translated at historical rates.\nBecause it is SunMex’s first year of operations, the retained earnings will include only the translated net income for the year. The translated net income will include the re-measurement gain or loss in accordance with the temporal method. As shown in the following table, the retained earnings balance required to balance the balance sheet is USD2.352 million.\nBalance Sheet\tItem Type\tMXN\n(millions)\tExchange Rate\n(MXN per USD)\tUSD\n(millions)\nCash and A/R\tMonetary\t47\t0.0513 (year-end)\t2.411\nFixed assets (net)\tNon-monetary\t370\t0.0625 (historical)\t23.125\nTotal assets\t---\t417\t---\t25.536\nCurrent liabilities\tMonetary\t33\t0.0513 (year-end)\t1.693\nLong term debt\tMonetary\t224\t0.0513 (year-end)\t11.491\nCommon shares\tNon-monetary\t160\t0.0625 (historical)\t10.000\nRetained earnings*\tUsed to balance\t0\t---\tX = 2.352\nTotal liabilities and equity\t---\t417\t---\t25.536\n* Retained earnings: 25.536 – (1.693 + 11.491 + 10.000) = $2.352 million\nUnder the temporal method, the income statement is translated at the average rate, except for expenses linked to non-monetary items on the balance sheet. For SunMex, depreciation is translated at the historical rate, but the rest of the income statement is translated at the average.\nIncome Statement\tMXN\n(millions)\tExchange Rate\n(MXN per USD)\tUSD\n(millions)\nSales\t140\t0.0538 (average)\t7.532\nDepreciation expense\t20\t0.0625 (historical)\t1.250\nOther expenses\t120\t0.0538 (average)\t6.456\nIncome before re-measurement gain or loss\t---\t---\t(0.174)\nRe-measurement gain**\t---\t---\tY = 2.526\tSee calculation\nNet income required = retained earnings\t0\t---\t2.352\tFrom earlier balance sheet calculations\n** The re-measurement (translation) gain or loss = 2.352 – (–0.174) = 2.526 gain", "ko": "SunMex 가격은 미국 시장이 결정 → 기능통화 USD → temporal. MXN 약세 + 순화폐성부채(47 − 33 − 224 = −210) → 재측정 이익 2.526이 NI에 포함.", "trap": "1.792 손실은 current rate method(순자산 노출) 계산이며 OCI로 갑니다.", "f": "", "why": {"A": "Incorrect. This answer assumes that the translational adjustment is shown on the balance sheet, as is the case for the current rate method.", "B": "Incorrect. This is the re-measurement loss that would be calculated under the current rate method.\nBalance sheet\tMXN\n(millions)\tExchange rate\n(MXN/USD)\tUSD\n(millions)\nNet assets\t(417 – 33 – 224) = 160\t0.0513\t8.208\nCommon shares\t160\t0.0625\t10.000\nRetained earnings*\t0\t---\t0\nRe-measurement loss (OCI)\t---\t---\t1.792\nTotal equity\t160\t---\t8.208\n* AOCI = 10.0 – 8.208 = 1.792"}, "orig": "ECO Module 3 Q55"}, {"id": "ECO-M3-Q58", "src": "ECO 오답", "module": 3, "tag": "FX가 매출 증가에 미친 영향", "vig": 9, "stem": "Using Exhibits 1, 2, and 3 and Lars’s notes about the US operations, the change in sales reported for the US region (in SEK millions) explained by the change in the SEK/USD exchange rate in 2015 is closest to:", "opts": {"A": "SEK737.", "B": "SEK813.", "C": "SEK1,432."}, "ans": "A", "en": "Correct. The number of stores in the United States is the same in 2014 and 2015 (80). The average sales per US store in 2014 is the same as the Swedish stores, and the USD sales are the same in both years. But when sales are converted into SEK, the values reflect the change in the exchange rate over the period.\nCalculations\tSEK (millions)\nNumber of stores in the United States (Exhibit 1)\t80\t---\nAverage sales/US store in 2014\n(same as the Swedish stores in 2014)\tSEK4,653/99 stores =\t47/Store\nSales/US store (in USD millions) based on average exchange rate in 2014\t(SEK47/Store)/(SEK6.350/USD) = USD7.40/Store\t---\nTotal USD sales (in USD millions) in 2014 and 2015 (same both years in USD)\t80 stores × (USD7.40/Store) = USD592.13\t---\nTotal USD sales in 2014 in SEK\tUSD592.13 × (SEK6.350/USD) =\t3,760\nSales in USD in 2015 (the same as 2014), converted at the 2015 average rate\tUSD592.13 × (SEK7.595/USD) =\t4,497\nIncrease in sales because of change in exchange rate\t737", "ko": "US 매장당 매출(2014) = 스웨덴 매장과 동일 4,653/99 = 47 SEK → USD 47/6.35 × 80 = USD 592.1 (2015도 동일). FX 효과 = 592.1 × (7.595 − 6.35) = 737.", "trap": "매출은 평균환율로 환산(기말환율 쓰면 1,432), 기준은 스웨덴(모회사) 매장(전체 평균 쓰면 813).", "f": "FX 효과 = USD 매출 × (평균환율t − 평균환율t−1)", "why": {"B": "Incorrect. It uses the average sales overall, not the Swedish ones to determine sales level.\nNumber of stores in the United States\t80\t---\nAverage sales/US store (in millions SEK) is the same as total stores in 2014\tIn 2014: SEK26,892/519 store = SEK51.815/store\t(the error)\nSales/US store (in millions USD)\nbased on average exchange rate in 2014\tSEK51.815/store/6.35 SEK/USD = $8.160/store\t---\nTotal USD sales (in millions USD) in 2014 and 2015 (same both years in USD)\t80 store × 8.160 USD/store = 652.79 USD\t---\nTotal USD sales in 2014 (in millions SEK)\t652.79 USD × 6.350 SEK/USD\tSEK4,145\nSales in USD in 2015 (the same as 2014)\nConverted at the 2015 average rate\t652.79 USD × 7.595 SEK/USD\tSEK4,958\nIncrease in sales (in millions) due to change in exchange rate\tSEK813", "C": "Incorrect. It uses year-end rates instead of average rates to convert sales\nNumber of stores in United States\t80\t---\nAverage sales/US store (in millions SEK)\n(same as the Swedish stores in 2014)\tIn 2014: SEK4,653/99 stores = SEK47/store\t---\nSales/US store (in millions USD)\nbased on ending exchange rate in 2014\tSEK47/store/6.380 SEK/USD = $7.367\t(the error)\nTotal USD sales (in millions USD) in 2014\t80 stores × $7.367/store = $589.36\t---\nTotal USD sales in 2014 (in millions SEK)\t$589.36 × 6.380 SEK/USD\tSEK3,760\nSales in USD in 2015 (the same as 2014)\nConverted at the 2015 closing rate (the error)\t$589.36 USD × 8.810 SEK/USD\tSEK5,192\nIncrease in sales (in millions) due to change in exchange rate\tSEK1,432"}, "orig": "ECO Module 3 Q58"}, {"id": "ECO-M3-Q60", "src": "ECO 오답", "module": 3, "tag": "Hyperinflation (IFRS) – 통합 자회사", "vig": 9, "stem": "Which of the following is Lars’s most appropriate answer to Eriksson’s question concerning the accounting method used for Anart in 2015?", "opts": {"A": "Yes, the temporal method is being used, as in past years.", "B": "No, the current rate method is being used, after restating nonmonetary items for inflation.", "C": "No, the current rate method is being used, after restating all accounts for the general price index."}, "ans": "B", "en": "Correct. Because Anart is an extension of Trana (Anart sells 100% of its production to the group) its functional currency would be the Swedish krona, not the local currency, and it would be considered an integrated foreign operation. As an integrated foreign operation, Trana would normally, and historically, have accounted for Anart using the temporal method. But the country in which Anart operates is experiencing high inflation; three years (2013–2015) of rates near 30% would exceed the 100% indicator of hyperinflation. Therefore, under IFRS, the nonmonetary items must be adjusted for the loss in purchasing power to better reflect economic reality. Note that only the nonmonetary items are adjusted because monetary ones would already be expressed in the monetary unit current at the balance sheet date.", "ko": "Anart는 모회사의 연장(전량 그룹 판매) → 원래 temporal. 3년 연 30% 가까운 인플레이션 → 누적 >100% = 초인플레이션 → IFRS: 비화폐성 항목을 GPI로 재작성 후 current rate로 환산. 화폐성 항목은 이미 현재 구매력 단위라 재작성 불필요.", "trap": "'모든 계정 재작성'(C) 함정 — 화폐성 항목은 재작성하지 않습니다.", "f": "", "why": {"A": "Incorrect. Now that the high inflation has lasted at least three years it can be considered hyperinflation, and different translation methods must be used to reflect economic reality.", "C": "Incorrect. Only nonmonetary items are affected by the loss of purchasing power and must be restated."}, "orig": "ECO Module 3 Q60"}, {"id": "ECO-M3-Q61", "src": "ECO 오답", "module": 3, "tag": "세율 변경 효과 – Tax treaty", "vig": 9, "stem": "If the proposed reduction in Swedish tax rates had been in effect in 2015, the increase in Trana’s net profit (in SEK millions) would have been closest to:", "opts": {"A": "SEK18.6.", "B": "SEK29.8.", "C": "SEK31.2."}, "ans": "C", "en": "Correct. The proposed change in Swedish tax rates would have affected the income earned in Sweden (SEK338 before tax) and the pre-tax income earned in the South American subsidiary (SEK227, see calculation in following table) because the tax rate there is lower than in Sweden and hence subject to tax at Swedish rates. The income earned in tax jurisdictions with rates higher than Sweden’s (Europe and the United States) are not subject to tax in Sweden and thus would not have been affected.\nTax Effect as Reported (22%)\tUnder Proposal (16.5%)\tDifference\nSwedish earnings before taxes (EBT)\tSEK338\t74.4\t55.8\tSEK18.6\nSouth American EBT*\tSEK227\t50.0\t37.4\tSEK12.6\nTotal\t---\t---\t---\tSEK31.2\n* To calculate EBT, divide net profit of SEK204 by (1 – tax rate): 204/(1 – 0.10) = SEK227.", "ko": "스웨덴 세율 변화 영향: 스웨덴 EBT 338 + 저세율(10%) Anart의 EBT(204/0.9 = 227)만 해당. 고세율 지역(유로 30%, 미국 25%) 소득은 스웨덴 과세 없음 → (338 + 227) × 5.5% = 31.2.", "trap": "Anart 세후이익(204)을 그대로 쓰면 29.8, Anart를 빼면 18.6.", "f": "EBT = NI / (1 − t)", "why": {"A": "Incorrect. It is only the EBT in Sweden: 338 × (0.22 – 0.165) = 18.6.", "B": "Incorrect. It uses net profit as given for South America and fails to adjust it back to EBT: (338 + 204) × (0.22 – 0.165) = 29.81."}, "orig": "ECO Module 3 Q61"}, {"id": "ECO-M3-Q62", "src": "ECO 오답", "module": 3, "tag": "ETR 낮추기 & FX 손익", "vig": 9, "stem": "Which of the following strategies would be most likely to help Trana achieve at least one of the objectives mentioned by Eriksson for 2016?", "opts": {"A": "Increase the number of stores in the US region", "B": "Initiate a hedge on the net asset position of the eurozone subsidiary", "C": "Raise the price at which Anart sells its goods to other group members"}, "ans": "C", "en": "Correct. Anart operates in a South American country with the lowest tax rate of the group—10% versus 25% in the United States, 30% in the eurozone, and 22% (or 16.5%) in Sweden. If more of the corporate profits are earned by Anart, the effective tax rate will decrease.\nAnart currently earns a return of 204/4,485 = 4.5%, whereas the overall corporate profit rate is 10.3% (3,096/30,200).\nAny income taxed in South America would be eligible for a tax credit in Sweden, and Trana would be liable for the tax difference between the local 10% rate and the rate in Sweden (22% or 16.5%).\nTo the extent that taxable income can be diverted from the US or eurozone operations (where the rates are higher than Sweden’s), it would result in an overall tax saving for Trana.\nBy increasing the price at which Anart sells goods to the US and eurozone subsidiaries, it would increase the taxable income earned in South America and reduce the taxable income (through higher cost of goods sold) in the United States and the eurozone. Because of the tax treaty with Sweden, there would be no net tax savings on the goods sold to US and eurozone stores by Anart if the prices change.\nBecause both retail subsidiaries are translated using the current rate method, all foreign exchange gains/losses are reported in other comprehensive income not on the income statement. Therefore, the effects of hedging the exposure in the eurozone subsidiary would also be reported in other comprehensive income and not affect the income statement.\nIncreasing the number of stores in the US would increase the amount of income in the highest tax jurisdiction and hence increase taxes, not lower them.", "ko": "Anart(세율 10%)의 이전가격↑ → 고세율(미국·유로) 이익을 저세율로 이동 → ETR↓. 유로·미국 자회사는 current rate → FX 손익이 OCI에 있어 헤지해도 NI의 FX 손익 감소 효과 없음.", "trap": "미국 매장 확대 = 고세율 소득 증가. 유로 순자산 헤지 = OCI 효과일 뿐.", "f": "", "why": {"A": "Incorrect. Increasing the number of stores in the US region will not affect the tax rate, but would increase taxable income because the tax rate there is greater than in Sweden and would not affect foreign exchange gains and losses on the income statement because it is self-sustaining, and the gains and losses go to other comprehensive income.", "B": "Incorrect. The eurozone subsidiary is also self-sustaining, and any effect of hedging its net asset position would go to other comprehensive income, not net income. The eurozone’s taxes are higher than in Sweden, so there would be no lowering of taxes either."}, "orig": "ECO Module 3 Q62"}, {"id": "ECO-M3-Q66", "src": "ECO 관련유형", "module": 3, "tag": "Profit mix – 해외세율 효과 항목", "vig": null, "stem": "An analyst gathers the following information about a company's tax disclosures:\nYear T – 1\tYear T – 2\nStatutory domestic tax rate\t28%\t30%\nEffect of tax rates in foreign jurisdictions\t4%\t2%\nEffect of tax exemptions and other reconciling items\t–2%\t–2%\nEffective tax rate\t30%\t30%\nCompared to Year T – 2, in Year T – 1 the company most likely generated:", "opts": {"A": "a lower share of its profit in countries with higher marginal tax rates.", "B": "the same proportion of profit in countries with higher marginal tax rates.", "C": "a higher share of its profit in countries with higher marginal tax rates."}, "ans": "C", "en": "Correct because the effect of tax rates in foreign jurisdictions rose from 2% to 4%. This greater impact could indicate that profit mix shifted to countries with higher marginal tax rates. The change could also indicate that the marginal tax rates increased in the countries in which it earns profits.", "ko": "Effect of foreign tax rates +2% → +4%(양(+)의 효과 확대) → 고세율 국가 이익 비중↑. ETR 합계(30%)가 같아도 구성 변화로 판단.", "trap": "ETR 합계가 같다고 '변화 없음'(B) 선택하는 함정.", "f": "", "why": {"A": "Incorrect because the effect of tax rates in foreign jurisdictions rose from 2% to 4%.", "B": "Incorrect because the effect of tax rates in foreign jurisdictions rose from 2% to 4%, indicating a higher share of profits being generated in countries with higher marginal tax rates."}, "orig": "ECO Module 3 Q66"}, {"id": "ECO-M3-Q67", "src": "ECO 오답", "module": 3, "tag": "Sustainable sales growth", "vig": null, "stem": "A company reported the following information related to its sales growth in the most recent year:\nContribution from volume growth\t7%\nContribution from price increases\t2%\nContribution from foreign currency exchange\t–3%\nTotal sales growth\t6%\nThe best estimate of its sustainable growth for the year is:", "opts": {"A": "6%.", "B": "7%.", "C": "9%."}, "ans": "C", "en": "Correct because volume and price increases are 7% + 2% = 9%. Growth in sales that comes from changes in volume or price is more sustainable than growth in sales that comes from changes in exchange rates. Further, management arguably has greater control over growth in sales resulting from greater volume or higher price than from changes in exchange rates.", "ko": "지속가능(organic) 성장 = 수량 + 가격 = 7% + 2% = 9%. FX 효과는 지속가능하지 않고 경영진 통제 밖이므로 제외.", "trap": "총 성장률(6%)이나 수량만(7%) 고르는 함정.", "f": "Sustainable growth = Volume + Price (FX 제외)", "why": {"A": "Incorrect because this is the total sales growth which includes the impact from foreign currency and it should not be considered sustainable. The sustainable sales growth consists of volume and price increases 7% + 2% = 9%.", "B": "Incorrect because this represents the volume growth. The sustainable sales growth should include both the price increases and the volume growth = 2% + 7% = 9%."}, "orig": "ECO Module 3 Q67"}, {"id": "ECO-M3-Q70", "src": "ECO 관련유형", "module": 3, "tag": "Cash flow at risk vs Principal exposure", "vig": null, "stem": "An analyst gathers the following information about a multinational company's additional disclosures section of the notes for a given fiscal year:\nPrincipal Exposure\tCash Flow at Risk\nEUR/USD\tEUR 700 million\tEUR 40 million\nEUR/GBP\tEUR 710 million\tEUR 30 million\nEUR/USD is the amount of EUR per 1 USD.\nEUR/GBP is the amount of EUR per 1 GBP.\nThe potential negative impact on earnings from exchange rate fluctuations is:", "opts": {"A": "lower for USD than for GBP.", "B": "the same for both USD and GBP.", "C": "higher for USD than GBP."}, "ans": "C", "en": "Correct because the cash flow at risk is higher for the USD exposure (being €40 million) compared to GBP exposure (being €30 million). Principal exposures are compared to all hedges that are in place. The net cash flow surplus represents an uncovered risk position. The cash-flow-at-risk approach involves allocating the impact of potential exchange rate fluctuations to operating cash flows on the basis of probability distributions.", "ko": "실제 위험 크기는 헤지 후 미커버 노출인 cash flow at risk로 판단: USD 40m > GBP 30m. Principal(총) 노출은 출발점일 뿐.", "trap": "총 노출(GBP 710 > USD 700)로 판단하는 함정.", "f": "", "why": {"A": "Incorrect because the cash flow at risk is higher for the USD exposure (being €40 million) compared to GBP exposure (being €30 million).", "B": "Incorrect because the cash flow at risk is higher for the USD exposure (being €40 million) compared to GBP exposure (being €30 million)."}, "orig": "ECO Module 3 Q70"}, {"id": "ECO-M3-Q71", "src": "ECO 오답", "module": 3, "tag": "Functional currency 정의", "vig": null, "stem": "A foreign subsidiary is located in the UK and its parent is located in the US. The subsidiary primarily conducts business in EUR but reports in GBP. The subsidiary's functional currency is most likely:", "opts": {"A": "GBP.", "B": "EUR.", "C": "USD."}, "ans": "B", "en": "Correct because the functional currency, is the currency of the primary economic environment in which an entity operates. Normally, the functional currency is the currency in which an entity primarily generates and expends cash.", "ko": "기능통화 = 주로 현금을 창출·지출하는 주된 경제환경의 통화 → EUR. 보고에 쓰는 GBP는 presentation currency, USD는 모회사 통화.", "trap": "표시통화·소재국 통화와 기능통화를 혼동.", "f": "", "why": {"A": "Incorrect because the currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located.", "C": "Incorrect because USD is the local currency of the parent company. Whereas in some cases, the foreign subsidiary could have the parent’s functional currency as its own. The functional currency, is the currency of the primary economic environment in which an entity operates. Normally, the functional currency is the currency in which an entity primarily generates and expends cash."}, "orig": "ECO Module 3 Q71"}, {"id": "ECO-M3-Q72", "src": "ECO 오답", "module": 3, "tag": "Transaction exposure – 연말 미실현손익", "vig": null, "stem": "An analyst gathers the following information about a company’s transactions occurring on 15 December:\n• USD 50,000 export, invoiced and paid on the same day; and\n• USD 200,000 import, invoiced and will be paid in 30 days.\nThe company’s functional and presentation currency is EUR and the spot exchange rates are:\nReference Date\tEUR/USD\n15 December\t0.9525\n31 December\t0.9470\nNote: EUR/USD is the amount of EUR per 1 USD.\nIf the company's year end is 31 December, the company would report as a result of these transactions:", "opts": {"A": "no foreign currency gain or loss.", "B": "a EUR 825 foreign currency gain.", "C": "a EUR 1,100 foreign currency gain."}, "ans": "C", "en": "Correct because transaction exposure related to imports and exports can be summarized as follows: Import purchase - A transaction exposure arises when the importer is obligated to pay in foreign currency and is allowed to defer payment until sometime after the purchase date. Export sale - A transaction exposure arises when the exporter agrees to be paid in foreign currency and allows payment to be made sometime after the purchase date. Also, a foreign currency payable resulting from an import purchase creates a liability exposure to foreign exchange risk. If the foreign currency weakens, the foreign currency payable loses value in terms of the functional currency and a gain exists. In addition, for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. In this case:\nTransaction 1: the export is cashed the same day the invoice is issued, thus it does not lead to foreign exchange exposure\nTransaction 2: the import leads to foreign exchange exposure since payment is deferred for 30 days. Considering the foreign currency, USD, weakens, the company reports a gain equal to Import value × (Spot rate as of December 15 – Spot rate as of December 31) = USD 200,000 × (0.9525 EUR/USD – 0.9470 EUR/USD) = USD 200,000 × 0.0055 EUR/USD = EUR 1,100.", "ko": "수출: 당일 결제 → 노출 없음. 수입: 30일 후 결제(다음 연도) → 연말에 반드시 미실현 손익 인식. USD 약세(0.9525 → 0.9470) → USD 부채 가치↓ → 이익 200,000 × 0.0055 = EUR 1,100.", "trap": "'결제 전이라 인식 보류'(A)는 틀림. 당일 결제 수출에 손실을 넣으면 B.", "f": "", "why": {"A": "Incorrect because it considers neither transaction generates any foreign exchange exposure, as follows:\nTransaction 1: the export is cashed the same day the invoice is issued thus it does not lead to foreign exchange exposure;\nTransaction 2: the payment is deferred for the following year, thus no exposure is recognized at the intervening balance sheet date as of December 31.", "B": "Incorrect because it determines a gain on Transaction 2 and a loss on Transaction 1 (instead of 0 impact) as follows:\nTransaction 1: Loss = Export value × (Spot rate as of December 15– Spot rate as of December 31) = USD50,000 × (0.9525 EUR/USD – 0.9470 EUR/USD) = USD 50,000 × 0.0055 EUR/USD = EUR 275.\nTransaction 2: Gain = Import value × (Spot rate as of December 15– Spot rate as of December 31) = USD200,000 × (0.9525 EUR/USD – 0.9470 EUR/USD) = USD 200,000 × 0.0055 EUR/USD = EUR 1,100.\nTotal result = Gain in Transaction 2 – Loss in Transaction 1 = 1,100 – 275 = EUR 825."}, "orig": "ECO Module 3 Q72"}, {"id": "ECO-M3-Q73", "src": "ECO 오답", "module": 3, "tag": "Current rate method – 총자산", "vig": null, "stem": "An analyst gathers the following information (in GBP) as of 31 December about the UK subsidiary of a German company that purchased property and equipment on 1 January:\nCash\t1,000,000\nAccounts receivable\t700,000\nInventory\t800,000\nProperty and equipment\t4,500,000\nTotal assets\t7,000,000\nThe following exchange rate information was gathered:\nDate\tEUR/GBP\n1 January\t1.1550\n31 December\t1.1625\nWeighted-average rate when inventory was acquired\t1.1430\nNote: EUR/GBP is the amount of EUR per 1 GBP.\nThe functional currency of the subsidiary is GBP. After translating the UK subsidiary's balance sheet into the parent company's currency (EUR), the UK subsidiary would recognize total assets of:", "opts": {"A": "EUR 8,088,150.", "B": "EUR 8,121,900.", "C": "EUR 8,137,500."}, "ans": "C", "en": "Correct because the functional currency of the subsidiary is GBP, the local currency, and thus, the current rate method is used. Thus, assets and liabilities are translated at the current exchange rate on the balance sheet date of 31 December.\nCash\t= GBP 1,000,000 × EUR/GBP 1.1625 = EUR1,162,500\nAccounts receivable\t= GBP 700,000 × EUR/GBP 1.1625 = EUR 813,750\nInventory\t= GBP 800,000 × EUR/GBP 1.1625 = EUR 930,000\nProperty and equipment\n= GBP 4,500,000 × EUR/GBP 1.1625 = EUR 5,231,250\nTotal assets\t= 1,162,500 + 813,750 + 930,000 + 5,231,250 = EUR 8,137,500\nAlternatively, Total assets = GBP 7,000,000 × EUR/GBP 1.1625 = EUR 8,137,500.", "ko": "기능통화 GBP(현지) ≠ 모회사 EUR → current rate → 모든 자산을 기말환율 1.1625로: 7,000,000 × 1.1625 = EUR 8,137,500.", "trap": "재고에 가중평균, PP&E에 역사적 환율을 쓰면 temporal 방식(A, B).", "f": "", "why": {"A": "Incorrect because Inventory is translated at the weighted-average rate when inventory was acquired (as per the temporal method) instead of the current exchange rate on the balance sheet date of 31 December (as required under the current method) and Property and Equipment is translated at the historical exchange rate when the assets were acquired, on 1 January.\nCash\t= GBP 1,000,000 × EUR/GBP 1.1625 = EUR1,162,500\nAccounts receivable\t= GBP 700,000 × EUR/GBP 1.1625 = EUR 813,750\nInventory\t= GBP 800,000 × EUR/GBP 1.1430 = EUR 914,400\nProperty and equipment\n= GBP 4,500,000 × EUR/GBP 1.1550 = EUR 5,197,500\nTotal assets\t= 1,162,500 + 813,750 + 914,400 + 5,197,500 = EUR 8,088,150", "B": "Incorrect because Inventory is translated at the weighted-average rate when inventory was acquired (as per the temporal method) instead of the current exchange rate on the balance sheet date of 31 December (as required under the current method).\nCash\t= GBP 1,000,000 × EUR/GBP 1.1625 = EUR1,162,500\nAccounts receivable\t= GBP 700,000 × EUR/GBP 1.1625 = EUR 813,750\nInventory\t= GBP 800,000 × EUR/GBP 1.1430 = EUR 914,400\nProperty and equipment\n= GBP 4,500,000 × EUR/GBP 1.1625 = EUR 5,231,250\nTotal assets\t= 1,162,500 + 813,750 + 914,400 + 5,231,250 = EUR 8,121,900"}, "orig": "ECO Module 3 Q73"}, {"id": "ECO-M3-Q76", "src": "ECO 오답", "module": 3, "tag": "미결제 외화거래 손익 – I/S", "vig": null, "stem": "A company entered into a foreign currency transaction whose settlement date falls in a subsequent accounting period. Will the unrealized gain or loss on this foreign currency transaction be reported on the financial statements for the current period?", "opts": {"A": "No", "B": "Yes, it will be reported on the income statement", "C": "Yes, it will be reported in other comprehensive income"}, "ans": "B", "en": "Correct because for foreign currency transactions whose settlement dates fall in subsequent accounting periods, both IFRS and US GAAP require adjustments to reflect intervening changes in currency exchange rates. Foreign currency transaction gains and losses are reported on the income statement, creating one of the few situations in which accounting rules allow, indeed require, companies to include (recognize) a gain or loss in income before it has been realized.", "ko": "결제일이 다음 기간이면 IFRS·US GAAP 모두 중간 B/S일 환율 변동을 반영하고 손익은 I/S에 인식(미실현이어도). 실현 전 손익을 인식하는 드문 예.", "trap": "OCI(C) 함정 — OCI는 current rate method의 translation adjustment.", "f": "", "why": {"A": "Incorrect because foreign currency transaction gains and losses are reported on the income statement.", "C": "Incorrect because foreign currency transaction gains and losses are reported on the income statement; not in other comprehensive income."}, "orig": "ECO Module 3 Q76"}, {"id": "ECO-M3-Q77", "src": "ECO 오답", "module": 3, "tag": "실현·미실현 거래손익", "vig": null, "stem": "A company has both realized and unrealized foreign currency transaction gains. The company should report the:", "opts": {"A": "realized and unrealized gains on the income statement.", "B": "realized gains on the income statement and not report the unrealized gains.", "C": "realized gains on the income statement and unrealized gains on the balance sheet."}, "ans": "A", "en": "Correct because both IFRS and US GAAP require foreign currency transaction gains and losses to be reported in net income even if the gains and losses have not yet been realized.", "ko": "외화 거래손익은 실현·미실현 모두 당기손익(I/S)에 보고합니다.", "trap": "미실현은 B/S나 미보고라는 함정.", "f": "", "why": {"B": "Incorrect because unrealized gains must be reported on the income statement.", "C": "Incorrect because unrealized gains must be reported on the income statement."}, "orig": "ECO Module 3 Q77"}, {"id": "ECO-M3-Q80", "src": "ECO 오답", "module": 3, "tag": "Temporal vs Current rate – 외화 약세", "vig": null, "stem": "The foreign currency of a subsidiary has consistently depreciated against the parent's presentation currency. The subsidiary does not have any non-monetary liabilities, but does have long-term debt issued five years ago. Compared to the current rate method, the temporal method of translation most likely results in:", "opts": {"A": "lower reported assets.", "B": "higher reported equity.", "C": "higher reported liabilities."}, "ans": "B", "en": "Correct because the temporal method will result in higher reported assets since some of the assets will be reported at a higher historical exchange rate. The liabilities will be the same as all liabilities will be translated at the same current exchange rate under both methods. As a result, the temporal method will result in a higher equity balance so that the balance sheet will balance. The current rate method will have a negative translation adjustment due to the depreciation of the foreign currency that will be reported in the equity section.", "ko": "외화 약세: temporal은 일부 비화폐성자산을 역사적(높은) 환율로 환산 → 자산↑. 부채는 비화폐성부채가 없으므로 둘 다 current → 동일. 따라서 temporal의 자본이 더 큼(current rate는 음(−)의 CTA).", "trap": "LT debt를 발행일 환율로 환산한다고 착각하면 C를 고르게 됩니다.", "f": "", "why": {"A": "Incorrect because as the foreign currency depreciates, the current rate method will use the lower current exchange rate to translate the assets, but the temporal method will use the higher historical rate to translate some of the non-monetary assets. As a result of using a higher exchange rate for some of the assets, the temporal method will report a higher total asset value than when using the current rate method.", "C": "Incorrect because as the foreign current depreciates, the current rate method will use the lower current exchange rate to translate the liabilities, as will the temporal method with the exception of non-monetary liabilities. If the company has no non-monetary liabilities, the reported liabilities will be the same under both methods."}, "orig": "ECO Module 3 Q80"}, {"id": "ECO-M3-Q81", "src": "ECO 오답", "module": 3, "tag": "Hyperinflation – Stock 항목 재작성", "vig": null, "stem": "A subsidiary of a European based parent company operates in a foreign country experiencing hyperinflation. The general price level and exchange rates for the country were reported as:\nGeneral\nPrice Level\nEuro (€) per\nForeign Currency\nBeginning of the year\t150\t0.360\nAverage for the year\t250\t0.210\nEnd of the year\t375\t0.160\nIf the subsidiary reported a capital stock of 100,000 (in foreign currency units) at the beginning of the year, the reported value at the end of the year is closest to:", "opts": {"A": "€16,000.", "B": "€27,000.", "C": "€40,000."}, "ans": "C", "en": "Correct because under IFRS, capital stock is first restated in terms of general price level and then translated at the current exchange rate at the end of the period.  The restatement factor using the general price index is 2.5 (= 375/150).  Therefore the inflation adjusted foreign currency value is 100,000 × 2.5 = 250,000.  The ending exchange rate is 0.160 so the reported value is 250,000 × 0.160 = 40,000.", "ko": "자본금(stock 항목) 재작성 계수 = 기말GPI/기초(취득)GPI = 375/150 = 2.5 → 250,000 × 0.160 = €40,000.", "trap": "재작성 없이 환산(16,000), 평균GPI 사용(27,000) 함정.", "f": "Stock: 금액 × GPI기말/GPI취득시점 × 기말환율", "why": {"A": "Incorrect because it does not restate the capital stock in terms of the general price index and translates the value at the ending exchange rate. Reported value of capital stock = 100,000 × 0.160 = 16,000.", "B": "Incorrect because it uses the average general price index for the year in the restatement factor. Ending reported value of capital stock = 100,000 × (250/150) × 0.160 = 26,667 ≈ 27,000."}, "orig": "ECO Module 3 Q81"}, {"id": "ECO-M3-Q85", "src": "ECO 오답", "module": 3, "tag": "Presentation currency", "vig": null, "stem": "A US-based multinational corporation has a UK subsidiary with primary activities in Europe. The financial statements of the subsidiary for local regulators are most likely presented in:", "opts": {"A": "EUR.", "B": "GBP.", "C": "USD."}, "ans": "B", "en": "Correct because the subsidiary's presentation currency is most likely GBP. The currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located.", "ko": "현지 규제당국용 재무제표는 보통 회사 소재국 통화(GBP)로 표시합니다. 기능통화는 EUR일 가능성, 모회사 표시통화는 USD.", "trap": "기능통화(EUR)와 표시통화를 혼동.", "f": "", "why": {"A": "Incorrect because the subsidiary's presentation currency is most likely GBP. The currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located. The parent's local currency is USD and the subsidiary's functional currency is most likely EUR. Another important concept in accounting for foreign currency activities is the functional currency, which is the currency of the primary economic environment in which an entity operates. Normally, the functional currency is the currency in which an entity primarily generates and expends cash.", "C": "Incorrect because the subsidiary's presentation currency is most likely GBP.\nThe currency in which financial statement amounts are presented is known as the presentation currency. In most cases, a company’s presentation currency will be the currency of the country where the company is located. However, the parent's presentation currency is most likely USD."}, "orig": "ECO Module 3 Q85"}, {"id": "ECO-M3-Q86", "src": "ECO 오답", "module": 3, "tag": "외화 약세 – Current rate 영업이익↑", "vig": null, "stem": "Masswell corporation opens a foreign subsidiary and elects to report the subsidiary's results using the current rate method. During the first year of operations, the foreign currency depreciates against Masswell's home currency. Did the choice of reporting method affect Masswell's reported operating income?", "opts": {"A": "No", "B": "Yes, operating income was lower than it would have been under the temporal method", "C": "Yes, operating income was higher than it would have been under the temporal method"}, "ans": "C", "en": "Correct because under the current rate method revenues and expenses are translated at the exchange rate that existed when the transactions took place. Under the temporal method expenses related to non-monetary assets, such as cost of goods sold (inventory), depreciation (fixed assets), and amortization (intangible assets), are translated at the exchange rates used to translate the related assets. The depreciating foreign currency means that under the current rate method these non-monetary expenses would be translated at the lower average exchange rate causing operating income to be higher under the current rate method than under the temporal method.", "ko": "외화 약세: current rate는 COGS·감가상각도 평균(더 낮은) 환율로 환산 → 비용이 작게 → 영업이익↑. Temporal은 이들 비용을 역사적(더 높은) 환율로 환산.", "trap": "매출은 두 방법 모두 평균환율 — 차이는 비화폐성 관련 비용에서 발생.", "f": "", "why": {"A": "Incorrect because operating income would be higher under the current rate method given these circumstances.", "B": "Incorrect because operating income would be higher under the current rate method given these circumstances."}, "orig": "ECO Module 3 Q86"}, {"id": "ECO-M3-Q87", "src": "ECO 관련유형", "module": 3, "tag": "Hyperinflation (IFRS) – 비화폐성 재작성", "vig": null, "stem": "A subsidiary of a European-based company reporting under IFRS operates in a foreign country that is experiencing hyperinflation. When adjusting the foreign currency financial statements for inflation, which balance sheet item is most likely to be restated for changes in the general purchasing power of the foreign monetary unit?", "opts": {"A": "Payables", "B": "Inventory", "C": "Receivables"}, "ans": "B", "en": "Correct because IFRS require the foreign currency financial statements first to be restated for inflation using the procedures of IAS 29, and then the inflation-adjusted financial statements are translated using the current exchange rate. IAS 29 requires non-monetary assets, which include inventory, and non-monetary liabilities to be restated for changes in the general purchasing power of the monetary unit.", "ko": "IAS 29: 비화폐성 자산·부채(재고 등)를 일반물가지수로 재작성. 화폐성 항목(채권·채무)은 재작성하지 않음.", "trap": "", "f": "", "why": {"A": "Incorrect because under IAS 29, monetary assets and monetary liabilities (including payables) are not restated because they are already expressed in terms of the monetary unit current at the balance sheet date.", "C": "Incorrect because under IAS 29, monetary assets (including receivables) and monetary liabilities are not restated because they are already expressed in terms of the monetary unit current at the balance sheet date."}, "orig": "ECO Module 3 Q87"}, {"id": "SCH-M3-01", "src": "Schweser MQ", "module": 3, "tag": "Local / Functional / Presentation currency", "vig": null, "stem": "A Seoul-based multinational prepares consolidated statements in Korean won. Its main subsidiary is located in Frankfurt, but the primary economic environment in which the subsidiary generates and expends cash is Japan. Which statement is most accurate?", "opts": {"A": "The local currency is the Japanese yen.", "B": "The functional currency is the euro.", "C": "The presentation currency is the Korean won."}, "ans": "C", "en": "The local currency is the euro (Frankfurt), the functional currency is the yen (primary economic environment), and the presentation currency of the consolidated statements is the Korean won.", "ko": "Local = 소재국 통화(EUR), Functional = 현금 창출·지출 주 환경 통화(JPY), Presentation = 보고 통화(KRW).", "trap": "세 통화 개념을 섞는 함정.", "f": "", "why": {"A": "소재국 통화(local)는 EUR입니다. JPY는 기능통화입니다.", "B": "기능통화는 현금을 주로 창출·지출하는 환경의 통화인 JPY입니다."}, "orig": "Schweser MQ 9.2 변형"}, {"id": "SCH-M3-02", "src": "Schweser MQ", "module": 3, "tag": "Temporal 노출 정의", "vig": null, "stem": "If a foreign subsidiary's functional currency is the same as the parent's presentation currency, the parent's exposure to changing exchange rates is based on the subsidiary's:", "opts": {"A": "total assets minus total liabilities.", "B": "monetary assets minus monetary liabilities.", "C": "non-monetary assets minus non-monetary liabilities."}, "ans": "B", "en": "Functional currency = parent's presentation currency → temporal method → exposure is the net monetary asset (liability) position.", "ko": "기능통화 = 모회사 표시통화 → temporal → 노출 = 순화폐성자산. Current rate는 순자산(A).", "trap": "", "f": "Temporal: 순화폐성자산 / Current rate: 순자산", "why": {"A": "순자산(총자산 − 총부채) 노출은 current rate method입니다.", "C": "비화폐성 항목은 temporal에서 역사적 환율로 고정되어 노출되지 않습니다."}, "orig": "Schweser MQ 9.3 변형"}, {"id": "SCH-M3-03", "src": "Schweser MQ", "module": 3, "tag": "Current rate – 이익잉여금 환산", "vig": null, "stem": "A subsidiary whose functional currency is the GBP reports net income of £500 and a £200 dividend declared when the rate was $1.30/£. The average rate for the year is $1.25/£ and the current rate is $1.35/£. The change in retained earnings in US dollars is closest to:", "opts": {"A": "$355.", "B": "$365.", "C": "$405."}, "ans": "B", "en": "Current rate method: net income at the average rate, dividends at the historical rate on the declaration date: (500 × 1.25) − (200 × 1.30) = $365.", "ko": "Current rate: NI는 평균환율, 배당은 선언일(역사적) 환율 → 625 − 260 = 365.", "trap": "배당에 current rate(355) 또는 모두 current rate(405)를 쓰는 함정.", "f": "", "why": {"A": "355는 배당에 기말환율(1.35)을 쓴 값입니다. 배당은 선언일 환율(1.30)입니다.", "C": "405는 NI와 배당 모두 기말환율을 쓴 값입니다. NI는 평균환율입니다."}, "orig": "Schweser MQ 9.4 변형"}, {"id": "SCH-M3-04", "src": "Schweser MQ", "module": 3, "tag": "외화 약세 – 매출총이익률", "vig": null, "stem": "A FIFO subsidiary operates in a country whose currency is depreciating relative to the parent's presentation currency. Which method results in the highest gross profit margin in the parent's consolidated statements?", "opts": {"A": "Current rate method", "B": "Temporal method", "C": "Both methods produce the same gross profit margin"}, "ans": "A", "en": "Under the temporal method, COGS is remeasured at older (higher) historical rates while sales are at the lower average rate, compressing gross margin. Under the current rate method both are at the average rate, preserving the local-currency margin.", "ko": "외화 약세: temporal은 COGS를 과거(높은) 환율로 → COGS가 크게 환산 → 마진↓. Current rate는 매출·COGS 모두 평균환율 → 현지 마진 유지 → 더 높음.", "trap": "", "f": "약세: Current rate GPM > Temporal GPM / 강세: 반대", "why": {"B": "Temporal은 COGS를 과거(높은) 환율로 환산해 마진이 더 '낮습니다'.", "C": "COGS 환산 환율이 달라 마진도 다릅니다."}, "orig": "Schweser MQ 9.4 변형"}, {"id": "SCH-M3-05", "src": "Schweser MQ", "module": 3, "tag": "Translation gain 조건", "vig": null, "stem": "Which situation most likely results in a translation gain?", "opts": {"A": "Net monetary liability exposure while the foreign currency depreciates, under the temporal method.", "B": "Net asset exposure while the foreign currency depreciates, under the current rate method.", "C": "Net monetary asset exposure while the foreign currency depreciates, under the temporal method."}, "ans": "A", "en": "When liabilities are exposed to a depreciating foreign currency, a gain results; when assets are exposed to a depreciating currency, a loss results.", "ko": "노출된 '부채' + 외화 약세 = 이익. 노출된 '자산' + 외화 약세 = 손실(B, C).", "trap": "", "f": "자산노출×약세=손실, 부채노출×약세=이익 (강세면 반대)", "why": {"B": "순자산(자산) 노출 + 외화 약세 = 환산 '손실'입니다.", "C": "순화폐성자산 노출 + 외화 약세 = 환산 '손실'입니다."}, "orig": "Schweser MQ 9.4 변형"}, {"id": "SCH-M3-06", "src": "Schweser MQ", "module": 3, "tag": "Temporal 노출 축소 전략", "vig": null, "stem": "A parent uses the temporal method for a subsidiary and expects the local currency to depreciate. The subsidiary has a net monetary asset position. Exposure would be best reduced by:", "opts": {"A": "borrowing in the local currency and using the proceeds to pay a dividend to the parent.", "B": "using cash to pay down accounts payable.", "C": "selling receivables and using the proceeds to repay long-term debt."}, "ans": "A", "en": "Borrowing local currency increases monetary liabilities while paying a dividend reduces equity, shrinking the net monetary asset exposure. B and C reduce monetary assets and monetary liabilities by equal amounts, leaving net exposure unchanged.", "ko": "현지통화 차입(화폐성부채↑) + 배당(자본↓) → 순화폐성자산 노출↓. B·C는 화폐성자산과 화폐성부채가 같은 금액 감소 → 순노출 불변.", "trap": "", "f": "", "why": {"B": "현금(화폐성자산)과 매입채무(화폐성부채)가 같은 금액 감소 → 순노출 불변.", "C": "매출채권(화폐성자산)과 장기부채(화폐성부채)가 같은 금액 감소 → 순노출 불변."}, "orig": "Schweser MQ 9.4 변형"}, {"id": "SCH-M3-07", "src": "Schweser MQ", "module": 3, "tag": "Current rate – 비율 보존", "vig": null, "stem": "Under the current rate method, which ratio may differ between the local-currency and presentation-currency statements?", "opts": {"A": "Current ratio", "B": "Return on assets", "C": "Net profit margin"}, "ans": "B", "en": "Pure balance sheet ratios (current ratio) and pure income statement ratios (net profit margin) are preserved under the current rate method. ROA is a mixed ratio: net income at the average rate, assets at the current rate.", "ko": "순수 B/S 비율·순수 I/S 비율은 보존. ROA처럼 I/S(평균환율)와 B/S(기말환율)를 섞은 비율만 달라집니다.", "trap": "", "f": "Mixed ratio(ROA, 회전율) = 변동 / Pure ratio = 보존", "why": {"A": "Current ratio는 순수 B/S 비율 — 모두 기말환율이라 보존됩니다.", "C": "Net profit margin은 순수 I/S 비율 — 모두 평균환율이라 보존됩니다."}, "orig": "Schweser MQ 9.6 변형"}, {"id": "SCH-M3-08", "src": "Schweser MQ", "module": 3, "tag": "AR turnover – 두 방법 비교", "vig": null, "stem": "Compared with the current rate method, the temporal method's effect on accounts receivable turnover is most likely:", "opts": {"A": "higher.", "B": "lower.", "C": "the same."}, "ans": "C", "en": "Sales are translated at the average rate and receivables (monetary) at the current rate under both methods, so AR turnover is identical.", "ko": "매출(평균환율)과 매출채권(화폐성 → 기말환율)의 환율이 두 방법에서 같으므로 AR turnover 동일.", "trap": "", "f": "", "why": {"A": "매출(평균)·채권(기말) 환율이 두 방법에서 같아 차이가 없습니다.", "B": "매출(평균)·채권(기말) 환율이 두 방법에서 같아 차이가 없습니다."}, "orig": "Schweser MQ 9.6 변형"}, {"id": "SCH-M3-09", "src": "Schweser MQ", "module": 3, "tag": "Hyperinflation – US GAAP", "vig": null, "stem": "A US parent's subsidiary operates in a highly inflationary economy. Under US GAAP, the subsidiary's intangible assets are translated into US dollars using the:", "opts": {"A": "historical rate.", "B": "current rate.", "C": "average rate."}, "ans": "A", "en": "US GAAP requires the temporal method in highly inflationary economies (parent currency treated as functional), so non-monetary assets such as intangibles are remeasured at historical rates.", "ko": "US GAAP 초인플레이션 → temporal 강제 → 비화폐성(무형자산)은 역사적 환율. IFRS는 재작성 후 current rate.", "trap": "IFRS 처리와 혼동.", "f": "", "why": {"B": "US GAAP 초인플레이션은 temporal 강제 → 비화폐성 무형자산은 기말환율이 아니라 역사적 환율입니다.", "C": "평균환율은 temporal에서 주로 I/S 항목(매출·일반비용)에 사용합니다."}, "orig": "Schweser MQ 9.7 변형"}, {"id": "SCH-M3-10", "src": "Schweser MQ", "module": 3, "tag": "Hyperinflation – 구매력 이익", "vig": null, "stem": "A subsidiary operates in a hyperinflationary economy and its parent reports under IFRS. Which exposure results in a net purchasing power gain?", "opts": {"A": "Non-monetary assets", "B": "Monetary liabilities", "C": "Monetary assets"}, "ans": "B", "en": "Non-monetary items are restated and not exposed to purchasing power gains/losses. Holding monetary liabilities during inflation produces purchasing power gains; monetary assets produce losses.", "ko": "인플레이션 시 화폐성부채 보유 → 실질 상환부담 감소 → 구매력 이익. 화폐성자산 → 손실. 비화폐성 항목은 재작성되므로 노출 없음.", "trap": "", "f": "", "why": {"A": "비화폐성자산은 재작성되므로 구매력 손익에 노출되지 않습니다.", "C": "인플레이션 시 화폐성자산 보유 = 구매력 '손실'입니다."}, "orig": "Schweser MQ 9.7 변형"}, {"id": "SCH-M3-11", "src": "변형", "module": 3, "tag": "Hyperinflation – Flow 항목 계산 (변형)", "vig": null, "stem": "A subsidiary in a hyperinflationary economy reports annual revenue of LC1,000. General price index: beginning of year 100, average for year 160, end of year 240. Year-end exchange rate is €0.05 per LC. Under IFRS, revenue reported in euros is closest to:", "opts": {"A": "€50.", "B": "€75.", "C": "€120."}, "ans": "B", "en": "Revenue (a flow item) is restated by end-of-year GPI / average GPI: 1,000 × 240/160 = LC1,500, then translated at the current rate: 1,500 × 0.05 = €75.", "ko": "Flow 항목은 기말GPI/평균GPI로 재작성 → 1,500 → 기말환율 0.05 → €75. 기초GPI를 쓰면(stock 방식) €120, 재작성 생략 시 €50.", "trap": "Flow에 기초 GPI를 쓰는 함정 — 기초(취득) GPI는 자본금·PP&E 같은 stock 항목용.", "f": "F
