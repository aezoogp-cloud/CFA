low: × GPI말/GPI평균 → × 기말환율", "why": {"A": "€50은 재작성 없이 환산한 값입니다. IFRS는 먼저 GPI로 재작성합니다.", "C": "€120은 기초 GPI(100)로 재작성한 값 — flow 항목은 평균 GPI(160)를 씁니다."}, "orig": "Schweser R9 개념 변형"}, {"id": "SCH-M3-12", "src": "변형", "module": 3, "tag": "Transaction exposure – 수출채권 (변형)", "vig": null, "stem": "A EUR-functional company invoices a USD100,000 export sale on 15 December, collectible on 20 January. The EUR/USD rate (EUR per USD) is 0.950 on 15 December and 0.940 on 31 December (year-end). For the current fiscal year, the company reports:", "opts": {"A": "no foreign exchange effect until collection.", "B": "a EUR 1,000 foreign exchange loss in net income.", "C": "a EUR 1,000 foreign exchange loss in other comprehensive income."}, "ans": "B", "en": "A foreign-currency receivable loses value when the foreign currency weakens: 100,000 × (0.950 − 0.940) = EUR 1,000 loss, recognized in net income at the intervening balance sheet date even though unrealized.", "ko": "외화 채권 + 외화(USD) 약세 → 손실. 결제 전이라도 연말에 미실현 손실을 I/S에 인식(OCI 아님).", "trap": "'결제 전 보류', 'OCI'는 모두 함정. Transaction exposure는 항상 I/S.", "f": "채권 손익 = FC × (기말환율 − 거래일환율) (domestic per foreign 호가)", "why": {"A": "결제일이 다음 회계연도면 연말에 반드시 미실현 손익을 인식합니다.", "C": "Transaction 손익은 OCI가 아니라 항상 당기손익(I/S)입니다."}, "orig": "Schweser R9 개념 변형"}, {"id": "SCH-M3-13", "src": "변형", "module": 3, "tag": "외화 강세 – 영업이익 (변형)", "vig": null, "stem": "A subsidiary's local currency appreciated steadily against the parent's presentation currency during the year. Compared with the temporal method, the current rate method most likely reports operating income that is:", "opts": {"A": "higher.", "B": "lower.", "C": "the same."}, "ans": "B", "en": "With an appreciating local currency, historical rates are lower than the average rate. The temporal method translates COGS and depreciation at those lower historical rates (smaller expenses), so temporal operating income is higher; current rate operating income is lower.", "ko": "외화 강세: 역사적 환율 < 평균환율. Temporal은 COGS·감가상각을 낮은 역사적 환율로 → 비용 작게 → 영업이익↑. 따라서 current rate가 더 낮음(약세일 때와 반대).", "trap": "약세 결론(current rate 높음)을 강세에도 그대로 적용하는 함정.", "f": "", "why": {"A": "외화 강세일 때 temporal이 비용을 낮은 역사적 환율로 환산해 더 높은 이익을 보고합니다 — current rate가 '낮음'.", "C": "COGS·감가상각 환산 환율이 달라 영업이익도 다릅니다."}, "orig": "Schweser R9 개념 변형"}, {"id": "ECO-M4-Q1", "src": "ECO 오답", "module": 4, "tag": "은행 vs 비금융기업", "vig": 22, "stem": "Which of Smith’s statements regarding banks is correct?", "opts": {"A": "Only Statement 1", "B": "Only Statement 2", "C": "Both Statement 1 and Statement 2"}, "ans": "A", "en": "A is correct. Banks are more likely to be systemically important than non-financial companies because, as intermediaries, they create financial linkages across all types of entities, including households, banks, corporates, and governments. The network of linkages across entities means that the failure of one bank will negatively affect other financial and non-financial entities (a phenomenon known as financial contagion). The larger the bank and the more widespread its network of linkages, the greater its potential impact on the entire financial system. The assets of banks are predominantly financial assets, such as loans and securities (not deposits, which represent most of a bank’s liabilities). Compared to the tangible assets of non-financial companies, financial assets create direct exposure to a different set of risks, including credit risks, liquidity risks, market risks, and interest rate risks.", "ko": "은행은 중개기관으로 금융 연계가 많아 systemically important(진술 1 정답). 은행 자산은 대출·증권 등 금융자산이며, 예금은 은행의 '부채'입니다(진술 2 오답).", "trap": "Deposits = 은행 부채 (자산 X).", "f": "", "why": {"B": "진술 2는 틀렸습니다. 예금은 은행의 '부채'이고, 자산은 대출·증권 등 금융자산입니다.", "C": "진술 2가 틀렸으므로 '둘 다'는 불가합니다."}, "orig": "ECO Module 4 Q1"}, {"id": "ECO-M4-Q3", "src": "ECO 오답", "module": 4, "tag": "CAMELS 한계", "vig": 22, "stem": "One limitation of the approach used by Johansson to evaluate banks is that it fails to address a bank’s:", "opts": {"A": "sensitivity to market risk.", "B": "management capabilities.", "C": "competitive environment."}, "ans": "C", "en": "C is correct. The approach used by Johansson to evaluate banks, the CAMELS approach, has six components: (1) capital adequacy, (2) asset quality, (3) management capabilities, (4) earnings sufficiency, (5) liquidity position, and (6) sensitivity to market risk. While the CAMELS approach to evaluating a bank is fairly comprehensive, some attributes of a bank are not addressed by this method. One such attribute is a bank’s competitive environment. A bank’s competitive position relative to its peers may affect how it allocates capital and assesses risks.", "ko": "CAMELS = Capital adequacy, Asset quality, Management, Earnings, Liquidity, Sensitivity to market risk. 경쟁환경(competitive environment)은 다루지 않는 요소입니다.", "trap": "Sensitivity, Management는 CAMELS 구성요소입니다.", "f": "", "why": {"A": "Sensitivity to market risk는 CAMELS의 S입니다.", "B": "Management capabilities는 CAMELS의 M입니다."}, "orig": "ECO Module 4 Q3"}, {"id": "ECO-M4-Q4", "src": "ECO 오답", "module": 4, "tag": "P&C 보험 – Underwriting expense ratio", "vig": 22, "stem": "The best indicator of the operations of a P&C insurance company emphasized by Johansson when evaluating P&C insurance companies is the:", "opts": {"A": "combined ratio.", "B": "underwriting loss ratio.", "C": "underwriting expense ratio."}, "ans": "C", "en": "C is correct. The underwriting expense ratio is an indicator of the efficiency of money spent on obtaining new premiums. The underwriting loss ratio is an indicator of the quality of a company’s underwriting activities—the degree of success an underwriter has achieved in estimating the risks insured. The combined ratio, a measure of the overall underwriting profitability and efficiency of an underwriting operation, is the sum of these two ratios.", "ko": "신규 보험료 획득 지출의 효율성 = underwriting expense ratio. Loss ratio는 인수(위험추정) 품질, combined ratio는 둘의 합(전체 인수 수익성·효율성).", "trap": "'Combined ratio'는 종합지표 — 질문이 묻는 특정 측면(신규 보험료 획득 효율)을 찾으세요.", "f": "", "why": {"A": "Combined ratio는 손해율 + 사업비율의 종합 지표로, '신규 보험료 획득 지출 효율'만을 나타내지 않습니다.", "B": "Loss ratio는 위험 추정(인수) 품질 지표입니다."}, "orig": "ECO Module 4 Q4"}, {"id": "ECO-M4-Q9", "src": "ECO 오답", "module": 4, "tag": "Capital ratios 추세", "vig": 23, "stem": "Based on Exhibit 1, Company XYZ’s capital adequacy over the last three years, as measured by the three key capital ratios, signals conditions that are:", "opts": {"A": "mixed.", "B": "declining.", "C": "improving."}, "ans": "A", "en": "A is correct. Company XYZ’s key capital adequacy ratios show mixed conditions. The ratios are calculated as follows:\n\nCommon Equity Tier 1 Capital Ratio = \nTotal Common Equity Tier 1 Capital\nTotal Risk-Weighted Assets\n \n2015 Common Equity Tier 1 Capital Ratio = \n137,100\n1,242,500\n \n=11.0%\n2016 Common Equity Tier 1 Capital Ratio = \n142,367\n1,282,849\n \n=11.1%\n2017 Common Equity Tier 1 Capital Ratio = \n146,424\n1,298,688\n \n=11.3%\nTier 1 Ratio = \nCommon Equity Tier 1 Capital+Additional Tier 1 Capital\nTotal Risk-Weighted Assets\n \n2015 Tier 1 Ratio = \n137,100+17,600\n1,242,500\n \n=12.5%\n2016 Tier 1 Ratio = \n142,367+20,443\n1,282,849\n \n=12.7%\n2017 Tier 1 Ratio = \n146,424+22,639\n1,298,688\n \n=13.0%\nTotal Capital Ratio = \nTotal Capital\nTotal Risk-Weighted Assets\n \n2015 Total Capital Ratio = \n192,900\n1,242,500\n \n=15.5%\n2016 Total Capital Ratio = \n190,374\n1,282,849\n \n=14.8%\n2017 Total Capital Ratio = \n191,519\n1,298,688\n \n=14.7%\n \t2017\t2016\t2015\nCommon equity Tier 1 capital ratio\t11.3%\t11.1%\t11.0%\nTier 1 capital ratio\t13.0%\t12.7%\t12.5%\nTotal capital ratio\t14.7%\t14.8%\t15.5%\nThe common equity Tier 1 capital ratio and the Tier 1 capital ratio both strengthened from 2015 to 2017, but the total capital ratio weakened during that same period, signaling mixed conditions.", "ko": "CET1 비율 11.0 → 11.1 → 11.3%, Tier 1 12.5 → 12.7 → 13.0% 상승, Total capital 15.5 → 14.8 → 14.7% 하락(Tier 2 감소) → mixed.", "trap": "CET1만 보고 'improving'으로 결론내는 함정.", "f": "CET1 ratio = CET1/RWA, Tier 1 = (CET1 + AT1)/RWA, Total = (Tier 1 + Tier 2)/RWA", "why": {"B": "CET1·Tier 1 비율은 상승했으므로 'declining'이 아닙니다.", "C": "Total capital 비율(15.5 → 14.7%)은 하락했으므로 'improving'도 아닙니다."}, "orig": "ECO Module 4 Q9"}, {"id": "ECO-M4-Q11", "src": "ECO 오답", "module": 4, "tag": "Impairment allowance 추세", "vig": 23, "stem": "Based on Exhibit 3, the trend in impairment allowances is reflective of the changes in:", "opts": {"A": "impaired assets.", "B": "strong credit quality assets.", "C": "past due but not impaired assets."}, "ans": "C", "en": "C is correct. Impairment allowances have increased proportionately to the increases in the amount of past due but not impaired assets, which may be in anticipation of these past due assets becoming impaired. Impaired assets have decreased each year while strong credit quality assets have increased each year, which suggests lowering impairment allowances as a result of improving credit quality of these financial instruments.\n\nAt 31 December\t2017\t2016\t2015\n \t$m\t$m\t$m\nStrong credit quality\t338,948\t327,345\t320,340\nGood credit quality\t52,649\t54,515\t54,050\nSatisfactory credit quality\t51,124\t55,311\t56,409\nSubstandard credit quality\t23,696\t24,893\t27,525\nPast due but not impaired\t2,823\t2,314\t2,058\nImpaired\t8,804\t9,345\t10,235\nTotal gross amount\t478,044\t473,723\t470,617\nImpairment allowances\t−5,500\t−4,500\t−4,000\nTotal\t472,544\t469,223\t466,617\n \t \t \t \nYoY change in impaired assets\t−5.8%\t−8.7%\t \nYoY change in strong credit quality assets\t3.5%\t2.2%\t \nYoY change in past due but not impaired assets\t22.0%\t12.4%\t \nYoY change in impairment allowances\t22.2%\t12.5%\t \nNote: YoY = year-over-year\n\n2015 to 2016 change in impaired assets: (\n9,345\n10,235\n \n)−1=−8.7%\n2015 to 2016 change in strong credit quality assets: (\n327,345\n320,340\n \n)−1=2.2%\n2015 to 2016 change in past due but not impaired assets: (\n2,314\n2,058\n \n)−1=12.4%\n2015 to 2016 change in impairment allowances: (\n−4,500\n−4,000\n \n)−1=12.5%\n2016 to 2017 change in impaired assets: (\n8,804\n9,345\n \n)−1=−5.8%\n2016 to 2017 change in strong credit quality assets: (\n338,948\n327,345\n \n)−1=3.5%\n2016 to 2017 change in past due but not impaired assets: (\n2,823\n2.314\n \n)−1=22.0%\n2016 to 2017 change in impairment allowances: (\n−5,500\n−4,500\n \n)−1=22.2%", "ko": "Allowance 증가율(12.5%, 22.2%) ≈ past due but not impaired 증가율(12.4%, 22.0%) → 향후 손상 예상분 선적립. Impaired 자산은 감소, strong 등급은 증가 추세.", "trap": "'Impaired' 자산과 연동된다는 직관 함정 — 숫자 증가율을 비교하세요.", "f": "", "why": {"A": "Impaired 자산은 매년 감소했는데 충당금은 증가 → 같은 방향이 아닙니다.", "B": "Strong 등급 증가는 충당금을 '줄이는' 요인입니다."}, "orig": "ECO Module 4 Q11"}, {"id": "ECO-M4-Q16", "src": "ECO 오답", "module": 4, "tag": "Earnings quality – Trading income 비중", "vig": 24, "stem": "Based only on Exhibit 2, which of the following statements is correct?", "opts": {"A": "The quality of earnings for R-bank was the highest in 2009.", "B": "Relative to the other banks, N-bank has the highest quality of earnings in 2017.", "C": "Trading represented a sustainable revenue source for T-bank between 2005 and 2013."}, "ans": "B", "en": "B is correct. The quality of earnings is directly related to the level of sustainable sources of income. Trading income tends to be volatile and not necessarily sustainable. Higher-quality income would be net interest income and fee-based service income. Because N-bank’s 2017 trading revenue contribution is the lowest relative to other banks, its quality of earnings would be considered the best of the three banks.", "ko": "Trading income은 변동성이 커 지속성이 낮음. 2017년 trading 비중이 가장 낮은 N-bank(4.2%)의 이익의 질이 가장 높습니다.", "trap": "Trading 비중이 높았던 해(2009)를 질 높은 해로 보는 함정.", "f": "", "why": {"A": "2009년 R-bank의 trading 비중이 17.0%로 가장 높아 이익의 질은 오히려 가장 낮았습니다.", "C": "Trading 비중이 6.8 → 11.9 → 5.0%로 크게 출렁여 지속가능 수익원이 아닙니다."}, "orig": "ECO Module 4 Q16"}, {"id": "ECO-M4-Q21", "src": "ECO 오답", "module": 4, "tag": "Total Tier 1 ratio 변화", "vig": 25, "stem": "Based on Exhibit 1, compared to the prior year, GWNB's current year Total Tier 1 Capital ratio most likely has a net increase closest to:", "opts": {"A": "0.89%.", "B": "0.94%.", "C": "1.13%."}, "ans": "A", "en": "Correct because GWNB's Total Tier 1 Capital ratio in the prior year = (14,783 + 1,927) / 212,587 ≈ 0.0786 = 7.86%. In the current year GWNB's Total Tier 1 Capital ratio = (17,252 + 1,879) / 218,617 ≈ 0.0875 = 8.75%. GWNB's Total Tier 1 Capital ratio therefore increased by 8.75% – 7.86% = 0.89% in the current year.", "ko": "Total Tier 1 = (CET1 + AT1)/RWA: 당해 19,131/218,617 = 8.75%, 전년 16,710/212,587 = 7.86% → +0.89%p.", "trap": "0.94%p는 CET1 비율, 1.13%p는 Total capital 비율 변화.", "f": "Total Tier 1 ratio = (CET1 + Additional Tier 1) / RWA", "why": {"B": "Incorrect because this is the increase in GWNB's Common Equity Tier 1 Capital ratio. In the prior year = 14,783 / 212,587 ≈ 0.0695 = 6.95%. In the current year GWNB's Total Tier 1 Capital ratio = 17,252 / 218,617 ≈ 0.0789 = 7.89%. GWNB's Common Equity Tier 1 Capital ratio therefore increased by 7.89% – 6.95% = 0.94% in the current year.", "C": "Incorrect because this is the increase in GWNB's Total Capital ratio. Total Capital ratio in the prior year = (14,783 + 1,927 + 988) / 212,587 ≈ 0.0833 = 8.33%. In the current year GWNB's Total Capital ratio = (17,252 + 1,879 + 1,554) / 218,617 ≈ 0.0946 = 9.46%. GWNB's Total Capital ratio therefore improved in the current year by 9.46% – 8.33% = 1.13%."}, "orig": "ECO Module 4 Q21"}, {"id": "ECO-M4-Q25", "src": "ECO 오답", "module": 4, "tag": "예금기관 유형", "vig": 26, "stem": "Which of the following best describes the CEO's previous financial institution?", "opts": {"A": "Mutual bank", "B": "Mortgage bank", "C": "Savings and loan association"}, "ans": "A", "en": "Correct because credit unions, cooperative and mutual banks are depository institutions that function like banks and offer many of the same services as banks. They are owned by their members, rather than being publicly traded like many banks. Another difference from commercial banks is that these institutions are organized as non-profits and, therefore, do not pay income taxes.", "ko": "비영리·비상장·회원 소유이면서 예금·대출·모기지를 두루 취급 → mutual bank(credit union·cooperative 유사). Mortgage bank = 모기지 특화(조성·매각·관리), S&L = 장기 주택담보대출 특화.", "trap": "'모기지 취급'이라는 단어에 끌려 mortgage bank/S&L 선택.", "f": "", "why": {"B": "Incorrect because mortgage banks originate, sell, and service mortgages and are usually active participants in the securitization markets.", "C": "Incorrect because savings and loan associations are depository institutions that specialize in financing long-term residential mortgages."}, "orig": "ECO Module 4 Q25"}, {"id": "ECO-M4-Q26", "src": "ECO 관련유형", "module": 4, "tag": "Basel III – NSFR은 1년", "vig": 26, "stem": "Which of the following highlights included in Green's research report is incorrect?", "opts": {"A": "Highlight 1", "B": "Highlight 2", "C": "Highlight 3"}, "ans": "C", "en": "Correct because Basel III requires a bank to have a minimum amount of stable funding relative to the bank's liquidity needs over a one-year horizon and not a 90-day liquidity stress scenario. Therefore, Highlight 3 is an inaccurate statement.", "ko": "Stable funding(NSFR)은 1년 시계의 유동성 필요. 30일 스트레스는 LCR. Highlight 3의 '90일'은 틀림.", "trap": "LCR(30일)과 NSFR(1년) 혼동.", "f": "", "why": {"A": "Incorrect because Basel III specifies the minimum percentage of its risk-weighted assets that a bank must fund with equity capital. Therefore, Highlight 1 is an accurate statement.", "B": "Incorrect because Basel III specifies that a bank must hold enough high-quality liquid assets to covers its liquidity needs in a 30-day liquidity stress scenario. Therefore, Highlight 2 is an accurate statement."}, "orig": "ECO Module 4 Q26"}, {"id": "ECO-M4-Q27", "src": "ECO 관련유형", "module": 4, "tag": "Other Tier 1 요건", "vig": 26, "stem": "In calculating SNB's Total Tier 1 Capital, Green is incorrect in regard to:", "opts": {"A": "retained earnings.", "B": "accumulated other comprehensive income.", "C": "instruments that are subordinate to depositors."}, "ans": "C", "en": "Correct because instruments that are subordinate to depositors and to general creditors of the bank must not have a fixed maturity to be included in Other Tier 1 Capital. Other Tier 1 Capital includes other types of instruments issued by the bank that meet certain criteria. The criteria require, for example, that the instruments be subordinate to such obligations as deposits and other debt obligations, not have a fixed maturity, and not have any type of payment of dividend or interest that is not totally at the discretion of the bank. Therefore, this response should not be included in SNB's Total Tier 1 Capital.", "ko": "Other(Additional) Tier 1 상품: 예금·채무보다 후순위 + 만기 없음 + 배당/이자가 전적으로 은행 재량. 만기가 있는 상품은 Tier 1 불가.", "trap": "", "f": "", "why": {"A": "Incorrect because common Equity Tier 1 Capital includes common stock, issuance surplus related to common stock, retained earnings, accumulated other comprehensive income, and certain adjustments including the deduction of intangible assets and deferred tax assets. Other Tier 1 Capital includes other types of instruments issued by the bank that meet certain criteria. The criteria require, for example, that the instruments be subordinate to such obligations as deposits and other debt obligations, not have a fixed maturity, and not have any type of payment of dividend or interest that is not totally at the discretion of the bank. Therefore, this response should be included in SNB's Total Tier 1 Capital.", "B": "Incorrect because common Equity Tier 1 Capital includes common stock, issuance surplus related to common stock, retained earnings, accumulated other comprehensive income, and certain adjustments including the deduction of intangible assets and deferred tax assets. Other Tier 1 Capital includes other types of instruments issued by the bank that meet certain criteria. The criteria require, for example, that the instruments be subordinate to such obligations as deposits and other debt obligations, not have a fixed maturity, and not have any type of payment of dividend or interest that is not totally at the discretion of the bank. Therefore, this response should be included in SNB's Total Tier 1 Capital."}, "orig": "ECO Module 4 Q27"}, {"id": "ECO-M4-Q29", "src": "ECO 오답", "module": 4, "tag": "Basel III 직접 규제대상", "vig": 27, "stem": "Which of the enhancements Suzuki describes regarding the Basel III regulatory framework is most accurate?", "opts": {"A": "Enhancement 1", "B": "Enhancement 2", "C": "Enhancement 3"}, "ans": "B", "en": "Correct. In the aftermath of the 2008 crisis, one of the key changes in Basel III was an increase in the required level of equity funding of banks’ risk-weighted assets. This measure essentially prevents banks from assuming excessive financial leverage.", "ko": "Basel III의 핵심: 위험가중자산 대비 자기자본 요건 강화 → 과도한 레버리지 방지(Enhancement 2). Earnings quality는 직접 목표가 아니라 부수효과. 안정적 자금조달은 소비자예금 우대(interbank 아님).", "trap": "부수효과(이익의 질 개선)를 직접 규제대상으로 착각, interbank 예금이 더 안정적이라는 착각.", "f": "", "why": {"A": "Incorrect. Earnings quality was not a focus of Basel III, though the changes implemented under Basel III will likely lead to improved earnings quality.", "C": "Incorrect. Although Basel III did increase requirements for stable funding, deposits from consumers are considered more stable than those raised in the interbank markets. Therefore, increased funding stability is achieved by giving preference to consumer deposits, not interbank deposits."}, "orig": "ECO Module 4 Q29"}, {"id": "ECO-M4-Q30", "src": "ECO 오답", "module": 4, "tag": "Hard → Soft market 전환", "vig": 27, "stem": "If Takahashi’s interpretation of the current phase of the property and casualty market is correct, a cyclical shift is most likely to result in:", "opts": {"A": "a tightening of underwriting standards.", "B": "capital adequacy being easier to achieve.", "C": "additional competitors entering the market."}, "ans": "C", "en": "Correct. In hard insurance markets, insurance premiums and industry profits are high as are underwriting standards. This attracts competitors that offer lower premiums resulting in lower profitability, a softening of the market, and a weakening of underwriting standards.", "ko": "Hard market: 고보험료·고수익·엄격한 인수기준 → 높은 수익성이 신규 경쟁자를 끌어들임 → 저가 경쟁 → soft market(보험료·수익성·인수기준 하락, 자본 소진).", "trap": "전환 시 인수기준 '강화'(A), 자본적정성 '쉬워짐'(B)은 방향이 반대.", "f": "", "why": {"A": "Incorrect. In hard insurance markets, premiums and profitability are high and insurers can set high underwriting standards. As competitors are attracted to this profitability and the market softens, underwriting standards and premiums drop as everyone offers the cheapest deals.", "B": "Incorrect. Hard markets feature higher premium prices, increased profitability, and an increased ability for insurers to maintain adequate capital. Capital typically depletes as markets soften, making capital adequacy more difficult to achieve."}, "orig": "ECO Module 4 Q30"}, {"id": "ECO-M4-Q31", "src": "ECO 관련유형", "module": 4, "tag": "Combined ratio – 분모 구분", "vig": 27, "stem": "Based on Exhibit 1, YH’s combined ratio is closest to:", "opts": {"A": "61.1%.", "B": "109.8%.", "C": "126.8%."}, "ans": "B", "en": "Correct. Loss Expense & Loss Adjustment expense ratio and the underwriting expense ratio (in ¥ billions, except %):\nLoss Expense & Loss Adjustment Expense Ratio (A)\tUnderwriting\nExpense Ratio (B)\tCombined Ratio (A+B)\nLoss expense & loss adjustment expense\t38,467\tUnderwriting expense\t23,960\nNet premiums earned\t62,939\tNet premiums written\t49,241\nRatio (A)\t61.1%\tRatio (B)\t48.7%\t109.8%", "ko": "Loss ratio = 손해+손해조정비용 / net premiums EARNED = 61.1%. Underwriting expense ratio = 인수비용 / net premiums WRITTEN = 48.7%. 합계 109.8%.", "trap": "두 비율의 분모를 같게 쓰는 실수.", "f": "Combined = Loss&LAE/NPE + Underwriting exp./NPW", "why": {"A": "Incorrect because this is the loss Expenses & loss adjustment expense ratio (in ¥ billions, except %):\nLoss Expense & Loss Adjustment Expense Ratio\nLoss expense & loss adjustment expense\t38,467\nNet premiums earned\t62,939\nRatio\t61.1%", "C": "Incorrect. In this calculation, the loss expense & loss adjustment expense ratio incorrectly uses net premiums written as the denominator (in ¥ billions, except %):\nIncorrect Loss Expense & Loss Adjustment Expense Ratio (A)\tUnderwriting Expense Ratio (B)\tCombined Ratio (A+B)\nLoss expense & loss adjustment expense\t38,467\tUnderwriting expense\t23,960\nNet premiums written (incorrect)\t49,241\tNet premiums written\t49,241\nRatio (A)\t78.1%\tRatio (B)\t48.7%\t126.8%"}, "orig": "ECO Module 4 Q31"}, {"id": "ECO-M4-Q32", "src": "ECO 오답", "module": 4, "tag": "재보험 – 국제화", "vig": 27, "stem": "Based solely on the comment Takahashi makes in postponing the review of SH to the next meeting, the primary line of insurance that SH offers is most likely:", "opts": {"A": "reinsurance.", "B": "life and health.", "C": "property and casualty."}, "ans": "A", "en": "Correct. Reinsurance business is largely international, while the rest of the insurance market has a smaller proportion of cross-border business.", "ko": "보험 중 국제(cross-border) 비중이 큰 것은 재보험(위험 분산의 필연). P&C·L&H는 국경 간 사업 비중이 작습니다.", "trap": "", "f": "", "why": {"B": "Incorrect. Life and health insurance companies tend to have a smaller proportion of cross-border business. Reinsurance companies are much more likely to have significant international business.", "C": "Incorrect. Property and casualty insurance companies tend to have a smaller proportion of cross-border business. Reinsurance companies are much more likely to have significant international business."}, "orig": "ECO Module 4 Q32"}, {"id": "ECO-M4-Q33", "src": "ECO 오답", "module": 4, "tag": "은행 – 유동성 위험", "vig": 28, "stem": "Which of Reddy’s notes concerning banks versus industrials is least accurate? The note concerning:", "opts": {"A": "fair value.", "B": "liquidity risks.", "C": "tangible assets."}, "ans": "B", "en": "Correct. Liquidity risk is a major concern for a bank, despite not carrying inventory. A bank’s assets are primarily financial assets (loans), which are often measured at fair value. It is important that a bank have adequate liquidity in its assets such that it could withstand the demand for a redemption of deposits (liabilities) if it arose.", "ko": "재고가 없어도 은행에는 유동성 위험이 핵심: 예금(부채) 인출 요구에 대응할 자산 유동성이 필요합니다. 유형자산이 적고 금융자산을 공정가치로 측정한다는 노트는 맞음.", "trap": "'least accurate' — 맞는 노트(공정가치, 유형자산)를 고르면 오답.", "f": "", "why": {"A": "Incorrect. Reddy’s note about fair value is correct. Banks’ assets are primarily financial assets (loans) and are often measured at fair value.", "C": "Incorrect. Reddy’s note about tangible assets is correct. Banks generally do have fewer tangible assets than industrials."}, "orig": "ECO Module 4 Q33"}, {"id": "ECO-M4-Q38", "src": "ECO 오답", "module": 4, "tag": "보험사 투자 포트폴리오 위험", "vig": 29, "stem": "From 2017 to 2018, the risk related to the investment allocation for NANLife is best described as having shown:", "opts": {"A": "a decrease.", "B": "no change.", "C": "an increase."}, "ans": "C", "en": "Correct. When the investment portfolio is examined using a common-size format, the proportion of the portfolio invested in equity securities has increased from 19.0% to 20.6% (see table below) whereas the proportion allocated to loans and deposits and debt securities has decreased. Equity investments are normally riskier than fixed-income investments, which would indicate that the investment portfolio’s asset allocation is riskier in 2018 than in 2017.\nAnalysis of NANLife’s Investment Portfolio Asset Allocation\n2018\t2017\nLoans and deposits\t8,800\t4.5%\t9,000\t5.0%\nDebt securities\t141,000\t72.3%\t130,800\t73.3%\nEquity securities\t40,250\t20.6%\t34,000\t19.0%\nDerivative financial instruments\t130\t0.1%\t90\t0.1%\nTotal financial investments\t190,180\t97.5%\t173,890\t97.4%\nInvestment properties\t4,900\t2.5%\t4,600\t2.6%\nTotal investment portfolio\t195,080\t100.0%\t178,490\t100.0%", "ko": "Common-size로 보면 equity 비중 19.0% → 20.6% 상승, 채권·대출 비중 하락 → 포트폴리오 위험 증가.", "trap": "절대금액이나 total financial investments 비중(97.4 → 97.5%)으로 판단하는 함정.", "f": "", "why": {"A": "Incorrect. The proportion allocated to loans and deposits and debt securities has decreased, but this would decrease the overall risk of the investment portfolio because fixed-income investments are less risky than equity investments. The higher proportion allocated to equity would increase the portfolio risk.", "B": "Incorrect. The total financial investments have not changed materially (97.4% to 97.5%), but that is not the best measure of the risk of the investment portfolio. The allocation of the portfolio between fixed-income and equity securities is a better measure of portfolio risk."}, "orig": "ECO Module 4 Q38"}, {"id": "ECO-M4-Q39", "src": "ECO 관련유형", "module": 4, "tag": "L&H vs P&C 투자 위험", "vig": 29, "stem": "Yu’s reply to Cioffi’s question concerning the higher portion of equity securities in NANLife’s investment portfolio is best described as correct with respect to:", "opts": {"A": "both reasons.", "B": "only the first reason.", "C": "only the second reason."}, "ans": "B", "en": "Correct. Yu is incorrect about the duration of the claims of NANLife. NANLife is a life and health insurance (L&H) company. L&H companies’ claims are more predictable than those of property and casualty (P&C) companies, and their claims also have a longer duration than P&C those of companies. It is the combination of both of these factors that allows L&H companies to hold a greater proportion of equity investments than P&C companies.", "ko": "L&H는 청구가 예측 가능하고 duration이 길어 equity 비중을 더 높일 수 있음. 'duration이 짧다'는 두 번째 이유는 틀림.", "trap": "", "f": "", "why": {"A": "Incorrect. The products of a P&C company are usually shorter duration than those of an L&H company; thus, that part of Yu’s answer is incorrect.", "C": "Incorrect. The products of a P&C company are usually shorter duration than those of an L&H company; thus, that part of Yu’s answer is incorrect."}, "orig": "ECO Module 4 Q39"}, {"id": "ECO-M4-Q40", "src": "ECO 관련유형", "module": 4, "tag": "보험 규제·회계", "vig": 29, "stem": "Cioffi’s comments about the regulatory requirements for NANLife are best described as:", "opts": {"A": "correct.", "B": "incorrect with respect to accounting rules.", "C": "incorrect with respect to capital adequacy requirements."}, "ans": "A", "en": "Correct. Cioffi’s comments about the regulatory requirements for US-based insurance companies are all correct. The insurance industry does not have a set of global regulatory standards like Basel III, but capital standards do exist in various jurisdictions, including the United States. In the United States, the NAIC (National Association of Insurance Commissioners) has established minimum capital adequacy standards. Also in the United States, insurance companies prepare financial reports according to statutory accounting rules, which differ from US GAAP and IFRS.", "ko": "보험업에는 Basel III 같은 글로벌 기준이 없지만 지역별 자본요건 존재(미국 NAIC). 미국 보험사는 statutory accounting(SAP)으로 보고.", "trap": "", "f": "", "why": {"B": "Incorrect. Cioffi’s comments with respect to accounting rules are correct. In the United States, insurance companies prepare financial reports according to statutory accounting rules, which differ from US GAAP and IFRS.", "C": "Incorrect. Cioffi’s comments with respect to capital adequacy are correct. The insurance industry does not have a set of global regulatory standards as the banking industry has with its Basel III regulations, but capital standards do exist in various jurisdictions, including the United States. In the United States, the NAIC has established minimum capital adequacy standards."}, "orig": "ECO Module 4 Q40"}, {"id": "ECO-M4-Q41", "src": "ECO 관련유형", "module": 4, "tag": "NII 성장률 – 일정하지 않음", "vig": 29, "stem": "Using Exhibit 2, which of Yu’s points in support of the CAMELS score she assigns for earnings quality is least accurate? The point concerning:", "opts": {"A": "trading income volatility.", "B": "growth in net interest income.", "C": "net interest income proportion."}, "ans": "B", "en": "Correct. Yu’s point about the constant rate of growth of net interest income is not accurate. As shown in the table below (Part A), the growth rate for net interest income has been increasing, not stable, over the five-year period. Her point about trading income is accurate. Although it is volatile, it is a small portion of net income, which supports a rating of higher quality of earnings. Trading income is the least sustainable of the three types of income; therefore, low reliance on it is better for earnings quality. As shown in Part B of the table below, the mix between net interest income and other income has been stable over the last three years, which is also a sign in support of high-quality earnings.\nAnalysis of Bank Income\n2018\t2017\t2016\t2015\t2014\nPart A\nYear-to-year growth rate\nNet interest income\t8.4%\t6.3%\t3.7%\t3.2%\t---\nPart B\nPortion of total income net of interest expense\nTrading income\t0.6%\t1.0%\t1.4%\t–0.2%\t3.4%\nNet interest income\t74.9%\t74.6%\t74.5%\t74.9%\t74.4%\nOther income\t24.5%\t24.4%\t24.1%\t25.3%\t22.2%\nTotal income net of interest expense\t100.0%\t100.0%\t100.0%\t100.0%\t100.0%", "ko": "NII 성장률은 매년 증가(일정하지 않음) → 'constant rate' 진술이 부정확. Trading 비중이 작고 NII 비중이 안정적이라는 점은 정확.", "trap": "", "f": "", "why": {"A": "Incorrect. Her point about trading income is accurate. Although it is volatile, it is a small portion of net income in support of higher quality of earnings. Trading income is the least sustainable of the three types of income; therefore, low reliance on it is better for earnings quality.", "C": "Incorrect. As shown in Part B of the table above, the mix between net interest income and other income has been stable over the last three years, which is also a sign in support of high-quality earnings."}, "orig": "ECO Module 4 Q41"}, {"id": "ECO-M4-Q42", "src": "ECO 오답", "module": 4, "tag": "충당금 변화의 EBT 기여", "vig": 29, "stem": "Based on Exhibit 2, the proportion of the increase in the 2018 earnings before taxes that comes from the change in the provision for credit losses is closest to:", "opts": {"A": "4.6%.", "B": "7.1%.", "C": "24.8%."}, "ans": "C", "en": "Correct. A decrease in the provision for credit losses would have the effect of increasing earnings before taxes. As shown in the table below, in 2018, EBT increased by $21,800 but the provision for credit losses decreased by $5,400, thus accounting for 24.8% of the change in EBT.\nAnalysis of Change in EBT and Provision for Credit Losses, in $ Thousands\n2018\t2017\tChange\nProvision for credit losses\t8,400\t13,800\t(5,400)\nEBT\t117,600\t95,800\t21,800\nPercentage increase in EBT from decrease in provision\t---\t---\t24.8%", "ko": "EBT 증가 21,800 중 provision 감소 5,400 → 24.8%가 추정치(충당금) 변화에서 발생.", "trap": "4.6%는 ΔProvision/EBT, 7.1%는 Provision/EBT — 분모는 'EBT 증가분'.", "f": "기여율 = ΔProvision ÷ ΔEBT", "why": {"A": "Incorrect; it is the change in the provision ($5,400) as a proportion of EBT but does not consider the change in EBT: 5,400 ÷ 117,600 = 4.6%.", "B": "Incorrect; it is the provision for credit losses as a proportion of EBT but does not consider the change in the two values: $8,400 ÷ $117,600 = 7.1%."}, "orig": "ECO Module 4 Q42"}, {"id": "ECO-M4-Q43", "src": "ECO 오답", "module": 4, "tag": "Earnings composition – 비중으로 판단", "vig": 30, "stem": "Rossi’s comment about BSB’s earnings composition is best described as:", "opts": {"A": "correct.", "B": "incorrect with respect to volatility.", "C": "incorrect with respect to sustainability."}, "ans": "A", "en": "Correct. Net trading income is typically considered more volatile than net interest income or net fee income. As a component of the total, BSB’s net trading income has decreased from 20.7% to 19.3% per the following table, while the sustainable components (net interest income and net fee income) have increased. Overall, BSB’s earnings composition has become less volatile and more sustainable.\n(€ millions)\tCurrent Year\t(%)\tPrior Year\t(%)\nNet interest income\t55,288\t57.2%\t50,285\t55.9%\nNet fee income\t22,648\t23.5%\t21,107\t23.4%\nNet trading income\t18,651\t19.3%\t18,624\t20.7%\nTotal\t96,587\t100.0%\t90,016\t100.0%", "ko": "Common-size: trading 비중 20.7 → 19.3%↓(변동성↓), NII 55.9 → 57.2%, fee 23.4 → 23.5%↑(지속성↑) → Rossi의 코멘트는 둘 다 맞음.", "trap": "Trading income 절대액이 늘었다고 변동성↑으로 판단 — 반드시 비중(%)으로.", "f": "", "why": {"B": "Incorrect. Net trading income, which is typically considered volatile income, has decreased as a proportion of the total. As such, Rossi’s comment that the earnings composition has become less volatile is correct.", "C": "Incorrect. Both net interest income and net fee income, which are considered more sustainable sources of income, have increased as a proportion of the total. As such, Rossi’s comment that the earnings composition has become more sustainable is correct."}, "orig": "ECO Module 4 Q43"}, {"id": "ECO-M4-Q45", "src": "ECO 오답", "module": 4, "tag": "Total Tier 1 capital 구성", "vig": 30, "stem": "BSB’s Total Tier 1 Capital (in billions) for the current year is closest to:", "opts": {"A": "€199.", "B": "€216.", "C": "€239."}, "ans": "B", "en": "Correct. Total Tier 1 Capital includes Common Equity Tier 1 Capital plus other instruments (such as preferred shares) that bear no fixed maturity and carry no requirement to pay dividends or interest without the full discretion of the bank. Common Equity Tier 1 Capital includes common stock, capital surplus, retained earnings, and other comprehensive income. BSB’s Total Tier 1 Capital is as follows:\n(€ billions)\nCommon stock\t12\nRetained earnings\t187\nCommon Equity Tier 1 Capital\t199\nPreferred shares\t17\nTotal Tier 1 Capital\t€216", "ko": "CET1 = 보통주 12 + 이익잉여금 187 = 199, AT1 = 우선주 17 → Total Tier 1 = 216. 후순위채는 Tier 2.", "trap": "우선주 누락(199) 또는 후순위채 포함(239).", "f": "Total Tier 1 = CET1 + AT1(만기 없음, 배당 재량적 상품)", "why": {"A": "Incorrect. This calculation correctly includes the Common Equity Tier 1 components (common shares (€12) and retained earnings (€187)) for a total of €199. However, it incorrectly excludes preferred shares, which should be included as part of Total Tier 1 Capital. 12 + 187 = €199.", "C": "Incorrect. This calculation correctly includes preferred shares (€17), common shares (€12), and retained earnings (€187). However, it incorrectly also includes subordinated debt (€23), bringing the total to €239. Subordinated debt is part of Tier 2 Capital. 17 + 12 + 187 +23 = €239."}, "orig": "ECO Module 4 Q45"}, {"id": "ECO-M4-Q47", "src": "ECO 오답", "module": 4, "tag": "은행 자산 측정", "vig": null, "stem": "Which of the following statements is most accurate about assets on the balance sheets of commercial banks for financial reporting purposes? The assets of commercial banks:", "opts": {"A": "predominantly include insured deposits.", "B": "are often measured at fair market value for financial reporting.", "C": "are adjusted with regulatory risk-weights when reporting total assets on balance sheet."}, "ans": "B", "en": "Correct because a distinctive feature of financial institutions is that their assets are predominantly financial assets, such as loans and securities. In contrast, the assets of most non-financial companies are predominantly tangible assets. Unlike many tangible assets, financial assets are often measured at fair market value for financial reporting.", "ko": "은행 자산은 주로 금융자산(대출·증권)이며 공정가치로 측정되는 경우가 많습니다. 보험부보 예금은 부채, 위험가중치는 자본적정성 계산용일 뿐 B/S 보고에 반영하지 않습니다.", "trap": "Insured deposits = 은행 부채.", "f": "", "why": {"A": "Incorrect because these are the liabilities, not assets, of banks while another distinctive feature of financial institutions is that their assets are predominantly financial assets, such as loans and securities. In contrast, the assets of most non-financial companies are predominantly tangible assets.", "C": "Incorrect because the adjustment of bank's assets by risk weighting is for the purpose of calculating capital adequacy, not for reporting on the balance sheet. For purposes of determining capital adequacy, a bank’s assets are adjusted based on their risk, with riskier assets requiring a higher weighting. The risk adjustment results in an amount for risk-weighted assets to use when determining the amount of capital required to fund those assets."}, "orig": "ECO Module 4 Q47"}, {"id": "ECO-M4-Q49", "src": "ECO 오답", "module": 4, "tag": "VaR – Covariance adjustment", "vig": null, "stem": "With respect to a bank's sensitivity to market risk, covariance adjustment reflects that its total VaR on a given day is:", "opts": {"A": "less than the sum of the VaRs relating to each individual risk type.", "B": "equal to the sum of the VaRs relating to each individual risk type.", "C": "greater than the sum of the VaRs relating to each individual risk type."}, "ans": "A", "en": "Correct because covariance adjustment reflects the fact that the risks within each and across risk types are not perfectly correlated and, consequently, the total VaR on a given day will be lower than the sum of the VARs relating to each individual risk type.", "ko": "위험 유형 간 상관관계가 완전하지 않음(분산효과) → 총 VaR < 개별 위험 VaR의 합.", "trap": "", "f": "", "why": {"B": "Incorrect because covariance adjustment reflects the fact that the risks within each and across risk types are not perfectly correlated and, consequently, the total VaR on a given day will be lower than the sum of the VARs relating to each individual risk type.", "C": "Incorrect because covariance adjustment reflects the fact that the risks within each and across risk types are not perfectly correlated and, consequently, the total VaR on a given day will be lower than the sum of the VARs relating to each individual risk type."}, "orig": "ECO Module 4 Q49"}, {"id": "ECO-M4-Q50", "src": "ECO 오답", "module": 4, "tag": "Basel III – ASF factor", "vig": null, "stem": "An analyst is evaluating three different funding sources with similar residual maturities between six months and one year. Which of the following is considered to be the most stable funding source under Basel III?", "opts": {"A": "Funding provided by central banks and financial institutions", "B": "Less stable non-maturity and term deposits provided by retail and small business customers", "C": "Funding from sovereigns, public sector entities, and multilateral and national development banks"}, "ans": "B", "en": "Correct because Basel III requires a bank to have a minimum amount of stable funding relative to the bank’s liquidity needs over a one-year horizon. Stability of funding is based on the tenor of deposits (e.g., longer-term deposits are more stable than shorter-term deposits) and the type of depositor (e.g., funds from consumers’ deposits are considered more stable than funds raised in the interbank markets).\nUnder Basel III, the available stable funding is determined by assigning a bank’s capital and liabilities to one of five categories. The amount assigned to each category is then multiplied by an available stable funding (ASF) factor, and the total available stable funding is the sum of the weighted amounts. Less stable non-maturity deposits and term deposits with residual maturity of less than one year provided by retail and small business customers has an ASF factor of 90%, which is the highest among the three choices.", "ko": "ASF factor: 소매·소기업의 덜 안정적 비만기·1년 미만 정기예금 = 90%. 중앙은행·금융기관 자금(6개월~1년), 정부·공공기관 자금(1년 미만) = 50%. 개인 예금이 더 '끈끈함(sticky)'.", "trap": "기관 자금이 더 안정적이라는 착각.", "f": "NSFR = ASF / RSF ≥ 100%", "why": {"A": "Incorrect because Basel III requires a bank to have a minimum amount of stable funding relative to the bank’s liquidity needs over a one-year horizon. Stability of funding is based on the tenor of deposits (e.g., longer-term deposits are more stable than shorter-term deposits) and the type of depositor (e.g., funds from consumers’ deposits are considered more stable than funds raised in the interbank markets).\nLess stable non-maturity deposits and term deposits with residual maturity of less than one year provided by retail and small business customers has an ASF factor of 90%, which is the highest among the three choices. The ASF factor of other funding with residual maturity between six months and less than one year not included in the above categories, including funding provided by central banks and financial institutions\" is lower at 50%.", "C": "Incorrect because Basel III requires a bank to have a minimum amount of stable funding relative to the bank’s liquidity needs over a one-year horizon. Stability of funding is based on the tenor of deposits (e.g., longer-term deposits are more stable than shorter-term deposits) and the type of depositor (e.g., funds from consumers’ deposits are considered more stable than funds raised in the interbank markets).\nLess stable non-maturity deposits and term deposits with residual maturity of less than one year provided by retail and small business customers has an ASF factor of 90%, which is the highest among the three choices. The ASF factor of funding with residual maturity of less than one year from sovereigns, public sector entities, and multilateral and national development banks is lower at 50%."}, "orig": "ECO Module 4 Q50"}, {"id": "ECO-M4-Q51", "src": "ECO 관련유형", "module": 4, "tag": "Basel III 3대 요건", "vig": null, "stem": "Which of the following requirements under Basel III most likely ensures a bank’s liquidity needs are met over a 1-year horizon?", "opts": {"A": "Stable funding requirement", "B": "Minimum capital requirement", "C": "Minimum liquidity requirement"}, "ans": "A", "en": "Correct because the minimum amount of stable funding is relative to the bank’s liquidity needs over a one-year horizon.", "ko": "최소자본(RWA 대비), 최소유동성(LCR, 30일), 안정적 자금조달(NSFR, 1년).", "trap": "", "f": "", "why": {"B": "Incorrect because the minimum amount of stable funding is relative to the bank’s liquidity needs over a one-year horizon. Minimum capital requirement prevents a bank from assuming so much financial leverage that it is unable to withstand loan losses (asset write-downs).", "C": "Incorrect because the minimum amount of stable funding is relative to the bank’s liquidity needs over a one-year horizon. Whereas Basel III specifies that a bank must hold enough high-quality liquid assets to cover its liquidity needs in a 30-day liquidity stress scenario. This minimum liquidity requirement ensures that a bank would have enough cash to cover a partial loss of funding sources (e.g., customers’ deposits, other borrowings) or a cash outflow resulting from off-balance-sheet funding commitments."}, "orig": "ECO Module 4 Q51"}, {"id": "ECO-M4-Q54", "src": "ECO 관련유형", "module": 4, "tag": "Combined ratio 계산", "vig": null, "stem": "An analyst gathers the following information (in $ millions) of an insurer and evaluates the overall efficiency of its operation:\nLoss expense and loss adjustment expense\t12,000\nNet premiums earned\t15,000\nUnderwriting expense\t4,000\nNet premiums written\t10,000\nThe insurer's combined ratio is:", "opts": {"A": "64%.", "B": "80%.", "C": "120%."}, "ans": "C", "en": "Correct because 120% is the combined ratio of the insurer.\nCombined ratio = Loss and loss adjustment expense ratio + Underwriting expense ratio.\nLoss and loss adjustment expense ratio = (Loss expense + Loss adjustment expense)/Net premiums earned.\nUnderwriting expense ratio = Underwriting expense/Net premiums written.\nLoss expense and loss adjustment expense\t12,000\nNet premiums earned\t15,000\nLoss and loss adjustment expense ratio\t80%\nUnderwriting expense\t4,000\nNet premiums written\t10,000\nUnderwriting expense ratio\t40%\nLoss and loss adjustment expense ratio\t80%\nUnderwriting expense ratio\t40%\nCombined ratio = 80% + 40%\t120%", "ko": "Loss ratio 12,000/15,000(earned) = 80% + Underwriting expense 4,000/10,000(written) = 40% → 120%.", "trap": "분모를 하나로 통일하면 오답.", "f": "Combined = Loss&LAE/NPE + Underwriting exp./NPW", "why": {"A": "Incorrect because the combined ratio is incorrectly calculated as (Loss expense + Loss adjustment expense + Underwriting expense) / (Net premiums earned + Net premiums written)\nLoss expense and loss adjustment expense \t12,000\nUnderwriting expense\t4,000\nTotal of loss, loss adjustment, and underwriting expenses \t16,000\nNet premiums earned \t15,000\nNet premiums written\t10,000\nTotal of net premiums earned and written\t25,000\n(Total of loss, loss adjustment, and underwriting expenses) / (Total of net premiums earned and written) = 16,000/25,000\t64%", "B": "Incorrect because this is the Loss and loss adjustment expense ratio for the insurer. Loss and loss adjustment expense ratio = (Loss expense + Loss adjustment expense) / Net premiums earned.\nLoss expense and loss adjustment expense\t12,000\nNet premiums earned\t15,000\nLoss and loss adjustment expense ratio = 12,000/15,000\t80%"}, "orig": "ECO Module 4 Q54"}, {"id": "ECO-M4-Q56", "src": "ECO 오답", "module": 4, "tag": "CAMELS 미포함 요소", "vig": null, "stem": "Which of the following factors is not addressed in the CAMELS (capital adequacy, asset quality, management, earnings, liquidity, and sensitivity) approach to the analysis of a bank?", "opts": {"A": "Internal controls", "B": "Corporate governance", "C": "Off-balance-sheet items"}, "ans": "C", "en": "Correct because there are other factors relevant to the analysis of a bank that are not covered by the CAMELS approach including off-balance-sheet items. Off-balance-sheet assets and liabilities pose a risk to entities and their investors if they should unexpectedly drain resources.", "ko": "Off-balance-sheet 항목은 CAMELS가 다루지 않는 기타 요인. Internal controls·corporate governance는 Management에서 다룹니다.", "trap": "", "f": "", "why": {"A": "Incorrect because internal controls is considered in the management capabilities part of the CAMELS approach. Effective management involves successfully identifying and exploiting appropriate profit opportunities while simultaneously managing risk. Sound internal controls, transparent management communication, and financial reporting quality are indicators of management effectiveness.", "B": "Incorrect because corporate governance is considered in the management capabilities part of the CAMELS approach. Effective management involves successfully identifying and exploiting appropriate profit opportunities while simultaneously managing risk. For all types of entities, compliance with laws and regulations is essential. A strong governance structure—with an independent board that avoids excessive compensation or self-dealing—is also critically important."}, "orig": "ECO Module 4 Q56"}, {"id": "SCH-M4-01", "src": "Schweser MQ", "module": 4, "tag": "Basel III 요소 아닌 것", "vig": null, "stem": "Which of the following is least likely a requirement of the Basel III framework?", "opts": {"A": "A minimum percentage of risk-weighted assets funded with capital", "B": "A positive spread between asset yields and the deposit rate", "C": "A minimum level of stable funding relative to one-year liquidity needs"}, "ans": "B", "en": "Basel III's pillars are minimum capital (relative to RWA), minimum liquidity (LCR), and stable funding (NSFR). A positive spread is needed for profitability but is not a Basel III requirement.", "ko": "Basel III 3대 축: 최소자본(RWA 대비), 최소유동성(LCR 30일), 안정적 자금조달(NSFR 1년). 예대마진은 수익성 문제일 뿐.", "trap": "", "f": "", "why": {"A": "RWA 대비 최소자본은 Basel III의 핵심 요건입니다.", "C": "1년 시계 안정적 자금조달(NSFR)은 Basel III 요건입니다."}, "orig": "Schweser MQ 10.1 변형"}, {"id": "SCH-M4-02", "src": "Schweser MQ", "module": 4, "tag": "가장 중요한 자본", "vig": null, "stem": "The most important (highest-quality) source of capital for a bank is:", "opts": {"A": "Total Tier 1 capital.", "B": "Common Equity Tier 1 capital.", "C": "Tier 2 capital."}, "ans": "B", "en": "Common Equity Tier 1 (common stock, APIC, retained earnings, OCI, less deductions such as intangibles and DTAs) is the most important tier.", "ko": "CET1(보통주·자본잉여금·이익잉여금·OCI − 무형자산·DTA 등 차감)이 최우선 자본.", "trap": "", "f": "", "why": {"A": "Total Tier 1에는 AT1(우선주 등)도 포함 — 가장 핵심은 그 안의 CET1입니다.", "C": "Tier 2는 후순위채 등 가장 낮은 품질의 자본입니다."}, "orig": "Schweser MQ 10.2 변형"}, {"id": "SCH-M4-03", "src": "Schweser MQ", "module": 4, "tag": "Basel III 최소 비율", "vig": null, "stem": "Under Basel III, total Tier 1 capital must be at least:", "opts": {"A": "4.5% of risk-weighted assets.", "B": "6.0% of risk-weighted assets.", "C": "8.0% of risk-weighted assets."}, "ans": "B", "en": "Minimums: CET1 4.5%, total Tier 1 6.0%, total capital 8.0% of RWA.", "ko": "CET1 4.5% / Total Tier 1 6% / Total capital 8% (RWA 대비).", "trap": "", "f": "CET1 ≥ 4.5%, Tier 1 ≥ 6%, Total ≥ 8%", "why": {"A": "4.5%는 CET1 최소비율입니다.", "C": "8.0%는 Total capital 최소비율입니다."}, "orig": "Schweser MQ 10.2 변형"}, {"id": "SCH-M4-04", "src": "Schweser MQ", "module": 4, "tag": "Additional Tier 1 요건", "vig": null, "stem": "Instruments issued by a bank that are subordinate to deposits and other debt, have no fixed maturity, and pay dividends/interest entirely at the bank's discretion are most likely part of:", "opts": {"A": "Tier 1 capital (as Additional Tier 1).", "B": "Common Equity Tier 1 capital.", "C": "Tier 2 capital."}, "ans": "A", "en": "Subordinated instruments without fixed maturity and with fully discretionary payments qualify as Additional (Other) Tier 1; with CET1 they form total Tier 1 capital.", "ko": "후순위 + 만기 없음 + 배당·이자 완전 재량 → Additional Tier 1 → Tier 1에 포함. 만기가 있는 후순위채는 Tier 2.", "trap": "", "f": "", "why": {"B": "CET1은 보통주·이익잉여금 등 보통주 자본으로 구성됩니다. 우선주형 상품은 AT1입니다.", "C": "Tier 2는 만기가 있는 후순위채 등입니다. 만기 없음 + 재량적 지급이면 Tier 1(AT1)."}, "orig": "Schweser MQ 10.2 변형"}, {"id": "SCH-M4-05", "src": "Schweser MQ", "module": 4, "tag": "은행 수익원 변동성", "vig": null, "stem": "Which source of bank earnings is typically the most volatile?", "opts": {"A": "Service (fee) income", "B": "Net interest income", "C": "Trading income"}, "ans": "C", "en": "Trading income depends on market prices and is the most volatile and least sustainable; net interest income and fee income are more recurring.", "ko": "Trading income 비중↑ = 변동성↑, NII·fee 비중↑ = 지속성↑ (항상 common-size 비중으로 판단).", "trap": "", "f": "", "why": {"A": "수수료 수익은 반복적이고 비교적 안정적입니다.", "B": "순이자수익은 가장 안정적인 핵심 수익원입니다."}, "orig": "Schweser MQ 10.3 변형"}, {"id": "SCH-M4-06", "src": "Schweser MQ", "module": 4, "tag": "Maturity mismatch", "vig": null, "stem": "For a bank, a maturity mismatch between assets and liabilities most directly contributes to:", "opts": {"A": "earnings quality risk.", "B": "liquidity risk.", "C": "capital adequacy risk."}, "ans": "B", "en": "Maturity mismatch (funding long-term assets with short-term liabilities) is a liquidity risk metric.", "ko": "장기자산을 단기부채로 조달하는 만기불일치 = 유동성 위험 지표. 금리 상승기에는 NIM 압박도 동반.", "trap": "", "f": "", "why": {"A": "만기불일치는 이익의 질이 아니라 유동성 위험 지표입니다.", "C": "자본적정성은 RWA 대비 자본 비율 문제입니다."}, "orig": "Schweser MQ 10.4 변형"}, {"id": "SCH-M4-07", "src": "Schweser MQ", "module": 4, "tag": "NSFR 최소기준", "vig": null, "stem": "The minimum net stable funding ratio recommended by Basel III is:", "opts": {"A": "50%.", "B": "90%.", "C": "100%."}, "ans": "C", "en": "NSFR (available stable funding / required stable funding) must be at least 100%. (Note: 50% and 90% are ASF factors, not the ratio minimum.)", "ko": "NSFR = ASF/RSF ≥ 100%. 90%·50%는 ASF factor(자금원별 가중치)라 함정 숫자입니다.", "trap": "ASF factor(90/50%)와 NSFR 최소치(100%) 혼동.", "f": "", "why": {"A": "50%는 금융기관·정부 자금의 ASF factor입니다.", "B": "90%는 소매·소기업 예금의 ASF factor입니다."}, "orig": "Schweser MQ 10.4 변형"}, {"id": "SCH-M4-08", "src": "Schweser MQ", "module": 4, "tag": "P&C vs L&H – 청구 특성", "vig": null, "stem": "Relative to life and health (L&H) insurers, property and casualty (P&C) insurers most likely have:", "opts": {"A": "longer contract periods.", "B": "lumpier, less predictable claims.", "C": "lower liquidity risk."}, "ans": "B", "en": "P&C claims arise from unpredictable events (accidents, catastrophes) and are lumpier; L&H claims are predictable in aggregate using mortality tables. P&C contracts are shorter and liquidity risk is higher.", "ko": "P&C = 단기 계약 + 예측 어려운(lumpy) 청구 → 유동성 위험↑ → 보수적 투자. L&H = 장기 계약 + 예측 가능 청구.", "trap": "", "f": "", "why": {"A": "계약기간은 L&H가 훨씬 깁니다.", "C": "P&C는 청구가 불규칙해 유동성 위험이 '높습니다'."}, "orig": "Schweser MQ 10.6 변형"}, {"id": "SCH-M4-09", "src": "Schweser MQ", "module": 4, "tag": "L&H – Float & 금리위험", "vig": null, "stem": "Relative to P&C insurers, L&H insurers are most likely to have:", "opts": {"A": "lower float.", "B": "higher interest rate risk.", "C": "shorter contract periods."}, "ans": "B", "en": "Because of long contract periods and asset–liability duration mismatches, L&H insurers have higher float and greater interest rate risk.", "ko": "L&H: 긴 계약 → float↑, 자산·부채 duration 불일치 → 금리위험↑.", "trap": "", "f": "", "why": {"A": "L&H는 계약이 길어 float가 '더 큽니다'.", "C": "계약기간이 짧은 쪽은 P&C입니다."}, "orig": "Schweser MQ 10.6 변형"}, {"id": "SCH-M4-10", "src": "Schweser MQ", "module": 4, "tag": "Soft market – Combined ratio", "vig": null, "stem": "As the P&C insurance market moves from a hard market into a soft pricing period, the industry combined ratio is most likely to:", "opts": {"A": "rise.", "B": "fall.", "C": "remain unchanged."}, "ans": "A", "en": "In a soft market, price competition lowers premiums and loosens underwriting, so losses and expenses relative to premiums rise—a higher combined ratio. A combined ratio above 100% indicates an underwriting loss.", "ko": "Soft market = 저가 경쟁 → 보험료↓, 인수기준 완화 → 손해·비용 비율↑ → combined ratio 상승(>100%면 인수손실). 자본도 소진.", "trap": "Hard→Soft 전환 방향을 반대로 기억하는 함정.", "f": "Combined ratio > 100% = underwriting loss", "why": {"B": "Soft market에서는 보험료↓·인수기준 완화로 손해·비용 비율이 '상승'합니다.", "C": "가격 경쟁으로 수익성이 악화되므로 combined ratio가 변합니다."}, "orig": "Schweser MQ 10.6 변형"}, {"id": "ECO-M5-Q2", "src": "ECO 오답", "module": 5, "tag": "Earnings manipulation 경고신호", "vig": 31, "stem": "Which of Pereira’s statements about Miland Communications is most likely a warning sign of potential earnings manipulation?", "opts": {"A": "The trend in inventory turnover", "B": "The trend in receivables turnover", "C": "The amount of net income relative to cash flow from operations"}, "ans": "C", "en": "C is correct. Net income being greater than cash flow from operations is a warning sign that the firm may be using aggressive accrual accounting policies that shift current expenses to future periods. Decreasing, not increasing, inventory turnover could suggest inventory obsolescence problems that should be recognized. Decreasing, not increasing, receivables turnover could suggest that some revenues are fictitious or recorded prematurely or that the allowance for doubtful accounts is insufficient.", "ko": "NI > CFO = 공격적 발생주의로 비용을 미래로 이연했을 가능성(경고). 재고·채권 회전율의 '감소'가 경고신호이고, 증가는 아닙니다.", "trap": "회전율 '증가'를 경고로 착각.", "f": "", "why": {"A": "재고회전율 '증가'는 경고가 아닙니다(감소가 진부화 경고).", "B": "채권회전율 '증가'는 경고가 아닙니다(감소가 가공·조기매출 경고)."}, "orig": "ECO Module 5 Q2"}, {"id": "ECO-M5-Q4", "src": "ECO 오답", "module": 5, "tag": "정량모델(Beneish)의 한계", "vig": 31, "stem": "Which of Pereira’s statements regarding the use of quantitative models to assess the likelihood of misreporting is correct?", "opts": {"A": "Only Statement 4", "B": "Only Statement 5", "C": "Both Statement 4 and Statement 5"}, "ans": "B", "en": "B is correct. Earnings manipulators have learned to test the detectability of earnings manipulation tactics by using the model to anticipate analysts’ perceptions. They can reduce their likelihood of detection; therefore, Statement 5 is correct. As a result, the predictive power of the Beneish model can decline over time. An additional limitation of using quantitative models is that they cannot determine cause and effect between model variables. Quantitative models establish only associations between variables, and Statement 4 is incorrect.\n\nA is incorrect because quantitative models cannot determine cause and effect between model variables. They are capable only of establishing associations between variables. Therefore, Statement 4 is incorrect.", "ko": "정량모델은 변수 간 association만 확인 가능하고 인과관계(cause & effect)는 밝히지 못함(진술 4 오답). 경영자들이 모델로 탐지 가능성을 테스트하여 예측력이 시간이 갈수록 하락(진술 5 정답).", "trap": "", "f": "", "why": {"A": "진술 4는 틀렸습니다. 정량모델은 연관성(association)만 보여주고 인과관계는 밝히지 못합니다.", "C": "진술 4가 틀렸으므로 '둘 다'는 불가합니다."}, "orig": "ECO Module 5 Q4"}, {"id": "ECO-M5-Q13", "src": "ECO 오답", "module": 5, "tag": "Reporting quality – Unbiased measurement", "vig": 32, "stem": "Webster’s concern about BIG Industrial’s inventory suggests poor reporting quality, most likely resulting from a lack of:", "opts": {"A": "completeness.", "B": "clear presentation.", "C": "unbiased measurement."}, "ans": "C", "en": "C is correct. Webster is concerned that innovations have made some of BIG Industrial’s inventory obsolete. This scenario suggests impairment charges for inventory may be understated and that the inventory balance does not reflect unbiased measurement.", "ko": "진부화된 재고의 손상 미인식 → 재고 과대 = 측정 편향(unbiased measurement 결여). Completeness는 부외부채 등 누락, clear presentation은 표시·집계 방식 문제.", "trap": "", "f": "", "why": {"A": "Completeness는 부외부채 등 항목 '누락' 문제입니다. 재고는 B/S에 있으나 금액이 편향된 것입니다.", "B": "Clear presentation은 표시·집계 방식 문제입니다."}, "orig": "ECO Module 5 Q13"}, {"id": "ECO-M5-Q16", "src": "ECO 오답", "module": 5, "tag": "무형자산 과소계상 → 이익 과대", "vig": 33, "stem": "Based on Conclusion 2, after the acquisition of Solar, Stellar’s earnings are most likely:", "opts": {"A": "understated.", "B": "fairly stated.", "C": "overstated."}, "ans": "C", "en": "C is correct. Martinez believes that Stellar most likely understated the value of amortizable intangibles when recording the acquisition of a rival company last year. Impairment charges have not been taken since the acquisition (Conclusion 2). Consequently, the company’s earnings are likely to be overstated because amortization expense is understated. This understatement has not been offset by an impairment charge.", "ko": "인수 시 상각대상 무형자산 과소 → 차액이 goodwill로 과대배분 → 상각비 과소 → 이익 과대. Goodwill 손상도 없었으므로 상쇄되지 않고 그대로 과대.", "trap": "Goodwill은 상각하지 않으므로 과대배분돼도 비용이 생기지 않음.", "f": "", "why": {"A": "상각대상 무형자산이 과소 → 상각비 과소 → 이익은 '과대'입니다.", "B": "Goodwill 손상도 없어 과대 효과가 상쇄되지 않았으므로 공정하지 않습니다."}, "orig": "ECO Module 5 Q16"}, {"id": "ECO-M5-Q24", "src": "ECO 오답", "module": 5, "tag": "재고회전율↓ – 진부화 충당금", "vig": 34, "stem": "The trend in the inventory turnover ratio most likely indicates that, in the most recent year, Libra has aggressively:", "opts": {"A": "liquidated inventory.", "B": "delayed payments to suppliers.", "C": "reduced the obsolescence allowance."}, "ans": "C", "en": "Correct because the inventory turnover ratio shows a significant decrease in the most recent year. This means that inventory as a percentage of cost of goods sold increased significantly. Since Libra had no significant change in its purchase or inventory policies, the trend in the inventory turnover ratio could be an indication that, in the most recent year, Libra may have aggressively reduced its obsolescence allowance. Management may use items such as reserves and allowances to manage or smooth earnings.", "ko": "구매·재고 정책 변화 없이 재고회전율 급락 → 재고 장부가가 COGS 대비 커짐 → 진부화 충당금을 공격적으로 줄였을 가능성(이익 관리).", "trap": "재고 청산(A)이면 회전율↑, 매입채무 지연(B)은 재고·COGS 무관.", "f": "Obsolescence allowance↓ → 재고 장부가↑ → Inventory turnover↓", "why": {"A": "Incorrect because if Libra had aggressively liquidated inventory, inventory would have decreased and cost of goods sold would have increased by the same amount. As a result, the inventory turnover ratio (cost of goods sold/inventory) would have increased in the most recent year.", "B": "Incorrect because if Libra had aggressively delayed payments to suppliers, neither the inventory nor the cost of goods sold would have been affected. As a result, the inventory turnover ratio (cost of goods sold/inventory) would not have been affected in the most recent year."}, "orig": "ECO Module 5 Q24"}, {"id": "ECO-M5-Q26", "src": "ECO 오답", "module": 5, "tag": "위험 정보원 – Auditor's report", "vig": 34, "stem": "Which of the following information sources is least useful for Bruno’s investigation?", "opts": {"A": "Financial press", "B": "Auditor’s report", "C": "Management commentary"}, "ans": "B", "en": "Correct because to investigate risks, Bruno can turn to several sources. However, an auditor’s opinion is unlikely to be an analyst’s first source of information about a company’s risk. The auditor’s report indicates if the financial statements fairly reflect the financial position and results of the company’s business activities, but it does not list nor completely explain the company’s environmental risks.", "ko": "감사보고서는 재무제표의 적정성 의견일 뿐 환경위험 등 사업위험을 나열·설명하지 않음 → 위험 조사에 가장 덜 유용. 경영진 코멘터리·금융언론은 유용.", "trap": "", "f": "", "why": {"A": "Incorrect because the financial press can be a useful source of information about risk, when for example, a financial reporter uncovers financial reporting issues that had not previously been recognized.", "C": "Incorrect because one purpose of the commentary is to help users of the financial reports in understanding the company's risk exposures, approach to managing risk, and effectiveness of risk management."}, "orig": "ECO Module 5 Q26"}, {"id": "ECO-M5-Q29", "src": "ECO 오답", "module": 5, "tag": "손상 후 환입 – 과거 비율 왜곡", "vig": 6, "stem": "If Treadway’s belief about management’s motivation behind the 2014 treatment of the broadcast licenses is correct, compared to the actual economic results in 2015, her original 2015 analysis would most likely have:", "opts": {"A": "understated ROA.", "B": "overstated net profit margin.", "C": "understated fixed asset turnover."}, "ans": "B", "en": "Correct. The broadcast licenses were written down in 2014, but the write-down was reversed in 2016. Therefore, during 2015 the intangible assets were understated, which would have understated amortization expense for the year and increased profit. Thus in 2015, net profit margin was overstated.", "ko": "2014년 손상 → 2015년 무형자산 과소 → 상각비 과소 → 이익 과대 → NPM 과대. 자산 과소로 ROA·자산회전율도 과대(understated 아님).", "trap": "자산이 작으면 회전율·ROA가 '높게' 나옵니다.", "f": "", "why": {"A": "Incorrect. In 2015 the intangible assets were understated and net profit was overstated (due to the lower amortization expense), so ROA would have been overstated in 2015, not understated.", "C": "Incorrect. In 2015 the intangible assets were understated, which would have increased asset turnover (Sales/Average total assets), so it would have been overstated during the year."}, "orig": "ECO Module 5 Q29"}, {"id": "ECO-M5-Q30", "src": "ECO 오답", "module": 5, "tag": "Altman Z-score 해석", "vig": 6, "stem": "From her Altman Score results, Treadway is most likely to conclude that the probability of bankruptcy for CCCL has:", "opts": {"A": "decreased.", "B": "remained uncertain.", "C": "increased."}, "ans": "B", "en": "Correct. Altman scores in excess of 3.0 indicate low probability of bankruptcy; those below 1.81 indicate a high probability of bankruptcy. Scores within the 1.81 to 3.0 range do not provide a clear indication of bankruptcy.", "ko": "Z > 3.0: 파산 가능성 낮음, Z < 1.81: 높음, 1.81~3.0: 불확실(grey zone). 1.82 → 2.14로 상승했지만 여전히 grey zone → 'remained uncertain'.", "trap": "점수 상승만 보고 'decreased'로 판단.", "f": "Altman: >3.0 safe / 1.81–3.0 grey / <1.81 distress", "why": {"A": "Incorrect. The Altman score has increased, which might suggest less bankruptcy risk, but it is still in that zone of uncertainty.", "C": "Incorrect. The Altman score has increased, which might suggest less bankruptcy risk, but it is still in that zone of uncertainty."}, "orig": "ECO Module 5 Q30"}, {"id": "ECO-M5-Q33", "src": "ECO 오답", "module": 5, "tag": "Normal vs Abnormal accruals", "vig": null, "stem": "The only factor expected to give rise to normal accruals in a company’s earnings is the growth in credit sales. If there is no residual when total accruals are regressed on the growth in credit sales, total accruals are most likely equal to:", "opts": {"A": "zero.", "B": "the abnormal accruals.", "C": "the non-discretionary accruals."}, "ans": "C", "en": "Correct because a company’s normal accruals are modeled as a function of economic factors, such as growth in credit sales and the amount of depreciable assets. Growth in credit sales would be expected to result in accounts receivable growth, and depreciable assets would be associated with the amount of depreciation. To apply this approach, total accruals are regressed on the factors expected to give rise to normal accruals, and the residual of the regression would be considered a proxy for abnormal accruals. If the residual of the regression is zero, the total accruals would equal the normal accruals (also called 'non-discretionary' accruals). An important distinction is between accruals that arise from normal transactions in the period (called 'non-discretionary') and accruals that result from transactions or accounting choices outside the normal, which are possibly made with the intent to distort reported earnings (called 'discretionary accruals').", "ko": "총 발생액을 정상 발생 요인(신용매출 증가 등)에 회귀 → 잔차 = abnormal(discretionary) accruals. 잔차가 0이면 총 발생액 = normal(non-discretionary) accruals.", "trap": "잔차 0 → 'abnormal = 0'이지 'total = 0'이 아님.", "f": "", "why": {"A": "Incorrect because total accruals are regressed on the factors expected to give rise to normal accruals, and the residual of the regression would be considered a proxy for abnormal accruals. If there is no residual, the abnormal (not total) accruals are most likely zero.", "B": "Incorrect because total accruals are regressed on the factors expected to give rise to normal accruals, and the residual of the regression would be considered a proxy for abnormal accruals. If there is no residual, the abnormal accruals are most likely zero thus total accruals being equal to the normal (or non-discretionary) accruals."}, "orig": "ECO Module 5 Q33"}, {"id": "ECO-M5-Q36", "src": "ECO 오답", "module": 5, "tag": "Valuation allowance 과소", "vig": null, "stem": "A company understating the valuation allowance for deferred tax assets:", "opts": {"A": "overstates both tax expenses and the value of the deferred tax assets.", "B": "overstates tax expenses and understates the value of the deferred tax assets.", "C": "understates tax expenses and overstates the value of the deferred tax assets."}, "ans": "C", "en": "Correct because the understatement of valuation allowance for deferred tax assets would understate tax expenses and overstate the value of the assets on the balance sheet.", "ko": "DTA 평가충당금 과소 → 법인세비용 과소(이익 과대) + DTA 장부가 과대.", "trap": "", "f": "", "why": {"A": "Incorrect because the understatement of valuation allowance for deferred tax assets would understate, not overstate, tax expenses.", "B": "Incorrect because the understatement of valuation allowance for deferred tax assets would understate tax expenses and overstate the value of the assets on the balance sheet."}, "orig": "ECO Module 5 Q36"}, {"id": "ECO-M5-Q37", "src": "ECO 오답", "module": 5, "tag": "감사인 독립성 신호", "vig": null, "stem": "An analyst gathers the following information about three companies:\nCompany 1\tContributes a substantial portion to the auditing firm’s revenue\nCompany 2\tHas management that is particularly close to the auditor's management\nCompany 3\tChanges auditors only if required by mandatory rules\nPossible reporting problems are least likely signaled in relation to:", "opts": {"A": "Company 1.", "B": "Company 2.", "C": "Company 3."}, "ans": "C", "en": "Correct because as long as mandatory rotation rules are complied with, maintaining the same auditor is not a red flag by itself but the other way around a change in the auditor (especially multiple changes in the auditor) can signal possible reporting problems.", "ko": "감사인 매출의 큰 비중을 차지하는 고객, 경영진과 감사인의 친밀함은 독립성 우려. 의무 교체 규칙을 준수하며 감사인을 유지하는 것은 그 자체로 경고 아님(오히려 잦은 교체가 경고).", "trap": "", "f": "", "why": {"A": "Incorrect because the lack of auditor's independence due to economic dependence is a concern for potential reporting problems. In general, it is important to understand the relationship between the auditor and the firm. Any questions about the auditor’s independence would be a cause for concern—for example, if the auditor and company management are particularly close or if the company represents a substantial portion of the auditing firm’s revenue.", "B": "Incorrect because the lack of auditor's independence due to management ties is a concern for potential reporting problems. In general, it is important to understand the relationship between the auditor and the firm. Any questions about the auditor’s independence would be a cause for concern—for example, if the auditor and company management are particularly close or if the company represents a substantial portion of the auditing firm’s revenue."}, "orig": "ECO Module 5 Q37"}, {"id": "ECO-M5-Q39", "src": "ECO 오답", "module": 5, "tag": "비관측 입력값 – Unbiased measurement", "vig": null, "stem": "A company has a substantial portion of its assets valued using non-observable inputs. Which of the following aspects of financial reporting quality is most likely to be adversely impacted?", "opts": {"A": "Completeness", "B": "Clear presentation", "C": "Unbiased measurement"}, "ans": "C", "en": "Correct because an important aspect of financial reporting quality for the balance sheet is unbiased measurement. The balance sheet of a company with a substantial portion of its assets valued using non-observable inputs likely warrants closer scrutiny.", "ko": "자산의 상당 부분이 non-observable(Level 3) 입력값으로 평가 → 측정 편향 가능성 → unbiased measurement가 훼손.", "trap": "", "f": "", "why": {"A": "Incorrect because completeness, another important aspect of financial reporting quality refers to the completeness of items on the balance sheet, particularly off-balance-sheet liabilities. Significant amounts of off-balance-sheet obligations could be a concern for an analyst because exclusion of these obligations could understate the company’s leverage. Non-observable valuation inputs is not related to completeness.", "B": "Incorrect because clear presentation, another important for financial reporting quality is referring to how items are presented on the balance sheet, in determining which line items should be shown separately and which should be aggregated into single total. Non-observable valuation inputs is not related to clear presentation."}, "orig": "ECO Module 5 Q39"}, {"id": "ECO-M5-Q40", "src": "ECO 오답", "module": 5, "tag": "파산예측 – Going concern 가정", "vig": null, "stem": "Which of the following bankruptcy prediction models best addresses the issue of the going-concern assumption in using historical financial statements?", "opts": {"A": "Hazard models", "B": "Market-based models", "C": "Accounting-based models"}, "ans": "B", "en": "Correct because another shortcoming of the Altman model, and other accounting-based bankruptcy prediction models, is that financial statements measure past performance and incorporate the going-concern assumption. The reported values on a company’s balance sheet assume that the company is a going concern rather than one that might be failing. An alternative is to use market-based bankruptcy prediction models.", "ko": "Altman 등 회계기반(hazard 모형 포함) 모델은 과거 성과·계속기업 가정에 기반한 재무제표 사용이 단점. 대안 = market-based 모델.", "trap": "Hazard model도 회계기반 모델의 일종입니다.", "f": "", "why": {"A": "Incorrect because a shortcoming of the Altman model and other accounting-based bankruptcy prediction models, including Hazard model, is that financial statements measure past performance and incorporate the going-concern assumption.", "C": "Incorrect because another shortcoming of the Altman model, and other accounting-based bankruptcy prediction models, is that financial statements measure past performance and incorporate the going-concern assumption. The reported values on a company’s balance sheet assume that the company is a going concern rather than one that might be failing. An alternative is to use market-based bankruptcy prediction models."}, "orig": "ECO Module 5 Q40"}, {"id": "ECO-M5-Q44", "src": "ECO 오답", "module": 5, "tag": "Propping & Tunneling", "vig": null, "stem": "Which of the following practices involve inappropriate transfers of resources between public companies and private entities owned by their managers?", "opts": {"A": "Propping only", "B": "Tunneling only", "C": "Both propping and tunneling"}, "ans": "C", "en": "Correct because both propping and tunnelling are practices involving inappropriate transfer of resources between public companies and private entities owned by their managers. The manager-owned entity could transfer resources to the public company to ensure its economic viability and thus preserve the option to misappropriate or to participate in profits in the future. These practices are often referred to as propping. Dealings between a public company and the manager-owned entity might take place at prices that are unfavorable for the public company in order to transfer wealth from the public company to the manager-owned entity. These practices are often referred to as tunneling.", "ko": "Propping: 경영자 소유 기업 → 상장사로 자원 이전(생존 유지, 미래 착취 옵션 보존). Tunneling: 상장사 → 경영자 소유 기업으로 불리한 가격 거래로 부 이전. 둘 다 부적절한 자원 이전.", "trap": "", "f": "", "why": {"A": "Incorrect because both propping and tunnelling are practices involving inappropriate transfer of resources between public companies and private entities owned by their managers.", "B": "Incorrect because both propping and tunnelling are practices involving inappropriate transfer of resources between public companies and private entities owned by their managers."}, "orig": "ECO Module 5 Q44"}, {"id": "ECO-M5-Q48", "src": "ECO 관련유형", "module": 5, "tag": "Beneish 예측력 하락 이유", "vig": null, "stem": "Which of the following best explains why the predictive power of the Beneish model is declining over time?", "opts": {"A": "The model using accounting numbers is a partial representation of economic reality", "B": "Earnings manipulators are aware of the power of the model to screen possible cases of earnings manipulation", "C": "Financial models based on accounting numbers are only capable of establishing associations between variables"}, "ans": "B", "en": "Correct because earnings manipulators are just as aware as analysts of the power of quantitative models to screen for possible cases of earnings manipulation. The predictive power of the Beneish model is declining over time. Undoubtedly, many managers have learned to test the detectability of earnings manipulation tactics by using the model to anticipate analysts’ perceptions.", "ko": "조작자들이 모델의 선별력을 알고 탐지 가능성을 테스트 → 예측력 하락. 'association만 가능'은 한계지만 '하락 이유'는 아님.", "trap": "", "f": "", "why": {"A": "Incorrect because while accounting is a partial representation of economic reality, and this is a limitation of a quantitative model, the predictive power of the Beneish model is declining over time because earnings manipulators are just as aware as analysts of the power of quantitative models to screen for possible cases of earnings manipulation.", "C": "Incorrect because while financial models based on accounting numbers are only capable of establishing associations between variables, and this is a limitation of quantitative model, the predictive power of the Beneish model is declining over time because earnings manipulators are just as aware as analysts of the power of quantitative models to screen for possible cases of earnings manipulation."}, "orig": "ECO Module 5 Q48"}, {"id": "ECO-M5-Q49", "src": "ECO 오답", "module": 5, "tag": "재무보고 경고신호", "vig": null, "stem": "Which of the following is most likely to be a warning sign on the quality of financial reports?", "opts": {"A": "Increasing inventory turnover", "B": "Declining receivables turnover", "C": "Cash from operations is greater than net income"}, "ans": "B", "en": "Correct because declining receivables turnover could suggest that some revenues are fictitious or recorded prematurely or that the allowance for doubtful accounts is insufficient.", "ko": "채권회전율 감소 = 가공·조기 매출 또는 대손충당금 부족 가능성. 재고회전율은 '감소'가 경고, NI > CFO가 경고(CFO > NI는 아님).", "trap": "", "f": "", "why": {"A": "Incorrect because declining, not increasing, inventory turnover could suggest obsolescence problems that should be recognized.", "C": "Incorrect because net income greater than cash provided by operations, not cash provided by operations greater than net income, could suggest that aggressive accrual accounting policies have shifted current expenses to later periods."}, "orig": "ECO Module 5 Q49"}, {"id": "ECO-M5-Q50", "src": "ECO 관련유형", "module": 5, "tag": "Mean reversion 속도", "vig": null, "stem": "Earnings most likely show the fastest reversion to the mean if:", "opts": {"A": "earnings have a significant accruals component and the accrual elements are normal.", "B": "earnings have a significant accruals component and the accrual elements are outliers.", "C": "earnings are dominated by the cash flow component and the accruals component is insignificant."}, "ans": "B", "en": "Correct because if earnings have a significant accruals component, it may hasten the earnings’ reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company’s earnings.", "ko": "발생액 비중이 크고, 그 발생액이 정상 수준 대비 이상치(outlier)일수록 평균회귀가 가장 빠름.", "trap": "", "f": "", "why": {"A": "Incorrect because if earnings have a significant accruals component, it may hasten the earnings’ reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company’s earnings.", "C": "Incorrect b
