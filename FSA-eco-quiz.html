ecause earnings are the sum of cash flows and accruals, and they will be more sustainable and persistent when the cash flow component dominates earnings. If earnings have a significant accruals component, it may hasten the earnings’ reversion to the mean."}, "orig": "ECO Module 5 Q50"}, {"id": "ECO-M5-Q51", "src": "ECO 오답", "module": 5, "tag": "Constructive capitalization", "vig": null, "stem": "An analyst gathers the following information about a take-or-pay contract disclosed by a company in the notes to its financial statements:\nFuture purchase obligation payments\t€10,000,000\nPresent value of future purchase obligation payments\t€8,000,000\nTo properly reflect the company's leverage, using constructive capitalization, the analyst should adjust the company's reported financial statements by:", "opts": {"A": "adding €8,000,000 to the assets and adding €8,000,000 to the liabilities.", "B": "adding €10,000,000 to the assets and adding €10,000,000 to the liabilities.", "C": "adding €8,000,000 to the assets, adding €10,000,000 to the liabilities and subtracting €2,000,000 from equity."}, "ans": "A", "en": "Correct because one common source of off-balance-sheet obligation is purchase contracts, which may be structured as take-or-pay contracts. Analysts typically adjust reported financial statement information by constructively capitalizing, where material, purchase obligations. Constructive capitalization means that the analyst estimates the amount of the obligation as the present value of future purchase obligation payments and then adds the amount of the obligation to the company’s reported assets and liabilities. In this case, the analyst should add €8,000,000 to the company’s reported assets and liabilities.", "ko": "Take-or-pay 등 부외 구매의무는 미래 지급액의 PV(8,000,000)만큼 자산과 부채에 동시에 추가. 자본은 변동 없음.", "trap": "명목 미래지급액(10m) 사용, 자본 조정은 함정.", "f": "자산 +PV, 부채 +PV, 자본 불변", "why": {"B": "Incorrect because it increases both assets and liabilities with the future purchase obligation of €10,000,000 while constructive capitalization means that the analyst estimates the amount of the obligation as the present value of future purchase obligation payments being €8,000,000 and then adds the amount of the obligation to the company’s reported assets and liabilities.", "C": "Incorrect because the equity position is not adjusted with €2,000,000 but only assets and liabilities with €8,000,000 since constructive capitalization means that the analyst estimates the amount of the obligation as the present value of future purchase obligation payments being €8,000,000 and then adds the amount of the obligation to the company’s reported assets and liabilities."}, "orig": "ECO Module 5 Q51"}, {"id": "ECO-M5-Q53", "src": "ECO 오답", "module": 5, "tag": "Restructuring charge 정상화", "vig": null, "stem": "An analyst reviews a company's restructuring charge taken in the current period. The analyst determines similar events occur regularly enough that they should be factored into estimates of permanent earnings. The analyst should attempt to 'normalize' earnings by spreading the restructuring charge over:", "opts": {"A": "past periods only.", "B": "the current period only.", "C": "both past periods and the current period."}, "ans": "C", "en": "Correct because when faced with a restructuring charge, an analyst should consider whether similar events occur regularly enough such that they should be factored into estimates of permanent earnings, or whether they should be regarded as one-off items that provide little information about the future earnings of the remaining activities of the company. If it is the former, then the analyst should attempt to 'normalize' earnings by essentially spreading the current restructuring charge(s) over past periods as well as the current period.", "ko": "반복적으로 발생하는 구조조정비용이라면 영구이익 추정 시 현재 비용을 과거 기간과 현재 기간에 걸쳐 분산(normalize).", "trap": "", "f": "", "why": {"A": "Incorrect because the restructuring charge should be spread over past periods as well as the current period.", "B": "Incorrect because the restructuring charge should be spread over past periods as well as the current period."}, "orig": "ECO Module 5 Q53"}, {"id": "ECO-M5-Q55", "src": "ECO 관련유형", "module": 5, "tag": "이익 지속성 – 현금 비중", "vig": null, "stem": "Which of the following statements about mean reversion in earnings is most accurate? Earnings are more sustainable when the:", "opts": {"A": "cash flow component equals the accruals component.", "B": "accruals component dominates the cash flow component.", "C": "cash flow component dominates the accruals component."}, "ans": "C", "en": "Correct because earnings are the sum of cash flows and accruals, and they will be more sustainable and persistent when the cash flow component dominates earnings. If earnings have a significant accruals component, it may hasten the earnings’ reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company’s earnings.", "ko": "이익 = 현금흐름 + 발생액. 현금흐름 비중이 지배적일수록 지속성↑(평균회귀 느림).", "trap": "", "f": "", "why": {"A": "Incorrect because earnings are the sum of cash flows and accruals, and they will be more sustainable and persistent when the cash flow component dominates earnings. If earnings have a significant accruals component, it may hasten the earnings’ reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company’s earnings. Therefore earnings are less sustainable when the accruals component equals the cash flow component, relative to a situation where the cash flow component dominates the accrual component.", "B": "Incorrect because earnings are the sum of cash flows and accruals, and they will be more sustainable and persistent when the cash flow component dominates earnings. If earnings have a significant accruals component, it may hasten the earnings’ reversion to the mean, even more so when the accrual elements are outliers relative to the normal amount of accruals in a company’s earnings. Therefore earnings are less sustainable when the accruals component dominates the cash flow component, not more sustainable."}, "orig": "ECO Module 5 Q55"}, {"id": "SCH-M5-01", "src": "Schweser MQ", "module": 5, "tag": "위험 정보원 – Clean audit report", "vig": null, "stem": "Which statement regarding sources of information about a company's risk is least accurate?", "opts": {"A": "Frequent changes of auditor are an indication of potential risk.", "B": "A clean (unqualified) audit report is a key, timely source of information about potential risk.", "C": "An audit firm with inadequate resources for the complexity of the audit is a warning sign."}, "ans": "B", "en": "A clean audit opinion is unlikely to provide timely risk information and focuses on historical statements, so it is of limited use for identifying risk.", "ko": "Clean opinion은 과거 재무제표 적정성 의견일 뿐 적시성 있는 위험 정보가 아님. 잦은 감사인 교체·감사인 역량 부족은 경고신호.", "trap": "", "f": "", "why": {"A": "맞는 설명입니다 — 잦은 감사인 교체는 경고신호입니다.", "C": "맞는 설명입니다 — 감사인 역량 부족은 경고신호입니다."}, "orig": "Schweser MQ 11 변형"}, {"id": "SCH-M5-02", "src": "Schweser MQ", "module": 5, "tag": "부외금융 – Completeness", "vig": null, "stem": "The presence of significant off-balance-sheet financing most likely indicates a:", "opts": {"A": "lack of completeness, reducing financial reporting quality.", "B": "decrease in leverage, reducing financial results quality.", "C": "lack of clear presentation, reducing financial reporting quality."}, "ans": "A", "en": "Off-balance-sheet obligations indicate a lack of completeness of the balance sheet (and understated leverage). Completeness, unbiased measurement, and clear presentation characterize high-quality balance sheet reporting.", "ko": "B/S 보고 품질 3요소: completeness(부외부채 누락 여부), unbiased measurement(측정 편향), clear presentation(표시·집계). 부외금융 = completeness 결여 + 레버리지 과소표시.", "trap": "", "f": "부외 → Completeness / Level 3·진부화 재고 → Unbiased measurement", "why": {"B": "부외금융은 레버리지를 실제보다 '낮게' 보이게 할 뿐 실제 레버리지가 줄어든 것이 아닙니다.", "C": "표시·집계 문제가 아니라 항목 누락(completeness) 문제입니다."}, "orig": "Schweser MQ 11 변형"}, {"id": "SCH-M5-03", "src": "변형", "module": 5, "tag": "Mean reversion – 발생액 이익", "vig": null, "stem": "Relative to earnings composed mainly of cash flows, earnings with a large accruals component most likely:", "opts": {"A": "revert to the mean more slowly.", "B": "revert to the mean more quickly.", "C": "show the same speed of mean reversion."}, "ans": "B", "en": "Accruals-based earnings are less persistent than cash-based earnings and revert to the mean more quickly—faster still when the accruals are discretionary or outliers.", "ko": "발생액 비중↑ → 지속성↓ → 평균회귀 빠름(재량적·이상치 발생액이면 더 빠름).", "trap": "", "f": "", "why": {"A": "발생액 이익은 지속성이 낮아 '더 빨리' 평균회귀합니다.", "C": "구성(현금 vs 발생액)에 따라 평균회귀 속도가 다릅니다."}, "orig": "Schweser R11 개념 변형"}, {"id": "SCH-M5-04", "src": "Schweser MQ", "module": 5, "tag": "AR(1) 지속성 계수", "vig": null, "stem": "An analyst runs the regression Earnings(t+1) = α + β1 × Earnings(t) + ε for several firms. A firm whose earnings have a higher proportion of cash-based (rather than accruals-based) earnings will most likely have a β1 that is:", "opts": {"A": "lower.", "B": "higher.", "C": "unrelated to the earnings composition."}, "ans": "B", "en": "Cash-based earnings are more persistent, so a higher cash proportion leads to a higher β1 (persistence) coefficient, consistent with higher earnings quality.", "ko": "현금 비중↑ → 지속성↑ → β1↑ = 이익의 질↑.", "trap": "", "f": "", "why": {"A": "현금 비중이 높을수록 지속성이 높아 β1이 '커집니다'.", "C": "구성과 β1은 관련 있습니다(현금↑ → β1↑)."}, "orig": "Schweser MQ 11 변형"}, {"id": "SCH-M5-05", "src": "변형", "module": 5, "tag": "Valuation allowance 과대 (변형)", "vig": null, "stem": "A company that overstates the valuation allowance for its deferred tax assets most likely:", "opts": {"A": "understates tax expense and overstates deferred tax assets.", "B": "overstates tax expense and understates deferred tax assets.", "C": "overstates both tax expense and deferred tax assets."}, "ans": "B", "en": "An overstated valuation allowance reduces the carrying amount of DTAs (understated) and increases income tax expense (overstated), lowering current earnings—potentially creating a reserve for later reversal.", "ko": "평가충당금 과대 → DTA 장부가↓, 법인세비용↑(이익 과소, 'cookie jar'). 과소 계상(ECO)은 정확히 반대.", "trap": "ECO 정답(과소 → 비용 과소·DTA 과대)과 방향을 뒤집어 생각하기.", "f": "", "why": {"A": "평가충당금 '과소'일 때의 결과입니다.", "C": "충당금은 DTA를 줄이므로 과대 계상 시 DTA는 '과소'입니다."}, "orig": "ECO 변형"}, {"id": "SCH-M5-06", "src": "변형", "module": 5, "tag": "무형자산 과대배분 (변형)", "vig": null, "stem": "In recording an acquisition, a company overstated the value of amortizable intangible assets and correspondingly understated goodwill. No impairment has occurred. After the acquisition, the company's reported earnings are most likely:", "opts": {"A": "understated.", "B": "fairly stated.", "C": "overstated."}, "ans": "A", "en": "Overstated amortizable intangibles produce excessive amortization expense, while goodwill (not amortized) is understated, so earnings are understated.", "ko": "상각대상 무형자산 과대 → 상각비 과대 → 이익 과소. Goodwill은 상각하지 않으므로 과소배분돼도 이익에 영향 없음.", "trap": "ECO Stellar(과소 → 이익 과대)의 반대 케이스.", "f": "", "why": {"B": "무형자산 과대 → 상각비 과대이므로 이익이 공정하지 않습니다.", "C": "이익 과대는 무형자산 '과소'(goodwill 과대) 케이스입니다."}, "orig": "ECO 변형"}, {"id": "SCH-M5-07", "src": "변형", "module": 5, "tag": "Constructive capitalization – D/E (변형)", "vig": null, "stem": "An analyst constructively capitalizes a take-or-pay purchase obligation whose present value is €5 million. Compared with reported figures, the company's debt-to-equity ratio will most likely:", "opts": {"A": "decrease.", "B": "remain unchanged.", "C": "increase."}, "ans": "C", "en": "Constructive capitalization adds the PV (€5m) to both assets and liabilities with no change to equity, so debt-to-equity increases.", "ko": "자산 +5m, 부채 +5m, 자본 불변 → 부채/자본↑. 부외의무를 반영하면 레버리지가 높아집니다.", "trap": "", "f": "", "why": {"A": "부채가 늘고 자본은 그대로이므로 D/E는 '증가'합니다.", "B": "부채(+5m)가 증가하므로 D/E가 변합니다."}, "orig": "ECO 변형"}, {"id": "ECO-M6-Q2", "src": "ECO 오답", "module": 6, "tag": "DuPont – 레버리지 효과", "vig": 35, "stem": "Based on the DuPont analysis, Abay’s belief regarding ROE is most likely based on:", "opts": {"A": "leverage.", "B": "profit margins.", "C": "asset turnover."}, "ans": "A", "en": "A is correct. The DuPont analysis shows that profit margins and asset turnover have both increased over the last three years, but leverage has declined. The reduction in leverage offsets a portion of the improvement in profitability and turnover. Thus, ROE would have been higher if leverage had not decreased.", "ko": "NPM·자산회전율은 상승했지만 레버리지(3.43 → 3.09)는 하락. 운영 변화 없이 ROE를 높이려면 레버리지를 다시 높이면 됨.", "trap": "운영 지표(마진·회전율)는 '운영 변화'가 필요합니다.", "f": "ROE = NPM × Asset turnover × Assets/Equity", "why": {"B": "마진은 이미 개선되었고, 더 높이려면 운영 변화가 필요합니다.", "C": "자산회전율도 이미 개선되었고, 운영 변화가 필요합니다."}, "orig": "ECO Module 6 Q2"}, {"id": "ECO-M6-Q4", "src": "ECO 오답", "module": 6, "tag": "Cash-flow-based accruals ratio", "vig": 35, "stem": "Bickchip’s cash-flow-based accruals ratio in 2020 is closest to:", "opts": {"A": "9.9%.", "B": "13.4%.", "C": "23.3%."}, "ans": "A", "en": "A is correct. The cash-flow-based accruals ratio = [NI − (CFO + CFI)]/(Average NOA) = [4,038 − (9,822 − 10,068)]/43,192 = 9.9%.", "ko": "[NI − (CFO + CFI)] / 평균 NOA = [4,038 − (9,822 − 10,068)] / 43,192 = 9.9%. CFF는 포함하지 않습니다.", "trap": "CFO만 빼거나 CFF를 포함하는 실수.", "f": "CF accruals ratio = [NI − (CFO + CFI)] / Avg NOA", "why": {"B": "분자 구성을 잘못 조합한 값입니다. 분자는 NI − (CFO + CFI) = 4,038 − (−246) = 4,284입니다.", "C": "23.3%는 CFF(−5,792)까지 포함한 값입니다. CF accruals ratio에는 CFO와 CFI만 씁니다."}, "orig": "ECO Module 6 Q4"}, {"id": "ECO-M6-Q7", "src": "ECO 오답", "module": 6, "tag": "OCF(이자·세금 전)/영업이익", "vig": 35, "stem": "Based on the ratios for operating cash flow before interest and taxes to operating income, Abay should conclude that:", "opts": {"A": "Bickchip’s earnings are backed by cash flow.", "B": "Bickchip’s earnings are not backed by cash flow.", "C": "Abay can draw no conclusion due to the changes in the ratios over time."}, "ans": "A", "en": "A is correct. Operating cash flow before interest and taxes to operating income rises steadily (not erratically) from 1.2 to 1.3 to 1.9. The ratios over 1.0 and the trend indicate that earnings are supported by cash flow.", "ko": "비율이 1.2 → 1.3 → 1.9로 꾸준히 상승하고 1 초과 → 이익이 현금흐름으로 뒷받침됨.", "trap": "비율 '변화' 자체를 결론 불가로 보는 함정 — 방향이 일관되면 결론 가능.", "f": "(CFO + 이자지급 + 세금지급) / EBIT", "why": {"B": "비율이 1을 넘고 꾸준히 상승 → 현금흐름이 이익을 뒷받침합니다.", "C": "추세가 일관되게 상승(1.2 → 1.3 → 1.9)하므로 결론을 내릴 수 있습니다."}, "orig": "ECO Module 6 Q7"}, {"id": "ECO-M6-Q8", "src": "ECO 오답", "module": 6, "tag": "DuPont – 레버리지 계산", "vig": 36, "stem": "Based on the 3 years of data provided for DuPont analysis, Eastview's financial leverage has been:", "opts": {"A": "trending lower.", "B": "stable.", "C": "trending higher."}, "ans": "B", "en": "Correct because financial leverage can be determined from the information provided as follows:\nFormula\tMost recent year\tPrevious year\tTwo years ago\nTotal assets\tRevenues/Total asset turnover\t750/1.30 = 576.92\t680/1.25 = 544\t600/1.2 = 500\nTotal shareholders' equity\tTotal assets – Total liabilities\t576.92 – 230 = 346.92\t544 – 220 = 324\t500 – 200 = 300\nFinancial leverage\tTotal assets/Total shareholders' equity\t576.92/346.92 = 1.663\t544/324=1.679\t500/300 = 1.667\nAccordingly, the 3-year trend in financial leverage has been stable at 1.7.", "ko": "총자산 = 매출/자산회전율, 자본 = 자산 − 부채, 레버리지 = 자산/자본: 1.667 → 1.679 → 1.663 → 안정적(≈1.7).", "trap": "부채 금액 증가만 보고 '상승'으로 판단.", "f": "", "why": {"A": "Incorrect because the 3-year trend has been stable.", "C": "Incorrect because the 3-year trend has been stable."}, "orig": "ECO Module 6 Q8"}, {"id": "ECO-M6-Q13", "src": "ECO 오답", "module": 6, "tag": "관계기업 이익 제거", "vig": 37, "stem": "After Winslow's adjustment, DB's net income (in EUR millions) under management's direct control is:", "opts": {"A": "793.", "B": "879.", "C": "984."}, "ans": "B", "en": "Correct because it excludes the income from investments in associates which is not under DB's direct control (in EUR millions):\nNet income\t1,070\nLess: Income from investments in associates\t (191)\n879\nIncluding the net investments and returns of associates with the full reported value of Nestlé’s own assets and income would introduce noise into the analytical signals. The returns earned by associates are not under the direct control of Nestlé’s management.", "ko": "경영진 직접 통제 NI = 총 NI 1,070 − 관계기업 이익 191 = 879. NCI 몫은 연결 실체(통제 하) 이익이므로 빼지 않습니다.", "trap": "지배주주 귀속 NI(984)에서 출발하는 실수(793).", "f": "", "why": {"A": "Incorrect because it correctly excludes income from investments in associates but incorrectly excludes net income attributable to non-controlling interests.\nNet income attributable to shareholders \t984\nLess: Income from investments in associates\t(191)\n793\nIncluding the net investments and returns of associates with the full reported value of Nestlé’s own assets and income would introduce noise into the analytical signals. The returns earned by associates are not under the direct control of Nestlé’s management.", "C": "Incorrect because this answer is net income attributable to shareholders which incorrectly includes income from investments in associates but incorrectly excludes net income attributable to non-controlling interests:\nNet income\t1,070\nLess: Net income attributable to non-controlling interests\t   (86)\nNet income attributable to shareholders\t984\nIncluding the net investments and returns of associates with the full reported value of Nestlé’s own assets and income would introduce noise into the analytical signals. The returns earned by associates are not under the direct control of Nestlé’s management."}, "orig": "ECO Module 6 Q13"}, {"id": "ECO-M6-Q17", "src": "ECO 오답", "module": 6, "tag": "부문 마진 유지 시 전체 마진", "vig": 38, "stem": "If the children’s products division had been able to maintain its prior year operating margin in the current year, the company’s overall operating margin in current year, compared to the prior year, would have been:", "opts": {"A": "lower.", "B": "the same.", "C": "higher."}, "ans": "A", "en": "Correct. Apply the prior year operating margin for the children’s products division to the current year revenues for the division to determine what the current year overall operating profit margin would have been if the margin had been maintained, and then compare it with the prior year overall operating profit margin.\nOperating margin in children’s products in prior year = Operating profit/revenues\t115.7/1,236.2\t9.4%\nApply the 9.4% margin to current year revenues for division\t0.094 × 1,176.2\t110.6\nIncrease in current year operating profit for division, had the margin been maintained\t110.6 – 64.7\t45.9\nRevised current year company operating profit with increase in children’s products operating profit\t172.7 + 45.9\t218.6\nRevised current year company operating margin\t218.6/2,837.1\t7.7%\nPrior year company operating margin\t219.4/2,775.5\t7.9%\nEven if the children’s products division had maintained its operating margin in the current year, the overall company operating margin would still have decreased slightly (7.7% versus 7.9%).", "ko": "아동 부문 전년 마진 9.4% × 당해 매출 1,176.2 = 110.6 → 증분 45.9 → 전사 영업이익 218.6/2,837.1 = 7.7% < 전년 7.9% → 여전히 lower.", "trap": "110.6 전체를 더하는 실수(증분만 더해야 함).", "f": "", "why": {"B": "Incorrect. It is not the same.", "C": "Incorrect: If they incorrectly add the full 110.6 to the operating profit (and not just the incremental change) then it would be higher: (172.7 + 110.6)/2,837.1 = 10%."}, "orig": "ECO Module 6 Q17"}, {"id": "ECO-M6-Q20", "src": "ECO 오답", "module": 6, "tag": "Core 이익 조정", "vig": null, "stem": "An analyst gathers the following information about a company (in € millions):\nOne-off income from associates and joint ventures\t10\nOne-off revaluation loss\t4\nRecurring yearly provisions for restructuring activities\t3\nProfit before tax\t30\nThe adjusted profit before tax that best reflects the company's core performance (in € millions) is:", "opts": {"A": "20.", "B": "24.", "C": "27."}, "ans": "B", "en": "Correct because the analyst is interested in the ongoing operations of the company unaffected by non-repeating types of gains or losses (such as One-off income from associates and joint ventures and One-off revaluation loss).\nAccordingly, the Adjusted profit before tax of core operations = Profit before tax – One-off income from associates and joint ventures + One-off revaluation loss = 30 – 10 + 4 = 24.\nRecurring yearly provisions for restructuring activities are already reflected in Profit before tax and no adjustment is needed. Provisions involve decisions by management, they recur regularly, and they affect the returns to shareholders. In assessing the company’s prospects, these charges are important variables that should not to be ignored.", "ko": "일회성 항목만 제거: 30 − 일회성 관계기업 이익 10 + 일회성 재평가손실 4 = 24. 매년 반복되는 구조조정 충당금은 핵심 성과에 포함(조정 X).", "trap": "반복 항목까지 더하는 실수(27).", "f": "", "why": {"A": "Incorrect because net profit is adjusted for one-off gains only as follows: Adjusted profit before tax of core operations = Profit before tax – One-off income from associates and joint ventures = 30 – 10 = 20.", "C": "Incorrect because net profit is adjusted for one-offs and recurring items, as follows: Adjusted profit before tax of core operations = Profit before tax – One-off income from associates and joint ventures + One-off revaluation loss + Recurring yearly provisions for restructuring activities= 30 – 10 + 4 + 3 = 27."}, "orig": "ECO Module 6 Q20"}, {"id": "ECO-M6-Q22", "src": "ECO 오답", "module": 6, "tag": "Accruals ratio – 절댓값", "vig": null, "stem": "An analyst gathers the following information about a company:\nMost\nRecent Year\nPrior Year\nBalance sheet accruals ratio\t9.8%\t1.3%\nCash flow accruals ratio\t–1.4%\t–6.7%\nWhich of the company's accruals ratios have improved?", "opts": {"A": "Cash flow accruals ratio only", "B": "Balance sheet accruals ratio only", "C": "Both the cash flow accruals ratio and the balance sheet accruals ratio"}, "ans": "A", "en": "Correct because when examining accruals ratios, it would be a concern if the absolute levels of the accruals ratio were high and if they were consistently trending higher. The cash flow accruals ratio improved from –6.7% to –1.4% with a lower absolute value, while the balance sheet accruals ratio deteriorated from 1.3% to 9.8% with a higher absolute value.", "ko": "절댓값으로 판단: CF accruals |−6.7%| → |−1.4%| 개선, B/S accruals 1.3% → 9.8% 악화.", "trap": "부호(−)를 보고 '음수는 나쁘다'고 판단하는 함정.", "f": "|Accruals ratio|↓ → Earnings quality↑", "why": {"B": "Incorrect because the cash flow accruals ratio improved from –6.7% to –1.4% with a lower absolute value, while the balance sheet accruals ratio deteriorated from 1.3% to 9.8% with a higher absolute value.", "C": "Incorrect because the cash flow accruals ratio improved from –6.7% to –1.4% with a lower absolute value, while the balance sheet accruals ratio deteriorated from 1.3% to 9.8% with a higher absolute value."}, "orig": "ECO Module 6 Q22"}, {"id": "ECO-M6-Q23", "src": "ECO 관련유형", "module": 6, "tag": "Accruals ratio 개선 – 절댓값", "vig": null, "stem": "An analyst gathers the following information about a company's financial reporting quality:\nCurrent Year\tPrior Year\nCash-flow-based accruals ratio\t–1%\t–3%\nBalance-sheet-based accruals ratio\t1%\t3%\nWhich of the above ratios shows an improvement?", "opts": {"A": "Cash-flow-based accruals ratio only", "B": "Balance-sheet-based accruals ratio only", "C": "Both cash-flow-based accruals and balance-sheet-based accruals ratios"}, "ans": "C", "en": "Correct because both balance-sheet-based and cash-flow-based accruals are insignificant and they are improving in absolute levels from 3% in the prior year to 1% in the current year. The cash-flow-based accruals are negative and increasing but it is their absolute level that is relevant in this case. It would be a concern if the absolute levels of the accruals ratio were high; even more worrisome would have been if they were consistently trending higher which is not the case here.", "ko": "CF accruals −3% → −1%, B/S accruals 3% → 1% — 둘 다 절댓값 감소 → 모두 개선.", "trap": "음수가 커지는 것(−3 → −1)을 악화로 보는 함정.", "f": "", "why": {"A": "Incorrect because both balance-sheet-based and cash-flow-based accruals are at insignificant and improving in absolute levels from 3% in the prior year to 1% in the current year. The cash-flow-based accruals are negative and increasing but it is their absolute level that is relevant in this case.", "B": "Incorrect because both balance-sheet-based and cash-flow-based accruals are minor and improving in absolute levels from 3% in the prior year to 1% in the current year. The cash-flow-based accruals are negative and increasing but it is their absolute level that is relevant in this case."}, "orig": "ECO Module 6 Q23"}, {"id": "ECO-M6-Q24", "src": "ECO 오답", "module": 6, "tag": "재작성(restatement) 요구 상황", "vig": null, "stem": "Which of the following situations most likely requires a company to restate its prior year financial statements?", "opts": {"A": "The cash-flow-based accruals ratio is exceptionally high", "B": "A significant amount of income is sourced from investments in associates", "C": "Changed accounting standards alter the calculation of benefit plan obligations"}, "ans": "C", "en": "Correct because a company is required to restate its prior year financial statements for changed accounting standards that alter the calculation of benefit obligations. The analyst identifies the beginning of year adjustments and revises the end of last year year-end balances accordingly. Therefore, when there is an accounting standards change, prior year financial statements have to be restated by the company to improve comparability across years, and the analyst should take this into account.", "ko": "회계기준 변경으로 퇴직급여 부채 계산이 바뀌면 전기 재무제표 재작성 필요. Accruals ratio가 높거나 관계기업 이익이 큰 것은 분석상 조정 대상일 뿐 재작성 사유 아님.", "trap": "", "f": "", "why": {"A": "Incorrect because the balance-sheet-based and cash-flow-based accruals ratios are measures of financial reporting quality. If the ratio is high in certain years, the analyst may want to examine the quality of the company's cash flow and its relationship to net income. Therefore, if the ratio is exceptionally different from prior years, the analyst would need to investigate further but the company need not restate the financial statements in prior years.", "B": "Incorrect because the income from associates is a pure net income figure, presented after taxes and with no related revenue in the income statement. To avoid making incorrect inferences about the profitability of the company's operations, the analyst wants to remove the effects of the investments in associates from the balance sheet and income statement. Therefore, if the company possess a significant amount of income from associates, the analyst may need to split out the amount in the current year, but the company need not restate the financial statements in prior years."}, "orig": "ECO Module 6 Q24"}, {"id": "ECO-M6-Q27", "src": "ECO 오답", "module": 6, "tag": "분석 프레임워크 단계별 산출물", "vig": null, "stem": "A financial analyst is preparing an investment recommendation report on a public company. To prepare the report, she analyzes the company’s financial statements following a framework comprising the following phases: (1) Define purpose of analysis, (2) Collect input data, (3) Process input data, (4) Analyze/Interpret data, (5) Develop and communicate recommendations, (6) Follow-up. Which of the following is most likely an output of phase 3?", "opts": {"A": "Financial data tables", "B": "List of questions to answer", "C": "Adjusted financial statements"}, "ans": "C", "en": "Correct because adjusted financial statements is the result of processing financial data. After collecting the financial data (phase 2), the analyst processes the data (phase (3), making the adjustments necessary to leave the data ready for analysis.", "ko": "① 목적 정의 → 질문 목록, ② 자료 수집 → 재무 데이터 표, ③ 자료 처리 → 조정된 재무제표·common-size, ④ 분석/해석, ⑤ 권고, ⑥ 후속관리.", "trap": "수집(데이터 표)과 처리(조정 재무제표) 혼동.", "f": "", "why": {"A": "Incorrect because financial data tables is an output of phase 2, Collect input data.", "B": "Incorrect because a list of questions to answer is an output of phase 1, Define purpose of analysis."}, "orig": "ECO Module 6 Q27"}, {"id": "ECO-M6-Q28", "src": "ECO 오답", "module": 6, "tag": "일회성 비용 제거 ROE", "vig": null, "stem": "A one-time restructuring charge for a pretax amount of €120 million is included in a company's financial statements. An analyst considers this restructuring charge to be unusual. She compiles the following information (in € millions) for the most recent year in order to exclude the one-time charge from an ROE calculation:\nShareholders’ equity at beginning of the year\t2,500.0\nShareholders’ equity at end of the year\t2,646.0\nAverage shareholders’ equity\t2,573.0\nNet income\t257.3\nIf the income tax rate is 25%, adjusted ROE would be closest to:", "opts": {"A": "6.6%.", "B": "13.3%.", "C": "14.3%."}, "ans": "B", "en": "Correct because net income (numerator of ROE) and average shareholders’ equity (denominator of ROE) should be adjusted as follows:\nInitial figures\nCharge Adjust.\nTax\nAdjust.\nAdjusted\nfigures\nShareholders’ equity at beginning of the year (€ millions) (A)\n2,500.0\n-\n-\n2,500.0\nShareholders’ equity at end of the year (€ millions) (B)\n2,646.0\n+120.0\n-30.0\n2,736.0\nAverage Shareholders’ equity (€ millions) (C)=[(A)+(B)]/2\n2,573.0\n2,618.0\nNet income (€ millions) (D)\n257.3\n+120.0\n-30.0\n347.3\nROE (E)=(D)/(C)\n10%\n13.3%", "ko": "세후 조정액 = 120 × (1 − 25%) = 90 → NI 347.3. 기말 자본도 +90 → 2,736 → 평균 2,618 → ROE 13.3%.", "trap": "세금효과 누락(14.3%), 부호 반대(6.6%).", "f": "Adj. NI = NI + Charge × (1 − t), 평균자본도 같이 조정", "why": {"A": "Incorrect because the adjustment is made with the wrong sign as follows:\nInitial figures\nCharge Adjust.\nTax\nAdjust.\nAdjusted\nfigures\nShareholders’ equity at beginning of the year (€ millions) (A)\n2,500.0\n-\n-\n2,500.0\nShareholders’ equity at end of the year (€ millions) (B)\n2,646.0\n-120.0\n+30.0\n2,556.0\nAverage Shareholders’ equity (€ millions) (C)=[(A)+(B)]/2\n2,573.0\n2,528.0\nNet income (€ millions) (D)\n257.3\n-120.0\n+30.0\n167.3\nROE (E)=(D)/(C)\n10%\n6.6%", "C": "Incorrect because the calculation omits the tax effects as follows:\nInitial figures\nCharge Adjust.\nTax\nAdjust.\nAdjusted\nfigures\nShareholders’ equity at beginning of the year (€ millions) (A)\n2,500.0\n-\n-\n2,500.0\nShareholders’ equity at end of the year (€ millions) (B)\n2,646.0\n+120.0\n0\n2,766.0\nAverage Shareholders’ equity (€ millions) (C)=[(A)+(B)]/2\n2,573.0\n2,633.0\nNet income (€ millions) (D)\n257.3\n+120.0\n0\n377.3\nROE (E)=(D)/(C)\n10%\n14.3%"}, "orig": "ECO Module 6 Q28"}, {"id": "SCH-M6-01", "src": "Schweser MQ", "module": 6, "tag": "분석 프레임워크 – Processing 산출물", "vig": null, "stem": "When applying the financial analysis framework, which of the following is the best example of an output of the 'process data' phase?", "opts": {"A": "A list of questions to be answered by management", "B": "Audited financial statements", "C": "Common-size financial statements"}, "ans": "C", "en": "Common-size statements (and adjusted statements, ratios) are created in the data-processing phase. Questions are an output of defining the purpose; audited statements are an input collected in phase 2.", "ko": "처리 단계 산출물 = common-size·조정 재무제표·비율. 질문 목록 = 목적 정의, 감사받은 재무제표 = 수집 단계 입력.", "trap": "", "f": "", "why": {"A": "질문 목록은 ① 목적 정의 단계의 산출물입니다.", "B": "감사받은 재무제표는 ② 수집 단계에서 모으는 입력값입니다."}, "orig": "Schweser MQ 12.1 변형"}, {"id": "SCH-M6-02", "src": "Schweser MQ", "module": 6, "tag": "분석 프레임워크 – Collect 단계", "vig": null, "stem": "Communicating with a company's suppliers, customers, and competitors is an input that occurs while:", "opts": {"A": "establishing the objective of the analysis.", "B": "processing data.", "C": "collecting data."}, "ans": "C", "en": "Communication with management, suppliers, customers, and competitors is part of the data-collection phase.", "ko": "경영진·공급자·고객·경쟁사와의 소통 = 자료 수집(collect) 단계 입력.", "trap": "", "f": "", "why": {"A": "목적 설정 단계에서는 분석 목적·질문·일정·자원을 정합니다.", "B": "처리 단계는 수집한 데이터를 조정·common-size화합니다."}, "orig": "Schweser MQ 12.1 변형"}, {"id": "SCH-M6-03", "src": "Schweser MQ", "module": 6, "tag": "Extended DuPont 계산", "vig": null, "stem": "A company reports an EBIT margin of 10%, total asset turnover of 1.5, a financial leverage ratio of 2.0, and an interest burden of 80%. With a 25% tax rate, ROE is closest to:", "opts": {"A": "9%.", "B": "18%.", "C": "24%."}, "ans": "B", "en": "ROE = tax burden × interest burden × EBIT margin × asset turnover × leverage = 0.75 × 0.80 × 0.10 × 1.5 × 2.0 = 18%.", "ko": "ROE = (1 − t) × 이자부담 × EBIT마진 × 자산회전율 × 레버리지 = 0.75 × 0.8 × 0.10 × 1.5 × 2.0 = 0.18.", "trap": "세금부담(0.75) 누락 시 24%.", "f": "ROE = NI/EBT × EBT/EBIT × EBIT/Sales × Sales/Assets × Assets/Equity", "why": {"A": "9%는 레버리지(2.0)를 빠뜨린 값(0.75 × 0.8 × 0.10 × 1.5)입니다.", "C": "24%는 세금부담(0.75)을 빠뜨린 값입니다."}, "orig": "Schweser MQ 12.2 변형"}, {"id": "SCH-M6-04", "src": "Schweser MQ", "module": 6, "tag": "자원 과다배분 부문", "vig": null, "stem": "A company has two segments. Segment X: EBIT margin 6%, 60% of total capex, 35% of total assets. Segment Y: EBIT margin 14%, 40% of total capex, 65% of total assets. The company is most likely over-allocating resources to:", "opts": {"A": "Segment X only.", "B": "Segment Y only.", "C": "both segments."}, "ans": "A", "en": "Segment X has the lowest margin yet a capex-share-to-asset-share ratio above 1 (60%/35% = 1.71). Segment Y has the highest margin and a ratio below 1 (40%/65% = 0.62).", "ko": "Capex 비중/자산 비중 > 1 = 해당 부문에 성장 투자 중. X는 마진이 낮은데 1.71 → 과다배분. Y는 마진이 높은데 0.62 → 과소배분.", "trap": "", "f": "Capex 비중 ÷ 자산 비중 > 1 → 확장 중", "why": {"B": "Y는 마진이 가장 높은데 capex/자산 비중 비율이 0.62로 오히려 과소배분입니다.", "C": "Y는 과다배분이 아닙니다."}, "orig": "Schweser MQ 12.2 변형"}, {"id": "SCH-M6-05", "src": "Schweser MQ", "module": 6, "tag": "Cash-flow accruals ratio 계산", "vig": null, "stem": "A company reports net income of 15,000, cash flow from operations of 40,000, cash flow from investing of −35,000, and average net operating assets of 200,000. Its cash-flow-based accruals ratio is closest to:", "opts": {"A": "5.0%.", "B": "7.5%.", "C": "25.0%."}, "ans": "A", "en": "Cash-flow accruals ratio = [NI − (CFO + CFI)] / average NOA = [15,000 − (40,000 − 35,000)] / 200,000 = 5.0%.", "ko": "[15,000 − (40,000 + (−35,000))] / 200,000 = 10,000/200,000 = 5%. CFI의 부호(−)를 그대로 더하는 것에 주의.", "trap": "NI/NOA(7.5%), CFO 누락(25%) 함정.", "f": "CF accruals ratio = [NI − (CFO + CFI)] / Avg NOA", "why": {"B": "7.5%는 NI/NOA — 현금흐름을 차감하지 않았습니다.", "C": "25%는 CFO를 빼지 않은 값((15,000 + 35,000)/200,000)입니다."}, "orig": "Schweser MQ 12.5 변형"}], "vignettes": ["Burton Howard, CFA, is an equity analyst with Maplewood Securities. Howard is preparing a research report on Confabulated Materials, SA, a publicly traded company based in France that complies with IFRS 9. As part of his analysis, Howard has assembled data gathered from the financial statement footnotes of Confabulated’s 2018 Annual Report and from discussions with company management. Howard is concerned about the effect of this information on Confabulated’s future earnings.\n\nInformation about Confabulated’s investment portfolio for the years ended 31 December 2017 and 2018 is presented in Exhibit 1. As part of his research, Howard is considering the possible effect on reported income of Confabulated’s accounting classification for fixed income investments.\n\nExhibit 1\nConfabulated’s Investment Portfolio (€ Thousands)\nCharacteristic\tBugle AG\tCathay Corp\tDumas SA\nClassification\tFVPL\tFVOCI\tAmortized cost\nCost*\t€25,000\t€40,000\t€50,000\nMarket value, 31 December 2017\t29,000\t38,000\t54,000\nMarket value, 31 December 2018\t28,000\t37,000\t55,000\n* All securities were acquired at par value.\n\nIn addition, Confabulated’s annual report discusses a transaction under which receivables were securitized through a special purpose entity (SPE) for Confabulated’s benefit.", "BetterCare Hospitals, Inc. operates a chain of hospitals throughout the United States. The company has been expanding by acquiring local hospitals. Its largest acquisition, that of Statewide Medical, was made in 2001 under the pooling of interests method. BetterCare complies with US GAAP.\n\nBetterCare is currently forming a 50/50 joint venture with Supreme Healthcare under which the companies will share control of several hospitals. BetterCare plans to use the equity method to account for the joint venture. Supreme Healthcare complies with IFRS and will use the proportionate consolidation method to account for the joint venture.\n\nErik Ohalin is an equity analyst who covers both companies. He has estimated the joint venture’s financial information for 2018 in order to prepare his estimates of each company’s earnings and financial performance. This information is presented in Exhibit 1.\n\nExhibit 1\nSelected Financial Statement Forecasts for Joint Venture ($ Millions)\nYear ending 31 December\t2018\nRevenue\t1,430\nOperating income\t128\nNet income\t62\n31 December\t2018\nTotal assets\t1,500\nShareholders’ equity\t740\nSupreme Healthcare recently announced it had formed a special purpose entity through which it plans to sell up to $100 million of its accounts receivable. Supreme Healthcare has no voting interest in the SPE, but it is expected to absorb any losses that it may incur. Ohalin wants to estimate the impact this will have on Supreme Healthcare’s consolidated financial statements.", "John Thronen is an analyst in the research department of an international securities firm. Thronen is preparing a research report on Topmaker, Inc., a publicly-traded company that complies with IFRS. Thronen reviews two of Topmaker’s recent transactions relating to investments in Blanco Co. and Rainer Co.\n\nInvestment in Blanca Co.\n\nOn 1 January 2016, Topmaker invested $11 million in Blanca Co. debt securities (with a 5.0% stated coupon rate on par value, payable each 31 December). The par value of the securities is $10 million, and the market interest rate in effect when the bonds were purchased was 4.0%. Topmaker designates the investment as held-to-maturity. On 31 December 2016, the fair value of the securities was $12 million.\n\nBlanca Co. plans to raise $40 million in capital by borrowing against its financial receivables. Blanca plans to create a special purpose entity (SPE), invest $10 million in the SPE, have the SPE borrow $40 million, and then use the total funds to purchase $50 million of receivables from Blanca. Blanca meets the definition of control and plans to consolidate the SPE. Blanca’s current balance sheet is presented in Exhibit 1.\n\nExhibit 1\nBlanca Co. Balance Sheet at 31 December 2016 ($ millions)\nCash\t20\t \tCurrent liabilities\t25\nAccounts receivable\t50\t \tNoncurrent liabilities\t30\nOther assets\t30\t \tShareholders’ equity\t45\nTotal assets\t100\t \tTotal liabilities and equity\t100\nInvestment in Rainer Co.\n\nOn 1 January 2016, Topmaker acquired a 15% equity interest with voting power in Rainer Co. for $300 million. Exhibit 2 presents selected financial information for Rainer on the acquisition date. Thronen notes that the plant and equipment are depreciated on a straight-line basis and have 10 years of remaining life. Topmaker has representation on Rainer’s board of directors and participates in the associate’s policy-making process.\n\nExhibit 2\nSelected Financial Data for Rainer Co., 1 January 2016 (Acquisition Date) ($ millions)\n \tBook Value\tFair Value\nCurrent assets\t270\t270\nPlant and equipment\t2,900\t3,160\nTotal assets\t3,170\t3,430\nLiabilities\t1,830\t1,830\nNet assets\t1,340\t1,600\nThronen notes that, for fiscal year 2016, Rainer reported total revenue of $1,740 million and net income of $360 million, and paid dividends of $220 million.\n\nThronen is concerned about possible goodwill impairment for Topmaker due to expected changes in the industry effective at the end of 2017. He calculates the impairment loss based on selected data from the projected consolidated balance sheet data presented in Exhibit 3, assuming that the cash-generating unit and reporting unit of Topmaker are the same.\n\nExhibit 3\nSelected Financial Data for Topmaker, Inc., Estimated Year Ending 31 December 2017 ($ millions)\nCarrying value of cash-generating unit/reporting unit\t15,200\nRecoverable amount of cash-generating unit/reporting unit\t14,900\nFair value of reporting unit\t14,800\nIdentifiable net assets\t14,400\nGoodwill\t520\nFinally, Topmaker announces its plan to increase its ownership interest in Rainer to 80% effective 1 January 2018 and will account for the investment in Rainer using the partial goodwill method. Thronen estimates that the fair market value of the Rainer’s shares on the expected date of exchange is $2 billion with the identifiable assets valued at $1.5 billion.", "Percy Byron, CFA, is an equity analyst with a UK-based investment firm. One firm Byron follows is NinMount PLC, a UK-based company. On 31 December 2018, NinMount paid £320 million to purchase a 50 percent stake in Boswell Company. The excess of the purchase price over the fair value of Boswell’s net assets was attributable to previously unrecorded licenses. These licenses were estimated to have an economic life of six years. The fair value of Boswell’s assets and liabilities other than licenses was equal to their recorded book values. NinMount and Boswell both use the pound sterling as their reporting currency and prepare their financial statements in accordance with IFRS.\n\nByron is concerned whether the investment should affect his “buy” rating on NinMount common stock. He knows NinMount could choose one of several accounting methods to report the results of its investment, but NinMount has not announced which method it will use. Byron forecasts that both companies’ 2019 financial results (excluding any merger accounting adjustments) will be identical to those of 2018.\n\nNinMount’s and Boswell’s condensed income statements for the year ended 31 December 2018, and condensed balance sheets at 31 December 2018, are presented in Exhibits 1 and 2, respectively.\n\nExhibit 1\nNinMount PLC and Boswell Company Income Statements for the Year Ended 31 December 2018 (£ millions)\n \tNinMount\t \tBoswell\nNet sales\t950\t \t510\nCost of goods sold\t(495)\t \t(305)\nSelling expenses\t(50)\t \t(15)\nAdministrative expenses\t(136)\t \t(49)\nDepreciation & amortization expense\t(102)\t \t(92)\nInterest expense\t(42)\t \t(32)\n   Income before taxes\t125\t \t17\nIncome tax expense\t(50)\t \t(7)\n   Net income\t75\t \t10\nExhibit 2\nNinMount PLC and Boswell Company Balance Sheets at 31 December 2018 (£ millions)\n \tNinMount\t \tBoswell\nCash\t50\t \t20\nReceivables—net\t70\t \t45\nInventory\t130\t \t75\n   Total current assets\t250\t \t140\nProperty, plant, & equipment—net\t1,570\t \t930\nInvestment in Boswell\t320\t \t—\n   Total assets\t2,140\t \t1,070\nCurrent liabilities\t110\t \t90\nLong-term debt\t600\t \t400\n   Total liabilities\t710\t \t490\nCommon stock\t850\t \t535\nRetained earnings\t580\t \t45\n   Total equity\t1,430\t \t580\n   Total liabilities and equity\t2,140\t \t1,070\nNote: Balance sheets reflect the purchase price paid by NinMount, but do not yet consider the impact of the accounting method choice.", "Javier Casado, an analyst who manages funds for high-net-worth investors, is evaluating Bardem S.A. (Bardem) as a possible addition to a large investment portfolio. Bardem, based in Madrid, Spain, is a manufacturing firm that specializes in packaging materials. The company reports using IFRS, and its reporting currency is the Euro.\n\nCasado learns that Bardem acquired a 25% stake in Ariana Shipping S.A. (Ariana) on 1 January 2020. Ariana, which is based in Greece, has bought packaging supplies from Bardem in the past based on catalog prices. Casado believes that the purchase will change the relationship between the two companies and will also affect Bardem’s financial reporting. He mentions to a coworker, Ana Domingues, that the price paid by Bardem for the Ariana shares was €80 million.\n\nDomingues tells Casado that Bardem’s purchase of Ariana’s equity will likely allow Bardem to influence Ariana’s financial and operating performance. As a result, she states, Bardem will be required to use the equity method of accounting for this investment. Casado replies that the equity method of accounting is only required under IFRS for joint ventures or when the investee holds a seat on the associate’s board of directors.\n\nBardem prepares the following table to examine the purchase more closely.\n\nExhibit 1 Book Values and Fair Values of Ariana Shipping Assets and Liabilities as of 31 December 2019 (€ millions)\n\n \tBook Value\tFair Value\nCurrent assets\t15\t15\nPlant and equipment\t230\t275\nLand\t100\t115\n \t345\t405\nLiabilities\t110\t110\nNet assets\t235\t295\nDomingues says that she is concerned that Bardem didn’t sufficiently investigate Ariana before the purchase, given economic uncertainty surrounding Greek companies. She asks Casado what will happen to Bardem’s financial statements if the value of Ariana is permanently impaired due to business losses or other demonstrable events. Casado replies that if the equity method is not required, then there will be no impact. However, if the equity method is used, he states:\n\nGoodwill must be separately tested for impairment.\nImpairment losses should be recognized on the income statement.\nImpairment losses exceeding the goodwill value are allocated pro-rata to the unit’s non-cash assets.\nDomingues informs Casado of a final piece of information relevant to his evaluation. To increase liquidity, Bardem is considering borrowing €70M against accounts receivable. As an alternative to borrowing, they could securitize the receivables by creating a special purpose entity (SPE) over which they would exercise control. To do so, they would invest €5M in the SPE. The SPE would then borrow €70M, and would buy €75M in receivables from Bardem. Domingues comments that securitization using an SPE would impact Bardem’s reported financial condition in three ways. It would:\n\nreduce the cost of borrowing.\nincrease the level of current assets.\nimprove balance sheet ratios.", "Robert Krey is a financial analyst who is evaluating the financial statements of Ernst AG, a German manufacturing company that reports under IFRS. During the current year, Ernst invested in three different companies (Astrid, Balto, and Cordeau) that are based in the eurozone. All three investments were acquired on 1 January of the current year. Krey wants to determine the effect of these investments on Ernst's current year financial statements and ratios.\n\nErnst purchased a 10% ownership interest in Astrid for €90 million. During the current year, Astrid reported €80 million in pre-tax income and paid €40 million in dividends. The fair value of Astrid shares at 31 December of the current year was €970 million. Ernst accounts for Astrid by using the fair value through profit or loss (FVPL) method.  \n\nA 25% ownership interest in Balto was purchased for €500 million. The fair values of all Balto's assets and liabilities were equal to their book values except for equipment which was undervalued by €40 million. The undervalued equipment has a remaining useful life of 5 years and will be fully depreciated by using the straight-line method. Ernst has significant influence over Balto but it does not have control. During the current year, Balto reported €140 million in income and paid €40 million in dividends.   \n\nFor Cordeau, Ernst exchanged €1,800 million in shares to acquire a 75% controlling interest in Cordeau. The book value of Cordeau on 1 January was €2,000 million. On that date, Cordeau's inventory was undervalued by €60 million. All other recorded assets and liabilities were equal to their fair values. Cordeau applies the FIFO inventory valuation method and Ernst uses the partial goodwill method when it consolidates Cordeau. Cordeau's primary competitor is a US company that reports under US GAAP. For the current year, Cordeau reported net income of €240 million and paid €40 million in dividends.", "Hannah Treadway is an analyst at Knight Investment Management (Knight). Knight holds Cooper Creek Cable Limited (CCCL) as part of its AFE (Australian and Far East) investment portfolio. CCCL is a diversified cable and communications company operating in Western Australia. The company consists of three divisions:\n\nCable: Provides subscription television services and high speed internet to residential customers.\nMedia: Owns and operates a group of radio stations and publishes several magazines.\nWireless: Is engaged in wireless voice and data communications services.\nTreadway is just starting her annual review of the company based on its most recent financial statements, excerpts of which are in Exhibits 1 and 2. The financial statements for CCCL are prepared in accordance with Australian Accounting Standards (AASB), which comply with IFRS. All figures are in Australian dollars ($).\n\nExhibit 1 Cooper Creek Cable Limited Statement of Earnings for Years Ending December 31 (all figures in $ thousands)\n\n \t2016\t2015\nRevenue\t711,200\t674,600\nProgramming and communication expenses\t312,900\t317,000\nGross margin\t398,300\t357,600\nDepreciation expense\t98,750\t78,650\nAmortization of intangibles\t7,250\t8,150\nReversal of impairment loss\t–12,500\t---\nGain on sale of assets held for sale\t–14,400\t---\nOperating costs\t185,900\t173,000\nInterest expense\t64,100\t65,900\nIncome from investments in associates\t1,200\t850\nProfit before tax\t70,400\t32,750\nTax benefit (expense)\t17,600\t–8,187\nNet profit for the year\t88,000\t24,563\nExhibit 2 Cooper Creek Cable Limited Balance Sheet as of December 31 (all figures in $ thousands)\n\n \t2016\t2015\nCash\t95,600\t74,400\nAccounts receivable, net\t35,700\t33,500\nAssets held for sale\t---\t23,500\nTotal current assets\t131,300\t131,400\nInvestments in associates\t42,700\t42,300\nCapital assets, net\t221,800\t241,200\nIntangible assets, net\t43,250\t24,500\nGoodwill\t11,000\t6,500\nDeferred tax assets\t185,500\t169,900\nTotal assets\t635,550\t615,800\n \nTrade payables\t92,100\t104,200\nInterest bearing loans\t49,700\t \nShort-term unearned revenue\t12,500\t21,250\nOther liabilities\t23,800\t23,000\nTotal current Liabilities\t178,100\t148,450\nInterest bearing debt\t703,800\t814,300\nLong-term unearned revenue\t6,500\t13,500\nTotal liabilities\t888,400\t976,250\n \nIssued capital\t556,400\t536,800\nAccumulated losses\t–809,250\t–897,250\nTotal equity\t–252,850\t–360,450\nTotal liabilities and equity\t635,550\t615,800\nCCCL sustained substantial losses in its start-up period (2001–2005) (from which it is still benefiting for tax purposes) but has been profitable since 2005, reporting a record profit after tax in 2016. However, Treadway is wondering if CCCL’s revenues in general are supported by cash flows and if the company might be trying to increase the appearance of profitability in order to increase the share price, which remains low.\n\nThe Wireless division was acquired by CCCL in a share purchase in late 2015. Treadway wants to review the accounting policies CCCL has adopted for both revenue and expenses incurred on long-term wireless contracts (Exhibit 3).\n\nExhibit 3 Excerpts of Accounting Policy Notes (all figures in thousands)\n\nNote 1 d) Long-Term Wireless Contracts\nCustomers who enter into long-term service contracts for wireless services can obtain their mobile devices for a nominal amount. Commencing in 2016, the discount offered on the devices, relative to the regular price, is capitalized as a customer acquisition cost and amortized straight-line over the life of the contract, or a minimum of three years. Previously this amount was recognized in income immediately.\nNote 1 g) Unearned Revenue\nUnearned revenue for subscriptions, or for services paid in advance, was historically recognized on a straight-line basis over the term of the contract or subscription, which was typically three years. After reviewing the historical pattern of usage and cancellations for service contracts in 2016, the pattern of recognition was changed to recognize the majority of the revenues in the first 12 months after the service contract is signed with the remainder recognized in the following year.\nNote 12) Broadcast Licenses\nDuring 2016, the company successfully disposed of broadcast licenses that were held for sale for $37,900 (net book value of $23,500). Based on the successful completion of that sale the impairment losses taken in 2014 on other licenses have been reversed, restoring those intangible assets to their amortized historical cost. Broadcast licenses are amortized over a period of 15 to 25 years.\nOn reading the note about the rapid reversal of the impairment loss related to the Broadcast licenses (Exhibit 3, Note 12) Treadway strongly believes that it arose as an attempt by management to manage earnings. She realizes that both her 2014 and 2015 analyses were impacted by these actions and now need to be reconsidered.\n\nAs part of her annual review, Treadway determines the Altman’s Z-scores for CCCL. The results for the current and past years are reported in Exhibit 4.\n\nExhibit 4 Cooper Creek Cable Limited Altman Z-Scores\n\n \t2016\t2015\nAltman Z-score*\t2.14\t1.82\n* Critical values: 1.81 and 3.0\nFinally, Treadway noted that during 2016 CCCL acquired 100% of MusicMusic (MM), a specialty cable music channel in an all-stock deal. At the time of the acquisition MM reported intangible assets for broadcast licenses at a value of $2,500. CCCL estimated the fair value of those licenses to be $5,500 at that date and estimated the value of the MusicMusic brand name to be $2,000, all figures in thousands. The acquisition did not give rise to any goodwill.", "Dagmar AG is a European-based manufacturing firm that prepares its financial statements according to International Financial Reporting Standards (IFRS). Two members of Dagmar’s treasury group, Henrik Ferdinand and Adele Christoph, are reviewing Dagmar’s portfolio of investments. They are interested in the investment income reported during the year and whether any of the investments should be considered impaired or need to be reclassified.\n\nOn July 1 the company purchased €4,000 of 10-year bonds of Alme AG. The bonds have a 5% coupon payable annually and cost €3,705.60, reflecting the effective market rate of 6%. Dagmar is expecting to collect the interest and principal payments but if liquidity needs arise will sell the bonds. Ferdinand and Christophe start by reviewing how the bond is classified.\n\nThe company also holds bonds issued by Bergenfeld AG with a face value of €5 million and a coupon rate of 8%, payable semi-annually. The bonds have been held for 10 years and are classified as amortized cost.\n\nThe final investment is Dagmar’s longstanding holding of Elbe AG common shares. Elbe has been profitable and paid a consistent dividend every year since it was acquired, Additional details are available in Exhibit 1.\n\nExhibit 1 Additional Information Investment in Elbe AG (All € figures in 000s except per share data)\n\nAt the date of acquisition (February 28, 2008)\n# shares purchased\t1.8 million\nTotal shares outstanding\t6.0 million\nPrice paid\t€17 per share\nTotal net book value of Elbe\t€90,000\nExcess of fair market value of plant and equipment above book value\t€5,250\nExpected useful life remaining on plant and equipment\t15 years\nElbe uses straight-line depreciation for all of its tangible assets\nDagmar classified Elbe as an associate company\nAt December 31, 2019\nBook value of investment on Dagmar’s statement of financial position\t€59,022\nNet income reported by Elbe for 2019\t€12,375\nDividends paid by Elbe in 2019\t€0.50 per share\nFerdinand continues the meeting with the following statement:\n\n“Before we consider impairment, let us calculate the amount Elbe will contribute to Dagmar’s net earnings this year.”\n\nTurning to the Bergenfeld bonds, Christoph says:\n\n“If we’re looking for contributions to net earnings, I see an opportunity with the Bergenfeld bonds. The decline in interest rates over the years since the original purchase has significantly increased their market value. IFRS allows us to reclassify these bonds to fair value as a way to increase reported income in the period. It works well because the standards don’t require us to restate the prior periods when we reclassify.”", "Nation Resorts Ltd (Nation) is a US-based operator of destination vacation resorts. Resorts are divided into three types: Winter, which are located at ski mountains; Golf, which are located on championship courses in such locations as Arizona; and Seaside, which are located at world-class ocean beaches. The three types of resorts generally attract different types of vacationers and provide different vacation packages for different budgets. Although the Winter and Golf resorts are somewhat counter seasonal, the company still suffers from risks related to the US economy, as well as the risk of unfavorable local weather conditions (lack of snow or sun). To diversify and reduce these risks, Nation started purchasing properties in other geographic areas, including Europe and Central America.\n\nNation made its first non-domestic investment when it bought a resort in Jamaica on 1 May 2008. Initially, Nation provided managers to assist in operating the resort but then hired local Jamaicans into its management development program, one of whom was recently appointed to a senior position at the resort. Nation invested in building and upgrading facilities, with the initial expansion financing provided by Nation’s US bank. Concerned about the high rate of inflation in Jamaica, which at the time of purchase averaged 20% per year over the previous three years, Nation kept any excess funds in US dollars. The company’s vacation packages are sold primarily in the United States, and its prices reflect competitive conditions in the US vacation market. In 2010, the Jamaican resort used local labor and supplies and was profitable for the first time. In addition, by that time, inflation had declined to 14% per year, and Nation expected to be able to reinvest any profits in the resort and start using a local bank for ongoing financing needs.\n\nOn 1 July 2010, Nation acquired its first European resort, Val Blanc SA, a ski resort in the Alps region of France. Nation paid €28 million for 100% of the company. The resort attracts skiers primarily from France and other European countries. The transition went very well, and Nation left the local managers in place to make all operating and financial decisions. By the end of 2011, Nation’s only financial contribution to the resort was the initial equity investment. Exhibit 1 shows financial statements for the ski resort at acquisition and for the following six months.\n\nExhibit 1 Val Blanc Financial Statements (€ thousands)\n\n \tIncome Statement\n \t31 Dec. 2010 (6 months)\t30 Jun. 2010 (12 months)\nResort revenues\t12,025\t46,805\nOperating expenses\t9,800\t35,105\nDepreciation and amortization\t1,750\t4,000\nInterest expense\t1,200\t2,500\nEarnings before taxes\t–725\t5,200\nIncome taxes\t0\t1,300\nNet earnings\t–725\t3,900\n \n \tStatement of Financial Position\n \t31 Dec. 2010\t30 Jun. 2010a\nCash and marketable securities\t5,750\t5,000\nAccounts receivable\t6,500\t3,000\nInventory\t8,000b\t5,000\nTotal current assets\t20,250\t13,000\nProperty, plant, and equipment\t41,750\t43,500\nIntangible assets\t5,000\t5,000\nTotal assets\t67,000\t61,500\n \nCurrent liabilities\t12,225\t5,000\nLong-term debt\t26,000\t27,000\nShare capital\t20,000\t20,000\nRetained earnings\t8,775\t9,500\nTotal liabilities and equity\t67,000\t61,500\na The 30 June 2010 Statement of Financial Position reflects the fair value of the identifiable assets and liabilities of Val Blanc at acquisition.\nb The 31 December 2010 inventory was acquired evenly throughout the period since acquisition.\nIn early January 2011, Paul Nakiska, a business analyst with Nation, met with Nation’s manager of financial reporting, Max Chara, to discuss how the company should account for the two non-domestic resorts in the 2010 financial statements and the impact the resorts would have on Nation’s reported results. Nation has a 31 December year end and prepares its financial statements according to US GAAP.\n\nIn preparation for the meeting, Nakiska’s first task was to prepare the purchase price allocation of the Val Blanc acquisition using the acquisition method. He also gathered some exchange rate information related to the two resorts, shown in Exhibit 2.\n\nExhibit 2 Selected Exchange Rates\n\nDate\tUSD/JMD\tUSD/EUR\n5/1/2008\t0.0139\tN/A\n1/1/2010\t0.0115\t1.4368\n6/30/2010\t0.0117\t1.225\n12/31/2010\t0.0117\t1.3261\nAverage 2010\t0.0115\t1.3277\nAverage January–July 2010\t0.0113\t1.3303\nAverage July–December 2010\t0.0117\t1.3198\nNakiska started the meeting:\n\n“I suggest we use the current rate method for both our non-domestic subsidiaries because that will simplify our financial reporting. The current rate method also allows the key metrics we use to evaluate performance—the current ratio, fixed asset turnover, and operating margin—to be the same after translation as they are before.”\n\nChara replied:\n\n“I am not so concerned about the translated metrics because we evaluate the performance of each resort in its local currency. I am concerned, however, about the effect on Nation’s consolidated net income and return on equity.\n\nIf we use the temporal method for the resort in France, we can take advantage of the strengthening euro and report the translation gain on the income statement.\n\nI am also not concerned about using the same method for all subsidiaries if using different methods will help increase our net income.\n\nNakiska agreed to calculate the effects of the various translation methods and of the Val Blanc acquisition on the financial statements and send a report to Chara.", "Marcus Eriksson, chief financial officer of Trana AB, and Katrina Lars, director of financial reporting, are preparing the company’s 2015 annual report. Today’s meeting is to discuss the transactions and disclosures related to Trana’s foreign operations. Trana, which reports under International Financial Reporting Standards (IFRS), is a Sweden-based retailer operating stores in three geographic locations: Sweden, the eurozone (with a current presence only in France, Germany, and Italy), and the United States. The stores in the eurozone and the United States are operated through a wholly owned subsidiary in each region. Consistent with Swedish accounting practice, the annual report includes separate financial statements for the parent company (Trana) and consolidated, or group, financial statements. The income statements are presented in Exhibit 1.\n\nExhibit 1 Trana AB Income Statements for the Years Ended 31 December\n\n \tConsolidated Income Statement (SEK millions)\tParent Income Statement (SEK million)\n \t2015\t2014\t2015\t2014\nSales\t30,200\t26,892\t4,700\t4,653\nCost of goods sold\t13,590\t12,639\t2,600\t2,650\nGross profit\t16,610\t14,253\t2,100\t2,003\nSelling expenses\t10,872\t9,143\t1,500\t1,525\nAdmin. expenses\t1,510\t1,076\t260\t200\nOperating profit\t4,228\t4,034\t340\t278\nNet other costs/losses\t10\t15\t2\t3\nEarnings before taxes\t4,218\t4,019\t338\t275\nIncome taxes\t1,122\t1,071\t74\t61\nNet profit\t3,096\t2,948\t264\t214\nEriksson and Lars start the meeting by reviewing some of the relevant currency exchange rates, shown in Exhibit 2. The functional currency for the eurozone and US subsidiaries is the local currency (EUR and USD, respectively), thus the financial statements of both are translated using the current rate method. Both subsidiaries are consistently profitable.\n\nExhibit 2 Exchange Rates\n\n \tSEK per EUR\tSEK per USD\nBeginning 2014\t8.43\t6.32\nAverage 2014\t8.555\t6.35\nEnd of 2014\t8.88\t6.38\nAverage 2015\t9.125\t7.595\nEnd of 2015\t9.31\t8.81\nNext, they review the performance and related disclosures by region. The number of stores operated in each region is shown in Exhibit 3.\n\nExhibit 3 Number of Stores by Region\n\nYear\tEurozone\tSweden\tUnited States\tTotal\n2014\t340\t99\t80\t519\n2015\t400\t100\t80\t580\nIn preparation for the meeting, Lars looked at the US region and calculated the effect of the change in the SEK/USD exchange rate on the increase in sales from 2014 to 2015. Her notes include the following:\n\nIn 2014, the sales per store, in SEK, were the same for both US and Swedish stores.\nThe sales per US store in USD remained constant in 2015.\nEriksson reminds Lars that Trana defines organic growth in retail as coming from two factors:\n\nincreasing the number of stores, and\nincreasing the sales per store in the local currency.\nHe says that he wants to provide disclosures related to the organic growth rate in domestic sales per store, by region, and asks Lars to calculate it for the eurozone region where the sales figures (in millions) were SEK18,394 in 2014 and SEK21,640 in 2015.\n\nIn 2012, at the start of Trana’s expansion into North American markets, the company established a subsidiary, Anart Inc., in a South American country to benefit from lower labor and shipping costs. The details of the Anart investment are as follows:\n\nAnart is 80% owned by Trana with 20% local investment.\nIt sells all of its production to Trana and Trana’s other subsidiaries and determines the transfer price as full cost plus 5%.\nIn 2015, sales (in millions) from Anart to Trana companies were SEK4,485 with net profit of SEK204.\nThe corporate tax rate in the country is 10%.\nThroughout 2013, the South American country experienced high rates of inflation, approaching 30% per year. Trana had originally assumed that the high inflation rate was temporary, but it has shown no signs of decreasing and is now a concern. Eriksson and Lars discuss the impact of Anart on Trana’s financial statements and Eriksson asks Lars:\n\n“Is the same accounting method being used this year to account for Anart in the consolidated financial statements as in prior years?”\n\nEriksson reminds Lars that there is a proposal in Sweden to reduce the corporate tax rate from the current 22% to 16.5%. He would like to provide pro-forma disclosures related to the potential change in net income this change could provide for Trana. He reminds Lars that the average tax rate for the eurozone countries where Trana operates is 30% and 25% in the United States. Sweden operates under a tax treaty with all countries in which it has subsidiaries, such that it will owe taxes on foreign earned income to the extent that the Swedish rate exceeds the foreign rate.\n\nIn closing the meeting, Eriksson mentions that Trana is undertaking a comprehensive review of its operations in 2016, and its objectives include reducing overall tax costs by lowering its effective tax rate and reducing foreign exchange gains and losses reported on the income statement.", "Kensington plc, a fictional company based in the United Kingdom, sponsors a DB pension plan for qualifying employees. Kensington prepares its financial statements under IFRS. The discount rate that the company used in estimating the present value of its pension obligation was 5.48%. Disclosures on Kensington’s pension plan in the company’s notes to financial statements for the year ended 31 December 20X1 included the following.\n\nComponents of periodic benefit cost\t\nService cost\t£228\nNet interest (income) expense\t273\nRemeasurements\t−18\nPeriodic pension cost\t£483\nChange in benefit obligation\t\nBenefit obligations at beginning of year\t£28,416\nService cost\t228\nInterest cost\t1,557\nBenefits paid\t−1,322\nActuarial gain or loss\t0\nBenefit obligations at end of year\t£28,879\nChange in plan assets\t\nFair value of plan assets at beginning of year\t£23,432\nActual return on plan assets\t1,302\nEmployer contributions\t693\nBenefits paid\t−1,322\nFair value of plan assets at end of year\t£24,105\nFunded status at beginning of year\t−£4,984\nFunded status at end of year\t−£4,774", "XYZ SA is a fictional company that uses a DB pension plan and stock option grants as part of its compensation to qualified employees. XYZ SA prepares its financial statements under IFRS.\n\nInformation on XYZ’s DB plan and volatility assumptions used to value stock option grants were as follows:\n\nXYZ SA Defined BP Information, Fiscal Year 2024\nEmployer contributions\t1,000\nCurrent service costs\t200\nPast service costs\t120\nDiscount rate used to estimate plan liabilities at beginning of year\t7.00%\nBenefit obligation at beginning of year\t42,000\nBenefit obligation at end of year\t41,720\nActuarial loss due to increase in plan obligation\t460\nPlan assets at beginning of year\t39,000\nPlan assets at end of year\t38,700\nActual return on plan assets\t2,700\nExpected rate of return on plan assets\t8.00%\nGrant Year\tWeighted Average Expected Volatility\n2024 Valuation Assumptions\t \n     2020–2024\t21.50%\n2023 Valuation Assumptions\t \n     2019–2023\t23.00%", "Sallie Kwan Industrials (SKI) is a Singapore-based automation equipment manufacturer that reports under US GAAP. The company disclosed the following information in a note to its financial statements titled “Share-Based Compensation.”\n\nUnder our Share Incentive Plan, the Company grants restricted stock units (“RSUs”) to its officers, employees, directors and other eligible persons of up to 83,000,000 Class A ordinary shares. RSUs vest 25% on the first anniversary year from the grant date and the remaining 75% vest in 12 substantially equal quarterly installments. RSU activity for the two years ended 31 December 20X2 was as follows.\n\n \tNumber of Shares\tWeighted Average Grant-Date Fair Value per Share (SGD)\nUnvested at 31 December 20X0\t4,754,972\t12.34\nGranted\t6,249,313\t20.50\nVested and settled\t(2,131,415)\t13.67\nForfeited\t(791,433)\t15.22\nUnvested at 31 December 20X1\t8,081,437\t18.02\nGranted\t5,034,735\t72.37\nVested and settled\t(3,332,063)\t19.25\nForfeited\t(442,181)\t28.74\nUnvested at 31 December 20X2\t9,341,928\t46.36\nShare-based compensation expense for RSUs is measured based on the fair value of the Company’s ordinary shares on the date of grant. SKI accounts for forfeitures as they occur.\n\nUnrecognized share-based compensation expense as of 31 December 20X0, 20X1, and 20X2 was SGD 58.7, SGD 145.6, and SGD 433.1 million, respectively.", "Terra Mercado is a retailer that compensates employees with a DB pension plan and stock options in addition to short-term benefits and a DC plan. Terra Mercado prepares its financial statements in accordance with US GAAP and reports in BRL.\n\nPeter Friedland, CFA, is an equity analyst concerned with earnings quality. He is particularly interested in whether the discretionary assumptions the company is making regarding compensation plans are contributing to the recent earnings growth at Terra Mercado. He gathers information from the company’s regulatory filings regarding the pension plan assumptions and assumptions related to option valuation for the three years ended 31 December 20X3.\n\nAssumptions Used for Terra Mercado DB Plan\n20X3\t20X2\t20X1\nExpected long-term rate of return on plan assets\t6.06%\t6.14%\t6.79%\nDiscount rate used to estimate pension obligation at beginning of year\t4.85%\t4.94%\t5.38%\nEstimated salary growth rate\t4.00%\t4.44%\t4.25%\nEstimated inflation rate\t3.00%\t2.72%\t2.45%\nAssumptions Used for Terra Mercado Option Grants\n20X3\t20X2\t20X1\nRisk-free rate\t4.6%\t3.8%\t2.4%\nExpected life\t5.0 yrs\t4.5 yrs\t5.0 yrs\nDividend yield\t1.0%\t0.0%\t0.0%\nExpected volatility\t29%\t31%\t35%", "Your colleague is building financial statement and discounted cash flow models for a company and has asked you review their modeling decisions with respect to the subject company’s post-employment and stock-based compensation plans.", "Adrienne Yu is an analyst with an international bank. She analyzes Ambleu S.A. (“Ambleu”), a multinational corporation, for a client presentation. Ambleu complies with IFRS, and its presentation currency is the Norvoltian krone (NVK). Ambleu’s two subsidiaries, Ngcorp and Cendaró, have different functional currencies: Ngcorp uses the Bindiar franc (₣B) and Cendaró uses the Crenland guinea (CRG).\n\nYu first analyzes the following three transactions to assess foreign currency transaction exposure:\n\nTransaction 1:\nCendaró sells goods to a non-domestic customer that pays in dollars on the purchase date.\n\nTransaction 2:\nNgcorp obtains a loan in Bindiar francs on 1 June 2016 from a European bank with the Norvoltian krone as its presentation currency.\n\nTransaction 3:\nAmbleu imports inventory from Bindiar under 45-day credit terms, and the payment is to be denominated in Bindiar francs.\n\nYu then reviews Transactions 2 and 3. She determines the method that Ambleu would use to translate Transaction 2 into its 31 December 2016 consolidated financial statements. While analyzing Transaction 3, Yu notes that Ambleu purchased inventory on 1 June 2016 for ₣B27,000/ton. Ambleu pays for the inventory on 15 July 2016. Exhibit 1 presents selected economic data for Bindiar and Crenland.\n\nExhibit 1\nSelected Economic Data for Bindiar and Crenland\nDate\tSpot\n\nFB/NVK Exchange\n\nRate\tBindiar\n\nInflation Rate (%)\tSpot CRG/NVK Exchange\n\nRate\tCrenland\n\nInflation\n\nRate (%)\tCrenland\n\nGPI\n31 Dec 2015\t—\t—\t5.6780\t—\t100.0\n1 Jun 2016\t4.1779\t—\t—\t—\t—\n15 Jul 2016\t4.1790\t—\t—\t—\t—\n31 Dec 2016\t4.2374\t3.1\t8.6702\t40.6\t140.6\nAverage 2016\t4.3450\t—\t—\t—\t—\n31 Dec 2017\t4.3729\t2.1\t14.4810\t62.3\t228.2\nAverage 2017\t4.3618\t—\t11.5823\t—\t186.2\nPrior to reviewing the 2016 and 2017 consolidated financial statements of Ambleu, Yu meets with her supervisor, who asks Yu the following two questions:\n\nQuestion 1:\nWould a foreign currency translation loss reduce Ambleu’s net sales growth?\n\nQuestion 2:\nAccording to IFRS, what disclosures should be included relating to Ambleu’s treatment of foreign currency translation for Ngcorp?\n\nTo complete her assignment, Yu analyzes selected information and notes from Ambleu’s 2016 and 2017 consolidated financial statements, presented in Exhibit 2.\n\nExhibit 2\nSelected Information and Notes from Consolidated Financial Statements of Ambleu S.A. (in NVK millions)\nIncome Statement\t2017\t2016\t \tBalance Sheet\t2017\t2016\nRevenue (1)\t1,069\t1,034\t \tCash(3)\t467\t425\nProfit before tax\t294\t269\t \tIntangibles (4)\t575\t570\nIncome tax expense (2)\t−96\t−94\t \t—\t—\t—\nNet profit\t198\t175\t \t—\t—\t—\nNote 1: Cendaro’s revenue for 2017 is CRG125.23 million.\n\nNote 2: Ambleu’s consolidated income tax rate decreases by 2.29%, from 34.94% (=94/269) in 2016 to 32.65% (=96/294) in 2017. The largest component of the decrease stems from the 1.42% change in the effect of tax rates in non-domestic jurisdictions, which lowers Ambleu’s consolidated income tax rate in 2016 by 3.34% (=9/269) and in 2017 by 4.76% (=14/294).\n\nA table for comparison of reconciliation of income tax expense for Ambleu in years 2017 and 2016 expressed in NVK millions. Expand / Collapse Extended Description\nA table for comparison of reconciliation of income tax expense for Ambleu in years 2017 and 2016 expressed in NVK millions. Income tax at Ambleu’s domestic tax rate. 2017, 102. 2016, 92. Effect of tax rates on non-domestic jurisdictions. 2017, negative 14. 2016, negative 9. Unrecognized current year tax losses. 2017, 8. 2016, 11. Income tax expense. 2017, 96. 2016, 94.\n\nNote 3: The parent company transferred NVK15 million to Cendaró on 1 January 2016 to purchase a patent from a competitor for CRG85.17 million.\n\nNote 4: The 2016 consolidated balance sheet includes Ngcorp’s total intangible assets of NVK3 million, which were added to Ngcorp’s balance sheet on 15 July 2016.", "Triofind, Inc. (Triofind), based in the country of Norvolt, provides wireless services to various countries, including Norvolt, Borliand, Abuelio, and Certait. The company’s presentation currency is the Norvolt euro (NER), and Triofind complies with IFRS. Triofind has two wholly owned subsidiaries, located in Borliand and Abuelio. The Borliand subsidiary (Triofind-B) was established on 30 June 2016, by Triofind both investing NER1,000,000, which was converted into Borliand dollars (BRD), and borrowing an additional BRD500,000.\n\nMarie Janssen, a financial analyst in Triofind’s Norvolt headquarters office, translates Triofind-B’s financial statements using the temporal method. Non-monetary assets are measured at cost under the lower of cost or market rule. Spot BRD/NER exchange rates are presented in Exhibit 1, and the balance sheet for Triofind-B is presented in Exhibit 2.\n\nExhibit 1\nSpot BRD/NER Exchange Rates\nDate\tBRD per NER\n30 June 2016\t1.15\nWeighted-average rate when inventory was acquired (2016)\t1.19\n31 December 2016\t1.20\nWeighted-average rate when inventory was acquired (2017)\t1.18\n30 June 2017\t1.17\nExhibit 2\nTriofind-B Balance Sheet for 2016 and 2017 (BRD)\nAssets\t31 December 2016\t30 June 2017\tLiabilities and Stockholders’ Equity\t31 December 2016\t30 June 2017\nCash\t900,000\t1,350,000\tNotes payable\t500,000\t500,000\nInventory\t750,000\t500,000\tCommon stock\t1,150,000\t1,150,000\n \t \t \tRetained earnings\t \t200,000\nTotal\t1,650,000\t1,850,000\tTotal\t1,650,000\t1,850,000\nJanssen next analyzes Triofind’s Abuelio subsidiary (Triofind-A), which uses the current rate method to translate its results into Norvolt euros. Triofind-A, which prices its goods in Abuelio pesos (ABP), sells mobile phones to a customer in Certait on 31 May 2017 and receives payment of 1 million Certait rand (CRD) on 31 July 2017.\n\nOn 31 May 2017, Triofind-A also received NER50,000 from Triofind and used the funds to purchase a new warehouse in Abuelio. Janssen translates the financial statements of Triofind-A as of 31 July 2017 and must determine the appropriate value for the warehouse in Triofind’s presentation currency. She observes that the cumulative Abuelio inflation rate exceeded 100% from 2015 to 2017. Spot exchange rates and inflation data are presented in Exhibit 3.\n\nExhibit 3\nSpot Exchange Rates and Inflation Data for Triofind-A\nDate\tNER per CRD\tNER per ABP\tAbuelio Monthly Inflation Rate (%)\n31 May 2017\t0.2667\t0.0496\t—\n30 June 2017\t0.2703\t0.0388\t25\n31 July 2017\t0.2632\t0.0312\t22\nJanssen gathers corporate tax rate data and company disclosure information to include in Triofind’s annual report. She determines that the corporate tax rates for Abuelio, Norvolt, and Borliand are 35%, 34%, and 0%, respectively, and that Norvolt exempts the non-domestic income of multinationals from taxation. Triofind-B constitutes 25% of Triofind’s net income, and Triofind-A constitutes 15%. Janssen also gathers data on components of net sales growth in different countries, presented in Exhibit 4.\n\nExhibit 4\nComponents of Net Sales Growth (%) Fiscal Year 2017\nCountry\tContribution from Volume Growth\tContribution from Price Growth\tForeign Currency Exchange\tNet Sales Growth\nAbuelio\t7\t6\t−2\t11\nBorliand\t4\t5\t4\t13\nNorvolt\t7\t3\t—\t10", "Consolidated Motors is a US-based corporation that sells mechanical engines and components used by electric utilities. Its Canadian subsidiary
