<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>FSA Interactive Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q4", "src": "ECO 오답", "module": 1, "tag": "FVPL vs Amortized cost – EBT 영향", "vig": 0, "stem": "Compared to Confabulated’s reported earnings before taxes in 2018, if Dumas had been classified as a FVPL security, the earnings before taxes (in € thousands) would have been:", "opts": {"A": "the same.", "B": "€1,000 lower.", "C": "€1,000 higher."}, "ans": "C", "en": "C is correct. Unrealized gains and losses are included in income when securities are classified as FVPL. During 2018 there was an unrealized gain of €1,000.", "ko": "FVPL은 미실현 평가손익까지 당기손익(P&L)에 반영합니다. Dumas의 2018년 시가는 54,000 → 55,000으로 €1,000 상승했으므로 FVPL이었다면 EBT가 €1,000 증가합니다. Amortized cost는 시가 변동을 무시합니다.", "trap": "Q3(이자수익은 동일)과 혼동 — 이자수익이 같아도 FVPL은 평가이익이 추가로 EBT에 들어갑니다.", "f": "FVPL 손익 = 이자·배당 + 실현/미실현 G/L (전부 P&L)", "why": {"A": "'동일'은 amortized cost 사고방식입니다. 이자수익(쿠폰)은 같지만 FVPL은 2018년 시가 상승분 €1,000을 P&L에 추가로 인식합니다.", "B": "방향 오류. Dumas 시가는 54,000 → 55,000으로 '상승'했으므로 평가이익입니다."}, "orig": "ECO Module 1 Q4"}, {"id": "ECO-M1-Q5", "src": "ECO 오답", "module": 1, "tag": "Premium / Discount amortization", "vig": 0, "stem": "Confabulated’s reported interest income would be lower if the cost was the same but the par value (in € thousands) of:", "opts": {"A": "Bugle was €28,000.", "B": "Cathay was €37,000.", "C": "Dumas was €55,000."}, "ans": "B", "en": "B is correct. The difference between historical cost and par value must be amortized under the effective interest method. If the par value is less than the initial cost (stated interest rate is greater than the effective rate), the interest income would be lower than the interest received because of amortization of the premium.", "ko": "원가가 같고 par가 원가보다 낮으면 premium 매입입니다. Effective interest method에서 interest income = 장부가 × 시장이자율이므로 premium 상각만큼 이자수익 < 쿠폰 수령액. Cathay(par 37,000 < cost 40,000)만 premium → 이자수익 하락. Bugle·Dumas는 par > cost(discount) → 이자수익 상승.", "trap": "Par를 시가로 착각하지 말 것. 분류(FVPL/FVOCI/AC)와 무관하게 premium/discount 상각은 이자수익에 반영됩니다.", "f": "Par < Cost → Premium → Interest income < Coupon / Par > Cost → Discount → Interest income > Coupon", "why": {"A": "Bugle의 par 28,000 > cost 25,000 → discount 매입 → 상각만큼 이자수익이 '증가'합니다.", "C": "Dumas의 par 55,000 > cost 50,000 → discount 매입 → 이자수익 '증가'. 시가 55,000과 par를 혼동하지 마세요."}, "orig": "ECO Module 1 Q5"}, {"id": "ECO-M1-Q6", "src": "ECO 오답", "module": 1, "tag": "SPE 연결 (IFRS)", "vig": 0, "stem": "Confabulated’s special purpose entity is most likely to be:", "opts": {"A": "held off-balance sheet.", "B": "consolidated on Confabulated’s financial statements.", "C": "consolidated on Confabulated’s financial statements only if it is a “qualifying SPE.”"}, "ans": "B", "en": "B is correct. Under IFRS, SPEs must be consolidated if they are conducted for the benefit of the sponsoring entity. Further, under IFRS, SPEs cannot be classified as qualifying. Under US GAAP, qualifying SPEs (a classification which has been eliminated) do not have to be consolidated.", "ko": "IFRS에서는 스폰서의 이익을 위해 설립되어 스폰서가 control하는 SPE는 반드시 연결합니다. IFRS에는 'qualifying SPE' 개념이 없고, US GAAP에서도 이 분류는 폐지되었습니다.", "trap": "'qualifying SPE'는 폐지된 US GAAP 용어 — 선지에 나오면 함정입니다.", "f": "", "why": {"A": "Confabulated의 이익을 위해 설립되어 통제하는 SPE는 IFRS상 반드시 연결 — 부외 처리 불가.", "C": "'Qualifying SPE'는 IFRS에 없는 개념(US GAAP에서도 폐지)이므로 조건 자체가 성립하지 않습니다."}, "orig": "ECO Module 1 Q6"}, {"id": "ECO-M1-Q17", "src": "ECO 오답", "module": 1, "tag": "JV – Equity method (one-line consolidation)", "vig": 1, "stem": "Based on Ohalin’s estimates, the amount of joint venture revenue (in $ millions) included on BetterCare’s consolidated 2018 financial statements should be closest to:", "opts": {"A": "$0.", "B": "$715.", "C": "$1,430."}, "ans": "A", "en": "A is correct. Under the equity method, BetterCare would record its interest in the joint venture’s net profit as a single line item, but would show no line-by-line contribution to revenues or expenses.", "ko": "Equity method는 one-line consolidation입니다. JV의 매출·비용은 라인별로 들어오지 않고 지분 순이익만 한 줄로 반영 → BetterCare 연결 매출에 포함되는 JV 매출 = $0.", "trap": "$715(50%)는 proportionate consolidation일 때의 답입니다. 방법(equity vs proportionate)을 먼저 확인하세요.", "f": "", "why": {"B": "$715(= 50% × 1,430)는 proportionate consolidation 결과입니다. BetterCare는 equity method를 사용합니다.", "C": "$1,430(100%)은 acquisition method(완전 연결) 결과입니다. 공동지배 JV는 연결하지 않습니다."}, "orig": "ECO Module 1 Q17"}, {"id": "ECO-M1-Q21", "src": "ECO 오답", "module": 1, "tag": "SPE 연결 – 내부거래 제거", "vig": 1, "stem": "If Supreme Healthcare sells its receivables to the SPE, its consolidated financial results will least likely show:", "opts": {"A": "a higher revenue for 2018.", "B": "the same cash balance at 31 December 2018.", "C": "the same accounts receivable balance at 31 December 2018."}, "ans": "A", "en": "A is correct. Revenue will not be higher for 2018 because Supreme Healthcare controls the SPE and thus eliminates intra-entity transactions and balances in consolidation. Consolidated revenue will thus present the results as if this transaction did not occur.", "ko": "Supreme은 SPE의 손실을 흡수하므로 통제 → 연결합니다. 연결 시 SPE로의 채권 매각은 내부거래로 제거되어 거래가 없었던 것처럼 표시: 매출 증가 없음, 현금·AR 잔액도 동일.", "trap": "'least likely' 질문 — '변하지 않는다'는 선지(B, C)가 실제 결과이고, '매출 증가'가 일어나지 않는 결과입니다.", "f": "", "why": {"B": "SPE가 연결되면 채권 매각으로 받은 현금은 내부거래로 제거되어 현금 잔액은 '동일'하게 표시됩니다. 실제로 나타나는 결과이므로 'least likely'의 답이 아닙니다.", "C": "연결 시 AR은 SPE 장부에 그대로 남아 합산되므로 '동일'합니다. 실제로 나타나는 결과입니다."}, "orig": "ECO Module 1 Q21"}, {"id": "ECO-M1-Q24", "src": "ECO 오답", "module": 1, "tag": "Equity method – Goodwill 계산", "vig": 2, "stem": "Based on Exhibit 2, Topmaker’s investment in Rainer resulted in goodwill of:", "opts": {"A": "$21 million.", "B": "$60 million.", "C": "$99 million."}, "ans": "B", "en": "B is correct. The goodwill in Topmaker’s $300 million purchase of Rainer’s common shares using the equity method is $60 million, calculated as:\n\n \t$ Millions\nPurchase price\t$300\nLess: 15% of book value of Rainer: (15% x $1,340)\t201\nExcess purchase price\t99\n \t \nAttributable to net assets\n\n Plant and equipment (15% x ($3,160 – $2,900))\t39\nGoodwill (residual)\t60\n \t99", "ko": "지급액 300에서 지분율만큼의 장부가(15%×1,340=201)를 빼면 excess purchase price 99. 이 중 P&E 공정가치 초과분(15%×260=39)을 배분하고 남는 잔여 60이 goodwill입니다.", "trap": "$99는 초과취득가 전체(배분 전), $39는 P&E 배분분 — 마지막 잔여(residual)만 goodwill.", "f": "Goodwill = 지급액 − 지분%×BV − 지분%×(FV − BV) = 300 − 201 − 39 = 60", "why": {"A": "잔여 goodwill(60)에서 P&E 배분분(39)을 한 번 더 빼는 등 배분 순서를 잘못 적용한 값입니다.", "C": "$99는 excess purchase price 전체입니다. 이 중 P&E 공정가치 초과분(39)을 먼저 배분한 잔여만 goodwill입니다."}, "orig": "ECO Module 1 Q24"}, {"id": "ECO-M1-Q26", "src": "ECO 오답", "module": 1, "tag": "Equity method – 기말 장부가", "vig": 2, "stem": "Using only the information from Exhibit 2, the carrying value of Topmaker’s investment in Rainer at the end of 2016 is closest to:", "opts": {"A": "$282 million.", "B": "$317 million.", "C": "$321 million."}, "ans": "B", "en": "B is correct. The carrying value of Topmaker’s investment in Rainer using the equity method is $317 million and is calculated as:\n\n \t$ Millions\nPurchase price\t$300\nPlus: Topmaker’s share of Rainer’s net income\n\n(15% x $360)\t54\nLess: Dividends received (15% x $220)\t33\nLess: Amortization of excess purchase price attributable to plant and equipment (15% x ($3,160 – $2,900))) / 10 years\t3.9\nInvestment in associate (Rainer) at the end of 2016\t$317.1", "ko": "기말 투자계정 = 취득가 + 지분 순이익 − 수령 배당 − 초과취득가 상각. P&E 초과분 39는 10년 상각 → 연 3.9 차감. 300 + 54 − 33 − 3.9 = 317.1.", "trap": "321은 초과분 상각 누락, 282는 초과분 39 전액을 한 해에 차감한 실수입니다.", "f": "Investment(t) = Cost + %×NI − %×Div − %×(FV−BV)/잔존연수", "why": {"A": "P&E 초과분 39 전체를 한 해에 차감한 값입니다. 10년 정액 상각이므로 연 3.9만 차감합니다.", "C": "초과취득가 상각(3.9)을 빼지 않은 값(300 + 54 − 33 = 321)입니다."}, "orig": "ECO Module 1 Q26"}, {"id": "ECO-M1-Q30", "src": "ECO 오답", "module": 1, "tag": "Equity vs Consolidation – LT Debt/Equity", "vig": 3, "stem": "NinMount’s long-term debt to equity ratio on 31 December 2018 most likely will be lowest if the results of the acquisition are reported using:", "opts": {"A": "the equity method.", "B": "consolidation with full goodwill.", "C": "consolidation with partial goodwill."}, "ans": "A", "en": "A is correct. Using the equity method, long-term debt to equity = £600/£1,430 = 0.42. Using the consolidation method, long-term debt to equity = long-term debt/equity = £1,000/£1,750 = 0.57. Equity includes the £320 noncontrolling interest under either consolidation. It does not matter if the full or partial goodwill method is used since there is no goodwill.", "ko": "Equity method: 자회사 부채 미포함 → 600/1,430 = 0.42. 연결: 부채 1,000(600+400), 자본 1,750(NCI 320 포함) → 0.57. 초과 지급액은 전부 licenses에 배분되어 goodwill이 없으므로 full/partial 차이도 없습니다.", "trap": "연결은 NCI 덕에 자본이 늘지만 자회사 부채 100%가 들어와 D/E는 오히려 커집니다.", "f": "", "why": {"B": "연결 시 Boswell 부채 400이 합산되어 LTD 1,000/자본 1,750 = 0.57로 더 높습니다.", "C": "Goodwill이 없어 full/partial 결과가 같고, 둘 다 equity method보다 D/E가 높습니다."}, "orig": "ECO Module 1 Q30"}, {"id": "ECO-M1-Q33", "src": "ECO 오답", "module": 1, "tag": "Equity vs Consolidation – ROE(기초자본)", "vig": 3, "stem": "Based on Byron’s forecast, NinMount’s 2019 return on beginning equity most likely will be the same under:", "opts": {"A": "either of the consolidations, but different under the equity method.", "B": "the equity method, consolidation with full goodwill, and consolidation with partial goodwill.", "C": "none of the equity method, consolidation with full goodwill, or consolidation with partial goodwill."}, "ans": "A", "en": "A is correct. Net income attributable to shareholders of the parent is the same using any of the choices. Beginning equity under the equity method is £1,430. Under either of the consolidations, beginning equity is £1,750 since it includes the £320 noncontrolling interest. Return on beginning equity is highest under the equity method.", "ko": "지배주주 귀속 NI는 세 방법 모두 동일. 분모: equity method 1,430, 연결(full/partial)은 NCI 320 포함 1,750. Goodwill이 0이라 full=partial → 두 연결은 같고 equity method만 다름(더 높음).", "trap": "'NI가 같으니 ROE도 같다'(B) — 분모에 NCI가 포함되는지 꼭 확인하세요.", "f": "", "why": {"B": "NI는 같아도 분모(기초자본)가 다릅니다. 연결은 NCI 320이 자본에 포함되어 1,750, equity method는 1,430입니다.", "C": "Goodwill이 0이므로 full과 partial의 자본(NCI)은 같습니다 → 두 연결 방법의 ROE는 동일합니다."}, "orig": "ECO Module 1 Q33"}, {"id": "ECO-M1-Q34", "src": "ECO 오답", "module": 1, "tag": "Equity vs Consolidation – Asset turnover", "vig": 3, "stem": "Based on Byron’s forecast, NinMount’s 2019 total asset turnover ratio on beginning assets under the equity method is most likely:", "opts": {"A": "lower than if the results are reported using consolidation.", "B": "the same as if the results are reported using consolidation.", "C": "higher than if the results are reported using consolidation."}, "ans": "A", "en": "A is correct. Using the equity method, Total asset turnover = Net sales/Beginning total assets = £950/£2,140 = 0.444. Total asset turnover on beginning assets using consolidation = £1,460/£2,950 = 0.495. Under consolidation, Assets = £2,140 − 320 + 1,070 + 60 = £2,950. Therefore, total asset turnover is lowest using the equity method.", "ko": "Equity method: 950/2,140 = 0.444. 연결: 매출 1,460, 자산 2,140 − 320 + 1,070 + 60 = 2,950 → 0.495. 이 문제에서는 연결 시 매출 증가 비율이 자산 증가 비율보다 커서 equity method의 회전율이 더 낮습니다.", "trap": "'연결하면 자산이 커지니 회전율은 항상 낮아진다'는 직관에 의존하지 말고 계산으로 확인하세요.", "f": "", "why": {"B": "분자(매출)와 분모(자산)가 모두 바뀌므로 같을 수 없습니다: 0.444 vs 0.495.", "C": "직관과 달리 이 사례에서는 연결 회전율(1,460/2,950 = 0.495)이 equity method(950/2,140 = 0.444)보다 높습니다."}, "orig": "ECO Module 1 Q34"}, {"id": "ECO-M1-Q39", "src": "ECO 관련유형", "module": 1, "tag": "Equity method 판단 – 이사회 의석", "vig": 4, "stem": "In the discussion about using the equity method to account for Bardem’s purchase of Ariana, which statement is most accurate? The statement by:", "opts": {"A": "Domingues.", "B": "Casado concerning joint ventures.", "C": "Casado concerning board of directors’ positions."}, "ans": "A", "en": "Correct. Domingues’ statement that Bardem will be required to use the equity method is accurate. The equity method of accounting is required when an investor holds 20% to 50% of the voting rights of an associate unless circumstances clearly demonstrate that the investor cannot exercise significant influence. Holding a seat on the board is a factor to consider, but is not required to demonstrate influence.", "ko": "20~50% 의결권 보유 시, 유의적 영향력이 없다는 반증이 없는 한 equity method. 이사회 의석은 고려요소일 뿐 필수 요건이 아닙니다.", "trap": "'이사회 의석이 있어야 equity method' 함정.", "f": "", "why": {"B": "Incorrect. Although the equity method is required for joint ventures, it is also required for investments in associates.", "C": "Incorrect. Representation on the board is one way of exerting influence, but there are other ways that influence can be evidenced."}, "orig": "ECO Module 1 Q39"}, {"id": "ECO-M1-Q40", "src": "ECO 관련유형", "module": 1, "tag": "Equity method goodwill (FV 기준)", "vig": 4, "stem": "If Bardem does use the equity method of accounting for its purchase of Ariana, using Exhibit 1, the value of goodwill, in millions, arising from the purchase is closest to:", "opts": {"A": "€6.25.", "B": "€15.00.", "C": "€21.25."}, "ans": "A", "en": "Correct. Bardem’s purchase price for Ariana will include goodwill of €6.25 per the calculation below. Under the equity method the goodwill is included in the investment amount on Bardem’s balance sheet.\nCost of the acquisition (€ millions)\t \t80.00\nLess:\nFair value of net identifiable assets\t295\nBardem’s share thereof\t25%\n295 × 25%\t \t73.75\nGoodwill\t \t6.25", "ko": "Goodwill = 80 − 25% × 순자산 FV(295) = 80 − 73.75 = 6.25. Equity method에서는 goodwill이 투자 장부가에 포함됩니다.", "trap": "BV(235) 기준으로 계산하면 21.25.", "f": "Goodwill = Cost − %×FV of net identifiable assets", "why": {"B": "Incorrect. It uses the amount attributable to increase of fair value over book value of net assets, multiplied by proportionate share: (295,000 – 235,000) × 0.25 = 60,000 × 0.25 = €15,000.", "C": "Incorrect. This is the value if they use the BV of Ariana’s net assets: 80 – (0.25 × 235) = 21.25."}, "orig": "ECO Module 1 Q40"}, {"id": "ECO-M1-Q41", "src": "ECO 오답", "module": 1, "tag": "Equity method 투자 손상", "vig": 4, "stem": "Which of Casado’s three statements regarding the potential impairment of the investment in Ariana is most accurate? Statement:", "opts": {"A": "1", "B": "2", "C": "3"}, "ans": "B", "en": "Correct. Both IFRS and US GAAP require that impairment losses on equity method investments be recognized in the income statement.", "ko": "Equity method 투자의 goodwill은 투자 장부가에 포함되어 있어 별도로 손상검사하지 않고 투자 전체를 검사합니다. 손상차손은 IFRS·US GAAP 모두 I/S 인식(진술 2 정답). 'goodwill 초과 손상을 비현금자산에 pro-rata 배분'은 사업결합 CGU 규칙입니다.", "trap": "사업결합(CGU) goodwill 손상 규칙을 equity method 투자에 섞는 함정.", "f": "", "why": {"A": "Incorrect. IFRS includes goodwill in the carrying value of the investment, so it is not separately tested for impairment.", "C": "Incorrect. Impairment losses exceeding goodwill are allocated pro-rata to the unit’s non-cash assets."}, "orig": "ECO Module 1 Q41"}, {"id": "ECO-M1-Q42", "src": "ECO 오답", "module": 1, "tag": "SPE 증권화 – 연결 효과", "vig": 4, "stem": "If Bardem creates a special purpose entity rather than borrowing against its receivables, which of Domingues’ comments is most accurate? Comment:", "opts": {"A": "1", "B": "2", "C": "3"}, "ans": "A", "en": "Correct. Bardem’s cost of borrowing through the SPE is likely to decrease, because the SPE is bankruptcy remote from Bardem, and the lenders will have a direct claim on the receivables, thus allowing the SPE to borrow at preferred rates.", "ko": "SPE는 bankruptcy remote라 대출자가 채권에 직접 청구권 → 차입비용 하락(코멘트 1 정답). 그러나 통제하므로 연결 → 연결 B/S는 채권 담보차입과 동일 → 유동자산 증가·비율 개선 효과 없음.", "trap": "Parent-only 장부의 변화(AR↓, 현금↑)를 연결 재무제표 효과로 착각하는 함정.", "f": "", "why": {"B": "Incorrect. Bardem’s accounts receivable will decrease by €75M, while its cash will increase by €70M (€75M cash from the sale of receivables less €5M to set up the SPE). After consolidation, those changes are reversed and the consolidated balance sheet will be identical to the balance sheet under receivables borrowing.", "C": "Incorrect because both IFRS and US GAAP will require the SPE to be consolidated into Bardem’s balance sheet. The result is that the consolidated balance sheet will be identical to the balance sheet under receivables borrowing, and there will be no change in the ratios."}, "orig": "ECO Module 1 Q42"}, {"id": "ECO-M1-Q43", "src": "ECO 오답", "module": 1, "tag": "FVPL 투자수익", "vig": 5, "stem": "For the current year, Ernst reported pre-tax income from Astrid in the amount of:", "opts": {"A": "€4 million.", "B": "€8 million.", "C": "€11 million."}, "ans": "C", "en": "Correct because income earned from investments accounted for under the FVPL method includes both dividend income as well as any gains or losses (realized or unrealized) from holding the investment shares during the accounting measurement period. For the current year, Astrid received €4 million in dividend income (€40 million × 10%) plus €7 million in unrealized holding gains (€970 million year –end market value × 10% = €97 million valuation for Ernst's shares in Astrid at year-end. Then, €97 million – €90 million beginning of the year market value for Ernst's shares in Astrid = €7 million unrealized gain).", "ko": "FVPL 수익 = 배당 + 실현·미실현 평가손익. 배당 10%×40 = 4, 평가이익 97 − 90 = 7 → 11.", "trap": "4 = FVOCI(배당만 P&L), 8 = equity method(지분이익) 답입니다.", "f": "FVPL income = Dividends + ΔFair value", "why": {"A": "Incorrect because this is only the dividend income from Astrid. This would be a correct answer if Ernst accounted for Astrid by using the fair value through other comprehensive income (FVOCI) method. Under FVOCI, any unrealized gains or losses bypass the income statement and are reported as other comprehensive income.", "B": "Incorrect because €8 million would only be correct if Ernst had significant influence over Astrid and thereby used the equity method of accounting (reported pre-tax income of €80 million × 10%)."}, "orig": "ECO Module 1 Q43"}, {"id": "ECO-M1-Q44", "src": "ECO 오답", "module": 1, "tag": "Equity method – 초과취득가 상각", "vig": 5, "stem": "At the end of the current year, Ernst's investment in Balto has a recorded balance of:", "opts": {"A": "€523 million.", "B": "€525 million.", "C": "€533 million."}, "ans": "A", "en": "Correct because under the equity method of accounting the investment balance in an associate at the end of an accounting period is determined by adding to the beginning balance, the proportionate amount of reported investee income earned (which is then adjusted for any amortization of excess purchase price that is attributable to tangible and identifiable intangible assets), less the  proportionate amount of dividends received from the associate. Accordingly, for the investment in Balto, the proportionate amount of income earned is €33 million (€140 million × 25% = €35 million less the proportionate amount of additional depreciation expense from the undervalued equipment, or [€40 million ÷ 5 years] × 25% = €2 million). The dividends received for the investment in Balto were €10 million (€40 million × 25%). Therefore, the investment balance in Balto at the end of the current year is €523 million (€500 million + €33 million – €10 million).", "ko": "500 + 지분이익(25%×140 = 35) − 추가 감가상각(40/5×25% = 2) − 배당(25%×40 = 10) = 523.", "trap": "배당은 수익이 아니라 투자계정 차감입니다(533 함정). 저평가 설비의 추가 감가상각 누락 시 525.", "f": "Investment = Cost + %×NI − %×(FV−BV)/n − %×Div", "why": {"B": "Incorrect because the additional depreciation expense for the undervalued equipment was improperly omitted in calculating the investment income and the year-end investment balance in Balto (€500 million + €35 million – €10 million = €525 million).", "C": "Incorrect because the dividends received were not properly deducted from the investment account balance (€500 million + €33 million). Under the equity method of accounting, any dividends received from an associate are considered a reduction in the investment account."}, "orig": "ECO Module 1 Q44"}, {"id": "ECO-M1-Q45", "src": "ECO 오답", "module": 1, "tag": "Full vs Partial goodwill (US GAAP vs IFRS)", "vig": 5, "stem": "If Ernst had presented its consolidated statements for Cordeau in the same manner as its primary competitor, it would have a higher:", "opts": {"A": "return on assets for the current year.", "B": "total equity balance for the current year.", "C": "total asset turnover ratio for the current year."}, "ans": "B", "en": "Correct because under US GAAP, the full goodwill method must be applied, whereas under IFRS, either the partial or the full goodwill may be elected.\nAccordingly, if Ernst had used the full goodwill method, the value of the non-controlling interest (NCI) would be equal to the non-controlling interest’s proportionate share of the subsidiary’s fair value. Therefore, the NCI under this method reflects a proportionate claim of the goodwill recognized as an asset on the balance sheet.\nUnder the partial goodwill method, the value of the NCI equals the non-controlling interest’s proportionate share of the fair value of the subsidiary’s identifiable net assets. Therefore, under this method, the NCI does not reflect a claim on the goodwill recognized as an asset on the balance sheet.\nAs a result, NCI under the full goodwill method is greater than under the partial goodwill method. When added to the equity of the parent, the consolidated total equity balance under the full goodwill method would be higher than if the partial approach were used.", "ko": "US GAAP은 full goodwill만 허용. Full은 NCI를 공정가치로 측정 → NCI↑ → 총자본↑. Goodwill(자산)도 커져 ROA·자산회전율은 낮아지고 NI는 동일합니다.", "trap": "Full goodwill = 자산과 자본이 함께 증가 → 자산이 분모인 비율은 하락.", "f": "", "why": {"A": "Incorrect because the return on assets (Net income ÷ Average total assets) would be lower since average total assets would be higher under the full goodwill method. Net income is unaffected by the choice between the goodwill methods since goodwill is not amortized.", "C": "Incorrect because the total asset turnover ratio (Total revenue ÷ Total average assets) would be lower since average total assets would be higher under the full goodwill method. Total revenue is unaffected by the choice between the goodwill methods."}, "orig": "ECO Module 1 Q45"}, {"id": "ECO-M1-Q46", "src": "ECO 오답", "module": 1, "tag": "주식 발행 인수 – 부채비율", "vig": 5, "stem": "Upon acquiring a controlling ownership interest in Cordeau on 1 January, Ernst's pre-consolidation debt-to-assets ratio:", "opts": {"A": "decreased.", "B": "remained unchanged.", "C": "increased."}, "ans": "A", "en": "Correct because total assets increased by €1,800 million for the pre-consolidation investment account balance in Cordeau (that is, the fair value of the net assets that Ernst paid for). Shareholders' equity also increased by €1,800 million because of the issuance of common shares to pay for the 75% ownership interest in Cordeau. The debt-to-assets ratio (Total debt ÷ Total assets) therefore decreased since total assets increased and total debt was unaffected.", "ko": "주식 발행으로 지급: (연결 전) 투자자산 +1,800, 자본 +1,800, 부채 불변 → 부채/자산 하락.", "trap": "현금 지급을 가정하면 '불변'이 됩니다. 지급 수단(주식 vs 현금)을 반드시 확인하세요.", "f": "", "why": {"B": "Incorrect because this response assumes that the acquisition was made with cash (a typical form of payment for an acquisition). Under this scenario, total assets are increased by the €1,800 million pre-consolidation investment balance in Cordeau, but are then simultaneously decreased by the €1,800 cash payment to acquire the interest in Cordeau. The net effect on total assets is zero and the debt-to-assets ratio would then be unchanged.", "C": "Incorrect because the debt-to-assets ratio decreased. This response might occur if it is assumed that a €1,800 million cash payment was made to acquire the 75% ownership interest in Cordeau (thus decreasing total assets), but then forgetting that total assets are simultaneously increased by €1,800 million on Ernst's balance sheet for its pre-consolidation investment balance in Cordeau."}, "orig": "ECO Module 1 Q46"}, {"id": "ECO-M1-Q48", "src": "ECO 오답", "module": 1, "tag": "Acquisition method – 식별가능 무형자산", "vig": 6, "stem": "Before the calculation of amortization expense, the increase in CCCL’s intangible assets (in thousands) arising from the 2016 acquisition of MM is closest to:", "opts": {"A": "$2,500.", "B": "$4,500.", "C": "$7,500."}, "ans": "C", "en": "Correct. CCCL acquired 100% of MM, therefore under IFRS it would use the acquisition method to account for the acquisition and the preparation of the consolidated financial statements. Under the acquisition method, CCCL would recognize the fair value of all of MM’s identifiable tangible and intangible assets regardless of whether or not they were recognized on MM’s balance sheet. Therefore, they would have added both the broadcast licenses and the brand name at fair value: $5,500 + 2,000 = $7,500.", "ko": "Acquisition method는 피취득사의 식별가능 무형자산을, 피취득사 장부 인식 여부와 무관하게 공정가치로 인식합니다: licenses 5,500 + brand 2,000 = 7,500.", "trap": "장부가 2,500 사용 또는 미인식 brand 누락이 대표 함정입니다.", "f": "", "why": {"A": "Incorrect. It is only the $2,500 for the broadcast license recognized by MM. It ignores the unrecognized brand name", "B": "Incorrect. It is the broadcast license at BV and the brand name at FV. The error is not revaluing the existing asset."}, "orig": "ECO Module 1 Q48"}, {"id": "ECO-M1-Q49", "src": "ECO 오답", "module": 1, "tag": "IFRS 9 분류 – Amortized cost 요건", "vig": 7, "stem": "The least appropriate classification for the investment in the Alme bonds is:", "opts": {"A": "amortized cost.", "B": "fair value through profit and loss.", "C": "fair value through other comprehensive income."}, "ans": "A", "en": "Correct. Investments in a bond can be classified as amortized cost if it meets the two criteria; business model test and cash flow characteristic test. But if the asset may be sold prior to collecting all the contractual cash flows, as is Dagmar’s intent, it should be measured using one of the two fair value methods.", "ko": "Amortized cost 요건: ① business model = 계약현금흐름 수취(hold to collect) ② 현금흐름 = 원리금만(SPPI). 유동성 필요 시 매각 의도가 있으면 hold-to-collect가 아니므로 amortized cost가 가장 부적절, FVOCI·FVPL은 가능.", "trap": "'least appropriate' — 가능한 분류(FVPL, FVOCI)를 고르면 오답.", "f": "", "why": {"B": "Incorrect. Because Dagmar’s intent is to sell the asset prior to collecting all the contractual cash flows if it requires liquidity, the bond may be measured at Fair value through profit and loss.", "C": "Incorrect. Because Dagmar’s intent is to sell the asset prior to collecting all the contractual cash flows if it requires liquidity the bond it may be measured at Fair value through other comprehensive income."}, "orig": "ECO Module 1 Q49"}, {"id": "ECO-M1-Q52", "src": "ECO 오답", "module": 1, "tag": "IFRS 9 재분류", "vig": 7, "stem": "Christoph’s comments about reclassifying the Bergenfeld bonds are best described as:", "opts": {"A": "both correct.", "B": "correct with respect to the effects on prior periods.", "C": "correct with respect to the rationale for reclassification."}, "ans": "B", "en": "Correct. Christoph is correct with respect to his comments on the restatement of prior periods. When financial assets are reclassified there is no restatement of prior periods at the reclassification date.", "ko": "채무상품 재분류는 사업모형이 영업에 중대한 영향을 줄 정도로 바뀐 경우에만 허용(이익을 늘리기 위한 재분류 불가). 재분류는 전진적용 — 과거기간 재작성 없음.", "trap": "진술의 한 부분(재작성 불필요)이 맞다고 다른 부분(재분류 근거)까지 맞는 것은 아님.", "f": "", "why": {"A": "Incorrect. Christoph is correct with respect to the restatement or prior periods, but not with respect to the rationale for reclassification. Reclassification of debt instruments is only permitted if the business model for the financial assets (objective for holding the financial assets) has changed in a way that significantly affects operations.", "C": "Incorrect. Christoph is not correct with respect to the rationale for reclassification. Reclassification of debt instruments is only permitted if the business model for the financial assets (objective for holding the financial assets) has changed in a way that significantly affects operations."}, "orig": "ECO Module 1 Q52"}, {"id": "ECO-M1-Q53", "src": "ECO 오답", "module": 1, "tag": "Bargain purchase (negative goodwill)", "vig": 8, "stem": "Prior to translating the subsidiary’s financial statements, Nakiska’s allocation of the Val Blanc acquisition purchase price most likely resulted in which of the following for Nation?", "opts": {"A": "A gain of €1,500", "B": "Goodwill of €8,000", "C": "An increase in retained earnings of €9,500"}, "ans": "A", "en": "Correct. The acquisition was a bargain purchase for Nation:\nPrice paid for 100%\t€28 million\nFair value of the net assets (€ thousands)\nShare capital + Retained earnings = 20,000 + 9,500\t29,500\nNegative goodwill\t–€1,500\nNegative goodwill is recognized immediately as a gain in profit or loss.", "ko": "순자산 공정가치 = 20,000 + 9,500 = 29,500 > 지급액 28,000 → 염가매수 −1,500은 즉시 P&L 이익(gain).", "trap": "share capital만 순자산으로 보면 goodwill 8,000(오답). 피취득사의 취득 전 이익잉여금은 연결 이익잉여금으로 넘어오지 않습니다.", "f": "Goodwill = 지급액 − 식별가능 순자산 FV (음수면 즉시 gain)", "why": {"B": "Incorrect. It uses only the share capital for the net book value acquired and forgets to include retained earnings: 28 – 20 = 8 goodwill.", "C": "Incorrect. It is the retained earnings of Val Blanc at acquisition, but those retained earnings do not carry forward on the consolidated financial statements—only earnings after acquisition accrue to the parent company."}, "orig": "ECO Module 1 Q53"}, {"id": "ECO-M1-Q54", "src": "ECO 오답", "module": 1, "tag": "연결 – 내부거래 제거", "vig": 9, "stem": "The best estimate of the proportion of Anart’s sales that is reflected in Trana’s consolidated income statement is:", "opts": {"A": "0%.", "B": "80%.", "C": "100%."}, "ans": "A", "en": "Correct. Trana owns 80% of Anart. Because this is a controlling interest, Trana would consolidate Anart into the group financial statements. Even though Trana owns only 80%, consolidation requires the inclusion of 100% of the subsidiary’s assets, liabilities, revenues, and expenses (excepting intercompany sales, which are eliminated on consolidation to prevent double counting). Therefore, because Anart sells all of its production to Trana and Trana’s other subsidiaries, none of Anart’s sales would be included in the consolidated income statement.", "ko": "80% 지배 → 자산·부채·수익·비용 100% 연결하되 내부거래는 전액 제거. Anart 매출은 전부 그룹 내 판매 → 연결 손익계산서 반영 비율 0%.", "trap": "지분율(80%)이나 100% 연결만 보고 내부거래 제거를 잊는 함정.", "f": "", "why": {"B": "Incorrect. Even though Trana only owns 80%, consolidation requires 100% inclusion of the subsidiary’s assets, liabilities, revenues, and expenses. Intercompany sales (here 100%), however, must be eliminated.", "C": "Incorrect. Even though Trana only owns 80%, consolidation requires 100% inclusion of the subsidiary’s assets, liabilities, revenues, and expenses. Intercompany sales (here 100%), however, must be eliminated"}, "orig": "ECO Module 1 Q54"}, {"id": "ECO-M1-Q55", "src": "ECO 관련유형", "module": 1, "tag": "JV – IFRS·US GAAP 모두 equity method", "vig": null, "stem": "A US company reporting under US GAAP forms a joint venture with a European company reporting under IFRS. The two companies have joint control of this venture. When reporting the venture's results, it is most likely that:", "opts": {"A": "each company will present its proportionate share of each financial statement line item.", "B": "each company will present a single line item on its income statement and balance sheet.", "C": "the US company will present a single line item and the European company will present its proportionate share of each line item."}, "ans": "B", "en": "Correct because both IFRS and US GAAP require the equity method of accounting for joint ventures. Only under rare circumstances will joint ventures be allowed to use proportionate consolidation under IFRS and US GAAP. The equity method is often referred to as one-line consolidation because the investor’s proportionate ownership interest in the assets and liabilities of the investee is disclosed as a single line item (net assets) on its balance sheet, and the investor’s share of the revenues and expenses of the investee is disclosed as a single line item on its income statement.", "ko": "IFRS·US GAAP 모두 JV는 equity method(한 줄 표시). Proportionate consolidation은 극히 예외적.", "trap": "IFRS는 proportionate를 쓴다는 오래된 지식 함정.", "f": "", "why": {"A": "Incorrect because both companies will present the results as a single line item on the balance sheet and income statement.", "C": "Incorrect because both companies will present the results as a single line item on the balance sheet and income statement."}, "orig": "ECO Module 1 Q55"}, {"id": "ECO-M1-Q56", "src": "ECO 관련유형", "module": 1, "tag": "IFRS 9 재분류 – 채무상품만", "vig": null, "stem": "A company reporting under IFRS initially classified its holdings of debt and equity instruments as fair value through profit and loss. The company's business model has changed, and if it bought the same securities today, it would classify them as fair value through other comprehensive income. The company is permitted to reclassify:", "opts": {"A": "debt instruments only.", "B": "equity instruments only.", "C": "both debt instruments and equity instruments."}, "ans": "A", "en": "Correct because reclassification of debt instruments is only permitted if the business model for the financial assets (objective for holding the financial assets) has changed in a way that significantly affects operations. Changes to the business model will require judgment and are expected to be very infrequent.", "ko": "사업모형 변경 시 재분류는 채무상품만 가능. 지분상품은 재분류 불가.", "trap": "", "f": "", "why": {"B": "Incorrect because under IFRS 9, the reclassification of equity instruments is not permitted because an entity’s initial classification of FVPL and FVOCI is irrevocable.", "C": "Incorrect because under IFRS 9, the reclassification of equity instruments is not permitted because an entity’s initial classification of FVPL and FVOCI is irrevocable. Reclassification of debt instruments is only permitted if the business model for the financial assets (objective for holding the financial assets) has changed in a way that significantly affects operations. Changes to the business model will require judgment and are expected to be very infrequent."}, "orig": "ECO Module 1 Q56"}, {"id": "ECO-M1-Q58", "src": "ECO 오답", "module": 1, "tag": "Partial goodwill (IFRS) vs US GAAP", "vig": null, "stem": "Compared to reporting a business consolidation under US GAAP, which of the following will be higher if reporting under IFRS using the partial goodwill method?", "opts": {"A": "Return on assets", "B": "Noncontrolling interests", "C": "Consolidated net income"}, "ans": "A", "en": "Correct because the partial goodwill method will result in less goodwill being recognized and reported, and lower total asset value being reported. Since income is the same under either method, the partial goodwill method will result in a higher return on assets ratio compared to the full goodwill method.", "ko": "Partial: goodwill↓ → 총자산↓, NCI↓. NI는 동일 → ROA는 partial이 더 높음. NCI는 US GAAP(full)이 더 큼.", "trap": "NCI 방향 혼동 — partial이 NCI가 작습니다.", "f": "", "why": {"B": "Incorrect because under IFRS, the parent can measure the non-controlling interest at either its fair value (full goodwill method) or at the non-controlling interest’s proportionate share of the acquiree’s identifiable net assets (partial goodwill method). Under US GAAP, the parent must use the full goodwill method and measure the non-controlling interest at fair value.  This will result in a lower reported value of noncontrolling interests when reporting under IFRS than for US GAAP.", "C": "Incorrect because income will be the same under both reporting methods because the depreciation methods will be the same, leading to no difference in income."}, "orig": "ECO Module 1 Q58"}, {"id": "SCH-M1-01", "src": "Schweser MQ", "module": 1, "tag": "투자 분류 – 유의적 영향력 반증", "vig": null, "stem": "Alpha Co. owns 35% of the voting shares of Beta Inc. Alpha has repeatedly failed to obtain any seat on Beta's board, and Beta's majority shareholder has refused all of Alpha's attempts to participate in policy decisions. Alpha's interest in Beta is most likely accounted for as a(n):", "opts": {"A": "investment in financial assets.", "B": "investment in associates.", "C": "business combination."}, "ans": "A", "en": "Ownership of 20%–50% normally indicates significant influence, but the presumption is rebutted when the investor clearly cannot exercise influence (e.g., unable to obtain board representation). The interest is then treated as an investment in financial assets.", "ko": "20~50%는 유의적 영향력 '추정'일 뿐입니다. 영향력을 행사할 수 없음이 명백하면(이사회 진입 실패·정책 참여 거부) 금융자산 투자로 분류. 반대로 Bardem 문제처럼 의석이 없어도 영향력이 있으면 equity method — 핵심은 '실질적 영향력'.", "trap": "지분율 숫자만 보고 associate로 분류하는 함정.", "f": "", "why": {"B": "Associate 분류는 유의적 영향력이 있어야 합니다. 이사회 진입 실패·정책 참여 거부로 영향력이 없음이 명백하므로 추정이 반증됩니다.", "C": "35%로는 지배력이 없고, 지배를 시사하는 사실도 없습니다."}, "orig": "Schweser MQ 7.1 변형"}, {"id": "SCH-M1-02", "src": "Schweser MQ", "module": 1, "tag": "Equity method – 기말 장부가", "vig": null, "stem": "On 1 January, Delta Corp. acquired 30% of Echo Inc. for $2,000,000 (no excess of cost over book value). During the year, Echo reported net income of $600,000 and paid dividends of $200,000. Delta has significant influence. At year-end, Delta's investment in Echo is reported at:", "opts": {"A": "$2,000,000.", "B": "$2,120,000.", "C": "$2,180,000."}, "ans": "B", "en": "Equity method: $2,000,000 + 0.30 × ($600,000 − $200,000) = $2,120,000. Dividends reduce the investment account.", "ko": "장부가 = 취득가 + 지분×NI − 지분×배당 = 2,000,000 + 180,000 − 60,000 = 2,120,000.", "trap": "배당을 차감하지 않으면 2,180,000 — 배당은 투자의 회수입니다.", "f": "Investment = Cost + %×(NI − Div)", "why": {"A": "취득가 그대로 두는 것은 원가법 사고 — equity method는 지분이익을 더하고 배당을 뺍니다.", "C": "배당(30% × 200,000 = 60,000) 차감을 빠뜨린 값입니다."}, "orig": "Schweser MQ 7.3 변형"}, {"id": "SCH-M1-03", "src": "Schweser MQ", "module": 1, "tag": "Equity method – 투자이익 vs 현금", "vig": null, "stem": "Using the same facts (Delta owns 30% of Echo; Echo NI $600,000, dividends $200,000), the investment income Delta reports on its income statement for the year is:", "opts": {"A": "$60,000.", "B": "$120,000.", "C": "$180,000."}, "ans": "C", "en": "Under the equity method, investment income = 30% × $600,000 = $180,000. The $60,000 dividend is a cash flow that reduces the investment account, not income.", "ko": "Equity method 이익 = 지분 × NI = 180,000. 배당 60,000은 현금유입(투자계정 차감)이지 이익이 아닙니다.", "trap": "60,000(배당=FVOCI식 사고), 120,000(NI−배당 혼동) 함정.", "f": "", "why": {"A": "60,000은 배당 수령액(현금)입니다. Equity method에서 배당은 이익이 아닙니다.", "B": "120,000은 지분 × (NI − 배당) — 투자계정 '순증가액'이지 이익이 아닙니다."}, "orig": "Schweser MQ 7.3 변형"}, {"id": "SCH-M1-04", "src": "Schweser MQ", "module": 1, "tag": "Equity vs Consolidation – NPM", "vig": null, "stem": "A parent accounts for its investee using the equity method and reports a net profit margin of 12%. An analyst estimates the parent's own (stand-alone) net profit margin at 7% and the investee's net profit margin at 9%. If the investee were consolidated, the parent's net profit margin would most likely be:", "opts": {"A": "less than 7%.", "B": "between 7% and 12%.", "C": "greater than 12%."}, "ans": "B", "en": "Equity method includes the investee's profit in net income but none of its revenue, so it typically yields the highest net profit margin. Consolidation adds the investee's revenue, producing a margin between the two entities' margins.", "ko": "Equity method는 분자(이익)에는 지분이익이 들어가지만 분모(매출)에는 투자사 매출이 없어 NPM이 가장 높게 나옵니다. 연결 시 매출이 합산되어 두 회사 마진 사이 수준으로 떨어집니다.", "trap": "NI는 같아도 매출이 다르다는 점을 놓치는 함정.", "f": "", "why": {"A": "두 회사 마진(7%, 9%)이 모두 7% 이상이므로 합친 마진이 7% 미만이 될 수 없습니다.", "C": "Equity method가 매출 없이 이익만 더해 마진이 가장 높습니다. 연결은 매출이 합산되어 마진이 낮아집니다."}, "orig": "Schweser MQ 7.9 변형"}, {"id": "SCH-M1-05", "src": "Schweser MQ", "module": 1, "tag": "IFRS goodwill 손상검사", "vig": null, "stem": "A company reporting under IFRS recently completed an acquisition using the acquisition method. Which statement about the resulting goodwill is most accurate?", "opts": {"A": "Goodwill is amortized over a maximum of 20 years.", "B": "Goodwill is tested annually by comparing the carrying amount of the cash-generating unit with its recoverable amount.", "C": "Goodwill is tested annually to ensure that the fair value of the reporting unit does not exceed its carrying value."}, "ans": "B", "en": "Under IFRS, goodwill is not amortized; it is tested for impairment at least annually at the cash-generating unit level. An impairment exists when the carrying amount of the CGU exceeds its recoverable amount (higher of fair value less costs to sell and value in use).", "ko": "IFRS: goodwill 상각 X, 매년 손상검사(CGU 장부가 > 회수가능액이면 손상). C는 방향이 반대(장부가가 공정가치를 넘으면 손상).", "trap": "C처럼 비교 방향을 뒤집은 선지 주의.", "f": "IFRS 손상차손 = CGU 장부가 − 회수가능액 (goodwill 먼저 감액 후 나머지 자산에 pro-rata)", "why": {"A": "IFRS(그리고 US GAAP 상장사)에서 goodwill은 상각하지 않습니다.", "C": "비교 방향이 반대입니다. '장부가가 회수가능액(공정가치)을 초과'할 때 손상입니다."}, "orig": "Schweser MQ 7.7 변형"}, {"id": "SCH-M1-06", "src": "변형", "module": 1, "tag": "FVOCI vs FVPL – EBT 영향 (변형)", "vig": 0, "stem": "Compared to Confabulated's reported 2018 earnings before taxes, if Cathay had been classified as FVPL instead of FVOCI, earnings before taxes (in € thousands) would have been:", "opts": {"A": "the same.", "B": "€1,000 lower.", "C": "€1,000 higher."}, "ans": "B", "en": "Cathay's market value fell from €38,000 to €37,000 in 2018. Under FVOCI the €1,000 unrealized loss goes to OCI; under FVPL it would be recognized in profit or loss, lowering EBT by €1,000. Interest income is unaffected (bought at par).", "ko": "Cathay 시가 38,000 → 37,000 (−1,000). FVOCI는 OCI, FVPL은 P&L → EBT €1,000 감소. Dumas 문제(+1,000)와 방향이 반대인 것에 주의.", "trap": "모든 평가손익이 '이익'이라고 가정하는 함정 — 해당 연도 시가 변동 방향을 확인.", "f": "", "why": {"A": "FVOCI → FVPL로 바꾸면 평가손익이 OCI에서 P&L로 이동하므로 EBT가 달라집니다.", "C": "Cathay 시가는 38,000 → 37,000으로 '하락' — 평가손실입니다."}, "orig": "ECO Confabulated 변형"}, {"id": "ECO-M2-Q4", "src": "ECO 오답", "module": 2, "tag": "DB plan – 현금흐름표", "vig": 10, "stem": "The cash outflow recognized by Kensington in cash flows from operating activities for the year ended 31 December 20X1 is closest to:", "opts": {"A": "228.", "B": "693.", "C": "1,322."}, "ans": "B", "en": "B is correct. Employers’ plan contributions are cash outflows in operating activities.", "ko": "회사의 실제 현금유출 = employer contributions(693, 영업활동). Benefits paid는 plan assets에서 지급되어 회사 현금흐름이 아니고, service cost는 비현금 비용입니다.", "trap": "1,322(benefits paid), 228(service cost) 선택 함정.", "f": "", "why": {"A": "228은 service cost — 비현금 발생 비용으로 현금흐름표 유출이 아닙니다.", "C": "1,322는 benefits paid — plan assets에서 지급되며 회사의 현금유출이 아닙니다."}, "orig": "ECO Module 2 Q4"}, {"id": "ECO-M2-Q5", "src": "ECO 관련유형", "module": 2, "tag": "Net pension liability 감소 이유", "vig": 10, "stem": "The amount recognized on the balance sheet decreased from 31 December 20X0 to 31 December 20X1 because:", "opts": {"A": "The sum of service cost and interest cost exceeded benefits paid.", "B": "the discount rate used in estimating the pension obligation exceeded the actual rate of return of plan assets for the year.", "C": "the sum of the actual return on plan assets and employer contributions exceeded the sum of service and interest cost on the benefit obligation."}, "ans": "C", "en": "C is correct. The net pension liability recognized on Kensington’s balance sheet decreased because the fair value of plan assets increased by more than the benefit obligation.\n\nA is incorrect. While it is true that the sum of service and interest costs exceeded benefits paid, benefits paid is deducted from both the benefit obligation and plan assets, so the relevant spread is between the sum of service and interest costs and the sum of return on plan assets and employer contributions.\n\nB is incorrect. The discount rate used in estimating the pension obligation was 5.48% and the actual rate of return on plan assets was 1,302/23,432 = 5.56%, 8 basis points higher, not lower.", "ko": "Benefits paid는 PBO와 plan assets 양쪽에서 빠짐. Funded status 변화의 핵심 = (실제수익 + 기여금) vs (service cost + interest cost). 1,302 + 693 > 228 + 1,557 → 순부채 감소.", "trap": "Benefits paid는 funded status에 중립입니다.", "f": "", "why": {"A": "사실이지만 원인이 아닙니다. Benefits paid는 PBO와 plan assets를 같은 금액 줄여 funded status에 중립입니다.", "B": "사실관계 오류: 할인율 5.48% < 실제수익률 5.56%(1,302/23,432)."}, "orig": "ECO Module 2 Q5"}, {"id": "ECO-M2-Q6", "src": "ECO 오답", "module": 2, "tag": "Net pension liability – EV→Equity", "vig": 10, "stem": "An analyst preparing a discounted cash flow model on 14 January 20X2 to value Kensington’s equity should deduct which of the following from the estimate of enterprise value to arrive at equity value?", "opts": {"A": "4,774", "B": "4,984", "C": "28,879"}, "ans": "A", "en": "A is correct. The analyst should deduct the net pension liability as of 31 December 20X1 from the estimate of enterprise value to arrive at equity value, as if it were debt.\n\nB is incorrect. This is the net pension liability from the beginning of 20X1.\n\nC is incorrect. 28,879 is the gross benefit obligation. Deducting this from enterprise value to arrive at equity value would ignore plan assets that are exclusively for the payment of benefits to plan beneficiaries.", "ko": "EV에서 equity로 갈 때 가장 최근(20X1 말) net pension liability(funded status = PBO − plan assets = 4,774)를 debt처럼 차감합니다.", "trap": "기초 값(4,984)이나 gross PBO(28,879, plan assets 무시)를 차감하는 함정.", "f": "", "why": {"B": "4,984는 20X1 기초 순부채입니다. 평가 시점(20X2 1월)에 가장 가까운 기말 값을 써야 합니다.", "C": "28,879는 gross PBO입니다. 급여 지급 전용인 plan assets를 무시하게 되어 부채를 과대 차감합니다."}, "orig": "ECO Module 2 Q6"}, {"id": "ECO-M2-Q7", "src": "ECO 오답", "module": 2, "tag": "할인율 하락 – Funded status", "vig": 10, "stem": "A 100 basis point decrease in investment grade corporate bond yields may affect Kensington’s plan funded status by less than the increase in the benefit obligation because:", "opts": {"A": "remeasurements from changes in assumptions are recognized in OCI, not in earnings.", "B": "a decrease in service cost will partially offset the increase.", "C": "the fair value of plan assets may simultaneously increase."}, "ans": "C", "en": "C is correct. A decrease in interest rates may result in an increase in the fair value of plan assets that offsets the increase in the benefit obligation from a lower discount rate, especially plan assets invested in longer-duration fixed-income securities.", "ko": "금리↓ → 할인율↓ → PBO↑. 동시에 plan assets 내 장기채 가격↑(duration 효과) → 자산 증가가 일부 상쇄 → funded status 악화폭 < PBO 증가폭.", "trap": "Remeasurement가 OCI로 간다는 것은 '어디에 기록되는가'일 뿐 funded status 크기와 무관합니다.", "f": "", "why": {"A": "OCI 인식은 '기록 위치'의 문제일 뿐 funded status(자산 − PBO) 크기를 바꾸지 않습니다.", "B": "할인율 하락은 보통 service cost를 증가시키며, 어쨌든 service cost는 funded status 변화 폭을 설명하지 못합니다."}, "orig": "ECO Module 2 Q7"}, {"id": "ECO-M2-Q8", "src": "ECO 오답", "module": 2, "tag": "IFRS service cost = current + past", "vig": 11, "stem": "The amount recognized by XYZ as operating expense on the income statement related to its DB plan for fiscal year 2024 is closest to:", "opts": {"A": "200.", "B": "320.", "C": "1,000."}, "ans": "B", "en": "B is correct. Service cost, comprising current and past service costs of 200 and 120, respectively, is recognized on the income statement as an operating expense.", "ko": "IFRS: service cost = current(200) + past(120) = 320, 전부 즉시 P&L 영업비용. Employer contribution 1,000은 현금 항목입니다.", "trap": "Past service cost를 빼먹는 실수 — IFRS는 즉시 비용화, US GAAP은 OCI 인식 후 상각.", "f": "IFRS P&L pension cost = Service cost(current + past) + Net interest", "why": {"A": "200은 current service cost만입니다. IFRS는 past service cost(120)도 즉시 P&L에 인식합니다.", "C": "1,000은 employer contribution(현금 납부액)으로 비용이 아닙니다."}, "orig": "ECO Module 2 Q8"}, {"id": "ECO-M2-Q10", "src": "ECO 오답", "module": 2, "tag": "IFRS pension cost 예측", "vig": 11, "stem": "An analyst is building a financial statement model for XYZ SA. The analyst assumes that service cost and the discount rate in FY2025 will be the same as in the previous year. The analyst’s estimate of pension cost recognized on the income statement in FY2025 is closest to:", "opts": {"A": "320.", "B": "404.", "C": "531."}, "ans": "C", "en": "C is correct. Pension costs recognized on the income statement comprise service cost and net interest expense/income. The analyst assumes service cost remains the same as in the previous year, or (200+120) = 320. Net interest expense/income is the product of the discount rate and the net pension liability/asset at the beginning of FY2025, or the end of FY2024, [(41,720-38,700) x 0.07] = 211. Summing these two components gives 531.", "ko": "IFRS P&L pension cost = service cost + net interest. Service cost 320 유지, net interest = 할인율 × 기초 net pension liability = 7% × (41,720 − 38,700) = 211 → 531.", "trap": "FY2025 기초 = FY2024 기말 잔액을 써야 합니다. Service cost만(320) 쓰면 오답.", "f": "Net interest = Discount rate × (PBO − Plan assets)기초", "why": {"A": "320은 service cost만입니다. IFRS pension cost에는 net interest(7% × 3,020 = 211)가 포함됩니다.", "B": "Net interest 계산이 틀렸습니다. 할인율 7% × FY2024 기말(= FY2025 기초) 순부채(41,720 − 38,700)를 사용합니다."}, "orig": "ECO Module 2 Q10"}, {"id": "ECO-M2-Q12", "src": "ECO 오답", "module": 2, "tag": "RSU 공정가치 – 변동성 무관", "vig": 11, "stem": "If XYZ SA also granted RSUs to employees in fiscal 2024, the decrease in XYZ SA’s share price volatility assumption would:", "opts": {"A": "increase the grant-date fair value of the RSUs.", "B": "decrease the grant-date fair value of the RSUs.", "C": "not affect the grant-date fair value of the RSUs."}, "ans": "C", "en": "C is correct. The grant-date fair value of an RSU is the share price, which may be adjusted for expected dividends. The volatility assumption is not relevant to the valuation of RSUs.", "ko": "RSU의 부여일 공정가치 = 부여일 주가(예상배당 조정 가능). 변동성은 옵션가격모형에만 쓰이는 입력값이라 RSU 가치에 영향 없음.", "trap": "옵션 논리(변동성↓ → 가치↓)를 RSU에 그대로 적용하는 함정.", "f": "", "why": {"A": "RSU 가치는 주가 기반 — 변동성은 입력값이 아닙니다.", "B": "옵션이라면 변동성↓ → 가치↓이지만, RSU에는 해당되지 않습니다."}, "orig": "ECO Module 2 Q12"}, {"id": "ECO-M2-Q13", "src": "ECO 오답", "module": 2, "tag": "RSU 보상비용 계산", "vig": 12, "stem": "The amount recognized as operating expense on SKI’s income statement related to its Equity Incentive Plan for the year ended 31 December 20X2 is closest to:", "opts": {"A": "SGD 51.4 million.", "B": "SGD 64.1 million.", "C": "SGD 123.1 million."}, "ans": "A", "en": "A is correct. The amount recognized as operating expense is the share-based compensation expense, which the product of 3,332,063 RSUs vested with a per-share grant-date fair value of SGD 19.25 less forfeitures of 442,181 with a per-share grant-date fair value of SGD 28.74. (3,332,063 x 19.25) – (442,181 x 28.74) = 51,433,931.", "ko": "ECO 해설 방식: 가득된 RSU × 부여일 FV − 몰수 RSU × 부여일 FV = 3,332,063×19.25 − 442,181×28.74 ≈ SGD 51.4m. 몰수는 발생 시 반영합니다.", "trap": "몰수 차감 누락(64.1m) 또는 부여분 기준 계산 함정.", "f": "SBC expense = Vested × grant-date FV − Forfeited × grant-date FV", "why": {"B": "64.1m은 가득분(3,332,063 × 19.25)만 계산하고 몰수분 차감을 빠뜨린 값입니다.", "C": "부여·가득 수량이나 단가를 잘못 조합한 값입니다. 가득분 − 몰수분, 각각 해당 부여일 FV를 사용합니다."}, "orig": "ECO Module 2 Q13"}, {"id": "ECO-M2-Q16", "src": "ECO 오답", "module": 2, "tag": "Tax windfall – IFRS vs US GAAP", "vig": 12, "stem": "If SKI reported under IFRS instead of US GAAP, its effective tax rate would likely be:", "opts": {"A": "lower.", "B": "higher.", "C": "the same."}, "ans": "B", "en": "B is correct. Excess tax benefits or tax windfalls related to share-based compensation are recognized as gains directly in equity under IFRS, not as reductions in income tax expense on the P&L under US GAAP.", "ko": "Tax windfall(정산일 주가 > 부여일 주가): US GAAP은 법인세비용 감소 → ETR↓. IFRS는 자본에 직접 반영 → ETR 영향 없음. 따라서 SKI가 IFRS를 쓰면 ETR이 더 높아집니다.", "trap": "방향을 거꾸로 기억하는 함정 — 'US GAAP = I/S, IFRS = Equity'.", "f": "", "why": {"A": "방향이 반대입니다. US GAAP의 windfall이 법인세비용을 낮추고 있었으므로 IFRS로 바꾸면 ETR이 올라갑니다.", "C": "IFRS는 windfall을 자본에 직접 반영하므로 ETR에서 그 효과가 빠져 달라집니다."}, "orig": "ECO Module 2 Q16"}, {"id": "ECO-M2-Q17", "src": "ECO 오답", "module": 2, "tag": "RSU 희석 – Treasury stock method", "vig": 12, "stem": "SKI reported basic shares outstanding of 270,400,000 and positive net income on its income statement for the year ended 31 December 20X2. Besides unvested RSUs, SKI had no other potentially dilutive securities outstanding. Assuming an average share price of SGD 71.50 for the year, diluted shares outstanding for the year ended 31 December 20X2 is closest to:", "opts": {"A": "273,284,585.", "B": "275,695,075.", "C": "279,341,928."}, "ans": "B", "en": "B is correct. Diluted shares outstanding is computed using the treasury stock method, where unvested RSUs are added to basic shares outstanding, net of assumed repurchases which is based on the average unrecognized share-based compensation expense and average prevailing market price for the shares.\n\nBasic shares outstanding:\t270,400,000\nPlus: Unvested RSUs of\t9,341,928\nMinus: Average unrecognized share-based compensation expense of (145.6 + 433.1 million)/2\n\n= 289.350 million / average share price of 71.50 =\t4,046,853\nDiluted shares outstanding:\t275,695,075", "ko": "Diluted shares = basic + 미가득 RSU − (평균 미인식 보상비용 ÷ 평균주가). 270.4m + 9.342m − (289.35m ÷ 71.50 = 4.047m) = 275.695m.", "trap": "TSM 차감 누락(279.3m) 또는 기말 미인식 비용만 사용하는 실수.", "f": "Dilutive shares = Unvested RSUs − Avg unrecognized SBC / Avg price", "why": {"A": "기말 미인식 비용(433.1m)만 사용한 값입니다. TSM은 '평균' 미인식 비용((145.6 + 433.1)/2)을 씁니다.", "C": "TSM 재매입 차감 없이 미가득 RSU 전체를 더한 값입니다."}, "orig": "ECO Module 2 Q17"}, {"id": "ECO-M2-Q19", "src": "ECO 관련유형", "module": 2, "tag": "SBC 예측 → 주식수 증가", "vig": 12, "stem": "An analyst is building a financial statement model for SKI and projects share-based compensation expense to be 10% of revenues next fiscal year. Based on the following assumptions, the analyst’s estimated basic share count for SKI will increase by how many shares next fiscal year?\nRevenues FY2025E = SGD 506 million\nWeighted-average grant-date fair value per share of vesting RSUs = SGD 46.36\nForfeitures = 0 shares (the analyst’s share-based compensation expense is net of forfeitures).", "opts": {"A": "1.1 million", "B": "1.3 million", "C": "10.9 million"}, "ans": "A", "en": "A is correct. Share-based compensation expense is estimated to be SGD 506 million x 0.10 = SGD 50.6 million. The expense is recognized upon vesting (which for RSUs is coincident with settlement). The number of shares issued and therefore increasing basic shares outstanding is SGD 50.6 million / SGD 46.36 = 1.1 million shares.", "ko": "SBC = 매출 506 × 10% = 50.6 → RSU는 가득 시 정산 → 발행주식 = 50.6 / 46.36 ≈ 1.1m주.", "trap": "", "f": "증가주식수 = SBC expense / 부여일 FV per share", "why": {"B": "계산 오류입니다. SBC 50.6m(= 506 × 10%)을 RSU 부여일 FV 46.36으로 나눕니다.", "C": "10.9m은 매출 506m 전체를 46.36으로 나눈 값 — 10%를 적용하지 않았습니다."}, "orig": "ECO Module 2 Q19"}, {"id": "ECO-M2-Q20", "src": "ECO 오답", "module": 2, "tag": "기대수익률 – PBO 무관", "vig": 13, "stem": "Compared to the 20X3 reported financial statements, if Terra Mercado had used the same expected long-term rate of return on plan assets assumption in 20X3 as it used in 20X1, its year-end 20X3 pension obligation would most likely have been:", "opts": {"A": "lower.", "B": "higher.", "C": "the same."}, "ans": "C", "en": "C is correct. The assumed long-term rate of return on plan assets is not a component used in calculating the pension obligation, so there would be no change. However, the long-term rate of return can affect the pension expense under US GAAP.", "ko": "Expected return on plan assets는 PBO 계산 입력값이 아닙니다(PBO: 할인율·임금상승률·사망률 등). US GAAP에서는 pension expense에만 영향을 줍니다.", "trap": "'수익률 가정이 바뀌면 부채도 바뀐다'는 함정.", "f": "", "why": {"A": "기대수익률은 PBO 계산에 들어가지 않습니다.", "B": "기대수익률은 PBO 계산에 들어가지 않습니다(US GAAP pension expense에만 영향)."}, "orig": "ECO Module 2 Q20"}, {"id": "ECO-M2-Q21", "src": "ECO 오답", "module": 2, "tag": "할인율 상승 효과", "vig": 13, "stem": "Compared to the reported 20X3 financial statements, if Terra Mercado had used the same discount rate it used in 20X1, it would have most likely reported lower:", "opts": {"A": "net income.", "B": "total liabilities.", "C": "cash flow from operating activities."}, "ans": "B", "en": "B is correct. A higher discount rate (5.38% instead of 4.85%) will reduce the present value of the pension obligation (liability). In most cases, a higher discount rate will decrease the interest cost component of the net periodic cost because the decrease in the obligation will more than offset the increase in the discount rate (except if the pension obligation is of short duration). Therefore, periodic pension cost would have been lower and reported net income higher. Cash flow from operating activities should not be affected by the change.", "ko": "20X1 할인율 5.38% > 20X3 4.85% → 할인율↑ → PBO↓ → 총부채↓. 대부분 interest cost도 감소 → 비용↓ → NI는 오히려 증가. CFO는 영향 없음.", "trap": "'할인율↑ → interest cost↑ → NI↓' 함정 — 부채 감소 효과가 더 큽니다(장기 duration).", "f": "", "why": {"A": "할인율이 높으면 PBO와 (대개) interest cost가 낮아져 비용↓ → NI는 '증가'합니다.", "C": "할인율은 회계 추정치일 뿐 현금 기여금과 무관 → CFO 변화 없음."}, "orig": "ECO Module 2 Q21"}, {"id": "ECO-M2-Q24", "src": "ECO 오답", "module": 2, "tag": "옵션 변동성 가정 – 비용", "vig": 13, "stem": "Compared to the reported 20X3 financial statements, if Terra Mercado had used the 20X1 volatility assumption to value its employee stock option grants, it would have most likely reported higher:", "opts": {"A": "net income.", "B": "operating expense.", "C": "accrued compensation liability."}, "ans": "B", "en": "B is correct. A higher volatility assumption increases the value of the stock option and thus the compensation expense, which, in turn, reduces net income. There is no associated liability for equity-settled stock options.", "ko": "20X1 변동성(35%) > 20X3(29%) → 옵션가치↑ → 보상비용(영업비용)↑ → NI↓. Equity-settled 옵션은 부채가 생기지 않습니다.", "trap": "Accrued compensation liability 선지 — 주식결제형은 자본(reserve) 계정입니다.", "f": "", "why": {"A": "변동성↑ → 옵션가치·비용↑ → NI는 '감소'합니다.", "C": "Equity-settled 옵션의 상대계정은 자본(SBC reserve) — 부채가 생기지 않습니다."}, "orig": "ECO Module 2 Q24"}, {"id": "ECO-M2-Q25", "src": "ECO 오답", "module": 2, "tag": "옵션가치 입력변수 방향", "vig": 13, "stem": "Compared to the assumptions Terra Mercado used to value stock options in 20X2, earnings in 20X3 were most favorably affected by the change in the:", "opts": {"A": "expected life.", "B": "risk-free rate.", "C": "dividend yield."}, "ans": "C", "en": "C is correct. A higher dividend yield reduces the value of the option and thus option expense. The lower expense results in higher earnings. Higher risk-free rates and expected lives result in higher call option values.", "ko": "20X2→20X3: 무위험이자율 3.8→4.6%(가치↑, 불리), 만기 4.5→5.0년(가치↑, 불리), 배당수익률 0→1.0%(가치↓ → 비용↓ → 이익↑, 가장 유리).", "trap": "무위험이자율↑을 '할인율↑ → 가치↓'로 착각 — 콜옵션 가치는 rf↑에 상승합니다.", "f": "Call value↑: σ↑, T↑, rf↑ / Call value↓: dividend yield↑", "why": {"A": "만기 4.5 → 5.0년 증가 → 옵션가치↑ → 비용↑ → 이익에 불리합니다.", "B": "무위험이자율 3.8 → 4.6% 상승 → 콜옵션 가치↑ → 비용↑ → 이익에 불리합니다."}, "orig": "ECO Module 2 Q25"}, {"id": "ECO-M2-Q26", "src": "ECO 오답", "module": 2, "tag": "DCF – Net interest expense 이중계산", "vig": 14, "stem": "Your colleague’s discounted cash flow model expenses service cost and net interest expense in free cash flow and deducts the company’s net pension liability from enterprise value to arrive at an estimate of equity value. You most likely recommend that your colleague:", "opts": {"A": "make no changes.", "B": "remove service cost from free cash flow because it is a non-cash expense.", "C": "remove net interest expense from free cash flow because the net pension, at present value, is already deducted from enterprise value."}, "ans": "C", "en": "C is correct. Net interest expense for a DB plan represents the unwinding of the discount with the passage of time. The discounted cash flow model values a company at the present time. Service cost is correctly expensed in the model as it represents increases in the pension obligation unrelated to the time value of money.", "ko": "Net interest expense는 시간 경과에 따른 할인 해제(unwinding)입니다. Net pension liability를 PV로 이미 EV에서 차감했다면 FCF에서 net interest까지 빼면 시간가치 이중 반영. Service cost는 실제 영업비용이라 FCF에 남겨둡니다.", "trap": "Service cost를 '비현금'이라고 빼는 선지(B) — 새로 쌓인 의무의 PV이므로 영업비용입니다.", "f": "", "why": {"A": "Net interest expense를 FCF에서 빼면서 PV 기준 순부채도 차감하면 시간가치 이중계산입니다.", "B": "Service cost는 이번 기간 새로 생긴 의무의 PV로 실질 영업비용 — FCF에 남겨야 합니다."}, "orig": "ECO Module 2 Q26"}, {"id": "ECO-M2-Q29", "src": "ECO 관련유형", "module": 2, "tag": "SBC 희석 반영 – 둘 중 하나만", "vig": 14, "stem": "As an alternative to expensing stock-based compensation in free cash flow in the discounted cash flow valuation model, your colleague could account for the expected dilution by:", "opts": {"A": "increasing shares outstanding.", "B": "reducing operating expenses because the company could compensate its employees in cash rather than shares.", "C": "increasing net cash because share-based compensation expense is a non-cash expense."}, "ans": "A", "en": "A is correct. Dilution from share-based compensation can be accounted for by expensing share-based compensation in free cash flow or by increasing the share count for expected dilution.\n\nB and C are incorrect as they would be accretive, not dilutive, to valuation.", "ko": "SBC 희석은 ① FCF에서 비용 차감 또는 ② 예상 희석만큼 주식수 증가 중 하나로 반영(둘 다 하면 이중차감). 'SBC는 비현금이라 net cash↑', '현금보상으로 대체'는 가치를 부풀리는 방향.", "trap": "B·C는 희석이 아니라 가치 증가(accretive) 방향입니다.", "f": "", "why": {"B": "현금보상으로 대체할 수 있다는 가정으로 비용을 줄이면 SBC의 경제적 비용을 무시해 가치를 부풀립니다.", "C": "SBC가 비현금이라고 현금을 늘리면 희석을 반영하기는커녕 가치를 증가시킵니다."}, "orig": "ECO Module 2 Q29"}, {"id": "ECO-M2-Q30", "src": "ECO 관련유형", "module": 2, "tag": "Tax windfall – 영구 적용 금지", "vig": 14, "stem": "The subject company’s management has provided guidance for the next fiscal year, which includes an effective tax rate that is substantially below its statutory tax rate, largely due to tax windfalls from share-based compensation. Using this effective tax rate for all future years in the model would likely:", "opts": {"A": "overstate income tax expense.", "B": "overstate free cash flow to the firm.", "C": "understate estimated enterprise value."}, "ans": "B", "en": "B is correct. A lower effective tax would increase free cash flow to the firm (After-tax EBIT + D&A – Capex +/- Change in working capital). Tax windfalls or excess tax benefits decrease the effective tax rate versus the statutory rate because they are deductible for tax purposes, but not expensed on the income statement.", "ko": "Windfall로 낮아진 ETR을 미래 전체에 적용 → after-tax EBIT↑ → FCFF↑ → EV 과대평가. Windfall은 주가 상승에 의존하는 일회성 효과.", "trap": "Income tax expense는 과소(overstate 아님), EV는 과대(understate 아님).", "f": "", "why": {"A": "낮은 ETR을 쓰면 법인세비용은 '과소' 추정됩니다.", "C": "FCFF가 과대 → EV도 '과대' 추정됩니다."}, "orig": "ECO Module 2 Q30"}, {"id": "ECO-M2-Q31", "src": "ECO 관련유형", "module": 2, "tag": "DCF – Underfunded plan은 debt", "vig": 14, "stem": "When conducting a discounted cash flow valuation of a company that has a defined benefit pension plan, it is most appropriate to:", "opts": {"A": "add the funded status of an underfunded plan to debt.", "B": "subtract the funded status of an overfunded plan from debt.", "C": "subtract future service and interest costs from free cash flow."}, "ans": "A", "en": "Correct because to account for the first impact, analysts apply an asymmetrical treatment of underfunded and overfunded plans. The funded status for an underfunded plan is considered debt in an enterprise value calculation and/or bridge from enterprise value to equity value. An overfunded plan is ignored in valuation.", "ko": "Underfunded plan의 funded status는 debt로 취급(EV→Equity 차감). Overfunded plan은 무시(비대칭 처리).", "trap": "", "f": "", "why": {"B": "Incorrect because an overfunded plan should be ignored in valuation.", "C": "Incorrect because interest costs should not be deducted. Even though service costs are not cash expenses, service cost should be deducted from free cash flow in a discounted cash flow model. Net interest expense/income should not be included in the discounted cash flow model as it represents the unwinding of the discounted pension obligation."}, "orig": "ECO Module 2 Q31"}, {"id": "ECO-M2-Q34", "src": "ECO 오답", "module": 2, "tag": "단기 종업원급여 분류", "vig": null, "stem": "Which of the following is classified as short-term employee compensation?", "opts": {"A": "Stock options", "B": "Sabbatical paid leave", "C": "Contributions to social security"}, "ans": "C", "en": "Correct because contributions to social security schemes are considered short-term benefits.", "ko": "단기(12개월 내 정산): 급여·상여·건강보험·사회보장 기여금·유급휴가. 장기: sabbatical 등 장기유급휴가, 장기장애. 주식보상: 옵션·RSU.", "trap": "Sabbatical paid leave는 '장기' 급여입니다.", "f": "", "why": {"A": "Incorrect because stock options are considered share-based compensation (long-term) benefits.", "B": "Incorrect because paid leave for sabbaticals are considered long-term benefits."}, "orig": "ECO Module 2 Q34"}, {"id": "ECO-M2-Q37", "src": "ECO 오답", "module": 2, "tag": "미래 SBC 희석 – 모델링", "vig": null, "stem": "An analyst adjusts the dilution impact of future share-based awards on valuation. The most appropriate way to model this impact is to:", "opts": {"A": "exclude the future awards from valuation until granted and vested.", "B": "deduct the expense of future share-based awards from future free cash flows.", "C": "decrease the number of shares outstanding by the number of unvested shares awarded when computing diluted EPS."}, "ans": "B", "en": "Correct because the most pragmatic method to account for the second effect, dilution from expected future share-based awards, in a discounted cash flow valuation is to deduct share-based compensation from free cash flow.", "ko": "미래 부여 예정분의 희석은 FCF에서 SBC 비용을 차감하는 방식이 가장 실용적입니다(ECO). Schweser는 대안으로 equity value에 희석계수 적용 또는 주식수 증가 추정도 제시합니다. 희석은 주식수를 '늘리는' 것이지 줄이는 것이 아닙니다.", "trap": "미래 부여분을 무시(A)하면 가치 과대평가. C는 주식수를 감소시켜 방향이 반대.", "f": "", "why": {"A": "Incorrect because this partially ignores the impact of share-based compensation on the value of the company. This is flawed because share-based compensation is a transfer of value from an issuer to its employees and dilutes existing shareholders.", "C": "Incorrect because an alternative approach for modeling the effect of outstanding but unvested share based awards is to use basic shares outstanding plus the gross amount of potentially dilutive securities (including share-based awards) as the share count.  This adjusts the shares outstanding for the dilution and is included in the estimate of diluted EPS. Unvested shares should be added to and not decrease the number of shares outstanding."}, "orig": "ECO Module 2 Q37"}, {"id": "ECO-M2-Q38", "src": "ECO 오답", "module": 2, "tag": "SBC 예측 기준", "vig": null, "stem": "The common approach to forecasting share-based compensation expense in a financial statement model is as a percentage of:", "opts": {"A": "revenues.", "B": "gross profit.", "C": "total operating expenses."}, "ans": "A", "en": "Correct because the common approach to forecasting share-based compensation expense is as a percentage of revenues. Using that as the forecast object, an analyst can use a variety of forecasting approaches such as a historical average, management guidance, or by assuming the percentage will revert to an industry or sector average over time.", "ko": "SBC expense는 매출 대비 비율(% of revenues)로 예측하는 것이 일반적입니다. 이후 과거 평균, 경영진 가이던스, 산업 평균 회귀 등으로 비율을 정합니다.", "trap": "Gross profit·opex 기준은 함정입니다.", "f": "", "why": {"B": "Incorrect because the common approach to forecasting share-based compensation expense is as a percentage of revenues, not gross profit.", "C": "Incorrect because the common approach to forecasting share-based compensation expense is as a percentage of revenues, not total operating expenses."}, "orig": "ECO Module 2 Q38"}, {"id": "ECO-M2-Q39", "src": "ECO 오답", "module": 2, "tag": "Plan 지급액 – 회사 재무제표", "vig": null, "stem": "Payments from a post-employment benefit plan to employees are:", "opts": {"A": "not reported on the employer's financial statements.", "B": "reported on the employer's financial statements in the case of defined benefit plans.", "C": "reported on the employer's financial statements in the case of defined contribution plans."}, "ans": "A", "en": "Correct because under both types of post-employment benefit plans – defined contribution and defined benefit – payments from the plans are not reported on employers' financial statements.  A defined contribution plan is a separate legal entity with its own financial statements. Under a defined benefit plan, the payment of benefits is neutral to the funded status reported on the employer’s balance sheet because it reduces plan assets and the pension obligation by the same amount.", "ko": "DC·DB 모두 plan이 직원에게 지급하는 금액은 회사 재무제표에 보고되지 않습니다. DC는 별도 법적 실체, DB는 지급 시 plan assets와 PBO가 같은 금액 감소 → funded status 불변.", "trap": "DB면 보고된다(B)는 함정 — 지급은 funded status 중립입니다.", "f": "", "why": {"B": "Incorrect because payments of benefits under a defined benefit plan are neutral to the funded status reported on the employer’s balance sheet.", "C": "Incorrect because a defined contribution plan is a separate legal entity with its own financial statements."}, "orig": "ECO Module 2 Q39"}, {"id": "SCH-M2-01", "src": "Schweser MQ", "module": 2, "tag": "옵션 vs RSU – 희석주식수", "vig": null, "stem": "A company has stock options and RSUs outstanding with an equal number of unvested underlying shares and the same unrecognized compensation expense. The company reports positive net income. Relative to the RSUs, the options most likely result in:", "opts": {"A": "more dilutive shares.", "B": "fewer dilutive shares.", "C": "the same number of dilutive shares."}, "ans": "B", "en": "Under the treasury stock method, option exercise proceeds are added to unrecognized compensation expense in assumed repurchases, so more shares are assumed bought back and fewer dilutive shares result. RSUs have no exercise proceeds.", "ko": "TSM 가정 매입재원: 옵션 = 행사대금 + 미인식 보상비용, RSU = 미인식 보상비용만. 옵션은 재매입 주식이 더 많아 희석주식이 더 적습니다.", "trap": "RSU에도 행사가가 있다고 착각하는 함정.", "f": "Dilutive shares = 잠재주식 − (행사대금 + 미인식 SBC)/평균주가", "why": {"A": "옵션은 행사대금까지 재매입 재원에 포함되어 재매입 주식이 더 많으므로 희석주식이 '적습니다'.", "C": "재매입 재원(행사대금 유무)이 달라 결과가 다릅니다."}, "orig": "Schweser MQ 8.1 변형"}, {"id": "SCH-M2-02", "src": "Schweser MQ", "module": 2, "tag": "주식보상 비용 인식 시점", "vig": null, "stem": "Which of the following statements about share-based compensation is most accurate?", "opts": {"A": "Option expense is recognized only if the option has intrinsic value at the grant date.", "B": "For restricted stock, the employer recognizes expense when the employee sells the shares.", "C": "Compensation expense is measured at grant-date fair value and allocated over the vesting (service) period."}, "ans": "C", "en": "Share-based compensation is measured at grant-date fair value and recognized over the service (vesting) period, with the credit to an equity reserve. No expense arises at exercise or sale.", "ko": "부여일 공정가치로 측정 → 가득기간에 걸쳐 비용 배분(대변: 자본 내 SBC reserve). 행사·매도 시점에는 비용 없음.", "trap": "내재가치 기준(A) — 공정가치(옵션가격모형) 기준입니다.", "f": "", "why": {"A": "보상비용은 내재가치가 아닌 부여일 공정가치(옵션가격모형) 기준입니다.", "B": "비용은 가득기간에 걸쳐 인식하며, 직원의 주식 매도 시점과 무관합니다."}, "orig": "Schweser MQ 8.1 변형"}, {"id": "SCH-M2-03", "src": "Schweser MQ", "module": 2, "tag": "단기 종업원급여", "vig": null, "stem": "Which of the following statements about short-term employee compensation is least accurate?", "opts": {"A": "It is expensed as employees provide service, with unpaid amounts shown as a current liability.", "B": "It includes salaries, bonuses, health insurance, social security contributions, and paid leave.", "C": "It is subject to high measurement error be
