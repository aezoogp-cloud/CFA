ice stays the same, the P/FFO multiple will decrease. FFO and AFFO are based on net income available to equity and thus represent levered income. P/FFO multiples are generally lower for companies with higher leverage, all things equal.\nIn addition, the perceived risk of the firm increases, causing investors to demand a higher return. The higher required return is reflected in a lower P/FFO multiple. As financial leverage increases, equities' FFO and AFFO multiples decrease because required return increases as risk increases.\nC is incorrect because the perceived risk of the firm increases, causing investors to demand a higher return. The higher required return is reflected in a lower P/FFO multiple. As financial leverage increases, equities' FFO and AFFO multiples decrease because required return increases as risk increases.", "ko": "FFO·AFFO는 레버리지가 반영된 주주 귀속 이익입니다. 레버리지↑ → 위험↑ → 요구수익률↑ → 같은 FFO에 낮은 가격 → P/FFO 배수↓.", "trap": "EBITDA는 이자 전 이익이라 레버리지와 무관.", "f": "", "why": {"A": "EBITDA는 이자 전 이익이라 레버리지가 바뀌어도 그대로입니다.", "C": "위험이 커져 요구수익률은 오릅니다."}, "orig": "ECO Module 3 Q31"}, {"id": "ECO-M3-Q34", "src": "ECO 오답", "module": 3, "tag": "개발 노출이 가장 작은 투자: REIT", "vig": null, "stem": "Which of the following investments is least likely to offer exposure to real estate development activity?", "opts": {"A": "REITs", "B": "Private real estate investments", "C": "Real estate operating companies"}, "ans": "A", "en": "A is correct because development requires equity capital. Lenders require equity capital to be invested in the land or construction before they fund any debt. Therefore, a REIT would need to hold capital on its balance sheet to fund future equity draws instead of paying out that capital. REIT laws typically stipulate that the significant majority of a REIT's earned cash flow be paid out immediately to investors. In contrast to REOCs, REITs face restrictions on the amount of income and assets accounted for by activities other than collecting rent and interest payments.\nB is incorrect because private real estate investors do not have a regulatory obligation to distribute their income, they can amass the equity capital that is required to initiate development. Further, given the diversity of private real estate investors, it is more likely that a sufficient portion accept the risk necessary to earn the higher expected returns through development. Private real estate investors can pursue a variety of strategies, such as merchant (for sale) development, which is highly restricted for REITs.\nC is incorrect because , even though REITs and REOCs are both publicly traded, only REITs have a regulatory imperative to distribute their earnings. REOCs can warehouse the cash necessary to fund the initial stages of development. Further, REOCs are not typically as strongly associated with stable distributions as REITs.\nREOCs are free to invest in any kind of real estate or related activity without limitation. This freedom gives management the opportunity to create more value in development activity and in trading real estate and to retain as much of their income as they believe is appropriate. A wider range of capital structures and degrees of financial leverage may be used in the process.", "ko": "개발은 지분 자금을 먼저 넣어야 하는데, REIT는 이익 대부분을 배당해야 하고 임대·이자 외 활동에 한도가 있어 개발 노출이 가장 작습니다. REOC와 사모 투자는 분배 의무가 없어 개발에 자금을 쌓을 수 있습니다.", "trap": "", "f": "", "why": {"B": "사모 부동산 투자자는 분배 의무가 없어 개발(merchant development 포함)이 자유롭습니다.", "C": "REOC는 상장사지만 분배 의무가 없어 개발 자금을 유보할 수 있습니다."}, "orig": "ECO Module 3 Q34"}, {"id": "ECO-M3-Q37", "src": "ECO 오답", "module": 3, "tag": "사모 부동산: 단기 수익 안정성(smoothing)", "vig": null, "stem": "A high-net-worth investor is seeking to increase diversification to their existing real estate holdings by adding less common property types. If the investor values transparency and stability of returns, the investor is most likely to select private over public real estate because private real estate has greater:", "opts": {"A": "transparency.", "B": "short-term stability of returns.", "C": "ability to deliver attractive risk-adjusted returns."}, "ans": "B", "en": "A is incorrect because private real estate is considered to have low transparency when compared to public real estate.\nB is correct because public real estate is considered to have high volatility (compared with private real estate). Further, the equity market correlation of public real estate is high in the short term, making returns less stable than for private real estate. The latter relies on less frequent valuations by appraisal, which leads to smoothing.\nC is incorrect because both public and private real estate equity investments provide exposure to real estate properties, potentially hedge inflation, deliver attractive risk-adjusted returns, and provide some diversification benefits to stock and bond portfolios.", "ko": "사모 부동산은 드문 감정평가로 수익률이 smoothing돼 단기적으로 안정적으로 보입니다. 공모(REIT)는 변동성이 크고 단기적으로 주식과 상관관계가 높습니다.", "trap": "투명성은 공모가 더 높다. 위험조정수익은 둘 다 제공.", "f": "", "why": {"A": "투명성은 공모(상장) 부동산이 더 높습니다.", "C": "공모·사모 모두 매력적인 위험조정수익을 낼 수 있어 차별점이 아닙니다."}, "orig": "ECO Module 3 Q37"}, {"id": "VAR-M3-01", "src": "변형", "module": 3, "tag": "NAVPS: 현금 NOI 성장 후 자본화", "vig": null, "stem": "A REIT reports last-12-month NOI of $500 million, including $20 million of non-cash rent. Cash NOI is expected to grow 2% over the next year, and the appropriate cap rate is 6%. The REIT has $300 million of cash, $3,000 million of debt, and 100 million shares outstanding. NAVPS is closest to:", "opts": {"A": "$53.00.", "B": "$54.60.", "C": "$58.00."}, "ans": "B", "en": "Cash NOI = 500 − 20 = 480; next-12-month cash NOI = 480 × 1.02 = 489.6. Value of operating real estate = 489.6 / 0.06 = 8,160. NAV = 8,160 + 300 − 3,000 = 5,460. NAVPS = 5,460 / 100 = $54.60.", "ko": "현금 NOI = 500 − 20 = 480 → × 1.02 = 489.6 → / 6% = 8,160. + 현금 300 − 부채 3,000 = 5,460 → ÷ 100 = $54.60.", "trap": "비현금 임대료 차감 + 다음 해 성장 반영 후 cap rate로 나눈다.", "f": "NAVPS = [(NOI − 비현금 임대료)(1 + g)/cap + 기타자산 − 부채] / 주식 수", "why": {"A": "성장률(2%)을 반영하지 않은 값(480 / 0.06 + 300 − 3,000)입니다.", "C": "비현금 임대료를 빼지 않고 성장도 반영하지 않은 값(500 / 0.06 + 300 − 3,000)입니다."}, "orig": "변형 (오답노트 R32, Schweser LOS 32.b)"}, {"id": "VAR-M3-02", "src": "변형", "module": 3, "tag": "P/AFFO 가치평가", "vig": null, "stem": "A REIT has FFO of $10 million, non-cash rent of $0.8 million, and recurring maintenance-type capital expenditures of $1.2 million. It has 2 million shares outstanding, and the property subsector average P/AFFO multiple is 15×. The value per share using the P/AFFO approach is closest to:", "opts": {"A": "$60.", "B": "$66.", "C": "$75."}, "ans": "A", "en": "AFFO = FFO − non-cash rent − recurring maintenance-type capital expenditures = 10 − 0.8 − 1.2 = $8 million. AFFO per share = $8 million / 2 million = $4.00. Value per share = $4.00 × 15 = $60.", "ko": "AFFO = 10 − 0.8 − 1.2 = 8 → 주당 4.00 × 15 = $60.", "trap": "비현금 임대료와 유지보수 capex를 모두 뺀다.", "f": "AFFO = FFO − 비현금 임대료 − 유지보수형 capex", "why": {"B": "비현금 임대료를 빼지 않은 값((10 − 1.2)/2 × 15)입니다.", "C": "FFO에 P/AFFO 배수를 곱한 값(10/2 × 15)입니다."}, "orig": "변형 (오답노트 R32, Schweser LOS 32.c–d)"}, {"id": "VAR-M3-03", "src": "변형", "module": 3, "tag": "NAVPS vs BVPS", "vig": null, "stem": "NAVPS is generally considered a better measure of a REIT's fundamental value than book value per share because NAVPS:", "opts": {"A": "is based on the current market values of the REIT's assets and liabilities.", "B": "includes the value of goodwill and deferred tax assets.", "C": "is based on the depreciated historical cost of the REIT's properties."}, "ans": "A", "en": "NAVPS is the per-share amount by which assets exceed liabilities, using current market values rather than accounting book values. NAVPS is superior to BVPS because BVPS relies on the depreciated historical cost of a REIT’s assets. Goodwill, deferred financing expenses, and deferred tax assets are generally excluded.", "ko": "NAVPS = 현재 시장가치 기준 순자산. BVPS는 감가상각된 역사적 원가 기준이라 실제 가치를 반영하지 못합니다. 영업권·이연법인세자산 같은 무형자산은 NAV에서 제외합니다.", "trap": "", "f": "", "why": {"B": "영업권·이연법인세자산 등은 NAV 계산에서 보통 제외합니다.", "C": "감가상각된 역사적 원가는 BVPS의 기준(약점)입니다."}, "orig": "변형 (오답노트 R32, Schweser LOS 32.b)"}, {"id": "VAR-M3-04", "src": "변형", "module": 3, "tag": "REIT 레버리지·NAV 할인 → 자금조달 어려움", "vig": null, "stem": "A REIT whose shares trade at a significant discount to NAVPS and that has high leverage is most likely to:", "opts": {"A": "find it easier to raise equity capital for acquisitions.", "B": "face difficulty raising new capital, which may limit long-term growth.", "C": "be viewed by the market as overvalued."}, "ans": "B", "en": "REITs with high leverage and trading at a discount to NAVPS may find it difficult to raise new capital or refinance maturing debt, which could limit long-term growth. Shares priced at a discount to NAVPS are generally interpreted as a sign of potential undervaluation, not overvaluation.", "ko": "NAVPS보다 싸게 거래되고 레버리지가 높으면 신주 발행 시 기존 주주가 희석되고 차환도 어려워 자금조달이 힘들어집니다 → 장기 성장 제약. NAV 대비 할인은 '저평가' 신호입니다.", "trap": "NAV 할인 = 저평가 신호(고평가 아님).", "f": "", "why": {"A": "주가가 NAV보다 낮으면 신주 발행이 희석적이라 자금조달이 오히려 어렵습니다.", "C": "NAV 대비 할인 거래는 저평가 가능성의 신호입니다."}, "orig": "변형 (오답노트 R32, ECO M3 Q2)"}, {"id": "ECO-M4-Q2", "src": "ECO 오답", "module": 4, "tag": "Event-driven도 시장 베타 노출", "vig": 11, "stem": "Which of the IC member’s statements regarding hedge fund strategies is incorrect?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "B", "en": "B is correct. Statement 2 is incorrect: Event-driven strategies, such as merger arbitrage, tend to be exposed to some natural equity market beta risk. Overall market risk can potentially disrupt a merger’s consummation (though hedging may be possible). To the extent that deals are more likely to fail in market stress periods, event-driven merger arbitrage strategies have market sensitivity and left-tail risk attributes. Also, while event-driven strategies may have less beta exposure than simple, long-only beta allocations, the higher hedge fund fees effectively result in a particularly expensive form of embedded beta. Equity market-neutral strategies do use a relative value approach, because such strategies hold balanced long and short equity exposures to maintain zero (or close to zero) net exposure to the equity market and such factors as sector and size. Also, opportunistic strategies do have risk exposure to market directionality, also called trendiness.\nA is incorrect because equity market-neutral strategies do use a relative value approach. Equity market-neutral strategies hold balanced long and short equity exposures to maintain zero (or close to zero) net exposure to the equity market and such factors as sector and size (i.e., market cap). They then focus on, for example, pairs of long and short securities whose prices are out of historical alignment and are expected to experience mean reversion. To take advantage of idiosyncratic short-term mispricing between securities whose prices should otherwise be co-integrated, equity market-neutral hedge fund strategies take opposite (i.e., long and short) positions in similar or related equities that have divergent valuations, while also attempting to maintain a near net zero portfolio exposure to the market.\nC is incorrect because opportunistic strategies do have risk exposure to market directionality, also called trendiness. Opportunistic strategies are based on macro themes and multi-asset relationships on a global basis; therefore, broad themes, global relationships, market trends, and cycles affect their returns. Generally, the key source of returns in global macro strategies revolves around correctly discerning and capitalizing on trends in global markets. For example, global macro managers typically hold views on trends in inflation (among other things). Global macro strategies are typically top down and use a range of macroeconomic and fundamental models to express a view regarding the direction or relative value of an asset or asset class. If the hedge fund manager is making a directional bet, then directional models will use fundamental data regarding a specific market or asset to determine whether it is undervalued or overvalued relative to history and the expected macro trend.", "ko": "Statement 2가 틀렸습니다. 합병 차익거래 같은 event-driven 전략은 시장 스트레스 시 딜이 깨질 가능성이 커져 주식시장 베타와 left-tail 위험이 있습니다.", "trap": "평상시 상관관계 낮음 ≠ 베타 위험 없음.", "f": "", "why": {"A": "EMN은 롱·숏으로 시장 노출을 0에 가깝게 맞추는 relative value 접근이 맞습니다.", "C": "Opportunistic(글로벌 매크로 등)은 시장 방향성(추세)에 노출되는 것이 맞습니다."}, "orig": "ECO Module 4 Q2"}, {"id": "ECO-M4-Q3", "src": "ECO 오답", "module": 4, "tag": "저변동성 중시 → Dedicated short 회피", "vig": 11, "stem": "Based on what the IC considers important for equity-related strategies, which strategy should Mukilteo most likely avoid?", "opts": {"A": "Long/short equity", "B": "Equity market neutral", "C": "Dedicated short selling and short biased"}, "ans": "C", "en": "C is correct. For equity-related strategies, the IC considers low volatility to be more important than negative correlation. Dedicated short selling and short-biased strategies have return goals that are typically less than those for most other hedge fund strategies but with a negative correlation benefit. In addition, they are more volatile than a typical long/short equity hedge fund because of their short beta exposure. As a result, Mukilteo should avoid dedicated short selling and short-biased strategies.\nA is incorrect because long/short equity is a lower-volatility strategy. A long/short equity manager aims to achieve a standard deviation that is 50% lower than a long-only approach while achieving average annual returns roughly equivalent to a long-only approach. Since the IC considers low volatility important, this is not a strategy that Mukilteo should necessarily avoid.\nB is incorrect because equity market-neutral strategies generally have high levels of diversification and lower standard deviations of returns than many other strategies across normal market conditions. Because they typically deliver returns that are steadier and less volatile than those of many other hedge strategy areas, equity market-neutral managers generally are more useful for portfolio allocation during periods of non-trending or declining markets. Equity market-neutral managers neutralize market risk by constructing their portfolios such that the expected portfolio beta is approximately equal to zero. Over time, their conservative and constrained approach typically results in less volatile overall returns than those of managers who accept beta exposure. (The exception to this norm is when the use of significant leverage may cause forced portfolio downsizing.) Since the IC considers low volatility important, this is not a strategy that Mukilteo should necessarily avoid.", "ko": "IC는 음의 상관관계보다 낮은 변동성을 중시합니다. Dedicated short·short-biased 전략은 음의 상관관계를 주지만 숏 베타 때문에 변동성이 커서 피해야 합니다.", "trap": "L/S equity 목표 = long-only 수익 + 절반 수준 표준편차, EMN = 저변동.", "f": "", "why": {"A": "L/S equity는 long-only보다 표준편차를 절반 수준으로 낮추려는 저변동 전략입니다.", "B": "EMN은 분산이 크고 변동성이 낮은 전략입니다."}, "orig": "ECO Module 4 Q3"}, {"id": "ECO-M4-Q7", "src": "ECO 오답", "module": 4, "tag": "위기에도 높은 Sharpe → Long volatility", "vig": 11, "stem": "The specialist hedge fund strategy that Mukilteo plans to recommend is most likely:", "opts": {"A": "cross-asset volatility trading between the US and Japanese markets.", "B": "selling equity volatility and collecting the volatility risk premium.", "C": "buying longer-dated out-of-the-money options on VIX index futures."}, "ans": "C", "en": "C is correct. Mukilteo needs to recommend a specialist hedge fund strategy that can help PWPF maintain a high Sharpe ratio even in a crisis when equity markets fall. Buying longer-dated out-of-the-money options on VIX index futures is a long equity volatility position that works as a protective hedge, particularly in an equity market crisis when volatility spikes and equity prices fall. A long volatility strategy is a useful potential diversifier for long equity investments (albeit at the cost of the option premium paid by the volatility buyer). Because equity volatility is approximately 80% negatively correlated with equity market returns, a long position in equity volatility can substantially reduce the portfolio’s standard deviation, which would serve to increase its Sharpe ratio. Longer-dated options will have more absolute exposure to volatility levels (i.e., vega exposure) than shorter-dated options, and out-of-the-money options will typically trade at higher implied volatility levels than at-the-money options.\nA is incorrect because cross-asset volatility trading, a type of relative value volatility trading, may often involve idiosyncratic, macro-oriented risks that may have adverse effects during an equity market crisis.\nB is incorrect because the volatility seller is the provider of insurance during crises, not the beneficiary of it. Selling volatility provides a volatility risk premium or compensation for taking on the risk of providing insurance against crises for holders of equities and other securities. On the short side, option premium sellers generally extract steadier returns in normal market environments.", "ko": "장기 OTM VIX 선물 옵션 매수 = long volatility. 주식 폭락 시 변동성이 급등해(주식 수익률과 약 −80% 상관) 위기에 보험 역할을 하고, 포트폴리오 표준편차를 낮춰 Sharpe를 유지합니다. 장기 옵션은 vega 노출이 큽니다.", "trap": "변동성 '매도'는 보험을 파는 쪽 → 위기 때 손실.", "f": "", "why": {"A": "교차자산 변동성 거래는 위기 때 불리할 수 있는 거시적 위험을 동반합니다.", "B": "변동성 매도는 평소 프리미엄을 받지만 위기 때 보험금을 내주는 쪽입니다."}, "orig": "ECO Module 4 Q7"}, {"id": "ECO-M4-Q9", "src": "ECO 오답", "module": 4, "tag": "분산 제한 + 하방위험 → Sortino 최고", "vig": 11, "stem": "Based on the IC’s primary considerations for a combined portfolio, which simulated hedge fund strategy portfolio in Exhibit 1 creates the most suitable combined portfolio?", "opts": {"A": "Merger arbitrage", "B": "Systematic futures", "C": "Equity market neutral"}, "ans": "C", "en": "C is correct. The variance of the combined portfolio must be less than 90% of that of the current portfolio: maximum variance = 0.90 × 7.95² ≈ 56.88, so maximum standard deviation ≈ 7.54%. All three portfolios meet this requirement. Because the IC expects large negative events, the Sortino ratio (which penalizes only downside deviation) is the more appropriate risk-adjusted measure. The equity market-neutral allocation has the highest Sortino ratio (1.80).\nA is incorrect because the merger arbitrage portfolio has a lower Sortino ratio (1.35), even though it has the lowest maximum drawdown.\nB is incorrect because the systematic futures portfolio has a lower Sortino ratio (1.68).", "ko": "분산 한도 = 현재 분산의 90% → 최대 표준편차 = 7.95 × √0.9 ≈ 7.54%. 세 후보 모두 통과. 큰 손실 사건을 고려하면 하방 편차만 보는 Sortino가 적합 → 1.80으로 가장 높은 EMN.", "trap": "Max drawdown이 가장 작은 merger arb에 끌리지 말 것. 기준은 Sortino.", "f": "Sortino = (R − MAR) / 하방편차 ; 최대 σ = σ_현재 × √0.9", "why": {"A": "Sortino 1.35로 EMN(1.80)보다 낮습니다. 낙폭이 작은 것은 기준이 아닙니다.", "B": "Sortino 1.68로 EMN보다 낮습니다(Sharpe는 높지만 기준은 Sortino)."}, "orig": "ECO Module 4 Q9"}, {"id": "ECO-M4-Q11", "src": "ECO 오답", "module": 4, "tag": "Opportunistic: 고레버리지·고유동성·우측꼬리", "vig": 12, "stem": "Which opportunistic hedge fund strategy meets Xu’s preferences?", "opts": {"A": "Only global macro", "B": "Only managed futures", "C": "Both global macro and managed futures"}, "ans": "C", "en": "C is correct. Xu states that she prefers opportunistic hedge fund strategies that use high leverage, have high liquidity, and exhibit right-tail skewness. The two most common opportunistic hedge fund strategies are global macro and managed futures. Both global macro and managed futures are highly liquid. Further, returns of managed futures strategies typically exhibit positive right-tail skewness in periods of market stress, whereas global macro strategies have delivered similar diversification in such stress periods but with more heterogeneous outcomes. Global macro and managed futures strategies can also use high leverage, either through the use of futures contracts, in which high leverage is embedded, or through the active use of options, which adds natural elements of leverage and positive convexity.\nA and B are incorrect because both global macro and managed futures strategies can offer the three characteristics that Xu seeks in an opportunistic hedge fund strategy.", "ko": "글로벌 매크로와 managed futures 모두 레버리지가 높고 유동성이 높으며, 시장 스트레스 때 우측 꼬리(양의 왜도)를 보입니다(매크로는 결과가 더 이질적).", "trap": "둘 다 해당.", "f": "", "why": {"A": "Managed futures도 세 조건을 모두 충족합니다.", "B": "글로벌 매크로도 세 조건을 모두 충족합니다."}, "orig": "ECO Module 4 Q11"}, {"id": "ECO-M4-Q14", "src": "ECO 오답", "module": 4, "tag": "Convertible arbitrage: 주가와 무관한 이익", "vig": 12, "stem": "Anderson’s conclusion about the profitability of the AVC convertible arbitrage trade is:", "opts": {"A": "correct.", "B": "incorrect, because the profit will be higher if the share price decreases.", "C": "incorrect, because the profit will be higher if the share price increases."}, "ans": "A", "en": "A is correct. The current conversion price of the AVC convertible bond is €1,000 × (115/100) / 50 = €23, and the current share price is €28. By purchasing the convertible bond, selling short the shares, and converting, a profit of €5 per share can be locked in regardless of the share price:\nNew share price €26: long €3 + short €2 = €5\nNew share price €28: long €5 + short €0 = €5\nNew share price €34: long €11 + short −€6 = €5\nB and C are incorrect because, when the convertible's price is near its conversion value, a long convertible combined with short equity delta exposure produces the same profit/loss for small changes in the share price.", "ko": "전환가격 = €1,000 × 115% / 50 = €23, 현재 주가 €28. 전환사채 매수 + 주식 공매도면 주가가 €26, €28, €34 어느 쪽이든 이익이 €5로 같습니다(작은 주가 변화, 배당·차입비용 무시).", "trap": "Long CB + short stock(델타 헤지) → 작은 주가 변화에는 손익 불변.", "f": "이익 = (새 주가 − 전환가격) + (현재 주가 − 새 주가) = 현재 주가 − 전환가격", "why": {"B": "주가가 내려도 이익은 €5로 같습니다.", "C": "주가가 올라도 이익은 €5로 같습니다."}, "orig": "ECO Module 4 Q14"}, {"id": "ECO-M4-Q25", "src": "ECO 오답", "module": 4, "tag": "요인계수 해석: 위기 때 deep OTM put", "vig": 13, "stem": "Which of Chang’s observations about Fund A is most likely accurate?", "opts": {"A": "Observation 1", "B": "Observation 2", "C": "Observation 3"}, "ans": "C", "en": "A is incorrect. Fund A does not likely have a dedicated short bias strategy because the sensitivity to equity markets is essentially zero except for during times of crisis.\nB is incorrect. Fund A has a positive exposure to volatility through the VIX, especially during periods of market stress. This is not indicative of a manager selling puts against short positions.\nC is correct. For Fund A, adding deep out-of-the-money puts during periods of market stress would explain why the correlation with equity markets is relatively neutral in normal markets but is significantly negative during periods of crisis. It also is supported by a large increase in positive correlation with volatility during periods of crisis.", "ko": "평상시 S&P 계수 ≈ 0, 위기 때 −0.48로 크게 음수, VIX 계수는 위기 때 0.46으로 급등 → 평소엔 조용하다가 위기 때만 작동하는 deep OTM 풋 매수와 일치(Observation 3).", "trap": "(+) VIX 계수 = 보험을 산 쪽(long put). (−)라면 판 쪽.", "f": "", "why": {"A": "평상시 주식 민감도가 0에 가까워 상시 숏 편향(dedicated short)으로 보기 어렵습니다.", "B": "VIX에 양(+)의 노출 → 풋을 판 것이 아니라 산 것과 같습니다."}, "orig": "ECO Module 4 Q25"}, {"id": "ECO-M4-Q29", "src": "ECO 오답", "module": 4, "tag": "Merger arbitrage 편입 이유", "vig": 14, "stem": "What would the rationale most likely be for an institutional investor to include the Pegasus Fund in its portfolio?", "opts": {"A": "Uncorrelated source of alpha", "B": "Capital structure arbitrage of valuation divergence", "C": "Earn the illiquidity premium associated with the strategy"}, "ans": "A", "en": "A is correct. Merger arbitrage is a good uncorrelated source of alpha. Diversifying across a variety of mergers, deals, and industries can further help hedge the risk of any one deal failing. Merger arbitrage does not exploit capital structure divergence in a single company and is a relatively liquid strategy.\nB is incorrect because capital structure arbitrage involves taking long and short positions in the debt and equity of individual companies to extract misvaluations, and it would not be a rationale for inclusion in the portfolio. This generally falls under distressed security strategies.\nC is incorrect because merger arbitrage is a liquid strategy.", "ko": "Merger arbitrage는 딜 결과에 따라 수익이 결정돼 평상시 시장과 상관이 낮은 알파 원천이고, 여러 딜에 분산하면 개별 딜 실패 위험도 줄일 수 있습니다. 유동성도 비교적 높습니다.", "trap": "Capital structure arbitrage = distressed securities. Merger arb는 유동적 전략.", "f": "", "why": {"B": "자본구조 차익거래(부채·주식 간 괴리)는 distressed securities 전략에 속합니다.", "C": "Merger arbitrage는 비교적 유동적인 전략이라 비유동성 프리미엄과 거리가 멉니다."}, "orig": "ECO Module 4 Q29"}, {"id": "ECO-M4-Q30", "src": "ECO 오답", "module": 4, "tag": "Convertible arbitrage = 옵션 저평가 이용", "vig": 14, "stem": "Based on the data in Exhibit 1, what strategy is the Orion portfolio manager most likely implementing?", "opts": {"A": "Taking advantage of option mispricing", "B": "Profiting from extreme market volatility", "C": "Going long a put on the equity net of hedging"}, "ans": "A", "en": "A is correct. To access and extract the relatively cheap embedded optionality of the convertible, the manager hedges away other risks that are embedded in the convertible security. These include interest rate risk, credit risk, and market risk. These risks can be hedged using a combination of interest rate derivatives, credit default swaps, and short sales of an appropriate delta-adjusted amount of the underlying stock or, alternatively, the purchase of put options.\nB is incorrect because the convertible arbitrage strategy performs best when there is modest volatility. Heightened volatility would suggest a period of illiquidity and widening credit spreads.\nC is incorrect because buying a convertible bond and delta hedging the position does not equate to a long put position.", "ko": "전환사채를 사고 주식 델타 숏, CDS, 금리스왑으로 시장·신용·금리 위험을 헤지 → 싸게 내재된 옵션(변동성)만 추출하는 전략.", "trap": "Convertible arb는 '적당한' 변동성에서 가장 잘 됨. 극단적 변동성은 불리.", "f": "CB = 일반 채권 + 콜옵션", "why": {"B": "Convertible arb는 변동성이 적당할 때 가장 좋고, 극단적 변동성은 유동성 악화·스프레드 확대로 불리합니다.", "C": "CB 매수 + 델타 헤지는 풋 매수와 같은 포지션이 아닙니다."}, "orig": "ECO Module 4 Q30"}, {"id": "ECO-M4-Q34", "src": "ECO 오답", "module": 4, "tag": "EMN: 높은 분산·높은 회전율", "vig": 15, "stem": "Which of Pukitis statement’s to Chu regarding equity-related hedge fund managers is most likely correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "C", "en": "A is incorrect. Although a lower beta to equity markets is a characteristic of long–short managers, it is not one of the attractive features of long–short strategies. If an investor wishes to have exposure to a strategy with lower equity beta, there are cheaper long-only approaches to accomplish this goal.\nB is incorrect. Dedicated short-bias managers typically have low levels of leverage.\nC is correct. Pukitis correctly states that equity market–neutral managers are likely to have high levels of diversification and turnover ratios.", "ko": "Statement 3이 맞습니다. EMN은 많은 종목을 롱·숏으로 들고 있어 분산이 높고, 가격 괴리가 해소되면 바로 청산하고 갈아타 회전율이 높습니다.", "trap": "Dedicated short = 레버리지 낮음. L/S의 낮은 베타는 '가장 매력적인 특징'이 아님(더 싸게 얻는 방법이 있음).", "f": "", "why": {"A": "낮은 베타는 L/S의 특징이지만 가장 매력적인 점은 아닙니다(long-only로 더 싸게 낮은 베타를 얻을 수 있음). 핵심은 종목 선택 알파입니다.", "B": "Dedicated short 매니저는 보통 레버리지를 적게 씁니다."}, "orig": "ECO Module 4 Q34"}, {"id": "ECO-M4-Q35", "src": "ECO 오답", "module": 4, "tag": "저~중 레버리지·고유 알파·롱 편향·비유동 → Distressed", "vig": 15, "stem": "Based on the characteristics identified by Brownstein’s investment committee, which of the following hedge fund strategies would Chu most likely recommend?", "opts": {"A": "Managed futures", "B": "Distressed securities", "C": "Convertible bond arbitrage"}, "ans": "B", "en": "A is incorrect. Managed futures strategies often contain a lot of embedded leverage, can be long or short biased, and typically are liquid.\nB is correct. Brownstein’s investment committee is seeking a hedge fund with the following characteristics: low to moderate levels of leverage, idiosyncratic alpha, long biased, and no concerns about liquidity. Of the strategies listed, the distressed securities strategy meets these desired characteristics most closely.\nC is incorrect. Convertible bond arbitrage strategies frequently use high levels of leverage and are net neutral.", "ko": "Distressed securities는 롱 편향, 레버리지 낮음~중간, 기업 구조조정 결과에 달린 고유(idiosyncratic) 알파, 비유동적 → 위원회 조건에 가장 잘 맞습니다.", "trap": "", "f": "", "why": {"A": "Managed futures는 레버리지가 높고 롱·숏 모두 가능하며 유동적입니다.", "C": "Convertible arb는 레버리지가 높고 순노출이 중립입니다."}, "orig": "ECO Module 4 Q35"}, {"id": "ECO-M4-Q38", "src": "ECO 오답", "module": 4, "tag": "Duration-neutral → 작은 평행이동만 헤지", "vig": null, "stem": "A fixed-income arbitrage fund implementing a duration-neutral strategy is most likely hedged against:", "opts": {"A": "large yield changes.", "B": "a steepening yield curve.", "C": "small shifts in the yield curve."}, "ans": "C", "en": "A is incorrect because duration neutrality will not provide a hedge against large yield changes. Duration neutrality provides a hedge against only small shifts in the yield curve. To hedge against large yield changes, the manager might employ a range of fixed-income derivatives, including futures, forwards, swaps, and swaptions (i.e., options on a swap).\nB is incorrect because duration neutrality will not provide a hedge against a steepening yield curve as a steepening yield curve is a non-parallel shift in the yield curve. Duration neutrality provides a hedge against only small shifts in the yield curve. To hedge against non-parallel yield curve movements (i.e., steepening or flattening), the manager might employ a range of fixed-income derivatives, including futures, forwards, swaps, and swaptions (i.e., options on a swap).\nC is correct because duration neutrality provides a hedge against only small shifts in the yield curve. Unless trading a price discrepancy directly involves establishing a desired yield curve exposure, fixed-income arbitrageurs will typically immunize their strategies, which involve both long and short positions, from interest rate risk by taking duration-neutral positions.", "ko": "Duration-neutral은 작은 평행이동에 대해서만 금리 위험을 없앱니다. 큰 금리 변화나 곡선 모양 변화(스티프닝)는 헤지되지 않습니다.", "trap": "", "f": "", "why": {"A": "큰 금리 변화는 듀레이션 중립으로 헤지되지 않습니다(컨벡시티 등).", "B": "스티프닝 같은 비평행 이동은 헤지되지 않습니다."}, "orig": "ECO Module 4 Q38"}, {"id": "ECO-M4-Q39", "src": "ECO 오답", "module": 4, "tag": "Global macro vs managed futures", "vig": null, "stem": "Compared to managed futures funds, global macro funds are more likely to:", "opts": {"A": "be a consistent source of alpha.", "B": "take a systematic approach to implementation.", "C": "be early and overly anticipatory in their positioning."}, "ans": "C", "en": "A is incorrect because managed futures funds tend to be a more dependable source of alpha than global macro funds. Global macro funds are not as consistently dependable as a source of short alpha when compared to pure systematic, trend-following managed futures funds that typically attempt to capture any significant market trend.\nB is incorrect because , compared to managed futures managers, global macro managers are not likely to take a systematic approach to implementation. Typically, managed futures managers tend to take a more systematic approach to implementation than global macro managers, who are generally more discretionary in their application of models and tools.\nC is correct because , compared to managed futures managers, global macro managers can be early and overly anticipatory in their positioning. Global macro managers tend to be anticipatory and sometimes contrarian in setting their strategies. Some macro managers may try to extract carry gains or ride momentum waves, but most have a tendency to be early in their positioning and then benefit when some rationality eventually returns to relative market pricing. Finally, global macro managers tend to be more anticipatory (compared to managed futures managers), which can be a useful attribute.", "ko": "글로벌 매크로는 재량적(discretionary)이고 남보다 먼저 추세를 예상해 포지션을 잡는 경향이 있어, 너무 이르게(과도하게 앞서) 들어가기 쉽습니다.", "trap": "Managed futures = 체계적(systematic), 더 꾸준한 알파.", "f": "", "why": {"A": "추세추종 managed futures가 더 꾸준한 알파 원천입니다.", "B": "체계적 실행은 managed futures의 특징입니다."}, "orig": "ECO Module 4 Q39"}, {"id": "ECO-M4-Q40", "src": "ECO 오답", "module": 4, "tag": "FoF vs multi-strategy: 운영위험", "vig": null, "stem": "In contrast to a multi-strategy fund, a fund-of-funds:", "opts": {"A": "has less operational risk.", "B": "absorbs netting risk on behalf of its investors.", "C": "can reallocate capital more quickly into different strategy areas."}, "ans": "A", "en": "A is correct because , since all the operational processes are consolidated at a multi-strategy hedge fund, there is greater operational risk than with a FOF. The operational risks of a multi-strategy firm, by definition, are not well diversified because all operational processes are performed under the same fund structure. Multi-strategy funds offer potentially faster tactical asset allocation and improved fee structure (netting risk handled at strategy level) but with higher manager-specific operational risks. FoFs offer a potentially more diverse strategy mix but with less transparency and slower tactical reaction time.\nB is incorrect because investors in FOFs face netting risk where, in contrast, investors in multi-strategy funds are protected from netting risk by the GP (general partner). Conceptually, the FoF investor always faces netting risk, whereby he/she is responsible for paying performance (i.e., incentive) fees due to winning underlying funds while suffering return drag from the performance of losing underlying funds. Even if the FoF’s overall performance (aggregated across all funds) is flat or down, FoF investors must still pay incentive fees due to the managers of the winning underlying funds. The fee structure is more investor-friendly at multi-strategy hedge funds where the general partner absorbs the netting risk arising from the divergent performances of his/her fund's different strategy teams. This is an attractive outcome for the multi-strategy fund investor because the GP is responsible for netting risk.\nC is incorrect because a multi-strategy manager can reallocate capital into different strategy areas more quickly and efficiently than would be possible by the FoF manager.", "ko": "Multi-strategy는 모든 운영이 한 조직 안에 있어 운영위험이 분산되지 않습니다. FoF는 여러 독립 운용사에 나눠 투자해 운영위험이 더 낮습니다.", "trap": "Netting risk·느린 재배분 = FoF의 단점.", "f": "", "why": {"B": "FoF 투자자는 netting risk를 직접 부담합니다. 흡수하는 것은 multi-strategy의 GP입니다.", "C": "자본 재배분은 multi-strategy가 더 빠릅니다."}, "orig": "ECO Module 4 Q40"}, {"id": "ECO-M4-Q44", "src": "ECO 오답", "module": 4, "tag": "변동성 매도 = 변동성 위험 프리미엄", "vig": null, "stem": "Which of the following statements about volatility trading is most accurate?", "opts": {"A": "Selling volatility provides a volatility risk premium", "B": "Long volatility positioning exhibits negative convexity", "C": "Volatility levels tend to decrease when equity markets fall in value"}, "ans": "A", "en": "A is correct because selling volatility provides a volatility risk premium or compensation for taking on the risk of providing insurance against crises for holders of equities and other securities.\nB is incorrect because long volatility positioning exhibits positive (not negative) convexity, which can be particularly useful for hedging purposes.\nC is incorrect because volatility levels tend to go up (not down) when equity markets fall, with options pricing skew reflecting such a tendency. Clearly, this makes the long volatility strategy a useful potential diversifier for long equity investments, albeit at the cost to the option premium paid by the volatility buyer.", "ko": "변동성을 파는 쪽은 위기에 대한 보험을 제공한 대가로 변동성 위험 프리미엄을 받습니다.", "trap": "Long vol = positive convexity. 주가 하락 시 변동성은 상승.", "f": "", "why": {"B": "Long volatility는 양(+)의 볼록성을 가집니다.", "C": "주식시장이 떨어지면 변동성은 오르는 경향이 있습니다."}, "orig": "ECO Module 4 Q44"}, {"id": "ECO-M4-Q45", "src": "ECO 오답", "module": 4, "tag": "헤지펀드 지수: HFRI", "vig": null, "stem": "Which of the following indexes would be the most appropriate benchmark for a small, long/short equity hedge fund open to new investment?", "opts": {"A": "The HFRI Index", "B": "The HFRX Index", "C": "The Credit Suisse Hedge Fund Index"}, "ans": "A", "en": "A is correct because the HFRI Index is the only one of the three answer choices that tracks small hedge funds that are open for new investment. HFR produces its HFRI index series, which tracks only hedge funds open to new investment.\nB is incorrect because the HFRX Index includes hedge funds that are closed to new investment. HFR produces both the HFRX Index of equally weighted hedge funds, which includes those that are open or closed to new investment. The mix of managers represented by the HFRX Index would obviously not be replicable in real-time by an investor, thus limiting its usefulness.\nC is incorrect because the Credit Suisse Hedge Fund Index is weighted by fund size (i.e., AUM), so its overall performance is more reflective of the performance of the larger (not smaller) hedge funds, such as the multi-strategy managers.", "ko": "HFRI는 신규 투자에 열려 있는 펀드만 동일가중으로 추적해 작은 신규 개방 L/S 펀드의 벤치마크로 적합합니다.", "trap": "HFRX = open + closed 포함, Credit Suisse = 규모가중(AUM 큰 펀드 위주).", "f": "", "why": {"B": "HFRX는 신규 투자가 닫힌 펀드도 포함해 실시간 복제가 어렵습니다.", "C": "Credit Suisse 지수는 규모(AUM)가중이라 큰 펀드 성과를 반영합니다."}, "orig": "ECO Module 4 Q45"}, {"id": "ECO-M4-Q46", "src": "ECO 오답", "module": 4, "tag": "L/S equity 알파 = 종목 선택", "vig": null, "stem": "The skill of long/short equity managers in delivering alpha derives mainly from:", "opts": {"A": "beta tilts.", "B": "market timing.", "C": "stock selection."}, "ans": "C", "en": "A is incorrect because , while beta tilts may be beneficial to returns, most long/short managers' skill in producing alpha comes primarily through stock selection. Although market timing using 'beta tilts' can play a factor in manager performance, studies have shown that most fundamental long/short equity managers offer little added alpha from such adjustments.\nB is incorrect because , while market timing may be beneficial to returns, most long/short managers' skill in producing alpha comes primarily through stock selection. Most long/short equity managers are not known for their portfolio-level market-timing abilities, but those with such market-timing skills may be particularly valuable from a portfolio allocation perspective. As a result, stock selection defines manager skill for most long/short equity managers—with market-timing ability being an additive, but generally secondary, consideration.\nC is correct because stock selection defines manager skill for most long/short equity managers—with market-timing ability being an additive, but generally secondary, consideration. Manager skill derives mainly from stock selection. Further, some managers are able to add alpha via market timing of portfolio beta tilt, but evidence suggests that most long/short managers do this poorly.", "ko": "대부분의 L/S equity 매니저의 실력은 종목 선택에서 나옵니다. 시장 타이밍(베타 기울기 조정)은 부차적이고, 대부분 잘하지 못합니다.", "trap": "", "f": "", "why": {"A": "베타 기울기 조정(시장 타이밍)으로 알파를 내는 매니저는 드뭅니다.", "B": "시장 타이밍은 부차적 요소입니다."}, "orig": "ECO Module 4 Q46"}, {"id": "ECO-M4-Q52", "src": "ECO 오답", "module": 4, "tag": "Multi-strategy vs FoF 성과", "vig": null, "stem": "Multi-strategy funds have typically:", "opts": {"A": "outperformed funds-of-funds.", "B": "experienced lower volatility than funds-of-funds.", "C": "provided better redemption provisions than funds-of-funds."}, "ans": "A", "en": "A is correct because multi-strategy hedge funds typically outperform funds-of-funds: They have higher mean returns (7.85%/TASS and 8.52%/CISDM) and among the highest Sharpe ratios and Sortino ratios. Multi-strategy funds have higher Rho (more than 20%) compared to FoFs, indicating relatively high serial autocorrelation. This is reasonable because multi-strategy funds may be simultaneously running strategies using less liquid instruments, such as convertible arbitrage, fixed-income arbitrage, and other relative value strategies.\nB is incorrect because multi-strategy funds are generally considered to have higher volatility than FOFs. Multi-strategy funds have generally outperformed FoFs but with more variance and occasional large losses often related to their higher leverage.\nC is incorrect because multi-strategy funds are generally considered to have more restrictive redemption terms than FOFs. Both groups (FOFs and multi-strategy funds) typically have similar initial lock-up and redemption periods, but multi-strategy funds also often impose investor-level or fund-level gates on maximum redemptions allowed per quarter. Further, multi-strategy funds may be simultaneously running strategies using less liquid instruments, such as convertible arbitrage, fixed-income arbitrage, and other relative value strategies. That is why, unlike FoFs, they often impose investor-level or fund-level gates on maximum quarterly redemptions.", "ko": "Schweser: multi-strategy 펀드는 더 나은 수수료 구조와 빠른 전술적 배분 덕분에 역사적으로 FoF보다 성과가 좋았습니다. 대신 레버리지 때문에 변동성이 더 크고 가끔 큰 손실이 있습니다.", "trap": "성과↑지만 변동성↑, 환매 조건은 더 엄격(gate).", "f": "", "why": {"B": "Multi-strategy는 레버리지 때문에 FoF보다 변동성이 큽니다.", "C": "Multi-strategy는 분기별 환매 한도(gate) 등 환매 조건이 더 엄격합니다."}, "orig": "ECO Module 4 Q52"}, {"id": "ECO-M4-Q60", "src": "ECO 오답", "module": 4, "tag": "Convertible arbitrage 주당 손익 계산", "vig": null, "stem": "A convertible arbitrage hedge fund manager observes the following information about a convertible bond and the underlying stock:\nConvertible bond par value\t$1,000,000\nBond price\t$105\nAnnual coupon rate\t5%\nConversion ratio\t80,000\nStock price\t$20\nBorrowing cost per share\t$4\nThe manager buys the bond and sells the stock short. If the stock price falls by 10% over one year, the per-share profit of this strategy is closest to:", "opts": {"A": "–$3.38.", "B": "$2.88.", "C": "$3.50."}, "ans": "C", "en": "A is incorrect because the starting stock price is used in the calculation rather than the conversion price. Thus, Ending stock price – Starting stock price = 0.9 × $20 – $20 = –$2, and the per-share profit of the strategy is –$2 + $0.625 – $2 = –$3.375 ≈ –$3.38.\nB is incorrect because the coupon receipt is not included in the calculation, resulting in a per-share profit of $4.875 – $2 = $2.875 ≈ $2.88.\nC is correct because the bond value is $1,000,000 × 105/100 = $1,050,000. The conversion price is $1,050,000/80,000 = $13.125. The profit on the long bond position is Ending stock price – Conversion price = 0.9 × $20 – $13.125 = $4.875. This is increased by the coupon receipt of 5% × $1,000,000 = $50,000 or $0.625 per share (= $50,000/80,000).\nThe profit on the short stock position is –(Ending stock price – Starting stock price) = –($18 – $20) = $2. This is reduced by the borrowing cost of $4 per share to a loss of $2 per share.\nThus, the profit per share of this strategy is $4.875 + $0.625 – $2 = $3.50.", "ko": "전환가격 = 1,050,000 / 80,000 = $13.125. Long CB 이익 = 18 − 13.125 = 4.875. 쿠폰 = 50,000 / 80,000 = 0.625. Short 이익 = 20 − 18 = 2, 차입비용 4 → −2. 합계 = 4.875 + 0.625 − 2 = $3.50.", "trap": "Long CB 이익은 '전환가격' 기준. 쿠폰과 차입비용을 빠뜨리지 말 것.", "f": "이익 = (S₁ − 전환가격) + 쿠폰/주 + (S₀ − S₁) − 차입비용", "why": {"A": "전환가격 대신 시작 주가를 써서 long 쪽 손익을 −2로 계산했습니다.", "B": "쿠폰(0.625)을 빠뜨렸습니다."}, "orig": "ECO Module 4 Q60"}, {"id": "ECO-M4-Q64", "src": "ECO 오답", "module": 4, "tag": "Fund-of-funds 수수료 후 수익률", "vig": null, "stem": "A fund-of-funds (FoF) invests equal amounts of capital in the following hedge funds, where incentive fees are calculated on returns net of management fees:\n\tGross Annual Return\tManagement Fee\tIncentive Fee\nFund 1\t4.5%\t1.8%\t10.0%\nFund 2\t3.6%\t1.2%\t10.0%\nIf the FoF also charges a base fee of 1.0% and an incentive fee of 10.0%, the net annual return to FoF investors is closest to:", "opts": {"A": "0.93%.", "B": "1.17%.", "C": "3.23%."}, "ans": "B", "en": "A is incorrect because incentive fees are calculated on gross rather than net returns.\nThe return to Fund 1 is then (4.5% – 1.8%) – 10% × 4.5% = 2.250%.\nThe return to Fund 2 is then (3.6% – 1.2%) – 10% × 3.6% = 2.040%.\nThe FoF gross return is therefore (2.250% + 2.040%)/2 = 2.145% and the FoF net return is (2.145% – 1%) – 10% × 2.145% = 0.9305% ≈ 0.93%.\nB is correct because the net-of-fees return to Fund 1 is (4.5% – 1.8%) – 10% × (4.5% – 1.8%) = 2.43%.\nThe net-of-fees return to Fund 2 is (3.6% – 1.2%) – 10% × (3.6% – 1.2%) = 2.16%.\nSince the FoF exposure to the two funds is equally weighted, the FoF gross return is (2.43% + 2.16%)/2 = 2.295% and the FoF net return is (2.295% – 1%) – 10% × (2.295% – 1%) = 1.1655% ≈ 1.17%.\nC is incorrect because the overall gross return to the FoF is calculated as the sum of the constituents rather than the average. The FoF gross return is therefore 2.43% + 2.16% = 4.59% and the FoF net return is (4.59% – 1%) – 10% × (4.59% – 1%) = 3.231% ≈ 3.23%.", "ko": "Fund 1: (4.5 − 1.8) × 0.9 = 2.43%. Fund 2: (3.6 − 1.2) × 0.9 = 2.16%. FoF 총수익 = 평균 2.295%. FoF 순수익 = (2.295 − 1.0) × 0.9 = 1.17%.", "trap": "성과보수는 '운용보수 차감 후' 수익 기준. FoF 총수익은 합이 아니라 가중평균.", "f": "순수익 = (총수익 − 운용보수) × (1 − 성과보수율)", "why": {"A": "성과보수를 운용보수 차감 전(총수익) 기준으로 계산했습니다.", "C": "두 펀드 수익을 평균하지 않고 더했습니다."}, "orig": "ECO Module 4 Q64"}, {"id": "ECO-M4-Q65", "src": "ECO 오답", "module": 4, "tag": "Technical + discretionary(herding 회피)", "vig": null, "stem": "A manager believes that past price trends can reliably predict future relative price movements and wants to avoid a strategy that is exposed to herding effects. The manager most likely prefers a strategy that employs:", "opts": {"A": "technical analysis with systematic implementation.", "B": "technical analysis with discretionary implementation.", "C": "fundamental analysis with systematic implementation."}, "ans": "B", "en": "A is incorrect because systematic implementation is rules-based and executed by computer algorithms with little or no human intervention; however, it may encounter difficulty coping with new, complex situations (not seen historically). As the absolute size of systematic trend-following funds has increased in significance, so too has the issue of negative execution slippage caused by the simultaneous reversal of multiple trend-following models that sometimes creates a 'herding effect.' Such effects can temporarily overwhelm normal market liquidity and at times temporarily distort fundamental market pricing of assets (i.e., trend-following 'overshoots' caused by momentum-signal triggers).\nB is correct because this combination aligns with the manager's beliefs. Technical analysis utilizes statistical methods to predict relative price movements based on past price trends. Further, in contrast to discretionary implementation, systematic implementation is rules-based and executed by computer algorithms where the simultaneous reversal of multiple trend-following models sometimes creates a 'herding effect.' Such effects can temporarily overwhelm normal market liquidity and at times temporarily distort fundamental market pricing of assets (i.e., trend-following 'overshoots' caused by momentum-signal triggers). Discretionary implementation is less subject to the 'herding effect' than systematic implementation.\nC is incorrect because fundamental-based strategies use economic data as inputs and focus on fair valuation of securities, sectors, markets, and intra-market relationships. In contrast, and more in line with the manager's beliefs, technical analysis utilizes statistical methods to predict relative price movements based on past price trends.", "ko": "과거 가격 추세로 예측 → technical analysis. 체계적 추세추종 펀드들이 같은 신호로 동시에 움직이는 herding 효과를 피하려면 → discretionary 실행.", "trap": "Systematic = herding·실행 slippage 위험. Fundamental = 경제 데이터.", "f": "", "why": {"A": "체계적 실행은 herding 효과에 노출됩니다.", "C": "펀더멘털 분석은 과거 가격 추세가 아니라 경제 데이터를 씁니다."}, "orig": "ECO Module 4 Q65"}, {"id": "ECO-M4-Q66", "src": "ECO 오답", "module": 4, "tag": "유동성 문제 감지 → rho(자기상관)", "vig": null, "stem": "An investor wants to add a new hedge fund to their existing hedge fund portfolio. Which of the following measures is most useful as an indicator of potential liquidity issues in the underlying securities?", "opts": {"A": "Sortino ratio", "B": "Sharpe ratio", "C": "First-order serial autocorrelation (rho)"}, "ans": "C", "en": "A is incorrect because hedge funds potentially invest in illiquid securities (which artificially smooth returns, thus lowering the measured standard deviation). The Sortino ratio, while a more reliable indicator of risk/return characteristics than the Sharpe ratio because it uses downside deviation in place of standard deviation, is less useful to consider than autocorrelation (rho), which is a more reliable indicator to detect liquidity issues in the underlying securities.\nB is incorrect because hedge funds potentially invest in illiquid securities (which artificially smooth returns, thus lowering the measured standard deviation). Therefore, the Sharpe ratio is artificially inflated and less useful to consider than autocorrelation (rho), which is a more reliable indicator to detect liquidity issues in the underlying securities.\nC is correct because , as hedge funds potentially invest in illiquid securities (which artificially smooth returns, thus lowering the measured standard deviation), besides measuring risk and return one should also investigate the autocorrelation of returns. Rho is a measure of first-order serial autocorrelation, the correlation between a fund’s return and its own lagged return. High rho signals smoothed returns and thus is an indicator of potential liquidity issues (specifically, illiquidity and infrequent trading) in the underlying securities.", "ko": "비유동 증권은 가격이 추정치로 smoothing돼 표준편차가 낮게 측정 → Sharpe·Sortino가 부풀려집니다. 수익률과 직전 수익률의 상관(rho)이 높으면 smoothing, 즉 비유동성 신호입니다.", "trap": "Sharpe·Sortino는 smoothing에 오염. 유동성 진단은 rho.", "f": "", "why": {"A": "Sortino는 Sharpe보다 나은 위험 지표지만 smoothing 영향을 받아 유동성 문제를 잡지 못합니다.", "B": "Sharpe는 smoothing으로 인위적으로 높아집니다."}, "orig": "ECO Module 4 Q66"}, {"id": "ECO-M4-Q21", "src": "ECO 오답", "module": 2, "tag": "Lease·rent review 주체: REIT 운용역", "vig": null, "stem": "Which of the following is most likely to conduct a lease and rent review as part of the real estate investment due diligence process?", "opts": {"A": "A retail REIT investor", "B": "A REIT investment manager", "C": "A real estate holding company selling a shopping mall"}, "ans": "B", "en": "A is incorrect because a retail REIT investor is likely to conduct due diligence primarily focusing on the share valuation of the REIT and is likely to obtain information from annual audited financial statements.\nIndirect investors such as retail investors should also perform due diligence on REITs and REOCs to determine whether the share valuation is appropriate before making investment decisions. Much of the information about public companies can be found in public filings of annual audited financial statements, quarterly reports, and investor presentations.\nB is correct because a REIT investment manager manages direct real estate investments on behalf of the REIT shareholders. Due diligence, including a lease and rent review, needs to be conducted to validate the investment.\nDirect real estate investors, their advisers, appraisers, and lenders should perform thorough due diligence before acquiring properties or making secured loans. Property value will be based on several factors, such as cash flow outlook, market conditions, and prices paid for recent properties.\nC is incorrect because due diligence is typically carried out by the buyer and not the seller. The purpose of due diligence is to identify potential problems that have not been disclosed by the seller that could negatively impact value.", "ko": "Due diligence는 매수자가 합니다. REIT 운용역은 주주를 대신해 건물을 직접 사므로 임대차·임대료 검토를 합니다. 개인 REIT 투자자는 주식 가치(재무제표 등)를 봅니다.", "trap": "직접 투자자(운용역·감정평가사·대출기관) vs 간접 투자자(REIT 주주). 매도자는 실사 대상이지 주체가 아님.", "f": "", "why": {"A": "개인 REIT 투자자는 간접 투자자라 재무제표·공시로 주식 가치를 실사합니다.", "C": "실사는 매수자가 하는 것이고 매도자는 실사 대상입니다."}, "orig": "ECO Module 4 Q21"}, {"id": "VAR-M4-01", "src": "변형", "module": 4, "tag": "Life settlement 선호 조건", "vig": null, "stem": "When selecting life settlement policies, a hedge fund most likely prefers policies for which:", "opts": {"A": "the surrender value offered to the insured is relatively high.", "B": "the ongoing premium payments are relatively low.", "C": "the insured is expected to live longer than predicted by actuarial methods."}, "ans": "B", "en": "In selecting life settlement policies, a hedge fund seeks policies for which the purchase price (surrender value offered to the insured) is low, the ongoing premium payments are low, and the insured person is likely to die relatively soon.", "ko": "헤지펀드는 매입가(해지환급금) 낮음, 계속 내야 할 보험료 낮음, 피보험자가 보험계리 예상보다 일찍 사망할 가능성 높음 → 이 세 조건을 선호합니다.", "trap": "'높은' 해지환급금은 매입가가 비싸다는 뜻이라 불리.", "f": "", "why": {"A": "해지환급금(매입가)이 높으면 펀드가 비싸게 사야 해서 불리합니다.", "C": "피보험자가 오래 살수록 보험료를 오래 내고 보험금은 늦게 받아 불리합니다."}, "orig": "변형 (오답노트 R33, Schweser LOS 33.f)"}, {"id": "VAR-M4-02", "src": "변형", "module": 4, "tag": "Merger arbitrage 포지션(주식교환)", "vig": null, "stem": "In a stock-for-stock acquisition, a merger arbitrage fund that expects the deal to close successfully will most likely:", "opts": {"A": "buy the target's shares and short the acquirer's shares.", "B": "buy the acquirer's shares and short the target's shares.", "C": "buy both the target's and the acquirer's shares."}, "ans": "A", "en": "In a stock-for-stock deal, the hedge fund manager will typically purchase the stock of the target company and short the stock of the acquiring company in anticipation of profiting when the deal is completed. If the manager expects the merger to fail, the opposite positions are taken.", "ko": "딜 성사를 예상하면 타깃 매수 + 인수기업 공매도. 딜이 깨지면 가격이 반대로 움직여(타깃↓, 인수자↑) 큰 손실(left-tail).", "trap": "Merger arb = 보험 판매와 비슷: 평소 프리미엄, 딜 실패 시 큰 손실.", "f": "", "why": {"B": "딜 실패를 예상할 때의 포지션입니다.", "C": "양쪽 모두 매수하면 시장 방향성에 노출돼 차익거래가 아닙니다."}, "orig": "변형 (오답노트 R33, Schweser LOS 33.c)"}, {"id": "VAR-M4-03", "src": "변형", "module": 4, "tag": "Distressed securities 특징", "vig": null, "stem": "Distressed securities hedge fund strategies are most likely characterized by:", "opts": {"A": "high leverage and high liquidity.", "B": "a long bias, high illiquidity, and low-to-moderate leverage.", "C": "a net short bias and short lock-up periods."}, "ans": "B", "en": "Distressed securities strategies are usually long biased, with high illiquidity and moderate or low leverage. Lock-up periods tend to be comparatively long, reflecting the extended period of time it can take to value and exit a distressed investment.", "ko": "Distressed = 부실기업 증권을 싸게 사서 회생을 기다림 → 롱 편향, 비유동성 높음, 레버리지 낮음~중간, 락업 기간 김.", "trap": "", "f": "", "why": {"A": "높은 레버리지·높은 유동성은 managed futures 같은 전략의 특징입니다.", "C": "대부분 롱 투자이고 락업 기간이 깁니다."}, "orig": "변형 (오답노트 R33, Schweser LOS 33.c)"}, {"id": "VAR-M4-04", "src": "변형", "module": 4, "tag": "헤지펀드 요인모형: 제외된 요인", "vig": null, "stem": "In the conditional linear factor model used to analyze hedge fund risk exposures, the interest rate (BOND) and commodity (CMDTY) factors were dropped because of:", "opts": {"A": "multicollinearity with other factors.", "B": "their lack of statistical significance in crisis periods only.", "C": "the absence of reliable return data."}, "ans": "A", "en": "A stepwise regression process resulted in the BOND and CMDTY factors being dropped due to multicollinearity issues (CREDIT and SNP500, respectively, produced higher adjusted R²). The remaining four factors are equity risk, currency risk, credit risk, and volatility risk.", "ko": "BOND·CMDTY 요인은 다른 요인(CREDIT·SNP500)과 상관이 높아 다중공선성 문제로 빠졌습니다. 남은 4요인: 주식, 통화, 신용, 변동성.", "trap": "4-factor = Equity, Currency, Credit, Volatility.", "f": "", "why": {"B": "제외 이유는 다중공선성입니다.", "C": "데이터 부족이 이유가 아닙니다."}, "orig": "변형 (오답노트 R33, Schweser LOS 33.h)"}, {"id": "VAR-M4-05", "src": "변형", "module": 4, "tag": "Fixed-income arbitrage 수익 구조", "vig": null, "stem": "The return distribution of a highly leveraged fixed-income arbitrage strategy most closely resembles that of:", "opts": {"A": "buying put options.", "B": "writing put options.", "C": "buying call options."}, "ans": "B", "en": "Return distributions for a fixed-income arbitrageur tend to be similar to the returns from writing puts. If the trade unfolds as expected, the investor earns a return from the spread narrowing plus positive carry. However, if the spread widens unexpectedly, the use of leverage may make the return quite negative.", "ko": "평소엔 스프레드 축소 + carry로 꾸준히 벌다가, 스프레드가 갑자기 벌어지면 레버리지 때문에 큰 손실 → 풋옵션 매도와 비슷합니다.", "trap": "Merger arb도 비슷한 모양(평소 프리미엄, 사건 시 큰 손실).", "f": "", "why": {"A": "풋 매수는 평소 프리미엄을 내고 폭락 때 크게 버는 구조로 반대입니다.", "C": "콜 매수는 상방 무제한 이익 구조라 맞지 않습니다."}, "orig": "변형 (오답노트 R33, Schweser LOS 33.d)"}], "vignettes": ["Raffi Musicale is the portfolio manager for a defined benefit pension plan. He meets with Jenny Brown, market strategist with Menlo Bank, to discuss possible investment opportunities. The investment committee for the pension plan has recently approved expanding the plan’s permitted asset mix to include alternative asset classes.\nBrown proposes the Apex Commodity Fund (Apex Fund) offered by Menlo Bank as a potentially suitable investment for the pension plan. The Apex Fund attempts to produce trading profits by capitalizing on the mispricing between the spot and futures prices of commodities. The fund has access to storage facilities, allowing it to take delivery of commodities when necessary. The Apex Fund’s current asset allocation is presented in Exhibit 1.\nExhibit 1: Apex Fund’s Asset Allocation\nCommodity Sector\tAllocation (%)\nEnergy\t31.9\nLivestock\t12.6\nSofts\t21.7\nPrecious metals\t33.8\nBrown explains that the Apex Fund has had historically low correlations with stocks and bonds, resulting in diversification benefits. Musicale asks Brown, “Can you identify a factor that affects the valuation of financial assets like stocks and bonds but does not affect the valuation of commodities?”\nBrown shares selected futures contract data for three markets in which the Apex Fund invests. The futures data are presented in Exhibit 2.\nExhibit 2: Selected Commodity Futures Data (Gold: US$/troy ounce; coffee: US$/pound; gasoline: US$/gallon)\nMonth\tGold Price\tCoffee Price\tGasoline Price\nJuly\t1,301.2\t0.9600\t2.2701\nSeptember\t1,301.2\t0.9795\t2.2076\nDecember\t1,301.2\t1.0055\t2.0307\nMenlo Bank recently released a report on the coffee market. Brown shares the key conclusion from the report with Musicale: “The coffee market had a global harvest that was greater than expected. Despite the large harvest, coffee futures trading activity is balanced between producers and consumers. This balanced condition is not expected to change over the next year.”\nBrown shows Musicale the total return of a recent trade executed by the Apex Fund. Brown explains that the Apex Fund took a fully collateralized long futures position in nearby soybean futures contracts at the quoted futures price of 865.0 (US cents/bushel). Three months later, the entire futures position was rolled when the near-term futures price was 877.0 and the farther-term futures price was 883.0. During the three-month period between the time that the initial long position was taken and the rolling of the contract, the collateral earned an annualized rate of 0.60%.\nBrown tells Musicale that the pension fund could alternatively gain long exposure to commodities using the swap market. Brown and Musicale analyze the performance of a long position in an S&P GSCI total return swap having monthly resets and a notional amount of $25 million. Selected data on the S&P GSCI are presented in Exhibit 3.\nExhibit 3: Selected S&P GSCI Data\nReference Date\tIndex Level\nApril (swap initiation)\t2,542.35\nMay\t2,582.23\nJune\t2,525.21", "Mary McNeil is the corporate treasurer at Farmhouse, which owns and operates several farms and ethanol production plants in the United States. McNeil’s primary responsibility is risk management. Katrina Falk, a recently hired junior analyst at Farmhouse, works for McNeil in managing the risk of the firm’s commodity price exposures. Farmhouse’s risk management policy requires the use of futures to protect revenue from price volatility, regardless of forecasts of future prices, and prohibits risk managers from taking speculative positions.\nMcNeil meets with Falk to discuss recent developments in two of Farmhouse’s commodity markets, grains and livestock. McNeil asks Falk about key characteristics of the two markets that affect revenues and costs. Falk tells McNeil the following:\nStatement 1: The life cycle for livestock depends on the product and varies widely by product.\nStatement 2: Grains have well-defined seasons and growth cycles specific to geographic regions.\nA material portion of Farmhouse’s revenue comes from livestock exports, and a major input cost is the cost of grains imported from outside the United States. Falk and McNeil next discuss three conclusions that Falk reached in an analysis of the grains and livestock markets:\nConclusion 1: Assuming demand for grains remains constant, extreme heat in the regions from which we import our grains will result in a benefit to us in the form of lower grain prices.\nConclusion 2: New tariffs on cattle introduced in our primary export markets will likely result in higher prices for our livestock products in our local market.\nConclusion 3: Major improvements in freezing technology allowing for longer storage will let us better manage the volatility in the prices of our livestock products.\nMcNeil asks Falk to gather spot and futures price data on live cattle, wheat, and soybeans, which are presented in Exhibit 1. Additionally, she observes that (1) the convenience yield of soybeans exceeds the costs of its direct storage and (2) commodity producers as a group are less interested in hedging in the forward market than commodity consumers are.\nExhibit 1: Selected Commodity Price Data (Live cattle: US cents per pound; wheat and soybeans: US cents per bushel)\nMarket\tLive Cattle Price\tWheat Price\tSoybeans Price\nSpot\t109\t407\t846\nFutures\t108\t407\t850\nA key input cost for Farmhouse in producing ethanol is natural gas. McNeil uses positions in natural gas (NG) futures contracts to manage the risk of natural gas price volatility. Three months ago, she entered into a long position in natural gas futures at a futures price of $2.93 per million British thermal units (MMBtu). The current price of the same contract is $2.99. Exhibit 2 presents additional data about the three-month futures position.\nExhibit 2: Selected Information—Natural Gas Futures Three-Month Position (NG: $ per MMBtu; 1 contract = 10,000 MMBtu)\nCommodity\tTotal Current $ Exposure\tPosition\tNear-Term Futures (Current Price)\tFarther-Term Futures\nNatural Gas (NG)\t5,860,000\tLong\t2.99\t3.03\nThe futures position is fully collateralized earning a 3% rate. McNeil decides to roll forward her current exposure in the natural gas position.\nEach month, McNeil reports the performance of the energy futures positions, including details on price returns, roll returns, and collateral returns, to the firm’s executive committee. A new committee member is concerned about the negative roll returns on some of the positions. In a memo to McNeil, the committee member asks her to explain why she is not avoiding positions with negative roll returns.", "Jamal Nabli is a portfolio manager at NextWave Commodities (NWC), a commodity-based hedge fund located in the United States. NWC’s strategy uses a fixed-weighting scheme to allocate exposure among 12 commodities, and it is benchmarked against the Thomson Reuters/CoreCommodity CRB Index (TR/CC CRB). Nabli manages the energy and livestock sectors with the help of Sota Yamata, a junior analyst.\nNabli and Yamata meet to discuss a variety of factors that affect commodity values in the two sectors they manage. Yamata tells Nabli the following:\nStatement 1: Storage costs are negatively related to futures prices.\nStatement 2: In contrast to stocks and bonds, most commodity investments are made by using derivatives.\nStatement 3: Commodities generate future cash flows beyond what can be realized through their purchase and sale.\nNabli and Yamata then discuss potential new investments in the energy sector. They review Brent crude oil futures data, which are presented in Exhibit 1.\nExhibit 1: Selected Data on Brent Crude Oil Futures\nSpot Price\tNear-Term Futures Price\tLonger-Term Futures Price\n77.56\t73.64\t73.59\nYamata presents his research related to the energy sector, which has the following conclusions:\n• Consumers have been more concerned about prices than producers have.\n• Energy is consumed on a real-time basis and requires minimal storage.\nAfter concluding the discussion of the energy sector, Nabli reviews the performance of NWC’s long position in lean hog futures contracts. Nabli notes that the portfolio earned a −12% price return on the lean hog futures position last year and a −24% roll return after the contracts were rolled forward. The position was held with collateral equal to 100% of the position at a risk-free rate of 1.2% per year.\nYamata asks Nabli to clarify how the state of the futures market affects roll returns. Nabli responds as follows:\nStatement 4: Roll returns are generally negative when a futures market is in contango.\nStatement 5: Roll returns are generally positive when a futures market is in backwardation.\nAs part of their expansion into new markets, NWC is considering changing its benchmark index. Nabli investigates two indexes as a possible replacement. These indexes both use similar weighting and rebalancing schemes. Index A includes contracts of commodities typically in contango, whereas Index B includes contracts of commodities typically in backwardation. Nabli asks Yamata how the two indexes perform relative to each other in a market that is trending upward.\nBecause of a substantial decline in drilling activity in the North Sea, Nabli believes the price of Brent crude oil will increase more than that of heavy crude oil. The actual price volatility of Brent crude oil has been lower than its expected volatility, and Nabli expects this trend to continue. Nabli also expects the level of the ICE Brent Index to increase from its current level. Nabli and Yamata discuss how to use swaps to take advantage of Nabli’s expectations. The possible positions are (1) a basis swap long on Brent crude oil and short on heavy crude oil, (2) a long volatility swap on Brent crude oil, and (3) a short position in an excess return swap that is based on a fixed level (i.e., the current level) of the ICE Brent Index.", "Yua Takahshi is the chief investment officer of the Acaray Pension Fund (Acaray). She is interviewing Olavi Koshinen for an analyst position that will focus on commodity investments.\nTakahshi comments, \"Acaray takes positions in response to perceived imbalances between overall supply and demand for different commodity investments.\" Takahshi asks Koshinen what types of analysis he would focus on when forecasting commodity futures prices. He responds, \"I look at the value consumers of commodities receive from holding inventories. I believe this is often overlooked by other investors.\"\nPrior to the interview, Koshinen provided written responses to a set of questions from Takahshi. Takahshi reviews his analysis of an ongoing short position in silver futures held by Acaray. Each month, when the position is five days from expiration, it is rolled over to the next month's contract. Acaray treats the position as fully collateralized with dedicated funds held in short-term government bonds currently earning 0.30% per year on a 360-day basis. The contract is priced per troy ounce. Most recently, a position that was entered at $23.865 was closed at $23.720 and rolled into a new contract at $23.785.\nTakahshi asks Koshinen to discuss the relationship between the shape of the futures curve and roll return. He makes three observations:\nObservation 1: Roll return and price return tend to have a strong, positive correlation.\nObservation 2: Roll return will be positive for long positions in futures markets exhibiting backwardation.\nObservation 3: Futures markets exhibiting contango and those exhibiting backwardation tend to maintain those pricing relationships over time.", "Samantha Kelsen manages the commodities desk at SL Investments (SL). Her team advises institutional, corporate, and high-net-worth clients regarding investments in commodities. The team is evaluating potential and existing positions for several of SL's clients.\nAn institutional client would like to obtain a diversified commodity position that has limited exposure to energy. The client is considering several commodity index funds that apply differing weighting and rebalancing approaches. Kelsen expects individual commodities to maintain their current price trends for the next several months.\nBased on meteorology forecasts, the team expects weather conditions for the next few months to be unusually disruptive to oil refinery operations. Kelsen has several clients that hold short positions in energy contracts, including gasoline, crude oil, and natural gas. She plans to advise them so they can reduce their losses if the forecasts are accurate.\nA high-net-worth client, Client A, wants to invest in one of three commodity types: softs, energy, or industrial metals. Client A wants to select the commodity type that represents the lowest sensitivity to government environmental policies.\nOne of SL's corporate clients, Client B, relies on copper contracts to hedge the cost of copper used in its manufacturing process. Client B asks Kelsen what the supply and demand conditions are in the copper market. Kelsen observes that the futures price of copper exceeds the spot price.", "Owen Adams, the portfolio manager of a pension fund, is looking at possible commodities investments. He is considering an actively managed futures fund making focused directional investments in precious metals.\nAdams first reviews selected futures contract data of the three precious metals markets presented in Exhibit 1.\nExhibit 1\n\tGold\tSilver\tPlatinum\n1-month futures price ($ per ounce)\t1,894.00\t27.98\t1,143.80\n3-month futures price ($ per ounce)\t1,897.00\t27.78\t1,147.70\nAdams carries out further analysis of the platinum market. He observes that the convenience yield of platinum is less than the costs of its direct storage, and that platinum producers are more interested in hedging in the futures market than platinum consumers.\nAdams holds a fully collateralized long position in a copper futures contract. He entered the contract three months ago at a futures price of $4.3775 per pound. The current price of the same contract is $4.3965 per pound. Adams wants to roll the entire futures position for another three months. Exhibit 2 presents current information related to the 3-month futures position.\nExhibit 2\nPrice of near-term futures contract ($ per pound)\t4.3965\nPrice of farther-term futures contract ($ per pound)\t4.4055\nAnnualized collateral return\t0.40%\nLastly, Adams analyzes the performance of a long position in a total return swap with monthly resets and a notional amount of $100 million, referencing a commodity index. Selected historical data on the index are presented in Exhibit 3.\nExhibit 3\nSettlement Date\tIndex Level\nJuly (swap initiation)\t202.17\nAugust\t203.46\nSeptember\t205.02\nOctober\t206.51", "Sue Tattersall, a portfolio manager for a mid-sized pension fund, is evaluating several commodity investments for her portfolio.\nFor her first investment, Tattersall's goal is to select a commodity for which producers can quickly adjust production in response to changes in demand. She considers whether an investment in heating oil or copper would be appropriate.\nTattersall observes that Commodity X has a futures curve that is currently in contango. She expects the spot price to remain stable and considers what investment strategy would be best in order to maximize the roll return.\nTattersall bases her view of futures returns on the assumption that producers of commodities will want to sell commodities forward and thus sell commodity futures. She also believes that consumers of commodities want to lock in prices of their commodity purchases and buy commodity futures.\nTattersall holds a short position in a total return swap referencing a commodity index. The swap has monthly resets and a notional amount of $100 million. Selected historical data on the index are presented in Exhibit 1.\nExhibit 1\nSettlement Date\tIndex Level\nJanuary (swap initiation)\t202.17\nFebruary\t203.46\nMarch\t205.02\nApril\t205.02", "Jane Lee is the new chief investment officer of the Eastland University Endowment Fund (the Fund). Historically, the Fund has invested based on a 60% equity/40% fixed-income allocation. However, Lee is looking to change the fund’s allocation to include real estate assets after incorporating data from the appraisal-based Global Real Estate Fund Index. GREFI returns and volatilities imply strong risk-adjusted performance from real estate assets with low correlation with stocks and bonds. Lee is considering the following two asset allocations:\nAllocation 1: 50% equity/35% fixed income/15% real estate\nAllocation 2: 55% equity/35% fixed income/10% real estate\nAllocation 1 is based on an allocation model incorporating the GREFI data, while Allocation 2 assumes a higher correlation between real estate and other asset classes in an attempt to adjust for smoothing and therefore has a lower real estate market allocation.\nLee recently hired Jon Tarrow as the Fund’s new head of real estate. During a recent meeting, Tarrow and Lee concluded that the initial real estate investment strategy would be to acquire stabilized office buildings located in primary markets. Tarrow has been working on the potential acquisition of a 100% occupied Class A office building located in New York City. Tarrow and his junior analyst will conduct a thorough due diligence process for the property. Tarrow has also hired an appraiser to value the building and provide valuation support. The appraiser will use three different approaches to estimate the building’s value but will place emphasis on both the direct capitalization and the discounted cash flow methods.\nDuring an internal meeting, the junior analyst makes the following three statements about the appraiser’s two primary valuation methods:\nStatement 1: The direct capitalization method requires an estimation of a terminal value.\nStatement 2: Properties expected to generate faster growth will require a capitalization rate that results in a higher value.\nStatement 3: The direct capitalization and discounted cash flow methods both consider growth and property quality.\nThe appraiser has concluded that net operating income for the New York City office building is expected to be USD15.6 million for the first year, and after that, NOI is expected to increase at 0.50% annually for the foreseeable future. The building’s value is also expected to increase by 0.50% annually, and investors expect to achieve a 5.75% required rate of return given the level of risk.\nAfter considering the appraiser’s valuation, Lee then tells Tarrow that she can negotiate a purchase price of USD283 million for the building. Furthermore, she can procure a loan with an interest-only 5.25% coupon provided that the loan-to-value ratio does not exceed 65% and the debt service coverage ratio is at least 1.65×, with the loan balance due after 10 years.", "Amanda Rodriguez is an alternative investment analyst for a US investment management firm, Delphinus Brothers. Delphinus’s chief investment officer, Michael Tang, has informed Rodriguez that he wants to reduce the amount invested in traditional asset classes and gain exposure to the real estate sector by acquiring commercial property in the United States. Rodriguez is asked to analyze potential commercial real estate investments for Delphinus Brothers. Selected data on three commercial real estate properties are shown in Exhibit 1.\nExhibit 1: Selected Property Data\n\tProperty 1\tProperty 2\tProperty 3\nProperty type\tDowntown Office Building\tGrocery-Anchored Retail Center\tMulti-Family Building\nLocation\tNew York City\tMiami\tBoston\nAge\t10 years\t7 years\t5 years\nOccupancy\t90.00%\t93.00%\t95.00%\nSquare feet or number of units\t100,000 sf\t205,000 sf\t360,000 sf\nGross potential rental income\t$4,750,000\t$1,800,000\t$3,100,000\nLoss to lease\t($475,000)\t($90,000)\t$155,000\nGross rental income\t$5,225,000\t$1,890,000\t$2,945,000\nVacancy loss\t($564,333)\t($156,887)\t($157,250)\nNet rental income\t$4,660,667\t$1,733,113\t$2,787,750\nExpense reimbursement revenue\t$333,333\t$426,248\t$0\nOther income (includes % rent)\t$560,000\t$15,000\t$45,000\nEffective gross income\t$5,554,000\t$2,174,361\t$2,832,750\nProperty management fees\t($203,160)\t($83,374)\t($119,510)\nOther operating expenses\t($2,100,000)\t($342,874)\t($1,175,000)\nNet operating income\t$3,250,840\t$1,748,113\t$1,538,240\nRodriguez asks Tang about the relative magnitudes of operating expenses in determining property NOI. Tang explains that the retail center in Miami is able to be fully reimbursed for its operating expenses but that the office property in New York City and the multi-family property in Boston must absorb considerable unreimbursed operating expenses.\nTang comments to Rodriguez that these three properties may be in different phases of the real estate cycle. He specifically cites the differences between gross potential rental income and gross rental income in making his argument. In response to Tang’s comments, Rodriguez makes the two following statements about the office building in New York City:\nStatement 1: I believe that the office market in New York City is likely to enter the recovery stage of the real estate cycle within two years.\nStatement 2: I believe that the high vacancy rates indicate that the net operating income of the office building has the potential to improve within two years.\nTang continues the conversation by commenting about the relative riskiness of various types of real estate given such developments as the COVID-19 pandemic, the movement toward remote working, and the evolution of internet-based retail.\nRodriguez asks Tang about the appropriateness of various valuation methods on these three properties. Tang suggests that the sales comparison approach is likely to be useful, but he is particularly interested in seeing the valuation results from an income approach for each of the three properties.", "Michael Tang, the chief investment officer of Delphinus Brothers, asks an analyst at the firm, Amanda Rodriguez, to focus her analysis on the 100,000 square foot office property in New York City (introduced in the previous question set). Tang believes that Delphinus can purchase the property for USD50 million.\nRodriguez begins her analysis by assembling the data shown in Exhibit 1.\nExhibit 1: Six-Year NOI and DCF Assumptions for New York City Office Property\n\tYear 1\tYear 2\tYear 3\tYear 4\tYear 5\tYear 6\nNOI\t$3,250,840\t$3,185,823\t$3,217,681\t$3,265,947\t$3,339,430\t$3,439,613\nDCF assumptions\t\nInvestment holding period\t5 years\nGoing-in cap rate\t6.50%\nTerminal cap rate\t6.
