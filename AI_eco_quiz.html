<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Alternative Investments Quiz — CFA Level II</title>
<style>
:root{
  --paper:#EDF1F6; --sheet:#FFFFFF; --ink:#172033; --ink2:#4A5568; --line:#D5DCE6;
  --cobalt:#2B50C8; --cobalt-soft:#E7ECFB; --ok:#157F55; --ok-soft:#E3F4EC;
  --bad:#C23B3B; --bad-soft:#FBE9E9; --amber:#9A6412; --amber-soft:#FFF4DF; --case:#F6F8FB;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 64px}
header.bar{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 0 12px}
header.bar .wrap{padding-bottom:0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand h1 span{font-weight:400;opacity:.7;margin-left:6px;font-size:14px}
.stats{display:flex;gap:14px;font-size:14px;align-items:center}
.stats b{font-size:16px}
.s-ok b{color:#7BE0B0}.s-bad b{color:#FF9C9C}
.progress{margin-top:9px;height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#8FB0FF;width:0;transition:width .3s}
.ptext{font-size:12.5px;opacity:.8;margin-top:5px;display:flex;justify-content:space-between}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:14px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:#fff;font-weight:600}
.btn.primary:hover{background:#2343AA}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:22px 22px 18px;margin-top:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:12px;font-size:13px}
.pill{border-radius:999px;padding:2px 10px;background:var(--cobalt-soft);color:var(--cobalt);font-weight:600}
.pill.src-wrong{background:var(--bad-soft);color:var(--bad)}
.pill.src-rel{background:#EEF0F4;color:var(--ink2)}
.pill.src-sch{background:var(--ok-soft);color:var(--ok)}
.pill.src-var{background:var(--amber-soft);color:var(--amber)}
.tagline{color:var(--ink2)}
.qno{font-weight:700;color:var(--ink)}
details.case{background:var(--case);border:1px solid var(--line);border-left:4px solid var(--ink2);border-radius:8px;margin:0 0 16px}
details.case summary{padding:9px 14px;font-weight:600;font-size:14px;color:var(--ink2);list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case summary::before{content:"▸ ";}
details.case[open] summary::before{content:"▾ ";}
.casebody{padding:0 16px 14px;font-size:14.5px;max-height:460px;overflow:auto}
.casebody p{margin:.5em 0}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:13px;min-width:60%}
.tbl td{border:1px solid var(--line);padding:4px 8px;white-space:nowrap;vertical-align:top;background:#fff}
.tbl tr:first-child td{background:#F0F3F8;font-weight:600}
.stem{font-size:17px;font-weight:600;margin:4px 0 16px}
.stem p{margin:.35em 0}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--cobalt);background:#FAFBFF}
.bubble{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:var(--ink2);background:#fff}
.opt .txt{padding-top:4px}
.opt.sel-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.sel-ok .bubble{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.sel-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel-bad .bubble{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.is-ans{border-color:var(--ok)}
.opt.is-ans .bubble{border-color:var(--ok);color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:18px;border-radius:10px;padding:16px 18px}
.fb.ok{background:var(--ok-soft);border:1px solid #BFE3D1}
.fb.bad{background:var(--bad-soft);border:1px solid #F0C7C7}
.fb h3{margin:0 0 8px;font-size:17px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb h4{margin:14px 0 6px;font-size:14.5px;color:var(--ink)}
.fb p{margin:.35em 0}
.trap{background:var(--amber-soft);border-left:4px solid #E3A33A;padding:9px 12px;border-radius:6px;margin-top:10px;font-size:14.5px}
.trap b{color:var(--amber);margin-right:8px}
.formula{background:#fff;border:1px dashed #9AA8BF;border-radius:6px;padding:9px 12px;margin-top:10px;font-size:14.5px}
.formula b{color:var(--cobalt);margin-right:8px}
details.en{margin-top:10px;font-size:14px}
details.en summary{cursor:pointer;color:var(--ink2);font-weight:600}
.enbody{margin-top:6px;color:#2D3748}
.why{background:#fff;border-radius:6px;padding:9px 12px;font-size:14.5px;border:1px solid #F0C7C7}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.result h2{margin:0 0 4px;font-size:24px}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:6px 0}
.mrow{display:grid;grid-template-columns:minmax(150px,260px) 1fr 64px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar{height:12px;background:#E3E8F0;border-radius:6px;overflow:hidden}
.mbar i{display:block;height:100%}
.weak{margin:8px 0 0;padding-left:18px}
.weak li{margin:4px 0}
.muted{color:var(--ink2);font-size:13.5px}
.setup label{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:15px}
.setup select{font-family:inherit;font-size:15px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)}
.kbd{font-size:12px;color:var(--ink2)}
@media (max-width:560px){.card{padding:16px}.stem{font-size:16px}.mrow{grid-template-columns:1fr 54px}.mrow .mbar{grid-column:1/3;grid-row:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script id="quizdata" type="application/json">{"questions": [{"id": "ECO-M1-Q2", "src": "ECO 오답", "module": 1, "tag": "모든 상품 섹터에 영향: 정부 정책", "vig": 0, "stem": "Which factor would most likely affect the supply or demand of all four sectors of the Apex Fund?", "opts": {"A": "Weather", "B": "Spoilage", "C": "Government actions"}, "ans": "C", "en": "C is correct. Government actions can affect the supply or demand of all four sectors of the Apex Fund. With respect to energy, environmental mandates imposed by governments have tightened pollution standards, which have led to increasing processing costs that negatively affect demand. The supply of livestock, such as hogs and cattle, is affected by government-permitted use of drugs and growth hormones. Softs, or cash crops, can be affected by government actions, such as the attempt to maintain strategic stockpiles to control domestic prices. The level of demand and relative value of a precious metal, such as gold, is directly linked to government actions associated with managing to inflation targets.", "ko": "에너지(환경 규제), 축산(약물·성장호르몬 허용), 소프트(전략 비축), 귀금속(인플레이션 목표 관리) 모두 정부 정책의 영향을 받습니다. 날씨와 부패는 일부 섹터에만 해당합니다.", "trap": "'모든 섹터' 공통 요인을 묻는 문제. 귀금속은 날씨·부패와 거의 무관.", "f": "", "why": {"A": "날씨는 농산물·에너지에는 중요하지만 귀금속(채굴·제련) 공급·수요에는 영향이 작습니다.", "B": "부패(spoilage)는 축산·소프트 등에 해당하고 귀금속·에너지에는 해당하지 않습니다."}, "orig": "ECO Module 1 Q2"}, {"id": "ECO-M1-Q5", "src": "ECO 오답", "module": 1, "tag": "커피 곡선(contango) → Theory of storage", "vig": 0, "stem": "Based on the key conclusion from the Menlo Bank coffee market report, the shape of the coffee futures curve in Exhibit 2 is most consistent with the:", "opts": {"A": "insurance theory.", "B": "theory of storage.", "C": "hedging pressure hypothesis."}, "ans": "B", "en": "B is correct. The theory of storage focuses on the level of commodity inventories and the state of supply and demand. A commodity that is regularly stored should have a higher price in the future (contango) to account for those storage costs. Because coffee is a commodity that requires storage, its higher future price is consistent with the theory of storage.", "ko": "커피 선물은 만기가 멀수록 비싼 contango입니다. 생산자·소비자 헤지가 균형이라 hedging pressure로는 설명이 안 되고, 정기적으로 저장해야 하는 상품은 저장비용만큼 미래가격이 높다는 theory of storage로 설명됩니다.", "trap": "헤지 수요 '균형' → hedging pressure 아님. Insurance theory는 contango를 설명 못 함.", "f": "저장비용 > 편의수익 → 선물 > 현물(contango)", "why": {"A": "Insurance theory는 선물 < 현물(normal backwardation)만 예측해 contango를 설명하지 못합니다.", "C": "생산자와 소비자의 헤지가 균형이라 hedging pressure로는 곡선이 평평해야 합니다."}, "orig": "ECO Module 1 Q5"}, {"id": "ECO-M1-Q7", "src": "ECO 오답", "module": 1, "tag": "Total return = 가격 + 롤 + 담보 수익률", "vig": 0, "stem": "The Apex Fund’s three-month total return on the soybean futures trade is closest to:", "opts": {"A": "0.85%.", "B": "1.30%.", "C": "2.22%."}, "ans": "A", "en": "A is correct. The total return on the trade represents the sum of three components: price return, roll return, and collateral return.\nPrice return = (Current price − Previous price)/Previous price = (877.0 − 865.0)/865.0\n= 1.387%.\nRoll return\n= [(Near-term futures contract closing price − Farther-term futures contract closing price)/Near-term futures contract closing price] × Percentage of the position in the futures contract being rolled.\nBecause the entire position is being rolled, the percentage of the position in the futures contract being rolled is equal to 100%. So:\nRoll return = [(877.0 − 883.0)/877.0] × 100% = −0.684%.\nCollateral return = [3 months/12 months] × 0.60% = 0.15%.\nTotal return = 1.387% − 0.684% + 0.15% = 0.853%.", "ko": "가격수익률 = (877 − 865)/865 = 1.387%. 롤수익률 = (877 − 883)/877 = −0.684%(contango). 담보수익률 = 0.60% × 3/12 = 0.15%. 합계 = 0.853% ≈ 0.85%.", "trap": "롤수익률은 '근월물 − 원월물' (시간 순서 아님). 담보 수익률은 연율을 기간으로 환산.", "f": "TR = (P1 − P0)/P0 + (근월물 − 원월물)/근월물 + 연율 × 기간", "why": {"B": "계산 오류 값입니다. 1.387% − 0.684% + 0.15% = 0.85%.", "C": "롤수익률의 부호를 거꾸로(+0.684%) 더한 값(1.387 + 0.684 + 0.15)입니다. contango에서 롤수익률은 음수입니다."}, "orig": "ECO Module 1 Q7"}, {"id": "ECO-M1-Q8", "src": "ECO 오답", "module": 1, "tag": "Total return swap 정산(지수 하락)", "vig": 0, "stem": "Based on Exhibit 3, on the June settlement date, the party that is long the S&P GSCI total return swap will:", "opts": {"A": "owe a payment of $552,042.23.", "B": "receive a payment of $1,502,621.33.", "C": "receive a payment of $1,971,173.60."}, "ans": "A", "en": "A is correct. The total return swap involves a monthly cash settlement (reset) based on the performance of the underlying reference asset (S&P GSCI) given a notional amount of $25 million. If the level of the index increases between the two valuation dates (in this case, May and June), the long position (the swap buyer) receives payment. If the level of the index decreases between the two valuation dates, the swap seller receives payment.\nThe return on the reference index for the month of June is [(2,525.21 − 2,582.23)/2,582.23], which is equivalent to −2.2082%. Therefore, the swap buyer (long position) must pay the swap seller a cash settlement for the month of June. The June payment calculation is equal to $25,000,000 × −2.2082%, or −$552,042.23.", "ko": "6월 지수 수익률 = (2,525.21 − 2,582.23)/2,582.23 = −2.2082%. 지수가 하락했으므로 long(스왑 매수자)이 $25m × 2.2082% = $552,042.23을 지급합니다.", "trap": "월별 reset → 직전 정산일(5월) 대비 변화로 계산. 시작일(4월) 기준이 아님.", "f": "정산액 = 명목금액 × (I_t − I_{t−1}) / I_{t−1}", "why": {"B": "6월에는 지수가 떨어졌으므로 long은 돈을 받지 않고 지급합니다.", "C": "6월에는 지수가 떨어졌으므로 long은 돈을 받지 않고 지급합니다."}, "orig": "ECO Module 1 Q8"}, {"id": "ECO-M1-Q13", "src": "ECO 오답", "module": 1, "tag": "현물 < 선물 → Hedging pressure", "vig": 1, "stem": "Based on Exhibit 1 and McNeil’s two observations, the futures price of soybeans is most consistent with the:", "opts": {"A": "insurance theory.", "B": "theory of storage.", "C": "hedging pressure hypothesis."}, "ans": "C", "en": "C is correct. In Exhibit 1, the spot price of soybeans is less than the futures price. This observation can be explained only by the hedging pressure hypothesis. According to this hypothesis, hedging pressure occurs when both producers and consumers seek to protect themselves from commodity market price volatility by entering into price hedges to stabilize their projected profits and cash flows. If consumers are more interested in hedging than producers are, the futures price will exceed the spot price.\nIn contrast, the insurance theory predicts that the futures price has to be lower than the current spot price as a form of payment or remuneration to the speculator who takes on the price risk and provides price insurance to the commodity seller. Similarly, the theory of storage also predicts that when a commodity’s convenience yield is greater than its direct storage costs, the futures price will be lower than the spot price.", "ko": "대두 현물 846 < 선물 850(contango). 편의수익 > 저장비용이면 theory of storage는 backwardation을 예측하고, insurance theory도 backwardation만 예측합니다. 소비자 헤지가 생산자보다 강할 때 contango를 예측하는 hedging pressure hypothesis만 설명할 수 있습니다.", "trap": "주어진 두 관찰을 각각 이론에 대입: 편의수익>저장비용 → storage는 backwardation, 소비자 헤지 우세 → contango.", "f": "", "why": {"A": "Insurance theory는 선물이 현물보다 낮아야 한다고 봅니다.", "B": "편의수익이 저장비용보다 크면 theory of storage는 현물 > 선물(backwardation)을 예측합니다."}, "orig": "ECO Module 1 Q13"}, {"id": "ECO-M1-Q14", "src": "ECO 오답", "module": 1, "tag": "Total return 계산(천연가스, contango)", "vig": 1, "stem": "Based on Exhibit 2, the total return from the long position in natural gas futures is closest to:", "opts": {"A": "1.46%.", "B": "3.71%.", "C": "4.14%."}, "ans": "A", "en": "A is correct. The total return for a fully collateralized position is the sum of the price return, the roll return, and the collateral return:\nPrice return = (Current price − Previous price)/Previous price\n= (2.99 − 2.93)/2.93\n= 2.05%.\nRoll return\n= (Near-term futures closing price − Farther-term futures closing price)/Near-term futures closing price × Percentage of position in futures contract being rolled\n= [(2.99 − 3.03)/2.99] × 100%\n= −1.34%.\nCollateral return = Annual rate × Period length as a fraction of the year\n= 3% × 0.25\n= 0.75%.\nTherefore, the total return for three months = 2.05% − 1.34% + 0.75% = 1.46%.", "ko": "가격 = (2.99 − 2.93)/2.93 = 2.05%, 롤 = (2.99 − 3.03)/2.99 = −1.34%, 담보 = 3% × 0.25 = 0.75% → 합계 1.46%.", "trap": "담보수익률 3%를 그대로 쓰지 않는다(3개월 → × 0.25).", "f": "TR = 가격 + 롤 + 담보", "why": {"B": "담보수익률 3%를 3개월로 환산하지 않고 그대로 더한 값(2.05 − 1.34 + 3.00)입니다.", "C": "롤수익률 부호를 거꾸로(+1.34%) 더한 값(2.05 + 1.34 + 0.75)입니다."}, "orig": "ECO Module 1 Q14"}, {"id": "ECO-M1-Q16", "src": "ECO 오답", "module": 1, "tag": "상품 가치평가 특징", "vig": 2, "stem": "Which of Nabli’s statements regarding the valuation and storage of commodities is correct?", "opts": {"A": "Statement 1", "B": "Statement 2", "C": "Statement 3"}, "ans": "B", "en": "B is correct. The most common way to invest in commodities is via derivatives, and commodities do not generate future cash flows beyond what can be realized through their purchase and sale. Also, storage costs are positively related to futures prices. Physical assets have to be stored, and storage incurs costs (rent, insurance, spoilage, etc.). Therefore, a commodity that is regularly stored should have a higher price in the future to account for those storage costs.", "ko": "Statement 2만 맞습니다. 상품 투자는 대부분 파생상품(선물)으로 합니다. Statement 1은 반대(저장비용↑ → 선물가격↑, 양의 관계), Statement 3도 틀림(상품은 매매 외에 현금흐름이 없음).", "trap": "상품 = 현금흐름 없음 + 저장비용 있음 → 선물가격이 더 높아지는 경향.", "f": "", "why": {"A": "저장비용은 선물가격과 양(+)의 관계입니다.", "C": "상품은 배당·이자 같은 현금흐름을 만들지 않습니다."}, "orig": "ECO Module 1 Q16"}, {"id": "ECO-M1-Q18", "src": "ECO 오답", "module": 1, "tag": "Backwardation(에너지) → Theory of storage", "vig": 2, "stem": "Based on Exhibit 1 and Yamata’s research on the energy sector, the shape of the futures price curve for Brent crude oil is most consistent with the:", "opts": {"A": "insurance theory.", "B": "theory of storage.", "C": "hedging pressure hypothesis."}, "ans": "B", "en": "B is correct. The Brent crude oil futures market is in a state of backwardation: The spot price is greater than the price of near-term (i.e., nearest-to-expiration) futures contracts. Commodities (in this case, Brent crude oil) are physical assets, not virtual assets, such as stocks and bonds. Physical assets have to be stored, and storage incurs costs (rent, insurance, inspections, spoilage, etc.). According to the theory of storage, a commodity that is consumed along a value chain that allows for just-in-time delivery and use (i.e., minimal inventories and storage) can avoid these costs. Yamata’s research concluded that energy is consumed on a real-time basis and requires minimal storage. In this situation, demand dominates supply, and current prices are higher than futures prices (state of backwardation).", "ko": "현물 77.56 > 선물 73.64 → backwardation. 에너지는 실시간 소비·최소 저장 → 저장비용을 피하고 편의수익이 커서 수요가 공급을 압도 → 현물 > 선물. Theory of storage로 설명됩니다.", "trap": "'소비자가 더 걱정' → hedging pressure라면 contango를 예측해야 해 관찰(backwardation)과 모순.", "f": "편의수익 > 저장비용 → backwardation", "why": {"A": "Insurance theory도 backwardation을 예측하지만, 근거가 생산자 헤지인데 지문은 저장·소비 특성을 강조합니다.", "C": "소비자 헤지 우세라면 hedging pressure는 contango를 예측해 관찰된 backwardation과 맞지 않습니다."}, "orig": "ECO Module 1 Q18"}, {"id": "ECO-M1-Q21", "src": "ECO 오답", "module": 1, "tag": "Backwardation 상품 지수 → 높은 수익", "vig": 2, "stem": "The best response to Nabli’s question about the relative performance of the two indexes is that Index B is most likely to exhibit returns that are:", "opts": {"A": "lower than those of Index A.", "B": "the same as those of Index A.", "C": "higher than those of index A."}, "ans": "C", "en": "C is correct. Index B is likely to have higher performance than Index A in a market that is trending upward. Indexes that (perhaps inadvertently) contain contracts that more commonly trade in backwardation may improve forward-looking performance because this generates a positive roll return. Similarly, indexes that contain contracts that more commonly trade in contango may hurt performance for the same reason (i.e., negative roll return).", "ko": "Index B는 backwardation 상품 위주 → 롤수익률이 양수라 수익률이 더 높습니다. Contango 위주 Index A는 음의 롤수익률로 성과가 떨어집니다.", "trap": "가중·리밸런싱이 같으면 차이는 롤수익률에서 나온다.", "f": "Backwardation → 롤수익률 +", "why": {"A": "Contango 지수(A)가 음의 롤수익률 때문에 더 낮습니다.", "B": "롤수익률 차이 때문에 같을 수 없습니다."}, "orig": "ECO Module 1 Q21"}, {"id": "ECO-M1-Q23", "src": "ECO 오답", "module": 1, "tag": "시장참여자: 유동성 공급자", "vig": 3, "stem": "Based on Takahshi's comment, what type of commodity investor is Acaray best described as?", "opts": {"A": "Arbitrageur", "B": "Liquidity provider", "C": "Informed investor"}, "ans": "B", "en": "A is incorrect because arbitrageurs have the ability to inventory physical commodities can attempt to capitalize on mispricing between the commodity (along with related storage and financing cost) and the futures price. They may own the storage facilities (bonded warehouses, grain silos, feedlots) and work to manage that inventory in conjunction with the futures prices to attempt to make arbitrage-style profits.\nB is correct because Acaray responds to perceived imbalances between supply and demand for certain commodity (contracts), providing liquidity with the expectation of earning a profit from that benefit to either an excess of buyers or an excess of sellers.\nA speculator may be willing to act as a liquidity provider, knowing that producers and consumers may not be in the market at the same time. By buying when the producer wants to sell and selling when the consumer is ready to buy, speculators may be able to make a profit. In this sense, speculators are willing to step in, under the right pricing circumstances, to provide insurance to hedgers in return for an expected (albeit not guaranteed) profit.\nC is incorrect because speculators, who believe that they have an information advantage, seek to outperform the hedger by buying or selling futures contracts in conjunction with—or opposite from—the hedger. Thus an informed investor will have (hopefully) superior information pertaining to the underlying pricing of the commodity in the short or long term.", "ko": "수요·공급 불균형에 대응해 포지션을 잡는 것 = 생산자와 소비자가 동시에 시장에 없을 때 대신 사고팔아 주는 liquidity provider(헤저에게 보험 제공의 대가로 기대수익).", "trap": "Arbitrageur = 실물 저장으로 현물-선물 괴리 이용 / Informed investor = 정보 우위.", "f": "", "why": {"A": "Arbitrageur는 실물을 저장할 수 있어 현물(+저장·금융비용)과 선물 가격 괴리를 노립니다.", "C": "Informed investor는 가격에 대한 정보 우위를 이용합니다."}, "orig": "ECO Module 1 Q23"}, {"id": "ECO-M1-Q24", "src": "ECO 오답", "module": 1, "tag": "재고 보유 가치(편의수익) → Theory of storage", "vig": 3, "stem": "Koshinen's approach to forecasting commodity prices is most consistent with the:", "opts": {"A": "insurance theory.", "B": "theory of storage.", "C": "hedging pressure hypothesis."}, "ans": "B", "en": "B is correct. The theory of storage posits that futures prices are affected by storage costs (which increase futures prices) and the value consumers of the commodity gain from holding inventories, known as convenience yield (which decreases futures prices). Koshinen's focus on the benefits of holding inventory is most closely aligned with this theory.\nA is incorrect because the insurance theory posits that producers drive futures prices below spot prices because of their desire to insure against uncertain prices (normal backwardation).\nC is incorrect because the hedging pressure hypothesis posits that both producers and consumers hedge, so the shape of the futures curve depends on their relative hedging needs.", "ko": "'소비자가 재고를 보유해 얻는 가치' = convenience yield. 저장비용(선물↑)과 편의수익(선물↓)으로 곡선을 설명하는 theory of storage입니다.", "trap": "편의수익·저장비용 키워드 = theory of storage.", "f": "선물 ≈ 현물 + 저장비용 − 편의수익", "why": {"A": "Insurance theory는 생산자의 매도 헤지 압력으로 선물이 현물보다 낮다는 이론입니다.", "C": "Hedging pressure는 생산자·소비자 헤지 수요의 상대적 크기로 곡선을 설명합니다."}, "orig": "ECO Module 1 Q24"}, {"id": "ECO-M1-Q25", "src": "ECO 오답", "module": 1, "tag": "Short 포지션 total return", "vig": 3, "stem": "For the most recent month, the total return of the silver futures position Koshinen analyzed is closest to:", "opts": {"A": "–0.86%.", "B": "0.91%.", "C": "1.19%."}, "ans": "B", "en": "A is incorrect because this calculates price and roll return for a long position rather than a short position. For a long position, the total return consists of the price return ((current price − previous price) / previous price) plus the roll return ((near-term contract price − farther-term contract price) / near-term price) plus the collateral return.\nSo, in this case, the total return = (23.720 − 23.865) / 23.865 + (23.720 − 23.785) / 23.720 + 0.0030 / 12 = −0.00608 + −0.00274 + 0.00025 ≈ −0.0086 = –0.86%.\nB is correct because , for a long position, the total return consists of the price return ((current price − previous price) / previous price) plus the roll return ((near-term contract price − farther-term contract price) / near-term price) plus the collateral return. For a short position, it is the negative of the first two terms.\nSo, in this case, the total return = −(23.720 − 23.865) / 23.865 + −(23.720 − 23.785) / 23.720 + 0.0030 / 12 = 0.00608 + 0.00274 + 0.00025 ≈ 0.0091 = 0.91%.\nC is incorrect because this uses the annual collateral yield rather than the collateral yield for one month. For a long position, the total return consists of the price return ((current price − previous price) / previous price) plus the roll return ((near-term contract price − farther-term contract price) / near-term price) plus the collateral return. For a short position, it is the negative of the first two terms.\nSo, in this case, the total return = −(23.720 − 23.865) / 23.865 + −(23.720 − 23.785) / 23.720 + 0.0030 = 0.00608 + 0.00274 + 0.00300 ≈ 0.0119 = 1.19%.", "ko": "Long 기준 가격 = (23.720 − 23.865)/23.865 = −0.608%, 롤 = (23.720 − 23.785)/23.720 = −0.274%. Short은 이 두 항의 부호를 바꿈 → +0.608% + 0.274%. 담보 = 0.30%/12 = 0.025%. 합계 ≈ 0.91%.", "trap": "Short이면 가격·롤 수익률 부호 반대, 담보수익률은 그대로(+).", "f": "TR(short) = −가격 − 롤 + 담보", "why": {"A": "Long 포지션 기준으로 계산한 값입니다.", "C": "담보수익률을 한 달이 아니라 연율(0.30%) 그대로 더했습니다."}, "orig": "ECO Module 1 Q25"}, {"id": "ECO-M1-Q28", "src": "ECO 오답", "module": 1, "tag": "정유 차질 → 휘발유(정제품) 공급↓", "vig": 4, "stem": "Based on the meteorology forecasts, Kelsen's best recommendation is for clients to reduce their exposure to:", "opts": {"A": "gasoline.", "B": "crude oil.", "C": "natural gas."}, "ans": "A", "en": "A is correct because the meteorology forecasts call for disruptions to refinery operations. Of the three contracts, gasoline is the only product that requires refining. Therefore, it will be most impacted by the disruption. The disruption will reduce supply for gasoline, thus driving up the price. Since the clients hold short positions, they would be harmed the most if the forecasts hold true.\nB is incorrect because crude oil does not require refining. It can be stored until the byproducts from the refining process are needed. Thus, relative to gasoline, the supply should be minimally impacted and the price should stay relatively stable.\nC is incorrect because natural gas does not have to be refined. It can be used directly after it is extracted. Therefore, the forecasted disruption in refinery operations will have relatively little impact on the supply of natural gas.", "ko": "정유 시설 차질은 정제가 필요한 휘발유 공급을 줄여 가격을 올립니다. 휘발유 숏 포지션이 가장 큰 손실을 보므로 휘발유 노출을 줄여야 합니다.", "trap": "원유는 정제 전 저장 가능, 천연가스는 정제 불필요 → 정유 차질 영향 작음.", "f": "", "why": {"B": "원유는 정제가 필요 없고 저장해 둘 수 있어 정유 차질의 공급 영향이 작습니다.", "C": "천연가스는 정제 없이 바로 쓰여 정유 차질과 거의 무관합니다."}, "orig": "ECO Module 1 Q28"}, {"id": "ECO-M1-Q31", "src": "ECO 오답", "module": 1, "tag": "Backwardation/contango와 calendar spread", "vig": 5, "stem": "Based on the three precious metals futures contracts, the market for:", "opts": {"A": "gold is in backwardation, and its calendar spread is –$3.00 per ounce.", "B": "silver is in backwardation, and its calendar spread is $0.20 per ounce.", "C": "platinum is in contango, and its calendar spread is $3.90 per ounce."}, "ans": "B", "en": "A is incorrect because , while the calendar spread is correct, the gold market is in contango rather than in backwardation. The calendar spread is the difference between the near-term and the longer-term futures contract price, therefore the calendar spread of gold is $1,894.00 – $1,897.00 = –$3.00 per ounce.\nThe gold market is in contango because when the near-term futures contract price is lower than the longer-term futures contract price, the futures market for the commodity is in contango. As the 1-month futures price is lower than the 3-month futures price, the futures market of gold is in a state of contango.\nB is correct because the calendar spread is the difference between the near-term and the longer-term futures contract price, therefore the calendar spread of silver is $27.98 – $27.78 = $0.20 per ounce.\nThe silver market is in backwardation, as when the near-term (i.e., closer to expiration) futures contract price is higher than the longer-term futures contract price, the futures market for the commodity is in backwardation. As the 1-month futures price is higher than the 3-month futures price, the futures market of silver is in a state of backwardation.\nC is incorrect because , while the platinum market is in contango, the calendar spread is incorrect. The calendar spread is the difference between the near-term and the longer-term futures contract price, therefore the calendar spread of platinum is $1,143.80 – $1,147.70 = –$3.90 per ounce instead of $3.90 per ounce.\nThe platinum market is in contango because when the near-term futures contract price is lower than the longer-term futures contract price, the futures market for the commodity is in contango. As the 1-month futures price is lower than the 3-month futures price, the futures market of platinum is in a state of contango.", "ko": "Calendar spread = 근월물 − 원월물. 은: 27.98 − 27.78 = +0.20 → 근월물이 더 비싼 backwardation. 금: −3.00(contango), 백금: −3.90(contango).", "trap": "스프레드 부호: backwardation +, contango −.", "f": "Calendar spread = 근월물 − 원월물 ; Basis = 현물 − 선물", "why": {"A": "금의 스프레드 −3.00은 맞지만, 음수이므로 contango입니다.", "C": "백금은 contango가 맞지만 스프레드는 −3.90(음수)입니다."}, "orig": "ECO Module 1 Q31"}, {"id": "ECO-M1-Q35", "src": "ECO 오답", "module": 1, "tag": "생산량 조절 유연성: 금속·정유 모두 낮음", "vig": 6, "stem": "Would either of the commodities considered by Tattersall be appropriate to meet her first investment's goal?", "opts": {"A": "No", "B": "Yes, copper would be appropriate", "C": "Yes, heating oil would be appropriate"}, "ans": "A", "en": "A is correct because neither copper nor heating oil would be appropriate. Similar to refining crude oil, creating the economies of scale involved in the smelter and ore processing plants is critical. These are huge facilities for which marginal costs (i.e., the cost to convert the last pound or kilogram of processed ore into a useful metal) decline substantially with both the scale of the facility and its utilization (output as a percentage of capacity). As a result, when supply exceeds demand for a given industrial metal, it is difficult for suppliers to either cut back production or halt it entirely.\nB is incorrect because copper would not be appropriate; when supply exceeds demand for a given industrial metal (copper), it is difficult for suppliers to either cut back production or halt it entirely.\nC is incorrect because heating oil refining volumes are not easily curtailed, therefore heating oil would not be appropriate. Similar to refining crude oil, creating the economies of scale involved in the smelter and ore processing plants is critical. These are huge facilities for which marginal costs (i.e., the cost to convert the last pound or kilogram of processed ore into a useful metal) decline substantially with both the scale of the facility and its utilization (output as a percentage of capacity). As a result, when supply exceeds demand for a given industrial metal, it is difficult for suppliers to either cut back production or halt it entirely.", "ko": "구리(제련)와 난방유(정유) 모두 대규모 설비의 규모의 경제가 중요해, 공급이 수요를 넘어도 생산을 줄이거나 멈추기 어렵습니다. 둘 다 '빠르게 생산 조절'이라는 목표에 맞지 않습니다.", "trap": "대규모 고정설비 산업 = 가동률을 높게 유지하려 해 감산이 어렵다.", "f": "", "why": {"B": "구리 제련은 대형 설비라 공급 과잉에도 감산이 어렵습니다.", "C": "난방유 정제량도 쉽게 줄이지 못합니다."}, "orig": "ECO Module 1 Q35"}, {"id": "ECO-M1-Q38", "src": "ECO 오답", "module": 1, "tag": "Total return swap: 지수 불변 → 정산 0", "vig": 6, "stem": "On the April settlement date of the total return swap, Tattersall should have:", "opts": {"A": "made a payment.", "B": "received a payment.", "C": "neither made nor received a payment."}, "ans": "C", "en": "A is incorrect because , with the reference index level being the same at the end of March and April, no payment would have taken place on the April settlement date of the total return swap.\nB is incorrect because , with the reference index level being the same at the end of March and April, no payment would have taken place on the April settlement date of the total return swap.\nC is correct because the total return swap involves a monthly cash settlement (reset) based on the performance of the underlying reference asset given a notional amount of $100 million. If the level of the index increases between the two valuation dates, the short position (the swap seller) makes a payment. If the level of the index decreases between the two valuation dates, the short position receives a payment.\nThe return on the reference index for the month of April is [(205.02 − 205.02) / 205.02] = 0%. Therefore, no payment would have taken place on the April settlement date.", "ko": "3월 말과 4월 말 지수가 205.02로 같아 수익률 0% → 4월 정산일에는 주고받을 돈이 없습니다.", "trap": "월별 reset → 직전 달 대비 변화만 본다(개시일 대비 누적 아님).", "f": "정산액 = 명목 × (I_t − I_{t−1})/I_{t−1}", "why": {"A": "지수가 올랐다면 short이 지급했겠지만, 4월에는 변화가 없습니다.", "B": "지수가 내렸다면 short이 수취했겠지만, 4월에는 변화가 없습니다."}, "orig": "ECO Module 1 Q38"}, {"id": "ECO-M1-Q39", "src": "ECO 오답", "module": 1, "tag": "계절적 '수요' → 에너지", "vig": null, "stem": "A commodity investor wishing to exploit seasonal variability in demand is most likely to trade in:", "opts": {"A": "grains.", "B": "energy.", "C": "livestock."}, "ans": "B", "en": "A is incorrect because seasonal factors are more likely to affect the supply of grains than the demand. Because demand for grains is year round, they are regularly stored in silos and warehouses globally.\nB is correct because the products from crude oil and metal ore have seasonal demands depending on weather (e.g., gasoline demand in the summer and heating oil demand in the winter) that affect the life cycle and usage of the underlying commodity.\nC is incorrect because seasonal factors are more likely to affect the supply of livestock than its demand. Livestock grows year round, but good weather and access to high-quality pasture and feed accelerate weight gain. As a result, there is fluctuation in the availability of animals ready for slaughter.", "ko": "에너지는 여름(휘발유·냉방)과 겨울(난방유·난방)에 수요가 달라지는 계절적 수요가 있습니다. 곡물·축산은 수요는 연중 비슷하고 계절성이 '공급'에 나타납니다.", "trap": "에너지 = 계절적 수요 / 곡물·축산 = 계절적 공급.", "f": "", "why": {"A": "곡물은 수확기 때문에 공급이 계절적이고, 수요는 연중 존재합니다.", "C": "축산은 날씨·목초에 따라 출하 가능 물량(공급)이 변하고, 수요는 연중 존재합니다."}, "orig": "ECO Module 1 Q39"}, {"id": "ECO-M1-Q41", "src": "ECO 오답", "module": 1, "tag": "헤저에게 보험 제공 → 유동성 공급자", "vig": null, "stem": "A commodity investor's strategy is to provide insurance to hedgers in return for an expected profit. This investor is best described as a(n):", "opts": {"A": "arbitrageur.", "B": "liquidity provider.", "C": "informed investor."}, "ans": "B", "en": "A is incorrect because an arbitrageur is someone who the ability to inventory physical commodities can attempt to capitalize on mispricing between the commodity (along with related storage and financing cost) and the futures price.\nB is correct because a speculator may be willing to act as a liquidity provider, knowing that producers and consumers may not be in the market at the same time. By buying when the producer wants to sell and selling when the consumer is ready to buy, speculators may be able to make a profit. In this sense, speculators are willing to step in, under the right pricing circumstances, to provide insurance to hedgers in return for an expected (albeit not guaranteed) profit.\nC is incorrect because informed investors are knowledgeable market participants who may be seeking to hedge or speculate on future prices, not to generate a potential profit by matching supply to demand. Informed investors predominantly keep commodity futures markets efficient by capitalizing on mispricing attributable to a lack of information in the marketplace.", "ko": "생산자가 팔 때 사고, 소비자가 살 때 팔아 헤저에게 보험을 제공하고 기대이익을 얻는 투기자 = liquidity provider.", "trap": "", "f": "", "why": {"A": "Arbitrageur는 실물 재고와 선물 가격 차이를 이용합니다.", "C": "Informed investor는 정보 우위로 가격 오류를 이용합니다."}, "orig": "ECO Module 1 Q41"}, {"id": "ECO-M1-Q42", "src": "ECO 오답", "module": 1, "tag": "Total return 계산(1개월)", "vig": null, "stem": "A commodity investor bought fully collateralized April contracts in a commodity on 1 March with the intent to roll them into May contracts on 1 April. The details of the trade are presented below.\n\t1 March\t1 April\nApril contract price\t14.70\t15.20\nMay contract price\t14.60\t14.80\nAnnual interest rate on government bills\t3.6%\t3.6%\nThe investor's total return for March was closest to:", "opts": {"A": "3.40%.", "B": "5.07%.", "C": "6.33%."}, "ans": "C", "en": "A is incorrect because it considers only the price yield = (Current price − Previous price) / Previous price. In this case, (15.20 – 14.70) / 14.70 = 0.0340 ≈ 3.40%.\nB is incorrect. Incorrect as it treats the roll yield as the price return on the May contract; or = roll return = (14.80 – 14.60) / 14.60 ≈ 0.0137. Accordingly, total return = 0.0340 + 0.0137 + 0.003 = 0.0507 ≈ 5.07%.\nC is correct because Total return = Spot yield + Roll yield + Collateral yield.\nThe price yield or Price return = (Current price − Previous price) / Previous price. In this case, (15.20 – 14.70) / 14.70 ≈ 0.0340.\nThe roll return = [(Near-term futures contract closing price − Farther-term futures contract closing price)/Near-term futures contract closing price] × Percentage of the position in the futures contract being rolled. In this case, [(15.20 – 14.80) / 15.20] × 1 ≈ 0.0263.\nThe collateral return is the one-month return on government bonds, or 0.036/12 = 0.003.\nAccordingly, 0.0340 + 0.0263 + 0.003 ≈ 0.0633 ≈ 6.33%.", "ko": "가격 = (15.20 − 14.70)/14.70 = 3.40%. 롤(4월 1일 기준) = (15.20 − 14.80)/15.20 = 2.63%(backwardation). 담보 = 3.6%/12 = 0.30%. 합계 ≈ 6.33%.", "trap": "롤수익률은 롤하는 시점(4월 1일)의 근월물·원월물 가격으로 계산.", "f": "TR = 가격 + 롤 + 담보", "why": {"A": "가격수익률만 계산했습니다.", "B": "롤수익률 대신 5월물 가격 변화((14.80 − 14.60)/14.60)를 쓴 오류입니다."}, "orig": "ECO Module 1 Q42"}, {"id": "ECO-M1-Q43", "src": "ECO 오답", "module": 1, "tag": "상품 비중 조정 → Total return swap", "vig": null, "stem": "For a portfolio manager seeking to change their allocation to commodities, it would be most appropriate to enter:", "opts": {"A": "a basis swap.", "B": "a total return swap.", "C": "an excess return swap."}, "ans": "B", "en": "A is incorrect because in a basis swap periodic payments are exchanged based on the values of two related commodity reference prices that are not perfectly correlated. This is not appropriate for an investor seeking an overall allocation to commodities.\nB is correct because a total return swap is generally used by large institutional investors (e.g., pension plans) as opposed to commodity producers or buyers. With a total return swap, the investor seeks exposure to commodity returns, often because of the low return correlation of commodities with other asset classes (e.g., stocks or bonds) or as a reflection of the view that commodities provide a valuable inflation hedge for asset/liability matching (ALM). Therefore, such investors would engage in a total return swap that provides them with long exposure to the future returns from a commodity index that is used as the reference price.\nC is incorrect because in an excess return swap, the payments to either party are driven primarily by the changes in price of each of the futures contracts that make up the index. These are more commonly used by people seeking to hedge exposure to the physical commodity.", "ko": "상품 전체 배분을 바꾸려는 기관투자자(연기금 등)는 상품 지수의 총수익에 노출되는 total return swap을 씁니다(낮은 상관관계, 인플레이션 헤지 목적).", "trap": "TRS = 기관의 자산배분 / Excess return swap = 생산자·구매자 헤지 / Basis swap = 비유동 원재료 베이시스 헤지.", "f": "", "why": {"A": "Basis swap은 두 관련 상품 가격 차이를 교환해 베이시스 위험을 헤지하는 용도입니다.", "C": "Excess return swap은 주로 실물 상품 노출을 헤지하는 쪽이 씁니다."}, "orig": "ECO Module 1 Q43"}, {"id": "ECO-M1-Q48", "src": "ECO 오답", "module": 1, "tag": "Contango: 가치 잠식", "vig": null, "stem": "When futures contracts are in contango:", "opts": {"A": "their value tends to erode over time.", "B": "they have a positive calendar spread.", "C": "they must be settled by physical delivery."}, "ans": "A", "en": "A is correct because as a long owner of a futures contract in contango, value will erode over time as the contract pricing moves closer to the spot price, assuming all else is unchanged.\nB is incorrect because a positive calendar spread is associated with futures markets that are in backwardation, whereas a negative calendar spread in commodities is associated with futures markets that are in contango.\nC is incorrect because with respect to futures completion of the contract may permit cash settlement or require physical delivery.", "ko": "Contango에서 long 선물은 만기가 다가오며 가격이 (더 낮은) 현물로 수렴해 가치가 서서히 줄어듭니다(음의 롤수익률).", "trap": "Contango = calendar spread 음수.", "f": "", "why": {"B": "양의 calendar spread는 backwardation의 특징입니다.", "C": "선물은 현금결제도 가능하며 곡선 모양과 결제 방식은 무관합니다."}, "orig": "ECO Module 1 Q48"}, {"id": "ECO-M1-Q49", "src": "ECO 오답", "module": 1, "tag": "Contango를 설명 못 하는 이론", "vig": null, "stem": "Which theory of commodities futures returns fails to explain contango?", "opts": {"A": "Insurance theory", "B": "Theory of storage", "C": "Hedging pressure hypothesis"}, "ans": "A", "en": "A is correct because with respect to the insurance theory, Keynes (1930), the noted economist and market speculator, proposed one of the earliest known theories on the shape of a commodity futures price curve. Also known as his theory of normal backwardation, this theory posits that the futures price has to be lower than the current spot price as a form of payment or remuneration to the speculator who takes on the price risk and provides price insurance to the commodity seller. But, markets failed to match Keynes’s hypothesis a more sophisticated view developed to explain futures markets in contango (i.e., when the shape of the futures price curve is upward sloping with more distant contract dates), recognizing that certain commodity futures markets often show persistently higher prices in the future as opposed to the backwardation outlined by Keynes.\nB is incorrect because the theory of storage focuses on how the level of commodity inventories helps shape commodity futures price curves. Therefore, a commodity that is regularly stored should have a higher price in the future (contango) to account for those storage costs. In other words, supply dominates demand.\nC is incorrect because the hedging pressure hypothesis addresses the shortfall of the insurance theory: a more sophisticated view developed to explain futures markets in contango (i.e., when the shape of the futures price curve is upward sloping with more distant contract dates), recognizing that certain commodity futures markets often show persistently higher prices in the future as opposed to the backwardation outlined by Keynes. This view is called the hedging pressure hypothesis.", "ko": "Keynes의 insurance theory는 선물 < 현물(normal backwardation)이 정상이라고 보므로 contango를 설명하지 못합니다. Hedging pressure와 theory of storage는 양방향 모두 설명할 수 있습니다.", "trap": "Insurance = backwardation만 / 나머지 둘 = 양방향.", "f": "", "why": {"B": "저장비용이 편의수익보다 크면 contango를 설명합니다.", "C": "소비자 헤지가 우세하면 contango를 설명합니다(insurance theory의 한계를 보완한 이론)."}, "orig": "ECO Module 1 Q49"}, {"id": "ECO-M1-Q50", "src": "ECO 오답", "module": 1, "tag": "Contango 롤 → 계약 수 감소", "vig": null, "stem": "To maintain the same exposure in the futures markets when in contango, rolling forward the expiring futures contracts requires buying:", "opts": {"A": "a lower number of futures contracts.", "B": "the same number of futures contracts.", "C": "a higher number of futures contracts."}, "ans": "A", "en": "A is correct because if the futures price curve shape is being driven by contango—with a higher futures price in the far contract—this scenario will require the purchase of fewer commodity contracts than in the near position.\nB is incorrect because this applies when the price curve is flat. If the futures price curve shape is being driven by contango—with a higher futures price in the far contract—this scenario will require the purchase of fewer commodity contracts than in the near position.\nC is incorrect because a portfolio may require buying more far contracts than the near contracts being sold. Investors can observe this scenario if backwardation is driving the shape of the commodity futures price curve.", "ko": "Contango에서는 원월물이 더 비싸므로 같은 금액 노출을 유지하려면 더 적은 수의 계약을 삽니다.", "trap": "Backwardation → 더 많은 계약(싸니까) / Contango → 더 적은 계약.", "f": "계약 수 = 노출금액 / 새 계약 가격", "why": {"B": "곡선이 평평할 때의 경우입니다.", "C": "Backwardation일 때의 경우입니다."}, "orig": "ECO Module 1 Q50"}, {"id": "ECO-M1-Q56", "src": "ECO 오답", "module": 1, "tag": "계절성: 에너지 '흐름(flow)'", "vig": null, "stem": "When estimating the impact of stocks and flows on commodity prices, seasonality primarily influences the:", "opts": {"A": "flow of grain commodities.", "B": "flow of energy commodities.", "C": "stock of base material commodities."}, "ans": "B", "en": "A is incorrect because grains provide human and animal sustenance. As the needs and consumption of grains is necessary year round, the flow of grains is less affected by seasonality. However, seasonality affects the stock (production) of grains due to natural growing periods. The primary influencers of the flow of grain commodities include weather (moisture, temperature), disease, consumer preferences, genetic modification, biofuel substitution, population growth.\nB is correct because seasonality drives the change in stocks and flows resulting from changes in season or the time of year. The demand or consumption of energy depends upon the season (increase consumption in the winter for heating, summer for cooling).  Primary influences for energy commodities include: pipeline and tanker reliability, seasonality (summer/winter), adverse weather (cold, hurricanes), automobile/truck sales, geopolitical instability, environmental requirements, economic (GDP) growth.\nC is incorrect because the primary influencers of the stock of base materials include mined acreage, smelter capacity, economic (GDP) stage of industrial/consumer development. As many base materials can be produced year round and are not as dependent on seasons or natural cyclicality, they are less affected by seasonality.", "ko": "에너지는 계절(겨울 난방, 여름 냉방)에 따라 소비, 즉 흐름(flow)이 달라집니다. 곡물은 계절성이 생산(stock)에 나타나고, 기초소재는 연중 생산돼 계절성이 약합니다.", "trap": "Flow = 소비/수요, Stock = 생산/재고.", "f": "", "why": {"A": "곡물 소비(flow)는 연중 꾸준해 계절성이 작고, 계절성은 생산(stock)에 나타납니다.", "C": "기초소재는 연중 생산 가능해 계절성 영향이 작습니다."}, "orig": "ECO Module 1 Q56"}, {"id": "ECO-M1-Q62", "src": "ECO 오답", "module": 1, "tag": "롤 방법: Backwardation 극대화", "vig": null, "stem": "Which of the following rolling methods with respect to commodity indexes would most likely result in the highest return?", "opts": {"A": "Most liquid contract", "B": "Maximizing contango", "C": "Maximizing backwardation"}, "ans": "C", "en": "A is incorrect because the most liquid contract rolling methodology focuses on owning the front (i.e., near-term) contracts to address the highest liquidity and where supply and demand shocks are most likely to have an impact. As the shocks can be positive or negative, there is no systematic impact on the roll return.\nB is incorrect because maximizing contango in the rolling of futures contracts of commodities will decrease the roll return, decreasing the return of the index. Indexes that choose (perhaps inadvertently) contracts that more commonly trade in backwardation may appear to improve forward-looking performance (because this generates a positive roll return), whereas those that more commonly trade in contango may hurt performance.\nC is correct because maximizing backwardation in the rolling of futures contracts of commodities will maximize the roll return, increasing the return of the index. Using the most liquid contract to roll forward will be using a contract that may be in contango (negative roll yield) or not be one with the highest roll yield. Indexes that choose (perhaps inadvertently) contracts that more commonly trade in backwardation may appear to improve forward-looking performance (because this generates a positive roll return), whereas those that more commonly trade in contango may hurt performance.", "ko": "Backwardation이 가장 큰(또는 contango가 가장 작은) 원월물로 롤하면 롤수익률이 최대가 되어 지수 수익률이 가장 높아집니다.", "trap": "", "f": "", "why": {"A": "가장 유동적인 근월물로 롤하는 방식은 롤수익률에 체계적 효과가 없습니다.", "B": "Contango를 극대화하면 롤수익률이 가장 나빠집니다."}, "orig": "ECO Module 1 Q62"}, {"id": "ECO-M1-Q65", "src": "ECO 오답", "module": 1, "tag": "항공사 연료 헤지 → Excess return swap", "vig": null, "stem": "An airline hedging against rising fuel prices would most appropriately enter:", "opts": {"A": "a basis swap.", "B": "a total return swap.", "C": "an excess return swap."}, "ans": "C", "en": "A is incorrect because one would need to enter into a basis swap, in which periodic payments are exchanged based on the values of two related commodity reference prices that are not perfectly correlated. These swaps are often used to adjust for the difference (called the basis) between a highly liquid futures contract in a commodity and an illiquid but related material.\nB is incorrect because a total return swap is generally used by large institutional investors (e.g., pension plans) as opposed to commodity producers or buyers. With a total return swap, the investor seeks exposure to commodity returns, often because of the low return correlation of commodities with other asset classes (e.g., stocks or bonds) or as a reflection of the view that commodities provide a valuable inflation hedge for asset/liability matching (ALM).\nC is correct because given that oil prices are subject to many events beyond a company’s control, a company looking to protect itself from financing risk may find that a swap can be a valuable tool. There are many types of swaps available in the marketplace because they are not standardized, exchange-traded contracts like futures. In an excess return swap, the payments to either party are driven primarily by the changes in price of each of the futures contracts that make up the index. The net change in the prices of the underlying futures contracts is defined as the 'excess' return, and the excess return is multiplied by the contract’s notional amount to determine the payments between buyer and seller.", "ko": "항공사는 연료 가격이 기준가를 넘는 부분만 보전받으면 됩니다 → excess return swap(초과분 × 명목금액 수취, 기준 이하면 지급 없음).", "trap": "TRS는 기관투자자의 상품 노출용. 구매자·생산자 헤지는 excess return swap.", "f": "", "why": {"A": "Basis swap은 유동적 선물과 비유동 관련 상품 사이의 베이시스를 헤지할 때 씁니다.", "B": "Total return swap은 주로 연기금 같은 기관이 상품 수익 노출을 얻을 때 씁니다."}, "orig": "ECO Module 1 Q65"}, {"id": "VAR-M1-01", "src": "변형", "module": 1, "tag": "계절성: 곡물은 '공급'", "vig": null, "stem": "Seasonality in the grain market primarily affects grain:", "opts": {"A": "demand, because consumption is concentrated in winter.", "B": "supply, because production follows harvest cycles.", "C": "neither supply nor demand, because grains cannot be stored."}, "ans": "B", "en": "Grain production is seasonal, with deliverable futures contracts timed to coincide with the harvest, and grains can be stored for significant periods after harvest. Demand for grains is year-round, so seasonality affects supply rather than demand.", "ko": "곡물은 수확 주기에 따라 생산(공급)이 계절적이고, 수요는 연중 꾸준합니다. 수확 후 장기간 저장도 가능합니다.", "trap": "계절적 수요 = 에너지 / 계절적 공급 = 곡물·축산.", "f": "", "why": {"A": "곡물 수요는 연중 존재합니다. 계절적 수요는 에너지의 특징입니다.", "C": "곡물은 수확 후 오래 저장할 수 있습니다."}, "orig": "변형 (오답노트 R30, Schweser LOS 30.a–b)"}, {"id": "VAR-M1-02", "src": "변형", "module": 1, "tag": "롤수익률 계산(backwardation)", "vig": null, "stem": "A manager rolls an expiring long futures position trading at 52.00 into a longer-dated contract trading at 50.70. The roll return is closest to:", "opts": {"A": "−2.50%.", "B": "+2.50%.", "C": "+2.56%."}, "ans": "B", "en": "Roll return = (near-term futures price − farther-term futures price) / near-term futures price = (52.00 − 50.70) / 52.00 = +2.50%. The market is in backwardation, so the roll return is positive.", "ko": "롤수익률 = (근월물 − 원월물) / 근월물 = (52.00 − 50.70) / 52.00 = +2.50%. 원월물이 더 싼 backwardation이라 양수.", "trap": "분모는 근월물 가격. 부호는 '근월물 − 원월물'.", "f": "Roll return = (근월물 − 원월물) / 근월물", "why": {"A": "부호를 거꾸로 했습니다. Backwardation에서는 양수입니다.", "C": "분모에 원월물 가격(50.70)을 쓴 값입니다."}, "orig": "변형 (오답노트 R30, Schweser LOS 30.h)"}, {"id": "VAR-M1-03", "src": "변형", "module": 1, "tag": "Total return swap 정산(고정지급 포함)", "vig": null, "stem": "An investor is long a commodity total return swap with a notional amount of $20 million. Each month the long pays a fixed 0.20% and receives the commodity's total return. If the commodity's total return for the month is +1.50%, the long will most likely:", "opts": {"A": "receive $260,000.", "B": "receive $300,000.", "C": "pay $40,000."}, "ans": "A", "en": "Each period, the long receives the total return on the commodity times the notional amount, net of the fixed payment promised to the short: (1.50% − 0.20%) × $20,000,000 = $260,000. If the total return were negative, the long would pay the fixed percentage plus the negative return times the notional amount.", "ko": "Long 순수취 = (총수익 − 고정지급) × 명목 = (1.50% − 0.20%) × $20m = $260,000.", "trap": "고정지급분을 차감한 '순액'으로 정산. 수익이 음수면 long이 (고정 + 손실)만큼 지급.", "f": "정산 = (총수익률 − 고정지급률) × 명목금액", "why": {"B": "고정지급 0.20%를 차감하지 않은 금액입니다.", "C": "고정지급분만 계산한 엉뚱한 금액입니다. 수익률이 고정지급보다 커서 long이 받습니다."}, "orig": "변형 (오답노트 R30, Schweser LOS 30.i)"}, {"id": "VAR-M1-04", "src": "변형", "module": 1, "tag": "Excess return swap: 기준 미달 → 지급 없음", "vig": null, "stem": "In a commodity excess return swap, if the commodity price ends a period below the fixed benchmark value, the swap buyer most likely:", "opts": {"A": "pays the shortfall multiplied by the notional amount.", "B": "neither receives nor makes a payment for that period.", "C": "receives the fixed benchmark value multiplied by the notional amount."}, "ans": "B", "en": "In an excess return swap, a party may make a single payment at initiation and then receive periodic payments of any percentage by which the commodity price exceeds some fixed or benchmark value, times the notional value of the swap. In months in which the commodity price does not exceed the fixed value, no payments are made.", "ko": "Excess return swap은 가격이 기준을 '넘는' 부분만 받습니다. 기준 이하이면 그 기간은 주고받는 돈이 없습니다.", "trap": "TRS와 달리 하락분을 지급하지 않음.", "f": "지급 = max(0, 가격 − 기준)/기준 × 명목", "why": {"A": "하락분을 내는 것은 total return swap의 구조입니다.", "C": "기준 이하일 때는 받는 돈이 없습니다."}, "orig": "변형 (오답노트 R30, Schweser LOS 30.i)"}, {"id": "VAR-M1-05", "src": "변형", "module": 1, "tag": "추세장 리밸런싱 → 수익률↓", "vig": null, "stem": "Compared with less frequent rebalancing, frequent rebalancing of a commodity index's portfolio weights in a market where prices are trending is most likely to:", "opts": {"A": "increase index returns.", "B": "decrease index returns.", "C": "have no effect on index returns."}, "ans": "B", "en": "Rebalancing portfolio weights will decrease returns when prices are trending but increase returns when price changes are choppy and mean-reverting.", "ko": "추세장에서는 오르는 상품을 팔고 내리는 상품을 사는 리밸런싱이 수익을 깎습니다. 횡보·평균회귀장에서는 반대로 수익을 높입니다.", "trap": "추세장 = 리밸런싱 불리 / 평균회귀장 = 리밸런싱 유리.", "f": "", "why": {"A": "리밸런싱이 수익을 높이는 것은 가격이 출렁이며 평균회귀할 때입니다.", "C": "리밸런싱 빈도는 수익률에 영향을 줍니다."}, "orig": "변형 (오답노트 R30, Schweser LOS 30.j)"}, {"id": "ECO-M2-Q3", "src": "ECO 오답", "module": 2, "tag": "Due diligence: 100% 임대 → Current lease review", "vig": 7, "stem": "Which of the following phases of the due diligence process is most likely to ensure that the building’s NOI projection for the next year is correct?", "opts": {"A": "Documentation review", "B": "Current lease review", "C": "Future lease outlook"}, "ans": "B", "en": "B is correct. Currently, the building is 100% occupied, so the current lease review would provide information as to whether there will be any leases up for renewal during the next year, which ensures that the NOI projections are correct.\nA is incorrect because documentation review ensures that there are no legal issues that may complicate the purchase of the building.\nC is incorrect given that the building is 100% occupied, so the outlook for re-leasing space is not likely to be included in NOI projections.", "ko": "건물이 100% 임대 중이므로 내년 NOI는 현재 임대계약(만기·임대료·연체 이력)에 달려 있습니다. 그래서 current lease review가 NOI 추정 검증에 가장 중요합니다.", "trap": "공실 없음 → future lease outlook(재임대 전망)은 해당 사항이 거의 없음. Documentation review = 법적 권리(lien 등).", "f": "", "why": {"A": "서류 검토는 권리관계(lien, 소유권 분쟁) 같은 법적 문제를 확인하는 단계입니다.", "C": "100% 임대 상태라 빈 공간 재임대 전망은 내년 NOI 추정에 거의 들어가지 않습니다."}, "orig": "ECO Module 2 Q3"}, {"id": "ECO-M2-Q5", "src": "ECO 오답", "module": 2, "tag": "최대 대출액: LTV vs DSCR 중 작은 값", "vig": 7, "stem": "The maximum loan amount that the Fund can obtain on the New York City office building is closest to:", "opts": {"A": "USD111.5 million.", "B": "USD180.1 million.", "C": "USD184 million."}, "ans": "B", "en": "B is correct. Based on the LTV, the maximum loan amount would be 65% of 283 million, or 183.95 million, with a DSC of 1.62×, which is below the 1.65 minimum. However, with a minimum DSC of 1.65×, the maximum debt service would be 15,600,000/1.65 = 9,454,545. This amount is the mortgage payment that would result in a 1.65× DSC for an interest-only loan. If the loan is interest only, then we can obtain the loan amount by simply dividing the mortgage payment by the interest rate. Therefore, the loan amount would be 9,454,545/0.0525 = 180,086,580 (= 180,100,000 after rounding). Because the loan amount based on the minimum DSC results in a lower loan amount, that would be the maximum amount that could be borrowed.\nResponse A is incorrect because USD117,100,000 is incorrectly calculated as follows:\n283,000,000/1.65 = 180,086,580.\n180,086,580 × 65% = 111,484,848 (= 111,500,000 after rounding).\nC is incorrect because USD184 million is the rounded loan amount based on the maximum LTV of 65%. Because the loan amount based on the minimum DSC results in a lower loan amount, USD180,086,580 ($180,100,000 rounded) would be the maximum loan amount that could be borrowed.", "ko": "LTV 기준: 283m × 65% = 183.95m. DSCR 기준: 부채상환액 = 15.6m / 1.65 = 9.4545m → 이자만 내는 대출이므로 대출액 = 9.4545m / 5.25% = 180.09m. 둘 중 작은 USD180.1m이 최대.", "trap": "두 기준 중 '더 낮은' 금액이 한도. 이자만 내는 대출 → 대출액 = 상환액 / 금리.", "f": "Debt service = NOI / DSCR ; Loan = Debt service / 금리 ; Max loan = min(LTV × 가치, DSCR 기준)", "why": {"A": "가치를 DSCR로 나눈 뒤 LTV를 곱하는 엉뚱한 계산입니다.", "C": "LTV 기준 금액입니다. 이 금액이면 DSCR이 1.62×로 최소 1.65×에 못 미칩니다."}, "orig": "ECO Module 2 Q5"}, {"id": "ECO-M2-Q7", "src": "ECO 오답", "module": 2, "tag": "Loss to lease로 사이클 판단", "vig": 8, "stem": "Which of the following properties is least likely to be in the oversupply phase of its real estate cycle, based on Tang’s argument?", "opts": {"A": "The office building in New York City", "B": "The retail center in Miami", "C": "The multi-family complex in Boston"}, "ans": "C", "en": "C is correct. The difference between gross potential rental income and gross rental income is represented by the loss to lease figure. A positive loss to lease reflects that current lease rates are lower than potential lease rates. The multi-family complex in Boston is the only property of the three for which gross rental income is lower than potential income. This is likely due to a lack of supply of rental housing. Responses A and B are both incorrect because the negative loss to lease may indicate excess supply and a likelihood that lease rates are decreasing.", "ko": "Loss to lease = gross potential(시장 임대료) − gross rental(기존 계약). 보스턴은 +155,000 → 시장 임대료가 기존 계약보다 높아 공급 부족(oversupply 아님). 뉴욕·마이애미는 음수 → 시장 임대료가 기존 계약보다 낮아 공급 과잉 가능성.", "trap": "양수 = 시장 임대료 > 계약 임대료(상승기). 음수 = 시장 임대료 하락(공급 과잉 신호).", "f": "Loss to lease = GPRI − GRI (Exhibit 기준)", "why": {"A": "뉴욕 오피스는 loss to lease가 음수라 공급 과잉 국면일 가능성이 있습니다.", "B": "마이애미 리테일도 음수라 공급 과잉 국면일 가능성이 있습니다."}, "orig": "ECO Module 2 Q7"}, {"id": "ECO-M2-Q11", "src": "ECO 오답", "module": 2, "tag": "Terminal value = (n+1)년 NOI / terminal cap", "vig": 9, "stem": "Which of the following amounts is closest to the undiscounted terminal value of the New York City office property at the end of the five-year investment holding period?", "opts": {"A": "USD57.3 million", "B": "USD52.9 million", "C": "USD55.7 million"}, "ans": "A", "en": "A is correct. Terminal value is calculated by dividing the sixth-year NOI by the terminal cap rate of 6% (3,439,613/0.06). Response B is incorrect because this amount is obtained by dividing the sixth-year NOI by the going-in cap rate. Response C incorrectly uses the fifth-year NOI instead of the sixth-year NOI.", "ko": "5년 보유 → 종가 = 6년차 NOI / terminal cap rate = 3,439,613 / 0.06 = USD57.3m.", "trap": "5년차가 아니라 6년차 NOI, going-in이 아니라 terminal cap rate.", "f": "TV_n = NOI_{n+1} / terminal cap rate", "why": {"B": "6년차 NOI를 going-in cap rate(6.5%)로 나눈 값입니다.", "C": "5년차 NOI를 쓴 값입니다."}, "orig": "ECO Module 2 Q11"}, {"id": "ECO-M2-Q12", "src": "ECO 오답", "module": 2, "tag": "Cap rate = 할인율 − 성장률", "vig": 9, "stem": "Which of the following statements is most correct about cap rates and discount rates used in the discounted cash flow valuation of the New York City office property using the data in Exhibit 1?", "opts": {"A": "The going-in cap rate is used to discount the first-year NOI in the discounted cash flow valuation.", "B": "The terminal cap rate equals the difference between the discount rate and the constant growth rate of NOI between Years 5 and 6.", "C": "The growth rate of NOI in Years 1 through 5 equals the difference between the discount rate and the going-in cap rate."}, "ans": "B", "en": "B is correct. The difference between the discount rate of 9% and the terminal cap rate of 6% equals the constant growth rate of 3%, and the sixth-year NOI of 3,439,613 is 3% greater than the fifth-year NOI of 3,339,340 (3,439,613/3,339,340 = 1.03). Response A is incorrect because each year of NOI is discounted using the discount rate of 9%. Response C is incorrect: If this statement were true, then NOI growth in Years 1–5 would be 2.5% (9% – 6.5%), but the growth rate observed is closer to 1%. A calculation of the compound annual growth rate of NOI between Year 1 and Year 5 is 1.14%.", "ko": "Terminal cap 6% = 할인율 9% − 5→6년 NOI 성장률 3%(3,439,613 / 3,339,430 = 1.03). Cap rate = r − g 관계가 성립합니다.", "trap": "DCF에서 매년 NOI는 할인율(9%)로 할인. Going-in cap은 1년차 NOI로 가치를 구할 때만.", "f": "Cap rate = r − g", "why": {"A": "DCF에서는 모든 연도 NOI를 할인율 9%로 할인합니다.", "C": "그렇다면 1~5년 성장률이 2.5%여야 하는데 실제는 약 1%입니다."}, "orig": "ECO Module 2 Q12"}, {"id": "ECO-M2-Q15", "src": "ECO 오답", "module": 2, "tag": "Private equity vs private debt", "vig": 9, "stem": "If Tang purchases the office property in New York City, what are the forms of real estate investment taken by Delphinus Brothers and Rich Life Insurance?", "opts": {"A": "Delphinus invests in public real estate equity and Rich invests in public real estate debt.", "B": "Delphinus invests in private real estate equity and Rich invests in private real estate debt.", "C": "Delphinus invests in private real estate equity and Rich invests in public real estate debt."}, "ans": "B", "en": "B is correct. Both parties are investors in private real estate because buying a property directly is a private market transaction. Delphinus takes a private position in real estate equity by investing USD15 million, and Rich takes a private position in real estate debt by lending USD35 million to Delphinus to purchase the property. Responses A and C are incorrect because public investments in real estate revolve around such securities as REITs, MBS, and covered bonds.", "ko": "건물을 직접 사는 것은 사모(private) 거래입니다. Delphinus는 지분을 넣어 private equity, Rich Life는 대출을 해 private debt 투자자입니다. 공모(public)는 REIT·MBS·커버드본드 같은 증권입니다.", "trap": "상장사(Rich Life)가 대출해도 '직접 대출'이면 private debt.", "f": "", "why": {"A": "건물 직접 매입과 직접 대출은 모두 private 투자입니다.", "C": "Rich Life의 직접 대출은 public debt(MBS 등)이 아니라 private debt입니다."}, "orig": "ECO Module 2 Q15"}, {"id": "ECO-M2-Q16", "src": "ECO 오답", "module": 2, "tag": "Appraisal-based index → 분산효과 과대평가", "vig": 10, "stem": "The type of index Rossi uses will most likely:", "opts": {"A": "introduce noise in the index measurement.", "B": "overstate the diversification benefits of real estate.", "C": "have values that lead the transaction values in the market."}, "ans": "B", "en": "A is incorrect because this is a problem associated with transaction-based indexes, not appraisal-based indexes. Transaction-based indexes can be noisy (that is, they include random elements in the observations) because of the need to use statistical techniques to estimate the index. So, there may be upward or downward movements from quarter to quarter that are somewhat random even though in general (viewed over a year or longer) the index is capturing the correct movements in the market. On the other hand, appraisal-based indexes combine valuation information from individual properties and provide a measure of market movements.\nB is correct because Rossi uses an appraisal-based index, and appraisal-based indexes are often criticized for having appraisal lag, which results from appraised values tending to lag when there are sudden shifts in the market. Appraisal lag tends to smooth the index, meaning that it has less volatility. It behaves somewhat like a moving average of what an index would look like if it were based on values obtained from transactions rather than appraisals. Because of the lag in appraisal-based real estate indexes, they will also tend to have a lower correlation with other asset classes. The smoothing effect will also overstate Sharpe ratios, which is problematic if the index is used in asset allocation models to determine how much of a portfolio should be allocated to real estate versus other asset classes. The appropriate allocation to and benefits from private real estate would likely be overestimated.\nC is incorrect because appraisal-based indexes are often criticized for having appraisal lag, which results from appraised values tending to lag when there are sudden shifts in the market. In an upward market, transaction prices usually start to rise first. Then as these higher prices are reflected in comparable sales and investor surveys, they are captured in appraised values. Thus, appraisal-based indexes may not capture the price increase until a quarter or more after it was reflected in transactions. The same lag would also occur in a down market, with appraised values not falling as soon as transaction prices.", "ko": "감정평가 기반 지수는 appraisal lag로 수익률이 smoothing → 변동성·다른 자산과의 상관관계가 낮게 측정 → Sharpe ratio와 분산효과가 과대평가됩니다.", "trap": "Noise = transaction-based 지수의 문제. Appraisal 지수는 거래가격보다 '늦게' 움직임.", "f": "", "why": {"A": "통계적 추정을 쓰는 transaction-based 지수의 문제입니다.", "C": "감정평가 지수는 거래가격을 선행하지 않고 뒤따릅니다(lag)."}, "orig": "ECO Module 2 Q16"}, {"id": "ECO-M2-Q19", "src": "ECO 오답", "module": 2, "tag": "Gross lease vs net lease", "vig": 10, "stem": "A lease arrangement that requires the owner to pay operating expenses is a:", "opts": {"A": "net lease.", "B": "gross lease.", "C": "sale-leaseback."}, "ans": "B", "en": "A is incorrect because a net lease requires the tenant to be responsible for paying operating expenses.\nB is correct because a gross lease requires the owner to pay the operating expenses.\nC is incorrect because in a sale-leaseback, a company sells the building it owns and occupies to a real estate investor and the company then signs a long-term lease with the buyer to continue to occupy the building. The tenant is responsible for all aspects of property ownership while it leases the space, including major repairs, such as roof replacement.", "ko": "Gross lease = 건물주가 운영비용 부담. Net lease = 세입자가 운영비용 부담.", "trap": "", "f": "", "why": {"A": "Net lease는 세입자가 운영비용을 냅니다.", "C": "Sale-leaseback은 건물을 팔고 다시 빌리는 거래로, 세입자가 소유 관련 비용을 부담합니다."}, "orig": "ECO Module 2 Q19"}, {"id": "VAR-M2-01", "src": "변형", "module": 2, "tag": "최대 대출액(LTV가 제약)", "vig": null, "stem": "A property appraised at $2,000,000 generates NOI of $160,000. A lender will make an interest-only loan at 8% provided the LTV does not exceed 75% and the DSCR is at least 1.25. The maximum loan amount is closest to:", "opts": {"A": "$1,500,000.", "B": "$1,600,000.", "C": "$1,280,000."}, "ans": "A", "en": "LTV limit: $2,000,000 × 75% = $1,500,000. DSCR limit: debt service = $160,000 / 1.25 = $128,000; loan = $128,000 / 8% = $1,600,000. The maximum loan is the lower of the two, $1,500,000.", "ko": "LTV 기준 = 2,000,000 × 75% = 1,500,000. DSCR 기준: 상환액 = 160,000 / 1.25 = 128,000 → 대출액 = 128,000 / 8% = 1,600,000. 둘 중 작은 1,500,000.", "trap": "두 기준 중 '작은' 값. 이자만 내는 대출이면 대출액 = 상환액 / 금리.", "f": "Max loan = min(LTV × 가치, (NOI/DSCR)/금리)", "why": {"B": "DSCR 기준 금액입니다. LTV 75% 한도를 넘습니다.", "C": "부채상환액(128,000)을 10배한 엉뚱한 값입니다. 대출액은 상환액 / 금리입니다."}, "orig": "변형 (오답노트 R31, Schweser LOS 31.a)"}, {"id": "VAR-M2-02", "src": "변형", "module": 2, "tag": "DCF 종가: (n+1)년 NOI / terminal cap", "vig": null, "stem": "An analyst values an office property with a five-year holding period. Year 5 NOI is $1,000,000 and Year 6 NOI is $1,030,000. The going-in cap rate is 6.0% and the terminal cap rate is 6.5%. The terminal value at the end of Year 5 is closest to:", "opts": {"A": "$15.85 million.", "B": "$15.38 million.", "C": "$17.17 million."}, "ans": "A", "en": "Terminal value is estimated by capitalizing the NOI for the year after the holding period at the terminal cap rate: $1,030,000 / 0.065 = $15.85 million.", "ko": "종가 = 6년차 NOI / terminal cap = 1,030,000 / 0.065 = $15.85m.", "trap": "5년차 NOI X, going-in cap X.", "f": "TV_n = NOI_{n+1} / terminal cap rate", "why": {"B": "5년차 NOI를 쓴 값입니다.", "C": "Going-in cap rate(6.0%)를 쓴 값입니다."}, "orig": "변형 (오답노트 R31, ECO M2 Q11)"}, {"id": "VAR-M2-03", "src": "변형", "module": 2, "tag": "부동산 사이클: 확장기 LTV", "vig": null, "stem": "During the expansion phase of the real estate cycle, loan-to-value (LTV) ratios most likely:", "opts": {"A": "continue to rise.", "B": "continue to fall.", "C": "reach a bottom and begin to rise."}, "ans": "B", "en": "During the expansion phase, interest rates, NOI, and DSC continue to rise, while LTV continues to fall. In the recovery phase LTV peaks and begins to fall; in the oversupply phase LTV reaches a bottom and begins to rise; in the recession phase LTV increases.", "ko": "확장기: 금리·NOI·DSC 계속 상승, LTV 계속 하락. 회복기: LTV 정점 후 하락 시작. 공급과잉기: LTV 바닥 후 상승 시작. 침체기: LTV 계속 상승.", "trap": "LTV는 NOI·DSC와 반대로 움직인다.", "f": "", "why": {"A": "LTV가 계속 오르는 것은 침체기입니다.", "C": "LTV가 바닥을 찍고 오르기 시작하는 것은 공급과잉기입니다."}, "orig": "변형 (오답노트 R31, Schweser LOS 31.b)"}, {"id": "VAR-M2-04", "src": "변형", "module": 2, "tag": "Due diligence: Documentation review(lien)", "vig": null, "stem": "A buyer of a recently renovated building wants to make sure there are no outstanding contractor liens on the property. The due diligence step most likely to identify such liens is the:", "opts": {"A": "financial review.", "B": "documentation review.", "C": "property survey."}, "ans": "B", "en": "Documentation review includes a title review to ensure a clean title, free of any liens or ownership disputes, including liens filed by contractors involved in a recent renovation. A financial review will not uncover unpaid bills if they were not recorded, and a survey confirms the property boundaries and identifies easements.", "ko": "권리관계(lien, 소유권 분쟁, 세금 완납) 확인은 documentation review(등기·권리 검토)입니다.", "trap": "재무 검토 = 운영비용·NOI 검증 / 측량 = 경계·지역권.", "f": "", "why": {"A": "재무 검토는 운영비용과 NOI를 검증하며, 기록되지 않은 미지급금은 찾지 못합니다.", "C": "측량은 부지 경계와 지역권(easement)을 확인합니다."}, "orig": "변형 (오답노트 R31, Schweser LOS 31.d)"}, {"id": "ECO-M3-Q6", "src": "ECO 오답", "module": 3, "tag": "NAVPS 계산", "vig": 16, "stem": "Based on Exhibit 1 and Exhibit 2, the value per share for REIT A using valuation Method 1 is closest to:", "opts": {"A": "$51.26.", "B": "$62.40.", "C": "$98.30."}, "ans": "B", "en": "B is correct. The NAV per share is $62.40.\nEstimated value of operating real estate = 350,000 / 0.07 = 5,000,000\nPlus: cash + accounts receivable = 514,500\nLess: debt and other liabilities = 2,014,000\nNet asset value = 3,500,500\nNAV per share = 3,500,500 / 56,100 = $62.40", "ko": "부동산 가치 = 현금 NOI 350,000 / cap 7% = 5,000,000. + 현금·매출채권 514,500 − 부채 2,014,000 = NAV 3,500,500. ÷ 56,100주 = $62.40.", "trap": "현금 NOI를 cap rate로 '자본화' (할인율 아님). 현금과 매출채권을 더하고 부채를 뺀다.", "f": "NAVPS = (NOI/cap + 기타 유형자산 − 부채) / 주식 수", "why": {"A": "cap rate 7% 대신 자기자본비용 8%로 NOI를 자본화한 값(350,000 / 0.08 + 514,500 − 2,014,000)입니다.", "C": "부채 2,014,000을 빼지 않은 값입니다."}, "orig": "ECO Module 3 Q6"}, {"id": "ECO-M3-Q9", "src": "ECO 오답", "module": 3, "tag": "P/AFFO 가치평가", "vig": 16, "stem": "Based on Exhibit 1 and Exhibit 2, the value per share of REIT A using Valuation Method 4 is closest to:", "opts": {"A": "$58.32.", "B": "$74.12.", "C": "$103.40."}, "ans": "B", "en": "B is correct. The value per share is $74.11, calculated as follows:\nFunds from operations (FFO) = $316,965.\nLess: Non-cash rents: $25,991\nLess: Recurring maintenance–type capital expenditures: $63,769\nEquals AFFO: $227,205\nShares outstanding = 56,100 shares.\nAFFO/share = $227,205/56,100 shares = $4.05.\nApplying the property subsector average P/AFFO multiple of 18.3× yields a value per share of\n$4.05 × 18.3 = $74.12.", "ko": "AFFO = FFO 316,965 − 비현금 임대료 25,991 − 유지보수 capex 63,769 = 227,205. 주당 AFFO = 227,205 / 56,100 = $4.05. × 18.3 = $74.12.", "trap": "AFFO = FFO − non-cash rent − 유지형 capex. P/FFO 배수와 혼동 금지.", "f": "AFFO = FFO − 비현금 임대료 − 유지보수형 capex", "why": {"A": "주당 AFFO($4.05)에 P/FFO 배수(14.4×)를 곱한 값입니다.", "C": "주당 FFO($5.65)에 P/AFFO 배수(18.3×)를 곱한 값입니다. AFFO로 바꾸지 않았습니다."}, "orig": "ECO Module 3 Q9"}, {"id": "ECO-M3-Q19", "src": "ECO 오답", "module": 3, "tag": "NAV: 다음 12개월 현금 NOI / cap rate", "vig": 10, "stem": "The NAV per share for REIT A is closest to:", "opts": {"A": "$69.31.", "B": "$78.39.", "C": "$94.63."}, "ans": "C", "en": "C is correct. Cap rate = 6.5% − 1.5% = 5.0%. Last-12-month cash NOI = 280,000 − 9,800 = 270,200. Next-12-month cash NOI = 270,200 × 1.015 = 274,253. Value of operating real estate = 274,253 / 5.0% = 5,485,060. Plus cash 69,300 = 5,554,360. Less total debt 823,000 = NAV 4,731,360. NAV per share = 4,731,360 / 50,000 = $94.63.\nA is incorrect because it capitalizes next-12-month cash NOI at the discount rate (6.5%) instead of the cap rate.\nB is incorrect because it reduces NOI by capital expenditures.", "ko": "Cap = 6.5% − 1.5% = 5%. 현금 NOI = 280,000 − 9,800 = 270,200 → × 1.015 = 274,253. 부동산 가치 = 274,253 / 5% = 5,485,060. + 현금 69,300 − 부채 823,000 = 4,731,360 → ÷ 50,000 = $94.63.", "trap": "Capex는 NOI에서 빼지 않는다. 할인율이 아니라 cap rate(= r − g)로 자본화.", "f": "Cap = r − g ; NOI_{next} = (NOI − 비현금 임대료)(1 + g)", "why": {"A": "Cap rate(5%) 대신 할인율(6.5%)로 나눴습니다.", "B": "NOI에서 capex(40,000)까지 뺐습니다."}, "orig": "ECO Module 3 Q19"}, {"id": "ECO-M3-Q26", "src": "ECO 오답", "module": 3, "tag": "REIT 세제 혜택 자격 조건", "vig": null, "stem": "An analyst gathers the following information about three publicly traded real estate securities:\n\tSecurity 1\tSecurity 2\tSecurity 3\nPercentage of assets for sale, under development\t0\t75\t0\nPercentage of income derived from interest on mortgages\t90\t5\t75\nPercentage of taxable income distributed to shareholders\t90\t100\t50\nWhich of the following real estate securities most likely qualifies as a tax-advantaged REIT?", "opts": {"A": "Security 1", "B": "Security 2", "C": "Security 3"}, "ans": "A", "en": "A is correct because real estate investment trusts are companies that own, finance, and—to a limited extent—develop income-producing real estate across a range of property sectors. Most REITs are required to distribute 90%–100% of their taxable income to shareholders. Also, in most countries, REITs are required to distribute 90%–100% of their otherwise taxable earnings (Security 1 and Security 2), invest at least 75% of their assets in real estate (Security 1 and Security 3), and derive at least 75% of income from real estate rental income or interest on mortgages (Security 1). Security 1 is best qualified as a tax-advantaged REIT.\nB is incorrect because even if Security 2 distributes 100% of taxable income, it has the vast majority of investments in assets for sale, under development (75%) whereas real estate investment trusts are companies that own, finance, and—to a limited extent—develop income-producing real estate across a range of property sectors.\nC is incorrect because Security 3's taxable income distributed to shareholders is 50% while in order to benefit of tax advantages most REITs are required to distribute 90%–100% of their taxable income to shareholders.", "ko": "REIT 요건: 과세소득 90~100% 배당, 자산 75% 이상 부동산, 소득 75% 이상 임대료·모기지 이자. Security 1만 모두 충족.", "trap": "세 조건 모두 충족해야 함.", "f": "", "why": {"B": "자산의 75%가 매각용·개발 중 자산이고 소득 대부분이 임대·이자가 아닙니다.", "C": "과세소득의 50%만 배당해 90% 요건에 못 미칩니다."}, "orig": "ECO Module 3 Q26"}, {"id": "ECO-M3-Q29", "src": "ECO 오답", "module": 3, "tag": "비현금 임대료 → FFO 무관, AFFO만 감소", "vig": null, "stem": "When valuing a REIT, an analyst increases the estimate of non-cash rent. This increase in non-cash rent will:", "opts": {"A": "decrease price/FFO.", "B": "have no effect on price/FFO.", "C": "increase price/FFO."}, "ans": "B", "en": "A is incorrect because FFO = (Net income + Depreciation + Amortization) – (Net gains on sale of real property) and AFFO is FFO – Non-cash rent – Recurring capital expenditures. Non-cash rent will not affect FFO, but an increase in non-cash rent will decrease AFFO, increasing P/AFFO.\nB is correct because FFO = (Net income + Depreciation + Amortization) – (Net gains on sale of real property) and AFFO is FFO – Non-cash rent – Recurring capital expenditures. Non-cash rent does not affect FFO, so a change in estimate will not increase nor decrease FFO.\nC is incorrect because FFO = (Net income + Depreciation + Amortization) – (Net gains on sale of real property) and AFFO is FFO – Non-cash rent – Recurring capital expenditures. Non-cash rent will not affect FFO, but an increase in non-cash rent will decrease AFFO, increasing P/AFFO.", "ko": "FFO = 순이익 + 감가상각 − 부동산 매각이익. 비현금 임대료는 FFO에 영향이 없으므로 P/FFO는 변하지 않습니다(AFFO만 줄어 P/AFFO↑).", "trap": "Non-cash rent 조정은 AFFO 단계에서.", "f": "AFFO = FFO − 비현금 임대료 − 유지형 capex", "why": {"A": "FFO가 바뀌지 않으므로 P/FFO도 그대로입니다.", "C": "P/AFFO는 오르지만 P/FFO는 변하지 않습니다."}, "orig": "ECO Module 3 Q29"}, {"id": "ECO-M3-Q31", "src": "ECO 오답", "module": 3, "tag": "REIT 레버리지↑ → P/FFO↓", "vig": null, "stem": "All else being equal, as REIT leverage increases, an investor should expect a(n):", "opts": {"A": "increase in EBITDA.", "B": "decrease in the P/FFO multiple.", "C": "decrease in the investor's required return."}, "ans": "B", "en": "A is incorrect because EBITDA should remain the same. EBITDA, by definition, measures income before the leveraging effect of debt. Therefore, a change in leverage levels should have no impact on EBITDA.\nB is correct because , if we assume pr
