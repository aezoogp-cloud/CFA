00%\nDiscount rate\t9.00%\nUsing the data from Exhibit 1, Rodriguez is able to compute a value of USD49.9 million for this property using the DCF method. After Rodriguez presents this valuation to Tang, Tang is surprised that the analysis does not demonstrate that the property is underpriced. Tang asks Rodriguez to value the property using the sales comparison method, and she compiles the data shown in Exhibit 2.\nExhibit 2: Sales Comparison Data for Comparable Office Properties\nVariable\tNYC Office\tSales Comp A\tSales Comp B\tSales Comp C\nAge (years)\t10\t5\t12\t25\nCondition\tGood\tExcellent\tGood\tAverage\nLocation\tPrime\tSecondary\tSecondary\tPrime\nSale price (per ft2)\t\t$415/ft2\t$395/ft2\t$400/ft2\nAdjustment: Age\t\t–10%\t2%\t10%\nAdjustment: Condition\t\t–10%\t0%\t10%\nAdjustment: Location\t\t15%\t15%\t0%\nTotal adjustments\t\t–5%\t17%\t20%\nTo conclude her valuation work on the office property, Rodriguez compiles detailed data on the replacement costs of the office building, its land value, and the total depreciation. She finds that the cost of constructing a building identical to the subject property is USD57 million. The land value is USD7 million, and the total depreciation is USD5 million. From these data, she calculates a value of the property using the cost approach.\nRodriguez presents her valuation findings to Tang. After a thorough review of the valuation including consideration of a variety of scenarios, Tang decides to proceed with plans to purchase the office property in New York City. He contacts several potential lenders, ultimately deciding to contract with Rich Life Insurance, a publicly traded company with extensive investments in commercial real estate, to discuss terms on arranging a loan of USD35 million.", "Matteo Rossi is a financial adviser specializing in commercial real estate investing. He meets with Anika Patel, a new client, who wants to diversify her portfolio by adding real estate investments to it.\nUsing data from an appraisal-based index, Rossi discusses real estate return and risk statistics with Patel and compares them to the return and risk of Patel's current portfolio of stocks and bonds. Based on Patel's investment objectives, Rossi recommends the following types of investments:\n• Investment 1: A real estate operating company (REOC);\n• Investment 2: An equity real estate investment trust (REIT).\nPatel asks Rossi how REITs and REOCs are valued. Rossi mentions that the following measures are widely used in the valuation of REITs and REOCs:\n• Measure 1: EBITDA;\n• Measure 2: Funds from operations (FFO);\n• Measure 3: Adjusted funds from operations (AFFO).\nNext, Rossi presents Patel with the valuation of a REIT. REIT A is a multi-family REIT and its NAV is calculated based on the net operating income (NOI) information in Exhibit 1.\nExhibit 1\n\tREIT A\nProperty subsector\tMulti-family\nLast-12-month real estate NOI\t$280,000\nLast-12-month non-cash rent\t$9,800\nLast-12-month capital expenditures\t$40,000\nCash and equivalents\t$69,300\nTotal debt\t$823,000\nDiscount rate\t6.5%\nEstimated growth rate\t1.5%\nShares outstanding\t50,000", "Snohomish Mukilteo is a portfolio analyst for the Puyallup-Wenatchee Pension Fund (PWPF). PWPF’s investment committee (IC) asks Mukilteo to research adding hedge funds to the PWPF portfolio.\nA member of the IC meets with Mukilteo to discuss hedge fund strategies. During the meeting, the IC member admits that her knowledge of hedge fund strategies is fairly limited but tells Mukilteo she believes the following:\nStatement 1: Equity market-neutral strategies use a relative value approach.\nStatement 2: Event-driven strategies are not exposed to equity market beta risk.\nStatement 3: Opportunistic strategies have risk exposure to market directionality.\nThe IC member also informs Mukilteo that for equity-related strategies, the IC considers low volatility to be more important than negative correlation.\nMukilteo researches various hedge fund strategies. First, Mukilteo analyzes an event-driven strategy involving two companies, Algona Applications (AA) and Tukwila Technologies (TT). AA’s management, believing that its own shares are overvalued, uses its shares to acquire TT. The IC has expressed concern about this type of strategy because of the potential for loss if the acquisition unexpectedly fails. Mukilteo’s research reveals a way to use derivatives to protect against this loss, and he believes that such protection will satisfy the IC’s concern.\nNext, while researching relative value strategies, Mukilteo considers a government bond strategy that involves buying lower-liquidity, off-the-run bonds and selling higher-liquidity, duration-matched, on-the-run bonds.\nMukilteo examines an opportunistic strategy implemented by one of the hedge funds under consideration. The hedge fund manager selects 12 AAA rated corporate bonds with actively traded futures contracts and approximately equal durations. For each corporate bond, the manager calculates the 30-day change in the yield spread over a constant risk-free rate. He then ranks the bonds according to this spread change. For the bonds that show the greatest spread narrowing (widening), the hedge fund will take long (short) positions in their futures contracts. The net holding for this strategy is market neutral.\nMukilteo also plans to recommend a specialist hedge fund strategy that would allow PWPF to maintain a high Sharpe ratio even during a financial crisis when equity markets fall.\nThe IC has been considering the benefits of allocating to a fund of funds (FoF) or to a multi-strategy fund (MSF). Mukilteo receives the following email from a member of the IC:\n“From my perspective, an FoF is superior even though it entails higher manager-specific operational risk and will require us to pay a double layer of fees without being able to net performance fees on individual managers. I especially like the tactical allocation advantage of FoFs—that they are more likely to be well informed about when to tactically reallocate to a particular strategy and more capable of shifting capital between strategies quickly.”\nFinally, Mukilteo creates a model to simulate adding selected individual hedge fund strategies to the current portfolio with a 20% allocation. The IC’s primary considerations for a combined portfolio are (1) that the variance of the combined portfolio must be less than 90% of that of the current portfolio and (2) that the combined portfolio maximize the risk-adjusted return with the expectation of large negative events. Exhibit 1 provides historical performance and risk metrics for three simulated portfolios.\nExhibit 1: Performance of Various Combined Portfolios\nHedge Fund Strategy\tStandard Deviation (%)\tSharpe Ratio\tSortino Ratio\tMaximum Drawdown (%)\nCurrent Portfolio (NA)\t7.95\t0.58\t1.24\t14.18\nMerger arbitrage (20% allocation)\t7.22\t0.73\t1.35\t5.60\nSystematic futures (20% allocation)\t6.94\t0.83\t1.68\t8.04\nEquity market neutral (20% allocation)\t7.17\t0.73\t1.80\t10.72", "Lynet Xu is the Chief Investment Officer for the North University Endowment Fund (the Fund), which is based in Europe. The Fund’s investment committee recently made the decision to add hedge funds to the Fund’s portfolio to increase diversification. Xu meets with Yolanda Anderson, a junior analyst, to discuss various hedge fund strategies that might be suitable for the Fund. Anderson tells Xu the following:\nStatement 1: Relative value strategies tend to use minimal leverage.\nStatement 2: Long/short equity strategies are typically not exposed to equity market beta risk.\nStatement 3: Global macro strategies come with naturally higher volatility in the return profiles typically delivered.\nXu tells Anderson that while she is open to using all hedge fund strategies, she is particularly interested in opportunistic hedge fund strategies. Xu states that she prefers opportunistic hedge fund strategies that use high leverage, have high liquidity, and exhibit right-tail skewness.\nXu asks Anderson to research an event-driven strategy involving a potential merger between Aqua Company and Taurus, Inc. Aqua has offered to buy Taurus in a stock-for-stock deal: The offer ratio is two shares of Aqua for three shares of Taurus. Aqua was trading at €50 per share prior to the merger announcement, and it fell to €45 per share after the merger announcement. Taurus was trading at €15 per share prior to the announcement, and it rose to €20 per share in anticipation of the merger deal receiving required approvals and closing successfully. Xu decides to enter into a merger arbitrage trade: She buys 22,500 shares of Taurus at €20 per share and sells short 15,000 shares of Aqua at €45 per share.\nXu and Anderson discuss an equity strategy involving two large European car companies, ZMD and Tarreras. Anderson recently attended a trade show where she inspected ZMD’s newest model car. Based on information from the trade show and other analysis conducted by Anderson, Xu concludes that ZMD will not meet its revenue expectations. Current valuation metrics indicate that ZMD shares are overvalued relative to shares of Tarreras. Xu decides to take a short position in ZMD and a long position in Tarreras with equal beta-weighted exposure.\nXu next reviews a convertible arbitrage strategy and analyzes a trade involving the euro-denominated stock and convertible bonds of AVC Corporation, a European utility company. Anderson gathers selected data for AVC Corporation, which is presented in Exhibit 1.\nExhibit 1: Selected Data for AVC Corporation\nAVC Convertible Bond\t\tAVC Stock\t\nPrice (% of par)\t115\tCurrent price (per share)\t€28\nCoupon (%)\t6\tP/E\t25\nRemaining maturity (years)\t2\tP/BV\t2.25\nConversion ratio\t50\tP/CF\t15\nBased on comparisons with industry ratios, Xu believes that AVC’s shares are overvalued in relative terms and the convertible bonds are undervalued. Anderson analyzes the potential profit outcomes of a long position in the convertible bond combined with a short stock position, assuming small changes in the share price and ignoring dividends and borrowing costs. She offers the following conclusion to Xu:\n“The profit earned on the convertible arbitrage trade will be the same regardless of whether the share price of AVC decreases or increases.”\nFinally, Xu and Anderson consider a hedge fund that specializes in reinsurance and life settlements. Xu tells Anderson about three characteristics that hedge fund managers look for when investing in life settlements:\nCharacteristic 1: The surrender value offered to the insured individual is relatively high.\nCharacteristic 2: The ongoing premium payments to keep the policy active are relatively low.\nCharacteristic 3: There is a high probability that the designated insured person is likely to die within the period predicted by standard actuarial methods.", "Andy Chang is a senior analyst at First Ocean Associates. First Ocean is a global multistrategy and fund-of-funds hedge fund manager serving institutional clients.\nDuring the construction and monitoring of First Ocean’s strategies, Chang and the other analysts use a linear factor model to understand risk exposures. Chang constructs the model using the following macro-risk factors: equity risk, interest rate risk, commodity risk, credit risk, and volatility risk. In explaining the model to his peers, Chang states that the portion of hedge fund returns not explained by these risk factors is attributable to either manager alpha or random error. The credit risk and volatility risk factors are exhibiting high degrees of correlation. To solve for the multicollinearity problem, Chang excludes the volatility risk factor because the model has a higher R2 when including the credit risk rather than the volatility risk.\nFirst Ocean’s fund-of-funds offering, Diversified Alpha Plus, is invested in 12 different hedge fund strategies. The factor sensitivities for Fund A during normal conditions and crisis conditions are highlighted in Exhibit 1. All exposures are significant at the 5% level.\nExhibit 1: Fund A Coefficients\nFactor\tCoefficient – Normal Market\tCoefficient – Crisis Market\nS&P 500\t–0.02\t–0.48\nInterest Rate\t0.08\t0.11\nCommodity\t–0.03\t–0.06\nCredit\t0.08\t–0.14\nVolatility Index (VIX)\t0.14\t0.46\nChang is discussing Fund A with First Ocean’s Investment Committee and makes the following observations about its role in the portfolio:\nObservation 1: Fund A has a dedicated short bias, which helps offset beta exposure from the long–short managers in the fund.\nObservation 2: The sensitivity to volatility is indicative of selling puts against some of its short positions.\nObservation 3: The manager has demonstrated the ability to hold long positions in deep out-of-the-money puts during periods of market stress.\nFund B, a hedge fund recently added to the Diversified Alpha Plus Fund, focuses on life settlements. In explaining this strategy to the Investment Committee, Chang states the following: “This manager is very experienced in the life settlement space and has generated strong risk-adjusted returns. Fund B is an attractive addition because it has exposures uncorrelated with many of the other strategies being used. I believe the manager looks for policies with the following traits: The surrender value being offered to the individual is relatively high, the ongoing premium payments are relatively low, and there is a high probability the insured will die sooner than what is predicted by actuarial methods.”\nVictor Lee works in the investment office for a university endowment and meets with Chang to compare First Ocean’s fund-of-funds strategy with its multistrategy fund, First Ocean Multi-Strat. Lee is seeking steady, low-volatility returns. Before discussing the specifics of First Ocean’s offerings, Lee asks Chang about the differences between multistrategy and fund-of-funds approaches. Chang states that on the basis of Lee’s objectives, multistrategy funds generally will be a better fit than the fund-of-funds structure. The reasons he gives are as follows: lower levels of variance, lower levels of leverage, improved fee structure, increased transparency, faster reaction time, and a more diverse mix of investment strategies.", "Arturo Rivas is the research manager for alternative investments at the Raritan Bay Endowment Fund. He is attending a conference where hedge fund managers are presenting a broad spectrum of investment strategies. He will take this opportunity to review their presentations, offering memorandums (OMs), and limited partnership agreements and engage in one-on-one meetings. The due diligence will allow him to recommend hedge fund managers and strategies to the endowment’s investment committee.\nRivas reads the OM for the Gemini Fund to evaluate its strategy and performance. He notices the following points in the OM:\n“Gemini specializes in the fundamental analysis of global companies in order to establish equity positions for its funds. We believe we have a particular advantage in valuing and actively shorting European companies in the technology, media, and communication sectors. Market timing does not play a role in our investment process. Our style is to take concentrated bets and use leverage to express our convictions. The primary focus is to have our analysts uncover irregularities in the financial reporting of companies and to exploit the potential impact on valuations when the irregularities become known. Our performance goal is to achieve returns that beat the equity market index return with 50% lower volatility. In order to diversify the portfolio, we also maintain value-oriented long positions. On average, the fund is 30%–60% net short the market.”\nRivas reviews managers that focus on event-driven strategies. In particular, the Pegasus Fund focuses on situations where a company has made a cash-for-stock or stock-for-stock offer for a target company. Its strategy takes a view that the merger will fail or that it can succeed, depending on Pegasus’s analysis. The range of returns using a modest degree of leverage is between 5% and 10% per deal if successful. Equities are the primary securities used in the merger arbitrage strategy, but Pegasus also uses convertible bonds, options, and senior and junior debt. A common trade is to take a long position in the target company and a short position in the acquirer. Despite the modest return targets, an attraction for investors is the high Sharpe ratio associated with the strategy.\nRivas evaluates the Orion Fund, a convertible bond strategy. Orion’s OM provides various examples of trades that its manager uses to generate alpha. Rivas reviews one of the many strategies Orion’s manager uses frequently, because he believes this is the best way to understand the fund’s investment style. The OM provides the data in Exhibit 1 from a trade the manager recently entered into.\nExhibit 1: Orion Fund Convertible Bond Arbitrage Position\nSecurity/Position Description\tTrade Direction\tRationale\n3% Convertible Bond due 6/1/2050\tLong\tPurchase new issue\nCommon Stock\tShort\tDelta-adjusted position\nCredit Default Swap\tShort\tHedge credit risk\nInterest Rate Swap\tShort\tDuration-neutral hedge\nPut Option on Stock\tLong\tOnly in place of delta hedging\nLeverage\tLong/Short\tTypically 300% long vs. 200% short\nRivas moves on to a specialist hedge fund strategy that focuses exclusively on volatility trading. Adding this fund to an investor’s portfolio strives to hedge long equity positions. The Taurus Fund typically implements the following three trades in its strategy:\n• Trade 1: Sell exchange-traded and over-the-counter equity call options on a market index. Selection of the options depends on the volatility smile and skew.\n• Trade 2: Sell VIX futures to capture the volatility premium and roll-down payoff.\n• Trade 3: Purchase a receiver volatility swap with an at-inception fair value of zero.", "Alise Pukitis works as an analyst for Winter Stone Associates. Winter Stone is a hedge fund consulting specialist that provides analysis and access to hedge funds for family offices and high-net-worth investment advisers. Amy Chu is a senior wealth adviser with Brownstein Legacy Associates who has engaged Winter Stone to educate the firm on current investment opportunities within the hedge fund universe.\nIn an initial meeting with Chu, Pukitis provides a summary of the hedge fund landscape. Brownstein has historically invested in traditional long-only investment strategies in public markets for its clients. Pukitis tells Chu to expect the following characteristics when reviewing the hedge fund universe:\nCharacteristic 1: Less regulatory oversight and a relatively narrow investment universe.\nCharacteristic 2: Less aggressive investment styles and increased use of leverage.\nCharacteristic 3: Investor-aligned fee structures and typically higher returns from privately placed versus liquid alternative strategies.\nPukitis explains that hedge funds are categorized and tracked by type. Exhibit 1 shows the six broad hedge fund categories tracked by Winter Stone.\nExhibit 1: Hedge Fund Categories Tracked by Winter Stone\nHedge Fund Category\tIncluded Hedge Fund Strategies\nEquity related\tLong-short equity, dedicated short bias, equity market neutral\nEvent-driven strategies\tMerger arbitrage, distressed securities\nRelative value\tFixed-income arbitrage, convertible bond arbitrage\nOpportunistic\tGlobal macro, managed futures, reinsurance\nSpecialist\tVolatility strategies involving options\nMultimanager\tMultistrategy, funds of hedge funds\nAfter reviewing the information, Chu tells Pukitis that she would like to receive more information on equity-related strategies. Pukitis makes the following statements to Chu regarding equity-related hedge fund managers:\nStatement 1: The most attractive feature of long–short equity managers is the lower beta sensitivity to equity markets than long-only equity managers.\nStatement 2: Dedicated short-bias managers typically benefit from higher levels of leverage and more frequent use of leverage than long–short or equity market neutral strategies.\nStatement 3: Equity market–neutral managers are likely to have high levels of diversification and turnover ratios.\nBrownstein’s investment committee has identified the following characteristics it is seeking in the selection of a hedge fund manager: low to moderate levels of leverage, idiosyncratic alpha, long biased, and no concerns about investing in an illiquid strategy. Chu reviews a number of strategies on Winter Stone’s recommended list but is having a difficult time determining which strategy will meet the needs of Brownstein’s investment committee. She reaches out to Pukitis for help identifying the appropriate strategy to bring to the committee for approval.", "Hui Lin, CFA, is an investment manager looking to diversify his portfolio by adding equity real estate investments. Lin and his investment analyst, Maria Nowak, are discussing whether they should invest in publicly traded real estate investment trusts or public real estate operating companies. Nowak expresses a strong preference for investing in public REITs in taxable accounts.\nLin schedules a meeting to discuss this matter, and for the meeting, Lin asks Nowak to gather data on three specific REITs and come prepared to explain her preference for public REITs over public REOCs. At the meeting, Lin asks Nowak, “Why do you prefer to invest in public REITs over public REOCs for taxable accounts?”\nNowak provides Lin with an explanation for her preference of public REITs and provides Lin with data on the three REITs shown in Exhibit 1 and Exhibit 2.\nThe meeting concludes with Lin directing Nowak to identify the key investment characteristics along with the principal risks of each REIT and to investigate the valuation of the three REITs. Specifically, Lin asks Nowak to value each REIT using four different methodologies:\nValuation Method 1: Net asset value\nValuation Method 2: Discounted cash flow valuation using a two-step dividend model\nValuation Method 3: Relative valuation using property subsector average P/FFO multiple\nValuation Method 4: Relative valuation using property subsector average P/AFFO multiple\nExhibit 1: Select REIT Financial Information\n\tREIT A\tREIT B\tREIT C\nProperty subsector\tOffice\tStorage\tHealth Care\nEstimated 12-month cash net operating income\t$350,000\t$267,000\t$425,000\nFunds from operations\t$316,965\t$290,612\t$368,007\nCash and equivalents\t$308,700\t$230,850\t$341,000\nAccounts receivable\t$205,800\t$282,150\t$279,000\nDebt and other liabilities\t$2,014,000\t$2,013,500\t$2,010,000\nNon-cash rents\t$25,991\t$24,702\t$29,808\nRecurring maintenance–type capital expenditures\t$63,769\t$60,852\t$80,961\nShares outstanding\t56,100\t67,900\t72,300\nExhibit 2: REIT Dividend Forecasts and Average Price Multiples\n\tREIT A\tREIT B\tREIT C\nExpected annual dividend next year\t$3.80\t$2.25\t$4.00\nDividend growth rate in Years 2 and 3\t4.0%\t5.0%\t4.5%\nDividend growth rate (after Year 3 into perpetuity)\t3.5%\t4.5%\t4.0%\nAssumed cap rate\t7.0%\t6.25%\t6.5%\nProperty subsector average P/FFO multiple\t14.4×\t13.5×\t15.1×\nProperty subsector average P/AFFO multiple\t18.3×\t17.1×\t18.9×\nNote: Nowak estimates an 8% cost of equity capital for all REITs and a risk-free rate of 4.0%."], "modules": {"1": "Introduction to Commodities and Commodity Derivatives", "2": "Overview of Types of Real Estate Investment", "3": "Investments in Real Estate through Publicly Traded Securities", "4": "Hedge Fund Strategies"}}</script>

function mname(m){ return "Reading "+(29+Number(m))+" – "+MN[m]; }
function srcClass(s){ return s==="ECO 오답"?"src-wrong":s==="ECO 관련유형"?"src-rel":s==="Schweser MQ"?"src-sch":"src-var"; }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function $(id){ return document.getElementById(id); }

/* ---------- stats ---------- */
function roundStats(){
  var ok=0,bad=0; S.order.forEach(function(id){ var r=S.round[id]; if(r){ if(r.correct) ok++; else bad++; } });
  return {ok:ok,bad:bad,answered:ok+bad,total:S.order.length};
}
function header(){
  if(!S){ $("nOk").textContent=0; $("nBad").textContent=0; $("pbar").style.width="0"; $("ptxt").textContent="시작 전"; $("pmode").textContent=""; return; }
  var st=roundStats();
  $("nOk").textContent=st.ok; $("nBad").textContent=st.bad;
  $("pbar").style.width=(st.total?st.answered/st.total*100:0)+"%";
  $("ptxt").textContent=st.answered+" / "+st.total+" 풀이 완료";
  $("pmode").textContent=S.mode==="review"?"틀린 문제 다시 풀기":"전체 풀기";
}

/* ---------- setup screen ---------- */
function setup(){
  S && (S.view="setup", save());
  var counts={}; Q.forEach(function(q){counts[q.module]=(counts[q.module]||0)+1;});
  var opts='<option value="all">전체 모듈 ('+Q.length+'문제)</option>'+Object.keys(MN).map(function(m){return '<option value="'+m+'">'+esc(mname(m))+' ('+counts[m]+')</option>';}).join("");
  var resume = S && !S.finished && S.order && S.order.length ? '<button class="btn primary" id="bResume">이어서 풀기 ('+roundStats().answered+'/'+S.order.length+')</button> ' : '';
  var remote = REMOTE ? '<button class="btn" id="bRemote">저장된 기록에서 이어서 풀기 ('+REMOTE.answered+'/'+REMOTE.total+', '+esc(REMOTE.date)+')</button> ' : '';
  $("view").innerHTML =
   '<section class="card setup"><h2 style="margin:0 0 6px;font-size:22px">Equity 전체 Reading 오답 퀴즈 (R17–R22)</h2>'+
   '<p class="muted">ECO에서 틀린 114문제 전부 + 오답 개념과 연결된 ECO 정답 유형 17문제 + Schweser Module Quiz 28문제 + 변형 6문제 (총 165문제). 정답은 ECO 원본·Schweser 해답 기준, 해설은 Schweser 기준으로 작성했습니다.</p>'+
   '<label>범위 <select id="selMod">'+opts+'</select></label>'+
   '<label>출처 <select id="selSrc"><option value="all">전체</option><option value="wrong">ECO 오답만 (114)</option><option value="nowrong">오답 외 문제만</option></select></label>'+
   '<p class="kbd">단축키: A/B/C 또는 1/2/3 선택 · Enter 다음 문제 · ← 이전 문제</p>'+
   '<div class="nav" style="justify-content:flex-start">'+resume+remote+'<button class="btn '+(resume?'':'primary')+'" id="bStart">새로 시작</button></div></section>';
  if($("bResume")) $("bResume").onclick=function(){ S.view="quiz"; save(); render(); };
  if($("bRemote")) $("bRemote").onclick=function(){ applyResults(REMOTE.data,false); };
  $("bStart").onclick=function(){
    var m=$("selMod").value, s=$("selSrc").value;
    var order=Q.filter(function(q){ return (m==="all"||String(q.module)===m) && (s==="all"||(s==="wrong"?q.src==="ECO 오답":q.src!=="ECO 오답")); }).map(function(q){return q.id;});
    if(!order.length) return;
    S=fresh(order,"all"); save(); render();
  };
  header();
}

/* ---------- quiz screen ---------- */
function quiz(){
  var id=S.order[S.idx], q=BYID[id], r=S.round[id];
  var vig = q.vig!==null && q.vig!==undefined ? '<details class="case" '+(r?'':'open')+'><summary>케이스 지문 (Vignette)</summary><div class="casebody">'+rich(VIG[q.vig])+'</div></details>' : '';
  var optsHtml = ["A","B","C"].map(function(L){
    var cls="opt";
    if(r){ if(L===r.sel) cls+= r.correct?" sel-ok":" sel-bad"; if(L===q.ans && !r.correct) cls+=" is-ans"; }
    return '<button class="'+cls+'" data-l="'+L+'" '+(r?'disabled':'')+' aria-label="선택지 '+L+'"><span class="bubble">'+L+'</span><span class="txt">'+esc(q.opts[L])+'</span></button>';
  }).join("");
  var html='<section class="card"><div class="meta"><span class="qno">Q'+(S.idx+1)+'</span><span class="pill">'+esc(mname(q.module))+'</span><span class="pill '+srcClass(q.src)+'">'+esc(q.src)+'</span><span class="tagline">'+esc(q.tag)+'</span></div>'+
    vig+'<div class="stem">'+rich(q.stem)+'</div><div class="opts">'+optsHtml+'</div><div id="fb">'+(r?feedback(q,r):'')+'</div>'+
    '<div class="nav"><button class="btn" id="bPrev" '+(S.idx===0?'disabled':'')+'>← 이전</button>'+
    '<span class="muted" style="align-self:center">'+esc(q.orig)+'</span>'+
    '<button class="btn primary" id="bNext" '+(r?'':'disabled')+'>'+(S.idx===S.order.length-1?'결과 보기':'다음 문제 →')+'</button></div></section>';
  $("view").innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){ b.onclick=function(){ answer(b.getAttribute("data-l")); }; });
  $("bPrev").onclick=prev; $("bNext").onclick=next;
  header();
}
function feedback(q,r){
  var f = q.f ? '<div class="formula"><b>공식</b>  '+esc(q.f)+'</div>' : '';
  var en = '<details class="en"'+(r.correct?'':' open')+'><summary>English explanation (원문 해설)</summary><div class="enbody">'+rich(q.en)+'</div></details>';
  if(r.correct){
    return '<div class="fb ok"><h3>정답입니다 ('+q.ans+')</h3><h4>핵심 포인트</h4><p>'+esc(q.ko)+'</p>'+f+en+'</div>';
  }
  var why = q.why && q.why[r.sel] ? '<div class="why">'+rich(q.why[r.sel])+'</div>' : '<div class="why"><p>'+esc(r.sel)+'번 선지는 아래 개념과 맞지 않습니다. 정답 '+q.ans+'의 근거를 확인하세요.</p></div>';
  var trap = q.trap ? '<div class="trap"><b>함정 패턴</b>  '+esc(q.trap)+'</div>' : '';
  return '<div class="fb bad"><h3>오답 — 고른 답 '+r.sel+', 정답 '+q.ans+'</h3>'+
    '<h4>왜 '+r.sel+'가 틀렸나</h4>'+why+
    '<h4>올바른 개념</h4><p>'+esc(q.ko)+'</p>'+f+trap+en+'</div>';
}
function answer(L){
  var id=S.order[S.idx], q=BYID[id]; if(S.round[id]) return;
  var ok = (L===q.ans);
  S.round[id]={sel:L,correct:ok};
  var a=S.all[id]||{attempts:0,correctCount:0,history:[]};
  a.attempts++; if(ok) a.correctCount++; a.last=L; a.lastCorrect=ok; a.history.push({sel:L,correct:ok,at:new Date().toISOString()});
  if(a.history.length>20) a.history=a.history.slice(-20);
  S.all[id]=a; save(); quiz();
  var fb=$("fb"); if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){ var id=S.order[S.idx]; if(!S.round[id]) return; if(S.idx<S.order.length-1){ S.idx++; save(); quiz(); window.scrollTo(0,0);} else { S.finished=true; S.view="result"; save(); result(); } }
function prev(){ if(S.idx>0){ S.idx--; save(); quiz(); window.scrollTo(0,0);} }

/* ---------- results ---------- */
function summarize(){
  var mod={}, tagBad={}, st=roundStats();
  S.order.forEach(function(id){
    var q=BYID[id], r=S.round[id], m=q.module;
    mod[m]=mod[m]||{total:0,answered:0,correct:0};
    mod[m].total++;
    if(r){ mod[m].answered++; if(r.correct) mod[m].correct++; else { var k=mname(m)+" / "+q.tag; tagBad[k]=(tagBad[k]||0)+1; } }
  });
  var weak=Object.keys(tagBad).sort(function(a,b){return tagBad[b]-tagBad[a];}).map(function(k){return {concept:k,wrong:tagBad[k]};});
  return {st:st,mod:mod,weak:weak};
}
function result(){
  var sm=summarize(), st=sm.st, pct=st.answered?Math.round(st.ok/st.answered*100):0;
  var rows=Object.keys(sm.mod).sort().map(function(m){
    var x=sm.mod[m], p=x.answered?Math.round(x.correct/x.answered*100):0;
    var col=p>=70?"var(--ok)":p>=50?"#D69E2E":"var(--bad)";
    return '<div class="mrow"><span>'+esc(mname(m))+'</span><span class="mbar"><i style="width:'+p+'%;background:'+col+'"></i></span><b>'+p+'%</b></div><div class="muted" style="margin:-6px 0 6px">'+x.correct+' / '+x.answered+' 정답'+(x.answered<x.total?' · 미풀이 '+(x.total-x.answered):'')+'</div>';
  }).join("");
  var weak=sm.weak.length? '<ol class="weak">'+sm.weak.slice(0,15).map(function(w){return '<li>'+esc(w.concept)+' <span class="muted">(오답 '+w.wrong+')</span></li>';}).join("")+'</ol>' : '<p class="muted">이번 라운드에 틀린 개념이 없습니다.</p>';
  var wrongIds=S.order.filter(function(id){var r=S.round[id];return r&&!r.correct;});
  $("view").innerHTML='<section class="card result"><h2>'+(S.mode==="review"?"오답 복습 결과":"라운드 결과")+'</h2>'+
    '<div class="big">'+st.ok+' / '+st.answered+' <span style="font-size:20px;font-weight:600;color:var(--ink2)">('+pct+'%)</span></div>'+
    (st.answered<st.total?'<p class="muted">아직 '+(st.total-st.answered)+'문제를 풀지 않았습니다.</p>':'')+
    '<h3 style="margin:18px 0 6px">모듈별 정답률</h3>'+rows+
    '<h3 style="margin:18px 0 6px">취약 개념</h3>'+weak+
    '<div class="nav" style="justify-content:flex-start;flex-wrap:wrap">'+
    '<button class="btn primary" id="bRetry" '+(wrongIds.length?'':'disabled')+'>틀린 문제만 다시 풀기 ('+wrongIds.length+')</button>'+
    '<button class="btn" id="bBack">문제로 돌아가기</button>'+
    '<button class="btn" id="bExport2">결과 내보내기</button></div></section>';
  $("bRetry").onclick=function(){ if(!wrongIds.length) return; S.order=wrongIds; S.idx=0; S.mode="review"; S.round={}; S.finished=false; S.view="quiz"; save(); render(); };
  $("bBack").onclick=function(){ S.view="quiz"; save(); quiz(); };
  $("bExport2").onclick=exportResults;
  header();
}

/* ---------- export ---------- */
function exportResults(){
  if(!S){ alert("아직 풀이 기록이 없습니다."); return; }
  var sm=summarize(), st=sm.st, d=today();
  var modAcc={}; Object.keys(sm.mod).forEach(function(m){ var x=sm.mod[m]; modAcc[mname(m)]={total:x.total,answered:x.answered,correct:x.correct,accuracy:x.answered?+(x.correct/x.answered).toFixed(4):null}; });
  var attempt={
    exportedAt:new Date().toISOString(), mode:S.mode, startedAt:S.started,
    totalQuestions:st.total, answered:st.answered, correct:st.ok, wrong:st.bad,
    accuracy:st.answered?+(st.ok/st.answered).toFixed(4):null,
    questions:S.order.map(function(id){ var q=BYID[id], r=S.round[id], a=S.all[id]||{attempts:0};
      return {id:id, module:mname(q.module), concept:q.tag, source:q.src, selected:r?r.sel:null, correctAnswer:q.ans, isCorrect:r?r.correct:null, attempts:a.attempts}; }),
    moduleAccuracy:modAcc,
    weakConcepts:sm.weak
  };
  var all=store.get(EXPKEY)||{};
  all[d]=all[d]||[]; all[d].push(attempt); store.set(EXPKEY,all);
  var file={subject:SUBJECT, date:d, latest:{totalQuestions:attempt.totalQuestions, answered:attempt.answered, correct:attempt.correct, wrong:attempt.wrong}, attempts:all[d]};
  var blob=new Blob([JSON.stringify(file,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=SUBJECT+"_results_"+d+".json";
  document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ---------- import ---------- */
// 결과 JSON(내보내기 파일 또는 results/{과목}/latest.json)의 마지막 attempt로 진행 상태를 복원한다.
function applyResults(d, quiet){
  if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length){ if(!quiet) alert(SUBJECT+" 결과 파일이 아닙니다."); return false; }
  var at=d.attempts[d.attempts.length-1], order=[], round={};
  (at.questions||[]).forEach(function(x){
    var q=BYID[x.id]; if(!q) return;
    order.push(x.id);
    if(x.selected) round[x.id]={sel:x.selected, correct:x.selected===q.ans};
  });
  if(!order.length){ if(!quiet) alert("불러올 문제가 없습니다."); return false; }
  if(!quiet && S && S.order && Object.keys(S.round||{}).length && !confirm("현재 진행 기록을 불러온 결과로 바꿉니다. 계속할까요?")) return false;
  var all=(S&&S.all)||{};
  (at.questions||[]).forEach(function(x){
    if(!BYID[x.id] || all[x.id] || !x.selected) return;
    var ok=x.selected===BYID[x.id].ans;
    all[x.id]={attempts:x.attempts||1, correctCount:ok?1:0, history:[{sel:x.selected,correct:ok,at:at.exportedAt}], last:x.selected, lastCorrect:ok};
  });
  var idx=0; while(idx<order.length && round[order[idx]]) idx++;
  var done=idx>=order.length;
  S={order:order, idx:done?order.length-1:idx, mode:at.mode==="review"?"review":"all", round:round, all:all,
     started:at.startedAt||new Date().toISOString(), finished:done, view:done?"result":"quiz"};
  save(); render(); window.scrollTo(0,0);
  return true;
}
function importResults(file){
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{ d=JSON.parse(rd.result); }catch(e){ alert("JSON 파일을 읽을 수 없습니다."); return; }
    applyResults(d,false);
  };
  rd.readAsText(file);
}
$("bImport").onclick=function(){ $("fImport").value=""; $("fImport").click(); };
$("fImport").onchange=function(){ if(this.files && this.files[0]) importResults(this.files[0]); };

// 저장된 기록: 이 브라우저에 진행 기록이 없으면 자동으로 이어 풀고, 있으면 처음 화면에 버튼만 보여 준다.
var REMOTE=null;
function loadRemote(){
  if(!window.fetch) return;
  fetch("results/"+SUBJECT+"/latest.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; }).then(function(d){
    if(!d || d.subject!==SUBJECT || !d.attempts || !d.attempts.length) return;
    var at=d.attempts[d.attempts.length-1];
    REMOTE={data:d, date:d.date||"", answered:at.answered||0, total:at.totalQuestions||0};
    if(!S || !S.order || !Object.keys(S.round||{}).length){ applyResults(d,true); }
    else if(S.view==="setup"){ setup(); }
  })["catch"](function(){});
}

/* ---------- routing ---------- */
function render(){
  if(!S || !S.order || !S.order.length || S.view==="setup") return setup();
  if(S.view==="result") return result();
  if(S.idx>=S.order.length) S.idx=S.order.length-1;
  quiz();
}
$("bHome").onclick=setup;
$("bResult").onclick=function(){ if(!S||!S.order){ setup(); return;} S.view="result"; save(); result(); };
$("bExport").onclick=exportResults;
document.addEventListener("keydown",function(e){
  if(!S||S.view!=="quiz"||!document.querySelector(".opt")) return;
  if(e.target && /SELECT|INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k=e.key.toUpperCase(), map={"1":"A","2":"B","3":"C","A":"A","B":"B","C":"C"};
  if(map[k] && !e.metaKey && !e.ctrlKey){ answer(map[k]); }
  else if(e.key==="Enter"){ next(); }
  else if(e.key==="ArrowLeft"){ prev(); }
});
render();
loadRemote();
})();
</script>
</body>
